name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Typecheck & Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build packages
        run: pnpm --filter './packages/*' -r build

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

  e2e:
    name: Kitchen-sink E2E (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build packages
        run: pnpm --filter './packages/*' -r build

      - name: Build kitchen-sink (test mode)
        run: pnpm --filter @flow-state-dev/kitchen-sink build
        env:
          KITCHEN_SINK_TEST_MODE: "1"
          NEXT_PUBLIC_KITCHEN_SINK_TEST_MODE: "1"

      - name: Install Playwright browsers
        run: pnpm --filter @flow-state-dev/kitchen-sink exec playwright install --with-deps chromium

      - name: Run Playwright tests
        run: pnpm --filter @flow-state-dev/kitchen-sink test:e2e

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/kitchen-sink/playwright-report
          retention-days: 14

  storybook:
    name: Storybook Build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build packages
        run: pnpm --filter './packages/*' -r build

      - name: Build Storybook
        run: pnpm --filter @flow-state-dev/ui storybook:build
