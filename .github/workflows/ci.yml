name: CI

on:
  # Deliberately unfiltered by base branch. A stacked PR — one opened against an
  # epic branch rather than against main — is still code we are about to merge,
  # and with `branches: [main]` here it got no CI at all: not a typecheck, not a
  # test, not a process guard. The failure mode is silent by construction, since
  # a PR with no runs looks the same as a PR whose runs passed.
  pull_request:
  # Stays filtered. Without this, every push to a branch that has a PR open
  # starts a second, identical run alongside the `pull_request` one.
  push:
    branches: [main]

concurrency:
  # `github.ref` is the PR's merge ref (`refs/pull/<n>/merge`) on a
  # `pull_request` event and `refs/heads/main` on a push, so two stacked PRs and
  # main each get their own group. Worth stating because the grouping is what
  # keeps `cancel-in-progress` from letting one PR cancel another's run now that
  # PRs off non-main bases are in scope.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Persist Turborepo's task cache across runs so unchanged build /
      # typecheck / test tasks restore instead of re-running. Keyed per job
      # so parallel jobs don't clobber one another's cache entry.
      - name: Restore Turborepo cache
        uses: actions/cache@v4
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ github.job }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-${{ github.job }}-

      - name: Build packages
        run: pnpm packages:build

      # Published packages are ESM, so every relative import in `dist` needs a
      # file extension or Node refuses it at import time. `moduleResolution:
      # "Bundler"` lets source omit it and `tsc` emits it verbatim, and nothing
      # in the repo notices because everything here resolves through `src`. That
      # is how 0.1.1 shipped unimportable. Each package's build adds the
      # extensions; this fails if one stops doing so.
      # `--all` rather than a `packages/*/dist` glob: a glob cannot report what
      # is missing. A package that stops emitting `dist` drops out of the
      # expansion and the check passes without ever looking at it, which is the
      # same silence that let 0.1.1 ship. `--all` asks the workspace which
      # packages publish and demands output from each.
      - name: Built output is importable by Node
        run: node scripts/add-esm-extensions.mjs --check --all

      # Its OWN step, deliberately not folded into a build script: a script that
      # ran `fsdev gen` before building would regenerate the file and pass,
      # which is the one thing a staleness gate must not do. This fails when an
      # author adds a kind or a block and does not commit the regenerated module.
      - name: Generated workforce module is current
        run: pnpm --filter @flow-state-dev/kitchen-sink run fsdev gen --check

      - name: Typecheck
        run: pnpm typecheck

      - name: OMP mailbox regressions
        run: node --test .omp/test/mailbox.test.mjs

      # `git push --no-verify` skips the pre-push hook.
      - name: Lint
        run: pnpm lint

      - name: The lint gate can fail
        run: node --test scripts/lint-gate.test.mjs

      # One task surface (FIX-2087). Here rather than beside "One word per thing"
      # in Process guards: the endings rule reads callers by type, so it needs the
      # TypeScript this job installs. The goal's rules.mjs owns the allow lists;
      # its goal.md says why.
      - name: One task surface
        run: node goals/workforce-coordination/runs-on-one-task/sweep.mjs

      # Every plant must be reported, and nothing else, or the sweep above could
      # pass because it stopped reading a rule. It runs even when the sweep is red.
      - name: The task-surface sweep reports its plants
        if: ${{ !cancelled() }}
        run: node goals/workforce-coordination/runs-on-one-task/sweep.mjs --control

      # `--at` sweeps a tree extracted with `git archive`, which has no node_modules.
      # On this commit's own tree it must give the plain sweep's verdict, or `--at`
      # on an older commit says CAN'T TELL where it should name what it found.
      - name: The task-surface sweep reads an extracted tree
        if: ${{ !cancelled() }}
        run: node goals/workforce-coordination/runs-on-one-task/sweep.mjs --at HEAD

  # The package tests, split across runners by scripts/test-shards.mjs. Each
  # shard runs its packages one at a time, as `pnpm test` does: two at once on
  # one runner oversubscribe it and tests start timing out.
  test:
    name: Test (${{ matrix.shard }}/3)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]

    # A real Redis for the BullMQ cases: the queue path's concurrency tests
    # and the two-users queue-delivery case. They fail rather than skip when
    # `CI` is set and `REDIS_URL` is not, so losing this service fails the job.
    # Pinned by tag and digest. packed-install reuses `&redis_service`.
    # To bump it, see "Redis in CI" in docs/contributing/development-setup.md.
    services:
      redis: &redis_service
        image: redis:7.4.12@sha256:bd28fff4b665fdf1b73e8b5b73ec05d2f858f4fa3c8ea0d7c9bc09f7f6bf7039
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      REDIS_URL: redis://127.0.0.1:6379

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Keyed per shard as well as per job, so the shards don't clobber one
      # another's cache entry.
      - name: Restore Turborepo cache
        uses: actions/cache@v4
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ github.job }}-${{ matrix.shard }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-${{ github.job }}-${{ matrix.shard }}-

      # Every package's own build, as the single job had before the split:
      # `test` depends only on `^build`, and some tests read their own
      # package's build output (Shift Manager's built pages).
      - name: Build packages
        run: pnpm packages:build

      - name: Test
        run: pnpm turbo run test --concurrency=1 $(node scripts/test-shards.mjs ${{ matrix.shard }})

  # Keeps the check name branch protection and reviewers already know: green
  # only when the typecheck and every test shard are.
  ci:
    name: Typecheck & Test
    runs-on: ubuntu-latest
    needs: [typecheck, test]
    if: always()
    steps:
      - name: Typecheck and every test shard passed
        run: |
          test "${{ needs.typecheck.result }}" = success
          test "${{ needs.test.result }}" = success

  # What a consumer gets from `npm install`: every publishable package packed
  # the way `changeset publish` packs it, installed into an empty ESM project,
  # imported entry point by entry point, then a server started from the
  # installed copies. Every other job resolves packages through `src` over a
  # workspace link, which is how 0.1.1 passed all of them and failed on its
  # first import. `release:build`, not `packages:build`, so the tarballs hold
  # what a release ships, DevTool's client assets included.
  # One job for this, extended rather than duplicated: new checks go in the
  # script's CHECKS list. The script header owns the rest.
  packed-install:
    name: Packed release installs and imports
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # needs is queue order, not a build dependency. Still runs if Typecheck & Test fails.
    needs: [ci]
    if: ${{ !cancelled() }}

    # The two-users-one-tenant suite runs against the installed copies, and its
    # queue case needs a real Redis. The script refuses that leg without one,
    # so losing this service fails the job rather than skipping the case.
    services:
      redis: *redis_service

    env:
      REDIS_URL: redis://127.0.0.1:6379

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Restore Turborepo cache
        uses: actions/cache@v4
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ github.job }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-${{ github.job }}-

      # The suite runner's judgement rules (lockfile pins, case count, what
      # counts as a pass), pinned against fixtures before the slow steps.
      - name: Suite runner rules
        run: node --test scripts/packed-install/suite.test.mjs

      - name: Release build
        run: pnpm release:build

      - name: Pack, install, import each, serve, run the two-users suite on the install
        run: node scripts/packed-install/run.mjs

      # The control: the same install-and-import path against the published
      # 0.1.1 core, pinned by its hash. It passes only if that tarball fails
      # on an extensionless import in dist, so a check that has gone blind
      # turns this step red. Pinned, never "latest": a latest release that
      # works would make the control pass for the wrong reason.
      - name: Control fails against the 0.1.1 tarball
        run: node scripts/packed-install/run.mjs --control

      # The suite's control: one installed package swapped for a symlink into
      # the repository. It passes only if the resolution guard names that
      # package, so a guard that can no longer tell the repository from the
      # install turns this step red.
      - name: Control fails with a package linked to the workspace
        run: node scripts/packed-install/run.mjs --control=workspace-link

  guards:
    name: Process guards
    runs-on: ubuntu-latest

    steps:
      # Full history, as before the changeset guard moved to changeset-refs.yml,
      # so the git-reading guards below see the same checkout they always did.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Issue and epic specs merge into specs/ after approval and required checks,
      # so their PRs run this guard too. Only standing project specs retain the
      # never-merged spec/_projects/ lifecycle. Key that exception on the branch,
      # not a label that may be applied after the opening CI run. Main is always checked.
      - name: Spec retention and legacy paths
        if: >-
          github.event_name == 'push' ||
          !startsWith(github.head_ref, 'project/')
        run: node scripts/validate-spec-folder.mjs

      # The changeset guard runs in changeset-refs.yml: it reads the PR title,
      # so it must re-run on `edited`, which this workflow does not.

      # `private` is the only field `changeset publish` filters on, and an npm
      # name is given away permanently, so the packages we hold back are checked
      # on every PR and push rather than at release time.
      - name: Packages held out of the publish set
        run: node scripts/validate-publish-set.mjs

      # Unconditional, unlike the spec guard above. A literal NUL makes git render the
      # whole file as binary, so the change lands with no diff for anyone to
      # review — which is exactly as bad on a push to main as on a PR, and is
      # how one file already reached main entirely unreviewed.
      - name: No literal NUL bytes in source
        run: node scripts/validate-no-nul-bytes.mjs

      # Also unconditional — a doc teaching removed syntax is as broken on a
      # push to main as on a PR, and package source carrying it is worse: that
      # one throws. The script header owns the rest.
      - name: No removed model-string syntax
        run: node scripts/validate-model-strings.mjs

      # Unconditional too: a second copy of the Windows reserved device-name
      # list drifts wherever it lands. The script header owns the rules.
      - name: One Windows reserved-name list
        run: node scripts/validate-reserved-names.mjs

      # Same shape and the same reason as the step above: a doc teaching the
      # superseded isolation coordinate is as wrong on main as on a PR. Wired
      # here rather than left beside the branch that wrote it — an unrun guard
      # is indistinguishable from one nobody wrote. The script header owns why
      # it matches co-occurring concepts instead of a phrase list.
      - name: No doc teaches per-kind flowIsolation
        run: node scripts/check-isolation-coordinate.mjs

      # Unconditional for the same reason: a retired Workforce word is as
      # wrong on main as on a PR. The script header owns the terms, the
      # areas and the exceptions.
      - name: No retired Workforce term
        run: node scripts/check-retired-terms.mjs

      # The plants must still be refused on the real tree, or the check above
      # could pass because it stopped seeing a term.
      - name: The retired-term guard refuses its plants
        run: node scripts/check-retired-terms.mjs --control

      # One word per thing (FIX-1876): dispatch, wait, ask and hand-off each
      # name one mechanism. The goal's rules own the words, the keep list and
      # the exclusions; goals/vocabulary/one-word-per-thing/goal.md says why.
      - name: One word per thing
        run: node goals/vocabulary/one-word-per-thing/sweep.mjs

      # The planted parkOnAsk, messageWorker and replyTo must still be reported,
      # or the sweep above could pass because it stopped reading a file.
      - name: The vocabulary sweep reports its plant
        run: node goals/vocabulary/one-word-per-thing/sweep.mjs --control

      # A goal that guards a check with `xs.length > 0 &&` skips it on an empty
      # list and prints PASS having read nothing (FIX-1183). Goals floor the
      # list with tell.over instead; the script header owns the one shape it
      # refuses and the two it leaves alone.
      - name: No goal hides an empty list behind a length guard
        run: node goals/scripts/check-tell-suppress.mjs

      # The plants must still be refused, and the look-alikes left alone, or
      # the check above could pass because it stopped reading the shape.
      - name: The length-guard check refuses its plants
        run: node goals/scripts/check-tell-suppress.mjs --control

  fallow:
    name: Fallow (broken imports & new dead code)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          # The audit step checks out the PR's base commit to tell new findings
          # from inherited ones.
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Whole tree, every run: undeclared dependencies and imports that don't
      # resolve. These are clean on main, so any finding is new.
      - name: Unresolved imports & unlisted dependencies
        run: pnpm fallow:ci

      # PRs only: fails on unused files, exports, types or dependencies this
      # PR leaves anywhere in the tree, including an export in a file it never
      # touched whose last caller it deleted. Findings already on the base
      # don't count, so the existing backlog never blocks a PR. The checkout
      # is the PR merged into its base branch's current tip, so the base is
      # the merge's first parent (`HEAD^1`), not `pull_request.base.sha`,
      # which goes stale as the base branch moves.
      - name: New dead code
        if: github.event_name == 'pull_request'
        run: pnpm fallow:new-dead-code HEAD^1

      # PRs only: new duplication and complexity in the changed files, reported
      # without failing (see .fallowrc.json). `pnpm fallow` locally shows the
      # whole backlog.
      - name: New duplication & complexity
        if: github.event_name == 'pull_request'
        run: pnpm fallow:audit --base HEAD^1

  e2e:
    name: Kitchen-sink E2E (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # needs is queue order, not a build dependency. Still runs if Typecheck & Test fails.
    needs: [ci]
    if: ${{ !cancelled() }}

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Restore Turborepo cache
        uses: actions/cache@v4
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ github.job }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-${{ github.job }}-

      - name: Build packages
        run: pnpm packages:build

      - name: Build kitchen-sink (test mode)
        run: pnpm --filter @flow-state-dev/kitchen-sink build
        env:
          KITCHEN_SINK_TEST_MODE: "1"
          NEXT_PUBLIC_KITCHEN_SINK_TEST_MODE: "1"

      # The browser install is the step that blew the job's time limit: it
      # normally takes ~20s, but `--with-deps` ran `apt-get update` and
      # downloaded the browsers on every run, and when a mirror or the
      # browser CDN was slow it sat there for 5-9 minutes. So the browser
      # comes from a cache keyed on the Playwright version, and apt only runs
      # when the runner is actually missing a library. Both network steps
      # carry their own limit, so a slow one fails by name, not as a
      # cancelled job.
      - name: Resolve Playwright version
        id: playwright
        working-directory: apps/kitchen-sink
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Restore Playwright browser cache
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}

      # Headless shell only: the suite runs headless, so the full Chrome
      # build is never launched. ffmpeg (for videos) comes with it.
      - name: Install Playwright browser
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        timeout-minutes: 4
        run: pnpm --filter @flow-state-dev/kitchen-sink exec playwright install --only-shell chromium

      - name: Install browser system dependencies (if missing)
        timeout-minutes: 3
        working-directory: apps/kitchen-sink
        run: |
          shell_bin=$(ls ~/.cache/ms-playwright/chromium_headless_shell-*/chrome-headless-shell-linux64/chrome-headless-shell | head -n 1)
          if ldd "$shell_bin" | grep -q "not found"; then
            pnpm exec playwright install-deps chromium
          else
            echo "All shared libraries for $shell_bin are present; skipping apt."
          fi

      - name: Run Playwright tests
        timeout-minutes: 6
        run: pnpm --filter @flow-state-dev/kitchen-sink test:e2e

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/kitchen-sink/playwright-report
          retention-days: 14

  storybook:
    name: Storybook Build
    runs-on: ubuntu-latest
    # needs is queue order, not a build dependency. Still runs if Typecheck & Test fails.
    needs: [ci]
    if: ${{ !cancelled() }}

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Restore Turborepo cache
        uses: actions/cache@v4
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ github.job }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-${{ github.job }}-

      - name: Build packages
        run: pnpm packages:build

      - name: Build Storybook
        run: pnpm --filter @flow-state-dev/ui storybook:build

  docs:
    name: Docs Site Build
    runs-on: ubuntu-latest
    # needs is queue order, not a build dependency. Still runs if Typecheck & Test fails.
    needs: [ci]
    if: ${{ !cancelled() }}

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Diagrams and custom.css keep to the page register: token colours only,
      # strokes 1/1.3/1.4, `5 4` dashes, mono diagram text, no `--info`.
      - name: Lint docs brand rules
        run: pnpm --filter @flow-state-dev/docs lint:brand

      # No `packages:build` and no Turborepo cache, unlike the jobs above:
      # `apps/docs` declares no workspace dependency, and `docs:build` runs
      # `docusaurus build` directly rather than through turbo, so neither would
      # do anything but add minutes.
      #
      # Unfiltered by path, like every other job here. Docusaurus resolves links
      # across the whole site, so a page this PR never touched can break when
      # another one moves or is deleted — a `paths:` filter keyed on
      # `apps/docs/**` would skip exactly the run that catches it.
      - name: Build docs site
        run: pnpm docs:build
