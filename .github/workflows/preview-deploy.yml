name: Preview Deploy (on-demand)

# On-demand Vercel previews, gated by labels. Nothing deploys automatically on
# push — Vercel's own git deploys are disabled via `git.deploymentEnabled` in
# each app's vercel.json. Apply one of these labels to a PR to opt it in:
#
#   preview/kitchen-sink  -> apps/kitchen-sink   (Next.js)
#   preview/docs          -> apps/docs           (Docusaurus)
#   preview/storybook     -> packages/ui         (Storybook)
#
# Applying a label deploys that target immediately. While the label stays on,
# new commits redeploy that target (the `synchronize` event). Remove the label
# to stop. The deployment URL is posted as a sticky PR comment, one per target.
#
# Setup (secrets):  VERCEL_TOKEN, VERCEL_ORG_ID,
#                   VERCEL_PROJECT_ID_KITCHEN_SINK,
#                   VERCEL_PROJECT_ID_DOCS,
#                   VERCEL_PROJECT_ID_STORYBOOK
# See docs/contributing/preview-deployments.md for the full setup guide.

on:
  pull_request:
    types: [labeled, synchronize]

permissions:
  contents: read
  pull-requests: write

jobs:
  # Compute which targets to deploy for this event:
  #  - `labeled`     -> just the label that was added (if it's a preview/* one)
  #  - `synchronize` -> every preview/* label currently on the PR
  prepare:
    runs-on: ubuntu-latest
    outputs:
      targets: ${{ steps.compute.outputs.targets }}
    steps:
      - id: compute
        uses: actions/github-script@v7
        with:
          script: |
            const MAP = {
              'preview/kitchen-sink': { slug: 'kitchen-sink', dir: 'apps/kitchen-sink' },
              'preview/docs':         { slug: 'docs',         dir: 'apps/docs' },
              'preview/storybook':    { slug: 'storybook',    dir: 'packages/ui' },
            };
            const names = context.payload.action === 'labeled'
              ? [context.payload.label.name]
              : (context.payload.pull_request.labels || []).map(l => l.name);
            const targets = [...new Set(names)].filter(n => MAP[n]).map(n => MAP[n]);
            core.info(`Deploy targets: ${targets.map(t => t.slug).join(', ') || '(none)'}`);
            core.setOutput('targets', JSON.stringify(targets));

  deploy:
    needs: prepare
    if: needs.prepare.outputs.targets != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(needs.prepare.outputs.targets) }}
    # One deploy at a time per PR+target; a newer commit supersedes an
    # in-flight build instead of stacking.
    concurrency:
      group: preview-${{ github.event.pull_request.number }}-${{ matrix.target.slug }}
      cancel-in-progress: true
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      # Vercel reads the project (and its Root Directory) from VERCEL_PROJECT_ID,
      # so every command runs from the repo root and Vercel handles the monorepo
      # install/build via each app's vercel.json.
      # Resolve the project id for this target and check the required secrets
      # exist. We report the state (rather than exiting cryptically) so the
      # PR always gets a per-target status comment — one findable link per
      # label — even when the deploy can't run.
      - name: Resolve Vercel project id
        id: proj
        env:
          SLUG: ${{ matrix.target.slug }}
          PID_KITCHEN_SINK: ${{ secrets.VERCEL_PROJECT_ID_KITCHEN_SINK }}
          PID_DOCS: ${{ secrets.VERCEL_PROJECT_ID_DOCS }}
          PID_STORYBOOK: ${{ secrets.VERCEL_PROJECT_ID_STORYBOOK }}
        run: |
          case "$SLUG" in
            kitchen-sink) PID="$PID_KITCHEN_SINK" ;;
            docs)         PID="$PID_DOCS" ;;
            storybook)    PID="$PID_STORYBOOK" ;;
            *) echo "::error::Unknown target slug '$SLUG'"; exit 1 ;;
          esac
          missing=""
          [ -z "$VERCEL_TOKEN" ] && missing="$missing VERCEL_TOKEN"
          [ -z "$VERCEL_ORG_ID" ] && missing="$missing VERCEL_ORG_ID"
          [ -z "$PID" ] && missing="$missing VERCEL_PROJECT_ID(for $SLUG)"
          missing="${missing# }"
          echo "id=$PID" >> "$GITHUB_OUTPUT"
          echo "missing=$missing" >> "$GITHUB_OUTPUT"
          if [ -n "$missing" ]; then
            echo "::warning::Skipping '$SLUG' preview: missing repository secret(s): $missing. See docs/contributing/preview-deployments.md."
          fi

      - name: Install Vercel CLI
        if: steps.proj.outputs.missing == ''
        run: npm install --global vercel@latest

      - name: Pull Vercel environment
        if: steps.proj.outputs.missing == ''
        env:
          VERCEL_PROJECT_ID: ${{ steps.proj.outputs.id }}
        run: vercel pull --yes --environment=preview --token="$VERCEL_TOKEN"

      - name: Build project artifacts
        if: steps.proj.outputs.missing == ''
        env:
          VERCEL_PROJECT_ID: ${{ steps.proj.outputs.id }}
        run: vercel build --token="$VERCEL_TOKEN"

      - name: Deploy prebuilt artifacts
        id: deploy
        if: steps.proj.outputs.missing == ''
        env:
          VERCEL_PROJECT_ID: ${{ steps.proj.outputs.id }}
          SLUG: ${{ matrix.target.slug }}
        run: |
          url="$(vercel deploy --prebuilt --token="$VERCEL_TOKEN" | tail -n1)"
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Deployed $SLUG -> $url"

      # One sticky comment per target (keyed by the marker), always posted so
      # every label has its own stable, individually-linkable status line —
      # deployed URL on success, an actionable pointer otherwise.
      - name: Post status to PR
        if: always()
        uses: actions/github-script@v7
        env:
          SLUG: ${{ matrix.target.slug }}
          URL: ${{ steps.deploy.outputs.url }}
          MISSING: ${{ steps.proj.outputs.missing }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        with:
          script: |
            const { SLUG: slug, URL: url, MISSING: missing, RUN_URL: runUrl } = process.env;
            const marker = `<!-- preview-deploy:${slug} -->`;
            const sha = context.payload.pull_request.head.sha.slice(0, 7);
            let body;
            if (url) {
              body = [
                marker,
                `### 🔎 Preview — \`${slug}\``,
                '',
                `**${url}**`,
                '',
                `Deployed from \`${sha}\`. Redeploys on new commits while the \`preview/${slug}\` label is applied; remove the label to stop.`,
              ].join('\n');
            } else if (missing) {
              body = [
                marker,
                `### ⚠️ Preview — \`${slug}\` (not configured)`,
                '',
                `Deploy skipped for \`${sha}\`: missing repository secret(s): \`${missing}\`.`,
                'Add them under **Settings → Secrets and variables → Actions** — see `docs/contributing/preview-deployments.md`.',
                '',
                `[View run](${runUrl})`,
              ].join('\n');
            } else {
              body = [
                marker,
                `### ❌ Preview — \`${slug}\` (build failed)`,
                '',
                `Deploy failed for \`${sha}\`. [View logs](${runUrl}).`,
              ].join('\n');
            }
            const { owner, repo } = context.repo;
            const issue_number = context.payload.pull_request.number;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner, repo, issue_number, per_page: 100,
            });
            const existing = comments.find(c => c.body && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }

      # Keep the check red (honestly) when the deploy couldn't run for lack of
      # secrets — the sticky comment above says how to fix it.
      - name: Fail if not configured
        if: steps.proj.outputs.missing != ''
        run: |
          echo "::error::Preview deploy for '${{ matrix.target.slug }}' was skipped — configure the missing secret(s) noted in the PR comment."
          exit 1
