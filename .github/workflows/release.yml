name: Release

on:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release:
    name: Version & Publish
    runs-on: ubuntu-latest
    env:
      CHANGESETS_TOKEN: ${{ secrets.CHANGESETS_TOKEN }}
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Create release PR or publish to npm
        id: changesets
        if: env.CHANGESETS_TOKEN != ''
        uses: changesets/action@v1
        with:
          version: pnpm version-packages
          publish: pnpm release:ci
          createGithubReleases: true
        env:
          GITHUB_TOKEN: ${{ env.CHANGESETS_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Report disabled release automation
        if: env.CHANGESETS_TOKEN == ''
        run: |
          echo "::notice title=Release automation skipped::CHANGESETS_TOKEN is not configured; skipping changesets/action because the default GITHUB_TOKEN cannot create release PRs in this repository."
          {
            echo "### Release automation skipped"
            echo ""
            echo "Configure \`CHANGESETS_TOKEN\` with a token that can push contents and create pull requests before relying on automatic version PRs or npm publishing."
          } >> "$GITHUB_STEP_SUMMARY"
