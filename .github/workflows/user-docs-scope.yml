name: User docs scope

# Its own workflow, not a step in CI's Process guards, because it reads the PR's
# labels: adding or removing `docs-fix` has to re-run it, and CI's bare
# `pull_request:` trigger does not fire on `labeled`. No install.
on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  user-docs-scope:
    name: User docs change only at release
    runs-on: ubuntu-latest

    steps:
      # Full history so the guard can diff against the base branch.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Reads GITHUB_HEAD_REF for the branch and GITHUB_EVENT_PATH for labels.
      - name: User docs change only at release
        run: node scripts/validate-user-docs-scope.mjs
