<text class="t" fill="#3d3a32" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="12px" font-weight="500" x="60" y="395">A conversation is stored for its user and goes on across restarts. This app serves one user, so there is one set.</text>
