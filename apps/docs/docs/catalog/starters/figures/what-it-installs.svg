<text class="t" fill="#3d3a32" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="12px" font-weight="500" x="60" y="370">The six WORKER.md files are read once, when the app starts. They live in the repo, so the store holds none.</text>
