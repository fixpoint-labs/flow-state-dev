<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 453">
<defs>
<pattern id="hatch" width="5" height="5" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line class="hatch-line" stroke="rgba(27, 26, 21, 0.45)" stroke-width="1" x1="0" y1="0" x2="0" y2="5"/></pattern>
<marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ink" fill="#1b1a15" d="M0,0 L10,5 L0,10 z"/></marker>
</defs>
<rect class="solid" fill="none" stroke="#1b1a15" stroke-width="1.4" x="28" y="24" width="200" height="140"/>
<text class="lb" fill="#57544a" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="10px" font-weight="500" letter-spacing="1.5px" x="42" y="46">THE WORKER THAT FILES</text>
<text class="nm" fill="#1b1a15" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="15px" font-weight="500" x="42" y="68">desk.lead</text>
<line class="hi" fill="none" stroke="rgba(27, 26, 21, 0.25)" stroke-width="1" x1="28" y1="82" x2="228" y2="82"/>
<text class="c" fill="#1b1a15" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="12.5px" font-weight="500" x="42" y="106">createTask</text>
<text class="sub" fill="#57544a" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="10.5px" font-weight="500" x="42" y="126">Fix the login redirect</text>
<text class="sub" fill="#57544a" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="10.5px" font-weight="500" x="42" y="144">to desk.coder</text>
<rect fill="url(#hatch)" x="360" y="24" width="200" height="10"/><line class="thin" fill="none" stroke="#1b1a15" stroke-width="1" x1="360" y1="34.5" x2="560" y2="34.5"/>
<rect class="solid" fill="none" stroke="#1b1a15" stroke-width="1.4" x="360" y="24" width="200" height="140"/>
<text class="lb" fill="#57544a" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="10px" font-weight="500" letter-spacing="1.5px" x="374" y="56">THE BOARD</text>
<text class="nm" fill="#1b1a15" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="15px" font-weight="500" x="374" y="78">tasks</text>
<line class="hi" fill="none" stroke="rgba(27, 26, 21, 0.25)" stroke-width="1" x1="360" y1="92" x2="560" y2="92"/>
<text class="c" fill="#1b1a15" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="12.5px" font-weight="500" x="374" y="116">Fix the login redirect</text>
<text class="sub" fill="#57544a" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="10.5px" font-weight="500" x="374" y="136">in_progress</text>
<text class="sub" fill="#57544a" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="10.5px" font-weight="500" x="374" y="152">to desk.coder</text>
<rect fill="url(#hatch)" x="692" y="24" width="200" height="10"/><line class="thin" fill="none" stroke="#1b1a15" stroke-width="1" x1="692" y1="34.5" x2="892" y2="34.5"/>
<rect class="solid" fill="none" stroke="#1b1a15" stroke-width="1.4" x="692" y="24" width="200" height="140"/>
<text class="lb" fill="#57544a" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="10px" font-weight="500" letter-spacing="1.5px" x="706" y="56">A TASK SESSION</text>
<text class="nm" fill="#1b1a15" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="15px" font-weight="500" x="706" y="78">desk.coder</text>
<line class="hi" fill="none" stroke="rgba(27, 26, 21, 0.25)" stroke-width="1" x1="692" y1="92" x2="892" y2="92"/>
<text class="sub" fill="#57544a" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="10.5px" font-weight="500" x="706" y="116">a new session of its own</text>
<text class="sub" fill="#57544a" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="10.5px" font-weight="500" x="706" y="136">sees the task's brief</text>
<line class="ln" fill="none" stroke="#1b1a15" stroke-width="1.3" x1="228" y1="104" x2="358" y2="104" marker-end="url(#ah)"/>
<rect class="ground" fill="#f0ece1" x="280.7" y="97" width="24.6" height="15"/><text class="plate" fill="#1b1a15" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="10.5px" font-weight="500" letter-spacing="1px" x="293" y="108" text-anchor="middle">01</text>
<line class="ln" fill="none" stroke="#1b1a15" stroke-width="1.3" x1="560" y1="104" x2="690" y2="104" marker-end="url(#ah)"/>
<rect class="ground" fill="#f0ece1" x="612.7" y="97" width="24.6" height="15"/><text class="plate" fill="#1b1a15" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="10.5px" font-weight="500" letter-spacing="1px" x="625" y="108" text-anchor="middle">02</text>
<rect class="solid" fill="none" stroke="#1b1a15" stroke-width="1.4" x="28" y="216" width="422" height="84"/>
<text class="lb" fill="#57544a" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="10px" font-weight="500" letter-spacing="1.5px" x="42" y="238">THE RESULT · IN THE LEAD'S CONVERSATION</text>
<rect class="hl" fill="#e8f551" x="36" y="248" width="406" height="44"/>
<text class="c on-hl" fill="#1b1a15" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="12.5px" font-weight="500" x="42" y="266">Task "Fix the login redirect" (task_…) completed</text>
<text class="c on-hl" fill="#1b1a15" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="12.5px" font-weight="500" x="42" y="284">by desk.coder: Fixed, tests pass.</text>
<path class="ln" fill="none" stroke="#1b1a15" stroke-width="1.3" d="M792 164 V258 H452" marker-end="url(#ah)"/>
<rect class="ground" fill="#f0ece1" x="609.7" y="251" width="24.6" height="15"/><text class="plate" fill="#1b1a15" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="10.5px" font-weight="500" letter-spacing="1px" x="622" y="262" text-anchor="middle">03</text>
<line class="hi" fill="none" stroke="rgba(27, 26, 21, 0.25)" stroke-width="1" x1="0" y1="324" x2="920" y2="324"/>
<text class="n" fill="#1b1a15" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="11px" font-weight="500" x="28" y="350">01</text>
<text class="t" fill="#3d3a32" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="12px" font-weight="500" x="60" y="350">The lead files the task with createTask, for a worker on its delegates list.</text>
<text class="n" fill="#1b1a15" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="11px" font-weight="500" x="28" y="375">02</text>
<text class="t" fill="#3d3a32" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="12px" font-weight="500" x="60" y="375">It starts at once. The coder works it in a task session of its own.</text>
<text class="n" fill="#1b1a15" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="11px" font-weight="500" x="28" y="400">03</text>
<text class="t" fill="#3d3a32" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="12px" font-weight="500" x="60" y="400">When the task ends, the lead hears it once, in a line under the coder's name.</text>
<g id="key">
<line class="ln" fill="none" stroke="#1b1a15" stroke-width="1.3" x1="28" y1="427" x2="54" y2="427" marker-end="url(#ah)"/>
<text class="lb" fill="#57544a" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="10px" font-weight="500" letter-spacing="1.5px" x="62" y="431">FILES</text>
<line class="ln" fill="none" stroke="#1b1a15" stroke-width="1.3" x1="132" y1="427" x2="158" y2="427" marker-end="url(#ah)"/>
<text class="lb" fill="#57544a" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="10px" font-weight="500" letter-spacing="1.5px" x="166" y="431">REPORTS</text>
<rect fill="url(#hatch)" x="250" y="421" width="26" height="11"/><rect class="thin" fill="none" stroke="#1b1a15" stroke-width="1" x="250" y="421" width="26" height="11"/>
<text class="lb" fill="#57544a" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="10px" font-weight="500" letter-spacing="1.5px" x="284" y="431">OUTLIVES THE REQUEST</text>
<rect class="hl" fill="#e8f551" x="466" y="421" width="26" height="11"/>
<text class="lb" fill="#57544a" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="10px" font-weight="500" letter-spacing="1.5px" x="500" y="431">THE LEAD IS TOLD</text>
</g>
</svg>
