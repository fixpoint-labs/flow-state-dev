<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 453">
<defs>
<pattern id="hatch" width="5" height="5" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line class="hatch-line" stroke="rgba(27, 26, 21, 0.45)" stroke-width="1" x1="0" y1="0" x2="0" y2="5"/></pattern>
<marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ink" fill="#1b1a15" d="M0,0 L10,5 L0,10 z"/></marker>
</defs>
<rect class="dash" fill="none" stroke="#1b1a15" stroke-width="1.4" stroke-dasharray="5 4" x="28" y="24" width="272" height="276"/>
<text class="lb" fill="#57544a" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="10px" font-weight="500" letter-spacing="1.5px" x="42" y="46">FIRST PART OF THE RUN</text>
<text class="nm" fill="#1b1a15" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="15px" font-weight="500" x="42" y="68">In one process</text>
<line class="hi" fill="none" stroke="rgba(27, 26, 21, 0.25)" stroke-width="1" x1="28" y1="82" x2="300" y2="82"/>
<rect fill="url(#hatch)" x="42" y="96" width="244" height="10"/><line class="thin" fill="none" stroke="#1b1a15" stroke-width="1" x1="42" y1="106.5" x2="286" y2="106.5"/>
<rect class="thin" fill="none" stroke="#1b1a15" stroke-width="1" x="42" y="96" width="244" height="56"/>
<text class="c" fill="#1b1a15" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="12.5px" font-weight="500" x="56" y="128">cleanMessage</text>
<text class="sub" fill="#57544a" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="10.5px" font-weight="500" x="56" y="143">output recorded</text>
<rect fill="url(#hatch)" x="42" y="162" width="244" height="10"/><line class="thin" fill="none" stroke="#1b1a15" stroke-width="1" x1="42" y1="172.5" x2="286" y2="172.5"/>
<rect class="thin" fill="none" stroke="#1b1a15" stroke-width="1" x="42" y="162" width="244" height="56"/>
<text class="c" fill="#1b1a15" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="12.5px" font-weight="500" x="56" y="194">lookUpOrder</text>
<text class="sub" fill="#57544a" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="10.5px" font-weight="500" x="56" y="209">output recorded</text>
<rect class="thin" fill="none" stroke="#1b1a15" stroke-width="1" x="42" y="228" width="244" height="56"/>
<text class="c" fill="#1b1a15" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="12.5px" font-weight="500" x="56" y="250">issueRefund</text>
<text class="sub" fill="#57544a" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="10.5px" font-weight="500" x="56" y="265">asks: refund $250?</text>
<rect fill="url(#hatch)" x="336" y="24" width="248" height="10"/><line class="thin" fill="none" stroke="#1b1a15" stroke-width="1" x1="336" y1="34.5" x2="584" y2="34.5"/>
<rect class="solid" fill="none" stroke="#1b1a15" stroke-width="1.4" x="336" y="24" width="248" height="276"/>
<text class="lb" fill="#57544a" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="10px" font-weight="500" letter-spacing="1.5px" x="350" y="56">THE WAIT · HOURS OR DAYS</text>
<text class="nm" fill="#1b1a15" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="15px" font-weight="500" x="350" y="78">In the store</text>
<line class="hi" fill="none" stroke="rgba(27, 26, 21, 0.25)" stroke-width="1" x1="336" y1="92" x2="584" y2="92"/>
<text class="c" fill="#1b1a15" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="12.5px" font-weight="500" x="350" y="118">finished outputs</text>
<line class="hi" fill="none" stroke="rgba(27, 26, 21, 0.25)" stroke-width="1" x1="336" y1="132" x2="584" y2="132"/>
<text class="c" fill="#1b1a15" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="12.5px" font-weight="500" x="350" y="158">the open question</text>
<line class="hi" fill="none" stroke="rgba(27, 26, 21, 0.25)" stroke-width="1" x1="336" y1="172" x2="584" y2="172"/>
<text class="c" fill="#1b1a15" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="12.5px" font-weight="500" x="350" y="198">status: suspended</text>
<line class="hi" fill="none" stroke="rgba(27, 26, 21, 0.25)" stroke-width="1" x1="336" y1="212" x2="584" y2="212"/>
<text class="sub" fill="#57544a" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="10.5px" font-weight="500" x="350" y="272">a restart can happen here</text>
<rect class="dash" fill="none" stroke="#1b1a15" stroke-width="1.4" stroke-dasharray="5 4" x="620" y="24" width="272" height="276"/>
<text class="lb" fill="#57544a" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="10px" font-weight="500" letter-spacing="1.5px" x="634" y="46">SECOND PART OF THE RUN</text>
<text class="nm" fill="#1b1a15" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="15px" font-weight="500" x="634" y="68">In any process</text>
<line class="hi" fill="none" stroke="rgba(27, 26, 21, 0.25)" stroke-width="1" x1="620" y1="82" x2="892" y2="82"/>
<rect fill="url(#hatch)" x="634" y="96" width="244" height="10"/><line class="thin" fill="none" stroke="#1b1a15" stroke-width="1" x1="634" y1="106.5" x2="878" y2="106.5"/>
<rect class="thin" fill="none" stroke="#1b1a15" stroke-width="1" x="634" y="96" width="244" height="56"/>
<text class="c" fill="#1b1a15" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="12.5px" font-weight="500" x="648" y="128">cleanMessage</text>
<text class="sub" fill="#57544a" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="10.5px" font-weight="500" x="648" y="143">output reused</text>
<rect fill="url(#hatch)" x="634" y="162" width="244" height="10"/><line class="thin" fill="none" stroke="#1b1a15" stroke-width="1" x1="634" y1="172.5" x2="878" y2="172.5"/>
<rect class="thin" fill="none" stroke="#1b1a15" stroke-width="1" x="634" y="162" width="244" height="56"/>
<text class="c" fill="#1b1a15" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="12.5px" font-weight="500" x="648" y="194">lookUpOrder</text>
<text class="sub" fill="#57544a" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="10.5px" font-weight="500" x="648" y="209">output reused</text>
<rect class="thin" fill="none" stroke="#1b1a15" stroke-width="1" x="634" y="228" width="244" height="56"/>
<rect class="hl" fill="#e8f551" x="640" y="234" width="232" height="44"/>
<text class="c on-hl" fill="#1b1a15" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="12.5px" font-weight="500" x="650" y="252">issueRefund</text>
<text class="sub on-hl" fill="#1b1a15" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="10.5px" font-weight="500" x="650" y="268">picks up here</text>
<line class="ln" fill="none" stroke="#1b1a15" stroke-width="1.3" x1="300" y1="256" x2="334" y2="256" marker-end="url(#ah)"/>
<line class="ln" fill="none" stroke="#1b1a15" stroke-width="1.3" x1="584" y1="256" x2="618" y2="256" marker-end="url(#ah)"/>
<line class="hi" fill="none" stroke="rgba(27, 26, 21, 0.25)" stroke-width="1" x1="0" y1="324" x2="920" y2="324"/>
<text class="n" fill="#1b1a15" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="11px" font-weight="500" x="28" y="350">01</text>
<text class="t" fill="#3d3a32" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="12px" font-weight="500" x="60" y="350">cleanMessage and lookUpOrder finished before the pause, so their outputs are in the store.</text>
<text class="n" fill="#1b1a15" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="11px" font-weight="500" x="28" y="375">02</text>
<text class="t" fill="#3d3a32" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="12px" font-weight="500" x="60" y="375">While the question waits, no process runs. A restart or a deploy changes nothing stored.</text>
<text class="n" fill="#1b1a15" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="11px" font-weight="500" x="28" y="400">03</text>
<text class="t" fill="#3d3a32" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="12px" font-weight="500" x="60" y="400">The answer starts the second part in any process. It reuses the outputs and carries on.</text>
<g id="key">
<line class="ln" fill="none" stroke="#1b1a15" stroke-width="1.3" x1="28" y1="427" x2="54" y2="427" marker-end="url(#ah)"/>
<text class="lb" fill="#57544a" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="10px" font-weight="500" letter-spacing="1.5px" x="62" y="431">THEN</text>
<line class="dash" fill="none" stroke="#1b1a15" stroke-width="1.4" stroke-dasharray="5 4" x1="124" y1="427" x2="150" y2="427"/>
<text class="lb" fill="#57544a" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="10px" font-weight="500" letter-spacing="1.5px" x="158" y="431">LASTS ONE ACTION RUN</text>
<rect fill="url(#hatch)" x="350" y="421" width="26" height="11"/><rect class="thin" fill="none" stroke="#1b1a15" stroke-width="1" x="350" y="421" width="26" height="11"/>
<text class="lb" fill="#57544a" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="10px" font-weight="500" letter-spacing="1.5px" x="384" y="431">OUTLIVES THE REQUEST</text>
<rect class="hl" fill="#e8f551" x="574" y="421" width="26" height="11"/>
<text class="lb" fill="#57544a" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="10px" font-weight="500" letter-spacing="1.5px" x="608" y="431">PICKS UP HERE</text>
</g>
</svg>
