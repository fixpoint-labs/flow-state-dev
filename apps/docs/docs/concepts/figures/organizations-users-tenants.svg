<text class="lb" fill="#57544a" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="10px" font-weight="500" letter-spacing="1.5px" x="702" y="92">TENANT</text>
<text class="nm" fill="#1b1a15" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="15px" font-weight="500" x="702" y="114">contoso</text>
<rect class="hl" fill="#e8f551" x="702" y="128" width="176" height="48"/>
<rect class="thin" fill="none" stroke="#1b1a15" stroke-width="1" x="702" y="128" width="176" height="48"/>
<text class="c on-hl" fill="#1b1a15" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="12.5px" font-weight="500" x="714" y="150">chat-1</text>
<text class="sub on-hl" fill="#1b1a15" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="10.5px" font-weight="500" x="714" y="166">same id, its own record</text>
<text class="sub" fill="#57544a" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="10.5px" font-weight="500" x="702" y="206">user and org records</text>
<text class="sub" fill="#57544a" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="10.5px" font-weight="500" x="702" y="222">are not split here</text>
<line class="hi" fill="none" stroke="rgba(27, 26, 21, 0.25)" stroke-width="1" x1="0" y1="282" x2="920" y2="282"/>
<text class="n" fill="#1b1a15" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="11px" font-weight="500" x="28" y="308">01</text>
<text class="t" fill="#3d3a32" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="12px" font-weight="500" x="60" y="308">A user's records are kept per organization. alice in acme and alice in globex are two records.</text>
<text class="n" fill="#1b1a15" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="11px" font-weight="500" x="28" y="333">02</text>
<text class="t" fill="#3d3a32" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="12px" font-weight="500" x="60" y="333">A tenant splits sessions only. User and org records are the same whichever tenant sent the request.</text>
<g id="key">
<rect fill="url(#hatch)" x="28" y="354" width="26" height="11"/><rect class="thin" fill="none" stroke="#1b1a15" stroke-width="1" x="28" y="354" width="26" height="11"/>
