<line class="ln" fill="none" stroke="#1b1a15" stroke-width="1.3" x1="580" y1="140" x2="650" y2="140" marker-end="url(#ah)"/>
<line class="hi" fill="none" stroke="rgba(27, 26, 21, 0.25)" stroke-width="1" x1="0" y1="278" x2="920" y2="278"/>
<text class="n" fill="#1b1a15" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="11px" font-weight="500" x="28" y="304">01</text>
<text class="t" fill="#3d3a32" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="12px" font-weight="500" x="60" y="304">The worker file names a flow and a harness. Changing agents changes the harness line and nothing else.</text>
<text class="n" fill="#1b1a15" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="11px" font-weight="500" x="28" y="329">02</text>
<text class="t" fill="#3d3a32" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="12px" font-weight="500" x="60" y="329">The flow runs the agent whose id the file names, from the values the app put in the slot.</text>
<g id="key">
<line class="ln" fill="none" stroke="#1b1a15" stroke-width="1.3" x1="28" y1="356" x2="54" y2="356" marker-end="url(#ah)"/>
