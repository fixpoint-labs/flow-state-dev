<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 34 920 615">
<defs>
<pattern id="hatch" width="5" height="5" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line class="hatch-line" x1="0" y1="0" x2="0" y2="5"/></pattern>
<marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ink" d="M0,0 L10,5 L0,10 z"/></marker>
</defs>
<rect class="solid" x="28" y="56" width="252" height="392"/>
<text class="lb" x="40" y="80">01 · DESCRIBES</text>
<text class="nm" x="40" y="102">Your code</text>
<text class="sub" x="40" y="120">the definition</text>
<line class="hi" x1="28" y1="146" x2="280" y2="146"/><rect class="solid" x="334" y="56" width="272" height="392"/>
<text class="lb" x="346" y="80">02 · ANSWERS</text>
<text class="nm" x="346" y="102">Registered instances</text>
<text class="sub" x="346" y="120">in the process · requests name the id</text>
<line class="hi" x1="334" y1="146" x2="606" y2="146"/><rect class="solid" x="660" y="56" width="232" height="392"/>
<text class="lb" x="672" y="80">03 · REMEMBERS</text>
<text class="nm" x="672" y="102">Your store</text>
<text class="sub" x="672" y="120">kept across restarts when</text>
<text class="sub" x="672" y="134">persistent</text>
<line class="hi" x1="660" y1="146" x2="892" y2="146"/><rect class="thin" x="40" y="158" width="228" height="140"/><text class="c" x="50" y="180">defineFlow()</text>
<text class="c" x="50" y="202">kind: "review"</text>
<text class="t" x="50" y="224">cardinality · configSchema</text>
<text class="t" x="50" y="240">webhooks · schedules · mcp</text>
<text class="t" x="50" y="256">entries only the flow</text>
<text class="t" x="50" y="272">can call</text>
<text class="t" x="40" y="326">Shared by every instance.</text>
<text class="t" x="40" y="342">Answers no request itself.</text>
<text class="t" x="40" y="374">Requests name an instance</text>
<text class="t" x="40" y="390">id; the kind is never a</text>
<text class="t" x="40" y="406">fallback.</text>
<rect class="thin" x="346" y="158" width="248" height="158"/><text class="c" x="356" y="180">review-east</text>
<text class="c" x="356" y="202">config: { region: "east" }</text>
<text class="c" x="356" y="218">resources: { rubric: east }</text>
<text class="t" x="356" y="242">Its own isolated state,</text>
<text class="t" x="356" y="258">when set. Settings stay in</text>
<text class="t" x="356" y="274">the process. Never listed,</text>
<text class="t" x="356" y="290">never stored.</text>
<rect class="thin" x="346" y="328" width="248" height="84"/><text class="c" x="356" y="350">review-west</text>
<text class="t" x="356" y="368">Same kind; its own id,</text>
<text class="t" x="356" y="384">settings, resources and</text>
<text class="t" x="356" y="400">isolated state</text>
<text class="t" x="346" y="432">A singleton's id is its kind.</text>
<rect fill="url(#hatch)" x="672" y="158" width="208" height="10"/><line class="thin" x1="672" y1="168.5" x2="880" y2="168.5"/><rect class="thin" x="672" y="158" width="208" height="170"/><text class="c" x="682" y="190">Session chat-1</text>
<text class="c" x="682" y="212">flowId: "review-east"</text>
<text class="t" x="682" y="228">its owner</text>
<text class="c" x="682" y="252">flowKind: "review"</text>
<text class="t" x="682" y="268">a label for listings,</text>
<text class="t" x="682" y="284">not an address</text>
<text class="t" x="682" y="310">Its state and its requests</text>
<text class="t" x="672" y="358">Named through review-west:</text>
<text class="c" x="672" y="376">409 wrong-instance-session</text>
<text class="t x" x="672" y="392">refused before anything</text>
<text class="t x" x="672" y="408">runs</text>
<path class="ln" d="M268 228 H307 V366 H344" marker-end="url(#ah)"/><line class="ln" x1="307" y1="228" x2="344" y2="228" marker-end="url(#ah)"/><rect class="ground" x="294.7" y="289" width="24.6" height="15"/><text class="plate" x="307" y="300" text-anchor="middle">01</text>
<line class="ln" x1="672" y1="208" x2="596" y2="208" marker-end="url(#ah)"/><rect class="ground" x="620.7" y="201" width="24.6" height="15"/><text class="plate" x="633" y="212" text-anchor="middle">02</text>
<line class="ln x" x1="594" y1="366" x2="658" y2="366"/><line class="ln x" x1="658" y1="356" x2="658" y2="376"/><rect class="ground" x="613.7" y="359" width="24.6" height="15"/><text class="plate x" x="626" y="370" text-anchor="middle">03</text>
<line class="hi" x1="0" y1="472" x2="920" y2="472"/>
<text class="n" x="28" y="498">01</text>
<text class="t" x="60" y="498">Calling defineFlow makes an instance: the definition plus an id and settings. The definition is unchanged and</text>
<text class="t" x="60" y="515">shared.</text>
<text class="n" x="28" y="540">02</text>
<text class="t" x="60" y="540">A session belongs to one instance. Two instances of one kind never share a session.</text>
<text class="n" x="28" y="565">03</text>
<text class="t" x="60" y="565">Named through another instance, the session is refused with 409 wrong-instance-session before anything runs.</text>
<text class="n" x="28" y="590">04</text>
<text class="t" x="60" y="590">Settings are not stored. A request resumed after a deploy runs on the settings the new process started with.</text>
<line class="solid" x1="28" y1="617" x2="54" y2="617"/><text class="lb" x="62" y="621">REAL</text>
<line class="ln x" x1="120" y1="617" x2="142" y2="617"/><line class="ln x" x1="143" y1="610" x2="143" y2="624"/><text class="lb" x="154" y="621">REFUSED</text>
<rect fill="url(#hatch)" x="234" y="611" width="26" height="11"/><rect class="thin" x="234" y="611" width="26" height="11"/><text class="lb" x="268" y="621">OUTLIVES THE REQUEST</text>
</svg>
