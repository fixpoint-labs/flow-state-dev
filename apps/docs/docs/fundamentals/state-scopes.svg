<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 546" role="img" aria-labelledby="title desc">
  <title id="title">The four state scopes: separate records, each with its own key</title>
  <desc id="desc">Request, session, user and org state are four separate records, none inside another. Request state belongs to one action run and the next request cannot see it. Session state belongs to one conversation: its state, items, metadata and journal, and the resources an action declares, keyed by the session id and by the tenant when one is sent. User state follows one person across conversations and flows, keyed by the user id; with isolateUserState it is one record per flow copy instead, and an instance with an owner pin keeps one record per person in the pinned organization instead. Org state is shared by everyone in the organization, keyed by the org id, or one record per flow copy with isolateOrgState. A session is bound to one organization when it is created; it names its user and org but holds neither one's state. A tenant id splits sessions only. Blocks read and write all four; the browser sees only the fields a scope's client config exposes.</desc>
  <defs>
    <style>
      :root { --bg:#ffffff; --ink:#0f172a; --ink-2:#334155; --muted:#64748b;
              --sess-fill:#eff6ff; --sess:#1d4ed8; --org-fill:#f0fdf4; --org:#15803d;
              --user-fill:#faf5ff; --user:#7e22ce; --req:#94a3b8;
              --card:#ffffff; --card-line:#334155; --box:#f8fafc; }
      @media (prefers-color-scheme: dark) {
        :root { --bg:#0e0e14; --ink:#e5e7eb; --ink-2:#cbd5e1; --muted:#94a3b8;
                --sess-fill:#0f1a33; --sess:#60a5fa; --org-fill:#0b2016; --org:#4ade80;
                --user-fill:#1d1030; --user:#c084fc; --req:#64748b;
                --card:#14141c; --card-line:#64748b; --box:#181822; } }
      .bg { fill: var(--bg); }
      .wall-sess { fill: var(--sess-fill); stroke: var(--sess); stroke-width: 2; }
      .wall-org { fill: var(--org-fill); stroke: var(--org); stroke-width: 2; }
      .wall-req { fill: var(--box); stroke: var(--req); stroke-width: 2; stroke-dasharray: 6 4; }
      .wall-user { fill: var(--user-fill); stroke: var(--user); stroke-width: 2; }
      .wall-file { fill: var(--box); stroke: var(--card-line); stroke-width: 2; }
      .card { fill: var(--card); stroke: var(--card-line); stroke-width: 1.5; }
      .card-sess { fill: var(--card); stroke: var(--sess); stroke-width: 1.5; }
      .card-line { fill: var(--card); stroke: var(--org); stroke-width: 1.5; }
      .box { fill: var(--box); stroke: var(--card-line); stroke-width: 1.5; }
      .title { font: 700 20px ui-sans-serif, system-ui, sans-serif; fill: var(--ink); }
      .h { font: 700 14px ui-sans-serif, system-ui, sans-serif; fill: var(--ink); }
      .p { font: 13px ui-sans-serif, system-ui, sans-serif; fill: var(--ink-2); }
      .muted { font: 12px ui-sans-serif, system-ui, sans-serif; fill: var(--muted); }
      .code { font: 12px ui-monospace, SFMono-Regular, Menlo, monospace; fill: var(--ink); }
    </style>
  </defs>

  <rect x="0" y="0" width="920" height="546" rx="16" class="bg"/>

  <text x="28" y="36" class="title">Four scopes, four separate records</text>
  <text x="28" y="58" class="muted">Each has its own key and its own reach. None sits inside another.</text>

  <!-- Request -->
  <rect x="28" y="84" width="200" height="316" rx="14" class="wall-req"/>
  <text x="44" y="108" class="h">Request</text>
  <text x="44" y="126" class="muted">One action run</text>
  <text x="44" y="158" class="code">ctx.request</text>
  <text x="44" y="190" class="p">Scratch space between</text>
  <text x="44" y="208" class="p">the blocks of one run</text>
  <text x="44" y="246" class="muted">Key: the request</text>
  <text x="44" y="284" class="muted">The next request</text>
  <text x="44" y="300" class="muted">cannot see it</text>

  <!-- Session -->
  <rect x="244" y="84" width="200" height="316" rx="14" class="wall-sess"/>
  <text x="260" y="108" class="h">Session</text>
  <text x="260" y="126" class="muted">One conversation</text>
  <text x="260" y="158" class="code">ctx.session</text>
  <text x="260" y="190" class="p">Its state, items,</text>
  <text x="260" y="208" class="p">metadata and journal, and</text>
  <text x="260" y="226" class="p">the resources an action</text>
  <text x="260" y="244" class="p">declares</text>
  <text x="260" y="278" class="muted">Key: the session id, and</text>
  <text x="260" y="294" class="muted">the tenant when sent</text>
  <text x="260" y="332" class="muted">Names its user and org.</text>
  <text x="260" y="348" class="muted">Holds neither one's state.</text>

  <!-- User -->
  <rect x="460" y="84" width="200" height="316" rx="14" class="wall-user"/>
  <text x="476" y="108" class="h">User</text>
  <text x="476" y="126" class="muted">One person</text>
  <text x="476" y="158" class="code">ctx.user</text>
  <text x="476" y="190" class="p">Follows the person across</text>
  <text x="476" y="208" class="p">conversations and flows</text>
  <text x="476" y="246" class="muted">Key: the userId</text>
  <text x="476" y="284" class="code">isolateUserState</text>
  <text x="476" y="300" class="muted">One record per flow</text>
  <text x="476" y="316" class="muted">copy instead</text>
  <text x="476" y="346" class="code">owner pin</text>
  <text x="476" y="362" class="muted">One record per person in</text>
  <text x="476" y="378" class="muted">the pinned org instead</text>

  <!-- Org -->
  <rect x="676" y="84" width="216" height="316" rx="14" class="wall-org"/>
  <text x="692" y="108" class="h">Org</text>
  <text x="692" y="126" class="muted">Everyone in the organization</text>
  <text x="692" y="158" class="code">ctx.org?</text>
  <text x="692" y="190" class="p">Settings and knowledge</text>
  <text x="692" y="208" class="p">the whole team shares</text>
  <text x="692" y="246" class="muted">Key: the orgId</text>
  <text x="692" y="284" class="code">isolateOrgState</text>
  <text x="692" y="300" class="muted">One record per flow</text>
  <text x="692" y="316" class="muted">copy instead</text>

  <!-- Not a copy -->
  <rect x="28" y="420" width="864" height="110" rx="12" class="box"/>
  <text x="44" y="444" class="h">Not a copy, and who sees what</text>
  <text x="44" y="468" class="p">A session is bound to one organization when it is created. It points at its user and org; it does not copy their state.</text>
  <text x="44" y="488" class="p">A tenant id splits sessions only. User and org records are the same across tenants.</text>
  <text x="44" y="508" class="p">Blocks read and write all four. The browser sees only the fields a scope's client config exposes.</text>
</svg>
