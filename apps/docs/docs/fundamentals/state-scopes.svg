<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 34 920 570">
<defs>
<pattern id="hatch" width="5" height="5" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line class="hatch-line" x1="0" y1="0" x2="0" y2="5"/></pattern>
<marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ink" d="M0,0 L10,5 L0,10 z"/></marker>
</defs>
<line class="thin" x1="28" y1="62" x2="892" y2="62"/><line class="thin" x1="28.5" y1="56" x2="28.5" y2="68"/><line class="thin" x1="891.5" y1="56" x2="891.5" y2="68"/><rect class="ground" x="290.8" y="55" width="338.5" height="15"/><text class="plate" x="460" y="66" text-anchor="middle">4 SEPARATE RECORDS · NONE SITS INSIDE ANOTHER</text>
<rect class="dash" x="28" y="84" width="204" height="316"/>
<text class="lb" x="40" y="116">SCOPE 01</text>
<text class="nm" x="40" y="138">Request</text>
<text class="sub" x="40" y="156">one action run</text>
<line class="hi" x1="28" y1="168" x2="232" y2="168"/><text class="c" x="40" y="190">ctx.request</text>
<text class="t" x="40" y="212">Scratch space between</text>
<text class="t" x="40" y="228">the blocks of one run</text>
<line class="hi" x1="28" y1="276" x2="232" y2="276"/><text class="lb" x="40" y="296">KEY</text>
<text class="t" x="40" y="314">the request</text>
<text class="t" x="40" y="352">The next request</text>
<text class="t" x="40" y="368">cannot see it.</text>
<rect fill="url(#hatch)" x="248" y="84" width="204" height="10"/><line class="thin" x1="248" y1="94.5" x2="452" y2="94.5"/><rect class="solid" x="248" y="84" width="204" height="316"/>
<text class="lb" x="260" y="116">SCOPE 02</text>
<text class="nm" x="260" y="138">Session</text>
<text class="sub" x="260" y="156">one conversation</text>
<line class="hi" x1="248" y1="168" x2="452" y2="168"/><text class="c" x="260" y="190">ctx.session</text>
<text class="t" x="260" y="212">Its state, items,</text>
<text class="t" x="260" y="228">metadata and journal,</text>
<text class="t" x="260" y="244">and the resources an</text>
<text class="t" x="260" y="260">action declares</text>
<line class="hi" x1="248" y1="276" x2="452" y2="276"/><text class="lb" x="260" y="296">KEY</text>
<text class="t" x="260" y="314">the session id, and</text>
<text class="t" x="260" y="330">the tenant when sent</text>
<rect fill="url(#hatch)" x="468" y="84" width="204" height="10"/><line class="thin" x1="468" y1="94.5" x2="672" y2="94.5"/><rect class="solid" x="468" y="84" width="204" height="316"/>
<text class="lb" x="480" y="116">SCOPE 03</text>
<text class="nm" x="480" y="138">User</text>
<text class="sub" x="480" y="156">one person</text>
<line class="hi" x1="468" y1="168" x2="672" y2="168"/><text class="c" x="480" y="190">ctx.user</text>
<text class="t" x="480" y="212">Follows the person</text>
<text class="t" x="480" y="228">across conversations</text>
<text class="t" x="480" y="244">and flows in one</text>
<text class="t" x="480" y="260">organization</text>
<line class="hi" x1="468" y1="276" x2="672" y2="276"/><text class="lb" x="480" y="296">KEY</text>
<text class="t" x="480" y="314">the userId and orgId</text>
<text class="c" x="480" y="352">isolateUserState</text>
<text class="t" x="480" y="368">one record per</text>
<text class="t" x="480" y="384">flow copy instead</text>
<rect fill="url(#hatch)" x="688" y="84" width="204" height="10"/><line class="thin" x1="688" y1="94.5" x2="892" y2="94.5"/><rect class="solid" x="688" y="84" width="204" height="316"/>
<text class="lb" x="700" y="116">SCOPE 04</text>
<text class="nm" x="700" y="138">Org</text>
<text class="sub" x="700" y="156">everyone in the organization</text>
<line class="hi" x1="688" y1="168" x2="892" y2="168"/><text class="c" x="700" y="190">ctx.org?</text>
<text class="t" x="700" y="212">Settings and knowledge</text>
<text class="t" x="700" y="228">the whole team shares</text>
<line class="hi" x1="688" y1="276" x2="892" y2="276"/><text class="lb" x="700" y="296">KEY</text>
<text class="t" x="700" y="314">the orgId</text>
<text class="c" x="700" y="352">isolateOrgState</text>
<text class="t" x="700" y="368">one record per</text>
<text class="t" x="700" y="384">flow copy instead</text>
<circle cx="350" cy="400" r="2.6" class="ink"/><path class="ln" d="M350 400 V426 H790"/><path class="ln" d="M570 426 V403" marker-end="url(#ah)"/><path class="ln" d="M790 426 V403" marker-end="url(#ah)"/><rect class="ground" x="378.4" y="419" width="163.3" height="15"/><text class="plate" x="460" y="430" text-anchor="middle">NAMES · HOLDS NO COPY</text>
<line class="hi" x1="0" y1="452" x2="920" y2="452"/>
<text class="n" x="28" y="478">01</text>
<text class="t" x="60" y="478">A session is bound to one organization when it is created. It points at its user and org; it does not copy their</text>
<text class="t" x="60" y="495">state.</text>
<text class="n" x="28" y="520">02</text>
<text class="t" x="60" y="520">A tenant id splits sessions only. User and org records are the same across tenants.</text>
<text class="n" x="28" y="545">03</text>
<text class="t" x="60" y="545">Blocks read and write all four. The browser sees only the fields a scope's client config exposes.</text>
<line class="dash" x1="28" y1="572" x2="54" y2="572"/><text class="lb" x="62" y="576">LASTS ONE ACTION RUN</text>
<rect fill="url(#hatch)" x="240" y="566" width="26" height="11"/><rect class="thin" x="240" y="566" width="26" height="11"/><text class="lb" x="274" y="576">OUTLIVES THE REQUEST</text>
<line class="solid" x1="452" y1="572" x2="478" y2="572"/><text class="lb" x="486" y="576">NAMES (A REFERENCE)</text>
</svg>
