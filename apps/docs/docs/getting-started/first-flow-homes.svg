<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 34 940 538">
<defs>
<pattern id="hatch" width="5" height="5" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line class="hatch-line" x1="0" y1="0" x2="0" y2="5"/></pattern>
<marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ink" d="M0,0 L10,5 L0,10 z"/></marker>
</defs>
<rect class="solid" x="24" y="56" width="232" height="340"/>
<text class="lb" x="36" y="88">PLACE 01</text>
<text class="nm" x="36" y="110">Your browser</text>
<text class="sub" x="36" y="128">page.tsx · shows the session</text>
<line class="hi" x1="24" y1="140" x2="256" y2="140"/><rect class="solid" x="354" y="56" width="232" height="340"/>
<text class="lb" x="366" y="88">PLACE 02</text>
<text class="nm" x="366" y="110">Your server</text>
<text class="sub" x="366" y="128">lib/flowstate.ts and the route</text>
<line class="hi" x1="354" y1="140" x2="586" y2="140"/><rect fill="url(#hatch)" x="684" y="56" width="232" height="10"/><line class="thin" x1="684" y1="66.5" x2="916" y2="66.5"/><rect class="solid" x="684" y="56" width="232" height="340"/>
<text class="lb" x="696" y="88">PLACE 03</text>
<text class="nm" x="696" y="110">The store</text>
<text class="sub" x="696" y="128">inMemoryStores() · keeps it</text>
<line class="hi" x1="684" y1="140" x2="916" y2="140"/><text class="c" x="36" y="162">FlowProvider</text>
<text class="t" x="36" y="178">the flow, and the user</text>
<text class="c" x="36" y="204">useFlow</text>
<text class="t" x="36" y="220">picks this user's session</text>
<text class="c" x="36" y="246">useSession</text>
<text class="t" x="36" y="262">items, exposed state,</text>
<text class="t" x="36" y="278">and streaming</text>
<text class="c" x="36" y="304">ItemsRenderer</text>
<line class="hi" x1="24" y1="318" x2="256" y2="318"/><text class="t" x="36" y="340">Sees the items marked for</text>
<text class="t" x="36" y="356">the client, and the state</text>
<text class="t" x="36" y="372">you expose. Nothing else.</text>
<text class="lb" x="366" y="162">REGISTERED</text>
<text class="c" x="366" y="182">hello-chat</text>
<text class="t" x="366" y="198">action: chat</text>
<line class="hi" x1="354" y1="214" x2="586" y2="214"/><text class="lb" x="366" y="236">RUNS THE BLOCKS</text>
<text class="c" x="366" y="256">chatPipeline</text>
<text class="t" x="366" y="272">the generator, then</text>
<text class="t" x="366" y="288">the counter</text>
<line class="hi" x1="354" y1="318" x2="586" y2="318"/><text class="t" x="366" y="340">Streams each item back</text>
<text class="t" x="366" y="356">as it is made.</text>
<rect class="thin" x="696" y="154" width="208" height="150"/><text class="lb" x="706" y="176">ONE SESSION</text>
<text class="c" x="706" y="198">state</text>
<text class="c" x="721" y="214">messageCount</text>
<text class="c" x="706" y="238">items</text>
<text class="t" x="706" y="254">your messages and</text>
<text class="t" x="706" y="270">replies; history reads</text>
<text class="t" x="706" y="286">them next turn</text>
<text class="t" x="696" y="330">A page reload reads it back.</text>
<text class="t" x="696" y="354">Held in memory, it is lost</text>
<text class="t" x="696" y="370">on restart. SQLite or</text>
<text class="t" x="696" y="386">Postgres keeps it.</text>
<line class="ln" x1="258" y1="182" x2="352" y2="182" marker-end="url(#ah)"/><rect class="ground" x="274.4" y="175" width="61.1" height="15"/><text class="plate" x="305" y="186" text-anchor="middle">01 SEND</text>
<line class="ln" x1="352" y1="260" x2="258" y2="260" marker-end="url(#ah)"/><rect class="ground" x="270.8" y="253" width="68.4" height="15"/><text class="plate" x="305" y="264" text-anchor="middle">02 ITEMS</text>
<line class="ln" x1="589" y1="222" x2="693" y2="222" marker-start="url(#ah)" marker-end="url(#ah)"/><rect class="ground" x="593.5" y="215" width="83.0" height="15"/><text class="plate" x="635" y="226" text-anchor="middle">03 SESSION</text>
<line class="hi" x1="0" y1="420" x2="940" y2="420"/>
<text class="n" x="24" y="446">01</text>
<text class="t" x="56" y="446">Your page calls session.sendAction("chat", { message }), and the flow registered on the server runs it.</text>
<text class="n" x="24" y="471">02</text>
<text class="t" x="56" y="471">The server streams each item back as it is made. The browser holds a view: the items marked for the client and the</text>
<text class="t" x="56" y="488">state you expose.</text>
<text class="n" x="24" y="513">03</text>
<text class="t" x="56" y="513">The session itself is in the store. A reload, or the next turn, reads the session back from the store.</text>
<line class="solid" x1="24" y1="540" x2="50" y2="540"/><text class="lb" x="58" y="544">A CALL OR A STREAM</text>
<rect fill="url(#hatch)" x="221" y="534" width="26" height="11"/><rect class="thin" x="221" y="534" width="26" height="11"/><text class="lb" x="255" y="544">OUTLIVES THE REQUEST</text>
</svg>
