<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 532" role="img" aria-label="Three places took part in your first flow. Your browser runs page.tsx: FlowProvider names the flow hello-chat and the user, useFlow picks this user's session or creates one, useSession holds its items, the state you exposed and whether it is streaming, and ItemsRenderer draws the items. Sending the chat action goes to your server, where createFlowState registered hello-chat and the route runs the chat pipeline, the generator then the counter, and streams items back to the browser. The store holds the session: its state, messageCount, and its items, which history reads on the next turn. The server loads the session from the store before a run and saves it after. A page reload reads it back from the store. This example's store is in memory, so a server restart loses it; SQLite or Postgres keeps it.">
  <style>
    :root { --bg:#ffffff; --ink:#0f172a; --ink-2:#334155; --muted:#64748b;
            --proc-fill:#faf5ff; --proc:#7e22ce; --sess-fill:#eff6ff; --sess:#1d4ed8;
            --org-fill:#f0fdf4; --org:#15803d; --card:#ffffff; --card-line:#334155; --box:#f8fafc; }
    @media (prefers-color-scheme: dark) {
      :root { --bg:#0e0e14; --ink:#e5e7eb; --ink-2:#cbd5e1; --muted:#94a3b8;
              --proc-fill:#1d1030; --proc:#c084fc; --sess-fill:#0f1a33; --sess:#60a5fa;
              --org-fill:#0b2016; --org:#4ade80; --card:#14141c; --card-line:#64748b; --box:#181822; } }
    .bg { fill:var(--bg); }
    .wall-proc { fill:var(--proc-fill); stroke:var(--proc); stroke-width:2; }
    .wall-sess { fill:var(--sess-fill); stroke:var(--sess); stroke-width:2; }
    .wall-org { fill:var(--org-fill); stroke:var(--org); stroke-width:2; }
    .wall-file { fill:var(--box); stroke:var(--card-line); stroke-width:2; }
    .card { fill:var(--card); stroke:var(--card-line); stroke-width:1.5; }
    .card-sess { fill:var(--card); stroke:var(--sess); stroke-width:1.5; }
    .box { fill:var(--box); stroke:var(--card-line); stroke-width:1.2; }
    .title { font:700 20px ui-sans-serif, system-ui, sans-serif; fill:var(--ink); }
    .h { font:700 14px ui-sans-serif, system-ui, sans-serif; fill:var(--ink); }
    .p { font:13px ui-sans-serif, system-ui, sans-serif; fill:var(--ink-2); }
    .muted { font:12px ui-sans-serif, system-ui, sans-serif; fill:var(--muted); }
    .lbl { font:600 10px ui-monospace, SFMono-Regular, Menlo, monospace; letter-spacing:.08em; fill:var(--muted); }
    .code { font:11.5px ui-monospace, SFMono-Regular, Menlo, monospace; fill:var(--ink); }
    .line { stroke:var(--muted); stroke-width:1.5; fill:none; }
    .head { fill:var(--muted); }
  </style>

  <rect class="bg" x="0" y="0" width="940" height="532" rx="16"/>
  <text class="title" x="24" y="38">Three places took part</text>
  <text class="muted" x="24" y="60">The browser shows the session, the server runs the flow, the store keeps the session.</text>

  <g id="browser">
    <rect class="wall-file" x="24" y="80" width="260" height="316" rx="14"/>
    <text class="h" x="40" y="104">Your browser</text>
    <text class="muted" x="40" y="122">page.tsx</text>
    <rect class="card" x="36" y="138" width="236" height="166" rx="10"/>
    <text class="code" x="50" y="162">FlowProvider</text>
    <text class="muted" x="50" y="180">the flow, and the user</text>
    <text class="code" x="50" y="206">useFlow</text>
    <text class="muted" x="50" y="224">picks this user's session</text>
    <text class="code" x="50" y="250">useSession</text>
    <text class="muted" x="50" y="268">items, exposed state, streaming</text>
    <text class="code" x="50" y="292">ItemsRenderer</text>
    <text class="p" x="40" y="330">Sees the items marked for</text>
    <text class="p" x="40" y="348">the client, and the state</text>
    <text class="p" x="40" y="366">you expose. Nothing else.</text>
  </g>

  <g id="server">
    <rect class="wall-proc" x="340" y="80" width="260" height="316" rx="14"/>
    <text class="h" x="356" y="104">Your server</text>
    <text class="muted" x="356" y="122">lib/flowstate.ts and the route</text>
    <rect class="card" x="352" y="138" width="236" height="68" rx="10"/>
    <text class="lbl" x="366" y="158">REGISTERED</text>
    <text class="code" x="366" y="180">hello-chat</text>
    <text class="muted" x="366" y="198">action: chat</text>
    <rect class="card" x="352" y="216" width="236" height="78" rx="10"/>
    <text class="lbl" x="366" y="236">RUNS THE BLOCKS</text>
    <text class="code" x="366" y="258">chatPipeline</text>
    <text class="muted" x="366" y="278">the generator, then the counter</text>
    <text class="p" x="356" y="326">Streams each item back</text>
    <text class="p" x="356" y="344">as it is made.</text>
  </g>

  <g id="store">
    <rect class="wall-sess" x="656" y="80" width="260" height="316" rx="14"/>
    <text class="h" x="672" y="104">The store</text>
    <text class="muted" x="672" y="122">inMemoryStores() here</text>
    <rect class="card-sess" x="668" y="138" width="236" height="156" rx="10"/>
    <text class="lbl" x="682" y="158">ONE SESSION</text>
    <text class="code" x="682" y="182">state</text>
    <text class="code" x="682" y="200">  messageCount</text>
    <text class="code" x="682" y="228">items</text>
    <text class="muted" x="682" y="246">your messages and replies;</text>
    <text class="muted" x="682" y="262">history reads them next turn</text>
    <text class="p" x="672" y="326">A page reload reads it back.</text>
    <text class="muted" x="672" y="352">In memory, a server restart</text>
    <text class="muted" x="672" y="368">loses it. SQLite or Postgres</text>
    <text class="muted" x="672" y="384">keeps it.</text>
  </g>

  <g id="arrows">
    <path class="line" d="M284 168 H332"/>
    <polygon class="head" points="340,168 330,163 330,173"/>
    <text class="muted" x="288" y="158">action</text>
    <path class="line" d="M340 250 H292"/>
    <polygon class="head" points="284,250 294,245 294,255"/>
    <text class="muted" x="292" y="270">items</text>
    <path class="line" d="M600 168 H648"/>
    <polygon class="head" points="656,168 646,163 646,173"/>
    <text class="muted" x="604" y="158">save</text>
    <path class="line" d="M656 250 H608"/>
    <polygon class="head" points="600,250 610,245 610,255"/>
    <text class="muted" x="608" y="270">load</text>
  </g>

  <g id="footer">
    <rect class="box" x="24" y="412" width="892" height="104" rx="12"/>
    <text class="h" x="40" y="436">One send, end to end</text>
    <text class="p" x="40" y="460">session.sendAction("chat") reaches the server, which loads the session from the store.</text>
    <text class="p" x="40" y="480">The blocks run, the counter goes up, and each item streams to the browser as it is made.</text>
    <text class="p" x="40" y="500">The session is saved, so the next turn, or a reload, starts from it.</text>
  </g>
</svg>
