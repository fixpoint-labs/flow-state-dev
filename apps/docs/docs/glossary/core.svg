<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 34 920 822">
<defs>
<marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ink" d="M0,0 L10,5 L0,10 z"/></marker>
</defs>
<text class="lb" x="28" y="66">DEFINE</text>
<text class="sub" x="86" y="66">@flow-state-dev/core</text>
<rect class="solid" x="28" y="78" width="124" height="190"/>
<text class="lb" x="40" y="100">STEP 01</text>
<text class="nm" x="40" y="122">Block</text>
<text class="t" x="40" y="144">A typed unit</text>
<text class="t" x="40" y="160">of work. Five</text>
<text class="t" x="40" y="176">kinds:</text>
<text class="c" x="40" y="196">handler</text>
<text class="c" x="40" y="211">generator</text>
<text class="c" x="40" y="226">evaluator</text>
<text class="c" x="40" y="241">router</text>
<text class="c" x="40" y="256">sequencer</text>
<rect class="solid" x="197" y="78" width="124" height="190"/>
<text class="lb" x="209" y="100">STEP 02</text>
<text class="nm" x="209" y="122">Sequencer</text>
<text class="t" x="209" y="144">A block that</text>
<text class="t" x="209" y="160">runs blocks in</text>
<text class="t" x="209" y="176">order.</text>
<text class="c" x="209" y="198">.step .tap</text>
<text class="c" x="209" y="214">.sideChain</text>
<text class="c" x="209" y="230">.rescue</text>
<rect class="solid" x="366" y="78" width="124" height="190"/>
<text class="lb" x="378" y="100">STEP 03</text>
<text class="nm" x="378" y="122">Action</text>
<text class="t" x="378" y="144">A name on one</text>
<text class="t" x="378" y="160">root block,</text>
<text class="t" x="378" y="176">plus an input</text>
<text class="t" x="378" y="192">schema and</text>
<text class="t" x="378" y="208">hooks.</text>
<rect class="solid" x="535" y="78" width="156" height="190"/>
<text class="lb" x="547" y="100">STEP 04</text>
<text class="nm" x="547" y="122">Flow</text>
<text class="c" x="547" y="144">defineFlow({kind})</text>
<text class="t" x="547" y="166">Declares actions,</text>
<text class="t" x="547" y="182">scopes, resources</text>
<text class="t" x="547" y="198">and capabilities.</text>
<rect class="solid" x="736" y="78" width="156" height="190"/>
<text class="lb" x="748" y="100">STEP 05</text>
<text class="nm" x="748" y="122">Flow instance</text>
<text class="c" x="748" y="144">flow({id, config})</text>
<text class="t" x="748" y="166">The flow with an</text>
<text class="t" x="748" y="182">id and settings.</text>
<text class="t" x="748" y="198">The id is its</text>
<text class="t" x="748" y="214">address.</text>
<line class="ln" x1="153.5" y1="173" x2="195.5" y2="173" marker-end="url(#ah)"/>
<line class="ln" x1="322.5" y1="173" x2="364.5" y2="173" marker-end="url(#ah)"/>
<line class="ln" x1="491.5" y1="173" x2="533.5" y2="173" marker-end="url(#ah)"/>
<line class="ln" x1="692.5" y1="173" x2="734.5" y2="173" marker-end="url(#ah)"/>
<line class="ln" x1="814" y1="269.5" x2="814" y2="338.5" marker-end="url(#ah)"/><rect class="ground" x="751" y="297" width="126" height="15"/><text class="plate" x="814" y="308" text-anchor="middle">REGISTERED BY ID</text>
<text class="lb" x="28" y="328">RUN</text>
<text class="sub" x="62" y="328">@flow-state-dev/engine</text>
<rect class="solid" x="28" y="340" width="124" height="154"/>
<text class="nm" x="40" y="372">Stores</text>
<text class="t" x="40" y="394">Keep sessions,</text>
<text class="t" x="40" y="410">state,</text>
<text class="t" x="40" y="426">resources and</text>
<text class="t" x="40" y="442">requests.</text>
<text class="t" x="40" y="464">Memory, SQLite</text>
<text class="t" x="40" y="480">or Postgres.</text>
<rect class="solid" x="197" y="340" width="124" height="154"/>
<text class="nm" x="209" y="372">Items</text>
<text class="t" x="209" y="394">Streamed as</text>
<text class="t" x="209" y="410">the request</text>
<text class="t" x="209" y="426">runs.</text>
<text class="t" x="209" y="448">Resumable.</text>
<rect class="solid" x="366" y="340" width="124" height="154"/>
<text class="nm" x="378" y="372">Request</text>
<text class="t" x="378" y="394">Runs one</text>
<text class="t" x="378" y="410">action on a</text>
<text class="t" x="378" y="426">session.</text>
<rect class="solid" x="535" y="340" width="156" height="154"/>
<text class="nm" x="547" y="372">Session</text>
<text class="t" x="547" y="394">One conversation,</text>
<text class="t" x="547" y="410">opened against an</text>
<text class="t" x="547" y="426">instance.</text>
<rect class="solid" x="736" y="340" width="156" height="154"/>
<text class="nm" x="748" y="372">FlowState</text>
<text class="t" x="748" y="394">Registers each</text>
<text class="t" x="748" y="410">instance at its id</text>
<text class="t" x="748" y="426">and serves routes.</text>
<line class="ln" x1="734.5" y1="417" x2="692.5" y2="417" marker-end="url(#ah)"/>
<line class="ln" x1="533.5" y1="417" x2="491.5" y2="417" marker-end="url(#ah)"/>
<line class="ln" x1="364.5" y1="417" x2="322.5" y2="417" marker-end="url(#ah)"/>
<text class="lb" x="28" y="532">BESIDE THE CHAIN</text>
<text class="sub" x="160" y="532">@flow-state-dev/core</text>
<rect class="solid" x="28" y="544" width="204" height="148"/>
<text class="nm" x="40" y="572">Tool</text>
<text class="t" x="40" y="594">A block listed in a</text>
<text class="t" x="40" y="610">generator's tools.</text>
<text class="t" x="40" y="626">No separate type.</text>
<rect class="solid" x="248" y="544" width="204" height="148"/>
<text class="nm" x="260" y="572">Capability</text>
<text class="t" x="260" y="594">Resources, state,</text>
<text class="t" x="260" y="610">context, tools and</text>
<text class="t" x="260" y="626">helpers in one bundle.</text>
<text class="t" x="260" y="642">A block or flow pulls</text>
<text class="t" x="260" y="658">it in with uses.</text>
<rect class="solid" x="468" y="544" width="204" height="148"/>
<text class="nm" x="480" y="572">Resource collection</text>
<text class="t" x="480" y="594">A family of resources</text>
<text class="t" x="480" y="610">keyed by a pattern,</text>
<text class="c" x="480" y="632">files/* · projects/*</text>
<rect class="solid" x="688" y="544" width="204" height="148"/>
<text class="nm" x="700" y="572">Scopes</text>
<text class="t" x="700" y="594">Where state lives:</text>
<text class="c" x="700" y="614">request</text>
<text class="c" x="780" y="614">session</text>
<text class="c" x="700" y="632">user</text>
<text class="c" x="780" y="632">org</text>
<text class="t" x="700" y="654">Resources: session,</text>
<text class="t" x="700" y="670">user, org</text>
<line class="hi" x1="0" y1="716" x2="920" y2="716"/>
<text class="n" x="28" y="742">01</text>
<text class="t" x="60" y="742">Each box in the top row is made of the one before it: a sequencer is a block, an action wraps one root block,</text>
<text class="t" x="60" y="759">a flow declares its actions, and an instance is the flow called with an id and settings.</text>
<text class="n" x="28" y="784">02</text>
<text class="t" x="60" y="784">FlowState registers each instance at its id. A session is opened against one instance, and each request on it</text>
<text class="t" x="60" y="801">runs one action and streams items back as it runs.</text>
<line class="ln" x1="28" y1="828" x2="54" y2="828" marker-end="url(#ah)"/><text class="lb" x="62" y="832">THE NEXT STEP</text>
</svg>
