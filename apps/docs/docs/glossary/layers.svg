<rect class="solid" x="28" y="770" width="864" height="96"/>
<text class="lb" x="40" y="794">LAYER 01</text>
<text class="nm" x="40" y="816">Contracts</text>
<line class="hi" x1="28" y1="828" x2="892" y2="828"/><text class="t" x="40" y="850">The item types every request streams, and block instance ids. Shared by server and browser.</text>
<line class="hi" x1="0" y1="890" x2="920" y2="890"/>
<text class="n" x="28" y="916">01</text>
<text class="t" x="60" y="916">A package imports only from the layers under it. The USES line in each box names exactly which.</text>
