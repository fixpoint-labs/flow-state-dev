<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 596" role="img" aria-labelledby="title desc">
  <title id="title">The layers of flow-state-dev, and which packages each builds on</title>
  <desc id="desc">Five stacked layers. Contracts at the bottom, Core above it, then Engine, Client and React, Orchestration, and Memory, Tools and Workspace. Above those, hosts and stores on Engine, Workforce on Core and Orchestration, and Patterns and Harness manager on Orchestration. Shift Manager is an app at the top that serves a Workforce through the Engine.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" style="fill:var(--card-line)"/>
    </marker>
    <style>
      :root { --bg:#ffffff; --ink:#0f172a; --ink-2:#334155; --muted:#64748b;
              --proc-fill:#faf5ff; --proc:#7e22ce; --sess-fill:#eff6ff; --sess:#1d4ed8;
              --org-fill:#f0fdf4; --org:#15803d; --card:#ffffff; --card-line:#334155; --box:#f8fafc;
              --faint:#94a3b8; --warm-fill:#fff7ed; --warm:#c2410c; }
      @media (prefers-color-scheme: dark) {
        :root { --bg:#0e0e14; --ink:#e5e7eb; --ink-2:#cbd5e1; --muted:#94a3b8;
                --proc-fill:#1d1030; --proc:#c084fc; --sess-fill:#0f1a33; --sess:#60a5fa;
                --org-fill:#0b2016; --org:#4ade80; --card:#14141c; --card-line:#64748b; --box:#181822;
                --faint:#64748b; --warm-fill:#2a1608; --warm:#fb923c; } }
      .bg { fill: var(--bg); }
      .wall-sess { fill: var(--sess-fill); stroke: var(--sess); stroke-width: 2; }
      .wall-proc { fill: var(--proc-fill); stroke: var(--proc); stroke-width: 2; }
      .wall-org { fill: var(--org-fill); stroke: var(--org); stroke-width: 2; }
      .wall-warm { fill: var(--warm-fill); stroke: var(--warm); stroke-width: 2; }
      .wall-file { fill: var(--box); stroke: var(--card-line); stroke-width: 2; }
      .card { fill: var(--card); stroke: var(--card-line); stroke-width: 1.5; }
      .card-sess { fill: var(--card); stroke: var(--sess); stroke-width: 1.5; }
      .card-proc { fill: var(--card); stroke: var(--proc); stroke-width: 1.5; }
      .card-org { fill: var(--card); stroke: var(--org); stroke-width: 1.5; }
      .card-warm { fill: var(--card); stroke: var(--warm); stroke-width: 1.5; }
      .box { fill: var(--box); stroke: var(--card-line); stroke-width: 1.5; }
      .dash { fill: none; stroke: var(--faint); stroke-width: 1.5; stroke-dasharray: 6 4; }
      .title { font: 700 20px ui-sans-serif, system-ui, sans-serif; fill: var(--ink); }
      .h { font: 700 14px ui-sans-serif, system-ui, sans-serif; fill: var(--ink); }
      .p { font: 13px ui-sans-serif, system-ui, sans-serif; fill: var(--ink-2); }
      .muted { font: 12px ui-sans-serif, system-ui, sans-serif; fill: var(--muted); }
      .code { font: 12px ui-monospace, SFMono-Regular, Menlo, monospace; fill: var(--ink); }
      .tag-sess { font: 700 11px ui-sans-serif, system-ui, sans-serif; fill: var(--sess); letter-spacing: .04em; }
      .tag-proc { font: 700 11px ui-sans-serif, system-ui, sans-serif; fill: var(--proc); letter-spacing: .04em; }
      .tag-org { font: 700 11px ui-sans-serif, system-ui, sans-serif; fill: var(--org); letter-spacing: .04em; }
      .tag-warm { font: 700 11px ui-sans-serif, system-ui, sans-serif; fill: var(--warm); letter-spacing: .04em; }
      .tag-ink { font: 700 11px ui-sans-serif, system-ui, sans-serif; fill: var(--ink-2); letter-spacing: .04em; }
      .edge { stroke: var(--card-line); stroke-width: 1.5; fill: none; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect x="0" y="0" width="920" height="596" rx="16" class="bg"/>
  <text x="28" y="36" class="title">Each layer is built from the ones below it</text>
  <text x="28" y="58" class="muted">A package imports only from layers under it. The uses line names exactly which.</text>
  <rect x="28" y="80" width="864" height="72" rx="10" class="wall-warm"/>
  <text x="42" y="104" class="h">Shift Manager  ·  app, not published</text>
  <text x="42" y="124" class="p">Screens over a Lab: Shift Coordinator, Inbox, Tasks, Roster, workstreams, projects</text>
  <text x="42" y="142" class="muted">uses workforce, engine, node, client, react, fsdev</text>
  <rect x="28" y="168" width="204" height="112" rx="10" class="card"/>
  <text x="42" y="192" class="h">Hosts and stores</text>
  <text x="42" y="212" class="code">node · next · vercel</text>
  <text x="42" y="230" class="code">store-sqlite</text>
  <text x="42" y="248" class="code">store-postgres</text>
  <text x="42" y="266" class="muted">uses engine</text>
  <rect x="248" y="168" width="424" height="112" rx="10" class="wall-org"/>
  <text x="262" y="192" class="h">Workforce</text>
  <text x="262" y="212" class="p">Workers from WORKER.md, mailboxes from MAILBOX.md,</text>
  <text x="262" y="230" class="p">rosters, the inventory, projects and rooms</text>
  <text x="262" y="248" class="code">@flow-state-dev/workforce</text>
  <text x="262" y="266" class="muted">uses core, orchestration. Your app passes in engine calls.</text>
  <rect x="688" y="168" width="204" height="112" rx="10" class="card"/>
  <text x="702" y="192" class="h">Patterns</text>
  <text x="702" y="212" class="p">supervisor, debate …</text>
  <text x="702" y="236" class="h">Harness manager</text>
  <text x="702" y="256" class="p">supervised coding runs</text>
  <text x="702" y="274" class="muted">use core, orchestration</text>
  <rect x="28" y="296" width="204" height="112" rx="10" class="wall-file"/>
  <text x="42" y="320" class="h">Engine</text>
  <text x="42" y="340" class="p">FlowState, requests,</text>
  <text x="42" y="358" class="p">stores, HTTP routes,</text>
  <text x="42" y="376" class="p">streaming and resume</text>
  <text x="42" y="394" class="muted">uses core</text>
  <rect x="248" y="296" width="204" height="112" rx="10" class="card"/>
  <text x="262" y="320" class="h">Client · React</text>
  <text x="262" y="340" class="p">Call actions, open</text>
  <text x="262" y="358" class="p">sessions, read streams</text>
  <text x="262" y="376" class="p">from the browser</text>
  <text x="262" y="394" class="muted">use core, contracts</text>
  <rect x="468" y="296" width="204" height="112" rx="10" class="wall-proc"/>
  <text x="482" y="320" class="h">Orchestration</text>
  <text x="482" y="340" class="p">Tasks, task boards,</text>
  <text x="482" y="358" class="p">dispatchers, skills</text>
  <text x="482" y="376" class="p">and skill agents</text>
  <text x="482" y="394" class="muted">uses core</text>
  <rect x="688" y="296" width="204" height="112" rx="10" class="card"/>
  <text x="702" y="320" class="h">Smaller packages</text>
  <text x="702" y="340" class="code">memory  tools</text>
  <text x="702" y="358" class="code">workspace</text>
  <text x="702" y="376" class="p">tiers, tools, places</text>
  <text x="702" y="394" class="muted">use core</text>
  <rect x="28" y="424" width="864" height="80" rx="10" class="wall-sess"/>
  <text x="42" y="448" class="h">Core</text>
  <text x="42" y="468" class="p">Blocks (handler, generator, evaluator, sequencer, router), actions, flows and flow instances,</text>
  <text x="42" y="486" class="p">scopes and state, resources and resource collections, capabilities, tools, model resolver</text>
  <rect x="28" y="520" width="864" height="60" rx="10" class="box"/>
  <text x="42" y="544" class="h">Contracts</text>
  <text x="42" y="564" class="p">The item types every request streams, and block instance ids. Shared by server and browser.</text>
</svg>
