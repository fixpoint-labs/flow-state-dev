<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 560" role="img" aria-labelledby="title desc">
  <title id="title">Orchestration: what a task board is made of</title>
  <desc id="desc">A task is a row with a goal, a status and an optional assignee. Tasks live in a task collection, kept in state or in a resource collection. A task board is a sequencer that drains the collection: a dispatcher picks the next ready task, and its assignee routes it to a board worker, which is any block. Built on a board: the goal-seek loop, the harness manager, skill agents, and four patterns. A task's assignee names a board worker, never a Workforce worker.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" style="fill:var(--card-line)"/>
    </marker>
    <style>
      :root { --bg:#ffffff; --ink:#0f172a; --ink-2:#334155; --muted:#64748b;
              --proc-fill:#faf5ff; --proc:#7e22ce; --sess-fill:#eff6ff; --sess:#1d4ed8;
              --org-fill:#f0fdf4; --org:#15803d; --card:#ffffff; --card-line:#334155; --box:#f8fafc;
              --faint:#94a3b8; --warm-fill:#fff7ed; --warm:#c2410c; }
      @media (prefers-color-scheme: dark) {
        :root { --bg:#0e0e14; --ink:#e5e7eb; --ink-2:#cbd5e1; --muted:#94a3b8;
                --proc-fill:#1d1030; --proc:#c084fc; --sess-fill:#0f1a33; --sess:#60a5fa;
                --org-fill:#0b2016; --org:#4ade80; --card:#14141c; --card-line:#64748b; --box:#181822;
                --faint:#64748b; --warm-fill:#2a1608; --warm:#fb923c; } }
      .bg { fill: var(--bg); }
      .wall-sess { fill: var(--sess-fill); stroke: var(--sess); stroke-width: 2; }
      .wall-proc { fill: var(--proc-fill); stroke: var(--proc); stroke-width: 2; }
      .wall-org { fill: var(--org-fill); stroke: var(--org); stroke-width: 2; }
      .wall-warm { fill: var(--warm-fill); stroke: var(--warm); stroke-width: 2; }
      .wall-file { fill: var(--box); stroke: var(--card-line); stroke-width: 2; }
      .card { fill: var(--card); stroke: var(--card-line); stroke-width: 1.5; }
      .card-sess { fill: var(--card); stroke: var(--sess); stroke-width: 1.5; }
      .card-proc { fill: var(--card); stroke: var(--proc); stroke-width: 1.5; }
      .card-org { fill: var(--card); stroke: var(--org); stroke-width: 1.5; }
      .card-warm { fill: var(--card); stroke: var(--warm); stroke-width: 1.5; }
      .box { fill: var(--box); stroke: var(--card-line); stroke-width: 1.5; }
      .dash { fill: none; stroke: var(--faint); stroke-width: 1.5; stroke-dasharray: 6 4; }
      .title { font: 700 20px ui-sans-serif, system-ui, sans-serif; fill: var(--ink); }
      .h { font: 700 14px ui-sans-serif, system-ui, sans-serif; fill: var(--ink); }
      .p { font: 13px ui-sans-serif, system-ui, sans-serif; fill: var(--ink-2); }
      .muted { font: 12px ui-sans-serif, system-ui, sans-serif; fill: var(--muted); }
      .code { font: 12px ui-monospace, SFMono-Regular, Menlo, monospace; fill: var(--ink); }
      .tag-sess { font: 700 11px ui-sans-serif, system-ui, sans-serif; fill: var(--sess); letter-spacing: .04em; }
      .tag-proc { font: 700 11px ui-sans-serif, system-ui, sans-serif; fill: var(--proc); letter-spacing: .04em; }
      .tag-org { font: 700 11px ui-sans-serif, system-ui, sans-serif; fill: var(--org); letter-spacing: .04em; }
      .tag-warm { font: 700 11px ui-sans-serif, system-ui, sans-serif; fill: var(--warm); letter-spacing: .04em; }
      .tag-ink { font: 700 11px ui-sans-serif, system-ui, sans-serif; fill: var(--ink-2); letter-spacing: .04em; }
      .edge { stroke: var(--card-line); stroke-width: 1.5; fill: none; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect x="0" y="0" width="920" height="560" rx="16" class="bg"/>
  <text x="28" y="36" class="title">Orchestration: what a task board is made of</text>
  <text x="28" y="58" class="muted">A board is a sequencer, its workers are blocks, and its tasks are rows in state or a collection.</text>
  <rect x="28" y="84" width="170" height="196" rx="10" class="card"/>
  <text x="42" y="108" class="h">Task</text>
  <text x="42" y="128" class="p">A goal, a status,</text>
  <text x="42" y="146" class="p">dependencies, an</text>
  <text x="42" y="164" class="p">optional assignee,</text>
  <text x="42" y="182" class="p">input and output.</text>
  <text x="42" y="206" class="muted">pending · in_progress</text>
  <text x="42" y="223" class="muted">parked · completed …</text>
  <rect x="214" y="84" width="190" height="196" rx="10" class="card"/>
  <text x="228" y="108" class="h">Task collection</text>
  <text x="228" y="128" class="p">One API: add, claim,</text>
  <text x="228" y="146" class="p">complete, fail, park.</text>
  <text x="228" y="170" class="muted">Kept in state, or in a</text>
  <text x="228" y="187" class="muted">resource collection.</text>
  <text x="228" y="204" class="muted">You choose.</text>
  <path d="M198 144 L212 144" class="edge"/>
  <rect x="420" y="84" width="472" height="196" rx="14" class="wall-proc"/>
  <text x="436" y="108" class="h">Task board</text>
  <text x="436" y="126" class="muted">A sequencer that drains the collection</text>
  <rect x="436" y="142" width="206" height="122" rx="10" class="card-proc"/>
  <text x="450" y="166" class="h">Dispatcher</text>
  <text x="450" y="186" class="p">Picks the next ready</text>
  <text x="450" y="204" class="p">task: topological</text>
  <text x="450" y="222" class="p">(default), fifo, priority,</text>
  <text x="450" y="240" class="p">or one you pass in.</text>
  <rect x="670" y="142" width="206" height="122" rx="10" class="card-proc"/>
  <text x="684" y="166" class="h">Board worker</text>
  <text x="684" y="186" class="p">Any block. Runs one</text>
  <text x="684" y="204" class="p">claimed task.</text>
  <text x="684" y="228" class="muted">The assignee picks which.</text>
  <path d="M642 202 L668 202" class="edge"/>
  <path d="M404 202 L434 202" class="edge"/>
  <text x="28" y="320" class="tag-proc">BUILT ON A TASK BOARD</text>
  <rect x="28" y="332" width="204" height="128" rx="10" class="card"/>
  <text x="42" y="356" class="h">Goal-seek loop</text>
  <text x="42" y="376" class="p">Drains, asks a judge</text>
  <text x="42" y="394" class="p">if the goal is met,</text>
  <text x="42" y="412" class="p">replans, drains again.</text>
  <text x="42" y="430" class="muted">orchestration</text>
  <rect x="248" y="332" width="204" height="128" rx="10" class="card"/>
  <text x="262" y="356" class="h">Harness manager</text>
  <text x="262" y="376" class="p">A board worker: one task</text>
  <text x="262" y="394" class="p">becomes one supervised</text>
  <text x="262" y="412" class="p">coding run.</text>
  <text x="262" y="430" class="muted">harness-manager</text>
  <rect x="468" y="332" width="204" height="128" rx="10" class="card"/>
  <text x="482" y="356" class="h">Skill agent</text>
  <text x="482" y="376" class="p">An agent in a SKILL.md,</text>
  <text x="482" y="394" class="p">made into a generator</text>
  <text x="482" y="412" class="p">that works board tasks.</text>
  <text x="482" y="430" class="muted">orchestration</text>
  <rect x="688" y="332" width="204" height="128" rx="10" class="card"/>
  <text x="702" y="356" class="h">Patterns</text>
  <text x="702" y="376" class="code">supervisor</text>
  <text x="702" y="394" class="code">planAndExecute</text>
  <text x="702" y="412" class="code">parallelTasks  eventActors</text>
  <text x="702" y="430" class="muted">patterns</text>
  <rect x="28" y="484" width="864" height="52" rx="12" class="dash"/>
  <text x="44" y="515" class="p">A task's assignee names a board worker, or a Workforce worker that takes tasks. The board runs the list; Workforce finds the worker.</text>
</svg>
