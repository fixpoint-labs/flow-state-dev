<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 34 920 779">
<defs>
<marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ink" d="M0,0 L10,5 L0,10 z"/></marker>
</defs>
<rect class="solid" x="28" y="56" width="220" height="140"/>
<text class="nm" x="40" y="84">Task</text>
<text class="t" x="40" y="106">A goal, a status,</text>
<text class="t" x="40" y="122">dependencies, an optional</text>
<text class="t" x="40" y="138">assignee, input and output.</text>
<text class="c" x="40" y="162">pending · in_progress</text>
<text class="c" x="40" y="180">held · completed …</text>
<rect class="solid" x="348" y="56" width="240" height="140"/>
<text class="nm" x="360" y="84">Task collection</text>
<text class="t" x="360" y="106">One API: add, claim,</text>
<text class="t" x="360" y="122">complete, fail, hold,</text>
<text class="t" x="360" y="138">whichever store backs it.</text>
<rect class="solid" x="698" y="56" width="194" height="140"/>
<text class="lb" x="710" y="80">KEPT IN · YOU CHOOSE</text>
<text class="t" x="710" y="106">State</text>
<text class="lb" x="710" y="128">OR</text>
<text class="t" x="710" y="150">A resource collection</text>
<line class="ln" x1="249.5" y1="110" x2="346.5" y2="110" marker-end="url(#ah)"/><rect class="ground" x="285.7" y="103" width="24.6" height="15"/><text class="plate" x="298" y="114" text-anchor="middle">01</text>
<line class="ln" x1="589.5" y1="110" x2="696.5" y2="110" marker-end="url(#ah)"/><rect class="ground" x="630.7" y="103" width="24.6" height="15"/><text class="plate" x="643" y="114" text-anchor="middle">02</text>
<rect class="solid" x="28" y="256" width="864" height="140"/>
<text class="nm" x="40" y="284">Task board</text>
<text class="sub" x="40" y="302">a sequencer that drains the collection</text>
<text class="c" x="40" y="326">taskBoard()</text>
<rect class="thin" x="358" y="272" width="220" height="108"/><text class="nm" x="370" y="296">Claim order</text>
<text class="t" x="370" y="318">Picks the next ready task:</text>
<text class="t" x="370" y="334">topological (default),</text>
<text class="t" x="370" y="350">fifo, priority, or one</text>
<text class="t" x="370" y="366">you pass in.</text>
<rect class="thin" x="660" y="272" width="220" height="108"/><text class="nm" x="672" y="296">Board worker</text>
<text class="t" x="672" y="318">Any block. Runs one</text>
<text class="t" x="672" y="334">claimed task.</text>
<text class="t" x="672" y="358">The assignee picks which.</text>
<line class="ln" x1="468" y1="197.5" x2="468" y2="270.5" marker-end="url(#ah)"/><rect class="ground" x="430" y="219" width="76" height="15"/><text class="plate" x="468" y="230" text-anchor="middle">03 DRAINS</text>
<line class="ln" x1="579.5" y1="326" x2="658.5" y2="326" marker-end="url(#ah)"/><rect class="ground" x="606.7" y="319" width="24.6" height="15"/><text class="plate" x="619" y="330" text-anchor="middle">04</text>
<rect class="solid" x="28" y="470" width="280" height="104"/>
<text class="lb" x="40" y="494">ORCHESTRATION</text>
<text class="nm" x="40" y="516">Goal-seek loop</text>
<text class="t" x="40" y="538">Drains, asks a judge if the goal</text>
<text class="t" x="40" y="554">is met, replans, drains again.</text>
<rect class="solid" x="320" y="470" width="280" height="104"/>
<text class="lb" x="332" y="494">HARNESS-MANAGER</text>
<text class="nm" x="332" y="516">Harness manager</text>
<text class="t" x="332" y="538">A board worker: one task becomes</text>
<text class="t" x="332" y="554">one supervised coding run.</text>
<rect class="solid" x="612" y="470" width="280" height="104"/>
<text class="lb" x="624" y="494">PATTERNS</text>
<text class="nm" x="624" y="516">Patterns</text>
<text class="c" x="624" y="538">supervisor · planAndExecute</text>
<text class="c" x="624" y="556">parallelTasks · eventActors</text>
<path class="ln" d="M168 470 V440 H752 V470"/><line class="ln" x1="460" y1="470" x2="460" y2="397.5" marker-end="url(#ah)"/><rect class="ground" x="223.5" y="433" width="181" height="15"/><text class="plate" x="314" y="444" text-anchor="middle">05 BUILT ON A TASK BOARD</text>
<line class="hi" x1="0" y1="598" x2="920" y2="598"/>
<text class="n" x="28" y="624">01</text>
<text class="t" x="60" y="624">A task is a row with a goal, a status and an optional assignee. Tasks live in a task collection.</text>
<text class="n" x="28" y="649">02</text>
<text class="t" x="60" y="649">The collection is kept in state, or in a resource collection. You choose; the API is the same.</text>
<text class="n" x="28" y="674">03</text>
<text class="t" x="60" y="674">A task board is a sequencer that drains the collection. Its claim order picks the next ready task.</text>
<text class="n" x="28" y="699">04</text>
<text class="t" x="60" y="699">The task's assignee routes it to a board worker, which is any block. An assignee names a board worker,</text>
<text class="t" x="60" y="716">or a Workforce worker that takes tasks. The board runs the list; Workforce finds the worker.</text>
<text class="n" x="28" y="741">05</text>
<text class="t" x="60" y="741">The goal-seek loop wraps a drain with a judge. The harness manager is a board worker that runs a coding agent.</text>
<text class="t" x="60" y="758">Four patterns use a board.</text>
<line class="ln" x1="28" y1="785" x2="54" y2="785" marker-end="url(#ah)"/><text class="lb" x="62" y="789">A RELATION, NUMBERED IN THE NOTES</text>
<rect class="thin" x="360" y="779" width="26" height="11"/><text class="lb" x="394" y="789">PART OF THE BOARD</text>
</svg>
