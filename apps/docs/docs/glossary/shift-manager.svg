<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 34 920 592">
<defs>
<pattern id="hatch" width="5" height="5" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line class="hatch-line" x1="0" y1="0" x2="0" y2="5"/></pattern>
<marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ink" d="M0,0 L10,5 L0,10 z"/></marker>
</defs>
<text class="lb" x="28" y="64">SCREEN</text>
<text class="lb" x="296" y="64">READS</text>
<rect class="solid" x="28" y="78" width="220" height="60"/>
<text class="nm" x="42" y="105">Lab</text>
<text class="c" x="42" y="124">--config</text>
<rect class="solid" x="296" y="78" width="560" height="60"/>
<text class="lb" x="310" y="110">FLOWSTATE</text>
<text class="lb" x="310" y="126">ENGINE</text>
<text class="t" x="446" y="110">The FlowState one fsdev.config.mts default-exports.</text>
<text class="t" x="446" y="127">Shift Manager serves it and reads only its routes.</text>
<line class="ln" x1="248" y1="108" x2="295" y2="108" marker-end="url(#ah)"/>
<rect class="solid" x="28" y="146" width="220" height="60"/>
<text class="nm" x="42" y="173">Shift Coordinator</text>
<text class="sub" x="42" y="192">the home screen</text>
<rect fill="url(#hatch)" x="296" y="146" width="560" height="10"/><line class="thin" x1="296" y1="156.5" x2="856" y2="156.5"/>
<rect class="solid" x="296" y="146" width="560" height="60"/>
<text class="lb" x="310" y="178">WORKER + SESSION</text>
<text class="lb" x="310" y="194">WORKFORCE</text>
<text class="t" x="446" y="178">Your session with your Shift Coordinator, under a</text>
<text class="t" x="446" y="195">summary of what waits and runs.</text>
<line class="ln" x1="248" y1="176" x2="295" y2="176" marker-end="url(#ah)"/>
<rect class="solid" x="28" y="214" width="220" height="60"/>
<text class="nm" x="42" y="241">Inbox</text>
<text class="c" x="42" y="260">/inbox</text>
<rect fill="url(#hatch)" x="296" y="214" width="560" height="10"/><line class="thin" x1="296" y1="224.5" x2="856" y2="224.5"/>
<rect class="solid" x="296" y="214" width="560" height="60"/>
<text class="lb" x="310" y="246">SUSPENSIONS</text>
<text class="lb" x="310" y="262">CORE</text>
<text class="t" x="446" y="246">Asks in sessions you started and their runs: work</text>
<text class="t" x="446" y="263">suspended until a user approves or answers.</text>
<line class="ln" x1="248" y1="244" x2="295" y2="244" marker-end="url(#ah)"/>
<rect class="solid" x="28" y="282" width="220" height="60"/>
<text class="nm" x="42" y="309">Tasks</text>
<text class="c" x="42" y="328">/tasks</text>
<rect fill="url(#hatch)" x="296" y="282" width="560" height="10"/><line class="thin" x1="296" y1="292.5" x2="856" y2="292.5"/>
<rect class="solid" x="296" y="282" width="560" height="60"/>
<text class="lb" x="310" y="314">TASKS</text>
<text class="lb" x="310" y="330">ORCHESTRATION</text>
<text class="t" x="446" y="314">Every task not done on your boards, grouped by</text>
<text class="t" x="446" y="331">state, worker or workstream.</text>
<line class="ln" x1="248" y1="312" x2="295" y2="312" marker-end="url(#ah)"/>
<rect class="solid" x="28" y="350" width="220" height="60"/>
<text class="nm" x="42" y="377">Roster</text>
<text class="c" x="42" y="396">/roster</text>
<rect fill="url(#hatch)" x="296" y="350" width="560" height="10"/><line class="thin" x1="296" y1="360.5" x2="856" y2="360.5"/>
<rect class="solid" x="296" y="350" width="560" height="60"/>
<text class="lb" x="310" y="382">ROSTER</text>
<text class="lb" x="310" y="398">WORKFORCE</text>
<text class="t" x="446" y="382">Your workers. On shift and off shift are worked</text>
<text class="t" x="446" y="399">out from their tasks and asks.</text>
<line class="ln" x1="248" y1="380" x2="295" y2="380" marker-end="url(#ah)"/>
<rect class="solid" x="28" y="418" width="220" height="60"/>
<text class="nm" x="42" y="445">Project view</text>
<text class="c" x="42" y="464">/p/&lt;project id&gt;</text>
<rect fill="url(#hatch)" x="296" y="418" width="560" height="10"/><line class="thin" x1="296" y1="428.5" x2="856" y2="428.5"/>
<rect class="solid" x="296" y="418" width="560" height="60"/>
<text class="lb" x="310" y="450">PROJECT</text>
<text class="lb" x="310" y="466">WORKFORCE</text>
<text class="t" x="446" y="450">Its workstreams and their progress, your own</text>
<text class="t" x="446" y="467">boards, and your own project coordinator to talk to it.</text>
<line class="ln" x1="248" y1="448" x2="295" y2="448" marker-end="url(#ah)"/>
<path class="ln" d="M880 448 V108 H857" marker-end="url(#ah)"/><line class="ln" x1="856" y1="176" x2="880" y2="176"/><line class="ln" x1="856" y1="244" x2="880" y2="244"/><line class="ln" x1="856" y1="312" x2="880" y2="312"/><line class="ln" x1="856" y1="380" x2="880" y2="380"/><line class="ln" x1="856" y1="448" x2="880" y2="448"/><rect class="ground" x="866.8" y="135" width="26.4" height="15"/><text class="plate" x="880" y="146" text-anchor="middle">01</text>
<line class="hi" x1="0" y1="502" x2="920" y2="502"/>
<text class="n" x="28" y="528">01</text>
<text class="t" x="60" y="528">Shift Manager stores nothing of its own. Every screen is a read of the Lab: each source here is read through</text>
<text class="t" x="60" y="545">the Lab's routes.</text>
<text class="n" x="28" y="570">02</text>
<text class="t" x="60" y="570">The second label on each source names where it comes from: Workforce, Orchestration, Core or the Engine.</text>
<line class="ln" x1="28" y1="598" x2="54" y2="598" marker-end="url(#ah)"/><text class="lb" x="62" y="602">READS</text><rect fill="url(#hatch)" x="135.5" y="592" width="26" height="11"/><rect class="thin" x="135.5" y="592" width="26" height="11"/><text class="lb" x="169.5" y="602">OUTLIVES THE REQUEST</text>
</svg>
