<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 510" role="img" aria-labelledby="title desc">
  <title id="title">Shift Manager: what each screen reads</title>
  <desc id="desc">Each Shift Manager screen beside what it reads. A Lab is the FlowState an fsdev config exports. The Shift Coordinator screen is your session with your Shift Coordinator worker. Inbox lists asks, runs suspended on a user. Tasks lists the tasks on your boards. Roster lists your workers with a derived status. The project view shows a project, its workstreams with their progress, your own workstreams’ boards, and your own project coordinator.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" style="fill:var(--card-line)"/>
    </marker>
    <style>
      :root { --bg:#f0ece1; --ink:#1b1a15; --ink-2:#3d3a32; --muted:#57544a; --proc-fill:#efe5fc;
              --proc:#6b4fa0; --sess-fill:#e3e8f2; --sess:#2c4f8c; --org-fill:#e4f0de;
              --org:#3d6b45; --card:#fcfbf7; --card-line:#8f8a7c; --box:#f8f6f0; --faint:#6e6a5e;
              --warm-fill:#fde7cb; --warm:#c2622d; }
      @media (prefers-color-scheme: dark) {
        :root { --bg:#16150f; --ink:#ece7da; --ink-2:#cbc5b5; --muted:#a6a08f; --proc-fill:#3e3840;
                --proc:#c7a4ff; --sess-fill:#2b3140; --sess:#8fabe2; --org-fill:#384230;
                --org:#8cc39a; --card:#24231c; --card-line:#6e6a5e; --box:#1c1b15; --faint:#8d8777;
                --warm-fill:#473a26; --warm:#e0874f; } }
      .bg { fill: var(--bg); }
      .wall-sess { fill: var(--sess-fill); stroke: var(--sess); stroke-width: 1.5; }
      .wall-proc { fill: var(--proc-fill); stroke: var(--proc); stroke-width: 1.5; }
      .wall-org { fill: var(--org-fill); stroke: var(--org); stroke-width: 1.5; }
      .wall-warm { fill: var(--warm-fill); stroke: var(--warm); stroke-width: 1.5; }
      .wall-file { fill: var(--box); stroke: var(--card-line); stroke-width: 1.5; }
      .card { fill: var(--card); stroke: var(--card-line); stroke-width: 1.2; }
      .card-sess { fill: var(--card); stroke: var(--sess); stroke-width: 1.2; }
      .card-proc { fill: var(--card); stroke: var(--proc); stroke-width: 1.2; }
      .card-org { fill: var(--card); stroke: var(--org); stroke-width: 1.2; }
      .card-warm { fill: var(--card); stroke: var(--warm); stroke-width: 1.2; }
      .box { fill: var(--box); stroke: var(--card-line); stroke-width: 1.2; }
      .dash { fill: none; stroke: var(--faint); stroke-width: 1.2; stroke-dasharray: 6 4; }
      .title { font: 600 20px 'Space Grotesk', ui-sans-serif, system-ui, sans-serif; fill: var(--ink); }
      .h { font: 600 14px 'Space Grotesk', ui-sans-serif, system-ui, sans-serif; fill: var(--ink); }
      .p { font: 13px 'Space Grotesk', ui-sans-serif, system-ui, sans-serif; fill: var(--ink-2); }
      .muted { font: 12px 'Space Grotesk', ui-sans-serif, system-ui, sans-serif; fill: var(--muted); }
      .code { font: 12px 'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, monospace; fill: var(--ink); }
      .tag-sess { font: 600 11px 'Space Grotesk', ui-sans-serif, system-ui, sans-serif; fill: var(--sess); letter-spacing: .04em; }
      .tag-proc { font: 600 11px 'Space Grotesk', ui-sans-serif, system-ui, sans-serif; fill: var(--proc); letter-spacing: .04em; }
      .tag-org { font: 600 11px 'Space Grotesk', ui-sans-serif, system-ui, sans-serif; fill: var(--org); letter-spacing: .04em; }
      .tag-warm { font: 600 11px 'Space Grotesk', ui-sans-serif, system-ui, sans-serif; fill: var(--warm); letter-spacing: .04em; }
      .tag-ink { font: 600 11px 'Space Grotesk', ui-sans-serif, system-ui, sans-serif; fill: var(--ink-2); letter-spacing: .04em; }
      .edge { stroke: var(--card-line); stroke-width: 1.2; fill: none; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect x="0" y="0" width="920" height="510" rx="0" class="bg"/>
  <text x="28" y="36" class="title">Shift Manager: what each screen reads</text>
  <text x="28" y="58" class="muted">Shift Manager stores nothing of its own. Every screen is a read of the Lab.</text>
  <text x="28" y="92" class="tag-warm">SCREEN</text>
  <text x="344" y="92" class="tag-sess">READS</text>
  <rect x="28" y="104" width="268" height="52" rx="0" class="card-warm"/>
  <text x="42" y="126" class="h">Lab</text>
  <text x="42" y="144" class="code">--config</text>
  <rect x="344" y="104" width="548" height="52" rx="0" class="card"/>
  <text x="358" y="125" class="tag-ink">FLOWSTATE</text>
  <text x="508" y="125" class="p">The FlowState one fsdev.config.mts default-exports.</text>
  <text x="508" y="143" class="p">Shift Manager serves it and reads only its routes.</text>
  <path d="M296 130 L342 130" class="edge"/>
  <rect x="28" y="166" width="268" height="52" rx="0" class="card-warm"/>
  <text x="42" y="188" class="h">Shift Coordinator</text>
  <text x="42" y="206" class="code">the home screen</text>
  <rect x="344" y="166" width="548" height="52" rx="0" class="card-org"/>
  <text x="358" y="187" class="tag-org">WORKER + SESSION</text>
  <text x="508" y="187" class="p">Your session with your Shift Coordinator, under a</text>
  <text x="508" y="205" class="p">summary of what waits and runs.</text>
  <path d="M296 192 L342 192" class="edge"/>
  <rect x="28" y="228" width="268" height="52" rx="0" class="card-warm"/>
  <text x="42" y="250" class="h">Inbox</text>
  <text x="42" y="268" class="code">/inbox</text>
  <rect x="344" y="228" width="548" height="52" rx="0" class="card-sess"/>
  <text x="358" y="249" class="tag-sess">SUSPENSIONS</text>
  <text x="508" y="249" class="p">Asks in sessions you started and their runs: work</text>
  <text x="508" y="267" class="p">suspended until a user approves or answers.</text>
  <path d="M296 254 L342 254" class="edge"/>
  <rect x="28" y="290" width="268" height="52" rx="0" class="card-warm"/>
  <text x="42" y="312" class="h">Tasks</text>
  <text x="42" y="330" class="code">/tasks</text>
  <rect x="344" y="290" width="548" height="52" rx="0" class="card-proc"/>
  <text x="358" y="311" class="tag-proc">TASKS</text>
  <text x="508" y="311" class="p">Every task not done on your boards,</text>
  <text x="508" y="329" class="p">grouped by state, worker or workstream.</text>
  <path d="M296 316 L342 316" class="edge"/>
  <rect x="28" y="352" width="268" height="52" rx="0" class="card-warm"/>
  <text x="42" y="374" class="h">Roster</text>
  <text x="42" y="392" class="code">/roster</text>
  <rect x="344" y="352" width="548" height="52" rx="0" class="card-org"/>
  <text x="358" y="373" class="tag-org">ROSTER</text>
  <text x="508" y="373" class="p">Your workers. On shift and off shift are</text>
  <text x="508" y="391" class="p">worked out from their tasks and asks.</text>
  <path d="M296 378 L342 378" class="edge"/>
  <rect x="28" y="414" width="268" height="52" rx="0" class="card-warm"/>
  <text x="42" y="436" class="h">Project view</text>
  <text x="42" y="454" class="code">/p/&lt;project id&gt;</text>
  <rect x="344" y="414" width="548" height="52" rx="0" class="card-org"/>
  <text x="358" y="435" class="tag-org">PROJECT</text>
  <text x="508" y="435" class="p">Its workstreams and their progress, your own boards,</text>
  <text x="508" y="453" class="p">and your own project coordinator to talk to it.</text>
  <path d="M296 440 L342 440" class="edge"/>
  <text x="28" y="490" class="muted">Green: Workforce. Purple: Orchestration. Blue: Core. Grey: Engine.</text>
</svg>
