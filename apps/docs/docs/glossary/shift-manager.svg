<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 572" role="img" aria-labelledby="title desc">
  <title id="title">Shift Manager: what each screen reads</title>
  <desc id="desc">Each Shift Manager screen beside what it reads. A Lab is the FlowState an fsdev config exports. The Shift Coordinator is your session with the chief of staff worker. Inbox lists asks, runs suspended on a person. Tasks lists tasks on every mailbox board. Roster lists inventory workers with a derived status. The workstream view shows a mailbox and its boards. The project view shows a project row and its room.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" style="fill:var(--card-line)"/>
    </marker>
    <style>
      :root { --bg:#ffffff; --ink:#0f172a; --ink-2:#334155; --muted:#64748b;
              --proc-fill:#faf5ff; --proc:#7e22ce; --sess-fill:#eff6ff; --sess:#1d4ed8;
              --org-fill:#f0fdf4; --org:#15803d; --card:#ffffff; --card-line:#334155; --box:#f8fafc;
              --faint:#94a3b8; --warm-fill:#fff7ed; --warm:#c2410c; }
      @media (prefers-color-scheme: dark) {
        :root { --bg:#0e0e14; --ink:#e5e7eb; --ink-2:#cbd5e1; --muted:#94a3b8;
                --proc-fill:#1d1030; --proc:#c084fc; --sess-fill:#0f1a33; --sess:#60a5fa;
                --org-fill:#0b2016; --org:#4ade80; --card:#14141c; --card-line:#64748b; --box:#181822;
                --faint:#64748b; --warm-fill:#2a1608; --warm:#fb923c; } }
      .bg { fill: var(--bg); }
      .wall-sess { fill: var(--sess-fill); stroke: var(--sess); stroke-width: 2; }
      .wall-proc { fill: var(--proc-fill); stroke: var(--proc); stroke-width: 2; }
      .wall-org { fill: var(--org-fill); stroke: var(--org); stroke-width: 2; }
      .wall-warm { fill: var(--warm-fill); stroke: var(--warm); stroke-width: 2; }
      .wall-file { fill: var(--box); stroke: var(--card-line); stroke-width: 2; }
      .card { fill: var(--card); stroke: var(--card-line); stroke-width: 1.5; }
      .card-sess { fill: var(--card); stroke: var(--sess); stroke-width: 1.5; }
      .card-proc { fill: var(--card); stroke: var(--proc); stroke-width: 1.5; }
      .card-org { fill: var(--card); stroke: var(--org); stroke-width: 1.5; }
      .card-warm { fill: var(--card); stroke: var(--warm); stroke-width: 1.5; }
      .box { fill: var(--box); stroke: var(--card-line); stroke-width: 1.5; }
      .dash { fill: none; stroke: var(--faint); stroke-width: 1.5; stroke-dasharray: 6 4; }
      .title { font: 700 20px ui-sans-serif, system-ui, sans-serif; fill: var(--ink); }
      .h { font: 700 14px ui-sans-serif, system-ui, sans-serif; fill: var(--ink); }
      .p { font: 13px ui-sans-serif, system-ui, sans-serif; fill: var(--ink-2); }
      .muted { font: 12px ui-sans-serif, system-ui, sans-serif; fill: var(--muted); }
      .code { font: 12px ui-monospace, SFMono-Regular, Menlo, monospace; fill: var(--ink); }
      .tag-sess { font: 700 11px ui-sans-serif, system-ui, sans-serif; fill: var(--sess); letter-spacing: .04em; }
      .tag-proc { font: 700 11px ui-sans-serif, system-ui, sans-serif; fill: var(--proc); letter-spacing: .04em; }
      .tag-org { font: 700 11px ui-sans-serif, system-ui, sans-serif; fill: var(--org); letter-spacing: .04em; }
      .tag-warm { font: 700 11px ui-sans-serif, system-ui, sans-serif; fill: var(--warm); letter-spacing: .04em; }
      .tag-ink { font: 700 11px ui-sans-serif, system-ui, sans-serif; fill: var(--ink-2); letter-spacing: .04em; }
      .edge { stroke: var(--card-line); stroke-width: 1.5; fill: none; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect x="0" y="0" width="920" height="572" rx="16" class="bg"/>
  <text x="28" y="36" class="title">Shift Manager: what each screen reads</text>
  <text x="28" y="58" class="muted">Shift Manager stores nothing of its own. Every screen is a read of the Lab.</text>
  <text x="28" y="92" class="tag-warm">SCREEN</text>
  <text x="344" y="92" class="tag-sess">READS</text>
  <rect x="28" y="104" width="268" height="52" rx="10" class="card-warm"/>
  <text x="42" y="126" class="h">Lab</text>
  <text x="42" y="144" class="code">--config or --team</text>
  <rect x="344" y="104" width="548" height="52" rx="10" class="card"/>
  <text x="358" y="125" class="tag-ink">FLOWSTATE</text>
  <text x="508" y="125" class="p">The FlowState one fsdev.config.mts default-exports.</text>
  <text x="508" y="143" class="p">Shift Manager serves it and reads only its routes.</text>
  <path d="M296 130 L342 130" class="edge"/>
  <rect x="28" y="166" width="268" height="52" rx="10" class="card-warm"/>
  <text x="42" y="188" class="h">Shift Coordinator</text>
  <text x="42" y="206" class="code">the home screen</text>
  <rect x="344" y="166" width="548" height="52" rx="10" class="card-org"/>
  <text x="358" y="187" class="tag-org">WORKER + SESSION</text>
  <text x="508" y="187" class="p">Your session with the Lab's chief of staff, an org</text>
  <text x="508" y="205" class="p">worker, under a summary of what waits and runs.</text>
  <path d="M296 192 L342 192" class="edge"/>
  <rect x="28" y="228" width="268" height="52" rx="10" class="card-warm"/>
  <text x="42" y="250" class="h">Inbox</text>
  <text x="42" y="268" class="code">/inbox</text>
  <rect x="344" y="228" width="548" height="52" rx="10" class="card-sess"/>
  <text x="358" y="249" class="tag-sess">SUSPENSIONS</text>
  <text x="508" y="249" class="p">Asks in sessions you started and their runs: work</text>
  <text x="508" y="267" class="p">suspended until a person approves or answers.</text>
  <path d="M296 254 L342 254" class="edge"/>
  <rect x="28" y="290" width="268" height="52" rx="10" class="card-warm"/>
  <text x="42" y="312" class="h">Tasks</text>
  <text x="42" y="330" class="code">/tasks</text>
  <rect x="344" y="290" width="548" height="52" rx="10" class="card-proc"/>
  <text x="358" y="311" class="tag-proc">TASKS</text>
  <text x="508" y="311" class="p">Every task not done, on every mailbox board,</text>
  <text x="508" y="329" class="p">grouped by state, worker or workstream.</text>
  <path d="M296 316 L342 316" class="edge"/>
  <rect x="28" y="352" width="268" height="52" rx="10" class="card-warm"/>
  <text x="42" y="374" class="h">Roster</text>
  <text x="42" y="392" class="code">/roster</text>
  <rect x="344" y="352" width="548" height="52" rx="10" class="card-org"/>
  <text x="358" y="373" class="tag-org">INVENTORY</text>
  <text x="508" y="373" class="p">Workers in the inventory. On shift, on call and off</text>
  <text x="508" y="391" class="p">shift are worked out from their tasks and asks.</text>
  <path d="M296 378 L342 378" class="edge"/>
  <rect x="28" y="414" width="268" height="52" rx="10" class="card-warm"/>
  <text x="42" y="436" class="h">Workstream view</text>
  <text x="42" y="454" class="code">/w/&lt;mailbox id&gt;</text>
  <rect x="344" y="414" width="548" height="52" rx="10" class="card-org"/>
  <text x="358" y="435" class="tag-org">MAILBOX + BOARDS</text>
  <text x="508" y="435" class="p">A mailbox's transcript, its boards, and its</text>
  <text x="508" y="453" class="p">charter as the Brief tab.</text>
  <path d="M296 440 L342 440" class="edge"/>
  <rect x="28" y="476" width="268" height="52" rx="10" class="card-warm"/>
  <text x="42" y="498" class="h">Project view</text>
  <text x="42" y="516" class="code">/p/&lt;project id&gt;</text>
  <rect x="344" y="476" width="548" height="52" rx="10" class="card-org"/>
  <text x="358" y="497" class="tag-org">PROJECT + ROOM</text>
  <text x="508" y="497" class="p">A project row, the boards of its workstreams,</text>
  <text x="508" y="515" class="p">and its room, read through your own session.</text>
  <path d="M296 502 L342 502" class="edge"/>
  <text x="28" y="552" class="muted">Green: Workforce. Purple: Orchestration. Blue: Core. Grey: Engine.</text>
</svg>
