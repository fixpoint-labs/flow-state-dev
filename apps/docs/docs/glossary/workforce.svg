<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 34 920 685">
<defs>
<pattern id="hatch" width="5" height="5" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line class="hatch-line" x1="0" y1="0" x2="0" y2="5"/></pattern>
<marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ink" d="M0,0 L10,5 L0,10 z"/></marker>
</defs>
<text class="lb" x="60" y="64">WORKFORCE TERM</text>
<text class="lb" x="344" y="64">BUILT FROM</text>
<rect class="solid" x="60" y="78" width="236" height="60"/>
<text class="nm" x="74" y="105">Worker</text>
<text class="sub" x="74" y="124">a resource, one owner</text>
<rect fill="url(#hatch)" x="344" y="78" width="548" height="10"/><line class="thin" x1="344" y1="88.5" x2="892" y2="88.5"/>
<rect class="solid" x="344" y="78" width="548" height="60"/>
<text class="lb" x="358" y="110">RESOURCE</text>
<text class="lb" x="358" y="126">CORE</text>
<text class="t" x="496" y="110">A resource in one user's scope that names its worker</text>
<text class="t" x="496" y="127">flow, with its own instructions, skills and tools.</text>
<line class="ln" x1="296" y1="108" x2="343" y2="108" marker-end="url(#ah)"/>
<rect class="solid" x="60" y="146" width="236" height="60"/>
<text class="nm" x="74" y="173">Standard worker</text>
<text class="c" x="74" y="192">WORKER.md</text>
<rect class="solid" x="344" y="146" width="548" height="60"/>
<text class="lb" x="358" y="178">FILES</text>
<text class="lb" x="358" y="194">YOURS</text>
<text class="t" x="496" y="178">Read from the installation's files, the same for</text>
<text class="t" x="496" y="195">every user. Fork one to make a worker of your own.</text>
<line class="ln" x1="296" y1="176" x2="343" y2="176" marker-end="url(#ah)"/>
<rect class="solid" x="60" y="214" width="236" height="60"/>
<text class="nm" x="74" y="241">Roster</text>
<text class="sub" x="74" y="260">one user's workers</text>
<rect fill="url(#hatch)" x="344" y="214" width="548" height="10"/><line class="thin" x1="344" y1="224.5" x2="892" y2="224.5"/>
<rect class="solid" x="344" y="214" width="548" height="60"/>
<text class="lb" x="358" y="246">RESOURCE COLL.</text>
<text class="lb" x="358" y="262">CORE</text>
<text class="t" x="496" y="246">One user's workers, standard ones included. A</text>
<text class="t" x="496" y="263">user's own workers come back after a restart.</text>
<line class="ln" x1="296" y1="244" x2="343" y2="244" marker-end="url(#ah)"/>
<rect class="solid" x="60" y="282" width="236" height="60"/>
<text class="nm" x="74" y="309">Coordinator</text>
<text class="c" x="74" y="328">flow: coordinator</text>
<rect fill="url(#hatch)" x="344" y="282" width="548" height="10"/><line class="thin" x1="344" y1="292.5" x2="892" y2="292.5"/>
<rect class="solid" x="344" y="282" width="548" height="60"/>
<text class="lb" x="358" y="314">WORKER</text>
<text class="lb" x="358" y="330">WORKFORCE</text>
<text class="t" x="496" y="314">A worker on the coordinator flow. Its delegates,</text>
<text class="t" x="496" y="331">from the same roster, are in its session.</text>
<line class="ln" x1="296" y1="312" x2="343" y2="312" marker-end="url(#ah)"/>
<rect class="solid" x="60" y="350" width="236" height="60"/>
<text class="nm" x="74" y="377">Project</text>
<text class="sub" x="74" y="396">a body of work</text>
<rect fill="url(#hatch)" x="344" y="350" width="548" height="10"/><line class="thin" x1="344" y1="360.5" x2="892" y2="360.5"/>
<rect class="solid" x="344" y="350" width="548" height="60"/>
<text class="lb" x="358" y="382">RESOURCE COLL.</text>
<text class="lb" x="358" y="398">CORE</text>
<text class="t" x="496" y="382">One row, in the user's scope when private or the</text>
<text class="t" x="496" y="399">org's when shared: title, brief, owner.</text>
<line class="ln" x1="296" y1="380" x2="343" y2="380" marker-end="url(#ah)"/>
<rect class="solid" x="60" y="418" width="236" height="60"/>
<text class="nm" x="74" y="445">Workstream</text>
<text class="sub" x="74" y="464">one owner each</text>
<rect fill="url(#hatch)" x="344" y="418" width="548" height="10"/><line class="thin" x1="344" y1="428.5" x2="892" y2="428.5"/>
<rect class="solid" x="344" y="418" width="548" height="60"/>
<text class="lb" x="358" y="450">ENTRY + SESSION</text>
<text class="lb" x="358" y="466">CORE</text>
<text class="t" x="496" y="450">An entry in a shared project that only its owner</text>
<text class="t" x="496" y="467">writes, plus its lead's workstream session.</text>
<line class="ln" x1="296" y1="448" x2="343" y2="448" marker-end="url(#ah)"/>
<rect class="solid" x="60" y="486" width="236" height="60"/>
<text class="nm" x="74" y="513">Project coordinator</text>
<text class="sub" x="74" y="532">one per user per project</text>
<rect fill="url(#hatch)" x="344" y="486" width="548" height="10"/><line class="thin" x1="344" y1="496.5" x2="892" y2="496.5"/>
<rect class="solid" x="344" y="486" width="548" height="60"/>
<text class="lb" x="358" y="518">WORKER SESSION</text>
<text class="lb" x="358" y="534">WORKFORCE</text>
<text class="t" x="496" y="518">A coordinator's session, one per user per project.</text>
<text class="t" x="496" y="535">It hands work only to that user's own workstreams.</text>
<line class="ln" x1="296" y1="516" x2="343" y2="516" marker-end="url(#ah)"/>
<path class="ln" d="M60 304 H40 V108 H59" marker-end="url(#ah)"/><rect class="ground" x="26.8" y="203" width="26.4" height="15"/><text class="plate" x="40" y="214" text-anchor="middle">01</text>
<path class="ln" d="M60 516 H40 V322 H59" marker-end="url(#ah)"/><rect class="ground" x="26.8" y="407" width="26.4" height="15"/><text class="plate" x="40" y="418" text-anchor="middle">02</text>
<line class="hi" x1="0" y1="570" x2="920" y2="570"/>
<text class="n" x="28" y="596">01</text>
<text class="t" x="60" y="596">A coordinator is a worker: a resource in one user's scope that names the coordinator flow.</text>
<text class="n" x="28" y="621">02</text>
<text class="t" x="60" y="621">A project coordinator is a coordinator's session, one per user per project.</text>
<text class="n" x="28" y="646">03</text>
<text class="t" x="60" y="646">Workforce adds files and rules. Everything lands in a Core piece, in your files, or in a Workforce term above it;</text>
<text class="t" x="60" y="663">the second label on the right says which.</text>
<line class="ln" x1="28" y1="691" x2="54" y2="691" marker-end="url(#ah)"/><text class="lb" x="62" y="695">IS MADE OF</text><rect fill="url(#hatch)" x="173.0" y="685" width="26" height="11"/><rect class="thin" x="173.0" y="685" width="26" height="11"/><text class="lb" x="207.0" y="695">OUTLIVES THE REQUEST</text>
</svg>
