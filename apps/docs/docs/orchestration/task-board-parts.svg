<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 34 920 595">
<defs>
<pattern id="hatch" width="5" height="5" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line class="hatch-line" x1="0" y1="0" x2="0" y2="5"/></pattern>
<marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ink" d="M0,0 L10,5 L0,10 z"/></marker>
</defs>
<rect class="solid" x="28" y="56" width="296" height="344"/>
<text class="lb" x="40" y="80">HOLDS THE ROWS</text>
<text class="nm" x="40" y="102">The task collection</text>
<text class="sub" x="40" y="120">where the rows live</text>
<line class="hi" x1="28" y1="134" x2="324" y2="134"/>
<rect class="thin" x="40" y="146" width="272" height="120"/>
<text class="lb" x="52" y="166">ONE TASK</text>
<text class="c" x="52" y="188">id · goal · assignee · deps</text>
<text class="c" x="52" y="206">status · priority · run</text>
<text class="c" x="52" y="232">claimedBy</text>
<text class="sub" x="52" y="250">server only; the rest streams to pages</text>
<text class="lb" x="40" y="294">BACKING · PICK ONE</text>
<line class="dash" x1="40" y1="312" x2="66" y2="312"/>
<text class="t" x="76" y="316">request</text>
<text class="sub" x="156" y="316">default · one request</text>
<rect fill="url(#hatch)" x="40" y="328" width="26" height="11"/><rect class="thin" x="40" y="328" width="26" height="11"/>
<text class="t" x="76" y="338">durable</text>
<text class="sub" x="156" y="338">defineTaskCollection</text>
<line class="dash" x1="40" y1="356" x2="66" y2="356"/>
<text class="t" x="76" y="360">sequencer</text>
<text class="sub" x="156" y="360">one drain call</text>
<text class="t" x="76" y="382">factory</text>
<text class="sub" x="156" y="382">your own store</text>
<rect class="solid" x="364" y="56" width="220" height="344"/>
<text class="lb" x="376" y="80">DRAINS</text>
<text class="nm" x="376" y="102">The board</text>
<text class="sub" x="376" y="120">a handle in your flow</text>
<line class="hi" x1="364" y1="134" x2="584" y2="134"/>
<rect class="thin" x="376" y="146" width="196" height="110"/>
<text class="c" x="386" y="170">taskBoard({ name })</text>
<text class="t" x="386" y="194">drain · capability</text>
<text class="t" x="386" y="212">boardId</text>
<text class="sub" x="386" y="240">holds no tasks itself</text>
<text class="t" x="376" y="356">Stops when a termination</text>
<text class="t" x="376" y="372">rule says so.</text>
<rect class="solid" x="640" y="56" width="252" height="344"/>
<text class="lb" x="652" y="80">BLOCKS</text>
<text class="nm" x="652" y="102">Workers</text>
<text class="sub" x="652" y="120">blocks, keyed by assignee</text>
<line class="hi" x1="640" y1="134" x2="892" y2="134"/>
<rect class="thin" x="652" y="146" width="228" height="96"/>
<text class="c" x="664" y="168">workers: {</text>
<text class="c" x="680" y="186">"market-analyst": …,</text>
<text class="c" x="664" y="204">}</text>
<text class="sub" x="664" y="228">plus an optional defaultWorker</text>
<rect class="thin" x="652" y="254" width="228" height="72"/>
<text class="t" x="664" y="276">An assignee that dispatches</text>
<text class="sub" x="664" y="296">runs the task in a dispatch run,</text>
<text class="sub" x="664" y="312">a session of its own</text>
<text class="t" x="652" y="352">A worker gets taskId, goal,</text>
<text class="t" x="652" y="368">input, and its deps' outputs.</text>
<text class="sub" x="652" y="388">not the row itself</text>
<line class="ln" x1="325" y1="200" x2="363" y2="200" marker-end="url(#ah)"/>
<rect class="ground" x="331.6" y="193" width="24.7" height="15"/><text class="plate" x="344" y="204" text-anchor="middle">01</text>
<line class="ln" x1="585" y1="200" x2="639" y2="200" marker-end="url(#ah)"/>
<rect class="ground" x="599.6" y="193" width="24.7" height="15"/><text class="plate" x="612" y="204" text-anchor="middle">02</text>
<line class="ln" x1="639" y1="290" x2="585" y2="290" marker-end="url(#ah)"/>
<rect class="ground" x="599.6" y="283" width="24.7" height="15"/><text class="plate" x="612" y="294" text-anchor="middle">03</text>
<line class="ln" x1="363" y1="290" x2="325" y2="290" marker-end="url(#ah)"/>
<rect class="ground" x="331.6" y="283" width="24.7" height="15"/><text class="plate" x="344" y="294" text-anchor="middle">03</text>
<circle cx="168" cy="400" r="2.6" class="ink"/>
<path class="ln" d="M168 400 V426 H766 V402" marker-end="url(#ah)"/>
<rect class="ground" x="418.3" y="419" width="111.4" height="15"/><text class="plate" x="474" y="430" text-anchor="middle">04 NAMES A KEY</text>
<line class="hi" x1="0" y1="452" x2="920" y2="452"/>
<text class="n" x="28" y="478">01</text>
<text class="t" x="60" y="478">The board claims ready rows from the collection. It is a handle, not the storage: it holds no tasks itself.</text>
<text class="n" x="28" y="503">02</text>
<text class="t" x="60" y="503">It hands each row to a worker. The worker's input is built from the row, not the row itself.</text>
<text class="n" x="28" y="528">03</text>
<text class="t" x="60" y="528">The worker's result is written back to the row, and declined if the task was already settled.</text>
<text class="n" x="28" y="553">04</text>
<text class="t" x="60" y="553">assignee names a key in the workers map. It is not a flow id or a Workforce assignee.</text>
<text class="n" x="28" y="578">05</text>
<text class="t" x="60" y="578">request and sequencer end with the run. A durable collection outlives the request.</text>
<line class="ln" x1="28" y1="605" x2="54" y2="605" marker-end="url(#ah)"/>
<text class="lb" x="62" y="609">A STEP OR A REFERENCE</text>
<line class="dash" x1="259.5" y1="605" x2="285.5" y2="605"/>
<text class="lb" x="293.5" y="609">ENDS WITH THE RUN</text>
<rect fill="url(#hatch)" x="461.0" y="599" width="26" height="11"/><rect class="thin" x="461.0" y="599" width="26" height="11"/>
<text class="lb" x="495.0" y="609">OUTLIVES THE REQUEST</text>
</svg>
