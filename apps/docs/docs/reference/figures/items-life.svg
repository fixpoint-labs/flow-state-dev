<text class="plate" fill="#1b1a15" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="10.5px" font-weight="500" letter-spacing="1px" text-anchor="middle" x="460" y="194">01</text>
<rect class="ground" fill="#f0ece1" x="457.7" y="228.5" width="24.6" height="15"/>
<text class="plate" fill="#1b1a15" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="10.5px" font-weight="500" letter-spacing="1px" text-anchor="middle" x="470" y="240">02</text>
<line class="hi" fill="none" stroke="rgba(27, 26, 21, 0.25)" stroke-width="1" x1="0" y1="266" x2="920" y2="266"/>
<text class="n" fill="#1b1a15" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="11px" font-weight="500" x="28" y="290">01</text>
<text class="t" fill="#3d3a32" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="12px" font-weight="500" x="56" y="290">A message, data or status item a block emits skips the middle: item.added and item.done arrive together.</text>
<text class="n" fill="#1b1a15" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="11px" font-weight="500" x="28" y="315">02</text>
<text class="t" fill="#3d3a32" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="12px" font-weight="500" x="56" y="315">A keyed data item emitted again keeps its id and goes back to in_progress, then item.done again.</text>
<text class="n" fill="#1b1a15" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="11px" font-weight="500" x="28" y="340">03</text>
<text class="t" fill="#3d3a32" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="12px" font-weight="500" x="56" y="340">item.updated can arrive at any point, even after item.done, and replaces the top-level keys it names.</text>
<g id="key">
<line class="ln" fill="none" stroke="#1b1a15" stroke-width="1.3" x1="28" y1="367" x2="54" y2="367" marker-end="url(#ah)"/>
<text class="lb" fill="#57544a" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="10px" font-weight="500" letter-spacing="1.5px" x="62" y="371">MOVES TO</text>
