<text class="lb" fill="#57544a" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="10px" font-weight="500" letter-spacing="1.5px" x="188" y="371">ONLY IN ONE CASE</text>
<rect class="hl" fill="#e8f551" x="340" y="361" width="26" height="11"/>
<text class="lb" fill="#57544a" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="10px" font-weight="500" letter-spacing="1.5px" x="374" y="371">THE WHOLE ITEM</text>
