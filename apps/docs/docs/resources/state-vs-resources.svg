<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 34 920 707">
<defs>
<pattern id="hatch" width="5" height="5" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line class="hatch-line" x1="0" y1="0" x2="0" y2="5"/></pattern>
<marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ink" d="M0,0 L10,5 L0,10 z"/></marker>
</defs>
<rect class="solid" x="28" y="56" width="864" height="44"/>
<text class="nm" x="40" y="83">The browser</text>
<text class="sub" x="160" y="82">sees neither unless a client config exposes it</text>
<rect fill="url(#hatch)" x="28" y="148" width="300" height="10"/><line class="thin" x1="28" y1="158.5" x2="328" y2="158.5"/>
<rect class="solid" x="28" y="148" width="300" height="270"/>
<text class="lb" x="40" y="180">RECORD 01 · SESSION SCOPE</text>
<text class="nm" x="40" y="202">Session state</text>
<text class="sub" x="40" y="220">on the session record</text>
<line class="hi" x1="28" y1="232" x2="328" y2="232"/>
<rect class="thin" x="40" y="244" width="276" height="56"/>
<text class="c" x="52" y="263">mode: "agent"</text>
<line class="hi" x1="40" y1="272" x2="316" y2="272"/>
<text class="c" x="52" y="291">messageCount: 4</text>
<text class="t" x="40" y="324">Flat fields. One namespace that</text>
<text class="t" x="40" y="340">every block in the flow shares.</text>
<text class="t" x="40" y="364">Flags, counters, small settings</text>
<line class="hi" x1="28" y1="380" x2="328" y2="380"/>
<text class="c" x="40" y="404">ctx.session.state</text>
<rect fill="url(#hatch)" x="372" y="148" width="520" height="10"/><line class="thin" x1="372" y1="158.5" x2="892" y2="158.5"/>
<rect class="solid" x="372" y="148" width="520" height="270"/>
<text class="lb" x="384" y="180">RECORDS 02 · SESSION SCOPE</text>
<text class="nm" x="384" y="202">Resources</text>
<text class="sub" x="384" y="220">their own store, keyed by scope, then path</text>
<line class="hi" x1="372" y1="232" x2="892" y2="232"/>
<rect class="thin" x="384" y="244" width="244" height="162"/>
<text class="nm" x="396" y="266">draft</text>
<text class="c" x="396" y="286">session/draft</text>
<line class="hi" x1="384" y1="298" x2="628" y2="298"/>
<text class="lb" x="396" y="316">CONTENT</text>
<text class="t" x="460" y="316">the body</text>
<line class="hi" x1="384" y1="326" x2="628" y2="326"/>
<text class="lb" x="396" y="344">STATE</text>
<text class="t" x="460" y="344">its own typed fields</text>
<line class="hi" x1="384" y1="354" x2="628" y2="354"/>
<text class="c" x="396" y="376">ctx.resources.draft</text>
<text class="sub" x="396" y="394">state versioned; content is not</text>
<rect class="thin" x="640" y="244" width="240" height="162"/>
<text class="nm" x="652" y="266">One item of a collection</text>
<text class="c" x="652" y="286">session/files/readme.md</text>
<line class="hi" x1="640" y1="298" x2="880" y2="298"/>
<text class="lb" x="652" y="316">CONTENT</text>
<text class="t" x="716" y="316">the body</text>
<line class="hi" x1="640" y1="326" x2="880" y2="326"/>
<text class="lb" x="652" y="344">STATE</text>
<text class="t" x="716" y="344">its own typed fields</text>
<line class="hi" x1="640" y1="354" x2="880" y2="354"/>
<text class="sub" x="652" y="376">same shape, one record per item</text>
<text class="sub" x="652" y="394">documents, plans, artifacts</text>
<rect class="solid" x="28" y="458" width="300" height="48"/>
<text class="nm" x="40" y="480">Blocks</text>
<text class="sub" x="40" y="497">every block in the flow</text>
<rect class="solid" x="384" y="458" width="244" height="48"/>
<text class="nm" x="396" y="480">A generator</text>
<text class="sub" x="396" y="497">llmReadable · llmWritable</text>
<line class="ln" x1="178" y1="457" x2="178" y2="419" marker-start="url(#ah)" marker-end="url(#ah)"/>
<rect class="ground" x="165.7" y="431" width="24.7" height="15"/><text class="plate" x="178" y="442" text-anchor="middle">01</text>
<path class="ln" d="M329 482 H350 V325 H383" marker-start="url(#ah)" marker-end="url(#ah)"/>
<rect class="ground" x="337.6" y="431" width="24.7" height="15"/><text class="plate" x="350" y="442" text-anchor="middle">02</text>
<line class="ln-dash" x1="506" y1="457" x2="506" y2="407" marker-start="url(#ah)" marker-end="url(#ah)"/>
<rect class="ground" x="457.4" y="431" width="97.2" height="15"/><text class="plate" x="506" y="442" text-anchor="middle">03 IF MARKED</text>
<line class="ln-dash" x1="178" y1="147" x2="178" y2="101" marker-end="url(#ah)"/>
<rect class="ground" x="165.7" y="117" width="24.7" height="15"/><text class="plate" x="178" y="128" text-anchor="middle">04</text>
<line class="ln-dash" x1="632" y1="147" x2="632" y2="101" marker-end="url(#ah)"/>
<rect class="ground" x="619.6" y="117" width="24.7" height="15"/><text class="plate" x="632" y="128" text-anchor="middle">04</text>
<line class="hi" x1="0" y1="530" x2="920" y2="530"/>
<text class="n" x="28" y="556">01</text>
<text class="t" x="60" y="556">Blocks read and write session state through ctx.session.state.</text>
<text class="n" x="28" y="581">02</text>
<text class="t" x="60" y="581">Blocks read and write a resource through ctx.resources. A resource is not a field of session state.</text>
<text class="t" x="60" y="598">Writing one never touches the other.</text>
<text class="n" x="28" y="623">03</text>
<text class="t" x="60" y="623">A generator sees a resource only when it is llmReadable, and writes it only when llmWritable.</text>
<text class="n" x="28" y="648">04</text>
<text class="t" x="60" y="648">The browser sees neither unless a client config exposes it.</text>
<text class="n" x="28" y="673">05</text>
<text class="t" x="60" y="673">Both are session-scoped. Neither one holds the other. A user or org resource can also be kept per flow</text>
<text class="t" x="60" y="690">copy, with flowIsolation.</text>
<line class="ln" x1="28" y1="717" x2="54" y2="717" marker-end="url(#ah)"/>
<text class="lb" x="62" y="721">READS AND WRITES</text>
<line class="ln-dash" x1="222.0" y1="717" x2="248.0" y2="717" marker-end="url(#ah)"/>
<text class="lb" x="256.0" y="721">ONLY WHEN MARKED OR EXPOSED</text>
<rect fill="url(#hatch)" x="498.5" y="711" width="26" height="11"/><rect class="thin" x="498.5" y="711" width="26" height="11"/>
<text class="lb" x="532.5" y="721">OUTLIVES THE REQUEST</text>
</svg>
