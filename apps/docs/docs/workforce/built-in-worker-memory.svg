<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 478" role="img" aria-labelledby="title desc">
  <title id="title">What a built-in worker keeps, and who shares it</title>
  <desc id="desc">One conversation is one session: it holds the recent turns, up to the history window of 50, and the skills made active in it; nothing in it reaches another conversation. Each worker's skills are stored per user and per worker, so two workers never read each other's and two people do not share them. Memory is off until you add it; when on, it is kept per user and shared by the workers serving that user. isolateUserState keeps it apart from other flows, not from other workers on the same flow.</desc>
  <defs>
    <style>
      :root { --bg:#f0ece1; --ink:#1b1a15; --ink-2:#3d3a32; --muted:#57544a; --proc-fill:#efe5fc;
              --proc:#6b4fa0; --sess-fill:#e3e8f2; --sess:#2c4f8c; --org-fill:#e4f0de;
              --org:#3d6b45; --card:#fcfbf7; --card-line:#8f8a7c; --box:#f8f6f0; --faint:#6e6a5e;
              --no:#a83e28; }
      @media (prefers-color-scheme: dark) {
        :root { --bg:#16150f; --ink:#ece7da; --ink-2:#cbc5b5; --muted:#a6a08f; --proc-fill:#3e3840;
                --proc:#c7a4ff; --sess-fill:#2b3140; --sess:#8fabe2; --org-fill:#384230;
                --org:#8cc39a; --card:#24231c; --card-line:#6e6a5e; --box:#1c1b15; --faint:#8d8777;
                --no:#e27a5f; } }
      .bg { fill: var(--bg); }
      .wall-sess { fill: var(--sess-fill); stroke: var(--sess); stroke-width: 1.5; }
      .wall-org { fill: var(--org-fill); stroke: var(--org); stroke-width: 1.5; }
      .out { fill: var(--box); stroke: var(--faint); stroke-width: 1.5; stroke-dasharray: 6 4; }
      .box { fill: var(--box); stroke: var(--card-line); stroke-width: 1.2; }
      .title { font: 600 20px 'Space Grotesk', ui-sans-serif, system-ui, sans-serif; fill: var(--ink); }
      .h { font: 600 14px 'Space Grotesk', ui-sans-serif, system-ui, sans-serif; fill: var(--ink); }
      .p { font: 13px 'Space Grotesk', ui-sans-serif, system-ui, sans-serif; fill: var(--ink-2); }
      .muted { font: 12px 'Space Grotesk', ui-sans-serif, system-ui, sans-serif; fill: var(--muted); }
      .code { font: 12px 'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, monospace; fill: var(--ink); }
    </style>
  </defs>

  <rect x="0" y="0" width="920" height="478" rx="0" class="bg"/>

  <text x="28" y="36" class="title">What a built-in worker keeps, and who shares it</text>
  <text x="28" y="58" class="muted">Each lives in its own place.</text>

  <!-- Conversation -->
  <rect x="28" y="84" width="272" height="250" rx="0" class="wall-sess"/>
  <text x="44" y="108" class="h">One conversation</text>
  <text x="44" y="126" class="muted">A session: a direct chat, or a task session</text>
  <text x="44" y="158" class="p">The recent turns</text>
  <text x="44" y="176" class="muted">Up to the history window, 50 by default.</text>
  <text x="44" y="192" class="muted">Older turns fall out. Nothing summarizes.</text>
  <text x="44" y="222" class="p">Skills made active here</text>
  <text x="44" y="240" class="code">activeSkills</text>
  <text x="44" y="276" class="muted">Nothing said here reaches the worker's</text>
  <text x="44" y="292" class="muted">other conversations.</text>

  <!-- Skills -->
  <rect x="320" y="84" width="272" height="250" rx="0" class="wall-org"/>
  <text x="336" y="108" class="h">One worker, one user</text>
  <text x="336" y="126" class="muted">Stored at user scope</text>
  <text x="336" y="158" class="p">The worker's skills</text>
  <text x="336" y="176" class="code">skills</text>
  <text x="336" y="198" class="muted">Seeded from the folders around</text>
  <text x="336" y="214" class="muted">its WORKER.md</text>
  <text x="336" y="250" class="p">Two workers never read each</text>
  <text x="336" y="268" class="p">other's. Two people do</text>
  <text x="336" y="286" class="p">not share one worker's skills.</text>

  <!-- Memory -->
  <rect x="612" y="84" width="280" height="250" rx="0" class="out"/>
  <text x="628" y="108" class="h">One user</text>
  <text x="628" y="126" class="muted">Memory: off until you add it</text>
  <text x="628" y="158" class="p">What the worker remembers</text>
  <text x="628" y="176" class="p">about the user it serves</text>
  <text x="628" y="208" class="muted">Default: one store, shared by the</text>
  <text x="628" y="224" class="muted">workers serving that user</text>
  <text x="628" y="256" class="code">isolateUserState: true</text>
  <text x="628" y="274" class="muted">Kept apart from other flows. Workers</text>
  <text x="628" y="290" class="muted">on the same flow share it.</text>

  <!-- Not a copy -->
  <rect x="28" y="354" width="864" height="104" rx="0" class="box"/>
  <text x="44" y="378" class="h">Not a copy</text>
  <text x="44" y="402" class="p">A conversation holds which skills are active in it. The skills themselves live with the worker, per user.</text>
  <text x="44" y="422" class="p">Memory is about a user, not a conversation. A new conversation starts with no turns but the same memory.</text>
  <text x="44" y="444" class="muted">isolateUserState is set once for the whole flow. A memory tier can set its own flowIsolation to differ from it.</text>
</svg>
