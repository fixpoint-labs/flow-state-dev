<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 640" role="img" aria-label="Where each part of a channel lives. The channel kind is one registered instance, and every channel is a session on it. The support.desk session holds its members and charter in session state, and its transcript as channel-post items. A woken seat answers from a session of its own. The board rows and the inventory row are organization data outside the session. The session holds no board, the inventory's members list is a copy for finding channels, and only the seat's answer line reaches the channel.">
  <style>
    :root { --bg:#ffffff; --ink:#0f172a; --ink-2:#334155; --muted:#64748b;
            --proc-fill:#faf5ff; --proc:#7e22ce; --sess-fill:#eff6ff; --sess:#1d4ed8;
            --org-fill:#f0fdf4; --org:#15803d; --card:#ffffff; --card-line:#334155; --box:#f8fafc; }
    @media (prefers-color-scheme: dark) {
      :root { --bg:#0e0e14; --ink:#e5e7eb; --ink-2:#cbd5e1; --muted:#94a3b8;
              --proc-fill:#1d1030; --proc:#c084fc; --sess-fill:#0f1a33; --sess:#60a5fa;
              --org-fill:#0b2016; --org:#4ade80; --card:#14141c; --card-line:#64748b; --box:#181822; } }
    .bg { fill:var(--bg); }
    .wall-proc { fill:var(--proc-fill); stroke:var(--proc); stroke-width:2; }
    .wall-sess { fill:var(--sess-fill); stroke:var(--sess); stroke-width:2; }
    .wall-org { fill:var(--org-fill); stroke:var(--org); stroke-width:2; }
    .card { fill:var(--card); stroke:var(--card-line); stroke-width:1.5; }
    .card-sess { fill:var(--card); stroke:var(--sess); stroke-width:1.5; }
    .ghost { fill:var(--card); stroke:var(--sess); stroke-width:1.2; stroke-dasharray:5 4; }
    .box { fill:var(--box); stroke:var(--card-line); stroke-width:1.2; }
    .title { font:700 20px ui-sans-serif, system-ui, sans-serif; fill:var(--ink); }
    .h { font:700 14px ui-sans-serif, system-ui, sans-serif; fill:var(--ink); }
    .p { font:13px ui-sans-serif, system-ui, sans-serif; fill:var(--ink-2); }
    .muted { font:12px ui-sans-serif, system-ui, sans-serif; fill:var(--muted); }
    .lbl { font:600 10px ui-monospace, SFMono-Regular, Menlo, monospace; letter-spacing:.08em; fill:var(--muted); }
    .code { font:11.5px ui-monospace, SFMono-Regular, Menlo, monospace; fill:var(--ink); }
  </style>

  <rect class="bg" x="0" y="0" width="940" height="640" rx="16"/>
  <text class="title" x="24" y="38">A channel is a session. Its board is not.</text>
  <text class="muted" x="24" y="60">Where each part of the support.desk channel lives. Three homes, and a post is checked in only one of them.</text>

  <g id="registered">
    <rect class="wall-proc" x="16" y="80" width="208" height="404" rx="14"/>
    <text class="h" x="32" y="104">Registered flows</text>
    <text class="muted" x="32" y="122">In each process</text>
    <rect class="card" x="32" y="138" width="176" height="150" rx="10"/>
    <text class="h" x="46" y="162">The channel kind</text>
    <text class="code" x="46" y="184">channel</text>
    <text class="p" x="46" y="210">One instance.</text>
    <text class="p" x="46" y="228">Every channel is a</text>
    <text class="p" x="46" y="246">session on it.</text>
    <text class="muted" x="46" y="272">Its address is the kind</text>
    <rect class="card" x="32" y="304" width="176" height="124" rx="10"/>
    <text class="h" x="46" y="328">A hired seat</text>
    <text class="code" x="46" y="350">support.devices</text>
    <text class="p" x="46" y="374">A flow copy of its</text>
    <text class="p" x="46" y="392">own, with sessions</text>
    <text class="p" x="46" y="410">of its own</text>
  </g>

  <g id="sessions">
    <rect class="wall-sess" x="240" y="80" width="416" height="404" rx="14"/>
    <text class="h" x="256" y="104">Engine sessions</text>
    <text class="muted" x="256" y="122">One conversation each</text>
    <rect class="card-sess" x="256" y="138" width="246" height="228" rx="10"/>
    <text class="h" x="270" y="162">support.desk</text>
    <text class="muted" x="270" y="180">a session on the channel kind</text>
    <text class="lbl" x="270" y="206">SESSION STATE</text>
    <text class="code" x="270" y="226">members: [support.devices, …]</text>
    <text class="code" x="270" y="244">instructions: the charter</text>
    <text class="muted" x="270" y="264">From CHANNEL.md, written once</text>
    <text class="lbl" x="270" y="292">ITEMS</text>
    <text class="code" x="270" y="312">channel-post</text>
    <text class="p" x="366" y="312">one per line</text>
    <text class="code" x="270" y="330">channel-route</text>
    <text class="p" x="374" y="330">where it went</text>
    <text class="muted" x="270" y="352">The transcript is these items</text>
    <rect class="ghost" x="514" y="138" width="126" height="92" rx="10"/>
    <text class="code" x="526" y="162">engineering.</text>
    <text class="code" x="526" y="178">standup</text>
    <text class="muted" x="526" y="202">Another channel,</text>
    <text class="muted" x="526" y="218">the same instance</text>
    <rect class="card-sess" x="256" y="382" width="384" height="86" rx="10"/>
    <text class="code" x="270" y="404">channel:support.desk</text>
    <text class="muted" x="420" y="404">on support.devices</text>
    <text class="p" x="270" y="428">The woken seat's own session. Its reasoning stays here.</text>
    <text class="p" x="270" y="448">Only its answer lands on the channel, as one line.</text>
  </g>

  <g id="organization">
    <rect class="wall-org" x="672" y="80" width="252" height="404" rx="14"/>
    <text class="h" x="688" y="104">Organization data</text>
    <text class="muted" x="688" y="122">Shared across flows</text>
    <rect class="card" x="688" y="138" width="220" height="150" rx="10"/>
    <text class="h" x="702" y="162">Board rows</text>
    <text class="code" x="702" y="184">support.desk.followups</text>
    <text class="p" x="702" y="210">goal · assignee · status</text>
    <text class="muted" x="702" y="236">An org task ledger. Its id is</text>
    <text class="muted" x="702" y="254">the channel's id plus the</text>
    <text class="muted" x="702" y="272">board's local name</text>
    <rect class="card" x="688" y="304" width="220" height="164" rx="10"/>
    <text class="h" x="702" y="328">Inventory row</text>
    <text class="code" x="702" y="350">inventory/channels/</text>
    <text class="code" x="702" y="366">support.desk</text>
    <text class="code" x="702" y="392">members: [ … ]</text>
    <text class="muted" x="702" y="418">A copy, for finding which</text>
    <text class="muted" x="702" y="436">channels a seat is in.</text>
    <text class="muted" x="702" y="454">Never the check on a post.</text>
  </g>

  <g id="not-a-copy">
    <rect class="box" x="16" y="500" width="908" height="124" rx="12"/>
    <text class="h" x="32" y="526">Not a copy</text>
    <text class="p" x="32" y="550">The session holds no board. boards: [followups] is read from CHANNEL.md at every start, and the rows live in the org's ledger.</text>
    <text class="p" x="32" y="574">A post is checked against members in the channel's own session state. The inventory's members is never consulted.</text>
    <text class="p" x="32" y="598">A seat's reasoning stays in its own session. The channel keeps only the line the seat posts.</text>
  </g>
</svg>
