<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 34 920 712">
<defs>
<pattern id="hatch" width="5" height="5" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line class="hatch-line" x1="0" y1="0" x2="0" y2="5"/></pattern>
<marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ink" d="M0,0 L10,5 L0,10 z"/></marker>
</defs>
<rect class="solid" x="28" y="56" width="480" height="434"/>
<text class="lb" x="40" y="80">REFERENCES/</text>
<text class="nm" x="40" y="102">The file is the text</text>
<text class="sub" x="40" y="120">re-read on each request · the product cannot write it</text>
<line class="hi" x1="28" y1="136" x2="508" y2="136"/>
<rect class="thin" x="40" y="152" width="290" height="324"/>
<text class="c" x="52" y="174">org/references/</text>
<rect class="thin" x="54" y="186" width="262" height="160"/>
<text class="c" x="66" y="208">teams/engineering/references/</text>
<rect class="thin" x="68" y="222" width="218" height="50"/>
<text class="c" x="80" y="244">workers/ada/references/</text>
<text class="t" x="80" y="262">its own folder</text>
<rect class="thin" x="68" y="284" width="218" height="50"/>
<text class="c" x="80" y="306">workers/ivan/references/</text>
<text class="t" x="80" y="324">a teammate</text>
<rect class="thin" x="54" y="358" width="246" height="50"/>
<text class="c" x="66" y="380">teams/support/references/</text>
<text class="t" x="66" y="398">another team</text>
<rect class="thin" x="54" y="418" width="246" height="48"/>
<text class="c" x="66" y="440">workers/build/references/</text>
<text class="t" x="66" y="457">an org worker</text>
<rect class="thin" x="434" y="254" width="62" height="44"/>
<text class="lb" x="444" y="270">WORKER</text>
<text class="c" x="444" y="289">ada</text>
<path class="ln" d="M434 276 H420 V170"/><circle cx="420" cy="276" r="2.6" class="ink"/>
<line class="ln" x1="420" y1="170" x2="332" y2="170" marker-end="url(#ah)"/>
<line class="ln" x1="420" y1="204" x2="318" y2="204" marker-end="url(#ah)"/>
<line class="ln" x1="420" y1="246" x2="288" y2="246" marker-end="url(#ah)"/>
<rect class="ground" x="407.7" y="218" width="24.6" height="15"/><text class="plate" x="420" y="229" text-anchor="middle">01</text>
<path class="ln x" d="M420 276 V442"/>
<line class="ln x" x1="420" y1="308" x2="298" y2="308"/><line class="ln x" x1="298" y1="298" x2="298" y2="318"/>
<line class="ln x" x1="420" y1="382" x2="312" y2="382"/><line class="ln x" x1="312" y1="372" x2="312" y2="392"/>
<line class="ln x" x1="420" y1="442" x2="312" y2="442"/><line class="ln x" x1="312" y1="432" x2="312" y2="452"/>
<rect class="ground" x="407.7" y="338" width="24.6" height="15"/><text class="plate x" x="420" y="349" text-anchor="middle">02</text>
<rect class="solid" x="528" y="56" width="364" height="434"/>
<text class="lb" x="540" y="80">RESOURCES/</text>
<text class="nm" x="540" y="102">A stored row</text>
<text class="sub" x="540" y="120">the file seeds it at first boot; then it is data</text>
<line class="hi" x1="528" y1="136" x2="892" y2="136"/>
<rect fill="url(#hatch)" x="540" y="152" width="340" height="10"/><line class="thin" x1="540" y1="162.5" x2="880" y2="162.5"/><rect class="thin" x="540" y="152" width="340" height="122"/>
<text class="c" x="550" y="186">teams/engineering/scratch</text>
<text class="t" x="550" y="206">Organization scope. The product,</text>
<text class="t" x="550" y="222">a block or the agent can write it.</text>
<text class="t" x="550" y="246">Editing the file later does not</text>
<text class="t" x="550" y="262">change a row that was written.</text>
<rect class="thin" x="540" y="334" width="340" height="72"/>
<text class="lb" x="550" y="356">THE FOLDER IS A NAMESPACE ONLY</text>
<text class="t" x="550" y="376">Every worker on a flow that installed it</text>
<text class="t" x="550" y="392">reaches it, any team included.</text>
<line class="ln" x1="710" y1="333" x2="710" y2="276" marker-end="url(#ah)"/><rect class="ground" x="697.7" y="297" width="24.6" height="15"/><text class="plate" x="710" y="308" text-anchor="middle">03</text>
<text class="t" x="540" y="436">To keep it to a team, filter the</text>
<text class="t" x="540" y="452">records before you install them.</text>
<line class="hi" x1="0" y1="514" x2="920" y2="514"/>
<text class="n" x="28" y="540">01</text>
<text class="t" x="60" y="540">ada reads the references of its organization, its team and its own folder. The folder is the wall: to let a</text>
<text class="t" x="60" y="557">reference reach more people, move the file up the tree.</text>
<text class="n" x="28" y="582">02</text>
<text class="t" x="60" y="582">It cannot reach a teammate's folder, another team's, or an org worker's. The accessor is not on its map at all,</text>
<text class="t" x="60" y="599">so reading one throws is not registered.</text>
<text class="n" x="28" y="624">03</text>
<text class="t" x="60" y="624">Every worker on a flow that installed a resource reaches it, any team included. Its folder is only part of the name.</text>
<text class="n" x="28" y="649">04</text>
<text class="t" x="60" y="649">A reference is never stored: the file in your repository is the only copy. Change it by editing and deploying.</text>
<text class="n" x="28" y="674">05</text>
<text class="t" x="60" y="674">A resource row is not the file. After its first write, the row is the text and the file is only where it started.</text>
<text class="t" x="60" y="691">Each organization gets its own row. flowIsolation: true gives each worker its own row instead of one shared.</text>
<line class="ln" x1="28" y1="718" x2="54" y2="718" marker-end="url(#ah)"/><text class="lb" x="62" y="722">READS · REACHES</text>
<line class="ln x" x1="200" y1="718" x2="222" y2="718"/><line class="ln x" x1="223" y1="711" x2="223" y2="725"/><text class="lb" x="234" y="722">CANNOT READ</text>
<rect fill="url(#hatch)" x="350" y="712" width="26" height="11"/><rect class="thin" x="350" y="712" width="26" height="11"/><text class="lb" x="384" y="722">OUTLIVES THE REQUEST</text>
</svg>
