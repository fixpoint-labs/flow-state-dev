<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 548" role="img" aria-labelledby="title desc">
  <title id="title">references and resources: where the text lives and who reaches it</title>
  <desc id="desc">A document in references is the file itself, re-read on each request; nothing running in the product can write it, and the folder is the boundary: the worker ada reaches the organization's references, its own team's, and its own folder's, but not a teammate's folder, another team's, or the folder of an org worker such as build, which reaches only the organization's references and its own. A document in resources is seeded from the file at first boot and is then a stored org-scoped row the product writes; its folder is only a namespace, so to keep a team's documents to that team you filter the records before installing them.</desc>
  <defs>
    <style>
      :root { --bg:#f0ece1; --ink:#1b1a15; --ink-2:#3d3a32; --muted:#57544a; --org-fill:#e4f0de;
              --org:#3d6b45; --card:#fcfbf7; --card-line:#8f8a7c; --box:#f8f6f0; --faint:#6e6a5e; }
      @media (prefers-color-scheme: dark) {
        :root { --bg:#16150f; --ink:#ece7da; --ink-2:#cbc5b5; --muted:#a6a08f; --org-fill:#384230;
                --org:#8cc39a; --card:#24231c; --card-line:#6e6a5e; --box:#1c1b15; --faint:#8d8777; } }
      .bg { fill: var(--bg); }
      .wall-org { fill: var(--org-fill); stroke: var(--org); stroke-width: 1.5; }
      .wall-file { fill: var(--box); stroke: var(--card-line); stroke-width: 1.5; }
      .card { fill: var(--card); stroke: var(--card-line); stroke-width: 1.2; }
      .reach { fill: var(--card); stroke: var(--org); stroke-width: 1.4; }
      .no { fill: var(--box); stroke: var(--faint); stroke-width: 1.2; stroke-dasharray: 5 4; }
      .box { fill: var(--box); stroke: var(--card-line); stroke-width: 1.2; }
      .title { font: 600 20px 'Space Grotesk', ui-sans-serif, system-ui, sans-serif; fill: var(--ink); }
      .h { font: 600 14px 'Space Grotesk', ui-sans-serif, system-ui, sans-serif; fill: var(--ink); }
      .p { font: 13px 'Space Grotesk', ui-sans-serif, system-ui, sans-serif; fill: var(--ink-2); }
      .muted { font: 12px 'Space Grotesk', ui-sans-serif, system-ui, sans-serif; fill: var(--muted); }
      .code { font: 12px 'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, monospace; fill: var(--ink); }
      .yes { font: 600 12px 'Space Grotesk', ui-sans-serif, system-ui, sans-serif; fill: var(--org); }
      .nope { font: 600 12px 'Space Grotesk', ui-sans-serif, system-ui, sans-serif; fill: var(--faint); }
    </style>
  </defs>

  <rect x="0" y="0" width="920" height="548" class="bg"/>

  <text x="28" y="36" class="title">references/ and resources/: where the text lives, who reaches it</text>
  <text x="28" y="58" class="muted">Same tree, same refs. Different owner of the text, and a different boundary.</text>

  <!-- references -->
  <rect x="28" y="84" width="476" height="324" class="wall-file"/>
  <text x="44" y="108" class="h">references/: the file is the text</text>
  <text x="44" y="126" class="muted">Re-read on each request. The product cannot write it.</text>

  <rect x="44" y="142" width="444" height="250" class="reach"/>
  <text x="58" y="164" class="h">org/references/</text>
  <text x="400" y="164" class="yes">ada reads</text>

  <rect x="58" y="176" width="270" height="202" class="reach"/>
  <text x="72" y="198" class="h">teams/engineering/references/</text>
  <text x="250" y="216" class="yes">ada reads</text>

  <rect x="72" y="228" width="242" height="64" class="reach"/>
  <text x="84" y="250" class="code">workers/ada/references/</text>
  <text x="84" y="276" class="yes">ada reads: its own folder</text>

  <rect x="72" y="302" width="242" height="62" class="no"/>
  <text x="84" y="324" class="code">workers/ivan/references/</text>
  <text x="84" y="348" class="nope">ada cannot: a teammate</text>

  <rect x="342" y="176" width="132" height="96" class="no"/>
  <text x="354" y="198" class="code">teams/support/</text>
  <text x="354" y="214" class="code">  references/</text>
  <text x="354" y="242" class="nope">ada cannot:</text>
  <text x="354" y="258" class="nope">another team</text>

  <rect x="342" y="282" width="132" height="96" class="no"/>
  <text x="354" y="304" class="code">workers/build/</text>
  <text x="354" y="320" class="code">  references/</text>
  <text x="354" y="348" class="nope">ada cannot:</text>
  <text x="354" y="364" class="nope">an org worker</text>

  <!-- resources -->
  <rect x="524" y="84" width="368" height="324" class="wall-org"/>
  <text x="540" y="108" class="h">resources/: a stored row</text>
  <text x="540" y="126" class="muted">The file seeds it at first boot. Then it is data.</text>

  <rect x="540" y="142" width="336" height="116" class="card"/>
  <text x="554" y="166" class="h">teams/engineering/scratch</text>
  <text x="554" y="188" class="p">Organization scope. The product,</text>
  <text x="554" y="206" class="p">a block or the agent can write it.</text>
  <text x="554" y="232" class="muted">Editing the file later does not</text>
  <text x="554" y="248" class="muted">change a row that was written.</text>

  <rect x="540" y="270" width="336" height="122" class="box"/>
  <text x="554" y="294" class="h">The folder is a namespace only</text>
  <text x="554" y="316" class="p">Every worker on a flow that installed it</text>
  <text x="554" y="334" class="p">reaches it, any team included.</text>
  <text x="554" y="360" class="muted">To keep it to a team, filter the records</text>
  <text x="554" y="376" class="muted">before you install them.</text>

  <!-- Not a copy -->
  <rect x="28" y="428" width="864" height="104" class="box"/>
  <text x="44" y="452" class="h">Not a copy</text>
  <text x="44" y="476" class="p">A reference is never stored: the file in your repository is the only copy. Change it by editing and deploying.</text>
  <text x="44" y="496" class="p">A resource row is not the file. After its first write, the row is the text and the file is only where it started.</text>
  <text x="44" y="516" class="p">Each organization gets its own row. flowIsolation: true gives each worker its own row instead of one shared.</text>
</svg>
