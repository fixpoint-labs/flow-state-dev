<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 560" role="img" aria-labelledby="title desc">
  <title id="title">Where a hired seat lives</title>
  <desc id="desc">A hired seat is written to the organization's scope in your store as a roster row, and the ready-made hire also writes an inventory row. The running process holds the registered seat, loaded from the roster at start. The roster row lists who is hired now; the inventory row is how the seat is found. Firing deletes both, and a matching incarnation id ties them together. The process copy is lost on restart and rebuilt from the roster.</desc>
  <defs>
    <style>
      :root { --bg:#ffffff; --ink:#0f172a; --ink-2:#334155; --muted:#64748b;
              --proc-fill:#faf5ff; --proc:#7e22ce; --sess-fill:#eff6ff; --sess:#1d4ed8;
              --org-fill:#f0fdf4; --org:#15803d; --card:#ffffff; --card-line:#334155; --box:#f8fafc;
              --faint:#94a3b8; --no:#b91c1c; }
      @media (prefers-color-scheme: dark) {
        :root { --bg:#0e0e14; --ink:#e5e7eb; --ink-2:#cbd5e1; --muted:#94a3b8;
                --proc-fill:#1d1030; --proc:#c084fc; --sess-fill:#0f1a33; --sess:#60a5fa;
                --org-fill:#0b2016; --org:#4ade80; --card:#14141c; --card-line:#64748b; --box:#181822;
                --faint:#64748b; --no:#f87171; } }
      .bg { fill: var(--bg); }
      .wall-store { fill: var(--org-fill); stroke: var(--org); stroke-width: 2; }
      .wall-proc { fill: var(--sess-fill); stroke: var(--sess); stroke-width: 2; }
      .card { fill: var(--card); stroke: var(--card-line); stroke-width: 1.5; }
      .card-sess { fill: var(--card); stroke: var(--sess); stroke-width: 1.5; }
      .box { fill: var(--box); stroke: var(--card-line); stroke-width: 1.5; }
      .title { font: 700 20px ui-sans-serif, system-ui, sans-serif; fill: var(--ink); }
      .h { font: 700 14px ui-sans-serif, system-ui, sans-serif; fill: var(--ink); }
      .p { font: 13px ui-sans-serif, system-ui, sans-serif; fill: var(--ink-2); }
      .muted { font: 12px ui-sans-serif, system-ui, sans-serif; fill: var(--muted); }
      .code { font: 12px ui-monospace, SFMono-Regular, Menlo, monospace; fill: var(--ink); }
    </style>
  </defs>

  <rect x="0" y="0" width="920" height="560" rx="16" class="bg"/>

  <text x="28" y="36" class="title">Where a hired seat lives</text>
  <text x="28" y="58" class="muted">Two rows in your store, one seat in each process. Only the roster decides what a start loads.</text>

  <!-- Store -->
  <rect x="28" y="84" width="604" height="320" rx="14" class="wall-store"/>
  <text x="44" y="108" class="h">Your store, organization scope</text>
  <text x="44" y="126" class="muted">One copy per organization. Kept across restarts when persistent.</text>

  <rect x="44" y="142" width="280" height="250" rx="10" class="card"/>
  <text x="58" y="166" class="h">Roster row</text>
  <text x="58" y="186" class="code">workforce/roster/support.ada</text>
  <text x="58" y="212" class="p">seatId · flow · instructions</text>
  <text x="58" y="232" class="p">incarnation · settings</text>
  <text x="58" y="256" class="muted">The browser reads all but settings.</text>
    <text x="58" y="300" class="p">Who is hired now</text>
  <text x="58" y="320" class="muted">Deleted when the seat is fired</text>
  <text x="58" y="348" class="muted">User-owned seat:</text>
  <text x="58" y="366" class="code">workforce/roster/~&lt;user&gt;/&lt;seatId&gt;</text>
  <text x="58" y="382" class="muted">Only its owner reads it</text>

  <rect x="336" y="142" width="280" height="250" rx="10" class="card"/>
  <text x="350" y="166" class="h">Inventory row</text>
  <text x="350" y="186" class="code">inventory/seats/acme.support.ada</text>
  <text x="350" y="212" class="p">id · kind · door</text>
  <text x="350" y="232" class="p">hired: true · incarnation</text>
  <text x="350" y="256" class="muted">Written by the ready-made hire.</text>
  <text x="350" y="273" class="muted">A hire you write adds one only</text>
  <text x="350" y="290" class="muted">if your handler writes it.</text>
  <text x="350" y="320" class="p">How the seat is found</text>
  <text x="350" y="340" class="muted">Deleted on fire, matched by incarnation</text>

  <!-- Process -->
  <rect x="648" y="84" width="244" height="320" rx="14" class="wall-proc"/>
  <text x="664" y="108" class="h">Each running process</text>
  <text x="664" y="126" class="muted">Gone on restart, rebuilt at start</text>

  <rect x="664" y="142" width="212" height="160" rx="10" class="card-sess"/>
  <text x="678" y="166" class="h">The registered seat</text>
  <text x="678" y="186" class="code">acme.support.ada</text>
  <text x="678" y="208" class="muted">Its address: org, then seat id</text>
  <text x="678" y="234" class="code">seatId: "support.ada"</text>
  <text x="678" y="252" class="muted">The id it knows itself by</text>
  <text x="678" y="278" class="p">Pinned to its organization</text>
  <text x="678" y="294" class="muted">Other callers get 404</text>

  <text x="664" y="330" class="p">At start, reloadHiredSeats</text>
  <text x="664" y="348" class="p">reads the roster rows and</text>
  <text x="664" y="366" class="p">hires them. Your app</text>
  <text x="664" y="384" class="p">registers what comes back.</text>

  <!-- Not a copy -->
  <rect x="28" y="424" width="864" height="116" rx="12" class="box"/>
  <text x="44" y="448" class="h">Not a copy</text>
  <text x="44" y="472" class="p">The roster row decides who is hired now. The inventory row is a copy for finding seats; firing deletes both.</text>
  <text x="44" y="492" class="p">The process serves what it loaded at start. A seat hired on another instance answers here after this one restarts.</text>
  <text x="44" y="512" class="p">Firing leaves the sessions, state and resources the seat wrote alone.</text>
  <text x="44" y="530" class="muted">Seats declared in WORKER.md files have no roster row. They are read from disk at every start.</text>
</svg>
