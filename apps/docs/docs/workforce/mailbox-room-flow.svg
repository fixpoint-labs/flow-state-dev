<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 742" role="img" aria-label="How a post travels through a mailbox and through a project&#x27;s room, as swimlanes with time running left to right. A mailbox: Alice owns the session support.desk, a session on the mailbox kind that holds the transcript. Alice posts, the line is kept in that session, the notify block wakes the worker in its own session keyed mailbox:support.desk, the worker&#x27;s answer line lands back in support.desk, and Alice reads the transcript. Bob, another user, posts to support.desk and is refused with the same 404 as an unknown session, because the session belongs to Alice. A room: Alice and Bob are members of a project and each has their own talk session. Alice posts from hers, and the line is written to room-lines, organization data that holds the room&#x27;s transcript. The template worker is woken as Alice, in a conversation it keeps per person, and its answer comes back through Alice&#x27;s session as the next line in room-lines. Bob reads from his own session and gets both lines. Carol is in the organization but not a member, and her join is refused with not-a-member. Why a session per member: a session acts for one user, and anyone else is refused as if it did not exist, so people share a conversation through a room, each posting from their own session into one organization resource. A mailbox is one session, so only its owner can post to it or read it; it is how workers and one user talk.">
  <style>
    :root { --bg:#ffffff; --ink:#0f172a; --ink-2:#334155; --muted:#64748b;
            --proc-fill:#faf5ff; --proc:#7e22ce; --sess-fill:#eff6ff; --sess:#1d4ed8;
            --org-fill:#f0fdf4; --org:#15803d; --card:#ffffff; --card-line:#334155; --box:#f8fafc; }
    @media (prefers-color-scheme: dark) {
      :root { --bg:#0e0e14; --ink:#e5e7eb; --ink-2:#cbd5e1; --muted:#94a3b8;
              --proc-fill:#1d1030; --proc:#c084fc; --sess-fill:#0f1a33; --sess:#60a5fa;
              --org-fill:#0b2016; --org:#4ade80; --card:#14141c; --card-line:#64748b; --box:#181822; } }
    .bg { fill:var(--bg); }
    .wall-proc { fill:var(--proc-fill); stroke:var(--proc); stroke-width:2; }
    .wall-sess { fill:var(--sess-fill); stroke:var(--sess); stroke-width:2; }
    .wall-org { fill:var(--org-fill); stroke:var(--org); stroke-width:2; }
    .wall-file { fill:var(--box); stroke:var(--card-line); stroke-width:2; }
    .card { fill:var(--card); stroke:var(--card-line); stroke-width:1.5; }
    .card-sess { fill:var(--card); stroke:var(--sess); stroke-width:1.5; }
    .card-org { fill:var(--card); stroke:var(--org); stroke-width:1.5; }
    .line { stroke:var(--muted); stroke-width:1.5; fill:none; }
    .box { fill:var(--box); stroke:var(--card-line); stroke-width:1.2; }
    .title { font:700 20px ui-sans-serif, system-ui, sans-serif; fill:var(--ink); }
    .h { font:700 14px ui-sans-serif, system-ui, sans-serif; fill:var(--ink); }
    .p { font:13px ui-sans-serif, system-ui, sans-serif; fill:var(--ink-2); }
    .muted { font:12px ui-sans-serif, system-ui, sans-serif; fill:var(--muted); }
    .lbl { font:600 10px ui-monospace, SFMono-Regular, Menlo, monospace; letter-spacing:.08em; fill:var(--muted); }
    .code { font:11.5px ui-monospace, SFMono-Regular, Menlo, monospace; fill:var(--ink); }
    .lane { fill:var(--card); stroke:var(--card-line); stroke-width:1; opacity:.9; }
    .lname { font:700 12px ui-sans-serif, system-ui, sans-serif; fill:var(--ink); }
    .lnote { font:11px ui-sans-serif, system-ui, sans-serif; fill:var(--muted); }
    .stepbox { fill:var(--sess-fill); stroke:var(--sess); stroke-width:1.2; }
    .stepbox-org { fill:var(--org-fill); stroke:var(--org); stroke-width:1.2; }
    .stepbox-proc { fill:var(--proc-fill); stroke:var(--proc); stroke-width:1.2; }
    .stepbox-no { fill:var(--box); stroke:var(--muted); stroke-width:1.2; stroke-dasharray:4 3; }
    .step { font:11.5px ui-sans-serif, system-ui, sans-serif; fill:var(--ink); }
    .step-no { font:11.5px ui-sans-serif, system-ui, sans-serif; fill:var(--muted); }
    .head-no { fill:var(--muted); }
    .line-no { stroke:var(--muted); stroke-width:1.5; fill:none; stroke-dasharray:4 3; }
  </style>
  <rect class="bg" x="0" y="0" width="940" height="742" rx="16"/>
  <text class="title" x="24" y="38">How a post travels</text>
  <text class="muted" x="24" y="60">Time runs left to right. Each row is one place the post touches.</text>
  <rect class="wall-sess" x="24" y="80" width="892" height="232" rx="14"/>
  <text class="h" x="40" y="102">A mailbox</text>
  <text class="muted" x="128.7" y="102">one session, one owner</text>
  <rect class="lane" x="36" y="117" width="868" height="40" rx="8"/>
  <text class="lname" x="48" y="135">Alice</text>
  <text class="lnote" x="48" y="151">owns support.desk</text>
  <rect class="lane" x="36" y="163" width="868" height="40" rx="8"/>
  <text class="lname" x="48" y="181">Session support.desk</text>
  <text class="lnote" x="48" y="197">mailbox kind; holds the transcript</text>
  <rect class="lane" x="36" y="209" width="868" height="40" rx="8"/>
  <text class="lname" x="48" y="227">The worker&#x27;s own session</text>
  <text class="lnote" x="48" y="243">keyed mailbox:support.desk</text>
  <rect class="lane" x="36" y="255" width="868" height="40" rx="8"/>
  <text class="lname" x="48" y="273">Bob</text>
  <text class="lnote" x="48" y="289">another user</text>
  <rect class="stepbox" x="224" y="122.0" width="120" height="30" rx="7"/>
  <text class="step" x="232" y="141.0">1 post</text>
  <rect class="stepbox" x="360" y="168.0" width="120" height="30" rx="7"/>
  <text class="step" x="368" y="187.0">2 line kept here</text>
  <rect class="stepbox-proc" x="496" y="214.0" width="120" height="30" rx="7"/>
  <text class="step" x="504" y="233.0">3 worker woken</text>
  <rect class="stepbox" x="632" y="168.0" width="120" height="30" rx="7"/>
  <text class="step" x="640" y="187.0">4 answer line</text>
  <rect class="stepbox" x="768" y="122.0" width="120" height="30" rx="7"/>
  <text class="step" x="776" y="141.0">5 read transcript</text>
  <rect class="stepbox-no" x="224" y="260.0" width="120" height="30" rx="7"/>
  <text class="step-no" x="232" y="279.0">post</text>
  <rect class="stepbox-no" x="496" y="260.0" width="120" height="30" rx="7"/>
  <text class="step-no" x="504" y="279.0">refused: 404</text>
  <path class="line" d="M344.0 137.0 L357.0 174.5"/>
  <polygon class="head" points="360.0,183.0 352.8,176.0 361.3,173.0"/>
  <path class="line" d="M480.0 183.0 L493.0 220.5"/>
  <polygon class="head" points="496.0,229.0 488.8,222.0 497.3,219.0"/>
  <path class="line" d="M616.0 229.0 L629.0 191.5"/>
  <polygon class="head" points="632.0,183.0 633.3,193.0 624.8,190.0"/>
  <path class="line" d="M752.0 183.0 L765.0 145.5"/>
  <polygon class="head" points="768.0,137.0 769.3,147.0 760.8,144.0"/>
  <path class="line-no" d="M344.0 275.0 L487.0 275.0"/>
  <polygon class="head-no" points="496.0,275.0 487.0,279.5 487.0,270.5"/>
  <rect class="wall-org" x="24" y="328" width="892" height="278" rx="14"/>
  <text class="h" x="40" y="350">A room</text>
  <text class="muted" x="103.80000000000001" y="350">one shared resource, a session per member</text>
  <rect class="lane" x="36" y="365" width="868" height="40" rx="8"/>
  <text class="lname" x="48" y="383">Alice&#x27;s talk session</text>
  <text class="lnote" x="48" y="399">Alice, a member</text>
  <rect class="lane" x="36" y="411" width="868" height="40" rx="8"/>
  <text class="lname" x="48" y="429">Bob&#x27;s talk session</text>
  <text class="lnote" x="48" y="445">Bob, a member</text>
  <rect class="lane" x="36" y="457" width="868" height="40" rx="8"/>
  <text class="lname" x="48" y="475">room-lines</text>
  <text class="lnote" x="48" y="491">org data; the transcript</text>
  <rect class="lane" x="36" y="503" width="868" height="40" rx="8"/>
  <text class="lname" x="48" y="521">Template worker</text>
  <text class="lnote" x="48" y="537">one conversation per person</text>
  <rect class="lane" x="36" y="549" width="868" height="40" rx="8"/>
  <text class="lname" x="48" y="567">Carol</text>
  <text class="lnote" x="48" y="583">in the org, not a member</text>
  <rect class="stepbox" x="224" y="370.0" width="108" height="30" rx="7"/>
  <text class="step" x="232" y="389.0">1 post</text>
  <rect class="stepbox-org" x="337" y="462.0" width="108" height="30" rx="7"/>
  <text class="step" x="345" y="481.0">2 line n</text>
  <rect class="stepbox-proc" x="450" y="508.0" width="108" height="30" rx="7"/>
  <text class="step" x="458" y="527.0">3 woken as Alice</text>
  <rect class="stepbox" x="563" y="370.0" width="108" height="30" rx="7"/>
  <text class="step" x="571" y="389.0">4 the answer</text>
  <rect class="stepbox-org" x="676" y="462.0" width="108" height="30" rx="7"/>
  <text class="step" x="684" y="481.0">5 line n+1</text>
  <rect class="stepbox" x="789" y="416.0" width="108" height="30" rx="7"/>
  <text class="step" x="797" y="435.0">6 read: n, n+1</text>
  <rect class="stepbox-no" x="224" y="554.0" width="108" height="30" rx="7"/>
  <text class="step-no" x="232" y="573.0">join</text>
  <rect class="stepbox-no" x="450" y="554.0" width="108" height="30" rx="7"/>
  <text class="step-no" x="458" y="573.0">not-a-member</text>
  <path class="line" d="M332.0 385.0 L336.5 468.0"/>
  <polygon class="head" points="337.0,477.0 332.0,468.3 341.0,467.8"/>
  <path class="line" d="M445.0 477.0 L449.0 514.1"/>
  <polygon class="head" points="450.0,523.0 444.6,514.5 453.5,513.6"/>
  <path class="line" d="M558.0 523.0 L562.7 394.0"/>
  <polygon class="head" points="563.0,385.0 567.2,394.2 558.2,393.8"/>
  <path class="line" d="M671.0 385.0 L675.5 468.0"/>
  <polygon class="head" points="676.0,477.0 671.0,468.3 680.0,467.8"/>
  <path class="line" d="M784.0 477.0 L788.0 439.9"/>
  <polygon class="head" points="789.0,431.0 792.5,440.4 783.6,439.5"/>
  <path class="line-no" d="M332.0 569.0 L441.0 569.0"/>
  <polygon class="head-no" points="450.0,569.0 441.0,573.5 441.0,564.5"/>
  <rect class="box" x="24" y="622" width="892" height="104" rx="12"/>
  <text class="h" x="40" y="646">Why a session per member</text>
  <text class="p" x="40" y="670">A session acts for one user, and a post from anyone else is refused as if the session did not exist.</text>
  <text class="p" x="40" y="690">So people share a conversation through a room: each posts from their own session into one org resource.</text>
  <text class="p" x="40" y="710">A mailbox is one session, so only its owner can post to it or read it. It is how workers and one user talk.</text>
</svg>
