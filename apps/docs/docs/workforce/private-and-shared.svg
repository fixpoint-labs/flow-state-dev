<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 560" role="img" aria-labelledby="title desc">
  <title id="title">Workers are private; sharing happens in shared resources</title>
  <desc id="desc">One org, two users. Above the org, the installation's files define the standard workers every user starts with. Inside the org, a shared area holds a shared project whose workstreams have one owner each, and org-scope data a flow writes only when its author built it to. Below it, Alice's private area holds her standard researcher, a private project with its workstreams and tasks, a coordinator and an analyst. Bob's holds his own standard researcher, a writer he forked from a standard worker, a coordinator and a private project. Alice owns a workstream of the shared project.</desc>
  <defs>
    <style>
      :root { --bg:#f0ece1; --ink:#1b1a15; --ink-2:#3d3a32; --muted:#57544a; --sess-fill:#e3e8f2;
              --sess:#2c4f8c; --org-fill:#e4f0de; --org:#3d6b45; --card:#fcfbf7;
              --card-line:#8f8a7c; --box:#f8f6f0; --faint:#6e6a5e; }
      @media (prefers-color-scheme: dark) {
        :root { --bg:#16150f; --ink:#ece7da; --ink-2:#cbc5b5; --muted:#a6a08f; --sess-fill:#2b3140;
                --sess:#8fabe2; --org-fill:#384230; --org:#8cc39a; --card:#24231c;
                --card-line:#6e6a5e; --box:#1c1b15; --faint:#8d8777; } }
      .bg { fill: var(--bg); }
      .files { fill: var(--box); stroke: var(--faint); stroke-width: 1.2; stroke-dasharray: 6 4; }
      .org { fill: none; stroke: var(--faint); stroke-width: 1.2; stroke-dasharray: 6 4; }
      .shared { fill: var(--sess-fill); stroke: var(--sess); stroke-width: 1.4; }
      .private { fill: var(--org-fill); stroke: var(--org); stroke-width: 1.4; }
      .card { fill: var(--card); stroke: var(--card-line); stroke-width: 1; }
      .edge { stroke: var(--card-line); stroke-width: 1.2; fill: none; marker-end: url(#arrow); }
      .title { font: 600 20px 'Space Grotesk', ui-sans-serif, system-ui, sans-serif; fill: var(--ink); }
      .wl { font: 600 13px 'Space Grotesk', ui-sans-serif, system-ui, sans-serif; fill: var(--ink); }
      .h { font: 600 14px 'Space Grotesk', ui-sans-serif, system-ui, sans-serif; fill: var(--ink); }
      .p { font: 13px 'Space Grotesk', ui-sans-serif, system-ui, sans-serif; fill: var(--ink-2); }
      .muted { font: 12px 'Space Grotesk', ui-sans-serif, system-ui, sans-serif; fill: var(--muted); }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" style="fill:var(--card-line)"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="920" height="560" rx="0" class="bg"/>
  <text x="28" y="36" class="title">Workers are private; sharing happens in shared resources</text>

  <rect x="28" y="52" width="864" height="44" rx="0" class="files"/>
  <text x="460" y="79" text-anchor="middle" class="p">The installation's files: the standard workers every user starts with</text>

  <rect x="20" y="110" width="880" height="434" rx="0" class="org"/>
  <text x="36" y="130" class="muted">org acme</text>

  <rect x="40" y="142" width="840" height="110" rx="0" class="shared"/>
  <text x="56" y="164" class="wl">Shared</text>
  <rect x="56" y="174" width="400" height="62" rx="0" class="card"/>
  <text x="70" y="198" class="h">Shared project</text>
  <text x="70" y="218" class="p">workstreams, one owner each</text>
  <rect x="472" y="174" width="392" height="62" rx="0" class="card"/>
  <text x="486" y="198" class="h">Org-scope data</text>
  <text x="486" y="218" class="p">written only by a flow built to write it</text>

  <rect x="40" y="304" width="410" height="224" rx="0" class="private"/>
  <text x="56" y="514" class="wl">Alice: private</text>
  <rect x="56" y="320" width="184" height="60" rx="0" class="card"/>
  <text x="70" y="346" class="h">researcher</text>
  <text x="70" y="366" class="p">worker (standard)</text>
  <rect x="252" y="320" width="184" height="60" rx="0" class="card"/>
  <text x="266" y="346" class="h">private project</text>
  <text x="266" y="366" class="p">workstreams + tasks</text>
  <rect x="56" y="392" width="184" height="48" rx="0" class="card"/>
  <text x="148" y="421" text-anchor="middle" class="p">coordinator (worker)</text>
  <rect x="252" y="392" width="184" height="48" rx="0" class="card"/>
  <text x="344" y="421" text-anchor="middle" class="p">analyst (worker)</text>

  <rect x="470" y="304" width="410" height="224" rx="0" class="private"/>
  <text x="486" y="514" class="wl">Bob: private</text>
  <rect x="486" y="320" width="184" height="60" rx="0" class="card"/>
  <text x="500" y="346" class="h">researcher</text>
  <text x="500" y="366" class="p">worker (standard)</text>
  <rect x="682" y="320" width="184" height="60" rx="0" class="card"/>
  <text x="696" y="346" class="h">writer</text>
  <text x="696" y="366" class="p">worker (forked)</text>
  <rect x="486" y="392" width="184" height="48" rx="0" class="card"/>
  <text x="578" y="421" text-anchor="middle" class="p">coordinator (worker)</text>
  <rect x="682" y="392" width="184" height="48" rx="0" class="card"/>
  <text x="774" y="421" text-anchor="middle" class="p">private project</text>

  <path d="M344 238 L344 302" class="edge"/>
  <text x="354" y="276" class="muted">a workstream Alice owns</text>
</svg>
