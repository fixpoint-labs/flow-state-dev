<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 34 920 696">
<defs>
<marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ink" d="M0,0 L10,5 L0,10 z"/></marker>
</defs>
<rect class="solid" x="28" y="56" width="864" height="44"/>
<text class="lb" x="40" y="82">THE INSTALLATION'S FILES</text>
<text class="t" x="240" y="82">the standard workers every user starts with</text>
<rect class="solid" x="28" y="124" width="864" height="416"/>
<text class="lb" x="40" y="146">ORG ACME</text>
<rect class="solid" x="44" y="158" width="832" height="104"/>
<text class="lb" x="56" y="180">SHARED · EVERYONE IN THE ORG READS IT</text>
<rect class="thin" x="56" y="194" width="396" height="54"/>
<text class="nm" x="66" y="216">Shared project</text>
<text class="sub" x="66" y="236">workstreams, one owner each</text>
<rect class="thin" x="468" y="194" width="396" height="54"/>
<text class="nm" x="478" y="216">Org-scope data</text>
<text class="sub" x="478" y="236">written only by a flow built to write it</text>
<rect class="solid" x="44" y="320" width="408" height="196"/>
<rect class="thin" x="56" y="340" width="186" height="52"/>
<text class="c" x="66" y="362">private project</text>
<text class="t" x="66" y="380">workstreams + tasks</text>
<rect class="thin" x="254" y="340" width="186" height="52"/>
<text class="c" x="264" y="362">researcher</text>
<text class="t" x="264" y="380">worker (standard)</text>
<rect class="thin" x="56" y="406" width="186" height="52"/>
<text class="c" x="66" y="428">coordinator</text>
<text class="t" x="66" y="446">worker</text>
<rect class="thin" x="254" y="406" width="186" height="52"/>
<text class="c" x="264" y="428">analyst</text>
<text class="t" x="264" y="446">worker</text>
<line class="hi" x1="44" y1="478" x2="452" y2="478"/>
<text class="lb" x="56" y="502">ALICE · PRIVATE · ONLY SHE READS IT</text>
<rect class="solid" x="468" y="320" width="408" height="196"/>
<rect class="thin" x="480" y="340" width="186" height="52"/>
<text class="c" x="490" y="362">researcher</text>
<text class="t" x="490" y="380">worker (standard)</text>
<rect class="thin" x="678" y="340" width="186" height="52"/>
<text class="c" x="688" y="362">writer</text>
<text class="t" x="688" y="380">worker (forked)</text>
<rect class="thin" x="480" y="406" width="186" height="52"/>
<text class="c" x="490" y="428">coordinator</text>
<text class="t" x="490" y="446">worker</text>
<rect class="thin" x="678" y="406" width="186" height="52"/>
<text class="c" x="688" y="428">private project</text>
<text class="t" x="688" y="446">workstreams + tasks</text>
<line class="hi" x1="468" y1="478" x2="876" y2="478"/>
<text class="lb" x="480" y="502">BOB · PRIVATE · ONLY HE READS IT</text>
<path class="ln" d="M460 101 V292"/><circle cx="460" cy="292" r="2.6" class="ink"/><path class="ln" d="M460 292 H347 V338" marker-end="url(#ah)"/><path class="ln" d="M460 292 H573 V338" marker-end="url(#ah)"/><rect class="ground" x="447.7" y="105" width="24.6" height="15"/><text class="plate" x="460" y="116" text-anchor="middle">01</text>
<circle cx="149" cy="320" r="2.6" class="ink"/><line class="ln" x1="149" y1="320" x2="149" y2="250" marker-end="url(#ah)"/><rect class="ground" x="136.7" y="282" width="24.6" height="15"/><text class="plate" x="149" y="293" text-anchor="middle">02</text>
<line class="hi" x1="0" y1="564" x2="920" y2="564"/>
<text class="n" x="28" y="590">01</text>
<text class="t" x="60" y="590">The installation's files define the standard workers every user starts with. Alice and Bob each have their own</text>
<text class="t" x="60" y="607">standard researcher: two workers, not one. Bob's writer is a worker he forked from a standard one.</text>
<text class="n" x="28" y="632">02</text>
<text class="t" x="60" y="632">Alice owns a workstream of the shared project. Each workstream has one owner.</text>
<text class="n" x="28" y="657">03</text>
<text class="t" x="60" y="657">A worker's own state and a user's data are private. Shared resources and org-scope data are shared with the org,</text>
<text class="t" x="60" y="674">and a flow writes to org scope only when its author built it to.</text>
<line class="ln" x1="28" y1="701" x2="54" y2="701" marker-end="url(#ah)"/><text class="lb" x="62" y="705">DEFINES · OWNS</text>
<rect class="solid" x="210" y="695" width="26" height="11"/><text class="lb" x="244" y="705">A WALL · ITS LABEL SAYS WHO READS</text>
</svg>
