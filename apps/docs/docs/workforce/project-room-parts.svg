<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 600" role="img" aria-labelledby="title desc">
  <title id="title">Session, room and line: what each is and where it lives</title>
  <desc id="desc">A talk session belongs to one person and lives with the engine's sessions; its state names a project and grants nothing. The project row, the room counter and the room lines are organization data. A line records its sequence number, the poster's user id, an author for a seat's answer, and its body. None of the three is a copy of another.</desc>
  <defs>
    <style>
      .bg { fill: #ffffff; }
      .wall-sess { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2; }
      .wall-org { fill: #f0fdf4; stroke: #15803d; stroke-width: 2; }
      .card { fill: #ffffff; stroke: #334155; stroke-width: 1.5; }
      .card-sess { fill: #ffffff; stroke: #1d4ed8; stroke-width: 1.5; }
      .card-line { fill: #ffffff; stroke: #15803d; stroke-width: 1.5; }
      .box { fill: #f8fafc; stroke: #334155; stroke-width: 1.5; }
      .title { font: 700 20px ui-sans-serif, system-ui, sans-serif; fill: #0f172a; }
      .h { font: 700 14px ui-sans-serif, system-ui, sans-serif; fill: #0f172a; }
      .p { font: 13px ui-sans-serif, system-ui, sans-serif; fill: #334155; }
      .muted { font: 12px ui-sans-serif, system-ui, sans-serif; fill: #64748b; }
      .code { font: 12px ui-monospace, SFMono-Regular, Menlo, monospace; fill: #0f172a; }
    </style>
  </defs>

  <rect x="0" y="0" width="920" height="600" rx="16" class="bg"/>

  <text x="28" y="36" class="title">Session, room, line: what each is and where it lives</text>
  <text x="28" y="58" class="muted">Three different things. None of them is a copy of another.</text>

  <!-- Session side -->
  <rect x="28" y="84" width="272" height="380" rx="14" class="wall-sess"/>
  <text x="44" y="108" class="h">Engine sessions</text>
  <text x="44" y="126" class="muted">Each one owned by one person</text>

  <rect x="44" y="142" width="240" height="196" rx="10" class="card-sess"/>
  <text x="58" y="166" class="h">Alice’s talk session</text>
  <text x="58" y="190" class="p">Owner: alice</text>
  <text x="58" y="207" class="muted">Recorded by the server</text>
  <text x="58" y="232" class="code">resourceId: "storefront"</text>
  <text x="58" y="249" class="muted">Names the project. Grants nothing.</text>
  <text x="58" y="274" class="p">join · post · read</text>
  <text x="58" y="298" class="muted">Holds none of the room’s lines</text>
  <text x="58" y="318" class="muted">One per person per project</text>

  <text x="44" y="370" class="p">A person’s handle on the room.</text>
  <text x="44" y="390" class="p">Nobody else uses it.</text>
  <text x="44" y="420" class="muted">A seat’s answer goes in through the</text>
  <text x="44" y="437" class="muted">session of the person it answers.</text>

  <!-- Organization side -->
  <rect x="320" y="84" width="572" height="380" rx="14" class="wall-org"/>
  <text x="336" y="108" class="h">Organization data, shared across flows</text>
  <text x="336" y="126" class="muted">One copy per project, however many sessions talk to it</text>

  <rect x="336" y="142" width="262" height="146" rx="10" class="card"/>
  <text x="350" y="166" class="h">Project row</text>
  <text x="350" y="186" class="code">projects/storefront</text>
  <text x="350" y="212" class="p">members: alice, bob, cara</text>
  <text x="350" y="234" class="p">sessions: alice → s-1, bob → s-2</text>
  <text x="350" y="258" class="muted">A link to each member’s talk session,</text>
  <text x="350" y="275" class="muted">not the session itself</text>

  <rect x="336" y="302" width="262" height="146" rx="10" class="card"/>
  <text x="350" y="326" class="h">Room counter</text>
  <text x="350" y="346" class="code">room-seq/storefront</text>
  <text x="350" y="372" class="p">next: last number handed out</text>
  <text x="350" y="394" class="p">committed: readers stop here</text>
  <text x="350" y="418" class="muted">Kept apart from the row, so posts</text>
  <text x="350" y="435" class="muted">never wait on a join or an edit</text>

  <rect x="614" y="142" width="262" height="306" rx="10" class="card"/>
  <text x="628" y="166" class="h">Room lines</text>
  <text x="628" y="186" class="code">room-lines/storefront/&lt;seq&gt;</text>

  <rect x="628" y="200" width="234" height="28" rx="6" class="box"/>
  <text x="638" y="219" class="p">1 · alice · “Ship checkout Friday”</text>
  <rect x="628" y="234" width="234" height="28" rx="6" class="box"/>
  <text x="638" y="253" class="p">2 · cara · “Docs updated”</text>

  <rect x="628" y="268" width="234" height="128" rx="8" class="card-line"/>
  <text x="640" y="290" class="h">One line</text>
  <text x="640" y="311" class="code">seq: 3</text>
  <text x="640" y="329" class="code">userId: "bob"</text>
  <text x="640" y="347" class="code">author: null</text>
  <text x="640" y="365" class="code">body: "API ready"</text>
  <text x="640" y="386" class="muted">Created once, never edited</text>

  <text x="628" y="418" class="muted">userId: the poster, set by the server</text>
  <text x="628" y="435" class="muted">author: a seat’s name, or null</text>

  <!-- Not a copy -->
  <rect x="28" y="484" width="864" height="96" rx="12" class="box"/>
  <text x="44" y="508" class="h">Not a copy</text>
  <text x="44" y="532" class="p">The session holds which project it is about. It never holds the room’s lines.</text>
  <text x="44" y="552" class="p">The row lists each member’s session id and user. The session itself stays with the engine.</text>
  <text x="44" y="572" class="p">A line records who posted it. It does not point back to the session it came through.</text>
</svg>
