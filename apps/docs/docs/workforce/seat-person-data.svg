<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 540" role="img" aria-label="Where a hired seat keeps what it learns about alice. Inside the acme organization: one shared cell for alice in acme, which every hired seat in acme reads and writes unless it is flow-isolated, holding her user record and her user-scoped resources; and one cell per seat address for flow-isolated data, such as alice at acme.support.ada. In globex, alice has a separate cell of her own, which acme's seats cannot read. Outside hired seats, alice's own data, keyed by her id alone and kept by your app's other flows, is a third place that no hired seat reads or writes. Nothing moves between organizations. A projected resource is stored by your own hooks, so key its rows by the organization too.">
  <style>
    :root { --bg:#ffffff; --ink:#0f172a; --ink-2:#334155; --muted:#64748b;
            --proc-fill:#faf5ff; --proc:#7e22ce; --sess-fill:#eff6ff; --sess:#1d4ed8;
            --org-fill:#f0fdf4; --org:#15803d; --card:#ffffff; --card-line:#334155; --box:#f8fafc; }
    @media (prefers-color-scheme: dark) {
      :root { --bg:#0e0e14; --ink:#e5e7eb; --ink-2:#cbd5e1; --muted:#94a3b8;
              --proc-fill:#1d1030; --proc:#c084fc; --sess-fill:#0f1a33; --sess:#60a5fa;
              --org-fill:#0b2016; --org:#4ade80; --card:#14141c; --card-line:#64748b; --box:#181822; } }
    .bg { fill:var(--bg); }
    .wall-proc { fill:var(--proc-fill); stroke:var(--proc); stroke-width:2; }
    .wall-org { fill:var(--org-fill); stroke:var(--org); stroke-width:2; }
    .card { fill:var(--card); stroke:var(--card-line); stroke-width:1.5; }
    .card-sess { fill:var(--card); stroke:var(--sess); stroke-width:1.5; }
    .ghost { fill:var(--card); stroke:var(--sess); stroke-width:1.2; stroke-dasharray:5 4; }
    .box { fill:var(--box); stroke:var(--card-line); stroke-width:1.2; }
    .title { font:700 20px ui-sans-serif, system-ui, sans-serif; fill:var(--ink); }
    .h { font:700 14px ui-sans-serif, system-ui, sans-serif; fill:var(--ink); }
    .p { font:13px ui-sans-serif, system-ui, sans-serif; fill:var(--ink-2); }
    .muted { font:12px ui-sans-serif, system-ui, sans-serif; fill:var(--muted); }
    .lbl { font:600 10px ui-monospace, SFMono-Regular, Menlo, monospace; letter-spacing:.08em; fill:var(--muted); }
    .code { font:11.5px ui-monospace, SFMono-Regular, Menlo, monospace; fill:var(--ink); }
  </style>

  <rect class="bg" x="0" y="0" width="940" height="540" rx="16"/>
  <text class="title" x="24" y="38">What a seat saves for alice, and where</text>
  <text class="muted" x="24" y="60">One person, three kinds of place. Each organization keeps its own, and seats never reach her data outside them.</text>

  <g id="acme">
    <rect class="wall-org" x="24" y="80" width="452" height="324" rx="14"/>
    <text class="h" x="40" y="104">Organization: acme</text>
    <text class="muted" x="40" y="122">Hired seats pinned to acme</text>
    <rect class="card" x="36" y="138" width="428" height="112" rx="10"/>
    <text class="lbl" x="50" y="158">SHARED · ONE CELL FOR ALICE IN ACME</text>
    <text class="p" x="50" y="182">ctx.user.state and user-scoped resources</text>
    <text class="p" x="50" y="200">that are not flow-isolated</text>
    <text class="muted" x="50" y="228">Every hired seat in acme reads and writes this one</text>
    <rect class="card-sess" x="36" y="262" width="206" height="128" rx="10"/>
    <text class="lbl" x="50" y="282">FLOW-ISOLATED</text>
    <text class="code" x="50" y="304">alice ·</text>
    <text class="code" x="50" y="320">acme.support.ada</text>
    <text class="muted" x="50" y="346">One cell per seat</text>
    <text class="muted" x="50" y="362">address. Other seats</text>
    <text class="muted" x="50" y="378">don't read it.</text>
    <rect class="ghost" x="258" y="262" width="206" height="128" rx="10"/>
    <text class="code" x="272" y="304">alice ·</text>
    <text class="code" x="272" y="320">acme.~alice.research</text>
    <text class="muted" x="272" y="346">Another isolated seat,</text>
    <text class="muted" x="272" y="362">another cell</text>
  </g>

  <g id="globex">
    <rect class="wall-org" x="492" y="80" width="200" height="324" rx="14"/>
    <text class="h" x="508" y="104">Organization: globex</text>
    <text class="muted" x="508" y="122">Seats pinned to globex</text>
    <rect class="card" x="504" y="138" width="176" height="112" rx="10"/>
    <text class="lbl" x="518" y="158">ALICE IN GLOBEX</text>
    <text class="p" x="518" y="182">Her own cell here,</text>
    <text class="p" x="518" y="200">empty until a seat</text>
    <text class="p" x="518" y="218">in globex writes it</text>
    <text class="muted" x="508" y="280">acme's seats can't</text>
    <text class="muted" x="508" y="298">read it, and globex's</text>
    <text class="muted" x="508" y="316">can't read acme's.</text>
  </g>

  <g id="outside">
    <rect class="wall-proc" x="708" y="80" width="208" height="324" rx="14"/>
    <text class="h" x="724" y="104">Outside hired seats</text>
    <text class="muted" x="724" y="122">Your app's other flows</text>
    <rect class="card" x="720" y="138" width="184" height="112" rx="10"/>
    <text class="lbl" x="734" y="158">ALICE'S OWN DATA</text>
    <text class="p" x="734" y="182">Keyed by her id</text>
    <text class="p" x="734" y="200">alone, such as</text>
    <text class="p" x="734" y="218">preferences</text>
    <text class="muted" x="724" y="280">No hired seat reads</text>
    <text class="muted" x="724" y="298">or writes it.</text>
  </g>

  <g id="not-a-copy">
    <rect class="box" x="24" y="420" width="892" height="104" rx="12"/>
    <text class="h" x="40" y="444">Not a copy</text>
    <text class="p" x="40" y="468">Nothing moves between organizations, and no setting makes it move. A seat in globex starts without what acme's seats saved.</text>
    <text class="p" x="40" y="488">A resource's own flowIsolation decides which acme cell it uses; one that doesn't set it follows the kind's isolateUserState.</text>
    <text class="p" x="40" y="508">A projected resource is stored by your hooks, not by these cells. Key its rows by orgId too.</text>
  </g>
</svg>
