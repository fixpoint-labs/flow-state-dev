<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 512" role="img" aria-labelledby="title desc">
  <title id="title">Where each component reads from, and when it reads</title>
  <desc id="desc">One session's items feed messages, task plans and approval cards, live and still there after a reload. An organization's standing collection feeds the roster, the board columns and the board list, read once on mount. Your server's flow list feeds the navigator, read once, with a leaf's sessions read when that leaf opens.</desc>
  <style>
    :root { --bg:#ffffff; --ink:#0f172a; --ink-2:#334155; --muted:#64748b;
            --proc-fill:#faf5ff; --proc:#7e22ce; --sess-fill:#eff6ff; --sess:#1d4ed8;
            --org-fill:#f0fdf4; --org:#15803d; --card:#ffffff; --card-line:#334155; --box:#f8fafc; }
    @media (prefers-color-scheme: dark) {
      :root { --bg:#0e0e14; --ink:#e5e7eb; --ink-2:#cbd5e1; --muted:#94a3b8;
              --proc-fill:#1d1030; --proc:#c084fc; --sess-fill:#0f1a33; --sess:#60a5fa;
              --org-fill:#0b2016; --org:#4ade80; --card:#14141c; --card-line:#64748b; --box:#181822; } }
    .bg { fill:var(--bg); }
    .wall-proc { fill:var(--proc-fill); stroke:var(--proc); stroke-width:2; }
    .wall-sess { fill:var(--sess-fill); stroke:var(--sess); stroke-width:2; }
    .wall-org { fill:var(--org-fill); stroke:var(--org); stroke-width:2; }
    .wall-file { fill:var(--box); stroke:var(--card-line); stroke-width:2; }
    .card { fill:var(--card); stroke:var(--card-line); stroke-width:1.5; }
    .card-sess { fill:var(--card); stroke:var(--sess); stroke-width:1.5; }
    .box { fill:var(--box); stroke:var(--card-line); stroke-width:1.2; }
    .title { font:700 20px ui-sans-serif, system-ui, sans-serif; fill:var(--ink); }
    .h { font:700 14px ui-sans-serif, system-ui, sans-serif; fill:var(--ink); }
    .p { font:13px ui-sans-serif, system-ui, sans-serif; fill:var(--ink-2); }
    .muted { font:12px ui-sans-serif, system-ui, sans-serif; fill:var(--muted); }
    .lbl { font:600 10px ui-monospace, SFMono-Regular, Menlo, monospace; letter-spacing:.08em; fill:var(--muted); }
    .code { font:11.5px ui-monospace, SFMono-Regular, Menlo, monospace; fill:var(--ink); }
  </style>

  <rect class="bg" x="0" y="0" width="940" height="512" rx="16"/>
  <text class="title" x="24" y="38">Three places a component reads</text>
  <text class="muted" x="24" y="60">Where it reads decides what it shows and when it changes.</text>

  <g id="session">
    <rect class="wall-sess" x="24" y="80" width="286" height="300" rx="14"/>
    <text class="h" x="40" y="104">One session's items</text>
    <text class="muted" x="40" y="122">What this conversation persisted</text>
    <rect class="card-sess" x="36" y="138" width="262" height="98" rx="10"/>
    <text class="lbl" x="50" y="158">READ BY</text>
    <text class="code" x="50" y="180">messages</text>
    <text class="code" x="50" y="198">task plans</text>
    <text class="code" x="50" y="216">approval cards</text>
    <text class="p" x="40" y="268">Arrive live, as items land.</text>
    <text class="p" x="40" y="290">Still there after a reload.</text>
  </g>

  <g id="org">
    <rect class="wall-org" x="327" y="80" width="286" height="300" rx="14"/>
    <text class="h" x="343" y="104">An organization's collection</text>
    <text class="muted" x="343" y="122">Outside any one session</text>
    <rect class="card" x="339" y="138" width="262" height="98" rx="10"/>
    <text class="lbl" x="353" y="158">READ BY</text>
    <text class="code" x="353" y="180">Roster</text>
    <text class="code" x="353" y="198">BoardColumns</text>
    <text class="code" x="353" y="216">BoardList</text>
    <text class="p" x="343" y="268">Everyone in the organization</text>
    <text class="p" x="343" y="286">sees the same rows.</text>
    <text class="p" x="343" y="312">Read once, on mount. Not watched.</text>
    <text class="muted" x="343" y="338">BoardList with live reads again when</text>
    <text class="muted" x="343" y="356">its session records a board change.</text>
  </g>

  <g id="server">
    <rect class="wall-proc" x="630" y="80" width="286" height="300" rx="14"/>
    <text class="h" x="646" y="104">Your server's flow list</text>
    <text class="muted" x="646" y="122">The kinds and copies it serves</text>
    <rect class="card" x="642" y="138" width="262" height="98" rx="10"/>
    <text class="lbl" x="656" y="158">READ BY</text>
    <text class="code" x="656" y="180">FlowNavigator</text>
    <text class="muted" x="656" y="206">One read, however many</text>
    <text class="muted" x="656" y="222">sections it draws.</text>
    <text class="p" x="646" y="268">Read once, on mount.</text>
    <text class="p" x="646" y="294">A leaf's sessions are read</text>
    <text class="p" x="646" y="312">only when that leaf opens.</text>
  </g>

  <g id="read-again">
    <rect class="box" x="24" y="396" width="892" height="100" rx="12"/>
    <text class="h" x="40" y="420">To read again</text>
    <text class="p" x="40" y="444">Items need nothing: they keep arriving.</text>
    <text class="p" x="40" y="464">A panel reads again when its React key changes.</text>
    <text class="p" x="40" y="484">The navigator's leafToolbar slot is handed a refresh function for the open leaf's sessions.</text>
  </g>
</svg>
