<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 34 940 617">
<defs>
<pattern id="hatch" width="5" height="5" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line class="hatch-line" x1="0" y1="0" x2="0" y2="5"/></pattern>
<marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ink" d="M0,0 L10,5 L0,10 z"/></marker>
</defs>
<rect fill="url(#hatch)" x="24" y="56" width="496" height="10"/><line class="thin" x1="24" y1="66.5" x2="520" y2="66.5"/>
<rect class="solid" x="24" y="56" width="496" height="316"/>
<text class="lb" x="38" y="88">RESOURCE · SESSION, USER OR ORG</text>
<text class="sub" x="506" y="88" text-anchor="end">across requests</text>
<rect class="dash" x="38" y="102" width="468" height="256"/>
<text class="lb" x="52" y="124">REQUEST · THE DEFAULT</text>
<text class="sub" x="492" y="124" text-anchor="end">the whole request</text>
<rect class="dash" x="52" y="138" width="440" height="206"/>
<text class="lb" x="66" y="160">SEQUENCER</text>
<text class="sub" x="478" y="160" text-anchor="end">one board.drain call</text>
<rect class="thin" x="66" y="174" width="412" height="156"/>
<text class="nm" x="78" y="196">The task rows</text>
<text class="sub" x="78" y="214">data: goal · status · assignee · input · output</text>
<line class="hi" x1="66" y1="226" x2="478" y2="226"/>
<text class="c" x="78" y="248">task-0</text>
<text class="c" x="150" y="248">pending</text>
<text class="c" x="250" y="248">goal · assignee · input</text>
<line class="hi" x1="66" y1="258" x2="478" y2="258"/>
<text class="c" x="78" y="274">task-1</text>
<text class="c" x="150" y="274">completed</text>
<text class="c" x="250" y="274">output: "ALPHA"</text>
<line class="hi" x1="66" y1="284" x2="478" y2="284"/>
<text class="c" x="78" y="300">task-2</text>
<text class="c" x="150" y="300">errored</text>
<text class="t" x="24" y="396">The backing you choose sets how long the rows last.</text>
<text class="t" x="24" y="414">One backing per board. An outer ring outlasts an inner one.</text>
<text class="lb" x="560" y="70">THE DRAIN</text>
<text class="c" x="560" y="92">board.drain</text>
<text class="sub" x="560" y="110">a block you mount in a flow</text>
<line class="solid" x1="588" y1="136" x2="612" y2="136"/>
<text class="lb" x="622" y="140">A REQUEST RUNS IT</text>
<line class="dash" x1="600" y1="136" x2="600" y2="330"/>
<line class="solid" x1="588" y1="330" x2="612" y2="330"/>
<text class="t" x="622" y="334">Stops when no row is left it can run.</text>
<rect class="ground" x="587.6" y="303" width="24.7" height="15"/><text class="plate" x="600" y="314" text-anchor="middle">04</text>
<line class="ln" x1="599" y1="248" x2="480" y2="248" marker-end="url(#ah)"/>
<rect class="ground" x="525.6" y="241" width="68.8" height="15"/><text class="plate" x="560" y="252" text-anchor="middle">01 CLAIM</text>
<line class="ln" x1="601" y1="270" x2="761" y2="270" marker-end="url(#ah)"/>
<rect class="ground" x="639.0" y="263" width="90.1" height="15"/><text class="plate" x="684" y="274" text-anchor="middle">02 DISPATCH</text>
<rect class="thin" x="762" y="252" width="154" height="36"/>
<text class="t" x="774" y="275">its worker</text>
<line class="ln" x1="599" y1="290" x2="480" y2="290" marker-end="url(#ah)"/>
<rect class="ground" x="529.1" y="283" width="61.7" height="15"/><text class="plate" x="560" y="294" text-anchor="middle">03 MARK</text>
<text class="t" x="560" y="396">No request running it, no work done.</text>
<text class="t" x="560" y="414">A row added by another request wakes nothing.</text>
<line class="hi" x1="0" y1="440" x2="940" y2="440"/>
<text class="n" x="24" y="466">01</text>
<text class="t" x="56" y="466">While a request runs it, the drain claims the pending rows.</text>
<text class="n" x="24" y="491">02</text>
<text class="t" x="56" y="491">It hands each one to its worker.</text>
<text class="n" x="24" y="516">03</text>
<text class="t" x="56" y="516">It marks the row completed or errored.</text>
<text class="n" x="24" y="541">04</text>
<text class="t" x="56" y="541">It stops when no row is left it can run, which can leave rows waiting on a dependency or a person.</text>
<text class="n" x="24" y="566">05</text>
<text class="t" x="56" y="566">Not a background queue. Rows nobody drains wait where they are, for as long as their backing lasts.</text>
<text class="t" x="56" y="583">To run work outside the request that made it, dispatch a fresh flow run that builds and drains its</text>
<text class="t" x="56" y="600">own board.</text>
<line class="ln" x1="24" y1="627" x2="50" y2="627" marker-end="url(#ah)"/>
<text class="lb" x="58" y="631">THE DRAIN WORKS A ROW</text>
<line class="dash" x1="255.5" y1="627" x2="281.5" y2="627"/>
<text class="lb" x="289.5" y="631">DOES NOT OUTLAST THE REQUEST</text>
<rect fill="url(#hatch)" x="539.5" y="621" width="26" height="11"/><rect class="thin" x="539.5" y="621" width="26" height="11"/>
<text class="lb" x="573.5" y="631">OUTLIVES THE REQUEST</text>
</svg>
