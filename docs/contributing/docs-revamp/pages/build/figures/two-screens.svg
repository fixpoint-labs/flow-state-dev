<rect class="ground" fill="#f0ece1" x="288.7" y="116.5" width="24.6" height="15"/>
<text class="plate" fill="#1b1a15" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="10.5px" font-weight="500" letter-spacing="1px" x="301" y="127.5" text-anchor="middle">01</text>
<line class="ln" fill="none" stroke="#1b1a15" stroke-width="1.3" x1="668" y1="124" x2="570" y2="124" marker-end="url(#ah)"/>
<rect class="ground" fill="#f0ece1" x="606.7" y="116.5" width="24.6" height="15"/>
<text class="plate" fill="#1b1a15" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="10.5px" font-weight="500" letter-spacing="1px" x="619" y="127.5" text-anchor="middle">02</text>
<line class="hi" fill="none" stroke="rgba(27, 26, 21, 0.25)" stroke-width="1" x1="0" y1="268" x2="920" y2="268"/>
<text class="n" fill="#1b1a15" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="11px" font-weight="500" x="28" y="294">01</text>
<text class="t" fill="#3d3a32" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="12px" font-weight="500" x="60" y="294">The refund page sends the action. The run stops at approveRefund and is stored as suspended.</text>
<text class="n" fill="#1b1a15" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="11px" font-weight="500" x="28" y="319">02</text>
<text class="t" fill="#3d3a32" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="12px" font-weight="500" x="60" y="319">The approvals page reads the session's items, lists the open question and sends the answer.</text>
<text class="n" fill="#1b1a15" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="11px" font-weight="500" x="28" y="344">03</text>
<text class="t" fill="#3d3a32" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="12px" font-weight="500" x="60" y="344">Both pages belong to one signed-in user. Another user's answer is refused as if the run did not exist.</text>
<g id="key">
<line class="ln" fill="none" stroke="#1b1a15" stroke-width="1.3" x1="28" y1="371" x2="54" y2="371" marker-end="url(#ah)"/>
<text class="lb" fill="#57544a" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="10px" font-weight="500" letter-spacing="1.5px" x="62" y="375">SENDS TO THE RUN</text>
<rect fill="url(#hatch)" x="214.0" y="365" width="26" height="11"/><rect class="thin" fill="none" stroke="#1b1a15" stroke-width="1" x="214.0" y="365" width="26" height="11"/>
<text class="lb" fill="#57544a" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="10px" font-weight="500" letter-spacing="1.5px" x="248.0" y="375">OUTLIVES THE REQUEST</text>
<rect class="hl" fill="#e8f551" x="430.0" y="365" width="26" height="11"/>
<text class="lb" fill="#57544a" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="10px" font-weight="500" letter-spacing="1.5px" x="464.0" y="375">THE ANSWER</text>
