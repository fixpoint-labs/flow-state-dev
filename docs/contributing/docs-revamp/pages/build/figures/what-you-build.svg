<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 422">
<defs>
<pattern id="hatch" width="5" height="5" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line class="hatch-line" stroke="rgba(27, 26, 21, 0.45)" stroke-width="1" x1="0" y1="0" x2="0" y2="5"/></pattern>
<marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ink" fill="#1b1a15" d="M0,0 L10,5 L0,10 z"/></marker>
</defs>
<rect class="dash" fill="none" stroke="#1b1a15" stroke-width="1.4" stroke-dasharray="5 4" x="28" y="24" width="520" height="266"/>
<text class="lb" fill="#57544a" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="10px" font-weight="500" letter-spacing="1.5px" x="42" y="46">THE ACTION RUN</text>
<text class="nm" fill="#1b1a15" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="15px" font-weight="500" x="170" y="47">chat</text>
<text class="sub" fill="#57544a" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="10.5px" font-weight="500" x="42" y="66">a page calls this, never a block</text>
<rect class="thin" fill="none" stroke="#1b1a15" stroke-width="1" x="42" y="84" width="492" height="190"/>
<text class="lb" fill="#57544a" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="10px" font-weight="500" letter-spacing="1.5px" x="56" y="106">SEQUENCER</text>
<text class="c" fill="#1b1a15" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="12.5px" font-weight="500" x="140" y="106">chat-pipeline</text>
<rect class="thin" fill="none" stroke="#1b1a15" stroke-width="1" x="56" y="118" width="464" height="50"/>
<text class="c" fill="#1b1a15" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="12.5px" font-weight="500" x="70" y="140">count-message</text>
<text class="sub" fill="#57544a" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="10.5px" font-weight="500" x="70" y="158">handler · adds one to messageCount</text>
<line class="ln" fill="none" stroke="#1b1a15" stroke-width="1.3" x1="288" y1="168" x2="288" y2="208" marker-end="url(#ah)"/>
<rect class="thin" fill="none" stroke="#1b1a15" stroke-width="1" x="56" y="208" width="464" height="50"/>
<text class="c" fill="#1b1a15" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="12.5px" font-weight="500" x="70" y="230">chat-generator</text>
<text class="sub" fill="#57544a" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="10.5px" font-weight="500" x="70" y="248">generator · asks the model, streams the reply</text>
<rect fill="url(#hatch)" x="660" y="24" width="232" height="10"/><line class="thin" fill="none" stroke="#1b1a15" stroke-width="1" x1="660" y1="34.5" x2="892" y2="34.5"/>
<rect class="solid" fill="none" stroke="#1b1a15" stroke-width="1.4" x="660" y="24" width="232" height="266"/>
<text class="lb" fill="#57544a" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="10px" font-weight="500" letter-spacing="1.5px" x="674" y="56">ONE SESSION</text>
<text class="sub" fill="#57544a" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="10.5px" font-weight="500" x="674" y="74">kept between runs</text>
<rect class="hl" fill="#e8f551" x="674" y="92" width="204" height="56"/>
<rect class="thin" fill="none" stroke="#1b1a15" stroke-width="1" x="674" y="92" width="204" height="56"/>
<text class="c on-hl" fill="#1b1a15" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="12.5px" font-weight="500" x="776" y="116" text-anchor="middle">messageCount</text>
<text class="sub on-hl" fill="#1b1a15" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="10.5px" font-weight="500" x="776" y="134" text-anchor="middle">session state</text>
<rect class="thin" fill="none" stroke="#1b1a15" stroke-width="1" x="674" y="208" width="204" height="56"/>
<text class="c" fill="#1b1a15" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="12.5px" font-weight="500" x="688" y="232">messages</text>
<text class="sub" fill="#57544a" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="10.5px" font-weight="500" x="688" y="250">yours and the model's</text>
<line class="ln" fill="none" stroke="#1b1a15" stroke-width="1.3" x1="520" y1="143" x2="660" y2="143" marker-start="url(#ah)" marker-end="url(#ah)"/>
<line class="ln" fill="none" stroke="#1b1a15" stroke-width="1.3" x1="520" y1="233" x2="660" y2="233" marker-start="url(#ah)" marker-end="url(#ah)"/>
<line class="hi" fill="none" stroke="rgba(27, 26, 21, 0.25)" stroke-width="1" x1="0" y1="318" x2="920" y2="318"/>
<text class="n" fill="#1b1a15" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="11px" font-weight="500" x="28" y="344">01</text>
<text class="t" fill="#3d3a32" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="12px" font-weight="500" x="60" y="344">A page calls the action chat. It never calls a block.</text>
<text class="n" fill="#1b1a15" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="11px" font-weight="500" x="28" y="369">02</text>
<text class="t" fill="#3d3a32" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="12px" font-weight="500" x="60" y="369">The run is gone when the reply is done. The session stays, so the next message finds the count.</text>
<g id="key">
<line class="ln" fill="none" stroke="#1b1a15" stroke-width="1.3" x1="28" y1="396" x2="54" y2="396" marker-end="url(#ah)"/>
<text class="lb" fill="#57544a" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="10px" font-weight="500" letter-spacing="1.5px" x="62" y="400">THEN</text>
<line class="ln" fill="none" stroke="#1b1a15" stroke-width="1.3" x1="124" y1="396" x2="150" y2="396" marker-start="url(#ah)" marker-end="url(#ah)"/>
<text class="lb" fill="#57544a" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="10px" font-weight="500" letter-spacing="1.5px" x="158" y="400">READS AND WRITES</text>
<line class="dash" fill="none" stroke="#1b1a15" stroke-width="1.4" stroke-dasharray="5 4" x1="310" y1="396" x2="336" y2="396"/>
<text class="lb" fill="#57544a" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="10px" font-weight="500" letter-spacing="1.5px" x="344" y="400">LASTS ONE ACTION RUN</text>
<rect fill="url(#hatch)" x="526" y="390" width="26" height="11"/><rect class="thin" fill="none" stroke="#1b1a15" stroke-width="1" x="526" y="390" width="26" height="11"/>
<text class="lb" fill="#57544a" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="10px" font-weight="500" letter-spacing="1.5px" x="560" y="400">OUTLIVES THE REQUEST</text>
<rect class="hl" fill="#e8f551" x="742" y="390" width="26" height="11"/>
<text class="lb" fill="#57544a" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="10px" font-weight="500" letter-spacing="1.5px" x="776" y="400">THE COUNT</text>
</g>
</svg>
