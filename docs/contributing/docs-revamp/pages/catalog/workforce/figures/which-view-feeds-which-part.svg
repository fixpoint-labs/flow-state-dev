<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 485">
<defs>
<pattern id="hatch" width="5" height="5" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line class="hatch-line" stroke="rgba(27, 26, 21, 0.45)" stroke-width="1" x1="0" y1="0" x2="0" y2="5"/></pattern>
<marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ink" fill="#1b1a15" d="M0,0 L10,5 L0,10 z"/></marker>
</defs>
<rect class="solid" fill="none" stroke="#1b1a15" stroke-width="1.4" x="28" y="24" width="400" height="84"/>
<text class="lb" fill="#57544a" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="10px" font-weight="500" letter-spacing="1.5px" x="42" y="46">ROSTER RAIL</text>
<text class="c" fill="#1b1a15" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="12.5px" font-weight="500" x="42" y="70">useView(rosterView)</text>
<text class="sub" fill="#57544a" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="10.5px" font-weight="500" x="42" y="90">one row per worker</text>
<rect fill="url(#hatch)" x="560" y="24" width="332" height="10"/><line class="thin" fill="none" stroke="#1b1a15" stroke-width="1" x1="560" y1="34.5" x2="892" y2="34.5"/>
<rect class="solid" fill="none" stroke="#1b1a15" stroke-width="1.4" x="560" y="24" width="332" height="84"/>
<text class="lb" fill="#57544a" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="10px" font-weight="500" letter-spacing="1.5px" x="574" y="56">WORKERS</text>
<text class="nm" fill="#1b1a15" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="15px" font-weight="500" x="574" y="76">Hired workers</text>
<text class="sub" fill="#57544a" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="10.5px" font-weight="500" x="574" y="94">plus standard workers from WORKER.md</text>
<line class="ln" fill="none" stroke="#1b1a15" stroke-width="1.3" x1="428" y1="66" x2="558" y2="66" marker-end="url(#ah)"/>
<rect class="solid" fill="none" stroke="#1b1a15" stroke-width="1.4" x="28" y="124" width="400" height="84"/>
<text class="lb" fill="#57544a" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="10px" font-weight="500" letter-spacing="1.5px" x="42" y="146">SESSION LIST UNDER A WORKER</text>
<text class="c" fill="#1b1a15" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="12.5px" font-weight="500" x="42" y="170">FlowNavigator</text>
<text class="sub" fill="#57544a" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="10.5px" font-weight="500" x="42" y="190">a mark on each session's latest request</text>
<rect fill="url(#hatch)" x="560" y="124" width="332" height="10"/><line class="thin" fill="none" stroke="#1b1a15" stroke-width="1" x1="560" y1="134.5" x2="892" y2="134.5"/>
<rect class="solid" fill="none" stroke="#1b1a15" stroke-width="1.4" x="560" y="124" width="332" height="84"/>
<text class="lb" fill="#57544a" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="10px" font-weight="500" letter-spacing="1.5px" x="574" y="156">SESSIONS</text>
<text class="nm" fill="#1b1a15" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="15px" font-weight="500" x="574" y="176">The user's sessions</text>
<text class="sub" fill="#57544a" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="10.5px" font-weight="500" x="574" y="194">each with its latest request status</text>
<line class="ln" fill="none" stroke="#1b1a15" stroke-width="1.3" x1="428" y1="166" x2="558" y2="166" marker-end="url(#ah)"/>
<rect class="solid" fill="none" stroke="#1b1a15" stroke-width="1.4" x="28" y="224" width="400" height="84"/>
<text class="lb" fill="#57544a" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="10px" font-weight="500" letter-spacing="1.5px" x="42" y="246">THIS CONVERSATION'S TASKS</text>
<text class="c" fill="#1b1a15" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="12.5px" font-weight="500" x="42" y="270">useView(taskListViewRef(...))</text>
<text class="sub" fill="#57544a" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="10.5px" font-weight="500" x="42" y="290">one conversation's board</text>
<rect fill="url(#hatch)" x="560" y="224" width="332" height="10"/><line class="thin" fill="none" stroke="#1b1a15" stroke-width="1" x1="560" y1="234.5" x2="892" y2="234.5"/>
<rect class="solid" fill="none" stroke="#1b1a15" stroke-width="1.4" x="560" y="224" width="332" height="84"/>
<text class="lb" fill="#57544a" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="10px" font-weight="500" letter-spacing="1.5px" x="574" y="256">TASKS LEDGER</text>
<text class="nm" fill="#1b1a15" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="15px" font-weight="500" x="574" y="276">One conversation's tasks</text>
<text class="sub" fill="#57544a" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="10.5px" font-weight="500" x="574" y="294">filed from the session you name</text>
<line class="ln" fill="none" stroke="#1b1a15" stroke-width="1.3" x1="428" y1="266" x2="558" y2="266" marker-end="url(#ah)"/>
<rect class="solid" fill="none" stroke="#1b1a15" stroke-width="1.4" x="28" y="324" width="400" height="84"/>
<text class="lb" fill="#57544a" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="10px" font-weight="500" letter-spacing="1.5px" x="42" y="346">ALL TASKS</text>
<text class="c" fill="#1b1a15" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="12.5px" font-weight="500" x="42" y="370">&lt;BoardColumns boardRef="tasks" live /&gt;</text>
<text class="sub" fill="#57544a" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="10.5px" font-weight="500" x="42" y="390">a board across conversations</text>
<rect fill="url(#hatch)" x="560" y="324" width="332" height="10"/><line class="thin" fill="none" stroke="#1b1a15" stroke-width="1" x1="560" y1="334.5" x2="892" y2="334.5"/>
<rect class="solid" fill="none" stroke="#1b1a15" stroke-width="1.4" x="560" y="324" width="332" height="84"/>
<text class="lb" fill="#57544a" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="10px" font-weight="500" letter-spacing="1.5px" x="574" y="356">TASKS LEDGER</text>
<text class="nm" fill="#1b1a15" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="15px" font-weight="500" x="574" y="376">Every conversation's tasks</text>
<text class="sub" fill="#57544a" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="10.5px" font-weight="500" x="574" y="394">every session the user filed from</text>
<line class="ln" fill="none" stroke="#1b1a15" stroke-width="1.3" x1="428" y1="366" x2="558" y2="366" marker-end="url(#ah)"/>
<line class="hi" fill="none" stroke="rgba(27, 26, 21, 0.25)" stroke-width="1" x1="0" y1="432" x2="920" y2="432"/>
<g id="key">
<line class="ln" fill="none" stroke="#1b1a15" stroke-width="1.3" x1="28" y1="459" x2="54" y2="459" marker-end="url(#ah)"/>
<text class="lb" fill="#57544a" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="10px" font-weight="500" letter-spacing="1.5px" x="62" y="463">READS</text>
<rect fill="url(#hatch)" x="180" y="453" width="26" height="11"/><rect class="thin" fill="none" stroke="#1b1a15" stroke-width="1" x="180" y="453" width="26" height="11"/>
<text class="lb" fill="#57544a" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="10px" font-weight="500" letter-spacing="1.5px" x="214" y="463">OUTLIVES THE REQUEST</text>
</g>
</svg>
