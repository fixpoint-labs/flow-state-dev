<text class="c" fill="#1b1a15" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="12.5px" font-weight="500" x="42" y="192">writer</text>
<rect class="solid" fill="none" stroke="#1b1a15" stroke-width="1.4" x="350" y="24" width="220" height="200"/>
