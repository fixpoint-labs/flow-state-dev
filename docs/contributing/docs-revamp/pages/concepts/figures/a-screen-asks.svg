<rect class="hl" fill="#e8f551" x="358" y="56" width="204" height="26"/>
<text class="nm on-hl" fill="#1b1a15" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="15px" font-weight="500" x="364" y="75">roster</text>
