<rect class="solid" fill="none" stroke="#1b1a15" stroke-width="1.4" x="672" y="24" width="220" height="200"/>
<text class="lb" fill="#57544a" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="10px" font-weight="500" letter-spacing="1.5px" x="686" y="56">THE STORED DATA</text>
