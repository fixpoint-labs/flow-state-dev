<text class="t" fill="#3d3a32" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="12px" font-weight="500" x="28" y="352">summarizeOrder turns the tools preset off, so it gets two of the three parts.</text>
<g id="key">
