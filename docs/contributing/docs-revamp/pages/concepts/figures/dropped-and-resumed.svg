<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 337">
<defs>
<pattern id="hatch" width="5" height="5" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line class="hatch-line" stroke="rgba(27, 26, 21, 0.45)" stroke-width="1" x1="0" y1="0" x2="0" y2="5"/></pattern>
<marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ink" fill="#1b1a15" d="M0,0 L10,5 L0,10 z"/></marker>
</defs>
<rect class="solid" fill="none" stroke="#1b1a15" stroke-width="1.4" x="28" y="24" width="264" height="160"/>
<rect class="solid" fill="none" stroke="#1b1a15" stroke-width="1.4" x="328" y="24" width="264" height="160"/>
<rect class="solid" fill="none" stroke="#1b1a15" stroke-width="1.4" x="628" y="24" width="264" height="160"/>
<text class="lb" fill="#57544a" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="10px" font-weight="500" letter-spacing="1.5px" x="42" y="46">THE BROWSER, LIVE</text>
<text class="c" fill="#1b1a15" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="12.5px" font-weight="500" x="42" y="68">events 1 to 41</text>
<text class="sub" fill="#57544a" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="10.5px" font-weight="500" x="42" y="90">the reply so far</text>
<text class="c" fill="#1b1a15" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="12.5px" font-weight="500" x="42" y="112">"Your order shi"</text>
<text class="lb" fill="#57544a" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="10px" font-weight="500" letter-spacing="1.5px" x="342" y="46">THE REQUEST, STILL RUNNING</text>
<text class="c" fill="#1b1a15" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="12.5px" font-weight="500" x="342" y="68">events 42 to 57</text>
<text class="sub" fill="#57544a" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="10.5px" font-weight="500" x="342" y="90">nobody is listening</text>
<text class="sub" fill="#57544a" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="10.5px" font-weight="500" x="342" y="108">the reply finishes anyway</text>
<text class="lb" fill="#57544a" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="10px" font-weight="500" letter-spacing="1.5px" x="642" y="46">THE BROWSER, BACK</text>
<rect class="hl" fill="#e8f551" x="636" y="51" width="140" height="26"/>
<text class="c on-hl" fill="#1b1a15" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="12.5px" font-weight="500" x="642" y="68">starting_after=41</text>
<text class="sub" fill="#57544a" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="10.5px" font-weight="500" x="642" y="96">events 42 onward are sent</text>
<text class="sub" fill="#57544a" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="10.5px" font-weight="500" x="642" y="114">the reply text snaps to</text>
<text class="sub" fill="#57544a" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="10.5px" font-weight="500" x="642" y="132">its saved copy, then grows</text>
<line class="ln x" fill="none" stroke="#a83e28" stroke-width="1.3" x1="326" y1="104" x2="302" y2="104"/><line class="ln x" fill="none" stroke="#a83e28" stroke-width="1.3" x1="302" y1="96" x2="302" y2="112"/>
<line class="ln" fill="none" stroke="#1b1a15" stroke-width="1.3" x1="594" y1="104" x2="626" y2="104" marker-end="url(#ah)"/>
<line class="hi" fill="none" stroke="rgba(27, 26, 21, 0.25)" stroke-width="1" x1="0" y1="208" x2="920" y2="208"/>
<text class="n" fill="#1b1a15" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="11px" font-weight="500" x="28" y="234">01</text>
<text class="t" fill="#3d3a32" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="12px" font-weight="500" x="60" y="234">The connection drops after event 41. The request keeps running on the server.</text>
<text class="n" fill="#1b1a15" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="11px" font-weight="500" x="28" y="259">02</text>
<text class="t" fill="#3d3a32" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="12px" font-weight="500" x="60" y="259">The browser reconnects and asks for everything after 41. A finished request replays the same way.</text>
<text class="n" fill="#1b1a15" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="11px" font-weight="500" x="28" y="284">03</text>
<text class="t" fill="#3d3a32" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="12px" font-weight="500" x="60" y="284">Pieces of a half-written reply are not replayed. The text snaps to its latest saved copy, then grows again.</text>
<g id="key">
<line class="ln" fill="none" stroke="#1b1a15" stroke-width="1.3" x1="28" y1="311" x2="54" y2="311" marker-end="url(#ah)"/>
<text class="lb" fill="#57544a" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="10px" font-weight="500" letter-spacing="1.5px" x="62" y="315">REPLAYED TO THE BROWSER</text>
<rect class="hl" fill="#e8f551" x="267" y="305" width="26" height="11"/>
<text class="lb" fill="#57544a" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="10px" font-weight="500" letter-spacing="1.5px" x="301" y="315">RESUMES AT THE NEXT NUMBER</text>
<line class="ln x" fill="none" stroke="#a83e28" stroke-width="1.3" x1="528" y1="311" x2="554" y2="311"/>
<text class="lb" fill="#57544a" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="10px" font-weight="500" letter-spacing="1.5px" x="562" y="315">CONNECTION LOST</text>
</g>
</svg>
