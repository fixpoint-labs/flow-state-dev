<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 457">
<defs>
<pattern id="hatch" width="5" height="5" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line class="hatch-line" stroke="rgba(27, 26, 21, 0.45)" stroke-width="1" x1="0" y1="0" x2="0" y2="5"/></pattern>
<marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ink" fill="#1b1a15" d="M0,0 L10,5 L0,10 z"/></marker>
</defs>
<rect class="dash" fill="none" stroke="#1b1a15" stroke-width="1.4" stroke-dasharray="5 4" x="28" y="24" width="864" height="280"/>
<text class="lb" fill="#57544a" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="10px" font-weight="500" letter-spacing="1.5px" x="42" y="46">THE LOOP YOU NEVER WRITE · RUNS IN A REQUEST</text>
<rect class="solid" fill="none" stroke="#1b1a15" stroke-width="1.4" x="52" y="64" width="300" height="216"/>
<text class="lb" fill="#57544a" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="10px" font-weight="500" letter-spacing="1.5px" x="66" y="86">THE MODEL · ONE STEP</text>
<text class="c" fill="#1b1a15" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="12.5px" font-weight="500" x="66" y="108">supportAgent</text>
<line class="hi" fill="none" stroke="rgba(27, 26, 21, 0.25)" stroke-width="1" x1="52" y1="122" x2="352" y2="122"/>
<text class="c" fill="#1b1a15" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="12.5px" font-weight="500" x="66" y="146">reads prompt + message</text>
<line class="hi" fill="none" stroke="rgba(27, 26, 21, 0.25)" stroke-width="1" x1="52" y1="160" x2="352" y2="160"/>
<rect class="hl" fill="#e8f551" x="60" y="168" width="284" height="28"/>
<text class="c on-hl" fill="#1b1a15" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="12.5px" font-weight="500" x="66" y="186">the model picks the next call</text>
<line class="hi" fill="none" stroke="rgba(27, 26, 21, 0.25)" stroke-width="1" x1="52" y1="204" x2="352" y2="204"/>
<text class="c" fill="#1b1a15" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="12.5px" font-weight="500" x="66" y="226">gets the result back</text>
<line class="hi" fill="none" stroke="rgba(27, 26, 21, 0.25)" stroke-width="1" x1="52" y1="240" x2="352" y2="240"/>
<text class="c" fill="#1b1a15" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="12.5px" font-weight="500" x="66" y="262">no call left: the answer</text>
<rect class="solid" fill="none" stroke="#1b1a15" stroke-width="1.4" x="568" y="64" width="300" height="216"/>
<text class="lb" fill="#57544a" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="10px" font-weight="500" letter-spacing="1.5px" x="582" y="86">A BLOCK USED AS A TOOL</text>
<text class="c" fill="#1b1a15" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="12.5px" font-weight="500" x="582" y="108">lookUpOrder</text>
<line class="hi" fill="none" stroke="rgba(27, 26, 21, 0.25)" stroke-width="1" x1="568" y1="122" x2="868" y2="122"/>
<text class="c" fill="#1b1a15" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="12.5px" font-weight="500" x="582" y="146">in: { orderId: "A-1001" }</text>
<line class="hi" fill="none" stroke="rgba(27, 26, 21, 0.25)" stroke-width="1" x1="568" y1="160" x2="868" y2="160"/>
<text class="c" fill="#1b1a15" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="12.5px" font-weight="500" x="582" y="186">the framework runs it</text>
<line class="hi" fill="none" stroke="rgba(27, 26, 21, 0.25)" stroke-width="1" x1="568" y1="204" x2="868" y2="204"/>
<text class="c" fill="#1b1a15" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="12.5px" font-weight="500" x="582" y="226">out: "shipped Tuesday"</text>
<line class="hi" fill="none" stroke="rgba(27, 26, 21, 0.25)" stroke-width="1" x1="568" y1="240" x2="868" y2="240"/>
<text class="sub" fill="#57544a" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="10.5px" font-weight="500" x="582" y="262">a handler, in tools</text>
<line class="ln" fill="none" stroke="#1b1a15" stroke-width="1.3" x1="352" y1="182" x2="566" y2="182" marker-end="url(#ah)"/>
<rect class="ground" fill="#f0ece1" x="446.7" y="175" width="24.6" height="15"/><text class="plate" fill="#1b1a15" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="10.5px" font-weight="500" letter-spacing="1px" x="459" y="186" text-anchor="middle">01</text>
<line class="ln" fill="none" stroke="#1b1a15" stroke-width="1.3" x1="568" y1="226" x2="354" y2="226" marker-end="url(#ah)"/>
<rect class="ground" fill="#f0ece1" x="446.7" y="219" width="24.6" height="15"/><text class="plate" fill="#1b1a15" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="10.5px" font-weight="500" letter-spacing="1px" x="459" y="230" text-anchor="middle">02</text>
<line class="hi" fill="none" stroke="rgba(27, 26, 21, 0.25)" stroke-width="1" x1="0" y1="328" x2="920" y2="328"/>
<text class="n" fill="#1b1a15" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="11px" font-weight="500" x="28" y="354">01</text>
<text class="t" fill="#3d3a32" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="12px" font-weight="500" x="60" y="354">The model asks to call lookUpOrder with an order id. Each trip through the loop is one step.</text>
<text class="n" fill="#1b1a15" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="11px" font-weight="500" x="28" y="379">02</text>
<text class="t" fill="#3d3a32" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="12px" font-weight="500" x="60" y="379">The framework runs the tool and calls the model again with the result. The model picks again.</text>
<text class="n" fill="#1b1a15" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="11px" font-weight="500" x="28" y="404">03</text>
<text class="t" fill="#3d3a32" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="12px" font-weight="500" x="60" y="404">A step that asks for no tool ends the loop, and that text is the answer.</text>
<g id="key">
<line class="ln" fill="none" stroke="#1b1a15" stroke-width="1.3" x1="28" y1="431" x2="54" y2="431" marker-end="url(#ah)"/>
<text class="lb" fill="#57544a" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="10px" font-weight="500" letter-spacing="1.5px" x="62" y="435">CALLS · RETURNS</text>
<line class="dash" fill="none" stroke="#1b1a15" stroke-width="1.4" stroke-dasharray="5 4" x1="206" y1="431" x2="232" y2="431"/>
<text class="lb" fill="#57544a" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="10px" font-weight="500" letter-spacing="1.5px" x="240" y="435">LASTS ONE ACTION RUN</text>
<rect class="hl" fill="#e8f551" x="422" y="425" width="26" height="11"/>
<text class="lb" fill="#57544a" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="10px" font-weight="500" letter-spacing="1.5px" x="456" y="435">THE MODEL DECIDES</text>
</g>
</svg>
