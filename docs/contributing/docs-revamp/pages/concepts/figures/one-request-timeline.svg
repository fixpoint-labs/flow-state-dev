<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 495">
<defs>
<pattern id="hatch" width="5" height="5" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line class="hatch-line" stroke="rgba(27, 26, 21, 0.45)" stroke-width="1" x1="0" y1="0" x2="0" y2="5"/></pattern>
<marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ink" fill="#1b1a15" d="M0,0 L10,5 L0,10 z"/></marker>
</defs>
<rect class="dash" fill="none" stroke="#1b1a15" stroke-width="1.4" stroke-dasharray="5 4" x="28" y="24" width="864" height="194"/>
<text class="lb" fill="#57544a" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="10px" font-weight="500" letter-spacing="1.5px" x="42" y="46">ONE REQUEST · THE REPLY ACTION</text>
<rect class="solid" fill="none" stroke="#1b1a15" stroke-width="1.4" x="42" y="64" width="182" height="140"/>
<rect class="solid" fill="none" stroke="#1b1a15" stroke-width="1.4" x="260" y="64" width="182" height="140"/>
<rect class="solid" fill="none" stroke="#1b1a15" stroke-width="1.4" x="478" y="64" width="182" height="140"/>
<rect class="solid" fill="none" stroke="#1b1a15" stroke-width="1.4" x="696" y="64" width="182" height="140"/>
<line class="ln" fill="none" stroke="#1b1a15" stroke-width="1.3" x1="226" y1="134" x2="258" y2="134" marker-end="url(#ah)"/>
<line class="ln" fill="none" stroke="#1b1a15" stroke-width="1.3" x1="444" y1="134" x2="476" y2="134" marker-end="url(#ah)"/>
<line class="ln" fill="none" stroke="#1b1a15" stroke-width="1.3" x1="662" y1="134" x2="694" y2="134" marker-end="url(#ah)"/>
<text class="lb" fill="#57544a" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="10px" font-weight="500" letter-spacing="1.5px" x="56" y="86">USER MESSAGE</text>
<text class="c" fill="#1b1a15" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="12.5px" font-weight="500" x="56" y="108">message</text>
<text class="sub" fill="#57544a" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="10.5px" font-weight="500" x="56" y="128">role: user</text>
<text class="sub" fill="#57544a" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="10.5px" font-weight="500" x="56" y="146">complete at once</text>
<text class="lb" fill="#57544a" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="10px" font-weight="500" letter-spacing="1.5px" x="274" y="86">TOOL CALL</text>
<text class="c" fill="#1b1a15" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="12.5px" font-weight="500" x="274" y="108">tool_output</text>
<text class="sub" fill="#57544a" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="10.5px" font-weight="500" x="274" y="128">lookUpOrder</text>
<text class="sub" fill="#57544a" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="10.5px" font-weight="500" x="274" y="146">in_progress, then done</text>
<text class="lb" fill="#57544a" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="10px" font-weight="500" letter-spacing="1.5px" x="710" y="86">THE END</text>
<text class="c" fill="#1b1a15" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="12.5px" font-weight="500" x="710" y="108">item.done</text>
<text class="sub" fill="#57544a" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="10.5px" font-weight="500" x="710" y="128">reply is completed</text>
<text class="sub" fill="#57544a" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="10.5px" font-weight="500" x="710" y="146">full text, one item</text>
<text class="lb" fill="#57544a" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="10px" font-weight="500" letter-spacing="1.5px" x="492" y="86">THE REPLY</text>
<text class="c" fill="#1b1a15" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="12.5px" font-weight="500" x="492" y="108">message</text>
<text class="sub" fill="#57544a" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="10.5px" font-weight="500" x="492" y="126">in_progress</text>
<rect class="hl" fill="#e8f551" x="490" y="137" width="158" height="56"/>
<text class="c on-hl" fill="#1b1a15" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="12.5px" font-weight="500" x="496" y="152">"Your order"</text>
<text class="c on-hl" fill="#1b1a15" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="12.5px" font-weight="500" x="496" y="168">" shipped"</text>
<text class="c on-hl" fill="#1b1a15" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="12.5px" font-weight="500" x="496" y="184">" Tuesday."</text>
<rect fill="url(#hatch)" x="28" y="248" width="864" height="10"/><line class="thin" fill="none" stroke="#1b1a15" stroke-width="1" x1="28" y1="258.5" x2="892" y2="258.5"/>
<rect class="solid" fill="none" stroke="#1b1a15" stroke-width="1.4" x="28" y="248" width="864" height="92"/>
<text class="lb" fill="#57544a" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="10px" font-weight="500" letter-spacing="1.5px" x="42" y="282">THE SESSION'S LIST · EVERY REQUEST'S ITEMS</text>
<text class="c" fill="#1b1a15" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="12.5px" font-weight="500" x="42" y="306">message   tool_output   message</text>
<text class="sub" fill="#57544a" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="10.5px" font-weight="500" x="42" y="326">The same items, in the same order. The next request adds to the end.</text>
<line class="hi" fill="none" stroke="rgba(27, 26, 21, 0.25)" stroke-width="1" x1="0" y1="366" x2="920" y2="366"/>
<text class="n" fill="#1b1a15" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="11px" font-weight="500" x="28" y="392">01</text>
<text class="t" fill="#3d3a32" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="12px" font-weight="500" x="60" y="392">Halfway through the sentence, the browser holds the user message, the tool call and the reply so far.</text>
<text class="n" fill="#1b1a15" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="11px" font-weight="500" x="28" y="417">02</text>
<text class="t" fill="#3d3a32" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="12px" font-weight="500" x="60" y="417">The reply is one item. It stays in place and its text grows, so there is nothing to stitch together.</text>
<text class="n" fill="#1b1a15" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="11px" font-weight="500" x="28" y="442">03</text>
<text class="t" fill="#3d3a32" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="12px" font-weight="500" x="60" y="442">The request ends with the action run. The session's list keeps what it produced.</text>
<g id="key">
<line class="ln" fill="none" stroke="#1b1a15" stroke-width="1.3" x1="28" y1="469" x2="54" y2="469" marker-end="url(#ah)"/>
<text class="lb" fill="#57544a" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="10px" font-weight="500" letter-spacing="1.5px" x="62" y="473">THEN</text>
<line class="dash" fill="none" stroke="#1b1a15" stroke-width="1.4" stroke-dasharray="5 4" x1="124" y1="469" x2="150" y2="469"/>
<text class="lb" fill="#57544a" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="10px" font-weight="500" letter-spacing="1.5px" x="158" y="473">LASTS ONE ACTION RUN</text>
<rect fill="url(#hatch)" x="340" y="463" width="26" height="11"/><rect class="thin" fill="none" stroke="#1b1a15" stroke-width="1" x="340" y="463" width="26" height="11"/>
<text class="lb" fill="#57544a" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="10px" font-weight="500" letter-spacing="1.5px" x="374" y="473">OUTLIVES THE REQUEST</text>
<rect class="hl" fill="#e8f551" x="556" y="463" width="26" height="11"/>
<text class="lb" fill="#57544a" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="10px" font-weight="500" letter-spacing="1.5px" x="590" y="473">THE TEXT GROWS</text>
</g>
</svg>
