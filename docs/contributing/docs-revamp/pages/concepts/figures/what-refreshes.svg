<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 327">
<defs>
<pattern id="hatch" width="5" height="5" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line class="hatch-line" stroke="rgba(27, 26, 21, 0.45)" stroke-width="1" x1="0" y1="0" x2="0" y2="5"/></pattern>
<marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ink" fill="#1b1a15" d="M0,0 L10,5 L0,10 z"/></marker>
</defs>
<rect fill="url(#hatch)" x="28" y="24" width="220" height="10"/><line class="thin" fill="none" stroke="#1b1a15" stroke-width="1" x1="28" y1="34.5" x2="248" y2="34.5"/>
<rect class="solid" fill="none" stroke="#1b1a15" stroke-width="1.4" x="28" y="24" width="220" height="200"/>
<text class="lb" fill="#57544a" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="10px" font-weight="500" letter-spacing="1.5px" x="42" y="56">A WRITE LANDS</text>
<text class="nm" fill="#1b1a15" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="15px" font-weight="500" x="42" y="78">Workers</text>
<line class="hi" fill="none" stroke="rgba(27, 26, 21, 0.25)" stroke-width="1" x1="28" y1="92" x2="248" y2="92"/>
<text class="c" fill="#1b1a15" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="12.5px" font-weight="500" x="42" y="118">engineering.lead</text>
<text class="c" fill="#1b1a15" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="12.5px" font-weight="500" x="42" y="142">analyst</text>
<text class="c" fill="#1b1a15" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="12.5px" font-weight="500" x="42" y="166">writer</text>
<text class="c" fill="#1b1a15" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="12.5px" font-weight="500" x="42" y="190">reviewer</text>
<text class="sub" fill="#57544a" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="10.5px" font-weight="500" x="42" y="208">hired just now</text>
<rect class="solid" fill="none" stroke="#1b1a15" stroke-width="1.4" x="350" y="24" width="220" height="200"/>
<text class="lb" fill="#57544a" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="10px" font-weight="500" letter-spacing="1.5px" x="364" y="46">THE VIEW IS ASKED AGAIN</text>
<text class="nm" fill="#1b1a15" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="15px" font-weight="500" x="364" y="68">roster</text>
<line class="hi" fill="none" stroke="rgba(27, 26, 21, 0.25)" stroke-width="1" x1="350" y1="82" x2="570" y2="82"/>
<text class="sub" fill="#57544a" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="10.5px" font-weight="500" x="364" y="108">It read the workers,</text>
<text class="sub" fill="#57544a" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="10.5px" font-weight="500" x="364" y="126">so the write reaches it</text>
<text class="sub" fill="#57544a" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="10.5px" font-weight="500" x="364" y="144">and its block runs again.</text>
<rect class="solid" fill="none" stroke="#1b1a15" stroke-width="1.4" x="672" y="24" width="220" height="200"/>
<text class="lb" fill="#57544a" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="10px" font-weight="500" letter-spacing="1.5px" x="686" y="46">THE ROW CHANGES</text>
<text class="nm" fill="#1b1a15" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="15px" font-weight="500" x="686" y="68">Sidebar</text>
<line class="hi" fill="none" stroke="rgba(27, 26, 21, 0.25)" stroke-width="1" x1="672" y1="82" x2="892" y2="82"/>
<text class="c" fill="#1b1a15" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="12.5px" font-weight="500" x="686" y="108">engineering.lead</text>
<text class="c" fill="#1b1a15" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="12.5px" font-weight="500" x="686" y="132">analyst</text>
<text class="c" fill="#1b1a15" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="12.5px" font-weight="500" x="686" y="156">writer</text>
<rect class="hl" fill="#e8f551" x="680" y="166" width="204" height="28"/>
<text class="c on-hl" fill="#1b1a15" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="12.5px" font-weight="500" x="686" y="184">reviewer</text>
<line class="ln" fill="none" stroke="#1b1a15" stroke-width="1.3" x1="248" y1="104" x2="348" y2="104" marker-end="url(#ah)"/>
<line class="ln" fill="none" stroke="#1b1a15" stroke-width="1.3" x1="570" y1="104" x2="670" y2="104" marker-end="url(#ah)"/>
<line class="hi" fill="none" stroke="rgba(27, 26, 21, 0.25)" stroke-width="1" x1="0" y1="248" x2="920" y2="248"/>
<text class="n" fill="#1b1a15" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="11px" font-weight="500" x="28" y="274">01</text>
<text class="t" fill="#3d3a32" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="12px" font-weight="500" x="60" y="274">The screen names no topic. The view's answer carries what its run read, and the client listens.</text>
<g id="key">
<line class="ln" fill="none" stroke="#1b1a15" stroke-width="1.3" x1="28" y1="301" x2="54" y2="301" marker-end="url(#ah)"/>
<text class="lb" fill="#57544a" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="10px" font-weight="500" letter-spacing="1.5px" x="62" y="305">THEN</text>
<rect fill="url(#hatch)" x="124" y="295" width="26" height="11"/><rect class="thin" fill="none" stroke="#1b1a15" stroke-width="1" x="124" y="295" width="26" height="11"/>
<text class="lb" fill="#57544a" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="10px" font-weight="500" letter-spacing="1.5px" x="158" y="305">OUTLIVES THE REQUEST</text>
<rect class="hl" fill="#e8f551" x="340" y="295" width="26" height="11"/>
<text class="lb" fill="#57544a" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="10px" font-weight="500" letter-spacing="1.5px" x="374" y="305">THE CHANGED ROW</text>
</g>
</svg>
