<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 348">
<style>
/* Standalone fallback (GitHub, a file viewer). On the docs site the page's own
   .drawing rules are more specific and win, so the figure follows the site theme. */
.solid{fill:none;stroke:#1b1a15;stroke-width:1.4}.dash{fill:none;stroke:#1b1a15;stroke-width:1.4;stroke-dasharray:5 4}
.ln{fill:none;stroke:#1b1a15;stroke-width:1.3}.thin{fill:none;stroke:#1b1a15;stroke-width:1}
.hi{fill:none;stroke:rgba(27,26,21,.25);stroke-width:1}.hatch-line{stroke:rgba(27,26,21,.45);stroke-width:1}
.ground{fill:#f0ece1}.ink{fill:#1b1a15}.hl{fill:#e8f551}
text{font-family:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;font-weight:500;fill:#3d3a32}
.lb{font-size:10px;letter-spacing:1.5px;fill:#57544a}.nm{font-size:15px;fill:#1b1a15}.sub{font-size:10.5px;fill:#57544a}
.c{font-size:12.5px;fill:#1b1a15}.t{font-size:12px;fill:#3d3a32}text.on-hl{fill:#1b1a15}
@media (prefers-color-scheme:dark){
.solid,.dash,.ln,.thin{stroke:#ece7da}.hi{stroke:rgba(236,231,218,.25)}.hatch-line{stroke:rgba(236,231,218,.45)}
.ground{fill:#16150f}.ink{fill:#ece7da}text{fill:#cbc5b5}.lb,.sub{fill:#a6a08f}.nm,.c{fill:#ece7da}.t{fill:#cbc5b5}text.on-hl{fill:#1b1a15}}
</style>
<defs>
<pattern id="hatch" width="5" height="5" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line class="hatch-line" x1="0" y1="0" x2="0" y2="5"/></pattern>
<marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ink" d="M0,0 L10,5 L0,10 z"/></marker>
</defs>
<text class="lb" x="28" y="36">SEQUENCER</text>
<rect class="solid" x="28" y="48" width="864" height="250"/>
<text class="nm" x="44" y="76">handleTicket</text>
<text class="sub" x="44" y="94">each step's output is the next step's input</text>

<rect class="thin" x="44" y="120" width="190" height="130"/>
<text class="lb" x="58" y="142">HANDLER</text>
<text class="nm" x="58" y="168">cleanMessage</text>
<text class="sub" x="58" y="190">trims long messages</text>

<line class="ln" x1="234" y1="190" x2="290" y2="190" marker-end="url(#ah)"/>

<rect class="thin" x="290" y="108" width="586" height="176"/>
<text class="lb" x="304" y="130">ROUTER</text>
<text class="nm" x="304" y="154">pickReply</text>
<text class="sub" x="304" y="176">one route runs per</text>
<text class="sub" x="304" y="192">message, chosen by code</text>

<rect class="thin" x="520" y="122" width="340" height="50"/>
<text class="c" x="534" y="144">refundReply</text>
<text class="sub" x="534" y="162">generator, answers refund questions</text>

<rect class="thin" x="520" y="184" width="340" height="88"/>
<text class="c" x="534" y="206">draftReply</text>
<text class="sub" x="534" y="224">generator, answers everything else</text>
<text class="sub" x="534" y="250">can call a tool</text>
<rect class="hl" x="640" y="234" width="206" height="28"/>
<rect class="thin" x="640" y="234" width="206" height="28"/>
<text class="c on-hl" x="743" y="253" text-anchor="middle">lookUpOrder</text>

<text class="t" x="28" y="324">Every box is a block: typed input in, typed output out. A tool is a block too.</text>
</svg>
