<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 777">
<defs>
<pattern id="hatch" width="5" height="5" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line class="hatch-line" stroke="rgba(27, 26, 21, 0.45)" stroke-width="1" x1="0" y1="0" x2="0" y2="5"/></pattern>
<marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ink" fill="#1b1a15" d="M0,0 L10,5 L0,10 z"/></marker>
</defs>
<rect class="solid" fill="none" stroke="#1b1a15" stroke-width="1.4" x="28" y="22" width="220" height="140"/>
<text class="nm" fill="#1b1a15" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="15px" font-weight="500" x="40" y="50">Task</text>
<text class="t" fill="#3d3a32" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="12px" font-weight="500" x="40" y="72">A goal, a status,</text>
<text class="t" fill="#3d3a32" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="12px" font-weight="500" x="40" y="88">dependencies, an optional</text>
<text class="t" fill="#3d3a32" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="12px" font-weight="500" x="40" y="104">assignee, input and output.</text>
<text class="c" fill="#1b1a15" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="12.5px" font-weight="500" x="40" y="128">pending · in_progress</text>
<text class="c" fill="#1b1a15" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="12.5px" font-weight="500" x="40" y="146">held · completed …</text>
<rect class="solid" fill="none" stroke="#1b1a15" stroke-width="1.4" x="348" y="22" width="240" height="140"/>
<text class="nm" fill="#1b1a15" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="15px" font-weight="500" x="360" y="50">Task collection</text>
<text class="t" fill="#3d3a32" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="12px" font-weight="500" x="360" y="72">One API: add, claim,</text>
<text class="t" fill="#3d3a32" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="12px" font-weight="500" x="360" y="88">complete, fail, hold,</text>
<text class="t" fill="#3d3a32" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="12px" font-weight="500" x="360" y="104">whichever store backs it.</text>
<rect class="solid" fill="none" stroke="#1b1a15" stroke-width="1.4" x="698" y="22" width="194" height="140"/>
<text class="lb" fill="#57544a" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="10px" font-weight="500" letter-spacing="1.5px" x="710" y="46">KEPT IN · YOU CHOOSE</text>
<text class="t" fill="#3d3a32" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="12px" font-weight="500" x="710" y="72">State</text>
<text class="lb" fill="#57544a" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="10px" font-weight="500" letter-spacing="1.5px" x="710" y="94">OR</text>
<text class="t" fill="#3d3a32" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="12px" font-weight="500" x="710" y="116">A resource collection</text>
<line class="ln" fill="none" stroke="#1b1a15" stroke-width="1.3" x1="249.5" y1="76" x2="346.5" y2="76" marker-end="url(#ah)"/><rect class="ground" fill="#f0ece1" x="285.7" y="69" width="24.6" height="15"/><text class="plate" fill="#1b1a15" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="10.5px" font-weight="500" letter-spacing="1px" x="298" y="80" text-anchor="middle">01</text>
<line class="ln" fill="none" stroke="#1b1a15" stroke-width="1.3" x1="589.5" y1="76" x2="696.5" y2="76" marker-end="url(#ah)"/><rect class="ground" fill="#f0ece1" x="630.7" y="69" width="24.6" height="15"/><text class="plate" fill="#1b1a15" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="10.5px" font-weight="500" letter-spacing="1px" x="643" y="80" text-anchor="middle">02</text>
<rect class="solid" fill="none" stroke="#1b1a15" stroke-width="1.4" x="28" y="222" width="864" height="140"/>
<text class="nm" fill="#1b1a15" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="15px" font-weight="500" x="40" y="250">Task board</text>
<text class="sub" fill="#57544a" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="10.5px" font-weight="500" x="40" y="268">a sequencer that drains the collection</text>
<text class="c" fill="#1b1a15" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="12.5px" font-weight="500" x="40" y="292">taskBoard()</text>
<rect class="thin" fill="none" stroke="#1b1a15" stroke-width="1" x="358" y="238" width="220" height="108"/><text class="nm" fill="#1b1a15" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="15px" font-weight="500" x="370" y="262">Claim order</text>
<text class="t" fill="#3d3a32" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="12px" font-weight="500" x="370" y="284">Picks the next ready task:</text>
<text class="t" fill="#3d3a32" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="12px" font-weight="500" x="370" y="300">topological (default),</text>
<text class="t" fill="#3d3a32" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="12px" font-weight="500" x="370" y="316">fifo, priority, or one</text>
<text class="t" fill="#3d3a32" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="12px" font-weight="500" x="370" y="332">you pass in.</text>
<rect class="thin" fill="none" stroke="#1b1a15" stroke-width="1" x="660" y="238" width="220" height="108"/><text class="nm" fill="#1b1a15" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="15px" font-weight="500" x="672" y="262">Board worker</text>
<text class="t" fill="#3d3a32" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="12px" font-weight="500" x="672" y="284">Any block. Runs one</text>
<text class="t" fill="#3d3a32" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="12px" font-weight="500" x="672" y="300">claimed task.</text>
<text class="t" fill="#3d3a32" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="12px" font-weight="500" x="672" y="324">The assignee picks which.</text>
<line class="ln" fill="none" stroke="#1b1a15" stroke-width="1.3" x1="468" y1="163.5" x2="468" y2="236.5" marker-end="url(#ah)"/><rect class="ground" fill="#f0ece1" x="430" y="185" width="76" height="15"/><text class="plate" fill="#1b1a15" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="10.5px" font-weight="500" letter-spacing="1px" x="468" y="196" text-anchor="middle">03 DRAINS</text>
<line class="ln" fill="none" stroke="#1b1a15" stroke-width="1.3" x1="579.5" y1="292" x2="658.5" y2="292" marker-end="url(#ah)"/><rect class="ground" fill="#f0ece1" x="606.7" y="285" width="24.6" height="15"/><text class="plate" fill="#1b1a15" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="10.5px" font-weight="500" letter-spacing="1px" x="619" y="296" text-anchor="middle">04</text>
<rect class="solid" fill="none" stroke="#1b1a15" stroke-width="1.4" x="28" y="436" width="280" height="104"/>
<text class="lb" fill="#57544a" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="10px" font-weight="500" letter-spacing="1.5px" x="40" y="460">ORCHESTRATION</text>
<text class="nm" fill="#1b1a15" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="15px" font-weight="500" x="40" y="482">Goal-seek loop</text>
<text class="t" fill="#3d3a32" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="12px" font-weight="500" x="40" y="504">Drains, asks a judge if the goal</text>
<text class="t" fill="#3d3a32" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="12px" font-weight="500" x="40" y="520">is met, replans, drains again.</text>
<rect class="solid" fill="none" stroke="#1b1a15" stroke-width="1.4" x="320" y="436" width="280" height="104"/>
<text class="lb" fill="#57544a" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="10px" font-weight="500" letter-spacing="1.5px" x="332" y="460">HARNESS-MANAGER</text>
<text class="nm" fill="#1b1a15" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="15px" font-weight="500" x="332" y="482">Harness manager</text>
<text class="t" fill="#3d3a32" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="12px" font-weight="500" x="332" y="504">A board worker: one task becomes</text>
<text class="t" fill="#3d3a32" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="12px" font-weight="500" x="332" y="520">one supervised coding run.</text>
<rect class="solid" fill="none" stroke="#1b1a15" stroke-width="1.4" x="612" y="436" width="280" height="104"/>
<text class="lb" fill="#57544a" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="10px" font-weight="500" letter-spacing="1.5px" x="624" y="460">PATTERNS</text>
<text class="nm" fill="#1b1a15" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="15px" font-weight="500" x="624" y="482">Patterns</text>
<text class="c" fill="#1b1a15" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="12.5px" font-weight="500" x="624" y="504">supervisor · planAndExecute</text>
<text class="c" fill="#1b1a15" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="12.5px" font-weight="500" x="624" y="522">parallelTasks · eventActors</text>
<path class="ln" fill="none" stroke="#1b1a15" stroke-width="1.3" d="M168 436 V406 H752 V436"/><line class="ln" fill="none" stroke="#1b1a15" stroke-width="1.3" x1="460" y1="436" x2="460" y2="363.5" marker-end="url(#ah)"/><rect class="ground" fill="#f0ece1" x="223.5" y="399" width="181" height="15"/><text class="plate" fill="#1b1a15" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="10.5px" font-weight="500" letter-spacing="1px" x="314" y="410" text-anchor="middle">05 BUILT ON A TASK BOARD</text>
<line class="hi" fill="none" stroke="rgba(27, 26, 21, 0.25)" stroke-width="1" x1="0" y1="564" x2="920" y2="564"/>
<text class="n" fill="#1b1a15" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="11px" font-weight="500" x="28" y="590">01</text>
<text class="t" fill="#3d3a32" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="12px" font-weight="500" x="60" y="590">A task is a row with a goal, a status and an optional assignee. Tasks live in a task collection.</text>
<text class="n" fill="#1b1a15" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="11px" font-weight="500" x="28" y="615">02</text>
<text class="t" fill="#3d3a32" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="12px" font-weight="500" x="60" y="615">The collection is kept in state, or in a resource collection. You choose; the API is the same.</text>
<text class="n" fill="#1b1a15" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="11px" font-weight="500" x="28" y="640">03</text>
<text class="t" fill="#3d3a32" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="12px" font-weight="500" x="60" y="640">A task board is a sequencer that drains the collection. Its claim order picks the next ready task.</text>
<text class="n" fill="#1b1a15" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="11px" font-weight="500" x="28" y="665">04</text>
<text class="t" fill="#3d3a32" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="12px" font-weight="500" x="60" y="665">The task's assignee routes it to a board worker, which is any block. An assignee names a board worker,</text>
<text class="t" fill="#3d3a32" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="12px" font-weight="500" x="60" y="682">or a Workforce worker that takes tasks. The board runs the list; Workforce finds the worker.</text>
<text class="n" fill="#1b1a15" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="11px" font-weight="500" x="28" y="707">05</text>
<text class="t" fill="#3d3a32" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="12px" font-weight="500" x="60" y="707">The goal-seek loop wraps a drain with a judge. The harness manager is a board worker that runs a coding agent.</text>
<text class="t" fill="#3d3a32" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="12px" font-weight="500" x="60" y="724">Four patterns use a board.</text>
<g id="key">
<line class="ln" fill="none" stroke="#1b1a15" stroke-width="1.3" x1="28" y1="751" x2="54" y2="751" marker-end="url(#ah)"/>
<text class="lb" fill="#57544a" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="10px" font-weight="500" letter-spacing="1.5px" x="62" y="755">A RELATION, NUMBERED IN THE NOTES</text>
</g>
</svg>
