<svg viewBox="0 0 940 480" role="img" aria-label="Alice's Desk app as nested boxes. A host box on top lists two kits and one flow. Left: the workforce kit, with the agent flow, a roster view and a workforce folder of worker files that Alice owns; and the harnesses kit, with the coder flow, a readiness view and a harnesses slot filled with codex and cursor. The coder flow goes into workforce's worker flow slot. Middle: Alice's own triage flow, a sequencer of two blocks. Right: the React pages and the stores." xmlns="http://www.w3.org/2000/svg">
  <style>
    :root { --surface:#FCFCFA; --surface-2:#E8E8E1; --ink:#191C21; --ink-2:#4C535B; --ink-3:#7A828B;
            --rule:#D5D4CB; --accent:#3E4E8C; --accent-soft:#E0E3F0; --code:#2C7C69; --code-soft:#DCEDE7;
            --prose:#A8761C; --prose-soft:#F3E8D2; --gone:#A9544F; }
    @media (prefers-color-scheme: dark) {
      :root { --surface:#181C1F; --surface-2:#202528; --ink:#E6E8E5; --ink-2:#A4ACB1; --ink-3:#737B81;
              --rule:#2B3135; --accent:#8B9BD8; --accent-soft:#1B2140; --code:#5DBBA1; --code-soft:#14302A;
              --prose:#D9A44B; --prose-soft:#332612; --gone:#DE8A84; } }
    .app  { fill:var(--surface); stroke:var(--rule); stroke-width:1.4; }
    .imp  { fill:var(--accent-soft); stroke:var(--accent); stroke-width:1.4; }
    .own  { fill:var(--code-soft); stroke:var(--code); stroke-width:1.4; }
    .ext  { fill:var(--prose-soft); stroke:var(--prose); stroke-width:1.2; }
    .chip { fill:var(--surface); stroke:var(--rule); stroke-width:1.2; }
    .dash { fill:none; stroke:var(--code); stroke-width:1.2; stroke-dasharray:5 4; }
    .arr  { stroke:var(--ink-2); stroke-width:1.4; fill:none; marker-end:url(#h); }
    .t-lbl { fill:var(--ink-3); font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:9.5px; letter-spacing:.1em; }
    .t-b   { fill:var(--ink); font-family:system-ui,-apple-system,sans-serif; font-weight:600; font-size:13px; }
    .t-s   { fill:var(--ink-2); font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:10px; }
  </style>
  <defs><marker id="h" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L8 4L0 8z" fill="#7A828B"/></marker></defs>

  <g id="app">
    <rect class="app" x="16" y="16" width="908" height="448" rx="6"/>
    <text class="t-lbl" x="32" y="38">APP</text>
    <text class="t-b" x="72" y="39">Desk, Alice's app, begun from the Teammates starter</text>
  </g>

  <g id="host">
    <rect class="own" x="32" y="52" width="876" height="52" rx="5"/>
    <text class="t-lbl" x="48" y="72">HOST · ONE SERVER FILE</text>
    <text class="t-s" x="48" y="92">createFlowState({ kits: [workforce(…), harnesses(…)], fill: { harnesses: [codex, cursor] }, flows: [triage] })</text>
  </g>

  <text class="t-lbl" x="32" y="132">KITS · IMPORTED, SO YOU CONFIGURE THEM</text>
  <text class="t-lbl" x="340" y="132">FLOWS ALICE WROTE · OWNED</text>
  <text class="t-lbl" x="640" y="132">PAGES AND DATA</text>

  <g id="kit-workforce">
    <rect class="imp" x="32" y="144" width="280" height="150" rx="5"/>
    <text class="t-b" x="48" y="166">workforce</text><text class="t-s" x="124" y="166">kit</text>
    <rect class="chip" x="48" y="178" width="120" height="28" rx="4"/><text class="t-s" x="58" y="196">agent · flow</text>
    <rect class="chip" x="176" y="178" width="120" height="28" rx="4"/><text class="t-s" x="186" y="196">roster · view</text>
    <rect class="own" x="48" y="220" width="248" height="62" rx="4"/>
    <text class="t-s" x="58" y="239">workforce/ · Alice's folder</text>
    <text class="t-s" x="58" y="256">WORKER.md files, TEAM.md</text>
    <text class="t-s" x="58" y="273">the kit reads it, Alice edits it</text>
  </g>

  <g id="kit-harnesses">
    <rect class="imp" x="32" y="326" width="280" height="130" rx="5"/>
    <text class="t-b" x="48" y="348">harnesses</text><text class="t-s" x="132" y="348">kit</text>
    <rect class="chip" x="48" y="360" width="120" height="28" rx="4"/><text class="t-s" x="58" y="378">coder · flow</text>
    <rect class="chip" x="176" y="360" width="120" height="28" rx="4"/><text class="t-s" x="186" y="378">readiness · view</text>
    <rect class="ext" x="48" y="402" width="248" height="42" rx="4"/>
    <text class="t-s" x="58" y="420">harnesses slot, filled by the app</text>
    <text class="t-s" x="58" y="436">codex · cursor</text>
  </g>
  <path class="arr" d="M96 326 L96 298"/>
  <text class="t-s" x="108" y="312">coder goes into workforce's</text>
  <text class="t-s" x="108" y="324">worker flow slot</text>

  <g id="own-flows">
    <rect class="own" x="340" y="144" width="272" height="312" rx="5"/>
    <text class="t-b" x="356" y="166">triage</text><text class="t-s" x="410" y="166">flow · action: send</text>
    <rect class="dash" x="356" y="182" width="240" height="230" rx="4"/>
    <text class="t-s" x="368" y="202">triage-pipeline · sequencer</text>
    <rect class="chip" x="372" y="218" width="208" height="56" rx="4"/>
    <text class="t-b" x="386" y="242">classify</text><text class="t-s" x="386" y="262">generator · a model call</text>
    <path class="arr" d="M476 274 L476 318"/>
    <rect class="chip" x="372" y="320" width="208" height="56" rx="4"/>
    <text class="t-b" x="386" y="344">file-ticket</text><text class="t-s" x="386" y="364">handler · plain code</text>
    <text class="t-s" x="356" y="432">five block kinds: handler, generator,</text>
    <text class="t-s" x="356" y="446">evaluator, sequencer, router</text>
  </g>

  <g id="pages">
    <rect class="own" x="640" y="144" width="268" height="150" rx="5"/>
    <text class="t-b" x="656" y="166">src/ · React pages</text>
    <text class="t-s" x="656" y="190">talk to the server with</text>
    <text class="t-s" x="656" y="204">typed hooks</text>
    <text class="t-s" x="656" y="228">import each kit's views and</text>
    <text class="t-s" x="656" y="242">components from its package</text>
    <text class="t-s" x="656" y="266">no kit has a browser half</text>
    <rect class="ext" x="640" y="326" width="268" height="56" rx="5"/>
    <text class="t-b" x="656" y="348">stores</text>
    <text class="t-s" x="656" y="368">SQLite file: sessions, state, tasks</text>
  </g>

  <g id="legend">
    <rect class="imp" x="640" y="404" width="14" height="14"/><text class="t-s" x="662" y="415">imported: configure it</text>
    <rect class="own" x="640" y="424" width="14" height="14"/><text class="t-s" x="662" y="435">owned: edit it</text>
    <rect class="ext" x="640" y="444" width="14" height="14"/><text class="t-s" x="662" y="455">data, or a fill from the app</text>
  </g>
</svg>
