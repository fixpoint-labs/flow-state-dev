<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 340">
<style>
.solid{fill:none;stroke:#1b1a15;stroke-width:1.4}.dash{fill:none;stroke:#1b1a15;stroke-width:1.4;stroke-dasharray:5 4}
.ln{fill:none;stroke:#1b1a15;stroke-width:1.3}.thin{fill:none;stroke:#1b1a15;stroke-width:1}
.hi{fill:none;stroke:rgba(27,26,21,.25);stroke-width:1}.hatch-line{stroke:rgba(27,26,21,.45);stroke-width:1}
.ground{fill:#f0ece1}.ink{fill:#1b1a15}.hl{fill:#e8f551}
text{font-family:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;font-weight:500;fill:#3d3a32}
.lb{font-size:10px;letter-spacing:1.5px;fill:#57544a}.nm{font-size:15px;fill:#1b1a15}.sub{font-size:10.5px;fill:#57544a}
.c{font-size:12.5px;fill:#1b1a15}.t{font-size:12px;fill:#3d3a32}text.on-hl{fill:#1b1a15}
@media (prefers-color-scheme:dark){
.solid,.dash,.ln,.thin{stroke:#ece7da}.hi{stroke:rgba(236,231,218,.25)}.hatch-line{stroke:rgba(236,231,218,.45)}
.ground{fill:#16150f}.ink{fill:#ece7da}text{fill:#cbc5b5}.lb,.sub{fill:#a6a08f}.nm,.c{fill:#ece7da}.t{fill:#cbc5b5}text.on-hl{fill:#1b1a15}}
</style>
<defs>
<marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ink" d="M0,0 L10,5 L0,10 z"/></marker>
</defs>
<text class="lb" x="28" y="36">ALICE'S USER SCOPE</text>
<rect class="solid" x="28" y="48" width="864" height="190"/>
<text class="nm" x="44" y="76">launch</text>
<text class="sub" x="44" y="94">a task collection: one row per task</text>

<rect class="thin" x="44" y="112" width="210" height="110"/>
<text class="lb" x="58" y="134">TASK</text>
<text class="nm" x="58" y="160">research</text>
<text class="sub" x="58" y="178">runs on: researcher</text>
<text class="sub" x="58" y="206">no dependencies</text>

<line class="ln" x1="254" y1="167" x2="334" y2="167" marker-end="url(#ah)"/>
<text class="t" x="294" y="155" text-anchor="middle">unlocks</text>

<rect class="thin" x="334" y="112" width="210" height="110"/>
<text class="lb" x="348" y="134">TASK</text>
<text class="nm" x="348" y="160">draft</text>
<text class="sub" x="348" y="178">runs on: writer</text>
<rect class="hl" x="346" y="190" width="140" height="24"/>
<text class="c on-hl" x="354" y="207">deps: research</text>

<line class="ln" x1="544" y1="167" x2="624" y2="167" marker-end="url(#ah)"/>
<text class="t" x="584" y="155" text-anchor="middle">unlocks</text>

<rect class="thin" x="624" y="112" width="210" height="110"/>
<text class="lb" x="638" y="134">TASK</text>
<text class="nm" x="638" y="160">polish</text>
<text class="sub" x="638" y="178">runs on: writer</text>
<text class="c" x="638" y="207">deps: draft</text>

<text class="lb" x="28" y="268">BOB'S USER SCOPE</text>
<rect class="dash" x="28" y="280" width="864" height="40"/>
<text class="t" x="44" y="305">his own launch collection; Alice's tasks never appear here</text>
</svg>
