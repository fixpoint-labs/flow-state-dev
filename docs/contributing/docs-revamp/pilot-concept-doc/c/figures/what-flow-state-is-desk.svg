<line class="ln" x1="440" y1="148" x2="424" y2="148" marker-end="url(#ah)"/>
<line class="ln" x1="440" y1="216" x2="424" y2="216" marker-end="url(#ah)"/>
<line class="ln" x1="440" y1="284" x2="424" y2="284" marker-end="url(#ah)"/>
<line class="ln" x1="440" y1="80" x2="424" y2="80" marker-end="url(#ah)"/><rect class="thin" x="496" y="120" width="396" height="56"/>
<text class="nm" x="512" y="144">workforce/</text>
