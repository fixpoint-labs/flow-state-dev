<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 384">
<style>
/* Standalone fallback (GitHub, a file viewer). On the docs site the page's own
   .drawing rules are more specific and win, so the figure follows the site theme. */
.solid{fill:none;stroke:#1b1a15;stroke-width:1.4}.dash{fill:none;stroke:#1b1a15;stroke-width:1.4;stroke-dasharray:5 4}
.ln{fill:none;stroke:#1b1a15;stroke-width:1.3}.thin{fill:none;stroke:#1b1a15;stroke-width:1}
.hi{fill:none;stroke:rgba(27,26,21,.25);stroke-width:1}.hatch-line{stroke:rgba(27,26,21,.45);stroke-width:1}
.ground{fill:#f0ece1}.ink{fill:#1b1a15}.hl{fill:#e8f551}
text{font-family:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;font-weight:500;fill:#3d3a32}
.lb{font-size:10px;letter-spacing:1.5px;fill:#57544a}.nm{font-size:15px;fill:#1b1a15}.sub{font-size:10.5px;fill:#57544a}
.c{font-size:12.5px;fill:#1b1a15}.t{font-size:12px;fill:#3d3a32}text.on-hl{fill:#1b1a15}
@media (prefers-color-scheme:dark){
.solid,.dash,.ln,.thin{stroke:#ece7da}.hi{stroke:rgba(236,231,218,.25)}.hatch-line{stroke:rgba(236,231,218,.45)}
.ground{fill:#16150f}.ink{fill:#ece7da}text{fill:#cbc5b5}.lb,.sub{fill:#a6a08f}.nm,.c{fill:#ece7da}.t{fill:#cbc5b5}text.on-hl{fill:#1b1a15}}
</style>
<defs>
<pattern id="hatch" width="5" height="5" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line class="hatch-line" x1="0" y1="0" x2="0" y2="5"/></pattern>
<marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ink" d="M0,0 L10,5 L0,10 z"/></marker>
</defs>
<text class="lb" x="28" y="36">IN YOUR REPO</text>
<rect class="solid" x="28" y="50" width="230" height="230"/>
<text class="c" x="42" y="76">WORKER.md</text>
<line class="hi" x1="28" y1="90" x2="258" y2="90"/>
<text class="sub" x="42" y="112">---</text>
<text class="sub" x="42" y="130">description: Breaks a</text>
<text class="sub" x="42" y="146">  request into tasks…</text>
<text class="sub" x="42" y="164">delegates: […]</text>
<text class="sub" x="42" y="182">---</text>
<text class="sub" x="42" y="206">You are the engineering</text>
<text class="sub" x="42" y="222">lead. You break the</text>
<text class="sub" x="42" y="238">request into tasks…</text>
<text class="t" x="28" y="304">teams/engineering/</text>
<text class="t" x="28" y="321">workers/lead/</text>

<line class="ln" x1="258" y1="118" x2="336" y2="118" marker-end="url(#ah)"/>
<line class="ln" x1="258" y1="232" x2="336" y2="232" marker-end="url(#ah)"/>

<text class="lb" x="340" y="36">ON EACH USER'S ROSTER</text>
<rect class="dash" x="340" y="50" width="240" height="106"/>
<text class="sub" x="354" y="72">Alice</text>
<rect class="hl" x="354" y="86" width="212" height="52"/>
<rect class="thin" x="354" y="86" width="212" height="52"/>
<text class="c on-hl" x="460" y="117" text-anchor="middle">engineering.lead</text>
<rect class="dash" x="340" y="174" width="240" height="106"/>
<text class="sub" x="354" y="196">Bob</text>
<rect class="thin" x="354" y="210" width="212" height="52"/>
<text class="c" x="460" y="241" text-anchor="middle">engineering.lead</text>
<text class="t" x="340" y="304">One file, a separate worker for</text>
<text class="t" x="340" y="321">each user. What Alice's learns</text>
<text class="t" x="340" y="338">stays with Alice.</text>

<line class="ln" x1="566" y1="100" x2="656" y2="78" marker-end="url(#ah)"/>
<line class="ln" x1="566" y1="124" x2="656" y2="146" marker-end="url(#ah)"/>

<text class="lb" x="660" y="36">WHERE ALICE'S WORKS</text>
<rect class="thin" x="660" y="50" width="232" height="56"/>
<text class="c" x="674" y="74">A conversation</text>
<text class="sub" x="674" y="92">she talks, it answers</text>
<rect class="thin" x="660" y="118" width="232" height="56"/>
<text class="c" x="674" y="142">A task</text>
<text class="sub" x="674" y="160">one run each; it reports back</text>
<text class="t" x="660" y="200">Each conversation and each</text>
<text class="t" x="660" y="217">task is a session of its own.</text>
</svg>
