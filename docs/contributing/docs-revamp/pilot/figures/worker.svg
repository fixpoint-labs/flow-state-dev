<line class="ln" fill="none" stroke="#1b1a15" stroke-width="1.3" x1="264" y1="218" x2="334" y2="218" marker-end="url(#ah)"/>
<rect class="ground" fill="#f0ece1" x="287.7" y="211" width="24.6" height="15"/><text class="plate" fill="#1b1a15" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="10.5px" font-weight="500" letter-spacing="1px" x="300" y="222" text-anchor="middle">01</text>
<rect fill="url(#hatch)" x="660" y="24" width="232" height="10"/><line class="thin" fill="none" stroke="#1b1a15" stroke-width="1" x1="660" y1="34.5" x2="892" y2="34.5"/>
<rect class="solid" fill="none" stroke="#1b1a15" stroke-width="1.4" x="660" y="24" width="232" height="236"/>
<text class="lb" fill="#57544a" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="10px" font-weight="500" letter-spacing="1.5px" x="674" y="56">ALICE'S SESSIONS</text>
<rect class="thin" fill="none" stroke="#1b1a15" stroke-width="1" x="674" y="68" width="204" height="56"/>
<text class="c" fill="#1b1a15" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="12.5px" font-weight="500" x="686" y="91">A conversation</text>
<text class="sub" fill="#57544a" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="10.5px" font-weight="500" x="686" y="109">she talks, it answers</text>
<rect class="thin" fill="none" stroke="#1b1a15" stroke-width="1" x="674" y="136" width="204" height="56"/>
<text class="c" fill="#1b1a15" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="12.5px" font-weight="500" x="686" y="159">A task</text>
<text class="sub" fill="#57544a" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="10.5px" font-weight="500" x="686" y="177">it runs it and reports back</text>
<text class="sub" fill="#57544a" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="10.5px" font-weight="500" x="674" y="220">each one is a session of its own</text>
<line class="ln" fill="none" stroke="#1b1a15" stroke-width="1.3" x1="574" y1="92" x2="658" y2="92" marker-end="url(#ah)"/>
<rect class="ground" fill="#f0ece1" x="611.7" y="85" width="24.6" height="15"/><text class="plate" fill="#1b1a15" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="10.5px" font-weight="500" letter-spacing="1px" x="624" y="96" text-anchor="middle">02</text>
<line class="hi" fill="none" stroke="rgba(27, 26, 21, 0.25)" stroke-width="1" x1="0" y1="326" x2="920" y2="326"/>
<text class="n" fill="#1b1a15" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="11px" font-weight="500" x="28" y="352">01</text>
<text class="t" fill="#3d3a32" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="12px" font-weight="500" x="60" y="352">One file makes a separate worker on each user's roster. What Alice's worker learns stays with Alice.</text>
<text class="n" fill="#1b1a15" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="11px" font-weight="500" x="28" y="377">02</text>
<text class="t" fill="#3d3a32" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="12px" font-weight="500" x="60" y="377">A worker works in sessions: one for each conversation and one for each task it is handed.</text>
<g id="key">
<line class="ln" fill="none" stroke="#1b1a15" stroke-width="1.3" x1="28" y1="404" x2="54" y2="404" marker-end="url(#ah)"/>
<text class="lb" fill="#57544a" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="10px" font-weight="500" letter-spacing="1.5px" x="62" y="408">TURNS INTO · WORKS IN</text>
<rect fill="url(#hatch)" x="252" y="398" width="26" height="11"/><rect class="thin" fill="none" stroke="#1b1a15" stroke-width="1" x="252" y="398" width="26" height="11"/>
<text class="lb" fill="#57544a" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="10px" font-weight="500" letter-spacing="1.5px" x="286" y="408">OUTLIVES THE REQUEST</text>
<rect class="hl" fill="#e8f551" x="468" y="398" width="26" height="11"/>
<text class="lb" fill="#57544a" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="10px" font-weight="500" letter-spacing="1.5px" x="502" y="408">ONE USER'S OWN WORKER</text>
