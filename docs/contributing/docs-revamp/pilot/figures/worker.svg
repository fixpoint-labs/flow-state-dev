<text class="c" fill="#1b1a15" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="12.5px" font-weight="500" x="462" y="223" text-anchor="middle">engineering.lead</text>
<line class="ln" fill="none" stroke="#1b1a15" stroke-width="1.3" x1="264" y1="92" x2="334" y2="92" marker-end="url(#ah)"/>
