# Inventory of framework mechanisms. Guide: docs/mechanisms/README.md
# Checked by scripts/validate-mechanism-map.mjs. Not a review and not a contract sheet.
version: 1
entries:
  - id: contracts
    title: Shared leaf types
    status: canonical
    summary: |
      Zero-dependency types and helpers that core, engine, and client share, so those packages do not import each other for a leaf shape.
    packages:
      - "@flow-state-dev/contracts"
    subpaths:
      - package: "@flow-state-dev/contracts"
        subpath: "."
    entryPoints:
      - path: packages/contracts/src/index.ts
        exports:
          - MANIFEST_DOMAINS
          - buildBlockInstanceId
    docs:
      - docs/architecture/overview.md

  - id: block
    title: Block
    status: canonical
    summary: |
      A block is the unit a flow runs. There are five kinds. A sixth kind would be a new mechanism.
    packages:
      - "@flow-state-dev/core"
      - "@flow-state-dev/contracts"
    subpaths:
      - package: "@flow-state-dev/core"
        subpath: ./blocks/handler
      - package: "@flow-state-dev/core"
        subpath: ./blocks/sequencer
      - package: "@flow-state-dev/contracts"
        subpath: ./block-instance-id
    entryPoints:
      - path: packages/core/src/blocks/handler.ts
        exports:
          - handler
      - path: packages/core/src/blocks/generator.ts
        exports:
          - generator
      - path: packages/core/src/blocks/evaluator.ts
        exports:
          - evaluator
      - path: packages/core/src/blocks/router.ts
        exports:
          - router
      - path: packages/core/src/blocks/sequencer.ts
        exports:
          - sequencer
    builtOn:
      - contracts
    docs:
      - docs/architecture/blocks.md
    facets:
      - id: handler
        summary: Runs code the author wrote. No model call.
        path: packages/core/src/blocks/handler.ts
        symbol: handler
      - id: generator
        summary: Calls a model. The block kind, not the fsdev gen hook of the same name.
        path: packages/core/src/blocks/generator.ts
        symbol: generator
      - id: evaluator
        summary: Scores or judges an output and returns a verdict the caller branches on.
        path: packages/core/src/blocks/evaluator.ts
        symbol: evaluator
      - id: router
        summary: Picks one next block from a decision.
        path: packages/core/src/blocks/router.ts
        symbol: router
      - id: sequencer
        summary: The block kind that runs the sequencer DSL. The verbs live on sequencer-dsl.
        path: packages/core/src/blocks/sequencer.ts
        symbol: sequencer

  - id: sequencer-dsl
    title: Sequencer DSL
    status: canonical
    summary: |
      The verbs on a sequencer. A new composition verb is an addition to this entry, not a new block kind.
    packages:
      - "@flow-state-dev/core"
    entryPoints:
      - path: packages/core/src/blocks/sequencer-methods.ts
    builtOn:
      - block
    docs:
      - docs/architecture/sequencer-dsl.md
    facets:
      - id: step
        summary: Run one block and take its output forward.
        path: packages/core/src/blocks/sequencer-methods.ts
        symbol: step
      - id: stepIf
        summary: Run one block only when a condition holds.
        path: packages/core/src/blocks/sequencer-methods.ts
        symbol: stepIf
      - id: map
        summary: Transform the value in flight without a block.
        path: packages/core/src/blocks/sequencer-methods.ts
        symbol: map
      - id: parallel
        summary: Run named branches together and keep each result.
        path: packages/core/src/blocks/sequencer-methods.ts
        symbol: parallel
      - id: forEach
        summary: Run one block for each item of a list.
        path: packages/core/src/blocks/sequencer-methods.ts
        symbol: forEach
      - id: forEachSideChain
        summary: Start a side chain for each item, without blocking the main line on all of them.
        path: packages/core/src/blocks/sequencer-methods.ts
        symbol: forEachSideChain
      - id: doUntil
        summary: Repeat a block until a condition holds.
        path: packages/core/src/blocks/sequencer-methods.ts
        symbol: doUntil
      - id: doWhile
        summary: Repeat a block while a condition holds.
        path: packages/core/src/blocks/sequencer-methods.ts
        symbol: doWhile
      - id: loopBack
        summary: Jump back to an earlier step when a condition holds.
        path: packages/core/src/blocks/sequencer-methods.ts
        symbol: loopBack
      - id: sideChain
        summary: Start work beside the main line.
        path: packages/core/src/blocks/sequencer-methods.ts
        symbol: sideChain
      - id: sideChainIf
        summary: Start a side chain only when a condition holds.
        path: packages/core/src/blocks/sequencer-methods.ts
        symbol: sideChainIf
      - id: waitForSideChain
        summary: Wait until a side chain has finished.
        path: packages/core/src/blocks/sequencer-methods.ts
        symbol: waitForSideChain
      - id: tap
        summary: Run a block for its effect and keep the value in flight.
        path: packages/core/src/blocks/sequencer-methods.ts
        symbol: tap
      - id: tapIf
        summary: Tap only when a condition holds.
        path: packages/core/src/blocks/sequencer-methods.ts
        symbol: tapIf
      - id: rescue
        summary: Handle a failure from the steps above.
        path: packages/core/src/blocks/sequencer-methods.ts
        symbol: rescue
      - id: branch
        summary: Pick one named branch.
        path: packages/core/src/blocks/sequencer-methods.ts
        symbol: branch
      - id: stepAll
        summary: Run every step in a list.
        path: packages/core/src/blocks/sequencer-methods.ts
        symbol: stepAll
      - id: stepAny
        summary: Finish when any one step finishes.
        path: packages/core/src/blocks/sequencer-methods.ts
        symbol: stepAny
      - id: race
        summary: Race steps against each other.
        path: packages/core/src/blocks/sequencer-methods.ts
        symbol: race
      - id: waitForCondition
        summary: Pause the main line until a condition holds.
        path: packages/core/src/blocks/sequencer-methods.ts
        symbol: waitForCondition
      - id: exitIf
        summary: Leave the sequencer when a condition holds.
        path: packages/core/src/blocks/sequencer-methods.ts
        symbol: exitIf
      - id: throwIf
        summary: Fail the sequencer when a condition holds.
        path: packages/core/src/blocks/sequencer-methods.ts
        symbol: throwIf

  - id: flow
    title: Flow
    status: canonical
    summary: |
      defineFlow bundles blocks, actions, state, and resources into the unit a caller starts. Actions are declared here, not on a block.
    packages:
      - "@flow-state-dev/core"
    entryPoints:
      - path: packages/core/src/flow/defineFlow.ts
        exports:
          - defineFlow
    builtOn:
      - block
    reliedOnBy:
      - examples/hello-chat
    docs:
      - docs/architecture/flows-and-actions.md
      - docs/architecture/action-forms.md
    facets:
      - id: actions
        summary: Caller-addressed, event-addressed, and dispatched actions. The forms are one contract, documented in action-forms.
        path: packages/core/src/flow/defineFlow.ts
        symbol: defineFlow

  - id: scope
    title: Scope
    status: canonical
    summary: |
      Request, session, user, and org are the places state and resources live. A block reads them. It does not invent another scope.
    packages:
      - "@flow-state-dev/core"
    entryPoints:
      - path: packages/core/src/types/flow.ts
        exports:
          - SessionConfig
          - RequestConfig
          - UserConfig
          - OrgConfig
    builtOn:
      - flow
    docs:
      - docs/architecture/state-and-scopes.md

  - id: resource
    title: Resource
    status: canonical
    summary: |
      A resource is named durable state a block can read and write. Client data is a projection of that state for a caller, not a second store.
    packages:
      - "@flow-state-dev/core"
      - "@flow-state-dev/engine"
    subpaths:
      - package: "@flow-state-dev/core"
        subpath: ./resource-template
      - package: "@flow-state-dev/engine"
        subpath: ./resource-template
    entryPoints:
      - path: packages/core/src/types/resource.ts
        exports:
          - defineResource
      - path: packages/engine/src/resource-template-loader.ts
        exports:
          - loadResourceTemplate
    builtOn:
      - scope
    docs:
      - docs/architecture/resources-and-client-data.md
    facets:
      - id: client-data
        summary: A computed projection onto a scope or a resource for the caller. Not a store and not a resource.
        path: packages/core/src/types/flow.ts
      - id: template
        summary: A resource template loaded from a file on the engine side.
        path: packages/engine/src/resource-template-loader.ts
        symbol: loadResourceTemplate

  - id: collection
    title: Collection
    status: canonical
    summary: |
      A collection is a resource that holds many keyed items. Faceted and projected collections are variants of this, not new stores.
    packages:
      - "@flow-state-dev/core"
    entryPoints:
      - path: packages/core/src/types/resource-collection.ts
        exports:
          - defineResourceCollection
      - path: packages/core/src/types/faceted-collection.ts
        exports:
          - defineFacetedCollection
      - path: packages/core/src/types/projected-resource-collection.ts
        exports:
          - defineProjectedResourceCollection
    builtOn:
      - resource
    docs:
      - docs/architecture/resource-collections.md
    facets:
      - id: resource-collection
        summary: The ordinary keyed collection.
        path: packages/core/src/types/resource-collection.ts
        symbol: defineResourceCollection
      - id: faceted
        summary: A collection whose items carry facets.
        path: packages/core/src/types/faceted-collection.ts
        symbol: defineFacetedCollection
      - id: projected
        summary: A collection that exposes a projection of each item.
        path: packages/core/src/types/projected-resource-collection.ts
        symbol: defineProjectedResourceCollection

  - id: capability
    title: Capability
    status: canonical
    summary: |
      A capability bundles tools, context, and resources so a block can opt in with uses, instead of spreading that plumbing by hand.
    packages:
      - "@flow-state-dev/core"
    subpaths:
      - package: "@flow-state-dev/core"
        subpath: ./capability
    entryPoints:
      - path: packages/core/src/capability/define-capability.ts
        exports:
          - defineCapability
      - path: packages/core/src/blocks/tool-cache.ts
        exports:
          - createToolCacheCapability
    builtOn:
      - block
      - resource
    docs:
      - docs/architecture/capabilities.md
    facets:
      - id: tool-cache
        summary: Caches tool definitions across a turn so a generator does not rebuild them.
        path: packages/core/src/blocks/tool-cache.ts
        symbol: createToolCacheCapability

  - id: item
    title: Item
    status: canonical
    summary: |
      An item is one unit on the stream and in the log. Messages, tool calls, and traces are items. Packages share the taxonomy through contracts.
    packages:
      - "@flow-state-dev/contracts"
      - "@flow-state-dev/core"
    subpaths:
      - package: "@flow-state-dev/contracts"
        subpath: ./items
      - package: "@flow-state-dev/core"
        subpath: ./items
      - package: "@flow-state-dev/core"
        subpath: ./items/internal
    entryPoints:
      - path: packages/contracts/src/items/index.ts
        exports:
          - isBlockValue
    docs:
      - docs/architecture/items.md
    builtOn:
      - contracts

  - id: streaming
    title: Streaming
    status: canonical
    summary: |
      The server sends the item log to a caller as a server-sent event stream. Resume uses a cursor, not a second protocol.
    packages:
      - "@flow-state-dev/engine"
    entryPoints:
      - path: packages/engine/src/streaming/encode-event.ts
        exports:
          - encodeStreamEvent
      - path: packages/engine/src/streaming/resume.ts
        exports:
          - parseStartingAfter
    builtOn:
      - item
    docs:
      - docs/architecture/streaming.md

  - id: execution
    title: Execution
    status: canonical
    summary: |
      runAction is the path that runs one action. createExecutionContext is the bag of stores, streams, and scope that path closes over. Engine's isRetryableError is a different function from core's of the same name, and this checker cannot tell them apart.
    packages:
      - "@flow-state-dev/engine"
    entryPoints:
      - path: packages/engine/src/execution/runAction.ts
        exports:
          - runAction
      - path: packages/engine/src/context/createExecutionContext.ts
        exports:
          - createExecutionContext
    builtOn:
      - flow
      - scope
      - streaming
    docs:
      - docs/architecture/execution-and-errors.md

  - id: suspension
    title: Suspension
    status: canonical
    summary: |
      waitForUserOn parks a request until a person answers. The call site is ctx.waitForUser. The exported function is waitForUserOn.
    packages:
      - "@flow-state-dev/core"
    subpaths:
      - package: "@flow-state-dev/core"
        subpath: ./errors/suspension-error
    entryPoints:
      - path: packages/core/src/types/wait-for-user.ts
        exports:
          - waitForUserOn
      - path: packages/core/src/errors/suspension-error.ts
        exports:
          - SuspensionError
    builtOn:
      - execution
    facets:
      - id: wait-for-user
        summary: Park the running request for an approval or an input, and resume it with the answer.
        path: packages/core/src/types/wait-for-user.ts
        symbol: waitForUserOn

  - id: wait-gate
    title: Wait gate
    status: canonical
    summary: |
      parkOnWait parks a request on a named gate until something else releases it. Same words as a person-wait, different shape.
    packages:
      - "@flow-state-dev/core"
    entryPoints:
      - path: packages/core/src/types/wait-gate.ts
        exports:
          - parkOnWait
    builtOn:
      - suspension
    overlaps:
      - id: suspension
        relation: distinct-jobs
        note: "waitForUser parks for a person. parkOnWait parks on a gate another part of the system releases. The answer shapes differ."
    facets:
      - id: park
        summary: Park on a gate id until a release arrives.
        path: packages/core/src/types/wait-gate.ts
        symbol: parkOnWait

  - id: dispatcher
    title: Dispatcher block
    status: canonical
    summary: |
      dispatcher() is a handler that sends work to another session of this runtime. It is not a task-claim strategy and not a queue worker.
    packages:
      - "@flow-state-dev/core"
    entryPoints:
      - path: packages/core/src/blocks/dispatcher.ts
        exports:
          - dispatcher
    builtOn:
      - block
      - execution
    docs:
      - docs/architecture/dispatched-work.md
      - docs/architecture/internal-execution-seams.md
    facets:
      - id: send
        summary: The handler that sends work to another session.
        path: packages/core/src/blocks/dispatcher.ts
        symbol: dispatcher

  - id: store
    title: Store
    status: canonical
    summary: |
      A store is the persistence seam for sessions, resources, and requests. Memory, filesystem, SQLite, Postgres, and Vercel Postgres are adapters of one seam.
    packages:
      - "@flow-state-dev/engine"
      - "@flow-state-dev/store-sqlite"
      - "@flow-state-dev/store-postgres"
      - "@flow-state-dev/vercel"
    subpaths:
      - package: "@flow-state-dev/store-sqlite"
        subpath: "."
      - package: "@flow-state-dev/store-postgres"
        subpath: "."
      - package: "@flow-state-dev/vercel"
        subpath: ./store
      - package: "@flow-state-dev/vercel"
        subpath: ./pg
    entryPoints:
      - path: packages/engine/src/stores/index.ts
        exports:
          - createInMemoryStores
          - inMemoryStores
          - createFilesystemStores
          - filesystemStores
      - path: packages/store-sqlite/src/index.ts
        exports:
          - createSQLiteStores
          - sqliteStores
      - path: packages/store-postgres/src/index.ts
        exports:
          - createPostgresStores
          - postgresStores
      - path: packages/vercel/src/store.ts
        exports:
          - vercelPostgresStores
    facets:
      - id: in-memory
        summary: In-process stores for tests and one process.
        path: packages/engine/src/stores/index.ts
        symbol: createInMemoryStores
      - id: filesystem
        summary: File-backed stores for a single machine.
        path: packages/engine/src/stores/index.ts
        symbol: createFilesystemStores
      - id: sqlite
        summary: SQLite-backed stores.
        path: packages/store-sqlite/src/index.ts
        symbol: createSQLiteStores
      - id: postgres
        summary: Postgres-backed stores.
        path: packages/store-postgres/src/index.ts
        symbol: createPostgresStores
      - id: vercel-postgres
        summary: Vercel Postgres adapter of the same store seam.
        path: packages/vercel/src/store.ts
        symbol: vercelPostgresStores

  - id: inbound-transport
    title: Inbound transport
    status: canonical
    summary: |
      An inbound transport turns an outside request into a run of an action. HTTP is the built-in adapter. The router mounts adapters.
    packages:
      - "@flow-state-dev/engine"
    entryPoints:
      - path: packages/engine/src/transports/http/createHttpTransportAdapter.ts
        exports:
          - createHttpTransportAdapter
      - path: packages/engine/src/routes/createFlowApiRouter.ts
        exports:
          - createFlowApiRouter
    builtOn:
      - execution
      - store
    docs:
      - docs/architecture/inbound-transports.md
    facets:
      - id: http
        summary: The HTTP adapter.
        path: packages/engine/src/transports/http/createHttpTransportAdapter.ts
        symbol: createHttpTransportAdapter
      - id: api-router
        summary: createFlowApiRouter mounts transports and serves the flow HTTP API. Not the router block kind.
        path: packages/engine/src/routes/createFlowApiRouter.ts
        symbol: createFlowApiRouter

  - id: authentication
    title: Authentication
    status: canonical
    summary: |
      The framework names the principal a transport resolved. The host checks credentials. Flows do not read a caller-supplied user id as identity.
    packages:
      - "@flow-state-dev/core"
    entryPoints:
      - path: packages/core/src/types/auth.ts
        exports:
          - DEFAULT_ORG_ID
          - isValidOrgId
    builtOn:
      - inbound-transport
    docs:
      - docs/architecture/authentication.md

  - id: webhook
    title: Webhook
    status: canonical
    summary: |
      A webhook binding is an event-addressed action on the flow. The transport adapter verifies the provider and dispatches that binding.
    packages:
      - "@flow-state-dev/core"
      - "@flow-state-dev/engine"
    entryPoints:
      - path: packages/core/src/types/webhooks.ts
        exports:
          - defineWebhookBinding
      - path: packages/engine/src/transports/webhook/createWebhookTransportAdapter.ts
        exports:
          - createWebhookTransportAdapter
    builtOn:
      - flow
      - inbound-transport
    docs:
      - docs/architecture/webhook-transport.md

  - id: schedule
    title: Schedule
    status: canonical
    summary: |
      A schedule fires an event-addressed action on a cron. ScheduleIndex is the contract. SQLite, Postgres, and BullMQ are adapters. BullMQ's claimDue returns nothing because BullMQ fires the job itself.
    packages:
      - "@flow-state-dev/core"
      - "@flow-state-dev/scheduled"
      - "@flow-state-dev/vercel"
      - "@flow-state-dev/bullmq"
    subpaths:
      - package: "@flow-state-dev/scheduled"
        subpath: "."
      - package: "@flow-state-dev/scheduled"
        subpath: ./collection
      - package: "@flow-state-dev/vercel"
        subpath: ./schedules
      - package: "@flow-state-dev/bullmq"
        subpath: ./schedules
    entryPoints:
      - path: packages/core/src/types/schedules.ts
        exports:
          - defineScheduleBinding
      - path: packages/scheduled/src/defineScheduleCollection.ts
        exports:
          - defineScheduleCollection
      - path: packages/scheduled/src/createScheduledTransportAdapter.ts
        exports:
          - createScheduledTransportAdapter
      - path: packages/scheduled/src/scheduleIndex.ts
        exports:
          - ScheduleIndex
      - path: packages/vercel/src/schedules.ts
        exports:
          - createScheduleTickHandler
      - path: packages/bullmq/src/schedule-index.ts
        exports:
          - createBullmqScheduleIndex
      - path: packages/bullmq/src/schedules.ts
        exports:
          - registerStaticSchedules
          - createScheduleDispatchWorker
    builtOn:
      - flow
      - inbound-transport
    docs:
      - docs/architecture/scheduled-actions.md
    facets:
      - id: binding
        summary: One static schedule on a flow.
        path: packages/core/src/types/schedules.ts
        symbol: defineScheduleBinding
      - id: schedule-collection
        summary: Dynamic schedules stored as a collection.
        path: packages/scheduled/src/defineScheduleCollection.ts
        symbol: defineScheduleCollection
      - id: vercel-tick
        summary: The Vercel cron tick that calls claimDue.
        path: packages/vercel/src/schedules.ts
        symbol: createScheduleTickHandler
      - id: bullmq-index
        summary: BullMQ repeatable jobs as a ScheduleIndex. claimDue is empty because the queue fires natively.
        path: packages/bullmq/src/schedule-index.ts
        symbol: createBullmqScheduleIndex

  - id: mcp-transport
    title: MCP transport
    status: canonical
    summary: |
      Exposes this runtime's actions as an MCP server over HTTP. Inbound. The opposite of calling someone else's MCP server.
    packages:
      - "@flow-state-dev/mcp"
    subpaths:
      - package: "@flow-state-dev/mcp"
        subpath: "."
    entryPoints:
      - path: packages/mcp/src/createMcpTransportAdapter.ts
        exports:
          - createMcpTransportAdapter
    builtOn:
      - inbound-transport
    docs:
      - docs/architecture/mcp-server.md
    overlaps:
      - id: mcp-client
        relation: distinct-jobs
        note: "This adapter exposes our actions as MCP tools. mcp-client calls external MCP servers. Opposite directions."

  - id: mcp-client
    title: MCP client
    status: canonical
    summary: |
      A capability that calls external MCP servers and exposes their tools to a generator.
    packages:
      - "@flow-state-dev/tools"
    subpaths:
      - package: "@flow-state-dev/tools"
        subpath: ./mcp
    entryPoints:
      - path: packages/tools/src/mcp/capability.ts
        exports:
          - createMcpCapability
    builtOn:
      - capability

  - id: host
    title: Host
    status: canonical
    summary: |
      A host is the process that holds createFlowState and answers a platform. Node, Next, Vercel, and Lambda are adapters. createNextHandler is platform-agnostic. createVercelNextHandler adds Vercel's stream shaping on top.
    packages:
      - "@flow-state-dev/engine"
      - "@flow-state-dev/node"
      - "@flow-state-dev/next"
      - "@flow-state-dev/vercel"
    subpaths:
      - package: "@flow-state-dev/node"
        subpath: "."
      - package: "@flow-state-dev/node"
        subpath: ./app
      - package: "@flow-state-dev/node"
        subpath: ./aws-lambda
      - package: "@flow-state-dev/next"
        subpath: "."
      - package: "@flow-state-dev/vercel"
        subpath: "."
      - package: "@flow-state-dev/vercel"
        subpath: ./next
    entryPoints:
      - path: packages/engine/src/flowstate/createFlowState.ts
        exports:
          - createFlowState
      - path: packages/node/src/serve.ts
        exports:
          - serve
      - path: packages/node/src/app.ts
        exports:
          - createServerApp
      - path: packages/node/src/aws-lambda.ts
        exports:
          - createLambdaHandler
      - path: packages/next/src/createNextHandler.ts
        exports:
          - createNextHandler
      - path: packages/vercel/src/handler.ts
        exports:
          - createVercelHandler
          - createVercelBareHandler
      - path: packages/vercel/src/next.ts
        exports:
          - createVercelNextHandler
    builtOn:
      - inbound-transport
      - store
    docs:
      - docs/architecture/server-and-client.md
    facets:
      - id: flow-state
        summary: The in-process runtime handle hosts wrap.
        path: packages/engine/src/flowstate/createFlowState.ts
        symbol: createFlowState
      - id: node
        summary: A long-lived Node server. createServerApp is the app factory beside serve.
        path: packages/node/src/serve.ts
        symbol: serve
      - id: lambda
        summary: An AWS Lambda handler.
        path: packages/node/src/aws-lambda.ts
        symbol: createLambdaHandler
      - id: next
        summary: A Next.js route handler with no Vercel-specific stream shaping.
        path: packages/next/src/createNextHandler.ts
        symbol: createNextHandler
      - id: vercel
        summary: Vercel handlers. createVercelNextHandler, in the next file, adds Vercel stream shaping on top of the platform-agnostic Next handler.
        path: packages/vercel/src/handler.ts
        symbol: createVercelHandler

  - id: model
    title: Model resolver
    status: canonical
    summary: |
      createModelResolver turns a model id into a provider client. Engine re-exports this function. It does not define a second resolver.
    packages:
      - "@flow-state-dev/core"
      - "@flow-state-dev/engine"
    subpaths:
      - package: "@flow-state-dev/core"
        subpath: ./models
    entryPoints:
      - path: packages/core/src/models/createModelResolver.ts
        exports:
          - createModelResolver
    docs:
      - docs/architecture/generator-identity.md

  - id: prompt
    title: Prompt file
    status: canonical
    summary: |
