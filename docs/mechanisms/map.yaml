  - id: harness-manager
    title: Harness manager
    status: canonical
    summary: |
      Turns a task-board row into a supervised coding run. Its inbox is a question channel for that run. Its checkout subpath is workspace's git, re-exported, and is not this package's supported contract.
    packages:
      - "@flow-state-dev/harness-manager"
    subpaths:
      - package: "@flow-state-dev/harness-manager"
        subpath: "."
    entryPoints:
      - path: packages/harness-manager/src/manager.ts
        exports:
          - harnessManager
    builtOn:
      - task-board
      - coding-harness
      - workspace
    overlaps:
      - id: inbox
        relation: distinct-jobs
        note: "The harness inbox is a question a coding run asked, stored as a row. The orchestration inbox is a read model of what a person can answer. Same word, different record."
      - id: workspace
        relation: adapters
        note: "checkout.ts runs git through the workspace host and re-exports run. It is not a second workspace implementation."
    facets:
      - id: question-channel
        summary: inbox/** on a coding run. A person reads it. It is not migrated onto the task-row hold.
        path: packages/harness-manager/src/inbox.ts

