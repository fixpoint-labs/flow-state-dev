# The mechanism list: one row per way of doing a job in the framework.
#
# A spec, a reuse review and a PR cite these ids when they say what a change
# builds on. A mechanism's pieces (the five block kinds, the sequencer verbs, a
# store's adapters) live under its one row, not in rows of their own. Apps are
# not rows. Before adding a row, look for the row your job already has.
#
# Fields
#   id        kebab-case, stable. Specs and PRs cite it.
#   job       what the mechanism is for, in plain words.            (author)
#   package   the package that exports the anchor.                  (mechanical)
#   anchor    one exported name that stands for the mechanism.      (mechanical)
#   file      the file that declares the anchor.                    (mechanical)
#   adapters  optional: packages that are adapters of this seam.    (author)
#   builtOn   ids of the rows this one composes.                    (author)
#   overlaps  rows it can be mistaken for: { id, relation, note }.  (author)
#             relation: distinct-jobs (names rhyme, jobs differ) |
#             near-duplicate (same job twice; neither is marked for a merge)
#   status    canonical | legacy | unconfirmed. `unconfirmed` means the
#             row was read off the code, and nobody who owns it has
#             confirmed its job and its boundaries yet.
#   doc       where the mechanism is explained.
#
# Who fills what. CI owns only the mechanical fields. The anchor check
# (scripts/check-mechanism-anchors.mjs) fails when an anchor is no longer
# exported from its package, or when `file` no longer declares it, and prints
# the right value. The PR classifier (scripts/classify-mechanism-pr.mjs)
# proposes a stub row for an export that matches no row, with the mechanical
# fields filled in. The judgment fields (`job`, `builtOn`, `overlaps`) belong
# to the author of the spec or PR. CI never writes them.
#
# Graft is optional. Both scripts read the TypeScript exports directly. The
# review skills can use graft to go from an id's anchor to its callers.
mechanisms:
  # ── Contracts and core primitives ─────────────────────────────────────────
  - id: contracts
    job: Zero-dependency leaf types and helpers that core, engine and client share, so those packages don't import each other for a leaf shape.
    package: "@flow-state-dev/contracts"
    anchor: buildBlockInstanceId
    file: packages/contracts/src/block-instance-id.ts
    builtOn: []
    overlaps: []
    status: canonical
    doc: docs/architecture/overview.md

  - id: block
    job: The unit a flow runs. Exactly five block kinds (handler, generator, evaluator, sequencer, router); a sixth would be a new mechanism.
    package: "@flow-state-dev/core"
    anchor: handler
    file: packages/core/src/blocks/handler.ts
    builtOn: [contracts]
    overlaps:
      - { id: workforce, relation: distinct-jobs, note: "workforce/codegen exports a value named `generator`: the hook `fsdev gen` calls, not the block kind." }
    status: canonical
    doc: docs/architecture/blocks.md

  - id: sequencer-dsl
    job: The composition verbs on a sequencer (step, stepIf, tap, parallel, forEach, doUntil, sideChain, rescue, waitForCondition and the rest). A new verb extends this row, not the block kinds.
    package: "@flow-state-dev/core"
    anchor: SequencerDefinition
    file: packages/core/src/blocks/sequencer-methods.ts
    builtOn: [block]
    overlaps: []
    status: canonical
    doc: docs/architecture/sequencer-dsl.md

  - id: utility-block
    job: Ready-made blocks for small jobs (summarize, route, extract, decompose, classify intent), published as the `utility` namespace. A new factory there is named under this row.
    package: "@flow-state-dev/core"
    anchor: utility
    file: packages/core/src/utility/index.ts
    builtOn: [block]
    overlaps:
      - { id: memory, relation: distinct-jobs, note: "utility.memoryExtractor is a one-shot block; the memory package is cross-turn tiers." }
      - { id: response-auditor, relation: distinct-jobs, note: "utility.analyzer, responseAuditor and thought-fabric's biasAnalyzer share a name shape and judge different things." }
    status: canonical
    doc: docs/architecture/utility-blocks.md

  - id: flow
    job: Bundle blocks, actions, state and resources into the unit a caller starts. Actions are declared on the flow, not on a block.
    package: "@flow-state-dev/core"
    anchor: defineFlow
    file: packages/core/src/flow/defineFlow.ts
    builtOn: [block]
    overlaps: []
    status: canonical
    doc: docs/architecture/flows-and-actions.md

  - id: scope
