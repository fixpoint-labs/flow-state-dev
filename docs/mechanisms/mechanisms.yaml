    anchor: createDurabilitySweeper
    file: packages/engine/src/durability/durability-sweeper.ts
    builtOn: [execution, store]
    overlaps: []
    status: unconfirmed
    doc: docs/architecture/internal-execution-seams.md

  - id: lease
    job: Hold a place for one run at a time on a key, and plan how a second arrival waits (defer or queue). Redis is the BullMQ adapter.
    package: "@flow-state-dev/engine"
    anchor: createInMemoryLeaseBackend
    file: packages/engine/src/transports/concurrency/lease-backend.ts
    builtOn: [inbound-transport, store]
    overlaps:
