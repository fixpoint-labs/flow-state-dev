    doc: packages/core/README.md

  - id: prompt
    job: A prompt kept in a file beside the code that uses it. Core defines it; engine loads it from disk.
    package: "@flow-state-dev/core"
    anchor: definePromptFile
    file: packages/core/src/prompt/prompt-file.ts
    builtOn: [block]
    overlaps: []
    status: canonical
    doc: packages/core/README.md

  - id: graph
    job: Typed edges between nodes and pure functions that walk them. No dependency on the memory package.
    package: "@flow-state-dev/core"
    anchor: nodeRef
    file: packages/core/src/graph/edge.ts
    builtOn: []
    overlaps: []
    status: canonical
    doc: packages/core/README.md

  - id: manifest
    job: A registry of blocks, workers, skills and resources a host can discover. The domain list lives in contracts; the registry in core.
    package: "@flow-state-dev/core"
    anchor: createManifestRegistry
    file: packages/core/src/manifest/registry.ts
    builtOn: [block, contracts]
    overlaps: []
    status: canonical
    doc: packages/core/README.md

  # ── Waiting, dispatch and execution ───────────────────────────────────────
  - id: suspension
    job: Park a request until the user answers. The call site is ctx.waitForUser; the exported function is waitForUserOn.
    package: "@flow-state-dev/core"
    anchor: waitForUserOn
    file: packages/core/src/types/wait-for-user.ts
    builtOn: [execution]
    overlaps:
      - { id: task, relation: distinct-jobs, note: "A suspension parks the request. The task row's `holds` list says what the user holds the row on, and mirrors a suspension hold. One wait, two records; don't add a third." }
    status: canonical
    doc: docs/architecture/execution-and-errors.md

  - id: wait-gate
    job: Park a request on a named gate until another part of the system releases it.
    package: "@flow-state-dev/core"
    anchor: parkOnWait
    file: packages/core/src/types/wait-gate.ts
    builtOn: [suspension]
    overlaps:
      - { id: suspension, relation: distinct-jobs, note: "waitForUser parks for the user; parkOnWait parks on a gate something else releases. The answer shapes differ." }
    status: canonical
    doc: docs/architecture/execution-and-errors.md

  - id: dispatch
    job: Deliver every arrival at a flow (public, schedule, task, internal) as one envelope addressed by (type, name), through one door.
    package: "@flow-state-dev/core"
    anchor: dispatchThroughSeam
    file: packages/core/src/types/dispatch.ts
    builtOn: [flow, execution]
    overlaps:
      - { id: dispatcher, relation: distinct-jobs, note: "dispatch is the protocol every arrival uses. dispatcher() is a block that sends work to another session over it." }
    status: unconfirmed
    doc: docs/architecture/dispatched-work.md

  - id: dispatcher
    job: A handler block that sends work to another session of this runtime. Not a task claim order and not a queue worker.
    package: "@flow-state-dev/core"
    anchor: dispatcher
    file: packages/core/src/blocks/dispatcher.ts
    builtOn: [block, dispatch]
    overlaps:
      - { id: task, relation: distinct-jobs, note: "fifo, priority and topological claim orders pick a pending task row; dispatcher() sends work to a session." }
    status: canonical
    doc: docs/architecture/dispatched-work.md

  - id: execution
    job: Run one action. createExecutionContext is the bag of stores, streams and scope that run closes over.
    package: "@flow-state-dev/engine"
    anchor: runAction
    file: packages/engine/src/execution/runAction.ts
    builtOn: [flow, scope, streaming]
    overlaps: []
    status: canonical
    doc: docs/architecture/execution-and-errors.md

  - id: durability
    job: Keep a run recoverable across a process loss (checkpoints, and the sweeper that resumes what was left).
