<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 200">
<style>text { fill: #1b1a15; }</style>
<defs>
<pattern id="hatch" width="5" height="5" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line class="hatch-line" stroke="rgba(27, 26, 21, 0.45)" stroke-width="1" x1="0" y1="0" x2="0" y2="5"/></pattern>
<marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ink" fill="#1b1a15" d="M0,0 L10,5 L0,10 z"/></marker>
</defs>
<rect fill="url(#hatch)" x="28" y="24" width="300" height="10"/><line class="thin" fill="none" stroke="#1b1a15" stroke-width="1" x1="28" y1="34.5" x2="328" y2="34.5"/>
<rect class="solid" fill="none" stroke="#1b1a15" stroke-width="1.4" x="28" y="24" width="300" height="80"/>
<text class="lb" fill="#57544a" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="10px" font-weight="500" letter-spacing="1.5px" x="42" y="56">TASKS &amp; RUNS</text>
<rect class="hl" fill="#e8f551" x="36" y="66" width="120" height="28"/>
<text class="c on-hl" fill="#1b1a15" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="12.5px" font-weight="500" x="42" y="84">compare</text>
<rect class="dash" fill="none" stroke="#1b1a15" stroke-width="1.4" stroke-dasharray="5 4" x="438" y="24" width="300" height="80"/>
<text class="c" fill="#1b1a15" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="12.5px" font-weight="500" x="452" y="56">board.drain</text>
<line class="ln" fill="none" stroke="#1b1a15" stroke-width="1.3" x1="438" y1="64" x2="330" y2="64" marker-end="url(#ah)"/>
<rect class="ground" fill="#f0ece1" x="371.7" y="57" width="24.6" height="15"/><text class="plate" fill="#1b1a15" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="10.5px" font-weight="500" letter-spacing="1px" x="384" y="68" text-anchor="middle">01</text>
<line class="hi" fill="none" stroke="rgba(27, 26, 21, 0.25)" stroke-width="1" x1="0" y1="128" x2="920" y2="128"/>
<text class="n" fill="#1b1a15" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="11px" font-weight="500" x="28" y="154">01</text>
<text class="t" fill="#3d3a32" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="12px" font-weight="500" x="60" y="154">The drain claims a task that is ready.</text>
<g id="key">
<line class="ln" fill="none" stroke="#1b1a15" stroke-width="1.3" x1="28" y1="176" x2="54" y2="176" marker-end="url(#ah)"/>
<text class="lb" fill="#57544a" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="10px" font-weight="500" letter-spacing="1.5px" x="62" y="180">CLAIMS</text>
<line class="dash" fill="none" stroke="#1b1a15" stroke-width="1.4" stroke-dasharray="5 4" x1="139" y1="176" x2="165" y2="176"/>
<text class="lb" fill="#57544a" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="10px" font-weight="500" letter-spacing="1.5px" x="173" y="180">LASTS ONE ACTION RUN</text>
<rect fill="url(#hatch)" x="355" y="170" width="26" height="11"/><rect class="thin" fill="none" stroke="#1b1a15" stroke-width="1" x="355" y="170" width="26" height="11"/>
<text class="lb" fill="#57544a" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="10px" font-weight="500" letter-spacing="1.5px" x="389" y="180">OUTLIVES THE REQUEST</text>
<rect class="hl" fill="#e8f551" x="571" y="170" width="26" height="11"/>
<text class="lb" fill="#57544a" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="10px" font-weight="500" letter-spacing="1.5px" x="605" y="180">CANNOT START YET</text>
</g>
