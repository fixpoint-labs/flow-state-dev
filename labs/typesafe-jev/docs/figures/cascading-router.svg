<svg xmlns="http://www.w3.org/2000/svg" width="980" height="720" viewBox="0 0 980 720" role="img" aria-labelledby="title desc">
  <title id="title">cascadingRouter: two-level tree with confidence gates</title>
  <desc id="desc">cascadingRouter walks atomic evaluator hops. A branch is taken only when the choice matches and confidence clears the gate. Missing or low confidence exits to the ambiguous review block. Leaves are ordinary handlers.</desc>
  <defs>
    <style>
      .bg { fill: #f6f4ef; }
      .ink { fill: #1f1b16; font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; }
      .muted { fill: #6b635a; font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; }
      .label { fill: #fffdf8; font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; font-weight: 650; }
      .card { fill: #fffdf8; stroke: #d7d0c6; stroke-width: 1.25; }
      .arrow { stroke: #8a8278; stroke-width: 1.6; fill: none; marker-end: url(#arrow); }
      .fail { stroke: #9f1239; stroke-width: 1.5; stroke-dasharray: 5 4; fill: none; marker-end: url(#arrow-fail); }
      .chip-eval { fill: #0d7377; }
      .chip-gate { fill: #0d7377; }
      .chip-leaf { fill: #1e4d8c; }
      .chip-amb { fill: #9f1239; }
      .soft-eval { fill: #d7eeef; }
      .soft-leaf { fill: #e4edf8; }
      .soft-amb { fill: #fde8ee; }
      .soft-gate { fill: #e8f4f4; }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1.2 L 8.5 5 L 0 8.8 Z" fill="#8a8278"/>
    </marker>
    <marker id="arrow-fail" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1.2 L 8.5 5 L 0 8.8 Z" fill="#9f1239"/>
    </marker>
  </defs>

  <rect class="bg" width="980" height="720" rx="18"/>

  <text class="ink" x="36" y="42" font-size="20" font-weight="650">cascadingRouter · evaluate trees in code</text>
  <text class="muted" x="36" y="66" font-size="13">Each hop is one atomic evaluator call. Gates sit on edges. Leaves are ordinary blocks.</text>

  <!-- Root evaluate -->
  <rect class="soft-eval" x="330" y="92" width="260" height="78" rx="12"/>
  <rect class="chip-eval" x="350" y="106" width="86" height="20" rx="10"/>
  <text class="label" x="393" y="120" font-size="10" text-anchor="middle">evaluate</text>
  <text class="ink" x="460" y="146" font-size="14" font-weight="650" text-anchor="middle">department</text>
  <text class="muted" x="460" y="164" font-size="11" text-anchor="middle">Which team should handle this?</text>

  <!-- Edges from department -->
  <path class="arrow" d="M390 170 V210 H200 V248"/>
  <path class="arrow" d="M530 170 V210 H720 V248"/>

  <!-- Billing gate -->
  <rect class="soft-gate" x="118" y="248" width="164" height="50" rx="10"/>
  <rect class="chip-gate" x="130" y="258" width="52" height="16" rx="8"/>
  <text class="label" x="156" y="270" font-size="9" text-anchor="middle">gate</text>
  <text class="ink" x="200" y="286" font-size="11" text-anchor="middle">billing · e 0.6 · P e 0.7</text>

  <!-- Technical gate -->
  <rect class="soft-gate" x="638" y="248" width="164" height="50" rx="10"/>
  <rect class="chip-gate" x="650" y="258" width="52" height="16" rx="8"/>
  <text class="label" x="676" y="270" font-size="9" text-anchor="middle">gate</text>
  <text class="ink" x="720" y="286" font-size="11" text-anchor="middle">technical · e 0.6</text>

  <!-- Second evaluate -->
  <path class="arrow" d="M200 298 V336"/>
  <rect class="soft-eval" x="70" y="336" width="260" height="78" rx="12"/>
  <rect class="chip-eval" x="90" y="350" width="86" height="20" rx="10"/>
  <text class="label" x="133" y="364" font-size="10" text-anchor="middle">evaluate</text>
  <text class="ink" x="200" y="390" font-size="14" font-weight="650" text-anchor="middle">urgency</text>
  <text class="muted" x="200" y="408" font-size="11" text-anchor="middle">How urgent is this billing issue?</text>

  <!-- Tech leaf -->
  <path class="arrow" d="M720 298 V430"/>
  <rect class="soft-leaf" x="630" y="430" width="180" height="70" rx="12"/>
  <rect class="chip-leaf" x="648" y="444" width="52" height="16" rx="8"/>
  <text class="label" x="674" y="456" font-size="9" text-anchor="middle">leaf</text>
  <text class="ink" x="720" y="480" font-size="14" font-weight="650" text-anchor="middle">tech-queue</text>
  <text class="muted" x="720" y="498" font-size="11" text-anchor="middle">ordinary handler</text>

  <!-- Urgency branches -->
  <path class="arrow" d="M150 414 V450 H80 V488"/>
  <path class="arrow" d="M250 414 V450 H320 V488"/>

  <rect class="soft-gate" x="8" y="488" width="144" height="44" rx="10"/>
  <text class="ink" x="80" y="516" font-size="11" text-anchor="middle">high · e 0.6</text>

  <rect class="soft-gate" x="248" y="488" width="144" height="44" rx="10"/>
  <text class="ink" x="320" y="516" font-size="11" text-anchor="middle">low · e 0.5</text>

  <path class="arrow" d="M80 532 V568"/>
  <path class="arrow" d="M320 532 V568"/>

  <rect class="soft-leaf" x="8" y="568" width="144" height="70" rx="12"/>
  <rect class="chip-leaf" x="20" y="580" width="52" height="16" rx="8"/>
  <text class="label" x="46" y="592" font-size="9" text-anchor="middle">leaf</text>
  <text class="ink" x="80" y="616" font-size="13" font-weight="650" text-anchor="middle">escalate</text>
  <text class="muted" x="80" y="634" font-size="11" text-anchor="middle">ordinary handler</text>

  <rect class="soft-leaf" x="248" y="568" width="144" height="70" rx="12"/>
  <rect class="chip-leaf" x="260" y="580" width="52" height="16" rx="8"/>
  <text class="label" x="286" y="592" font-size="9" text-anchor="middle">leaf</text>
  <text class="ink" x="320" y="616" font-size="13" font-weight="650" text-anchor="middle">billing-queue</text>
  <text class="muted" x="320" y="634" font-size="11" text-anchor="middle">ordinary handler</text>

  <!-- Ambiguous rail -->
  <rect class="soft-amb" x="430" y="248" width="160" height="390" rx="14"/>
  <rect class="chip-amb" x="450" y="266" width="120" height="22" rx="11"/>
  <text class="label" x="510" y="281" font-size="11" text-anchor="middle">ambiguous</text>
  <text class="ink" x="510" y="320" font-size="13" font-weight="650" text-anchor="middle">review</text>
  <text class="muted" x="510" y="348" font-size="12" text-anchor="middle">never guess</text>

  <text class="ink" x="510" y="390" font-size="11" text-anchor="middle">gate fails when</text>
  <text class="muted" x="510" y="412" font-size="11" text-anchor="middle">choice does not match</text>
  <text class="muted" x="510" y="430" font-size="11" text-anchor="middle">confidence is missing</text>
  <text class="muted" x="510" y="448" font-size="11" text-anchor="middle">confidence is below Y</text>
  <text class="muted" x="510" y="466" font-size="11" text-anchor="middle">probability is below floor</text>

  <rect class="soft-leaf" x="454" y="500" width="112" height="58" rx="10"/>
  <text class="ink" x="510" y="526" font-size="12" font-weight="650" text-anchor="middle">review leaf</text>
  <text class="muted" x="510" y="544" font-size="11" text-anchor="middle">human / default</text>

  <!-- Fail-closed arrows into ambiguous -->
  <path class="fail" d="M282 273 H430"/>
  <path class="fail" d="M638 273 H590"/>
  <path class="fail" d="M152 510 H430"/>
  <path class="fail" d="M248 510 H430"/>

  <text class="muted" x="36" y="690" font-size="12">System 2 still compiles the tree: a definite structured choice carries synthetic confidence 1. Absent confidence still fail-closes.</text>
</svg>
