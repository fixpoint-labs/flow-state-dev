<svg xmlns="http://www.w3.org/2000/svg" width="980" height="620" viewBox="0 0 980 620" role="img" aria-labelledby="title desc">
  <title id="title">Evaluator vs generator, same experimental_evaluate API</title>
  <desc id="desc">A generator writes tokens you parse. An evaluator takes state plus typed questions and returns answers via experimental_evaluate. Jev is native. OpenAI, Anthropic, and Google use evaluationModel adapters on that same API. There is no FSD generator plus Zod fallback.</desc>
  <defs>
    <style>
      .bg { fill: #f6f4ef; }
      .ink { fill: #1f1b16; font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; }
      .muted { fill: #6b635a; font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; }
      .label { fill: #fffdf8; font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; font-weight: 650; }
      .card { fill: #fffdf8; stroke: #d7d0c6; stroke-width: 1.25; }
      .arrow { stroke: #8a8278; stroke-width: 1.6; fill: none; marker-end: url(#arrow); }
      .chip-gen { fill: #5b4d9a; }
      .chip-eval { fill: #0d7377; }
      .chip-lm { fill: #1e4d8c; }
      .soft-gen { fill: #ebe7f7; }
      .soft-eval { fill: #d7eeef; }
      .soft-lm { fill: #e4edf8; }
      .soft-ans { fill: #1f1b16; }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1.2 L 8.5 5 L 0 8.8 Z" fill="#8a8278"/>
    </marker>
  </defs>

  <rect class="bg" width="980" height="620" rx="18"/>

  <text class="ink" x="36" y="42" font-size="20" font-weight="650">Sibling blocks. Different jobs.</text>
  <text class="muted" x="36" y="66" font-size="13">A generator writes. An evaluator answers questions you already know how to ask.</text>

  <rect class="card" x="36" y="92" width="440" height="230" rx="14"/>
  <rect class="chip-gen" x="56" y="112" width="108" height="26" rx="13"/>
  <text class="label" x="110" y="130" font-size="12" text-anchor="middle">generator</text>
  <text class="ink" x="176" y="130" font-size="13" font-weight="600">write, then parse</text>
  <rect class="soft-gen" x="56" y="156" width="400" height="44" rx="8"/>
  <text class="ink" x="256" y="184" font-size="13" text-anchor="middle">prompt  ?  generate / streamText  ?  tokens</text>
  <text class="muted" x="76" y="228" font-size="13">You decide what the text meant after it arrives.</text>
  <text class="muted" x="76" y="250" font-size="13">Right primitive when the model should compose.</text>
  <text class="ink" x="76" y="286" font-size="13" font-weight="600">Wrong primitive for a known question set.</text>

  <rect class="card" x="504" y="92" width="440" height="230" rx="14"/>
  <rect class="chip-eval" x="524" y="112" width="108" height="26" rx="13"/>
  <text class="label" x="578" y="130" font-size="12" text-anchor="middle">evaluator</text>
  <text class="ink" x="644" y="130" font-size="13" font-weight="600">ask, then branch</text>
  <rect class="soft-eval" x="524" y="156" width="400" height="44" rx="8"/>
  <text class="ink" x="724" y="184" font-size="13" text-anchor="middle">state + questions  ?  typed answers</text>
  <text class="muted" x="544" y="228" font-size="13">choice / score / boolean. Options are yours first.</text>
  <text class="muted" x="544" y="250" font-size="13">One atomic call. Combine answers in code.</text>
  <text class="ink" x="544" y="286" font-size="13" font-weight="600">Trees live in cascadingRouter, not here.</text>

  <text class="ink" x="36" y="360" font-size="16" font-weight="650">Same API. Two kinds of evaluate model.</text>

  <rect class="card" x="36" y="380" width="200" height="56" rx="10"/>
  <text class="ink" x="136" y="414" font-size="13" font-weight="600" text-anchor="middle">state + questions</text>

  <path class="arrow" d="M236 408 H300"/>

  <rect class="soft-eval" x="300" y="372" width="220" height="72" rx="10"/>
  <text class="ink" x="410" y="402" font-size="13" font-weight="600" text-anchor="middle">experimental_evaluate</text>
  <text class="muted" x="410" y="422" font-size="11" text-anchor="middle">no FSD generateObject shim</text>

  <path class="arrow" d="M520 392 H590"/>
  <path class="arrow" d="M410 444 V476 H590"/>

  <rect class="soft-eval" x="590" y="360" width="354" height="64" rx="10"/>
  <rect class="chip-eval" x="606" y="374" width="86" height="20" rx="10"/>
  <text class="label" x="649" y="388" font-size="10" text-anchor="middle">Jev</text>
  <text class="ink" x="704" y="388" font-size="12">typesafe-ai/jev</text>
  <text class="muted" x="606" y="408" font-size="11">Native choice / score / boolean + confidence</text>

  <rect class="soft-lm" x="590" y="440" width="354" height="64" rx="10"/>
  <rect class="chip-lm" x="606" y="454" width="86" height="20" rx="10"/>
  <text class="label" x="649" y="468" font-size="10" text-anchor="middle">adapter</text>
  <text class="ink" x="704" y="468" font-size="12">openai.evaluationModel(…)</text>
  <text class="muted" x="606" y="488" font-size="11">Same API. No distributions. No TypeSafe confidence.</text>

  <path class="arrow" d="M767 424 V520"/>
  <path class="arrow" d="M767 504 V520"/>

  <rect class="soft-ans" x="590" y="528" width="354" height="56" rx="10"/>
  <text class="label" x="767" y="552" font-size="13" text-anchor="middle">typed answers your code branches on</text>
  <text class="muted" x="767" y="572" font-size="11" text-anchor="middle" fill="#d7d0c6">missing confidence / probabilities ? fail-closed</text>
</svg>
