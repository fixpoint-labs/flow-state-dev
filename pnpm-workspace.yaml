packages:
  - packages/*
  - apps/*
  - examples/*
  - examples/guides/*
  - labs/*
  - goals
  # The shipped plugin tree. It is a workspace member only so its tests run in CI — nothing
  # inside it imports from this monorepo, because it runs from an installed plugin on somebody
  # else's machine.
  - plugins/*

# pnpm 11+ no longer reads the "pnpm" field in package.json; settings live here.
allowBuilds:
  '@mongodb-js/zstd': false
  better-sqlite3: true
  core-js: false
  esbuild: false
  msgpackr-extract: false
  node-liblzma: false
  sharp: false

overrides:
  "@anthropic-ai/claude-agent-sdk": ^0.3.316
