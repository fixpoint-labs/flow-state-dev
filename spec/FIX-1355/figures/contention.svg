<svg viewBox="0 0 940 300" role="img"
     aria-label="One operator post feeds two seat lanes that run at the same time. Each lane carries its own instructions token, its own document and its own skill names. Both lanes converge on one queued channel session, which appends both lines and promises no order between them. Below a dashed fence, a third seat in another team holding a skill of the same name is never woken and appears nowhere in the transcript."
     xmlns="http://www.w3.org/2000/svg">
  <style>
    :root { --surface:#FCFCFA; --surface-2:#E8E8E1; --ink:#191C21; --ink-2:#4C535B; --ink-3:#7A828B;
            --rule:#D5D4CB; --accent:#3E4E8C; --accent-soft:#E0E3F0; --code:#2C7C69; --code-soft:#DCEDE7;
            --prose:#A8761C; --prose-soft:#F3E8D2; --gone:#A9544F; }
    @media (prefers-color-scheme: dark) {
      :root { --surface:#181C1F; --surface-2:#202528; --ink:#E6E8E5; --ink-2:#A4ACB1; --ink-3:#737B81;
              --rule:#2B3135; --accent:#8B9BD8; --accent-soft:#1B2140; --code:#5DBBA1; --code-soft:#14302A;
              --prose:#D9A44B; --prose-soft:#332612; --gone:#DE8A84; } }
    .n-box  { fill:var(--surface); stroke:var(--rule); stroke-width:1.2; }
    .n-acc  { fill:var(--accent-soft); stroke:var(--accent); stroke-width:1.4; }
    .n-code { fill:var(--code-soft); stroke:var(--code); stroke-width:1.4; }
    .n-gone { fill:none; stroke:var(--gone); stroke-width:1.2; stroke-dasharray:5 4; }
    .t-lbl  { fill:var(--ink-3); font-family:ui-monospace,SFMono-Regular,Menlo,monospace;
              font-size:9.5px; letter-spacing:.11em; }
    .t-b    { fill:var(--ink); font-family:system-ui,-apple-system,sans-serif; font-weight:600; font-size:13px; }
    .t-s    { fill:var(--ink-2); font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:9.5px; }
    .t-gone { fill:var(--gone); font-family:system-ui,-apple-system,sans-serif; font-size:11.5px; }
    .arrow  { fill:none; stroke:var(--ink-2); stroke-width:1.3; }
    .head   { fill:var(--ink-2); }
    .fence  { stroke:var(--ink-3); stroke-width:1.1; stroke-dasharray:7 5; }
  </style>

  <g id="post">
    <text class="t-lbl" x="16" y="26">ONE POST</text>
    <rect class="n-box" x="16" y="92" width="140" height="62" rx="5"/>
    <text class="t-b" x="30" y="116">operator line</text>
    <text class="t-s" x="30" y="136">no author</text>
    <path class="arrow" d="M156,110 L176,110 L176,82 L196,82"/>
    <path class="head" d="M196,77 L205,82 L196,87 z"/>
    <path class="arrow" d="M156,136 L176,136 L176,162 L196,162"/>
    <path class="head" d="M196,157 L205,162 L196,167 z"/>
  </g>

  <g id="lanes">
    <text class="t-lbl" x="214" y="42">TWO LANES · AT ONCE · EACH ON ITS OWN FILES</text>

    <rect class="n-code" x="214" y="52" width="416" height="60" rx="5"/>
    <text class="t-b" x="230" y="74">pentest.recon</text>
    <text class="t-s" x="230" y="94">teams/pentest/scope.md · sweep, port-scan, report-format</text>

    <rect class="n-code" x="214" y="132" width="416" height="60" rx="5"/>
    <text class="t-b" x="230" y="154">pentest.triage</text>
    <text class="t-s" x="230" y="174">rules-of-engagement.md · port-scan, report-format</text>

    <path class="arrow" d="M630,82 L664,82 L664,104 L688,104"/>
    <path class="head" d="M688,99 L697,104 L688,109 z"/>
    <path class="arrow" d="M630,162 L664,162 L664,140 L688,140"/>
    <path class="head" d="M688,135 L697,140 L688,145 z"/>
  </g>

  <g id="session">
    <rect class="n-acc" x="698" y="62" width="226" height="120" rx="5"/>
    <text class="t-b"   x="714" y="86">one queued session</text>
    <text class="t-s"   x="714" y="108">both appends land</text>
    <text class="t-s"   x="714" y="126">neither overwrites</text>
    <text class="t-s"   x="714" y="144">no order is promised</text>
    <text class="t-lbl" x="714" y="170">ONLY VISIBLE HERE</text>
  </g>

  <g id="fence">
    <path class="fence" d="M16,214 L924,214"/>
    <rect class="n-gone" x="214" y="230" width="416" height="54" rx="5"/>
    <text class="t-gone" x="230" y="252">audit.scribe · another team, another port-scan</text>
    <text class="t-s"    x="230" y="272">never woken · its token appears nowhere</text>
    <text class="t-lbl"  x="664" y="256">THE PROBE FOR A</text>
    <text class="t-lbl"  x="664" y="270">SHARED REGISTER</text>
  </g>
</svg>
