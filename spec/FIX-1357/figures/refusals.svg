<svg viewBox="0 0 940 260" role="img"
     aria-label="Two columns. The left column, generate time, holds six refusals: a directory inside a locked folder, an illegal basename, a declared kind that disagrees with its file, nothing usable exported, one name claimed by two folders, and an unreadable folder. The right column, run time, is almost empty: it holds one entry, the refusal that already exists today for a kind that was never registered."
     xmlns="http://www.w3.org/2000/svg">
  <style>
    :root { --surface:#FCFCFA; --surface-2:#E8E8E1; --ink:#191C21; --ink-2:#4C535B; --ink-3:#7A828B;
            --rule:#D5D4CB; --accent:#3E4E8C; --accent-soft:#E0E3F0; --code:#2C7C69; --code-soft:#DCEDE7;
            --prose:#A8761C; --prose-soft:#F3E8D2; --gone:#A9544F; }
    @media (prefers-color-scheme: dark) {
      :root { --surface:#181C1F; --surface-2:#202528; --ink:#E6E8E5; --ink-2:#A4ACB1; --ink-3:#737B81;
              --rule:#2B3135; --accent:#8B9BD8; --accent-soft:#1B2140; --code:#5DBBA1; --code-soft:#14302A;
              --prose:#D9A44B; --prose-soft:#332612; --gone:#DE8A84; } }
    .panel  { fill:none; stroke:var(--rule); stroke-width:1.2; }
    .n-code { fill:var(--code-soft); stroke:var(--code); stroke-width:1.2; }
    .n-acc  { fill:var(--accent-soft); stroke:var(--accent); stroke-width:1.2; }
    .t-lbl  { fill:var(--ink-3); font-family:ui-monospace,SFMono-Regular,Menlo,monospace;
              font-size:9.5px; letter-spacing:.11em; }
    .t-b    { fill:var(--ink); font-family:system-ui,-apple-system,sans-serif; font-weight:600; font-size:13px; }
    .t-r    { fill:var(--ink); font-family:system-ui,-apple-system,sans-serif; font-size:11.5px; }
    .t-s    { fill:var(--ink-2); font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:9.5px; }
    .t-id   { fill:var(--ink-3); font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:9.5px; }
  </style>

  <g id="generate-column">
    <text class="t-lbl" x="20" y="22">GENERATE TIME · FATAL, COLLECTED, ONE RUN NAMES ALL OF THEM</text>
    <rect class="panel" x="20" y="32" width="520" height="210" rx="5"/>

    <rect class="n-code" x="34" y="44" width="492" height="28" rx="4"/>
    <text class="t-id" x="46" y="62">BR-6</text>
    <text class="t-r"  x="92" y="62">a directory sits inside a locked folder</text>

    <rect class="n-code" x="34" y="76" width="492" height="28" rx="4"/>
    <text class="t-id" x="46" y="94">BR-8</text>
    <text class="t-r"  x="92" y="94">the basename is not a legal segment</text>

    <rect class="n-code" x="34" y="108" width="492" height="28" rx="4"/>
    <text class="t-id" x="46" y="126">BR-9</text>
    <text class="t-r"  x="92" y="126">the flow declares a kind its file does not</text>

    <rect class="n-code" x="34" y="140" width="492" height="28" rx="4"/>
    <text class="t-id" x="46" y="158">BR-10</text>
    <text class="t-r"  x="92" y="158">the file exports nothing usable</text>

    <rect class="n-code" x="34" y="172" width="492" height="28" rx="4"/>
    <text class="t-id" x="46" y="190">BR-11</text>
    <text class="t-r"  x="92" y="190">two folders claim one name</text>

    <rect class="n-code" x="34" y="204" width="492" height="28" rx="4"/>
    <text class="t-id" x="46" y="222">BR-12</text>
    <text class="t-r"  x="92" y="222">a locked folder is there and unreadable</text>
  </g>

  <g id="run-column">
    <text class="t-lbl" x="560" y="22">RUN TIME · NOTHING NEW</text>
    <rect class="panel" x="560" y="32" width="360" height="210" rx="5"/>

    <rect class="n-acc" x="574" y="44" width="332" height="46" rx="4"/>
    <text class="t-id" x="586" y="62">BR-13</text>
    <text class="t-r"  x="586" y="80">a kind that was never registered</text>

    <text class="t-s"  x="586" y="112">the refusal hireWorkforce</text>
    <text class="t-s"  x="586" y="128">already throws today</text>

    <text class="t-lbl" x="586" y="184">NO NEW OPTION</text>
    <text class="t-lbl" x="586" y="204">NO NEW CALL</text>
    <text class="t-lbl" x="586" y="224">NO NEW FAILURE AT BOOT</text>
  </g>
</svg>
