<svg viewBox="0 0 940 236" role="img"
     aria-label="One hireable kind's config bag, closed by the framework. The left half is the thin contract the framework owns: instructions, seatSkills, params, and whatever the contract adds later. The right half is params, the kind's own bag, closed by the kind's own schema, which can never collide with a key the contract adds."
     xmlns="http://www.w3.org/2000/svg">
  <style>
    :root { --surface:#FCFCFA; --surface-2:#E8E8E1; --ink:#191C21; --ink-2:#4C535B; --ink-3:#7A828B;
            --rule:#D5D4CB; --accent:#3E4E8C; --accent-soft:#E0E3F0; --code:#2C7C69; --code-soft:#DCEDE7;
            --prose:#A8761C; --prose-soft:#F3E8D2; --gone:#A9544F; }
    @media (prefers-color-scheme: dark) {
      :root { --surface:#181C1F; --surface-2:#202528; --ink:#E6E8E5; --ink-2:#A4ACB1; --ink-3:#737B81;
              --rule:#2B3135; --accent:#8B9BD8; --accent-soft:#1B2140; --code:#5DBBA1; --code-soft:#14302A;
              --prose:#D9A44B; --prose-soft:#332612; --gone:#DE8A84; } }
    .bag   { fill:var(--surface-2); stroke:var(--ink-3); stroke-width:1.4; }
    .ours  { fill:var(--code-soft); stroke:var(--code); stroke-width:1.4; }
    .kinds { fill:var(--prose-soft); stroke:var(--prose); stroke-width:1.4; }
    .t-lbl { fill:var(--ink-3); font-family:ui-monospace,SFMono-Regular,Menlo,monospace;
             font-size:9.5px; letter-spacing:.1em; }
    .t-b   { fill:var(--ink); font-family:system-ui,-apple-system,sans-serif; font-weight:600; font-size:13px; }
    .t-s   { fill:var(--ink-2); font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:10px; }
    .t-f   { fill:var(--ink-3); font-family:ui-monospace,SFMono-Regular,Menlo,monospace;
             font-size:10px; font-style:italic; }
    .edge  { stroke:var(--prose); stroke-width:1.4; fill:none; }
  </style>
  <defs>
    <marker id="p" markerWidth="7" markerHeight="7" refX="6" refY="3.2" orient="auto">
      <path d="M0,0 L6,3.2 L0,6.4 z" fill="var(--prose)"/>
    </marker>
  </defs>

  <text class="t-lbl" x="16" y="22">ONE HIREABLE KIND'S CONFIG BAG — the framework closes the outer set</text>
  <rect class="bag" x="16" y="34" width="908" height="186" rx="6"/>

  <g id="ours">
    <rect class="ours" x="34" y="54" width="400" height="146" rx="5"/>
    <text class="t-lbl" x="50" y="76">THE THIN CONTRACT — OURS</text>
    <text class="t-b"  x="50" y="102">instructions?</text>
    <text class="t-s"  x="210" y="102">the worker's body</text>
    <text class="t-b"  x="50" y="128">seatSkills</text>
    <text class="t-s"  x="210" y="128">filled by hire, every seat</text>
    <text class="t-b"  x="50" y="154">params</text>
    <text class="t-s"  x="210" y="154">always present, empty is fine</text>
    <text class="t-f"  x="50" y="182">…and whatever the contract adds next</text>
  </g>

  <g id="kinds">
    <rect class="kinds" x="506" y="54" width="400" height="146" rx="5"/>
    <text class="t-lbl" x="522" y="76">INSIDE params — THE KIND'S</text>
    <text class="t-b"  x="522" y="104">whatever this kind declares</text>
    <text class="t-s"  x="522" y="130">closed by the kind's own schema,</text>
    <text class="t-s"  x="522" y="146">so a typo in here still refuses</text>
    <text class="t-s"  x="522" y="178">and it can never collide with a key</text>
    <text class="t-s"  x="522" y="192">the left half grows later</text>
  </g>

  <path class="edge" d="M434,150 L470,150 L470,120 L500,120" marker-end="url(#p)"/>
</svg>
