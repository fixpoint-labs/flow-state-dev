<svg viewBox="0 0 940 300" role="img" aria-label="A grid of six fixed probes down the side against four candidate variants across the top: reuse the SKILL.md format, reuse the seat-folder shape, create a new package file, and don't collapse at all. Every variant is judged on the same six probes: ships instructions, ships a tool, ships a document, attaches both ways, the grant gate still holds, and nothing that works today breaks. Every probe is satisfiable by something that exists today, and the don't-collapse column is a real candidate rather than a control."
     xmlns="http://www.w3.org/2000/svg">
  <style>
    :root { --surface:#FCFCFA; --surface-2:#E8E8E1; --ink:#191C21; --ink-2:#4C535B; --ink-3:#7A828B;
            --rule:#D5D4CB; --accent:#3E4E8C; --accent-soft:#E0E3F0; --code:#2C7C69; --code-soft:#DCEDE7;
            --prose:#A8761C; --prose-soft:#F3E8D2; --gone:#A9544F; }
    @media (prefers-color-scheme: dark) {
      :root { --surface:#181C1F; --surface-2:#202528; --ink:#E6E8E5; --ink-2:#A4ACB1; --ink-3:#737B81;
              --rule:#2B3135; --accent:#8B9BD8; --accent-soft:#1B2140; --code:#5DBBA1; --code-soft:#14302A;
              --prose:#D9A44B; --prose-soft:#332612; --gone:#DE8A84; } }
    .n-box  { fill:var(--surface); stroke:var(--rule); stroke-width:1.1; }
    .n-head { fill:var(--accent-soft); stroke:var(--accent); stroke-width:1.2; }
    .n-ctl  { fill:var(--code-soft); stroke:var(--code); stroke-width:1.2; }
    .grid   { stroke:var(--rule); stroke-width:.8; fill:none; }
    .t-lbl  { fill:var(--ink-3); font-family:ui-monospace,SFMono-Regular,Menlo,monospace;
              font-size:9.5px; letter-spacing:.1em; }
    .t-b    { fill:var(--ink); font-family:system-ui,-apple-system,sans-serif; font-weight:600; font-size:11.5px; }
    .t-s    { fill:var(--ink-2); font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:9px; }
  </style>

  <g id="col-heads">
    <text class="t-lbl" x="16" y="22">THE SIX PROBES · FIXED BEFORE ANY VARIANT IS BUILT</text>
    <rect class="n-head" x="300" y="32" width="150" height="40" rx="4"/>
    <text class="t-b" x="310" y="50">A · reuse</text>
    <text class="t-s" x="310" y="64">the SKILL.md format</text>

    <rect class="n-head" x="456" y="32" width="150" height="40" rx="4"/>
    <text class="t-b" x="466" y="50">B · reuse</text>
    <text class="t-s" x="466" y="64">the seat-folder shape</text>

    <rect class="n-head" x="612" y="32" width="150" height="40" rx="4"/>
    <text class="t-b" x="622" y="50">C · create</text>
    <text class="t-s" x="622" y="64">a new package file</text>

    <rect class="n-ctl" x="768" y="32" width="150" height="40" rx="4"/>
    <text class="t-b" x="778" y="50">D · don't collapse</text>
    <text class="t-s" x="778" y="64">write the placement rule</text>
  </g>

  <g id="rows">
    <rect class="n-box" x="16" y="82" width="278" height="26" rx="3"/>
    <text class="t-b" x="26" y="99">P1 · ships instructions</text>

    <rect class="n-box" x="16" y="114" width="278" height="26" rx="3"/>
    <text class="t-b" x="26" y="131">P2 · ships a tool</text>

    <rect class="n-box" x="16" y="146" width="278" height="26" rx="3"/>
    <text class="t-b" x="26" y="163">P3 · ships a document</text>

    <rect class="n-box" x="16" y="178" width="278" height="26" rx="3"/>
    <text class="t-b" x="26" y="195">P4 · attaches both ways</text>

    <rect class="n-box" x="16" y="210" width="278" height="26" rx="3"/>
    <text class="t-b" x="26" y="227">P5 · the grant gate holds</text>

    <rect class="n-box" x="16" y="242" width="278" height="26" rx="3"/>
    <text class="t-b" x="26" y="259">P6 · nothing today breaks</text>
  </g>

  <g id="cells">
    <path class="grid" d="M300 82 H924 M300 114 H924 M300 146 H924 M300 178 H924 M300 210 H924 M300 242 H924 M300 268 H924"/>
    <path class="grid" d="M300 82 V268 M456 82 V268 M612 82 V268 M768 82 V268 M924 82 V268"/>
  </g>

  <g id="caption">
    <path class="grid" d="M16 286 H924"/>
    <text class="t-s" x="16" y="296">Read down a column. A variant wins by passing probes the others fail, and the probe set is fixed first so the four stay comparable.</text>
  </g>
</svg>
