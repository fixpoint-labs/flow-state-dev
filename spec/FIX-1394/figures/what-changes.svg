<svg viewBox="0 0 940 358" role="img" aria-label="Today, seven author-written conventions across three doors each supply a seat one thing, and only skills can be held without being active; every one of them passes through a single grant gate, the tools key in the seat's own WORKER.md. If the ratify chooses to collapse them, one package format supplies all of it in two attachment modes, attached to a seat as always-on or held in a library as opt-in, and the same grant gate is unchanged. Don't collapse is also a possible answer."
     xmlns="http://www.w3.org/2000/svg">
  <style>
    :root { --surface:#FCFCFA; --surface-2:#E8E8E1; --ink:#191C21; --ink-2:#4C535B; --ink-3:#7A828B;
            --rule:#D5D4CB; --accent:#3E4E8C; --accent-soft:#E0E3F0; --code:#2C7C69; --code-soft:#DCEDE7;
            --prose:#A8761C; --prose-soft:#F3E8D2; --gone:#A9544F; }
    @media (prefers-color-scheme: dark) {
      :root { --surface:#181C1F; --surface-2:#202528; --ink:#E6E8E5; --ink-2:#A4ACB1; --ink-3:#737B81;
              --rule:#2B3135; --accent:#8B9BD8; --accent-soft:#1B2140; --code:#5DBBA1; --code-soft:#14302A;
              --prose:#D9A44B; --prose-soft:#332612; --gone:#DE8A84; } }
    .n-box  { fill:var(--surface); stroke:var(--rule); stroke-width:1.2; }
    .n-soft { fill:var(--accent-soft); stroke:var(--accent); stroke-width:1.2; }
    .n-opt  { fill:var(--code-soft); stroke:var(--code); stroke-width:1.2; }
    .n-seat { fill:var(--prose-soft); stroke:var(--prose); stroke-width:1.4; }
    .fence  { stroke:var(--gone); stroke-width:1.6; stroke-dasharray:5 4; fill:none; }
    .flow   { stroke:var(--ink-3); stroke-width:1; fill:none; }
    .t-lbl  { fill:var(--ink-3); font-family:ui-monospace,SFMono-Regular,Menlo,monospace;
              font-size:9.5px; letter-spacing:.1em; }
    .t-b    { fill:var(--ink); font-family:system-ui,-apple-system,sans-serif; font-weight:600; font-size:12px; }
    .t-s    { fill:var(--ink-2); font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:9px; }
    .t-f    { fill:var(--gone); font-family:system-ui,-apple-system,sans-serif; font-weight:600; font-size:10.5px; }
  </style>

  <g id="today">
    <text class="t-lbl" x="16" y="24">TODAY · SEVEN CONVENTIONS</text>
    <rect class="n-box" x="16" y="34" width="196" height="32" rx="4"/>
    <text class="t-b" x="28" y="49">WORKER.md</text>
    <text class="t-s" x="28" y="61">instructions · always-on</text>

    <rect class="n-box" x="16" y="72" width="196" height="32" rx="4"/>
    <text class="t-b" x="28" y="87">TEAM.md</text>
    <text class="t-s" x="28" y="99">team text · always-on</text>

    <rect class="n-opt" x="16" y="110" width="196" height="32" rx="4"/>
    <text class="t-b" x="28" y="125">SKILL.md</text>
    <text class="t-s" x="28" y="137">held · the one opt-in</text>

    <rect class="n-box" x="16" y="148" width="196" height="32" rx="4"/>
    <text class="t-b" x="28" y="163">CHANNEL.md</text>
    <text class="t-s" x="28" y="175">charter · always-on</text>

    <rect class="n-box" x="16" y="186" width="196" height="32" rx="4"/>
    <text class="t-b" x="28" y="201">resources/*.md</text>
    <text class="t-s" x="28" y="213">documents · always-on</text>

    <rect class="n-box" x="16" y="224" width="196" height="32" rx="4"/>
    <text class="t-b" x="28" y="239">blocks/*.ts · resources/*.ts</text>
    <text class="t-s" x="28" y="251">TypeScript · no frontmatter</text>

    <text class="t-s" x="16" y="274">three doors · two dialects</text>
  </g>

  <g id="today-flows">
    <path class="flow" d="M212 50 H304"/>
    <path class="flow" d="M212 88 H304"/>
    <path class="flow" d="M212 126 H304"/>
    <path class="flow" d="M212 164 H304"/>
    <path class="flow" d="M212 202 H304"/>
    <path class="flow" d="M212 240 H304"/>
  </g>

  <g id="gate-left">
    <path class="fence" d="M304 30 V262"/>
    <text class="t-f" x="314" y="160">THE GRANT GATE</text>
    <text class="t-s" x="314" y="176">the seat's own</text>
    <text class="t-s" x="314" y="188">WORKER.md `tools:`</text>
    <text class="t-s" x="314" y="206">nothing crosses unless</text>
    <text class="t-s" x="314" y="218">the file names it</text>
  </g>

  <g id="seat-left">
    <rect class="n-seat" x="466" y="77" width="120" height="60" rx="5"/>
    <text class="t-lbl" x="478" y="97">SEAT</text>
    <text class="t-b" x="478" y="115">what it may</text>
    <text class="t-b" x="478" y="129">actually call</text>
    <path class="flow" d="M304 107 H466"/>
  </g>

  <g id="after">
    <text class="t-lbl" x="628" y="24">IF THE RATIFY COLLAPSES THEM</text>
    <rect class="n-soft" x="628" y="34" width="196" height="70" rx="5"/>
    <text class="t-b" x="640" y="54">one package</text>
    <text class="t-s" x="640" y="68">instructions · tools</text>
    <text class="t-s" x="640" y="80">documents · skills</text>
    <text class="t-s" x="640" y="96">one reader, one refusal set</text>

    <rect class="n-box" x="628" y="124" width="196" height="32" rx="4"/>
    <text class="t-b" x="640" y="139">attached to a seat</text>
    <text class="t-s" x="640" y="151">mode 1 · always-on</text>

    <rect class="n-opt" x="628" y="164" width="196" height="32" rx="4"/>
    <text class="t-b" x="640" y="179">held in a library</text>
    <text class="t-s" x="640" y="191">mode 2 · opt-in</text>

    <path class="flow" d="M726 104 V124"/>
    <path class="flow" d="M726 156 V164"/>

    <text class="t-s" x="628" y="216">`don't collapse` is also</text>
    <text class="t-s" x="628" y="228">a possible answer</text>
  </g>

  <g id="gate-right">
    <path class="fence" d="M880 30 V262"/>
    <text class="t-f" x="806" y="252">SAME GATE</text>
    <path class="flow" d="M824 140 H880"/>
    <path class="flow" d="M824 180 H880"/>
  </g>

  <g id="caption">
    <path class="flow" d="M16 300 H924"/>
    <text class="t-s" x="16" y="320">The gate is the same line in both halves, and this issue does not move it. What moves is the left column collapsing into one</text>
    <text class="t-s" x="16" y="334">box with two modes — and whether a package may ever cross that gate on its own is the decision this issue puts to you.</text>
    <text class="t-s" x="16" y="350">The right half shows one of four possible answers, not a foregone one.</text>
  </g>
</svg>
