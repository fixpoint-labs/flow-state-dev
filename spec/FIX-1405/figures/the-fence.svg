<svg viewBox="0 0 940 280" role="img" xmlns="http://www.w3.org/2000/svg"
     aria-label="A vertical fence between two planes. On the left, the channel session, holding its members list and the post fence that reads it. On the right, the org inventory, holding one row per open channel. Three paths approach the fence: a consumer asking which channels exist crosses over into the inventory; a post checking its author stops at the channel session and never crosses; and ChannelFlow crosses once, at the moment a channel opens, to write the row.">
  <style>
    :root { --surface:#FCFCFA; --surface-2:#E8E8E1; --ink:#191C21; --ink-2:#4C535B; --ink-3:#7A828B;
            --rule:#D5D4CB; --accent:#3E4E8C; --accent-soft:#E0E3F0; --code:#2C7C69; --code-soft:#DCEDE7;
            --prose:#A8761C; --prose-soft:#F3E8D2; --gone:#A9544F; }
    @media (prefers-color-scheme: dark) {
      :root { --surface:#181C1F; --surface-2:#202528; --ink:#E6E8E5; --ink-2:#A4ACB1; --ink-3:#737B81;
              --rule:#2B3135; --accent:#8B9BD8; --accent-soft:#1B2140; --code:#5DBBA1; --code-soft:#14302A;
              --prose:#D9A44B; --prose-soft:#332612; --gone:#DE8A84; } }
    .n-box  { fill:var(--surface); stroke:var(--rule); stroke-width:1.2; }
    .n-acc  { fill:var(--accent-soft); stroke:var(--accent); stroke-width:1.4; }
    .n-flat { fill:var(--surface-2); stroke:var(--rule); stroke-width:1; }
    .t-lbl  { fill:var(--ink-3); font-family:ui-monospace,SFMono-Regular,Menlo,monospace;
              font-size:9.5px; letter-spacing:.1em; }
    .t-b    { fill:var(--ink); font-family:system-ui,-apple-system,sans-serif; font-weight:600; font-size:12.5px; }
    .t-s    { fill:var(--ink-2); font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:9.5px; }
    .t-stop { fill:var(--gone); font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:9.5px; }
    .cross  { stroke:var(--code); stroke-width:1.6; fill:none; }
    .write  { stroke:var(--accent); stroke-width:1.6; fill:none; }
    .stop   { stroke:var(--gone); stroke-width:1.6; fill:none; }
    .fence  { stroke:var(--gone); stroke-width:1.6; stroke-dasharray:6 4; }
  </style>
  <defs>
    <marker id="c" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0 L8 4 L0 8 z" fill="var(--code)"/>
    </marker>
    <marker id="w" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0 L8 4 L0 8 z" fill="var(--accent)"/>
    </marker>
    <marker id="s" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0 L8 4 L0 8 z" fill="var(--gone)"/>
    </marker>
  </defs>

  <g id="fence">
    <path class="fence" d="M566 14 L566 240"/>
  </g>

  <g id="channel">
    <text class="t-lbl" x="300" y="56">THE CHANNEL SESSION · ITS OWN TRUTH</text>
    <rect class="n-box" x="300" y="64" width="232" height="86" rx="5"/>
    <text class="t-b" x="316" y="86">members</text>
    <text class="t-s" x="316" y="104">written once, at open</text>
    <rect class="n-flat" x="316" y="114" width="200" height="24" rx="3"/>
    <text class="t-s" x="326" y="130">the post fence reads this</text>
  </g>

  <g id="inventory">
    <text class="t-lbl" x="600" y="56">THE ORG INVENTORY · DISCOVERY</text>
    <rect class="n-acc" x="600" y="64" width="232" height="86" rx="5"/>
    <text class="t-b" x="616" y="86">one row per open channel</text>
    <text class="t-s" x="616" y="104">id · kind · members · opened</text>
    <rect class="n-flat" x="616" y="114" width="200" height="24" rx="3"/>
    <text class="t-s" x="626" y="130">a mirror, never the check</text>
  </g>

  <g id="path-discovery">
    <rect class="n-box" x="16" y="64" width="200" height="40" rx="5"/>
    <text class="t-b" x="30" y="81">which channels exist?</text>
    <text class="t-s" x="30" y="97">a board · a catalog · a seat</text>
    <path class="cross" d="M216 78 L246 78 L246 24 L800 24 L800 60" marker-end="url(#c)"/>
    <text class="t-lbl" x="430" y="18">CROSSES</text>
  </g>

  <g id="path-post">
    <rect class="n-box" x="16" y="120" width="200" height="40" rx="5"/>
    <text class="t-b" x="30" y="137">may this author post?</text>
    <text class="t-s" x="30" y="153">the post fence</text>
    <path class="stop" d="M216 140 L294 130" marker-end="url(#s)"/>
    <text class="t-stop" x="222" y="162">stops here · never crosses</text>
  </g>

  <g id="path-write">
    <rect class="n-box" x="300" y="180" width="232" height="40" rx="5"/>
    <text class="t-b" x="316" y="197">ChannelFlow, as a channel opens</text>
    <text class="t-s" x="316" y="213">the one writer</text>
    <path class="write" d="M532 200 L700 200 L700 154" marker-end="url(#w)"/>
    <text class="t-lbl" x="602" y="194">CROSSES ONCE</text>
  </g>

  <text class="t-lbl" x="470" y="262" text-anchor="middle">ONE CROSSES EACH WAY · THE MIDDLE ONE DOES NOT</text>
</svg>
