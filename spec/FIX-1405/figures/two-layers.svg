<svg viewBox="0 0 940 480" role="img" xmlns="http://www.w3.org/2000/svg"
     aria-label="Two layers over one workforce tree. Left of a vertical fence, at boot and off the request path, a declared tree of teams, workers, channels and documents is read once by readDeclaredRoster into records plus one problems list; it derives state and registers nothing. One arrow crosses the fence, at boot, carrying those records to openInventory, the boot binder, which carries no member data. Right of the fence the inventory has two writers: the binder upserts one seat row per seat straight from the roster, because a seat holds no session; and each open channel writes its own row and its membership index rows from its own session state, so an edited file never reaches an already-open channel. The org-scoped inventory holds one row per registered seat, one per open channel, and a membership index keyed by seat so that asking which channels a seat is in narrows by key prefix instead of loading the whole collection. Any flow in the same org reads it as an ordinary resource. Nothing crosses back to the tree. A strip along the bottom names what is not built: no second WorkerRegistry, no mega-loader that re-walks the tree, and no DM verb.">
  <style>
    :root { --surface:#FCFCFA; --surface-2:#E8E8E1; --ink:#191C21; --ink-2:#4C535B; --ink-3:#7A828B;
            --rule:#D5D4CB; --accent:#3E4E8C; --accent-soft:#E0E3F0; --code:#2C7C69; --code-soft:#DCEDE7;
            --prose:#A8761C; --prose-soft:#F3E8D2; --gone:#A9544F; }
    @media (prefers-color-scheme: dark) {
      :root { --surface:#181C1F; --surface-2:#202528; --ink:#E6E8E5; --ink-2:#A4ACB1; --ink-3:#737B81;
              --rule:#2B3135; --accent:#8B9BD8; --accent-soft:#1B2140; --code:#5DBBA1; --code-soft:#14302A;
              --prose:#D9A44B; --prose-soft:#332612; --gone:#DE8A84; } }
    .n-box  { fill:var(--surface); stroke:var(--rule); stroke-width:1.2; }
    .n-code { fill:var(--code-soft); stroke:var(--code); stroke-width:1.4; }
    .n-acc  { fill:var(--accent-soft); stroke:var(--accent); stroke-width:1.4; }
    .n-flat { fill:var(--surface-2); stroke:var(--rule); stroke-width:1; }
    .t-lbl  { fill:var(--ink-3); font-family:ui-monospace,SFMono-Regular,Menlo,monospace;
              font-size:9.5px; letter-spacing:.1em; }
    .t-b    { fill:var(--ink); font-family:system-ui,-apple-system,sans-serif; font-weight:600; font-size:13px; }
    .t-s    { fill:var(--ink-2); font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:9.5px; }
    .t-gone { fill:var(--gone); font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:9.5px; }
    .edge   { stroke:var(--ink-3); stroke-width:1.3; fill:none; }
    .edge-x { stroke:var(--code); stroke-width:1.8; fill:none; }
    .fence  { stroke:var(--gone); stroke-width:1.6; stroke-dasharray:6 4; }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0 L8 4 L0 8 z" fill="var(--ink-3)"/>
    </marker>
    <marker id="ax" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0 L8 4 L0 8 z" fill="var(--code)"/>
    </marker>
  </defs>

  <g id="fence">
    <path class="fence" d="M478 24 L478 60"/>
    <path class="fence" d="M478 100 L478 410"/>
    <text class="t-lbl" x="478" y="16" text-anchor="middle">THE FENCE</text>
  </g>

  <g id="declared">
    <text class="t-lbl" x="16" y="42">DECLARED · BOOT, OFF THE REQUEST PATH</text>
    <rect class="n-box" x="16" y="52" width="118" height="76" rx="5"/>
    <text class="t-b" x="28" y="74">the tree</text>
    <text class="t-s" x="28" y="92">teams · workers</text>
    <text class="t-s" x="28" y="106">channels</text>
    <text class="t-s" x="28" y="120">documents</text>

    <path class="edge" d="M134 90 L158 90" marker-end="url(#a)"/>

    <rect class="n-code" x="166" y="52" width="166" height="76" rx="5"/>
    <text class="t-lbl" x="178" y="70">NEW</text>
    <text class="t-b" x="178" y="92">readDeclaredRoster</text>
    <text class="t-s" x="178" y="112">three readers, no walk</text>

    <path class="edge" d="M332 90 L348 90" marker-end="url(#a)"/>

    <rect class="n-box" x="356" y="52" width="64" height="76" rx="5"/>
    <text class="t-s" x="364" y="80">records</text>
    <text class="t-s" x="364" y="96">+</text>
    <text class="t-s" x="364" y="112">problems</text>

    <text class="t-s" x="16" y="152">derives per read · registers nothing · Node only</text>
  </g>

  <g id="crossing">
    <text class="t-lbl" x="478" y="78" text-anchor="middle">ONCE, AT BOOT</text>
    <path class="edge-x" d="M420 90 L532 90" marker-end="url(#ax)"/>
  </g>

  <g id="live">
    <text class="t-lbl" x="540" y="42">LIVE · WHAT IS ACTUALLY OPEN</text>

    <rect class="n-code" x="540" y="68" width="384" height="46" rx="5"/>
    <text class="t-b" x="556" y="88">openInventory · the boot binder</text>
    <text class="t-s" x="556" y="105">names seats and channels · carries no member data</text>

    <path class="edge" d="M600 114 L600 226" marker-end="url(#a)"/>
    <text class="t-s" x="610" y="148">seat rows,</text>
    <text class="t-s" x="610" y="162">straight from</text>
    <text class="t-s" x="610" y="176">the roster</text>
    <text class="t-s" x="610" y="196">a seat holds</text>
    <text class="t-s" x="610" y="210">no session</text>

    <path class="edge" d="M812 114 L812 146" marker-end="url(#a)"/>
    <text class="t-s" x="822" y="136">channel ids only</text>

    <rect class="n-box" x="700" y="150" width="224" height="56" rx="5"/>
    <text class="t-b" x="714" y="170">the channel itself</text>
    <text class="t-s" x="714" y="186">one run per open channel,</text>
    <text class="t-s" x="714" y="200">in its own session</text>

    <path class="edge" d="M812 206 L812 226" marker-end="url(#a)"/>

    <rect class="n-acc" x="540" y="230" width="384" height="112" rx="5"/>
    <text class="t-lbl" x="556" y="250">ORG-SCOPED · ONE PER ORG</text>
    <text class="t-b" x="556" y="272">the live inventory</text>
    <rect class="n-flat" x="556" y="280" width="172" height="15" rx="3"/>
    <text class="t-s" x="564" y="291">inventory/seats/*</text>
    <rect class="n-flat" x="556" y="298" width="172" height="15" rx="3"/>
    <text class="t-s" x="564" y="309">inventory/channels/*</text>
    <rect class="n-flat" x="556" y="316" width="172" height="15" rx="3"/>
    <text class="t-s" x="564" y="327">inventory/members/&lt;seat&gt;/*</text>
    <text class="t-s" x="742" y="291">what is actually open,</text>
    <text class="t-s" x="742" y="309">not what the files say</text>
    <text class="t-s" x="742" y="327">members narrow by prefix</text>

    <path class="edge" d="M732 342 L732 366" marker-end="url(#a)"/>
    <text class="t-s" x="742" y="358">an ordinary resource read</text>

    <rect class="n-box" x="540" y="370" width="384" height="44" rx="5"/>
    <text class="t-b" x="556" y="390">any flow in the same org</text>
    <text class="t-s" x="556" y="406">a seat · a board · a catalog</text>
  </g>

  <g id="not-built">
    <path class="fence" d="M16 434 L924 434"/>
    <text class="t-lbl" x="16" y="454">NOT BUILT</text>
    <text class="t-gone" x="16" y="472">no second WorkerRegistry</text>
    <text class="t-gone" x="260" y="472">no mega-loader that re-walks the tree</text>
    <text class="t-gone" x="600" y="472">no DM verb · no join or leave</text>
  </g>
</svg>
