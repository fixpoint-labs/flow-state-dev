<svg viewBox="0 0 940 340" role="img" xmlns="http://www.w3.org/2000/svg"
     aria-label="A matrix. Rows are the epic's nine cross-cutting rules; columns are the seven issues in chain order. Each cell says whether that issue owns the rule, builds it, consumes it, or teaches it. Every rule has exactly one owner. The drift note is owned by FIX-1360 and consumed by four others; the admission rule and loud-fail rule are owned by FIX-1361 and built by FIX-1363; the skills merge rule is FIX-1362's alone; the memory seam is FIX-1364's and taught by FIX-1366; the proof is FIX-1365's alone.">
  <style>
    :root { --surface:#FCFCFA; --surface-2:#E8E8E1; --ink:#191C21; --ink-2:#4C535B; --ink-3:#7A828B; --rule:#D5D4CB;
            --accent:#3E4E8C; --accent-soft:#E0E3F0; --code:#2C7C69; --code-soft:#DCEDE7; --prose:#A8761C; --prose-soft:#F3E8D2; }
    @media (prefers-color-scheme: dark) {
      :root { --surface:#181C1F; --surface-2:#202528; --ink:#E6E8E5; --ink-2:#A4ACB1; --ink-3:#737B81; --rule:#2B3135;
              --accent:#8B9BD8; --accent-soft:#1B2140; --code:#5DBBA1; --code-soft:#14302A; --prose:#D9A44B; --prose-soft:#332612; } }
    .t-s  { fill:var(--ink-2); font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:9.5px; }
    .t-xs { fill:var(--ink-3); font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:8.5px; letter-spacing:.04em; }
    .t-lbl{ fill:var(--ink-3); font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:9.5px; letter-spacing:.1em; }
    .t-c  { fill:var(--ink-2); font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:8.5px; text-anchor:middle; }
    .own  { fill:var(--code-soft);   stroke:var(--code);   stroke-width:1.3; }
    .build{ fill:var(--surface);     stroke:var(--code);   stroke-width:1.2; }
    .use  { fill:var(--accent-soft); stroke:var(--accent); stroke-width:1; }
    .teach{ fill:var(--prose-soft);  stroke:var(--prose);  stroke-width:1; }
    .grid { stroke:var(--rule); stroke-width:1; }
  </style>

  <text class="t-lbl" x="40" y="28">WHO OWNS WHAT · one owner per rule · columns in chain order</text>

  <g id="cols">
    <text class="t-c" x="330" y="56">FIX-1360</text><text class="t-c" x="330" y="67">drift audit</text>
    <text class="t-c" x="412" y="56">FIX-1361</text><text class="t-c" x="412" y="67">contract</text>
    <text class="t-c" x="494" y="56">FIX-1363</text><text class="t-c" x="494" y="67">the kind</text>
    <text class="t-c" x="576" y="56">FIX-1362</text><text class="t-c" x="576" y="67">skills</text>
    <text class="t-c" x="658" y="56">FIX-1364</text><text class="t-c" x="658" y="67">memory seam</text>
    <text class="t-c" x="740" y="56">FIX-1366</text><text class="t-c" x="740" y="67">teach</text>
    <text class="t-c" x="822" y="56">FIX-1365</text><text class="t-c" x="822" y="67">proof</text>
    <path class="grid" d="M40,74 L864,74"/>
  </g>

  <g id="r1"><text class="t-s" x="40" y="94">the drift note · what not to copy</text>
    <rect class="own" x="294" y="80" width="72" height="20" rx="3"/><text class="t-c" x="330" y="94">owns</text>
    <rect class="use" x="376" y="80" width="72" height="20" rx="3"/><text class="t-c" x="412" y="94">uses</text>
    <rect class="use" x="458" y="80" width="72" height="20" rx="3"/><text class="t-c" x="494" y="94">uses</text>
    <rect class="use" x="540" y="80" width="72" height="20" rx="3"/><text class="t-c" x="576" y="94">uses</text>
    <rect class="use" x="622" y="80" width="72" height="20" rx="3"/><text class="t-c" x="658" y="94">uses</text></g>
  <g id="r2"><text class="t-s" x="40" y="122">admission · omitted flow: → built-in</text>
    <rect class="own" x="376" y="108" width="72" height="20" rx="3"/><text class="t-c" x="412" y="122">owns</text>
    <rect class="build" x="458" y="108" width="72" height="20" rx="3"/><text class="t-c" x="494" y="122">builds</text>
    <rect class="teach" x="704" y="108" width="72" height="20" rx="3"/><text class="t-c" x="740" y="122">teaches</text></g>
  <g id="r3"><text class="t-s" x="40" y="150">loud fail · a typo'd kind never hires silently</text>
    <rect class="own" x="376" y="136" width="72" height="20" rx="3"/><text class="t-c" x="412" y="150">owns</text>
    <rect class="build" x="458" y="136" width="72" height="20" rx="3"/><text class="t-c" x="494" y="150">builds</text></g>
  <g id="r4"><text class="t-s" x="40" y="178">prompt · consume [default, instructions]</text>
    <rect class="use" x="458" y="164" width="72" height="20" rx="3"/><text class="t-c" x="494" y="178">consumes</text>
    <text class="t-xs" x="540" y="178">owner is W2 · FIX-1344 · not a child</text></g>
  <g id="r5"><text class="t-s" x="40" y="206">skills isolation · a real storage identity</text>
    <rect class="own" x="376" y="192" width="72" height="20" rx="3"/><text class="t-c" x="412" y="206">owns</text>
    <rect class="build" x="540" y="192" width="72" height="20" rx="3"/><text class="t-c" x="576" y="206">builds</text></g>
  <g id="r6"><text class="t-s" x="40" y="234">skills merge · same name twice in one seat</text>
    <rect class="own" x="540" y="220" width="72" height="20" rx="3"/><text class="t-c" x="576" y="234">owns</text></g>
  <g id="r7"><text class="t-s" x="40" y="262">memory · composition seam + named gaps</text>
    <rect class="use" x="458" y="248" width="72" height="20" rx="3"/><text class="t-c" x="494" y="262">not blocked</text>
    <rect class="own" x="622" y="248" width="72" height="20" rx="3"/><text class="t-c" x="658" y="262">owns</text>
    <rect class="teach" x="704" y="248" width="72" height="20" rx="3"/><text class="t-c" x="740" y="262">teaches</text></g>
  <g id="r8"><text class="t-s" x="40" y="290">proof · a real hire of the built-in · Goal 1</text>
    <rect class="own" x="786" y="276" width="72" height="20" rx="3"/><text class="t-c" x="822" y="290">owns</text></g>

  <g id="legend">
    <rect class="own" x="40" y="314" width="12" height="12" rx="2"/><text class="t-xs" x="58" y="324">owns the decision</text>
    <rect class="build" x="180" y="314" width="12" height="12" rx="2"/><text class="t-xs" x="198" y="324">builds it as decided</text>
    <rect class="use" x="330" y="314" width="12" height="12" rx="2"/><text class="t-xs" x="348" y="324">consumes, never re-decides</text>
    <rect class="teach" x="520" y="314" width="12" height="12" rx="2"/><text class="t-xs" x="538" y="324">teaches it, honestly</text>
    <text class="t-xs" x="700" y="324">blank = not that issue's business</text>
  </g>
</svg>
