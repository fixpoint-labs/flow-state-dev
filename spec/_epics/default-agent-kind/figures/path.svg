<svg viewBox="0 0 940 400" role="img" xmlns="http://www.w3.org/2000/svg"
     aria-label="Swimlanes against time, final. Two dashed lanes at the top are inputs from other epics: the skills file convention, done before the epic opened, and the default worker prompt, never shipped during the epic and consumed through a seam. Seven lanes below are the epic's issues in chain order, every bar solid and done: the drift audit, the contract and the kind landed on consecutive days; per-seat skills and the memory seam ran in parallel from the fourteenth; the teaching issue followed; the proof ran last, on the sixteenth, and passed on a real model. A wrap line closes the chart on September sixteenth. Arrows between lanes are the dependencies; the chain from audit to contract to kind to skills and memory to proof is the critical path.">
  <style>
    :root { --surface:#FCFCFA; --surface-2:#E8E8E1; --ink:#191C21; --ink-2:#4C535B; --ink-3:#7A828B; --rule:#D5D4CB;
            --accent:#3E4E8C; --accent-soft:#E0E3F0; --code:#2C7C69; --code-soft:#DCEDE7; --prose:#A8761C; --prose-soft:#F3E8D2; --gone:#A9544F; }
    @media (prefers-color-scheme: dark) {
      :root { --surface:#181C1F; --surface-2:#202528; --ink:#E6E8E5; --ink-2:#A4ACB1; --ink-3:#737B81; --rule:#2B3135;
              --accent:#8B9BD8; --accent-soft:#1B2140; --code:#5DBBA1; --code-soft:#14302A; --prose:#D9A44B; --prose-soft:#332612; --gone:#DE8A84; } }
    .t-s  { fill:var(--ink-2); font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:9.5px; }
    .t-xs { fill:var(--ink-3); font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:8.5px; letter-spacing:.04em; }
    .t-lbl{ fill:var(--ink-3); font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:9.5px; letter-spacing:.1em; }
    .f-code{ fill:var(--code); } .f-prose{ fill:var(--prose); }
    .lane  { stroke:var(--rule); stroke-width:1; }
    .done  { fill:var(--code-soft); stroke:var(--code); stroke-width:1.3; }
    .extno { fill:none; stroke:var(--prose); stroke-width:1; stroke-dasharray:4 3; }
    .wrap  { stroke:var(--code); stroke-width:1.8; stroke-dasharray:6 4; }
    .dep   { stroke:var(--ink-3); stroke-width:1.1; fill:none; }
    .crit  { stroke:var(--code); stroke-width:1.8; fill:none; }
  </style>
  <defs>
    <marker id="ah" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="var(--ink-3)"/></marker>
    <marker id="ahc" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="var(--code)"/></marker>
  </defs>

  <text class="t-lbl" x="40" y="28">THE PATH · one lane per issue · chain order · final · wrapped 2026-09-16</text>
  <g id="axis">
    <text class="t-xs" x="200" y="56">Sep 11 · gate</text>
    <text class="t-xs" x="310" y="56">Sep 12</text>
    <text class="t-xs" x="420" y="56">Sep 13</text>
    <text class="t-xs" x="530" y="56">Sep 14</text>
    <text class="t-xs" x="640" y="56">Sep 15</text>
    <text class="t-xs" x="750" y="56">Sep 16</text>
    <text class="t-xs f-code" x="836" y="56">wrap</text>
    <path class="wrap" d="M830,62 L830,370"/>
  </g>

  <g id="inputs">
    <text class="t-s" x="40" y="86">W3 · FIX-1356 skills conv.</text>
    <text class="t-xs f-code" x="200" y="86">done before the gate · consumed by FIX-1362</text>
    <text class="t-s" x="40" y="114">W2 · FIX-1344 def. prompt</text>
    <rect class="extno" x="200" y="100" width="700" height="20" rx="3"/><text class="t-xs f-prose" x="208" y="114">never shipped during the epic · the kind consumed it through a seam, and still does</text>
    <path class="lane" d="M40,130 L900,130"/>
  </g>

  <g id="lanes">
    <text class="t-s" x="40" y="154">FIX-1360 drift audit</text>
    <rect class="done" x="200" y="140" width="100" height="20" rx="3"/><text class="t-xs f-code" x="206" y="154">done · #1739</text>
    <text class="t-s" x="40" y="184">FIX-1361 contract</text>
    <rect class="done" x="300" y="170" width="110" height="20" rx="3"/><text class="t-xs f-code" x="306" y="184">done · #1751</text>
    <text class="t-s" x="40" y="214">FIX-1363 the kind</text>
    <rect class="done" x="410" y="200" width="120" height="20" rx="3"/><text class="t-xs f-code" x="416" y="214">done · #1754</text>
    <text class="t-s" x="40" y="244">FIX-1362 per-seat skills</text>
    <rect class="done" x="530" y="230" width="220" height="20" rx="3"/><text class="t-xs f-code" x="536" y="244">spec #1766 → impl #1776</text>
    <text class="t-s" x="40" y="274">FIX-1364 memory seam</text>
    <rect class="done" x="530" y="260" width="225" height="20" rx="3"/><text class="t-xs f-code" x="536" y="274">spec #1768 → impl #1782</text>
    <text class="t-s" x="40" y="304">FIX-1366 teach</text>
    <rect class="done" x="640" y="290" width="112" height="20" rx="3"/><text class="t-xs f-code" x="646" y="304">spec #1765 → #1785</text>
    <text class="t-s" x="40" y="334">FIX-1365 proof · required</text>
    <rect class="done" x="758" y="320" width="70" height="20" rx="3"/><text class="t-xs f-code" x="763" y="334">proof #1790</text>
    <text class="t-xs" x="40" y="360">seven lanes, seven done · the proof hired the built-in on a real model and passed · the epic PR closed unmerged at the wrap</text>
  </g>

  <g id="deps">
    <path class="crit" d="M300,160 L300,170" marker-end="url(#ahc)"/>
    <path class="crit" d="M410,190 L410,200" marker-end="url(#ahc)"/>
    <path class="crit" d="M530,220 L530,230" marker-end="url(#ahc)"/>
    <path class="crit" d="M530,220 L530,226 L522,226 L522,260 L528,260" marker-end="url(#ahc)"/>
    <path class="dep"  d="M530,220 L530,226 L514,226 L514,290 L638,290" marker-end="url(#ah)"/>
    <path class="crit" d="M750,250 L762,250 L762,318" marker-end="url(#ahc)"/>
    <path class="crit" d="M755,280 L770,280 L770,318" marker-end="url(#ahc)"/>
  </g>

  <g id="legend">
    <rect class="done" x="560" y="380" width="12" height="10" rx="2"/><text class="t-xs" x="578" y="389">done</text>
    <path class="crit" d="M640,385 L660,385"/><text class="t-xs" x="666" y="389">critical path</text>
    <path class="dep" d="M760,385 L780,385"/><text class="t-xs" x="786" y="389">hands off to</text>
  </g>
</svg>
