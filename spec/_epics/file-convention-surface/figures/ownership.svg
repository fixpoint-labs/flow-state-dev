<svg viewBox="0 0 940 336" role="img" xmlns="http://www.w3.org/2000/svg"
     aria-label="Who owns what: a matrix of seven cross-cutting rules against seven issues. Path level is scope is decided by FIX-1356 and consumed by FIX-1352 and FIX-1354. Kind to one instance is built by FIX-1311 and consumed by FIX-1352. CHANNEL.md names the kind is built by FIX-1352 and consumed by FIX-1311 and FIX-1357. Consumed stripped, derived refused is decided by FIX-1354 and consumed by FIX-1352 and FIX-1356. Seats stay WORKER.md is decided by FIX-1342 and consumed by FIX-1311 and FIX-1357. One scan, one kinds map is built by FIX-1357 and consumed by FIX-1311 and FIX-1352. Hire admits the config is built by FIX-1367 and consumed by FIX-1356. Every rule has exactly one owner.">
  <style>
    :root { --surface:#FCFCFA; --surface-2:#E8E8E1; --ink:#191C21; --ink-2:#4C535B; --ink-3:#7A828B;
            --rule:#D5D4CB; --accent:#3E4E8C; --accent-soft:#E0E3F0; --code:#2C7C69; --code-soft:#DCEDE7;
            --prose:#A8761C; --prose-soft:#F3E8D2; --gone:#A9544F; }
    @media (prefers-color-scheme: dark) {
      :root { --surface:#181C1F; --surface-2:#202528; --ink:#E6E8E5; --ink-2:#A4ACB1; --ink-3:#737B81;
              --rule:#2B3135; --accent:#8B9BD8; --accent-soft:#1B2140; --code:#5DBBA1; --code-soft:#14302A;
              --prose:#D9A44B; --prose-soft:#332612; --gone:#DE8A84; } }
    .cell  { fill:var(--surface); stroke:var(--rule); stroke-width:1; }
    .own   { fill:var(--code-soft); stroke:var(--code); stroke-width:1.4; }
    .use   { fill:var(--surface-2); stroke:var(--rule); stroke-width:1; }
    .t-lbl { fill:var(--ink-3); font-family:ui-monospace,SFMono-Regular,Menlo,monospace;
             font-size:9.5px; letter-spacing:.1em; }
    .t-col { fill:var(--ink-2); font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:10px; }
    .t-row { fill:var(--ink); font-family:system-ui,-apple-system,sans-serif; font-size:11.5px; }
    .t-own { fill:var(--code); font-family:ui-monospace,SFMono-Regular,Menlo,monospace;
             font-weight:700; font-size:9.5px; letter-spacing:.06em; }
    .t-use { fill:var(--ink-3); font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:9.5px; }
  </style>

  <text class="t-lbl" x="16" y="20">WHO OWNS WHAT — EVERY RULE HAS EXACTLY ONE OWNER</text>

  <g id="columns">
    <text class="t-col" x="298" y="50">FIX-1342</text>
    <text class="t-col" x="390" y="50">FIX-1311</text>
    <text class="t-col" x="482" y="50">FIX-1352</text>
    <text class="t-col" x="574" y="50">FIX-1354</text>
    <text class="t-col" x="666" y="50">FIX-1356</text>
    <text class="t-col" x="758" y="50">FIX-1357</text>
    <text class="t-col" x="850" y="50">FIX-1367</text>
  </g>

  <g id="r1">
    <text class="t-row" x="16" y="78">ER-1 · path level is scope</text>
    <rect class="cell" x="276" y="60" width="92" height="30"/>
    <rect class="cell" x="368" y="60" width="92" height="30"/>
    <rect class="use"  x="460" y="60" width="92" height="30"/><text class="t-use" x="481" y="79">consumes</text>
    <rect class="use"  x="552" y="60" width="92" height="30"/><text class="t-use" x="573" y="79">consumes</text>
    <rect class="own"  x="644" y="60" width="92" height="30"/><text class="t-own" x="668" y="79">DECIDES</text>
    <rect class="cell" x="736" y="60" width="92" height="30"/>
    <rect class="cell" x="828" y="60" width="92" height="30"/>
  </g>

  <g id="r2">
    <text class="t-row" x="16" y="112">ER-2 · kind → one instance</text>
    <rect class="cell" x="276" y="94" width="92" height="30"/>
    <rect class="own"  x="368" y="94" width="92" height="30"/><text class="t-own" x="396" y="113">BUILDS</text>
    <rect class="use"  x="460" y="94" width="92" height="30"/><text class="t-use" x="481" y="113">consumes</text>
    <rect class="cell" x="552" y="94" width="92" height="30"/>
    <rect class="cell" x="644" y="94" width="92" height="30"/>
    <rect class="cell" x="736" y="94" width="92" height="30"/>
    <rect class="cell" x="828" y="94" width="92" height="30"/>
  </g>

  <g id="r3">
    <text class="t-row" x="16" y="146">ER-3 · CHANNEL.md names the kind</text>
    <rect class="cell" x="276" y="128" width="92" height="30"/>
    <rect class="use"  x="368" y="128" width="92" height="30"/><text class="t-use" x="389" y="147">consumes</text>
    <rect class="own"  x="460" y="128" width="92" height="30"/><text class="t-own" x="488" y="147">BUILDS</text>
    <rect class="cell" x="552" y="128" width="92" height="30"/>
    <rect class="cell" x="644" y="128" width="92" height="30"/>
    <rect class="use"  x="736" y="128" width="92" height="30"/><text class="t-use" x="757" y="147">consumes</text>
    <rect class="cell" x="828" y="128" width="92" height="30"/>
  </g>

  <g id="r4">
    <text class="t-row" x="16" y="180">ER-4 · consumed stripped, derived refused</text>
    <rect class="cell" x="276" y="162" width="92" height="30"/>
    <rect class="cell" x="368" y="162" width="92" height="30"/>
    <rect class="use"  x="460" y="162" width="92" height="30"/><text class="t-use" x="481" y="181">consumes</text>
    <rect class="own"  x="552" y="162" width="92" height="30"/><text class="t-own" x="576" y="181">DECIDES</text>
    <rect class="use"  x="644" y="162" width="92" height="30"/><text class="t-use" x="665" y="181">consumes</text>
    <rect class="cell" x="736" y="162" width="92" height="30"/>
    <rect class="cell" x="828" y="162" width="92" height="30"/>
  </g>

  <g id="r5">
    <text class="t-row" x="16" y="214">ER-5 · seats stay WORKER.md</text>
    <rect class="own"  x="276" y="196" width="92" height="30"/><text class="t-own" x="300" y="215">DECIDES</text>
    <rect class="use"  x="368" y="196" width="92" height="30"/><text class="t-use" x="389" y="215">consumes</text>
    <rect class="cell" x="460" y="196" width="92" height="30"/>
    <rect class="cell" x="552" y="196" width="92" height="30"/>
    <rect class="cell" x="644" y="196" width="92" height="30"/>
    <rect class="use"  x="736" y="196" width="92" height="30"/><text class="t-use" x="757" y="215">consumes</text>
    <rect class="cell" x="828" y="196" width="92" height="30"/>
  </g>

  <g id="r6">
    <text class="t-row" x="16" y="248">ER-6 · one scan, one kinds map</text>
    <rect class="cell" x="276" y="230" width="92" height="30"/>
    <rect class="use"  x="368" y="230" width="92" height="30"/><text class="t-use" x="389" y="249">consumes</text>
    <rect class="use"  x="460" y="230" width="92" height="30"/><text class="t-use" x="481" y="249">consumes</text>
    <rect class="cell" x="552" y="230" width="92" height="30"/>
    <rect class="cell" x="644" y="230" width="92" height="30"/>
    <rect class="own"  x="736" y="230" width="92" height="30"/><text class="t-own" x="764" y="249">BUILDS</text>
    <rect class="cell" x="828" y="230" width="92" height="30"/>
  </g>

  <g id="r7">
    <text class="t-row" x="16" y="282">ER-7 · hire admits the config</text>
    <rect class="cell" x="276" y="264" width="92" height="30"/>
    <rect class="cell" x="368" y="264" width="92" height="30"/>
    <rect class="cell" x="460" y="264" width="92" height="30"/>
    <rect class="cell" x="552" y="264" width="92" height="30"/>
    <rect class="use"  x="644" y="264" width="92" height="30"/><text class="t-use" x="665" y="283">consumes</text>
    <rect class="cell" x="736" y="264" width="92" height="30"/>
    <rect class="own"  x="828" y="264" width="92" height="30"/><text class="t-own" x="856" y="283">BUILDS</text>
  </g>

  <g id="legend">
    <rect class="own" x="16" y="308" width="16" height="14"/>
    <text class="t-use" x="40" y="320">the one owner — decides or builds it</text>
    <rect class="use" x="276" y="308" width="16" height="14"/>
    <text class="t-use" x="300" y="320">consumes it, and must not re-decide it</text>
    <text class="t-use" x="600" y="320">FIX-1355, the lab, consumes every row and owns none</text>
  </g>
</svg>
