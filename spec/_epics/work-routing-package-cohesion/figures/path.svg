<svg viewBox="0 0 940 344" role="img" xmlns="http://www.w3.org/2000/svg"
     aria-label="The path: a ship-fence band under the axis naming FIX-1435 and FIX-1449 as the two W3 children still non-terminal on a relayed read, with no W4 ship PR merging until every implementation-carrying W3 child is on main. Below it, nine lanes against time with a now line at September 19. Two input lanes from W3, TEAM.md and the tools fence, carry bars that reach the now line and read landed on main on September 19. Then the five lanes of the set. FIX-1408 carries a done bar behind the now line, done by decision. The three first-cut lanes — runtime inventory, channel boards and package cohesion — each carry a spec bar that starts at the now line, all three in flight in parallel from September 19. The manager-queue lab lane is empty and reads the proof, adopted, and it starts after the board surface exists, with the axis marked ahead, no dates set. Under a divider, two related lanes, catalog manifests and channel-admin, read related, not in the set: they consume FIX-1405 and hold no wrap, and catalog manifests waits for FIX-1405's approved spec. The critical path is drawn in the gutter through the inventory, the boards and the lab.">
  <style>
    :root { --surface:#FCFCFA; --surface-2:#E8E8E1; --ink:#191C21; --ink-2:#4C535B; --ink-3:#7A828B;
            --rule:#D5D4CB; --accent:#3E4E8C; --accent-soft:#E0E3F0; --code:#2C7C69; --code-soft:#DCEDE7;
            --prose:#A8761C; --prose-soft:#F3E8D2; --gone:#A9544F; }
    @media (prefers-color-scheme: dark) {
      :root { --surface:#181C1F; --surface-2:#202528; --ink:#E6E8E5; --ink-2:#A4ACB1; --ink-3:#737B81;
              --rule:#2B3135; --accent:#8B9BD8; --accent-soft:#1B2140; --code:#5DBBA1; --code-soft:#14302A;
              --prose:#D9A44B; --prose-soft:#332612; --gone:#DE8A84; } }
    .done  { fill:var(--code); stroke:none; }
    .live  { fill:var(--accent-soft); stroke:var(--accent); stroke-width:1.4; }
    .inp   { fill:var(--prose-soft); stroke:var(--prose); stroke-width:1.4; }
    .lane  { stroke:var(--rule); stroke-width:1; stroke-dasharray:2 4; }
    .axis  { stroke:var(--rule); stroke-width:1; }
    .div   { stroke:var(--rule); stroke-width:1; }
    .now   { stroke:var(--gone); stroke-width:1.4; }
    .fence { fill:none; stroke:var(--gone); stroke-width:1.2; stroke-dasharray:6 4; }
    .crit  { fill:none; stroke:var(--ink-3); stroke-width:1.2; }
    .critd { fill:var(--ink-3); stroke:none; }
    .t-lbl { fill:var(--ink-3); font-family:ui-monospace,SFMono-Regular,Menlo,monospace;
             font-size:9.5px; letter-spacing:.1em; }
    .t-ln  { fill:var(--ink); font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:10px; }
    .t-s   { fill:var(--ink-2); font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:9px; }
    .t-now { fill:var(--gone); font-family:ui-monospace,SFMono-Regular,Menlo,monospace;
             font-size:9.5px; letter-spacing:.06em; }
    .t-fen { fill:var(--gone); font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:9px; }
  </style>

  <text class="t-lbl" x="16" y="18">THE PATH — ONE LANE PER ISSUE, AGAINST TIME</text>

  <g id="axis">
    <path class="axis" d="M200 42 L924 42"/>
    <text class="t-s" x="200" y="34">Sep 16</text>
    <text class="t-now" x="300" y="34">now · Sep 19</text>
    <text class="t-s" x="632" y="34">ahead · no dates set</text>
  </g>

  <g id="ship-fence">
    <text class="t-fen" x="16" y="62">SHIP FENCE</text>
    <rect class="fence" x="200" y="50" width="724" height="16" rx="2"/>
    <text class="t-fen" x="212" y="62">W3: FIX-1435 + FIX-1449 non-terminal (relayed read) — no W4 ship PR merges until every impl-carrying W3 child is on main</text>
  </g>

  <path class="now" d="M330 74 L330 246"/>

  <g id="critical-path">
    <path class="crit" d="M190 163 L190 229"/>
    <circle class="critd" cx="190" cy="163" r="3.2"/>
    <circle class="critd" cx="190" cy="185" r="3.2"/>
    <circle class="critd" cx="190" cy="229" r="3.2"/>
  </g>

  <g id="lanes-inputs">
    <text class="t-ln" x="16" y="92">FIX-1377 TEAM.md · W3</text>
    <rect class="inp" x="200" y="83" width="130" height="12" rx="2"/>
    <text class="t-s" x="616" y="92">landed on main · Sep 19 · #1911</text>
    <text class="t-ln" x="16" y="114">FIX-1416 tools fence · W3</text>
    <rect class="inp" x="200" y="105" width="130" height="12" rx="2"/>
    <text class="t-s" x="616" y="114">landed on main · Sep 19 · #1909</text>
  </g>

  <g id="lanes-set">
    <text class="t-ln" x="16" y="146">FIX-1408 dispatch policy</text>
    <rect class="done" x="270" y="137" width="48" height="12" rx="2"/>
    <text class="t-s" x="616" y="146">done by decision — no impl PR</text>
    <text class="t-ln" x="16" y="168">FIX-1405 inventory</text>
    <rect class="live" x="330" y="159" width="140" height="12" rx="2"/>
    <path class="lane" d="M476 165 L600 165"/>
    <text class="t-s" x="616" y="168">spec in flight since Sep 19 · POC next</text>
    <text class="t-ln" x="16" y="190">FIX-1385 channel boards</text>
    <rect class="live" x="330" y="181" width="140" height="12" rx="2"/>
    <path class="lane" d="M476 187 L600 187"/>
    <text class="t-s" x="616" y="190">spec in flight — the exit gate's surface</text>
    <text class="t-ln" x="16" y="212">FIX-1394 package cohesion</text>
    <rect class="live" x="330" y="203" width="140" height="12" rx="2"/>
    <path class="lane" d="M476 209 L600 209"/>
    <text class="t-s" x="616" y="212">POC matrix → ratify · the proof takes the contract</text>
    <text class="t-ln" x="16" y="234">FIX-1430 manager-queue lab</text>
    <path class="lane" d="M490 231 L600 231"/>
    <text class="t-s" x="616" y="234">the proof, adopted — owns ER-20. Follows the boards</text>
  </g>

  <g id="related">
    <path class="div" d="M16 252 L924 252"/>
    <text class="t-lbl" x="16" y="268">RELATED — NOT IN THE SET</text>
    <text class="t-ln" x="16" y="286">FIX-817 catalog manifests</text>
    <path class="lane" d="M400 283 L600 283"/>
    <text class="t-s" x="616" y="286">consumes FIX-1405 · after its approved spec (ER-23)</text>
    <text class="t-ln" x="16" y="308">FIX-1415 channel-admin</text>
    <path class="lane" d="M400 305 L600 305"/>
    <text class="t-s" x="616" y="308">consumes FIX-1405 · holds no wrap here</text>
  </g>

  <g id="legend">
    <rect class="done" x="120" y="332" width="16" height="10" rx="2"/>
    <text class="t-s" x="144" y="340">done</text>
    <rect class="live" x="182" y="331" width="16" height="12" rx="2"/>
    <text class="t-s" x="206" y="340">spec in flight</text>
    <rect class="inp" x="300" y="331" width="16" height="12" rx="2"/>
    <text class="t-s" x="324" y="340">an input from W3 — landed on main</text>
    <path class="lane" d="M580 337 L616 337"/>
    <text class="t-s" x="624" y="340">not started</text>
    <circle class="critd" cx="712" cy="337" r="3.2"/>
    <path class="crit" d="M712 331 L712 343"/>
    <text class="t-s" x="728" y="340">on the critical path to the proof</text>
  </g>
</svg>
