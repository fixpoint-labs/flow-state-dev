<svg viewBox="0 0 940 420" role="img" aria-label="PD-1, where a pattern keeps its work, its status and its lifecycle. Chosen: one task board, a Task row in a TaskCollection, durable through scope. Instead of: per-pattern task stores, and a separate task-persistence layer. It comes down to the first row, hardening the work substrate: with one board every epic hardens the same store, while per-pattern stores are each hardened on their own and a separate layer is a second store to harden. The second row is the price: a pattern that would be simpler bespoke pays the board&#x27;s shape, a dispatcher, a worker and a loop, where a per-pattern store keeps its own shape and a separate layer imposes its own shape instead. The third row is persistence: the board persists through the ordinary scope mechanism, per-pattern stores each persist their own way, and a separate layer is a second mechanism beside scope. Locks in: every board-based pattern is a configuration of the board, with one status vocabulary and one lifecycle. Flips if: a pattern&#x27;s work cannot be expressed as a dispatcher, a worker and a loop over one collection."
     xmlns="http://www.w3.org/2000/svg">
  <style>
    :root { --surface:#FCFCFA; --surface-2:#E8E8E1; --ink:#191C21; --ink-2:#4C535B; --ink-3:#7A828B;
            --rule:#D5D4CB; --accent:#3E4E8C; --accent-soft:#E0E3F0; --code:#2C7C69; --code-soft:#DCEDE7;
            --gone:#A9544F; }
    @media (prefers-color-scheme: dark) {
      :root { --surface:#181C1F; --surface-2:#202528; --ink:#E6E8E5; --ink-2:#A4ACB1; --ink-3:#737B81;
              --rule:#2B3135; --accent:#8B9BD8; --accent-soft:#1B2140; --code:#5DBBA1; --code-soft:#14302A;
              --gone:#DE8A84; } }
    .bg     { fill:var(--surface); }
    .ask    { fill:var(--surface-2); }
    .chosen { fill:var(--code-soft); stroke:var(--code); stroke-width:1.6; }
    .lost   { fill:var(--surface); stroke:var(--rule); stroke-width:1.4; stroke-dasharray:5 4; }
    .decide { fill:var(--accent-soft); }
    .bar    { fill:var(--accent); }
    .row    { stroke:var(--rule); stroke-width:1; }
    .foot   { fill:var(--surface-2); }
    .t-lbl  { fill:var(--ink-3); font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:9.5px; letter-spacing:.1em; }
    .t-tag  { font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:9.5px; letter-spacing:.1em; font-weight:600; }
    .t-q    { fill:var(--ink); font-family:system-ui,-apple-system,sans-serif; font-weight:600; font-size:15px; }
    .t-h    { font-family:system-ui,-apple-system,sans-serif; font-weight:600; font-size:14px; }
    .t-b    { fill:var(--ink); font-family:system-ui,-apple-system,sans-serif; font-size:12.5px; }
    .t-s    { fill:var(--ink-2); font-family:system-ui,-apple-system,sans-serif; font-size:11px; }
    .mark   { font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:16px; font-weight:700; }
    .plus   { fill:var(--code); }
    .minus  { fill:var(--gone); }
    .tie    { fill:var(--ink-3); }
    .c-code { fill:var(--code); }
    .c-mute { fill:var(--ink-3); }
    .c-lost { fill:var(--ink-2); }
    .c-acc  { fill:var(--accent); }
  </style>
  <rect class="bg" x="0" y="0" width="940" height="420"/>

  <g id="the-call">
    <rect class="ask" x="16" y="14" width="908" height="48" rx="6"/>
    <text class="t-lbl" x="32" y="32">PD-1 · THE CALL</text>
    <text class="t-q" x="32" y="52">Where does a pattern keep its work, its status and its lifecycle?</text>
  </g>

  <g id="options">
    <rect class="chosen" x="212" y="76" width="224" height="46" rx="5"/>
    <text class="t-tag c-code" x="228" y="93">CHOSEN</text>
    <text class="t-h c-code" x="228" y="112">One task board</text>
    <rect class="lost" x="452" y="76" width="224" height="46" rx="5"/>
    <text class="t-tag c-mute" x="468" y="93">INSTEAD OF</text>
    <text class="t-h c-lost" x="468" y="112">Per-pattern task stores</text>
    <rect class="lost" x="692" y="76" width="224" height="46" rx="5"/>
    <text class="t-tag c-mute" x="708" y="93">INSTEAD OF</text>
    <text class="t-h c-lost" x="708" y="112">A separate persistence layer</text>
  </g>

  <g id="row-decides">
    <rect class="decide" x="16" y="134" width="908" height="62" rx="4"/>
    <rect class="bar" x="16" y="134" width="4" height="62"/>
    <text class="t-lbl" x="32" y="156">HARDENING THE</text>
    <text class="t-lbl" x="32" y="169">WORK SUBSTRATE</text>
    <text class="t-tag c-acc" x="32" y="186">▸ DECIDES IT</text>
    <text class="mark plus" x="228" y="162">+</text>
    <text class="t-b" x="248" y="161">One store, hardened once</text>
    <text class="t-s" x="248" y="179">every epic fixes the same one</text>
    <text class="mark minus" x="468" y="162">−</text>
    <text class="t-b" x="488" y="161">A store per pattern</text>
    <text class="t-s" x="488" y="179">each hardened on its own</text>
    <text class="mark minus" x="708" y="162">−</text>
    <text class="t-b" x="728" y="161">A second store to harden</text>
    <text class="t-s" x="728" y="179">beside the board and scope</text>
  </g>

  <g id="row-bespoke">
    <text class="t-lbl" x="32" y="216">A PATTERN SIMPLER</text>
    <text class="t-lbl" x="32" y="229">DONE BESPOKE</text>
    <text class="mark minus" x="228" y="224">−</text>
    <text class="t-b" x="248" y="223">Pays the board&#x27;s shape</text>
    <text class="t-s" x="248" y="241">dispatcher, worker, loop</text>
    <text class="mark plus" x="468" y="224">+</text>
    <text class="t-b" x="488" y="223">Keeps its own shape</text>
    <text class="t-s" x="488" y="241">its own status, lifecycle</text>
    <text class="mark minus" x="708" y="224">−</text>
    <text class="t-b" x="728" y="223">Pays the layer&#x27;s shape</text>
    <text class="t-s" x="728" y="241">imposed all the same</text>
    <line class="row" x1="16" y1="256" x2="924" y2="256"/>
  </g>

  <g id="row-persist">
    <text class="t-lbl" x="32" y="274">HOW TASK STATE</text>
    <text class="t-lbl" x="32" y="287">PERSISTS</text>
    <text class="mark plus" x="228" y="282">+</text>
    <text class="t-b" x="248" y="281">Through scope</text>
    <text class="t-s" x="248" y="299">the ordinary mechanism</text>
    <text class="mark minus" x="468" y="282">−</text>
    <text class="t-b" x="488" y="281">Each its own way</text>
    <text class="t-s" x="488" y="299">one store per pattern</text>
    <text class="mark minus" x="708" y="282">−</text>
    <text class="t-b" x="728" y="281">A second mechanism</text>
    <text class="t-s" x="728" y="299">beside scope</text>
    <line class="row" x1="16" y1="314" x2="924" y2="314"/>
  </g>

  <g id="locks-in">
    <rect class="foot" x="16" y="330" width="446" height="74" rx="5"/>
    <text class="t-lbl" x="32" y="351">LOCKS IN</text>
    <text class="t-b" x="32" y="371">Every board-based pattern is a board configuration</text>
    <text class="t-s" x="32" y="389">one status vocabulary, one lifecycle, one collection</text>
  </g>

  <g id="flips-if">
    <rect class="foot" x="478" y="330" width="446" height="74" rx="5"/>
    <text class="t-lbl" x="494" y="351">FLIPS IF</text>
    <text class="t-b" x="494" y="371">A pattern&#x27;s work can&#x27;t be a dispatcher, worker and loop</text>
    <text class="t-s" x="494" y="389">over one collection; then a bespoke store earns its place</text>
  </g>
</svg>
