<svg viewBox="0 0 940 420" role="img" aria-label="PD-3, how a post between workers travels and what makes sure it is answered once. Chosen: split by tracking, a task when the post is tracked work and a message on sendMessage when not, whether a call that waits for a reply or a tell. Instead of: a ledger-backed message, which FIX-1872 removed on Oct 13, and a task for every post. It comes down to the first row, a post that is tracked work, with attempts, a retry and an ending owed to its filer: the split and a task for every post both claim it once and tell the caller it ended done or failed, with the claim ticket as the only check, while a ledger-backed message is answered once by the coordinator ledger, a second check beside the claim ticket. The second row is a call or a tell, owed no tracked ending: the split sends a message on sendMessage, a call waiting on the wait gate, with no row or check, a ledger-backed message sends the same message, and a task for every post makes a row nobody answers. The third row is the price: what FIX-1816 D3 protected, each delegate's own line and the rounds, must ride on tasks under the split and under a task for every post, and is kept as built under the ledger. Locks in: two kinds of post, a task or a message; FIX-1816 D3 is amended and FIX-1872 removed the ledger. Flips if: a post's per-delegate lines or rounds cannot run as tasks."
     xmlns="http://www.w3.org/2000/svg">
  <style>
    :root { --surface:#FCFCFA; --surface-2:#E8E8E1; --ink:#191C21; --ink-2:#4C535B; --ink-3:#7A828B;
            --rule:#D5D4CB; --accent:#3E4E8C; --accent-soft:#E0E3F0; --code:#2C7C69; --code-soft:#DCEDE7;
            --gone:#A9544F; }
    @media (prefers-color-scheme: dark) {
      :root { --surface:#181C1F; --surface-2:#202528; --ink:#E6E8E5; --ink-2:#A4ACB1; --ink-3:#737B81;
              --rule:#2B3135; --accent:#8B9BD8; --accent-soft:#1B2140; --code:#5DBBA1; --code-soft:#14302A;
              --gone:#DE8A84; } }
    .bg     { fill:var(--surface); }
    .ask    { fill:var(--surface-2); }
    .chosen { fill:var(--code-soft); stroke:var(--code); stroke-width:1.6; }
    .lost   { fill:var(--surface); stroke:var(--rule); stroke-width:1.4; stroke-dasharray:5 4; }
    .decide { fill:var(--accent-soft); }
    .bar    { fill:var(--accent); }
    .row    { stroke:var(--rule); stroke-width:1; }
    .foot   { fill:var(--surface-2); }
    .t-lbl  { fill:var(--ink-3); font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:9.5px; letter-spacing:.1em; }
    .t-tag  { font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:9.5px; letter-spacing:.1em; font-weight:600; }
    .t-q    { fill:var(--ink); font-family:system-ui,-apple-system,sans-serif; font-weight:600; font-size:15px; }
    .t-h    { font-family:system-ui,-apple-system,sans-serif; font-weight:600; font-size:14px; }
    .t-b    { fill:var(--ink); font-family:system-ui,-apple-system,sans-serif; font-size:12.5px; }
    .t-s    { fill:var(--ink-2); font-family:system-ui,-apple-system,sans-serif; font-size:11px; }
    .mark   { font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:16px; font-weight:700; }
    .plus   { fill:var(--code); }
    .minus  { fill:var(--gone); }
    .tie    { fill:var(--ink-3); }
    .c-code { fill:var(--code); }
    .c-mute { fill:var(--ink-3); }
    .c-lost { fill:var(--ink-2); }
    .c-acc  { fill:var(--accent); }
  </style>
  <rect class="bg" x="0" y="0" width="940" height="420"/>

  <g id="the-call">
    <rect class="ask" x="16" y="14" width="908" height="48" rx="6"/>
    <text class="t-lbl" x="32" y="32">PD-3 · THE CALL</text>
    <text class="t-q" x="32" y="52">How does a post between workers travel, and what makes sure it is answered once?</text>
  </g>

  <g id="options">
    <rect class="chosen" x="212" y="76" width="224" height="46" rx="5"/>
    <text class="t-tag c-code" x="228" y="93">CHOSEN</text>
    <text class="t-h c-code" x="228" y="112">Split: task or message</text>
    <rect class="lost" x="452" y="76" width="224" height="46" rx="5"/>
    <text class="t-tag c-mute" x="468" y="93">INSTEAD OF · REMOVED OCT 13</text>
    <text class="t-h c-lost" x="468" y="112">Ledger-backed message</text>
    <rect class="lost" x="692" y="76" width="224" height="46" rx="5"/>
    <text class="t-tag c-mute" x="708" y="93">INSTEAD OF</text>
    <text class="t-h c-lost" x="708" y="112">A task for every post</text>
  </g>

  <g id="row-decides">
    <rect class="decide" x="16" y="134" width="908" height="62" rx="4"/>
    <rect class="bar" x="16" y="134" width="4" height="62"/>
    <text class="t-lbl" x="32" y="156">A POST THAT</text>
    <text class="t-lbl" x="32" y="169">IS TRACKED WORK</text>
    <text class="t-tag c-acc" x="32" y="186">▸ DECIDES IT</text>
    <text class="mark plus" x="228" y="162">+</text>
    <text class="t-b" x="248" y="161">Claimed once, ending told</text>
    <text class="t-s" x="248" y="179">only check: the claim ticket</text>
    <text class="mark minus" x="468" y="162">−</text>
    <text class="t-b" x="488" y="161">Once, by the ledger</text>
    <text class="t-s" x="488" y="179">a second once-only check</text>
    <text class="mark plus" x="708" y="162">+</text>
    <text class="t-b" x="728" y="161">Claimed once, ending told</text>
    <text class="t-s" x="728" y="179">only check: the claim ticket</text>
  </g>

  <g id="row-tell">
    <text class="t-lbl" x="32" y="216">A CALL OR TELL,</text>
    <text class="t-lbl" x="32" y="229">OWED NO ENDING</text>
    <text class="mark plus" x="228" y="224">+</text>
    <text class="t-b" x="248" y="223">A message: sendMessage</text>
    <text class="t-s" x="248" y="241">a call waits; no row or check</text>
    <text class="mark tie" x="468" y="224">=</text>
    <text class="t-b" x="488" y="223">A message</text>
    <text class="t-s" x="488" y="241">the same as the split</text>
    <text class="mark minus" x="708" y="224">−</text>
    <text class="t-b" x="728" y="223">A row nobody answers</text>
    <text class="t-s" x="728" y="241">deadline and check for nothing</text>
    <line class="row" x1="16" y1="256" x2="924" y2="256"/>
  </g>

  <g id="row-price">
    <text class="t-lbl" x="32" y="274">WHAT FIX-1816</text>
    <text class="t-lbl" x="32" y="287">D3 PROTECTED</text>
    <text class="mark minus" x="228" y="282">−</text>
    <text class="t-b" x="248" y="281">Must ride on tasks</text>
    <text class="t-s" x="248" y="299">per-delegate lines, rounds</text>
    <text class="mark plus" x="468" y="282">+</text>
    <text class="t-b" x="488" y="281">Kept as built</text>
    <text class="t-s" x="488" y="299">per-delegate lines, rounds</text>
    <text class="mark minus" x="708" y="282">−</text>
    <text class="t-b" x="728" y="281">Must ride on tasks</text>
    <text class="t-s" x="728" y="299">the same</text>
    <line class="row" x1="16" y1="314" x2="924" y2="314"/>
  </g>

  <g id="locks-in">
    <rect class="foot" x="16" y="330" width="446" height="74" rx="5"/>
    <text class="t-lbl" x="32" y="351">LOCKS IN</text>
    <text class="t-b" x="32" y="371">Tracked work is a task; the rest is a message</text>
    <text class="t-s" x="32" y="389">FIX-1816 D3 amended; FIX-1872 removed the ledger</text>
  </g>

  <g id="flips-if">
    <rect class="foot" x="478" y="330" width="446" height="74" rx="5"/>
    <text class="t-lbl" x="494" y="351">FLIPS IF</text>
    <text class="t-b" x="494" y="371">A post's per-delegate lines or rounds can't run as tasks</text>
    <text class="t-s" x="494" y="389">FIX-2056's closure shows it; then D3's two checks return</text>
  </g>
</svg>
