<svg viewBox="0 0 940 420" role="img" aria-label="Open fork, not yet decided: launch as 1.0, or as 0.x? Recommended: 0.x. The other option: 1.0. It comes down to the first row, what the hard gates epic FIX-1635 has to cover before the doors open: with 0.x it stays a list of known defects, as PD-2 scopes it; with 1.0 every public API shape becomes a gate, so it grows into a full API review. The price of 0.x is the second row: the API may change between minor versions, so careful teams pin and some wait for 1.0, where 1.0 promises no break without a major version. Third row: release tooling already assumes 0.x, where 1.0 changes the release rules at the cut. Locks in: breaking changes ride minor versions until 1.0, which becomes its own milestone after the first cohort. Flips if: a design partner or launch channel needs a stability promise on day one."
     xmlns="http://www.w3.org/2000/svg">
  <style>
    :root { --surface:#FCFCFA; --surface-2:#E8E8E1; --ink:#191C21; --ink-2:#4C535B; --ink-3:#7A828B;
            --rule:#D5D4CB; --accent:#3E4E8C; --accent-soft:#E0E3F0; --code:#2C7C69; --code-soft:#DCEDE7;
            --gone:#A9544F; }
    @media (prefers-color-scheme: dark) {
      :root { --surface:#181C1F; --surface-2:#202528; --ink:#E6E8E5; --ink-2:#A4ACB1; --ink-3:#737B81;
              --rule:#2B3135; --accent:#8B9BD8; --accent-soft:#1B2140; --code:#5DBBA1; --code-soft:#14302A;
              --gone:#DE8A84; } }
    .bg     { fill:var(--surface); }
    .ask    { fill:var(--surface-2); }
    .rec    { fill:var(--code-soft); stroke:var(--code); stroke-width:1.6; stroke-dasharray:5 4; }
    .lost   { fill:var(--surface); stroke:var(--rule); stroke-width:1.4; stroke-dasharray:5 4; }
    .decide { fill:var(--accent-soft); }
    .bar    { fill:var(--accent); }
    .row    { stroke:var(--rule); stroke-width:1; }
    .foot   { fill:var(--surface-2); }
    .t-lbl  { fill:var(--ink-3); font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:9.5px; letter-spacing:.1em; }
    .t-tag  { font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:9.5px; letter-spacing:.1em; font-weight:600; }
    .t-q    { fill:var(--ink); font-family:system-ui,-apple-system,sans-serif; font-weight:600; font-size:15px; }
    .t-h    { font-family:system-ui,-apple-system,sans-serif; font-weight:600; font-size:14px; }
    .t-b    { fill:var(--ink); font-family:system-ui,-apple-system,sans-serif; font-size:12.5px; }
    .t-s    { fill:var(--ink-2); font-family:system-ui,-apple-system,sans-serif; font-size:11px; }
    .mark   { font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:16px; font-weight:700; }
    .plus   { fill:var(--code); }
    .minus  { fill:var(--gone); }
    .c-code { fill:var(--code); }
    .c-mute { fill:var(--ink-3); }
    .c-lost { fill:var(--ink-2); }
    .c-acc  { fill:var(--accent); }
  </style>
  <rect class="bg" x="0" y="0" width="940" height="420"/>

  <g id="the-call">
    <rect class="ask" x="16" y="14" width="908" height="48" rx="6"/>
    <text class="t-lbl" x="32" y="32">OPEN · THE CALL</text>
    <text class="t-q" x="32" y="52">Launch as 1.0, or as 0.x?</text>
  </g>

  <g id="options">
    <rect class="rec" x="212" y="76" width="348" height="46" rx="5"/>
    <text class="t-tag c-code" x="228" y="93">RECOMMENDED</text>
    <text class="t-h c-code" x="228" y="112">Launch as 0.x</text>
    <rect class="lost" x="576" y="76" width="348" height="46" rx="5"/>
    <text class="t-tag c-mute" x="592" y="93">THE OTHER OPTION</text>
    <text class="t-h c-lost" x="592" y="112">Launch as 1.0</text>
  </g>

  <g id="row-decides">
    <rect class="decide" x="16" y="134" width="908" height="62" rx="4"/>
    <rect class="bar" x="16" y="134" width="4" height="62"/>
    <text class="t-lbl" x="32" y="156">WHAT HARD GATES</text>
    <text class="t-lbl" x="32" y="169">MUST COVER</text>
    <text class="t-tag c-acc" x="32" y="186">▸ DECIDES IT</text>
    <text class="mark plus" x="228" y="162">+</text>
    <text class="t-b" x="248" y="161">Known defects only</text>
    <text class="t-s" x="248" y="179">FIX-1635 stays the list PD-2 scopes</text>
    <text class="mark minus" x="592" y="162">−</text>
    <text class="t-b" x="612" y="161">A full API review as well</text>
    <text class="t-s" x="612" y="179">every public shape becomes a launch gate</text>
  </g>

  <g id="row-price">
    <text class="t-lbl" x="32" y="222">PROMISE TO</text>
    <text class="t-lbl" x="32" y="235">ADOPTERS</text>
    <text class="mark minus" x="228" y="224">−</text>
    <text class="t-b" x="248" y="223">The API can change on a minor</text>
    <text class="t-s" x="248" y="241">careful teams pin; some wait for 1.0</text>
    <text class="mark plus" x="592" y="224">+</text>
    <text class="t-b" x="612" y="223">No break without a major</text>
    <text class="t-s" x="612" y="241">the stronger line in a launch post</text>
    <line class="row" x1="16" y1="256" x2="924" y2="256"/>
  </g>

  <g id="row-tooling">
    <text class="t-lbl" x="32" y="280">RELEASE TOOLING</text>
    <text class="mark plus" x="228" y="282">+</text>
    <text class="t-b" x="248" y="281">Already set up for it</text>
    <text class="t-s" x="248" y="299">pre-1.0 changes release as patch or minor</text>
    <text class="mark minus" x="592" y="282">−</text>
    <text class="t-b" x="612" y="281">The rules change at the cut</text>
    <text class="t-s" x="612" y="299">every breaking change needs a major after it</text>
    <line class="row" x1="16" y1="314" x2="924" y2="314"/>
  </g>

  <g id="locks-in">
    <rect class="foot" x="16" y="330" width="446" height="74" rx="5"/>
    <text class="t-lbl" x="32" y="351">LOCKS IN</text>
    <text class="t-b" x="32" y="371">Breaking changes ride minor versions until 1.0</text>
    <text class="t-s" x="32" y="389">1.0 becomes its own milestone after the first cohort</text>
  </g>

  <g id="flips-if">
    <rect class="foot" x="478" y="330" width="446" height="74" rx="5"/>
    <text class="t-lbl" x="494" y="351">FLIPS IF</text>
    <text class="t-b" x="494" y="371">Someone needs a stability promise on day one</text>
    <text class="t-s" x="494" y="389">a design partner, a YC application, an enterprise pilot</text>
  </g>
</svg>
