<svg viewBox="0 0 940 352" role="img" xmlns="http://www.w3.org/2000/svg"
     aria-label="The territory of Public Launch. Inside the project are four launch tracks: the first hour (the stranger's path), the hard gates (safety), the docs, brand and demo bar (learning), and the launch cut (the release). Below a fence sits the substrate the launch ships but does not own: framework simplification, the one project the launch waits for, then framework feature projects, the release pipeline, and kitchen-sink, which ship whatever they have by the cut. To the right, outside the project: post-launch growth, speculative platform work, kitchen-sink polish and parked bets, Ops repair, and the Tier B defect leftovers. The fence asks whether a stranger would hit it, or be harmed by it, the day the doors open.">
  <style>
    :root { --surface:#FCFCFA; --surface-2:#E8E8E1; --ink:#191C21; --ink-2:#4C535B; --ink-3:#7A828B;
            --rule:#D5D4CB; --accent:#3E4E8C; --accent-soft:#E0E3F0; --code:#2C7C69; --code-soft:#DCEDE7;
            --prose:#A8761C; --prose-soft:#F3E8D2; --gone:#A9544F; }
    @media (prefers-color-scheme: dark) {
      :root { --surface:#181C1F; --surface-2:#202528; --ink:#E6E8E5; --ink-2:#A4ACB1; --ink-3:#737B81;
              --rule:#2B3135; --accent:#8B9BD8; --accent-soft:#1B2140; --code:#5DBBA1; --code-soft:#14302A;
              --prose:#D9A44B; --prose-soft:#332612; --gone:#DE8A84; } }
    .n-own  { fill:var(--code-soft); stroke:var(--code); stroke-width:1.2; }
    .n-ep   { fill:var(--surface); stroke:var(--accent); stroke-width:1.2; }
    .n-sub  { fill:var(--surface-2); stroke:var(--rule); stroke-width:1.2; }
    .n-out  { fill:none; stroke:var(--rule); stroke-width:1.2; stroke-dasharray:4 3; }
    .t-lbl  { fill:var(--ink-3); font-family:ui-monospace,SFMono-Regular,Menlo,monospace;
              font-size:9.5px; letter-spacing:.1em; }
    .t-b    { fill:var(--ink); font-family:system-ui,-apple-system,sans-serif; font-weight:600; font-size:13px; }
    .t-s    { fill:var(--ink-2); font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:9.5px; }
    .t-out  { fill:var(--ink-3); font-family:system-ui,-apple-system,sans-serif; font-size:11px; }
    .fence  { stroke:var(--gone); stroke-width:1.6; stroke-dasharray:6 4; fill:none; }
    .t-fence{ fill:var(--gone); font-family:system-ui,-apple-system,sans-serif; font-weight:600; font-size:11px; }
  </style>

  <g id="owned">
    <rect class="n-own" x="16" y="16" width="620" height="186" rx="6"/>
    <text class="t-lbl" x="32" y="36">THIS PROJECT · WHAT STANDS BETWEEN A STRANGER AND A SAFE, WORKING INSTALL</text>
    <g id="first-hour">
      <rect class="n-ep" x="32" y="48" width="290" height="64" rx="5"/>
      <text class="t-lbl" x="44" y="66">THE STRANGER'S PATH</text>
      <text class="t-b"  x="44" y="86">the first hour</text>
      <text class="t-s"  x="44" y="102">init · scaffold · authoring pack</text>
    </g>
    <g id="hard-gates">
      <rect class="n-ep" x="330" y="48" width="290" height="64" rx="5"/>
      <text class="t-lbl" x="342" y="66">SAFETY</text>
      <text class="t-b"  x="342" y="86">the hard gates</text>
      <text class="t-s"  x="342" y="102">trust boundaries · silent loss · loadable</text>
    </g>
    <g id="docs-bar">
      <rect class="n-ep" x="32" y="122" width="290" height="64" rx="5"/>
      <text class="t-lbl" x="44" y="140">LEARNING</text>
      <text class="t-b"  x="44" y="160">docs, brand and demo bar</text>
      <text class="t-s"  x="44" y="176">one story · a first flow from docs</text>
    </g>
    <g id="launch-cut">
      <rect class="n-ep" x="330" y="122" width="290" height="64" rx="5"/>
      <text class="t-lbl" x="342" y="140">THE RELEASE</text>
      <text class="t-b"  x="342" y="160">the launch cut</text>
      <text class="t-s"  x="342" y="176">first publish · go-live · announce</text>
    </g>
  </g>

  <g id="not-here">
    <rect class="n-out" x="656" y="16" width="268" height="186" rx="6"/>
    <text class="t-lbl" x="672" y="36">NOT HERE</text>
    <text class="t-out" x="672" y="60">post-launch growth</text>
    <text class="t-out" x="672" y="82">speculative platform work</text>
    <text class="t-out" x="672" y="104">kitchen-sink polish · parked bets</text>
    <text class="t-out" x="672" y="126">Ops repair</text>
    <text class="t-out" x="672" y="148">Tier B defect leftovers</text>
    <text class="t-s"   x="672" y="178">in only if Jake adds it (PD-2)</text>
  </g>

  <g id="fence">
    <path class="fence" d="M16 228 H924"/>
    <text class="t-fence" x="16" y="222">Would a stranger hit it, or be harmed by it, the day the doors open?  Yes → above.  No → it ships on its own timeline.</text>
  </g>

  <g id="substrate">
    <rect class="n-sub" x="16" y="244" width="908" height="92" rx="6"/>
    <text class="t-lbl" x="32" y="264">SUBSTRATE · SHIPPED BY THE LAUNCH, OWNED BY OTHER PROJECTS</text>
    <text class="t-b"  x="32" y="288">framework simplification · the one the launch waits for</text>
    <text class="t-b"  x="32" y="310">framework feature projects · the release pipeline · kitchen-sink</text>
    <text class="t-s"  x="32" y="328">the rest ship on their own timeline; the launch uses what has landed by the cut (PD-3)</text>
  </g>
</svg>
