<svg viewBox="0 0 940 230" role="img" xmlns="http://www.w3.org/2000/svg"
     aria-label="The arc of the Realtime / WebSockets project, Oct 15 2026 to Jan 1 2027. Lane one, FIX-2367, push on long-lived hosts: a done bar from Oct 31 to Nov 20. Lane two, push on serverless hosts, not filed: no bar. Lane three, the client talks back, not filed: no bar. A now line at Nov 20 sits at the end of the done bar, with nothing in flight.">
  <style>
    :root { --surface:#FCFCFA; --surface-2:#E8E8E1; --ink:#191C21; --ink-2:#4C535B; --ink-3:#7A828B;
            --rule:#D5D4CB; --accent:#3E4E8C; --accent-soft:#E0E3F0; --code:#2C7C69; --code-soft:#DCEDE7;
            --prose:#A8761C; --prose-soft:#F3E8D2; --gone:#A9544F; }
    @media (prefers-color-scheme: dark) {
      :root { --surface:#181C1F; --surface-2:#202528; --ink:#E6E8E5; --ink-2:#A4ACB1; --ink-3:#737B81;
              --rule:#2B3135; --accent:#8B9BD8; --accent-soft:#1B2140; --code:#5DBBA1; --code-soft:#14302A;
              --prose:#D9A44B; --prose-soft:#332612; --gone:#DE8A84; } }
    .lane   { fill:var(--surface); stroke:var(--rule); stroke-width:1; }
    .done   { fill:var(--code-soft); stroke:var(--code); stroke-width:1.6; }
    .flight { fill:var(--accent-soft); stroke:var(--accent); stroke-width:1.6; }
    .axis   { stroke:var(--ink-3); stroke-width:1; }
    .tick   { stroke:var(--rule); stroke-width:1; stroke-dasharray:2 3; }
    .now    { stroke:var(--gone); stroke-width:1.8; fill:none; }
    .t-lbl  { fill:var(--ink-3); font-family:ui-monospace,SFMono-Regular,Menlo,monospace;
              font-size:9.5px; letter-spacing:.1em; }
    .t-b    { fill:var(--ink); font-family:system-ui,-apple-system,sans-serif; font-weight:600; font-size:12px; }
    .t-s    { fill:var(--ink-2); font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:9.5px; }
    .t-bar  { fill:var(--ink); font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:9.5px; }
    .t-now  { fill:var(--gone); font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:9.5px; font-weight:600; }
  </style>

  <!-- x = 220 + day * 700/78, day 0 = Oct 15 2026 -->
  <g id="axis">
    <path class="axis" d="M220 190 H920"/>
    <path class="tick" d="M373 30 V190"/>
    <path class="tick" d="M642 30 V190"/>
    <text class="t-s" x="220" y="206">Oct 15</text>
    <text class="t-s" x="360" y="206">Nov 1</text>
    <text class="t-s" x="629" y="206">Dec 1</text>
    <text class="t-s" x="885" y="206">Jan 1</text>
  </g>

  <g id="lane-fix-2367">
    <rect class="lane" x="16" y="40" width="904" height="40" rx="4"/>
    <text class="t-b" x="28" y="58">FIX-2367</text>
    <text class="t-s" x="28" y="72">push on long-lived hosts</text>
    <rect class="done" x="364" y="48" width="179" height="24" rx="3"/>
    <text class="t-bar" x="372" y="64">done · Oct 31 → Nov 20</text>
  </g>

  <g id="lane-serverless">
    <rect class="lane" x="16" y="88" width="904" height="40" rx="4"/>
    <text class="t-b" x="28" y="106">FIX-XXX · not filed</text>
    <text class="t-s" x="28" y="120">push on serverless hosts</text>
  </g>

  <g id="lane-talk-back">
    <rect class="lane" x="16" y="136" width="904" height="40" rx="4"/>
    <text class="t-b" x="28" y="154">FIX-XXX · not filed</text>
    <text class="t-s" x="28" y="168">the client talks back</text>
  </g>

  <g id="now">
    <path class="now" d="M543 26 V190"/>
    <text class="t-now" x="549" y="24">now · Nov 20</text>
  </g>
</svg>
