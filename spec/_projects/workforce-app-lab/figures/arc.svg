    <path class="filed" d="M342.2 380 V402"/>
    <rect class="done" x="345.2" y="378" width="26.6" height="26" rx="2"/>
    <text class="t-s" x="584" y="390">wrapped Oct 14 · closure FIX-1919, #3367</text>
    <text class="t-s" x="584" y="403">9 of 9 done · FIX-1934 left open</text>
  </g>

  <g id="labs">
