<svg viewBox="0 0 940 1014" role="img" xmlns="http://www.w3.org/2000/svg"
     aria-label="The arc: twenty epic lanes against six weeks from Sep 29, with the now line at Nov 6 23:17 UTC. Six epics are done and five of them carry closed bars. The lab shell, FIX-1649, ran from its epic spec on Sep 29 to its closure merging on Oct 4. Hand-offs, FIX-1815, ran from its approval on Oct 8 to its wrap on Oct 11. The dev Lab, FIX-1903, ran from its approval on Oct 12 to its wrap on Oct 14. Private and shared, FIX-1786, ran from its approval on Oct 6 to Linear Done on Oct 23; its wrap was recorded here on Oct 31. Same pieces, different apps, FIX-2152, ran from its filing and approval on Oct 23 to its closure merging early on Oct 31; Linear has not closed it. Memory and context, FIX-1775, has no bar, only a done mark on Oct 9, when Linear closed it as its first child merged. Four epics are in flight to the now line: org primitives, FIX-1650, from its approval on Oct 1, its closure merged Oct 6 and not wrapped; the daily driver, FIX-2369, from its approval late on Oct 31; smarter agents, FIX-2490, filed Nov 2 and approved Nov 4 at 19:10; and attachments, FIX-2516, filed Nov 3 and approved Nov 5 at 01:22. Coding tasks FIX-1763 carries a filing tick from Oct 4 and no bar; its children are building anyway. Talk on a finished task, FIX-1765, was filed Oct 4 and canceled Oct 13. Gaps between epics, FIX-2273, filed Oct 28, Workforce over MCP, FIX-2331, filed Oct 29, app follow-ups, FIX-2430, filed Oct 31, worktrees and sandboxing, FIX-2440, filed Nov 1, and Claude Code-style refinements, FIX-2592, filed Nov 6 with its epic spec in review, carry filing ticks and no bar. The eng workstream kit, attention and inspect, and review and GitHub wake are held with no bar.">
  <style>
    :root { --surface:#FCFCFA; --surface-2:#E8E8E1; --ink:#191C21; --ink-2:#4C535B; --ink-3:#7A828B;
            --rule:#D5D4CB; --accent:#3E4E8C; --accent-soft:#E0E3F0; --code:#2C7C69; --code-soft:#DCEDE7;
            --gone:#A9544F; }
    @media (prefers-color-scheme: dark) {
      :root { --surface:#181C1F; --surface-2:#202528; --ink:#E6E8E5; --ink-2:#A4ACB1; --ink-3:#737B81;
              --rule:#2B3135; --accent:#8B9BD8; --accent-soft:#1B2140; --code:#5DBBA1; --code-soft:#14302A;
              --gone:#DE8A84; } }
    .axis   { stroke:var(--rule); stroke-width:1; }
    .tick   { stroke:var(--rule); stroke-width:1; stroke-dasharray:2 4; }
    .done   { fill:var(--code-soft); stroke:var(--code); stroke-width:1.4; }
    .flight { fill:var(--accent-soft); stroke:var(--accent); stroke-width:1.4; }
    .mark   { stroke:var(--code); stroke-width:1.4; }
    .filed  { stroke:var(--ink-3); stroke-width:2; }
    .drop   { stroke:var(--ink-3); stroke-width:1.6; fill:none; }
    .start  { stroke:var(--accent); stroke-width:2.4; }
    .now    { stroke:var(--gone); stroke-width:1.6; }
    .t-lbl  { fill:var(--ink-3); font-family:ui-monospace,SFMono-Regular,Menlo,monospace;
              font-size:9.5px; letter-spacing:.1em; }
    .t-lane { fill:var(--ink); font-family:system-ui,-apple-system,sans-serif; font-weight:600; font-size:12px; }
    .t-s    { fill:var(--ink-2); font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:9.5px; }
    .t-now  { fill:var(--gone); font-family:system-ui,-apple-system,sans-serif; font-weight:600; font-size:10px; }
  </style>

  <!-- 12px per day: x = 180 + 12 * (days since Sep 29 00:00 UTC). Now Nov 6 23:17 = 647.6.
       Shell: spec 191.4 (Sep 29 22:44), approval tick 192.8 (Sep 30 01:33), closure merged 245.5
       (Oct 4 10:56). Org primitives: approved 213.1 (Oct 1 18:13), to the now line.
       FIX-1786: approved 273.0 (Oct 6 18:01), Linear Done 478.4 (Oct 23 20:52).
       FIX-1815: approved 298.5 (Oct 8 20:58), wrapped 333.2 (Oct 11 18:28, Linear Done).
       FIX-1903: approved 345.2 (Oct 12 18:23, #3164 merged), wrapped 371.8 (Oct 14 23:39, Linear Done).
       FIX-2369: approved 575.4 (Oct 31 22:42, #4358 merged), to the now line.
       FIX-2490: approved 621.6 (Nov 4 19:10, #4672 merged), to the now line.
       FIX-2516: approved 624.7 (Nov 5 01:22, #4766 merged), to the now line.
       FIX-2152: approved 478.9 (Oct 23 21:45, #3783 merged), closure #4278 merged 564.2 (Oct 31 00:23).
       FIX-1775: Linear Done 309.3 (Oct 9 18:31), a mark, no bar.
       FIX-1765: canceled 359.6 (Oct 13 23:10), a cross, no bar.
       Filing ticks: FIX-1763 247.3 (Oct 4 14:40), FIX-1765 248.2 (Oct 4 16:22),
       FIX-1775 251.3 (Oct 4 22:33), FIX-1786 264.5 (Oct 6 01:02), FIX-1815 298.1 (Oct 8 20:13),
       FIX-1903 342.2 (Oct 12 12:25), FIX-2152 478.4 (Oct 23 20:43), FIX-2273 536.5 (Oct 28 16:58),
       FIX-2331 550.5 (Oct 29 21:01), FIX-2369 574.2 (Oct 31 20:19), FIX-2430 574.5 (Oct 31 21:06),
       FIX-2440 582.5 (Nov 1 13:01), FIX-2490 599.4 (Nov 2 22:47),
       FIX-2516 609.9 (created Nov 3 19:48; Epic label Nov 5 00:19), FIX-2592 647.2 (Nov 6 22:24).
       Lanes 48px apart; annotations start at x=660, right of the now line. -->
