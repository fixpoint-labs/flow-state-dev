<svg viewBox="0 0 940 300" role="img" xmlns="http://www.w3.org/2000/svg"
     aria-label="The arc: five epic lanes against three weeks from Sep 29. The lab shell, FIX-1649, started its epic spec on the evening of Sep 29 and is the only bar, in flight, ending on the now line at Sep 29 23:06 UTC. Org primitives, FIX-1650, is a Cycle 2 candidate with no bar. The eng workstream kit, attention and inspect, and review and GitHub wake are held with no bar.">
  <style>
    :root { --surface:#FCFCFA; --surface-2:#E8E8E1; --ink:#191C21; --ink-2:#4C535B; --ink-3:#7A828B;
            --rule:#D5D4CB; --accent:#3E4E8C; --accent-soft:#E0E3F0; --code:#2C7C69; --code-soft:#DCEDE7;
            --gone:#A9544F; }
    @media (prefers-color-scheme: dark) {
      :root { --surface:#181C1F; --surface-2:#202528; --ink:#E6E8E5; --ink-2:#A4ACB1; --ink-3:#737B81;
              --rule:#2B3135; --accent:#8B9BD8; --accent-soft:#1B2140; --code:#5DBBA1; --code-soft:#14302A;
              --gone:#DE8A84; } }
    .axis   { stroke:var(--rule); stroke-width:1; }
    .tick   { stroke:var(--rule); stroke-width:1; stroke-dasharray:2 4; }
    .done   { fill:var(--code-soft); stroke:var(--code); stroke-width:1.4; }
    .flight { fill:var(--accent-soft); stroke:var(--accent); stroke-width:1.4; }
    .now    { stroke:var(--gone); stroke-width:1.6; }
    .t-lbl  { fill:var(--ink-3); font-family:ui-monospace,SFMono-Regular,Menlo,monospace;
              font-size:9.5px; letter-spacing:.1em; }
    .t-lane { fill:var(--ink); font-family:system-ui,-apple-system,sans-serif; font-weight:600; font-size:12px; }
    .t-s    { fill:var(--ink-2); font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:9.5px; }
    .t-now  { fill:var(--gone); font-family:system-ui,-apple-system,sans-serif; font-weight:600; font-size:10px; }
  </style>

  <!-- 30px per day: x = 180 + 30 * (days since Sep 29 00:00 UTC). Now Sep 29 23:06 = 208.9.
       The shell's bar is drawn 6px wide ending on the now line: its true span is under two hours. -->
  <g id="axis">
    <text class="t-lbl" x="16" y="20">EPIC</text>
    <text class="t-lbl" x="180" y="20">SEP 29</text>
    <text class="t-lbl" x="390" y="20">OCT 6</text>
    <text class="t-lbl" x="600" y="20">OCT 13</text>
    <text class="t-lbl" x="810" y="20">OCT 20</text>
    <path class="axis" d="M180 30 H900"/>
    <path class="tick" d="M180 30 V270 M390 30 V270 M600 30 V270 M810 30 V270"/>
  </g>

  <g id="shell">
    <text class="t-lane" x="16" y="56">lab shell</text>
    <text class="t-s"    x="16" y="70">FIX-1649 · in flight</text>
    <rect class="flight" x="202.9" y="42" width="6" height="26" rx="2"/>
    <text class="t-s" x="220" y="59">epic spec being authored</text>
  </g>

  <g id="org">
    <text class="t-lane" x="16" y="104">org primitives</text>
    <text class="t-s"    x="16" y="118">FIX-1650 · Cycle 2 candidate</text>
  </g>

  <g id="kit">
    <text class="t-lane" x="16" y="152">eng workstream kit</text>
    <text class="t-s"    x="16" y="166">FIX-1651 · held</text>
  </g>

  <g id="attention">
    <text class="t-lane" x="16" y="200">attention &amp; inspect</text>
    <text class="t-s"    x="16" y="214">FIX-1652 · held</text>
  </g>

  <g id="review">
    <text class="t-lane" x="16" y="248">review &amp; GitHub wake</text>
    <text class="t-s"    x="16" y="262">FIX-1653 · held</text>
  </g>

  <g id="now">
    <path class="now" d="M208.9 30 V278"/>
    <text class="t-now" x="212" y="290">now · Sep 29 23:06 UTC</text>
  </g>
</svg>
