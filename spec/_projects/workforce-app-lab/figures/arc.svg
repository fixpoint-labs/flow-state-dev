<svg viewBox="0 0 940 300" role="img" xmlns="http://www.w3.org/2000/svg"
     aria-label="The arc: five epic lanes against three weeks from Sep 29. The lab shell, FIX-1649, is done: its bar runs from its epic spec on the evening of Sep 29, through approval at Sep 30 01:33 UTC, to its closure merging at Oct 4 10:56 UTC, just before the now line; Linear status is pending. Org primitives, FIX-1650, is in flight from its approval on Oct 1 and crosses the now line at Oct 4 11:10 UTC. The eng workstream kit, attention and inspect, and review and GitHub wake are held with no bar.">
  <style>
    :root { --surface:#FCFCFA; --surface-2:#E8E8E1; --ink:#191C21; --ink-2:#4C535B; --ink-3:#7A828B;
            --rule:#D5D4CB; --accent:#3E4E8C; --accent-soft:#E0E3F0; --code:#2C7C69; --code-soft:#DCEDE7;
            --gone:#A9544F; }
    @media (prefers-color-scheme: dark) {
      :root { --surface:#181C1F; --surface-2:#202528; --ink:#E6E8E5; --ink-2:#A4ACB1; --ink-3:#737B81;
              --rule:#2B3135; --accent:#8B9BD8; --accent-soft:#1B2140; --code:#5DBBA1; --code-soft:#14302A;
              --gone:#DE8A84; } }
    .axis   { stroke:var(--rule); stroke-width:1; }
    .tick   { stroke:var(--rule); stroke-width:1; stroke-dasharray:2 4; }
    .done   { fill:var(--code-soft); stroke:var(--code); stroke-width:1.4; }
    .flight { fill:var(--accent-soft); stroke:var(--accent); stroke-width:1.4; }
    .mark   { stroke:var(--code); stroke-width:1.4; }
    .now    { stroke:var(--gone); stroke-width:1.6; }
    .t-lbl  { fill:var(--ink-3); font-family:ui-monospace,SFMono-Regular,Menlo,monospace;
              font-size:9.5px; letter-spacing:.1em; }
    .t-lane { fill:var(--ink); font-family:system-ui,-apple-system,sans-serif; font-weight:600; font-size:12px; }
    .t-s    { fill:var(--ink-2); font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:9.5px; }
    .t-now  { fill:var(--gone); font-family:system-ui,-apple-system,sans-serif; font-weight:600; font-size:10px; }
  </style>

  <!-- 30px per day: x = 180 + 30 * (days since Sep 29 00:00 UTC). Now Oct 4 11:10 = 344.0.
       Shell: spec from 202.9 (Sep 29 22:44), approval tick at 211.9 (Sep 30 01:33), closure
       merged at 343.7 (Oct 4 10:56). Org primitives: spec 262.8 (Oct 1 18:13), approved 263.8
       (Oct 1 18:33), building to the now line. -->
  <g id="axis">
    <text class="t-lbl" x="16" y="20">EPIC</text>
    <text class="t-lbl" x="180" y="20">SEP 29</text>
    <text class="t-lbl" x="390" y="20">OCT 6</text>
    <text class="t-lbl" x="600" y="20">OCT 13</text>
    <text class="t-lbl" x="810" y="20">OCT 20</text>
    <path class="axis" d="M180 30 H900"/>
    <path class="tick" d="M180 30 V270 M390 30 V270 M600 30 V270 M810 30 V270"/>
  </g>

  <g id="shell">
    <text class="t-lane" x="16" y="56">lab shell</text>
    <text class="t-s"    x="16" y="70">FIX-1649 · done</text>
    <rect class="done" x="202.9" y="42" width="140.8" height="26" rx="2"/>
    <path class="mark" d="M211.9 42 V68"/>
    <text class="t-s" x="352" y="54">wrapped Oct 4 10:56 · closure FIX-1663 merged, #2709</text>
    <text class="t-s" x="352" y="67">Linear status pending with Jake</text>
  </g>

  <g id="org">
    <text class="t-lane" x="16" y="104">org primitives</text>
    <text class="t-s"    x="16" y="118">FIX-1650 · in flight</text>
    <rect class="flight" x="262.8" y="90" width="81.2" height="26" rx="2"/>
    <text class="t-s" x="352" y="102">approved Oct 1 · FIX-1718, FIX-1719 building</text>
    <text class="t-s" x="352" y="115">closure FIX-1720 in development</text>
  </g>

  <g id="kit">
    <text class="t-lane" x="16" y="152">eng workstream kit</text>
    <text class="t-s"    x="16" y="166">FIX-1651 · held</text>
  </g>

  <g id="attention">
    <text class="t-lane" x="16" y="200">attention &amp; inspect</text>
    <text class="t-s"    x="16" y="214">FIX-1652 · held</text>
  </g>

  <g id="review">
    <text class="t-lane" x="16" y="248">review &amp; GitHub wake</text>
    <text class="t-s"    x="16" y="262">FIX-1653 · held</text>
  </g>

  <g id="now">
    <path class="now" d="M344.0 30 V278"/>
    <text class="t-now" x="347" y="290">now · Oct 4 11:10 UTC</text>
  </g>
</svg>
