    <text class="t-s" x="584" y="102">approved Oct 1 · 15 of 20 done, 3 canceled</text>
    <text class="t-s" x="584" y="115">closure FIX-1720 merged Oct 6 · not wrapped</text>
  </g>

  <g id="coding">
    <text class="t-lane" x="16" y="152">coding tasks</text>
    <text class="t-s"    x="16" y="166">FIX-1763 · not started</text>
    <path class="filed" d="M247.3 140 V162"/>
    <text class="t-s" x="584" y="150">filed Oct 4 · no epic spec</text>
    <text class="t-s" x="584" y="163">children building: 6 of 12 done</text>
  </g>

  <g id="finished">
