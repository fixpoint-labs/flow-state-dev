    <text class="t-s"    x="16" y="214">FIX-1765 · dropped</text>
    <path class="filed" d="M248.2 188 V210"/>
    <path class="drop" d="M354.6 194 L364.6 204 M364.6 194 L354.6 204"/>
    <text class="t-s" x="584" y="198">canceled Oct 13 · folded into FIX-1764</text>
    <text class="t-s" x="584" y="211">Jake: a person's message reopens it</text>
  </g>

  <g id="memory">
    <text class="t-lane" x="16" y="248">memory &amp; context</text>
    <text class="t-s"    x="16" y="262">FIX-1775 · done, flagged</text>
    <path class="filed" d="M251.3 236 V258"/>
    <path class="mark" d="M309.3 234 V260"/>
    <text class="t-s" x="584" y="246">Done Oct 9 as FIX-1776 merged · no gate</text>
    <text class="t-s" x="584" y="259">long-session half never filed</text>
  </g>

  <g id="private">
    <text class="t-lane" x="16" y="296">private &amp; shared</text>
    <text class="t-s"    x="16" y="310">FIX-1786 · done</text>
    <path class="filed" d="M264.5 284 V306"/>
    <rect class="done" x="273.0" y="282" width="205.4" height="26" rx="2"/>
    <text class="t-s" x="584" y="294">Linear Done Oct 23 · 81 of 84, 2 canceled</text>
    <text class="t-s" x="584" y="307">wrap recorded here Oct 31</text>
  </g>

  <g id="handoffs">
    <text class="t-lane" x="16" y="344">hand-offs</text>
    <text class="t-s"    x="16" y="358">FIX-1815 · done</text>
    <path class="filed" d="M298.1 332 V354"/>
    <rect class="done" x="298.5" y="330" width="34.7" height="26" rx="2"/>
    <text class="t-s" x="584" y="342">wrapped Oct 11 · closure FIX-1820, #3048</text>
    <text class="t-s" x="584" y="355">7 of 8 done, FIX-1818 canceled</text>
  </g>

  <g id="devlab">
    <text class="t-lane" x="16" y="392">dev Lab</text>
