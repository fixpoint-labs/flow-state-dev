<svg viewBox="0 0 940 444" role="img" xmlns="http://www.w3.org/2000/svg"
     aria-label="The arc: eight epic lanes against seventeen days. W2 ran Sep 8 to Sep 12 and is done. The default agent flow ran Sep 12 to Sep 16 and is done. W3 ran Sep 16 to Sep 20 and is done. W4 ran Sep 18 to Sep 20 and is done. W5 was filed on Sep 19, re-cut as release QA on Sep 20 and is in flight. The kitchen-sink rebuild became its own epic on Sep 20, had its spec approved on Sep 21 and is in flight. Plane isolation's children began shipping on Sep 22; the epic was filed, passed its gate and had its spec merged on Sep 23, and wrapped on Sep 24 with all eight children done. W1 was created Sep 8 and has not started. The now line is the end of Sep 24.">
  <style>
    :root { --surface:#FCFCFA; --surface-2:#E8E8E1; --ink:#191C21; --ink-2:#4C535B; --ink-3:#7A828B;
            --rule:#D5D4CB; --accent:#3E4E8C; --accent-soft:#E0E3F0; --code:#2C7C69; --code-soft:#DCEDE7;
            --gone:#A9544F; }
    @media (prefers-color-scheme: dark) {
      :root { --surface:#181C1F; --surface-2:#202528; --ink:#E6E8E5; --ink-2:#A4ACB1; --ink-3:#737B81;
              --rule:#2B3135; --accent:#8B9BD8; --accent-soft:#1B2140; --code:#5DBBA1; --code-soft:#14302A;
              --gone:#DE8A84; } }
    .axis   { stroke:var(--rule); stroke-width:1; }
    .tick   { stroke:var(--rule); stroke-width:1; stroke-dasharray:2 4; }
    .done   { fill:var(--code-soft); stroke:var(--code); stroke-width:1.4; }
    .flight { fill:var(--accent-soft); stroke:var(--accent); stroke-width:1.4; }
    .now    { stroke:var(--gone); stroke-width:1.6; }
    .t-lbl  { fill:var(--ink-3); font-family:ui-monospace,SFMono-Regular,Menlo,monospace;
              font-size:9.5px; letter-spacing:.1em; }
    .t-lane { fill:var(--ink); font-family:system-ui,-apple-system,sans-serif; font-weight:600; font-size:12px; }
    .t-s    { fill:var(--ink-2); font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:9.5px; }
    .t-now  { fill:var(--gone); font-family:system-ui,-apple-system,sans-serif; font-weight:600; font-size:10px; }
  </style>

  <!-- 43.5px per day: x = 180 + 43.5 * (day - 8); Sep 24 00:00 = 876; now = Sep 25 00:00 = 919.5 -->
  <g id="axis">
    <text class="t-lbl" x="16" y="20">EPIC</text>
    <text class="t-lbl" x="180" y="20">SEP 8</text>
    <text class="t-lbl" x="354" y="20">SEP 12</text>
    <text class="t-lbl" x="528" y="20">SEP 16</text>
    <text class="t-lbl" x="702" y="20">SEP 20</text>
    <path class="axis" d="M180 30 H919.5"/>
    <path class="tick" d="M180 30 V412 M354 30 V412 M528 30 V412 M702 30 V412 M876 30 V412"/>
  </g>

  <g id="w2">
    <text class="t-lane" x="16" y="56">W2 · foundation</text>
    <text class="t-s"    x="16" y="70">FIX-1332 · 5/5</text>
    <rect class="done" x="180" y="42" width="174" height="26" rx="4"/>
    <text class="t-s" x="192" y="59">conventions, seat factory</text>
  </g>

  <g id="agent-flow">
    <text class="t-lane" x="16" y="104">agent flow</text>
    <text class="t-s"    x="16" y="118">FIX-1359 · 8/11</text>
    <rect class="done" x="354" y="90" width="174" height="26" rx="4"/>
    <text class="t-s" x="366" y="107">OOTB agent flow kind</text>
  </g>

  <g id="w3">
    <text class="t-lane" x="16" y="152">W3 · file surface</text>
    <text class="t-s"    x="16" y="166">FIX-1351 · 19/20</text>
    <rect class="done" x="528" y="138" width="174" height="26" rx="4"/>
    <text class="t-s" x="540" y="155">channels, resources, skills</text>
  </g>

  <g id="w4">
    <text class="t-lane" x="16" y="200">W4 · routing</text>
    <text class="t-s"    x="16" y="214">FIX-1407 · 7/9</text>
    <rect class="done" x="615" y="186" width="87" height="26" rx="4"/>
    <text class="t-s" x="607" y="203" text-anchor="end">spec Sep 18 · gate Sep 19 · wrapped Sep 20</text>
  </g>

  <g id="w5">
    <text class="t-lane" x="16" y="248">W5 · release QA</text>
    <text class="t-s"    x="16" y="262">FIX-1457 · 4/9</text>
    <rect class="flight" x="658.5" y="234" width="261" height="26" rx="4"/>
    <text class="t-s" x="650.5" y="251" text-anchor="end">filed Sep 19 · re-cut as release QA Sep 20</text>
  </g>

  <g id="kitchen-sink">
    <text class="t-lane" x="16" y="296">kitchen-sink rebuild</text>
    <text class="t-s"    x="16" y="310">FIX-1455 · 6/8</text>
    <rect class="flight" x="702" y="282" width="217.5" height="26" rx="4"/>
    <text class="t-s" x="694" y="299" text-anchor="end">own epic Sep 20 · spec approved Sep 21</text>
  </g>

  <g id="plane-isolation">
    <text class="t-lane" x="16" y="344">plane isolation</text>
    <text class="t-s"    x="16" y="358">FIX-1528 · 8/8</text>
    <rect class="done" x="789" y="330" width="116.5" height="26" rx="4"/>
    <text class="t-s" x="781" y="347" text-anchor="end">children shipping Sep 22 · gate Sep 23 · wrapped Sep 24</text>
  </g>

  <g id="w1">
    <text class="t-lane" x="16" y="392">W1 · MCP door</text>
    <text class="t-s"    x="16" y="406">FIX-1333 · not started</text>
    <text class="t-s" x="180" y="394">filed Sep 8, before W2 — the numbering is not the order</text>
  </g>

  <g id="now">
    <path class="now" d="M919.5 30 V424"/>
    <text class="t-now" x="913.5" y="28" text-anchor="end">NOW · SEP 24</text>
  </g>
</svg>
