<svg viewBox="0 0 940 486" role="img" xmlns="http://www.w3.org/2000/svg"
     aria-label="The path: one lane per row of the set, against time, with a now line at September 24, 2026. A ship-fence band under the axis reads LIFTED on September 20. Two input lanes from other epics, both landed: the W3 floor FIX-1351, giving seats, channels and skills on disk; and the W4 first cut FIX-1407, giving boards, inventory and dispatch policy. Then seven lanes of the set, each bar running from the day Linear marked the issue started to the day it was done. Five carry done bars: FIX-1429, serving the file-declared demo, done September 21 with its goal check passing; FIX-1475, durable hire, done September 22; FIX-1476, channels and boards, done September 21; FIX-1477, the UI package split, done September 23 with the shell merged on pull request 2113 and seats shipped in the rail, the longest bar; and FIX-1478, the patterns shed, done September 22. Two lanes joined the set on September 24 under ER-21 and carry in-flight bars reaching the now line, each with a dashed line ahead because nothing beyond is dated: FIX-1500, the human path, started September 22, with PR-A on pull request 2123 and PR-C on pull request 2122 merged; and FIX-1527, the manager seat, started September 23 and implementing. A mark in the gutter links those two lanes to the one open wait, the named-organization amendment from decision D9: FIX-1500's rail hire waits on it, and the manager seat hires in stock kitchen-sink only once it lands. Under a divider, related lanes that are not in the set: the parked channel-admin capability FIX-1415, the manager-queue lab FIX-1430, org-never-optional FIX-1442, and the verified-identity epic FIX-1503, whose resolver later replaces D9's named organization. A final note records the owner's September 20 triage of five stale kitchen-sink tickets: FIX-1372 stays open and is verified at wrap, while FIX-420, FIX-429, FIX-472 and FIX-540 close as superseded. None of the five is a child of this epic.">
  <style>
    :root { --surface:#FCFCFA; --surface-2:#E8E8E1; --ink:#191C21; --ink-2:#4C535B; --ink-3:#7A828B;
            --rule:#D5D4CB; --accent:#3E4E8C; --accent-soft:#E0E3F0; --code:#2C7C69; --code-soft:#DCEDE7;
            --prose:#A8761C; --prose-soft:#F3E8D2; --gone:#A9544F; }
    @media (prefers-color-scheme: dark) {
      :root { --surface:#181C1F; --surface-2:#202528; --ink:#E6E8E5; --ink-2:#A4ACB1; --ink-3:#737B81;
              --rule:#2B3135; --accent:#8B9BD8; --accent-soft:#1B2140; --code:#5DBBA1; --code-soft:#14302A;
              --prose:#D9A44B; --prose-soft:#332612; --gone:#DE8A84; } }
    .inp   { fill:var(--prose-soft); stroke:var(--prose); stroke-width:1.4; }
    .bar   { fill:var(--accent-soft); stroke:var(--accent); stroke-width:1.4; }
    .done  { fill:var(--code-soft); stroke:var(--code); stroke-width:1.8; }
    .lane  { stroke:var(--ink-3); stroke-width:1; stroke-dasharray:2 4; }
    .axis  { stroke:var(--rule); stroke-width:1; }
    .div   { stroke:var(--rule); stroke-width:1; }
    .now   { stroke:var(--gone); stroke-width:1.4; }
    .fence { fill:none; stroke:var(--code); stroke-width:1.2; stroke-dasharray:6 4; }
    .crit  { fill:none; stroke:var(--ink-3); stroke-width:1.2; }
    .critd { fill:var(--ink-3); stroke:none; }
    .t-lbl { fill:var(--ink-3); font-family:ui-monospace,SFMono-Regular,Menlo,monospace;
             font-size:9.5px; letter-spacing:.1em; }
    .t-ln  { fill:var(--ink); font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:10px; }
    .t-lng { fill:var(--ink-3); font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:10px; }
    .t-s   { fill:var(--ink-2); font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:9px; }
    .t-now { fill:var(--gone); font-family:ui-monospace,SFMono-Regular,Menlo,monospace;
             font-size:9.5px; letter-spacing:.06em; }
    .t-fen { fill:var(--code); font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:9px; }
  </style>

  <text class="t-lbl" x="16" y="18">THE PATH — ONE LANE PER ROW OF THE SET, AGAINST TIME</text>

  <g id="axis">
    <path class="axis" d="M200 42 L924 42"/>
    <text class="t-s" x="200" y="34">Sep 16</text>
    <text class="t-s" x="330" y="34" text-anchor="middle">Sep 20</text>
    <text class="t-now" x="459" y="34" text-anchor="middle">now &#183; Sep 24</text>
    <text class="t-s" x="656" y="34">ahead &#183; no dates set</text>
  </g>

  <g id="ship-fence">
    <text class="t-fen" x="16" y="62">SHIP FENCE</text>
    <rect class="fence" x="200" y="50" width="724" height="16" rx="2"/>
    <text class="t-fen" x="212" y="62">LIFTED Sep 20 &#8212; W3 Done, W4 first cut landed; children may open impl PRs, not only specs</text>
  </g>

  <path class="now" d="M459 74 L459 294"/>

  <g id="lanes-inputs">
    <text class="t-ln" x="16" y="100">FIX-1351 W3 floor</text>
    <rect class="inp" x="200" y="91" width="100" height="12" rx="2"/>
    <text class="t-s" x="656" y="100">landed &#183; seats, channels, skills on disk</text>
    <text class="t-ln" x="16" y="122">FIX-1407 W4 first cut</text>
    <rect class="inp" x="200" y="113" width="130" height="12" rx="2"/>
    <text class="t-s" x="656" y="122">landed &#183; boards, inventory, dispatch &#183; 2 strays</text>
  </g>

  <g id="lanes-set">
    <text class="t-ln" x="16" y="150">FIX-1429 serve the demo</text>
    <rect class="done" x="364" y="141" width="16" height="12" rx="2"/>
    <text class="t-s" x="656" y="150">done &#183; #1989 &#183; goal check PASSES</text>

    <text class="t-ln" x="16" y="172">FIX-1475 durable hire</text>
    <rect class="done" x="366" y="163" width="29" height="12" rx="2"/>
    <text class="t-s" x="656" y="172">done &#183; spec #1990</text>

    <text class="t-ln" x="16" y="194">FIX-1476 channels + boards</text>
    <rect class="done" x="380" y="185" width="13" height="12" rx="2"/>
    <text class="t-s" x="656" y="194">done &#183; spec #1992</text>

    <text class="t-ln" x="16" y="216">FIX-1477 UI package split</text>
    <rect class="done" x="380" y="207" width="79" height="12" rx="2"/>
    <text class="t-s" x="656" y="216">done &#183; shell #2113 &#183; seats in the rail</text>

    <text class="t-ln" x="16" y="238">FIX-1478 patterns shed</text>
    <rect class="done" x="365" y="229" width="30" height="12" rx="2"/>
    <text class="t-s" x="656" y="238">done &#183; spec #1988</text>

    <text class="t-ln" x="16" y="260">FIX-1500 the human path</text>
    <rect class="bar" x="419" y="251" width="40" height="12" rx="2"/>
    <path class="lane" d="M465 257 L610 257"/>
    <text class="t-s" x="656" y="260">in flight &#183; PR-A #2123, PR-C #2122 merged</text>

    <text class="t-ln" x="16" y="282">FIX-1527 manager seat</text>
    <rect class="bar" x="451" y="273" width="8" height="12" rx="2"/>
    <path class="lane" d="M465 279 L560 279"/>
    <text class="t-s" x="656" y="282">in flight &#183; spec #2112 &#183; implementing</text>
  </g>

  <g id="open-wait">
    <path class="crit" d="M190 257 L190 279"/>
    <circle class="critd" cx="190" cy="257" r="3.2"/>
    <circle class="critd" cx="190" cy="279" r="3.2"/>
  </g>

  <g id="summary">
    <text class="t-s" x="200" y="310">5 done. 2 in flight, joined Sep 24 under ER-21 &#8212; both hire in stock kitchen-sink only once the named org (D9) lands.</text>
    <text class="t-s" x="200" y="322">That amendment is the one open wait: FIX-1500&#8217;s rail hire (PR-D) holds on it. Nothing else in the set is blocked.</text>
  </g>

  <g id="related">
    <path class="div" d="M16 336 L924 336"/>
    <text class="t-lbl" x="16" y="352">RELATED &#8212; NOT IN THE SET</text>
    <text class="t-lng" x="16" y="372">FIX-1415 channel admin</text>
    <text class="t-s" x="656" y="372">parked &#183; runtime create/delete/invite verbs</text>
    <text class="t-lng" x="16" y="392">FIX-1430 manager-queue lab</text>
    <text class="t-s" x="656" y="392">W4-side &#183; consumed as a POC spine</text>
    <text class="t-lng" x="16" y="412">FIX-1442 org never optional</text>
    <text class="t-s" x="656" y="412">soft-related &#183; consumed, not re-decided</text>
    <text class="t-lng" x="16" y="432">FIX-1503 verified identity</text>
    <text class="t-s" x="656" y="432">epic &#183; later replaces D9&#8217;s named org</text>
    <text class="t-s" x="16" y="454">Triaged Sep 20: FIX-1372 stays open, verified at wrap; FIX-420, FIX-429, FIX-472, FIX-540 close as superseded. Not children either way.</text>
  </g>

  <g id="legend">
    <rect class="inp" x="16" y="468" width="16" height="12" rx="2"/>
    <text class="t-s" x="40" y="477">input from another epic, landed</text>
    <rect class="done" x="220" y="468" width="16" height="12" rx="2"/>
    <text class="t-s" x="244" y="477">done &#8212; started to done</text>
    <rect class="bar" x="394" y="468" width="16" height="12" rx="2"/>
    <text class="t-s" x="418" y="477">in flight</text>
    <path class="lane" d="M490 474 L526 474"/>
    <text class="t-s" x="534" y="477">ahead &#8212; nothing dated</text>
    <circle class="critd" cx="700" cy="474" r="3.2"/>
    <path class="crit" d="M700 468 L700 480"/>
    <text class="t-s" x="714" y="477">both wait on the named org</text>
  </g>
</svg>
