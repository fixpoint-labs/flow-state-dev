<svg viewBox="0 0 940 396" role="img" xmlns="http://www.w3.org/2000/svg"
     aria-label="The path as of 24 September 2026, drawn in steps rather than dates because the epic is unscheduled. The now line sits at this gate, before step 1. Input lane: FIX-1495 model string grammar, backlog, optional, blocks nothing. Step 1: FIX-1554, the evaluator kind; FIX-1560 is folded into it and has no bar. Step 2, in parallel: FIX-1558 cascadingRouter, FIX-1559 skill activator, FIX-1557 facets. Step 3: FIX-1555 memory seam, preferring to follow FIX-1559, and FIX-1556 docs and the assembled goal, after FIX-1558 and FIX-1559. Step 4: wrap. The critical path runs from the gate through FIX-1554, FIX-1558 and FIX-1556 to wrap.">
  <style>
    :root { --surface:#FCFCFA; --surface-2:#E8E8E1; --ink:#191C21; --ink-2:#4C535B; --ink-3:#7A828B;
            --rule:#D5D4CB; --accent:#3E4E8C; --accent-soft:#E0E3F0; --code:#2C7C69; --code-soft:#DCEDE7;
            --prose:#A8761C; --prose-soft:#F3E8D2; --gone:#A9544F; }
    @media (prefers-color-scheme: dark) {
      :root { --surface:#181C1F; --surface-2:#202528; --ink:#E6E8E5; --ink-2:#A4ACB1; --ink-3:#737B81;
              --rule:#2B3135; --accent:#8B9BD8; --accent-soft:#1B2140; --code:#5DBBA1; --code-soft:#14302A;
              --prose:#D9A44B; --prose-soft:#332612; --gone:#DE8A84; } }
    .bg    { fill:var(--surface); }
    .todo  { fill:none; stroke:var(--ink-3); stroke-width:1.2; stroke-dasharray:4 3; }
    .axis  { stroke:var(--rule); stroke-width:1; }
    .tick  { stroke:var(--rule); stroke-width:1; stroke-dasharray:2 3; }
    .now   { stroke:var(--gone); stroke-width:1.4; }
    .crit  { fill:none; stroke:var(--gone); stroke-width:1.2; stroke-dasharray:3 3; }
    .t-lbl { fill:var(--ink-3); font-family:ui-monospace,SFMono-Regular,Menlo,monospace;
             font-size:9.5px; letter-spacing:.1em; }
    .t-ln  { fill:var(--ink); font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:10px; }
    .t-s   { fill:var(--ink-2); font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:9px; }
    .t-now { fill:var(--gone); font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:9.5px; }
    .t-g   { fill:var(--gone); font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:9px; }
  </style>
  <rect class="bg" x="0" y="0" width="940" height="396"/>
  <text class="t-lbl" x="16" y="18">THE PATH &#183; AS OF 24 SEP 2026 &#183; UNSCHEDULED, SO THE AXIS IS ORDER, NOT DATES</text>

  <g id="axis">
    <path class="axis" d="M220 44 L924 44"/>
    <text class="t-now" x="236" y="36" text-anchor="end">now &#183; gate</text>
    <path class="now" d="M240 44 L240 346"/>
    <text class="t-s" x="256" y="36">step 1</text>
    <path class="tick" d="M408 44 L408 346"/>
    <text class="t-s" x="416" y="36">step 2</text>
    <path class="tick" d="M608 44 L608 346"/>
    <text class="t-s" x="616" y="36">step 3</text>
    <path class="tick" d="M808 44 L808 346"/>
    <text class="t-s" x="816" y="36">step 4</text>
  </g>

  <g id="in-1495">
    <text class="t-ln" x="16" y="70">FIX-1495 &#183; model ids</text>
    <text class="t-s" x="256" y="70">input &#183; Backlog &#183; optional, blocks nothing</text>
  </g>
  <path class="axis" d="M16 84 L924 84"/>

  <g id="l-1554">
    <text class="t-ln" x="16" y="112">FIX-1554 &#183; evaluator kind</text>
    <rect class="todo" x="256" y="100" width="144" height="18" rx="3"/>
    <text class="t-s" x="264" y="113">spec &#8594; build</text>
  </g>
  <g id="l-1560">
    <text class="t-ln" x="16" y="144">FIX-1560 &#183; direction</text>
    <text class="t-s" x="256" y="144">folded into FIX-1554's spec</text>
  </g>
  <g id="l-1558">
    <text class="t-ln" x="16" y="176">FIX-1558 &#183; cascadingRouter</text>
    <rect class="todo" x="416" y="164" width="184" height="18" rx="3"/>
    <text class="t-s" x="424" y="177">spec &#8594; build &#183; leg (c)</text>
  </g>
  <g id="l-1559">
    <text class="t-ln" x="16" y="208">FIX-1559 &#183; skill activator</text>
    <rect class="todo" x="416" y="196" width="150" height="18" rx="3"/>
    <text class="t-s" x="424" y="209">spec &#8594; build &#183; leg (d)</text>
  </g>
  <g id="l-1557">
    <text class="t-ln" x="16" y="240">FIX-1557 &#183; facets</text>
    <rect class="todo" x="416" y="228" width="184" height="18" rx="3"/>
    <text class="t-s" x="424" y="241">spec &#8594; build &#183; leg (e)</text>
  </g>
  <g id="l-1555">
    <text class="t-ln" x="16" y="272">FIX-1555 &#183; memory seam</text>
    <rect class="todo" x="616" y="260" width="150" height="18" rx="3"/>
    <text class="t-s" x="624" y="273">sketch &#183; leg (f)</text>
    <text class="t-s" x="416" y="273">prefers to follow FIX-1559</text>
  </g>
  <g id="l-1556">
    <text class="t-ln" x="16" y="312">FIX-1556 &#183; docs and proof</text>
    <rect class="todo" x="616" y="298" width="184" height="22" rx="3"/>
    <text class="t-s" x="624" y="313">teach page &#8594; assembled goal</text>
    <text class="t-g" x="820" y="313">wrap</text><text class="t-g" x="820" y="327">all six legs</text>
  </g>

  <g id="critical">
    <path class="crit" d="M240 109 L256 109"/>
    <path class="crit" d="M400 109 L408 109 L408 173 L416 173"/>
    <path class="crit" d="M600 173 L608 173 L608 309 L616 309"/>
    <path class="crit" d="M800 309 L816 309"/>
    <text class="t-g" x="16" y="376">Critical path: this gate &#8594; FIX-1554 &#8594; FIX-1558 &#8594; FIX-1556 &#8594; wrap. FIX-1559 runs beside the router and also feeds FIX-1556.</text>
  </g>
</svg>
