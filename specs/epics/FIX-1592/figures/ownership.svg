<svg viewBox="0 0 940 412" role="img" xmlns="http://www.w3.org/2000/svg"
     aria-label="Who owns what: eight cross-cutting rules by four issues. ER-21, a routed post runs one member: FIX-1610 builds it; FIX-1611 and FIX-1601 consume it. ER-22, the answer lands every time: FIX-1610 builds it; FIX-1611 consumes it. ER-23, the open view is live: FIX-1609 builds it; FIX-1611 and FIX-1601 consume it. ER-3, a seat's post wakes no seat, shipped by FIX-1602: FIX-1610 consumes it. ER-25, a case for a person lands on escalations: FIX-1611 builds it. ER-26, four specialists by purpose: FIX-1611 builds it. ER-27, no check deleted, each re-pointed: FIX-1611 builds it; FIX-1601 consumes it. ER-17, the proof on one main commit: FIX-1601 builds it. Every rule has exactly one owner.">
  <style>
    :root { --surface:#FCFCFA; --surface-2:#E8E8E1; --ink:#191C21; --ink-2:#4C535B; --ink-3:#7A828B;
            --rule:#D5D4CB; --accent:#3E4E8C; --accent-soft:#E0E3F0; --code:#2C7C69; --code-soft:#DCEDE7;
            --prose:#A8761C; --prose-soft:#F3E8D2; --gone:#A9544F; }
    @media (prefers-color-scheme: dark) {
      :root { --surface:#181C1F; --surface-2:#202528; --ink:#E6E8E5; --ink-2:#A4ACB1; --ink-3:#737B81;
              --rule:#2B3135; --accent:#8B9BD8; --accent-soft:#1B2140; --code:#5DBBA1; --code-soft:#14302A;
              --prose:#D9A44B; --prose-soft:#332612; --gone:#DE8A84; } }
    .bg    { fill:var(--surface); }
    .grid  { stroke:var(--rule); stroke-width:1; }
    .own   { fill:var(--code-soft); stroke:var(--code); stroke-width:1.2; }
    .t-lbl { fill:var(--ink-3); font-family:ui-monospace,SFMono-Regular,Menlo,monospace;
             font-size:9.5px; letter-spacing:.1em; }
    .t-col { fill:var(--ink); font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:10px; font-weight:600; }
    .t-sub { fill:var(--ink-3); font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:9px; }
    .t-row { fill:var(--ink); font-family:system-ui,-apple-system,sans-serif; font-size:12px; }
    .t-own { fill:var(--code); font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:10px; font-weight:600; }
    .t-con { fill:var(--ink-2); font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:10px; }
  </style>
  <rect class="bg" x="0" y="0" width="940" height="412"/>
  <text class="t-lbl" x="16" y="20">WHO OWNS WHAT &#183; ONE OWNER PER RULE</text>
  <g id="columns">
    <text class="t-col" x="400" y="46">FIX-1609</text><text class="t-sub" x="400" y="60">live view</text>
    <text class="t-col" x="530" y="46">FIX-1610</text><text class="t-sub" x="530" y="60">routed channel</text>
    <text class="t-col" x="660" y="46">FIX-1611</text><text class="t-sub" x="660" y="60">support rebuild</text>
    <text class="t-col" x="790" y="46">FIX-1601</text><text class="t-sub" x="790" y="60">closure</text>
    <path class="grid" d="M16 70 L924 70"/>
  </g>
  <g id="r1">
    <text class="t-row" x="16" y="94">ER-21 &#183; a routed post runs one member</text>
    <rect class="own" x="522" y="78" width="88" height="24" rx="3"/><text class="t-own" x="532" y="94">builds</text>
    <text class="t-con" x="662" y="94">consumes</text>
    <text class="t-con" x="792" y="94">consumes</text>
    <path class="grid" d="M16 108 L924 108"/>
  </g>
  <g id="r2">
    <text class="t-row" x="16" y="132">ER-22 &#183; the answer lands every time</text>
    <rect class="own" x="522" y="116" width="88" height="24" rx="3"/><text class="t-own" x="532" y="132">builds</text>
    <text class="t-con" x="662" y="132">consumes</text>
    <path class="grid" d="M16 146 L924 146"/>
  </g>
  <g id="r3">
    <text class="t-row" x="16" y="170">ER-23 &#183; the open view is live</text>
    <rect class="own" x="392" y="154" width="88" height="24" rx="3"/><text class="t-own" x="402" y="170">builds</text>
    <text class="t-con" x="662" y="170">consumes</text>
    <text class="t-con" x="792" y="170">consumes</text>
    <path class="grid" d="M16 184 L924 184"/>
  </g>
  <g id="r4">
    <text class="t-row" x="16" y="208">ER-3 &#183; a seat&#8217;s post wakes no seat</text>
    <text class="t-sub" x="238" y="208">shipped &#183; FIX-1602</text>
    <text class="t-con" x="532" y="208">consumes</text>
    <path class="grid" d="M16 222 L924 222"/>
  </g>
  <g id="r5">
    <text class="t-row" x="16" y="246">ER-25 &#183; a case for a person, on escalations</text>
    <rect class="own" x="652" y="230" width="88" height="24" rx="3"/><text class="t-own" x="662" y="246">builds</text>
    <path class="grid" d="M16 260 L924 260"/>
  </g>
  <g id="r6">
    <text class="t-row" x="16" y="284">ER-26 &#183; four specialists by purpose</text>
    <rect class="own" x="652" y="268" width="88" height="24" rx="3"/><text class="t-own" x="662" y="284">builds</text>
    <path class="grid" d="M16 298 L924 298"/>
  </g>
  <g id="r7">
    <text class="t-row" x="16" y="322">ER-27 &#183; no check deleted, each re-pointed</text>
    <rect class="own" x="652" y="306" width="88" height="24" rx="3"/><text class="t-own" x="662" y="322">builds</text>
    <text class="t-con" x="792" y="322">consumes</text>
    <path class="grid" d="M16 336 L924 336"/>
  </g>
  <g id="r8">
    <text class="t-row" x="16" y="360">ER-17 &#183; the proof, on one main commit</text>
    <rect class="own" x="782" y="344" width="88" height="24" rx="3"/><text class="t-own" x="792" y="360">builds</text>
    <path class="grid" d="M16 374 L924 374"/>
  </g>
  <text class="t-sub" x="16" y="394">builds: owns and ships it &#183; consumes: uses it as is, must not re-decide</text>
</svg>
