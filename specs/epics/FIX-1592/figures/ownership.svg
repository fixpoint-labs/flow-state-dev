<svg viewBox="0 0 940 370" role="img" xmlns="http://www.w3.org/2000/svg"
     aria-label="Who owns what: seven cross-cutting rules by three issues. FIX-1585 builds the kept message, decides the kind-to-action map, which FIX-1590 consumes, and decides the scripted model, which FIX-1590 and FIX-1594 consume. FIX-1590 builds the wake of member agent seats and decides the rule that a post a seat wrote wakes no seat, which FIX-1594 consumes. FIX-1594 builds the seat's post, authored as itself, and its line in the channel. Every rule has exactly one owner.">
  <style>
    :root { --surface:#FCFCFA; --surface-2:#E8E8E1; --ink:#191C21; --ink-2:#4C535B; --ink-3:#7A828B;
            --rule:#D5D4CB; --accent:#3E4E8C; --accent-soft:#E0E3F0; --code:#2C7C69; --code-soft:#DCEDE7;
            --prose:#A8761C; --prose-soft:#F3E8D2; --gone:#A9544F; }
    @media (prefers-color-scheme: dark) {
      :root { --surface:#181C1F; --surface-2:#202528; --ink:#E6E8E5; --ink-2:#A4ACB1; --ink-3:#737B81;
              --rule:#2B3135; --accent:#8B9BD8; --accent-soft:#1B2140; --code:#5DBBA1; --code-soft:#14302A;
              --prose:#D9A44B; --prose-soft:#332612; --gone:#DE8A84; } }
    .bg    { fill:var(--surface); }
    .grid  { stroke:var(--rule); stroke-width:1; }
    .own   { fill:var(--code-soft); stroke:var(--code); stroke-width:1.2; }
    .dec   { fill:var(--prose-soft); stroke:var(--prose); stroke-width:1.2; }
    .t-lbl { fill:var(--ink-3); font-family:ui-monospace,SFMono-Regular,Menlo,monospace;
             font-size:9.5px; letter-spacing:.1em; }
    .t-col { fill:var(--ink); font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:10px; font-weight:600; }
    .t-sub { fill:var(--ink-3); font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:9px; }
    .t-row { fill:var(--ink); font-family:system-ui,-apple-system,sans-serif; font-size:12px; }
    .t-own { fill:var(--code); font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:10px; font-weight:600; }
    .t-dec { fill:var(--prose); font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:10px; font-weight:600; }
    .t-con { fill:var(--ink-2); font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:10px; }
  </style>
  <rect class="bg" x="0" y="0" width="940" height="370"/>
  <text class="t-lbl" x="16" y="20">WHO OWNS WHAT &#183; ONE OWNER PER RULE</text>
  <g id="columns">
    <text class="t-col" x="440" y="46">FIX-1585</text><text class="t-sub" x="440" y="60">talk from the page</text>
    <text class="t-col" x="600" y="46">FIX-1590</text><text class="t-sub" x="600" y="60">a post reaches agents</text>
    <text class="t-col" x="760" y="46">FIX-1594</text><text class="t-sub" x="760" y="60">an agent replies in it</text>
    <path class="grid" d="M16 70 L924 70"/>
  </g>
  <g id="r1">
    <text class="t-row" x="16" y="94">ER-1 &#183; the seat keeps your message</text>
    <rect class="own" x="432" y="78" width="88" height="24" rx="3"/><text class="t-own" x="442" y="94">builds</text>
    <path class="grid" d="M16 108 L924 108"/>
  </g>
  <g id="r2">
    <text class="t-row" x="16" y="132">ER-6 &#183; one kind-to-action map</text>
    <rect class="dec" x="432" y="116" width="88" height="24" rx="3"/><text class="t-dec" x="442" y="132">decides</text>
    <text class="t-con" x="602" y="132">consumes</text>
    <path class="grid" d="M16 146 L924 146"/>
  </g>
  <g id="r3">
    <text class="t-row" x="16" y="170">ER-7 &#183; one scripted model, drives agent seats</text>
    <rect class="dec" x="432" y="154" width="88" height="24" rx="3"/><text class="t-dec" x="442" y="170">decides</text>
    <text class="t-con" x="602" y="170">consumes</text>
    <text class="t-con" x="762" y="170">consumes</text>
    <path class="grid" d="M16 184 L924 184"/>
  </g>
  <g id="r4">
    <text class="t-row" x="16" y="208">ER-2 &#183; a post runs each member agent once</text>
    <rect class="own" x="592" y="192" width="88" height="24" rx="3"/><text class="t-own" x="602" y="208">builds</text>
    <path class="grid" d="M16 222 L924 222"/>
  </g>
  <g id="r5">
    <text class="t-row" x="16" y="246">ER-3 &#183; a seat's post wakes no seat (D2)</text>
    <rect class="dec" x="592" y="230" width="88" height="24" rx="3"/><text class="t-dec" x="602" y="246">decides</text>
    <text class="t-con" x="762" y="246">consumes</text>
    <path class="grid" d="M16 260 L924 260"/>
  </g>
  <g id="r6">
    <text class="t-row" x="16" y="284">ER-4 &#183; a seat posts as itself, to its channels</text>
    <rect class="own" x="752" y="268" width="88" height="24" rx="3"/><text class="t-own" x="762" y="284">builds</text>
    <path class="grid" d="M16 298 L924 298"/>
  </g>
  <g id="r7">
    <text class="t-row" x="16" y="322">ER-5 &#183; its line shows under its name</text>
    <rect class="own" x="752" y="306" width="88" height="24" rx="3"/><text class="t-own" x="762" y="322">builds</text>
    <path class="grid" d="M16 336 L924 336"/>
  </g>
  <text class="t-sub" x="16" y="358">builds: owns and ships it &#183; decides: owns the call another column builds on &#183; consumes: uses it as is, must not re-decide</text>
</svg>
