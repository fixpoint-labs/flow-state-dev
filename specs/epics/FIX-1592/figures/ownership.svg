<svg viewBox="0 0 940 448" role="img" xmlns="http://www.w3.org/2000/svg"
     aria-label="Who owns what: nine cross-cutting rules by five issues. ER-21, a routed post runs one member: the routed channel builds it; the rebuild and FIX-1601 consume it. ER-24, what a woken specialist hears: the routed channel decides it; FIX-1610 consumes it. ER-22, the answer lands every time: FIX-1610 builds it; the rebuild consumes it. ER-23, the open view is live: FIX-1609 builds it; the rebuild and FIX-1601 consume it. ER-3, a seat's post wakes no seat, shipped by FIX-1602: the routed channel and FIX-1610 consume it. ER-25, a case for a person lands on escalations: the rebuild builds it. ER-26, four specialists by purpose: the rebuild builds it. ER-27, no check deleted, each re-pointed: the rebuild builds it; FIX-1601 consumes it. ER-17, the proof on one main commit: FIX-1601 builds it. Every rule has exactly one owner.">
  <style>
    :root { --surface:#FCFCFA; --surface-2:#E8E8E1; --ink:#191C21; --ink-2:#4C535B; --ink-3:#7A828B;
            --rule:#D5D4CB; --accent:#3E4E8C; --accent-soft:#E0E3F0; --code:#2C7C69; --code-soft:#DCEDE7;
            --prose:#A8761C; --prose-soft:#F3E8D2; --gone:#A9544F; }
    @media (prefers-color-scheme: dark) {
      :root { --surface:#181C1F; --surface-2:#202528; --ink:#E6E8E5; --ink-2:#A4ACB1; --ink-3:#737B81;
              --rule:#2B3135; --accent:#8B9BD8; --accent-soft:#1B2140; --code:#5DBBA1; --code-soft:#14302A;
              --prose:#D9A44B; --prose-soft:#332612; --gone:#DE8A84; } }
    .bg    { fill:var(--surface); }
    .grid  { stroke:var(--rule); stroke-width:1; }
    .own   { fill:var(--code-soft); stroke:var(--code); stroke-width:1.2; }
    .dec   { fill:var(--prose-soft); stroke:var(--prose); stroke-width:1.2; }
    .t-lbl { fill:var(--ink-3); font-family:ui-monospace,SFMono-Regular,Menlo,monospace;
             font-size:9.5px; letter-spacing:.1em; }
    .t-col { fill:var(--ink); font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:10px; font-weight:600; }
    .t-sub { fill:var(--ink-3); font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:9px; }
    .t-row { fill:var(--ink); font-family:system-ui,-apple-system,sans-serif; font-size:12px; }
    .t-own { fill:var(--code); font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:10px; font-weight:600; }
    .t-dec { fill:var(--prose); font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:10px; font-weight:600; }
    .t-con { fill:var(--ink-2); font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:10px; }
  </style>
  <rect class="bg" x="0" y="0" width="940" height="448"/>
  <text class="t-lbl" x="16" y="20">WHO OWNS WHAT &#183; ONE OWNER PER RULE</text>
  <g id="columns">
    <text class="t-col" x="376" y="46">FIX-1609</text><text class="t-sub" x="376" y="60">live view</text>
    <text class="t-col" x="486" y="46">FIX-XXX</text><text class="t-sub" x="486" y="60">routed channel</text>
    <text class="t-col" x="596" y="46">FIX-1610</text><text class="t-sub" x="596" y="60">answer lands</text>
    <text class="t-col" x="706" y="46">FIX-XXX</text><text class="t-sub" x="706" y="60">support rebuild</text>
    <text class="t-col" x="816" y="46">FIX-1601</text><text class="t-sub" x="816" y="60">closure</text>
    <path class="grid" d="M16 70 L924 70"/>
  </g>
  <g id="r1">
    <text class="t-row" x="16" y="94">ER-21 &#183; a routed post runs one member</text>
    <rect class="own" x="478" y="78" width="88" height="24" rx="3"/><text class="t-own" x="488" y="94">builds</text>
    <text class="t-con" x="708" y="94">consumes</text>
    <text class="t-con" x="818" y="94">consumes</text>
    <path class="grid" d="M16 108 L924 108"/>
  </g>
  <g id="r2">
    <text class="t-row" x="16" y="132">ER-24 &#183; what a woken specialist hears</text>
    <rect class="dec" x="478" y="116" width="88" height="24" rx="3"/><text class="t-dec" x="488" y="132">decides</text>
    <text class="t-con" x="598" y="132">consumes</text>
    <path class="grid" d="M16 146 L924 146"/>
  </g>
  <g id="r3">
    <text class="t-row" x="16" y="170">ER-22 &#183; the answer lands every time</text>
    <rect class="own" x="588" y="154" width="88" height="24" rx="3"/><text class="t-own" x="598" y="170">builds</text>
    <text class="t-con" x="708" y="170">consumes</text>
    <path class="grid" d="M16 184 L924 184"/>
  </g>
  <g id="r4">
    <text class="t-row" x="16" y="208">ER-23 &#183; the open view is live</text>
    <rect class="own" x="368" y="192" width="88" height="24" rx="3"/><text class="t-own" x="378" y="208">builds</text>
    <text class="t-con" x="708" y="208">consumes</text>
    <text class="t-con" x="818" y="208">consumes</text>
    <path class="grid" d="M16 222 L924 222"/>
  </g>
  <g id="r5">
    <text class="t-row" x="16" y="246">ER-3 &#183; a seat&#8217;s post wakes no seat</text>
    <text class="t-sub" x="238" y="246">shipped &#183; FIX-1602</text>
    <text class="t-con" x="488" y="246">consumes</text>
    <text class="t-con" x="598" y="246">consumes</text>
    <path class="grid" d="M16 260 L924 260"/>
  </g>
  <g id="r6">
    <text class="t-row" x="16" y="284">ER-25 &#183; a case for a person, on escalations</text>
    <rect class="own" x="698" y="268" width="88" height="24" rx="3"/><text class="t-own" x="708" y="284">builds</text>
    <path class="grid" d="M16 298 L924 298"/>
  </g>
  <g id="r7">
    <text class="t-row" x="16" y="322">ER-26 &#183; four specialists by purpose</text>
    <rect class="own" x="698" y="306" width="88" height="24" rx="3"/><text class="t-own" x="708" y="322">builds</text>
    <path class="grid" d="M16 336 L924 336"/>
  </g>
  <g id="r8">
    <text class="t-row" x="16" y="360">ER-27 &#183; no check deleted, each re-pointed</text>
    <rect class="own" x="698" y="344" width="88" height="24" rx="3"/><text class="t-own" x="708" y="360">builds</text>
    <text class="t-con" x="818" y="360">consumes</text>
    <path class="grid" d="M16 374 L924 374"/>
  </g>
  <g id="r9">
    <text class="t-row" x="16" y="398">ER-17 &#183; the proof, on one main commit</text>
    <rect class="own" x="808" y="382" width="88" height="24" rx="3"/><text class="t-own" x="818" y="398">builds</text>
    <path class="grid" d="M16 412 L924 412"/>
  </g>
  <text class="t-sub" x="16" y="432">builds: owns and ships it &#183; decides: owns the call another column builds on &#183; consumes: uses it as is, must not re-decide &#183; FIX-XXX: not filed yet</text>
</svg>
