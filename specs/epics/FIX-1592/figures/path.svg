    <rect class="flight" x="232" y="134" width="80" height="18" rx="3"/>
    <text class="t-s" x="240" y="147">spec #2258</text>
    <rect class="todo" x="318" y="134" width="80" height="18" rx="3"/>
    <text class="t-s" x="326" y="147">impl PR</text>
  </g>
  <g id="l-1589">
    <text class="t-ln" x="16" y="186">FIX-1589 &#183; the clerk answers</text>
    <rect class="todo" x="412" y="174" width="124" height="18" rx="3"/>
    <text class="t-s" x="420" y="187">spec &#8594; build</text>
  </g>
  <g id="l-1590">
    <text class="t-ln" x="16" y="226">FIX-1590 &#183; a post reaches agents</text>
    <rect class="todo" x="552" y="214" width="144" height="18" rx="3"/>
    <text class="t-s" x="560" y="227">spec &#8594; build</text>
  </g>
  <g id="l-1594">
    <text class="t-ln" x="16" y="266">FIX-1594 &#183; an agent replies</text>
    <rect class="todo" x="712" y="254" width="128" height="18" rx="3"/>
    <text class="t-s" x="720" y="267">spec &#8594; build &#183; README</text>
  </g>
  <g id="l-1601">
    <text class="t-ln" x="16" y="306">FIX-1601 &#183; closure PR &#8594; wrap</text>
    <rect class="todo" x="232" y="294" width="80" height="18" rx="3"/>
    <text class="t-s" x="240" y="307">QA plan</text>
    <rect class="todo" x="852" y="294" width="64" height="18" rx="3"/>
    <text class="t-s" x="860" y="307">run &#8594; PR</text>
  </g>
  <path class="axis" d="M16 322 L924 322"/>
  <g id="l-1591">
    <text class="t-ln" x="16" y="344">FIX-1591 &#183; the boards</text>
    <text class="t-s" x="412" y="344">held for the owner's escalations call &#183; not a child &#183; on no chain</text>
  </g>

  <g id="critical">
    <path class="crit" d="M398 143 L404 143 L404 183 L412 183"/>
    <path class="crit" d="M536 183 L544 183 L544 223 L552 223"/>
    <path class="crit" d="M696 223 L704 223 L704 263 L712 263"/>
    <path class="crit" d="M840 263 L846 263 L846 303 L852 303"/>
    <text class="t-g" x="16" y="386">Critical path: FIX-1459 &#8594; FIX-1585 impl &#8594; FIX-1589 &#8594; FIX-1590 &#8594; FIX-1594 &#8594; FIX-1601 closure PR merged &#8594; wrap.</text>
    <text class="t-in" x="16" y="400">Amber lines: FIX-1459 gates the two builds that edit agent-worker-flow.ts; FIX-1598 gates the closure run. Specs may start early.</text>
  </g>
</svg>
