<svg viewBox="0 0 940 412" role="img" xmlns="http://www.w3.org/2000/svg"
     aria-label="The path as of 27 September 2026, drawn in steps rather than dates because the epic is unscheduled. Shipped: seven children, FIX-1585 through FIX-1602 with FIX-1603 and FIX-1604, merged. Now: this amendment in review; no child starts until it merges. FIX-1605 and FIX-1606 have fix PRs open and can land any time. Step 1, in parallel: FIX-1609, the live channel view, the longest bar; FIX-1610, the routed channel whose answer always lands, with a routing POC before it is built; FIX-1601's QA-plan amendment. Step 2: FIX-1611, the support desk rebuild, after both FIX-1609 and FIX-1610. Step 3: FIX-1601's run on one main commit, then its closure PR, whose merge releases wrap. FIX-1591, the boards, sits below the chain as held. The critical path runs from whichever of FIX-1609 and FIX-1610 lands second, through FIX-1611, to FIX-1601's run and wrap.">
  <style>
    :root { --surface:#FCFCFA; --surface-2:#E8E8E1; --ink:#191C21; --ink-2:#4C535B; --ink-3:#7A828B;
            --rule:#D5D4CB; --accent:#3E4E8C; --accent-soft:#E0E3F0; --code:#2C7C69; --code-soft:#DCEDE7;
            --prose:#A8761C; --prose-soft:#F3E8D2; --gone:#A9544F; }
    @media (prefers-color-scheme: dark) {
      :root { --surface:#181C1F; --surface-2:#202528; --ink:#E6E8E5; --ink-2:#A4ACB1; --ink-3:#737B81;
              --rule:#2B3135; --accent:#8B9BD8; --accent-soft:#1B2140; --code:#5DBBA1; --code-soft:#14302A;
              --prose:#D9A44B; --prose-soft:#332612; --gone:#DE8A84; } }
    .bg     { fill:var(--surface); }
    .flight { fill:var(--accent-soft); stroke:var(--accent); stroke-width:1.2; }
    .done   { fill:var(--code-soft); stroke:var(--code); stroke-width:1.2; }
    .todo   { fill:none; stroke:var(--ink-3); stroke-width:1.2; stroke-dasharray:4 3; }
    .axis   { stroke:var(--rule); stroke-width:1; }
    .tick   { stroke:var(--rule); stroke-width:1; stroke-dasharray:2 3; }
    .now    { stroke:var(--gone); stroke-width:1.4; }
    .crit   { fill:none; stroke:var(--gone); stroke-width:1.2; stroke-dasharray:3 3; }
    .t-lbl  { fill:var(--ink-3); font-family:ui-monospace,SFMono-Regular,Menlo,monospace;
              font-size:9.5px; letter-spacing:.1em; }
    .t-ln   { fill:var(--ink); font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:10px; }
    .t-s    { fill:var(--ink-2); font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:9px; }
    .t-in   { fill:var(--prose); font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:9px; }
    .t-now  { fill:var(--gone); font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:9.5px; }
    .t-g    { fill:var(--gone); font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:9px; }
  </style>
  <rect class="bg" x="0" y="0" width="940" height="412"/>
  <text class="t-lbl" x="16" y="18">THE PATH &#183; AS OF 27 SEP 2026 &#183; UNSCHEDULED, SO THE AXIS IS ORDER, NOT DATES</text>

  <g id="axis">
    <path class="axis" d="M232 44 L924 44"/>
    <text class="t-s" x="232" y="36">shipped</text>
    <path class="tick" d="M364 44 L364 332"/>
    <text class="t-s" x="370" y="36">step 1</text>
    <path class="tick" d="M572 44 L572 332"/>
    <text class="t-s" x="578" y="36">step 2</text>
    <path class="tick" d="M728 44 L728 332"/>
    <text class="t-s" x="734" y="36">step 3</text>
    <path class="now" d="M336 52 L336 332"/>
    <text class="t-now" x="312" y="36">now</text>
  </g>

  <g id="shipped">
    <text class="t-ln" x="16" y="72">shipped &#183; 7 children</text>
    <rect class="done" x="232" y="60" width="64" height="18" rx="3"/>
    <text class="t-s" x="238" y="73">merged</text>
    <text class="t-s" x="370" y="73">done before this amendment: 1585 &#183; 1589 &#183; 1590 &#183; 1594 &#183; 1602 &#183; 1603 &#183; 1604</text>
  </g>
  <g id="amendment">
    <text class="t-ln" x="16" y="97">this amendment</text>
    <rect class="flight" x="300" y="84" width="56" height="18" rx="3"/>
    <text class="t-s" x="306" y="97">review</text>
    <text class="t-in" x="370" y="97">nothing new starts until it merges</text>
  </g>
  <path class="axis" d="M16 114 L924 114"/>

  <g id="l-1609">
    <text class="t-ln" x="16" y="146">FIX-1609 &#183; live channel view</text>
    <rect class="todo" x="368" y="134" width="188" height="18" rx="3"/>
    <text class="t-s" x="374" y="147">spec &#8594; impl &#183; framework</text>
  </g>
  <g id="l-1610">
    <text class="t-ln" x="16" y="186">FIX-1610 &#183; routed channel</text>
    <rect class="todo" x="368" y="174" width="156" height="18" rx="3"/>
    <text class="t-s" x="374" y="187">POC &#8594; spec &#8594; impl</text>
  </g>
  <g id="l-1605">
    <text class="t-ln" x="16" y="226">FIX-1605 &#183; FIX-1606 &#183; bugs</text>
    <rect class="flight" x="300" y="214" width="100" height="18" rx="3"/>
    <text class="t-s" x="306" y="227">#2306 &#183; #2305</text>
  </g>
  <g id="l-1611">
    <text class="t-ln" x="16" y="266">FIX-1611 &#183; support rebuild</text>
    <rect class="todo" x="576" y="254" width="136" height="18" rx="3"/>
    <text class="t-s" x="582" y="267">build &#183; re-point</text>
  </g>
  <g id="l-1601">
    <text class="t-ln" x="16" y="306">FIX-1601 &#183; closure &#8594; wrap</text>
    <rect class="done" x="232" y="294" width="64" height="18" rx="3"/>
    <text class="t-s" x="238" y="307">QA plan</text>
    <rect class="todo" x="368" y="294" width="96" height="18" rx="3"/>
    <text class="t-s" x="374" y="307">plan amend</text>
    <rect class="todo" x="732" y="294" width="120" height="18" rx="3"/>
    <text class="t-s" x="738" y="307">run &#8594; PR &#8594; wrap</text>
  </g>
  <path class="axis" d="M16 332 L924 332"/>
  <g id="l-1591">
    <text class="t-ln" x="16" y="352">FIX-1591 &#183; the boards</text>
    <text class="t-s" x="232" y="352">held for the owner's escalations call &#183; not a child &#183; on no chain</text>
  </g>

  <g id="links">
    <path class="crit" d="M556 143 L566 143 L566 263 L576 263"/>
    <path class="crit" d="M524 183 L566 183"/>
    <path class="crit" d="M712 263 L722 263 L722 303 L732 303"/>
  </g>
  <text class="t-g" x="16" y="380">Critical path: the later of FIX-1609 and FIX-1610 &#8594; FIX-1611 &#8594; FIX-1601 run on one main commit &#8594; closure PR merged &#8594; wrap.</text>
  <text class="t-in" x="16" y="396">FIX-1611 waits for both FIX-1609 and FIX-1610. Green bars are merged; dashed bars are not started.</text>
</svg>
