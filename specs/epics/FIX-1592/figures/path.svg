<svg viewBox="0 0 940 270" role="img" xmlns="http://www.w3.org/2000/svg"
     aria-label="The path as of 25 September 2026, drawn in steps rather than dates because the epic is unscheduled. Input lane: FIX-1459, PACKAGE.md, in development on another thread; every edit to agent-worker-flow.ts waits for it, so it gates FIX-1585's implementation and FIX-1590. Step 1: FIX-1585, its spec in review and folding the kept message, then its implementation; the now line sits inside its spec bar. Step 2: FIX-1590, a post reaches its agents. Step 3: FIX-1594, an agent replies in the channel. Then wrap. The critical path runs through FIX-1459 and the whole chain to wrap.">
  <style>
    :root { --surface:#FCFCFA; --surface-2:#E8E8E1; --ink:#191C21; --ink-2:#4C535B; --ink-3:#7A828B;
            --rule:#D5D4CB; --accent:#3E4E8C; --accent-soft:#E0E3F0; --code:#2C7C69; --code-soft:#DCEDE7;
            --prose:#A8761C; --prose-soft:#F3E8D2; --gone:#A9544F; }
    @media (prefers-color-scheme: dark) {
      :root { --surface:#181C1F; --surface-2:#202528; --ink:#E6E8E5; --ink-2:#A4ACB1; --ink-3:#737B81;
              --rule:#2B3135; --accent:#8B9BD8; --accent-soft:#1B2140; --code:#5DBBA1; --code-soft:#14302A;
              --prose:#D9A44B; --prose-soft:#332612; --gone:#DE8A84; } }
    .bg     { fill:var(--surface); }
    .flight { fill:var(--accent-soft); stroke:var(--accent); stroke-width:1.2; }
    .input  { fill:var(--prose-soft); stroke:var(--prose); stroke-width:1.2; }
    .todo   { fill:none; stroke:var(--ink-3); stroke-width:1.2; stroke-dasharray:4 3; }
    .axis   { stroke:var(--rule); stroke-width:1; }
    .tick   { stroke:var(--rule); stroke-width:1; stroke-dasharray:2 3; }
    .gate   { fill:none; stroke:var(--prose); stroke-width:1.2; }
    .now    { stroke:var(--gone); stroke-width:1.4; }
    .crit   { fill:none; stroke:var(--gone); stroke-width:1.2; stroke-dasharray:3 3; }
    .t-lbl  { fill:var(--ink-3); font-family:ui-monospace,SFMono-Regular,Menlo,monospace;
              font-size:9.5px; letter-spacing:.1em; }
    .t-ln   { fill:var(--ink); font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:10px; }
    .t-s    { fill:var(--ink-2); font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:9px; }
    .t-in   { fill:var(--prose); font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:9px; }
    .t-now  { fill:var(--gone); font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:9.5px; }
    .t-g    { fill:var(--gone); font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:9px; }
  </style>
  <rect class="bg" x="0" y="0" width="940" height="270"/>
  <text class="t-lbl" x="16" y="18">THE PATH &#183; AS OF 25 SEP 2026 &#183; UNSCHEDULED, SO THE AXIS IS ORDER, NOT DATES</text>

  <g id="axis">
    <path class="axis" d="M232 44 L924 44"/>
    <text class="t-s" x="232" y="36">step 1</text>
    <path class="tick" d="M444 44 L444 220"/>
    <text class="t-s" x="452" y="36">step 2</text>
    <path class="tick" d="M624 44 L624 220"/>
    <text class="t-s" x="632" y="36">step 3</text>
    <path class="tick" d="M824 44 L824 220"/>
    <text class="t-s" x="832" y="36">wrap</text>
    <path class="now" d="M300 104 L300 220"/>
    <text class="t-now" x="296" y="232" text-anchor="end">now</text>
  </g>

  <g id="in-1459">
    <text class="t-ln" x="16" y="72">FIX-1459 &#183; PACKAGE.md</text>
    <rect class="input" x="232" y="60" width="100" height="18" rx="3"/>
    <text class="t-in" x="240" y="73">in development</text>
    <text class="t-in" x="548" y="73">input &#183; another thread &#183; frees agent-worker-flow.ts</text>
    <path class="gate" d="M332 69 L388 69 L388 110"/>
    <path class="gate" d="M388 69 L534 69 L534 150"/>
  </g>
  <path class="axis" d="M16 90 L924 90"/>

  <g id="l-1585">
    <text class="t-ln" x="16" y="122">FIX-1585 &#183; talk from the page</text>
    <rect class="flight" x="232" y="110" width="100" height="18" rx="3"/>
    <text class="t-s" x="240" y="123">spec #2258</text>
    <rect class="todo" x="340" y="110" width="96" height="18" rx="3"/>
    <text class="t-s" x="348" y="123">impl PR</text>
  </g>
  <g id="l-1590">
    <text class="t-ln" x="16" y="162">FIX-1590 &#183; a post reaches agents</text>
    <rect class="todo" x="452" y="150" width="164" height="18" rx="3"/>
    <text class="t-s" x="460" y="163">spec &#8594; build</text>
  </g>
  <g id="l-1594">
    <text class="t-ln" x="16" y="202">FIX-1594 &#183; an agent replies</text>
    <rect class="todo" x="632" y="190" width="184" height="18" rx="3"/>
    <text class="t-s" x="640" y="203">spec &#8594; build &#183; README</text>
    <text class="t-g" x="832" y="203">proof holds</text>
  </g>

  <g id="critical">
    <path class="crit" d="M436 119 L444 119 L444 159 L452 159"/>
    <path class="crit" d="M616 159 L624 159 L624 199 L632 199"/>
    <path class="crit" d="M816 199 L832 199"/>
    <text class="t-g" x="16" y="256">Critical path: FIX-1459 &#8594; FIX-1585 impl &#8594; FIX-1590 &#8594; FIX-1594 &#8594; wrap. Amber lines: FIX-1459 gates each edit of agent-worker-flow.ts.</text>
  </g>
</svg>
