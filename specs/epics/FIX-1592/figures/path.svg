<svg viewBox="0 0 940 452" role="img" xmlns="http://www.w3.org/2000/svg"
     aria-label="The path as of 26 September 2026, drawn in steps rather than dates because the epic is unscheduled. Input lane: FIX-1459, PACKAGE.md, done; it freed agent-worker-flow.ts. FIX-1598, the durable-hire goal check, its fix in review; it gates the closure run. Step 1: FIX-1585, spec and implementation merged. Step 2: FIX-1589, the clerk answers, merged. Step 3: FIX-1590, a post reaches its agents, its implementation PR in review; the now line sits inside that bar, and inside FIX-1602&#39;s spec, being written. Step 4: FIX-1594, an agent replies in the channel. Step 5: FIX-1602, Workforce&#39;s stock notify fan-out, built once FIX-1590 and FIX-1594 merge; kitchen-sink moves onto it. Step 6: FIX-1601, the closure issue; its QA plan is merged, its run waits for every other child and FIX-1598; a clean run opens the closure PR, and that PR&#39;s merge releases wrap. FIX-1591, the boards, sits below the chain as held, with no bar. The critical path runs from FIX-1590&#39;s implementation through FIX-1594, FIX-1602 and FIX-1601&#39;s closure PR to wrap.">
  <style>
    :root { --surface:#FCFCFA; --surface-2:#E8E8E1; --ink:#191C21; --ink-2:#4C535B; --ink-3:#7A828B;
            --rule:#D5D4CB; --accent:#3E4E8C; --accent-soft:#E0E3F0; --code:#2C7C69; --code-soft:#DCEDE7;
            --prose:#A8761C; --prose-soft:#F3E8D2; --gone:#A9544F; }
    @media (prefers-color-scheme: dark) {
      :root { --surface:#181C1F; --surface-2:#202528; --ink:#E6E8E5; --ink-2:#A4ACB1; --ink-3:#737B81;
              --rule:#2B3135; --accent:#8B9BD8; --accent-soft:#1B2140; --code:#5DBBA1; --code-soft:#14302A;
              --prose:#D9A44B; --prose-soft:#332612; --gone:#DE8A84; } }
    .bg     { fill:var(--surface); }
    .flight { fill:var(--accent-soft); stroke:var(--accent); stroke-width:1.2; }
    .input  { fill:var(--prose-soft); stroke:var(--prose); stroke-width:1.2; }
    .done   { fill:var(--code-soft); stroke:var(--code); stroke-width:1.2; }
    .todo   { fill:none; stroke:var(--ink-3); stroke-width:1.2; stroke-dasharray:4 3; }
    .axis   { stroke:var(--rule); stroke-width:1; }
    .tick   { stroke:var(--rule); stroke-width:1; stroke-dasharray:2 3; }
    .gate   { fill:none; stroke:var(--prose); stroke-width:1.2; }
    .now    { stroke:var(--gone); stroke-width:1.4; }
    .crit   { fill:none; stroke:var(--gone); stroke-width:1.2; stroke-dasharray:3 3; }
    .t-lbl  { fill:var(--ink-3); font-family:ui-monospace,SFMono-Regular,Menlo,monospace;
              font-size:9.5px; letter-spacing:.1em; }
    .t-ln   { fill:var(--ink); font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:10px; }
    .t-s    { fill:var(--ink-2); font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:9px; }
    .t-in   { fill:var(--prose); font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:9px; }
    .t-now  { fill:var(--gone); font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:9.5px; }
    .t-g    { fill:var(--gone); font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:9px; }
  </style>
