    <text class="t-in" x="238" y="73">in development</text>
    <text class="t-in" x="616" y="73">input &#183; another thread &#183; frees agent-worker-flow.ts</text>
    <path class="gate" d="M332 69 L356 69 L356 134"/>
    <path class="gate" d="M356 69 L604 69 L604 214"/>
  </g>
  <g id="in-1598">
