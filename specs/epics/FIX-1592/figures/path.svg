<svg viewBox="0 0 940 412" role="img" xmlns="http://www.w3.org/2000/svg"
     aria-label="The path as of 25 September 2026, drawn in steps rather than dates because the epic is unscheduled. Input lane: FIX-1459, PACKAGE.md, in development on another thread; it gates FIX-1585's implementation and FIX-1590, the two that edit agent-worker-flow.ts. FIX-1598, the durable-hire goal check, red on main; it gates the closure run. Step 1: FIX-1585, its spec in review, then its implementation; the now line sits inside the spec bar. Step 2: FIX-1589, the clerk answers. Step 3: FIX-1590, a post reaches its agents. Step 4: FIX-1594, an agent replies in the channel. Step 5: FIX-1601, the closure issue; its QA plan may be written from step 1, its run waits for the other four and FIX-1598; a clean run opens the closure PR, and that PR's merge releases wrap. FIX-1591, the boards, sits below the chain as held, with no bar. The critical path runs from FIX-1459 through FIX-1585's implementation, FIX-1589, FIX-1590, FIX-1594 and FIX-1601's closure PR to wrap.">
  <style>
    :root { --surface:#FCFCFA; --surface-2:#E8E8E1; --ink:#191C21; --ink-2:#4C535B; --ink-3:#7A828B;
            --rule:#D5D4CB; --accent:#3E4E8C; --accent-soft:#E0E3F0; --code:#2C7C69; --code-soft:#DCEDE7;
            --prose:#A8761C; --prose-soft:#F3E8D2; --gone:#A9544F; }
    @media (prefers-color-scheme: dark) {
      :root { --surface:#181C1F; --surface-2:#202528; --ink:#E6E8E5; --ink-2:#A4ACB1; --ink-3:#737B81;
              --rule:#2B3135; --accent:#8B9BD8; --accent-soft:#1B2140; --code:#5DBBA1; --code-soft:#14302A;
              --prose:#D9A44B; --prose-soft:#332612; --gone:#DE8A84; } }
    .bg     { fill:var(--surface); }
    .flight { fill:var(--accent-soft); stroke:var(--accent); stroke-width:1.2; }
    .input  { fill:var(--prose-soft); stroke:var(--prose); stroke-width:1.2; }
    .todo   { fill:none; stroke:var(--ink-3); stroke-width:1.2; stroke-dasharray:4 3; }
    .axis   { stroke:var(--rule); stroke-width:1; }
    .tick   { stroke:var(--rule); stroke-width:1; stroke-dasharray:2 3; }
    .gate   { fill:none; stroke:var(--prose); stroke-width:1.2; }
    .now    { stroke:var(--gone); stroke-width:1.4; }
    .crit   { fill:none; stroke:var(--gone); stroke-width:1.2; stroke-dasharray:3 3; }
    .t-lbl  { fill:var(--ink-3); font-family:ui-monospace,SFMono-Regular,Menlo,monospace;
              font-size:9.5px; letter-spacing:.1em; }
    .t-ln   { fill:var(--ink); font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:10px; }
    .t-s    { fill:var(--ink-2); font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:9px; }
    .t-in   { fill:var(--prose); font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:9px; }
    .t-now  { fill:var(--gone); font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:9.5px; }
    .t-g    { fill:var(--gone); font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:9px; }
  </style>
    <rect class="bg" x="0" y="0" width="940" height="412"/>
  <text class="t-lbl" x="16" y="18">THE PATH &#183; AS OF 25 SEP 2026 &#183; UNSCHEDULED, SO THE AXIS IS ORDER, NOT DATES</text>

  <g id="axis">
    <path class="axis" d="M232 44 L924 44"/>
    <text class="t-s" x="232" y="36">step 1</text>
    <path class="tick" d="M404 44 L404 352"/>
    <text class="t-s" x="412" y="36">step 2</text>
    <path class="tick" d="M544 44 L544 352"/>
    <text class="t-s" x="552" y="36">step 3</text>
    <path class="tick" d="M704 44 L704 352"/>
    <text class="t-s" x="712" y="36">step 4</text>
    <path class="tick" d="M844 44 L844 352"/>
    <text class="t-s" x="852" y="36">step 5</text>
    <path class="now" d="M290 128 L290 352"/>
    <text class="t-now" x="286" y="364" text-anchor="end">now</text>
  </g>

  <g id="in-1459">
