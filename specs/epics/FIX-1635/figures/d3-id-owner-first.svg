<svg viewBox="0 0 940 420" role="img" aria-label="D3, which principal fix goes first. Chosen: FIX-1018 binds a caller&#x27;s request id to its owner first. Instead of: FIX-1286 deciding the principal question first in a spec, or giving the run workspace its own user key. It comes down to the first row: FIX-1018 is a confirmed cross-user read, and its fix answers FIX-1286&#x27;s question, while a spec first holds the leak open and a user key leaves it open. The price is the second row: FIX-1286 and FIX-1634 wait on FIX-1018 to implement. Third row, a tie: caller-supplied request ids keep working for idempotency in all three options. Locks in the binding as the one principal rule. Flips if the shared workspace survives per-owner request records."
     xmlns="http://www.w3.org/2000/svg">
  <style>
    :root { --surface:#FCFCFA; --surface-2:#E8E8E1; --ink:#191C21; --ink-2:#4C535B; --ink-3:#7A828B;
            --rule:#D5D4CB; --accent:#3E4E8C; --accent-soft:#E0E3F0; --code:#2C7C69; --code-soft:#DCEDE7;
            --gone:#A9544F; }
    @media (prefers-color-scheme: dark) {
      :root { --surface:#181C1F; --surface-2:#202528; --ink:#E6E8E5; --ink-2:#A4ACB1; --ink-3:#737B81;
              --rule:#2B3135; --accent:#8B9BD8; --accent-soft:#1B2140; --code:#5DBBA1; --code-soft:#14302A;
              --gone:#DE8A84; } }
    .bg     { fill:var(--surface); }
    .ask    { fill:var(--surface-2); }
    .chosen { fill:var(--code-soft); stroke:var(--code); stroke-width:1.6; }
    .lost   { fill:var(--surface); stroke:var(--rule); stroke-width:1.4; stroke-dasharray:5 4; }
    .decide { fill:var(--accent-soft); }
    .bar    { fill:var(--accent); }
    .row    { stroke:var(--rule); stroke-width:1; }
    .foot   { fill:var(--surface-2); }
    .t-lbl  { fill:var(--ink-3); font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:9.5px; letter-spacing:.1em; }
    .t-tag  { font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:9.5px; letter-spacing:.1em; font-weight:600; }
    .t-q    { fill:var(--ink); font-family:system-ui,-apple-system,sans-serif; font-weight:600; font-size:15px; }
    .t-h    { font-family:system-ui,-apple-system,sans-serif; font-weight:600; font-size:14px; }
    .t-b    { fill:var(--ink); font-family:system-ui,-apple-system,sans-serif; font-size:12.5px; }
    .t-s    { fill:var(--ink-2); font-family:system-ui,-apple-system,sans-serif; font-size:11px; }
    .mark   { font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:16px; font-weight:700; }
    .plus   { fill:var(--code); }
    .minus  { fill:var(--gone); }
    .tie    { fill:var(--ink-3); }
    .c-code { fill:var(--code); }
    .c-mute { fill:var(--ink-3); }
    .c-lost { fill:var(--ink-2); }
    .c-acc  { fill:var(--accent); }
  </style>
  <rect class="bg" x="0" y="0" width="940" height="420"/>

  <g id="the-call">
    <rect class="ask" x="16" y="14" width="908" height="48" rx="6"/>
    <text class="t-lbl" x="32" y="32">D3 · THE CALL</text>
    <text class="t-q" x="32" y="52">Which principal fix goes first?</text>
  </g>

  <g id="options">
    <rect class="chosen" x="212" y="76" width="224" height="46" rx="5"/>
    <text class="t-tag c-code" x="228" y="93">CHOSEN</text>
    <text class="t-h c-code" x="228" y="112">FIX-1018 binds the id</text>
    <rect class="lost" x="452" y="76" width="224" height="46" rx="5"/>
    <text class="t-tag c-mute" x="468" y="93">INSTEAD OF</text>
    <text class="t-h c-lost" x="468" y="112">FIX-1286 decides first</text>
    <rect class="lost" x="692" y="76" width="224" height="46" rx="5"/>
    <text class="t-tag c-mute" x="708" y="93">INSTEAD OF</text>
    <text class="t-h c-lost" x="708" y="112">Re-key the workspace</text>
  </g>

  <g id="row-decides">
    <rect class="decide" x="16" y="134" width="908" height="62" rx="4"/>
    <rect class="bar" x="16" y="134" width="4" height="62"/>
    <text class="t-lbl" x="32" y="156">A CONFIRMED</text>
    <text class="t-lbl" x="32" y="169">CROSS-USER READ</text>
    <text class="t-tag c-acc" x="32" y="186">▸ DECIDES IT</text>
    <text class="mark plus" x="228" y="162">+</text>
    <text class="t-b" x="248" y="161">Closed first</text>
    <text class="t-s" x="248" y="179">and answers 1286's question</text>
    <text class="mark minus" x="468" y="162">−</text>
    <text class="t-b" x="488" y="161">Open during review</text>
    <text class="t-s" x="488" y="179">a design holds the fix</text>
    <text class="mark minus" x="708" y="162">−</text>
    <text class="t-b" x="728" y="161">Still open</text>
    <text class="t-s" x="728" y="179">the record is still adoptable</text>
  </g>

  <g id="row-2">
    <text class="t-lbl" x="32" y="222">WHO WAITS</text>
    <text class="mark minus" x="228" y="224">−</text>
    <text class="t-b" x="248" y="223">1286 and 1634</text>
    <text class="t-s" x="248" y="241">implement after 1018</text>
    <text class="mark minus" x="468" y="224">−</text>
    <text class="t-b" x="488" y="223">1018 waits</text>
    <text class="t-s" x="488" y="241">on 1286's spec</text>
    <text class="mark plus" x="708" y="224">+</text>
    <text class="t-b" x="728" y="223">Nobody</text>
    <text class="t-s" x="728" y="241">one key changes</text>
    <line class="row" x1="16" y1="254" x2="924" y2="254"/>
  </g>

  <g id="row-3">
    <text class="t-lbl" x="32" y="280">CALLER IDS</text>
    <text class="mark tie" x="228" y="282">=</text>
    <text class="t-b" x="248" y="281">Still accepted</text>
    <text class="t-s" x="248" y="299">scoped to the owner</text>
    <text class="mark tie" x="468" y="282">=</text>
    <text class="t-b" x="488" y="281">Still accepted</text>
    <text class="t-s" x="488" y="299">whatever 1286 picks</text>
    <text class="mark tie" x="708" y="282">=</text>
    <text class="t-b" x="728" y="281">Still accepted</text>
    <text class="t-s" x="728" y="299">unchanged</text>
    <line class="row" x1="16" y1="312" x2="924" y2="312"/>
  </g>

  <g id="locks-in">
    <rect class="foot" x="16" y="330" width="446" height="74" rx="5"/>
    <text class="t-lbl" x="32" y="351">LOCKS IN</text>
    <text class="t-b" x="32" y="371">One principal rule, the binding</text>
    <text class="t-s" x="32" y="389">1286 may close as proved, with its own test</text>
  </g>

  <g id="flips-if">
    <rect class="foot" x="478" y="330" width="446" height="74" rx="5"/>
    <text class="t-lbl" x="494" y="351">FLIPS IF</text>
    <text class="t-b" x="494" y="371">The shared workspace survives per-owner records</text>
    <text class="t-s" x="494" y="389">then 1286 decides alone and the edge comes out</text>
  </g>
</svg>
