<svg viewBox="0 0 940 450" role="img" xmlns="http://www.w3.org/2000/svg"
     aria-label="Who owns what: eight rules by two columns, FIX-1639 the page and FIX-1642 the closure. FIX-1639 owns the path, the table and its event row, the terms, the queue-host fence, the project verified-caller rule, the drift fixes and links, and the internal epic-wake line. The closure consumes every one of those and owns the proof, which FIX-1639 consumes. D1 folded FIX-1638 and FIX-1640 into FIX-1639, so they have no column.">
  <style>
    :root { --surface:#FCFCFA; --surface-2:#E8E8E1; --ink:#191C21; --ink-2:#4C535B; --ink-3:#7A828B;
            --rule:#D5D4CB; --accent:#3E4E8C; --accent-soft:#E0E3F0; --code:#2C7C69; --code-soft:#DCEDE7;
            --prose:#A8761C; --prose-soft:#F3E8D2; --gone:#A9544F; }
    @media (prefers-color-scheme: dark) {
      :root { --surface:#181C1F; --surface-2:#202528; --ink:#E6E8E5; --ink-2:#A4ACB1; --ink-3:#737B81;
              --rule:#2B3135; --accent:#8B9BD8; --accent-soft:#1B2140; --code:#5DBBA1; --code-soft:#14302A;
              --prose:#D9A44B; --prose-soft:#332612; --gone:#DE8A84; } }
    .bg    { fill:var(--surface); }
    .own   { fill:var(--accent-soft); stroke:var(--accent); stroke-width:1.4; }
    .use   { fill:var(--surface-2); stroke:var(--rule); stroke-width:1; }
    .t-lbl { fill:var(--ink-3); font-family:ui-monospace,SFMono-Regular,Menlo,monospace;
             font-size:9.5px; letter-spacing:.1em; }
    .t-col { fill:var(--ink); font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:9.5px; }
    .t-row { fill:var(--ink); font-family:system-ui,-apple-system,sans-serif; font-size:11.5px; }
    .t-own { fill:var(--accent); font-family:ui-monospace,SFMono-Regular,Menlo,monospace;
             font-size:9px; letter-spacing:.06em; }
    .t-use { fill:var(--ink-2); font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:9px; }
  </style>
  <rect class="bg" x="0" y="0" width="940" height="450"/>

  <text class="t-lbl" x="16" y="20">WHO OWNS WHAT &#8212; ONE OWNER PER RULE, AFTER D1</text>
  <text class="t-col" x="424" y="44">FIX-1639 · page</text>
  <text class="t-col" x="684" y="44">FIX-1642 · closure</text>

  <g id="er1">
    <text class="t-row" x="16" y="80">ER-1 the path, on one page</text>
    <rect class="own" x="416" y="58" width="248" height="36" rx="3"/>
    <text class="t-own" x="428" y="80">OWNS</text>
    <rect class="use" x="676" y="58" width="248" height="36" rx="3"/>
    <text class="t-use" x="688" y="80">consumes</text>
  </g>
  <g id="er2">
    <text class="t-row" x="16" y="124">ER-2, ER-5 the table, event row</text>
    <rect class="own" x="416" y="102" width="248" height="36" rx="3"/>
    <text class="t-own" x="428" y="124">OWNS</text>
    <rect class="use" x="676" y="102" width="248" height="36" rx="3"/>
    <text class="t-use" x="688" y="124">consumes</text>
  </g>
  <g id="er3">
    <text class="t-row" x="16" y="168">ER-3 the three terms</text>
    <rect class="own" x="416" y="146" width="248" height="36" rx="3"/>
    <text class="t-own" x="428" y="168">OWNS</text>
    <rect class="use" x="676" y="146" width="248" height="36" rx="3"/>
    <text class="t-use" x="688" y="168">consumes</text>
  </g>
  <g id="er4">
    <text class="t-row" x="16" y="212">ER-4 the queue-host fence</text>
    <rect class="own" x="416" y="190" width="248" height="36" rx="3"/>
    <text class="t-own" x="428" y="212">OWNS</text>
    <rect class="use" x="676" y="190" width="248" height="36" rx="3"/>
    <text class="t-use" x="688" y="212">consumes</text>
  </g>
  <g id="pr1">
    <text class="t-row" x="16" y="256">PR-1 verified caller (project)</text>
    <rect class="own" x="416" y="234" width="248" height="36" rx="3"/>
    <text class="t-own" x="428" y="256">OWNS</text>
    <rect class="use" x="676" y="234" width="248" height="36" rx="3"/>
    <text class="t-use" x="688" y="256">consumes</text>
  </g>
  <g id="er9">
    <text class="t-row" x="16" y="300">ER-9 drift fixes and links</text>
    <rect class="own" x="416" y="278" width="248" height="36" rx="3"/>
    <text class="t-own" x="428" y="300">OWNS</text>
    <rect class="use" x="676" y="278" width="248" height="36" rx="3"/>
    <text class="t-use" x="688" y="300">consumes</text>
  </g>
  <g id="er8">
    <text class="t-row" x="16" y="344">ER-8 epic-wake line, internal</text>
    <rect class="own" x="416" y="322" width="248" height="36" rx="3"/>
    <text class="t-own" x="428" y="344">OWNS</text>
    <rect class="use" x="676" y="322" width="248" height="36" rx="3"/>
    <text class="t-use" x="688" y="344">consumes</text>
  </g>
  <g id="er15">
    <text class="t-row" x="16" y="388">ER-15 the proof</text>
    <rect class="use" x="416" y="366" width="248" height="36" rx="3"/>
    <text class="t-use" x="428" y="388">consumes</text>
    <rect class="own" x="676" y="366" width="248" height="36" rx="3"/>
    <text class="t-own" x="688" y="388">OWNS</text>
  </g>
  <text class="t-use" x="16" y="436">D1 folded FIX-1638 and FIX-1640 into FIX-1639; both are canceled and own nothing.</text>
</svg>
