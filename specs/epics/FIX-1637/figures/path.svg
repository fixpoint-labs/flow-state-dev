<svg viewBox="0 0 940 428" role="img" xmlns="http://www.w3.org/2000/svg"
     aria-label="The path, as of 29 September 2026. An input lane for FIX-1634 under FIX-1635, Backlog, which nothing here waits on. This epic spec in review, ending at the now line and the gate. FIX-1639's spec and then the page, after the gate. FIX-1638 and FIX-1640 with no bars, folded into FIX-1639 by D1 and canceled. FIX-1641, the wake authoring examples, in flight with its PR in review, beside the page and off the critical path. FIX-1643, the subscribe and route examples, the same: in flight with its PR in review, beside the page, off the critical path. The closure FIX-1642: its QA plan written beside FIX-1639, and its run after the page merges. The critical path runs gate, FIX-1639 spec, the page, the closure run.">
  <style>
    :root { --surface:#FCFCFA; --surface-2:#E8E8E1; --ink:#191C21; --ink-2:#4C535B; --ink-3:#7A828B;
            --rule:#D5D4CB; --accent:#3E4E8C; --accent-soft:#E0E3F0; --code:#2C7C69; --code-soft:#DCEDE7;
            --prose:#A8761C; --prose-soft:#F3E8D2; --gone:#A9544F; }
    @media (prefers-color-scheme: dark) {
      :root { --surface:#181C1F; --surface-2:#202528; --ink:#E6E8E5; --ink-2:#A4ACB1; --ink-3:#737B81;
              --rule:#2B3135; --accent:#8B9BD8; --accent-soft:#1B2140; --code:#5DBBA1; --code-soft:#14302A;
              --prose:#D9A44B; --prose-soft:#332612; --gone:#DE8A84; } }
    .bg    { fill:var(--surface); }
    .flight{ fill:var(--accent); stroke:none; }
    .todo  { fill:none; stroke:var(--ink-3); stroke-width:1.2; stroke-dasharray:4 3; }
    .axis  { stroke:var(--rule); stroke-width:1; }
    .now   { stroke:var(--gone); stroke-width:1.4; }
    .crit  { fill:none; stroke:var(--gone); stroke-width:1.2; stroke-dasharray:3 3; }
    .t-lbl { fill:var(--ink-3); font-family:ui-monospace,SFMono-Regular,Menlo,monospace;
             font-size:9.5px; letter-spacing:.1em; }
    .t-ln  { fill:var(--ink); font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:10px; }
    .t-in  { fill:var(--prose); font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:10px; }
    .t-s   { fill:var(--ink-2); font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:9px; }
    .t-w   { fill:var(--surface); font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:9px; }
    .t-now { fill:var(--gone); font-family:ui-monospace,SFMono-Regular,Menlo,monospace;
             font-size:9.5px; letter-spacing:.06em; }
    .t-g   { fill:var(--gone); font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:9px; }
  </style>
  <rect class="bg" x="0" y="0" width="940" height="428"/>

  <text class="t-lbl" x="16" y="18">THE PATH &#8212; ONE WRITER, ONE WAIT AT THE GATE</text>
  <path class="axis" d="M220 40 L924 40"/>
  <text class="t-now" x="330" y="32">now &#183; 29 Sep &#183; gate</text>
  <text class="t-s" x="600" y="32">ahead &#183; not scheduled</text>
  <path class="now" d="M380 40 L380 388"/>

  <g id="input">
    <text class="t-in" x="16" y="70">FIX-1634 &#183; input</text>
    <text class="t-s" x="228" y="70">Backlog under FIX-1635 &#183; nothing here waits on it</text>
  </g>
  <g id="epic-spec">
    <text class="t-ln" x="16" y="112">FIX-1637 &#183; this spec</text>
    <rect class="flight" x="300" y="98" width="80" height="22" rx="3"/>
    <text class="t-w" x="306" y="113">in review</text>
  </g>
  <g id="page">
    <text class="t-ln" x="16" y="154">FIX-1639 &#183; the page</text>
    <rect class="todo" x="396" y="140" width="150" height="22" rx="3"/>
    <text class="t-s" x="404" y="155">spec</text>
    <rect class="todo" x="554" y="140" width="170" height="22" rx="3"/>
    <text class="t-s" x="562" y="155">the page &#183; docs PR</text>
  </g>
  <g id="matrix">
    <text class="t-ln" x="16" y="196">FIX-1638 &#183; matrix</text>
    <text class="t-s" x="396" y="196">folded into FIX-1639 &#183; D1 &#183; canceled</text>
  </g>
  <g id="terms">
    <text class="t-ln" x="16" y="238">FIX-1640 &#183; terms</text>
    <text class="t-s" x="396" y="238">folded into FIX-1639 &#183; D1 &#183; canceled</text>
  </g>
  <g id="poc">
    <text class="t-ln" x="16" y="280">FIX-1641 &#183; wake POC</text>
    <rect class="flight" x="300" y="266" width="80" height="22" rx="3"/>
    <text class="t-w" x="306" y="281">examples</text>
    <rect class="todo" x="396" y="266" width="150" height="22" rx="3"/>
    <text class="t-s" x="404" y="281">review &#183; #2369</text>
  </g>
  <g id="poc-subscribe">
    <text class="t-ln" x="16" y="322">FIX-1643 &#183; subscribe POC</text>
    <rect class="flight" x="300" y="308" width="80" height="22" rx="3"/>
    <text class="t-w" x="306" y="323">examples</text>
    <rect class="todo" x="396" y="308" width="150" height="22" rx="3"/>
    <text class="t-s" x="404" y="323">review &#183; #2372</text>
  </g>
  <g id="closure">
    <text class="t-ln" x="16" y="364">FIX-1642 &#183; closure</text>
    <rect class="todo" x="396" y="350" width="150" height="22" rx="3"/>
    <text class="t-s" x="404" y="365">QA plan</text>
    <rect class="todo" x="732" y="350" width="170" height="22" rx="3"/>
    <text class="t-s" x="740" y="365">run on one main commit</text>
  </g>
  <path class="crit" d="M380 109 L396 151 M724 151 L740 350"/>
  <text class="t-g" x="16" y="414">Critical path: gate &#8594; FIX-1639 spec &#8594; the page &#8594; the closure run. FIX-1639 writes alone.</text>
</svg>
