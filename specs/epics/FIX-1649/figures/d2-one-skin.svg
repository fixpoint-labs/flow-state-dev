<svg viewBox="0 0 940 420" role="img" aria-label="D2: how shift-manager skins the FSD components it reuses. Chosen: through the theme contracts they already have. Instead of: restyling copies inside shift-manager, or a theme API in the react package. It comes down to the first row, where the paint lives: in one theme outside FSD, so the layer rule holds, where restyled copies drift from every FSD fix and a theme API puts a Lab surface into L1. Second row: a second Lab swaps a theme, where restyling means restyling again. The price, third row: the skin reaches only what the contracts expose, and some registry components need fixes at their source first. Locks in skin gaps fixed at the source by FIX-1655, with shift-manager's copies re-synced and never restyled. Flips if the refined design needs a look a contract cannot reach without changing a component's public props."
     xmlns="http://www.w3.org/2000/svg">
  <style>
    :root { --surface:#FCFCFA; --surface-2:#E8E8E1; --ink:#191C21; --ink-2:#4C535B; --ink-3:#7A828B;
            --rule:#D5D4CB; --accent:#3E4E8C; --accent-soft:#E0E3F0; --code:#2C7C69; --code-soft:#DCEDE7;
            --gone:#A9544F; }
    @media (prefers-color-scheme: dark) {
      :root { --surface:#181C1F; --surface-2:#202528; --ink:#E6E8E5; --ink-2:#A4ACB1; --ink-3:#737B81;
              --rule:#2B3135; --accent:#8B9BD8; --accent-soft:#1B2140; --code:#5DBBA1; --code-soft:#14302A;
              --gone:#DE8A84; } }
    .bg     { fill:var(--surface); }
    .ask    { fill:var(--surface-2); }
    .chosen { fill:var(--code-soft); stroke:var(--code); stroke-width:1.6; }
    .rec    { fill:var(--code-soft); stroke:var(--code); stroke-width:1.6; stroke-dasharray:6 3; }
    .lost   { fill:var(--surface); stroke:var(--rule); stroke-width:1.4; stroke-dasharray:5 4; }
    .decide { fill:var(--accent-soft); }
    .bar    { fill:var(--accent); }
    .row    { stroke:var(--rule); stroke-width:1; }
    .foot   { fill:var(--surface-2); }
    .t-lbl  { fill:var(--ink-3); font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:9.5px; letter-spacing:.1em; }
    .t-tag  { font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:9.5px; letter-spacing:.1em; font-weight:600; }
    .t-q    { fill:var(--ink); font-family:system-ui,-apple-system,sans-serif; font-weight:600; font-size:15px; }
    .t-h    { font-family:system-ui,-apple-system,sans-serif; font-weight:600; font-size:14px; }
    .t-b    { fill:var(--ink); font-family:system-ui,-apple-system,sans-serif; font-size:12.5px; }
    .t-s    { fill:var(--ink-2); font-family:system-ui,-apple-system,sans-serif; font-size:11px; }
    .mark   { font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:16px; font-weight:700; }
    .plus   { fill:var(--code); }
    .minus  { fill:var(--gone); }
    .tie    { fill:var(--ink-3); }
    .c-code { fill:var(--code); }
    .c-mute { fill:var(--ink-3); }
    .c-lost { fill:var(--ink-2); }
    .c-acc  { fill:var(--accent); }
  </style>
  <rect class="bg" x="0" y="0" width="940" height="420"/>

  <g id="the-call">
    <rect class="ask" x="16" y="14" width="908" height="48" rx="6"/>
    <text class="t-lbl" x="32" y="32">D2 &#183; THE CALL</text>
    <text class="t-q" x="32" y="52">How does shift-manager skin the FSD components it reuses?</text>
  </g>

  <g id="options">
    <rect class="chosen" x="212" y="76" width="224" height="46" rx="5"/>
    <text class="t-tag c-code" x="228" y="93">CHOSEN</text>
    <text class="t-h c-code" x="228" y="112">Existing contracts</text>
    <rect class="lost" x="452" y="76" width="224" height="46" rx="5"/>
    <text class="t-tag c-mute" x="468" y="93">INSTEAD OF</text>
    <text class="t-h c-lost" x="468" y="112">Restyle copies</text>
    <rect class="lost" x="692" y="76" width="224" height="46" rx="5"/>
    <text class="t-tag c-mute" x="708" y="93">INSTEAD OF</text>
    <text class="t-h c-lost" x="708" y="112">Theme API in react</text>
  </g>

  <g id="row-1">
    <rect class="decide" x="16" y="134" width="908" height="62" rx="4"/>
    <rect class="bar" x="16" y="134" width="4" height="62"/>
    <text class="t-lbl" x="32" y="156">WHERE THE PAINT</text>
    <text class="t-lbl" x="32" y="169">LIVES</text>
    <text class="t-tag c-acc" x="32" y="186">&#9656; DECIDES IT</text>
    <text class="mark plus" x="228" y="162">+</text>
    <text class="t-b" x="248" y="161">One theme, outside FSD</text>
    <text class="t-s" x="248" y="179">the layer rule holds</text>
    <text class="mark minus" x="468" y="162">&#8722;</text>
    <text class="t-b" x="488" y="161">In restyled copies</text>
    <text class="t-s" x="488" y="179">drift from every FSD fix</text>
    <text class="mark minus" x="708" y="162">&#8722;</text>
    <text class="t-b" x="728" y="161">A Lab surface in L1</text>
    <text class="t-s" x="728" y="179">the layer rule breaks</text>
  </g>

  <g id="row-2">
    <text class="t-lbl" x="32" y="224">A SECOND LAB</text>
    <text class="t-lbl" x="32" y="237"></text>
    <text class="mark plus" x="228" y="227">+</text>
    <text class="t-b" x="248" y="226">Swaps a theme</text>
    <text class="t-s" x="248" y="244">no code</text>
    <text class="mark minus" x="468" y="227">&#8722;</text>
    <text class="t-b" x="488" y="226">Restyles again</text>
    <text class="t-s" x="488" y="244">or shares shift-manager's copies</text>
    <text class="mark plus" x="708" y="227">+</text>
    <text class="t-b" x="728" y="226">Swaps a theme</text>
    <text class="t-s" x="728" y="244">through the new API</text>
    <line class="row" x1="16" y1="252" x2="924" y2="252"/>
  </g>

  <g id="row-3">
    <text class="t-lbl" x="32" y="282">WHAT THE SKIN</text>
    <text class="t-lbl" x="32" y="295">CAN REACH</text>
    <text class="mark minus" x="228" y="285">&#8722;</text>
    <text class="t-b" x="248" y="284">What contracts expose</text>
    <text class="t-s" x="248" y="302">some need source fixes</text>
    <text class="mark plus" x="468" y="285">+</text>
    <text class="t-b" x="488" y="284">Anything</text>
    <text class="t-s" x="488" y="302">the paint is shift-manager's</text>
    <text class="mark plus" x="708" y="285">+</text>
    <text class="t-b" x="728" y="284">What the API grows</text>
    <text class="t-s" x="728" y="302">a new public surface</text>
    <line class="row" x1="16" y1="310" x2="924" y2="310"/>
  </g>

  <g id="locks-in">
    <rect class="foot" x="16" y="330" width="446" height="74" rx="5"/>
    <text class="t-lbl" x="32" y="351">LOCKS IN</text>
    <text class="t-b" x="32" y="371">Skin gaps fixed at the source, copies re-synced</text>
    <text class="t-s" x="32" y="389">FIX-1655; no restyled copies (ER-6)</text>
  </g>

  <g id="flips-if">
    <rect class="foot" x="478" y="330" width="446" height="74" rx="5"/>
    <text class="t-lbl" x="494" y="351">FLIPS IF</text>
    <text class="t-b" x="494" y="371">The design needs a look a contract can't reach</text>
    <text class="t-s" x="494" y="389">without changing a component's public props</text>
  </g>
</svg>
