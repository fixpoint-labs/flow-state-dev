<svg viewBox="0 0 940 420" role="img" aria-label="Open fork for Jake: is App Lab one app that opens any Lab, or a chrome kit each Lab's own app imports? Recommended: one app, where a Lab is the Workforce tree it opens. It comes down to the first row, what a Lab is: a Workforce tree, per D-12, so no Lab writes UI, where the kit makes each Lab an app carrying its own host, routes and auth. Second row: nothing extra to build now, where the kit is a package with one consumer that amends FIX-1455 D5. The price, third row: a Lab cannot have a screen of its own until the shell grows a place for one. Locks in the closure's leg b opening a second tree by configuration, with the chrome inside App Lab. Flips if DevForce or CyberForce must ship as separate products with screens only they have."
     xmlns="http://www.w3.org/2000/svg">
  <style>
    :root { --surface:#FCFCFA; --surface-2:#E8E8E1; --ink:#191C21; --ink-2:#4C535B; --ink-3:#7A828B;
            --rule:#D5D4CB; --accent:#3E4E8C; --accent-soft:#E0E3F0; --code:#2C7C69; --code-soft:#DCEDE7;
            --gone:#A9544F; }
    @media (prefers-color-scheme: dark) {
      :root { --surface:#181C1F; --surface-2:#202528; --ink:#E6E8E5; --ink-2:#A4ACB1; --ink-3:#737B81;
              --rule:#2B3135; --accent:#8B9BD8; --accent-soft:#1B2140; --code:#5DBBA1; --code-soft:#14302A;
              --gone:#DE8A84; } }
    .bg     { fill:var(--surface); }
    .ask    { fill:var(--surface-2); }
    .chosen { fill:var(--code-soft); stroke:var(--code); stroke-width:1.6; }
    .rec    { fill:var(--code-soft); stroke:var(--code); stroke-width:1.6; stroke-dasharray:6 3; }
    .lost   { fill:var(--surface); stroke:var(--rule); stroke-width:1.4; stroke-dasharray:5 4; }
    .decide { fill:var(--accent-soft); }
    .bar    { fill:var(--accent); }
    .row    { stroke:var(--rule); stroke-width:1; }
    .foot   { fill:var(--surface-2); }
    .t-lbl  { fill:var(--ink-3); font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:9.5px; letter-spacing:.1em; }
    .t-tag  { font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:9.5px; letter-spacing:.1em; font-weight:600; }
    .t-q    { fill:var(--ink); font-family:system-ui,-apple-system,sans-serif; font-weight:600; font-size:15px; }
    .t-h    { font-family:system-ui,-apple-system,sans-serif; font-weight:600; font-size:14px; }
    .t-b    { fill:var(--ink); font-family:system-ui,-apple-system,sans-serif; font-size:12.5px; }
    .t-s    { fill:var(--ink-2); font-family:system-ui,-apple-system,sans-serif; font-size:11px; }
    .mark   { font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:16px; font-weight:700; }
    .plus   { fill:var(--code); }
    .minus  { fill:var(--gone); }
    .tie    { fill:var(--ink-3); }
    .c-code { fill:var(--code); }
    .c-mute { fill:var(--ink-3); }
    .c-lost { fill:var(--ink-2); }
    .c-acc  { fill:var(--accent); }
  </style>
  <rect class="bg" x="0" y="0" width="940" height="420"/>

  <g id="the-call">
    <rect class="ask" x="16" y="14" width="908" height="48" rx="6"/>
    <text class="t-lbl" x="32" y="32">OPEN &#183; THE FORK &#183; JAKE</text>
    <text class="t-q" x="32" y="52">Is App Lab one app that opens any Lab, or a chrome each Lab's app imports?</text>
  </g>

  <g id="options">
    <rect class="rec" x="212" y="76" width="348" height="46" rx="5"/>
    <text class="t-tag c-code" x="228" y="93">RECOMMENDED</text>
    <text class="t-h c-code" x="228" y="112">One app; a Lab is its tree</text>
    <rect class="lost" x="576" y="76" width="348" height="46" rx="5"/>
    <text class="t-tag c-mute" x="592" y="93">INSTEAD OF</text>
    <text class="t-h c-lost" x="592" y="112">A chrome kit each Lab imports</text>
  </g>

  <g id="row-1">
    <rect class="decide" x="16" y="134" width="908" height="62" rx="4"/>
    <rect class="bar" x="16" y="134" width="4" height="62"/>
    <text class="t-lbl" x="32" y="156">WHAT A LAB</text>
    <text class="t-lbl" x="32" y="169">IS</text>
    <text class="t-tag c-acc" x="32" y="186">&#9656; DECIDES IT</text>
    <text class="mark plus" x="228" y="162">+</text>
    <text class="t-b" x="248" y="161">A Workforce tree</text>
    <text class="t-s" x="248" y="179">per D-12; no Lab writes UI</text>
    <text class="mark minus" x="592" y="162">&#8722;</text>
    <text class="t-b" x="612" y="161">An app of its own</text>
    <text class="t-s" x="612" y="179">each carries a host, routes, auth</text>
  </g>

  <g id="row-2">
    <text class="t-lbl" x="32" y="224">COST NOW</text>
    <text class="t-lbl" x="32" y="237"></text>
    <text class="mark plus" x="228" y="227">+</text>
    <text class="t-b" x="248" y="226">Nothing extra</text>
    <text class="t-s" x="248" y="244">the chrome stays in labs/app-lab</text>
    <text class="mark minus" x="592" y="227">&#8722;</text>
    <text class="t-b" x="612" y="226">A package, one consumer</text>
    <text class="t-s" x="612" y="244">and amends FIX-1455 D5</text>
    <line class="row" x1="16" y1="252" x2="924" y2="252"/>
  </g>

  <g id="row-3">
    <text class="t-lbl" x="32" y="282">A LAB'S OWN</text>
    <text class="t-lbl" x="32" y="295">SCREEN</text>
    <text class="mark minus" x="228" y="285">&#8722;</text>
    <text class="t-b" x="248" y="284">Not until the shell grows one</text>
    <text class="t-s" x="248" y="302">an extension point, later</text>
    <text class="mark plus" x="592" y="285">+</text>
    <text class="t-b" x="612" y="284">Its app, its screens</text>
    <text class="t-s" x="612" y="302">from day one</text>
    <line class="row" x1="16" y1="310" x2="924" y2="310"/>
  </g>

  <g id="locks-in">
    <rect class="foot" x="16" y="330" width="446" height="74" rx="5"/>
    <text class="t-lbl" x="32" y="351">LOCKS IN</text>
    <text class="t-b" x="32" y="371">Leg b opens a second tree by configuration</text>
    <text class="t-s" x="32" y="389">the chrome stays inside App Lab</text>
  </g>

  <g id="flips-if">
    <rect class="foot" x="478" y="330" width="446" height="74" rx="5"/>
    <text class="t-lbl" x="494" y="351">FLIPS IF</text>
    <text class="t-b" x="494" y="371">DevForce or CyberForce ship as separate products</text>
    <text class="t-s" x="494" y="389">with screens only they have</text>
  </g>
</svg>
