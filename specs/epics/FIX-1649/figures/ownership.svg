<svg viewBox="0 0 940 476" role="img" xmlns="http://www.w3.org/2000/svg"
     aria-label="Who owns what: nine cross-cutting rules by six issues, FIX-1655 the design system, FIX-1662 the App Lab shell, FIX-1664 the task view, FIX-1722 Chief of Staff, FIX-1723 Roster, and FIX-1663 the closure. FIX-1655 owns ER-2, one token set through the existing contracts; ER-3, neutral defaults and no App Lab value in FSD; ER-6, no restyled copies, with skin gaps fixed at the source and a re-sync check; and ER-9, final visuals waiting for the final Claude Design hand-back. FIX-1662 owns ER-1, every level and tab reached; ER-4, a second Lab with no shell code; and ER-5, named empty states. FIX-1664 owns ER-15, writes into a worker's session only through shipped operations. FIX-1663 owns ER-13, the proof. FIX-1722 and FIX-1723 own no rule and consume the rest. Every other filled cell consumes; a dash means the rule does not touch that issue: FIX-1655 is untouched by ER-1, ER-4, ER-5 and ER-15, FIX-1723 by ER-15, and FIX-1663 by ER-9.">
  <style>
    :root { --surface:#FCFCFA; --surface-2:#E8E8E1; --ink:#191C21; --ink-2:#4C535B; --ink-3:#7A828B;
            --rule:#D5D4CB; --accent:#3E4E8C; --accent-soft:#E0E3F0; }
    @media (prefers-color-scheme: dark) {
      :root { --surface:#181C1F; --surface-2:#202528; --ink:#E6E8E5; --ink-2:#A4ACB1; --ink-3:#737B81;
              --rule:#2B3135; --accent:#8B9BD8; --accent-soft:#1B2140; } }
    .bg    { fill:var(--surface); }
    .own   { fill:var(--accent-soft); stroke:var(--accent); stroke-width:1.4; }
    .use   { fill:var(--surface-2); stroke:var(--rule); stroke-width:1; }
    .t-lbl { fill:var(--ink-3); font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:9.5px; letter-spacing:.1em; }
    .t-col { fill:var(--ink); font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:9.5px; }
    .t-row { fill:var(--ink); font-family:system-ui,-apple-system,sans-serif; font-size:11.5px; }
    .t-own { fill:var(--accent); font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:9px; letter-spacing:.06em; }
    .t-use { fill:var(--ink-2); font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:9px; }
    .t-na  { fill:var(--ink-3); font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:9px; }
  </style>
  <rect class="bg" x="0" y="0" width="940" height="476"/>

  <text class="t-lbl" x="16" y="20">WHO OWNS WHAT &#8212; ONE OWNER PER RULE</text>
  <text class="t-col" x="272" y="38">FIX-1655</text>
  <text class="t-use" x="272" y="51">design</text>
  <text class="t-col" x="383" y="38">FIX-1662</text>
  <text class="t-use" x="383" y="51">shell</text>
  <text class="t-col" x="494" y="38">FIX-1664</text>
  <text class="t-use" x="494" y="51">task view</text>
  <text class="t-col" x="605" y="38">FIX-1722</text>
  <text class="t-use" x="605" y="51">chief of staff</text>
  <text class="t-col" x="716" y="38">FIX-1723</text>
  <text class="t-use" x="716" y="51">roster</text>
  <text class="t-col" x="827" y="38">FIX-1663</text>
  <text class="t-use" x="827" y="51">closure</text>
  <g id="er1">
    <text class="t-row" x="16" y="80">ER-1 every level and tab reached</text>
    <text class="t-na" x="272" y="80">&#8212;</text>
    <rect class="own" x="373" y="58" width="104" height="36" rx="3"/>
    <text class="t-own" x="383" y="80">OWNS</text>
    <rect class="use" x="484" y="58" width="104" height="36" rx="3"/>
    <text class="t-use" x="494" y="80">consumes</text>
    <rect class="use" x="595" y="58" width="104" height="36" rx="3"/>
    <text class="t-use" x="605" y="80">consumes</text>
    <rect class="use" x="706" y="58" width="104" height="36" rx="3"/>
    <text class="t-use" x="716" y="80">consumes</text>
    <rect class="use" x="817" y="58" width="104" height="36" rx="3"/>
    <text class="t-use" x="827" y="80">consumes</text>
  </g>
  <g id="er2">
    <text class="t-row" x="16" y="124">ER-2 one token set, existing contracts</text>
    <rect class="own" x="262" y="102" width="104" height="36" rx="3"/>
