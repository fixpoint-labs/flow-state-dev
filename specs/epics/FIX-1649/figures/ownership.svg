<svg viewBox="0 0 940 464" role="img" xmlns="http://www.w3.org/2000/svg"
     aria-label="Who owns what: nine cross-cutting rules by four issues, FIX-1655 the design system, FIX-1662 the shift-manager shell, FIX-1664 the task view, and FIX-1663 the closure. FIX-1655 owns ER-2, one token set through the existing contracts; ER-3, neutral defaults and no shift-manager value in FSD; ER-6, no restyled copies, with skin gaps fixed at the source and a re-sync check; and ER-9, final visuals waiting for the final Claude Design hand-back. FIX-1662 owns ER-1, every level and tab reached; ER-4, a second Lab with no shell code; and ER-5, named empty states. FIX-1664 owns ER-15, writes into a worker's session only through shipped operations. FIX-1663 owns ER-13, the proof. Every other filled cell consumes; a dash means the rule does not touch that issue: FIX-1655 is untouched by ER-1, ER-4, ER-5 and ER-15, and FIX-1663 by ER-9.">
  <style>
    :root { --surface:#FCFCFA; --surface-2:#E8E8E1; --ink:#191C21; --ink-2:#4C535B; --ink-3:#7A828B;
            --rule:#D5D4CB; --accent:#3E4E8C; --accent-soft:#E0E3F0; }
    @media (prefers-color-scheme: dark) {
      :root { --surface:#181C1F; --surface-2:#202528; --ink:#E6E8E5; --ink-2:#A4ACB1; --ink-3:#737B81;
              --rule:#2B3135; --accent:#8B9BD8; --accent-soft:#1B2140; } }
    .bg    { fill:var(--surface); }
    .own   { fill:var(--accent-soft); stroke:var(--accent); stroke-width:1.4; }
    .use   { fill:var(--surface-2); stroke:var(--rule); stroke-width:1; }
    .t-lbl { fill:var(--ink-3); font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:9.5px; letter-spacing:.1em; }
    .t-col { fill:var(--ink); font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:9.5px; }
    .t-row { fill:var(--ink); font-family:system-ui,-apple-system,sans-serif; font-size:11.5px; }
    .t-own { fill:var(--accent); font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:9px; letter-spacing:.06em; }
    .t-use { fill:var(--ink-2); font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:9px; }
    .t-na  { fill:var(--ink-3); font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:9px; }
  </style>
  <rect class="bg" x="0" y="0" width="940" height="464"/>

  <text class="t-lbl" x="16" y="20">WHO OWNS WHAT &#8212; ONE OWNER PER RULE</text>
  <text class="t-col" x="352" y="44">FIX-1655 &#183; design</text>
  <text class="t-col" x="500" y="44">FIX-1662 &#183; shell</text>
  <text class="t-col" x="648" y="44">FIX-1664 &#183; task view</text>
  <text class="t-col" x="796" y="44">FIX-1663 &#183; closure</text>
  <g id="er1">
    <text class="t-row" x="16" y="80">ER-1 every level and tab reached</text>
    <text class="t-na" x="352" y="80">&#8212;</text>
    <rect class="own" x="488" y="58" width="140" height="36" rx="3"/>
    <text class="t-own" x="500" y="80">OWNS</text>
    <rect class="use" x="636" y="58" width="140" height="36" rx="3"/>
    <text class="t-use" x="648" y="80">consumes</text>
    <rect class="use" x="784" y="58" width="140" height="36" rx="3"/>
    <text class="t-use" x="796" y="80">consumes</text>
  </g>
  <g id="er2">
    <text class="t-row" x="16" y="124">ER-2 one token set, existing contracts</text>
    <rect class="own" x="340" y="102" width="140" height="36" rx="3"/>
    <text class="t-own" x="352" y="124">OWNS</text>
    <rect class="use" x="488" y="102" width="140" height="36" rx="3"/>
    <text class="t-use" x="500" y="124">consumes</text>
    <rect class="use" x="636" y="102" width="140" height="36" rx="3"/>
    <text class="t-use" x="648" y="124">consumes</text>
    <rect class="use" x="784" y="102" width="140" height="36" rx="3"/>
    <text class="t-use" x="796" y="124">consumes</text>
  </g>
  <g id="er3">
    <text class="t-row" x="16" y="168">ER-3 neutral defaults, no shift-manager in FSD</text>
    <rect class="own" x="340" y="146" width="140" height="36" rx="3"/>
    <text class="t-own" x="352" y="168">OWNS</text>
    <rect class="use" x="488" y="146" width="140" height="36" rx="3"/>
    <text class="t-use" x="500" y="168">consumes</text>
    <rect class="use" x="636" y="146" width="140" height="36" rx="3"/>
    <text class="t-use" x="648" y="168">consumes</text>
    <rect class="use" x="784" y="146" width="140" height="36" rx="3"/>
    <text class="t-use" x="796" y="168">consumes</text>
  </g>
  <g id="er4">
    <text class="t-row" x="16" y="212">ER-4 a second Lab, no shell code</text>
    <text class="t-na" x="352" y="212">&#8212;</text>
    <rect class="own" x="488" y="190" width="140" height="36" rx="3"/>
    <text class="t-own" x="500" y="212">OWNS</text>
    <rect class="use" x="636" y="190" width="140" height="36" rx="3"/>
    <text class="t-use" x="648" y="212">consumes</text>
    <rect class="use" x="784" y="190" width="140" height="36" rx="3"/>
    <text class="t-use" x="796" y="212">consumes</text>
  </g>
  <g id="er5">
    <text class="t-row" x="16" y="256">ER-5 named empty states</text>
    <text class="t-na" x="352" y="256">&#8212;</text>
    <rect class="own" x="488" y="234" width="140" height="36" rx="3"/>
    <text class="t-own" x="500" y="256">OWNS</text>
    <rect class="use" x="636" y="234" width="140" height="36" rx="3"/>
    <text class="t-use" x="648" y="256">consumes</text>
    <rect class="use" x="784" y="234" width="140" height="36" rx="3"/>
    <text class="t-use" x="796" y="256">consumes</text>
  </g>
  <g id="er6">
    <text class="t-row" x="16" y="300">ER-6 no restyled copies, re-synced</text>
    <rect class="own" x="340" y="278" width="140" height="36" rx="3"/>
    <text class="t-own" x="352" y="300">OWNS</text>
    <rect class="use" x="488" y="278" width="140" height="36" rx="3"/>
    <text class="t-use" x="500" y="300">consumes</text>
    <rect class="use" x="636" y="278" width="140" height="36" rx="3"/>
    <text class="t-use" x="648" y="300">consumes</text>
    <rect class="use" x="784" y="278" width="140" height="36" rx="3"/>
    <text class="t-use" x="796" y="300">consumes</text>
  </g>
  <g id="er9">
    <text class="t-row" x="16" y="344">ER-9 final visuals wait for the hand-back</text>
    <rect class="own" x="340" y="322" width="140" height="36" rx="3"/>
    <text class="t-own" x="352" y="344">OWNS</text>
    <rect class="use" x="488" y="322" width="140" height="36" rx="3"/>
    <text class="t-use" x="500" y="344">consumes</text>
    <rect class="use" x="636" y="322" width="140" height="36" rx="3"/>
    <text class="t-use" x="648" y="344">consumes</text>
    <text class="t-na" x="796" y="344">&#8212;</text>
  </g>
  <g id="er15">
    <text class="t-row" x="16" y="388">ER-15 session writes, shipped ops only</text>
    <text class="t-na" x="352" y="388">&#8212;</text>
    <rect class="use" x="488" y="366" width="140" height="36" rx="3"/>
    <text class="t-use" x="500" y="388">consumes</text>
    <rect class="own" x="636" y="366" width="140" height="36" rx="3"/>
    <text class="t-own" x="648" y="388">OWNS</text>
    <rect class="use" x="784" y="366" width="140" height="36" rx="3"/>
    <text class="t-use" x="796" y="388">consumes</text>
  </g>
  <g id="er13">
    <text class="t-row" x="16" y="432">ER-13 the proof</text>
    <rect class="use" x="340" y="410" width="140" height="36" rx="3"/>
    <text class="t-use" x="352" y="432">consumes</text>
    <rect class="use" x="488" y="410" width="140" height="36" rx="3"/>
    <text class="t-use" x="500" y="432">consumes</text>
    <rect class="use" x="636" y="410" width="140" height="36" rx="3"/>
    <text class="t-use" x="648" y="432">consumes</text>
    <rect class="own" x="784" y="410" width="140" height="36" rx="3"/>
    <text class="t-own" x="796" y="432">OWNS</text>
  </g>
</svg>
