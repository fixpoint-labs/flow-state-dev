  <g id="er15">
    <text class="t-row" x="16" y="388">ER-15 session writes, shipped ops only</text>
    <text class="t-na" x="272" y="388">&#8212;</text>
    <rect class="use" x="373" y="366" width="104" height="36" rx="3"/>
    <text class="t-use" x="383" y="388">consumes</text>
    <rect class="own" x="484" y="366" width="104" height="36" rx="3"/>
