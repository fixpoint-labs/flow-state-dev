    <rect class="use" x="706" y="234" width="104" height="36" rx="3"/>
    <text class="t-use" x="716" y="256">consumes</text>
    <rect class="use" x="817" y="234" width="104" height="36" rx="3"/>
    <text class="t-use" x="827" y="256">consumes</text>
  </g>
  <g id="er6">
    <text class="t-row" x="16" y="300">ER-6 no restyled copies, re-synced</text>
    <rect class="own" x="262" y="278" width="104" height="36" rx="3"/>
    <text class="t-own" x="272" y="300">OWNS</text>
    <rect class="use" x="373" y="278" width="104" height="36" rx="3"/>
    <text class="t-use" x="383" y="300">consumes</text>
