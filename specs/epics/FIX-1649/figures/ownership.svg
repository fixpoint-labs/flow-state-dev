    <text class="t-na" x="272" y="256">&#8212;</text>
    <rect class="own" x="373" y="234" width="104" height="36" rx="3"/>
    <text class="t-own" x="383" y="256">OWNS</text>
    <rect class="use" x="484" y="234" width="104" height="36" rx="3"/>
