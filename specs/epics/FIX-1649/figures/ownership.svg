    <text class="t-use" x="716" y="168">consumes</text>
    <rect class="use" x="817" y="146" width="104" height="36" rx="3"/>
    <text class="t-use" x="827" y="168">consumes</text>
  </g>
  <g id="er4">
    <text class="t-row" x="16" y="212">ER-4 a second Lab, no shell code</text>
    <text class="t-na" x="272" y="212">&#8212;</text>
    <rect class="own" x="373" y="190" width="104" height="36" rx="3"/>
    <text class="t-own" x="383" y="212">OWNS</text>
