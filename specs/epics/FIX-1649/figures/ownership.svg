<svg viewBox="0 0 940 424" role="img" xmlns="http://www.w3.org/2000/svg"
     aria-label="Who owns what: eight cross-cutting rules by three issues, FIX-1655 the design system, FIX-1662 the App Lab shell, and FIX-1663 the closure. FIX-1655 owns ER-2, one token set through the existing contracts; ER-3, a neutral theme and no App Lab value in FSD; ER-6, no forks, with skin gaps fixed where the component lives; and ER-9, final visuals waiting for the Claude Design hand-back. FIX-1662 owns ER-1, every surface reached; ER-4, a second Lab with no shell code; and ER-5, named empty states. FIX-1663 owns ER-13, the proof. Every other filled cell consumes; a dash means the rule does not touch that issue.">
  <style>
    :root { --surface:#FCFCFA; --surface-2:#E8E8E1; --ink:#191C21; --ink-2:#4C535B; --ink-3:#7A828B;
            --rule:#D5D4CB; --accent:#3E4E8C; --accent-soft:#E0E3F0; }
    @media (prefers-color-scheme: dark) {
      :root { --surface:#181C1F; --surface-2:#202528; --ink:#E6E8E5; --ink-2:#A4ACB1; --ink-3:#737B81;
              --rule:#2B3135; --accent:#8B9BD8; --accent-soft:#1B2140; } }
    .bg    { fill:var(--surface); }
    .own   { fill:var(--accent-soft); stroke:var(--accent); stroke-width:1.4; }
    .use   { fill:var(--surface-2); stroke:var(--rule); stroke-width:1; }
    .t-lbl { fill:var(--ink-3); font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:9.5px; letter-spacing:.1em; }
    .t-col { fill:var(--ink); font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:9.5px; }
    .t-row { fill:var(--ink); font-family:system-ui,-apple-system,sans-serif; font-size:11.5px; }
    .t-own { fill:var(--accent); font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:9px; letter-spacing:.06em; }
    .t-use { fill:var(--ink-2); font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:9px; }
    .t-na  { fill:var(--ink-3); font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:9px; }
  </style>
  <rect class="bg" x="0" y="0" width="940" height="424"/>

  <text class="t-lbl" x="16" y="20">WHO OWNS WHAT &#8212; ONE OWNER PER RULE</text>
  <text class="t-col" x="384" y="44">FIX-1655 &#183; design system</text>
  <text class="t-col" x="568" y="44">FIX-1662 &#183; App Lab shell</text>
  <text class="t-col" x="752" y="44">FIX-1663 &#183; closure</text>
  <g id="er1">
    <text class="t-row" x="16" y="80">ER-1 every surface reached</text>
    <text class="t-na" x="384" y="80">&#8212;</text>
    <rect class="own" x="556" y="58" width="172" height="36" rx="3"/>
    <text class="t-own" x="568" y="80">OWNS</text>
    <rect class="use" x="740" y="58" width="172" height="36" rx="3"/>
    <text class="t-use" x="752" y="80">consumes</text>
  </g>
  <g id="er2">
    <text class="t-row" x="16" y="124">ER-2 one token set, existing contracts</text>
    <rect class="own" x="372" y="102" width="172" height="36" rx="3"/>
    <text class="t-own" x="384" y="124">OWNS</text>
    <rect class="use" x="556" y="102" width="172" height="36" rx="3"/>
    <text class="t-use" x="568" y="124">consumes</text>
    <rect class="use" x="740" y="102" width="172" height="36" rx="3"/>
    <text class="t-use" x="752" y="124">consumes</text>
  </g>
  <g id="er3">
    <text class="t-row" x="16" y="168">ER-3 neutral theme, no App Lab in FSD</text>
    <rect class="own" x="372" y="146" width="172" height="36" rx="3"/>
    <text class="t-own" x="384" y="168">OWNS</text>
    <rect class="use" x="556" y="146" width="172" height="36" rx="3"/>
    <text class="t-use" x="568" y="168">consumes</text>
    <rect class="use" x="740" y="146" width="172" height="36" rx="3"/>
    <text class="t-use" x="752" y="168">consumes</text>
  </g>
  <g id="er4">
    <text class="t-row" x="16" y="212">ER-4 a second Lab, no shell code</text>
    <text class="t-na" x="384" y="212">&#8212;</text>
    <rect class="own" x="556" y="190" width="172" height="36" rx="3"/>
    <text class="t-own" x="568" y="212">OWNS</text>
    <rect class="use" x="740" y="190" width="172" height="36" rx="3"/>
    <text class="t-use" x="752" y="212">consumes</text>
  </g>
  <g id="er5">
    <text class="t-row" x="16" y="256">ER-5 named empty states</text>
    <text class="t-na" x="384" y="256">&#8212;</text>
    <rect class="own" x="556" y="234" width="172" height="36" rx="3"/>
    <text class="t-own" x="568" y="256">OWNS</text>
    <rect class="use" x="740" y="234" width="172" height="36" rx="3"/>
    <text class="t-use" x="752" y="256">consumes</text>
  </g>
  <g id="er6">
    <text class="t-row" x="16" y="300">ER-6 no forks, fix where it lives</text>
    <rect class="own" x="372" y="278" width="172" height="36" rx="3"/>
    <text class="t-own" x="384" y="300">OWNS</text>
    <rect class="use" x="556" y="278" width="172" height="36" rx="3"/>
    <text class="t-use" x="568" y="300">consumes</text>
    <rect class="use" x="740" y="278" width="172" height="36" rx="3"/>
    <text class="t-use" x="752" y="300">consumes</text>
  </g>
  <g id="er9">
    <text class="t-row" x="16" y="344">ER-9 final visuals wait for the hand-back</text>
    <rect class="own" x="372" y="322" width="172" height="36" rx="3"/>
    <text class="t-own" x="384" y="344">OWNS</text>
    <rect class="use" x="556" y="322" width="172" height="36" rx="3"/>
    <text class="t-use" x="568" y="344">consumes</text>
    <text class="t-na" x="752" y="344">&#8212;</text>
  </g>
  <g id="er13">
    <text class="t-row" x="16" y="388">ER-13 the proof</text>
    <rect class="use" x="372" y="366" width="172" height="36" rx="3"/>
    <text class="t-use" x="384" y="388">consumes</text>
    <rect class="use" x="556" y="366" width="172" height="36" rx="3"/>
    <text class="t-use" x="568" y="388">consumes</text>
    <rect class="own" x="740" y="366" width="172" height="36" rx="3"/>
    <text class="t-own" x="752" y="388">OWNS</text>
  </g>
</svg>
