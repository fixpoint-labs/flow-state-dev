<svg viewBox="0 0 940 414" role="img" xmlns="http://www.w3.org/2000/svg"
     aria-label="The path as of 30 September 2026, in phases rather than dates because Cycle PM has not scheduled the build. Now is this epic spec in review, before the gate. An input lane for the design: Claude Design's hand-back v1 came back during review, and design pass 2 runs from the gate to the final hand-back, a vertical line that gates final visuals only. An input lane for the sibling epics FIX-1650 to 1652, which nothing waits on. FIX-1655: its spec, then the token contract with neutral defaults, skin fixes and the re-sync check, then the light and dark App Lab values after the final hand-back. FIX-1662: its spec, then the frame and the project and workstream levels, then its final visual pass. FIX-1664: its spec beside FIX-1662's, then the task level once FIX-1662's frame has merged, then its final visual pass. FIX-1663: its QA plan written beside them, then its run after all three merge. The critical path runs the gate, design pass 2, the final passes and the closure run.">
  <style>
    :root { --surface:#FCFCFA; --surface-2:#E8E8E1; --ink:#191C21; --ink-2:#4C535B; --ink-3:#7A828B;
            --rule:#D5D4CB; --accent:#3E4E8C; --accent-soft:#E0E3F0; --code:#2C7C69; --code-soft:#DCEDE7;
            --prose:#A8761C; --prose-soft:#F3E8D2; --gone:#A9544F; }
    @media (prefers-color-scheme: dark) {
      :root { --surface:#181C1F; --surface-2:#202528; --ink:#E6E8E5; --ink-2:#A4ACB1; --ink-3:#737B81;
              --rule:#2B3135; --accent:#8B9BD8; --accent-soft:#1B2140; --code:#5DBBA1; --code-soft:#14302A;
              --prose:#D9A44B; --prose-soft:#332612; --gone:#DE8A84; } }
    .bg     { fill:var(--surface); }
    .flight { fill:var(--accent); stroke:none; }
    .todo   { fill:none; stroke:var(--ink-3); stroke-width:1.2; stroke-dasharray:4 3; }
    .input  { fill:var(--prose-soft); stroke:var(--prose); stroke-width:1.2; stroke-dasharray:4 3; }
    .axis   { stroke:var(--rule); stroke-width:1; }
    .hand   { stroke:var(--prose); stroke-width:1.4; stroke-dasharray:5 3; }
    .now    { stroke:var(--gone); stroke-width:1.4; }
    .crit   { fill:none; stroke:var(--gone); stroke-width:1.2; stroke-dasharray:3 3; }
    .t-lbl  { fill:var(--ink-3); font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:9.5px; letter-spacing:.1em; }
    .t-ln   { fill:var(--ink); font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:10px; }
    .t-in   { fill:var(--prose); font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:10px; }
    .t-s    { fill:var(--ink-2); font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:9px; }
    .t-w    { fill:var(--surface); font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:9px; }
    .t-now  { fill:var(--gone); font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:9.5px; letter-spacing:.06em; }
    .done   { fill:var(--prose); stroke:none; }
    .t-g    { fill:var(--gone); font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:9px; }
  </style>
  <rect class="bg" x="0" y="0" width="940" height="414"/>

  <text class="t-lbl" x="16" y="18">THE PATH &#8212; PHASES, NOT DATES &#183; CYCLE 2 CANDIDATE, NOT SCHEDULED</text>
  <path class="axis" d="M200 44 L924 44"/>
  <text class="t-now" x="206" y="36">now &#183; review</text>
  <text class="t-s" x="292" y="36">gate</text>
  <text class="t-s" x="420" y="36">build, in parallel</text>
  <text class="t-in" x="580" y="36">final hand-back</text>
  <text class="t-s" x="690" y="36">final visuals</text>
  <text class="t-s" x="806" y="36">closure run</text>
  <path class="now" d="M280 44 L280 342"/>
  <path class="hand" d="M640 44 L640 342"/>

  <g id="design">
    <text class="t-in" x="16" y="72">Claude Design &#183; input</text>
    <rect class="done" x="206" y="58" width="70" height="22" rx="3"/>
    <text class="t-w" x="212" y="73">v1 &#183; in</text>
    <rect class="input" x="296" y="58" width="336" height="22" rx="3"/>
    <text class="t-s" x="304" y="73">design pass 2 &#8594; the final hand-back, with Jake</text>
  </g>
  <g id="siblings">
    <text class="t-in" x="16" y="108">FIX-1650&#8211;1652 &#183; input</text>
    <text class="t-s" x="296" y="108">meaning for the empty states &#183; nothing here waits on it</text>
  </g>
  <g id="epic">
    <text class="t-ln" x="16" y="144">FIX-1649 &#183; this spec</text>
    <rect class="flight" x="206" y="130" width="70" height="22" rx="3"/>
    <text class="t-w" x="212" y="145">in review</text>
  </g>
  <g id="ds">
    <text class="t-ln" x="16" y="186">FIX-1655 &#183; design system</text>
    <rect class="todo" x="296" y="172" width="80" height="22" rx="3"/>
    <text class="t-s" x="304" y="187">spec</text>
    <rect class="todo" x="384" y="172" width="248" height="22" rx="3"/>
    <text class="t-s" x="392" y="187">contract &#183; defaults &#183; fixes &#183; re-sync</text>
    <rect class="todo" x="648" y="172" width="130" height="22" rx="3"/>
    <text class="t-s" x="656" y="187">light, dark values</text>
  </g>
  <g id="shell">
    <text class="t-ln" x="16" y="228">FIX-1662 &#183; App Lab shell</text>
    <rect class="todo" x="296" y="214" width="80" height="22" rx="3"/>
    <text class="t-s" x="304" y="229">spec</text>
    <rect class="todo" x="384" y="214" width="136" height="22" rx="3"/>
    <text class="t-s" x="392" y="229">frame &#183; two levels</text>
    <rect class="todo" x="648" y="214" width="130" height="22" rx="3"/>
    <text class="t-s" x="656" y="229">final visual pass</text>
  </g>
  <g id="task">
    <text class="t-ln" x="16" y="270">FIX-1664 &#183; task view</text>
    <rect class="todo" x="296" y="256" width="80" height="22" rx="3"/>
    <text class="t-s" x="304" y="271">spec</text>
    <rect class="todo" x="528" y="256" width="104" height="22" rx="3"/>
    <text class="t-s" x="536" y="271">task level</text>
    <rect class="todo" x="648" y="256" width="130" height="22" rx="3"/>
    <text class="t-s" x="656" y="271">final visual pass</text>
    <path class="crit" d="M520 225 L528 267"/>
  </g>
  <g id="closure">
    <text class="t-ln" x="16" y="312">FIX-1663 &#183; closure</text>
    <rect class="todo" x="384" y="298" width="120" height="22" rx="3"/>
    <text class="t-s" x="392" y="313">QA plan</text>
    <rect class="todo" x="794" y="298" width="120" height="22" rx="3"/>
    <text class="t-s" x="802" y="313">run, one commit</text>
  </g>
  <path class="crit" d="M276 141 L296 69 M632 69 L648 267 M778 267 L794 309"/>
  <text class="t-g" x="16" y="372">Critical path: gate &#8594; design pass 2 &#8594; the final passes &#8594; the closure run. The task level waits on the frame, not on design.</text>
  <text class="t-s" x="16" y="392">Bars are phases, not durations; widths are not estimates. Linear and the implementation PRs hold live state.</text>
</svg>
