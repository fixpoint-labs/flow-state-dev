<svg viewBox="0 0 940 422" role="img" aria-label="D1: how is the org-primitives epic cut? Chosen: three issues and a closure, where only the issues an open question touches wait for Jake: FIX-1718 on Q1, and FIX-1719 on Q2 until Jake answered it on 1 October 2026. Instead of: five issues, one per noun (project, workstream, CoS, Ops, repair). It comes down to the first row, what waits on Jake: with three, one issue (the orphan repair) starts at the gate and two wait; with five, four wait. Second row: a workstream already is a declared channel with its boards, so the three-issue cut writes it as a rule, where five gives it an issue with nothing to build. The price, third row: one spec carries both CoS and Ops. Locks in: FIX-1621 starts at the gate; FIX-1718 and FIX-1719 file specs only after Jake answers their question; Q2 is answered. Flips if Jake&#x27;s answer gives CoS behaviour of its own, such as routing or standing reports."
     xmlns="http://www.w3.org/2000/svg">
  <style>
    :root { --surface:#FCFCFA; --surface-2:#E8E8E1; --ink:#191C21; --ink-2:#4C535B; --ink-3:#7A828B;
            --rule:#D5D4CB; --accent:#3E4E8C; --accent-soft:#E0E3F0; --code:#2C7C69; --code-soft:#DCEDE7;
            --gone:#A9544F; }
    @media (prefers-color-scheme: dark) {
      :root { --surface:#181C1F; --surface-2:#202528; --ink:#E6E8E5; --ink-2:#A4ACB1; --ink-3:#737B81;
              --rule:#2B3135; --accent:#8B9BD8; --accent-soft:#1B2140; --code:#5DBBA1; --code-soft:#14302A;
              --gone:#DE8A84; } }
    .bg     { fill:var(--surface); }
    .ask    { fill:var(--surface-2); }
    .chosen { fill:var(--code-soft); stroke:var(--code); stroke-width:1.6; }
    .rec    { fill:var(--code-soft); stroke:var(--code); stroke-width:1.6; stroke-dasharray:6 3; }
    .lost   { fill:var(--surface); stroke:var(--rule); stroke-width:1.4; stroke-dasharray:5 4; }
    .decide { fill:var(--accent-soft); }
    .bar    { fill:var(--accent); }
    .row    { stroke:var(--rule); stroke-width:1; }
    .foot   { fill:var(--surface-2); }
    .t-lbl  { fill:var(--ink-3); font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:9.5px; letter-spacing:.1em; }
    .t-tag  { font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:9.5px; letter-spacing:.1em; font-weight:600; }
    .t-q    { fill:var(--ink); font-family:system-ui,-apple-system,sans-serif; font-weight:600; font-size:15px; }
    .t-h    { font-family:system-ui,-apple-system,sans-serif; font-weight:600; font-size:14px; }
    .t-b    { fill:var(--ink); font-family:system-ui,-apple-system,sans-serif; font-size:12.5px; }
    .t-s    { fill:var(--ink-2); font-family:system-ui,-apple-system,sans-serif; font-size:11px; }
    .mark   { font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:16px; font-weight:700; }
    .plus   { fill:var(--code); }
    .minus  { fill:var(--gone); }
    .tie    { fill:var(--ink-3); }
    .c-code { fill:var(--code); }
    .c-mute { fill:var(--ink-3); }
    .c-lost { fill:var(--ink-2); }
    .c-acc  { fill:var(--accent); }
  </style>
  <rect class="bg" x="0" y="0" width="940" height="422"/>

  <g id="the-call">
    <rect class="ask" x="16" y="14" width="908" height="48" rx="6"/>
    <text class="t-lbl" x="32" y="32">D1 &#183; THE CALL</text>
    <text class="t-q" x="32" y="52">How is the set cut, given two questions only Jake can answer?</text>
  </g>

  <g id="options">
    <rect class="chosen" x="212" y="76" width="348" height="46" rx="5"/>
    <text class="t-tag c-code" x="228" y="93">CHOSEN</text>
    <text class="t-h c-code" x="228" y="112">Three issues and a closure</text>
    <rect class="lost" x="576" y="76" width="348" height="46" rx="5"/>
    <text class="t-tag c-mute" x="592" y="93">INSTEAD OF</text>
    <text class="t-h c-lost" x="592" y="112">Five, one per noun</text>
  </g>

  <g id="row-1">
    <rect class="decide" x="16" y="134" width="908" height="62" rx="4"/>
    <rect class="bar" x="16" y="134" width="4" height="62"/>
    <text class="t-lbl" x="32" y="156">WHAT WAITS</text>
    <text class="t-lbl" x="32" y="169">ON JAKE</text>
    <text class="t-tag c-acc" x="32" y="186">&#9656; DECIDES IT</text>
    <text class="mark plus" x="228" y="162">+</text>
    <text class="t-b" x="248" y="161">Two specs wait; repair starts</text>
    <text class="t-s" x="248" y="179">FIX-1621 needs no answer</text>
    <text class="mark minus" x="592" y="162">&#8722;</text>
    <text class="t-b" x="612" y="161">Four of five wait</text>
    <text class="t-s" x="612" y="179">project, CoS, Ops, workstream</text>
  </g>

  <g id="row-2">
    <text class="t-lbl" x="32" y="218">A WORKSTREAM</text>
    <text class="mark plus" x="228" y="224">+</text>
    <text class="t-b" x="248" y="223">A rule, not an issue</text>
    <text class="t-s" x="248" y="241">it already is a channel and its boards</text>
    <text class="mark minus" x="592" y="224">&#8722;</text>
    <text class="t-b" x="612" y="223">An issue with nothing to build</text>
    <text class="t-s" x="612" y="241">Shift Manager lists them today</text>
    <line class="row" x1="16" y1="254" x2="924" y2="254"/>
  </g>

  <g id="row-3">
    <text class="t-lbl" x="32" y="276">SIZE OF</text>
    <text class="t-lbl" x="32" y="289">A SPEC</text>
    <text class="mark minus" x="228" y="282">&#8722;</text>
    <text class="t-b" x="248" y="281">One spec carries CoS and Ops</text>
    <text class="t-s" x="248" y="299">one template, one policy</text>
    <text class="mark plus" x="592" y="282">+</text>
    <text class="t-b" x="612" y="281">Each spec is small</text>
    <text class="t-s" x="612" y="299">one seat each</text>
    <line class="row" x1="16" y1="312" x2="924" y2="312"/>
  </g>

  <g id="locks-in">
    <rect class="foot" x="16" y="332" width="446" height="74" rx="5"/>
    <text class="t-lbl" x="32" y="353">LOCKS IN</text>
    <text class="t-b" x="32" y="373">FIX-1621 starts at the gate</text>
    <text class="t-s" x="32" y="391">FIX-1718 waits for Q1; FIX-1719 for Q2, now answered</text>
  </g>

  <g id="flips-if">
    <rect class="foot" x="478" y="332" width="446" height="74" rx="5"/>
    <text class="t-lbl" x="494" y="353">FLIPS IF</text>
    <text class="t-b" x="494" y="373">CoS gets behaviour of its own</text>
    <text class="t-s" x="494" y="391">routing or standing reports: CoS splits from Ops</text>
  </g>
</svg>
