<svg viewBox="0 0 940 422" role="img" aria-label="D2: where do a project and a workstream live? Chosen: in what the Lab&#x27;s tree already declares, channels, boards, teams and documents, as product framing with nothing new in Layer 1 and no new folder. Instead of: a project record or folder of its own, workforce/projects, which is invent-killed. It comes down to the first row: the tree as it is adds no noun, where a folder of its own reopens an invent-kill and needs an escalation. Second row, the cost to undo: at most one key per channel file, where a stored type needs a migration. The price, third row: a project can hold only what a channel, team or document holds. Locks in: Q1 is answered inside channels, teams, boards and documents; an answer that needs a folder or a Layer 1 type is an escalation. Flips if a project must own something none of those can hold, such as a budget or a membership of its own."
     xmlns="http://www.w3.org/2000/svg">
  <style>
    :root { --surface:#FCFCFA; --surface-2:#E8E8E1; --ink:#191C21; --ink-2:#4C535B; --ink-3:#7A828B;
            --rule:#D5D4CB; --accent:#3E4E8C; --accent-soft:#E0E3F0; --code:#2C7C69; --code-soft:#DCEDE7;
            --gone:#A9544F; }
    @media (prefers-color-scheme: dark) {
      :root { --surface:#181C1F; --surface-2:#202528; --ink:#E6E8E5; --ink-2:#A4ACB1; --ink-3:#737B81;
              --rule:#2B3135; --accent:#8B9BD8; --accent-soft:#1B2140; --code:#5DBBA1; --code-soft:#14302A;
              --gone:#DE8A84; } }
    .bg     { fill:var(--surface); }
    .ask    { fill:var(--surface-2); }
    .chosen { fill:var(--code-soft); stroke:var(--code); stroke-width:1.6; }
    .rec    { fill:var(--code-soft); stroke:var(--code); stroke-width:1.6; stroke-dasharray:6 3; }
    .lost   { fill:var(--surface); stroke:var(--rule); stroke-width:1.4; stroke-dasharray:5 4; }
    .decide { fill:var(--accent-soft); }
    .bar    { fill:var(--accent); }
    .row    { stroke:var(--rule); stroke-width:1; }
    .foot   { fill:var(--surface-2); }
    .t-lbl  { fill:var(--ink-3); font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:9.5px; letter-spacing:.1em; }
    .t-tag  { font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:9.5px; letter-spacing:.1em; font-weight:600; }
    .t-q    { fill:var(--ink); font-family:system-ui,-apple-system,sans-serif; font-weight:600; font-size:15px; }
    .t-h    { font-family:system-ui,-apple-system,sans-serif; font-weight:600; font-size:14px; }
    .t-b    { fill:var(--ink); font-family:system-ui,-apple-system,sans-serif; font-size:12.5px; }
    .t-s    { fill:var(--ink-2); font-family:system-ui,-apple-system,sans-serif; font-size:11px; }
    .mark   { font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:16px; font-weight:700; }
    .plus   { fill:var(--code); }
    .minus  { fill:var(--gone); }
    .tie    { fill:var(--ink-3); }
    .c-code { fill:var(--code); }
    .c-mute { fill:var(--ink-3); }
    .c-lost { fill:var(--ink-2); }
    .c-acc  { fill:var(--accent); }
  </style>
  <rect class="bg" x="0" y="0" width="940" height="422"/>

  <g id="the-call">
    <rect class="ask" x="16" y="14" width="908" height="48" rx="6"/>
    <text class="t-lbl" x="32" y="32">D2 &#183; THE CALL</text>
    <text class="t-q" x="32" y="52">Where do a project and a workstream live?</text>
  </g>

  <g id="options">
    <rect class="chosen" x="212" y="76" width="348" height="46" rx="5"/>
    <text class="t-tag c-code" x="228" y="93">CHOSEN</text>
    <text class="t-h c-code" x="228" y="112">In the tree as it is</text>
    <rect class="lost" x="576" y="76" width="348" height="46" rx="5"/>
    <text class="t-tag c-mute" x="592" y="93">INSTEAD OF</text>
    <text class="t-h c-lost" x="592" y="112">A project folder or record</text>
  </g>

  <g id="row-1">
    <rect class="decide" x="16" y="134" width="908" height="62" rx="4"/>
    <rect class="bar" x="16" y="134" width="4" height="62"/>
    <text class="t-lbl" x="32" y="156">NEW NOUN</text>
    <text class="t-tag c-acc" x="32" y="186">&#9656; DECIDES IT</text>
    <text class="mark plus" x="228" y="162">+</text>
    <text class="t-b" x="248" y="161">None</text>
    <text class="t-s" x="248" y="179">channels, boards, teams, documents</text>
    <text class="mark minus" x="592" y="162">&#8722;</text>
    <text class="t-b" x="612" y="161">Reopens an invent-kill</text>
    <text class="t-s" x="612" y="179">workforce/projects/: an escalation</text>
  </g>

  <g id="row-2">
    <text class="t-lbl" x="32" y="218">COST TO</text>
    <text class="t-lbl" x="32" y="231">UNDO</text>
    <text class="mark plus" x="228" y="224">+</text>
    <text class="t-b" x="248" y="223">At most a key per channel file</text>
    <text class="t-s" x="248" y="241">no stored data</text>
    <text class="mark minus" x="592" y="224">&#8722;</text>
    <text class="t-b" x="612" y="223">A migration</text>
    <text class="t-s" x="612" y="241">a stored type, read everywhere</text>
    <line class="row" x1="16" y1="254" x2="924" y2="254"/>
  </g>

  <g id="row-3">
    <text class="t-lbl" x="32" y="276">WHAT A</text>
    <text class="t-lbl" x="32" y="289">PROJECT HOLDS</text>
    <text class="mark minus" x="228" y="282">&#8722;</text>
    <text class="t-b" x="248" y="281">Only what those already hold</text>
    <text class="t-s" x="248" y="299">no budget, no members of its own</text>
    <text class="mark plus" x="592" y="282">+</text>
    <text class="t-b" x="612" y="281">Anything we add to it</text>
    <text class="t-s" x="612" y="299">at the price of a new noun</text>
    <line class="row" x1="16" y1="312" x2="924" y2="312"/>
  </g>

  <g id="locks-in">
    <rect class="foot" x="16" y="332" width="446" height="74" rx="5"/>
    <text class="t-lbl" x="32" y="353">LOCKS IN</text>
    <text class="t-b" x="32" y="373">Q1 is answered inside the tree</text>
    <text class="t-s" x="32" y="391">a folder or L1 answer is an escalation</text>
  </g>

  <g id="flips-if">
    <rect class="foot" x="478" y="332" width="446" height="74" rx="5"/>
    <text class="t-lbl" x="494" y="353">FLIPS IF</text>
    <text class="t-b" x="494" y="373">A project must own what nothing holds</text>
    <text class="t-s" x="494" y="391">a budget, or a membership of its own</text>
  </g>
</svg>
