<svg viewBox="0 0 940 422" role="img" aria-label="D3, amended with Q1&#x27;s answer: what may happen to channels at runtime in this epic? Chosen: channels stay declared on disk and opened at boot, plus one runtime move, minting a person&#x27;s talk session about a project from a template when the project is created or when the person joins. Instead of: CoS opening, retiring and inviting to channels. It comes down to the first row, what exists to build on: mint and join run on shipped Layer 1, a collection reaction, a cross-flow dispatcher and session state, as the FIX-1728 spike ran them, where channel admin is an explore parked behind Collab mint, FIX-1341. Second row: no dependency outside the set, where the other needs FIX-1341 un-parked. The price, third row: a new workstream is still a CHANNEL.md file and a restart. Locks in: mint on create and join, nothing else; retire, invite and rename stay parked. Flips if Collab lands first or Jake chooses to wait for it; then the slice folds into FIX-1341."
     xmlns="http://www.w3.org/2000/svg">
  <style>
    :root { --surface:#FCFCFA; --surface-2:#E8E8E1; --ink:#191C21; --ink-2:#4C535B; --ink-3:#7A828B;
            --rule:#D5D4CB; --accent:#3E4E8C; --accent-soft:#E0E3F0; --code:#2C7C69; --code-soft:#DCEDE7;
            --gone:#A9544F; }
    @media (prefers-color-scheme: dark) {
      :root { --surface:#181C1F; --surface-2:#202528; --ink:#E6E8E5; --ink-2:#A4ACB1; --ink-3:#737B81;
              --rule:#2B3135; --accent:#8B9BD8; --accent-soft:#1B2140; --code:#5DBBA1; --code-soft:#14302A;
              --gone:#DE8A84; } }
    .bg     { fill:var(--surface); }
    .ask    { fill:var(--surface-2); }
    .chosen { fill:var(--code-soft); stroke:var(--code); stroke-width:1.6; }
    .lost   { fill:var(--surface); stroke:var(--rule); stroke-width:1.4; stroke-dasharray:5 4; }
    .decide { fill:var(--accent-soft); }
    .bar    { fill:var(--accent); }
    .row    { stroke:var(--rule); stroke-width:1; }
    .foot   { fill:var(--surface-2); }
    .t-lbl  { fill:var(--ink-3); font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:9.5px; letter-spacing:.1em; }
    .t-tag  { font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:9.5px; letter-spacing:.1em; font-weight:600; }
    .t-q    { fill:var(--ink); font-family:system-ui,-apple-system,sans-serif; font-weight:600; font-size:15px; }
    .t-h    { font-family:system-ui,-apple-system,sans-serif; font-weight:600; font-size:14px; }
    .t-b    { fill:var(--ink); font-family:system-ui,-apple-system,sans-serif; font-size:12.5px; }
    .t-s    { fill:var(--ink-2); font-family:system-ui,-apple-system,sans-serif; font-size:11px; }
    .mark   { font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:16px; font-weight:700; }
    .plus   { fill:var(--code); }
    .minus  { fill:var(--gone); }
    .c-code { fill:var(--code); }
    .c-mute { fill:var(--ink-3); }
    .c-lost { fill:var(--ink-2); }
    .c-acc  { fill:var(--accent); }
  </style>
  <rect class="bg" x="0" y="0" width="940" height="422"/>

  <g id="the-call">
    <rect class="ask" x="16" y="14" width="908" height="48" rx="6"/>
    <text class="t-lbl" x="32" y="32">D3 &#183; THE CALL &#183; AMENDED WITH Q1</text>
    <text class="t-q" x="32" y="52">What may happen to channels at runtime here?</text>
  </g>

  <g id="options">
    <rect class="chosen" x="212" y="76" width="348" height="46" rx="5"/>
    <text class="t-tag c-code" x="228" y="93">CHOSEN</text>
    <text class="t-h c-code" x="228" y="112">Declared, plus a template mint</text>
    <rect class="lost" x="576" y="76" width="348" height="46" rx="5"/>
    <text class="t-tag c-mute" x="592" y="93">INSTEAD OF</text>
    <text class="t-h c-lost" x="592" y="112">CoS opens, retires and invites</text>
  </g>

  <g id="row-1">
    <rect class="decide" x="16" y="134" width="908" height="62" rx="4"/>
    <rect class="bar" x="16" y="134" width="4" height="62"/>
    <text class="t-lbl" x="32" y="156">WHAT EXISTS</text>
    <text class="t-lbl" x="32" y="169">TO BUILD ON</text>
    <text class="t-tag c-acc" x="32" y="186">&#9656; DECIDES IT</text>
    <text class="mark plus" x="228" y="162">+</text>
    <text class="t-b" x="248" y="161">Mint and join run on shipped L1</text>
    <text class="t-s" x="248" y="179">FIX-1728 ran both, no L1 change</text>
    <text class="mark minus" x="592" y="162">&#8722;</text>
    <text class="t-b" x="612" y="161">An explore, parked</text>
    <text class="t-s" x="612" y="179">channel admin waits on Collab mint</text>
  </g>

  <g id="row-2">
    <text class="t-lbl" x="32" y="218">OUTSIDE</text>
    <text class="t-lbl" x="32" y="231">DEPENDENCY</text>
    <text class="mark plus" x="228" y="224">+</text>
    <text class="t-b" x="248" y="223">None</text>
    <text class="t-s" x="248" y="241">the set runs on what ships</text>
    <text class="mark minus" x="592" y="224">&#8722;</text>
    <text class="t-b" x="612" y="223">Un-park FIX-1341</text>
    <text class="t-s" x="612" y="241">an epic nobody has scheduled</text>
    <line class="row" x1="16" y1="254" x2="924" y2="254"/>
  </g>

  <g id="row-3">
    <text class="t-lbl" x="32" y="276">A NEW</text>
    <text class="t-lbl" x="32" y="289">WORKSTREAM</text>
    <text class="mark minus" x="228" y="282">&#8722;</text>
    <text class="t-b" x="248" y="281">A CHANNEL.md and a restart</text>
    <text class="t-s" x="248" y="299">until channel admin ships</text>
    <text class="mark plus" x="592" y="282">+</text>
    <text class="t-b" x="612" y="281">One ask to CoS</text>
    <text class="t-s" x="612" y="299">no restart</text>
    <line class="row" x1="16" y1="312" x2="924" y2="312"/>
  </g>

  <g id="locks-in">
    <rect class="foot" x="16" y="332" width="446" height="74" rx="5"/>
    <text class="t-lbl" x="32" y="353">LOCKS IN</text>
    <text class="t-b" x="32" y="373">Mint on create and on join, nothing else</text>
    <text class="t-s" x="32" y="391">retire, invite and rename stay parked</text>
  </g>

  <g id="flips-if">
    <rect class="foot" x="478" y="332" width="446" height="74" rx="5"/>
    <text class="t-lbl" x="494" y="353">FLIPS IF</text>
    <text class="t-b" x="494" y="373">Jake chooses to wait for Collab</text>
    <text class="t-s" x="494" y="391">then the slice folds into FIX-1341</text>
  </g>
</svg>
