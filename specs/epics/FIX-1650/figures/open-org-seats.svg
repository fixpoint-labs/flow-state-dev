<svg viewBox="0 0 940 422" role="img" aria-label="Open question Q2, for Jake: which org seats does a Lab get, and may Ops change the roster without asking? Recommended, not yet chosen: a CoS seat and an Ops seat that a Lab opts into, both on the built-in agent kind, where every hire and every fire is an approval the person answers in Inbox. Beside it: an Ops seat alone, booted in every Lab, that hires and fires on its own within a list of allowed kinds. It comes down to the first row, who changes the roster: the person, one approval each, where the other lets a model do it inside a list. Second row: a Lab that wants neither adds nothing under the recommendation, and gets seats it never declared under the other. The price, third row: an Inbox approval for every hire and fire. Locks in: every roster change in this epic is a person&#x27;s approval, and FIX-1719 makes org seats hireable, each landing in the person&#x27;s own cell. Flips if Jake wants hires to happen unattended, for example overnight."
     xmlns="http://www.w3.org/2000/svg">
  <style>
    :root { --surface:#FCFCFA; --surface-2:#E8E8E1; --ink:#191C21; --ink-2:#4C535B; --ink-3:#7A828B;
            --rule:#D5D4CB; --accent:#3E4E8C; --accent-soft:#E0E3F0; --code:#2C7C69; --code-soft:#DCEDE7;
            --gone:#A9544F; }
    @media (prefers-color-scheme: dark) {
      :root { --surface:#181C1F; --surface-2:#202528; --ink:#E6E8E5; --ink-2:#A4ACB1; --ink-3:#737B81;
              --rule:#2B3135; --accent:#8B9BD8; --accent-soft:#1B2140; --code:#5DBBA1; --code-soft:#14302A;
              --gone:#DE8A84; } }
    .bg     { fill:var(--surface); }
    .ask    { fill:var(--surface-2); }
    .chosen { fill:var(--code-soft); stroke:var(--code); stroke-width:1.6; }
    .rec    { fill:var(--code-soft); stroke:var(--code); stroke-width:1.6; stroke-dasharray:6 3; }
    .lost   { fill:var(--surface); stroke:var(--rule); stroke-width:1.4; stroke-dasharray:5 4; }
    .decide { fill:var(--accent-soft); }
    .bar    { fill:var(--accent); }
    .row    { stroke:var(--rule); stroke-width:1; }
    .foot   { fill:var(--surface-2); }
    .t-lbl  { fill:var(--ink-3); font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:9.5px; letter-spacing:.1em; }
    .t-tag  { font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:9.5px; letter-spacing:.1em; font-weight:600; }
    .t-q    { fill:var(--ink); font-family:system-ui,-apple-system,sans-serif; font-weight:600; font-size:15px; }
    .t-h    { font-family:system-ui,-apple-system,sans-serif; font-weight:600; font-size:14px; }
    .t-b    { fill:var(--ink); font-family:system-ui,-apple-system,sans-serif; font-size:12.5px; }
    .t-s    { fill:var(--ink-2); font-family:system-ui,-apple-system,sans-serif; font-size:11px; }
    .mark   { font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:16px; font-weight:700; }
    .plus   { fill:var(--code); }
    .minus  { fill:var(--gone); }
    .tie    { fill:var(--ink-3); }
    .c-code { fill:var(--code); }
    .c-mute { fill:var(--ink-3); }
    .c-lost { fill:var(--ink-2); }
    .c-acc  { fill:var(--accent); }
  </style>
  <rect class="bg" x="0" y="0" width="940" height="422"/>

  <g id="the-call">
    <rect class="ask" x="16" y="14" width="908" height="48" rx="6"/>
    <text class="t-lbl" x="32" y="32">Q2 &#183; OPEN &#183; FOR JAKE</text>
    <text class="t-q" x="32" y="52">Which org seats does a Lab get, and may Ops hire without asking?</text>
  </g>

  <g id="options">
    <rect class="rec" x="212" y="76" width="348" height="46" rx="5"/>
    <text class="t-tag c-code" x="228" y="93">RECOMMENDED</text>
    <text class="t-h c-code" x="228" y="112">CoS and Ops, opt-in, Ops asks</text>
    <rect class="lost" x="576" y="76" width="348" height="46" rx="5"/>
    <text class="t-tag c-mute" x="592" y="93">INSTEAD OF</text>
    <text class="t-h c-lost" x="592" y="112">Ops alone, always on, hires freely</text>
  </g>

  <g id="row-1">
    <rect class="decide" x="16" y="134" width="908" height="62" rx="4"/>
    <rect class="bar" x="16" y="134" width="4" height="62"/>
    <text class="t-lbl" x="32" y="156">WHO CHANGES</text>
    <text class="t-lbl" x="32" y="169">THE ROSTER</text>
    <text class="t-tag c-acc" x="32" y="186">&#9656; DECIDES IT</text>
    <text class="mark plus" x="228" y="162">+</text>
    <text class="t-b" x="248" y="161">The person, one approval each</text>
    <text class="t-s" x="248" y="179">Approve in Inbox, then it happens</text>
    <text class="mark minus" x="592" y="162">&#8722;</text>
    <text class="t-b" x="612" y="161">A model, inside a list</text>
    <text class="t-s" x="612" y="179">the person reads about it after</text>
  </g>

  <g id="row-2">
    <text class="t-lbl" x="32" y="218">A LAB THAT</text>
    <text class="t-lbl" x="32" y="231">WANTS NEITHER</text>
    <text class="mark plus" x="228" y="224">+</text>
    <text class="t-b" x="248" y="223">Adds nothing</text>
    <text class="t-s" x="248" y="241">the seats are documents it opts into</text>
    <text class="mark minus" x="592" y="224">&#8722;</text>
    <text class="t-b" x="612" y="223">Gets seats it never declared</text>
    <text class="t-s" x="612" y="241">booted in every Lab</text>
    <line class="row" x1="16" y1="254" x2="924" y2="254"/>
  </g>

  <g id="row-3">
    <text class="t-lbl" x="32" y="276">FRICTION</text>
    <text class="mark minus" x="228" y="282">&#8722;</text>
    <text class="t-b" x="248" y="281">An approval per hire and fire</text>
    <text class="t-s" x="248" y="299">a click each, in Inbox</text>
    <text class="mark plus" x="592" y="282">+</text>
    <text class="t-b" x="612" y="281">None</text>
    <text class="t-s" x="612" y="299">the roster just changes</text>
    <line class="row" x1="16" y1="312" x2="924" y2="312"/>
  </g>

  <g id="locks-in">
    <rect class="foot" x="16" y="332" width="446" height="74" rx="5"/>
    <text class="t-lbl" x="32" y="353">LOCKS IN</text>
    <text class="t-b" x="32" y="373">Every roster change is a person's approval</text>
    <text class="t-s" x="32" y="391">FIX-1719 ships them and makes org seats hireable</text>
  </g>

  <g id="flips-if">
    <rect class="foot" x="478" y="332" width="446" height="74" rx="5"/>
    <text class="t-lbl" x="494" y="353">FLIPS IF</text>
    <text class="t-b" x="494" y="373">Jake wants hires to happen unattended</text>
    <text class="t-s" x="494" y="391">for example overnight</text>
  </g>
</svg>
