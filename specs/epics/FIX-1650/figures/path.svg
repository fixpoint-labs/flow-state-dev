<svg viewBox="0 0 940 352" role="img" xmlns="http://www.w3.org/2000/svg"
     aria-label="The path as of 1 October 2026, in phases rather than dates, because implementation timing is Jake's call and Cycle PM has not scheduled it. Now is this epic spec in review. An input lane awaiting Jake's answer to Q1, expected at or after the gate; he answered Q2 on 1 October 2026. FIX-1621, orphan repair: its spec starts at the gate, then its build. FIX-1718, projects: waits for Q1, then its spec and build. FIX-1719, Chief of Staff: its spec starts once the amendment recording Q2's answer merges, and its build waits for FIX-1621's build. FIX-1720, the closure: its QA plan is written beside the others, then its run after all three merge. FIX-1621 finishes before the FIX-1719 build starts. The critical path runs the gate, FIX-1621's spec and build, the FIX-1719 build, and the closure run.">
  <style>
    :root { --surface:#FCFCFA; --surface-2:#E8E8E1; --ink:#191C21; --ink-2:#4C535B; --ink-3:#7A828B;
            --rule:#D5D4CB; --accent:#3E4E8C; --accent-soft:#E0E3F0; --code:#2C7C69; --code-soft:#DCEDE7;
            --prose:#A8761C; --prose-soft:#F3E8D2; --gone:#A9544F; }
    @media (prefers-color-scheme: dark) {
      :root { --surface:#181C1F; --surface-2:#202528; --ink:#E6E8E5; --ink-2:#A4ACB1; --ink-3:#737B81;
              --rule:#2B3135; --accent:#8B9BD8; --accent-soft:#1B2140; --code:#5DBBA1; --code-soft:#14302A;
              --prose:#D9A44B; --prose-soft:#332612; --gone:#DE8A84; } }
    .bg     { fill:var(--surface); }
    .flight { fill:var(--accent); stroke:none; }
    .todo   { fill:none; stroke:var(--ink-3); stroke-width:1.2; stroke-dasharray:4 3; }
    .input  { fill:var(--prose-soft); stroke:var(--prose); stroke-width:1.2; stroke-dasharray:4 3; }
    .axis   { stroke:var(--rule); stroke-width:1; }
    .now    { stroke:var(--gone); stroke-width:1.4; }
    .crit   { fill:none; stroke:var(--gone); stroke-width:1.2; stroke-dasharray:3 3; }
    .t-lbl  { fill:var(--ink-3); font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:9.5px; letter-spacing:.1em; }
    .t-ln   { fill:var(--ink); font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:10px; }
    .t-in   { fill:var(--prose); font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:10px; }
    .t-s    { fill:var(--ink-2); font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:9px; }
    .t-w    { fill:var(--surface); font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:9px; }
    .t-now  { fill:var(--gone); font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:9.5px; letter-spacing:.06em; }
  </style>
  <rect class="bg" x="0" y="0" width="940" height="352"/>
  <text class="t-lbl" x="16" y="18">THE PATH &#8212; PHASES, NOT DATES &#183; NOT CYCLE 1 &#183; TIMING IS JAKE'S CALL</text>
  <path class="axis" d="M200 44 L924 44"/>
  <text class="t-now" x="206" y="36">now &#183; review</text>
  <text class="t-s" x="292" y="36">gate</text>
  <text class="t-s" x="380" y="36">answers</text>
  <text class="t-s" x="480" y="36">specs and builds</text>
  <text class="t-s" x="806" y="36">closure run</text>
  <path class="now" d="M280 44 L280 306"/>
  <g id="answers">
    <text class="t-in" x="16" y="72">Jake &#183; Q1 &#183; input</text>
    <rect class="input" x="296" y="58" width="110" height="22" rx="3"/>
    <text class="t-s" x="304" y="73">awaiting Q1</text>
  </g>
  <g id="epic">
    <text class="t-ln" x="16" y="114">FIX-1650 &#183; this spec</text>
    <rect class="flight" x="206" y="100" width="70" height="22" rx="3"/>
    <text class="t-w" x="214" y="115">in review</text>
  </g>
  <g id="repair">
    <text class="t-ln" x="16" y="156">FIX-1621 &#183; repair</text>
    <rect class="todo" x="296" y="142" width="90" height="22" rx="3"/>
    <text class="t-s" x="304" y="157">spec</text>
    <rect class="todo" x="394" y="142" width="150" height="22" rx="3"/>
    <text class="t-s" x="402" y="157">build</text>
  </g>
  <g id="projects">
    <text class="t-ln" x="16" y="198">FIX-1718 &#183; projects</text>
    <rect class="todo" x="456" y="184" width="110" height="22" rx="3"/>
    <text class="t-s" x="464" y="199">spec, after Q1</text>
    <rect class="todo" x="574" y="184" width="200" height="22" rx="3"/>
    <text class="t-s" x="582" y="199">build</text>
  </g>
  <g id="org-seats">
    <text class="t-ln" x="16" y="240">FIX-1719 &#183; CoS</text>
    <rect class="todo" x="296" y="226" width="150" height="22" rx="3"/>
    <text class="t-s" x="304" y="241">spec, Q2 answered</text>
    <rect class="todo" x="574" y="226" width="200" height="22" rx="3"/>
    <text class="t-s" x="582" y="241">build, after FIX-1621</text>
  </g>
  <g id="closure">
    <text class="t-ln" x="16" y="282">FIX-1720 &#183; closure</text>
    <rect class="todo" x="296" y="268" width="270" height="22" rx="3"/>
    <text class="t-s" x="304" y="283">QA plan, written beside them</text>
    <rect class="todo" x="784" y="268" width="132" height="22" rx="3"/>
    <text class="t-s" x="792" y="283">run</text>
  </g>
  <path class="crit" d="M296 168 L570 168 L570 252 L774 252 L774 294 L916 294"/>
  <text class="t-s" x="16" y="330">dashed red: the critical path &#183; FIX-1621 &#8594; FIX-1719 build &#8594; the closure run</text>
</svg>
