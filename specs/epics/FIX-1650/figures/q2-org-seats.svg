<svg viewBox="0 0 940 422" role="img" aria-label="Q2, decided by Jake on 1 October 2026: which org seat does a Lab get, and may it hire without asking? Chosen: one CoS seat a Lab opts into, on the built-in agent kind, the only seat that hires, hiring without asking and every fire is still an approval the person answers in Inbox. Instead of the recommendation the epic made: the same seat, with an Inbox approval on every hire as well as every fire. It comes down to the first row, the friction on a hire: none under the choice, a click in Inbox each time under the other. Second row, a tie: fire and retire are approved in Inbox either way, because a fire removes the seat's inventory row. The price, third row: a model picks who joins, within the kinds the Lab registers, never a declared seat's id. Locks in: CoS hires unattended and the approval seam stays built for fires. Flips if Jake turns hire approval back on, a policy switch ER-20 describes."
     xmlns="http://www.w3.org/2000/svg">
  <style>
    :root { --surface:#FCFCFA; --surface-2:#E8E8E1; --ink:#191C21; --ink-2:#4C535B; --ink-3:#7A828B;
            --rule:#D5D4CB; --accent:#3E4E8C; --accent-soft:#E0E3F0; --code:#2C7C69; --code-soft:#DCEDE7;
            --gone:#A9544F; }
    @media (prefers-color-scheme: dark) {
      :root { --surface:#181C1F; --surface-2:#202528; --ink:#E6E8E5; --ink-2:#A4ACB1; --ink-3:#737B81;
              --rule:#2B3135; --accent:#8B9BD8; --accent-soft:#1B2140; --code:#5DBBA1; --code-soft:#14302A;
              --gone:#DE8A84; } }
    .bg     { fill:var(--surface); }
    .ask    { fill:var(--surface-2); }
    .chosen { fill:var(--code-soft); stroke:var(--code); stroke-width:1.6; }
    .rec    { fill:var(--code-soft); stroke:var(--code); stroke-width:1.6; stroke-dasharray:6 3; }
    .lost   { fill:var(--surface); stroke:var(--rule); stroke-width:1.4; stroke-dasharray:5 4; }
    .decide { fill:var(--accent-soft); }
    .bar    { fill:var(--accent); }
    .row    { stroke:var(--rule); stroke-width:1; }
    .foot   { fill:var(--surface-2); }
    .t-lbl  { fill:var(--ink-3); font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:9.5px; letter-spacing:.1em; }
    .t-tag  { font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:9.5px; letter-spacing:.1em; font-weight:600; }
    .t-q    { fill:var(--ink); font-family:system-ui,-apple-system,sans-serif; font-weight:600; font-size:15px; }
    .t-h    { font-family:system-ui,-apple-system,sans-serif; font-weight:600; font-size:14px; }
    .t-b    { fill:var(--ink); font-family:system-ui,-apple-system,sans-serif; font-size:12.5px; }
    .t-s    { fill:var(--ink-2); font-family:system-ui,-apple-system,sans-serif; font-size:11px; }
    .mark   { font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:16px; font-weight:700; }
    .plus   { fill:var(--code); }
    .minus  { fill:var(--gone); }
    .tie    { fill:var(--ink-3); }
    .c-code { fill:var(--code); }
    .c-mute { fill:var(--ink-3); }
    .c-lost { fill:var(--ink-2); }
    .c-acc  { fill:var(--accent); }
  </style>
  <rect class="bg" x="0" y="0" width="940" height="422"/>

  <g id="the-call">
    <rect class="ask" x="16" y="14" width="908" height="48" rx="6"/>
    <text class="t-lbl" x="32" y="32">Q2 &#183; DECIDED &#183; JAKE, 1 OCTOBER 2026</text>
    <text class="t-q" x="32" y="52">Which org seat does a Lab get, and may it hire without asking?</text>
  </g>

  <g id="options">
    <rect class="chosen" x="212" y="76" width="348" height="46" rx="5"/>
    <text class="t-tag c-code" x="228" y="93">CHOSEN</text>
    <text class="t-h c-code" x="228" y="112">CoS alone, opt-in, hires freely</text>
    <rect class="lost" x="576" y="76" width="348" height="46" rx="5"/>
    <text class="t-tag c-mute" x="592" y="93">INSTEAD OF &#183; THE RECOMMENDATION</text>
    <text class="t-h c-lost" x="592" y="112">CoS asks on every hire</text>
  </g>

  <g id="row-1">
    <rect class="decide" x="16" y="134" width="908" height="62" rx="4"/>
    <rect class="bar" x="16" y="134" width="4" height="62"/>
    <text class="t-lbl" x="32" y="156">FRICTION</text>
    <text class="t-lbl" x="32" y="169">ON A HIRE</text>
    <text class="t-tag c-acc" x="32" y="186">&#9656; DECIDES IT</text>
    <text class="mark plus" x="228" y="162">+</text>
    <text class="t-b" x="248" y="161">None: CoS hires on the ask</text>
    <text class="t-s" x="248" y="179">the seat shows in TEAMS</text>
    <text class="mark minus" x="592" y="162">&#8722;</text>
    <text class="t-b" x="612" y="161">A click in Inbox each time</text>
    <text class="t-s" x="612" y="179">nothing is hired while the person is away</text>
  </g>

  <g id="row-2">
    <text class="t-lbl" x="32" y="218">FIRE AND</text>
    <text class="t-lbl" x="32" y="231">RETIRE</text>
    <text class="mark tie" x="228" y="224">=</text>
    <text class="t-b" x="248" y="223">Approved in Inbox</text>
    <text class="t-s" x="248" y="241">a fire removes the row; the hard way back</text>
    <text class="mark tie" x="592" y="224">=</text>
    <text class="t-b" x="612" y="223">Approved in Inbox</text>
    <text class="t-s" x="612" y="241">the same ask</text>
    <line class="row" x1="16" y1="254" x2="924" y2="254"/>
  </g>

  <g id="row-3">
    <text class="t-lbl" x="32" y="276">THE PRICE</text>
    <text class="mark minus" x="228" y="282">&#8722;</text>
    <text class="t-b" x="248" y="281">A model picks who joins</text>
    <text class="t-s" x="248" y="299">registered kinds only; never a declared seat&#x27;s id</text>
    <text class="mark plus" x="592" y="282">+</text>
    <text class="t-b" x="612" y="281">The person picks each one</text>
    <text class="t-s" x="612" y="299">one approval per hire</text>
    <line class="row" x1="16" y1="312" x2="924" y2="312"/>
  </g>

  <g id="locks-in">
    <rect class="foot" x="16" y="332" width="446" height="74" rx="5"/>
    <text class="t-lbl" x="32" y="353">LOCKS IN</text>
    <text class="t-b" x="32" y="373">CoS hires unattended; every fire is asked</text>
    <text class="t-s" x="32" y="391">the approval seam stays built for fires</text>
  </g>

  <g id="flips-if">
    <rect class="foot" x="478" y="332" width="446" height="74" rx="5"/>
    <text class="t-lbl" x="494" y="353">FLIPS IF</text>
    <text class="t-b" x="494" y="373">Jake turns hire approval back on</text>
    <text class="t-s" x="494" y="391">a policy switch, as ER-20 says</text>
  </g>
</svg>
