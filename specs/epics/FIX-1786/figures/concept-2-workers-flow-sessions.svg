<svg viewBox="0 0 940 460" role="img" xmlns="http://www.w3.org/2000/svg"
     aria-label="One flow runs every worker; each piece of work gets its own session. Alice&#x27;s private area holds two workers, a researcher and a writer, each a resource of configuration plus owner. Both run on the one agent flow, shared by all workers, which loads the worker&#x27;s configuration. Bob&#x27;s researcher, a different worker, runs on the same flow. The flow&#x27;s work lands in sessions: a chat with Alice, one task, a workstream session. Alice&#x27;s writer was copied once from a template in the org&#x27;s library.">
  <style>
    :root { --surface:#FCFCFA; --surface-2:#E8E8E1; --ink:#191C21; --ink-2:#4C535B; --ink-3:#7A828B;
            --rule:#D5D4CB; --accent:#3E4E8C; --accent-soft:#E0E3F0; --code:#2C7C69; --code-soft:#DCEDE7;
            --prose:#A8761C; --prose-soft:#F3E8D2; --gone:#A9544F; }
    @media (prefers-color-scheme: dark) {
      :root { --surface:#181C1F; --surface-2:#202528; --ink:#E6E8E5; --ink-2:#A4ACB1; --ink-3:#737B81;
              --rule:#2B3135; --accent:#8B9BD8; --accent-soft:#1B2140; --code:#5DBBA1; --code-soft:#14302A;
              --prose:#D9A44B; --prose-soft:#332612; --gone:#DE8A84; } }
    .bg      { fill:var(--surface); }
    .wall-sh { fill:var(--accent-soft); stroke:var(--accent); stroke-width:2; }
    .wall-pr { fill:var(--surface-2); stroke:var(--rule); stroke-width:1.4; }
    .wall-dz { fill:none; stroke:var(--ink-3); stroke-width:1.2; stroke-dasharray:6 4; }
    .card    { fill:var(--surface); stroke:var(--rule); stroke-width:1.2; }
    .hot     { fill:var(--accent-soft); stroke:var(--accent); stroke-width:2; }
    .ln      { stroke:var(--ink-3); stroke-width:1.4; }
    .ln-d    { stroke:var(--ink-3); stroke-width:1.4; stroke-dasharray:5 4; }
    .rule    { stroke:var(--rule); stroke-width:1; }
    .ah      { fill:var(--ink-3); }
    .title   { fill:var(--ink); font-family:system-ui,-apple-system,sans-serif; font-weight:600; font-size:18px; }
    .wl      { fill:var(--ink); font-family:system-ui,-apple-system,sans-serif; font-weight:600; font-size:13.5px; }
    .h       { fill:var(--ink); font-family:system-ui,-apple-system,sans-serif; font-weight:600; font-size:14px; }
    .p       { fill:var(--ink); font-family:system-ui,-apple-system,sans-serif; font-size:14px; }
    .s       { fill:var(--ink-2); font-family:system-ui,-apple-system,sans-serif; font-size:12px; }
    .lbl     { fill:var(--ink-2); font-family:system-ui,-apple-system,sans-serif; font-size:12px; }
    .faint   { fill:var(--ink-3); font-family:system-ui,-apple-system,sans-serif; font-size:12px; }
  </style>
  <rect class="bg" x="0" y="0" width="940" height="460"/>
  <text class="title" x="28" y="34">One flow runs every worker; each piece of work gets its own session</text>
  <g id="alice">
    <rect class="wall-pr" x="24" y="56" width="300" height="236" rx="8"/>
    <text class="wl" x="40" y="80">Alice: private</text>
    <rect class="card" x="40" y="94" width="268" height="70" rx="6"/>
    <text class="h" x="54" y="120">researcher (worker)</text>
    <text class="s" x="54" y="140">resource: config + owner</text>
    <rect class="card" x="40" y="184" width="268" height="70" rx="6"/>
    <text class="h" x="54" y="210">writer (worker)</text>
    <text class="s" x="54" y="230">resource: config + owner</text>
  </g>
  <g id="flow">
    <rect class="hot" x="380" y="140" width="220" height="80" rx="6"/>
    <text class="h" x="394" y="166">agent (flow)</text>
    <text class="s" x="394" y="186">one, shared by all workers</text>
    <line class="ln" x1="308" y1="129" x2="378" y2="166"/>
    <polygon class="ah" points="378,166 373.0,158.4 368.9,166.2"/>
    <line class="ln" x1="308" y1="219" x2="378" y2="194"/>
    <polygon class="ah" points="378,194 369.0,192.5 371.9,200.8"/>
    <text class="lbl" x="322" y="124">runs on</text>
    <text class="lbl" x="500" y="244">loads the worker&#x27;s config</text>
  </g>
  <g id="sessions">
    <rect class="card" x="680" y="70" width="236" height="50" rx="6"/>
    <text class="p" x="798.0" y="100.0" text-anchor="middle">chat with Alice (session)</text>
    <rect class="card" x="680" y="150" width="236" height="50" rx="6"/>
    <text class="p" x="798.0" y="180.0" text-anchor="middle">one task (session)</text>
    <rect class="card" x="680" y="230" width="236" height="50" rx="6"/>
    <text class="p" x="798.0" y="260.0" text-anchor="middle">workstream session</text>
    <line class="ln" x1="600" y1="170" x2="678" y2="100"/>
    <polygon class="ah" points="678,100 669.1,102.1 675.0,108.6"/>
    <line class="ln" x1="600" y1="180" x2="678" y2="175"/>
    <polygon class="ah" points="678,175 669.7,171.1 670.3,179.9"/>
    <line class="ln" x1="600" y1="190" x2="678" y2="250"/>
    <polygon class="ah" points="678,250 674.3,241.6 669.0,248.6"/>
  </g>
  <g id="template">
    <rect class="card" x="24" y="360" width="300" height="64" rx="6"/>
    <text class="h" x="38" y="386">writer (template)</text>
    <text class="s" x="38" y="406">in the org&#x27;s library, shared</text>
    <line class="ln-d" x1="174" y1="360" x2="174" y2="256"/>
    <polygon class="ah" points="174,256 169.6,264.0 178.4,264.0"/>
    <text class="lbl" x="184" y="318">copied once</text>
  </g>
  <g id="bob">
    <rect class="card" x="380" y="360" width="220" height="64" rx="6"/>
    <text class="h" x="394" y="386">researcher (worker)</text>
    <text class="s" x="394" y="406">Bob&#x27;s, a different worker</text>
    <line class="ln" x1="490" y1="360" x2="490" y2="222"/>
    <polygon class="ah" points="490,222 485.6,230.0 494.4,230.0"/>
    <text class="lbl" x="500" y="318">same flow</text>
  </g>
</svg>
