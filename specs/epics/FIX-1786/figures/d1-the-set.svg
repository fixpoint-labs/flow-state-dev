<svg viewBox="0 0 940 418" role="img" xmlns="http://www.w3.org/2000/svg"
     aria-label="D1, is the model worth a refactor now. Chosen: nine refactor children after the inventory, and a closure. Instead of: rename only, or fix privacy in place. It comes down to the first row, the model a reader learns: the chosen option leaves one rule and three parts, while renaming keeps six parts under new names and fixing in place keeps six parts and three meanings of shared. Second row, an org-locked hire: private by construction, still reaching every member, or narrowed by a rule on a part the target deletes. Third row, the cost now: nine issues, six Layer 1 mechanism changes, the fifth T1&#x27;s per-call roster on the task tools and the sixth the skills library&#x27;s key taken per run, two public renames, the discovery domain and the task board&#x27;s seat, now assignee (D7), and one public removal, discovery&#x27;s mailboxes domain; one issue; or about four. Locks in: a refactor across Workforce, the engine, the task board, discovery&#x27;s domain list, Shift Manager and the docs, after the inventory&#x27;s merges. Flips if no app needs a second user or its own worker this year.">
  <style>
    :root { --surface:#FCFCFA; --surface-2:#E8E8E1; --ink:#191C21; --ink-2:#4C535B; --ink-3:#7A828B;
            --rule:#D5D4CB; --accent:#3E4E8C; --accent-soft:#E0E3F0; --code:#2C7C69; --code-soft:#DCEDE7;
            --prose:#A8761C; --prose-soft:#F3E8D2; --gone:#A9544F; }
    @media (prefers-color-scheme: dark) {
      :root { --surface:#181C1F; --surface-2:#202528; --ink:#E6E8E5; --ink-2:#A4ACB1; --ink-3:#737B81;
              --rule:#2B3135; --accent:#8B9BD8; --accent-soft:#1B2140; --code:#5DBBA1; --code-soft:#14302A;
              --prose:#D9A44B; --prose-soft:#332612; --gone:#DE8A84; } }
    .bg     { fill:var(--surface); }
    .ask    { fill:var(--surface-2); }
    .chosen { fill:var(--code-soft); stroke:var(--code); stroke-width:1.6; }
    .rec    { fill:var(--code-soft); stroke:var(--code); stroke-width:1.6; stroke-dasharray:6 4; }
    .lost   { fill:var(--surface); stroke:var(--rule); stroke-width:1.4; stroke-dasharray:5 4; }
    .decide { fill:var(--accent-soft); }
    .bar    { fill:var(--accent); }
    .row    { stroke:var(--rule); stroke-width:1; }
    .foot   { fill:var(--surface-2); }
    .t-lbl  { fill:var(--ink-3); font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:9.5px; letter-spacing:.1em; }
    .t-tag  { font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:9.5px; letter-spacing:.1em; font-weight:600; }
    .t-q    { fill:var(--ink); font-family:system-ui,-apple-system,sans-serif; font-weight:600; font-size:15px; }
    .t-h    { font-family:system-ui,-apple-system,sans-serif; font-weight:600; font-size:14px; }
    .t-b    { fill:var(--ink); font-family:system-ui,-apple-system,sans-serif; font-size:12.5px; }
    .t-s    { fill:var(--ink-2); font-family:system-ui,-apple-system,sans-serif; font-size:11px; }
    .mark   { font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:16px; font-weight:700; }
    .plus   { fill:var(--code); }
    .minus  { fill:var(--gone); }
    .tie    { fill:var(--ink-3); }
    .c-code { fill:var(--code); }
    .c-mute { fill:var(--ink-3); }
    .c-lost { fill:var(--ink-2); }
    .c-acc  { fill:var(--accent); }
  </style>
  <rect class="bg" x="0" y="0" width="940" height="418"/>
  <g id="the-call">
    <rect class="ask" x="16" y="14" width="908" height="48" rx="6"/>
    <text class="t-lbl" x="32" y="32">D1 · THE CALL</text>
    <text class="t-q" x="32" y="52">Is one private-by-default model worth nine issues now?</text>
  </g>
  <g id="options">
    <rect class="chosen" x="212" y="76" width="224" height="46" rx="5"/>
    <text class="t-tag c-code" x="228" y="93">CHOSEN</text>
    <text class="t-h c-code" x="228" y="112">Nine, after the inventory</text>
    <rect class="lost" x="452" y="76" width="224" height="46" rx="5"/>
    <text class="t-tag c-mute" x="468" y="93">INSTEAD OF</text>
    <text class="t-h c-lost" x="468" y="112">Rename only</text>
    <rect class="lost" x="692" y="76" width="224" height="46" rx="5"/>
    <text class="t-tag c-mute" x="708" y="93">INSTEAD OF</text>
    <text class="t-h c-lost" x="708" y="112">Fix privacy in place</text>
  </g>
  <g id="row-1">
    <rect class="decide" x="16" y="134" width="908" height="62" rx="4"/>
    <rect class="bar" x="16" y="134" width="4" height="62"/>
    <text class="t-lbl" x="32" y="156">THE MODEL A</text>
    <text class="t-lbl" x="32" y="169">READER LEARNS</text>
    <text class="t-tag c-acc" x="32" y="186">▸ DECIDES IT</text>
    <text class="mark plus" x="228" y="162">+</text>
    <text class="t-b" x="248" y="161">One rule, three parts</text>
    <text class="t-s" x="248" y="179">worker · coordinator · workstream</text>
    <text class="mark minus" x="468" y="162">−</text>
    <text class="t-b" x="488" y="161">Six parts, new names</text>
    <text class="t-s" x="488" y="179">seats and rooms, renamed</text>
    <text class="mark minus" x="708" y="162">−</text>
    <text class="t-b" x="728" y="161">Six parts, three shareds</text>
    <text class="t-s" x="728" y="179">each fix a special case</text>
  </g>
  <g id="row-2">
    <text class="t-lbl" x="32" y="218">AN ORG-LOCKED</text>
    <text class="t-lbl" x="32" y="231">HIRE</text>
    <text class="mark plus" x="228" y="224">+</text>
    <text class="t-b" x="248" y="223">Private by construction</text>
    <text class="t-s" x="248" y="241">a user-scoped resource</text>
    <text class="mark minus" x="468" y="224">−</text>
    <text class="t-b" x="488" y="223">Still reaches everyone</text>
    <text class="t-s" x="488" y="241">the hole stays</text>
    <text class="mark plus" x="708" y="224">+</text>
    <text class="t-b" x="728" y="223">Narrowed by a rule</text>
    <text class="t-s" x="728" y="241">on a part the target deletes</text>
    <line class="row" x1="16" y1="254" x2="924" y2="254"/>
  </g>
  <g id="row-3">
    <text class="t-lbl" x="32" y="276">COST NOW</text>
    <text class="mark minus" x="228" y="282">−</text>
    <text class="t-b" x="248" y="281">Nine issues</text>
    <text class="t-s" x="248" y="299">6 mechanisms, 2 renames, 1 removal</text>
    <text class="mark plus" x="468" y="282">+</text>
    <text class="t-b" x="488" y="281">One issue</text>
    <text class="t-s" x="488" y="299">names and docs</text>
    <text class="mark tie" x="708" y="282">=</text>
    <text class="t-b" x="728" y="281">About four issues</text>
    <text class="t-s" x="728" y="299">in-flight work untouched</text>
    <line class="row" x1="16" y1="312" x2="924" y2="312"/>
  </g>
  <g id="locks-in">
    <rect class="foot" x="16" y="328" width="446" height="74" rx="5"/>
    <text class="t-lbl" x="32" y="349">LOCKS IN</text>
    <text class="t-b" x="32" y="369">Workforce, engine, task board, discovery, docs</text>
    <text class="t-s" x="32" y="387">in-flight work merges first, or closes</text>
  </g>
  <g id="flips-if">
    <rect class="foot" x="478" y="328" width="446" height="74" rx="5"/>
    <text class="t-lbl" x="494" y="349">FLIPS IF</text>
    <text class="t-b" x="494" y="369">No app needs a second user this year</text>
    <text class="t-s" x="494" y="387">then fix the hole in place, rename later</text>
  </g>
</svg>
