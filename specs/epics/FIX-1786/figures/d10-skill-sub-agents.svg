<svg viewBox="0 0 940 420" role="img" aria-label="D10, keep skill sub-agents beside delegation, or remove them. Chosen: remove them. Instead of: keep them, with a guard on workers. It comes down to the first row, what a skill's agent is: removing them ships nothing half-built, and leaves one way to hand work on, a hand-off; keeping them leaves a loop called an agent, with no memory and no agent concept behind it. Second row, the task tools on one turn: one set by construction, against one set on workers only, where a guard hides the skill's copy. Third row, the price: a SKILL.md that declares agents: is refused, and the Skills → Delegation page, its goals and tests go; keeping them costs nothing there. Locks in: one set of task tools per turn, and a skill's own team waits for the follow-up epic. Flips if ask shows a skill needs a team delegation can't give."
     xmlns="http://www.w3.org/2000/svg">
  <style>
    :root { --surface:#FCFCFA; --surface-2:#E8E8E1; --ink:#191C21; --ink-2:#4C535B; --ink-3:#7A828B;
            --rule:#D5D4CB; --accent:#3E4E8C; --accent-soft:#E0E3F0; --code:#2C7C69; --code-soft:#DCEDE7;
            --gone:#A9544F; }
    @media (prefers-color-scheme: dark) {
      :root { --surface:#181C1F; --surface-2:#202528; --ink:#E6E8E5; --ink-2:#A4ACB1; --ink-3:#737B81;
              --rule:#2B3135; --accent:#8B9BD8; --accent-soft:#1B2140; --code:#5DBBA1; --code-soft:#14302A;
              --gone:#DE8A84; } }
    .bg     { fill:var(--surface); }
    .ask    { fill:var(--surface-2); }
    .chosen { fill:var(--code-soft); stroke:var(--code); stroke-width:1.6; }
    .lost   { fill:var(--surface); stroke:var(--rule); stroke-width:1.4; stroke-dasharray:5 4; }
    .decide { fill:var(--accent-soft); }
    .bar    { fill:var(--accent); }
    .row    { stroke:var(--rule); stroke-width:1; }
    .foot   { fill:var(--surface-2); }
    .t-lbl  { fill:var(--ink-3); font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:9.5px; letter-spacing:.1em; }
    .t-tag  { font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:9.5px; letter-spacing:.1em; font-weight:600; }
    .t-q    { fill:var(--ink); font-family:system-ui,-apple-system,sans-serif; font-weight:600; font-size:15px; }
    .t-h    { font-family:system-ui,-apple-system,sans-serif; font-weight:600; font-size:14px; }
    .t-b    { fill:var(--ink); font-family:system-ui,-apple-system,sans-serif; font-size:12.5px; }
    .t-s    { fill:var(--ink-2); font-family:system-ui,-apple-system,sans-serif; font-size:11px; }
    .mark   { font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:16px; font-weight:700; }
    .plus   { fill:var(--code); }
    .minus  { fill:var(--gone); }
    .tie    { fill:var(--ink-3); }
    .c-code { fill:var(--code); }
    .c-mute { fill:var(--ink-3); }
    .c-lost { fill:var(--ink-2); }
    .c-acc  { fill:var(--accent); }
  </style>
  <rect class="bg" x="0" y="0" width="940" height="420"/>

  <g id="the-call">
    <rect class="ask" x="16" y="14" width="908" height="48" rx="6"/>
    <text class="t-lbl" x="32" y="32">D10 · THE CALL</text>
    <text class="t-q" x="32" y="52">Keep skill sub-agents beside delegation, or remove them?</text>
  </g>

  <g id="options">
    <rect class="chosen" x="212" y="76" width="348" height="46" rx="5"/>
    <text class="t-tag c-code" x="228" y="93">CHOSEN</text>
    <text class="t-h c-code" x="228" y="112">Remove them</text>
    <rect class="lost" x="576" y="76" width="348" height="46" rx="5"/>
    <text class="t-tag c-mute" x="592" y="93">INSTEAD OF</text>
    <text class="t-h c-lost" x="592" y="112">Keep them, with a guard on workers</text>
  </g>

  <g id="row-decides">
    <rect class="decide" x="16" y="134" width="908" height="62" rx="4"/>
    <rect class="bar" x="16" y="134" width="4" height="62"/>
    <text class="t-lbl" x="32" y="156">WHAT A SKILL'S</text>
    <text class="t-lbl" x="32" y="169">AGENT IS</text>
    <text class="t-tag c-acc" x="32" y="186">▸ DECIDES IT</text>
    <text class="mark plus" x="228" y="162">+</text>
    <text class="t-b" x="248" y="161">Nothing half-built ships</text>
    <text class="t-s" x="248" y="179">one way to hand work on: a hand-off</text>
    <text class="mark minus" x="592" y="162">−</text>
    <text class="t-b" x="612" y="161">A loop called an agent</text>
    <text class="t-s" x="612" y="179">no memory, no agent concept behind it</text>
  </g>

  <g id="row-turn">
    <text class="t-lbl" x="32" y="218">TASK TOOLS</text>
    <text class="t-lbl" x="32" y="231">ON ONE TURN</text>
    <text class="mark plus" x="228" y="224">+</text>
    <text class="t-b" x="248" y="223">One set, by construction</text>
    <text class="t-s" x="248" y="241">nothing left to clash with</text>
    <text class="mark minus" x="592" y="224">−</text>
    <text class="t-b" x="612" y="223">One set, on workers only</text>
    <text class="t-s" x="612" y="241">a guard hides the skill's copy each turn</text>
    <line class="row" x1="16" y1="256" x2="924" y2="256"/>
  </g>

  <g id="row-price">
    <text class="t-lbl" x="32" y="276">WHAT A SKILL</text>
    <text class="t-lbl" x="32" y="289">AUTHOR LOSES</text>
    <text class="mark minus" x="228" y="282">−</text>
    <text class="t-b" x="248" y="281">agents: refused at load</text>
    <text class="t-s" x="248" y="299">the Delegation page, its goals and tests go</text>
    <text class="mark plus" x="592" y="282">+</text>
    <text class="t-b" x="612" y="281">Nothing</text>
    <text class="t-s" x="612" y="299">sub-agents keep working beside delegation</text>
    <line class="row" x1="16" y1="314" x2="924" y2="314"/>
  </g>

  <g id="locks-in">
    <rect class="foot" x="16" y="330" width="446" height="74" rx="5"/>
    <text class="t-lbl" x="32" y="351">LOCKS IN</text>
    <text class="t-b" x="32" y="371">One set of task tools per turn</text>
    <text class="t-s" x="32" y="389">a skill's own team waits for the follow-up epic</text>
  </g>

  <g id="flips-if">
    <rect class="foot" x="478" y="330" width="446" height="74" rx="5"/>
    <text class="t-lbl" x="494" y="351">FLIPS IF</text>
    <text class="t-b" x="494" y="371">Ask shows a skill needs a team of its own</text>
    <text class="t-s" x="494" y="389">then it comes back, built on hand-offs</text>
  </g>
</svg>
