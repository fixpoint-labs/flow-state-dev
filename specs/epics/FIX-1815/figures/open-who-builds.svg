<svg viewBox="0 0 940 418" role="img" aria-label="Q2, open: who builds the child-finished signal and the resume-owed marker that both kinds of hand-off wake on. Recommended: FIX-1786 builds them as specified and this epic consumes them. Instead of: this epic builds them and FIX-1786 amends its specs to consume them. It comes down to the first row: under the recommendation the approved specs for FIX-1794 P2 and FIX-1802 stay unchanged, while the alternative amends and re-gates two specs, one already in development. The price, second row: ask ships only after FIX-1786&#x27;s inputs merge, including FIX-1802&#x27;s hold, where the alternative ships sooner. Third row: the signal as specified is a Workforce entry, so an ask below Workforce needs an amendment, where the alternative builds it at Layer 1 once. Locks in: this epic&#x27;s builds wait on FIX-1786, rule ER-15. Flips if: FIX-1802&#x27;s amendment drops the marker, or its hold outlasts both specs here."
     xmlns="http://www.w3.org/2000/svg">
  <style>
    :root { --surface:#FCFCFA; --surface-2:#E8E8E1; --ink:#191C21; --ink-2:#4C535B; --ink-3:#7A828B;
            --rule:#D5D4CB; --accent:#3E4E8C; --accent-soft:#E0E3F0; --code:#2C7C69; --code-soft:#DCEDE7;
            --gone:#A9544F; }
    @media (prefers-color-scheme: dark) {
      :root { --surface:#181C1F; --surface-2:#202528; --ink:#E6E8E5; --ink-2:#A4ACB1; --ink-3:#737B81;
              --rule:#2B3135; --accent:#8B9BD8; --accent-soft:#1B2140; --code:#5DBBA1; --code-soft:#14302A;
              --gone:#DE8A84; } }
    .bg     { fill:var(--surface); }
    .ask    { fill:var(--surface-2); }
    .rec    { fill:var(--code-soft); stroke:var(--code); stroke-width:1.6; stroke-dasharray:6 3; }
    .lost   { fill:var(--surface); stroke:var(--rule); stroke-width:1.4; stroke-dasharray:5 4; }
    .decide { fill:var(--accent-soft); }
    .bar    { fill:var(--accent); }
    .row    { stroke:var(--rule); stroke-width:1; }
    .foot   { fill:var(--surface-2); }
    .t-lbl  { fill:var(--ink-3); font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:9.5px; letter-spacing:.1em; }
    .t-tag  { font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:9.5px; letter-spacing:.1em; font-weight:600; }
    .t-q    { fill:var(--ink); font-family:system-ui,-apple-system,sans-serif; font-weight:600; font-size:15px; }
    .t-h    { font-family:system-ui,-apple-system,sans-serif; font-weight:600; font-size:14px; }
    .t-b    { fill:var(--ink); font-family:system-ui,-apple-system,sans-serif; font-size:12.5px; }
    .t-s    { fill:var(--ink-2); font-family:system-ui,-apple-system,sans-serif; font-size:11px; }
    .mark   { font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:16px; font-weight:700; }
    .plus   { fill:var(--code); }
    .minus  { fill:var(--gone); }
    .tie    { fill:var(--ink-3); }
    .c-code { fill:var(--code); }
    .c-mute { fill:var(--ink-3); }
    .c-lost { fill:var(--ink-2); }
    .c-acc  { fill:var(--accent); }
  </style>
  <rect class="bg" x="0" y="0" width="940" height="418"/>

  <g id="the-call">
    <rect class="ask" x="16" y="14" width="908" height="48" rx="6"/>
    <text class="t-lbl" x="32" y="32">Q2 · THE CALL · OPEN</text>
    <text class="t-q" x="32" y="52">Who builds the finished signal and the owed marker that both kinds wake on?</text>
  </g>

  <g id="options">
    <rect class="rec" x="212" y="76" width="348" height="46" rx="5"/>
    <text class="t-tag c-code" x="228" y="93">RECOMMENDED</text>
    <text class="t-h c-code" x="228" y="112">FIX-1786 builds; this epic consumes</text>
    <rect class="lost" x="576" y="76" width="348" height="46" rx="5"/>
    <text class="t-tag c-mute" x="592" y="93">INSTEAD OF</text>
    <text class="t-h c-lost" x="592" y="112">This epic builds; FIX-1786 amends</text>
  </g>

  <g id="row-decides">
    <rect class="decide" x="16" y="134" width="908" height="62" rx="4"/>
    <rect class="bar" x="16" y="134" width="4" height="62"/>
    <text class="t-lbl" x="32" y="156">THE APPROVED</text>
    <text class="t-lbl" x="32" y="169">SPECS</text>
    <text class="t-tag c-acc" x="32" y="186">▸ DECIDES IT</text>
    <text class="mark plus" x="228" y="162">+</text>
    <text class="t-b" x="248" y="161">Unchanged</text>
    <text class="t-s" x="248" y="179">FIX-1794 P2 and FIX-1802 as already specified</text>
    <text class="mark minus" x="592" y="162">−</text>
    <text class="t-b" x="612" y="161">Two amended and re-gated</text>
    <text class="t-s" x="612" y="179">one is already in development</text>
  </g>

  <g id="row-2">
    <text class="t-lbl" x="32" y="218">WHEN ASK</text>
    <text class="t-lbl" x="32" y="231">SHIPS</text>
    <text class="mark minus" x="228" y="224">−</text>
    <text class="t-b" x="248" y="223">After FIX-1786&#x27;s inputs merge</text>
    <text class="t-s" x="248" y="241">including FIX-1802&#x27;s hold</text>
    <text class="mark plus" x="592" y="224">+</text>
    <text class="t-b" x="612" y="223">Sooner</text>
    <text class="t-s" x="612" y="241">no wait on another epic&#x27;s pace</text>
    <line class="row" x1="16" y1="252" x2="924" y2="252"/>
  </g>

  <g id="row-3">
    <text class="t-lbl" x="32" y="276">WHICH LAYER</text>
    <text class="mark minus" x="228" y="282">−</text>
    <text class="t-b" x="248" y="281">The signal is a Workforce entry</text>
    <text class="t-s" x="248" y="299">an ask below Workforce needs an amendment</text>
    <text class="mark plus" x="592" y="282">+</text>
    <text class="t-b" x="612" y="281">Built at Layer 1, once</text>
    <text class="t-s" x="612" y="299">Workforce consumes it</text>
    <line class="row" x1="16" y1="310" x2="924" y2="310"/>
  </g>

  <g id="locks-in">
    <rect class="foot" x="16" y="328" width="446" height="74" rx="5"/>
    <text class="t-lbl" x="32" y="349">LOCKS IN</text>
    <text class="t-b" x="32" y="369">This epic&#x27;s builds wait on FIX-1786</text>
    <text class="t-s" x="32" y="387">ER-15: assign builds after both inputs merge</text>
  </g>
  <g id="flips-if">
    <rect class="foot" x="478" y="328" width="446" height="74" rx="5"/>
    <text class="t-lbl" x="494" y="349">FLIPS IF</text>
    <text class="t-b" x="494" y="369">FIX-1802&#x27;s amendment drops the marker</text>
    <text class="t-s" x="494" y="387">or its hold outlasts both specs here</text>
  </g>
</svg>
