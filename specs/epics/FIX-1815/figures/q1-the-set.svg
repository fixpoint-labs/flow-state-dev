<svg viewBox="0 0 940 418" role="img" aria-label="Q1, decided on 2026-10-08 by the product owner, &quot;cut both&quot;: ship two hand-off issues and a closure, or keep all four as filed. Decided: two issues and a closure. Instead of: four issues and a closure. It comes down to the first row: every issue in the smaller set moves the outcome, while in the larger set two issues do not, one may close as no, and both block the closure. The price, second row: the one-check rule becomes epic rule ER-6, which FIX-1816&#x27;s spec obeys with no test set of its own, where the larger set has an issue that proves both kinds. Third row: skill helpers wait in Backlog until ask ships, where the larger set decides them inside the epic. Locks in: ER-6 binds FIX-1816&#x27;s spec, and the ledger-token question moves there. Flips if: ask can ride neither existing check; then FIX-1818 rejoins."
     xmlns="http://www.w3.org/2000/svg">
  <style>
    :root { --surface:#FCFCFA; --surface-2:#E8E8E1; --ink:#191C21; --ink-2:#4C535B; --ink-3:#7A828B;
            --rule:#D5D4CB; --accent:#3E4E8C; --accent-soft:#E0E3F0; --code:#2C7C69; --code-soft:#DCEDE7;
            --gone:#A9544F; }
    @media (prefers-color-scheme: dark) {
      :root { --surface:#181C1F; --surface-2:#202528; --ink:#E6E8E5; --ink-2:#A4ACB1; --ink-3:#737B81;
              --rule:#2B3135; --accent:#8B9BD8; --accent-soft:#1B2140; --code:#5DBBA1; --code-soft:#14302A;
              --gone:#DE8A84; } }
    .bg     { fill:var(--surface); }
    .ask    { fill:var(--surface-2); }
    .rec    { fill:var(--code-soft); stroke:var(--code); stroke-width:1.6; }
    .lost   { fill:var(--surface); stroke:var(--rule); stroke-width:1.4; stroke-dasharray:5 4; }
    .decide { fill:var(--accent-soft); }
    .bar    { fill:var(--accent); }
    .row    { stroke:var(--rule); stroke-width:1; }
    .foot   { fill:var(--surface-2); }
    .t-lbl  { fill:var(--ink-3); font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:9.5px; letter-spacing:.1em; }
    .t-tag  { font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:9.5px; letter-spacing:.1em; font-weight:600; }
    .t-q    { fill:var(--ink); font-family:system-ui,-apple-system,sans-serif; font-weight:600; font-size:15px; }
    .t-h    { font-family:system-ui,-apple-system,sans-serif; font-weight:600; font-size:14px; }
    .t-b    { fill:var(--ink); font-family:system-ui,-apple-system,sans-serif; font-size:12.5px; }
    .t-s    { fill:var(--ink-2); font-family:system-ui,-apple-system,sans-serif; font-size:11px; }
    .mark   { font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:16px; font-weight:700; }
    .plus   { fill:var(--code); }
    .minus  { fill:var(--gone); }
    .tie    { fill:var(--ink-3); }
    .c-code { fill:var(--code); }
    .c-mute { fill:var(--ink-3); }
    .c-lost { fill:var(--ink-2); }
    .c-acc  { fill:var(--accent); }
  </style>
  <rect class="bg" x="0" y="0" width="940" height="418"/>

  <g id="the-call">
    <rect class="ask" x="16" y="14" width="908" height="48" rx="6"/>
    <text class="t-lbl" x="32" y="32">Q1 · THE CALL · DECIDED 2026-10-08 BY THE PRODUCT OWNER</text>
    <text class="t-q" x="32" y="52">Ship two hand-off issues and a closure, or keep all four as filed?</text>
  </g>

  <g id="options">
    <rect class="rec" x="212" y="76" width="348" height="46" rx="5"/>
    <text class="t-tag c-code" x="228" y="93">DECIDED</text>
    <text class="t-h c-code" x="228" y="112">Two issues and a closure</text>
    <rect class="lost" x="576" y="76" width="348" height="46" rx="5"/>
    <text class="t-tag c-mute" x="592" y="93">INSTEAD OF</text>
    <text class="t-h c-lost" x="592" y="112">Four issues and a closure</text>
  </g>

  <g id="row-decides">
    <rect class="decide" x="16" y="134" width="908" height="62" rx="4"/>
    <rect class="bar" x="16" y="134" width="4" height="62"/>
    <text class="t-lbl" x="32" y="156">DOES IT MOVE</text>
    <text class="t-lbl" x="32" y="169">THE OUTCOME</text>
    <text class="t-tag c-acc" x="32" y="186">▸ DECIDES IT</text>
    <text class="mark plus" x="228" y="162">+</text>
    <text class="t-b" x="248" y="161">Every issue moves it</text>
    <text class="t-s" x="248" y="179">ask and assign, then the proof</text>
    <text class="mark minus" x="592" y="162">−</text>
    <text class="t-b" x="612" y="161">Two issues don&#x27;t</text>
    <text class="t-s" x="612" y="179">one may close as no; both block the closure</text>
  </g>

  <g id="row-2">
    <text class="t-lbl" x="32" y="218">THE ONE-CHECK</text>
    <text class="t-lbl" x="32" y="231">RULE</text>
    <text class="mark minus" x="228" y="224">−</text>
    <text class="t-b" x="248" y="223">A rule, not an issue</text>
    <text class="t-s" x="248" y="241">FIX-1816&#x27;s spec obeys ER-6; no tests of its own</text>
    <text class="mark plus" x="592" y="224">+</text>
    <text class="t-b" x="612" y="223">An issue owns it</text>
    <text class="t-s" x="612" y="241">one test set proves both kinds</text>
    <line class="row" x1="16" y1="252" x2="924" y2="252"/>
  </g>

  <g id="row-3">
    <text class="t-lbl" x="32" y="276">SKILL HELPERS</text>
    <text class="mark minus" x="228" y="282">−</text>
    <text class="t-b" x="248" y="281">Wait in Backlog</text>
    <text class="t-s" x="248" y="299">revisited after ask ships</text>
    <text class="mark plus" x="592" y="282">+</text>
    <text class="t-b" x="612" y="281">Decided inside the epic</text>
    <text class="t-s" x="612" y="299">after ask exists</text>
    <line class="row" x1="16" y1="310" x2="924" y2="310"/>
  </g>

  <g id="locks-in">
    <rect class="foot" x="16" y="328" width="446" height="74" rx="5"/>
    <text class="t-lbl" x="32" y="349">LOCKS IN</text>
    <text class="t-b" x="32" y="369">ER-6 binds FIX-1816&#x27;s spec</text>
    <text class="t-s" x="32" y="387">the ledger-token question moves into that spec</text>
  </g>
  <g id="flips-if">
    <rect class="foot" x="478" y="328" width="446" height="74" rx="5"/>
    <text class="t-lbl" x="494" y="349">FLIPS IF</text>
    <text class="t-b" x="494" y="369">Ask can ride neither existing check</text>
    <text class="t-s" x="494" y="387">then FIX-1818&#x27;s work is real and it rejoins</text>
  </g>
</svg>
