<svg viewBox="0 0 940 372" role="img" xmlns="http://www.w3.org/2000/svg"
     aria-label="What's in the box. In the box: dispatchTask, which takes a new task or a reference to one, a worker, and an optional wait; the board's claim ticket as the only answer-once fence; one vocabulary, where ask is a question to a person, hand-off is passing your own work mid-work, and new work is dispatched. Unchanged beside it: addTask, assignTask and the other task tools as board CRUD, and dispatcher() as flow-code transport with reply-to-sender. Replaced in one line: addTask with waitForResponse becomes dispatchTask with wait, the coordinator's handOff becomes dispatchTask, the delivery ledger becomes the claim ticket, and post-to-mailbox is already gone. Not built, below a fence: waiting on several tasks at once, a row-less question tool, channels, and any change to what a dispatched task does.">
  <style>
    :root { --surface:#FCFCFA; --surface-2:#E8E8E1; --ink:#191C21; --ink-2:#4C535B; --ink-3:#7A828B;
            --rule:#D5D4CB; --accent:#3E4E8C; --accent-soft:#E0E3F0; --code:#2C7C69; --code-soft:#DCEDE7;
            --prose:#A8761C; --prose-soft:#F3E8D2; --gone:#A9544F; }
    @media (prefers-color-scheme: dark) {
      :root { --surface:#181C1F; --surface-2:#202528; --ink:#E6E8E5; --ink-2:#A4ACB1; --ink-3:#737B81;
              --rule:#2B3135; --accent:#8B9BD8; --accent-soft:#1B2140; --code:#5DBBA1; --code-soft:#14302A;
              --prose:#D9A44B; --prose-soft:#332612; --gone:#DE8A84; } }
    .bg    { fill:var(--surface); }
    .box   { fill:var(--surface); stroke:var(--rule); stroke-width:1.2; }
    .held  { fill:var(--code-soft); stroke:var(--code); stroke-width:1.2; }
    .comp  { fill:var(--accent-soft); stroke:var(--accent); stroke-width:1; }
    .repl  { fill:var(--prose-soft); stroke:var(--prose); stroke-width:1; }
    .fence { fill:none; stroke:var(--gone); stroke-width:1.4; stroke-dasharray:6 4; }
    .t-lbl { fill:var(--ink-3); font-family:ui-monospace,SFMono-Regular,Menlo,monospace;
             font-size:9.5px; letter-spacing:.1em; }
    .t-non { fill:var(--gone); font-family:ui-monospace,SFMono-Regular,Menlo,monospace;
             font-size:9.5px; letter-spacing:.1em; }
    .t-b   { fill:var(--ink); font-family:system-ui,-apple-system,sans-serif; font-weight:600; font-size:13px; }
    .t-s   { fill:var(--ink-2); font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:9.5px; }
  </style>
  <rect class="bg" x="0" y="0" width="940" height="372"/>

  <g id="in-the-box">
    <rect class="box" x="16" y="24" width="560" height="212" rx="5"/>
    <text class="t-lbl" x="32" y="44">IN THE BOX &#8212; ONE TOOL, ONE FENCE, ONE VOCABULARY</text>
    <rect class="held" x="32" y="56" width="528" height="70" rx="4"/>
    <text class="t-b" x="44" y="78">dispatchTask({ task, to, wait? })</text>
    <text class="t-s" x="44" y="96">task: { new } or { ref } on the caller's lineage &#183; the work starts now</text>
    <text class="t-s" x="44" y="112">with wait: the turn parks, resumes with the output &#183; else onTaskSettled</text>
    <rect class="held" x="32" y="136" width="256" height="86" rx="4"/>
    <text class="t-b" x="44" y="158">the claim ticket</text>
    <text class="t-s" x="44" y="176">the only answer-once fence</text>
    <text class="t-s" x="44" y="192">every coordinator delivery</text>
    <text class="t-s" x="44" y="208">is a task row</text>
    <rect class="held" x="300" y="136" width="260" height="86" rx="4"/>
    <text class="t-b" x="312" y="158">one meaning per word</text>
    <text class="t-s" x="312" y="176">ask &#183; a question to a person</text>
    <text class="t-s" x="312" y="192">hand-off &#183; mid-work only</text>
    <text class="t-s" x="312" y="208">dispatch &#183; new work &#183; then wait</text>
  </g>

  <g id="unchanged">
    <rect class="comp" x="592" y="24" width="332" height="100" rx="5"/>
    <text class="t-lbl" x="608" y="44">UNCHANGED BESIDE IT</text>
    <text class="t-b" x="608" y="66">addTask, assignTask &#183; board CRUD</text>
    <text class="t-s" x="608" y="84">the board decides when it runs</text>
    <text class="t-s" x="608" y="100">dispatcher() &#183; flow-code transport</text>
    <text class="t-s" x="608" y="116">session: { from: true } stays</text>
  </g>

  <g id="replaced">
    <rect class="repl" x="592" y="136" width="332" height="100" rx="5"/>
    <text class="t-lbl" x="608" y="156">REPLACED IN ONE LINE</text>
    <text class="t-s" x="608" y="176">addTask({ waitForResponse }) &#8594; wait</text>
    <text class="t-s" x="608" y="192">coordinator handOff &#8594; dispatchTask</text>
    <text class="t-s" x="608" y="208">delivery ledger &#8594; claim ticket</text>
    <text class="t-s" x="608" y="224">post-to-mailbox &#8594; already gone</text>
  </g>

  <g id="not-built">
    <rect class="fence" x="16" y="256" width="908" height="96" rx="5"/>
    <text class="t-non" x="32" y="276">NOT BUILT &#8212; NAMES CHANGE, BEHAVIOUR DOESN'T</text>
    <text class="t-s" x="32" y="298">no change to what a waited-on or dispatched task does</text>
    <text class="t-s" x="32" y="316">no waiting on several tasks at once &#183; no row-less question tool for workers</text>
    <text class="t-s" x="32" y="334">no channels</text>
  </g>
</svg>
