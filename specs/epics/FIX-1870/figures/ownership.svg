<svg viewBox="0 0 940 406" role="img" xmlns="http://www.w3.org/2000/svg"
     aria-label="Who owns what: seven rules by four issues, FIX-1875 dispatchTask, FIX-1872 one fence, FIX-1876 vocabulary, and the closure FIX-1887. FIX-1875 owns the one tool, the task tools staying board CRUD, the carried-over ask rules and the lineage check on a referenced row. FIX-1872 owns the single fence and one answer per delegate per post. FIX-1876 owns the vocabulary, which FIX-1875 and FIX-1872 consume. The closure owns the proof. Every other cell consumes.">
  <style>
    :root { --surface:#FCFCFA; --surface-2:#E8E8E1; --ink:#191C21; --ink-2:#4C535B; --ink-3:#7A828B;
            --rule:#D5D4CB; --accent:#3E4E8C; --accent-soft:#E0E3F0; }
    @media (prefers-color-scheme: dark) {
      :root { --surface:#181C1F; --surface-2:#202528; --ink:#E6E8E5; --ink-2:#A4ACB1; --ink-3:#737B81;
              --rule:#2B3135; --accent:#8B9BD8; --accent-soft:#1B2140; } }
    .bg    { fill:var(--surface); }
    .own   { fill:var(--accent-soft); stroke:var(--accent); stroke-width:1.4; }
    .use   { fill:var(--surface-2); stroke:var(--rule); stroke-width:1; }
    .t-lbl { fill:var(--ink-3); font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:9.5px; letter-spacing:.1em; }
    .t-col { fill:var(--ink); font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:9.5px; }
    .t-row { fill:var(--ink); font-family:system-ui,-apple-system,sans-serif; font-size:11.5px; }
    .t-own { fill:var(--accent); font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:9px; letter-spacing:.06em; }
    .t-use { fill:var(--ink-2); font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:9px; }
  </style>
  <rect class="bg" x="0" y="0" width="940" height="406"/>
  <text class="t-lbl" x="16" y="20">WHO OWNS WHAT &#8212; ONE OWNER PER RULE</text>
  <text class="t-col" x="316" y="44">FIX-1875 · dispatch</text>
  <text class="t-col" x="470" y="44">FIX-1872 · fence</text>
  <text class="t-col" x="624" y="44">FIX-1876 · words</text>
  <text class="t-col" x="778" y="44">FIX-1887 · closure</text>

  <g id="er1">
    <text class="t-row" x="16" y="80">ER-1 one tool, optional wait</text>
    <rect class="own" x="308" y="58" width="146" height="36" rx="3"/><text class="t-own" x="320" y="80">OWNS</text>
    <rect class="use" x="462" y="58" width="146" height="36" rx="3"/><text class="t-use" x="474" y="80">consumes</text>
    <rect class="use" x="616" y="58" width="146" height="36" rx="3"/><text class="t-use" x="628" y="80">consumes</text>
    <rect class="use" x="770" y="58" width="146" height="36" rx="3"/><text class="t-use" x="782" y="80">consumes</text>
  </g>
  <g id="er2">
    <text class="t-row" x="16" y="124">ER-2 task tools are board CRUD</text>
    <rect class="own" x="308" y="102" width="146" height="36" rx="3"/><text class="t-own" x="320" y="124">OWNS</text>
    <rect class="use" x="462" y="102" width="146" height="36" rx="3"/><text class="t-use" x="474" y="124">consumes</text>
    <rect class="use" x="616" y="102" width="146" height="36" rx="3"/><text class="t-use" x="628" y="124">consumes</text>
    <rect class="use" x="770" y="102" width="146" height="36" rx="3"/><text class="t-use" x="782" y="124">consumes</text>
  </g>
  <g id="er3">
    <text class="t-row" x="16" y="168">ER-3, ER-4 ask's rules, lineage</text>
    <rect class="own" x="308" y="146" width="146" height="36" rx="3"/><text class="t-own" x="320" y="168">OWNS</text>
    <rect class="use" x="462" y="146" width="146" height="36" rx="3"/><text class="t-use" x="474" y="168">consumes</text>
    <rect class="use" x="616" y="146" width="146" height="36" rx="3"/><text class="t-use" x="628" y="168">consumes</text>
    <rect class="use" x="770" y="146" width="146" height="36" rx="3"/><text class="t-use" x="782" y="168">consumes</text>
  </g>
  <g id="er5">
    <text class="t-row" x="16" y="212">ER-5 claim ticket, the only fence</text>
    <rect class="use" x="308" y="190" width="146" height="36" rx="3"/><text class="t-use" x="320" y="212">consumes</text>
    <rect class="own" x="462" y="190" width="146" height="36" rx="3"/><text class="t-own" x="474" y="212">OWNS</text>
    <rect class="use" x="616" y="190" width="146" height="36" rx="3"/><text class="t-use" x="628" y="212">consumes</text>
    <rect class="use" x="770" y="190" width="146" height="36" rx="3"/><text class="t-use" x="782" y="212">consumes</text>
  </g>
  <g id="er6">
    <text class="t-row" x="16" y="256">ER-6 one answer per delegate</text>
    <rect class="use" x="308" y="234" width="146" height="36" rx="3"/><text class="t-use" x="320" y="256">consumes</text>
    <rect class="own" x="462" y="234" width="146" height="36" rx="3"/><text class="t-own" x="474" y="256">OWNS</text>
    <rect class="use" x="616" y="234" width="146" height="36" rx="3"/><text class="t-use" x="628" y="256">consumes</text>
    <rect class="use" x="770" y="234" width="146" height="36" rx="3"/><text class="t-use" x="782" y="256">consumes</text>
  </g>
  <g id="er7">
    <text class="t-row" x="16" y="300">ER-7 one meaning per word</text>
    <rect class="use" x="308" y="278" width="146" height="36" rx="3"/><text class="t-use" x="320" y="300">consumes</text>
    <rect class="use" x="462" y="278" width="146" height="36" rx="3"/><text class="t-use" x="474" y="300">consumes</text>
    <rect class="own" x="616" y="278" width="146" height="36" rx="3"/><text class="t-own" x="628" y="300">OWNS</text>
    <rect class="use" x="770" y="278" width="146" height="36" rx="3"/><text class="t-use" x="782" y="300">consumes</text>
  </g>
  <g id="er16">
    <text class="t-row" x="16" y="344">ER-16, ER-17 the proof</text>
    <rect class="use" x="308" y="322" width="146" height="36" rx="3"/><text class="t-use" x="320" y="344">consumes</text>
    <rect class="use" x="462" y="322" width="146" height="36" rx="3"/><text class="t-use" x="474" y="344">consumes</text>
    <rect class="use" x="616" y="322" width="146" height="36" rx="3"/><text class="t-use" x="628" y="344">consumes</text>
    <rect class="own" x="770" y="322" width="146" height="36" rx="3"/><text class="t-own" x="782" y="344">OWNS</text>
  </g>
  <text class="t-use" x="16" y="390">ER-17's pages are written by FIX-1876; the closure owns proving them, by following them as written.</text>
</svg>
