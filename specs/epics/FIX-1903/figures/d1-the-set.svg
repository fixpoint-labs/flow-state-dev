<svg viewBox="0 0 940 420" role="img" aria-label="D1: is the set three issues and a closure, or four with MCP delivery split out to wait for dispatchTask. Chosen: three. It comes down to the first row, whether delivery needs a hand-over tool: no, because a coding run reads its project from the task row it holds, against waiting on FIX-1875 for a field. Second row, the price: one issue carries both MCP halves, so FIX-1905 is the largest child, against two smaller issues. Third row, a tie: the closure is the same either way. Locks in the coder default inside FIX-1904 and FIX-1875 becoming related, not blocking. Flips if a run that needs Linear can&#x27;t name its project when it starts."
     xmlns="http://www.w3.org/2000/svg">
  <style>
    :root { --surface:#FCFCFA; --surface-2:#E8E8E1; --ink:#191C21; --ink-2:#4C535B; --ink-3:#7A828B;
            --rule:#D5D4CB; --accent:#3E4E8C; --accent-soft:#E0E3F0; --code:#2C7C69; --code-soft:#DCEDE7;
            --gone:#A9544F; }
    @media (prefers-color-scheme: dark) {
      :root { --surface:#181C1F; --surface-2:#202528; --ink:#E6E8E5; --ink-2:#A4ACB1; --ink-3:#737B81;
              --rule:#2B3135; --accent:#8B9BD8; --accent-soft:#1B2140; --code:#5DBBA1; --code-soft:#14302A;
              --gone:#DE8A84; } }
    .bg     { fill:var(--surface); }
    .ask    { fill:var(--surface-2); }
    .chosen { fill:var(--code-soft); stroke:var(--code); stroke-width:1.6; }
    .rec    { fill:var(--code-soft); stroke:var(--code); stroke-width:1.6; stroke-dasharray:5 4; }
    .lost   { fill:var(--surface); stroke:var(--rule); stroke-width:1.4; stroke-dasharray:5 4; }
    .decide { fill:var(--accent-soft); }
    .bar    { fill:var(--accent); }
    .row    { stroke:var(--rule); stroke-width:1; }
    .foot   { fill:var(--surface-2); }
    .t-lbl  { fill:var(--ink-3); font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:9.5px; letter-spacing:.1em; }
    .t-tag  { font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:9.5px; letter-spacing:.1em; font-weight:600; }
    .t-q    { fill:var(--ink); font-family:system-ui,-apple-system,sans-serif; font-weight:600; font-size:15px; }
    .t-h    { font-family:system-ui,-apple-system,sans-serif; font-weight:600; font-size:14px; }
    .t-b    { fill:var(--ink); font-family:system-ui,-apple-system,sans-serif; font-size:12.5px; }
    .t-s    { fill:var(--ink-2); font-family:system-ui,-apple-system,sans-serif; font-size:11px; }
    .mark   { font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:16px; font-weight:700; }
    .plus   { fill:var(--code); }
    .minus  { fill:var(--gone); }
    .tie    { fill:var(--ink-3); }
    .c-code { fill:var(--code); }
    .c-mute { fill:var(--ink-3); }
    .c-lost { fill:var(--ink-2); }
    .c-acc  { fill:var(--accent); }
  </style>
  <rect class="bg" x="0" y="0" width="940" height="420"/>

  <g id="the-call">
    <rect class="ask" x="16" y="14" width="908" height="48" rx="6"/>
    <text class="t-lbl" x="32" y="32">D1 · THE CALL</text>
    <text class="t-q" x="32" y="52">Three issues and a closure, or split MCP delivery out to wait on dispatchTask?</text>
  </g>

  <g id="options">
    <rect class="chosen" x="212" y="76" width="348" height="46" rx="5"/>
    <text class="t-tag c-code" x="228" y="93">CHOSEN</text>
    <text class="t-h c-code" x="228" y="112">Three, and a closure</text>
    <rect class="lost" x="576" y="76" width="348" height="46" rx="5"/>
    <text class="t-tag c-mute" x="592" y="93">INSTEAD OF</text>
    <text class="t-h c-lost" x="592" y="112">Four: settings now, delivery later</text>
  </g>

  <g id="row-decides">
    <rect class="decide" x="16" y="134" width="908" height="62" rx="4"/>
    <rect class="bar" x="16" y="134" width="4" height="62"/>
    <text class="t-lbl" x="32" y="156">DOES DELIVERY</text>
    <text class="t-lbl" x="32" y="169">NEED A HAND-OVER?</text>
    <text class="t-tag c-acc" x="32" y="186">▸ DECIDES IT</text>
    <text class="mark plus" x="228" y="162">+</text>
    <text class="t-b" x="248" y="161">No: the run reads its own task row</text>
    <text class="t-s" x="248" y="179">the same read that gives it its repository</text>
    <text class="mark minus" x="592" y="162">−</text>
    <text class="t-b" x="612" y="161">Waits on FIX-1875 for a field</text>
    <text class="t-s" x="612" y="179">for a read the run already makes</text>
  </g>

  <g id="row-2">
    <text class="t-lbl" x="32" y="224">SIZE OF</text>
    <text class="t-lbl" x="32" y="237">THE LARGEST CHILD</text>
    <text class="mark minus" x="228" y="226">−</text>
    <text class="t-b" x="248" y="225">FIX-1905 carries both halves</text>
    <text class="t-s" x="248" y="243">the setting and the read, two PRs</text>
    <text class="mark plus" x="592" y="226">+</text>
    <text class="t-b" x="612" y="225">Two smaller issues</text>
    <text class="t-s" x="612" y="243">each with its own spec</text>
    <line class="row" x1="16" y1="254" x2="924" y2="254"/>
  </g>

  <g id="row-3">
    <text class="t-lbl" x="32" y="282">THE CLOSURE</text>
    <text class="t-lbl" x="32" y="295"></text>
    <text class="mark tie" x="228" y="284">=</text>
    <text class="t-b" x="248" y="283">The same run</text>
    <text class="t-s" x="248" y="301">both legs, one commit</text>
    <text class="mark tie" x="592" y="284">=</text>
    <text class="t-b" x="612" y="283">The same run</text>
    <text class="t-s" x="612" y="301">both legs, one commit</text>
    <line class="row" x1="16" y1="312" x2="924" y2="312"/>
  </g>

  <g id="locks-in">
    <rect class="foot" x="16" y="330" width="446" height="74" rx="5"/>
    <text class="t-lbl" x="32" y="351">LOCKS IN</text>
    <text class="t-b" x="32" y="371">The coder default goes in FIX-1904</text>
    <text class="t-s" x="32" y="389">FIX-1875 becomes related, not blocking</text>
  </g>

  <g id="flips-if">
    <rect class="foot" x="478" y="330" width="446" height="74" rx="5"/>
    <text class="t-lbl" x="494" y="351">FLIPS IF</text>
    <text class="t-b" x="494" y="371">A run that needs Linear can&#x27;t name its project</text>
    <text class="t-s" x="494" y="389">then delivery needs the hand-over after all</text>
  </g>
</svg>
