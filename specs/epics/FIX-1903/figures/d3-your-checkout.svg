<svg viewBox="0 0 940 420" role="img" aria-label="D3: where a run&#x27;s worktree comes from. Chosen: your own checkout, with the project row naming a remote and the host mapping it. Instead of: a file URL to the checkout in the row, which the host clones. It comes down to the first row, where the branch a person reviews ends up: in their checkout, against a hidden clone they must fetch from. Second row, the price: a workspace host change, against none today. Third row: the row stays a remote, against a machine&#x27;s path in a shared row. Locks in the remote-to-checkout mapping as host config, bound to the projects it names. Flips if branches in the checkout prove a nuisance."
     xmlns="http://www.w3.org/2000/svg">
  <style>
    :root { --surface:#FCFCFA; --surface-2:#E8E8E1; --ink:#191C21; --ink-2:#4C535B; --ink-3:#7A828B;
            --rule:#D5D4CB; --accent:#3E4E8C; --accent-soft:#E0E3F0; --code:#2C7C69; --code-soft:#DCEDE7;
            --gone:#A9544F; }
    @media (prefers-color-scheme: dark) {
      :root { --surface:#181C1F; --surface-2:#202528; --ink:#E6E8E5; --ink-2:#A4ACB1; --ink-3:#737B81;
              --rule:#2B3135; --accent:#8B9BD8; --accent-soft:#1B2140; --code:#5DBBA1; --code-soft:#14302A;
              --gone:#DE8A84; } }
    .bg     { fill:var(--surface); }
    .ask    { fill:var(--surface-2); }
    .chosen { fill:var(--code-soft); stroke:var(--code); stroke-width:1.6; }
    .rec    { fill:var(--code-soft); stroke:var(--code); stroke-width:1.6; stroke-dasharray:5 4; }
    .lost   { fill:var(--surface); stroke:var(--rule); stroke-width:1.4; stroke-dasharray:5 4; }
    .decide { fill:var(--accent-soft); }
    .bar    { fill:var(--accent); }
    .row    { stroke:var(--rule); stroke-width:1; }
    .foot   { fill:var(--surface-2); }
    .t-lbl  { fill:var(--ink-3); font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:9.5px; letter-spacing:.1em; }
    .t-tag  { font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:9.5px; letter-spacing:.1em; font-weight:600; }
    .t-q    { fill:var(--ink); font-family:system-ui,-apple-system,sans-serif; font-weight:600; font-size:15px; }
    .t-h    { font-family:system-ui,-apple-system,sans-serif; font-weight:600; font-size:14px; }
    .t-b    { fill:var(--ink); font-family:system-ui,-apple-system,sans-serif; font-size:12.5px; }
    .t-s    { fill:var(--ink-2); font-family:system-ui,-apple-system,sans-serif; font-size:11px; }
    .mark   { font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:16px; font-weight:700; }
    .plus   { fill:var(--code); }
    .minus  { fill:var(--gone); }
    .tie    { fill:var(--ink-3); }
    .c-code { fill:var(--code); }
    .c-mute { fill:var(--ink-3); }
    .c-lost { fill:var(--ink-2); }
    .c-acc  { fill:var(--accent); }
  </style>
  <rect class="bg" x="0" y="0" width="940" height="420"/>

  <g id="the-call">
    <rect class="ask" x="16" y="14" width="908" height="48" rx="6"/>
    <text class="t-lbl" x="32" y="32">D3 · THE CALL</text>
    <text class="t-q" x="32" y="52">Cut worktrees from your checkout, or from a clone the host makes of it?</text>
  </g>

  <g id="options">
    <rect class="chosen" x="212" y="76" width="348" height="46" rx="5"/>
    <text class="t-tag c-code" x="228" y="93">CHOSEN</text>
    <text class="t-h c-code" x="228" y="112">Your checkout; the row names a remote</text>
    <rect class="lost" x="576" y="76" width="348" height="46" rx="5"/>
    <text class="t-tag c-mute" x="592" y="93">INSTEAD OF</text>
    <text class="t-h c-lost" x="592" y="112">file:// to the checkout, cloned</text>
  </g>

  <g id="row-decides">
    <rect class="decide" x="16" y="134" width="908" height="62" rx="4"/>
    <rect class="bar" x="16" y="134" width="4" height="62"/>
    <text class="t-lbl" x="32" y="156">WHERE THE</text>
    <text class="t-lbl" x="32" y="169">BRANCH LANDS</text>
    <text class="t-tag c-acc" x="32" y="186">▸ DECIDES IT</text>
    <text class="mark plus" x="228" y="162">+</text>
    <text class="t-b" x="248" y="161">In your checkout</text>
    <text class="t-s" x="248" y="179">review it at once, like any branch</text>
    <text class="mark minus" x="592" y="162">−</text>
    <text class="t-b" x="612" y="161">In the host&#x27;s hidden clone</text>
    <text class="t-s" x="612" y="179">fetch it before you can see it</text>
  </g>

  <g id="row-2">
    <text class="t-lbl" x="32" y="224">WORK TO</text>
    <text class="t-lbl" x="32" y="237">GET THERE</text>
    <text class="mark minus" x="228" y="226">−</text>
    <text class="t-b" x="248" y="225">A workspace host change</text>
    <text class="t-s" x="248" y="243">the mapping, and files beside it</text>
    <text class="mark plus" x="592" y="226">+</text>
    <text class="t-b" x="612" y="225">None</text>
    <text class="t-s" x="612" y="243">DevTeam&#x27;s Storefront does it today</text>
    <line class="row" x1="16" y1="254" x2="924" y2="254"/>
  </g>

  <g id="row-3">
    <text class="t-lbl" x="32" y="282">WHAT THE</text>
    <text class="t-lbl" x="32" y="295">ROW HOLDS</text>
    <text class="mark plus" x="228" y="284">+</text>
    <text class="t-b" x="248" y="283">A remote, true on any machine</text>
    <text class="t-s" x="248" y="301">the folder is host config</text>
    <text class="mark minus" x="592" y="284">−</text>
    <text class="t-b" x="612" y="283">One machine&#x27;s path</text>
    <text class="t-s" x="612" y="301">in a row the whole org reads</text>
    <line class="row" x1="16" y1="312" x2="924" y2="312"/>
  </g>

  <g id="locks-in">
    <rect class="foot" x="16" y="330" width="446" height="74" rx="5"/>
    <text class="t-lbl" x="32" y="351">LOCKS IN</text>
    <text class="t-b" x="32" y="371">Host config, bound to named projects</text>
    <text class="t-s" x="32" y="389">runs cut conductor/ branches in your checkout</text>
  </g>

  <g id="flips-if">
    <rect class="foot" x="478" y="330" width="446" height="74" rx="5"/>
    <text class="t-lbl" x="494" y="351">FLIPS IF</text>
    <text class="t-b" x="494" y="371">Branches in your checkout are a nuisance</text>
    <text class="t-s" x="494" y="389">then a clone fed from it is the default</text>
  </g>
</svg>
