<svg viewBox="0 0 940 420" role="img" aria-label="Open fork: does a fresh open of shift-manager:dev run a real coding agent or the scripted one. Recommended: a real coding agent, Claude Code, refusing to start without a credential. Instead of: the scripted run, with the agent one setting away. It comes down to the first row, whether a fresh open meets the goal: yes, against only after a setting. Second row, the price: every open needs a Claude credential and runs spend model time, against free. Third row, a tie: neither falls back silently. Locks in a loud refusal when no credential is set. Flips if most opens are for screen work, where an agent is unwanted."
     xmlns="http://www.w3.org/2000/svg">
  <style>
    :root { --surface:#FCFCFA; --surface-2:#E8E8E1; --ink:#191C21; --ink-2:#4C535B; --ink-3:#7A828B;
            --rule:#D5D4CB; --accent:#3E4E8C; --accent-soft:#E0E3F0; --code:#2C7C69; --code-soft:#DCEDE7;
            --gone:#A9544F; }
    @media (prefers-color-scheme: dark) {
      :root { --surface:#181C1F; --surface-2:#202528; --ink:#E6E8E5; --ink-2:#A4ACB1; --ink-3:#737B81;
              --rule:#2B3135; --accent:#8B9BD8; --accent-soft:#1B2140; --code:#5DBBA1; --code-soft:#14302A;
              --gone:#DE8A84; } }
    .bg     { fill:var(--surface); }
    .ask    { fill:var(--surface-2); }
    .chosen { fill:var(--code-soft); stroke:var(--code); stroke-width:1.6; }
    .rec    { fill:var(--code-soft); stroke:var(--code); stroke-width:1.6; stroke-dasharray:5 4; }
    .lost   { fill:var(--surface); stroke:var(--rule); stroke-width:1.4; stroke-dasharray:5 4; }
    .decide { fill:var(--accent-soft); }
    .bar    { fill:var(--accent); }
    .row    { stroke:var(--rule); stroke-width:1; }
    .foot   { fill:var(--surface-2); }
    .t-lbl  { fill:var(--ink-3); font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:9.5px; letter-spacing:.1em; }
    .t-tag  { font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:9.5px; letter-spacing:.1em; font-weight:600; }
    .t-q    { fill:var(--ink); font-family:system-ui,-apple-system,sans-serif; font-weight:600; font-size:15px; }
    .t-h    { font-family:system-ui,-apple-system,sans-serif; font-weight:600; font-size:14px; }
    .t-b    { fill:var(--ink); font-family:system-ui,-apple-system,sans-serif; font-size:12.5px; }
    .t-s    { fill:var(--ink-2); font-family:system-ui,-apple-system,sans-serif; font-size:11px; }
    .mark   { font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:16px; font-weight:700; }
    .plus   { fill:var(--code); }
    .minus  { fill:var(--gone); }
    .tie    { fill:var(--ink-3); }
    .c-code { fill:var(--code); }
    .c-mute { fill:var(--ink-3); }
    .c-lost { fill:var(--ink-2); }
    .c-acc  { fill:var(--accent); }
  </style>
  <rect class="bg" x="0" y="0" width="940" height="420"/>

  <g id="the-call">
    <rect class="ask" x="16" y="14" width="908" height="48" rx="6"/>
    <text class="t-lbl" x="32" y="32">OPEN · THE CALL</text>
    <text class="t-q" x="32" y="52">On a fresh open, does the coder run a real coding agent, or the scripted one?</text>
  </g>

  <g id="options">
    <rect class="rec" x="212" y="76" width="348" height="46" rx="5"/>
    <text class="t-tag c-code" x="228" y="93">RECOMMENDED</text>
    <text class="t-h c-code" x="228" y="112">A real agent, loud without a key</text>
    <rect class="lost" x="576" y="76" width="348" height="46" rx="5"/>
    <text class="t-tag c-mute" x="592" y="93">INSTEAD OF</text>
    <text class="t-h c-lost" x="592" y="112">The script; the agent one setting away</text>
  </g>

  <g id="row-decides">
    <rect class="decide" x="16" y="134" width="908" height="62" rx="4"/>
    <rect class="bar" x="16" y="134" width="4" height="62"/>
    <text class="t-lbl" x="32" y="156">A FRESH OPEN</text>
    <text class="t-lbl" x="32" y="169">MEETS THE GOAL?</text>
    <text class="t-tag c-acc" x="32" y="186">▸ DECIDES IT</text>
    <text class="mark plus" x="228" y="162">+</text>
    <text class="t-b" x="248" y="161">Yes</text>
    <text class="t-s" x="248" y="179">an agent works the item</text>
    <text class="mark minus" x="592" y="162">−</text>
    <text class="t-b" x="612" y="161">Only after a setting</text>
    <text class="t-s" x="612" y="179">a script can&#x27;t work an item</text>
  </g>

  <g id="row-2">
    <text class="t-lbl" x="32" y="224">WHAT AN</text>
    <text class="t-lbl" x="32" y="237">OPEN COSTS</text>
    <text class="mark minus" x="228" y="226">−</text>
    <text class="t-b" x="248" y="225">A Claude credential, and model time</text>
    <text class="t-s" x="248" y="243">on every run, screen work included</text>
    <text class="mark plus" x="592" y="226">+</text>
    <text class="t-b" x="612" y="225">Nothing</text>
    <text class="t-s" x="612" y="243">until a person opts in</text>
    <line class="row" x1="16" y1="254" x2="924" y2="254"/>
  </g>

  <g id="row-3">
    <text class="t-lbl" x="32" y="282">SILENT</text>
    <text class="t-lbl" x="32" y="295">FALLBACK</text>
    <text class="mark tie" x="228" y="284">=</text>
    <text class="t-b" x="248" y="283">None</text>
    <text class="t-s" x="248" y="301">no key refuses the start</text>
    <text class="mark tie" x="592" y="284">=</text>
    <text class="t-b" x="612" y="283">None</text>
    <text class="t-s" x="612" y="301">the agent is named, or not used</text>
    <line class="row" x1="16" y1="312" x2="924" y2="312"/>
  </g>

  <g id="locks-in">
    <rect class="foot" x="16" y="330" width="446" height="74" rx="5"/>
    <text class="t-lbl" x="32" y="351">LOCKS IN</text>
    <text class="t-b" x="32" y="371">No credential refuses the start</text>
    <text class="t-s" x="32" y="389">DEVFORCE_LAB_HARNESS=stub still gives the script</text>
  </g>

  <g id="flips-if">
    <rect class="foot" x="478" y="330" width="446" height="74" rx="5"/>
    <text class="t-lbl" x="494" y="351">FLIPS IF</text>
    <text class="t-b" x="494" y="371">Most opens are for screen work</text>
    <text class="t-s" x="494" y="389">then the script stays the default</text>
  </g>
</svg>
