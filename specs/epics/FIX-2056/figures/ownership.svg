<svg viewBox="0 0 940 422" role="img" xmlns="http://www.w3.org/2000/svg"
     aria-label="Who owns what: ten rules by eleven issues, the closure FIX-2087 and the coordinator. FIX-2076 owns who settles a row and board modes. FIX-2077 owns the completion rule. FIX-2078 owns one ending path. FIX-2079 owns due times. FIX-2080 owns the filing settings. FIX-2081 owns the four tools and delegates as authority. FIX-2077, FIX-2080, FIX-2083 and FIX-2086 each build the read for the row shape they retire. The coordinator owns the boundary with FIX-2058 and FIX-2070. Other cells use the rule or are blank.">
  <style>
    :root { --surface:#FCFCFA; --surface-2:#E8E8E1; --ink:#191C21; --ink-2:#4C535B; --ink-3:#7A828B;
            --rule:#D5D4CB; --accent:#3E4E8C; --accent-soft:#E0E3F0; --code:#2C7C69; --code-soft:#DCEDE7; }
    @media (prefers-color-scheme: dark) {
      :root { --surface:#181C1F; --surface-2:#202528; --ink:#E6E8E5; --ink-2:#A4ACB1; --ink-3:#737B81;
              --rule:#2B3135; --accent:#8B9BD8; --accent-soft:#1B2140; --code:#5DBBA1; --code-soft:#14302A; } }
    .bg    { fill:var(--surface); }
    .own   { fill:var(--accent-soft); stroke:var(--accent); stroke-width:1.4; }
    .build { fill:var(--code-soft); stroke:var(--code); stroke-width:1.4; }
    .use   { fill:var(--surface-2); stroke:var(--rule); stroke-width:1; }
    .t-lbl { fill:var(--ink-3); font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:9.5px; letter-spacing:.1em; }
    .t-col { fill:var(--ink); font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:9.5px; }
    .t-row { fill:var(--ink); font-family:system-ui,-apple-system,sans-serif; font-size:11.5px; }
    .t-own { fill:var(--accent); font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:9px; letter-spacing:.06em; }
    .t-bld { fill:var(--code); font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:9px; letter-spacing:.06em; }
    .t-use { fill:var(--ink-2); font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:9px; }
  </style>
  <rect class="bg" x="0" y="0" width="940" height="422"/>
  <text class="t-lbl" x="16" y="20">WHO OWNS WHAT &#8212; ONE OWNER PER RULE &#183; COLUMNS ARE FIX- ISSUES</text>
  <g id="columns">
    <text class="t-col" x="242" y="46">2076</text>
    <text class="t-col" x="295" y="46">2077</text>
    <text class="t-col" x="348" y="46">2078</text>
    <text class="t-col" x="401" y="46">2079</text>
    <text class="t-col" x="454" y="46">2080</text>
    <text class="t-col" x="507" y="46">2081</text>
    <text class="t-col" x="560" y="46">2082</text>
    <text class="t-col" x="613" y="46">2083</text>
    <text class="t-col" x="666" y="46">2084</text>
    <text class="t-col" x="719" y="46">2085</text>
    <text class="t-col" x="772" y="46">2086</text>
    <text class="t-col" x="825" y="46">2087·cl</text>
    <text class="t-col" x="878" y="46">coord.</text>
  </g>
  <g id="er1">
    <text class="t-row" x="16" y="76">ER-1 only gate or drain settles</text>
    <rect class="own" x="236" y="58" width="50" height="26" rx="3"/><text class="t-own" x="242" y="75">OWNS</text>
    <rect class="use" x="289" y="58" width="50" height="26" rx="3"/><text class="t-use" x="295" y="75">uses</text>
    <rect class="use" x="501" y="58" width="50" height="26" rx="3"/><text class="t-use" x="507" y="75">uses</text>
    <rect class="use" x="819" y="58" width="50" height="26" rx="3"/><text class="t-use" x="825" y="75">uses</text>
  </g>
  <g id="er2">
    <text class="t-row" x="16" y="108">ER-2 one done rule, at the gate</text>
    <rect class="own" x="289" y="90" width="50" height="26" rx="3"/><text class="t-own" x="295" y="107">OWNS</text>
    <rect class="use" x="554" y="90" width="50" height="26" rx="3"/><text class="t-use" x="560" y="107">uses</text>
    <rect class="use" x="607" y="90" width="50" height="26" rx="3"/><text class="t-use" x="613" y="107">uses</text>
    <rect class="use" x="766" y="90" width="50" height="26" rx="3"/><text class="t-use" x="772" y="107">uses</text>
  </g>
  <g id="er3">
    <text class="t-row" x="16" y="140">ER-3 every ending to the filer once</text>
    <rect class="own" x="342" y="122" width="50" height="26" rx="3"/><text class="t-own" x="348" y="139">OWNS</text>
    <rect class="use" x="395" y="122" width="50" height="26" rx="3"/><text class="t-use" x="401" y="139">uses</text>
    <rect class="use" x="607" y="122" width="50" height="26" rx="3"/><text class="t-use" x="613" y="139">uses</text>
    <rect class="use" x="713" y="122" width="50" height="26" rx="3"/><text class="t-use" x="719" y="139">uses</text>
    <rect class="use" x="819" y="122" width="50" height="26" rx="3"/><text class="t-use" x="825" y="139">uses</text>
  </g>
  <g id="er4">
    <text class="t-row" x="16" y="172">ER-4 every debt has a due time</text>
    <rect class="use" x="342" y="154" width="50" height="26" rx="3"/><text class="t-use" x="348" y="171">uses</text>
    <rect class="own" x="395" y="154" width="50" height="26" rx="3"/><text class="t-own" x="401" y="171">OWNS</text>
    <rect class="use" x="448" y="154" width="50" height="26" rx="3"/><text class="t-use" x="454" y="171">uses</text>
    <rect class="use" x="554" y="154" width="50" height="26" rx="3"/><text class="t-use" x="560" y="171">uses</text>
    <rect class="use" x="819" y="154" width="50" height="26" rx="3"/><text class="t-use" x="825" y="171">uses</text>
  </g>
  <g id="er5">
    <text class="t-row" x="16" y="204">ER-5 mode decides the wait</text>
    <rect class="own" x="236" y="186" width="50" height="26" rx="3"/><text class="t-own" x="242" y="203">OWNS</text>
    <rect class="use" x="554" y="186" width="50" height="26" rx="3"/><text class="t-use" x="560" y="203">uses</text>
    <rect class="use" x="607" y="186" width="50" height="26" rx="3"/><text class="t-use" x="613" y="203">uses</text>
  </g>
  <g id="er6">
    <text class="t-row" x="16" y="236">ER-6 four filing settings</text>
    <rect class="own" x="448" y="218" width="50" height="26" rx="3"/><text class="t-own" x="454" y="235">OWNS</text>
    <rect class="use" x="501" y="218" width="50" height="26" rx="3"/><text class="t-use" x="507" y="235">uses</text>
    <rect class="use" x="607" y="218" width="50" height="26" rx="3"/><text class="t-use" x="613" y="235">uses</text>
    <rect class="use" x="766" y="218" width="50" height="26" rx="3"/><text class="t-use" x="772" y="235">uses</text>
  </g>
  <g id="er7">
    <text class="t-row" x="16" y="268">ER-7 four tools, the only surface</text>
    <rect class="own" x="501" y="250" width="50" height="26" rx="3"/><text class="t-own" x="507" y="267">OWNS</text>
    <rect class="use" x="554" y="250" width="50" height="26" rx="3"/><text class="t-use" x="560" y="267">uses</text>
    <rect class="use" x="607" y="250" width="50" height="26" rx="3"/><text class="t-use" x="613" y="267">uses</text>
    <rect class="use" x="660" y="250" width="50" height="26" rx="3"/><text class="t-use" x="666" y="267">uses</text>
    <rect class="use" x="713" y="250" width="50" height="26" rx="3"/><text class="t-use" x="719" y="267">uses</text>
    <rect class="use" x="766" y="250" width="50" height="26" rx="3"/><text class="t-use" x="772" y="267">uses</text>
    <rect class="use" x="819" y="250" width="50" height="26" rx="3"/><text class="t-use" x="825" y="267">uses</text>
  </g>
  <g id="er8">
    <text class="t-row" x="16" y="300">ER-8 delegates are authority</text>
    <rect class="own" x="501" y="282" width="50" height="26" rx="3"/><text class="t-own" x="507" y="299">OWNS</text>
    <rect class="use" x="607" y="282" width="50" height="26" rx="3"/><text class="t-use" x="613" y="299">uses</text>
  </g>
  <g id="er9">
    <text class="t-row" x="16" y="332">ER-9 retired rows read, not dropped</text>
    <rect class="build" x="289" y="314" width="50" height="26" rx="3"/><text class="t-bld" x="295" y="331">BUILDS</text>
    <rect class="build" x="448" y="314" width="50" height="26" rx="3"/><text class="t-bld" x="454" y="331">BUILDS</text>
    <rect class="build" x="607" y="314" width="50" height="26" rx="3"/><text class="t-bld" x="613" y="331">BUILDS</text>
    <rect class="build" x="766" y="314" width="50" height="26" rx="3"/><text class="t-bld" x="772" y="331">BUILDS</text>
  </g>
  <g id="er10">
    <text class="t-row" x="16" y="364">ER-10 no wait on FIX-2058, FIX-2070</text>
    <rect class="use" x="289" y="346" width="50" height="26" rx="3"/><text class="t-use" x="295" y="363">uses</text>
    <rect class="use" x="766" y="346" width="50" height="26" rx="3"/><text class="t-use" x="772" y="363">uses</text>
    <rect class="own" x="872" y="346" width="50" height="26" rx="3"/><text class="t-own" x="878" y="363">OWNS</text>
  </g>
  <text class="t-use" x="16" y="406">ER-9 has one builder per retired row shape. A blank cell neither decides nor reads the rule.</text>
</svg>
