<svg viewBox="0 0 940 420" role="img" aria-label="D3, decided by the owner: whether a person's stop has a deadline by default. Chosen: no default; a host setting or a call's deadline opts in. Beside it: a default of its own, 7 days, and the 5-minute default a wait on a task already has. It comes down to the first row, a fixed length being arbitrary: with no default the app says when a stop ends; with 7 days the work goes ahead or fails after a week nobody chose; with 5 minutes a try fails while the person is at lunch. The price of the choice is the second row: a forgotten stop waits until someone answers it, or its task is stopped or cancelled, where 7 days clears it in a week and 5 minutes in minutes. The third row: the model's rule that every stop has a deadline is amended under the choice and holds under either default. Locks in: no deadline unless one is set, through one host setting, unset by default, or a call's deadline. Flips if: Inboxes fill with stops nobody will answer; then the host sets the setting."
     xmlns="http://www.w3.org/2000/svg">
  <style>
    :root { --surface:#FCFCFA; --surface-2:#E8E8E1; --ink:#191C21; --ink-2:#4C535B; --ink-3:#7A828B;
            --rule:#D5D4CB; --accent:#3E4E8C; --accent-soft:#E0E3F0; --code:#2C7C69; --code-soft:#DCEDE7;
            --gone:#A9544F; }
    @media (prefers-color-scheme: dark) {
      :root { --surface:#181C1F; --surface-2:#202528; --ink:#E6E8E5; --ink-2:#A4ACB1; --ink-3:#737B81;
              --rule:#2B3135; --accent:#8B9BD8; --accent-soft:#1B2140; --code:#5DBBA1; --code-soft:#14302A;
              --gone:#DE8A84; } }
    .bg     { fill:var(--surface); }
    .ask    { fill:var(--surface-2); }
    .chosen { fill:var(--code-soft); stroke:var(--code); stroke-width:1.6; }
    .lost   { fill:var(--surface); stroke:var(--rule); stroke-width:1.4; stroke-dasharray:5 4; }
    .decide { fill:var(--accent-soft); }
    .bar    { fill:var(--accent); }
    .row    { stroke:var(--rule); stroke-width:1; }
    .foot   { fill:var(--surface-2); }
    .t-lbl  { fill:var(--ink-3); font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:9.5px; letter-spacing:.1em; }
    .t-tag  { font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:9.5px; letter-spacing:.1em; font-weight:600; }
    .t-q    { fill:var(--ink); font-family:system-ui,-apple-system,sans-serif; font-weight:600; font-size:15px; }
    .t-h    { font-family:system-ui,-apple-system,sans-serif; font-weight:600; font-size:13px; }
    .t-b    { fill:var(--ink); font-family:system-ui,-apple-system,sans-serif; font-size:12px; }
    .t-s    { fill:var(--ink-2); font-family:system-ui,-apple-system,sans-serif; font-size:10.5px; }
    .mark   { font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:16px; font-weight:700; }
    .plus   { fill:var(--code); }
    .minus  { fill:var(--gone); }
    .tie    { fill:var(--ink-3); }
    .c-code { fill:var(--code); }
    .c-mute { fill:var(--ink-3); }
    .c-lost { fill:var(--ink-2); }
    .c-acc  { fill:var(--accent); }
  </style>
    <rect class="bg" x="0" y="0" width="940" height="420"/>

  <g id="the-call">
    <rect class="ask" x="16" y="14" width="908" height="48" rx="6"/>
    <text class="t-lbl" x="32" y="32">D3 · THE OWNER'S CALL, DECIDED 2026-10-24</text>
    <text class="t-q" x="32" y="52">Does a person's stop have a deadline by default?</text>
  </g>

  <g id="options">
    <rect class="chosen" x="212" y="76" width="224" height="46" rx="5"/>
    <text class="t-tag c-code" x="226" y="93">CHOSEN</text>
    <text class="t-h c-code" x="226" y="112">No default; opt in</text>
    <rect class="lost" x="452" y="76" width="224" height="46" rx="5"/>
    <text class="t-tag c-mute" x="466" y="93">INSTEAD OF</text>
    <text class="t-h c-lost" x="466" y="112">Its own default, 7 days</text>
    <rect class="lost" x="692" y="76" width="224" height="46" rx="5"/>
    <text class="t-tag c-mute" x="706" y="93">INSTEAD OF</text>
    <text class="t-h c-lost" x="706" y="112">The wait default, 5 minutes</text>
  </g>

  <g id="row-decides">
    <rect class="decide" x="16" y="134" width="908" height="62" rx="4"/>
    <rect class="bar" x="16" y="134" width="4" height="62"/>
    <text class="t-lbl" x="32" y="156">A FIXED LENGTH</text>
    <text class="t-lbl" x="32" y="169">IS ARBITRARY</text>
    <text class="t-tag c-acc" x="32" y="186">▸ DECIDES IT</text>
    <text class="mark plus" x="226" y="162">+</text>
    <text class="t-b" x="244" y="161">The app says when</text>
    <text class="t-s" x="244" y="179">a deadline only where it is set</text>
    <text class="mark minus" x="466" y="162">−</text>
    <text class="t-b" x="484" y="161">Ends after a week</text>
    <text class="t-s" x="484" y="179">a length nobody chose for it</text>
    <text class="mark minus" x="706" y="162">−</text>
    <text class="t-b" x="724" y="161">A try fails in minutes</text>
    <text class="t-s" x="724" y="179">while the person is at lunch</text>
  </g>

  <g id="row-price">
    <text class="t-lbl" x="32" y="222">A FORGOTTEN</text>
    <text class="t-lbl" x="32" y="235">STOP</text>
    <text class="mark minus" x="226" y="224">−</text>
    <text class="t-b" x="244" y="223">Waits until answered</text>
    <text class="t-s" x="244" y="241">or its task stopped or cancelled</text>
    <text class="mark plus" x="466" y="224">+</text>
    <text class="t-b" x="484" y="223">Clears in a week</text>
    <text class="t-s" x="484" y="241">told no answer came</text>
    <text class="mark plus" x="706" y="224">+</text>
    <text class="t-b" x="724" y="223">Clears in minutes</text>
    <text class="t-s" x="724" y="241">the filer hears the failure</text>
    <line class="row" x1="16" y1="256" x2="924" y2="256"/>
  </g>

  <g id="row-rule">
    <text class="t-lbl" x="32" y="280">EVERY STOP HAS</text>
    <text class="t-lbl" x="32" y="293">A DEADLINE</text>
    <text class="mark minus" x="226" y="282">−</text>
    <text class="t-b" x="244" y="281">Amended</text>
    <text class="t-s" x="244" y="299">the concept's rule, by the owner</text>
    <text class="mark tie" x="466" y="282">=</text>
    <text class="t-b" x="484" y="281">Holds</text>
    <text class="t-s" x="484" y="299">the model's rule</text>
    <text class="mark tie" x="706" y="282">=</text>
    <text class="t-b" x="724" y="281">Holds</text>
    <text class="t-s" x="724" y="299">the same</text>
    <line class="row" x1="16" y1="314" x2="924" y2="314"/>
  </g>

  <g id="locks-in">
    <rect class="foot" x="16" y="330" width="446" height="74" rx="5"/>
    <text class="t-lbl" x="32" y="351">LOCKS IN</text>
    <text class="t-b" x="32" y="371">No deadline unless one is set</text>
    <text class="t-s" x="32" y="389">one host setting, unset by default, or a call's deadline</text>
  </g>

  <g id="flips-if">
    <rect class="foot" x="478" y="330" width="446" height="74" rx="5"/>
    <text class="t-lbl" x="494" y="351">FLIPS IF</text>
    <text class="t-b" x="494" y="371">Inboxes fill with stops nobody will answer</text>
    <text class="t-s" x="494" y="389">then the host sets the setting, one line</text>
  </g>
</svg>
