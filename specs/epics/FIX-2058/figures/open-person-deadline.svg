<svg viewBox="0 0 940 420" role="img" aria-label="Open fork, not decided: how long a person has to answer by default before an unanswered stop counts against the work. Recommended: a default of its own for a person's stop, 7 days, set per host and per call. Beside it: the 5-minute default a wait on a task already has, and no default at all. It comes down to the first row, a person away for lunch or a weekend: with 7 days their work waits; with 5 minutes an unanswered question fails a try at the task; with none it waits forever. The price of the recommendation is the second row: a forgotten question sits in the Inbox up to a week, where 5 minutes clears it in minutes and none never clears it. The third row: the model's rule that every stop has a deadline holds with either default and breaks with none. Locks in: one host setting for a person's stop, beside the wait's. Flips if: apps where a stale question is worse than a failed try; then 24 hours."
     xmlns="http://www.w3.org/2000/svg">
  <style>
    :root { --surface:#FCFCFA; --surface-2:#E8E8E1; --ink:#191C21; --ink-2:#4C535B; --ink-3:#7A828B;
            --rule:#D5D4CB; --accent:#3E4E8C; --accent-soft:#E0E3F0; --code:#2C7C69; --code-soft:#DCEDE7;
            --gone:#A9544F; }
    @media (prefers-color-scheme: dark) {
      :root { --surface:#181C1F; --surface-2:#202528; --ink:#E6E8E5; --ink-2:#A4ACB1; --ink-3:#737B81;
              --rule:#2B3135; --accent:#8B9BD8; --accent-soft:#1B2140; --code:#5DBBA1; --code-soft:#14302A;
              --gone:#DE8A84; } }
    .bg     { fill:var(--surface); }
    .ask    { fill:var(--surface-2); }
    .rec    { fill:var(--code-soft); stroke:var(--code); stroke-width:1.6; stroke-dasharray:5 4; }
    .lost   { fill:var(--surface); stroke:var(--rule); stroke-width:1.4; stroke-dasharray:5 4; }
    .decide { fill:var(--accent-soft); }
    .bar    { fill:var(--accent); }
    .row    { stroke:var(--rule); stroke-width:1; }
    .foot   { fill:var(--surface-2); }
    .t-lbl  { fill:var(--ink-3); font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:9.5px; letter-spacing:.1em; }
    .t-tag  { font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:9.5px; letter-spacing:.1em; font-weight:600; }
    .t-q    { fill:var(--ink); font-family:system-ui,-apple-system,sans-serif; font-weight:600; font-size:15px; }
    .t-h    { font-family:system-ui,-apple-system,sans-serif; font-weight:600; font-size:13px; }
    .t-b    { fill:var(--ink); font-family:system-ui,-apple-system,sans-serif; font-size:12px; }
    .t-s    { fill:var(--ink-2); font-family:system-ui,-apple-system,sans-serif; font-size:10.5px; }
    .mark   { font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:16px; font-weight:700; }
    .plus   { fill:var(--code); }
    .minus  { fill:var(--gone); }
    .tie    { fill:var(--ink-3); }
    .c-code { fill:var(--code); }
    .c-mute { fill:var(--ink-3); }
    .c-lost { fill:var(--ink-2); }
    .c-acc  { fill:var(--accent); }
  </style>
  <rect class="bg" x="0" y="0" width="940" height="420"/>

  <g id="the-call">
    <rect class="ask" x="16" y="14" width="908" height="48" rx="6"/>
    <text class="t-lbl" x="32" y="32">OPEN · THE OWNER'S CALL</text>
    <text class="t-q" x="32" y="52">How long does a person have to answer, by default?</text>
  </g>

  <g id="options">
    <rect class="rec" x="212" y="76" width="224" height="46" rx="5"/>
    <text class="t-tag c-code" x="226" y="93">RECOMMENDED</text>
    <text class="t-h c-code" x="226" y="112">Its own default, 7 days</text>
    <rect class="lost" x="452" y="76" width="224" height="46" rx="5"/>
    <text class="t-tag c-mute" x="466" y="93">INSTEAD OF</text>
    <text class="t-h c-lost" x="466" y="112">The wait default, 5 minutes</text>
    <rect class="lost" x="692" y="76" width="224" height="46" rx="5"/>
    <text class="t-tag c-mute" x="706" y="93">INSTEAD OF</text>
    <text class="t-h c-lost" x="706" y="112">No default</text>
  </g>

  <g id="row-decides">
    <rect class="decide" x="16" y="134" width="908" height="62" rx="4"/>
    <rect class="bar" x="16" y="134" width="4" height="62"/>
    <text class="t-lbl" x="32" y="156">THE PERSON IS</text>
    <text class="t-lbl" x="32" y="169">AWAY A WHILE</text>
    <text class="t-tag c-acc" x="32" y="186">▸ DECIDES IT</text>
    <text class="mark plus" x="226" y="162">+</text>
    <text class="t-b" x="244" y="161">The work waits</text>
    <text class="t-s" x="244" y="179">a weekend included</text>
    <text class="mark minus" x="466" y="162">−</text>
    <text class="t-b" x="484" y="161">A try at the task fails</text>
    <text class="t-s" x="484" y="179">within minutes, unhandled</text>
    <text class="mark plus" x="706" y="162">+</text>
    <text class="t-b" x="724" y="161">The work waits</text>
    <text class="t-s" x="724" y="179">for as long as it takes</text>
  </g>

  <g id="row-price">
    <text class="t-lbl" x="32" y="222">A FORGOTTEN</text>
    <text class="t-lbl" x="32" y="235">QUESTION</text>
    <text class="mark minus" x="226" y="224">−</text>
    <text class="t-b" x="244" y="223">Sits up to a week</text>
    <text class="t-s" x="244" y="241">in the Inbox, then clears</text>
    <text class="mark plus" x="466" y="224">+</text>
    <text class="t-b" x="484" y="223">Clears in minutes</text>
    <text class="t-s" x="484" y="241">the filer hears the failure</text>
    <text class="mark minus" x="706" y="224">−</text>
    <text class="t-b" x="724" y="223">Never clears</text>
    <text class="t-s" x="724" y="241">the item stays up for good</text>
    <line class="row" x1="16" y1="256" x2="924" y2="256"/>
  </g>

  <g id="row-rule">
    <text class="t-lbl" x="32" y="280">EVERY STOP HAS</text>
    <text class="t-lbl" x="32" y="293">A DEADLINE</text>
    <text class="mark tie" x="226" y="282">=</text>
    <text class="t-b" x="244" y="281">Holds</text>
    <text class="t-s" x="244" y="299">the model's rule</text>
    <text class="mark tie" x="466" y="282">=</text>
    <text class="t-b" x="484" y="281">Holds</text>
    <text class="t-s" x="484" y="299">the same</text>
    <text class="mark minus" x="706" y="282">−</text>
    <text class="t-b" x="724" y="281">Breaks</text>
    <text class="t-s" x="724" y="299">the owner's model, as decided</text>
    <line class="row" x1="16" y1="314" x2="924" y2="314"/>
  </g>

  <g id="locks-in">
    <rect class="foot" x="16" y="330" width="446" height="74" rx="5"/>
    <text class="t-lbl" x="32" y="351">LOCKS IN</text>
    <text class="t-b" x="32" y="371">One host setting for a person's stop</text>
    <text class="t-s" x="32" y="389">beside the wait's, and overridable on each call</text>
  </g>

  <g id="flips-if">
    <rect class="foot" x="478" y="330" width="446" height="74" rx="5"/>
    <text class="t-lbl" x="494" y="351">FLIPS IF</text>
    <text class="t-b" x="494" y="371">A stale question is worse than a failed try</text>
    <text class="t-s" x="494" y="389">as in a live chat: then 24 hours</text>
  </g>
</svg>
