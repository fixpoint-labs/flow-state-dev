<svg viewBox="0 0 940 420" role="img" aria-label="Open, what an unanswered question does at its deadline. Recommended: the hold releases and the work goes ahead from its brief, which records that no answer came. The other option: that try at the task fails. It comes down to the first row: a question is asked because the work can pick up from its brief, so going ahead uses what a question means, while failing treats it as input. The price is the second row: going ahead may build on a guess, where failing builds nothing on one and the filer hears a failure. The third row: a task held before it starts goes ahead on its first attempt, where failing fails it with no try made. Locks in: FIX-2133's sweeper releases the hold. Flips if: a guessed answer does harm; then the app asks an approval, which reads as a no at its deadline."
     xmlns="http://www.w3.org/2000/svg">
  <style>
    :root { --surface:#FCFCFA; --surface-2:#E8E8E1; --ink:#191C21; --ink-2:#4C535B; --ink-3:#7A828B;
            --rule:#D5D4CB; --accent:#3E4E8C; --accent-soft:#E0E3F0; --code:#2C7C69; --code-soft:#DCEDE7;
            --gone:#A9544F; }
    @media (prefers-color-scheme: dark) {
      :root { --surface:#181C1F; --surface-2:#202528; --ink:#E6E8E5; --ink-2:#A4ACB1; --ink-3:#737B81;
              --rule:#2B3135; --accent:#8B9BD8; --accent-soft:#1B2140; --code:#5DBBA1; --code-soft:#14302A;
              --gone:#DE8A84; } }
    .bg     { fill:var(--surface); }
    .ask    { fill:var(--surface-2); }
    .chosen { fill:var(--code-soft); stroke:var(--code); stroke-width:1.6; }
    .rec    { fill:var(--code-soft); stroke:var(--code); stroke-width:1.6; stroke-dasharray:5 4; }
    .lost   { fill:var(--surface); stroke:var(--rule); stroke-width:1.4; stroke-dasharray:5 4; }
    .decide { fill:var(--accent-soft); }
    .bar    { fill:var(--accent); }
    .row    { stroke:var(--rule); stroke-width:1; }
    .foot   { fill:var(--surface-2); }
    .t-lbl  { fill:var(--ink-3); font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:9.5px; letter-spacing:.1em; }
    .t-tag  { font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:9.5px; letter-spacing:.1em; font-weight:600; }
    .t-q    { fill:var(--ink); font-family:system-ui,-apple-system,sans-serif; font-weight:600; font-size:15px; }
    .t-h    { font-family:system-ui,-apple-system,sans-serif; font-weight:600; font-size:14px; }
    .t-b    { fill:var(--ink); font-family:system-ui,-apple-system,sans-serif; font-size:12.5px; }
    .t-s    { fill:var(--ink-2); font-family:system-ui,-apple-system,sans-serif; font-size:11px; }
    .mark   { font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:16px; font-weight:700; }
    .plus   { fill:var(--code); }
    .minus  { fill:var(--gone); }
    .tie    { fill:var(--ink-3); }
    .c-code { fill:var(--code); }
    .c-mute { fill:var(--ink-3); }
    .c-lost { fill:var(--ink-2); }
    .c-acc  { fill:var(--accent); }
  </style>
  <rect class="bg" x="0" y="0" width="940" height="420"/>

  <g id="the-call">
    <rect class="ask" x="16" y="14" width="908" height="48" rx="6"/>
    <text class="t-lbl" x="32" y="32">OPEN · THE OWNER'S CALL</text>
    <text class="t-q" x="32" y="52">What does an unanswered question do at its deadline?</text>
  </g>

  <g id="options">
    <rect class="rec" x="212" y="76" width="348" height="46" rx="5"/>
    <text class="t-tag c-code" x="228" y="93">RECOMMENDED</text>
    <text class="t-h c-code" x="228" y="112">Go ahead from the brief</text>
    <rect class="lost" x="576" y="76" width="348" height="46" rx="5"/>
    <text class="t-tag c-mute" x="592" y="93">OR</text>
    <text class="t-h c-lost" x="592" y="112">Fail that try at the task</text>
  </g>

  <g id="row-decides">
    <rect class="decide" x="16" y="134" width="908" height="62" rx="4"/>
    <rect class="bar" x="16" y="134" width="4" height="62"/>
    <text class="t-lbl" x="32" y="156">THE WORK CAN</text>
    <text class="t-lbl" x="32" y="169">GO ON</text>
    <text class="t-tag c-acc" x="32" y="186">▸ DECIDES IT</text>
    <text class="mark plus" x="228" y="162">+</text>
    <text class="t-b" x="248" y="161">Uses what a question means</text>
    <text class="t-s" x="248" y="179">the work picks up from its brief, by the rule</text>
    <text class="mark minus" x="592" y="162">−</text>
    <text class="t-b" x="612" y="161">Treats it as input</text>
    <text class="t-s" x="612" y="179">an answer it could do without stops it</text>
  </g>

  <g id="row-price">
    <text class="t-lbl" x="32" y="222">A WEEK, NO</text>
    <text class="t-lbl" x="32" y="235">ANSWER</text>
    <text class="mark minus" x="228" y="224">−</text>
    <text class="t-b" x="248" y="223">May build on a guess</text>
    <text class="t-s" x="248" y="241">the brief says no answer came</text>
    <text class="mark plus" x="592" y="224">+</text>
    <text class="t-b" x="612" y="223">Builds nothing on a guess</text>
    <text class="t-s" x="612" y="241">the filer hears a failure</text>
    <line class="row" x1="16" y1="256" x2="924" y2="256"/>
  </g>

  <g id="row-held">
    <text class="t-lbl" x="32" y="280">HELD BEFORE</text>
    <text class="t-lbl" x="32" y="293">IT STARTS</text>
    <text class="mark plus" x="228" y="282">+</text>
    <text class="t-b" x="248" y="281">Starts</text>
    <text class="t-s" x="248" y="299">on its first attempt</text>
    <text class="mark minus" x="592" y="282">−</text>
    <text class="t-b" x="612" y="281">Fails outright</text>
    <text class="t-s" x="612" y="299">with no try ever made</text>
    <line class="row" x1="16" y1="314" x2="924" y2="314"/>
  </g>

  <g id="locks-in">
    <rect class="foot" x="16" y="330" width="446" height="74" rx="5"/>
    <text class="t-lbl" x="32" y="351">LOCKS IN</text>
    <text class="t-b" x="32" y="371">FIX-2133's sweeper releases the hold</text>
    <text class="t-s" x="32" y="389">the brief records that no answer came</text>
  </g>

  <g id="flips-if">
    <rect class="foot" x="478" y="330" width="446" height="74" rx="5"/>
    <text class="t-lbl" x="494" y="351">FLIPS IF</text>
    <text class="t-b" x="494" y="371">A guessed answer does harm</text>
    <text class="t-s" x="494" y="389">then ask an approval, a no at its deadline</text>
  </g>
</svg>
