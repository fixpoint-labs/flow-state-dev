<svg viewBox="0 0 940 296" role="img" xmlns="http://www.w3.org/2000/svg"
     aria-label="Who owns what: seven rules by five issues and the closure FIX-2242, each rule with one owner. FIX-2238 owns one entry and one tool with no relay, where a message lands, one budget per typed message, and removing the old names. FIX-2160 owns the server resolving every target. FIX-2239 owns a call waiting on the wait gate. FIX-2240 owns a message landing once. FIX-2241 owns no rule and uses the entry, the landing rules and the budget. The closure uses every rule.">
  <style>
    :root { --surface:#FCFCFA; --surface-2:#E8E8E1; --ink:#191C21; --ink-2:#4C535B; --ink-3:#7A828B;
            --rule:#D5D4CB; --accent:#3E4E8C; --accent-soft:#E0E3F0; --code:#2C7C69; --code-soft:#DCEDE7;
            --gone:#A9544F; }
    @media (prefers-color-scheme: dark) {
      :root { --surface:#181C1F; --surface-2:#202528; --ink:#E6E8E5; --ink-2:#A4ACB1; --ink-3:#737B81;
              --rule:#2B3135; --accent:#8B9BD8; --accent-soft:#1B2140; --code:#5DBBA1; --code-soft:#14302A;
              --gone:#DE8A84; } }
    .bg     { fill:var(--surface); }
    .ask    { fill:var(--surface-2); }
    .chosen { fill:var(--code-soft); stroke:var(--code); stroke-width:1.6; }
    .lost   { fill:var(--surface); stroke:var(--rule); stroke-width:1.4; stroke-dasharray:5 4; }
    .decide { fill:var(--accent-soft); }
    .bar    { fill:var(--accent); }
    .row    { stroke:var(--rule); stroke-width:1; }
    .foot   { fill:var(--surface-2); }
    .own    { fill:var(--accent-soft); stroke:var(--accent); stroke-width:1.4; }
    .use    { fill:var(--surface-2); stroke:var(--rule); stroke-width:1; }
    .box    { fill:var(--code-soft); stroke:var(--code); stroke-width:1.6; }
    .app    { fill:var(--accent-soft); stroke:var(--accent); stroke-width:1.2; }
    .gone-r { fill:var(--surface); stroke:var(--gone); stroke-width:1.2; stroke-dasharray:4 3; }
    .fence  { stroke:var(--ink-3); stroke-width:2; stroke-dasharray:8 5; }
    .t-lbl  { fill:var(--ink-3); font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:9.5px; letter-spacing:.1em; }
    .t-tag  { font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:9.5px; letter-spacing:.1em; font-weight:600; }
    .t-q    { fill:var(--ink); font-family:system-ui,-apple-system,sans-serif; font-weight:600; font-size:15px; }
    .t-h    { font-family:system-ui,-apple-system,sans-serif; font-weight:600; font-size:14px; }
    .t-b    { fill:var(--ink); font-family:system-ui,-apple-system,sans-serif; font-size:12.5px; }
    .t-s    { fill:var(--ink-2); font-family:system-ui,-apple-system,sans-serif; font-size:11px; }
    .t-col  { fill:var(--ink); font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:9.5px; }
    .t-row  { fill:var(--ink); font-family:system-ui,-apple-system,sans-serif; font-size:11.5px; }
    .t-own  { fill:var(--accent); font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:9px; letter-spacing:.06em; }
    .t-use  { fill:var(--ink-2); font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:9px; }
    .mark   { font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:16px; font-weight:700; }
    .plus   { fill:var(--code); } .minus { fill:var(--gone); } .tie { fill:var(--ink-3); }
    .c-code { fill:var(--code); } .c-mute { fill:var(--ink-3); } .c-lost { fill:var(--ink-2); } .c-acc { fill:var(--accent); } .c-gone { fill:var(--gone); }
  </style>
  <rect class="bg" x="0" y="0" width="940" height="296"/>
  <text class="t-lbl" x="16" y="20">WHO OWNS WHAT — ONE OWNER PER RULE · COLUMNS ARE FIX- ISSUES</text>
  <text class="t-col" x="352" y="46">2238</text>
  <text class="t-col" x="442" y="46">2160</text>
  <text class="t-col" x="532" y="46">2239</text>
  <text class="t-col" x="622" y="46">2240</text>
  <text class="t-col" x="712" y="46">2241</text>
  <text class="t-col" x="802" y="46">2242·closure</text>
  <text class="t-row" x="16" y="76">ER-1 one entry, one tool, no relay</text>
  <rect class="own" x="346" y="58" width="76" height="26" rx="3"/>
  <text class="t-own" x="352" y="75">OWNS</text>
  <rect class="use" x="436" y="58" width="76" height="26" rx="3"/>
  <text class="t-use" x="442" y="75">uses</text>
  <rect class="use" x="526" y="58" width="76" height="26" rx="3"/>
  <text class="t-use" x="532" y="75">uses</text>
  <rect class="use" x="616" y="58" width="76" height="26" rx="3"/>
  <text class="t-use" x="622" y="75">uses</text>
  <rect class="use" x="706" y="58" width="76" height="26" rx="3"/>
  <text class="t-use" x="712" y="75">uses</text>
  <rect class="use" x="796" y="58" width="76" height="26" rx="3"/>
  <text class="t-use" x="802" y="75">uses</text>
  <text class="t-row" x="16" y="108">ER-2 where a message lands</text>
  <rect class="own" x="346" y="90" width="76" height="26" rx="3"/>
  <text class="t-own" x="352" y="107">OWNS</text>
  <rect class="use" x="436" y="90" width="76" height="26" rx="3"/>
  <text class="t-use" x="442" y="107">uses</text>
  <rect class="use" x="706" y="90" width="76" height="26" rx="3"/>
  <text class="t-use" x="712" y="107">uses</text>
  <rect class="use" x="796" y="90" width="76" height="26" rx="3"/>
  <text class="t-use" x="802" y="107">uses</text>
  <text class="t-row" x="16" y="140">ER-3 the server resolves every target</text>
  <rect class="own" x="436" y="122" width="76" height="26" rx="3"/>
  <text class="t-own" x="442" y="139">OWNS</text>
  <rect class="use" x="796" y="122" width="76" height="26" rx="3"/>
  <text class="t-use" x="802" y="139">uses</text>
  <text class="t-row" x="16" y="172">ER-4 a call waits on the wait gate</text>
  <rect class="own" x="526" y="154" width="76" height="26" rx="3"/>
  <text class="t-own" x="532" y="171">OWNS</text>
  <rect class="use" x="796" y="154" width="76" height="26" rx="3"/>
  <text class="t-use" x="802" y="171">uses</text>
  <text class="t-row" x="16" y="204">ER-5 a message lands once</text>
  <rect class="own" x="616" y="186" width="76" height="26" rx="3"/>
  <text class="t-own" x="622" y="203">OWNS</text>
  <rect class="use" x="526" y="186" width="76" height="26" rx="3"/>
  <text class="t-use" x="532" y="203">uses</text>
  <rect class="use" x="796" y="186" width="76" height="26" rx="3"/>
  <text class="t-use" x="802" y="203">uses</text>
  <text class="t-row" x="16" y="236">ER-6 one budget per typed message</text>
  <rect class="own" x="346" y="218" width="76" height="26" rx="3"/>
  <text class="t-own" x="352" y="235">OWNS</text>
  <rect class="use" x="526" y="218" width="76" height="26" rx="3"/>
  <text class="t-use" x="532" y="235">uses</text>
  <rect class="use" x="706" y="218" width="76" height="26" rx="3"/>
  <text class="t-use" x="712" y="235">uses</text>
  <rect class="use" x="796" y="218" width="76" height="26" rx="3"/>
  <text class="t-use" x="802" y="235">uses</text>
  <text class="t-row" x="16" y="268">ER-7 the old names removed outright</text>
  <rect class="own" x="346" y="250" width="76" height="26" rx="3"/>
  <text class="t-own" x="352" y="267">OWNS</text>
  <rect class="use" x="796" y="250" width="76" height="26" rx="3"/>
  <text class="t-use" x="802" y="267">uses</text>
</svg>
