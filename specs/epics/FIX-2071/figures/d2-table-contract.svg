<svg viewBox="0 0 940 420" role="img" aria-label="D2: where is a rename reviewed before it is built? Chosen: once, in the rename table, with six children on the direct route. Instead of: a spec and a spec gate per child. It comes down to the first row: a name decided once beside every other name, so collisions across children are visible, against seven specs that each copy their rows. The price is the second row: a reviewer sees a name in a table first, and the code in the PR. The third row is a tie: the approach is a committed codemod either way. FIX-2183 keeps its spec. Locks in ER-2. Flips if a rename needs a behaviour change."
     xmlns="http://www.w3.org/2000/svg">
  <style>
    :root { --surface:#FCFCFA; --surface-2:#E8E8E1; --ink:#191C21; --ink-2:#4C535B; --ink-3:#7A828B;
            --rule:#D5D4CB; --accent:#3E4E8C; --accent-soft:#E0E3F0; --code:#2C7C69; --code-soft:#DCEDE7;
            --gone:#A9544F; }
    @media (prefers-color-scheme: dark) {
      :root { --surface:#181C1F; --surface-2:#202528; --ink:#E6E8E5; --ink-2:#A4ACB1; --ink-3:#737B81;
              --rule:#2B3135; --accent:#8B9BD8; --accent-soft:#1B2140; --code:#5DBBA1; --code-soft:#14302A;
              --gone:#DE8A84; } }
    .bg     { fill:var(--surface); }
    .ask    { fill:var(--surface-2); }
    .chosen { fill:var(--code-soft); stroke:var(--code); stroke-width:1.6; }
    .lost   { fill:var(--surface); stroke:var(--rule); stroke-width:1.4; stroke-dasharray:5 4; }
    .decide { fill:var(--accent-soft); }
    .bar    { fill:var(--accent); }
    .row    { stroke:var(--rule); stroke-width:1; }
    .foot   { fill:var(--surface-2); }
    .t-lbl  { fill:var(--ink-3); font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:9.5px; letter-spacing:.1em; }
    .t-tag  { font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:9.5px; letter-spacing:.1em; font-weight:600; }
    .t-q    { fill:var(--ink); font-family:system-ui,-apple-system,sans-serif; font-weight:600; font-size:15px; }
    .t-h    { font-family:system-ui,-apple-system,sans-serif; font-weight:600; font-size:14px; }
    .t-b    { fill:var(--ink); font-family:system-ui,-apple-system,sans-serif; font-size:12.5px; }
    .t-s    { fill:var(--ink-2); font-family:system-ui,-apple-system,sans-serif; font-size:11px; }
    .mark   { font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:16px; font-weight:700; }
    .plus   { fill:var(--code); }
    .minus  { fill:var(--gone); }
    .tie    { fill:var(--ink-3); }
    .c-code { fill:var(--code); }
    .c-mute { fill:var(--ink-3); }
    .c-lost { fill:var(--ink-2); }
    .c-acc  { fill:var(--accent); }
  </style>
  <rect class="bg" x="0" y="0" width="940" height="420"/>
  <rect class="ask" x="16" y="14" width="908" height="48" rx="6"/>
  <text class="t-lbl" x="32" y="32">D2 · THE CALL</text>
  <text class="t-q" x="32" y="52">Where is a rename reviewed before it is built?</text>
  <rect class="chosen" x="212" y="76" width="348" height="46" rx="5"/>
  <text class="t-tag c-code" x="228" y="93">CHOSEN</text>
  <text class="t-h c-code" x="228" y="112">Once, in the rename table; six go direct</text>
  <rect class="lost" x="576" y="76" width="348" height="46" rx="5"/>
  <text class="t-tag c-mute" x="592" y="93">INSTEAD OF</text>
  <text class="t-h c-lost" x="592" y="112">A spec and a spec gate per child</text>
  <rect class="decide" x="16" y="134" width="908" height="62" rx="4"/>
  <rect class="bar" x="16" y="134" width="4" height="62"/>
  <text class="t-tag c-acc" x="32" y="186">▸ DECIDES IT</text>
  <text class="t-lbl" x="32" y="156">WHERE A NAME</text>
  <text class="t-lbl" x="32" y="169">IS DECIDED</text>
  <text class="mark plus" x="228" y="162">+</text>
  <text class="t-b" x="248" y="161">Once, here, beside every other name</text>
  <text class="t-s" x="248" y="179">collisions across children are visible</text>
  <text class="mark minus" x="592" y="162">−</text>
  <text class="t-b" x="612" y="161">In six specs that copy the table</text>
  <text class="t-s" x="612" y="179">each sees only its own rows</text>
  <text class="t-lbl" x="32" y="218">WHAT A REVIEWER</text>
  <text class="t-lbl" x="32" y="231">SEES FIRST</text>
  <text class="mark minus" x="228" y="224">−</text>
  <text class="t-b" x="248" y="223">A name in a table</text>
  <text class="t-s" x="248" y="241">the code that uses it comes in the PR</text>
  <text class="mark plus" x="592" y="224">+</text>
  <text class="t-b" x="612" y="223">A name beside its call sites</text>
  <text class="t-s" x="612" y="241">in the child spec</text>
  <line class="row" x1="16" y1="254" x2="924" y2="254"/>
  <text class="t-lbl" x="32" y="276">THE APPROACH</text>
  <text class="mark tie" x="228" y="282">=</text>
  <text class="t-b" x="248" y="281">A committed codemod</text>
  <text class="t-s" x="248" y="299">the same for every child</text>
  <text class="mark tie" x="592" y="282">=</text>
  <text class="t-b" x="612" y="281">A committed codemod</text>
  <text class="t-s" x="612" y="299">each spec says so again</text>
  <line class="row" x1="16" y1="312" x2="924" y2="312"/>
  <rect class="foot" x="16" y="330" width="446" height="74" rx="5"/>
  <text class="t-lbl" x="32" y="351">LOCKS IN</text>
  <text class="t-b" x="32" y="371">ER-2: one codemod per child</text>
  <text class="t-s" x="32" y="389">a wrong name comes back here as an amendment</text>
  <rect class="foot" x="478" y="330" width="446" height="74" rx="5"/>
  <text class="t-lbl" x="494" y="351">FLIPS IF</text>
  <text class="t-b" x="494" y="371">A rename needs a behaviour change</text>
  <text class="t-s" x="494" y="389">then that child takes the spec route</text>
</svg>
