<svg viewBox="0 0 940 418" role="img" aria-label="D1, engineering, from the POC: where the workflow&#x27;s membership lives. Chosen: no record; phase order is the feature task&#x27;s declaration and a phase&#x27;s steps are the rows it filed with that phase. Instead of the POC&#x27;s session-state record of steps, kept as a cache of the rows. It comes down to the first row, a crash between a late filing and the record&#x27;s write: the record loses the step, the rows can&#x27;t. The second row is the price: steps must be filed by the feature task on its own board, where a record could name rows anywhere. The third row is a tie: replay is safe either way, by stable ids. Locks in: the view reads the feature row and its filed rows, nothing else. Flips if a workflow files its steps on several boards."
     xmlns="http://www.w3.org/2000/svg">
  <style>
    :root { --surface:#FCFCFA; --surface-2:#E8E8E1; --ink:#191C21; --ink-2:#4C535B; --ink-3:#7A828B;
            --rule:#D5D4CB; --accent:#3E4E8C; --accent-soft:#E0E3F0; --code:#2C7C69; --code-soft:#DCEDE7;
            --gone:#A9544F; }
    @media (prefers-color-scheme: dark) {
      :root { --surface:#181C1F; --surface-2:#202528; --ink:#E6E8E5; --ink-2:#A4ACB1; --ink-3:#737B81;
              --rule:#2B3135; --accent:#8B9BD8; --accent-soft:#1B2140; --code:#5DBBA1; --code-soft:#14302A;
              --gone:#DE8A84; } }
    .bg     { fill:var(--surface); }
    .ask    { fill:var(--surface-2); }
    .chosen { fill:var(--code-soft); stroke:var(--code); stroke-width:1.6; }
    .recom  { fill:var(--code-soft); stroke:var(--code); stroke-width:1.6; stroke-dasharray:5 4; }
    .lost   { fill:var(--surface); stroke:var(--rule); stroke-width:1.4; stroke-dasharray:5 4; }
    .decide { fill:var(--accent-soft); }
    .bar    { fill:var(--accent); }
    .row    { stroke:var(--rule); stroke-width:1; }
    .foot   { fill:var(--surface-2); }
    .t-lbl  { fill:var(--ink-3); font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:9.5px; letter-spacing:.1em; }
    .t-tag  { font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:9.5px; letter-spacing:.1em; font-weight:600; }
    .t-q    { fill:var(--ink); font-family:system-ui,-apple-system,sans-serif; font-weight:600; font-size:15px; }
    .t-h    { font-family:system-ui,-apple-system,sans-serif; font-weight:600; font-size:13px; }
    .t-b    { fill:var(--ink); font-family:system-ui,-apple-system,sans-serif; font-size:12px; }
    .t-s    { fill:var(--ink-2); font-family:system-ui,-apple-system,sans-serif; font-size:10.5px; }
    .mark   { font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:16px; font-weight:700; }
    .plus   { fill:var(--code); }
    .minus  { fill:var(--gone); }
    .tie    { fill:var(--ink-3); }
    .c-code { fill:var(--code); }
    .c-mute { fill:var(--ink-3); }
    .c-lost { fill:var(--ink-2); }
    .c-acc  { fill:var(--accent); }
  </style>
  <rect class="bg" x="0" y="0" width="940" height="418"/>

  <g id="the-call">
    <rect class="ask" x="16" y="14" width="908" height="48" rx="6"/>
    <text class="t-lbl" x="32" y="32">D1 · ENGINEERING, FROM THE POC</text>
    <text class="t-q" x="32" y="52">Where does the workflow&#x27;s membership live?</text>
  </g>

  <g id="options">
    <rect class="chosen" x="212" y="76" width="340" height="46" rx="5"/>
    <text class="t-tag c-code" x="226" y="93">CHOSEN</text>
    <text class="t-h c-code" x="226" y="112">No record, the rows</text>
    <rect class="lost" x="568" y="76" width="340" height="46" rx="5"/>
    <text class="t-tag c-mute" x="582" y="93">INSTEAD OF</text>
    <text class="t-h c-lost" x="582" y="112">A session-state record</text>
  </g>

  <g id="row-1">
    <rect class="decide" x="16" y="134" width="908" height="62" rx="4"/>
    <rect class="bar" x="16" y="134" width="4" height="62"/>
    <text class="t-lbl" x="32" y="156">A CRASH</text>
    <text class="t-lbl" x="32" y="169">MID-FILING</text>
    <text class="t-tag c-acc" x="32" y="186">▸ DECIDES IT</text>
    <text class="mark plus" x="226" y="162">+</text>
    <text class="t-b" x="244" y="161">Nothing to lose</text>
    <text class="t-s" x="244" y="179">the row is the membership</text>
    <text class="mark minus" x="582" y="162">−</text>
    <text class="t-b" x="600" y="161">The record misses the step</text>
    <text class="t-s" x="600" y="179">rebuilt from the rows, if anyone does</text>
  </g>

  <g id="row-2">
    <text class="t-lbl" x="32" y="218">WHERE STEPS</text>
    <text class="t-lbl" x="32" y="231">CAN LIVE</text>
    <text class="mark minus" x="226" y="224">−</text>
    <text class="t-b" x="244" y="223">Filed by the feature task</text>
    <text class="t-s" x="244" y="241">on its own board only</text>
    <text class="mark plus" x="582" y="224">+</text>
    <text class="t-b" x="600" y="223">Any row the record names</text>
    <text class="t-s" x="600" y="241">another board included</text>
    <line class="row" x1="16" y1="254" x2="924" y2="254"/>
  </g>

  <g id="row-3">
    <text class="t-lbl" x="32" y="276">A REPLAY</text>
    <text class="mark tie" x="226" y="282">=</text>
    <text class="t-b" x="244" y="281">Safe</text>
    <text class="t-s" x="244" y="299">stable ids, ER-5</text>
    <text class="mark tie" x="582" y="282">=</text>
    <text class="t-b" x="600" y="281">Safe</text>
    <text class="t-s" x="600" y="299">the same ids</text>
    <line class="row" x1="16" y1="312" x2="924" y2="312"/>
  </g>

  <g id="locks-in">
    <rect class="foot" x="16" y="328" width="446" height="74" rx="5"/>
    <text class="t-lbl" x="32" y="349">LOCKS IN</text>
    <text class="t-b" x="32" y="369">The view reads the feature row and its filed rows</text>
    <text class="t-s" x="32" y="387">a round lives in the step key</text>
  </g>
  <g id="flips-if">
    <rect class="foot" x="478" y="328" width="446" height="74" rx="5"/>
    <text class="t-lbl" x="494" y="349">FLIPS IF</text>
    <text class="t-b" x="494" y="369">A workflow files steps on several boards</text>
    <text class="t-s" x="494" y="387">then filedByTask can&#x27;t find them all</text>
  </g>
</svg>
