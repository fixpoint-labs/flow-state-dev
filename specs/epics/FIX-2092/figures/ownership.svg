<svg viewBox="0 0 940 294" role="img" xmlns="http://www.w3.org/2000/svg"
     aria-label="Who owns what: seven rules by five issues and the closure FIX-2237, each rule with one owner. FIX-2232 owns a step&#x27;s status read from its own row, the one workflow read that screens render, and one write path for a task&#x27;s declared phases. FIX-2233 owns no new runtime, ordering by deps only; a person&#x27;s stop as an approval on the feature task; and stable step ids with rounds in the key. FIX-2234 owns no new model-facing tool. FIX-2235, the screen, and FIX-2236, the coding run, own none and use the read. Other cells use the rule or are blank.">
  <style>
    :root { --surface:#FCFCFA; --surface-2:#E8E8E1; --ink:#191C21; --ink-2:#4C535B; --ink-3:#7A828B;
            --rule:#D5D4CB; --accent:#3E4E8C; --accent-soft:#E0E3F0; }
    @media (prefers-color-scheme: dark) {
      :root { --surface:#181C1F; --surface-2:#202528; --ink:#E6E8E5; --ink-2:#A4ACB1; --ink-3:#737B81;
              --rule:#2B3135; --accent:#8B9BD8; --accent-soft:#1B2140; } }
    .bg    { fill:var(--surface); }
    .own   { fill:var(--accent-soft); stroke:var(--accent); stroke-width:1.4; }
    .use   { fill:var(--surface-2); stroke:var(--rule); stroke-width:1; }
    .t-lbl { fill:var(--ink-3); font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:9.5px; letter-spacing:.1em; }
    .t-col { fill:var(--ink); font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:9.5px; }
    .t-row { fill:var(--ink); font-family:system-ui,-apple-system,sans-serif; font-size:11.5px; }
    .t-own { fill:var(--accent); font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:9px; letter-spacing:.06em; }
    .t-use { fill:var(--ink-2); font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:9px; }
  </style>
  <rect class="bg" x="0" y="0" width="940" height="294"/>
  <text class="t-lbl" x="16" y="20">WHO OWNS WHAT &#8212; ONE OWNER PER RULE &#183; COLUMNS ARE FIX- ISSUES</text>
  <g id="columns">
    <text class="t-col" x="352" y="46">2232</text>
    <text class="t-col" x="452" y="46">2233</text>
    <text class="t-col" x="552" y="46">2234</text>
    <text class="t-col" x="652" y="46">2235</text>
    <text class="t-col" x="752" y="46">2236</text>
    <text class="t-col" x="842" y="46">2237·closure</text>
  </g>
  <g id="er1">
    <text class="t-row" x="16" y="76">ER-1 no new runtime, deps only</text>
    <rect class="use" x="346" y="58" width="66" height="26" rx="3"/><text class="t-use" x="352" y="75">uses</text>
    <rect class="own" x="446" y="58" width="66" height="26" rx="3"/><text class="t-own" x="452" y="75">OWNS</text>
    <rect class="use" x="546" y="58" width="66" height="26" rx="3"/><text class="t-use" x="552" y="75">uses</text>
    <rect class="use" x="836" y="58" width="66" height="26" rx="3"/><text class="t-use" x="842" y="75">uses</text>
  </g>
  <g id="er2">
    <text class="t-row" x="16" y="108">ER-2 a step&#x27;s status from its row</text>
    <rect class="own" x="346" y="90" width="66" height="26" rx="3"/><text class="t-own" x="352" y="107">OWNS</text>
    <rect class="use" x="646" y="90" width="66" height="26" rx="3"/><text class="t-use" x="652" y="107">uses</text>
    <rect class="use" x="746" y="90" width="66" height="26" rx="3"/><text class="t-use" x="752" y="107">uses</text>
    <rect class="use" x="836" y="90" width="66" height="26" rx="3"/><text class="t-use" x="842" y="107">uses</text>
  </g>
  <g id="er3">
    <text class="t-row" x="16" y="140">ER-3 one read, screens render it</text>
    <rect class="own" x="346" y="122" width="66" height="26" rx="3"/><text class="t-own" x="352" y="139">OWNS</text>
    <rect class="use" x="646" y="122" width="66" height="26" rx="3"/><text class="t-use" x="652" y="139">uses</text>
    <rect class="use" x="746" y="122" width="66" height="26" rx="3"/><text class="t-use" x="752" y="139">uses</text>
    <rect class="use" x="836" y="122" width="66" height="26" rx="3"/><text class="t-use" x="842" y="139">uses</text>
  </g>
  <g id="er4">
    <text class="t-row" x="16" y="172">ER-4 a person&#x27;s stop is an approval</text>
    <rect class="own" x="446" y="154" width="66" height="26" rx="3"/><text class="t-own" x="452" y="171">OWNS</text>
    <rect class="use" x="546" y="154" width="66" height="26" rx="3"/><text class="t-use" x="552" y="171">uses</text>
    <rect class="use" x="836" y="154" width="66" height="26" rx="3"/><text class="t-use" x="842" y="171">uses</text>
  </g>
  <g id="er5">
    <text class="t-row" x="16" y="204">ER-5 stable step ids, rounds in key</text>
    <rect class="own" x="446" y="186" width="66" height="26" rx="3"/><text class="t-own" x="452" y="203">OWNS</text>
    <rect class="use" x="546" y="186" width="66" height="26" rx="3"/><text class="t-use" x="552" y="203">uses</text>
    <rect class="use" x="836" y="186" width="66" height="26" rx="3"/><text class="t-use" x="842" y="203">uses</text>
  </g>
  <g id="er6">
    <text class="t-row" x="16" y="236">ER-6 one write path for phases</text>
    <rect class="own" x="346" y="218" width="66" height="26" rx="3"/><text class="t-own" x="352" y="235">OWNS</text>
    <rect class="use" x="446" y="218" width="66" height="26" rx="3"/><text class="t-use" x="452" y="235">uses</text>
    <rect class="use" x="746" y="218" width="66" height="26" rx="3"/><text class="t-use" x="752" y="235">uses</text>
  </g>
  <g id="er7">
    <text class="t-row" x="16" y="268">ER-7 no new model-facing tool</text>
    <rect class="own" x="546" y="250" width="66" height="26" rx="3"/><text class="t-own" x="552" y="267">OWNS</text>
    <rect class="use" x="836" y="250" width="66" height="26" rx="3"/><text class="t-use" x="842" y="267">uses</text>
  </g>
</svg>
