<svg viewBox="0 0 940 426" role="img" xmlns="http://www.w3.org/2000/svg"
     aria-label="D4: fixtures behind one adapter, chosen, beside waiting for the refactors and wiring to today&#x27;s names. Decided by finishing the UI before the wiring.">
  <style>
    :root { --surface:#FCFCFA; --surface-2:#E8E8E1; --ink:#191C21; --ink-2:#4C535B; --ink-3:#7A828B;
            --rule:#D5D4CB; --accent:#3E4E8C; --accent-soft:#E0E3F0; --code:#2C7C69; --code-soft:#DCEDE7;
            --gone:#A9544F; }
    @media (prefers-color-scheme: dark) {
      :root { --surface:#181C1F; --surface-2:#202528; --ink:#E6E8E5; --ink-2:#A4ACB1; --ink-3:#737B81;
              --rule:#2B3135; --accent:#8B9BD8; --accent-soft:#1B2140; --code:#5DBBA1; --code-soft:#14302A;
              --gone:#DE8A84; } }
    .bg     { fill:var(--surface); }
    .ask    { fill:var(--surface-2); }
    .chosen { fill:var(--code-soft); stroke:var(--code); stroke-width:1.6; }
    .lost   { fill:var(--surface); stroke:var(--rule); stroke-width:1.4; stroke-dasharray:5 4; }
    .decide { fill:var(--accent-soft); }
    .bar    { fill:var(--accent); }
    .row    { stroke:var(--rule); stroke-width:1; }
    .foot   { fill:var(--surface-2); }
    .t-lbl  { fill:var(--ink-3); font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:9.5px; letter-spacing:.1em; }
    .t-tag  { font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:9.5px; letter-spacing:.1em; font-weight:600; }
    .t-q    { fill:var(--ink); font-family:system-ui,-apple-system,sans-serif; font-weight:600; font-size:15px; }
    .t-h    { font-family:system-ui,-apple-system,sans-serif; font-weight:600; font-size:13px; }
    .t-b    { fill:var(--ink); font-family:system-ui,-apple-system,sans-serif; font-size:12px; }
    .t-s    { fill:var(--ink-2); font-family:system-ui,-apple-system,sans-serif; font-size:10.5px; }
    .mark   { font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:16px; font-weight:700; }
    .plus   { fill:var(--code); }
    .minus  { fill:var(--gone); }
    .tie    { fill:var(--ink-3); }
    .c-code { fill:var(--code); }
    .c-mute { fill:var(--ink-3); }
    .c-lost { fill:var(--ink-2); }
    .c-acc  { fill:var(--accent); }
  </style>
  <rect class="bg" x="0" y="0" width="940" height="426"/>

  <g id="the-call">
    <rect class="ask" x="16" y="14" width="908" height="48" rx="6"/>
    <text class="t-lbl" x="32" y="32">D4 · AN ENGINEERING CALL ON SEQUENCING, FROM JAKE&#x27;S GO-AHEAD</text>
    <text class="t-q" x="32" y="52">How does a lab build its front end before the refactors land?</text>
  </g>

  <g id="options">
    <rect class="chosen" x="212" y="76" width="224" height="46" rx="5"/>
    <text class="t-tag c-code" x="226" y="93">CHOSEN</text>
    <text class="t-h c-code" x="226" y="112">Fixtures behind one adapter</text>
    <rect class="lost" x="452" y="76" width="224" height="46" rx="5"/>
    <text class="t-tag c-mute" x="466" y="93">INSTEAD OF</text>
    <text class="t-h c-lost" x="466" y="112">Wait for the refactors</text>
    <rect class="lost" x="692" y="76" width="224" height="46" rx="5"/>
    <text class="t-tag c-mute" x="706" y="93">INSTEAD OF</text>
    <text class="t-h c-lost" x="706" y="112">Wire to today&#x27;s names</text>
  </g>

  <g id="row-1">
    <rect class="decide" x="16" y="134" width="908" height="62" rx="4"/>
    <rect class="bar" x="16" y="134" width="4" height="62"/>
    <text class="t-lbl" x="32" y="156">THE UI IS DONE</text>
    <text class="t-lbl" x="32" y="169">BEFORE THE WIRING</text>
    <text class="t-tag c-acc" x="32" y="186">▸ DECIDES IT</text>
    <text class="mark plus" x="226" y="162">+</text>
    <text class="t-b" x="244" y="161">Yes</text>
    <text class="t-s" x="244" y="179">fixtures shaped like package reads</text>
    <text class="mark minus" x="466" y="162">−</text>
    <text class="t-b" x="484" y="161">No</text>
    <text class="t-s" x="484" y="179">the labs wait weeks</text>
    <text class="mark plus" x="706" y="162">+</text>
    <text class="t-b" x="724" y="161">Yes</text>
    <text class="t-s" x="724" y="179">on calls that are about to change</text>
  </g>

  <g id="row-2">
    <text class="t-lbl" x="32" y="218">REWORK WHEN</text>
    <text class="t-lbl" x="32" y="231">SHAPES CHANGE</text>
    <text class="mark minus" x="226" y="224">−</text>
    <text class="t-b" x="244" y="223">The adapter only</text>
    <text class="t-s" x="244" y="241">one file per lab</text>
    <text class="mark plus" x="466" y="224">+</text>
    <text class="t-b" x="484" y="223">None</text>
    <text class="t-s" x="484" y="241">built once, on the new shapes</text>
    <text class="mark minus" x="706" y="224">−</text>
    <text class="t-b" x="724" y="223">Every call site</text>
    <text class="t-s" x="724" y="241">old names across the UI</text>
    <line class="row" x1="16" y1="256" x2="924" y2="256"/>
  </g>

  <g id="row-3">
    <text class="t-lbl" x="32" y="280">FIXTURE CODE</text>
    <text class="t-lbl" x="32" y="293">THAT SHIPS</text>
    <text class="mark tie" x="226" y="286">=</text>
    <text class="t-b" x="244" y="285">None</text>
    <text class="t-s" x="244" y="303">deleted at wiring, checked at closure</text>
    <text class="mark tie" x="466" y="286">=</text>
    <text class="t-b" x="484" y="285">None</text>
    <text class="t-s" x="484" y="303"></text>
    <text class="mark tie" x="706" y="286">=</text>
    <text class="t-b" x="724" y="285">None</text>
    <text class="t-s" x="724" y="303"></text>
    <line class="row" x1="16" y1="318" x2="924" y2="318"/>
  </g>

  <g id="locks-in">
    <rect class="foot" x="16" y="336" width="446" height="74" rx="5"/>
    <text class="t-lbl" x="32" y="357">LOCKS IN</text>
    <text class="t-b" x="32" y="377">Each lab reads and writes through one adapter</text>
    <text class="t-s" x="32" y="395">each function names the package call it stands for</text>
  </g>

  <g id="flips-if">
    <rect class="foot" x="478" y="336" width="446" height="74" rx="5"/>
    <text class="t-lbl" x="494" y="357">FLIPS IF</text>
    <text class="t-b" x="494" y="377">The refactors land before the front ends start</text>
    <text class="t-s" x="494" y="395">then the adapter is wired from day one</text>
  </g>
</svg>
