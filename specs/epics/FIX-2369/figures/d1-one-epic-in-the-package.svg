<svg viewBox="0 0 940 428" role="img" xmlns="http://www.w3.org/2000/svg"
     aria-label="D1: one epic that fixes each need once in the package that owns it, chosen, beside each app fixing its own and one epic per app. Decided by whether a fix carries over to every app. Price: 57 children under one closure.">
  <style>
    :root { --surface:#FCFCFA; --surface-2:#E8E8E1; --ink:#191C21; --ink-2:#4C535B; --ink-3:#7A828B;
            --rule:#D5D4CB; --accent:#3E4E8C; --accent-soft:#E0E3F0; --code:#2C7C69; --code-soft:#DCEDE7;
            --gone:#A9544F; }
    @media (prefers-color-scheme: dark) {
      :root { --surface:#181C1F; --surface-2:#202528; --ink:#E6E8E5; --ink-2:#A4ACB1; --ink-3:#737B81;
              --rule:#2B3135; --accent:#8B9BD8; --accent-soft:#1B2140; --code:#5DBBA1; --code-soft:#14302A;
              --gone:#DE8A84; } }
    .bg     { fill:var(--surface); }
    .ask    { fill:var(--surface-2); }
    .chosen { fill:var(--code-soft); stroke:var(--code); stroke-width:1.6; }
    .rec    { fill:var(--code-soft); stroke:var(--code); stroke-width:1.6; stroke-dasharray:5 4; }
    .lost   { fill:var(--surface); stroke:var(--rule); stroke-width:1.4; stroke-dasharray:5 4; }
    .decide { fill:var(--accent-soft); }
    .bar    { fill:var(--accent); }
    .row    { stroke:var(--rule); stroke-width:1; }
    .foot   { fill:var(--surface-2); }
    .t-lbl  { fill:var(--ink-3); font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:9.5px; letter-spacing:.1em; }
    .t-tag  { font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:9.5px; letter-spacing:.1em; font-weight:600; }
    .t-q    { fill:var(--ink); font-family:system-ui,-apple-system,sans-serif; font-weight:600; font-size:15px; }
    .t-h    { font-family:system-ui,-apple-system,sans-serif; font-weight:600; font-size:13px; }
    .t-b    { fill:var(--ink); font-family:system-ui,-apple-system,sans-serif; font-size:12px; }
    .t-s    { fill:var(--ink-2); font-family:system-ui,-apple-system,sans-serif; font-size:10.5px; }
    .mark   { font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:16px; font-weight:700; }
    .plus   { fill:var(--code); }
    .minus  { fill:var(--gone); }
    .tie    { fill:var(--ink-3); }
    .c-code { fill:var(--code); }
    .c-mute { fill:var(--ink-3); }
    .c-lost { fill:var(--ink-2); }
    .c-acc  { fill:var(--accent); }
  </style>
  <rect class="bg" x="0" y="0" width="940" height="428"/>

  <g id="the-call">
    <rect class="ask" x="16" y="14" width="908" height="48" rx="6"/>
    <text class="t-lbl" x="32" y="32">D1 · THE OBJECTIVE · FOR SIGN-OFF</text>
    <text class="t-q" x="32" y="52">Are four daily-driver apps worth one epic of shared package work, now?</text>
  </g>

  <g id="options">
    <rect class="chosen" x="212" y="76" width="224" height="46" rx="5"/>
    <text class="t-tag c-code" x="226" y="93">CHOSEN</text>
    <text class="t-h c-code" x="226" y="112">One epic, fix in the package</text>
    <rect class="lost" x="452" y="76" width="224" height="46" rx="5"/>
    <text class="t-tag c-mute" x="466" y="93">INSTEAD OF</text>
    <text class="t-h c-lost" x="466" y="112">Each app fixes its own</text>
    <rect class="lost" x="692" y="76" width="224" height="46" rx="5"/>
    <text class="t-tag c-mute" x="706" y="93">INSTEAD OF</text>
    <text class="t-h c-lost" x="706" y="112">One epic per app</text>
  </g>

  <g id="row-1">
    <rect class="decide" x="16" y="134" width="908" height="62" rx="4"/>
    <rect class="bar" x="16" y="134" width="4" height="62"/>
    <text class="t-lbl" x="32" y="156">A FIX</text>
    <text class="t-lbl" x="32" y="169">CARRIES OVER</text>
    <text class="t-tag c-acc" x="32" y="186">▸ DECIDES IT</text>
    <text class="mark plus" x="226" y="162">+</text>
    <text class="t-b" x="244" y="161">Lands once</text>
    <text class="t-s" x="244" y="179">every app gets it</text>
    <text class="mark minus" x="466" y="162">−</text>
    <text class="t-b" x="484" y="161">Four copies</text>
    <text class="t-s" x="484" y="179">and they drift, as today</text>
    <text class="mark minus" x="706" y="162">−</text>
    <text class="t-b" x="724" y="161">Same fix, four epics</text>
    <text class="t-s" x="724" y="179">or a package fix nobody owns</text>
  </g>

  <g id="row-2">
    <text class="t-lbl" x="32" y="218">SIZE OF</text>
    <text class="t-lbl" x="32" y="231">THE WORK</text>
    <text class="mark minus" x="226" y="224">−</text>
    <text class="t-b" x="244" y="223">57 children, one closure</text>
    <text class="t-s" x="244" y="241">the largest set we have run</text>
    <text class="mark plus" x="466" y="224">+</text>
    <text class="t-b" x="484" y="223">Small, local changes</text>
    <text class="t-s" x="484" y="241">no coordination at all</text>
    <text class="mark plus" x="706" y="224">+</text>
    <text class="t-b" x="724" y="223">Smaller sets</text>
    <text class="t-s" x="724" y="241">but only two epics run at once</text>
    <line class="row" x1="16" y1="256" x2="924" y2="256"/>
  </g>

  <g id="row-3">
    <text class="t-lbl" x="32" y="280">PROVES THE</text>
    <text class="t-lbl" x="32" y="293">GOAL</text>
    <text class="mark plus" x="226" y="286">+</text>
    <text class="t-b" x="244" y="285">One closure on one commit</text>
    <text class="t-s" x="244" y="303">each app, a real change</text>
    <text class="mark minus" x="466" y="286">−</text>
    <text class="t-b" x="484" y="285">No shared check</text>
    <text class="t-s" x="484" y="303">nothing proves they agree</text>
    <text class="mark tie" x="706" y="286">=</text>
    <text class="t-b" x="724" y="285">Four closures</text>
    <text class="t-s" x="724" y="303">none checks the shared pieces</text>
    <line class="row" x1="16" y1="318" x2="924" y2="318"/>
  </g>

  <g id="locks-in">
    <rect class="foot" x="16" y="338" width="446" height="74" rx="5"/>
    <text class="t-lbl" x="32" y="359">LOCKS IN</text>
    <text class="t-b" x="32" y="379">Package pieces go first; apps adopt after</text>
    <text class="t-s" x="32" y="397">the epic is as slow as its slowest foundation</text>
  </g>

  <g id="flips-if">
    <rect class="foot" x="478" y="338" width="446" height="74" rx="5"/>
    <text class="t-lbl" x="494" y="359">FLIPS IF</text>
    <text class="t-b" x="494" y="379">We stop developing FSD in these apps</text>
    <text class="t-s" x="494" y="397">then the polish is not worth an epic</text>
  </g>
</svg>
