<svg viewBox="0 0 940 358" role="img" xmlns="http://www.w3.org/2000/svg"
     aria-label="Who owns what: nine rules, each with one owner. The artifact owners FIX-2374, 2409, 2379, 2370 and 2385 own the rule that every other child consumes their artifact. FIX-2387 owns opt-in behaviour, FIX-2420 worktrees and one setup path. Each child owns keeping L1 generic, one implementation per need, a failing control and the worker word. The coordinator owns the build order and the consumed issues. The closure FIX-2425 checks most rules.">
  <style>
    :root { --surface:#FCFCFA; --surface-2:#E8E8E1; --ink:#191C21; --ink-2:#4C535B; --ink-3:#7A828B;
            --rule:#D5D4CB; --accent:#3E4E8C; --accent-soft:#E0E3F0; }
    @media (prefers-color-scheme: dark) {
      :root { --surface:#181C1F; --surface-2:#202528; --ink:#E6E8E5; --ink-2:#A4ACB1; --ink-3:#737B81;
              --rule:#2B3135; --accent:#8B9BD8; --accent-soft:#1B2140; } }
    .bg    { fill:var(--surface); }
    .own   { fill:var(--accent-soft); stroke:var(--accent); stroke-width:1.4; }
    .use   { fill:var(--surface-2); stroke:var(--rule); stroke-width:1; }
    .t-lbl { fill:var(--ink-3); font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:9.5px; letter-spacing:.1em; }
    .t-col { fill:var(--ink); font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:9.5px; }
    .t-row { fill:var(--ink); font-family:system-ui,-apple-system,sans-serif; font-size:11.5px; }
    .t-own { fill:var(--accent); font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:9px; letter-spacing:.06em; }
    .t-use { fill:var(--ink-2); font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:9px; }
  </style>
  <rect class="bg" x="0" y="0" width="940" height="358"/>
  <text class="t-lbl" x="16" y="20">WHO OWNS WHAT · ONE OWNER PER RULE · OWNERS = FIX-2374 2409 2379 2370 2385 · EACH = EVERY CHILD</text>
  <g id="columns">
    <text class="t-col" x="386" y="46">owners</text>
    <text class="t-col" x="476" y="46">2387</text>
    <text class="t-col" x="566" y="46">2420</text>
    <text class="t-col" x="656" y="46">each</text>
    <text class="t-col" x="746" y="46">coord.</text>
    <text class="t-col" x="836" y="46">2425</text>
  </g>
  <g id="er1">
    <text class="t-row" x="16" y="76">ER-1 L1 stays generic</text>
    <rect class="own" x="650" y="58" width="80" height="26" rx="3"/><text class="t-own" x="656" y="75">OWNS</text>
    <rect class="use" x="830" y="58" width="80" height="26" rx="3"/><text class="t-use" x="836" y="75">uses</text>
  </g>
  <g id="er2">
    <text class="t-row" x="16" y="108">ER-2 optional behaviour is opt-in</text>
    <rect class="own" x="470" y="90" width="80" height="26" rx="3"/><text class="t-own" x="476" y="107">OWNS</text>
    <rect class="use" x="560" y="90" width="80" height="26" rx="3"/><text class="t-use" x="566" y="107">uses</text>
    <rect class="use" x="650" y="90" width="80" height="26" rx="3"/><text class="t-use" x="656" y="107">uses</text>
    <rect class="use" x="830" y="90" width="80" height="26" rx="3"/><text class="t-use" x="836" y="107">uses</text>
  </g>
  <g id="er3">
    <text class="t-row" x="16" y="140">ER-3 one implementation per need</text>
    <rect class="own" x="650" y="122" width="80" height="26" rx="3"/><text class="t-own" x="656" y="139">OWNS</text>
    <rect class="use" x="830" y="122" width="80" height="26" rx="3"/><text class="t-use" x="836" y="139">uses</text>
  </g>
  <g id="er4">
    <text class="t-row" x="16" y="172">ER-4 consume the owner child's artifact</text>
    <rect class="own" x="380" y="154" width="80" height="26" rx="3"/><text class="t-own" x="386" y="171">OWNS</text>
    <rect class="use" x="650" y="154" width="80" height="26" rx="3"/><text class="t-use" x="656" y="171">uses</text>
    <rect class="use" x="830" y="154" width="80" height="26" rx="3"/><text class="t-use" x="836" y="171">uses</text>
  </g>
  <g id="er5">
    <text class="t-row" x="16" y="204">ER-5 runs in worktrees, one setup path</text>
    <rect class="use" x="470" y="186" width="80" height="26" rx="3"/><text class="t-use" x="476" y="203">uses</text>
    <rect class="own" x="560" y="186" width="80" height="26" rx="3"/><text class="t-own" x="566" y="203">OWNS</text>
    <rect class="use" x="650" y="186" width="80" height="26" rx="3"/><text class="t-use" x="656" y="203">uses</text>
    <rect class="use" x="830" y="186" width="80" height="26" rx="3"/><text class="t-use" x="836" y="203">uses</text>
  </g>
  <g id="er6">
    <text class="t-row" x="16" y="236">ER-6 every check shows its control fail</text>
    <rect class="own" x="650" y="218" width="80" height="26" rx="3"/><text class="t-own" x="656" y="235">OWNS</text>
    <rect class="use" x="830" y="218" width="80" height="26" rx="3"/><text class="t-use" x="836" y="235">uses</text>
  </g>
  <g id="er7">
    <text class="t-row" x="16" y="268">ER-7 worker, never the retired word</text>
    <rect class="own" x="650" y="250" width="80" height="26" rx="3"/><text class="t-own" x="656" y="267">OWNS</text>
    <rect class="use" x="830" y="250" width="80" height="26" rx="3"/><text class="t-use" x="836" y="267">uses</text>
  </g>
  <g id="er8">
    <text class="t-row" x="16" y="300">ER-8 the build order in the seams table</text>
    <rect class="use" x="650" y="282" width="80" height="26" rx="3"/><text class="t-use" x="656" y="299">uses</text>
    <rect class="own" x="740" y="282" width="80" height="26" rx="3"/><text class="t-own" x="746" y="299">OWNS</text>
  </g>
  <g id="er9">
    <text class="t-row" x="16" y="332">ER-9 consumed issues stay where they are</text>
    <rect class="own" x="740" y="314" width="80" height="26" rx="3"/><text class="t-own" x="746" y="331">OWNS</text>
    <rect class="use" x="830" y="314" width="80" height="26" rx="3"/><text class="t-use" x="836" y="331">uses</text>
  </g>
</svg>
