<svg viewBox="0 0 940 418" role="img" aria-label="D4, the call: what the packages carry for code written against an older version. Chosen: no backward-compat code, the owner's call on Nov 6: no alias, no refusal, no reader of an old shape, no shim. Instead of: D3's loud refusals with a removal version and Q1's deprecated aliases. It comes down to the first row: how much code the packages carry for older versions, none against one entry per old name until a removal minor. The price is the next two rows: old code that passes a retired value such as human_approval is not stopped and loses its Inbox item, and an old import fails with no exported member, the changeset naming the new home. Locks in: BP-030 waived for this epic; code whose absence would silently corrupt data is raised first. Flips if adopters must keep running across upgrades."
     xmlns="http://www.w3.org/2000/svg">
  <style>
    :root { --surface:#FCFCFA; --surface-2:#E8E8E1; --ink:#191C21; --ink-2:#4C535B; --ink-3:#7A828B;
            --rule:#D5D4CB; --accent:#3E4E8C; --accent-soft:#E0E3F0; --code:#2C7C69; --code-soft:#DCEDE7;
            --gone:#A9544F; }
    @media (prefers-color-scheme: dark) {
      :root { --surface:#181C1F; --surface-2:#202528; --ink:#E6E8E5; --ink-2:#A4ACB1; --ink-3:#737B81;
              --rule:#2B3135; --accent:#8B9BD8; --accent-soft:#1B2140; --code:#5DBBA1; --code-soft:#14302A;
              --gone:#DE8A84; } }
    .bg     { fill:var(--surface); }
    .ask    { fill:var(--surface-2); }
    .chosen { fill:var(--code-soft); stroke:var(--code); stroke-width:1.6; }
    .rec    { fill:var(--code-soft); stroke:var(--code); stroke-width:1.6; stroke-dasharray:5 4; }
    .lost   { fill:var(--surface); stroke:var(--rule); stroke-width:1.4; stroke-dasharray:5 4; }
    .decide { fill:var(--accent-soft); }
    .bar    { fill:var(--accent); }
    .row    { stroke:var(--rule); stroke-width:1; }
    .foot   { fill:var(--surface-2); }
    .t-lbl  { fill:var(--ink-3); font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:9.5px; letter-spacing:.1em; }
    .t-tag  { font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:9.5px; letter-spacing:.1em; font-weight:600; }
    .t-q    { fill:var(--ink); font-family:system-ui,-apple-system,sans-serif; font-weight:600; font-size:15px; }
    .t-h    { font-family:system-ui,-apple-system,sans-serif; font-weight:600; font-size:14px; }
    .t-b    { fill:var(--ink); font-family:system-ui,-apple-system,sans-serif; font-size:12.5px; }
    .t-s    { fill:var(--ink-2); font-family:system-ui,-apple-system,sans-serif; font-size:11px; }
    .mark   { font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:16px; font-weight:700; }
    .plus   { fill:var(--code); }
    .minus  { fill:var(--gone); }
    .tie    { fill:var(--ink-3); }
    .c-code { fill:var(--code); }
    .c-mute { fill:var(--ink-3); }
    .c-lost { fill:var(--ink-2); }
    .c-acc  { fill:var(--accent); }
  </style>
  <rect class="bg" x="0" y="0" width="940" height="418"/>
  <g id="the-call">
    <rect class="ask" x="16" y="14" width="908" height="48" rx="6"/>
    <text class="t-lbl" x="32" y="32">D4 · THE CALL · THE OWNER, NOV 6</text>
    <text class="t-q" x="32" y="52">What do the packages carry for code written against an older version?</text>
  </g>
  <g id="options">
    <rect class="chosen" x="212" y="76" width="348" height="46" rx="5"/>
    <text class="t-tag c-code" x="228" y="93">CHOSEN</text>
    <text class="t-h c-code" x="228" y="112">No backward-compat code</text>
    <rect class="lost" x="576" y="76" width="348" height="46" rx="5"/>
    <text class="t-tag c-mute" x="592" y="93">INSTEAD OF</text>
    <text class="t-h c-lost" x="592" y="112">D3's refusals and Q1's aliases</text>
  </g>
  <g id="row-decides">
    <rect class="decide" x="16" y="134" width="908" height="62" rx="4"/>
    <rect class="bar" x="16" y="134" width="4" height="62"/>
    <text class="t-lbl" x="32" y="156">CODE THE PACKAGES</text>
    <text class="t-lbl" x="32" y="169">CARRY FOR OLD VERSIONS</text>
    <text class="t-tag c-acc" x="32" y="186">▸ DECIDES IT</text>
    <text class="mark plus" x="228" y="162">+</text>
    <text class="t-b" x="248" y="161">None</text>
    <text class="t-s" x="248" y="179">no alias, refusal, old-shape reader or shim</text>
    <text class="mark minus" x="592" y="162">−</text>
    <text class="t-b" x="612" y="161">One entry per old name</text>
    <text class="t-s" x="612" y="179">kept until a removal minor</text>
  </g>
  <g id="row-2">
    <text class="t-lbl" x="32" y="222">OLD CODE THAT PASSES</text>
    <text class="t-lbl" x="32" y="235">A RETIRED VALUE</text>
    <text class="mark minus" x="228" y="224">−</text>
    <text class="t-b" x="248" y="223">Not stopped</text>
    <text class="t-s" x="248" y="241">human_approval loses its Inbox item</text>
    <text class="mark plus" x="592" y="224">+</text>
    <text class="t-b" x="612" y="223">Fails with the replacement named</text>
    <text class="t-s" x="612" y="241">until its removal version</text>
    <line class="row" x1="16" y1="254" x2="924" y2="254"/>
  </g>
  <g id="row-3">
    <text class="t-lbl" x="32" y="280">AN IMPORT FROM</text>
    <text class="t-lbl" x="32" y="293">A MOVED PATH</text>
    <text class="mark minus" x="228" y="282">−</text>
    <text class="t-b" x="248" y="281">No exported member</text>
    <text class="t-s" x="248" y="299">only the changeset names the new home</text>
    <text class="mark plus" x="592" y="282">+</text>
    <text class="t-b" x="612" y="281">Still works, struck through</text>
    <text class="t-s" x="612" y="299">until the removal minor</text>
    <line class="row" x1="16" y1="312" x2="924" y2="312"/>
  </g>
  <g id="locks-in">
    <rect class="foot" x="16" y="328" width="446" height="74" rx="5"/>
    <text class="t-lbl" x="32" y="349">LOCKS IN</text>
    <text class="t-b" x="32" y="369">BP-030 waived for this epic</text>
    <text class="t-s" x="32" y="387">what would silently corrupt data is raised first</text>
  </g>
  <g id="flips-if">
    <rect class="foot" x="478" y="328" width="446" height="74" rx="5"/>
    <text class="t-lbl" x="494" y="349">FLIPS IF</text>
    <text class="t-b" x="494" y="369">Adopters must keep running across upgrades</text>
    <text class="t-s" x="494" y="387">at 1.0, or a paying adopter on a pinned minor</text>
  </g>
</svg>
