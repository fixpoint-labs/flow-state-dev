<svg viewBox="0 0 940 418" role="img" aria-label="Q1, open, the owner&#x27;s call. 0.4.0 has shipped: how do adopters meet the names this epic moves. Three options. Recommended: keep each moved name as a deprecated alias that names its new home and a removal version, then remove all aliases in one minor. Instead of: holding the next minor of core, engine, client and react for every P1 move, or breaking as each child lands. It comes down to the first row: alias and hold both break an adopter once, and only the alias warns first; breaking as each lands breaks up to seven times. The second row is the price of holding: 19 pending changesets wait, and sibling packages pinned to exact versions wait with them. The third row is the alias&#x27;s price: the old names still autocomplete, struck out, until the removal minor. Locks in: a deprecated alias per move, exempt from the Shims row, removed at a named minor, by its own child or by the foundation minor itself, then the closure runs. Flips if adopters on 0.4.0 are few enough to ignore."
     xmlns="http://www.w3.org/2000/svg">
  <style>
    :root { --surface:#FCFCFA; --surface-2:#E8E8E1; --ink:#191C21; --ink-2:#4C535B; --ink-3:#7A828B;
            --rule:#D5D4CB; --accent:#3E4E8C; --accent-soft:#E0E3F0; --code:#2C7C69; --code-soft:#DCEDE7;
            --gone:#A9544F; }
    @media (prefers-color-scheme: dark) {
      :root { --surface:#181C1F; --surface-2:#202528; --ink:#E6E8E5; --ink-2:#A4ACB1; --ink-3:#737B81;
              --rule:#2B3135; --accent:#8B9BD8; --accent-soft:#1B2140; --code:#5DBBA1; --code-soft:#14302A;
              --gone:#DE8A84; } }
    .bg     { fill:var(--surface); }
    .ask    { fill:var(--surface-2); }
    .chosen { fill:var(--code-soft); stroke:var(--code); stroke-width:1.6; }
    .rec    { fill:var(--code-soft); stroke:var(--code); stroke-width:1.6; stroke-dasharray:5 4; }
    .lost   { fill:var(--surface); stroke:var(--rule); stroke-width:1.4; stroke-dasharray:5 4; }
    .decide { fill:var(--accent-soft); }
    .bar    { fill:var(--accent); }
    .row    { stroke:var(--rule); stroke-width:1; }
    .foot   { fill:var(--surface-2); }
    .t-lbl  { fill:var(--ink-3); font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:9.5px; letter-spacing:.1em; }
    .t-tag  { font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:9.5px; letter-spacing:.1em; font-weight:600; }
    .t-q    { fill:var(--ink); font-family:system-ui,-apple-system,sans-serif; font-weight:600; font-size:15px; }
    .t-h    { font-family:system-ui,-apple-system,sans-serif; font-weight:600; font-size:14px; }
    .t-b    { fill:var(--ink); font-family:system-ui,-apple-system,sans-serif; font-size:12.5px; }
    .t-s    { fill:var(--ink-2); font-family:system-ui,-apple-system,sans-serif; font-size:11px; }
    .mark   { font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:16px; font-weight:700; }
    .plus   { fill:var(--code); }
    .minus  { fill:var(--gone); }
    .tie    { fill:var(--ink-3); }
    .c-code { fill:var(--code); }
    .c-mute { fill:var(--ink-3); }
    .c-lost { fill:var(--ink-2); }
    .c-acc  { fill:var(--accent); }
  </style>
  <rect class="bg" x="0" y="0" width="940" height="418"/>
  <g id="the-call">
    <rect class="ask" x="16" y="14" width="908" height="48" rx="6"/>
    <text class="t-lbl" x="32" y="32">Q1 · OPEN · THE OWNER’S CALL</text>
    <text class="t-q" x="32" y="52">0.4.0 has shipped. How do adopters meet the names this epic moves?</text>
  </g>
  <g id="options">
    <rect class="rec" x="212" y="76" width="224" height="46" rx="5"/>
    <text class="t-tag c-code" x="226" y="93">RECOMMENDED</text>
    <text class="t-h c-code" x="226" y="112">Alias, then one removal</text>
    <rect class="lost" x="452" y="76" width="224" height="46" rx="5"/>
    <text class="t-tag c-mute" x="466" y="93">INSTEAD OF</text>
    <text class="t-h c-lost" x="466" y="112">Hold the next minor</text>
    <rect class="lost" x="692" y="76" width="224" height="46" rx="5"/>
    <text class="t-tag c-mute" x="706" y="93">INSTEAD OF</text>
    <text class="t-h c-lost" x="706" y="112">Break as each lands</text>
  </g>
  <g id="row-decides">
    <rect class="decide" x="16" y="134" width="908" height="62" rx="4"/>
    <rect class="bar" x="16" y="134" width="4" height="62"/>
    <text class="t-lbl" x="32" y="156">TIMES AN ADOPTER’S</text>
    <text class="t-lbl" x="32" y="169">UPGRADE BREAKS</text>
    <text class="t-tag c-acc" x="32" y="186">▸ DECIDES IT</text>
    <text class="mark plus" x="226" y="162">+</text>
    <text class="t-b" x="246" y="161">Once</text>
    <text class="t-s" x="246" y="179">warned first, by a deprecation</text>
    <text class="mark plus" x="466" y="162">+</text>
    <text class="t-b" x="486" y="161">Once</text>
    <text class="t-s" x="486" y="179">with no warning before it</text>
    <text class="mark minus" x="706" y="162">−</text>
    <text class="t-b" x="726" y="161">Up to seven</text>
    <text class="t-s" x="726" y="179">half a surface in between</text>
  </g>
  <g id="row-2">
    <text class="t-lbl" x="32" y="222">RELEASES OF</text>
    <text class="t-lbl" x="32" y="235">MERGED WORK</text>
    <text class="mark plus" x="226" y="224">+</text>
    <text class="t-b" x="246" y="223">As usual</text>
    <text class="t-s" x="246" y="241">each child ships when it lands</text>
    <text class="mark minus" x="466" y="224">−</text>
    <text class="t-b" x="486" y="223">Held</text>
    <text class="t-s" x="486" y="241">19 pending changesets wait</text>
    <text class="mark plus" x="706" y="224">+</text>
    <text class="t-b" x="726" y="223">As usual</text>
    <text class="t-s" x="726" y="241">the usual cadence</text>
    <line class="row" x1="16" y1="254" x2="924" y2="254"/>
  </g>
  <g id="row-3">
    <text class="t-lbl" x="32" y="280">WHEN THE ROOT</text>
    <text class="t-lbl" x="32" y="293">IS CLEAN</text>
    <text class="mark minus" x="226" y="282">−</text>
    <text class="t-b" x="246" y="281">At the removal minor</text>
    <text class="t-s" x="246" y="299">old names autocomplete, struck out</text>
    <text class="mark plus" x="466" y="282">+</text>
    <text class="t-b" x="486" y="281">At the held minor</text>
    <text class="t-s" x="486" y="299">all P1 moves at once</text>
    <text class="mark tie" x="706" y="282">=</text>
    <text class="t-b" x="726" y="281">Child by child</text>
    <text class="t-s" x="726" y="299">never all at once before wrap</text>
    <line class="row" x1="16" y1="312" x2="924" y2="312"/>
  </g>
  <g id="locks-in">
    <rect class="foot" x="16" y="328" width="446" height="74" rx="5"/>
    <text class="t-lbl" x="32" y="349">LOCKS IN</text>
    <text class="t-b" x="32" y="369">Each move keeps a @deprecated alias</text>
    <text class="t-s" x="32" y="387">removed at a named minor, by a child or by that minor</text>
  </g>
  <g id="flips-if">
    <rect class="foot" x="478" y="328" width="446" height="74" rx="5"/>
    <text class="t-lbl" x="494" y="349">FLIPS IF</text>
    <text class="t-b" x="494" y="369">Adopters on 0.4.0 are few enough to ignore</text>
    <text class="t-s" x="494" y="387">then break as each lands, no aliases</text>
  </g>
</svg>
