<svg viewBox="0 0 940 430" role="img" aria-label="ER-7, an open fork for the owner: when does a task&#x27;s subscription end? Recommended: when the task fails or is cancelled, or when its thread closes, the PR merged or closed. Beside it, as signed: when the task ends. It comes down to the first row, a review that arrives after a coding task&#x27;s run: recommended, it lands in the task&#x27;s session, which takes messages once the task has finished; as signed, it reaches no task, because the run ended just after the PR opened. The price is the second row: a turn per review while the PR stays open, until it closes or the cap stops it. Third row, the epic&#x27;s first promise, that a coding task follows its PR and a screened review lands in its session: recommended, it is kept; as signed, it breaks for every review after the run, and the first team row would need rewording. Locks in: a finished task keeps hearing its open PR. Flips if a finished task&#x27;s session can&#x27;t take a message; then the subscription moves to the task&#x27;s follow-up or owner."
     xmlns="http://www.w3.org/2000/svg">
  <style>
    :root { --surface:#FCFCFA; --surface-2:#E8E8E1; --ink:#191C21; --ink-2:#4C535B; --ink-3:#7A828B;
            --rule:#D5D4CB; --accent:#3E4E8C; --accent-soft:#E0E3F0; --code:#2C7C69; --code-soft:#DCEDE7;
            --gone:#A9544F; }
    @media (prefers-color-scheme: dark) {
      :root { --surface:#181C1F; --surface-2:#202528; --ink:#E6E8E5; --ink-2:#A4ACB1; --ink-3:#737B81;
              --rule:#2B3135; --accent:#8B9BD8; --accent-soft:#1B2140; --code:#5DBBA1; --code-soft:#14302A;
              --gone:#DE8A84; } }
    .bg     { fill:var(--surface); }
    .ask    { fill:var(--surface-2); }
    .rec    { fill:var(--code-soft); stroke:var(--code); stroke-width:1.6; stroke-dasharray:5 4; }
    .lost   { fill:var(--surface); stroke:var(--rule); stroke-width:1.4; stroke-dasharray:5 4; }
    .decide { fill:var(--accent-soft); }
    .bar    { fill:var(--accent); }
    .row    { stroke:var(--rule); stroke-width:1; }
    .foot   { fill:var(--surface-2); }
    .t-lbl  { fill:var(--ink-3); font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:9.5px; letter-spacing:.1em; }
    .t-tag  { font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:9.5px; letter-spacing:.1em; font-weight:600; }
    .t-q    { fill:var(--ink); font-family:system-ui,-apple-system,sans-serif; font-weight:600; font-size:15px; }
    .t-h    { font-family:system-ui,-apple-system,sans-serif; font-weight:600; font-size:14px; }
    .t-b    { fill:var(--ink); font-family:system-ui,-apple-system,sans-serif; font-size:12.5px; }
    .t-s    { fill:var(--ink-2); font-family:system-ui,-apple-system,sans-serif; font-size:11px; }
    .mark   { font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:16px; font-weight:700; }
    .plus   { fill:var(--code); }
    .minus  { fill:var(--gone); }
    .tie    { fill:var(--ink-3); }
    .c-code { fill:var(--code); }
    .c-mute { fill:var(--ink-3); }
    .c-lost { fill:var(--ink-2); }
    .c-acc  { fill:var(--accent); }
  </style>
  <rect class="bg" x="0" y="0" width="940" height="430"/>

  <g id="the-call">
    <rect class="ask" x="16" y="14" width="908" height="48" rx="6"/>
    <text class="t-lbl" x="32" y="32">ER-7 · THE CALL · OPEN, FOR THE OWNER</text>
    <text class="t-q" x="32" y="52">When does a task&#x27;s subscription end?</text>
  </g>

  <g id="options">
    <rect class="rec" x="212" y="76" width="348" height="46" rx="5"/>
    <text class="t-tag c-code" x="228" y="93">RECOMMENDED</text>
    <text class="t-h c-code" x="228" y="112">Fails, cancelled, or thread closes</text>
    <rect class="lost" x="576" y="76" width="348" height="46" rx="5"/>
    <text class="t-tag c-mute" x="592" y="93">AS SIGNED</text>
    <text class="t-h c-lost" x="592" y="112">When the task ends</text>
  </g>

  <g id="row-decides">
    <rect class="decide" x="16" y="134" width="908" height="62" rx="4"/>
    <rect class="bar" x="16" y="134" width="4" height="62"/>
    <text class="t-lbl" x="32" y="156">A REVIEW AFTER</text>
    <text class="t-lbl" x="32" y="169">THE RUN</text>
    <text class="t-tag c-acc" x="32" y="186">▸ DECIDES IT</text>
    <text class="mark plus" x="228" y="162">+</text>
    <text class="t-b" x="248" y="161">Lands in the task&#x27;s session</text>
    <text class="t-s" x="248" y="179">a finished task&#x27;s session takes messages</text>
    <text class="mark minus" x="592" y="162">−</text>
    <text class="t-b" x="612" y="161">Reaches no task</text>
    <text class="t-s" x="612" y="179">the run ended just after the PR opened</text>
  </g>
  <g id="row-1">
    <text class="t-lbl" x="32" y="222">A PR LEFT OPEN</text>
    <text class="mark minus" x="228" y="224">−</text>
    <text class="t-b" x="248" y="223">A turn per review</text>
    <text class="t-s" x="248" y="241">until the PR closes, or the cap</text>
    <text class="mark plus" x="592" y="224">+</text>
    <text class="t-b" x="612" y="223">Nothing more runs</text>
    <text class="t-s" x="612" y="241">the subscription is gone</text>
    <line class="row" x1="16" y1="256" x2="924" y2="256"/>
  </g>
  <g id="row-2">
    <text class="t-lbl" x="32" y="274">THE EPIC&#x27;S</text>
    <text class="t-lbl" x="32" y="287">FIRST PROMISE</text>
    <text class="mark plus" x="228" y="282">+</text>
    <text class="t-b" x="248" y="281">Kept: a review lands in its session</text>
    <text class="t-s" x="248" y="299">the coding task follows its PR, as promised</text>
    <text class="mark minus" x="592" y="282">−</text>
    <text class="t-b" x="612" y="281">Broken for reviews after the run</text>
    <text class="t-s" x="612" y="299">the first team row would need rewording</text>
    <line class="row" x1="16" y1="314" x2="924" y2="314"/>
  </g>

  <g id="locks-in">
    <rect class="foot" x="16" y="340" width="446" height="74" rx="5"/>
    <text class="t-lbl" x="32" y="361">LOCKS IN</text>
    <text class="t-b" x="32" y="381">A finished task keeps hearing its open PR</text>
    <text class="t-s" x="32" y="399">the thread ends the subscription, not the run</text>
  </g>

  <g id="flips-if">
    <rect class="foot" x="478" y="340" width="446" height="74" rx="5"/>
    <text class="t-lbl" x="494" y="361">FLIPS IF</text>
    <text class="t-b" x="494" y="381">A finished task can&#x27;t take a message</text>
    <text class="t-s" x="494" y="399">then it moves to the task&#x27;s follow-up or owner</text>
  </g>
</svg>
