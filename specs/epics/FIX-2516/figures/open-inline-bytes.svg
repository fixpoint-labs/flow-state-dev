<svg viewBox="0 0 940 418" role="img" aria-label="Q1, open: in v1, does a stored session keep each attachment's bytes inside the message. Recommended: inline bytes. Instead of: a blob store first, or stripping the bytes. It comes down to the first row: only inline shows the image after a reload today; a blob store needs FIX-824 and FIX-367 first; stripping keeps only the name. The price: about 3 MB per 10-image turn, and a 3 MB per-message ceiling because Vercel refuses request bodies over 4.5 MB. Locks in a stored shape that holds bytes. Flips if the kill-line measurement fails."
     xmlns="http://www.w3.org/2000/svg">
  <style>
    :root { --surface:#FCFCFA; --surface-2:#E8E8E1; --ink:#191C21; --ink-2:#4C535B; --ink-3:#7A828B;
            --rule:#D5D4CB; --accent:#3E4E8C; --accent-soft:#E0E3F0; --code:#2C7C69; --code-soft:#DCEDE7;
            --gone:#A9544F; }
    @media (prefers-color-scheme: dark) {
      :root { --surface:#181C1F; --surface-2:#202528; --ink:#E6E8E5; --ink-2:#A4ACB1; --ink-3:#737B81;
              --rule:#2B3135; --accent:#8B9BD8; --accent-soft:#1B2140; --code:#5DBBA1; --code-soft:#14302A;
              --gone:#DE8A84; } }
    .bg     { fill:var(--surface); }
    .ask    { fill:var(--surface-2); }
    .chosen { fill:var(--code-soft); stroke:var(--code); stroke-width:1.6; }
    .rec    { fill:var(--code-soft); stroke:var(--code); stroke-width:1.6; stroke-dasharray:5 4; }
    .lost   { fill:var(--surface); stroke:var(--rule); stroke-width:1.4; stroke-dasharray:5 4; }
    .decide { fill:var(--accent-soft); }
    .bar    { fill:var(--accent); }
    .row    { stroke:var(--rule); stroke-width:1; }
    .foot   { fill:var(--surface-2); }
    .t-lbl  { fill:var(--ink-3); font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:9.5px; letter-spacing:.1em; }
    .t-tag  { font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:9.5px; letter-spacing:.1em; font-weight:600; }
    .t-q    { fill:var(--ink); font-family:system-ui,-apple-system,sans-serif; font-weight:600; font-size:15px; }
    .t-h    { font-family:system-ui,-apple-system,sans-serif; font-weight:600; font-size:14px; }
    .t-b    { fill:var(--ink); font-family:system-ui,-apple-system,sans-serif; font-size:12.5px; }
    .t-s    { fill:var(--ink-2); font-family:system-ui,-apple-system,sans-serif; font-size:11px; }
    .mark   { font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:16px; font-weight:700; }
    .plus   { fill:var(--code); }
    .minus  { fill:var(--gone); }
    .tie    { fill:var(--ink-3); }
    .c-code { fill:var(--code); }
    .c-mute { fill:var(--ink-3); }
    .c-lost { fill:var(--ink-2); }
    .c-acc  { fill:var(--accent); }
  </style>
  <rect class="bg" x="0" y="0" width="940" height="418"/>

  <g id="the-call">
    <rect class="ask" x="16" y="14" width="908" height="48" rx="6"/>
    <text class="t-lbl" x="32" y="32">Q1 · OPEN · THE CALL</text>
    <text class="t-q" x="32" y="52">In v1, does a stored session keep each attachment's bytes inside the message?</text>
  </g>

  <g id="options">
    <rect class="rec" x="212" y="76" width="224" height="46" rx="5"/>
    <text class="t-tag c-code" x="228" y="93">RECOMMENDED</text>
    <text class="t-h c-code" x="228" y="112">Inline bytes</text>
    <rect class="lost" x="452" y="76" width="224" height="46" rx="5"/>
    <text class="t-tag c-mute" x="468" y="93">INSTEAD OF</text>
    <text class="t-h c-lost" x="468" y="112">A blob store first</text>
    <rect class="lost" x="692" y="76" width="224" height="46" rx="5"/>
    <text class="t-tag c-mute" x="708" y="93">INSTEAD OF</text>
    <text class="t-h c-lost" x="708" y="112">Strip the bytes</text>
  </g>

  <g id="row-1">
    <rect class="decide" x="16" y="134" width="908" height="62" rx="4"/>
    <rect class="bar" x="16" y="134" width="4" height="62"/>
    <text class="t-lbl" x="32" y="156">A RELOAD SHOWS</text>
    <text class="t-lbl" x="32" y="169">THE IMAGE</text>
    <text class="t-tag c-acc" x="32" y="186">▸ DECIDES IT</text>
    <text class="mark plus" x="228" y="162">+</text>
    <text class="t-b" x="248" y="161">Yes, today</text>
    <text class="t-s" x="248" y="179">FileContent.data exists</text>
    <text class="mark plus" x="468" y="162">+</text>
    <text class="t-b" x="488" y="161">Yes, later</text>
    <text class="t-s" x="488" y="179">after FIX-824 and FIX-367</text>
    <text class="mark minus" x="708" y="162">−</text>
    <text class="t-b" x="728" y="161">No</text>
    <text class="t-s" x="728" y="179">only the name survives</text>
  </g>
  <g id="row-2">
    <text class="t-lbl" x="32" y="224">STORED SIZE</text>
    <text class="mark minus" x="228" y="227">−</text>
    <text class="t-b" x="248" y="226">About 3 MB a turn</text>
    <text class="t-s" x="248" y="244">for 10 images, on every read</text>
    <text class="mark plus" x="468" y="227">+</text>
    <text class="t-b" x="488" y="226">A pointer</text>
    <text class="t-s" x="488" y="244">bytes kept once, elsewhere</text>
    <text class="mark plus" x="708" y="227">+</text>
    <text class="t-b" x="728" y="226">A name</text>
    <text class="t-s" x="728" y="244">nothing to store</text>
    <line class="row" x1="16" y1="254" x2="924" y2="254"/>
  </g>
  <g id="row-3">
    <text class="t-lbl" x="32" y="282">PER-MESSAGE</text>
    <text class="t-lbl" x="32" y="295">CEILING</text>
    <text class="mark minus" x="228" y="285">−</text>
    <text class="t-b" x="248" y="284">3 MB of files</text>
    <text class="t-s" x="248" y="302">Vercel refuses over 4.5 MB</text>
    <text class="mark plus" x="468" y="285">+</text>
    <text class="t-b" x="488" y="284">The store's</text>
    <text class="t-s" x="488" y="302">uploads skip the action body</text>
    <text class="mark minus" x="708" y="285">−</text>
    <text class="t-b" x="728" y="284">3 MB of files</text>
    <text class="t-s" x="728" y="302">the same request</text>
    <line class="row" x1="16" y1="312" x2="924" y2="312"/>
  </g>

  <g id="locks-in">
    <rect class="foot" x="16" y="328" width="446" height="74" rx="5"/>
    <text class="t-lbl" x="32" y="349">LOCKS IN</text>
    <text class="t-b" x="32" y="369">A stored shape that holds bytes</text>
    <text class="t-s" x="32" y="387">a later move to pointers reads both shapes</text>
  </g>

  <g id="flips-if">
    <rect class="foot" x="478" y="328" width="446" height="74" rx="5"/>
    <text class="t-lbl" x="494" y="349">FLIPS IF</text>
    <text class="t-b" x="494" y="369">The kill-line measurement fails</text>
    <text class="t-s" x="494" y="387">10 screenshots over the limit, or a slow reload</text>
  </g>
</svg>
