<svg viewBox="0 0 940 430" role="img" aria-label="Who owns what: ten rules across FIX-2517 to FIX-2524, the closure FIX-2565 and the coordinator. Each rule has exactly one owner. ER-1 One attachment shape: owned by FIX-2517; ER-2 One limits set, in core: owned by FIX-2517; ER-3 Nothing dropped silently: owned by FIX-2517; ER-4 A type a target can't take is said: owned by FIX-2519; ER-5 Files ride beside the input: owned by FIX-2517; ER-6 Composer pieces from the registry: owned by FIX-2518; ER-7 A task's files are its brief's: owned by FIX-2522; ER-8 Disk files per turn, removed: owned by FIX-2519; ER-9 Kill line measured first: owned by FIX-2517; ER-10 Consumed issues keep parents: owned by the coordinator." xmlns="http://www.w3.org/2000/svg">
  <style>
    :root { --surface:#FCFCFA; --surface-2:#E8E8E1; --ink:#191C21; --ink-2:#4C535B; --ink-3:#7A828B;
            --rule:#D5D4CB; --accent:#3E4E8C; --accent-soft:#E0E3F0; --code:#2C7C69; --code-soft:#DCEDE7; }
    @media (prefers-color-scheme: dark) {
      :root { --surface:#181C1F; --surface-2:#202528; --ink:#E6E8E5; --ink-2:#A4ACB1; --ink-3:#737B81;
              --rule:#2B3135; --accent:#8B9BD8; --accent-soft:#1B2140; --code:#5DBBA1; --code-soft:#14302A; } }
    .bg   { fill:var(--surface); }
    .line { stroke:var(--rule); stroke-width:1; }
    .o    { fill:var(--code-soft); stroke:var(--code); stroke-width:1.4; }
    .u    { fill:var(--accent-soft); }
    .c    { fill:var(--surface); stroke:var(--accent); stroke-width:1; stroke-dasharray:3 3; }
    .t-lbl { fill:var(--ink-3); font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:9.5px; letter-spacing:.06em; }
    .t-col { fill:var(--ink); font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:11px; font-weight:600; }
    .t-b   { fill:var(--ink); font-family:system-ui,-apple-system,sans-serif; font-size:12.5px; }
    .t-id  { fill:var(--ink-3); font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:10.5px; }
    .t-o   { fill:var(--code); font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:10px; font-weight:600; }
    .t-u   { fill:var(--accent); font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:10px; }
  </style>
  <rect class="bg" x="0" y="0" width="940" height="430"/>

  <g id="columns">
    <text class="t-col" x="331" y="36" text-anchor="middle">2517</text>
    <text class="t-lbl" x="331" y="52" text-anchor="middle">framework</text>
    <text class="t-col" x="393" y="36" text-anchor="middle">2518</text>
    <text class="t-lbl" x="393" y="52" text-anchor="middle">UI</text>
