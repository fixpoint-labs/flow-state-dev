    <rect class="u" x="552" y="72" width="54" height="22" rx="3"/>
    <text class="t-u" x="579" y="87" text-anchor="middle">uses</text>
    <rect class="u" x="614" y="72" width="54" height="22" rx="3"/>
    <text class="t-u" x="641" y="87" text-anchor="middle">uses</text>
    <rect class="u" x="676" y="72" width="54" height="22" rx="3"/>
    <text class="t-u" x="703" y="87" text-anchor="middle">uses</text>
    <rect class="u" x="738" y="72" width="54" height="22" rx="3"/>
    <text class="t-u" x="765" y="87" text-anchor="middle">uses</text>
    <rect class="u" x="800" y="72" width="54" height="22" rx="3"/>
    <text class="t-u" x="827" y="87" text-anchor="middle">uses</text>
    <line class="line" x1="16" y1="98" x2="924" y2="98"/>
  </g>
  <g id="er-2">
    <text class="t-id" x="16" y="118">ER-2</text>
    <text class="t-b" x="62" y="118">Bytes only in the blob store</text>
    <rect class="o" x="304" y="102" width="54" height="22" rx="3"/>
    <text class="t-o" x="331" y="117" text-anchor="middle">owns</text>
    <rect class="u" x="366" y="102" width="54" height="22" rx="3"/>
    <text class="t-u" x="393" y="117" text-anchor="middle">uses</text>
    <rect class="u" x="428" y="102" width="54" height="22" rx="3"/>
    <text class="t-u" x="455" y="117" text-anchor="middle">uses</text>
    <rect class="u" x="490" y="102" width="54" height="22" rx="3"/>
    <text class="t-u" x="517" y="117" text-anchor="middle">uses</text>
    <rect class="u" x="552" y="102" width="54" height="22" rx="3"/>
    <text class="t-u" x="579" y="117" text-anchor="middle">uses</text>
    <rect class="u" x="676" y="102" width="54" height="22" rx="3"/>
    <text class="t-u" x="703" y="117" text-anchor="middle">uses</text>
    <rect class="c" x="862" y="102" width="54" height="22" rx="3"/>
    <text class="t-u" x="889" y="117" text-anchor="middle">checks</text>
    <line class="line" x1="16" y1="128" x2="924" y2="128"/>
  </g>
  <g id="er-3">
    <text class="t-id" x="16" y="148">ER-3</text>
    <text class="t-b" x="62" y="148">Served to the owner's readers</text>
    <rect class="o" x="304" y="132" width="54" height="22" rx="3"/>
    <text class="t-o" x="331" y="147" text-anchor="middle">owns</text>
    <rect class="u" x="428" y="132" width="54" height="22" rx="3"/>
    <text class="t-u" x="455" y="147" text-anchor="middle">uses</text>
    <line class="line" x1="16" y1="158" x2="924" y2="158"/>
  </g>
  <g id="er-4">
    <text class="t-id" x="16" y="178">ER-4</text>
    <text class="t-b" x="62" y="178">One limits set, named refusals</text>
    <rect class="o" x="304" y="162" width="54" height="22" rx="3"/>
    <text class="t-o" x="331" y="177" text-anchor="middle">owns</text>
    <rect class="u" x="366" y="162" width="54" height="22" rx="3"/>
    <text class="t-u" x="393" y="177" text-anchor="middle">uses</text>
    <rect class="u" x="428" y="162" width="54" height="22" rx="3"/>
    <text class="t-u" x="455" y="177" text-anchor="middle">uses</text>
    <rect class="u" x="552" y="162" width="54" height="22" rx="3"/>
    <text class="t-u" x="579" y="177" text-anchor="middle">uses</text>
    <rect class="c" x="862" y="162" width="54" height="22" rx="3"/>
    <text class="t-u" x="889" y="177" text-anchor="middle">checks</text>
    <line class="line" x1="16" y1="188" x2="924" y2="188"/>
  </g>
  <g id="er-5">
    <text class="t-id" x="16" y="208">ER-5</text>
    <text class="t-b" x="62" y="208">A target says what it can't take</text>
    <rect class="o" x="490" y="192" width="54" height="22" rx="3"/>
    <text class="t-o" x="517" y="207" text-anchor="middle">owns</text>
    <rect class="u" x="366" y="192" width="54" height="22" rx="3"/>
    <text class="t-u" x="393" y="207" text-anchor="middle">uses</text>
    <rect class="u" x="552" y="192" width="54" height="22" rx="3"/>
    <text class="t-u" x="579" y="207" text-anchor="middle">uses</text>
    <rect class="c" x="862" y="192" width="54" height="22" rx="3"/>
    <text class="t-u" x="889" y="207" text-anchor="middle">checks</text>
    <line class="line" x1="16" y1="218" x2="924" y2="218"/>
  </g>
  <g id="er-6">
    <text class="t-id" x="16" y="238">ER-6</text>
    <text class="t-b" x="62" y="238">Composer pieces from the registry</text>
    <rect class="o" x="428" y="222" width="54" height="22" rx="3"/>
    <text class="t-o" x="455" y="237" text-anchor="middle">owns</text>
    <rect class="u" x="614" y="222" width="54" height="22" rx="3"/>
