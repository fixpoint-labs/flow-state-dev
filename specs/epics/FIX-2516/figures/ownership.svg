    <rect class="u" x="800" y="222" width="54" height="22" rx="3"/>
    <text class="t-u" x="827" y="237" text-anchor="middle">uses</text>
    <rect class="c" x="862" y="222" width="54" height="22" rx="3"/>
    <text class="t-u" x="889" y="237" text-anchor="middle">checks</text>
    <line class="line" x1="16" y1="248" x2="924" y2="248"/>
  </g>
  <g id="er-7">
    <text class="t-id" x="16" y="268">ER-7</text>
    <text class="t-b" x="62" y="268">A task's files are its brief's</text>
    <rect class="o" x="676" y="252" width="54" height="22" rx="3"/>
    <text class="t-o" x="703" y="267" text-anchor="middle">owns</text>
    <rect class="u" x="490" y="252" width="54" height="22" rx="3"/>
    <text class="t-u" x="517" y="267" text-anchor="middle">uses</text>
    <rect class="c" x="862" y="252" width="54" height="22" rx="3"/>
    <text class="t-u" x="889" y="267" text-anchor="middle">checks</text>
    <line class="line" x1="16" y1="278" x2="924" y2="278"/>
  </g>

  <g id="legend">
    <rect class="o" x="16" y="304" width="40" height="18" rx="3"/>
    <text class="t-b" x="64" y="317">decides or builds it · exactly one per rule</text>
    <rect class="u" x="360" y="304" width="40" height="18" rx="3"/>
    <text class="t-b" x="408" y="317">uses it · must not decide again</text>
    <rect class="c" x="640" y="304" width="40" height="18" rx="3"/>
    <text class="t-b" x="688" y="317">the closure checks it</text>
  </g>
</svg>
