    <text class="t-lbl" x="827" y="52" text-anchor="middle">closure</text>
    <text class="t-col" x="889" y="36" text-anchor="middle">Coord.</text>
    <text class="t-lbl" x="889" y="52" text-anchor="middle">the loop</text>
    <line class="line" x1="16" y1="62" x2="924" y2="62"/>
