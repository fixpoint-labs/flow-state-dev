<svg viewBox="0 0 940 414" role="img" aria-label="D1, how the two kinds of session sit in the app. Chosen: one sidebar with two groups, work sessions and coordinator sessions. Instead of: a switch between two views, as today. It comes down to the first row: with a switch the other kind of session is out of sight, with one sidebar it is in the same list. Second row: Alt+Up and Alt+Down step across all sessions instead of stopping at the end of a view. The price is the third row: one longer list, grouped by type, where each view stayed short. Locks in: the page address drops the view, and the list, the quick switcher, the keys, the address and the goal scripts change. Flips if one kind of session buries the other in a person's list, and then a filter is the fix, not the switch back."
     xmlns="http://www.w3.org/2000/svg">
  <style>
    :root { --surface:#FCFCFA; --surface-2:#E8E8E1; --ink:#191C21; --ink-2:#4C535B; --ink-3:#7A828B;
            --rule:#D5D4CB; --accent:#3E4E8C; --accent-soft:#E0E3F0; --code:#2C7C69; --code-soft:#DCEDE7;
            --prose:#A8761C; --prose-soft:#F3E8D2; --gone:#A9544F; }
    @media (prefers-color-scheme: dark) {
      :root { --surface:#181C1F; --surface-2:#202528; --ink:#E6E8E5; --ink-2:#A4ACB1; --ink-3:#737B81;
              --rule:#2B3135; --accent:#8B9BD8; --accent-soft:#1B2140; --code:#5DBBA1; --code-soft:#14302A;
              --prose:#D9A44B; --prose-soft:#332612; --gone:#DE8A84; } }
    .bg     { fill:var(--surface); }
    .ask    { fill:var(--surface-2); }
    .chosen { fill:var(--code-soft); stroke:var(--code); stroke-width:1.6; }
    .rec    { fill:var(--code-soft); stroke:var(--code); stroke-width:1.6; stroke-dasharray:5 4; }
    .lost   { fill:var(--surface); stroke:var(--rule); stroke-width:1.4; stroke-dasharray:5 4; }
    .decide { fill:var(--accent-soft); }
    .bar    { fill:var(--accent); }
    .row    { stroke:var(--rule); stroke-width:1; }
    .foot   { fill:var(--surface-2); }
    .t-lbl  { fill:var(--ink-3); font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:9.5px; letter-spacing:.1em; }
    .t-tag  { font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:9.5px; letter-spacing:.1em; font-weight:600; }
    .t-q    { fill:var(--ink); font-family:system-ui,-apple-system,sans-serif; font-weight:600; font-size:15px; }
    .t-h    { font-family:system-ui,-apple-system,sans-serif; font-weight:600; font-size:14px; }
    .t-b    { fill:var(--ink); font-family:system-ui,-apple-system,sans-serif; font-size:12.5px; }
    .t-s    { fill:var(--ink-2); font-family:system-ui,-apple-system,sans-serif; font-size:11px; }
    .mark   { font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:16px; font-weight:700; }
    .plus   { fill:var(--code); }
    .minus  { fill:var(--gone); }
    .tie    { fill:var(--ink-3); }
    .c-code { fill:var(--code); }
    .c-mute { fill:var(--ink-3); }
    .c-lost { fill:var(--ink-2); }
    .c-acc  { fill:var(--accent); }
  </style>
  <rect class="bg" x="0" y="0" width="940" height="414"/>

  <g id="the-call">
    <rect class="ask" x="16" y="14" width="908" height="48" rx="6"/>
    <text class="t-lbl" x="32" y="32">D1 · THE CALL</text>
    <text class="t-q" x="32" y="52">How do the two kinds of session sit in the app?</text>
  </g>

  <g id="options">
    <rect class="chosen" x="212" y="76" width="348" height="46" rx="5"/>
    <text class="t-tag c-code" x="228" y="93">CHOSEN</text>
    <text class="t-h c-code" x="228" y="112">One sidebar, two groups</text>
    <rect class="lost" x="576" y="76" width="348" height="46" rx="5"/>
    <text class="t-tag c-mute" x="592" y="93">INSTEAD OF</text>
    <text class="t-h c-lost" x="592" y="112">A switch between two views (today)</text>
  </g>

  <g id="row-1">
    <rect class="decide" x="16" y="134" width="908" height="62" rx="4"/>
    <rect class="bar" x="16" y="134" width="4" height="62"/>
    <text class="t-lbl" x="32" y="156">THE OTHER KIND</text>
    <text class="t-lbl" x="32" y="169">OF SESSION</text>
    <text class="t-tag c-acc" x="32" y="186">▸ DECIDES IT</text>
    <text class="mark plus" x="228" y="163">+</text>
    <text class="t-b" x="248" y="162">In the same list</text>
    <text class="t-s" x="248" y="180">grouped, one click away</text>
    <text class="mark minus" x="592" y="163">−</text>
    <text class="t-b" x="612" y="162">Out of sight</text>
    <text class="t-s" x="612" y="180">a switch away, or found with ⌘K</text>
  </g>

  <g id="row-2">
    <text class="t-lbl" x="32" y="220">THE KEYS</text>
    <text class="mark plus" x="228" y="225">+</text>
    <text class="t-b" x="248" y="224">Alt+↑/↓ step across all</text>
    <text class="t-s" x="248" y="242">⌘K already covered both</text>
    <text class="mark minus" x="592" y="225">−</text>
    <text class="t-b" x="612" y="224">Alt+↑/↓ stop at the view's end</text>
    <text class="t-s" x="612" y="242">two lists, two ends</text>
    <line class="row" x1="16" y1="250" x2="924" y2="250"/>
  </g>

  <g id="row-3">
    <text class="t-lbl" x="32" y="278">THE SIDEBAR</text>
    <text class="mark minus" x="228" y="283">−</text>
    <text class="t-b" x="248" y="282">One longer list</text>
    <text class="t-s" x="248" y="300">grouped by type; a filter is FIX-2402's</text>
    <text class="mark plus" x="592" y="283">+</text>
    <text class="t-b" x="612" y="282">Each view stays short</text>
    <text class="t-s" x="612" y="300">at the price of the hidden half</text>
    <line class="row" x1="16" y1="308" x2="924" y2="308"/>
  </g>

  <g id="locks-in">
    <rect class="foot" x="16" y="324" width="446" height="74" rx="5"/>
    <text class="t-lbl" x="32" y="345">LOCKS IN</text>
    <text class="t-b" x="32" y="365">The page address drops the view</text>
    <text class="t-s" x="32" y="383">B rewrites the list, ⌘K, the keys, the address, the goals</text>
  </g>

  <g id="flips-if">
    <rect class="foot" x="478" y="324" width="446" height="74" rx="5"/>
    <text class="t-lbl" x="494" y="345">FLIPS IF</text>
    <text class="t-b" x="494" y="365">One kind buries the other in a person's list</text>
    <text class="t-s" x="494" y="383">then a filter is the fix, not the switch back</text>
  </g>
</svg>
