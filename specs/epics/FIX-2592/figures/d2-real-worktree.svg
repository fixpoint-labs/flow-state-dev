<svg viewBox="0 0 940 414" role="img" aria-label="D2, where a run on a registered repository works. Chosen: a git worktree of the real repository, registered while the host runs. Instead of: a copy under the lab's data folder, which is what any repository added after start gets today. It comes down to the first row: with a worktree the branch is in the person's own repository where their git tools show it, with a copy it is in a folder nobody opens. The price is the second and third rows: the run acts with the operator's own access and can move that repository's branches, and the package needs a new entry first so the lab waits. Locks in: admission follows the transport's bind, and the live-checkout opt-out FIX-2251 stays unbuilt. Flips if an operator refuses that access, and then the copy stays the default."
     xmlns="http://www.w3.org/2000/svg">
  <style>
    :root { --surface:#FCFCFA; --surface-2:#E8E8E1; --ink:#191C21; --ink-2:#4C535B; --ink-3:#7A828B;
            --rule:#D5D4CB; --accent:#3E4E8C; --accent-soft:#E0E3F0; --code:#2C7C69; --code-soft:#DCEDE7;
            --prose:#A8761C; --prose-soft:#F3E8D2; --gone:#A9544F; }
    @media (prefers-color-scheme: dark) {
      :root { --surface:#181C1F; --surface-2:#202528; --ink:#E6E8E5; --ink-2:#A4ACB1; --ink-3:#737B81;
              --rule:#2B3135; --accent:#8B9BD8; --accent-soft:#1B2140; --code:#5DBBA1; --code-soft:#14302A;
              --prose:#D9A44B; --prose-soft:#332612; --gone:#DE8A84; } }
    .bg     { fill:var(--surface); }
    .ask    { fill:var(--surface-2); }
    .chosen { fill:var(--code-soft); stroke:var(--code); stroke-width:1.6; }
    .rec    { fill:var(--code-soft); stroke:var(--code); stroke-width:1.6; stroke-dasharray:5 4; }
    .lost   { fill:var(--surface); stroke:var(--rule); stroke-width:1.4; stroke-dasharray:5 4; }
    .decide { fill:var(--accent-soft); }
    .bar    { fill:var(--accent); }
    .row    { stroke:var(--rule); stroke-width:1; }
    .foot   { fill:var(--surface-2); }
    .t-lbl  { fill:var(--ink-3); font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:9.5px; letter-spacing:.1em; }
    .t-tag  { font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:9.5px; letter-spacing:.1em; font-weight:600; }
    .t-q    { fill:var(--ink); font-family:system-ui,-apple-system,sans-serif; font-weight:600; font-size:15px; }
    .t-h    { font-family:system-ui,-apple-system,sans-serif; font-weight:600; font-size:14px; }
    .t-b    { fill:var(--ink); font-family:system-ui,-apple-system,sans-serif; font-size:12.5px; }
    .t-s    { fill:var(--ink-2); font-family:system-ui,-apple-system,sans-serif; font-size:11px; }
    .mark   { font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:16px; font-weight:700; }
    .plus   { fill:var(--code); }
    .minus  { fill:var(--gone); }
    .tie    { fill:var(--ink-3); }
    .c-code { fill:var(--code); }
    .c-mute { fill:var(--ink-3); }
    .c-lost { fill:var(--ink-2); }
    .c-acc  { fill:var(--accent); }
  </style>
  <rect class="bg" x="0" y="0" width="940" height="414"/>

  <g id="the-call">
    <rect class="ask" x="16" y="14" width="908" height="48" rx="6"/>
    <text class="t-lbl" x="32" y="32">D2 · THE CALL</text>
    <text class="t-q" x="32" y="52">Where does a run on a registered repository work?</text>
  </g>

  <g id="options">
    <rect class="chosen" x="212" y="76" width="348" height="46" rx="5"/>
    <text class="t-tag c-code" x="228" y="93">CHOSEN</text>
    <text class="t-h c-code" x="228" y="112">A worktree of the real repository</text>
    <rect class="lost" x="576" y="76" width="348" height="46" rx="5"/>
    <text class="t-tag c-mute" x="592" y="93">INSTEAD OF</text>
    <text class="t-h c-lost" x="592" y="112">A copy under the lab's data folder (today)</text>
  </g>

  <g id="row-1">
    <rect class="decide" x="16" y="134" width="908" height="62" rx="4"/>
    <rect class="bar" x="16" y="134" width="4" height="62"/>
    <text class="t-lbl" x="32" y="156">WHERE THE PERSON</text>
    <text class="t-lbl" x="32" y="169">SEES THE WORK</text>
    <text class="t-tag c-acc" x="32" y="186">▸ DECIDES IT</text>
    <text class="mark plus" x="228" y="163">+</text>
    <text class="t-b" x="248" y="162">A branch in their own repository</text>
    <text class="t-s" x="248" y="180">their git tools show it</text>
    <text class="mark minus" x="592" y="163">−</text>
    <text class="t-b" x="612" y="162">A branch in a copy nobody opens</text>
    <text class="t-s" x="612" y="180">under .fsdev, so they must fetch it</text>
  </g>

  <g id="row-2">
    <text class="t-lbl" x="32" y="220">ACCESS THE RUN HAS</text>
    <text class="mark minus" x="228" y="225">−</text>
    <text class="t-b" x="248" y="224">The operator's own, on that repo</text>
    <text class="t-s" x="248" y="242">it can move that repository's branches</text>
    <text class="mark plus" x="592" y="225">+</text>
    <text class="t-b" x="612" y="224">Read only</text>
    <text class="t-s" x="612" y="242">the original is read, never changed</text>
    <line class="row" x1="16" y1="250" x2="924" y2="250"/>
  </g>

  <g id="row-3">
    <text class="t-lbl" x="32" y="278">COST TO BUILD</text>
    <text class="mark minus" x="228" y="283">−</text>
    <text class="t-b" x="248" y="282">A package entry; the lab waits</text>
    <text class="t-s" x="248" y="300">FIX-2593 first, its own spec and PR</text>
    <text class="mark plus" x="592" y="283">+</text>
    <text class="t-b" x="612" y="282">Nothing</text>
    <text class="t-s" x="612" y="300">exists today</text>
    <line class="row" x1="16" y1="308" x2="924" y2="308"/>
  </g>

  <g id="locks-in">
    <rect class="foot" x="16" y="324" width="446" height="74" rx="5"/>
    <text class="t-lbl" x="32" y="345">LOCKS IN</text>
    <text class="t-b" x="32" y="365">Admission follows the bind</text>
    <text class="t-s" x="32" y="383">ER-4 and Q1; FIX-2251 stays unbuilt</text>
  </g>

  <g id="flips-if">
    <rect class="foot" x="478" y="324" width="446" height="74" rx="5"/>
    <text class="t-lbl" x="494" y="345">FLIPS IF</text>
    <text class="t-b" x="494" y="365">An operator who refuses that access</text>
    <text class="t-s" x="494" y="383">then the copy stays the default</text>
  </g>
</svg>
