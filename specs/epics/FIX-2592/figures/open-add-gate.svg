<svg viewBox="0 0 940 414" role="img" aria-label="Q1, open: is adding a repository in Settings always on, or on only when the operator starts the lab with a switch. Recommended: always on. Instead of: on only with a start switch. It comes down to the first row: the lab serves one configured person, who is the operator, so a switch guards no one today. The price is the second row: if the lab is ever shown to a second person, any user could point runs at any local repository, so a gate must be added first. Third row: with always on, adding works at once with nothing to set. Locks in a lab that serves one person, stated in its README. Flips if there is any plan to show the lab to a second person."
     xmlns="http://www.w3.org/2000/svg">
  <style>
    :root { --surface:#FCFCFA; --surface-2:#E8E8E1; --ink:#191C21; --ink-2:#4C535B; --ink-3:#7A828B;
            --rule:#D5D4CB; --accent:#3E4E8C; --accent-soft:#E0E3F0; --code:#2C7C69; --code-soft:#DCEDE7;
            --prose:#A8761C; --prose-soft:#F3E8D2; --gone:#A9544F; }
    @media (prefers-color-scheme: dark) {
      :root { --surface:#181C1F; --surface-2:#202528; --ink:#E6E8E5; --ink-2:#A4ACB1; --ink-3:#737B81;
              --rule:#2B3135; --accent:#8B9BD8; --accent-soft:#1B2140; --code:#5DBBA1; --code-soft:#14302A;
              --prose:#D9A44B; --prose-soft:#332612; --gone:#DE8A84; } }
    .bg     { fill:var(--surface); }
    .ask    { fill:var(--surface-2); }
    .chosen { fill:var(--code-soft); stroke:var(--code); stroke-width:1.6; }
    .rec    { fill:var(--code-soft); stroke:var(--code); stroke-width:1.6; stroke-dasharray:5 4; }
    .lost   { fill:var(--surface); stroke:var(--rule); stroke-width:1.4; stroke-dasharray:5 4; }
    .decide { fill:var(--accent-soft); }
    .bar    { fill:var(--accent); }
    .row    { stroke:var(--rule); stroke-width:1; }
    .foot   { fill:var(--surface-2); }
    .t-lbl  { fill:var(--ink-3); font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:9.5px; letter-spacing:.1em; }
    .t-tag  { font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:9.5px; letter-spacing:.1em; font-weight:600; }
    .t-q    { fill:var(--ink); font-family:system-ui,-apple-system,sans-serif; font-weight:600; font-size:15px; }
    .t-h    { font-family:system-ui,-apple-system,sans-serif; font-weight:600; font-size:14px; }
    .t-b    { fill:var(--ink); font-family:system-ui,-apple-system,sans-serif; font-size:12.5px; }
    .t-s    { fill:var(--ink-2); font-family:system-ui,-apple-system,sans-serif; font-size:11px; }
    .mark   { font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:16px; font-weight:700; }
    .plus   { fill:var(--code); }
    .minus  { fill:var(--gone); }
    .tie    { fill:var(--ink-3); }
    .c-code { fill:var(--code); }
    .c-mute { fill:var(--ink-3); }
    .c-lost { fill:var(--ink-2); }
    .c-acc  { fill:var(--accent); }
  </style>
  <rect class="bg" x="0" y="0" width="940" height="414"/>

  <g id="the-call">
    <rect class="ask" x="16" y="14" width="908" height="48" rx="6"/>
    <text class="t-lbl" x="32" y="32">Q1 · OPEN · THE CALL</text>
    <text class="t-q" x="32" y="52">Settings add: always on, or on only when the operator starts the lab with it?</text>
  </g>

  <g id="options">
    <rect class="rec" x="212" y="76" width="348" height="46" rx="5"/>
    <text class="t-tag c-code" x="228" y="93">RECOMMENDED</text>
    <text class="t-h c-code" x="228" y="112">Always on</text>
    <rect class="lost" x="576" y="76" width="348" height="46" rx="5"/>
    <text class="t-tag c-mute" x="592" y="93">INSTEAD OF</text>
    <text class="t-h c-lost" x="592" y="112">On only with a start switch</text>
  </g>

  <g id="row-1">
    <rect class="decide" x="16" y="134" width="908" height="62" rx="4"/>
    <rect class="bar" x="16" y="134" width="4" height="62"/>
    <text class="t-lbl" x="32" y="156">WHO SITS</text>
    <text class="t-lbl" x="32" y="169">AT THE PAGE</text>
    <text class="t-tag c-acc" x="32" y="186">▸ DECIDES IT</text>
    <text class="mark plus" x="228" y="163">+</text>
    <text class="t-b" x="248" y="162">The one configured person</text>
    <text class="t-s" x="248" y="180">who is the operator; nothing to set</text>
    <text class="mark minus" x="592" y="163">−</text>
    <text class="t-b" x="612" y="162">A setting that guards no one</text>
    <text class="t-s" x="612" y="180">today the lab serves one person</text>
  </g>

  <g id="row-2">
    <text class="t-lbl" x="32" y="220">IF THE LAB IS</text>
    <text class="t-lbl" x="32" y="233">EVER SHARED</text>
    <text class="mark minus" x="228" y="225">−</text>
    <text class="t-b" x="248" y="224">Any user can point runs anywhere</text>
    <text class="t-s" x="248" y="242">a gate must be added first</text>
    <text class="mark plus" x="592" y="225">+</text>
    <text class="t-b" x="612" y="224">Add stays off until allowed</text>
    <text class="t-s" x="612" y="242">safe by default</text>
    <line class="row" x1="16" y1="250" x2="924" y2="250"/>
  </g>

  <g id="row-3">
    <text class="t-lbl" x="32" y="278">THE FIRST RUN</text>
    <text class="mark plus" x="228" y="283">+</text>
    <text class="t-b" x="248" y="282">Add works at once</text>
    <text class="t-s" x="248" y="300">no restart, nothing to find</text>
    <text class="mark minus" x="592" y="283">−</text>
    <text class="t-b" x="612" y="282">Add does nothing without a flag</text>
    <text class="t-s" x="612" y="300">the environment variable's problem again</text>
    <line class="row" x1="16" y1="308" x2="924" y2="308"/>
  </g>

  <g id="locks-in">
    <rect class="foot" x="16" y="324" width="446" height="74" rx="5"/>
    <text class="t-lbl" x="32" y="345">LOCKS IN</text>
    <text class="t-b" x="32" y="365">A one-person lab, said in its README</text>
    <text class="t-s" x="32" y="383">a shared host adds its own gate</text>
  </g>

  <g id="flips-if">
    <rect class="foot" x="478" y="324" width="446" height="74" rx="5"/>
    <text class="t-lbl" x="494" y="345">FLIPS IF</text>
    <text class="t-b" x="494" y="365">Any plan to show the lab to a second person</text>
    <text class="t-s" x="494" y="383">then the switch or a gate ships first</text>
  </g>
</svg>
