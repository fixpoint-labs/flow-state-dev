<svg viewBox="0 0 940 414" role="img" aria-label="Q2, open: what the sidebar calls the group of coordinator sessions, where the lead files work as tasks on a board. Recommended: Coordinators. Instead of: Workstreams, or Project Sessions. It comes down to the first row: Coordinators names what the lead does and the flow it runs on, and clashes with nothing; Workstreams is already a group in Shift Manager's command palette with a heavier meaning, an owned project entry with a lead and its own session; Project Sessions puts the word project back beside Repository with a third meaning. Changing it later is a label, so the third row is a tie. Locks in a word the README, dialog and goal scripts repeat. Flips if people want the lab to list Shift Manager's workstreams."
     xmlns="http://www.w3.org/2000/svg">
  <style>
    :root { --surface:#FCFCFA; --surface-2:#E8E8E1; --ink:#191C21; --ink-2:#4C535B; --ink-3:#7A828B;
            --rule:#D5D4CB; --accent:#3E4E8C; --accent-soft:#E0E3F0; --code:#2C7C69; --code-soft:#DCEDE7;
            --prose:#A8761C; --prose-soft:#F3E8D2; --gone:#A9544F; }
    @media (prefers-color-scheme: dark) {
      :root { --surface:#181C1F; --surface-2:#202528; --ink:#E6E8E5; --ink-2:#A4ACB1; --ink-3:#737B81;
              --rule:#2B3135; --accent:#8B9BD8; --accent-soft:#1B2140; --code:#5DBBA1; --code-soft:#14302A;
              --prose:#D9A44B; --prose-soft:#332612; --gone:#DE8A84; } }
    .bg     { fill:var(--surface); }
    .ask    { fill:var(--surface-2); }
    .chosen { fill:var(--code-soft); stroke:var(--code); stroke-width:1.6; }
    .rec    { fill:var(--code-soft); stroke:var(--code); stroke-width:1.6; stroke-dasharray:5 4; }
    .lost   { fill:var(--surface); stroke:var(--rule); stroke-width:1.4; stroke-dasharray:5 4; }
    .decide { fill:var(--accent-soft); }
    .bar    { fill:var(--accent); }
    .row    { stroke:var(--rule); stroke-width:1; }
    .foot   { fill:var(--surface-2); }
    .t-lbl  { fill:var(--ink-3); font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:9.5px; letter-spacing:.1em; }
    .t-tag  { font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:9.5px; letter-spacing:.1em; font-weight:600; }
    .t-q    { fill:var(--ink); font-family:system-ui,-apple-system,sans-serif; font-weight:600; font-size:15px; }
    .t-h    { font-family:system-ui,-apple-system,sans-serif; font-weight:600; font-size:14px; }
    .t-b    { fill:var(--ink); font-family:system-ui,-apple-system,sans-serif; font-size:12.5px; }
    .t-s    { fill:var(--ink-2); font-family:system-ui,-apple-system,sans-serif; font-size:11px; }
    .mark   { font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:16px; font-weight:700; }
    .plus   { fill:var(--code); }
    .minus  { fill:var(--gone); }
    .tie    { fill:var(--ink-3); }
    .c-code { fill:var(--code); }
    .c-mute { fill:var(--ink-3); }
    .c-lost { fill:var(--ink-2); }
    .c-acc  { fill:var(--accent); }
  </style>
  <rect class="bg" x="0" y="0" width="940" height="414"/>

  <g id="the-call">
    <rect class="ask" x="16" y="14" width="908" height="48" rx="6"/>
    <text class="t-lbl" x="32" y="32">Q2 · OPEN · THE CALL</text>
    <text class="t-q" x="32" y="52">What does the sidebar call the coordinator group?</text>
  </g>

  <g id="options">
    <rect class="rec" x="212" y="76" width="224" height="46" rx="5"/>
    <text class="t-tag c-code" x="228" y="93">RECOMMENDED</text>
    <text class="t-h c-code" x="228" y="112">Coordinators</text>
    <rect class="lost" x="452" y="76" width="224" height="46" rx="5"/>
    <text class="t-tag c-mute" x="468" y="93">INSTEAD OF</text>
    <text class="t-h c-lost" x="468" y="112">Workstreams</text>
    <rect class="lost" x="692" y="76" width="224" height="46" rx="5"/>
    <text class="t-tag c-mute" x="708" y="93">INSTEAD OF</text>
    <text class="t-h c-lost" x="708" y="112">Project Sessions</text>
  </g>

  <g id="row-1">
    <rect class="decide" x="16" y="134" width="908" height="62" rx="4"/>
    <rect class="bar" x="16" y="134" width="4" height="62"/>
    <text class="t-lbl" x="32" y="156">CLASHES WITH</text>
    <text class="t-lbl" x="32" y="169">A WORD NEARBY</text>
    <text class="t-tag c-acc" x="32" y="186">▸ DECIDES IT</text>
    <text class="mark plus" x="228" y="163">+</text>
    <text class="t-b" x="248" y="162">With none</text>
    <text class="t-s" x="248" y="180">the flow is a coordinator</text>
    <text class="mark minus" x="468" y="163">−</text>
    <text class="t-b" x="488" y="162">Shift Manager's palette group</text>
    <text class="t-s" x="488" y="180">a heavier thing, same keys</text>
    <text class="mark minus" x="708" y="163">−</text>
    <text class="t-b" x="728" y="162">Repository's neighbour</text>
    <text class="t-s" x="728" y="180">project, a third meaning</text>
  </g>

  <g id="row-2">
    <text class="t-lbl" x="32" y="220">TO A NEWCOMER</text>
    <text class="mark minus" x="228" y="225">−</text>
    <text class="t-b" x="248" y="224">Jargon: needs a line of help</text>
    <text class="t-s" x="248" y="242">what is a coordinator</text>
    <text class="mark minus" x="468" y="225">−</text>
    <text class="t-b" x="488" y="224">Promises more than it does</text>
    <text class="t-s" x="488" y="242">an entry the lab does not make</text>
    <text class="mark minus" x="708" y="225">−</text>
    <text class="t-b" x="728" y="224">Says little</text>
    <text class="t-s" x="728" y="242">every session has a project row</text>
    <line class="row" x1="16" y1="250" x2="924" y2="250"/>
  </g>

  <g id="row-3">
    <text class="t-lbl" x="32" y="278">CHANGING IT LATER</text>
    <text class="mark tie" x="228" y="283">=</text>
    <text class="t-b" x="248" y="282">A label, a line, goal text</text>
    <text class="t-s" x="248" y="300">no stored data names it</text>
    <text class="mark tie" x="468" y="283">=</text>
    <text class="t-b" x="488" y="282">The same</text>
    <text class="t-s" x="488" y="300">no stored data names it</text>
    <text class="mark tie" x="708" y="283">=</text>
    <text class="t-b" x="728" y="282">The same</text>
    <text class="t-s" x="728" y="300">no stored data names it</text>
    <line class="row" x1="16" y1="308" x2="924" y2="308"/>
  </g>

  <g id="locks-in">
    <rect class="foot" x="16" y="324" width="446" height="74" rx="5"/>
    <text class="t-lbl" x="32" y="345">LOCKS IN</text>
    <text class="t-b" x="32" y="365">A word the README, dialog and goals repeat</text>
    <text class="t-s" x="32" y="383">FIX-2594's spec writes it once, as one constant</text>
  </g>

  <g id="flips-if">
    <rect class="foot" x="478" y="324" width="446" height="74" rx="5"/>
    <text class="t-lbl" x="494" y="345">FLIPS IF</text>
    <text class="t-b" x="494" y="365">People want the lab to list workstreams</text>
    <text class="t-s" x="494" y="383">then real workstreams, or that word</text>
  </g>
</svg>
