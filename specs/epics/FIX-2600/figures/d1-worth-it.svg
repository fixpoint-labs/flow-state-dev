<svg viewBox="0 0 940 418" role="img" aria-label="D1, is one glossary worth an epic now. Chosen: one glossary, three issues and a closure. Instead of: FIX-2479 alone, as a rename. It comes down to the first row: with a glossary the next word decision changes in one place and every check enforces it; with a rename alone it lands in a seventh place, as the 2026-11-06 decision reversed the 2026-11-02 one unseen. Today's names are renamed either way. The price: an epic slot and a closure run for plumbing, where the rename is one issue. Locks in two more issues and a closure run. Flips if word decisions are rare enough never to disagree."
     xmlns="http://www.w3.org/2000/svg">
  <style>
    :root { --surface:#FCFCFA; --surface-2:#E8E8E1; --ink:#191C21; --ink-2:#4C535B; --ink-3:#7A828B;
            --rule:#D5D4CB; --accent:#3E4E8C; --accent-soft:#E0E3F0; --code:#2C7C69; --code-soft:#DCEDE7;
            --prose:#A8761C; --prose-soft:#F3E8D2; --gone:#A9544F; }
    @media (prefers-color-scheme: dark) {
      :root { --surface:#181C1F; --surface-2:#202528; --ink:#E6E8E5; --ink-2:#A4ACB1; --ink-3:#737B81;
              --rule:#2B3135; --accent:#8B9BD8; --accent-soft:#1B2140; --code:#5DBBA1; --code-soft:#14302A;
              --prose:#D9A44B; --prose-soft:#332612; --gone:#DE8A84; } }
    .bg     { fill:var(--surface); }
    .ask    { fill:var(--surface-2); }
    .chosen { fill:var(--code-soft); stroke:var(--code); stroke-width:1.6; }
    .lost   { fill:var(--surface); stroke:var(--rule); stroke-width:1.4; stroke-dasharray:5 4; }
    .decide { fill:var(--accent-soft); }
    .bar    { fill:var(--accent); }
    .row    { stroke:var(--rule); stroke-width:1; }
    .foot   { fill:var(--surface-2); }
    .t-lbl  { fill:var(--ink-3); font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:9.5px; letter-spacing:.1em; }
    .t-tag  { font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:9.5px; letter-spacing:.1em; font-weight:600; }
    .t-q    { fill:var(--ink); font-family:system-ui,-apple-system,sans-serif; font-weight:600; font-size:15px; }
    .t-h    { font-family:system-ui,-apple-system,sans-serif; font-weight:600; font-size:14px; }
    .t-b    { fill:var(--ink); font-family:system-ui,-apple-system,sans-serif; font-size:12.5px; }
    .t-s    { fill:var(--ink-2); font-family:system-ui,-apple-system,sans-serif; font-size:11px; }
    .mark   { font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:16px; font-weight:700; }
    .plus   { fill:var(--code); }
    .minus  { fill:var(--gone); }
    .tie    { fill:var(--ink-3); }
    .c-code { fill:var(--code); }
    .c-mute { fill:var(--ink-3); }
    .c-lost { fill:var(--ink-2); }
    .c-acc  { fill:var(--accent); }
  </style>
  <rect class="bg" x="0" y="0" width="940" height="418"/>

  <g id="the-call">
    <rect class="ask" x="16" y="14" width="908" height="48" rx="6"/>
    <text class="t-lbl" x="32" y="32">D1 · THE CALL</text>
    <text class="t-q" x="32" y="52">Is one glossary worth an epic now, or is a rename enough?</text>
  </g>

  <g id="options">
    <rect class="chosen" x="212" y="76" width="348" height="46" rx="5"/>
    <text class="t-tag c-code" x="228" y="93">CHOSEN</text>
    <text class="t-h c-code" x="228" y="112">One glossary: three issues, a closure</text>
    <rect class="lost" x="576" y="76" width="348" height="46" rx="5"/>
    <text class="t-tag c-mute" x="592" y="93">INSTEAD OF</text>
    <text class="t-h c-lost" x="592" y="112">FIX-2479 alone, as a rename</text>
  </g>

  <g id="row-1">
    <rect class="decide" x="16" y="134" width="908" height="62" rx="4"/>
    <rect class="bar" x="16" y="134" width="4" height="62"/>
    <text class="t-lbl" x="32" y="156">THE NEXT</text>
    <text class="t-lbl" x="32" y="169">DECISION</text>
    <text class="t-tag c-acc" x="32" y="186">▸ DECIDES IT</text>
    <text class="mark plus" x="228" y="163">+</text>
    <text class="t-b" x="248" y="162">Changes in one place</text>
    <text class="t-s" x="248" y="180">every check enforces it from one edit</text>
    <text class="mark minus" x="592" y="163">−</text>
    <text class="t-b" x="612" y="162">Lands in a seventh place</text>
    <text class="t-s" x="612" y="180">as 2026-11-06 reversed 2026-11-02 unseen</text>
  </g>

  <g id="row-2">
    <text class="t-lbl" x="32" y="224">TODAY'S</text>
    <text class="t-lbl" x="32" y="237">NAMES</text>
    <text class="mark tie" x="228" y="225">=</text>
    <text class="t-b" x="248" y="224">Renamed</text>
    <text class="t-s" x="248" y="242">FIX-2479 is in the set</text>
    <text class="mark tie" x="592" y="225">=</text>
    <text class="t-b" x="612" y="224">Renamed</text>
    <text class="t-s" x="612" y="242">the same codemod</text>
    <line class="row" x1="16" y1="254" x2="924" y2="254"/>
  </g>

  <g id="row-3">
    <text class="t-lbl" x="32" y="282">THE COST</text>
    <text class="mark minus" x="228" y="283">−</text>
    <text class="t-b" x="248" y="282">An epic slot and a closure run</text>
    <text class="t-s" x="248" y="300">for work that is mostly plumbing</text>
    <text class="mark plus" x="592" y="283">+</text>
    <text class="t-b" x="612" y="282">One issue</text>
    <text class="t-s" x="612" y="300">no closure, no glossary file</text>
    <line class="row" x1="16" y1="312" x2="924" y2="312"/>
  </g>

  <g id="locks-in">
    <rect class="foot" x="16" y="328" width="446" height="74" rx="5"/>
    <text class="t-lbl" x="32" y="349">LOCKS IN</text>
    <text class="t-b" x="32" y="369">Two more issues and a closure run</text>
    <text class="t-s" x="32" y="387">FIX-2354 folds in if every tree is read by construction</text>
  </g>

  <g id="flips-if">
    <rect class="foot" x="478" y="328" width="446" height="74" rx="5"/>
    <text class="t-lbl" x="494" y="349">FLIPS IF</text>
    <text class="t-b" x="494" y="369">Word decisions rare enough never to disagree</text>
    <text class="t-s" x="494" y="387">two decisions four days apart say otherwise</text>
  </g>

</svg>
