<svg viewBox="0 0 940 330" role="img" aria-label="Who owns what: seven rules across FIX-2601 the glossary, FIX-2354 the contributor trees, FIX-2479 the resource names, and FIX-2602 the closure. ER-1 a rule is written only in the glossary: built by FIX-2601, used by FIX-2354 and FIX-2479. ER-2 the PR that coins a term edits its entry: built by FIX-2601, used by FIX-2479. ER-3 every check reads every contributor tree: built by FIX-2354, used by FIX-2601. ER-4 no new checker: FIX-2601. ER-5 the resource entry is the owner's table: built by FIX-2601, used by FIX-2479. ER-6 the resource rule reads the whole tree: FIX-2479. ER-7 published pages change only at release or by docs-fix: built by FIX-2479, used by FIX-2354. The closure checks every rule." xmlns="http://www.w3.org/2000/svg">
  <style>
    :root { --surface:#FCFCFA; --surface-2:#E8E8E1; --ink:#191C21; --ink-2:#4C535B; --ink-3:#7A828B;
            --rule:#D5D4CB; --accent:#3E4E8C; --accent-soft:#E0E3F0; --code:#2C7C69; --code-soft:#DCEDE7; }
    @media (prefers-color-scheme: dark) {
      :root { --surface:#181C1F; --surface-2:#202528; --ink:#E6E8E5; --ink-2:#A4ACB1; --ink-3:#737B81;
              --rule:#2B3135; --accent:#8B9BD8; --accent-soft:#1B2140; --code:#5DBBA1; --code-soft:#14302A; } }
    .bg   { fill:var(--surface); }
    .line { stroke:var(--rule); stroke-width:1; }
    .o    { fill:var(--code-soft); stroke:var(--code); stroke-width:1.4; }
    .u    { fill:var(--accent-soft); }
    .c    { fill:var(--surface); stroke:var(--accent); stroke-width:1; stroke-dasharray:3 3; }
    .t-lbl { fill:var(--ink-3); font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:9.5px; letter-spacing:.06em; }
    .t-col { fill:var(--ink); font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:11px; font-weight:600; }
    .t-b   { fill:var(--ink); font-family:system-ui,-apple-system,sans-serif; font-size:12.5px; }
    .t-id  { fill:var(--ink-3); font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:10.5px; }
    .t-o   { fill:var(--code); font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:10px; font-weight:600; }
    .t-u   { fill:var(--accent); font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:10px; }
  </style>
  <rect class="bg" x="0" y="0" width="940" height="330"/>

  <g id="columns">
    <text class="t-col" x="520" y="36" text-anchor="middle">2601</text>
    <text class="t-lbl" x="520" y="52" text-anchor="middle">glossary</text>
    <text class="t-col" x="620" y="36" text-anchor="middle">2354</text>
    <text class="t-lbl" x="620" y="52" text-anchor="middle">trees</text>
    <text class="t-col" x="720" y="36" text-anchor="middle">2479</text>
    <text class="t-lbl" x="720" y="52" text-anchor="middle">names</text>
    <text class="t-col" x="840" y="36" text-anchor="middle">2602</text>
    <text class="t-lbl" x="840" y="52" text-anchor="middle">closure</text>
    <line class="line" x1="16" y1="62" x2="924" y2="62"/>
  </g>

  <g id="er-1">
    <text class="t-id" x="16" y="82">ER-1</text>
    <text class="t-b" x="62" y="82">A rule is written only in the glossary</text>
    <rect class="o" x="488" y="66" width="64" height="22" rx="3"/><text class="t-o" x="520" y="81" text-anchor="middle">builds</text>
    <rect class="u" x="588" y="66" width="64" height="22" rx="3"/><text class="t-u" x="620" y="81" text-anchor="middle">uses</text>
    <rect class="u" x="688" y="66" width="64" height="22" rx="3"/><text class="t-u" x="720" y="81" text-anchor="middle">uses</text>
    <rect class="c" x="808" y="66" width="64" height="22" rx="3"/><text class="t-u" x="840" y="81" text-anchor="middle">checks</text>
    <line class="line" x1="16" y1="92" x2="924" y2="92"/>
  </g>
  <g id="er-2">
    <text class="t-id" x="16" y="112">ER-2</text>
    <text class="t-b" x="62" y="112">The PR that coins a term edits its entry</text>
    <rect class="o" x="488" y="96" width="64" height="22" rx="3"/><text class="t-o" x="520" y="111" text-anchor="middle">builds</text>
    <rect class="u" x="688" y="96" width="64" height="22" rx="3"/><text class="t-u" x="720" y="111" text-anchor="middle">uses</text>
    <rect class="c" x="808" y="96" width="64" height="22" rx="3"/><text class="t-u" x="840" y="111" text-anchor="middle">checks</text>
    <line class="line" x1="16" y1="122" x2="924" y2="122"/>
  </g>
  <g id="er-3">
    <text class="t-id" x="16" y="142">ER-3</text>
    <text class="t-b" x="62" y="142">Every check reads every contributor tree</text>
    <rect class="u" x="488" y="126" width="64" height="22" rx="3"/><text class="t-u" x="520" y="141" text-anchor="middle">uses</text>
    <rect class="o" x="588" y="126" width="64" height="22" rx="3"/><text class="t-o" x="620" y="141" text-anchor="middle">builds</text>
    <rect class="c" x="808" y="126" width="64" height="22" rx="3"/><text class="t-u" x="840" y="141" text-anchor="middle">checks</text>
    <line class="line" x1="16" y1="152" x2="924" y2="152"/>
  </g>
  <g id="er-4">
    <text class="t-id" x="16" y="172">ER-4</text>
    <text class="t-b" x="62" y="172">No new checker beside the three</text>
    <rect class="o" x="488" y="156" width="64" height="22" rx="3"/><text class="t-o" x="520" y="171" text-anchor="middle">builds</text>
    <rect class="c" x="808" y="156" width="64" height="22" rx="3"/><text class="t-u" x="840" y="171" text-anchor="middle">checks</text>
    <line class="line" x1="16" y1="182" x2="924" y2="182"/>
  </g>
  <g id="er-5">
    <text class="t-id" x="16" y="202">ER-5</text>
    <text class="t-b" x="62" y="202">The resource entry is the owner's table</text>
    <rect class="o" x="488" y="186" width="64" height="22" rx="3"/><text class="t-o" x="520" y="201" text-anchor="middle">builds</text>
    <rect class="u" x="688" y="186" width="64" height="22" rx="3"/><text class="t-u" x="720" y="201" text-anchor="middle">uses</text>
    <rect class="c" x="808" y="186" width="64" height="22" rx="3"/><text class="t-u" x="840" y="201" text-anchor="middle">checks</text>
    <line class="line" x1="16" y1="212" x2="924" y2="212"/>
  </g>
  <g id="er-6">
    <text class="t-id" x="16" y="232">ER-6</text>
    <text class="t-b" x="62" y="232">The resource rule reads the whole tree</text>
    <rect class="o" x="688" y="216" width="64" height="22" rx="3"/><text class="t-o" x="720" y="231" text-anchor="middle">builds</text>
    <rect class="c" x="808" y="216" width="64" height="22" rx="3"/><text class="t-u" x="840" y="231" text-anchor="middle">checks</text>
    <line class="line" x1="16" y1="242" x2="924" y2="242"/>
  </g>
  <g id="er-7">
    <text class="t-id" x="16" y="262">ER-7</text>
    <text class="t-b" x="62" y="262">Published pages change at release or by docs-fix</text>
    <rect class="u" x="588" y="246" width="64" height="22" rx="3"/><text class="t-u" x="620" y="261" text-anchor="middle">uses</text>
    <rect class="o" x="688" y="246" width="64" height="22" rx="3"/><text class="t-o" x="720" y="261" text-anchor="middle">builds</text>
    <rect class="c" x="808" y="246" width="64" height="22" rx="3"/><text class="t-u" x="840" y="261" text-anchor="middle">checks</text>
    <line class="line" x1="16" y1="272" x2="924" y2="272"/>
  </g>

  <g id="legend">
    <rect class="o" x="16" y="292" width="40" height="18" rx="3"/>
    <text class="t-b" x="64" y="305">decides or builds it · exactly one per rule</text>
    <rect class="u" x="360" y="292" width="40" height="18" rx="3"/>
    <text class="t-b" x="408" y="305">uses it · must not decide again</text>
    <rect class="c" x="640" y="292" width="40" height="18" rx="3"/>
    <text class="t-b" x="688" y="305">the closure checks it</text>
  </g>
</svg>
