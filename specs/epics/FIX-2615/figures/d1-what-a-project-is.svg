<svg viewBox="0 0 940 426" role="img" aria-label="D1, what a project is. Recommended: a body of work, which may have no repository. Instead of: a project is a repository, or a project is a settings bag for runs. It comes down to the first row, work without code: a body of work keeps it in the project's own files, a repository-only project refuses it, and a settings bag cannot say who may work on it. The recommendation's cost is the second row: every coding path supports two sources. Third row, stored data: nothing moves under the recommendation; requiring a repository would refuse the no-repository rows. Locks in a five-part row that enables connectors and never defines them. Flips if no planned app has work without code."
     xmlns="http://www.w3.org/2000/svg">
  <style>
    :root { --surface:#FCFCFA; --surface-2:#E8E8E1; --ink:#191C21; --ink-2:#4C535B; --ink-3:#7A828B;
            --rule:#D5D4CB; --accent:#3E4E8C; --accent-soft:#E0E3F0; --code:#2C7C69; --code-soft:#DCEDE7;
            --prose:#A8761C; --prose-soft:#F3E8D2; --gone:#A9544F; }
    @media (prefers-color-scheme: dark) {
      :root { --surface:#181C1F; --surface-2:#202528; --ink:#E6E8E5; --ink-2:#A4ACB1; --ink-3:#737B81;
              --rule:#2B3135; --accent:#8B9BD8; --accent-soft:#1B2140; --code:#5DBBA1; --code-soft:#14302A;
              --prose:#D9A44B; --prose-soft:#332612; --gone:#DE8A84; } }
    .bg     { fill:var(--surface); }
    .ask    { fill:var(--surface-2); }
    .rec    { fill:var(--code-soft); stroke:var(--code); stroke-width:1.6; }
    .lost   { fill:var(--surface); stroke:var(--rule); stroke-width:1.4; stroke-dasharray:5 4; }
    .decide { fill:var(--accent-soft); }
    .bar    { fill:var(--accent); }
    .row    { stroke:var(--rule); stroke-width:1; }
    .foot   { fill:var(--surface-2); }
    .t-lbl  { fill:var(--ink-3); font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:9.5px; letter-spacing:.1em; }
    .t-tag  { font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:9.5px; letter-spacing:.1em; font-weight:600; }
    .t-q    { fill:var(--ink); font-family:system-ui,-apple-system,sans-serif; font-weight:600; font-size:15px; }
    .t-h    { font-family:system-ui,-apple-system,sans-serif; font-weight:600; font-size:13px; }
    .t-b    { fill:var(--ink); font-family:system-ui,-apple-system,sans-serif; font-size:12px; }
    .t-s    { fill:var(--ink-2); font-family:system-ui,-apple-system,sans-serif; font-size:10.5px; }
    .mark   { font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:16px; font-weight:700; }
    .plus   { fill:var(--code); }
    .minus  { fill:var(--gone); }
    .tie    { fill:var(--ink-3); }
    .c-code { fill:var(--code); }
    .c-mute { fill:var(--ink-3); }
    .c-lost { fill:var(--ink-2); }
    .c-acc  { fill:var(--accent); }
  </style>
  <rect class="bg" x="0" y="0" width="940" height="426"/>

  <g id="the-call">
    <rect class="ask" x="16" y="14" width="908" height="48" rx="6"/>
    <text class="t-lbl" x="32" y="32">D1 · THE CALL</text>
    <text class="t-q" x="32" y="52">What is a project: a body of work, or a repository with people on it?</text>
  </g>

  <g id="options">
    <rect class="rec" x="212" y="76" width="224" height="46" rx="5"/>
    <text class="t-tag c-code" x="226" y="93">RECOMMENDED</text>
    <text class="t-h c-code" x="226" y="112">A body of work</text>
    <rect class="lost" x="452" y="76" width="224" height="46" rx="5"/>
    <text class="t-tag c-mute" x="466" y="93">INSTEAD OF</text>
    <text class="t-h c-lost" x="466" y="112">A repository</text>
    <rect class="lost" x="692" y="76" width="224" height="46" rx="5"/>
    <text class="t-tag c-mute" x="706" y="93">INSTEAD OF</text>
    <text class="t-h c-lost" x="706" y="112">A settings bag</text>
  </g>

  <g id="row-1">
    <rect class="decide" x="16" y="134" width="908" height="58" rx="4"/>
    <rect class="bar" x="16" y="134" width="4" height="58"/>
    <text class="t-lbl" x="32" y="154">WORK WITHOUT CODE</text>
    <text class="t-tag c-acc" x="32" y="182">▸ DECIDES IT</text>
    <text class="mark plus" x="220" y="159">+</text>
    <text class="t-b" x="236" y="158">Kept in its own files</text>
    <text class="t-s" x="236" y="175">research, a plan, a post</text>
    <text class="mark minus" x="460" y="159">−</text>
    <text class="t-b" x="476" y="158">Refused</text>
    <text class="t-s" x="476" y="175">no repository, no project</text>
    <text class="mark minus" x="700" y="159">−</text>
    <text class="t-b" x="716" y="158">Nobody it belongs to</text>
    <text class="t-s" x="716" y="175">who may work on it is unsaid</text>
  </g>

  <g id="row-2">
    <text class="t-lbl" x="32" y="216">WHAT IT COSTS</text>
    <text class="mark minus" x="220" y="221">−</text>
    <text class="t-b" x="236" y="220">Two sources, for good</text>
    <text class="t-s" x="236" y="237">a checkout, or the files</text>
    <text class="mark plus" x="460" y="221">+</text>
    <text class="t-b" x="476" y="220">One source</text>
    <text class="t-s" x="476" y="237">every run has a checkout</text>
    <text class="mark tie" x="700" y="221">=</text>
    <text class="t-b" x="716" y="220">Same two sources</text>
    <text class="t-s" x="716" y="237">the work is defined elsewhere</text>
    <line class="row" x1="16" y1="252" x2="924" y2="252"/>
  </g>

  <g id="row-3">
    <text class="t-lbl" x="32" y="278">STORED PROJECTS</text>
    <text class="mark plus" x="220" y="283">+</text>
    <text class="t-b" x="236" y="282">Nothing moves</text>
    <text class="t-s" x="236" y="299">today's row is the model</text>
    <text class="mark minus" x="460" y="283">−</text>
    <text class="t-b" x="476" y="282">No-repository rows refused</text>
    <text class="t-s" x="476" y="299">the owner's 2026-10-04 call undone</text>
    <text class="mark minus" x="700" y="283">−</text>
    <text class="t-b" x="716" y="282">A second record</text>
    <text class="t-s" x="716" y="299">the work lives somewhere else</text>
    <line class="row" x1="16" y1="314" x2="924" y2="314"/>
  </g>

  <g id="locks-in">
    <rect class="foot" x="16" y="324" width="446" height="74" rx="5"/>
    <text class="t-lbl" x="32" y="345">LOCKS IN</text>
    <text class="t-b" x="32" y="365">Five parts: what, who, works on, may reach, checks</text>
    <text class="t-s" x="32" y="383">a project enables connectors, never defines one</text>
  </g>
  <g id="flips-if">
    <rect class="foot" x="478" y="324" width="446" height="74" rx="5"/>
    <text class="t-lbl" x="494" y="345">FLIPS IF</text>
    <text class="t-b" x="494" y="365">No planned app has work without code</text>
    <text class="t-s" x="494" y="383">then a repository is required</text>
  </g>
</svg>
