<svg viewBox="0 0 940 426" role="img" aria-label="D3, how a host supplies connectors without a project. Recommended: the host enables a set for work outside a project. Instead of: every installed connector is on wherever there is no project, or each host gets a hidden default project. It comes down to the first row, a host that already has projects: with the recommendation nothing changes until it opts in; all on gives every conversation outside a project Linear silently; a hidden project is a second meaning of the word. The recommendation's cost is the second row: two places enable a connector. Third row, a tie: each run uses its own user's key in all three, the operator's environment variable only for the operator. Locks in one set for every user outside a project. Flips if a host needs per-user enablement outside projects."
     xmlns="http://www.w3.org/2000/svg">
  <style>
    :root { --surface:#FCFCFA; --surface-2:#E8E8E1; --ink:#191C21; --ink-2:#4C535B; --ink-3:#7A828B;
            --rule:#D5D4CB; --accent:#3E4E8C; --accent-soft:#E0E3F0; --code:#2C7C69; --code-soft:#DCEDE7;
            --prose:#A8761C; --prose-soft:#F3E8D2; --gone:#A9544F; }
    @media (prefers-color-scheme: dark) {
      :root { --surface:#181C1F; --surface-2:#202528; --ink:#E6E8E5; --ink-2:#A4ACB1; --ink-3:#737B81;
              --rule:#2B3135; --accent:#8B9BD8; --accent-soft:#1B2140; --code:#5DBBA1; --code-soft:#14302A;
              --prose:#D9A44B; --prose-soft:#332612; --gone:#DE8A84; } }
    .bg     { fill:var(--surface); }
    .ask    { fill:var(--surface-2); }
    .rec    { fill:var(--code-soft); stroke:var(--code); stroke-width:1.6; }
    .lost   { fill:var(--surface); stroke:var(--rule); stroke-width:1.4; stroke-dasharray:5 4; }
    .decide { fill:var(--accent-soft); }
    .bar    { fill:var(--accent); }
    .row    { stroke:var(--rule); stroke-width:1; }
    .foot   { fill:var(--surface-2); }
    .t-lbl  { fill:var(--ink-3); font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:9.5px; letter-spacing:.1em; }
    .t-tag  { font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:9.5px; letter-spacing:.1em; font-weight:600; }
    .t-q    { fill:var(--ink); font-family:system-ui,-apple-system,sans-serif; font-weight:600; font-size:15px; }
    .t-h    { font-family:system-ui,-apple-system,sans-serif; font-weight:600; font-size:13px; }
    .t-b    { fill:var(--ink); font-family:system-ui,-apple-system,sans-serif; font-size:12px; }
    .t-s    { fill:var(--ink-2); font-family:system-ui,-apple-system,sans-serif; font-size:10.5px; }
    .mark   { font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:16px; font-weight:700; }
    .plus   { fill:var(--code); }
    .minus  { fill:var(--gone); }
    .tie    { fill:var(--ink-3); }
    .c-code { fill:var(--code); }
    .c-mute { fill:var(--ink-3); }
    .c-lost { fill:var(--ink-2); }
    .c-acc  { fill:var(--accent); }
  </style>
  <rect class="bg" x="0" y="0" width="940" height="426"/>

  <g id="the-call">
    <rect class="ask" x="16" y="14" width="908" height="48" rx="6"/>
    <text class="t-lbl" x="32" y="32">D3 · THE CALL</text>
    <text class="t-q" x="32" y="52">With no project, does the host enable connectors itself, or is a project needed?</text>
  </g>

  <g id="options">
    <rect class="rec" x="212" y="76" width="224" height="46" rx="5"/>
    <text class="t-tag c-code" x="226" y="93">RECOMMENDED</text>
    <text class="t-h c-code" x="226" y="112">The host enables a set</text>
    <rect class="lost" x="452" y="76" width="224" height="46" rx="5"/>
    <text class="t-tag c-mute" x="466" y="93">INSTEAD OF</text>
    <text class="t-h c-lost" x="466" y="112">All installed, on</text>
    <rect class="lost" x="692" y="76" width="224" height="46" rx="5"/>
    <text class="t-tag c-mute" x="706" y="93">INSTEAD OF</text>
    <text class="t-h c-lost" x="706" y="112">A hidden project</text>
  </g>

  <g id="row-1">
    <rect class="decide" x="16" y="134" width="908" height="58" rx="4"/>
    <rect class="bar" x="16" y="134" width="4" height="58"/>
    <text class="t-lbl" x="32" y="154">A HOST THAT ALREADY</text>
    <text class="t-lbl" x="32" y="167">HAS PROJECTS</text>
    <text class="t-tag c-acc" x="32" y="182">▸ DECIDES IT</text>
    <text class="mark plus" x="220" y="159">+</text>
    <text class="t-b" x="236" y="158">Nothing changes</text>
    <text class="t-s" x="236" y="175">until it opts in</text>
    <text class="mark minus" x="460" y="159">−</text>
    <text class="t-b" x="476" y="158">Linear everywhere, silently</text>
    <text class="t-s" x="476" y="175">every unprojected conversation</text>
    <text class="mark minus" x="700" y="159">−</text>
    <text class="t-b" x="716" y="158">A second meaning of project</text>
    <text class="t-s" x="716" y="175">against FIX-2335's choice</text>
  </g>

  <g id="row-2">
    <text class="t-lbl" x="32" y="216">WHAT IT COSTS</text>
    <text class="mark minus" x="220" y="221">−</text>
    <text class="t-b" x="236" y="220">Two places enable one</text>
    <text class="t-s" x="236" y="237">a host set and a project list</text>
    <text class="mark plus" x="460" y="221">+</text>
    <text class="t-b" x="476" y="220">No list to keep</text>
    <text class="t-s" x="476" y="237">installing is enabling</text>
    <text class="mark minus" x="700" y="221">−</text>
    <text class="t-b" x="716" y="220">A row nobody made</text>
    <text class="t-s" x="716" y="237">in every host, always</text>
    <line class="row" x1="16" y1="252" x2="924" y2="252"/>
  </g>

  <g id="row-3">
    <text class="t-lbl" x="32" y="278">WHOSE KEY</text>
    <text class="mark tie" x="220" y="283">=</text>
    <text class="t-b" x="236" y="282">The run's own user</text>
    <text class="t-s" x="236" y="299">operator's variable for the operator</text>
    <text class="mark tie" x="460" y="283">=</text>
    <text class="t-b" x="476" y="282">The run's own user</text>
    <text class="t-s" x="476" y="299">the same rule</text>
    <text class="mark tie" x="700" y="283">=</text>
    <text class="t-b" x="716" y="282">The run's own user</text>
    <text class="t-s" x="716" y="299">the same rule</text>
    <line class="row" x1="16" y1="314" x2="924" y2="314"/>
  </g>

  <g id="locks-in">
    <rect class="foot" x="16" y="324" width="446" height="74" rx="5"/>
    <text class="t-lbl" x="32" y="345">LOCKS IN</text>
    <text class="t-b" x="32" y="365">Outside a project, every user gets the same set</text>
    <text class="t-s" x="32" y="383">in a project, the project's list only</text>
  </g>
  <g id="flips-if">
    <rect class="foot" x="478" y="324" width="446" height="74" rx="5"/>
    <text class="t-lbl" x="494" y="345">FLIPS IF</text>
    <text class="t-b" x="494" y="365">A host needs per-user enablement</text>
    <text class="t-s" x="494" y="383">outside projects: a bigger model</text>
  </g>
</svg>
