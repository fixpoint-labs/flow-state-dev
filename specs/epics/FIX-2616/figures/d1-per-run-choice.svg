<svg viewBox="0 0 940 414" role="img" aria-label="D1, who chooses the harness, model and plan mode. Chosen: the person's choice per run, stored once and read by the harness slot. Instead of: the harness chosen in config per worker, or a Coder line in the message text relayed by the main session, as today. It comes down to the first row: the person knows which harness and model this change wants and a worker's config is fixed before the request. The cost is the third row: a possible package change, filed as a child that blocks FIX-2598. A message line has no path to a harness block's model resolver, so a chosen model never reached a run. Locks in worker config as the default with the person's pick overriding it for a run. Flips if the path from the task to the slot needs more than one package child."
     xmlns="http://www.w3.org/2000/svg">
  <style>
    :root { --surface:#FCFCFA; --surface-2:#E8E8E1; --ink:#191C21; --ink-2:#4C535B; --ink-3:#7A828B;
            --rule:#D5D4CB; --accent:#3E4E8C; --accent-soft:#E0E3F0; --code:#2C7C69; --code-soft:#DCEDE7;
            --prose:#A8761C; --prose-soft:#F3E8D2; --gone:#A9544F; }
    @media (prefers-color-scheme: dark) {
      :root { --surface:#181C1F; --surface-2:#202528; --ink:#E6E8E5; --ink-2:#A4ACB1; --ink-3:#737B81;
              --rule:#2B3135; --accent:#8B9BD8; --accent-soft:#1B2140; --code:#5DBBA1; --code-soft:#14302A;
              --prose:#D9A44B; --prose-soft:#332612; --gone:#DE8A84; } }
    .bg     { fill:var(--surface); }
    .ask    { fill:var(--surface-2); }
    .chosen { fill:var(--code-soft); stroke:var(--code); stroke-width:1.6; }
    .rec    { fill:var(--code-soft); stroke:var(--code); stroke-width:1.6; stroke-dasharray:5 4; }
    .lost   { fill:var(--surface); stroke:var(--rule); stroke-width:1.4; stroke-dasharray:5 4; }
    .decide { fill:var(--accent-soft); }
    .bar    { fill:var(--accent); }
    .row    { stroke:var(--rule); stroke-width:1; }
    .foot   { fill:var(--surface-2); }
    .t-lbl  { fill:var(--ink-3); font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:9.5px; letter-spacing:.1em; }
    .t-tag  { font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:9.5px; letter-spacing:.1em; font-weight:600; }
    .t-q    { fill:var(--ink); font-family:system-ui,-apple-system,sans-serif; font-weight:600; font-size:15px; }
    .t-h    { font-family:system-ui,-apple-system,sans-serif; font-weight:600; font-size:14px; }
    .t-b    { fill:var(--ink); font-family:system-ui,-apple-system,sans-serif; font-size:12.5px; }
    .t-s    { fill:var(--ink-2); font-family:system-ui,-apple-system,sans-serif; font-size:11px; }
    .mark   { font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:16px; font-weight:700; }
    .plus   { fill:var(--code); }
    .minus  { fill:var(--gone); }
    .tie    { fill:var(--ink-3); }
    .c-code { fill:var(--code); }
    .c-mute { fill:var(--ink-3); }
    .c-lost { fill:var(--ink-2); }
    .c-acc  { fill:var(--accent); }
  </style>
  <rect class="bg" x="0" y="0" width="940" height="414"/>

  <g id="the-call">
    <rect class="ask" x="16" y="14" width="908" height="48" rx="6"/>
    <text class="t-lbl" x="32" y="32">D1 · THE CALL</text>
    <text class="t-q" x="32" y="52">Who chooses the harness, the model and plan mode for a run?</text>
  </g>

  <g id="options">
    <rect class="chosen" x="212" y="76" width="348" height="46" rx="5"/>
    <text class="t-tag c-code" x="228" y="93">CHOSEN</text>
    <text class="t-h c-code" x="228" y="112">The person, per run, stored once</text>
    <rect class="lost" x="576" y="76" width="348" height="46" rx="5"/>
    <text class="t-tag c-mute" x="592" y="93">INSTEAD OF</text>
    <text class="t-h c-lost" x="592" y="112">Worker config, or a line in the message</text>
  </g>

  <g id="row-1">
    <rect class="decide" x="16" y="134" width="908" height="62" rx="4"/>
    <rect class="bar" x="16" y="134" width="4" height="62"/>
    <text class="t-lbl" x="32" y="156">WHO KNOWS WHICH</text>
    <text class="t-lbl" x="32" y="169">HARNESS THE CHANGE WANTS</text>
    <text class="t-tag c-acc" x="32" y="186">▸ DECIDES IT</text>
    <text class="mark plus" x="228" y="163">+</text>
    <text class="t-b" x="248" y="162">The person, as they ask</text>
    <text class="t-s" x="248" y="180">config can't know this request</text>
    <text class="mark minus" x="592" y="163">−</text>
    <text class="t-b" x="612" y="162">A worker's config, fixed before</text>
    <text class="t-s" x="612" y="180">a message line only relays a name</text>
  </g>

  <g id="row-2">
    <text class="t-lbl" x="32" y="220">A CHOSEN MODEL</text>
    <text class="t-lbl" x="32" y="233">REACHES THE RUN</text>
    <text class="mark plus" x="228" y="225">+</text>
    <text class="t-b" x="248" y="224">A stored choice the slot reads</text>
    <text class="t-s" x="248" y="242">one choice, one reader</text>
    <text class="mark minus" x="592" y="225">−</text>
    <text class="t-b" x="612" y="224">No path to the model resolver</text>
    <text class="t-s" x="612" y="242">so a chosen model never arrives</text>
    <line class="row" x1="16" y1="250" x2="924" y2="250"/>
  </g>

  <g id="row-3">
    <text class="t-lbl" x="32" y="278">WHAT IT COSTS</text>
    <text class="mark minus" x="228" y="283">−</text>
    <text class="t-b" x="248" y="282">Maybe a package change</text>
    <text class="t-s" x="248" y="300">a child that blocks FIX-2598</text>
    <text class="mark plus" x="592" y="283">+</text>
    <text class="t-b" x="612" y="282">Nothing to build</text>
    <text class="t-s" x="612" y="300">it is what exists today</text>
    <line class="row" x1="16" y1="308" x2="924" y2="308"/>
  </g>

  <g id="locks-in">
    <rect class="foot" x="16" y="324" width="446" height="74" rx="5"/>
    <text class="t-lbl" x="32" y="345">LOCKS IN</text>
    <text class="t-b" x="32" y="365">Config is the default; a pick overrides it</text>
    <text class="t-s" x="32" y="383">ER-2; amends FIX-2152 ER-9 and FIX-2157 D5</text>
  </g>

  <g id="flips-if">
    <rect class="foot" x="478" y="324" width="446" height="74" rx="5"/>
    <text class="t-lbl" x="494" y="345">FLIPS IF</text>
    <text class="t-b" x="494" y="365">The path needs more than one package child</text>
    <text class="t-s" x="494" y="383">then per-run choice is its own epic</text>
  </g>
</svg>
