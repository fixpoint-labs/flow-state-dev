<svg viewBox="0 0 940 214" role="img" aria-label="Who owns what: three rules across FIX-2597 the harness packages, FIX-2598 the harness and model selector, FIX-2599 plan mode, FIX-2617 the closure and the coordinator. Each rule has exactly one owner. ER-1 A harness is asked what it offers: owned by FIX-2597. ER-2 The choice is stored once and read by the harness slot: owned by FIX-2598. ER-3 Consumed issues keep their parents: owned by the coordinator. The closure checks every rule but ER-3." xmlns="http://www.w3.org/2000/svg">
  <style>
    :root { --surface:#FCFCFA; --surface-2:#E8E8E1; --ink:#191C21; --ink-2:#4C535B; --ink-3:#7A828B;
            --rule:#D5D4CB; --accent:#3E4E8C; --accent-soft:#E0E3F0; --code:#2C7C69; --code-soft:#DCEDE7; }
    @media (prefers-color-scheme: dark) {
      :root { --surface:#181C1F; --surface-2:#202528; --ink:#E6E8E5; --ink-2:#A4ACB1; --ink-3:#737B81;
              --rule:#2B3135; --accent:#8B9BD8; --accent-soft:#1B2140; --code:#5DBBA1; --code-soft:#14302A; } }
    .bg   { fill:var(--surface); }
    .line { stroke:var(--rule); stroke-width:1; }
    .o    { fill:var(--code-soft); stroke:var(--code); stroke-width:1.4; }
    .u    { fill:var(--accent-soft); }
    .c    { fill:var(--surface); stroke:var(--accent); stroke-width:1; stroke-dasharray:3 3; }
    .t-lbl { fill:var(--ink-3); font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:9.5px; letter-spacing:.06em; }
    .t-col { fill:var(--ink); font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:11px; font-weight:600; }
    .t-b   { fill:var(--ink); font-family:system-ui,-apple-system,sans-serif; font-size:12.5px; }
    .t-id  { fill:var(--ink-3); font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:10.5px; }
    .t-o   { fill:var(--code); font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:10px; font-weight:600; }
    .t-u   { fill:var(--accent); font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:10px; }
  </style>
  <rect class="bg" x="0" y="0" width="940" height="214"/>

  <g id="columns">
    <text class="t-col" x="392" y="36" text-anchor="middle">2597</text>
    <text class="t-lbl" x="392" y="52" text-anchor="middle">harness</text>
    <text class="t-col" x="504" y="36" text-anchor="middle">2598</text>
    <text class="t-lbl" x="504" y="52" text-anchor="middle">selector</text>
    <text class="t-col" x="616" y="36" text-anchor="middle">2599</text>
    <text class="t-lbl" x="616" y="52" text-anchor="middle">plan</text>
    <text class="t-col" x="728" y="36" text-anchor="middle">2617</text>
    <text class="t-lbl" x="728" y="52" text-anchor="middle">closure</text>
    <text class="t-col" x="840" y="36" text-anchor="middle">Coord.</text>
    <text class="t-lbl" x="840" y="52" text-anchor="middle">the loop</text>
    <line class="line" x1="16" y1="62" x2="924" y2="62"/>
  </g>

  <g id="er-1">
    <text class="t-id" x="16" y="82">ER-1</text>
    <text class="t-b" x="62" y="82">A harness is asked what it offers</text>
    <rect class="o" x="360" y="66" width="64" height="22" rx="3"/>
    <text class="t-o" x="392" y="81" text-anchor="middle">owns</text>
    <rect class="u" x="472" y="66" width="64" height="22" rx="3"/>
    <text class="t-u" x="504" y="81" text-anchor="middle">uses</text>
    <rect class="u" x="584" y="66" width="64" height="22" rx="3"/>
    <text class="t-u" x="616" y="81" text-anchor="middle">uses</text>
    <rect class="c" x="696" y="66" width="64" height="22" rx="3"/>
    <text class="t-u" x="728" y="81" text-anchor="middle">checks</text>
    <line class="line" x1="16" y1="92" x2="924" y2="92"/>
  </g>
  <g id="er-2">
    <text class="t-id" x="16" y="112">ER-2</text>
    <text class="t-b" x="62" y="112">Choice stored once, read by the slot</text>
    <rect class="u" x="360" y="96" width="64" height="22" rx="3"/>
    <text class="t-u" x="392" y="111" text-anchor="middle">uses</text>
    <rect class="o" x="472" y="96" width="64" height="22" rx="3"/>
    <text class="t-o" x="504" y="111" text-anchor="middle">owns</text>
    <rect class="u" x="584" y="96" width="64" height="22" rx="3"/>
    <text class="t-u" x="616" y="111" text-anchor="middle">uses</text>
    <rect class="c" x="696" y="96" width="64" height="22" rx="3"/>
    <text class="t-u" x="728" y="111" text-anchor="middle">checks</text>
    <line class="line" x1="16" y1="122" x2="924" y2="122"/>
  </g>
  <g id="er-3">
    <text class="t-id" x="16" y="142">ER-3</text>
    <text class="t-b" x="62" y="142">Consumed issues keep their parents</text>
    <rect class="o" x="808" y="126" width="64" height="22" rx="3"/>
    <text class="t-o" x="840" y="141" text-anchor="middle">owns</text>
    <line class="line" x1="16" y1="152" x2="924" y2="152"/>
  </g>

  <g id="legend">
    <rect class="o" x="16" y="174" width="40" height="18" rx="3"/>
    <text class="t-b" x="64" y="187">decides or builds it · exactly one per rule</text>
    <rect class="u" x="360" y="174" width="40" height="18" rx="3"/>
    <text class="t-b" x="408" y="187">uses it · must not decide again</text>
    <rect class="c" x="640" y="174" width="40" height="18" rx="3"/>
    <text class="t-b" x="688" y="187">the closure checks it</text>
  </g>
</svg>
