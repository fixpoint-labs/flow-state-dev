<svg viewBox="0 0 940 418" role="img" aria-label="O3, decided by the owner: every client write to a user or org resource goes through a flow, chosen, beside a declared write rule that writes the resource directly. Decides it: the validators, schema, owner fence and optional canWrite, live inside one path, so no second write path drifts from the first. A pin is still one line: runBy default names the framework&#x27;s default write flow. Price: each write records a request, which is also its audit trail. Locks in runBy as the only client write path, with FIX-1945 D1 kept. Flips if request records per write prove costly; then trim what the default flow records, never add a direct path."
     xmlns="http://www.w3.org/2000/svg">
  <style>
    :root { --surface:#FCFCFA; --surface-2:#E8E8E1; --ink:#191C21; --ink-2:#4C535B; --ink-3:#7A828B;
            --rule:#D5D4CB; --accent:#3E4E8C; --accent-soft:#E0E3F0; --code:#2C7C69; --code-soft:#DCEDE7;
            --prose:#A8761C; --prose-soft:#F3E8D2; --gone:#A9544F; }
    @media (prefers-color-scheme: dark) {
      :root { --surface:#181C1F; --surface-2:#202528; --ink:#E6E8E5; --ink-2:#A4ACB1; --ink-3:#737B81;
              --rule:#2B3135; --accent:#8B9BD8; --accent-soft:#1B2140; --code:#5DBBA1; --code-soft:#14302A;
              --prose:#D9A44B; --prose-soft:#332612; --gone:#DE8A84; } }
    .bg     { fill:var(--surface); }
    .ask    { fill:var(--surface-2); }
    .chosen { fill:var(--code-soft); stroke:var(--code); stroke-width:1.6; }
    .rec    { fill:var(--code-soft); stroke:var(--code); stroke-width:1.6; stroke-dasharray:5 4; }
    .lost   { fill:var(--surface); stroke:var(--rule); stroke-width:1.4; stroke-dasharray:5 4; }
    .decide { fill:var(--accent-soft); }
    .bar    { fill:var(--accent); }
    .row    { stroke:var(--rule); stroke-width:1; }
    .foot   { fill:var(--surface-2); }
    .box    { fill:var(--code-soft); stroke:var(--code); stroke-width:1.6; }
    .chip   { fill:var(--surface); stroke:var(--code); stroke-width:1; }
    .app    { fill:var(--accent-soft); stroke:var(--accent); stroke-width:1.4; }
    .one    { fill:var(--surface); stroke:var(--rule); stroke-width:1.4; }
    .none   { fill:var(--surface); stroke:var(--gone); stroke-width:1.2; stroke-dasharray:5 4; }
    .fence  { stroke:var(--gone); stroke-width:2; stroke-dasharray:8 5; }
    .o      { fill:var(--code-soft); stroke:var(--code); stroke-width:1.4; }
    .u      { fill:var(--accent-soft); }
    .c      { fill:var(--surface); stroke:var(--accent); stroke-width:1; stroke-dasharray:3 3; }
    .t-lbl  { fill:var(--ink-3); font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:9.5px; letter-spacing:.1em; }
    .t-tag  { font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:9.5px; letter-spacing:.1em; font-weight:600; }
    .t-q    { fill:var(--ink); font-family:system-ui,-apple-system,sans-serif; font-weight:600; font-size:15px; }
    .t-h    { font-family:system-ui,-apple-system,sans-serif; font-weight:600; font-size:14px; }
    .t-b    { fill:var(--ink); font-family:system-ui,-apple-system,sans-serif; font-size:12.5px; }
    .t-s    { fill:var(--ink-2); font-family:system-ui,-apple-system,sans-serif; font-size:11px; }
    .t-col  { fill:var(--ink); font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:10.5px; font-weight:600; }
    .t-id   { fill:var(--ink-3); font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:10.5px; }
    .t-o    { fill:var(--code); font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:9.5px; font-weight:600; }
    .t-u    { fill:var(--accent); font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:9.5px; }
    .mark   { font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:16px; font-weight:700; }
    .plus   { fill:var(--code); }
    .minus  { fill:var(--gone); }
    .tie    { fill:var(--ink-3); }
    .c-code { fill:var(--code); }
    .c-mute { fill:var(--ink-3); }
    .c-lost { fill:var(--ink-2); }
    .c-acc  { fill:var(--accent); }
    .c-gone { fill:var(--gone); }
  </style>
  <rect class="bg" x="0" y="0" width="940" height="418"/>
  <g id="the-call">
    <rect class="ask" x="16" y="14" width="908" height="48" rx="6"/>
    <text class="t-lbl" x="32" y="32">O3 · DECIDED BY THE OWNER · THE CALL</text>
    <text class="t-q" x="32" y="52">Does every client write go through a flow, or may plain data be written directly?</text>
  </g>
  <g id="options">
    <rect class="chosen" x="212" y="76" width="348" height="46" rx="5"/>
    <text class="t-tag c-code" x="228" y="93">CHOSEN</text>
    <text class="t-h c-code" x="228" y="112">One path: runBy, with a default flow</text>
    <rect class="lost" x="576" y="76" width="348" height="46" rx="5"/>
    <text class="t-tag c-mute" x="592" y="93">INSTEAD OF</text>
    <text class="t-h c-lost" x="592" y="112">A direct write rule beside runBy</text>
  </g>
  <g id="row-1">
    <rect class="decide" x="16" y="134" width="908" height="62" rx="4"/>
    <rect class="bar" x="16" y="134" width="4" height="62"/>
    <text class="t-lbl" x="32" y="156">WHERE THE</text>
    <text class="t-lbl" x="32" y="169">VALIDATORS LIVE</text>
    <text class="t-tag c-acc" x="32" y="186">▸ DECIDES IT</text>
    <text class="mark plus" x="228" y="163">+</text>
    <text class="t-b" x="248" y="162">Inside the one flow path</text>
    <text class="t-s" x="248" y="180">schema, owner fence, canWrite; FIX-1945 kept</text>
    <text class="mark minus" x="592" y="163">−</text>
    <text class="t-b" x="612" y="162">In a second path, kept in step</text>
    <text class="t-s" x="612" y="180">a check added to one is missed by the other</text>
  </g>
  <g id="row-2">
    <text class="t-lbl" x="32" y="218">A PIN: PLAIN</text>
    <text class="t-lbl" x="32" y="231">ADD AND REMOVE</text>
    <text class="mark tie" x="228" y="225">=</text>
    <text class="t-b" x="248" y="224">One line on the client</text>
    <text class="t-s" x="248" y="242">runBy: "default"; no hand-written flow</text>
    <text class="mark tie" x="592" y="225">=</text>
    <text class="t-b" x="612" y="224">One line on the client</text>
    <text class="t-s" x="612" y="242">a direct write, like a file</text>
    <line class="row" x1="16" y1="254" x2="924" y2="254"/>
  </g>
  <g id="row-3">
    <text class="t-lbl" x="32" y="276">WHAT A WRITE</text>
    <text class="t-lbl" x="32" y="289">LEAVES BEHIND</text>
    <text class="mark minus" x="228" y="283">−</text>
    <text class="t-b" x="248" y="282">A request per write</text>
    <text class="t-s" x="248" y="300">a row and a trace; also the audit trail</text>
    <text class="mark plus" x="592" y="283">+</text>
    <text class="t-b" x="612" y="282">Only the new state</text>
    <text class="t-s" x="612" y="300">no record of who changed it, or why</text>
    <line class="row" x1="16" y1="312" x2="924" y2="312"/>
  </g>
  <g id="locks-in">
    <rect class="foot" x="16" y="328" width="446" height="74" rx="5"/>
    <text class="t-lbl" x="32" y="349">LOCKS IN</text>
    <text class="t-b" x="32" y="369">runBy is the only client write path</text>
    <text class="t-s" x="32" y="387">a resource with no runBy can't be written from a client</text>
  </g>
  <g id="flips-if">
    <rect class="foot" x="478" y="328" width="446" height="74" rx="5"/>
    <text class="t-lbl" x="494" y="349">FLIPS IF</text>
    <text class="t-b" x="494" y="369">Request records per write prove costly</text>
    <text class="t-s" x="494" y="387">then trim what the default flow keeps; no direct path</text>
  </g>
</svg>
