<svg viewBox="0 0 940 418" role="img" aria-label="O5, open: the installable unit&#x27;s name. Recommended: kit. Instead of: extension, or pack (add-on is discussed in the card). Decides it: what the word promises; extension promises the third-party ecosystem the epic rules out. Price: kit needs FIX-2246&#x27;s retire narrowed to the session-factory sense. Pack collides with harness-manager&#x27;s held git pack. Flips if kit reads as a starter template; then pack."
     xmlns="http://www.w3.org/2000/svg">
  <style>
    :root { --surface:#FCFCFA; --surface-2:#E8E8E1; --ink:#191C21; --ink-2:#4C535B; --ink-3:#7A828B;
            --rule:#D5D4CB; --accent:#3E4E8C; --accent-soft:#E0E3F0; --code:#2C7C69; --code-soft:#DCEDE7;
            --prose:#A8761C; --prose-soft:#F3E8D2; --gone:#A9544F; }
    @media (prefers-color-scheme: dark) {
      :root { --surface:#181C1F; --surface-2:#202528; --ink:#E6E8E5; --ink-2:#A4ACB1; --ink-3:#737B81;
              --rule:#2B3135; --accent:#8B9BD8; --accent-soft:#1B2140; --code:#5DBBA1; --code-soft:#14302A;
              --prose:#D9A44B; --prose-soft:#332612; --gone:#DE8A84; } }
    .bg     { fill:var(--surface); }
    .ask    { fill:var(--surface-2); }
    .chosen { fill:var(--code-soft); stroke:var(--code); stroke-width:1.6; }
    .rec    { fill:var(--code-soft); stroke:var(--code); stroke-width:1.6; stroke-dasharray:5 4; }
    .lost   { fill:var(--surface); stroke:var(--rule); stroke-width:1.4; stroke-dasharray:5 4; }
    .decide { fill:var(--accent-soft); }
    .bar    { fill:var(--accent); }
    .row    { stroke:var(--rule); stroke-width:1; }
    .foot   { fill:var(--surface-2); }
    .box    { fill:var(--code-soft); stroke:var(--code); stroke-width:1.6; }
    .chip   { fill:var(--surface); stroke:var(--code); stroke-width:1; }
    .app    { fill:var(--accent-soft); stroke:var(--accent); stroke-width:1.4; }
    .one    { fill:var(--surface); stroke:var(--rule); stroke-width:1.4; }
    .none   { fill:var(--surface); stroke:var(--gone); stroke-width:1.2; stroke-dasharray:5 4; }
    .fence  { stroke:var(--gone); stroke-width:2; stroke-dasharray:8 5; }
    .o      { fill:var(--code-soft); stroke:var(--code); stroke-width:1.4; }
    .u      { fill:var(--accent-soft); }
    .c      { fill:var(--surface); stroke:var(--accent); stroke-width:1; stroke-dasharray:3 3; }
    .t-lbl  { fill:var(--ink-3); font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:9.5px; letter-spacing:.1em; }
    .t-tag  { font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:9.5px; letter-spacing:.1em; font-weight:600; }
    .t-q    { fill:var(--ink); font-family:system-ui,-apple-system,sans-serif; font-weight:600; font-size:15px; }
    .t-h    { font-family:system-ui,-apple-system,sans-serif; font-weight:600; font-size:14px; }
    .t-b    { fill:var(--ink); font-family:system-ui,-apple-system,sans-serif; font-size:12.5px; }
    .t-s    { fill:var(--ink-2); font-family:system-ui,-apple-system,sans-serif; font-size:11px; }
    .t-col  { fill:var(--ink); font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:10.5px; font-weight:600; }
    .t-id   { fill:var(--ink-3); font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:10.5px; }
    .t-o    { fill:var(--code); font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:9.5px; font-weight:600; }
    .t-u    { fill:var(--accent); font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:9.5px; }
    .mark   { font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:16px; font-weight:700; }
    .plus   { fill:var(--code); }
    .minus  { fill:var(--gone); }
    .tie    { fill:var(--ink-3); }
    .c-code { fill:var(--code); }
    .c-mute { fill:var(--ink-3); }
    .c-lost { fill:var(--ink-2); }
    .c-acc  { fill:var(--accent); }
    .c-gone { fill:var(--gone); }
  </style>
  <rect class="bg" x="0" y="0" width="940" height="418"/>
  <g id="the-call">
    <rect class="ask" x="16" y="14" width="908" height="48" rx="6"/>
    <text class="t-lbl" x="32" y="32">O5 · OPEN · THE CALL</text>
    <text class="t-q" x="32" y="52">What is the installable unit called?</text>
  </g>
  <g id="options">
    <rect class="rec" x="212" y="76" width="224" height="46" rx="5"/>
    <text class="t-tag c-code" x="228" y="93">RECOMMENDED</text>
    <text class="t-h c-code" x="228" y="112">kit</text>
    <rect class="lost" x="452" y="76" width="224" height="46" rx="5"/>
    <text class="t-tag c-mute" x="468" y="93">INSTEAD OF</text>
    <text class="t-h c-lost" x="468" y="112">extension</text>
    <rect class="lost" x="692" y="76" width="224" height="46" rx="5"/>
    <text class="t-tag c-mute" x="708" y="93">INSTEAD OF</text>
    <text class="t-h c-lost" x="708" y="112">pack</text>
  </g>
  <g id="row-1">
    <rect class="decide" x="16" y="134" width="908" height="62" rx="4"/>
    <rect class="bar" x="16" y="134" width="4" height="62"/>
    <text class="t-lbl" x="32" y="156">WHAT IT PROMISES</text>
    <text class="t-lbl" x="32" y="169">THE READER</text>
    <text class="t-tag c-acc" x="32" y="186">▸ DECIDES IT</text>
    <text class="mark plus" x="228" y="163">+</text>
    <text class="t-b" x="248" y="162">Pieces that go together</text>
    <text class="t-s" x="248" y="180">FSD&#x27;s own unit, no store</text>
    <text class="mark minus" x="468" y="163">−</text>
    <text class="t-b" x="488" y="162">Third-party add-ons</text>
    <text class="t-s" x="488" y="180">the ecosystem we rule out</text>
    <text class="mark plus" x="708" y="163">+</text>
    <text class="t-b" x="728" y="162">Pieces that go together</text>
    <text class="t-s" x="728" y="180">plain and short</text>
  </g>
  <g id="row-2">
    <text class="t-lbl" x="32" y="218">WHAT IT COLLIDES</text>
    <text class="t-lbl" x="32" y="231">WITH TODAY</text>
    <text class="mark minus" x="228" y="225">−</text>
    <text class="t-b" x="248" y="224">FIX-2246 retires one sense</text>
    <text class="t-s" x="248" y="242">narrow it; FIX-1651, FIX-1649</text>
    <text class="mark minus" x="468" y="225">−</text>
    <text class="t-b" x="488" y="224">File extensions, objectives</text>
    <text class="t-s" x="488" y="242">and every editor&#x27;s word</text>
    <text class="mark minus" x="708" y="225">−</text>
    <text class="t-b" x="728" y="224">A held git pack</text>
    <text class="t-s" x="728" y="242">harness-manager&#x27;s pack</text>
    <line class="row" x1="16" y1="254" x2="924" y2="254"/>
  </g>
  <g id="row-3">
    <text class="t-lbl" x="32" y="276">IN CODE</text>
    <text class="mark plus" x="228" y="283">+</text>
    <text class="t-b" x="248" y="282">defineKit, kits: [...]</text>
    <text class="t-s" x="248" y="300">short identifiers</text>
    <text class="mark tie" x="468" y="283">=</text>
    <text class="t-b" x="488" y="282">defineExtension</text>
    <text class="t-s" x="488" y="300">long but clear</text>
    <text class="mark plus" x="708" y="283">+</text>
    <text class="t-b" x="728" y="282">definePack</text>
    <text class="t-s" x="728" y="300">short</text>
    <line class="row" x1="16" y1="312" x2="924" y2="312"/>
  </g>
  <g id="locks-in">
    <rect class="foot" x="16" y="328" width="446" height="74" rx="5"/>
    <text class="t-lbl" x="32" y="349">LOCKS IN</text>
    <text class="t-b" x="32" y="369">A glossary entry and a narrowed retire</text>
    <text class="t-s" x="32" y="387">FIX-2619 edits both in one PR</text>
  </g>
  <g id="flips-if">
    <rect class="foot" x="478" y="328" width="446" height="74" rx="5"/>
    <text class="t-lbl" x="494" y="349">FLIPS IF</text>
    <text class="t-b" x="494" y="369">You read kit as a starter template</text>
    <text class="t-s" x="494" y="387">then pack: its one collision is internal</text>
  </g>
</svg>
