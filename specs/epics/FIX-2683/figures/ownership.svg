<svg viewBox="0 0 940 324" role="img" aria-label="Who owns what: seven rules across the children of FIX-2683. Columns: inv, the one-inventory child; t1, t2, t3, Teammates' people, conversations and task cards; s1, s2, s3, Shift Manager's Inbox and boards, directory, and conversations; coord, the coordinator; and the closure. ER-1, screens read only views, direct reads and package hooks: owned by inv, used by all six job children. ER-2, one inventory per app, red until met: owned by inv, used by all six. ER-3, no legacy path, the old one goes in the same PR: owned by coord, used by all six. ER-4, neither read model grows: owned by coord. ER-5, an answer across sessions is one view: owned by s1, used by t3 and s2. ER-6, no new kit or shared package: owned by coord, used by all six. ER-7, deletion lands file by file on FIX-2755's layout: owned by coord, used by all six. The closure checks ER-1, 2, 3, 5 and 7."
     xmlns="http://www.w3.org/2000/svg">
  <style>
    :root { --surface:#FCFCFA; --ink:#191C21; --ink-3:#7A828B; --rule:#D5D4CB; --accent:#3E4E8C;
            --accent-soft:#E0E3F0; --code:#2C7C69; --code-soft:#DCEDE7; }
    @media (prefers-color-scheme: dark) {
      :root { --surface:#181C1F; --ink:#E6E8E5; --ink-3:#737B81; --rule:#2B3135; --accent:#8B9BD8;
              --accent-soft:#1B2140; --code:#5DBBA1; --code-soft:#14302A; } }
    .bg    { fill:var(--surface); }
    .row   { stroke:var(--rule); stroke-width:1; }
    .o     { fill:var(--code-soft); stroke:var(--code); stroke-width:1.4; }
    .u     { fill:var(--accent-soft); }
    .c     { fill:var(--surface); stroke:var(--accent); stroke-width:1; stroke-dasharray:3 3; }
    .t-lbl { fill:var(--ink-3); font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:9.5px; letter-spacing:.1em; }
    .t-b   { fill:var(--ink); font-family:system-ui,-apple-system,sans-serif; font-size:12.5px; }
    .t-col { fill:var(--ink); font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:10.5px; font-weight:600; }
    .t-id  { fill:var(--ink-3); font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:10.5px; }
    .t-o   { fill:var(--code); font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:9.5px; font-weight:600; }
    .t-u   { fill:var(--accent); font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:9.5px; }
  </style>
  <rect class="bg" x="0" y="0" width="940" height="324"/>
  <g id="columns">
    <text class="t-col" x="498" y="34" text-anchor="middle">inv</text>
    <text class="t-lbl" x="498" y="50" text-anchor="middle">rules</text>
    <text class="t-col" x="548" y="34" text-anchor="middle">t1</text>
    <text class="t-lbl" x="548" y="50" text-anchor="middle">people</text>
    <text class="t-col" x="598" y="34" text-anchor="middle">t2</text>
    <text class="t-lbl" x="598" y="50" text-anchor="middle">convo</text>
    <text class="t-col" x="648" y="34" text-anchor="middle">t3</text>
    <text class="t-lbl" x="648" y="50" text-anchor="middle">tasks</text>
    <text class="t-col" x="698" y="34" text-anchor="middle">s1</text>
    <text class="t-lbl" x="698" y="50" text-anchor="middle">inbox</text>
    <text class="t-col" x="748" y="34" text-anchor="middle">s2</text>
    <text class="t-lbl" x="748" y="50" text-anchor="middle">dir</text>
    <text class="t-col" x="798" y="34" text-anchor="middle">s3</text>
    <text class="t-lbl" x="798" y="50" text-anchor="middle">convo</text>
    <text class="t-col" x="848" y="34" text-anchor="middle">coord</text>
    <text class="t-col" x="898" y="34" text-anchor="middle">close</text>
    <line class="row" x1="16" y1="60" x2="924" y2="60"/>
  </g>
  <g id="er-1">
    <text class="t-id" x="16" y="80">ER-1</text>
    <text class="t-b" x="64" y="80">Screens read only views, direct reads, package hooks</text>
    <rect class="o" x="476" y="64" width="44" height="22" rx="3"/><text class="t-o" x="498" y="79" text-anchor="middle">owns</text>
    <rect class="u" x="526" y="64" width="294" height="22" rx="3"/><text class="t-u" x="673" y="79" text-anchor="middle">uses · every job child</text>
    <rect class="c" x="876" y="64" width="44" height="22" rx="3"/><text class="t-u" x="898" y="79" text-anchor="middle">checks</text>
    <line class="row" x1="16" y1="90" x2="924" y2="90"/>
  </g>
  <g id="er-2">
    <text class="t-id" x="16" y="110">ER-2</text>
    <text class="t-b" x="64" y="110">One inventory per app, red until met</text>
    <rect class="o" x="476" y="94" width="44" height="22" rx="3"/><text class="t-o" x="498" y="109" text-anchor="middle">owns</text>
    <rect class="u" x="526" y="94" width="294" height="22" rx="3"/><text class="t-u" x="673" y="109" text-anchor="middle">uses · every job child</text>
    <rect class="c" x="876" y="94" width="44" height="22" rx="3"/><text class="t-u" x="898" y="109" text-anchor="middle">checks</text>
    <line class="row" x1="16" y1="120" x2="924" y2="120"/>
  </g>
  <g id="er-3">
    <text class="t-id" x="16" y="140">ER-3</text>
    <text class="t-b" x="64" y="140">No legacy path: the old one goes in the same PR</text>
    <rect class="u" x="526" y="124" width="294" height="22" rx="3"/><text class="t-u" x="673" y="139" text-anchor="middle">uses · every job child</text>
    <rect class="o" x="826" y="124" width="44" height="22" rx="3"/><text class="t-o" x="848" y="139" text-anchor="middle">owns</text>
    <rect class="c" x="876" y="124" width="44" height="22" rx="3"/><text class="t-u" x="898" y="139" text-anchor="middle">checks</text>
    <line class="row" x1="16" y1="150" x2="924" y2="150"/>
  </g>
  <g id="er-4">
    <text class="t-id" x="16" y="170">ER-4</text>
    <text class="t-b" x="64" y="170">Neither read model grows, from any epic</text>
    <rect class="o" x="826" y="154" width="44" height="22" rx="3"/><text class="t-o" x="848" y="169" text-anchor="middle">owns</text>
    <line class="row" x1="16" y1="180" x2="924" y2="180"/>
  </g>
  <g id="er-5">
    <text class="t-id" x="16" y="200">ER-5</text>
    <text class="t-b" x="64" y="200">An answer across sessions is one view on the server</text>
    <rect class="u" x="626" y="184" width="44" height="22" rx="3"/><text class="t-u" x="648" y="199" text-anchor="middle">uses</text>
    <rect class="o" x="676" y="184" width="44" height="22" rx="3"/><text class="t-o" x="698" y="199" text-anchor="middle">owns</text>
    <rect class="u" x="726" y="184" width="44" height="22" rx="3"/><text class="t-u" x="748" y="199" text-anchor="middle">uses</text>
    <rect class="c" x="876" y="184" width="44" height="22" rx="3"/><text class="t-u" x="898" y="199" text-anchor="middle">checks</text>
    <line class="row" x1="16" y1="210" x2="924" y2="210"/>
  </g>
  <g id="er-6">
    <text class="t-id" x="16" y="230">ER-6</text>
    <text class="t-b" x="64" y="230">No new kit or shared package; copies stay copies</text>
    <rect class="u" x="526" y="214" width="294" height="22" rx="3"/><text class="t-u" x="673" y="229" text-anchor="middle">uses · every job child</text>
    <rect class="o" x="826" y="214" width="44" height="22" rx="3"/><text class="t-o" x="848" y="229" text-anchor="middle">owns</text>
    <line class="row" x1="16" y1="240" x2="924" y2="240"/>
  </g>
  <g id="er-7">
    <text class="t-id" x="16" y="260">ER-7</text>
    <text class="t-b" x="64" y="260">Deletion lands file by file on FIX-2755's layout</text>
    <rect class="u" x="526" y="244" width="294" height="22" rx="3"/><text class="t-u" x="673" y="259" text-anchor="middle">uses · every job child</text>
    <rect class="o" x="826" y="244" width="44" height="22" rx="3"/><text class="t-o" x="848" y="259" text-anchor="middle">owns</text>
    <rect class="c" x="876" y="244" width="44" height="22" rx="3"/><text class="t-u" x="898" y="259" text-anchor="middle">checks</text>
    <line class="row" x1="16" y1="270" x2="924" y2="270"/>
  </g>
  <g id="legend">
    <rect class="o" x="16" y="290" width="40" height="18" rx="3"/>
    <text class="t-b" x="64" y="303">decides or builds it · exactly one per rule</text>
    <rect class="u" x="360" y="290" width="40" height="18" rx="3"/>
    <text class="t-b" x="408" y="303">uses it · must not decide again</text>
    <rect class="c" x="640" y="290" width="40" height="18" rx="3"/>
    <text class="t-b" x="688" y="303">the closure checks it</text>
  </g>
</svg>
