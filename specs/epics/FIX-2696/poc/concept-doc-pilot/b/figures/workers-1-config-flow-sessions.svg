<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 400" width="920" height="400" role="img" aria-label="Three columns. Left: where a worker's configuration lives, either Alice's own data or the files. Middle: the worker flows, one registered copy each. Right: sessions, each belonging to one user. Solid lines run from each worker to the flow it names; dashed lines run from each session to the flow it runs on.">
  <style>
    text{font:13px -apple-system,Segoe UI,Helvetica,Arial,sans-serif;fill:#1a1a1a}
    .h{font-weight:600;font-size:13px}
    .sub{font-size:11px;fill:#555}
    .box{fill:#f4f6f8;stroke:#8a94a0;stroke-width:1.2}
    .item{fill:#fff;stroke:#8a94a0;stroke-width:1}
    .flow{fill:#e8f0fb;stroke:#4a74b4;stroke-width:1.4}
    .ses{fill:#fff7e6;stroke:#b8862b;stroke-width:1}
    .ln{stroke:#4a74b4;stroke-width:1.3;fill:none}
    .ls{stroke:#b8862b;stroke-width:1.3;fill:none;stroke-dasharray:4 3}
  </style>
  <rect width="920" height="400" fill="#fff"/>
  <text class="h" x="20" y="24">Worker configuration</text>
  <text class="h" x="340" y="24">Worker flows</text>
  <text class="sub" x="340" y="40">one registered copy each</text>
  <text class="h" x="640" y="24">Sessions</text>
  <text class="sub" x="640" y="40">each belongs to one user</text>

  <rect class="box" x="20" y="50" width="240" height="112" rx="6"/>
  <text class="h" x="32" y="70">Alice's data · private to Alice</text>
  <rect class="item" x="32" y="80" width="216" height="26" rx="4"/><text x="42" y="98">writer (own worker)</text>
  <rect class="item" x="32" y="114" width="216" height="26" rx="4"/><text x="42" y="132">researcher (her edited copy)</text>

  <rect class="box" x="20" y="182" width="240" height="180" rx="6"/>
  <text class="h" x="32" y="202">Files · the same for every user</text>
  <rect class="item" x="32" y="212" width="216" height="26" rx="4"/><text x="42" y="230">researcher (standard worker)</text>
  <rect class="item" x="32" y="272" width="216" height="26" rx="4"/><text x="42" y="290">eng.coder (standard worker)</text>
  <rect class="item" x="32" y="332" width="216" height="26" rx="4"/><text x="42" y="350">launch (standard worker)</text>

  <rect class="flow" x="340" y="60" width="220" height="140" rx="6"/>
  <text class="h" x="352" y="84">agent</text>
  <text class="sub" x="352" y="102">answers and does open-ended work</text>
  <rect class="flow" x="340" y="222" width="220" height="50" rx="6"/>
  <text class="h" x="352" y="244">coder</text><text class="sub" x="352" y="262">drives a coding harness</text>
  <rect class="flow" x="340" y="290" width="220" height="50" rx="6"/>
  <text class="h" x="352" y="312">coordinator</text><text class="sub" x="352" y="330">hands work to delegates</text>

  <path class="ln" d="M248 93 L340 93"/>
  <path class="ln" d="M248 127 L340 127"/>
  <path class="ln" d="M248 225 L340 170"/>
  <path class="ln" d="M248 285 L340 247"/>
  <path class="ln" d="M248 345 L340 315"/>

  <rect class="ses" x="640" y="62" width="260" height="26" rx="4"/><text x="650" y="80">Alice · researcher (her copy)</text>
  <rect class="ses" x="640" y="96" width="260" height="26" rx="4"/><text x="650" y="114">Alice · writer</text>
  <rect class="ses" x="640" y="130" width="260" height="26" rx="4"/><text x="650" y="148">Bob · researcher (the file's)</text>
  <rect class="ses" x="640" y="234" width="260" height="26" rx="4"/><text x="650" y="252">Alice · eng.coder, one task</text>
  <rect class="ses" x="640" y="302" width="260" height="26" rx="4"/><text x="650" y="320">Alice · launch conversation</text>

  <path class="ls" d="M640 75 L560 90"/>
  <path class="ls" d="M640 109 L560 115"/>
  <path class="ls" d="M640 143 L560 140"/>
  <path class="ls" d="M640 247 L560 247"/>
  <path class="ls" d="M640 315 L560 315"/>
</svg>
