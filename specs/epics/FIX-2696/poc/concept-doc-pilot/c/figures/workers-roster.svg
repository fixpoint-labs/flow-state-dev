<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 372">
<style>
.solid{fill:none;stroke:#1b1a15;stroke-width:1.4}.dash{fill:none;stroke:#1b1a15;stroke-width:1.4;stroke-dasharray:5 4}
.ln{fill:none;stroke:#1b1a15;stroke-width:1.3}.thin{fill:none;stroke:#1b1a15;stroke-width:1}
.hi{fill:none;stroke:rgba(27,26,21,.25);stroke-width:1}.ink{fill:#1b1a15}.hl{fill:#e8f551}
text{font-family:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;font-weight:500;fill:#3d3a32}
.lb{font-size:10px;letter-spacing:1.5px;fill:#57544a}.nm{font-size:15px;fill:#1b1a15}.sub{font-size:10.5px;fill:#57544a}
.c{font-size:12.5px;fill:#1b1a15}.t{font-size:12px;fill:#3d3a32}text.on-hl{fill:#1b1a15}
@media (prefers-color-scheme:dark){
.solid,.dash,.ln,.thin{stroke:#ece7da}.hi{stroke:rgba(236,231,218,.25)}
text{fill:#cbc5b5}.lb,.sub{fill:#a6a08f}.nm,.c{fill:#ece7da}.t{fill:#cbc5b5}text.on-hl{fill:#1b1a15}}
</style>
<defs>
<marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ink" d="M0,0 L10,5 L0,10 z"/></marker>
</defs>
<text class="lb" x="28" y="36">ALICE'S ROSTER</text>
<rect class="dash" x="28" y="48" width="864" height="140"/>

<rect class="thin" x="44" y="70" width="196" height="102"/>
<text class="lb" x="58" y="92">WORKER</text>
<text class="nm" x="58" y="116">researcher</text>
<text class="sub" x="58" y="140">her edited copy</text>
<text class="sub" x="58" y="158">a row under the file's id</text>
<rect class="hl" x="140" y="80" width="88" height="18"/>
<text class="sub on-hl" x="184" y="93" text-anchor="middle">edited</text>

<rect class="thin" x="256" y="70" width="196" height="102"/>
<text class="lb" x="270" y="92">WORKER</text>
<text class="nm" x="270" y="116">writer</text>
<text class="sub" x="270" y="140">her own worker</text>
<text class="sub" x="270" y="158">a row in her data</text>

<rect class="thin" x="468" y="70" width="196" height="102"/>
<text class="lb" x="482" y="92">WORKER</text>
<text class="nm" x="482" y="116">launch</text>
<text class="sub" x="482" y="140">standard</text>
<text class="sub" x="482" y="158">read from a file</text>

<rect class="thin" x="680" y="70" width="196" height="102"/>
<text class="lb" x="694" y="92">WORKER</text>
<text class="nm" x="694" y="116">eng.coder</text>
<text class="sub" x="694" y="140">standard</text>
<text class="sub" x="694" y="158">read from a file</text>

<text class="lb" x="28" y="226">INSTALLATION: ONE COPY OF EACH FLOW</text>
<rect class="solid" x="44" y="240" width="408" height="70"/>
<text class="nm" x="58" y="268">agent</text>
<text class="sub" x="58" y="290">researcher and writer share it</text>
<rect class="solid" x="468" y="240" width="196" height="70"/>
<text class="nm" x="482" y="268">coordinator</text>
<text class="sub" x="482" y="290">routes messages</text>
<rect class="solid" x="680" y="240" width="196" height="70"/>
<text class="nm" x="694" y="268">coder</text>
<text class="sub" x="694" y="290">runs a harness</text>

<line class="ln" x1="142" y1="172" x2="142" y2="240" marker-end="url(#ah)"/>
<line class="ln" x1="354" y1="172" x2="354" y2="240" marker-end="url(#ah)"/>
<line class="ln" x1="566" y1="172" x2="566" y2="240" marker-end="url(#ah)"/>
<line class="ln" x1="778" y1="172" x2="778" y2="240" marker-end="url(#ah)"/>

<text class="t" x="28" y="344">Each worker names one flow. Bob's researcher is the file's, on the same agent flow.</text>
</svg>
