<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 372">
<style>
/* Standalone fallback (GitHub, a file viewer). On the docs site the page's own
   .drawing rules are more specific and win, so the figure follows the site theme. */
.solid{fill:none;stroke:#1b1a15;stroke-width:1.4}.dash{fill:none;stroke:#1b1a15;stroke-width:1.4;stroke-dasharray:5 4}
.ln{fill:none;stroke:#1b1a15;stroke-width:1.3}.thin{fill:none;stroke:#1b1a15;stroke-width:1}
.hi{fill:none;stroke:rgba(27,26,21,.25);stroke-width:1}.hatch-line{stroke:rgba(27,26,21,.45);stroke-width:1}
.ground{fill:#f0ece1}.ink{fill:#1b1a15}.hl{fill:#e8f551}
text{font-family:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;font-weight:500;fill:#3d3a32}
.lb{font-size:10px;letter-spacing:1.5px;fill:#57544a}.nm{font-size:15px;fill:#1b1a15}.sub{font-size:10.5px;fill:#57544a}
.c{font-size:12.5px;fill:#1b1a15}.t{font-size:12px;fill:#3d3a32}text.on-hl{fill:#1b1a15}
@media (prefers-color-scheme:dark){
.solid,.dash,.ln,.thin{stroke:#ece7da}.hi{stroke:rgba(236,231,218,.25)}.hatch-line{stroke:rgba(236,231,218,.45)}
.ground{fill:#16150f}.ink{fill:#ece7da}text{fill:#cbc5b5}.lb,.sub{fill:#a6a08f}.nm,.c{fill:#ece7da}.t{fill:#cbc5b5}text.on-hl{fill:#1b1a15}}
</style>
<defs>
<pattern id="hatch" width="5" height="5" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line class="hatch-line" x1="0" y1="0" x2="0" y2="5"/></pattern>
<marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ink" d="M0,0 L10,5 L0,10 z"/></marker>
</defs>
<rect class="solid" x="28" y="24" width="500" height="252"/>
<text class="lb" x="42" y="46">THE TASKS · STORED</text>
<text class="nm" x="42" y="68">The list</text>
<line class="hi" x1="28" y1="82" x2="528" y2="82"/>
<text class="lb" x="42" y="102">ID</text><text class="lb" x="150" y="102">STATUS</text><text class="lb" x="290" y="102">WAITS ON</text>
<line class="hi" x1="28" y1="112" x2="528" y2="112"/>
<text class="c" x="42" y="136">acme</text><text class="c" x="150" y="136">completed</text>
<line class="hi" x1="28" y1="150" x2="528" y2="150"/>
<text class="c" x="42" y="174">globex</text><text class="c" x="150" y="174">in_progress</text>
<line class="hi" x1="28" y1="188" x2="528" y2="188"/>
<text class="c" x="42" y="212">initech</text><text class="c" x="150" y="212">in_progress</text>
<line class="hi" x1="28" y1="226" x2="528" y2="226"/>
<rect class="hl" x="36" y="236" width="484" height="28"/>
<text class="c on-hl" x="42" y="254">compare</text><text class="c on-hl" x="150" y="254">pending</text><text class="c on-hl" x="290" y="254">acme, globex, initech</text>
<text class="t" x="28" y="304">A task is ready when everything it waits on is completed.</text>
<text class="t" x="28" y="322">The highlighted row cannot start yet.</text>

<text class="lb" x="640" y="46">THE DRAIN · RUNS IN A REQUEST</text>
<rect class="thin" x="640" y="62" width="240" height="40"/>
<text class="c" x="760" y="86" text-anchor="middle">claim a ready task</text>
<line class="ln" x1="760" y1="102" x2="760" y2="126" marker-end="url(#ah)"/>
<rect class="thin" x="640" y="128" width="240" height="40"/>
<text class="c" x="760" y="152" text-anchor="middle">run its block</text>
<line class="ln" x1="760" y1="168" x2="760" y2="192" marker-end="url(#ah)"/>
<rect class="thin" x="640" y="194" width="240" height="40"/>
<text class="c" x="760" y="218" text-anchor="middle">record the result</text>
<path class="ln" d="M880 214 H900 V82 H882" marker-end="url(#ah)"/>
<line class="ln" x1="640" y1="82" x2="530" y2="82" marker-end="url(#ah)"/>
<text class="sub" x="585" y="72" text-anchor="middle">claims</text>
<text class="t" x="640" y="264">Several of these loops run at</text>
<text class="t" x="640" y="281">once. They stop when every task</text>
<text class="t" x="640" y="298">is done, or nothing left can run.</text>
</svg>
