<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 34 920 574">
<defs>
<marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ink" d="M0,0 L10,5 L0,10 z"/></marker>
</defs>
<text class="lb" x="28" y="50">THE PRODUCT</text>
<text class="lb" x="684" y="50">WHAT YOU CHANGE THERE</text>

<rect class="solid" x="28" y="62" width="620" height="104"/>
<text class="lb" x="40" y="84">LAYER 01</text>
<text class="nm" x="40" y="106">App</text>
<text class="sub" x="86" y="106">your repo, your stores</text>
<line class="hi" x1="28" y1="120" x2="648" y2="120"/>
<text class="c" x="40" y="146">createFlowState config · screens · your own flows</text>

<rect class="solid" x="28" y="182" width="620" height="150"/>
<text class="lb" x="40" y="204">LAYER 02</text>
<rect class="hl" x="38" y="212" width="52" height="22"/>
<text class="nm on-hl" x="42" y="228">Kits</text>
<text class="sub" x="102" y="228">a feature, installed in one line</text>
<rect class="thin" x="40" y="246" width="156" height="72"/>
<text class="c" x="52" y="268">workforce</text>
<text class="sub" x="52" y="288">workers · tasks</text>
<text class="sub" x="52" y="304">opens slots</text>
<rect class="thin" x="256" y="246" width="156" height="72"/>
<text class="c" x="268" y="268">harnesses</text>
<text class="sub" x="268" y="288">coding agents</text>
<text class="sub" x="268" y="304">fills, then opens</text>
<rect class="thin" x="472" y="246" width="164" height="72"/>
<text class="c" x="484" y="268">a kit you write</text>
<text class="sub" x="484" y="288">fills a slot of</text>
<text class="sub" x="484" y="304">either kit</text>
<line class="ln" x1="255" y1="282" x2="197" y2="282" marker-end="url(#ah)"/>
<rect class="ground" x="204" y="260" width="44" height="15"/>
<text class="plate" x="226" y="271" text-anchor="middle">SLOT</text>
<line class="ln" x1="471" y1="282" x2="413" y2="282" marker-end="url(#ah)"/>
<rect class="ground" x="420" y="260" width="44" height="15"/>
<text class="plate" x="442" y="271" text-anchor="middle">SLOT</text>

<rect class="solid" x="28" y="348" width="620" height="104"/>
<text class="lb" x="40" y="370">LAYER 03</text>
<text class="nm" x="40" y="392">Flows</text>
<text class="sub" x="100" y="392">what a kit is made of</text>
<line class="hi" x1="28" y1="404" x2="648" y2="404"/>
<text class="c" x="40" y="424">named actions · state · resources</text>
<text class="t" x="40" y="440">served over HTTP, run from a terminal with fsdev run</text>

<rect class="solid" x="28" y="468" width="620" height="112"/>
<text class="lb" x="40" y="490">LAYER 04</text>
<text class="nm" x="40" y="512">Blocks</text>
<text class="sub" x="106" y="512">what a flow is made of</text>
<rect class="thin" x="40" y="526" width="108" height="42"/>
<text class="c" x="52" y="552">handler</text>
<rect class="thin" x="156" y="526" width="116" height="42"/>
<text class="c" x="168" y="552">generator</text>
<rect class="thin" x="280" y="526" width="116" height="42"/>
<text class="c" x="292" y="552">evaluator</text>
<rect class="thin" x="404" y="526" width="116" height="42"/>
<text class="c" x="416" y="552">sequencer</text>
<rect class="thin" x="528" y="526" width="108" height="42"/>
<text class="c" x="540" y="552">router</text>

<line class="ln" x1="648" y1="104" x2="676" y2="104" marker-end="url(#ah)"/>
<text class="t" x="684" y="100">Edit a WORKER.md</text>
<text class="t" x="684" y="118">or a line of config</text>
<line class="ln" x1="648" y1="257" x2="676" y2="257" marker-end="url(#ah)"/>
<text class="t" x="684" y="253">Add a kit, or</text>
<text class="t" x="684" y="271">write one</text>
<line class="ln" x1="648" y1="400" x2="676" y2="400" marker-end="url(#ah)"/>
<text class="t" x="684" y="404">Write a flow</text>
<line class="ln" x1="648" y1="524" x2="676" y2="524" marker-end="url(#ah)"/>
<text class="t" x="684" y="528">Write a block</text>

<line class="ln" x1="338" y1="166" x2="338" y2="181" marker-end="url(#ah)"/>
<line class="ln" x1="338" y1="332" x2="338" y2="347" marker-end="url(#ah)"/>
<line class="ln" x1="338" y1="452" x2="338" y2="467" marker-end="url(#ah)"/>
<text class="sub" x="28" y="598">A downward arrow reads "is made of". Go down only as far as the change needs.</text>
</svg>
