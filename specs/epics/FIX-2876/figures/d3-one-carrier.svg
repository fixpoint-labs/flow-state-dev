<svg viewBox="0 0 940 420" role="img" aria-label="D3, where the Claude Code-style lab&#x27;s harness and model choice travels. Chosen: through this epic&#x27;s carrier, so FIX-2598 waits for it. Instead of: FIX-2598 builds its own carrier first. It comes down to the first row: one carrier at the end, turn state in the workforce kit flowing into the task&#x27;s run settings, against two until one is rewritten onto the other. The price: the lab gets its model picker only after FIX-2878 and FIX-2879 merge, both parked until the release ships, and FIX-2616&#x27;s ER-2 is amended by a follow-up PR. Locks in FIX-2879 blocking FIX-2598. Flips if the lab&#x27;s model picker is needed before the release."
     xmlns="http://www.w3.org/2000/svg">
  <style>
    :root { --surface:#FCFCFA; --surface-2:#E8E8E1; --ink:#191C21; --ink-2:#4C535B; --ink-3:#7A828B;
            --rule:#D5D4CB; --accent:#3E4E8C; --accent-soft:#E0E3F0; --code:#2C7C69; --code-soft:#DCEDE7;
            --prose:#A8761C; --prose-soft:#F3E8D2; --gone:#A9544F; }
    @media (prefers-color-scheme: dark) {
      :root { --surface:#181C1F; --surface-2:#202528; --ink:#E6E8E5; --ink-2:#A4ACB1; --ink-3:#737B81;
              --rule:#2B3135; --accent:#8B9BD8; --accent-soft:#1B2140; --code:#5DBBA1; --code-soft:#14302A;
              --prose:#D9A44B; --prose-soft:#332612; --gone:#DE8A84; } }
    .bg     { fill:var(--surface); }
    .ask    { fill:var(--surface-2); }
    .chosen { fill:var(--code-soft); stroke:var(--code); stroke-width:1.6; }
    .lost   { fill:var(--surface); stroke:var(--rule); stroke-width:1.4; stroke-dasharray:5 4; }
    .comp   { fill:var(--accent-soft); stroke:var(--accent); stroke-width:1.4; }
    .input  { fill:var(--prose-soft); stroke:var(--prose); stroke-width:1.2; stroke-dasharray:4 3; }
    .decide { fill:var(--accent-soft); }
    .bar    { fill:var(--accent); }
    .row    { stroke:var(--rule); stroke-width:1; }
    .fence  { stroke:var(--gone); stroke-width:2; stroke-dasharray:7 4; }
    .foot   { fill:var(--surface-2); }
    .t-lbl  { fill:var(--ink-3); font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:9.5px; letter-spacing:.1em; }
    .t-tag  { font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:9.5px; letter-spacing:.1em; font-weight:600; }
    .t-q    { fill:var(--ink); font-family:system-ui,-apple-system,sans-serif; font-weight:600; font-size:15px; }
    .t-h    { font-family:system-ui,-apple-system,sans-serif; font-weight:600; font-size:14px; }
    .t-b    { fill:var(--ink); font-family:system-ui,-apple-system,sans-serif; font-size:12.5px; }
    .t-s    { fill:var(--ink-2); font-family:system-ui,-apple-system,sans-serif; font-size:11px; }
    .mark   { font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:16px; font-weight:700; }
    .plus   { fill:var(--code); }
    .minus  { fill:var(--gone); }
    .tie    { fill:var(--ink-3); }
    .c-code { fill:var(--code); }
    .c-mute { fill:var(--ink-3); }
    .c-lost { fill:var(--ink-2); }
    .c-acc  { fill:var(--accent); }
    .c-gone { fill:var(--gone); }
    .c-pro  { fill:var(--prose); }
  </style>
  <rect class="bg" x="0" y="0" width="940" height="420"/>

  <g id="the-call">
    <rect class="ask" x="16" y="14" width="908" height="48" rx="6"/>
    <text class="t-lbl" x="32" y="32">D3 · THE CALL</text>
    <text class="t-q" x="32" y="52">Where does the Claude Code-style lab&#x27;s harness and model choice travel?</text>
  </g>

  <g id="options">
    <rect class="chosen" x="212" y="76" width="348" height="46" rx="5"/>
    <text class="t-tag c-code" x="228" y="93">CHOSEN</text>
    <text class="t-h c-code" x="228" y="112">This epic&#x27;s carrier; FIX-2598 waits</text>
    <rect class="lost" x="576" y="76" width="348" height="46" rx="5"/>
    <text class="t-tag c-mute" x="592" y="93">INSTEAD OF</text>
    <text class="t-h c-lost" x="592" y="112">FIX-2598 builds its own first</text>
  </g>

  <g id="row-1">
    <rect class="decide" x="16" y="134" width="908" height="62" rx="4"/>
    <rect class="bar" x="16" y="134" width="4" height="62"/>
    <text class="t-lbl" x="32" y="156">CARRIERS AT</text>
    <text class="t-lbl" x="32" y="169">THE END</text>
    <text class="t-tag c-acc" x="32" y="186">▸ DECIDES IT</text>
    <text class="mark plus" x="228" y="162">+</text>
    <text class="t-b" x="248" y="161">One, in the workforce kit</text>
    <text class="t-s" x="248" y="179">turn state into the task&#x27;s run settings</text>
    <text class="mark minus" x="592" y="162">−</text>
    <text class="t-b" x="612" y="161">Two, until one is rewritten</text>
    <text class="t-s" x="612" y="179">the lab&#x27;s, and the kit&#x27;s from FIX-2879</text>
  </g>

  <g id="row-2">
    <text class="t-lbl" x="32" y="222">WHEN THE LAB GETS</text>
    <text class="t-lbl" x="32" y="235">A MODEL PICKER</text>
    <text class="mark minus" x="228" y="224">−</text>
    <text class="t-b" x="248" y="223">After FIX-2878 and FIX-2879 merge</text>
    <text class="t-s" x="248" y="241">both are parked until the release ships</text>
    <text class="mark plus" x="592" y="224">+</text>
    <text class="t-b" x="612" y="223">As soon as FIX-2597 lands</text>
    <text class="t-s" x="612" y="241">nothing in this epic in its way</text>
    <line class="row" x1="16" y1="254" x2="924" y2="254"/>
  </g>

  <g id="row-3">
    <text class="t-lbl" x="32" y="280">FIX-2616&#x27;S</text>
    <text class="t-lbl" x="32" y="293">MERGED TEXT</text>
    <text class="mark minus" x="228" y="282">−</text>
    <text class="t-b" x="248" y="281">ER-2 amended by a follow-up PR</text>
    <text class="t-s" x="248" y="299">where the choice lives is answered here</text>
    <text class="mark plus" x="592" y="282">+</text>
    <text class="t-b" x="612" y="281">Unchanged</text>
    <text class="t-s" x="612" y="299">FIX-2598 settles where it lives</text>
    <line class="row" x1="16" y1="312" x2="924" y2="312"/>
  </g>

  <g id="locks-in">
    <rect class="foot" x="16" y="330" width="446" height="74" rx="5"/>
    <text class="t-lbl" x="32" y="351">LOCKS IN</text>
    <text class="t-b" x="32" y="371">FIX-2879 blocks FIX-2598 in Linear</text>
    <text class="t-s" x="32" y="389">the lab writes the pick through FIX-2879&#x27;s state</text>
  </g>

  <g id="flips-if">
    <rect class="foot" x="478" y="330" width="446" height="74" rx="5"/>
    <text class="t-lbl" x="494" y="351">FLIPS IF</text>
    <text class="t-b" x="494" y="371">The lab&#x27;s model picker is needed before the release</text>
    <text class="t-s" x="494" y="389">then FIX-2598 goes first, and FIX-2879 adopts it</text>
  </g>
</svg>
