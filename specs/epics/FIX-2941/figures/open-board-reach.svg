<svg viewBox="0 0 940 416" role="img" aria-label="Q2, open: is a board in another session reached through its own typed capability, or through a new boards() helper? Recommended: extend the capability. Instead of: a new boards() helper. It comes down to the first row: extending keeps one way to use a board, ctx.cap.name, typed as today; the helper is a second door beside it, taking the name as a string. The price is the second row: extending grows the capability by two methods, at and acrossSessions, for each backing; the helper leaves the capability alone. Third row, a tie: reach across sessions is ctx.resources.at with a session either way. Locks in: the board's one door is its capability. Flips if: a real caller must reach a board its flow does not install."
     xmlns="http://www.w3.org/2000/svg">
  <style>
    :root { --surface:#FCFCFA; --surface-2:#E8E8E1; --ink:#191C21; --ink-2:#4C535B; --ink-3:#7A828B;
            --rule:#D5D4CB; --accent:#3E4E8C; --accent-soft:#E0E3F0; --code:#2C7C69; --code-soft:#DCEDE7;
            --prose:#A8761C; --prose-soft:#F3E8D2; --gone:#A9544F; }
    @media (prefers-color-scheme: dark) {
      :root { --surface:#181C1F; --surface-2:#202528; --ink:#E6E8E5; --ink-2:#A4ACB1; --ink-3:#737B81;
              --rule:#2B3135; --accent:#8B9BD8; --accent-soft:#1B2140; --code:#5DBBA1; --code-soft:#14302A;
              --prose:#D9A44B; --prose-soft:#332612; --gone:#DE8A84; } }
    .bg     { fill:var(--surface); }
    .ask    { fill:var(--surface-2); }
    .chosen { fill:var(--code-soft); stroke:var(--code); stroke-width:1.6; }
    .recd   { fill:var(--code-soft); stroke:var(--code); stroke-width:1.6; stroke-dasharray:6 4; }
    .lost   { fill:var(--surface); stroke:var(--rule); stroke-width:1.4; stroke-dasharray:5 4; }
    .decide { fill:var(--accent-soft); }
    .bar    { fill:var(--accent); }
    .row    { stroke:var(--rule); stroke-width:1; }
    .foot   { fill:var(--surface-2); }
    .mark   { font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:16px; font-weight:700; }
    .plus   { fill:var(--code); }
    .minus  { fill:var(--gone); }
    .tie    { fill:var(--ink-3); }
    .t-lbl  { fill:var(--ink-3); font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:9.5px; letter-spacing:.1em; }
    .t-tag  { font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:9.5px; letter-spacing:.1em; font-weight:600; }
    .t-q    { fill:var(--ink); font-family:system-ui,-apple-system,sans-serif; font-weight:600; font-size:15px; }
    .t-h    { font-family:system-ui,-apple-system,sans-serif; font-weight:600; font-size:13.5px; }
    .t-b    { fill:var(--ink); font-family:system-ui,-apple-system,sans-serif; font-size:12.5px; }
    .t-s    { fill:var(--ink-2); font-family:system-ui,-apple-system,sans-serif; font-size:11px; }
    .c-code { fill:var(--code); }
    .c-mute { fill:var(--ink-3); }
    .c-lost { fill:var(--ink-2); }
    .c-acc  { fill:var(--accent); }
    .c-gone { fill:var(--gone); }
  </style>
  <rect class="bg" x="0" y="0" width="940" height="416"/>

  <g id="the-call">
    <rect class="ask" x="16" y="14" width="908" height="48" rx="6"/>
    <text class="t-lbl" x="32" y="32">Q2 · OPEN</text>
    <text class="t-q" x="32" y="52">Is a board in another session reached through its typed capability, or a new helper?</text>
  </g>

  <g id="options">
    <rect class="recd" x="212" y="76" width="348" height="46" rx="5"/>
    <text class="t-tag c-code" x="228" y="93">RECOMMENDED</text>
    <text class="t-h c-code" x="228" y="112">Extend the capability: ctx.cap.work.at()</text>
    <rect class="lost" x="576" y="76" width="348" height="46" rx="5"/>
    <text class="t-tag c-mute" x="592" y="93">INSTEAD OF</text>
    <text class="t-h c-lost" x="592" y="112">A new boards(ctx, name, { session })</text>
  </g>

  <g id="row-1">
    <rect class="decide" x="16" y="134" width="908" height="62" rx="4"/>
    <rect class="bar" x="16" y="134" width="4" height="62"/>
    <text class="t-lbl" x="32" y="156">WAYS TO USE</text>
    <text class="t-lbl" x="32" y="169">A BOARD</text>
    <text class="t-tag c-acc" x="32" y="186">▸ DECIDES IT</text>
    <text class="mark plus" x="228" y="162">+</text>
    <text class="t-b" x="248" y="161">One: ctx.cap.&lt;name&gt;</text>
    <text class="t-s" x="248" y="179">typed by name and task input, as today</text>
    <text class="mark minus" x="592" y="162">−</text>
    <text class="t-b" x="612" y="161">Two: the capability and boards()</text>
    <text class="t-s" x="612" y="179">the helper takes the name as a string</text>
  </g>

  <g id="row-2">
    <text class="t-lbl" x="32" y="230">WHAT CHANGES</text>
    <text class="mark minus" x="228" y="236">−</text>
    <text class="t-b" x="248" y="235">The capability grows two methods</text>
    <text class="t-s" x="248" y="253">at() and acrossSessions(), for each backing</text>
    <text class="mark plus" x="592" y="236">+</text>
    <text class="t-b" x="612" y="235">The capability is untouched</text>
    <text class="t-s" x="612" y="253">the helper wraps ctx.resources.at</text>
    <line class="row" x1="16" y1="264" x2="924" y2="264"/>
  </g>

  <g id="row-3">
    <text class="t-lbl" x="32" y="288">REACH ACROSS</text>
    <text class="t-lbl" x="32" y="301">SESSIONS</text>
    <text class="mark tie" x="228" y="294">=</text>
    <text class="t-b" x="248" y="293">ctx.resources.at({ session })</text>
    <text class="t-s" x="248" y="311">a general resource feature</text>
    <text class="mark tie" x="592" y="294">=</text>
    <text class="t-b" x="612" y="293">The same</text>
    <text class="t-s" x="612" y="311">only the board's own door differs</text>
    <line class="row" x1="16" y1="322" x2="924" y2="322"/>
  </g>

  <g id="locks-in">
    <rect class="foot" x="16" y="326" width="446" height="74" rx="5"/>
    <text class="t-lbl" x="32" y="347">LOCKS IN</text>
    <text class="t-b" x="32" y="367">A board's one door is its capability</text>
    <text class="t-s" x="32" y="385">any other definition reaches by resources.at</text>
  </g>
  <g id="flips-if">
    <rect class="foot" x="478" y="326" width="446" height="74" rx="5"/>
    <text class="t-lbl" x="494" y="347">FLIPS IF</text>
    <text class="t-b" x="494" y="367">A real caller must reach a board</text>
    <text class="t-s" x="494" y="385">its flow doesn't install; then a named helper</text>
  </g>
</svg>
