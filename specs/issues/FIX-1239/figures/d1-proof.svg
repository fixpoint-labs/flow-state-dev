<svg viewBox="0 0 940 418" role="img" aria-label="D1, how we know each assertion can fail. Chosen: prove every assertion once, in the implementation PR. Instead of: a negation check on every CI run. It comes down to what the standing check would catch today: nothing more than FIX-1343's guard, because all 164 compiled assertions already fail when negated and all 10 broken ones were uncompiled. The price is that a later assertion about any is caught only in review; the standing check costs about a minute per CI run and a script to maintain. Locks in: no machine check for assertions about any. Flips if: a compiled assertion is ever found that cannot fail."
     xmlns="http://www.w3.org/2000/svg">
  <style>
    :root { --surface:#FCFCFA; --surface-2:#E8E8E1; --ink:#191C21; --ink-2:#4C535B; --ink-3:#7A828B;
            --rule:#D5D4CB; --accent:#3E4E8C; --accent-soft:#E0E3F0; --code:#2C7C69; --code-soft:#DCEDE7;
            --gone:#A9544F; }
    @media (prefers-color-scheme: dark) {
      :root { --surface:#181C1F; --surface-2:#202528; --ink:#E6E8E5; --ink-2:#A4ACB1; --ink-3:#737B81;
              --rule:#2B3135; --accent:#8B9BD8; --accent-soft:#1B2140; --code:#5DBBA1; --code-soft:#14302A;
              --gone:#DE8A84; } }
    .bg     { fill:var(--surface); }
    .ask    { fill:var(--surface-2); }
    .chosen { fill:var(--code-soft); stroke:var(--code); stroke-width:1.6; }
    .lost   { fill:var(--surface); stroke:var(--rule); stroke-width:1.4; stroke-dasharray:5 4; }
    .decide { fill:var(--accent-soft); }
    .bar    { fill:var(--accent); }
    .row    { stroke:var(--rule); stroke-width:1; }
    .foot   { fill:var(--surface-2); }
    .t-lbl  { fill:var(--ink-3); font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:9.5px; letter-spacing:.1em; }
    .t-tag  { font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:9.5px; letter-spacing:.1em; font-weight:600; }
    .t-q    { fill:var(--ink); font-family:system-ui,-apple-system,sans-serif; font-weight:600; font-size:15px; }
    .t-h    { font-family:system-ui,-apple-system,sans-serif; font-weight:600; font-size:14px; }
    .t-b    { fill:var(--ink); font-family:system-ui,-apple-system,sans-serif; font-size:12.5px; }
    .t-s    { fill:var(--ink-2); font-family:system-ui,-apple-system,sans-serif; font-size:11px; }
    .mark   { font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:16px; font-weight:700; }
    .plus   { fill:var(--code); }
    .minus  { fill:var(--gone); }
    .tie    { fill:var(--ink-3); }
    .c-code { fill:var(--code); }
    .c-mute { fill:var(--ink-3); }
    .c-lost { fill:var(--ink-2); }
    .c-acc  { fill:var(--accent); }
  </style>
  <rect class="bg" x="0" y="0" width="940" height="418"/>

  <g id="the-call">
    <rect class="ask" x="16" y="14" width="908" height="48" rx="6"/>
    <text class="t-lbl" x="32" y="32">D1 · THE CALL</text>
    <text class="t-q" x="32" y="52">How do we know each type assertion can fail, today and later?</text>
  </g>

  <g id="options">
    <rect class="chosen" x="212" y="76" width="348" height="46" rx="5"/>
    <text class="t-tag c-code" x="228" y="93">CHOSEN</text>
    <text class="t-h c-code" x="228" y="112">Prove once, in the impl PR</text>
    <rect class="lost" x="576" y="76" width="348" height="46" rx="5"/>
    <text class="t-tag c-mute" x="592" y="93">INSTEAD OF</text>
    <text class="t-h c-lost" x="592" y="112">Negation check on every CI run</text>
  </g>

  <g id="row-0">
    <rect class="decide" x="16" y="134" width="908" height="62" rx="4"/>
    <rect class="bar" x="16" y="134" width="4" height="62"/>
    <text class="t-tag c-acc" x="32" y="186">▸ DECIDES IT</text>
    <text class="t-lbl" x="32" y="156">WHAT IT CATCHES</text>
    <text class="t-lbl" x="32" y="169">TODAY</text>
    <text class="mark plus" x="228" y="162">+</text>
    <text class="t-b" x="248" y="161">Every defect found today</text>
    <text class="t-s" x="248" y="179">all 10 sat in uncompiled files</text>
    <text class="mark minus" x="592" y="162">−</text>
    <text class="t-b" x="612" y="161">Nothing FIX-1343 misses</text>
    <text class="t-s" x="612" y="179">164 of 164 compiled sites already fail</text>
  </g>

  <g id="row-1">
    <line class="row" x1="16" y1="254" x2="924" y2="254"/>
    <text class="t-lbl" x="32" y="222">CI COST</text>
    <text class="mark plus" x="228" y="224">+</text>
    <text class="t-b" x="248" y="223">No added time</text>
    <text class="t-s" x="248" y="241">the census runs once, by hand</text>
    <text class="mark minus" x="592" y="224">−</text>
    <text class="t-b" x="612" y="223">About a minute per run</text>
    <text class="t-s" x="612" y="241">plus a script to keep in step with tsc</text>
  </g>

  <g id="row-2">
    <line class="row" x1="16" y1="312" x2="924" y2="312"/>
    <text class="t-lbl" x="32" y="280">A LATER ASSERTION</text>
    <text class="t-lbl" x="32" y="293">ABOUT ANY</text>
    <text class="mark minus" x="228" y="282">−</text>
    <text class="t-b" x="248" y="281">Caught only in review</text>
    <text class="t-s" x="248" y="299">0 such assertions exist today</text>
    <text class="mark plus" x="592" y="282">+</text>
    <text class="t-b" x="612" y="281">Fails CI</text>
    <text class="t-s" x="612" y="299">the one class it adds</text>
  </g>

  <g id="locks-in">
    <rect class="foot" x="16" y="328" width="446" height="74" rx="5"/>
    <text class="t-lbl" x="32" y="349">LOCKS IN</text>
    <text class="t-b" x="32" y="369">No machine check for asserting on any</text>
    <text class="t-s" x="32" y="387">the census stays in the spec, unowned</text>
  </g>

  <g id="flips-if">
    <rect class="foot" x="478" y="328" width="446" height="74" rx="5"/>
    <text class="t-lbl" x="494" y="349">FLIPS IF</text>
    <text class="t-b" x="494" y="369">A compiled assertion is found that can't fail</text>
    <text class="t-s" x="494" y="387">then the census becomes a guard</text>
  </g>
</svg>
