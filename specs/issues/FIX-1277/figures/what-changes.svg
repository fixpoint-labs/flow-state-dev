<svg viewBox="0 0 940 400" role="img" aria-label="Before and after, one column per package. Before: engine, store-postgres and store-sqlite each hold their own copy of the version guards and the conflict report, and the two SQL stores also hold the compare inside their write statements. After: contracts holds the one copy, reached by all three through core/helpers; the compare inside the SQL write statements stays where it is."
     xmlns="http://www.w3.org/2000/svg">
  <style>
    :root { --surface:#FCFCFA; --surface-2:#E8E8E1; --ink:#191C21; --ink-2:#4C535B; --ink-3:#7A828B;
            --rule:#D5D4CB; --accent:#3E4E8C; --accent-soft:#E0E3F0; --code:#2C7C69; --code-soft:#DCEDE7;
            --prose:#A8761C; --prose-soft:#F3E8D2; --gone:#A9544F; }
    @media (prefers-color-scheme: dark) {
      :root { --surface:#181C1F; --surface-2:#202528; --ink:#E6E8E5; --ink-2:#A4ACB1; --ink-3:#737B81;
              --rule:#2B3135; --accent:#8B9BD8; --accent-soft:#1B2140; --code:#5DBBA1; --code-soft:#14302A;
              --prose:#D9A44B; --prose-soft:#332612; --gone:#DE8A84; } }
    .bg    { fill:var(--surface); }
    .pkg   { fill:var(--surface); stroke:var(--rule); stroke-width:1.2; }
    .copy  { fill:none; stroke:var(--gone); stroke-width:1.4; stroke-dasharray:5 3; }
    .one   { fill:var(--code-soft); stroke:var(--code); stroke-width:1.6; }
    .sql   { fill:var(--prose-soft); stroke:var(--prose); stroke-width:1.2; }
    .edge  { stroke:var(--code); stroke-width:1.4; fill:none; }
    .div   { stroke:var(--rule); stroke-width:1; stroke-dasharray:3 4; }
    .t-lbl { fill:var(--ink-3); font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:9.5px; letter-spacing:.1em; }
    .t-b   { fill:var(--ink); font-family:system-ui,-apple-system,sans-serif; font-weight:600; font-size:13px; }
    .t-s   { fill:var(--ink-2); font-family:system-ui,-apple-system,sans-serif; font-size:11px; }
    .t-gone{ fill:var(--gone); font-family:system-ui,-apple-system,sans-serif; font-size:11px; }
    .t-code{ fill:var(--code); font-family:system-ui,-apple-system,sans-serif; font-size:11px; }
    .t-pr  { fill:var(--prose); font-family:system-ui,-apple-system,sans-serif; font-size:11px; }
  </style>
  <rect class="bg" x="0" y="0" width="940" height="400"/>
  <line class="div" x1="470" y1="16" x2="470" y2="384"/>

  <g id="before">
    <text class="t-lbl" x="16" y="30">BEFORE · THREE COPIES</text>
    <g id="b-engine">
      <rect class="pkg" x="16" y="48" width="140" height="210" rx="5"/>
      <text class="t-b" x="28" y="70">engine</text>
      <rect class="copy" x="26" y="84" width="120" height="70" rx="4"/>
      <text class="t-gone" x="34" y="104">guards ×3</text>
      <text class="t-gone" x="34" y="122">conflict report</text>
      <text class="t-s" x="34" y="142">the reference</text>
    </g>
    <g id="b-pg">
      <rect class="pkg" x="166" y="48" width="140" height="210" rx="5"/>
      <text class="t-b" x="178" y="70">store-postgres</text>
      <rect class="copy" x="176" y="84" width="120" height="70" rx="4"/>
      <text class="t-gone" x="184" y="104">guards ×3</text>
      <text class="t-gone" x="184" y="122">conflict report</text>
      <text class="t-s" x="184" y="142">restated</text>
      <rect class="sql" x="176" y="170" width="120" height="70" rx="4"/>
      <text class="t-pr" x="184" y="192">compare inside</text>
      <text class="t-pr" x="184" y="210">the write</text>
      <text class="t-pr" x="184" y="228">statement</text>
    </g>
    <g id="b-sqlite">
      <rect class="pkg" x="316" y="48" width="140" height="210" rx="5"/>
      <text class="t-b" x="328" y="70">store-sqlite</text>
      <rect class="copy" x="326" y="84" width="120" height="70" rx="4"/>
      <text class="t-gone" x="334" y="104">guards ×3</text>
      <text class="t-gone" x="334" y="122">conflict report</text>
      <text class="t-s" x="334" y="142">restated</text>
      <rect class="sql" x="326" y="170" width="120" height="70" rx="4"/>
      <text class="t-pr" x="334" y="192">compare inside</text>
      <text class="t-pr" x="334" y="210">the write</text>
      <text class="t-pr" x="334" y="228">statement</text>
    </g>
    <text class="t-s" x="16" y="290">Kept in step by hand. The shared suite catches</text>
    <text class="t-s" x="16" y="306">a drift only if one of its cases covers it.</text>
  </g>

  <g id="after">
    <text class="t-lbl" x="486" y="30">AFTER · ONE COPY</text>
    <g id="a-contracts">
      <rect class="one" x="560" y="290" width="290" height="80" rx="5"/>
      <text class="t-b" x="574" y="312">contracts · zero dependencies</text>
      <text class="t-code" x="574" y="332">guards ×3 · conflict report</text>
      <text class="t-s" x="574" y="352">reached through core/helpers</text>
    </g>
    <g id="a-engine">
      <rect class="pkg" x="486" y="48" width="140" height="210" rx="5"/>
      <text class="t-b" x="498" y="70">engine</text>
      <text class="t-code" x="498" y="104">calls it</text>
      <text class="t-s" x="498" y="122">keeps its deep copy</text>
    </g>
    <g id="a-pg">
      <rect class="pkg" x="636" y="48" width="140" height="210" rx="5"/>
      <text class="t-b" x="648" y="70">store-postgres</text>
      <text class="t-code" x="648" y="104">calls it</text>
      <rect class="sql" x="646" y="170" width="120" height="70" rx="4"/>
      <text class="t-pr" x="654" y="192">compare inside</text>
      <text class="t-pr" x="654" y="210">the statement</text>
      <text class="t-pr" x="654" y="228">stays · open</text>
    </g>
    <g id="a-sqlite">
      <rect class="pkg" x="786" y="48" width="140" height="210" rx="5"/>
      <text class="t-b" x="798" y="70">store-sqlite</text>
      <text class="t-code" x="798" y="104">calls it</text>
      <rect class="sql" x="796" y="170" width="120" height="70" rx="4"/>
      <text class="t-pr" x="804" y="192">compare inside</text>
      <text class="t-pr" x="804" y="210">the statement</text>
      <text class="t-pr" x="804" y="228">stays · open</text>
    </g>
    <path class="edge" d="M556 258 L590 290"/>
    <path class="edge" d="M706 258 L706 290"/>
    <path class="edge" d="M856 258 L822 290"/>
  </g>
</svg>
