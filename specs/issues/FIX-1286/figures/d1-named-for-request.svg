<svg viewBox="0 0 940 420" role="img" aria-label="D1, what keeps two users apart once a request id is freed. Chosen: name the run workspace for its request, by when the request began. Instead of: closing on FIX-1018 alone, or keeping freed ids reserved in the engine. It comes down to the first row: when Bob reuses an id retention freed, the chosen option gives him an empty workspace, FIX-1018 alone gives him Alice's files, and reserving the id hands him his own id. The price is the second row: one public field and a one-time rename of run directories, against no change at all, or a marker per deleted request in every store kept forever. The third row: later request-keyed state must follow the same rule under the chosen option, is exposed under FIX-1018 alone, and is covered automatically by the engine option. Locks in: a request handle that says when its request began. Flips if: the engine starts reserving freed ids for its own reasons."
     xmlns="http://www.w3.org/2000/svg">
  <style>
    :root { --surface:#FCFCFA; --surface-2:#E8E8E1; --ink:#191C21; --ink-2:#4C535B; --ink-3:#7A828B;
            --rule:#D5D4CB; --accent:#3E4E8C; --accent-soft:#E0E3F0; --code:#2C7C69; --code-soft:#DCEDE7;
            --gone:#A9544F; }
    @media (prefers-color-scheme: dark) {
      :root { --surface:#181C1F; --surface-2:#202528; --ink:#E6E8E5; --ink-2:#A4ACB1; --ink-3:#737B81;
              --rule:#2B3135; --accent:#8B9BD8; --accent-soft:#1B2140; --code:#5DBBA1; --code-soft:#14302A;
              --gone:#DE8A84; } }
    .bg     { fill:var(--surface); }
    .ask    { fill:var(--surface-2); }
    .chosen { fill:var(--code-soft); stroke:var(--code); stroke-width:1.6; }
    .lost   { fill:var(--surface); stroke:var(--rule); stroke-width:1.4; stroke-dasharray:5 4; }
    .decide { fill:var(--accent-soft); }
    .bar    { fill:var(--accent); }
    .row    { stroke:var(--rule); stroke-width:1; }
    .foot   { fill:var(--surface-2); }
    .t-lbl  { fill:var(--ink-3); font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:9.5px; letter-spacing:.1em; }
    .t-tag  { font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:9.5px; letter-spacing:.1em; font-weight:600; }
    .t-q    { fill:var(--ink); font-family:system-ui,-apple-system,sans-serif; font-weight:600; font-size:15px; }
    .t-h    { font-family:system-ui,-apple-system,sans-serif; font-weight:600; font-size:13px; }
    .t-b    { fill:var(--ink); font-family:system-ui,-apple-system,sans-serif; font-size:12px; }
    .t-s    { fill:var(--ink-2); font-family:system-ui,-apple-system,sans-serif; font-size:10.5px; }
    .mark   { font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:16px; font-weight:700; }
    .plus   { fill:var(--code); }
    .minus  { fill:var(--gone); }
    .c-code { fill:var(--code); }
    .c-mute { fill:var(--ink-3); }
    .c-lost { fill:var(--ink-2); }
    .c-acc  { fill:var(--accent); }
  </style>
  <rect class="bg" x="0" y="0" width="940" height="420"/>

  <g id="the-call">
    <rect class="ask" x="16" y="14" width="908" height="48" rx="6"/>
    <text class="t-lbl" x="32" y="32">D1 · THE CALL</text>
    <text class="t-q" x="32" y="52">What keeps two users apart once a request id has been freed?</text>
  </g>

  <g id="options">
    <rect class="chosen" x="212" y="76" width="224" height="46" rx="5"/>
    <text class="t-tag c-code" x="226" y="93">CHOSEN</text>
    <text class="t-h c-code" x="226" y="112">Name it for the request</text>
    <rect class="lost" x="452" y="76" width="224" height="46" rx="5"/>
    <text class="t-tag c-mute" x="466" y="93">INSTEAD OF</text>
    <text class="t-h c-lost" x="466" y="112">FIX-1018 alone</text>
    <rect class="lost" x="692" y="76" width="224" height="46" rx="5"/>
    <text class="t-tag c-mute" x="706" y="93">INSTEAD OF</text>
    <text class="t-h c-lost" x="706" y="112">Reserve freed ids</text>
  </g>

  <g id="row-decides">
    <rect class="decide" x="16" y="134" width="908" height="62" rx="4"/>
    <rect class="bar" x="16" y="134" width="4" height="62"/>
    <text class="t-lbl" x="32" y="156">BOB REUSES AN ID</text>
    <text class="t-lbl" x="32" y="169">RETENTION FREED</text>
    <text class="t-tag c-acc" x="32" y="186">▸ DECIDES IT</text>
    <text class="mark plus" x="226" y="162">+</text>
    <text class="t-b" x="244" y="161">An empty workspace</text>
    <text class="t-s" x="244" y="179">a new request, a new directory</text>
    <text class="mark minus" x="466" y="162">−</text>
    <text class="t-b" x="484" y="161">Reads Alice's files</text>
    <text class="t-s" x="484" y="179">the POC's evicted run</text>
    <text class="mark plus" x="706" y="162">+</text>
    <text class="t-b" x="724" y="161">Gets his own id</text>
    <text class="t-s" x="724" y="179">while the marker survives</text>
  </g>

  <g id="row-price">
    <text class="t-lbl" x="32" y="222">WHAT IT COSTS</text>
    <text class="mark minus" x="226" y="224">−</text>
    <text class="t-b" x="244" y="223">One public field</text>
    <text class="t-s" x="244" y="241">and run directories move once</text>
    <text class="mark plus" x="466" y="224">+</text>
    <text class="t-b" x="484" y="223">Nothing</text>
    <text class="t-s" x="484" y="241">a test, and the issue closes</text>
    <text class="mark minus" x="706" y="224">−</text>
    <text class="t-b" x="724" y="223">Every store adapter</text>
    <text class="t-s" x="724" y="241">a marker per deleted request</text>
    <line class="row" x1="16" y1="256" x2="924" y2="256"/>
  </g>

  <g id="row-later">
    <text class="t-lbl" x="32" y="280">LATER STATE KEYED</text>
    <text class="t-lbl" x="32" y="293">ON A REQUEST ID</text>
    <text class="mark minus" x="226" y="282">−</text>
    <text class="t-b" x="244" y="281">Must follow the rule</text>
    <text class="t-s" x="244" y="299">a guardrail, not a mechanism</text>
    <text class="mark minus" x="466" y="282">−</text>
    <text class="t-b" x="484" y="281">Exposed the same way</text>
    <text class="t-s" x="484" y="299">nothing tells it the id moved</text>
    <text class="mark plus" x="706" y="282">+</text>
    <text class="t-b" x="724" y="281">Covered once</text>
    <text class="t-s" x="724" y="299">but a memory store forgets</text>
    <line class="row" x1="16" y1="314" x2="924" y2="314"/>
  </g>

  <g id="locks-in">
    <rect class="foot" x="16" y="330" width="446" height="74" rx="5"/>
    <text class="t-lbl" x="32" y="351">LOCKS IN</text>
    <text class="t-b" x="32" y="371">A request handle that says when its request began</text>
    <text class="t-s" x="32" y="389">public from this release; the rule binds later request-keyed state</text>
  </g>

  <g id="flips-if">
    <rect class="foot" x="478" y="330" width="446" height="74" rx="5"/>
    <text class="t-lbl" x="494" y="351">FLIPS IF</text>
    <text class="t-b" x="494" y="371">The engine starts reserving freed ids itself</text>
    <text class="t-s" x="494" y="389">then every store is covered once, and this key buys nothing</text>
  </g>
</svg>
