<svg viewBox="0 0 940 360" role="img" aria-label="D1, what the shared function hands back. Chosen: the case, meaning a kind, blank, or not a string, and each door words its own refusal. Instead of: a finished refusal sentence both doors share. It comes down to the first row, what an author reads: the chosen option leaves every message unchanged word for word, while a shared sentence changes one door's message, which is a behaviour change inside a refactor. The price is the second row: two sets of sentences remain and their wording can still differ, though the rule itself cannot, where a shared sentence would leave one. Locks in: the rule reports why it refused, never how to say it. Flips if: someone decides both doors should word this mistake the same way, which is its own issue."
     xmlns="http://www.w3.org/2000/svg">
  <style>
    :root { --surface:#FCFCFA; --surface-2:#E8E8E1; --ink:#191C21; --ink-2:#4C535B; --ink-3:#7A828B;
            --rule:#D5D4CB; --accent:#3E4E8C; --accent-soft:#E0E3F0; --code:#2C7C69; --code-soft:#DCEDE7;
            --gone:#A9544F; }
    @media (prefers-color-scheme: dark) {
      :root { --surface:#181C1F; --surface-2:#202528; --ink:#E6E8E5; --ink-2:#A4ACB1; --ink-3:#737B81;
              --rule:#2B3135; --accent:#8B9BD8; --accent-soft:#1B2140; --code:#5DBBA1; --code-soft:#14302A;
              --gone:#DE8A84; } }
    .bg     { fill:var(--surface); }
    .ask    { fill:var(--surface-2); }
    .chosen { fill:var(--code-soft); stroke:var(--code); stroke-width:1.6; }
    .lost   { fill:var(--surface); stroke:var(--rule); stroke-width:1.4; stroke-dasharray:5 4; }
    .decide { fill:var(--accent-soft); }
    .bar    { fill:var(--accent); }
    .row    { stroke:var(--rule); stroke-width:1; }
    .foot   { fill:var(--surface-2); }
    .t-lbl  { fill:var(--ink-3); font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:9.5px; letter-spacing:.1em; }
    .t-tag  { font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:9.5px; letter-spacing:.1em; font-weight:600; }
    .t-q    { fill:var(--ink); font-family:system-ui,-apple-system,sans-serif; font-weight:600; font-size:15px; }
    .t-h    { font-family:system-ui,-apple-system,sans-serif; font-weight:600; font-size:14px; }
    .t-b    { fill:var(--ink); font-family:system-ui,-apple-system,sans-serif; font-size:12.5px; }
    .t-s    { fill:var(--ink-2); font-family:system-ui,-apple-system,sans-serif; font-size:11px; }
    .mark   { font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:16px; font-weight:700; }
    .plus   { fill:var(--code); }
    .minus  { fill:var(--gone); }
    .c-code { fill:var(--code); }
    .c-mute { fill:var(--ink-3); }
    .c-lost { fill:var(--ink-2); }
    .c-acc  { fill:var(--accent); }
  </style>
  <rect class="bg" x="0" y="0" width="940" height="360"/>

  <g id="the-call">
    <rect class="ask" x="16" y="14" width="908" height="48" rx="6"/>
    <text class="t-lbl" x="32" y="32">D1 · THE CALL</text>
    <text class="t-q" x="32" y="52">What does the shared rule hand back to each door?</text>
  </g>

  <g id="options">
    <rect class="chosen" x="212" y="76" width="348" height="46" rx="5"/>
    <text class="t-tag c-code" x="228" y="93">CHOSEN</text>
    <text class="t-h c-code" x="228" y="112">The case; each door words it</text>
    <rect class="lost" x="576" y="76" width="348" height="46" rx="5"/>
    <text class="t-tag c-mute" x="592" y="93">INSTEAD OF</text>
    <text class="t-h c-lost" x="592" y="112">One shared refusal sentence</text>
  </g>

  <g id="row-decides">
    <rect class="decide" x="16" y="134" width="908" height="62" rx="4"/>
    <rect class="bar" x="16" y="134" width="4" height="62"/>
    <text class="t-lbl" x="32" y="156">WHAT AN AUTHOR</text>
    <text class="t-lbl" x="32" y="169">READS</text>
    <text class="t-tag c-acc" x="32" y="186">▸ DECIDES IT</text>
    <text class="mark plus" x="228" y="162">+</text>
    <text class="t-b" x="248" y="161">Unchanged, word for word</text>
    <text class="t-s" x="248" y="179">on both doors, as the fence promises</text>
    <text class="mark minus" x="592" y="162">−</text>
    <text class="t-b" x="612" y="161">One door's message changes</text>
    <text class="t-s" x="612" y="179">a behaviour change inside a refactor</text>
  </g>

  <g id="row-price">
    <text class="t-lbl" x="32" y="222">SENTENCE SETS</text>
    <text class="mark minus" x="228" y="224">−</text>
    <text class="t-b" x="248" y="223">Two remain</text>
    <text class="t-s" x="248" y="241">wording can differ; the rule cannot</text>
    <text class="mark plus" x="592" y="224">+</text>
    <text class="t-b" x="612" y="223">One</text>
    <text class="t-s" x="612" y="241">nothing left to word differently</text>
    <line class="row" x1="16" y1="256" x2="924" y2="256"/>
  </g>

  <g id="locks-in">
    <rect class="foot" x="16" y="272" width="446" height="74" rx="5"/>
    <text class="t-lbl" x="32" y="293">LOCKS IN</text>
    <text class="t-b" x="32" y="313">The rule reports why it refused</text>
    <text class="t-s" x="32" y="331">never how to say it; each door owns its words</text>
  </g>

  <g id="flips-if">
    <rect class="foot" x="478" y="272" width="446" height="74" rx="5"/>
    <text class="t-lbl" x="494" y="293">FLIPS IF</text>
    <text class="t-b" x="494" y="313">Both doors should say the same thing</text>
    <text class="t-s" x="494" y="331">a product call, with its own issue</text>
  </g>
</svg>
