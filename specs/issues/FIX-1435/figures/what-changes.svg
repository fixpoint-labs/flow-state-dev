<svg viewBox="0 0 940 310" role="img" aria-label="Before and after. Before: Door A and Door B each hold their own copy of the descent through org, org workers, teams and team workers, and Door B also holds a hand-written list of the four places. After: one shared walk holds the descent and the list of places beside it; Door A keeps only reading Markdown documents in each folder and Door B keeps only finding TypeScript modules; the fsdev gen list and the both-doors test read the list."
     xmlns="http://www.w3.org/2000/svg">
  <style>
    :root { --surface:#FCFCFA; --surface-2:#E8E8E1; --ink:#191C21; --ink-2:#4C535B; --ink-3:#7A828B;
            --rule:#D5D4CB; --accent:#3E4E8C; --accent-soft:#E0E3F0; --code:#2C7C69; --code-soft:#DCEDE7;
            --gone:#A9544F; }
    @media (prefers-color-scheme: dark) {
      :root { --surface:#181C1F; --surface-2:#202528; --ink:#E6E8E5; --ink-2:#A4ACB1; --ink-3:#737B81;
              --rule:#2B3135; --accent:#8B9BD8; --accent-soft:#1B2140; --code:#5DBBA1; --code-soft:#14302A;
              --gone:#DE8A84; } }
    .bg    { fill:var(--surface); }
    .n-box { fill:var(--surface); stroke:var(--rule); stroke-width:1.2; }
    .dup   { fill:var(--surface); stroke:var(--gone); stroke-width:1.4; stroke-dasharray:5 4; }
    .walk  { fill:var(--code-soft); stroke:var(--code); stroke-width:1.6; }
    .door  { fill:var(--accent-soft); stroke:var(--accent); stroke-width:1.2; }
    .arrow { stroke:var(--ink-3); stroke-width:1.2; fill:none; }
    .div   { stroke:var(--rule); stroke-width:1; }
    .t-lbl { fill:var(--ink-3); font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:9.5px; letter-spacing:.1em; }
    .t-b   { fill:var(--ink); font-family:system-ui,-apple-system,sans-serif; font-weight:600; font-size:13px; }
    .t-s   { fill:var(--ink-2); font-family:system-ui,-apple-system,sans-serif; font-size:11px; }
    .t-gone{ fill:var(--gone); font-family:system-ui,-apple-system,sans-serif; font-size:11px; }
  </style>
  <rect class="bg" x="0" y="0" width="940" height="310"/>

  <g id="before">
    <text class="t-lbl" x="24" y="30">TODAY · THE DESCENT, THREE TIMES</text>
    <rect class="door" x="24" y="48" width="200" height="54" rx="5"/>
    <text class="t-b" x="38" y="70">Door A · Markdown</text>
    <text class="t-s" x="38" y="88">reads .md in each folder</text>
    <rect class="dup" x="24" y="112" width="200" height="104" rx="5"/>
    <text class="t-lbl" x="38" y="132">ITS OWN DESCENT</text>
    <text class="t-s" x="38" y="152">org → org workers</text>
    <text class="t-s" x="38" y="170">→ each team → its workers</text>
    <text class="t-gone" x="38" y="198">copy 1</text>

    <rect class="door" x="240" y="48" width="200" height="54" rx="5"/>
    <text class="t-b" x="254" y="70">Door B · TypeScript</text>
    <text class="t-s" x="254" y="88">finds .ts in each folder</text>
    <rect class="dup" x="240" y="112" width="200" height="104" rx="5"/>
    <text class="t-lbl" x="254" y="132">ITS OWN DESCENT</text>
    <text class="t-s" x="254" y="152">org → org workers</text>
    <text class="t-s" x="254" y="170">→ each team → its workers</text>
    <text class="t-gone" x="254" y="198">copy 2</text>
    <rect class="dup" x="240" y="226" width="200" height="50" rx="5"/>
    <text class="t-s" x="254" y="246">list of the four places</text>
    <text class="t-gone" x="254" y="264">copy 3 · for fsdev gen</text>
    <rect class="dup" x="24" y="226" width="200" height="50" rx="5"/>
    <text class="t-s" x="38" y="246">both-doors test fixture</text>
    <text class="t-gone" x="38" y="264">five paths, by hand</text>
  </g>

  <line class="div" x1="470" y1="20" x2="470" y2="298"/>

  <g id="after">
    <text class="t-lbl" x="496" y="30">AFTER · ONE WALK, TWO DOOR BODIES</text>
    <rect class="door" x="496" y="48" width="200" height="54" rx="5"/>
    <text class="t-b" x="510" y="70">Door A · Markdown</text>
    <text class="t-s" x="510" y="88">reads .md in each folder</text>
    <rect class="door" x="712" y="48" width="200" height="54" rx="5"/>
    <text class="t-b" x="726" y="70">Door B · TypeScript</text>
    <text class="t-s" x="726" y="88">finds .ts in each folder</text>
    <path class="arrow" d="M596 142 L596 104 M590 110 L596 102 L602 110"/>
    <path class="arrow" d="M812 142 L812 104 M806 110 L812 102 L818 110"/>
    <rect class="walk" x="496" y="142" width="416" height="84" rx="6"/>
    <text class="t-lbl" x="512" y="162">THE SHARED WALK · ONE MODULE</text>
    <text class="t-b" x="512" y="184">org → org workers → each team → its workers</text>
    <text class="t-s" x="512" y="206">and the list of places, beside it</text>
    <path class="arrow" d="M596 226 L596 246 M590 240 L596 248 L602 240"/>
    <path class="arrow" d="M812 226 L812 246 M806 240 L812 248 L818 240"/>
    <rect class="n-box" x="496" y="250" width="200" height="44" rx="5"/>
    <text class="t-s" x="510" y="276">fsdev gen · where it searched</text>
    <rect class="n-box" x="712" y="250" width="200" height="44" rx="5"/>
    <text class="t-s" x="726" y="276">both-doors test, from the list</text>
  </g>
</svg>
