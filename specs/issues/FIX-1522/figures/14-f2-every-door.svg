<svg viewBox="0 0 940 416" role="img" xmlns="http://www.w3.org/2000/svg"
     aria-label="Every way into a hired seat, before and after. Doors: create session, session-less action, resume, retry and continue, internal dispatch, task board drain, and webhook, schedule or MCP through host dispatch. Before, all seven reach acme's seat. After, two checks: (d) before the ack, for fresh HTTP and host dispatch, answering 404 Unknown flow, the same as a missing address; and (e) admission in createExecutionContext after the org binding, throwing InstancePinMismatchError before any block runs. E1 and E2 stop at d; E3, E7 and E9 stop at e. Board drain uses the same seam as E7 and has no leg yet.">
  <style>
    :root { --surface:#FCFCFA; --surface-2:#E8E8E1; --ink:#191C21; --ink-2:#4C535B; --ink-3:#7A828B;
            --rule:#D5D4CB; --accent:#3E4E8C; --accent-soft:#E0E3F0; --code:#2C7C69; --code-soft:#DCEDE7;
            --prose:#A8761C; --prose-soft:#F3E8D2; --gone:#A9544F; --gone-soft:#F4E1DF; }
    @media (prefers-color-scheme: dark) {
      :root { --surface:#181C1F; --surface-2:#202528; --ink:#E6E8E5; --ink-2:#A4ACB1; --ink-3:#737B81;
              --rule:#2B3135; --accent:#8B9BD8; --accent-soft:#1B2140; --code:#5DBBA1; --code-soft:#14302A;
              --prose:#D9A44B; --prose-soft:#332612; --gone:#DE8A84; --gone-soft:#3A1E1C; } }
    .bg    { fill:var(--surface); }
    .panel { fill:var(--surface-2); stroke:var(--rule); stroke-width:1.2; }
    .box   { fill:var(--surface); stroke:var(--ink-3); stroke-width:1; }
    .acme  { fill:var(--prose-soft); stroke:var(--prose); stroke-width:1.2; }
    .usr   { fill:var(--accent-soft); stroke:var(--accent); stroke-width:1.2; }
    .ok    { fill:var(--code-soft); stroke:var(--code); stroke-width:1.2; }
    .no    { fill:var(--gone-soft); stroke:var(--gone); stroke-width:1.2; }
    .warn  { fill:var(--prose-soft); stroke:var(--prose); stroke-width:1.2; }
    .pin   { fill:var(--code); }
    .gate  { fill:var(--code-soft); stroke:var(--code); stroke-width:1.6; }
    .gap   { fill:var(--gone-soft); stroke:var(--gone); stroke-width:1.4; stroke-dasharray:4 3; }
    .div   { stroke:var(--rule); stroke-width:1.2; }
    .a     { fill:none; stroke:var(--ink-2); stroke-width:1.4; }
    .a-x   { fill:none; stroke:var(--gone); stroke-width:1.8; }
    .a-ok  { fill:none; stroke:var(--code); stroke-width:1.6; }
    .a-d   { fill:none; stroke:var(--ink-3); stroke-width:1.2; stroke-dasharray:3 3; }
    .t-lbl { fill:var(--ink-3); font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:9.5px; letter-spacing:.1em; }
    .t-h   { fill:var(--ink); font-family:system-ui,-apple-system,sans-serif; font-weight:700; font-size:13px; }
    .t-b   { fill:var(--ink); font-family:system-ui,-apple-system,sans-serif; font-weight:600; font-size:12px; }
    .t-c   { fill:var(--ink); font-family:system-ui,-apple-system,sans-serif; font-size:11px; }
    .t-s   { fill:var(--ink-2); font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:9.5px; }
    .t-x   { fill:var(--gone); font-family:system-ui,-apple-system,sans-serif; font-size:11px; font-weight:600; }
    .t-ok  { fill:var(--code); font-family:system-ui,-apple-system,sans-serif; font-size:11px; font-weight:600; }
    .t-w   { fill:var(--prose); font-family:system-ui,-apple-system,sans-serif; font-size:11px; font-weight:600; }
    .t-pin { fill:var(--surface); font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:9px; font-weight:700; }
  </style>
  <defs>
    <marker id="h" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L8 4 L0 8 z" fill="var(--ink-2)"/></marker>
    <marker id="hx" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L8 4 L0 8 z" fill="var(--gone)"/></marker>
    <marker id="ho" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L8 4 L0 8 z" fill="var(--code)"/></marker>
    <marker id="hd" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L8 4 L0 8 z" fill="var(--ink-3)"/></marker>
  </defs>
  <rect class="bg" width="940" height="416"/>
  <text class="t-lbl" x="16" y="26">EVERY WAY IN</text>
  <text class="t-lbl" x="330" y="26">BEFORE</text>
  <text class="t-lbl" x="610" y="26">AFTER</text>
  <line class="div" x1="590" y1="16" x2="590" y2="380"/>
  <rect class="box" x="16" y="40" width="290" height="40" rx="4"/>
  <text class="t-b" x="28" y="57">create session</text>
  <text class="t-s" x="28" y="72">POST /:flow/sessions</text>
  <path class="a-x" d="M306 60 H 560" marker-end="url(#hx)"/>
  <text class="t-x" x="330" y="56">reaches the seat</text>
  <text class="t-s" x="440" y="56"></text>
  <rect class="box" x="16" y="88" width="290" height="40" rx="4"/>
  <text class="t-b" x="28" y="105">session-less action</text>
  <text class="t-s" x="28" y="120">POST /:flow/actions/:a</text>
  <path class="a-x" d="M306 108 H 560" marker-end="url(#hx)"/>
  <text class="t-x" x="330" y="104">reaches the seat</text>
  <text class="t-s" x="440" y="104"></text>
  <rect class="box" x="16" y="136" width="290" height="40" rx="4"/>
  <text class="t-b" x="28" y="153">resume</text>
  <text class="t-s" x="28" y="168">action on an existing session</text>
  <path class="a-x" d="M306 156 H 560" marker-end="url(#hx)"/>
  <text class="t-x" x="330" y="152">reaches the seat</text>
  <text class="t-s" x="440" y="152"></text>
  <rect class="box" x="16" y="184" width="290" height="40" rx="4"/>
  <text class="t-b" x="28" y="201">retry · continue</text>
  <text class="t-s" x="28" y="216">request routes</text>
  <path class="a-x" d="M306 204 H 560" marker-end="url(#hx)"/>
  <text class="t-x" x="330" y="200">reaches the seat</text>
  <text class="t-s" x="440" y="200"></text>
  <rect class="box" x="16" y="232" width="290" height="40" rx="4"/>
  <text class="t-b" x="28" y="249">internal dispatch</text>
  <text class="t-s" x="28" y="264">dispatcher() → another flow</text>
  <path class="a-x" d="M306 252 H 560" marker-end="url(#hx)"/>
  <text class="t-x" x="330" y="248">reaches the seat</text>
  <text class="t-s" x="440" y="248"></text>
  <rect class="box" x="16" y="280" width="290" height="40" rx="4"/>
  <text class="t-b" x="28" y="297">task board drain</text>
  <text class="t-s" x="28" y="312">task dispatch → seat</text>
  <path class="a-x" d="M306 300 H 560" marker-end="url(#hx)"/>
  <text class="t-x" x="330" y="296">reaches the seat</text>
  <text class="t-s" x="440" y="296"></text>
  <rect class="box" x="16" y="328" width="290" height="40" rx="4"/>
  <text class="t-b" x="28" y="345">webhook · schedule · MCP</text>
  <text class="t-s" x="28" y="360">host.dispatch</text>
  <path class="a-x" d="M306 348 H 560" marker-end="url(#hx)"/>
  <text class="t-x" x="330" y="344">reaches the seat</text>
  <text class="t-s" x="440" y="344"></text>
  <rect class="gate" x="610" y="40" width="314" height="160" rx="6"/>
  <text class="t-b" x="622" y="60">(d) before the ack</text>
  <text class="t-ok" x="780" y="60">404 Unknown flow</text>
  <text class="t-s" x="622" y="80">same answer as a missing address: no probe</text>
  <text class="t-s" x="622" y="104">stops:</text>
  <text class="t-c" x="660" y="104">create session</text>
  <text class="t-c" x="660" y="122">session-less action</text>
  <text class="t-c" x="660" y="140">webhook · schedule · MCP</text>
  <text class="t-s" x="622" y="168">E1 · E2</text>
  <text class="t-s" x="622" y="184">nothing written, no request record</text>
  <rect class="gate" x="610" y="212" width="314" height="164" rx="6"/>
  <text class="t-b" x="622" y="232">(e) admission</text>
  <text class="t-ok" x="740" y="232">InstancePinMismatchError</text>
  <text class="t-s" x="622" y="252">createExecutionContext, after org binding</text>
  <text class="t-s" x="622" y="276">stops:</text>
  <text class="t-c" x="660" y="276">resume</text>
  <text class="t-c" x="660" y="294">retry · continue</text>
  <text class="t-c" x="660" y="312">internal dispatch</text>
  <text class="t-c" x="660" y="330">task board drain (same seam, no leg yet)</text>
  <text class="t-s" x="622" y="354">E3 · E7 · E9 · the net under every door</text>
  <text class="t-s" x="622" y="368">no block runs</text>
  <text class="t-c" x="16" y="400">Before, all seven reach acme's seat. After, fresh HTTP entries stop at (d), and everything else stops at (e).</text>
</svg>
