<svg viewBox="0 0 940 340" role="img" xmlns="http://www.w3.org/2000/svg"
     aria-label="E7, soft-mix through dispatch, before and after. Mallory's session in the app flow, org globex, runs an action whose dispatcher targets acme.eng.lead. The dispatch seam creates a child session bound to mallory at globex. Before, the flow is resolved by id with no owner check, and acme's seat runs as mallory with acme's instructions, writing into globex's cell. After, admission reads the pin; globex does not match acme, so the seat never runs and nothing lands in globex's cell. As a control, alice at acme dispatching the same action does run. A task board's drain uses the same seam.">
  <style>
    :root { --surface:#FCFCFA; --surface-2:#E8E8E1; --ink:#191C21; --ink-2:#4C535B; --ink-3:#7A828B;
            --rule:#D5D4CB; --accent:#3E4E8C; --accent-soft:#E0E3F0; --code:#2C7C69; --code-soft:#DCEDE7;
            --prose:#A8761C; --prose-soft:#F3E8D2; --gone:#A9544F; --gone-soft:#F4E1DF; }
    @media (prefers-color-scheme: dark) {
      :root { --surface:#181C1F; --surface-2:#202528; --ink:#E6E8E5; --ink-2:#A4ACB1; --ink-3:#737B81;
              --rule:#2B3135; --accent:#8B9BD8; --accent-soft:#1B2140; --code:#5DBBA1; --code-soft:#14302A;
              --prose:#D9A44B; --prose-soft:#332612; --gone:#DE8A84; --gone-soft:#3A1E1C; } }
    .bg    { fill:var(--surface); }
    .panel { fill:var(--surface-2); stroke:var(--rule); stroke-width:1.2; }
    .box   { fill:var(--surface); stroke:var(--ink-3); stroke-width:1; }
    .acme  { fill:var(--prose-soft); stroke:var(--prose); stroke-width:1.2; }
    .usr   { fill:var(--accent-soft); stroke:var(--accent); stroke-width:1.2; }
    .ok    { fill:var(--code-soft); stroke:var(--code); stroke-width:1.2; }
    .no    { fill:var(--gone-soft); stroke:var(--gone); stroke-width:1.2; }
    .warn  { fill:var(--prose-soft); stroke:var(--prose); stroke-width:1.2; }
    .pin   { fill:var(--code); }
    .gate  { fill:var(--code-soft); stroke:var(--code); stroke-width:1.6; }
    .gap   { fill:var(--gone-soft); stroke:var(--gone); stroke-width:1.4; stroke-dasharray:4 3; }
    .div   { stroke:var(--rule); stroke-width:1.2; }
    .a     { fill:none; stroke:var(--ink-2); stroke-width:1.4; }
    .a-x   { fill:none; stroke:var(--gone); stroke-width:1.8; }
    .a-ok  { fill:none; stroke:var(--code); stroke-width:1.6; }
    .a-d   { fill:none; stroke:var(--ink-3); stroke-width:1.2; stroke-dasharray:3 3; }
    .t-lbl { fill:var(--ink-3); font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:9.5px; letter-spacing:.1em; }
    .t-h   { fill:var(--ink); font-family:system-ui,-apple-system,sans-serif; font-weight:700; font-size:13px; }
    .t-b   { fill:var(--ink); font-family:system-ui,-apple-system,sans-serif; font-weight:600; font-size:12px; }
    .t-c   { fill:var(--ink); font-family:system-ui,-apple-system,sans-serif; font-size:11px; }
    .t-s   { fill:var(--ink-2); font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:9.5px; }
    .t-x   { fill:var(--gone); font-family:system-ui,-apple-system,sans-serif; font-size:11px; font-weight:600; }
    .t-ok  { fill:var(--code); font-family:system-ui,-apple-system,sans-serif; font-size:11px; font-weight:600; }
    .t-w   { fill:var(--prose); font-family:system-ui,-apple-system,sans-serif; font-size:11px; font-weight:600; }
    .t-pin { fill:var(--surface); font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:9px; font-weight:700; }
  </style>
  <defs>
    <marker id="h" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L8 4 L0 8 z" fill="var(--ink-2)"/></marker>
    <marker id="hx" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L8 4 L0 8 z" fill="var(--gone)"/></marker>
    <marker id="ho" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L8 4 L0 8 z" fill="var(--code)"/></marker>
    <marker id="hd" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L8 4 L0 8 z" fill="var(--ink-3)"/></marker>
  </defs>
  <rect class="bg" width="940" height="340"/>
  <text class="t-lbl" x="16" y="26">E7 · SOFT-MIX THROUGH DISPATCH — NO create_session ON THE PATH</text>
  <text class="t-h" x="16" y="78">before</text>
  <text class="t-s" x="16" y="96">main</text>
  <rect class="usr" x="110" y="44" width="200" height="110" rx="6"/>
  <text class="t-b" x="122" y="64">mallory's session</text>
  <text class="t-s" x="122" y="82">app flow · org globex</text>
  <text class="t-c" x="122" y="106">action “hand”</text>
  <text class="t-s" x="122" y="124">dispatcher(flowKind:</text>
  <text class="t-s" x="122" y="138">“acme.eng.lead”)</text>
  <path class="a" d="M310 99 H 356" marker-end="url(#h)"/>
  <rect class="box" x="360" y="44" width="200" height="110" rx="6"/>
  <text class="t-b" x="372" y="64">dispatch seam</text>
  <text class="t-s" x="372" y="82">child session created</text>
  <text class="t-s" x="372" y="98">bound to mallory@globex</text>
  <text class="t-s" x="372" y="122">flow resolved by id</text>
  <text class="t-s" x="372" y="138">no owner check</text>
  <path class="a-x" d="M560 99 H 606" marker-end="url(#hx)"/>
  <rect class="no" x="610" y="44" width="314" height="110" rx="6"/>
  <text class="t-x" x="622" y="66">acme's seat runs</text>
  <text class="t-s" x="622" y="86">as mallory@globex</text>
  <text class="t-s" x="622" y="104">with acme's instructions</text>
  <text class="t-s" x="622" y="128">writes land in globex's cell</text>
  <text class="t-h" x="16" y="222">after</text>
  <text class="t-s" x="16" y="240">FIX-1529</text>
  <rect class="usr" x="110" y="188" width="200" height="110" rx="6"/>
  <text class="t-b" x="122" y="208">mallory's session</text>
  <text class="t-s" x="122" y="226">app flow · org globex</text>
  <text class="t-c" x="122" y="250">action “hand”</text>
  <text class="t-s" x="122" y="268">dispatcher(flowKind:</text>
  <text class="t-s" x="122" y="282">“acme.eng.lead”)</text>
  <path class="a" d="M310 243 H 356" marker-end="url(#h)"/>
  <rect class="box" x="360" y="188" width="200" height="110" rx="6"/>
  <text class="t-b" x="372" y="208">dispatch seam</text>
  <text class="t-s" x="372" y="226">child session created</text>
  <text class="t-s" x="372" y="242">bound to mallory@globex</text>
  <rect class="gate" x="372" y="254" width="176" height="34" rx="4"/>
  <text class="t-ok" x="382" y="276">(e) reads the pin</text>
  <path class="a-ok" d="M560 243 H 606" marker-end="url(#ho)"/>
  <rect class="ok" x="610" y="188" width="314" height="110" rx="6"/>
  <text class="t-ok" x="622" y="210">the seat never runs</text>
  <text class="t-s" x="622" y="230">globex ≠ pin acme</text>
  <text class="t-s" x="622" y="248">nothing lands in globex's cell</text>
  <text class="t-s" x="622" y="272">control: alice@acme's dispatch of</text>
  <text class="t-s" x="622" y="286">the same action does run</text>
  <text class="t-c" x="16" y="324">A task board's drain uses the same seam. It needs its own leg in the FIX-1529 suite, but it isn't a different door.</text>
</svg>
