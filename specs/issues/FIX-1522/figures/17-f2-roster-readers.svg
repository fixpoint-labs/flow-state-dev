<svg viewBox="0 0 940 340" role="img" xmlns="http://www.w3.org/2000/svg"
     aria-label="Acme's org cell under option 1: one hire store with keys eng.lead and support.ada flat, and alice's research and bob's notes nested under tilde-user sub-prefixes. Four readers. The browser read, pattern workforce/roster/star, sees flat rows only; E4 showed nested keys are never listed. The boot reload's prefix read sees every row server-side and pins each one. Both hold on pull request 2091. The private writer pattern, owner and seat parameters, reads every user's rows and any flow may declare it (probe B). Other deep patterns such as owner/notes slip the guard, which tests one sample key (probe C). Those two are open and the Architect's call: brand the one writer and make the guard structural.">
  <style>
    :root { --surface:#FCFCFA; --surface-2:#E8E8E1; --ink:#191C21; --ink-2:#4C535B; --ink-3:#7A828B;
            --rule:#D5D4CB; --accent:#3E4E8C; --accent-soft:#E0E3F0; --code:#2C7C69; --code-soft:#DCEDE7;
            --prose:#A8761C; --prose-soft:#F3E8D2; --gone:#A9544F; --gone-soft:#F4E1DF; }
    @media (prefers-color-scheme: dark) {
      :root { --surface:#181C1F; --surface-2:#202528; --ink:#E6E8E5; --ink-2:#A4ACB1; --ink-3:#737B81;
              --rule:#2B3135; --accent:#8B9BD8; --accent-soft:#1B2140; --code:#5DBBA1; --code-soft:#14302A;
              --prose:#D9A44B; --prose-soft:#332612; --gone:#DE8A84; --gone-soft:#3A1E1C; } }
    .bg    { fill:var(--surface); }
    .panel { fill:var(--surface-2); stroke:var(--rule); stroke-width:1.2; }
    .box   { fill:var(--surface); stroke:var(--ink-3); stroke-width:1; }
    .acme  { fill:var(--prose-soft); stroke:var(--prose); stroke-width:1.2; }
    .usr   { fill:var(--accent-soft); stroke:var(--accent); stroke-width:1.2; }
    .ok    { fill:var(--code-soft); stroke:var(--code); stroke-width:1.2; }
    .no    { fill:var(--gone-soft); stroke:var(--gone); stroke-width:1.2; }
    .warn  { fill:var(--prose-soft); stroke:var(--prose); stroke-width:1.2; }
    .pin   { fill:var(--code); }
    .gate  { fill:var(--code-soft); stroke:var(--code); stroke-width:1.6; }
    .gap   { fill:var(--gone-soft); stroke:var(--gone); stroke-width:1.4; stroke-dasharray:4 3; }
    .div   { stroke:var(--rule); stroke-width:1.2; }
    .a     { fill:none; stroke:var(--ink-2); stroke-width:1.4; }
    .a-x   { fill:none; stroke:var(--gone); stroke-width:1.8; }
    .a-ok  { fill:none; stroke:var(--code); stroke-width:1.6; }
    .a-d   { fill:none; stroke:var(--ink-3); stroke-width:1.2; stroke-dasharray:3 3; }
    .t-lbl { fill:var(--ink-3); font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:9.5px; letter-spacing:.1em; }
    .t-h   { fill:var(--ink); font-family:system-ui,-apple-system,sans-serif; font-weight:700; font-size:13px; }
    .t-b   { fill:var(--ink); font-family:system-ui,-apple-system,sans-serif; font-weight:600; font-size:12px; }
    .t-c   { fill:var(--ink); font-family:system-ui,-apple-system,sans-serif; font-size:11px; }
    .t-s   { fill:var(--ink-2); font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:9.5px; }
    .t-x   { fill:var(--gone); font-family:system-ui,-apple-system,sans-serif; font-size:11px; font-weight:600; }
    .t-ok  { fill:var(--code); font-family:system-ui,-apple-system,sans-serif; font-size:11px; font-weight:600; }
    .t-w   { fill:var(--prose); font-family:system-ui,-apple-system,sans-serif; font-size:11px; font-weight:600; }
    .t-pin { fill:var(--surface); font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:9px; font-weight:700; }
  </style>
  <defs>
    <marker id="h" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L8 4 L0 8 z" fill="var(--ink-2)"/></marker>
    <marker id="hx" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L8 4 L0 8 z" fill="var(--gone)"/></marker>
    <marker id="ho" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L8 4 L0 8 z" fill="var(--code)"/></marker>
    <marker id="hd" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L8 4 L0 8 z" fill="var(--ink-3)"/></marker>
  </defs>
  <rect class="bg" width="940" height="340"/>
  <text class="t-lbl" x="16" y="26">ACME'S ORG CELL · ONE HIRE STORE · OPTION 1</text>
  <rect class="panel" x="16" y="40" width="330" height="214" rx="6"/>
  <text class="t-s" x="28" y="60">workforce/roster/</text>
  <rect class="box" x="40" y="70" width="294" height="38" rx="4"/>
  <text class="t-b" x="52" y="87">eng.lead</text>
  <text class="t-s" x="52" y="101">org-visible · legacy or org</text>
  <rect class="box" x="40" y="114" width="294" height="38" rx="4"/>
  <text class="t-b" x="52" y="131">support.ada</text>
  <text class="t-s" x="52" y="145">org-visible</text>
  <rect class="usr" x="40" y="158" width="294" height="38" rx="4"/>
  <text class="t-b" x="52" y="175">~alice/research</text>
  <text class="t-s" x="52" y="189">alice's private hire</text>
  <rect class="usr" x="40" y="202" width="294" height="38" rx="4"/>
  <text class="t-b" x="52" y="219">~bob/notes</text>
  <text class="t-s" x="52" y="233">bob's private hire</text>
  <rect class="ok" x="560" y="40" width="364" height="50" rx="6"/>
  <text class="t-b" x="572" y="58">browser read</text>
  <text class="t-s" x="912" y="58" text-anchor="end">workforce/roster/*</text>
  <text class="t-ok" x="572" y="76">flat rows only</text>
  <text class="t-s" x="912" y="76" text-anchor="end">E4: nested keys never listed</text>
  <path class="a-ok" d="M556 65 L 338 89" marker-end="url(#ho)"/>
  <path class="a-ok" d="M556 65 L 338 133" marker-end="url(#ho)"/>
  <rect class="ok" x="560" y="96" width="364" height="50" rx="6"/>
  <text class="t-b" x="572" y="114">boot reload</text>
  <text class="t-s" x="912" y="114" text-anchor="end">prefix read</text>
  <text class="t-ok" x="572" y="132">every row, server-side</text>
  <text class="t-s" x="912" y="132" text-anchor="end">then pins each one</text>
  <path class="a-ok" d="M556 121 L 338 89" marker-end="url(#ho)"/>
  <path class="a-ok" d="M556 121 L 338 133" marker-end="url(#ho)"/>
  <path class="a-ok" d="M556 121 L 338 177" marker-end="url(#ho)"/>
  <path class="a-ok" d="M556 121 L 338 221" marker-end="url(#ho)"/>
  <rect class="no" x="560" y="152" width="364" height="50" rx="6"/>
  <text class="t-b" x="572" y="170">private writer</text>
  <text class="t-s" x="912" y="170" text-anchor="end">workforce/roster/[owner]/[seat]</text>
  <text class="t-x" x="572" y="188">every user's rows (probe B)</text>
  <text class="t-s" x="912" y="188" text-anchor="end">any flow may declare it</text>
  <path class="a-x" d="M556 177 L 338 177" marker-end="url(#hx)"/>
  <path class="a-x" d="M556 177 L 338 221" marker-end="url(#hx)"/>
  <rect class="no" x="560" y="208" width="364" height="50" rx="6"/>
  <text class="t-b" x="572" y="226">deep patterns</text>
  <text class="t-s" x="912" y="226" text-anchor="end">e.g. …/[owner]/notes</text>
  <text class="t-x" x="572" y="244">slips the guard (probe C)</text>
  <text class="t-s" x="912" y="244" text-anchor="end">guard tests one sample key</text>
  <path class="a-x" d="M556 233 L 338 221" marker-end="url(#hx)"/>
  <rect class="ok" x="16" y="272" width="440" height="54" rx="6"/>
  <text class="t-ok" x="28" y="292">holds on #2091</text>
  <text class="t-s" x="28" y="310">browser read stays single-segment; reload sees all</text>
  <rect class="no" x="484" y="272" width="440" height="54" rx="6"/>
  <text class="t-x" x="496" y="292">open on #2091 · Architect's call</text>
  <text class="t-s" x="496" y="310">brand the one writer; make the guard structural</text>
</svg>
