<svg viewBox="0 0 940 326" role="img" xmlns="http://www.w3.org/2000/svg"
     aria-label="The flow catalog per caller, before and after. Flows: the shared app flow, acme.eng.lead, and alice's private seat. Before, mallory at globex, bob at acme, alice at acme and an anonymous caller all see all three. After, mallory sees only app; bob sees app and acme.eng.lead; alice sees all three; anonymous sees only app. The route stays auth-exempt and returns 200. Verified on pull request 2091.">
  <style>
    :root { --surface:#FCFCFA; --surface-2:#E8E8E1; --ink:#191C21; --ink-2:#4C535B; --ink-3:#7A828B;
            --rule:#D5D4CB; --accent:#3E4E8C; --accent-soft:#E0E3F0; --code:#2C7C69; --code-soft:#DCEDE7;
            --prose:#A8761C; --prose-soft:#F3E8D2; --gone:#A9544F; --gone-soft:#F4E1DF; }
    @media (prefers-color-scheme: dark) {
      :root { --surface:#181C1F; --surface-2:#202528; --ink:#E6E8E5; --ink-2:#A4ACB1; --ink-3:#737B81;
              --rule:#2B3135; --accent:#8B9BD8; --accent-soft:#1B2140; --code:#5DBBA1; --code-soft:#14302A;
              --prose:#D9A44B; --prose-soft:#332612; --gone:#DE8A84; --gone-soft:#3A1E1C; } }
    .bg    { fill:var(--surface); }
    .panel { fill:var(--surface-2); stroke:var(--rule); stroke-width:1.2; }
    .box   { fill:var(--surface); stroke:var(--ink-3); stroke-width:1; }
    .acme  { fill:var(--prose-soft); stroke:var(--prose); stroke-width:1.2; }
    .usr   { fill:var(--accent-soft); stroke:var(--accent); stroke-width:1.2; }
    .ok    { fill:var(--code-soft); stroke:var(--code); stroke-width:1.2; }
    .no    { fill:var(--gone-soft); stroke:var(--gone); stroke-width:1.2; }
    .warn  { fill:var(--prose-soft); stroke:var(--prose); stroke-width:1.2; }
    .pin   { fill:var(--code); }
    .gate  { fill:var(--code-soft); stroke:var(--code); stroke-width:1.6; }
    .gap   { fill:var(--gone-soft); stroke:var(--gone); stroke-width:1.4; stroke-dasharray:4 3; }
    .div   { stroke:var(--rule); stroke-width:1.2; }
    .a     { fill:none; stroke:var(--ink-2); stroke-width:1.4; }
    .a-x   { fill:none; stroke:var(--gone); stroke-width:1.8; }
    .a-ok  { fill:none; stroke:var(--code); stroke-width:1.6; }
    .a-d   { fill:none; stroke:var(--ink-3); stroke-width:1.2; stroke-dasharray:3 3; }
    .t-lbl { fill:var(--ink-3); font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:9.5px; letter-spacing:.1em; }
    .t-h   { fill:var(--ink); font-family:system-ui,-apple-system,sans-serif; font-weight:700; font-size:13px; }
    .t-b   { fill:var(--ink); font-family:system-ui,-apple-system,sans-serif; font-weight:600; font-size:12px; }
    .t-c   { fill:var(--ink); font-family:system-ui,-apple-system,sans-serif; font-size:11px; }
    .t-s   { fill:var(--ink-2); font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:9.5px; }
    .t-x   { fill:var(--gone); font-family:system-ui,-apple-system,sans-serif; font-size:11px; font-weight:600; }
    .t-ok  { fill:var(--code); font-family:system-ui,-apple-system,sans-serif; font-size:11px; font-weight:600; }
    .t-w   { fill:var(--prose); font-family:system-ui,-apple-system,sans-serif; font-size:11px; font-weight:600; }
    .t-pin { fill:var(--surface); font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:9px; font-weight:700; }
  </style>
  <defs>
    <marker id="h" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L8 4 L0 8 z" fill="var(--ink-2)"/></marker>
    <marker id="hx" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L8 4 L0 8 z" fill="var(--gone)"/></marker>
    <marker id="ho" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L8 4 L0 8 z" fill="var(--code)"/></marker>
    <marker id="hd" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L8 4 L0 8 z" fill="var(--ink-3)"/></marker>
  </defs>
  <rect class="bg" width="940" height="326"/>
  <text class="t-lbl" x="16" y="26">GET /api/flows — WHO SEES WHICH FLOW</text>
  <text class="t-lbl" x="190" y="50">BEFORE</text>
  <text class="t-lbl" x="574" y="50">AFTER</text>
  <line class="div" x1="560" y1="40" x2="560" y2="266"/>
  <text class="t-s" x="190" y="70">app (shared)</text>
  <text class="t-s" x="574" y="70">app (shared)</text>
  <text class="t-s" x="312" y="70">acme.eng.lead</text>
  <text class="t-s" x="692" y="70">acme.eng.lead</text>
  <text class="t-s" x="434" y="70">alice's private seat</text>
  <text class="t-s" x="810" y="70">alice's private seat</text>
  <text class="t-b" x="16" y="106">mallory @ globex</text>
  <rect class="ok" x="190" y="82" width="112" height="36" rx="4"/>
  <text class="t-c" x="200" y="104">listed</text>
  <rect class="no" x="312" y="82" width="112" height="36" rx="4"/>
  <text class="t-c" x="322" y="104">listed</text>
  <rect class="no" x="434" y="82" width="112" height="36" rx="4"/>
  <text class="t-c" x="444" y="104">listed</text>
  <rect class="ok" x="574" y="82" width="108" height="36" rx="4"/>
  <text class="t-c" x="584" y="104">listed</text>
  <rect class="ok" x="692" y="82" width="108" height="36" rx="4"/>
  <text class="t-c" x="702" y="104">hidden</text>
  <rect class="ok" x="810" y="82" width="108" height="36" rx="4"/>
  <text class="t-c" x="820" y="104">hidden</text>
  <text class="t-b" x="16" y="154">bob @ acme</text>
  <rect class="ok" x="190" y="130" width="112" height="36" rx="4"/>
  <text class="t-c" x="200" y="152">listed</text>
  <rect class="no" x="312" y="130" width="112" height="36" rx="4"/>
  <text class="t-c" x="322" y="152">listed</text>
  <rect class="no" x="434" y="130" width="112" height="36" rx="4"/>
  <text class="t-c" x="444" y="152">listed</text>
  <rect class="ok" x="574" y="130" width="108" height="36" rx="4"/>
  <text class="t-c" x="584" y="152">listed</text>
  <rect class="ok" x="692" y="130" width="108" height="36" rx="4"/>
  <text class="t-c" x="702" y="152">listed</text>
  <rect class="ok" x="810" y="130" width="108" height="36" rx="4"/>
  <text class="t-c" x="820" y="152">hidden</text>
  <text class="t-b" x="16" y="202">alice @ acme</text>
  <rect class="ok" x="190" y="178" width="112" height="36" rx="4"/>
  <text class="t-c" x="200" y="200">listed</text>
  <rect class="no" x="312" y="178" width="112" height="36" rx="4"/>
  <text class="t-c" x="322" y="200">listed</text>
  <rect class="no" x="434" y="178" width="112" height="36" rx="4"/>
  <text class="t-c" x="444" y="200">listed</text>
  <rect class="ok" x="574" y="178" width="108" height="36" rx="4"/>
  <text class="t-c" x="584" y="200">listed</text>
  <rect class="ok" x="692" y="178" width="108" height="36" rx="4"/>
  <text class="t-c" x="702" y="200">listed</text>
  <rect class="ok" x="810" y="178" width="108" height="36" rx="4"/>
  <text class="t-c" x="820" y="200">listed</text>
  <text class="t-b" x="16" y="250">anonymous</text>
  <rect class="ok" x="190" y="226" width="112" height="36" rx="4"/>
  <text class="t-c" x="200" y="248">listed</text>
  <rect class="no" x="312" y="226" width="112" height="36" rx="4"/>
  <text class="t-c" x="322" y="248">listed</text>
  <rect class="no" x="434" y="226" width="112" height="36" rx="4"/>
  <text class="t-c" x="444" y="248">listed</text>
  <rect class="ok" x="574" y="226" width="108" height="36" rx="4"/>
  <text class="t-c" x="584" y="248">listed</text>
  <rect class="ok" x="692" y="226" width="108" height="36" rx="4"/>
  <text class="t-c" x="702" y="248">hidden</text>
  <rect class="ok" x="810" y="226" width="108" height="36" rx="4"/>
  <text class="t-c" x="820" y="248">hidden</text>
  <text class="t-c" x="16" y="292">Before, every caller sees every seat. After, a pinned seat is listed only to callers who match its pin.</text>
  <text class="t-c" x="16" y="310">The route stays auth-exempt: an anonymous caller still gets a 200, with shared flows only (E8, verified on #2091).</text>
</svg>
