<svg viewBox="0 0 940 330" role="img" aria-label="Two columns, today and after, split by a dashed Layer 1 / Layer 2 line. Today Workforce sits above the line, but below it Core carries the roster patterns, the brand and a roster check, and Engine's hire-plane module hard-codes Workforce's key shape and a roster-owner pin reason. After, Workforce holds its roster names above the line and crosses it only by declaring its collection owner-private and pinning its seats; below the line Core carries a generic ownerPrivate field and Engine enforces a generic owner-private fence and instance pin, with no Workforce name."
     xmlns="http://www.w3.org/2000/svg">
  <style>
    :root { --surface:#FCFCFA; --surface-2:#E8E8E1; --ink:#191C21; --ink-2:#4C535B; --ink-3:#7A828B;
            --rule:#D5D4CB; --accent:#3E4E8C; --accent-soft:#E0E3F0; --code:#2C7C69; --code-soft:#DCEDE7;
            --prose:#A8761C; --prose-soft:#F3E8D2; --gone:#A9544F; }
    @media (prefers-color-scheme: dark) {
      :root { --surface:#181C1F; --surface-2:#202528; --ink:#E6E8E5; --ink-2:#A4ACB1; --ink-3:#737B81;
              --rule:#2B3135; --accent:#8B9BD8; --accent-soft:#1B2140; --code:#5DBBA1; --code-soft:#14302A;
              --prose:#D9A44B; --prose-soft:#332612; --gone:#DE8A84; } }
    .bg    { fill:var(--surface); }
    .n-box { fill:var(--surface); stroke:var(--rule); stroke-width:1.2; }
    .n-gone{ fill:var(--surface); stroke:var(--gone); stroke-width:1.4; stroke-dasharray:4 3; }
    .n-on  { fill:var(--accent-soft); stroke:var(--accent); stroke-width:1.4; }
    .n-ok  { fill:var(--code-soft); stroke:var(--code); stroke-width:1.2; }
    .n-in  { fill:var(--prose-soft); stroke:var(--prose); stroke-width:1.2; }
    .ln    { stroke:var(--ink-3); stroke-width:1.2; fill:none; }
    .ah    { fill:var(--ink-3); }
    .t-lbl { fill:var(--ink-3); font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:9.5px; letter-spacing:.1em; }
    .t-b   { fill:var(--ink); font-family:system-ui,-apple-system,sans-serif; font-weight:600; font-size:13px; }
    .t-s   { fill:var(--ink-2); font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:9.5px; }
    .t-x   { fill:var(--gone); font-family:system-ui,-apple-system,sans-serif; font-weight:600; font-size:11px; }
    .t-g   { fill:var(--code); font-family:system-ui,-apple-system,sans-serif; font-weight:600; font-size:11px; }
    .rule  { stroke:var(--rule); stroke-width:1; }
    .layer { stroke:var(--accent); stroke-width:1.4; stroke-dasharray:6 4; }
    .t-a   { fill:var(--accent); font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:9.5px; letter-spacing:.1em; }
  </style>
  <rect class="bg" x="0" y="0" width="940" height="330"/>
  <line class="rule" x1="470" y1="12" x2="470" y2="318"/>
  <line class="layer" x1="16" y1="134" x2="924" y2="134"/>
  <text class="t-a" x="16" y="127">LAYER 2</text>
  <text class="t-a" x="16" y="149">LAYER 1</text>
  <g id="today">
  <text class="t-lbl" x="16" y="26">TODAY</text>
  <rect class="n-in" x="16" y="38" width="440" height="64" rx="5"/>
  <text class="t-b" x="30" y="60">Workforce</text>
  <text class="t-s" x="30" y="78">defineHiredRosterPrivateCollection()</text>
  <text class="t-s" x="30" y="92">brands its collection; Layer 1 does the rest</text>
  <rect class="n-gone" x="16" y="160" width="210" height="146" rx="5"/>
  <text class="t-lbl" x="30" y="178">CORE</text>
  <text class="t-b" x="30" y="198">roster check</text>
  <text class="t-s" x="30" y="216">HIRED_ROSTER_* patterns</text>
  <text class="t-s" x="30" y="230">the private-roster brand</text>
  <text class="t-s" x="30" y="244">refuses at definition</text>
  <text class="t-x" x="30" y="290">every app pays</text>
  <rect class="n-gone" x="240" y="160" width="216" height="146" rx="5"/>
  <text class="t-lbl" x="254" y="178">ENGINE · HIRE PLANE</text>
  <text class="t-b" x="254" y="198">roster fence</text>
  <text class="t-s" x="254" y="216">workforce/roster/~ hard-coded</text>
  <text class="t-s" x="254" y="230">roster scan at register</text>
  <text class="t-s" x="254" y="244">pin reason "roster-owner"</text>
  <text class="t-x" x="254" y="290">Workforce names in L1</text>
  </g>
  <g id="after">
  <text class="t-lbl" x="484" y="26">AFTER</text>
  <rect class="n-in" x="484" y="38" width="440" height="64" rx="5"/>
  <text class="t-b" x="498" y="60">Workforce</text>
  <text class="t-s" x="498" y="78">roster patterns, hired seats, its own docs</text>
  <text class="t-s" x="498" y="92">ownerPrivate: { param: "owner" }</text>
  <path class="ln" d="M590 102 V150"/><path class="ah" d="M586 150 l4 8 4 -8z"/>
  <text class="t-g" x="598" y="122">declares</text>
  <path class="ln" d="M816 102 V150"/><path class="ah" d="M812 150 l4 8 4 -8z"/>
  <text class="t-g" x="824" y="122">pins</text>
  <rect class="n-box" x="484" y="160" width="210" height="146" rx="5"/>
  <text class="t-lbl" x="498" y="178">CORE</text>
  <text class="t-b" x="498" y="198">collection config</text>
  <text class="t-s" x="498" y="216">ownerPrivate?: { param }</text>
  <text class="t-s" x="498" y="230">ownerSegment(userId)</text>
  <text class="t-s" x="498" y="244">shape checks only</text>
  <text class="t-g" x="498" y="290">no Workforce names</text>
  <rect class="n-on" x="708" y="160" width="216" height="146" rx="5"/>
  <text class="t-lbl" x="722" y="178">ENGINE</text>
  <text class="t-b" x="722" y="198">owner-private fence</text>
  <text class="t-s" x="722" y="216">key fence on ~ segments</text>
  <text class="t-s" x="722" y="230">startup fence, armed by</text>
  <text class="t-s" x="722" y="244">a declaration</text>
  <text class="t-b" x="722" y="268">instance pin</text>
  <text class="t-s" x="722" y="286">reason "owning-user"</text>
  </g>
</svg>
