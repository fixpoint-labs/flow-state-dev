<svg viewBox="0 0 940 360" role="img" aria-label="Two panels. Today: a model string or instance goes through the app's model setup to the generator only, and evaluation is a handler that resolves its own model around the setup, with no refusal and no usage in the trace. After: the app's model setup has two doors. A language model goes to the generator; an evaluation model goes to the evaluator. A generate-only model is stopped at a fence before the evaluator makes any call. The evaluator returns answers, with confidence only when the model gave it."
     xmlns="http://www.w3.org/2000/svg">
  <style>
    :root { --surface:#FCFCFA; --surface-2:#E8E8E1; --ink:#191C21; --ink-2:#4C535B; --ink-3:#7A828B;
            --rule:#D5D4CB; --accent:#3E4E8C; --accent-soft:#E0E3F0; --code:#2C7C69; --code-soft:#DCEDE7;
            --prose:#A8761C; --prose-soft:#F3E8D2; --gone:#A9544F; }
    @media (prefers-color-scheme: dark) {
      :root { --surface:#181C1F; --surface-2:#202528; --ink:#E6E8E5; --ink-2:#A4ACB1; --ink-3:#737B81;
              --rule:#2B3135; --accent:#8B9BD8; --accent-soft:#1B2140; --code:#5DBBA1; --code-soft:#14302A;
              --prose:#D9A44B; --prose-soft:#332612; --gone:#DE8A84; } }
    .bg    { fill:var(--surface); }
    .panel { fill:none; stroke:var(--rule); stroke-width:1.2; }
    .n-box { fill:var(--surface); stroke:var(--rule); stroke-width:1.2; }
    .n-new { fill:var(--code-soft); stroke:var(--code); stroke-width:1.4; }
    .n-set { fill:var(--accent-soft); stroke:var(--accent); stroke-width:1.2; }
    .n-old { fill:var(--prose-soft); stroke:var(--prose); stroke-width:1.2; stroke-dasharray:4 3; }
    .edge  { stroke:var(--ink-3); stroke-width:1.3; fill:none; }
    .edge-new { stroke:var(--code); stroke-width:1.5; fill:none; }
    .edge-old { stroke:var(--prose); stroke-width:1.3; fill:none; stroke-dasharray:4 3; }
    .edge-no  { stroke:var(--gone); stroke-width:1.3; fill:none; stroke-dasharray:3 3; }
    .fence { stroke:var(--gone); stroke-width:2.4; }
    .t-lbl { fill:var(--ink-3); font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:9.5px; letter-spacing:.1em; }
    .t-b   { fill:var(--ink); font-family:system-ui,-apple-system,sans-serif; font-weight:600; font-size:13px; }
    .t-s   { fill:var(--ink-2); font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:9.5px; }
    .t-no  { fill:var(--gone); font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:9.5px; }
    .ah    { fill:var(--ink-3); } .ah-new { fill:var(--code); } .ah-old { fill:var(--prose); } .ah-no { fill:var(--gone); }
  </style>
  <defs>
    <marker id="a"  viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path class="ah" d="M0,0 L8,4 L0,8 z"/></marker>
    <marker id="an" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path class="ah-new" d="M0,0 L8,4 L0,8 z"/></marker>
    <marker id="ao" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path class="ah-old" d="M0,0 L8,4 L0,8 z"/></marker>
    <marker id="ax" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path class="ah-no" d="M0,0 L8,4 L0,8 z"/></marker>
  </defs>
  <rect class="bg" x="0" y="0" width="940" height="360"/>

  <g id="today">
    <rect class="panel" x="10" y="10" width="440" height="340" rx="6"/>
    <text class="t-lbl" x="26" y="32">TODAY</text>
    <rect class="n-box" x="26" y="52" width="110" height="46" rx="5"/>
    <text class="t-b" x="38" y="72">a model</text>
    <text class="t-s" x="38" y="88">string or instance</text>
    <path class="edge" d="M136,75 L146,75" marker-end="url(#a)"/>
    <rect class="n-set" x="148" y="52" width="172" height="46" rx="5"/>
    <text class="t-b" x="160" y="72">app's model setup</text>
    <text class="t-s" x="160" y="88">keys · providers · gateways</text>
    <path class="edge" d="M320,75 L346,75" marker-end="url(#a)"/>
    <rect class="n-box" x="348" y="52" width="88" height="46" rx="5"/>
    <text class="t-b" x="358" y="80">generator</text>
    <rect class="n-old" x="160" y="178" width="276" height="66" rx="5"/>
    <text class="t-b" x="172" y="200">a handler that evaluates</text>
    <text class="t-s" x="172" y="218">resolves its own model and keys</text>
    <text class="t-s" x="172" y="233">no refusal · no usage in the trace</text>
    <path class="edge-old" d="M70,98 L70,211 L158,211" marker-end="url(#ao)"/>
    <text class="t-s" x="78" y="170">around the setup</text>
    <text class="t-s" x="26" y="290">an evaluation has no door of its own:</text>
    <text class="t-s" x="26" y="306">any model goes in, and a text model</text>
    <text class="t-s" x="26" y="322">fails late or quietly</text>
  </g>

  <g id="after">
    <rect class="panel" x="490" y="10" width="440" height="340" rx="6"/>
    <text class="t-lbl" x="506" y="32">AFTER</text>
    <rect class="n-box" x="506" y="52" width="110" height="46" rx="5"/>
    <text class="t-b" x="518" y="72">a model</text>
    <text class="t-s" x="518" y="88">string or instance</text>
    <path class="edge" d="M616,75 L626,75" marker-end="url(#a)"/>
    <rect class="n-set" x="628" y="52" width="152" height="46" rx="5"/>
    <text class="t-b" x="638" y="72">app's model setup</text>
    <text class="t-s" x="638" y="88">now with two doors</text>
    <path class="edge" d="M780,75 L826,75" marker-end="url(#a)"/>
    <text class="t-s" x="788" y="114">language model</text>
    <rect class="n-box" x="828" y="52" width="88" height="46" rx="5"/>
    <text class="t-b" x="838" y="80">generator</text>
    <path class="edge-new" d="M700,98 L700,176" marker-end="url(#an)"/>
    <text class="t-s" x="708" y="140">evaluation model</text>
    <line class="fence" x1="650" y1="170" x2="800" y2="170"/>
    <rect class="n-new" x="660" y="178" width="256" height="66" rx="5"/>
    <text class="t-b" x="672" y="200">evaluator</text>
    <text class="t-s" x="672" y="218">one call · answers by question</text>
    <text class="t-s" x="672" y="233">confidence only if the model gave it</text>
    <path class="edge-no" d="M560,98 L560,162 L644,162" marker-end="url(#ax)"/>
    <text class="t-no" x="568" y="120">generate-only model</text>
    <text class="t-no" x="568" y="134">intent · array</text>
    <text class="t-no" x="506" y="190">refused at the fence,</text>
    <text class="t-no" x="506" y="204">before any call</text>
    <text class="t-s" x="506" y="290">the fence is the refusal. Everything a</text>
    <text class="t-s" x="506" y="306">generator already honours reaches the</text>
    <text class="t-s" x="506" y="322">evaluator through the same setup</text>
  </g>
</svg>
