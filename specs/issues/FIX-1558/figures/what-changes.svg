<svg viewBox="0 0 940 370" role="img" aria-label="Two panels. Today: a hand-rolled two-level tree reads a confidence number a generator was asked to write, each level re-writes its own check, and a missing score can fall through to a sibling branch. After: each level is an evaluator the author built, then one gate that opens an edge only when the choice matches and the model reported confidence at or above the edge's floor. Every failed gate, at any level, exits to the author's one ambiguous block, and a model that reports no confidence takes that exit at the first gate. A failed call is not an answer: the router fails."
     xmlns="http://www.w3.org/2000/svg">
  <style>
    :root { --surface:#FCFCFA; --surface-2:#E8E8E1; --ink:#191C21; --ink-2:#4C535B; --ink-3:#7A828B;
            --rule:#D5D4CB; --accent:#3E4E8C; --accent-soft:#E0E3F0; --code:#2C7C69; --code-soft:#DCEDE7;
            --prose:#A8761C; --prose-soft:#F3E8D2; --gone:#A9544F; }
    @media (prefers-color-scheme: dark) {
      :root { --surface:#181C1F; --surface-2:#202528; --ink:#E6E8E5; --ink-2:#A4ACB1; --ink-3:#737B81;
              --rule:#2B3135; --accent:#8B9BD8; --accent-soft:#1B2140; --code:#5DBBA1; --code-soft:#14302A;
              --prose:#D9A44B; --prose-soft:#332612; --gone:#DE8A84; } }
    .bg    { fill:var(--surface); }
    .panel { fill:none; stroke:var(--rule); stroke-width:1.2; }
    .n-box { fill:var(--surface); stroke:var(--rule); stroke-width:1.2; }
    .n-new { fill:var(--code-soft); stroke:var(--code); stroke-width:1.4; }
    .n-set { fill:var(--accent-soft); stroke:var(--accent); stroke-width:1.2; }
    .n-old { fill:var(--prose-soft); stroke:var(--prose); stroke-width:1.2; stroke-dasharray:4 3; }
    .n-amb { fill:var(--surface-2); stroke:var(--gone); stroke-width:1.4; }
    .gate  { fill:var(--code-soft); stroke:var(--code); stroke-width:1.4; }
    .edge  { stroke:var(--ink-3); stroke-width:1.3; fill:none; }
    .edge-new { stroke:var(--code); stroke-width:1.5; fill:none; }
    .edge-no  { stroke:var(--gone); stroke-width:1.4; fill:none; stroke-dasharray:4 3; }
    .t-lbl { fill:var(--ink-3); font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:9.5px; letter-spacing:.1em; }
    .t-b   { fill:var(--ink); font-family:system-ui,-apple-system,sans-serif; font-weight:600; font-size:13px; }
    .t-s   { fill:var(--ink-2); font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:9.5px; }
    .t-no  { fill:var(--gone); font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:9.5px; }
    .ah    { fill:var(--ink-3); } .ah-new { fill:var(--code); } .ah-no { fill:var(--gone); }
  </style>
  <defs>
    <marker id="a"  viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path class="ah" d="M0,0 L8,4 L0,8 z"/></marker>
    <marker id="an" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path class="ah-new" d="M0,0 L8,4 L0,8 z"/></marker>
    <marker id="ax" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path class="ah-no" d="M0,0 L8,4 L0,8 z"/></marker>
  </defs>
  <rect class="bg" x="0" y="0" width="940" height="370"/>

  <g id="today">
    <rect class="panel" x="10" y="10" width="390" height="350" rx="6"/>
    <text class="t-lbl" x="26" y="32">TODAY · HAND-ROLLED</text>
    <rect class="n-old" x="26" y="50" width="190" height="46" rx="5"/>
    <text class="t-b" x="38" y="70">a generator</text>
    <text class="t-s" x="38" y="86">team · a confidence it wrote</text>
    <path class="edge" d="M120,96 L120,126" marker-end="url(#a)"/>
    <rect class="n-box" x="26" y="128" width="190" height="46" rx="5"/>
    <text class="t-b" x="38" y="148">your check, level 1</text>
    <text class="t-s" x="38" y="164">written by hand</text>
    <path class="edge" d="M120,174 L120,204" marker-end="url(#a)"/>
    <rect class="n-box" x="26" y="206" width="190" height="46" rx="5"/>
    <text class="t-b" x="38" y="226">your check, level 2</text>
    <text class="t-s" x="38" y="242">written again, differently</text>
    <path class="edge" d="M216,151 L256,151" marker-end="url(#a)"/>
    <rect class="n-box" x="258" y="133" width="132" height="36" rx="5"/>
    <text class="t-b" x="268" y="156">billing</text>
    <path class="edge-no" d="M216,229 L256,229" marker-end="url(#ax)"/>
    <rect class="n-amb" x="258" y="211" width="132" height="36" rx="5"/>
    <text class="t-b" x="268" y="234">a sibling branch</text>
    <text class="t-no" x="222" y="268">score missing</text>
    <text class="t-s" x="26" y="306">each level re-writes the gate, and nothing</text>
    <text class="t-s" x="26" y="322">makes a missing score fail: it is easy</text>
    <text class="t-s" x="26" y="338">to read one as a pass</text>
  </g>

  <g id="after">
    <rect class="panel" x="410" y="10" width="520" height="350" rx="6"/>
    <text class="t-lbl" x="426" y="32">AFTER · utility.cascadingRouter</text>
    <rect class="n-set" x="426" y="60" width="122" height="46" rx="5"/>
    <text class="t-b" x="438" y="80">evaluator</text>
    <text class="t-s" x="438" y="96">department, yours</text>
    <path class="edge" d="M548,83 L566,83" marker-end="url(#a)"/>
    <path id="gate-1" class="gate" d="M582,69 L596,83 L582,97 L568,83 z"/>
    <path class="edge-new" d="M596,83 L620,83 L620,72 L644,72" marker-end="url(#an)"/>
    <text class="t-s" x="592" y="44">billing ≥ 0.6</text>
    <path class="edge-new" d="M620,83 L620,150 L644,150" marker-end="url(#an)"/>
    <text class="t-s" x="626" y="182">technical ≥ 0.6</text>
    <rect class="n-set" x="646" y="50" width="116" height="46" rx="5"/>
    <text class="t-b" x="658" y="70">evaluator</text>
    <text class="t-s" x="658" y="86">urgency, yours</text>
    <rect class="n-new" x="646" y="133" width="116" height="34" rx="5"/>
    <text class="t-b" x="658" y="155">tech queue</text>
    <path class="edge" d="M762,73 L780,73" marker-end="url(#a)"/>
    <path id="gate-2" class="gate" d="M796,59 L810,73 L796,87 L782,73 z"/>
    <path class="edge-new" d="M810,73 L824,73 L824,52 L832,52" marker-end="url(#an)"/>
    <path class="edge-new" d="M810,73 L824,73 L824,112 L832,112" marker-end="url(#an)"/>
    <rect class="n-new" x="834" y="36" width="86" height="32" rx="5"/>
    <text class="t-b" x="842" y="57">escalate</text>
    <rect class="n-new" x="834" y="96" width="86" height="32" rx="5"/>
    <text class="t-b" x="842" y="117">billing q.</text>
    <text class="t-s" x="840" y="82">high ≥ 0.7</text>
    <text class="t-s" x="840" y="142">low · no floor</text>
    <path class="edge-no" d="M582,97 L582,230" marker-end="url(#ax)"/>
    <path class="edge-no" d="M796,87 L796,230" marker-end="url(#ax)"/>
    <rect class="n-amb" x="426" y="232" width="494" height="48" rx="5"/>
    <text class="t-b" x="438" y="252">ambiguous · your one block, from any level</text>
    <text class="t-no" x="438" y="270">no-confidence · below-floor · no-branch · the reason is in the trace</text>
    <text class="t-s" x="426" y="304">green: an edge opens only on a matching choice with reported confidence</text>
    <text class="t-s" x="426" y="320">red: every other answer. With no confidence (OpenAI, Anthropic</text>
    <text class="t-s" x="426" y="336">adapters) the first gate always takes it. A failed call isn't an</text>
    <text class="t-s" x="426" y="352">answer: the router fails, and .rescue can route it</text>
  </g>
</svg>
