<svg viewBox="0 0 940 340" role="img" xmlns="http://www.w3.org/2000/svg"
     aria-label="Wireframe of the recommended rail, same tree and same scale as today's figure. Copy, refresh and new-session icons sit on their instance's own row, right-aligned, and digest's actions sit on the digest row. Labels line up in three columns at 24, 40 and 56 pixels, one 16 pixel step per level; support.noticeboard lines up with the instances, the empty note sits on the session column, and sessions show a short id. The same tree takes seven lines instead of ten.">
  <style>
    :root { --surface:#FCFCFA; --surface-2:#E8E8E1; --ink:#191C21; --ink-2:#4C535B; --ink-3:#7A828B;
            --rule:#D5D4CB; --code:#2C7C69; }
    @media (prefers-color-scheme: dark) {
      :root { --surface:#181C1F; --surface-2:#202528; --ink:#E6E8E5; --ink-2:#A4ACB1; --ink-3:#737B81;
              --rule:#2B3135; --code:#5DBBA1; } }
    .bg    { fill:var(--surface); }
    .rail  { fill:var(--surface-2); stroke:var(--rule); stroke-width:1.2; }
    .t     { fill:var(--ink); font-family:system-ui,-apple-system,sans-serif; font-size:14px; }
    .id    { fill:var(--ink); font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:12.5px; }
    .muted { fill:var(--ink-3); font-family:system-ui,-apple-system,sans-serif; font-size:12px; }
    .lbl   { fill:var(--ink-3); font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:9.5px; letter-spacing:.1em; }
    .ico   { fill:none; stroke:var(--ink-3); stroke-width:1.2; }
    .glyph { fill:var(--ink-3); font-family:system-ui,sans-serif; font-size:12px; text-anchor:middle; }
    .guide { stroke:var(--code); stroke-width:1.2; stroke-dasharray:3 3; }
    .num   { fill:var(--code); }
    .numt  { fill:var(--surface); font-family:system-ui,sans-serif; font-weight:700; font-size:11px; text-anchor:middle; }
    .note  { fill:var(--ink-2); font-family:system-ui,-apple-system,sans-serif; font-size:13px; }
    .noteb { fill:var(--ink); font-family:system-ui,-apple-system,sans-serif; font-size:13px; font-weight:600; }
  </style>
  <rect class="bg" width="940" height="340"/>
  <text class="lbl" x="24" y="24">AFTER · RECOMMENDED · ACTIONS ALWAYS VISIBLE · X POSITIONS ×2</text>

  <g id="rail">
    <rect class="rail" x="24" y="36" width="500" height="280" rx="6"/>
    <text class="lbl" x="40" y="58">FLOWS</text>
    <text class="t" x="40" y="86">▾</text><text class="t" x="72" y="86">agent</text>
    <g id="iris">
      <text class="t" x="72" y="116">▾</text><text class="t" x="104" y="116">support.iris</text>
      <rect class="ico" x="429" y="103" width="11" height="11" rx="2"/><path class="ico" d="M425 107 v10 h10"/>
      <text class="glyph" x="462" y="116">⟳</text><text class="glyph" x="492" y="116">+</text>
    </g>
    <text class="id" x="136" y="146">sess_…3df102</text>
    <g id="otto">
      <text class="t" x="72" y="176">▾</text><text class="t" x="104" y="176">support.otto</text>
      <rect class="ico" x="429" y="163" width="11" height="11" rx="2"/><path class="ico" d="M425 167 v10 h10"/>
      <text class="glyph" x="462" y="176">⟳</text><text class="glyph" x="492" y="176">+</text>
    </g>
    <text class="muted" x="136" y="206">No sessions yet</text>
    <g id="digest">
      <text class="t" x="40" y="236">▾</text><text class="t" x="72" y="236">digest</text>
      <text class="glyph" x="462" y="236">⟳</text><text class="glyph" x="492" y="236">+</text>
    </g>
    <text class="t" x="104" y="266">support.noticeboard</text>
  </g>

  <g id="guides">
    <line class="guide" x1="71" y1="68" x2="71" y2="290"/>
    <line class="guide" x1="103" y1="98" x2="103" y2="290"/>
    <line class="guide" x1="135" y1="128" x2="135" y2="290"/>
    <text class="lbl" x="60" y="304">24</text>
    <text class="lbl" x="92" y="304">40</text>
    <text class="lbl" x="124" y="304">56</text>
  </g>

  <g id="markers">
    <circle class="num" cx="404" cy="111" r="9"/><text class="numt" x="404" y="115">1</text>
    <circle class="num" cx="270" cy="261" r="9"/><text class="numt" x="270" y="265">2</text>
    <circle class="num" cx="258" cy="201" r="9"/><text class="numt" x="258" y="205">3</text>
    <circle class="num" cx="244" cy="141" r="9"/><text class="numt" x="244" y="145">4</text>
  </g>

  <g id="callouts">
    <circle class="num" cx="566" cy="72" r="9"/><text class="numt" x="566" y="76">1</text>
    <text class="noteb" x="584" y="76">Actions on the row, right-aligned</text>
    <text class="note" x="584" y="96">Copy stays put. Refresh and new session join it</text>
    <text class="note" x="584" y="114">while the leaf is open. No line of their own.</text>
    <circle class="num" cx="566" cy="146" r="9"/><text class="numt" x="566" y="150">2</text>
    <text class="noteb" x="584" y="150">One label column per level</text>
    <text class="note" x="584" y="170">24, 40, 56: one 16px step, the width of the ▸.</text>
    <text class="note" x="584" y="188">The channel lines up with the instances.</text>
    <circle class="num" cx="566" cy="220" r="9"/><text class="numt" x="566" y="224">3</text>
    <text class="noteb" x="584" y="224">Notes sit on the level they describe</text>
    <circle class="num" cx="566" cy="258" r="9"/><text class="numt" x="566" y="262">4</text>
    <text class="noteb" x="584" y="262">Short ids, full id on hover</text>
    <text class="note" x="584" y="282">Titles and channel names show whole.</text>
    <text class="lbl" x="584" y="312">SAME TREE · 10 LINES BECOME 7</text>
  </g>
</svg>
