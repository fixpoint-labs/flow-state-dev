<svg viewBox="0 0 940 400" role="img" xmlns="http://www.w3.org/2000/svg"
     aria-label="One instance row, zoomed. The row frame holds two siblings: the activation button, which carries the indent, the twisty column and the label, and the trailing area beside it, which holds the host's row content (the copy icon, always) and the open leaf's actions (refresh and new session, only while open). Keyboard order runs button, copy, refresh, new session. Below, three session rows: an untitled engine id shows a short form with the full id in a tooltip, a channel id shows whole, and a titled session shows its title. Every icon is drawn at one size with one stroke, and a dashed tree line runs from the instance's arrow down past its sessions.">
  <style>
    :root { --surface:#FCFCFA; --surface-2:#E8E8E1; --ink:#191C21; --ink-2:#4C535B; --ink-3:#7A828B;
            --rule:#D5D4CB; --accent:#3E4E8C; --accent-soft:#E0E3F0; --code:#2C7C69; --code-soft:#DCEDE7; }
    @media (prefers-color-scheme: dark) {
      :root { --surface:#181C1F; --surface-2:#202528; --ink:#E6E8E5; --ink-2:#A4ACB1; --ink-3:#737B81;
              --rule:#2B3135; --accent:#8B9BD8; --accent-soft:#1B2140; --code:#5DBBA1; --code-soft:#14302A; } }
    .bg    { fill:var(--surface); }
    .frame { fill:var(--surface-2); stroke:var(--rule); stroke-width:1.2; }
    .btn   { fill:var(--accent-soft); stroke:var(--accent); stroke-width:1.3; stroke-dasharray:5 3; }
    .trail { fill:var(--code-soft); stroke:var(--code); stroke-width:1.3; }
    .sub   { fill:var(--surface); stroke:var(--code); stroke-width:1; }
    .t     { fill:var(--ink); font-family:system-ui,-apple-system,sans-serif; font-size:20px; }
    .id    { fill:var(--ink); font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:15px; }
    .tip   { fill:var(--ink); stroke:var(--ink); }
    .tipt  { fill:var(--surface); font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:11.5px; }
    .lbl   { fill:var(--ink-3); font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:9.5px; letter-spacing:.1em; }
    .acc   { fill:var(--accent); font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:9.5px; letter-spacing:.08em; }
    .cod   { fill:var(--code); font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:9.5px; letter-spacing:.08em; }
    .ico   { fill:none; stroke:var(--ink-2); stroke-width:1.6; stroke-linecap:round; stroke-linejoin:round; }
    .tree  { stroke:var(--ink-3); stroke-width:1.4; stroke-dasharray:3 3; }
    .note  { fill:var(--ink-2); font-family:system-ui,-apple-system,sans-serif; font-size:13px; }
    .col   { stroke:var(--ink-3); stroke-width:1; stroke-dasharray:2 3; }
    .chip  { fill:var(--ink-2); }
    .chipt { fill:var(--surface); font-family:system-ui,sans-serif; font-weight:700; font-size:10.5px; text-anchor:middle; }
  </style>
  <rect class="bg" width="940" height="400"/>
  <text class="lbl" x="24" y="24">ONE INSTANCE ROW, ZOOMED · OPEN LEAF</text>

  <g id="row">
    <rect class="frame" x="24" y="44" width="892" height="72" rx="6"/>
    <text class="lbl" x="32" y="136">ROW FRAME · THE SELECTION HIGHLIGHT SPANS BOTH HALVES</text>
    <rect class="btn" x="34" y="54" width="580" height="52" rx="4"/>
    <line class="col" x1="98" y1="72" x2="98" y2="106"/>
    <line class="col" x1="130" y1="72" x2="130" y2="106"/>
    <text class="acc" x="42" y="98">INDENT</text>
    <text class="t" x="104" y="88">▾</text>
    <text class="t" x="138" y="88">support.iris</text>
    <text class="acc" x="42" y="66">BUTTON · ARIA-EXPANDED · CARRIES THE INDENT</text>
    <rect class="trail" x="628" y="54" width="278" height="52" rx="4"/>
    <text class="cod" x="636" y="66">TRAILING · A SIBLING, NEVER INSIDE</text>
    <rect class="sub" x="640" y="72" width="60" height="28" rx="3"/>
    <g class="ico" transform="translate(661 77) scale(1.4)"><rect x="4" y="4" width="9" height="9" rx="1.5" vector-effect="non-scaling-stroke"/><path d="M0 9 V1 Q0 0 1 0 H9" vector-effect="non-scaling-stroke"/></g>
    <rect class="sub" x="712" y="72" width="184" height="28" rx="3"/>
    <g class="ico" transform="translate(761 77) scale(1.4)"><path d="M12 6.5 A5.5 5.5 0 1 1 9.8 2.1 M9.8 0 V2.1 H12" vector-effect="non-scaling-stroke"/></g>
    <g class="ico" transform="translate(825 77) scale(1.4)"><path d="M6.5 0 V13 M0 6.5 H13" vector-effect="non-scaling-stroke"/></g>
  </g>

  <g id="slot-labels">
    <text class="cod" x="628" y="136">ROWTRAILING · ALWAYS</text>
    <text class="cod" x="712" y="150">LEAFTOOLBAR · WHILE OPEN</text>
    <text class="lbl" x="628" y="178">EVERY ICON · ONE DRAWN SIZE, ONE STROKE</text>
  </g>

  <g id="tab-order">
    <circle class="chip" cx="330" cy="44" r="9"/><text class="chipt" x="330" y="48">1</text>
    <circle class="chip" cx="676" cy="44" r="9"/><text class="chipt" x="676" y="48">2</text>
    <circle class="chip" cx="770" cy="44" r="9"/><text class="chipt" x="770" y="48">3</text>
    <circle class="chip" cx="834" cy="44" r="9"/><text class="chipt" x="834" y="48">4</text>
    <text class="note" x="24" y="164">Tab order follows the row: the button, then copy, refresh, new session. Opening the leaf</text>
    <text class="note" x="24" y="182">keeps focus on the same button, and closing it removes the leaf's actions with its sessions.</text>
  </g>

  <g id="sessions">
    <text class="lbl" x="24" y="222">THREE SESSION ROWS UNDER IT, AND ITS TREE LINE</text>
    <rect class="frame" x="24" y="234" width="560" height="40" rx="5"/>

    <text class="id" x="170" y="259">sess_…3df102</text>
    <path class="tip" d="M200 280 l8 -6 l8 6 z"/>
    <rect class="tip" x="170" y="280" width="290" height="24" rx="4"/>
    <text class="tipt" x="180" y="296">sess_1790206121611_42636c63df102</text>
    <text class="note" x="604" y="252">No title, an engine-minted id:</text>
    <text class="note" x="604" y="270">a short form, the full id on hover.</text>
    <rect class="frame" x="24" y="316" width="560" height="32" rx="5"/>
    <text class="id" x="170" y="337">support.noticeboard</text>
    <text class="note" x="604" y="337">Any other id, a channel's say: shown whole.</text>
    <rect class="frame" x="24" y="356" width="560" height="32" rx="5"/>
    <text class="t" x="170" y="379" style="font-size:15px">Refund escalation for order 4417</text>
    <line class="tree" x1="110" y1="230" x2="110" y2="390"/>
    <text class="note" x="604" y="377">A title: always the title.</text>
  </g>
</svg>
