<svg viewBox="0 0 940 410" role="img" xmlns="http://www.w3.org/2000/svg"
     aria-label="Wireframe of today's rail, horizontal positions drawn at twice their size. Under each open instance and under the digest kind, the refresh and new-session icons sit on a line of their own. Session labels start to the left of their instance's label, support.noticeboard starts further left than the instance labels, the empty note sits on the session column, and session ids show raw.">
  <style>
    :root { --surface:#FCFCFA; --surface-2:#E8E8E1; --ink:#191C21; --ink-2:#4C535B; --ink-3:#7A828B;
            --rule:#D5D4CB; --accent:#3E4E8C; --gone:#A9544F; }
    @media (prefers-color-scheme: dark) {
      :root { --surface:#181C1F; --surface-2:#202528; --ink:#E6E8E5; --ink-2:#A4ACB1; --ink-3:#737B81;
              --rule:#2B3135; --accent:#8B9BD8; --gone:#DE8A84; } }
    .bg    { fill:var(--surface); }
    .rail  { fill:var(--surface-2); stroke:var(--rule); stroke-width:1.2; }
    .t     { fill:var(--ink); font-family:system-ui,-apple-system,sans-serif; font-size:14px; }
    .id    { fill:var(--ink); font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:12.5px; }
    .muted { fill:var(--ink-3); font-family:system-ui,-apple-system,sans-serif; font-size:12px; }
    .lbl   { fill:var(--ink-3); font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:9.5px; letter-spacing:.1em; }
    .ico   { fill:none; stroke:var(--ink-3); stroke-width:1.2; }
    .glyph { fill:var(--ink-3); font-family:system-ui,sans-serif; font-size:12px; text-anchor:middle; }
    .own   { fill:none; stroke:var(--gone); stroke-width:1.4; stroke-dasharray:5 3; }
    .guide { stroke:var(--gone); stroke-width:1.2; stroke-dasharray:3 3; }
    .num   { fill:var(--gone); }
    .numt  { fill:var(--surface); font-family:system-ui,sans-serif; font-weight:700; font-size:11px; text-anchor:middle; }
    .note  { fill:var(--ink-2); font-family:system-ui,-apple-system,sans-serif; font-size:13px; }
    .noteb { fill:var(--ink); font-family:system-ui,-apple-system,sans-serif; font-size:13px; font-weight:600; }
  </style>
  <rect class="bg" width="940" height="410"/>
  <text class="lbl" x="24" y="24">TODAY · THE RAIL AS PHOTOGRAPHED · X POSITIONS ×2</text>

  <g id="rail">
    <rect class="rail" x="24" y="36" width="500" height="350" rx="6"/>
    <text class="lbl" x="40" y="58">FLOWS</text>
    <text class="t" x="40" y="86">▾</text><text class="t" x="72" y="86">agent</text>
    <text class="t" x="64" y="116">▾</text><text class="t" x="96" y="116">support.iris</text>
    <rect class="ico" x="485" y="102" width="11" height="11" rx="2"/><path class="ico" d="M481 106 v10 h10"/>
    <g id="own-1">
      <rect class="own" x="424" y="128" width="88" height="26" rx="4"/>
      <text class="glyph" x="450" y="146">⟳</text><text class="glyph" x="489" y="146">+</text>
    </g>
    <text class="id" x="88" y="176">sess_1790206121611_42636c63df…</text>
    <text class="t" x="64" y="206">▾</text><text class="t" x="96" y="206">support.otto</text>
    <rect class="ico" x="485" y="192" width="11" height="11" rx="2"/><path class="ico" d="M481 196 v10 h10"/>
    <g id="own-2">
      <rect class="own" x="424" y="218" width="88" height="26" rx="4"/>
      <text class="glyph" x="450" y="236">⟳</text><text class="glyph" x="489" y="236">+</text>
    </g>
    <text class="muted" x="88" y="266">No sessions yet</text>
    <text class="t" x="40" y="296">▾</text><text class="t" x="72" y="296">digest</text>
    <g id="own-3">
      <rect class="own" x="424" y="308" width="88" height="26" rx="4"/>
      <text class="glyph" x="450" y="326">⟳</text><text class="glyph" x="489" y="326">+</text>
    </g>
    <text class="t" x="64" y="356">support.noticeboard</text>
  </g>

  <g id="guides">
    <line class="guide" x1="96" y1="98" x2="96" y2="372"/>
    <line class="guide" x1="88" y1="160" x2="88" y2="372"/>
    <line class="guide" x1="64" y1="340" x2="64" y2="372"/>
    <text class="lbl" x="99" y="382">36</text>
    <text class="lbl" x="70" y="382">32</text>
    <text class="lbl" x="44" y="382">20</text>
  </g>

  <g id="markers">
    <circle class="num" cx="414" cy="141" r="9"/><text class="numt" x="414" y="145">1</text>
    <circle class="num" cx="80" cy="152" r="9"/><text class="numt" x="80" y="156">2</text>
    <circle class="num" cx="226" cy="351" r="9"/><text class="numt" x="226" y="355">3</text>
    <circle class="num" cx="340" cy="171" r="9"/><text class="numt" x="340" y="175">4</text>
  </g>

  <g id="callouts">
    <circle class="num" cx="566" cy="80" r="9"/><text class="numt" x="566" y="84">1</text>
    <text class="noteb" x="584" y="84">Actions get a line of their own</text>
    <text class="note" x="584" y="104">Refresh and new session sit under every open</text>
    <text class="note" x="584" y="122">leaf. 12 of 17 actions in the rail are off-row.</text>
    <circle class="num" cx="566" cy="160" r="9"/><text class="numt" x="566" y="164">2</text>
    <text class="noteb" x="584" y="164">A session starts left of its instance</text>
    <text class="note" x="584" y="184">Instance labels at 36px, their sessions at 32px:</text>
    <text class="note" x="584" y="202">nested one level, drawn 4px shallower.</text>
    <circle class="num" cx="566" cy="240" r="9"/><text class="numt" x="566" y="244">3</text>
    <text class="noteb" x="584" y="244">A channel sits off its column</text>
    <text class="note" x="584" y="264">support.noticeboard is at the instances' level</text>
    <text class="note" x="584" y="282">but starts at 20px, 16px left of them.</text>
    <circle class="num" cx="566" cy="320" r="9"/><text class="numt" x="566" y="324">4</text>
    <text class="noteb" x="584" y="324">Raw engine ids</text>
    <text class="note" x="584" y="344">32 characters, clipped by the rail's width.</text>
  </g>
</svg>
