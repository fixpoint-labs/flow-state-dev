<svg viewBox="0 0 940 440" role="img" xmlns="http://www.w3.org/2000/svg"
     aria-label="Wireframe of today's rail, horizontal positions drawn at twice their size. Under each open instance and under the digest kind, the refresh and new-session icons sit on a line of their own. Session labels start to the left of their instance's label, support.noticeboard starts further left than the instance labels, session ids show raw, and the three icons are drawn at different sizes, copy the largest and plus the smallest. There are no tree lines.">
  <style>
    :root { --surface:#FCFCFA; --surface-2:#E8E8E1; --ink:#191C21; --ink-2:#4C535B; --ink-3:#7A828B;
            --rule:#D5D4CB; --gone:#A9544F; }
    @media (prefers-color-scheme: dark) {
      :root { --surface:#181C1F; --surface-2:#202528; --ink:#E6E8E5; --ink-2:#A4ACB1; --ink-3:#737B81;
              --rule:#2B3135; --gone:#DE8A84; } }
    .bg    { fill:var(--surface); }
    .rail  { fill:var(--surface-2); stroke:var(--rule); stroke-width:1.2; }
    .t     { fill:var(--ink); font-family:system-ui,-apple-system,sans-serif; font-size:14px; }
    .id    { fill:var(--ink); font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:12.5px; }
    .muted { fill:var(--ink-3); font-family:system-ui,-apple-system,sans-serif; font-size:12px; }
    .lbl   { fill:var(--ink-3); font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:9.5px; letter-spacing:.1em; }
    .ico   { fill:none; stroke:var(--ink-2); stroke-width:1.4; stroke-linecap:round; stroke-linejoin:round; }
    .own   { fill:none; stroke:var(--gone); stroke-width:1.4; stroke-dasharray:5 3; }
    .guide { stroke:var(--gone); stroke-width:1.2; stroke-dasharray:3 3; }
    .num   { fill:var(--gone); }
    .numt  { fill:var(--surface); font-family:system-ui,sans-serif; font-weight:700; font-size:11px; text-anchor:middle; }
    .note  { fill:var(--ink-2); font-family:system-ui,-apple-system,sans-serif; font-size:13px; }
    .noteb { fill:var(--ink); font-family:system-ui,-apple-system,sans-serif; font-size:13px; font-weight:600; }
  </style>
  <rect class="bg" width="940" height="440"/>
  <text class="lbl" x="24" y="24">TODAY · THE RAIL AS PHOTOGRAPHED · X POSITIONS ×2</text>

  <g id="rail">
    <rect class="rail" x="24" y="36" width="500" height="350" rx="6"/>
    <text class="lbl" x="40" y="58">FLOWS</text>
    <text class="t" x="40" y="86">▾</text><text class="t" x="72" y="86">agent</text>
    <text class="t" x="64" y="116">▾</text><text class="t" x="96" y="116">support.iris</text>
    <g class="ico" transform="translate(482 101) scale(1.23)"><rect x="4" y="4" width="9" height="9" rx="1.5" vector-effect="non-scaling-stroke"/><path d="M0 9 V1 Q0 0 1 0 H9" vector-effect="non-scaling-stroke"/></g>
    <g id="own-1">
      <rect class="own" x="424" y="128" width="88" height="26" rx="4"/>
      <g class="ico" transform="translate(442 134) scale(1.1)"><path d="M12 6.5 A5.5 5.5 0 1 1 9.8 2.1 M9.8 0 V2.1 H12" vector-effect="non-scaling-stroke"/></g>
      <g class="ico" transform="translate(484 136) scale(0.86)"><path d="M6.5 0 V13 M0 6.5 H13" vector-effect="non-scaling-stroke"/></g>
    </g>
    <text class="id" x="88" y="176">sess_1790206121611_42636c63df…</text>
    <text class="t" x="64" y="206">▾</text><text class="t" x="96" y="206">support.otto</text>
    <g class="ico" transform="translate(482 191) scale(1.23)"><rect x="4" y="4" width="9" height="9" rx="1.5" vector-effect="non-scaling-stroke"/><path d="M0 9 V1 Q0 0 1 0 H9" vector-effect="non-scaling-stroke"/></g>
    <g id="own-2">
      <rect class="own" x="424" y="218" width="88" height="26" rx="4"/>
      <g class="ico" transform="translate(442 224) scale(1.1)"><path d="M12 6.5 A5.5 5.5 0 1 1 9.8 2.1 M9.8 0 V2.1 H12" vector-effect="non-scaling-stroke"/></g>
      <g class="ico" transform="translate(484 226) scale(0.86)"><path d="M6.5 0 V13 M0 6.5 H13" vector-effect="non-scaling-stroke"/></g>
    </g>
    <text class="muted" x="88" y="266">No sessions yet</text>
    <text class="t" x="40" y="296">▾</text><text class="t" x="72" y="296">digest</text>
    <g id="own-3">
      <rect class="own" x="424" y="308" width="88" height="26" rx="4"/>
      <g class="ico" transform="translate(442 314) scale(1.1)"><path d="M12 6.5 A5.5 5.5 0 1 1 9.8 2.1 M9.8 0 V2.1 H12" vector-effect="non-scaling-stroke"/></g>
      <g class="ico" transform="translate(484 316) scale(0.86)"><path d="M6.5 0 V13 M0 6.5 H13" vector-effect="non-scaling-stroke"/></g>
    </g>
    <text class="t" x="64" y="356">support.noticeboard</text>
  </g>

  <g id="guides">
    <line class="guide" x1="96" y1="98" x2="96" y2="372"/>
    <line class="guide" x1="88" y1="160" x2="88" y2="372"/>
    <line class="guide" x1="64" y1="340" x2="64" y2="372"/>
    <text class="lbl" x="99" y="382">36</text>
    <text class="lbl" x="70" y="382">32</text>
    <text class="lbl" x="44" y="382">20</text>
  </g>

  <g id="markers">
    <circle class="num" cx="414" cy="141" r="9"/><text class="numt" x="414" y="145">1</text>
    <circle class="num" cx="80" cy="152" r="9"/><text class="numt" x="80" y="156">2</text>
    <circle class="num" cx="226" cy="351" r="9"/><text class="numt" x="226" y="355">3</text>
    <circle class="num" cx="340" cy="171" r="9"/><text class="numt" x="340" y="175">4</text>
    <circle class="num" cx="470" cy="108" r="9"/><text class="numt" x="470" y="112">5</text>
  </g>

  <g id="callouts">
    <circle class="num" cx="566" cy="64" r="9"/><text class="numt" x="566" y="68">1</text>
    <text class="noteb" x="584" y="68">Actions get a line of their own</text>
    <text class="note" x="584" y="88">Refresh and new session sit under every open</text>
    <text class="note" x="584" y="106">leaf. 12 of 17 actions in the rail are off-row.</text>
    <circle class="num" cx="566" cy="136" r="9"/><text class="numt" x="566" y="140">2</text>
    <text class="noteb" x="584" y="140">A session starts left of its instance</text>
    <text class="note" x="584" y="160">Instance labels at 36px, their sessions at 32px.</text>
    <circle class="num" cx="566" cy="190" r="9"/><text class="numt" x="566" y="194">3</text>
    <text class="noteb" x="584" y="194">A channel sits off its column</text>
    <text class="note" x="584" y="214">support.noticeboard at 20px, 16px left of its level.</text>
    <circle class="num" cx="566" cy="244" r="9"/><text class="numt" x="566" y="248">4</text>
    <text class="noteb" x="584" y="248">Raw engine ids</text>
    <text class="note" x="584" y="268">32 characters, clipped by the rail's width.</text>
    <circle class="num" cx="566" cy="298" r="9"/><text class="numt" x="566" y="302">5</text>
    <text class="noteb" x="584" y="302">Three icon sizes, and no tree lines</text>
    <text class="note" x="584" y="322">Same 16px box, different drawings: copy covers</text>
    <text class="note" x="584" y="340">13.3px, refresh 12, plus 9.3. Nothing but indent</text>
    <text class="note" x="584" y="358">shows what belongs to what.</text>
  </g>
</svg>
