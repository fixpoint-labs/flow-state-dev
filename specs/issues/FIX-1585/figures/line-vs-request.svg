<svg viewBox="0 0 940 400" role="img" aria-label="Field by field, a transcript line against the post request that wrote it. The line&#x27;s principal is the request&#x27;s userId, its body and author are the request&#x27;s input, and its time is stamped a moment after the request started. Its id is new and does not point back to the request, and authorVerified is a constant. Only a completed post writes a line; a refused post keeps its request and writes none. The request&#x27;s block_trace item holds the same line a third time, invisible to clients."
     xmlns="http://www.w3.org/2000/svg">
  <style>
    :root { --surface:#FCFCFA; --surface-2:#E8E8E1; --ink:#191C21; --ink-2:#4C535B; --ink-3:#7A828B;
            --rule:#D5D4CB; --accent:#3E4E8C; --accent-soft:#E0E3F0; --code:#2C7C69; --code-soft:#DCEDE7;
            --prose:#A8761C; --prose-soft:#F3E8D2; --gone:#A9544F; }
    @media (prefers-color-scheme: dark) {
      :root { --surface:#181C1F; --surface-2:#202528; --ink:#E6E8E5; --ink-2:#A4ACB1; --ink-3:#737B81;
              --rule:#2B3135; --accent:#8B9BD8; --accent-soft:#1B2140; --code:#5DBBA1; --code-soft:#14302A;
              --prose:#D9A44B; --prose-soft:#332612; --gone:#DE8A84; } }
    .bg    { fill:var(--surface); }
    .lane  { fill:var(--surface-2); stroke:none; }
    .n-box { fill:var(--surface); stroke:var(--rule); stroke-width:1.2; }
    .req   { fill:var(--accent-soft); stroke:var(--accent); stroke-width:1.2; }
    .st    { fill:var(--code-soft); stroke:var(--code); stroke-width:1.2; }
    .out   { fill:var(--prose-soft); stroke:var(--prose); stroke-width:1.2; }
    .dash  { stroke-dasharray:4 3; }
    .t-lbl { fill:var(--ink-3); font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:9.5px; letter-spacing:.1em; }
    .t-h   { fill:var(--ink); font-family:system-ui,-apple-system,sans-serif; font-weight:600; font-size:13px; }
    .t-b   { fill:var(--ink); font-family:system-ui,-apple-system,sans-serif; font-size:11.5px; }
    .t-s   { fill:var(--ink-2); font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:10px; }
    .t-acc { fill:var(--accent); font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:10px; }
    .t-code{ fill:var(--code); font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:10px; }
    .t-gone{ fill:var(--gone); font-family:system-ui,-apple-system,sans-serif; font-size:11px; font-style:italic; }
    .t-mute{ fill:var(--ink-3); font-family:system-ui,-apple-system,sans-serif; font-size:11px; font-style:italic; }
    .arr   { stroke:var(--ink-2); stroke-width:1.3; fill:none; }
    .arr-g { stroke:var(--gone); stroke-width:1.3; fill:none; stroke-dasharray:4 3; }
    .map   { stroke:var(--code); stroke-width:1.3; fill:none; }
    .hd    { fill:var(--ink-2); }
    .hdg   { fill:var(--gone); }
  </style>
  <rect class="bg" x="0" y="0" width="940" height="400"/>
  <g id="heads">
    <text class="t-h" x="40" y="30">The request record · R1</text>
    <text class="t-s" x="40" y="46">request store · one per call · input kept verbatim</text>
    <text class="t-h" x="560" y="30">The transcript line</text>
    <text class="t-s" x="560" y="46">session state · transcript[i]</text>
    <rect class="req" x="28" y="58" width="360" height="226" rx="5"/>
    <rect class="st" x="548" y="58" width="352" height="226" rx="5"/>
  </g>
  <g id="request">
    <text class="t-acc" x="40" y="84">id</text>
    <text class="t-s" x="140" y="84">req_1790358291647…</text>
    <text class="t-acc" x="40" y="110">actionName</text>
    <text class="t-s" x="140" y="110">"post"</text>
    <text class="t-acc" x="40" y="136">sessionId</text>
    <text class="t-s" x="140" y="136">support.desk</text>
    <text class="t-acc" x="40" y="162">userId</text>
    <text class="t-s" x="140" y="162">devuser</text>
    <text class="t-acc" x="40" y="188">startedAtMs</text>
    <text class="t-s" x="140" y="188">1790358291647</text>
    <text class="t-acc" x="40" y="214">input.body</text>
    <text class="t-s" x="140" y="214">"Printer on 3 is down"</text>
    <text class="t-acc" x="40" y="240">input.author</text>
    <text class="t-s" x="140" y="240">absent from the browser</text>
    <text class="t-acc" x="40" y="266">status</text>
    <text class="t-s" x="140" y="266">completed</text>
  </g>
  <g id="line">
    <text class="t-code" x="560" y="84">id</text>
    <text class="t-s" x="670" y="84">new uuid</text>
    <text class="t-code" x="560" y="110">authorVerified</text>
    <text class="t-s" x="670" y="110">false · constant</text>
    <text class="t-code" x="560" y="162">principal</text>
    <text class="t-s" x="670" y="162">devuser</text>
    <text class="t-code" x="560" y="188">at</text>
    <text class="t-s" x="670" y="188">1790358291666</text>
    <text class="t-code" x="560" y="214">body</text>
    <text class="t-s" x="670" y="214">"Printer on 3 is down"</text>
    <text class="t-code" x="560" y="240">author?</text>
    <text class="t-s" x="670" y="240">absent</text>
  </g>
  <g id="maps">
    <text class="t-s" x="410" y="152">via the session's user</text>
    <path class="arr" d="M370,158 L544,158"/>
    <path class="hd" d="M544.0,158.0 L537.0,154.5 L537.0,161.5 z"/>
    <path class="arr" d="M370,210 L544,210"/>
    <path class="hd" d="M544.0,210.0 L537.0,206.5 L537.0,213.5 z"/>
    <path class="arr" d="M370,236 L544,236"/>
    <path class="hd" d="M544.0,236.0 L537.0,232.5 L537.0,239.5 z"/>
    <path class="arr" d="M370,184 L544,184"/>
    <path class="hd" d="M544.0,184.0 L537.0,180.5 L537.0,187.5 z"/>
    <text class="t-s" x="420" y="178">≈ +19 ms</text>
    <line class="arr-g" x1="370" y1="80" x2="544" y2="80"/>
    <text class="t-gone" x="420" y="74">no link back</text>
    <text class="t-mute" x="420" y="100">set by the handler</text>
    <path class="arr" d="M370,262 L544,262"/>
    <path class="hd" d="M544.0,262.0 L537.0,258.5 L537.0,265.5 z"/>
    <text class="t-s" x="410" y="256">only if completed</text>
    <text class="t-s" x="560" y="266">→ the line exists at all</text>
  </g>
  <g id="notes">
    <text class="t-b" x="40" y="332">A refused post (author not a member, POC P4) keeps its request with status failed, and writes no line.</text>
    <text class="t-b" x="40" y="352">R1's items hold the same line again, as the block_trace output: trace only, never sent to a client.</text>
    <text class="t-gone" x="40" y="372">So one post is stored three times: request input, trace output, transcript line. Only the last is meant to be read.</text>
  </g>
</svg>
