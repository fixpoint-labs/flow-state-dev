<svg viewBox="0 0 940 470" role="img" aria-label="What happens when the page posts to a channel and when it asks a seat. A post is request R1 on the channel session: its input is stored on the request, its handler appends a line to session state, and a tap starts request R2 on the same session, which notifies each member with a transient message and runs no seat. The page&#x27;s stream gets only a state change and traces. Asking a seat is request R3 on the seat&#x27;s own session; the reply is a message item there. Nothing carries the seat&#x27;s reply back into the channel."
     xmlns="http://www.w3.org/2000/svg">
  <style>
    :root { --surface:#FCFCFA; --surface-2:#E8E8E1; --ink:#191C21; --ink-2:#4C535B; --ink-3:#7A828B;
            --rule:#D5D4CB; --accent:#3E4E8C; --accent-soft:#E0E3F0; --code:#2C7C69; --code-soft:#DCEDE7;
            --prose:#A8761C; --prose-soft:#F3E8D2; --gone:#A9544F; }
    @media (prefers-color-scheme: dark) {
      :root { --surface:#181C1F; --surface-2:#202528; --ink:#E6E8E5; --ink-2:#A4ACB1; --ink-3:#737B81;
              --rule:#2B3135; --accent:#8B9BD8; --accent-soft:#1B2140; --code:#5DBBA1; --code-soft:#14302A;
              --prose:#D9A44B; --prose-soft:#332612; --gone:#DE8A84; } }
    .bg    { fill:var(--surface); }
    .lane  { fill:var(--surface-2); stroke:none; }
    .n-box { fill:var(--surface); stroke:var(--rule); stroke-width:1.2; }
    .req   { fill:var(--accent-soft); stroke:var(--accent); stroke-width:1.2; }
    .st    { fill:var(--code-soft); stroke:var(--code); stroke-width:1.2; }
    .out   { fill:var(--prose-soft); stroke:var(--prose); stroke-width:1.2; }
    .dash  { stroke-dasharray:4 3; }
    .t-lbl { fill:var(--ink-3); font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:9.5px; letter-spacing:.1em; }
    .t-h   { fill:var(--ink); font-family:system-ui,-apple-system,sans-serif; font-weight:600; font-size:13px; }
    .t-b   { fill:var(--ink); font-family:system-ui,-apple-system,sans-serif; font-size:11.5px; }
    .t-s   { fill:var(--ink-2); font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:10px; }
    .t-acc { fill:var(--accent); font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:10px; }
    .t-code{ fill:var(--code); font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:10px; }
    .t-gone{ fill:var(--gone); font-family:system-ui,-apple-system,sans-serif; font-size:11px; font-style:italic; }
    .t-mute{ fill:var(--ink-3); font-family:system-ui,-apple-system,sans-serif; font-size:11px; font-style:italic; }
    .arr   { stroke:var(--ink-2); stroke-width:1.3; fill:none; }
    .arr-g { stroke:var(--gone); stroke-width:1.3; fill:none; stroke-dasharray:4 3; }
    .map   { stroke:var(--code); stroke-width:1.3; fill:none; }
    .hd    { fill:var(--ink-2); }
    .hdg   { fill:var(--gone); }
  </style>
  <rect class="bg" x="0" y="0" width="940" height="470"/>
  <g id="lanes">
    <rect class="lane" x="16" y="14" width="160" height="444" rx="6"/>
    <text class="t-lbl" x="26" y="30">BROWSER</text>
    <rect class="lane" x="186" y="14" width="260" height="444" rx="6"/>
    <text class="t-lbl" x="196" y="30">ENGINE · one request per call</text>
    <rect class="lane" x="456" y="14" width="240" height="444" rx="6"/>
    <text class="t-lbl" x="466" y="30">CHANNEL SESSION · support.desk</text>
    <rect class="lane" x="706" y="14" width="218" height="444" rx="6"/>
    <text class="t-lbl" x="716" y="30">SEATS</text>
  </g>
  <g id="post">
    <rect class="n-box" x="26" y="56" width="140" height="44" rx="5"/>
    <text class="t-b" x="36" y="74">composer</text>
    <text class="t-s" x="36" y="90">post { body }</text>
    <path class="arr" d="M166,78 L196,78"/>
    <path class="hd" d="M196.0,78.0 L189.0,74.5 L189.0,81.5 z"/>
    <text class="t-s" x="170" y="70">①</text>
    <rect class="req" x="196" y="44" width="240" height="76" rx="5"/>
    <text class="t-lbl" x="206" y="60">REQUEST R1 · post · queue</text>
    <text class="t-s" x="206" y="78">input  { body, author? }</text>
    <text class="t-s" x="206" y="93">userId devuser · source http</text>
    <text class="t-s" x="206" y="108">status completed · startedAtMs</text>
    <path class="arr" d="M436,70 L466,70"/>
    <path class="hd" d="M466.0,70.0 L459.0,66.5 L459.0,73.5 z"/>
    <text class="t-s" x="440" y="62">②</text>
    <rect class="st" x="466" y="44" width="220" height="60" rx="5"/>
    <text class="t-lbl" x="476" y="60">STATE · transcript[]</text>
    <text class="t-code" x="476" y="78">push { id, at, principal,</text>
    <text class="t-code" x="476" y="92">       author?, body }</text>
    <path class="arr" d="M576,104 L576,150 L436,150"/>
    <path class="hd" d="M436.0,150.0 L443.0,153.5 L443.0,146.5 z"/>
    <text class="t-s" x="582" y="130">③ tap: dispatch onPosted</text>
  </g>
  <g id="fanout">
    <rect class="req" x="196" y="132" width="240" height="64" rx="5"/>
    <text class="t-lbl" x="206" y="148">REQUEST R2 · onPosted · allow</text>
    <text class="t-s" x="206" y="166">same session, started by R1</text>
    <text class="t-s" x="206" y="181">forEach member → notify</text>
    <path class="arr" d="M436,184 L716,184"/>
    <path class="hd" d="M716.0,184.0 L709.0,180.5 L709.0,187.5 z"/>
    <text class="t-s" x="600" y="178">④ per member</text>
    <rect class="out" x="716" y="150" width="198" height="72" rx="5"/>
    <text class="t-lbl" x="726" y="166">NOTIFY</text>
    <text class="t-s" x="726" y="184">support.ada · support.wren</text>
    <text class="t-gone" x="726" y="200">transient message in R2;</text>
    <text class="t-gone" x="726" y="214">no seat is run (kitchen-sink)</text>
  </g>
  <g id="back">
    <path class="arr-g" d="M196,240 L166,240"/>
    <path class="hdg" d="M166.0,240.0 L173.0,243.5 L173.0,236.5 z"/>
    <text class="t-s" x="200" y="236">⑤ R1's stream: state_change + traces</text>
    <rect class="n-box" x="26" y="222" width="140" height="40" rx="5"/>
    <text class="t-gone" x="36" y="246">nothing to render</text>
  </g>
  <g id="ask">
    <line class="map" x1="16" y1="286" x2="924" y2="286" stroke-dasharray="4 4" style="stroke:var(--rule)"/>
    <text class="t-lbl" x="26" y="306">ASKING A SEAT · a different session</text>
    <rect class="n-box" x="26" y="322" width="140" height="44" rx="5"/>
    <text class="t-b" x="36" y="340">seat composer</text>
    <text class="t-s" x="36" y="356">answer { note }</text>
    <path class="arr" d="M166,344 L196,344"/>
    <path class="hd" d="M196.0,344.0 L189.0,340.5 L189.0,347.5 z"/>
    <text class="t-s" x="170" y="336">⑥</text>
    <rect class="req" x="196" y="316" width="240" height="76" rx="5"/>
    <text class="t-lbl" x="206" y="332">REQUEST R3 · answer</text>
    <text class="t-s" x="206" y="350">session support.ada · conv c1</text>
    <text class="t-s" x="206" y="365">input { note } · userId devuser</text>
    <text class="t-s" x="206" y="380">no userMessage: note not echoed</text>
    <path class="arr" d="M436,344 L716,344"/>
    <path class="hd" d="M716.0,344.0 L709.0,340.5 L709.0,347.5 z"/>
    <text class="t-s" x="600" y="338">⑦</text>
    <rect class="out" x="716" y="316" width="198" height="76" rx="5"/>
    <text class="t-lbl" x="726" y="332">SEAT SESSION · ada/c1</text>
    <text class="t-s" x="726" y="350">message item</text>
    <text class="t-s" x="726" y="365">"[front desk] …"</text>
    <text class="t-s" x="726" y="380">client + history</text>
    <path class="arr" d="M716,384 L600,410 L166,410"/>
    <path class="hd" d="M166.0,410.0 L173.0,413.5 L173.0,406.5 z"/>
    <text class="t-s" x="300" y="404">⑧ R3's stream: the reply</text>
    <rect class="n-box" x="26" y="396" width="140" height="30" rx="5"/>
    <text class="t-b" x="36" y="415">reply shows</text>
  </g>
  <g id="gap">
    <text class="t-gone" x="466" y="440">The two never meet: the seat's reply stays in its own session.</text>
  </g>
</svg>
