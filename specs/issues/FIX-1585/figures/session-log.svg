<svg viewBox="0 0 940 380" role="img" aria-label="The channel session&#x27;s request log in order, against its transcript. Seven requests run on support.desk: posts, their fan-out requests, a refused post, a read and the boot registration. Only the two completed posts become transcript lines. A seat replying in the channel would simply be another post request carrying its author; no seat does that in kitchen-sink today."
     xmlns="http://www.w3.org/2000/svg">
  <style>
    :root { --surface:#FCFCFA; --surface-2:#E8E8E1; --ink:#191C21; --ink-2:#4C535B; --ink-3:#7A828B;
            --rule:#D5D4CB; --accent:#3E4E8C; --accent-soft:#E0E3F0; --code:#2C7C69; --code-soft:#DCEDE7;
            --prose:#A8761C; --prose-soft:#F3E8D2; --gone:#A9544F; }
    @media (prefers-color-scheme: dark) {
      :root { --surface:#181C1F; --surface-2:#202528; --ink:#E6E8E5; --ink-2:#A4ACB1; --ink-3:#737B81;
              --rule:#2B3135; --accent:#8B9BD8; --accent-soft:#1B2140; --code:#5DBBA1; --code-soft:#14302A;
              --prose:#D9A44B; --prose-soft:#332612; --gone:#DE8A84; } }
    .bg    { fill:var(--surface); }
    .lane  { fill:var(--surface-2); stroke:none; }
    .n-box { fill:var(--surface); stroke:var(--rule); stroke-width:1.2; }
    .req   { fill:var(--accent-soft); stroke:var(--accent); stroke-width:1.2; }
    .st    { fill:var(--code-soft); stroke:var(--code); stroke-width:1.2; }
    .out   { fill:var(--prose-soft); stroke:var(--prose); stroke-width:1.2; }
    .dash  { stroke-dasharray:4 3; }
    .t-lbl { fill:var(--ink-3); font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:9.5px; letter-spacing:.1em; }
    .t-h   { fill:var(--ink); font-family:system-ui,-apple-system,sans-serif; font-weight:600; font-size:13px; }
    .t-b   { fill:var(--ink); font-family:system-ui,-apple-system,sans-serif; font-size:11.5px; }
    .t-s   { fill:var(--ink-2); font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:10px; }
    .t-acc { fill:var(--accent); font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:10px; }
    .t-code{ fill:var(--code); font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:10px; }
    .t-gone{ fill:var(--gone); font-family:system-ui,-apple-system,sans-serif; font-size:11px; font-style:italic; }
    .t-mute{ fill:var(--ink-3); font-family:system-ui,-apple-system,sans-serif; font-size:11px; font-style:italic; }
    .arr   { stroke:var(--ink-2); stroke-width:1.3; fill:none; }
    .arr-g { stroke:var(--gone); stroke-width:1.3; fill:none; stroke-dasharray:4 3; }
    .map   { stroke:var(--code); stroke-width:1.3; fill:none; }
    .hd    { fill:var(--ink-2); }
    .hdg   { fill:var(--gone); }
  </style>
  <rect class="bg" x="0" y="0" width="940" height="380"/>
    <text class="t-h" x="16" y="28">Every request on support.desk, in order</text>
    <text class="t-h" x="640" y="28">transcript[]</text>
    <text class="t-lbl" x="28" y="54">REQ</text>
    <text class="t-lbl" x="76" y="54">ACTION</text>
    <text class="t-lbl" x="250" y="54">CALLER · AUTHOR</text>
    <text class="t-lbl" x="440" y="54">STATUS</text>
  <g id="log">
    <rect class="req" x="16" y="62" width="560" height="28" rx="5"/>
    <text class="t-acc" x="28" y="80">R1</text>
    <text class="t-acc" x="76" y="80">post</text>
    <text class="t-s" x="250" y="80">devuser · none</text>
    <text class="t-s" x="440" y="80">completed</text>
    <path class="arr" d="M576,76 L624,76"/>
    <path class="hd" d="M624.0,76.0 L617.0,72.5 L617.0,79.5 z"/>
    <rect class="n-box" x="16" y="98" width="560" height="28" rx="5"/>
    <text class="t-s" x="28" y="116">R2</text>
    <text class="t-s" x="76" y="116">onPosted</text>
    <text class="t-s" x="250" y="116">internal · from R1</text>
    <text class="t-s" x="440" y="116">completed</text>
    <rect class="req dash" x="16" y="134" width="560" height="28" rx="5"/>
    <text class="t-acc" x="28" y="152">R3</text>
    <text class="t-acc" x="76" y="152">post</text>
    <text class="t-s" x="250" y="152">devuser · author support.ada</text>
    <text class="t-s" x="440" y="152">completed</text>
    <path class="arr" d="M576,148 L624,148"/>
    <path class="hd" d="M624.0,148.0 L617.0,144.5 L617.0,151.5 z"/>
    <rect class="n-box" x="16" y="170" width="560" height="28" rx="5"/>
    <text class="t-s" x="28" y="188">R4</text>
    <text class="t-s" x="76" y="188">onPosted</text>
    <text class="t-s" x="250" y="188">internal · from R3</text>
    <text class="t-s" x="440" y="188">completed</text>
    <rect class="n-box" x="16" y="206" width="560" height="28" rx="5"/>
    <text class="t-s" x="28" y="224">R5</text>
    <text class="t-s" x="76" y="224">post</text>
    <text class="t-s" x="250" y="224">devuser · author "devuser"</text>
    <text class="t-gone" x="440" y="224">failed: not a member</text>
    <rect class="n-box" x="16" y="242" width="560" height="28" rx="5"/>
    <text class="t-s" x="28" y="260">R6</text>
    <text class="t-s" x="76" y="260">read</text>
    <text class="t-s" x="250" y="260">devuser</text>
    <text class="t-s" x="440" y="260">completed</text>
    <rect class="n-box" x="16" y="278" width="560" height="28" rx="5"/>
    <text class="t-s" x="28" y="296">R7</text>
    <text class="t-s" x="76" y="296">registerChannelInInventory</text>
    <text class="t-s" x="250" y="296">boot · internal</text>
    <text class="t-s" x="440" y="296">completed</text>
  </g>
  <g id="transcript">
    <rect class="st" x="630" y="62" width="294" height="28" rx="5"/>
    <text class="t-code" x="642" y="80">L1 · devuser · "Printer on 3 is down"</text>
    <rect class="st dash" x="630" y="134" width="294" height="28" rx="5"/>
    <text class="t-code" x="642" y="152">L2 · support.ada · "Filed as FU-12"</text>
    <text class="t-mute" x="642" y="214">R5, R6, R7 and the fan-outs</text>
    <text class="t-mute" x="642" y="230">leave no line.</text>
    <text class="t-s" x="642" y="266">R6's output repeats the whole</text>
    <text class="t-s" x="642" y="280">transcript as a trace item.</text>
  </g>
  <g id="notes">
    <text class="t-b" x="16" y="336">transcript = this log, filtered to action post and status completed, in order. A reply is just another post.</text>
    <text class="t-gone" x="16" y="356">R3 is dashed: no seat posts back into a channel in kitchen-sink today. The seat's answer stays in its own session.</text>
  </g>
</svg>
