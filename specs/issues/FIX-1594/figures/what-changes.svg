<svg viewBox="0 0 940 420" role="img" aria-label="Two columns for one post to support.desk. Before: the person's line reaches iris and otto, each answers in its own conversation, and the channel shows only the person's line. After: otto also calls post-to-channel, its line lands in support.desk labelled support.otto, and the fan-out of that line wakes no seat." xmlns="http://www.w3.org/2000/svg">
  <style>
    :root { --surface:#FCFCFA; --surface-2:#E8E8E1; --ink:#191C21; --ink-2:#4C535B; --ink-3:#7A828B;
            --rule:#D5D4CB; --accent:#3E4E8C; --accent-soft:#E0E3F0; --code:#2C7C69; --code-soft:#DCEDE7;
            --prose:#A8761C; --prose-soft:#F3E8D2; --gone:#A9544F; }
    @media (prefers-color-scheme: dark) {
      :root { --surface:#181C1F; --surface-2:#202528; --ink:#E6E8E5; --ink-2:#A4ACB1; --ink-3:#737B81;
              --rule:#2B3135; --accent:#8B9BD8; --accent-soft:#1B2140; --code:#5DBBA1; --code-soft:#14302A;
              --prose:#D9A44B; --prose-soft:#332612; --gone:#DE8A84; } }
    .bg { fill:var(--surface); }
    .n-box { fill:var(--surface); stroke:var(--rule); stroke-width:1.2; }
    .n-chan { fill:var(--surface-2); stroke:var(--rule); stroke-width:1.2; }
    .n-new { fill:var(--accent-soft); stroke:var(--accent); stroke-width:1.4; }
    .n-quiet { fill:none; stroke:var(--ink-3); stroke-width:1.2; stroke-dasharray:5 4; }
    .l-line { fill:var(--surface); stroke:var(--rule); stroke-width:1; }
    .l-new { fill:var(--code-soft); stroke:var(--code); stroke-width:1.2; }
    .edge { stroke:var(--ink-3); stroke-width:1.3; fill:none; marker-end:url(#arr); }
    .edge-new { stroke:var(--accent); stroke-width:1.6; fill:none; marker-end:url(#arrA); }
    .div { stroke:var(--rule); stroke-width:1; }
    .t-lbl { fill:var(--ink-3); font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:9.5px; letter-spacing:.1em; }
    .t-b { fill:var(--ink); font-family:system-ui,-apple-system,sans-serif; font-weight:600; font-size:13px; }
    .t-s { fill:var(--ink-2); font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:10px; }
    .t-a { fill:var(--accent); font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:10px; }
    .t-c { fill:var(--code); font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:10px; }
    .arrh { fill:var(--ink-3); } .arrhA { fill:var(--accent); }
  </style>
  <defs>
    <marker id="arr" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path class="arrh" d="M0,0 L8,4 L0,8 z"/></marker>
    <marker id="arrA" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path class="arrhA" d="M0,0 L8,4 L0,8 z"/></marker>
  </defs>
  <rect class="bg" x="0" y="0" width="940" height="420"/>
  <line class="div" x1="470" y1="16" x2="470" y2="404"/>

  <g id="before">
    <text class="t-lbl" x="24" y="34">TODAY · ONCE FIX-1590 LANDS</text>
    <rect class="n-chan" x="24" y="52" width="420" height="120" rx="6"/>
    <text class="t-b" x="40" y="74">support.desk</text>
    <rect class="l-line" x="40" y="86" width="388" height="28" rx="4"/>
    <text class="t-s" x="52" y="104">devuser · when do refunds post?</text>
    <text class="t-s" x="40" y="150">the only line anyone reading the channel sees</text>
    <path class="edge" d="M140 172 L110 238"/>
    <path class="edge" d="M320 172 L340 238"/>
    <text class="t-s" x="232" y="212">fan-out</text>
    <rect class="n-box" x="24" y="240" width="190" height="96" rx="6"/>
    <text class="t-b" x="40" y="264">support.iris</text>
    <text class="t-s" x="40" y="286">answers in its own</text>
    <text class="t-s" x="40" y="302">conversation</text>
    <rect class="n-box" x="254" y="240" width="190" height="96" rx="6"/>
    <text class="t-b" x="270" y="264">support.otto</text>
    <text class="t-s" x="270" y="286">answers in its own</text>
    <text class="t-s" x="270" y="302">conversation</text>
    <text class="t-s" x="24" y="376">no way back into the channel</text>
  </g>

  <g id="after">
    <text class="t-lbl" x="494" y="34">AFTER FIX-1594</text>
    <rect class="n-chan" x="494" y="52" width="420" height="120" rx="6"/>
    <text class="t-b" x="510" y="74">support.desk</text>
    <rect class="l-line" x="510" y="86" width="388" height="28" rx="4"/>
    <text class="t-s" x="522" y="104">devuser · when do refunds post?</text>
    <rect class="l-new" x="510" y="122" width="388" height="28" rx="4"/>
    <text class="t-c" x="522" y="140">support.otto · refunds post on Fridays.</text>
    <path class="edge" d="M600 172 L580 238"/>
    <path class="edge" d="M720 172 L760 238"/>
    <rect class="n-box" x="494" y="240" width="180" height="96" rx="6"/>
    <text class="t-b" x="510" y="264">support.iris</text>
    <text class="t-s" x="510" y="286">answers in its own</text>
    <text class="t-s" x="510" y="302">conversation</text>
    <rect class="n-new" x="714" y="240" width="200" height="96" rx="6"/>
    <text class="t-b" x="730" y="264">support.otto</text>
    <text class="t-a" x="730" y="286">calls post-to-channel</text>
    <text class="t-s" x="730" y="302">channel + words only</text>
    <text class="t-s" x="730" y="318">author: its own id</text>
    <path class="edge-new" d="M900 240 L900 154"/>
    <text class="t-a" x="890" y="200" text-anchor="end">the channel's</text>
    <text class="t-a" x="890" y="213" text-anchor="end">own post</text>
    <rect class="n-quiet" x="494" y="352" width="420" height="44" rx="6"/>
    <text class="t-s" x="510" y="372">fan-out of otto's line: its author is a seat,</text>
    <text class="t-s" x="510" y="387">so it wakes no seat (FIX-1590's filter)</text>
  </g>
</svg>
