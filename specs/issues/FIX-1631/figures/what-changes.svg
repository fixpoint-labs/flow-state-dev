<svg viewBox="0 0 940 300" role="img" aria-label="Where each of FIX-1631's gaps went. Three gaps the issue already credited to #2350 were fixed in its earlier commits. The six gaps listed as still open were fixed in #2350's last commit, 425cc4c1, which merged. Two stale statements in .env.local.example, found while fixing, remain, and they are the only work this issue ships."
     xmlns="http://www.w3.org/2000/svg">
  <style>
    :root { --surface:#FCFCFA; --surface-2:#E8E8E1; --ink:#191C21; --ink-2:#4C535B; --ink-3:#7A828B;
            --rule:#D5D4CB; --accent:#3E4E8C; --accent-soft:#E0E3F0; --code:#2C7C69; --code-soft:#DCEDE7;
            --prose:#A8761C; --prose-soft:#F3E8D2; --gone:#A9544F; }
    @media (prefers-color-scheme: dark) {
      :root { --surface:#181C1F; --surface-2:#202528; --ink:#E6E8E5; --ink-2:#A4ACB1; --ink-3:#737B81;
              --rule:#2B3135; --accent:#8B9BD8; --accent-soft:#1B2140; --code:#5DBBA1; --code-soft:#14302A;
              --prose:#D9A44B; --prose-soft:#332612; --gone:#DE8A84; } }
    .bg    { fill:var(--surface); }
    .src   { fill:var(--prose-soft); stroke:var(--prose); stroke-width:1.2; }
    .done  { fill:var(--code-soft); stroke:var(--code); stroke-width:1.2; }
    .todo  { fill:var(--accent-soft); stroke:var(--accent); stroke-width:1.6; }
    .edge  { stroke:var(--ink-3); stroke-width:1.2; fill:none; }
    .t-lbl { fill:var(--ink-3); font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:9.5px; letter-spacing:.1em; }
    .t-b   { fill:var(--ink); font-family:system-ui,-apple-system,sans-serif; font-weight:600; font-size:13px; }
    .t-s   { fill:var(--ink-2); font-family:system-ui,-apple-system,sans-serif; font-size:11px; }
  </style>
  <rect class="bg" x="0" y="0" width="940" height="300"/>

  <g id="source">
    <rect class="src" x="16" y="110" width="200" height="80" rx="5"/>
    <text class="t-lbl" x="32" y="132">INPUT</text>
    <text class="t-b" x="32" y="154">Blind walk-through</text>
    <text class="t-s" x="32" y="174">at 15087779b · 9 gaps</text>
  </g>

  <path class="edge" d="M216 150 C 250 150, 250 50, 290 50"/>
  <path class="edge" d="M216 150 L 290 150"/>
  <path class="edge" d="M216 150 C 250 150, 250 250, 290 250"/>

  <g id="early">
    <rect class="done" x="290" y="14" width="400" height="72" rx="5"/>
    <text class="t-lbl" x="306" y="34">DONE · #2350 EARLIER COMMITS</text>
    <text class="t-b" x="306" y="54">3 gaps the issue already credited to #2350</text>
    <text class="t-s" x="306" y="72">cwd for fsdev run · roster vs rail · + button and dsx_ rows</text>
  </g>

  <g id="last">
    <rect class="done" x="290" y="114" width="400" height="72" rx="5"/>
    <text class="t-lbl" x="306" y="134">DONE · #2350 LAST COMMIT 425cc4c1 · MERGED</text>
    <text class="t-b" x="306" y="154">The 6 gaps listed as still open</text>
    <text class="t-s" x="306" y="172">escalate · rail groups · env order · working row · fallback · model</text>
  </g>

  <g id="residue">
    <rect class="todo" x="290" y="214" width="400" height="72" rx="5"/>
    <text class="t-lbl" x="306" y="234">THIS ISSUE SHIPS</text>
    <text class="t-b" x="306" y="254">2 stale lines in .env.local.example</text>
    <text class="t-s" x="306" y="272">a missing lib/server.ts · STORE_TYPE under FSD_DB_URL</text>
  </g>

  <g id="legend">
    <text class="t-lbl" x="714" y="54">NO WORK HERE</text>
    <text class="t-lbl" x="714" y="154">NO WORK HERE</text>
    <text class="t-lbl" x="714" y="254">ONE DOCS PR</text>
  </g>
</svg>
