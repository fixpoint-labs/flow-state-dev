<svg viewBox="0 0 940 420" role="img" aria-label="D1, where the run against the installed release lives. Chosen: the existing packed-install job, where it stays after the closure. Instead of: a one-off closure script. It comes down to the first row: a regression only an install shows lands on some later commit; the standing job sees it there, the one-off never does. The price is the second row: a few more minutes on every PR and a Redis service in a second job, where the one-off costs nothing after the closure. The third row is a tie: on the closure commit both give the same verdict. Locks in: the rule that a case imports only from package entry points becomes an enforced check. Flips if: the job's time becomes a real cost on every PR; then it runs on main pushes only." xmlns="http://www.w3.org/2000/svg">
  <style>
    :root { --surface:#FCFCFA; --surface-2:#E8E8E1; --ink:#191C21; --ink-2:#4C535B; --ink-3:#7A828B;
            --rule:#D5D4CB; --accent:#3E4E8C; --accent-soft:#E0E3F0; --code:#2C7C69; --code-soft:#DCEDE7;
            --gone:#A9544F; }
    @media (prefers-color-scheme: dark) {
      :root { --surface:#181C1F; --surface-2:#202528; --ink:#E6E8E5; --ink-2:#A4ACB1; --ink-3:#737B81;
              --rule:#2B3135; --accent:#8B9BD8; --accent-soft:#1B2140; --code:#5DBBA1; --code-soft:#14302A;
              --gone:#DE8A84; } }
    .bg     { fill:var(--surface); }
    .ask    { fill:var(--surface-2); }
    .chosen { fill:var(--code-soft); stroke:var(--code); stroke-width:1.6; }
    .lost   { fill:var(--surface); stroke:var(--rule); stroke-width:1.4; stroke-dasharray:5 4; }
    .decide { fill:var(--accent-soft); }
    .bar    { fill:var(--accent); }
    .row    { stroke:var(--rule); stroke-width:1; }
    .foot   { fill:var(--surface-2); }
    .t-lbl  { fill:var(--ink-3); font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:9.5px; letter-spacing:.1em; }
    .t-tag  { font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:9.5px; letter-spacing:.1em; font-weight:600; }
    .t-q    { fill:var(--ink); font-family:system-ui,-apple-system,sans-serif; font-weight:600; font-size:15px; }
    .t-h    { font-family:system-ui,-apple-system,sans-serif; font-weight:600; font-size:14px; }
    .t-b    { fill:var(--ink); font-family:system-ui,-apple-system,sans-serif; font-size:12.5px; }
    .t-s    { fill:var(--ink-2); font-family:system-ui,-apple-system,sans-serif; font-size:11px; }
    .mark   { font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:16px; font-weight:700; }
    .plus   { fill:var(--code); }
    .minus  { fill:var(--gone); }
    .tie    { fill:var(--ink-3); }
    .c-code { fill:var(--code); }
    .c-mute { fill:var(--ink-3); }
    .c-lost { fill:var(--ink-2); }
    .c-acc  { fill:var(--accent); }
  </style>
  <rect class="bg" x="0" y="0" width="940" height="420"/>
  <g id="the-call">
    <rect class="ask" x="16" y="14" width="908" height="48" rx="6"/>
    <text class="t-lbl" x="32" y="32">D1 · THE CALL</text>
    <text class="t-q" x="32" y="52">Does the run against the installed release stay after the closure?</text>
  </g>
  <g id="options">
    <rect class="chosen" x="212" y="76" width="348" height="46" rx="5"/>
    <text class="t-tag c-code" x="228" y="93">CHOSEN</text>
    <text class="t-h c-code" x="228" y="112">Yes, in the packed-install job</text>
    <rect class="lost" x="576" y="76" width="348" height="46" rx="5"/>
    <text class="t-tag c-mute" x="592" y="93">INSTEAD OF</text>
    <text class="t-h c-lost" x="592" y="112">A one-off closure script</text>
  </g>
  <g id="row-decides">
    <rect class="decide" x="16" y="134" width="908" height="62" rx="4"/>
    <rect class="bar" x="16" y="134" width="4" height="62"/>
    <text class="t-lbl" x="32" y="156">AN INSTALL-ONLY</text>
    <text class="t-lbl" x="32" y="169">BREAK, LATER</text>
    <text class="t-tag c-acc" x="32" y="186">▸ DECIDES IT</text>
    <text class="mark plus" x="228" y="162">+</text>
    <text class="t-b" x="248" y="161">Caught on the PR that makes it</text>
    <text class="t-s" x="248" y="179">the same job that caught 0.1.1's kind</text>
    <text class="mark minus" x="592" y="162">−</text>
    <text class="t-b" x="612" y="161">Never seen</text>
    <text class="t-s" x="612" y="179">it proved one commit, then lapsed</text>
  </g>
  <g id="row-price">
    <text class="t-lbl" x="32" y="222">CI COST</text>
    <text class="mark minus" x="228" y="224">−</text>
    <text class="t-b" x="248" y="223">Minutes on every PR</text>
    <text class="t-s" x="248" y="241">and a Redis service in a second job</text>
    <text class="mark plus" x="592" y="224">+</text>
    <text class="t-b" x="612" y="223">Nothing after the closure</text>
    <text class="t-s" x="612" y="241">but a second pack path meanwhile</text>
    <line class="row" x1="16" y1="256" x2="924" y2="256"/>
  </g>
  <g id="row-tie">
    <text class="t-lbl" x="32" y="280">THE CLOSURE COMMIT</text>
    <text class="mark tie" x="228" y="282">=</text>
    <text class="t-b" x="248" y="281">Same verdict</text>
    <text class="t-s" x="248" y="299">every case, against the install</text>
    <text class="mark tie" x="592" y="282">=</text>
    <text class="t-b" x="612" y="281">Same verdict</text>
    <text class="t-s" x="612" y="299">the same cases, once</text>
    <line class="row" x1="16" y1="314" x2="924" y2="314"/>
  </g>
  <g id="locks-in">
    <rect class="foot" x="16" y="330" width="446" height="74" rx="5"/>
    <text class="t-lbl" x="32" y="351">LOCKS IN</text>
    <text class="t-b" x="32" y="371">Cases import only from package entry points</text>
    <text class="t-s" x="32" y="389">now enforced: a reach into src turns the job red</text>
  </g>
  <g id="flips-if">
    <rect class="foot" x="478" y="330" width="446" height="74" rx="5"/>
    <text class="t-lbl" x="494" y="351">FLIPS IF</text>
    <text class="t-b" x="494" y="371">The job's time becomes a real cost</text>
    <text class="t-s" x="494" y="389">then it runs on main pushes only</text>
  </g>
</svg>
