<svg viewBox="0 0 940 420" role="img" aria-label="D2, what keeps running after the epic closes. Chosen: the name scan in CI, with the Redis and reader run by hand once per main commit. Instead of: everything by hand. It comes down to the first row: when an export the page names is renamed next year, CI fails that pull request until the page is fixed, while the by-hand option lets the page lie until someone reruns the goal. The price is the second row: a rename of a name the page uses turns its pull request red and has to touch the docs. The third row is a tie: the fence on Redis and the reader run by hand either way. Locks in: the page's names become a CI contract. Flips if: the step reddens pull requests that did not change the page's meaning more often than it catches drift."
     xmlns="http://www.w3.org/2000/svg">
  <style>
    :root { --surface:#FCFCFA; --surface-2:#E8E8E1; --ink:#191C21; --ink-2:#4C535B; --ink-3:#7A828B;
            --rule:#D5D4CB; --accent:#3E4E8C; --accent-soft:#E0E3F0; --code:#2C7C69; --code-soft:#DCEDE7;
            --gone:#A9544F; }
    @media (prefers-color-scheme: dark) {
      :root { --surface:#181C1F; --surface-2:#202528; --ink:#E6E8E5; --ink-2:#A4ACB1; --ink-3:#737B81;
              --rule:#2B3135; --accent:#8B9BD8; --accent-soft:#1B2140; --code:#5DBBA1; --code-soft:#14302A;
              --gone:#DE8A84; } }
    .bg     { fill:var(--surface); }
    .ask    { fill:var(--surface-2); }
    .chosen { fill:var(--code-soft); stroke:var(--code); stroke-width:1.6; }
    .lost   { fill:var(--surface); stroke:var(--rule); stroke-width:1.4; stroke-dasharray:5 4; }
    .decide { fill:var(--accent-soft); }
    .bar    { fill:var(--accent); }
    .row    { stroke:var(--rule); stroke-width:1; }
    .foot   { fill:var(--surface-2); }
    .t-lbl  { fill:var(--ink-3); font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:9.5px; letter-spacing:.1em; }
    .t-tag  { font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:9.5px; letter-spacing:.1em; font-weight:600; }
    .t-q    { fill:var(--ink); font-family:system-ui,-apple-system,sans-serif; font-weight:600; font-size:15px; }
    .t-h    { font-family:system-ui,-apple-system,sans-serif; font-weight:600; font-size:14px; }
    .t-b    { fill:var(--ink); font-family:system-ui,-apple-system,sans-serif; font-size:12.5px; }
    .t-s    { fill:var(--ink-2); font-family:system-ui,-apple-system,sans-serif; font-size:11px; }
    .mark   { font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:16px; font-weight:700; }
    .plus   { fill:var(--code); }
    .minus  { fill:var(--gone); }
    .tie    { fill:var(--ink-3); }
    .c-code { fill:var(--code); }
    .c-mute { fill:var(--ink-3); }
    .c-lost { fill:var(--ink-2); }
    .c-acc  { fill:var(--accent); }
  </style>
  <rect class="bg" x="0" y="0" width="940" height="420"/>

  <g id="the-call">
    <rect class="ask" x="16" y="14" width="908" height="48" rx="6"/>
    <text class="t-lbl" x="32" y="32">D2 · THE CALL</text>
    <text class="t-q" x="32" y="52">What keeps checking the page after the epic closes?</text>
  </g>

  <g id="options">
    <rect class="chosen" x="212" y="76" width="348" height="46" rx="5"/>
    <text class="t-tag c-code" x="228" y="93">CHOSEN</text>
    <text class="t-h c-code" x="228" y="112">Name scan in CI, the rest by hand</text>
    <rect class="lost" x="576" y="76" width="348" height="46" rx="5"/>
    <text class="t-tag c-mute" x="592" y="93">INSTEAD OF</text>
    <text class="t-h c-lost" x="592" y="112">Everything by hand</text>
  </g>

  <g id="row-decides">
    <rect class="decide" x="16" y="134" width="908" height="62" rx="4"/>
    <rect class="bar" x="16" y="134" width="4" height="62"/>
    <text class="t-lbl" x="32" y="156">AN EXPORT IS</text>
    <text class="t-lbl" x="32" y="169">RENAMED LATER</text>
    <text class="t-tag c-acc" x="32" y="186">▸ DECIDES IT</text>
    <text class="mark plus" x="228" y="162">+</text>
    <text class="t-b" x="248" y="161">CI fails that PR</text>
    <text class="t-s" x="248" y="179">until the page names the new one</text>
    <text class="mark minus" x="592" y="162">−</text>
    <text class="t-b" x="612" y="161">The page lies quietly</text>
    <text class="t-s" x="612" y="179">until someone reruns the goal</text>
  </g>

  <g id="row-price">
    <text class="t-lbl" x="32" y="222">A PR RENAMING</text>
    <text class="t-lbl" x="32" y="235">A PAGE NAME</text>
    <text class="mark minus" x="228" y="225">−</text>
    <text class="t-b" x="248" y="224">Red, and must touch the docs</text>
    <text class="t-s" x="248" y="242">one page, bounded</text>
    <text class="mark plus" x="592" y="225">+</text>
    <text class="t-b" x="612" y="224">Merges untouched</text>
    <text class="t-s" x="612" y="242">no docs work asked</text>
    <line class="row" x1="16" y1="256" x2="924" y2="256"/>
  </g>

  <g id="row-tie">
    <text class="t-lbl" x="32" y="280">FENCE AND READER</text>
    <text class="mark tie" x="228" y="283">=</text>
    <text class="t-b" x="248" y="282">By hand, per main commit</text>
    <text class="t-s" x="248" y="300">Redis and an agent stay out of CI</text>
    <text class="mark tie" x="592" y="283">=</text>
    <text class="t-b" x="612" y="282">By hand, per main commit</text>
    <text class="t-s" x="612" y="300">the same</text>
    <line class="row" x1="16" y1="314" x2="924" y2="314"/>
  </g>

  <g id="locks-in">
    <rect class="foot" x="16" y="330" width="446" height="74" rx="5"/>
    <text class="t-lbl" x="32" y="351">LOCKS IN</text>
    <text class="t-b" x="32" y="371">The page's names are a CI contract</text>
    <text class="t-s" x="32" y="389">a rename carries its docs fix</text>
  </g>

  <g id="flips-if">
    <rect class="foot" x="478" y="330" width="446" height="74" rx="5"/>
    <text class="t-lbl" x="494" y="351">FLIPS IF</text>
    <text class="t-b" x="494" y="371">It reddens PRs that kept the page's meaning</text>
    <text class="t-s" x="494" y="389">more often than it catches real drift</text>
  </g>
</svg>
