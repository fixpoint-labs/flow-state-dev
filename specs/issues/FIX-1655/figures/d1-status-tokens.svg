<svg viewBox="0 0 940 420" role="img" aria-label="D1, how a theme reaches the colours registry components use for status. Chosen: named status tokens, fixed at each component's source. Instead of: the app remapping Tailwind's palette colours in its own stylesheet. It comes down to the first row, what a colour means: with tokens the colour follows the meaning, so a blocked task and a waiting ask can look different; a palette remap follows the hue, so every amber on every card becomes the same thing. The price is the second row: every other registry user adds the token item once, while a remap needs no change to FSD. The third row is a tie: with no theme both show today's hues. Locks in: four public token names in the registry. Flips if: only shift-manager ever skins these parts."
     xmlns="http://www.w3.org/2000/svg">
  <style>
    :root { --surface:#FCFCFA; --surface-2:#E8E8E1; --ink:#191C21; --ink-2:#4C535B; --ink-3:#7A828B;
            --rule:#D5D4CB; --accent:#3E4E8C; --accent-soft:#E0E3F0; --code:#2C7C69; --code-soft:#DCEDE7;
            --gone:#A9544F; }
    @media (prefers-color-scheme: dark) {
      :root { --surface:#181C1F; --surface-2:#202528; --ink:#E6E8E5; --ink-2:#A4ACB1; --ink-3:#737B81;
              --rule:#2B3135; --accent:#8B9BD8; --accent-soft:#1B2140; --code:#5DBBA1; --code-soft:#14302A;
              --gone:#DE8A84; } }
    .bg     { fill:var(--surface); }
    .ask    { fill:var(--surface-2); }
    .chosen { fill:var(--code-soft); stroke:var(--code); stroke-width:1.6; }
    .lost   { fill:var(--surface); stroke:var(--rule); stroke-width:1.4; stroke-dasharray:5 4; }
    .decide { fill:var(--accent-soft); }
    .bar    { fill:var(--accent); }
    .row    { stroke:var(--rule); stroke-width:1; }
    .foot   { fill:var(--surface-2); }
    .t-lbl  { fill:var(--ink-3); font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:9.5px; letter-spacing:.1em; }
    .t-tag  { font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:9.5px; letter-spacing:.1em; font-weight:600; }
    .t-q    { fill:var(--ink); font-family:system-ui,-apple-system,sans-serif; font-weight:600; font-size:15px; }
    .t-h    { font-family:system-ui,-apple-system,sans-serif; font-weight:600; font-size:14px; }
    .t-b    { fill:var(--ink); font-family:system-ui,-apple-system,sans-serif; font-size:12.5px; }
    .t-s    { fill:var(--ink-2); font-family:system-ui,-apple-system,sans-serif; font-size:11px; }
    .mark   { font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:16px; font-weight:700; }
    .plus   { fill:var(--code); }
    .minus  { fill:var(--gone); }
    .tie    { fill:var(--ink-3); }
    .c-code { fill:var(--code); }
    .c-mute { fill:var(--ink-3); }
    .c-lost { fill:var(--ink-2); }
    .c-acc  { fill:var(--accent); }
  </style>
  <rect class="bg" x="0" y="0" width="940" height="420"/>

  <g id="the-call">
    <rect class="ask" x="16" y="14" width="908" height="48" rx="6"/>
    <text class="t-lbl" x="32" y="32">D1 · THE CALL</text>
    <text class="t-q" x="32" y="52">How does a theme reach the colours components use for status?</text>
  </g>

  <g id="options">
    <rect class="chosen" x="212" y="76" width="348" height="46" rx="5"/>
    <text class="t-tag c-code" x="228" y="93">CHOSEN</text>
    <text class="t-h c-code" x="228" y="112">Named status tokens, fixed at source</text>
    <rect class="lost" x="576" y="76" width="348" height="46" rx="5"/>
    <text class="t-tag c-mute" x="592" y="93">INSTEAD OF</text>
    <text class="t-h c-lost" x="592" y="112">The app remaps Tailwind's palette</text>
  </g>

  <g id="row-decides">
    <rect class="decide" x="16" y="134" width="908" height="62" rx="4"/>
    <rect class="bar" x="16" y="134" width="4" height="62"/>
    <text class="t-lbl" x="32" y="156">WHAT A COLOUR</text>
    <text class="t-lbl" x="32" y="169">MEANS</text>
    <text class="t-tag c-acc" x="32" y="186">▸ DECIDES IT</text>
    <text class="mark plus" x="228" y="162">+</text>
    <text class="t-b" x="248" y="161">Colour follows meaning</text>
    <text class="t-s" x="248" y="179">a blocked task and a waiting ask can differ</text>
    <text class="mark minus" x="592" y="162">−</text>
    <text class="t-b" x="612" y="161">Colour follows hue</text>
    <text class="t-s" x="612" y="179">every amber becomes one thing, on every card</text>
  </g>

  <g id="row-2">
    <text class="t-lbl" x="32" y="224">OTHER REGISTRY</text>
    <text class="t-lbl" x="32" y="237">USERS</text>
    <text class="mark minus" x="228" y="220">−</text>
    <text class="t-b" x="248" y="219">Add the token item once</text>
    <text class="t-s" x="248" y="237">copies from before need it added</text>
    <text class="mark plus" x="592" y="220">+</text>
    <text class="t-b" x="612" y="219">Nothing to add</text>
    <text class="t-s" x="612" y="237">FSD's registry does not change</text>
    <line class="row" x1="16" y1="252" x2="924" y2="252"/>
  </g>

  <g id="row-3">
    <text class="t-lbl" x="32" y="282">WITH NO THEME</text>
    <text class="mark tie" x="228" y="278">=</text>
    <text class="t-b" x="248" y="277">Today's hues</text>
    <text class="t-s" x="248" y="295">one shade per meaning</text>
    <text class="mark tie" x="592" y="278">=</text>
    <text class="t-b" x="612" y="277">Today's colours</text>
    <text class="t-s" x="612" y="295">unchanged</text>
    <line class="row" x1="16" y1="310" x2="924" y2="310"/>
  </g>

  <g id="locks-in">
    <rect class="foot" x="16" y="330" width="446" height="74" rx="5"/>
    <text class="t-lbl" x="32" y="351">LOCKS IN</text>
    <text class="t-b" x="32" y="371">Four public token names in the registry</text>
    <text class="t-s" x="32" y="389">renaming one later breaks every copy that uses it</text>
  </g>

  <g id="flips-if">
    <rect class="foot" x="478" y="330" width="446" height="74" rx="5"/>
    <text class="t-lbl" x="494" y="351">FLIPS IF</text>
    <text class="t-b" x="494" y="371">Only shift-manager ever skins these parts</text>
    <text class="t-s" x="494" y="389">then a remap in one app is cheaper</text>
  </g>
</svg>
