<svg viewBox="0 0 940 360" role="img" aria-label="D3, how many App Lab theme variants ship. Chosen: light and dark. Instead of: the design kit's three, paper, draft and night. It comes down to the first row, what the epic fixed: light and dark are the two it signed, the ticket's beige for light and hand-back v1 for dark, while draft is a third variant no screen draws and no one owns. The price is the second row: the kit's warmer draft stock is not built now. Locks in: one switch, the dark class. Flips if: design pass 2 asks for draft, which is then one more block of values."
     xmlns="http://www.w3.org/2000/svg">
  <style>
    :root { --surface:#FCFCFA; --surface-2:#E8E8E1; --ink:#191C21; --ink-2:#4C535B; --ink-3:#7A828B;
            --rule:#D5D4CB; --accent:#3E4E8C; --accent-soft:#E0E3F0; --code:#2C7C69; --code-soft:#DCEDE7;
            --gone:#A9544F; }
    @media (prefers-color-scheme: dark) {
      :root { --surface:#181C1F; --surface-2:#202528; --ink:#E6E8E5; --ink-2:#A4ACB1; --ink-3:#737B81;
              --rule:#2B3135; --accent:#8B9BD8; --accent-soft:#1B2140; --code:#5DBBA1; --code-soft:#14302A;
              --gone:#DE8A84; } }
    .bg     { fill:var(--surface); }
    .ask    { fill:var(--surface-2); }
    .chosen { fill:var(--code-soft); stroke:var(--code); stroke-width:1.6; }
    .lost   { fill:var(--surface); stroke:var(--rule); stroke-width:1.4; stroke-dasharray:5 4; }
    .decide { fill:var(--accent-soft); }
    .bar    { fill:var(--accent); }
    .row    { stroke:var(--rule); stroke-width:1; }
    .foot   { fill:var(--surface-2); }
    .t-lbl  { fill:var(--ink-3); font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:9.5px; letter-spacing:.1em; }
    .t-tag  { font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:9.5px; letter-spacing:.1em; font-weight:600; }
    .t-q    { fill:var(--ink); font-family:system-ui,-apple-system,sans-serif; font-weight:600; font-size:15px; }
    .t-h    { font-family:system-ui,-apple-system,sans-serif; font-weight:600; font-size:14px; }
    .t-b    { fill:var(--ink); font-family:system-ui,-apple-system,sans-serif; font-size:12.5px; }
    .t-s    { fill:var(--ink-2); font-family:system-ui,-apple-system,sans-serif; font-size:11px; }
    .mark   { font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:16px; font-weight:700; }
    .plus   { fill:var(--code); }
    .minus  { fill:var(--gone); }
    .tie    { fill:var(--ink-3); }
    .c-code { fill:var(--code); }
    .c-mute { fill:var(--ink-3); }
    .c-lost { fill:var(--ink-2); }
    .c-acc  { fill:var(--accent); }
  </style>
  <rect class="bg" x="0" y="0" width="940" height="360"/>

  <g id="the-call">
    <rect class="ask" x="16" y="14" width="908" height="48" rx="6"/>
    <text class="t-lbl" x="32" y="32">D3 · THE CALL</text>
    <text class="t-q" x="32" y="52">How many App Lab theme variants ship?</text>
  </g>

  <g id="options">
    <rect class="chosen" x="212" y="76" width="348" height="46" rx="5"/>
    <text class="t-tag c-code" x="228" y="93">CHOSEN</text>
    <text class="t-h c-code" x="228" y="112">Light and dark</text>
    <rect class="lost" x="576" y="76" width="348" height="46" rx="5"/>
    <text class="t-tag c-mute" x="592" y="93">INSTEAD OF</text>
    <text class="t-h c-lost" x="592" y="112">Paper, draft and night</text>
  </g>

  <g id="row-decides">
    <rect class="decide" x="16" y="134" width="908" height="62" rx="4"/>
    <rect class="bar" x="16" y="134" width="4" height="62"/>
    <text class="t-lbl" x="32" y="156">WHAT THE</text>
    <text class="t-lbl" x="32" y="169">EPIC FIXED</text>
    <text class="t-tag c-acc" x="32" y="186">▸ DECIDES IT</text>
    <text class="mark plus" x="228" y="162">+</text>
    <text class="t-b" x="248" y="161">The two the epic signed</text>
    <text class="t-s" x="248" y="179">light from the ticket, dark from hand-back v1</text>
    <text class="mark minus" x="592" y="162">−</text>
    <text class="t-b" x="612" y="161">A third nobody drew</text>
    <text class="t-s" x="612" y="179">draft has no screen and no owner</text>
  </g>

  <g id="row-2">
    <text class="t-lbl" x="32" y="224">THE KIT'S</text>
    <text class="t-lbl" x="32" y="237">DRAFT STOCK</text>
    <text class="mark minus" x="228" y="220">−</text>
    <text class="t-b" x="248" y="219">Not built now</text>
    <text class="t-s" x="248" y="237">the warmer paper waits for design</text>
    <text class="mark plus" x="592" y="220">+</text>
    <text class="t-b" x="612" y="219">There on day one</text>
    <text class="t-s" x="612" y="237">one more set of values to keep</text>
    <line class="row" x1="16" y1="252" x2="924" y2="252"/>
  </g>

  <g id="locks-in">
    <rect class="foot" x="16" y="270" width="446" height="74" rx="5"/>
    <text class="t-lbl" x="32" y="291">LOCKS IN</text>
    <text class="t-b" x="32" y="311">One switch: the dark class</text>
    <text class="t-s" x="32" y="329">a third variant needs its own selector</text>
  </g>

  <g id="flips-if">
    <rect class="foot" x="478" y="270" width="446" height="74" rx="5"/>
    <text class="t-lbl" x="494" y="291">FLIPS IF</text>
    <text class="t-b" x="494" y="311">Design pass 2 asks for draft</text>
    <text class="t-s" x="494" y="329">then it is one more block of values</text>
  </g>
</svg>
