<svg viewBox="0 0 940 420" role="img" aria-label="Open fork. Should board provenance be added to every action now? Recommended: not now, keep the naming rule. Instead of: a new optional field on every action saying which collection it acts on. It comes down to what a wrong guess costs: an action offered on the wrong board refuses and writes nothing. The price of not now: the DevTool keeps a naming rule that took three review rounds. Locks in: nothing new on the action definition. Flips if: apps will write their own board-scoped actions."
     xmlns="http://www.w3.org/2000/svg">
  <style>
    :root { --surface:#FCFCFA; --surface-2:#E8E8E1; --ink:#191C21; --ink-2:#4C535B; --ink-3:#7A828B;
            --rule:#D5D4CB; --accent:#3E4E8C; --accent-soft:#E0E3F0; --code:#2C7C69; --code-soft:#DCEDE7;
            --gone:#A9544F; }
    @media (prefers-color-scheme: dark) {
      :root { --surface:#181C1F; --surface-2:#202528; --ink:#E6E8E5; --ink-2:#A4ACB1; --ink-3:#737B81;
              --rule:#2B3135; --accent:#8B9BD8; --accent-soft:#1B2140; --code:#5DBBA1; --code-soft:#14302A;
              --gone:#DE8A84; } }
    .bg     { fill:var(--surface); }
    .ask    { fill:var(--surface-2); }
    .chosen { fill:var(--code-soft); stroke:var(--code); stroke-width:1.6; }
    .rec    { fill:var(--code-soft); stroke:var(--code); stroke-width:1.6; stroke-dasharray:5 4; }
    .lost   { fill:var(--surface); stroke:var(--rule); stroke-width:1.4; stroke-dasharray:5 4; }
    .decide { fill:var(--accent-soft); }
    .bar    { fill:var(--accent); }
    .row    { stroke:var(--rule); stroke-width:1; }
    .foot   { fill:var(--surface-2); }
    .t-lbl  { fill:var(--ink-3); font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:9.5px; letter-spacing:.1em; }
    .t-tag  { font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:9.5px; letter-spacing:.1em; font-weight:600; }
    .t-q    { fill:var(--ink); font-family:system-ui,-apple-system,sans-serif; font-weight:600; font-size:15px; }
    .t-h    { font-family:system-ui,-apple-system,sans-serif; font-weight:600; font-size:14px; }
    .t-b    { fill:var(--ink); font-family:system-ui,-apple-system,sans-serif; font-size:12.5px; }
    .t-s    { fill:var(--ink-2); font-family:system-ui,-apple-system,sans-serif; font-size:11px; }
    .mark   { font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:16px; font-weight:700; }
    .plus   { fill:var(--code); }
    .minus  { fill:var(--gone); }
    .tie    { fill:var(--ink-3); }
    .c-code { fill:var(--code); }
    .c-mute { fill:var(--ink-3); }
    .c-lost { fill:var(--ink-2); }
    .c-acc  { fill:var(--accent); }
  </style>
  <rect class="bg" x="0" y="0" width="940" height="420"/>
  <g id="the-call">
    <rect class="ask" x="16" y="14" width="908" height="48" rx="6"/>
    <text class="t-lbl" x="32" y="32">OPEN · THE FORK</text>
    <text class="t-q" x="32" y="52">Board provenance: add it to every action now?</text>
  </g>
  <g id="options">
    <rect class="rec" x="212" y="76" width="348" height="46" rx="5"/>
    <text class="t-tag c-code" x="228" y="93">RECOMMENDED</text>
    <text class="t-h c-code" x="228" y="112">Not now, keep the naming rule</text>
    <rect class="lost" x="576" y="76" width="348" height="46" rx="5"/>
    <text class="t-tag c-mute" x="592" y="93">INSTEAD OF</text>
    <text class="t-h c-lost" x="592" y="112">A field on every action, now</text>
  </g>
  <g id="row-decides">
    <rect class="decide" x="16" y="134" width="908" height="62" rx="4"/>
    <rect class="bar" x="16" y="134" width="4" height="62"/>
    <text class="t-lbl" x="32" y="156">WHAT A WRONG</text>
    <text class="t-lbl" x="32" y="169">GUESS COSTS</text>
    <text class="t-tag c-acc" x="32" y="186">▸ DECIDES IT</text>
    <text class="mark plus" x="228" y="162">+</text>
    <text class="t-b" x="248" y="161">Nothing written</text>
    <text class="t-s" x="248" y="179">the action refuses on the wrong board</text>
    <text class="mark tie" x="592" y="162">=</text>
    <text class="t-b" x="612" y="161">No guess to be wrong</text>
    <text class="t-s" x="612" y="179">paying a field to prevent a harmless refusal</text>
  </g>
  <g id="row-1">
    <text class="t-lbl" x="32" y="222">FRAMEWORK</text>
    <text class="t-lbl" x="32" y="235">SURFACE</text>
    <text class="mark plus" x="228" y="225">+</text>
    <text class="t-b" x="248" y="224">Nothing new</text>
    <text class="t-s" x="248" y="242">on the action definition</text>
    <text class="mark minus" x="592" y="225">−</text>
    <text class="t-b" x="612" y="224">A permanent public field</text>
    <text class="t-s" x="612" y="242">one reader asks for it today</text>
    <line class="row" x1="16" y1="254" x2="924" y2="254"/>
  </g>
  <g id="row-2">
    <text class="t-lbl" x="32" y="280">THE NAMING</text>
    <text class="t-lbl" x="32" y="293">RULE</text>
    <text class="mark minus" x="228" y="283">−</text>
    <text class="t-b" x="248" y="282">Stays in the DevTool</text>
    <text class="t-s" x="248" y="300">it took three review rounds</text>
    <text class="mark plus" x="592" y="283">+</text>
    <text class="t-b" x="612" y="282">Deleted</text>
    <text class="t-s" x="612" y="300">apps scope actions without a convention</text>
    <line class="row" x1="16" y1="312" x2="924" y2="312"/>
  </g>
  <g id="locks-in">
    <rect class="foot" x="16" y="330" width="446" height="74" rx="5"/>
    <text class="t-lbl" x="32" y="351">LOCKS IN</text>
    <text class="t-b" x="32" y="371">Nothing new on the action definition</text>
    <text class="t-s" x="32" y="389">a follow-up can add the field later, additively</text>
  </g>
  <g id="flips-if">
    <rect class="foot" x="478" y="330" width="446" height="74" rx="5"/>
    <text class="t-lbl" x="494" y="351">FLIPS IF</text>
    <text class="t-b" x="494" y="371">Apps write their own board-scoped actions</text>
    <text class="t-s" x="494" y="389">then the rule is a convention we impose on them</text>
  </g>
</svg>
