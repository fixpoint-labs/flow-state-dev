<svg viewBox="0 0 940 360" role="img" aria-label="Before and after. Before: the Tasks-tab row infers its action's answer from three sources, the live stream, the polled request log and trace references, through a reconciler that skips lifecycle-hook traces, resolves references and merges stream-only items; each of those was a review-round edge case. After: the engine writes the action's result onto the request record in the same write as the final status, the session request list carries it, and the row reads that one field."
     xmlns="http://www.w3.org/2000/svg">
  <style>
    :root { --surface:#FCFCFA; --surface-2:#E8E8E1; --ink:#191C21; --ink-2:#4C535B; --ink-3:#7A828B;
            --rule:#D5D4CB; --accent:#3E4E8C; --accent-soft:#E0E3F0; --code:#2C7C69; --code-soft:#DCEDE7;
            --prose:#A8761C; --prose-soft:#F3E8D2; --gone:#A9544F; }
    @media (prefers-color-scheme: dark) {
      :root { --surface:#181C1F; --surface-2:#202528; --ink:#E6E8E5; --ink-2:#A4ACB1; --ink-3:#737B81;
              --rule:#2B3135; --accent:#8B9BD8; --accent-soft:#1B2140; --code:#5DBBA1; --code-soft:#14302A;
              --prose:#D9A44B; --prose-soft:#332612; --gone:#DE8A84; } }
    .bg    { fill:var(--surface); }
    .panel { fill:var(--surface-2); }
    .n-box { fill:var(--surface); stroke:var(--rule); stroke-width:1.2; }
    .gone  { fill:var(--surface); stroke:var(--gone); stroke-width:1.4; stroke-dasharray:5 4; }
    .done  { fill:var(--code-soft); stroke:var(--code); stroke-width:1.6; }
    .arrow { stroke:var(--ink-3); stroke-width:1.3; fill:none; }
    .arrow-g { stroke:var(--code); stroke-width:1.6; fill:none; }
    .t-lbl { fill:var(--ink-3); font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:9.5px; letter-spacing:.1em; }
    .t-b   { fill:var(--ink); font-family:system-ui,-apple-system,sans-serif; font-weight:600; font-size:13px; }
    .t-s   { fill:var(--ink-2); font-family:system-ui,-apple-system,sans-serif; font-size:11px; }
    .t-x   { fill:var(--gone); font-family:system-ui,-apple-system,sans-serif; font-size:11px; }
    .t-c   { fill:var(--code); font-family:system-ui,-apple-system,sans-serif; font-weight:600; font-size:13px; }
    .hd    { fill:var(--ink-3); }
    .hdg   { fill:var(--code); }
  </style>
  <rect class="bg" x="0" y="0" width="940" height="360"/>

  <g id="before">
    <rect class="panel" x="16" y="14" width="448" height="332" rx="6"/>
    <text class="t-lbl" x="32" y="36">TODAY · THE ROW INFERS IT</text>
    <rect class="n-box" x="32" y="52" width="150" height="44" rx="5"/>
    <text class="t-b" x="44" y="72">live stream</text>
    <text class="t-s" x="44" y="88">one request at a time</text>
    <rect class="n-box" x="32" y="106" width="150" height="44" rx="5"/>
    <text class="t-b" x="44" y="126">polled log</text>
    <text class="t-s" x="44" y="142">lacks transient traces</text>
    <rect class="n-box" x="32" y="160" width="150" height="44" rx="5"/>
    <text class="t-b" x="44" y="180">trace references</text>
    <text class="t-s" x="44" y="196">targets may be gone</text>
    <path class="arrow" d="M182,74 L204,118"/>
    <path class="arrow" d="M182,128 L204,128"/>
    <path class="arrow" d="M182,182 L204,138"/>
    <rect class="gone" x="206" y="70" width="246" height="118" rx="5"/>
    <text class="t-b" x="220" y="92">reconciler in the DevTool</text>
    <text class="t-x" x="220" y="112">skip lifecycle-hook traces</text>
    <text class="t-x" x="220" y="128">resolve output references</text>
    <text class="t-x" x="220" y="144">merge stream-only items</text>
    <text class="t-x" x="220" y="160">wait out suspensions</text>
    <text class="t-x" x="220" y="176">survive a stream handover</text>
    <path class="arrow" d="M327,188 L327,238"/>
    <rect class="n-box" x="206" y="240" width="242" height="44" rx="5"/>
    <text class="t-b" x="220" y="260">row: ok · refused · failed</text>
    <text class="t-s" x="220" y="276">or "no trace", "not retained"</text>
    <text class="t-s" x="32" y="316">each red line was a review round's edge case</text>
  </g>

  <g id="after">
    <rect class="panel" x="476" y="14" width="448" height="332" rx="6"/>
    <text class="t-lbl" x="492" y="36">AFTER · THE ENGINE SAYS IT</text>
    <rect class="n-box" x="492" y="52" width="416" height="44" rx="5"/>
    <text class="t-b" x="506" y="72">engine runs the action and its hooks</text>
    <text class="t-s" x="506" y="88">already holds output and error when it writes the final status</text>
    <path class="arrow-g" d="M700,96 L700,118"/>
    <rect class="done" x="492" y="120" width="416" height="56" rx="5"/>
    <text class="t-lbl" x="506" y="138">REQUEST RECORD · ONE WRITE</text>
    <text class="t-c" x="506" y="160">status + result { output?, error? }</text>
    <path class="arrow-g" d="M700,176 L700,198"/>
    <rect class="n-box" x="492" y="200" width="416" height="36" rx="5"/>
    <text class="t-b" x="506" y="223">session request list, polled with its output flag</text>
    <path class="arrow-g" d="M700,236 L700,258"/>
    <rect class="done" x="492" y="260" width="416" height="44" rx="5"/>
    <text class="t-b" x="506" y="280">row: ok · refused · failed · pending</text>
    <text class="t-s" x="506" y="296">or "no result recorded for this request"</text>
    <text class="t-s" x="492" y="330">no stream, no traces, no reconciler</text>
  </g>
  <g id="heads">
    <path class="hd" d="M204,118 L196,114 L199,122 z"/>
    <path class="hd" d="M204,128 L196,124 L196,132 z"/>
    <path class="hd" d="M204,138 L199,130 L196,138 z"/>
    <path class="hd" d="M327,238 L323,230 L331,230 z"/>
    <path class="hdg" d="M700,118 L696,110 L704,110 z"/>
    <path class="hdg" d="M700,198 L696,190 L704,190 z"/>
    <path class="hdg" d="M700,258 L696,250 L704,250 z"/>
  </g>
</svg>
