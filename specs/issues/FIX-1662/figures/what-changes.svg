<svg viewBox="0 0 940 410" role="img" aria-label="Before and after. Today: a Lab's tree is read by its own host config, which fsdev dev serves to the devtool, a debugger; kitchen-sink's shell, the only Workforce UI, writes down in its own code the seat, channel and board names its host already knows. After: the same Lab config is loaded by shift-manager's start command and served with shift-manager's pages. The sidebar, centre and right panel read teams, channels, boards, sessions and asks from the running Lab and name nothing themselves. The task screen from FIX-1664 fills the task route and the right panel's slot; the skin from FIX-1655 arrives through tokens."
     xmlns="http://www.w3.org/2000/svg">
  <style>
    :root { --surface:#FCFCFA; --surface-2:#E8E8E1; --ink:#191C21; --ink-2:#4C535B; --ink-3:#7A828B;
            --rule:#D5D4CB; --accent:#3E4E8C; --accent-soft:#E0E3F0; --code:#2C7C69; --code-soft:#DCEDE7;
            --prose:#A8761C; --prose-soft:#F3E8D2; --gone:#A9544F; }
    @media (prefers-color-scheme: dark) {
      :root { --surface:#181C1F; --surface-2:#202528; --ink:#E6E8E5; --ink-2:#A4ACB1; --ink-3:#737B81;
              --rule:#2B3135; --accent:#8B9BD8; --accent-soft:#1B2140; --code:#5DBBA1; --code-soft:#14302A;
              --prose:#D9A44B; --prose-soft:#332612; --gone:#DE8A84; } }
    .bg    { fill:var(--surface); }
    .panel { fill:var(--surface-2); }
    .n-box { fill:var(--surface); stroke:var(--rule); stroke-width:1.2; }
    .gone  { fill:var(--surface); stroke:var(--gone); stroke-width:1.4; stroke-dasharray:5 4; }
    .done  { fill:var(--code-soft); stroke:var(--code); stroke-width:1.6; }
    .inp   { fill:var(--prose-soft); stroke:var(--prose); stroke-width:1.2; stroke-dasharray:4 3; }
    .arrow { stroke:var(--ink-3); stroke-width:1.3; fill:none; }
    .arrow-g { stroke:var(--code); stroke-width:1.6; fill:none; }
    .arrow-p { stroke:var(--prose); stroke-width:1.3; fill:none; stroke-dasharray:4 3; }
    .t-lbl { fill:var(--ink-3); font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:9.5px; letter-spacing:.1em; }
    .t-b   { fill:var(--ink); font-family:system-ui,-apple-system,sans-serif; font-weight:600; font-size:13px; }
    .t-s   { fill:var(--ink-2); font-family:system-ui,-apple-system,sans-serif; font-size:11px; }
    .t-x   { fill:var(--gone); font-family:system-ui,-apple-system,sans-serif; font-size:11px; }
    .t-c   { fill:var(--code); font-family:system-ui,-apple-system,sans-serif; font-weight:600; font-size:13px; }
    .t-p   { fill:var(--prose); font-family:system-ui,-apple-system,sans-serif; font-size:11px; }
  </style>
  <rect class="bg" x="0" y="0" width="940" height="410"/>

  <g id="today">
    <rect class="panel" x="16" y="14" width="908" height="130" rx="6"/>
    <text class="t-lbl" x="32" y="36">TODAY</text>
    <rect class="n-box" x="32" y="50" width="150" height="44" rx="5"/>
    <text class="t-b" x="44" y="70">the Lab's tree</text>
    <text class="t-s" x="44" y="86">Markdown and kinds</text>
    <path class="arrow" d="M182,72 L212,72"/>
    <rect class="n-box" x="214" y="50" width="186" height="44" rx="5"/>
    <text class="t-b" x="228" y="70">the Lab's host config</text>
    <text class="t-s" x="228" y="86">reads, hires, serves</text>
    <path class="arrow" d="M400,72 L418,72"/>
    <rect class="n-box" x="420" y="50" width="216" height="44" rx="5"/>
    <text class="t-b" x="432" y="70">fsdev dev → the devtool</text>
    <text class="t-s" x="432" y="86">a debugger, not where it's used</text>
    <rect class="gone" x="652" y="50" width="256" height="78" rx="5"/>
    <text class="t-b" x="664" y="70">kitchen-sink's shell</text>
    <text class="t-x" x="664" y="88">seat, channel and board names</text>
    <text class="t-x" x="664" y="103">written into its own code</text>
    <text class="t-x" x="664" y="118">so no other Lab can reuse it</text>
  </g>

  <g id="after">
    <rect class="panel" x="16" y="156" width="908" height="240" rx="6"/>
    <text class="t-lbl" x="32" y="178">AFTER</text>
    <rect class="n-box" x="32" y="194" width="150" height="44" rx="5"/>
    <text class="t-b" x="44" y="214">the Lab's tree</text>
    <text class="t-s" x="44" y="230">unchanged</text>
    <path class="arrow" d="M182,216 L212,216"/>
    <rect class="n-box" x="214" y="194" width="186" height="44" rx="5"/>
    <text class="t-b" x="228" y="214">the same host config</text>
    <text class="t-s" x="228" y="230">+ opens its inventory</text>
    <path class="arrow-g" d="M400,216 L418,216"/>
    <rect class="done" x="420" y="194" width="488" height="186" rx="5"/>
    <text class="t-lbl" x="436" y="214">APP LAB · ONE START COMMAND · labs/shift-manager</text>
    <rect class="n-box" x="436" y="226" width="130" height="100" rx="4"/>
    <text class="t-c" x="448" y="246">sidebar</text>
    <text class="t-s" x="448" y="264">Inbox · Tasks</text>
    <text class="t-s" x="448" y="280">workstreams</text>
    <text class="t-s" x="448" y="296">teams, workers</text>
    <rect class="n-box" x="576" y="226" width="170" height="100" rx="4"/>
    <text class="t-c" x="588" y="246">centre</text>
    <text class="t-s" x="588" y="264">project · workstream</text>
    <text class="t-s" x="588" y="280">stream, board, brief</text>
    <text class="t-s" x="588" y="296">task route · frame only</text>
    <rect class="n-box" x="756" y="226" width="136" height="100" rx="4"/>
    <text class="t-c" x="768" y="246">right panel</text>
    <text class="t-s" x="768" y="264">workstream panel</text>
    <text class="t-s" x="768" y="280">task slot</text>
    <text class="t-s" x="436" y="350">reads inventory, boards, sessions, asks from the running Lab</text>
    <text class="t-s" x="436" y="366">names nothing itself · named empty state where no read ships</text>
    <rect class="inp" x="32" y="262" width="368" height="44" rx="5"/>
    <text class="t-p" x="44" y="282">FIX-1664 · the task screen fills the task route and slot</text>
    <text class="t-p" x="44" y="298">FIX-1655 · the skin arrives through tokens</text>
    <path class="arrow-p" d="M400,284 L434,284"/>
  </g>
</svg>
