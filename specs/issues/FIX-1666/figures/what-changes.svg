<svg viewBox="0 0 940 380" role="img" aria-label="What changes. Today, top lane: the EM seat has two doors, the direct file action and a post on the feature channel. Both file a row on the feature board at once, the board hands it to the coder seat, and nothing ever asks a person; Inbox has nothing to show. After, bottom lane: a third door, off by default, raised when a host opens the lab with the ask turned on. The EM pauses on a stock approval in its own session, which is where Inbox reads. Approve continues the same request into the same row code and the same board, so the coder starts. Deny files nothing. The two existing doors are unchanged."
     xmlns="http://www.w3.org/2000/svg">
  <style>
    :root { --surface:#FCFCFA; --surface-2:#E8E8E1; --ink:#191C21; --ink-2:#4C535B; --ink-3:#7A828B;
            --rule:#D5D4CB; --accent:#3E4E8C; --accent-soft:#E0E3F0; --code:#2C7C69; --code-soft:#DCEDE7;
            --gone:#A9544F; }
    @media (prefers-color-scheme: dark) {
      :root { --surface:#181C1F; --surface-2:#202528; --ink:#E6E8E5; --ink-2:#A4ACB1; --ink-3:#737B81;
              --rule:#2B3135; --accent:#8B9BD8; --accent-soft:#1B2140; --code:#5DBBA1; --code-soft:#14302A;
              --gone:#DE8A84; } }
    .bg    { fill:var(--surface); }
    .lane  { fill:var(--surface-2); }
    .box   { fill:var(--surface); stroke:var(--rule); stroke-width:1.4; }
    .new   { fill:var(--code-soft); stroke:var(--code); stroke-width:1.6; }
    .empty { fill:var(--surface); stroke:var(--gone); stroke-width:1.4; stroke-dasharray:5 4; }
    .arrow { stroke:var(--ink-3); stroke-width:1.4; fill:none; }
    .arrown{ stroke:var(--code); stroke-width:1.6; fill:none; }
    .head  { fill:var(--ink-3); }
    .headn { fill:var(--code); }
    .t-lbl { fill:var(--ink-3); font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:9.5px; letter-spacing:.1em; }
    .t-h   { fill:var(--ink); font-family:system-ui,-apple-system,sans-serif; font-weight:600; font-size:13px; }
    .t-s   { fill:var(--ink-2); font-family:system-ui,-apple-system,sans-serif; font-size:11px; }
    .c-code{ fill:var(--code); }
    .c-gone{ fill:var(--gone); }
  </style>
  <rect class="bg" x="0" y="0" width="940" height="380"/>

  <g id="today">
    <rect class="lane" x="16" y="14" width="908" height="140" rx="6"/>
    <text class="t-lbl" x="32" y="34">TODAY</text>
    <rect class="box" x="32" y="48" width="170" height="40" rx="4"/>
    <text class="t-h" x="44" y="73">file · direct action</text>
    <rect class="box" x="32" y="98" width="170" height="40" rx="4"/>
    <text class="t-h" x="44" y="123">post on the channel</text>
    <path class="arrow" d="M202,68 L318,90"/>
    <path class="arrow" d="M202,118 L318,98"/>
    <rect class="box" x="320" y="72" width="170" height="44" rx="4"/>
    <text class="t-h" x="332" y="92">row on the board</text>
    <text class="t-s" x="332" y="108">filed at once</text>
    <path class="arrow" d="M490,94 L556,94"/>
    <rect class="box" x="558" y="72" width="150" height="44" rx="4"/>
    <text class="t-h" x="570" y="92">coder seat runs</text>
    <text class="t-s" x="570" y="108">stub or real harness</text>
    <rect class="empty" x="740" y="60" width="168" height="68" rx="4"/>
    <text class="t-h c-gone" x="752" y="84">Inbox</text>
    <text class="t-s" x="752" y="102">nothing ever asks</text>
    <text class="t-s" x="752" y="117">a person anything</text>
  </g>

  <g id="after">
    <rect class="lane" x="16" y="170" width="908" height="196" rx="6"/>
    <text class="t-lbl" x="32" y="190">AFTER</text>
    <rect class="box" x="32" y="202" width="170" height="34" rx="4"/>
    <text class="t-h" x="44" y="224">file · unchanged</text>
    <rect class="box" x="32" y="242" width="170" height="34" rx="4"/>
    <text class="t-h" x="44" y="264">post · unchanged</text>
    <rect class="new" x="32" y="290" width="170" height="60" rx="4"/>
    <text class="t-h c-code" x="44" y="312">open, ask on</text>
    <text class="t-s" x="44" y="328">off by default</text>
    <text class="t-s" x="44" y="342">raised once per feature</text>
    <path class="arrow" d="M202,219 L318,248"/>
    <path class="arrow" d="M202,259 L318,256"/>
    <path class="arrown" d="M202,320 L238,320"/>
    <rect class="new" x="240" y="292" width="200" height="58" rx="4"/>
    <text class="t-h c-code" x="252" y="313">EM waits for a person</text>
    <text class="t-s" x="252" y="329">stock approval, in its session</text>
    <text class="t-s" x="252" y="343">where Inbox reads</text>
    <path class="arrown" d="M360,292 L360,278"/>
    <text class="t-s c-code" x="368" y="289">approve</text>
    <path class="arrown" d="M440,320 L556,320"/>
    <text class="t-s c-code" x="452" y="312">deny</text>
    <rect class="box" x="558" y="300" width="150" height="40" rx="4"/>
    <text class="t-h" x="570" y="325">nothing filed</text>
    <rect class="box" x="320" y="232" width="170" height="44" rx="4"/>
    <text class="t-h" x="332" y="252">row on the board</text>
    <text class="t-s" x="332" y="268">same row code</text>
    <path class="arrow" d="M490,254 L556,254"/>
    <rect class="box" x="558" y="232" width="150" height="44" rx="4"/>
    <text class="t-h" x="570" y="252">coder seat runs</text>
    <text class="t-s" x="570" y="268">same board</text>
    <rect class="new" x="740" y="232" width="168" height="72" rx="4"/>
    <text class="t-h c-code" x="752" y="256">Inbox</text>
    <text class="t-s" x="752" y="274">one approval, same</text>
    <text class="t-s" x="752" y="289">every run, no model</text>
  </g>
  <polygon class="head" points="318,90 311,86 311,94"/>
  <polygon class="head" points="318,98 311,94 311,102"/>
  <polygon class="head" points="556,94 549,90 549,98"/>
  <polygon class="head" points="318,248 311,244 311,252"/>
  <polygon class="head" points="318,256 311,252 311,260"/>
  <polygon class="headn" points="238,320 231,316 231,324"/>
  <polygon class="headn" points="360,277 356,284 364,284"/>
  <polygon class="headn" points="556,320 549,316 549,324"/>
  <polygon class="head" points="556,254 549,250 549,258"/>
</svg>
