<svg viewBox="0 0 940 420" role="img" aria-label="D1, how the rows get onto the channel's board. Chosen: the coding-run manager accepts a board a channel holds. Instead of: a copy of each row written onto the channel, or leaving the board in the kinds. It comes down to the first row: with the chosen option the row shift-manager shows is the row the run settled; a copy can say running after the run failed; leaving it in the kinds shows nothing, since shift-manager reads a workstream through its channel. The price is the second row: a package outside the lab changes, where the other two stay inside it. Third row: existing boards keep their checkouts under the chosen option, and are untouched by the others. Locks in: a patch release with unchanged checkouts, and channel boards as the answer for the next coding Lab. Flips if: the owner holds the lab-only fence as hard."
     xmlns="http://www.w3.org/2000/svg">
  <style>
    :root { --surface:#FCFCFA; --surface-2:#E8E8E1; --ink:#191C21; --ink-2:#4C535B; --ink-3:#7A828B;
            --rule:#D5D4CB; --accent:#3E4E8C; --accent-soft:#E0E3F0; --code:#2C7C69; --code-soft:#DCEDE7;
            --gone:#A9544F; }
    @media (prefers-color-scheme: dark) {
      :root { --surface:#181C1F; --surface-2:#202528; --ink:#E6E8E5; --ink-2:#A4ACB1; --ink-3:#737B81;
              --rule:#2B3135; --accent:#8B9BD8; --accent-soft:#1B2140; --code:#5DBBA1; --code-soft:#14302A;
              --gone:#DE8A84; } }
    .bg     { fill:var(--surface); }
    .ask    { fill:var(--surface-2); }
    .chosen { fill:var(--code-soft); stroke:var(--code); stroke-width:1.6; }
    .lost   { fill:var(--surface); stroke:var(--rule); stroke-width:1.4; stroke-dasharray:5 4; }
    .decide { fill:var(--accent-soft); }
    .bar    { fill:var(--accent); }
    .row    { stroke:var(--rule); stroke-width:1; }
    .foot   { fill:var(--surface-2); }
    .t-lbl  { fill:var(--ink-3); font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:9.5px; letter-spacing:.1em; }
    .t-tag  { font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:9.5px; letter-spacing:.1em; font-weight:600; }
    .t-q    { fill:var(--ink); font-family:system-ui,-apple-system,sans-serif; font-weight:600; font-size:15px; }
    .t-h    { font-family:system-ui,-apple-system,sans-serif; font-weight:600; font-size:13px; }
    .t-b    { fill:var(--ink); font-family:system-ui,-apple-system,sans-serif; font-size:12px; }
    .t-s    { fill:var(--ink-2); font-family:system-ui,-apple-system,sans-serif; font-size:10.5px; }
    .mark   { font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:16px; font-weight:700; }
    .plus   { fill:var(--code); }
    .minus  { fill:var(--gone); }
    .tie    { fill:var(--ink-3); }
    .c-code { fill:var(--code); }
    .c-mute { fill:var(--ink-3); }
    .c-lost { fill:var(--ink-2); }
    .c-acc  { fill:var(--accent); }
  </style>
  <rect class="bg" x="0" y="0" width="940" height="420"/>

  <g id="the-call">
    <rect class="ask" x="16" y="14" width="908" height="48" rx="6"/>
    <text class="t-lbl" x="32" y="32">D1 · THE CALL</text>
    <text class="t-q" x="32" y="52">How do the rows get onto the channel's board, given the manager refuses its name?</text>
  </g>

  <g id="options">
    <rect class="chosen" x="212" y="76" width="224" height="46" rx="5"/>
    <text class="t-tag c-code" x="226" y="93">CHOSEN</text>
    <text class="t-h c-code" x="226" y="112">Manager accepts it</text>
    <rect class="lost" x="452" y="76" width="224" height="46" rx="5"/>
    <text class="t-tag c-mute" x="466" y="93">INSTEAD OF</text>
    <text class="t-h c-lost" x="466" y="112">A copy on the channel</text>
    <rect class="lost" x="692" y="76" width="224" height="46" rx="5"/>
    <text class="t-tag c-mute" x="706" y="93">INSTEAD OF</text>
    <text class="t-h c-lost" x="706" y="112">Leave it in the kinds</text>
  </g>

  <g id="row-decides">
    <rect class="decide" x="16" y="134" width="908" height="62" rx="4"/>
    <rect class="bar" x="16" y="134" width="4" height="62"/>
    <text class="t-lbl" x="32" y="156">THE ROW APP LAB</text>
    <text class="t-lbl" x="32" y="169">SHOWS IS THE RUN'S</text>
    <text class="t-tag c-acc" x="32" y="186">▸ DECIDES IT</text>
    <text class="mark plus" x="226" y="162">+</text>
    <text class="t-b" x="244" y="161">Always: one row</text>
    <text class="t-s" x="244" y="179">the run sets its status</text>
    <text class="mark minus" x="466" y="162">−</text>
    <text class="t-b" x="484" y="161">Can disagree</text>
    <text class="t-s" x="484" y="179">"running" after a failed run</text>
    <text class="mark minus" x="706" y="162">−</text>
    <text class="t-b" x="724" y="161">Nothing to show</text>
    <text class="t-s" x="724" y="179">shift-manager reads the channel</text>
  </g>

  <g id="row-price">
    <text class="t-lbl" x="32" y="222">WHAT CHANGES</text>
    <text class="mark minus" x="226" y="224">−</text>
    <text class="t-b" x="244" y="223">A published package</text>
    <text class="t-s" x="244" y="241">one patch, outside the fence</text>
    <text class="mark plus" x="466" y="224">+</text>
    <text class="t-b" x="484" y="223">The lab only</text>
    <text class="t-s" x="484" y="241">plus code to keep two in step</text>
    <text class="mark plus" x="706" y="224">+</text>
    <text class="t-b" x="724" y="223">Nothing, now</text>
    <text class="t-s" x="724" y="241">the closure stays blocked</text>
    <line class="row" x1="16" y1="256" x2="924" y2="256"/>
  </g>

  <g id="row-tie">
    <text class="t-lbl" x="32" y="280">EXISTING BOARDS</text>
    <text class="mark tie" x="226" y="282">=</text>
    <text class="t-b" x="244" y="281">Same checkouts</text>
    <text class="t-s" x="244" y="299">derived exactly as before</text>
    <text class="mark tie" x="466" y="282">=</text>
    <text class="t-b" x="484" y="281">Untouched</text>
    <text class="t-s" x="484" y="299">the manager doesn't change</text>
    <text class="mark tie" x="706" y="282">=</text>
    <text class="t-b" x="724" y="281">Untouched</text>
    <text class="t-s" x="724" y="299">the same</text>
    <line class="row" x1="16" y1="314" x2="924" y2="314"/>
  </g>

  <g id="locks-in">
    <rect class="foot" x="16" y="330" width="446" height="74" rx="5"/>
    <text class="t-lbl" x="32" y="351">LOCKS IN</text>
    <text class="t-b" x="32" y="371">A patch release; nobody's checkouts move</text>
    <text class="t-s" x="32" y="389">channel boards become the answer for the next coding Lab</text>
  </g>

  <g id="flips-if">
    <rect class="foot" x="478" y="330" width="446" height="74" rx="5"/>
    <text class="t-lbl" x="494" y="351">FLIPS IF</text>
    <text class="t-b" x="494" y="371">The lab-only fence is held as hard</text>
    <text class="t-s" x="494" y="389">then the patch is its own issue, blocking this one</text>
  </g>
</svg>
