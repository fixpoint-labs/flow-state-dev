<svg viewBox="0 0 940 250" role="img" aria-label="A fence in front of the coding-run manager's derivation. Two board ids cross it: a channel's board, eng.feature.work, which gets its own checkout folder and branch, and a board named today, devforce-tasks--t0--feature, which gets exactly the folder and branch it had before. Each keeps its own lane on the far side, so the two never share. A third id, one that could climb out of a folder or break a git ref, is stopped at the fence and refused by name."
     xmlns="http://www.w3.org/2000/svg">
  <style>
    :root { --surface:#FCFCFA; --surface-2:#E8E8E1; --ink:#191C21; --ink-2:#4C535B; --ink-3:#7A828B;
            --rule:#D5D4CB; --accent:#3E4E8C; --accent-soft:#E0E3F0; --code:#2C7C69; --code-soft:#DCEDE7;
            --gone:#A9544F; }
    @media (prefers-color-scheme: dark) {
      :root { --surface:#181C1F; --surface-2:#202528; --ink:#E6E8E5; --ink-2:#A4ACB1; --ink-3:#737B81;
              --rule:#2B3135; --accent:#8B9BD8; --accent-soft:#1B2140; --code:#5DBBA1; --code-soft:#14302A;
              --gone:#DE8A84; } }
    .bg    { fill:var(--surface); }
    .box   { fill:var(--surface); stroke:var(--rule); stroke-width:1.2; }
    .ok    { fill:var(--code-soft); stroke:var(--code); stroke-width:1.3; }
    .bad   { fill:var(--surface); stroke:var(--gone); stroke-width:1.3; stroke-dasharray:5 4; }
    .fence { stroke:var(--ink-3); stroke-width:2; stroke-dasharray:6 5; }
    .arr   { stroke:var(--code); stroke-width:1.4; fill:none; }
    .stop  { stroke:var(--gone); stroke-width:1.4; fill:none; }
    .t-lbl { fill:var(--ink-3); font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:9.5px; letter-spacing:.1em; }
    .t-m   { fill:var(--ink); font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:10.5px; }
    .t-s   { fill:var(--ink-2); font-family:system-ui,-apple-system,sans-serif; font-size:11px; }
    .t-x   { fill:var(--gone); font-family:system-ui,-apple-system,sans-serif; font-size:11px; font-weight:600; }
  </style>
  <rect class="bg" x="0" y="0" width="940" height="250"/>

  <g id="inputs">
    <text class="t-lbl" x="24" y="26">BOARD IDS ARRIVING</text>
    <rect class="box" x="24" y="40" width="260" height="46" rx="5"/>
    <text class="t-m" x="38" y="60">eng.feature.work</text>
    <text class="t-s" x="38" y="77">a channel's board, minted</text>
    <rect class="box" x="24" y="104" width="260" height="46" rx="5"/>
    <text class="t-m" x="38" y="124">devforce-tasks--t0--feature</text>
    <text class="t-s" x="38" y="141">a board named today</text>
    <rect class="bad" x="24" y="168" width="260" height="46" rx="5"/>
    <text class="t-m" x="38" y="188">../escape · name.lock</text>
    <text class="t-s" x="38" y="205">climbs a folder or breaks a ref</text>
  </g>

  <g id="fence">
    <line class="fence" x1="420" y1="20" x2="420" y2="236"/>
    <text class="t-lbl" x="430" y="236">THE MANAGER'S DERIVATION</text>
  </g>

  <g id="paths">
    <path class="arr" d="M284 63 H560"/>
    <path class="arr" d="M284 127 H560"/>
    <path class="stop" d="M284 191 H410"/>
    <text class="t-x" x="296" y="184">refused by name</text>
  </g>

  <g id="outputs">
    <text class="t-lbl" x="560" y="26">CHECKOUT FOLDER · BRANCH · RUN RECORD</text>
    <rect class="ok" x="560" y="40" width="356" height="46" rx="5"/>
    <text class="t-m" x="574" y="60">its own lane</text>
    <text class="t-s" x="574" y="77">never shared with any other board</text>
    <rect class="ok" x="560" y="104" width="356" height="46" rx="5"/>
    <text class="t-m" x="574" y="124">the lane it had before</text>
    <text class="t-s" x="574" y="141">byte for byte; nobody's work moves</text>
  </g>
</svg>
