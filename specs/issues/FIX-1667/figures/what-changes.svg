<svg viewBox="0 0 940 360" role="img" aria-label="Two panels. Before: the feature channel holds no board. The row lives on a per-user ledger declared inside the EM and coder kinds, so App Lab's workstream reads the channel and finds nothing. After: the channel's file declares boards: [work]; the channel holds the ledger eng.feature.work for the whole organization; the EM files the row onto it and the coder's coding run settles the same row; App Lab reads it from the channel."
     xmlns="http://www.w3.org/2000/svg">
  <style>
    :root { --surface:#FCFCFA; --surface-2:#E8E8E1; --ink:#191C21; --ink-2:#4C535B; --ink-3:#7A828B;
            --rule:#D5D4CB; --accent:#3E4E8C; --accent-soft:#E0E3F0; --code:#2C7C69; --code-soft:#DCEDE7;
            --gone:#A9544F; }
    @media (prefers-color-scheme: dark) {
      :root { --surface:#181C1F; --surface-2:#202528; --ink:#E6E8E5; --ink-2:#A4ACB1; --ink-3:#737B81;
              --rule:#2B3135; --accent:#8B9BD8; --accent-soft:#1B2140; --code:#5DBBA1; --code-soft:#14302A;
              --gone:#DE8A84; } }
    .bg    { fill:var(--surface); }
    .pane  { fill:var(--surface-2); }
    .box   { fill:var(--surface); stroke:var(--rule); stroke-width:1.2; }
    .chan  { fill:var(--surface); stroke:var(--accent); stroke-width:1.6; }
    .row   { fill:var(--code-soft); stroke:var(--code); stroke-width:1.4; }
    .empty { fill:none; stroke:var(--gone); stroke-width:1.4; stroke-dasharray:5 4; }
    .arr   { stroke:var(--ink-3); stroke-width:1.3; fill:none; }
    .arr-x { stroke:var(--gone); stroke-width:1.3; fill:none; stroke-dasharray:4 3; }
    .t-lbl { fill:var(--ink-3); font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:9.5px; letter-spacing:.1em; }
    .t-b   { fill:var(--ink); font-family:system-ui,-apple-system,sans-serif; font-weight:600; font-size:12.5px; }
    .t-s   { fill:var(--ink-2); font-family:system-ui,-apple-system,sans-serif; font-size:11px; }
    .t-m   { fill:var(--ink-2); font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:10px; }
    .t-x   { fill:var(--gone); font-family:system-ui,-apple-system,sans-serif; font-size:11px; font-weight:600; }
    .t-ok  { fill:var(--code); font-family:system-ui,-apple-system,sans-serif; font-size:11px; font-weight:600; }
  </style>
  <rect class="bg" x="0" y="0" width="940" height="360"/>

  <g id="before">
    <rect class="pane" x="16" y="14" width="446" height="332" rx="6"/>
    <text class="t-lbl" x="32" y="36">TODAY</text>
    <rect class="chan" x="32" y="50" width="200" height="90" rx="5"/>
    <text class="t-lbl" x="46" y="70">CHANNEL · eng.feature</text>
    <text class="t-b" x="46" y="92">members, charter</text>
    <rect class="empty" x="46" y="104" width="172" height="26" rx="4"/>
    <text class="t-x" x="58" y="121">no board</text>
    <rect class="box" x="252" y="50" width="194" height="156" rx="5"/>
    <text class="t-lbl" x="266" y="70">INSIDE THE KINDS' CODE</text>
    <text class="t-s" x="266" y="90">em kind · coder kind</text>
    <text class="t-m" x="266" y="108">ledger: devforce-tasks…</text>
    <text class="t-s" x="266" y="124">per user</text>
    <rect class="row" x="266" y="138" width="166" height="54" rx="4"/>
    <text class="t-b" x="278" y="158">the row</text>
    <text class="t-s" x="278" y="176">filed by EM · settled by run</text>
    <rect class="box" x="32" y="232" width="200" height="96" rx="5"/>
    <text class="t-lbl" x="46" y="252">APP LAB · WORKSTREAM</text>
    <text class="t-b" x="46" y="276">Board · Tasks</text>
    <text class="t-x" x="46" y="298">empty</text>
    <path class="arr" d="M132 232 V144"/>
    <text class="t-s" x="140" y="194">reads the channel</text>
    <path class="arr-x" d="M252 280 H350 V196"/>
    <text class="t-x" x="262" y="300">never reaches the row</text>
  </g>

  <g id="after">
    <rect class="pane" x="478" y="14" width="446" height="332" rx="6"/>
    <text class="t-lbl" x="494" y="36">AFTER</text>
    <rect class="chan" x="494" y="50" width="414" height="156" rx="5"/>
    <text class="t-lbl" x="508" y="70">CHANNEL · eng.feature</text>
    <text class="t-m" x="508" y="90">CHANNEL.md · boards: [work]</text>
    <text class="t-m" x="508" y="108">ledger: eng.feature.work · per organization</text>
    <rect class="row" x="508" y="124" width="190" height="66" rx="4"/>
    <text class="t-b" x="520" y="146">the one row</text>
    <text class="t-s" x="520" y="164">status set by the run</text>
    <text class="t-s" x="520" y="180">no copy anywhere else</text>
    <rect class="box" x="720" y="124" width="174" height="30" rx="4"/>
    <text class="t-s" x="732" y="143">EM files onto it</text>
    <rect class="box" x="720" y="160" width="174" height="30" rx="4"/>
    <text class="t-s" x="732" y="179">coder's run settles it</text>
    <path class="arr" d="M720 139 H698"/>
    <path class="arr" d="M720 175 H698"/>
    <rect class="box" x="494" y="232" width="200" height="96" rx="5"/>
    <text class="t-lbl" x="508" y="252">APP LAB · WORKSTREAM</text>
    <text class="t-b" x="508" y="276">Board · Tasks</text>
    <text class="t-ok" x="508" y="298">the row, at its status</text>
    <path class="arr" d="M594 232 V194"/>
    <text class="t-s" x="602" y="218">reads the channel</text>
    <rect class="box" x="714" y="232" width="194" height="96" rx="5"/>
    <text class="t-lbl" x="728" y="252">CODING-RUN MANAGER</text>
    <text class="t-s" x="728" y="274">accepts the channel's</text>
    <text class="t-s" x="728" y="290">dotted board id (D1)</text>
    <text class="t-s" x="728" y="310">old ids: same folders</text>
  </g>
</svg>
