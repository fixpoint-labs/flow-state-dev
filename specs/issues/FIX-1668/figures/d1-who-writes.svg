<svg viewBox="0 0 940 426" role="img" aria-label="D1: who writes down which run is working a task? Chosen: the run, as it starts, through the claim gate. Instead of: the drain, after the hand-off returns. It comes down to when the write lands: before the worker’s first step, versus after the run has started, when it can even land after the run finished. Both add one write per attempt; the chosen one is fenced, the other races the run’s own settlement. When the write fails, the chosen option stops the attempt before any work and the board re-dispatches it; the other lets the work run unlinked. Locks in: no task is worked by a run not on its row. Flips if one write per attempt proves measurably costly."
     xmlns="http://www.w3.org/2000/svg">
  <style>
    :root { --surface:#FCFCFA; --surface-2:#E8E8E1; --ink:#191C21; --ink-2:#4C535B; --ink-3:#7A828B;
            --rule:#D5D4CB; --accent:#3E4E8C; --accent-soft:#E0E3F0; --code:#2C7C69; --code-soft:#DCEDE7;
            --gone:#A9544F; }
    @media (prefers-color-scheme: dark) {
      :root { --surface:#181C1F; --surface-2:#202528; --ink:#E6E8E5; --ink-2:#A4ACB1; --ink-3:#737B81;
              --rule:#2B3135; --accent:#8B9BD8; --accent-soft:#1B2140; --code:#5DBBA1; --code-soft:#14302A;
              --gone:#DE8A84; } }
    .bg     { fill:var(--surface); }
    .ask    { fill:var(--surface-2); }
    .chosen { fill:var(--code-soft); stroke:var(--code); stroke-width:1.6; }
    .lost   { fill:var(--surface); stroke:var(--rule); stroke-width:1.4; stroke-dasharray:5 4; }
    .decide { fill:var(--accent-soft); }
    .bar    { fill:var(--accent); }
    .row    { stroke:var(--rule); stroke-width:1; }
    .foot   { fill:var(--surface-2); }
    .t-lbl  { fill:var(--ink-3); font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:9.5px; letter-spacing:.1em; }
    .t-tag  { font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:9.5px; letter-spacing:.1em; font-weight:600; }
    .t-q    { fill:var(--ink); font-family:system-ui,-apple-system,sans-serif; font-weight:600; font-size:15px; }
    .t-h    { font-family:system-ui,-apple-system,sans-serif; font-weight:600; font-size:14px; }
    .t-b    { fill:var(--ink); font-family:system-ui,-apple-system,sans-serif; font-size:12.5px; }
    .t-s    { fill:var(--ink-2); font-family:system-ui,-apple-system,sans-serif; font-size:11px; }
    .mark   { font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:16px; font-weight:700; }
    .plus   { fill:var(--code); }
    .minus  { fill:var(--gone); }
    .tie    { fill:var(--ink-3); }
    .c-code { fill:var(--code); }
    .c-mute { fill:var(--ink-3); }
    .c-lost { fill:var(--ink-2); }
    .c-acc  { fill:var(--accent); }
  </style>
  <rect class="bg" x="0" y="0" width="940" height="426"/>
  <g id="the-call">
    <rect class="ask" x="16" y="14" width="908" height="48" rx="6"/>
    <text class="t-lbl" x="32" y="32">D1 · THE CALL</text>
    <text class="t-q" x="32" y="52">Who writes down which run is working a task?</text>
  </g>
  <g id="options">
    <rect class="chosen" x="212" y="76" width="348" height="46" rx="5"/>
    <text class="t-tag c-code" x="228" y="93">CHOSEN</text>
    <text class="t-h c-code" x="228" y="112">The run, as it starts</text>
    <rect class="lost" x="576" y="76" width="348" height="46" rx="5"/>
    <text class="t-tag c-mute" x="592" y="93">INSTEAD OF</text>
    <text class="t-h c-lost" x="592" y="112">The drain, after the hand-off returns</text>
  </g>
  <g id="row-decides">
    <rect class="decide" x="16" y="134" width="908" height="62" rx="4"/>
    <rect class="bar" x="16" y="134" width="4" height="62"/>
    <text class="t-lbl" x="32" y="156">WHEN THE</text>
    <text class="t-lbl" x="32" y="169">WRITE LANDS</text>
    <text class="t-tag c-acc" x="32" y="186">▸ DECIDES IT</text>
    <text class="mark plus" x="228" y="162">+</text>
    <text class="t-b" x="248" y="161">Before the worker’s first step</text>
    <text class="t-s" x="248" y="179">a run never works a task it isn’t on</text>
    <text class="mark minus" x="592" y="162">−</text>
    <text class="t-b" x="612" y="161">After the run has started</text>
    <text class="t-s" x="612" y="179">it can land after the run finished</text>
  </g>
  <g id="row-2">
    <text class="t-lbl" x="32" y="222">WRITES PER</text>
    <text class="t-lbl" x="32" y="235">ATTEMPT</text>
    <text class="mark minus" x="228" y="224">−</text>
    <text class="t-b" x="248" y="223">One more, fenced</text>
    <text class="t-s" x="248" y="241">the gate made none on a live lease</text>
    <text class="mark minus" x="592" y="224">−</text>
    <text class="t-b" x="612" y="223">One more, racing the run</text>
    <text class="t-s" x="612" y="241">against the run’s own settlement</text>
    <line class="row" x1="16" y1="256" x2="924" y2="256"/>
  </g>
  <g id="row-3">
    <text class="t-lbl" x="32" y="280">WHEN THE</text>
    <text class="t-lbl" x="32" y="293">WRITE FAILS</text>
    <text class="mark minus" x="228" y="282">−</text>
    <text class="t-b" x="248" y="281">The attempt stops before work</text>
    <text class="t-s" x="248" y="299">the board re-dispatches it later</text>
    <text class="mark minus" x="592" y="282">−</text>
    <text class="t-b" x="612" y="281">The work runs unlinked</text>
    <text class="t-s" x="612" y="299">the task view says nothing started</text>
    <line class="row" x1="16" y1="314" x2="924" y2="314"/>
  </g>
  <g id="locks-in">
    <rect class="foot" x="16" y="336" width="446" height="74" rx="5"/>
    <text class="t-lbl" x="32" y="357">LOCKS IN</text>
    <text class="t-b" x="32" y="377">No task is worked by a run not on its row</text>
    <text class="t-s" x="32" y="395">a store blip at the gate costs one re-dispatch</text>
  </g>
  <g id="flips-if">
    <rect class="foot" x="478" y="336" width="446" height="74" rx="5"/>
    <text class="t-lbl" x="494" y="357">FLIPS IF</text>
    <text class="t-b" x="494" y="377">One write per attempt proves measurably costly</text>
    <text class="t-s" x="494" y="395">then fold it into a write the gate already makes</text>
  </g>
</svg>
