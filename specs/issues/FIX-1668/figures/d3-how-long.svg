<svg viewBox="0 0 940 426" role="img" aria-label="D3: how long does a task keep its run link? Chosen: until the next claim. Instead of: until its attempt ends. It comes down to what a finished task shows: the run that did the work, versus no run at all. The price: the link says which run, not whether work is live; status and the request say that. Between a hand-off and the run starting, both read no run linked. Locks in: a link is not a liveness signal, and a retrying task shows its failed run until claimed. Flips if no reader needs a finished task’s run."
     xmlns="http://www.w3.org/2000/svg">
  <style>
    :root { --surface:#FCFCFA; --surface-2:#E8E8E1; --ink:#191C21; --ink-2:#4C535B; --ink-3:#7A828B;
            --rule:#D5D4CB; --accent:#3E4E8C; --accent-soft:#E0E3F0; --code:#2C7C69; --code-soft:#DCEDE7;
            --gone:#A9544F; }
    @media (prefers-color-scheme: dark) {
      :root { --surface:#181C1F; --surface-2:#202528; --ink:#E6E8E5; --ink-2:#A4ACB1; --ink-3:#737B81;
              --rule:#2B3135; --accent:#8B9BD8; --accent-soft:#1B2140; --code:#5DBBA1; --code-soft:#14302A;
              --gone:#DE8A84; } }
    .bg     { fill:var(--surface); }
    .ask    { fill:var(--surface-2); }
    .chosen { fill:var(--code-soft); stroke:var(--code); stroke-width:1.6; }
    .lost   { fill:var(--surface); stroke:var(--rule); stroke-width:1.4; stroke-dasharray:5 4; }
    .decide { fill:var(--accent-soft); }
    .bar    { fill:var(--accent); }
    .row    { stroke:var(--rule); stroke-width:1; }
    .foot   { fill:var(--surface-2); }
    .t-lbl  { fill:var(--ink-3); font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:9.5px; letter-spacing:.1em; }
    .t-tag  { font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:9.5px; letter-spacing:.1em; font-weight:600; }
    .t-q    { fill:var(--ink); font-family:system-ui,-apple-system,sans-serif; font-weight:600; font-size:15px; }
    .t-h    { font-family:system-ui,-apple-system,sans-serif; font-weight:600; font-size:14px; }
    .t-b    { fill:var(--ink); font-family:system-ui,-apple-system,sans-serif; font-size:12.5px; }
    .t-s    { fill:var(--ink-2); font-family:system-ui,-apple-system,sans-serif; font-size:11px; }
    .mark   { font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:16px; font-weight:700; }
    .plus   { fill:var(--code); }
    .minus  { fill:var(--gone); }
    .tie    { fill:var(--ink-3); }
    .c-code { fill:var(--code); }
    .c-mute { fill:var(--ink-3); }
    .c-lost { fill:var(--ink-2); }
    .c-acc  { fill:var(--accent); }
  </style>
  <rect class="bg" x="0" y="0" width="940" height="426"/>
  <g id="the-call">
    <rect class="ask" x="16" y="14" width="908" height="48" rx="6"/>
    <text class="t-lbl" x="32" y="32">D3 · THE CALL</text>
    <text class="t-q" x="32" y="52">How long does a task keep its run link?</text>
  </g>
  <g id="options">
    <rect class="chosen" x="212" y="76" width="348" height="46" rx="5"/>
    <text class="t-tag c-code" x="228" y="93">CHOSEN</text>
    <text class="t-h c-code" x="228" y="112">Until the next claim</text>
    <rect class="lost" x="576" y="76" width="348" height="46" rx="5"/>
    <text class="t-tag c-mute" x="592" y="93">INSTEAD OF</text>
    <text class="t-h c-lost" x="592" y="112">Until its attempt ends</text>
  </g>
  <g id="row-decides">
    <rect class="decide" x="16" y="134" width="908" height="62" rx="4"/>
    <rect class="bar" x="16" y="134" width="4" height="62"/>
    <text class="t-lbl" x="32" y="156">WHAT A</text>
    <text class="t-lbl" x="32" y="169">FINISHED TASK SHOWS</text>
    <text class="t-tag c-acc" x="32" y="186">▸ DECIDES IT</text>
    <text class="mark plus" x="228" y="162">+</text>
    <text class="t-b" x="248" y="161">The run that did the work</text>
    <text class="t-s" x="248" y="179">open it and see what happened</text>
    <text class="mark minus" x="592" y="162">−</text>
    <text class="t-b" x="612" y="161">No run at all</text>
    <text class="t-s" x="612" y="179">a finished task can’t be inspected</text>
  </g>
  <g id="row-2">
    <text class="t-lbl" x="32" y="222">WHAT THE</text>
    <text class="t-lbl" x="32" y="235">LINK MEANS</text>
    <text class="mark minus" x="228" y="224">−</text>
    <text class="t-b" x="248" y="223">Which run, not whether it is live</text>
    <text class="t-s" x="248" y="241">status and the request say that</text>
    <text class="mark plus" x="592" y="224">+</text>
    <text class="t-b" x="612" y="223">A link means work is live</text>
    <text class="t-s" x="612" y="241">one field answers both</text>
    <line class="row" x1="16" y1="256" x2="924" y2="256"/>
  </g>
  <g id="row-3">
    <text class="t-lbl" x="32" y="280">HAND-OFF TO</text>
    <text class="t-lbl" x="32" y="293">RUN START</text>
    <text class="mark tie" x="228" y="282">=</text>
    <text class="t-b" x="248" y="281">No run linked</text>
    <text class="t-s" x="248" y="299">the claim cleared it</text>
    <text class="mark tie" x="592" y="282">=</text>
    <text class="t-b" x="612" y="281">No run linked</text>
    <text class="t-s" x="612" y="299">the same</text>
    <line class="row" x1="16" y1="314" x2="924" y2="314"/>
  </g>
  <g id="locks-in">
    <rect class="foot" x="16" y="336" width="446" height="74" rx="5"/>
    <text class="t-lbl" x="32" y="357">LOCKS IN</text>
    <text class="t-b" x="32" y="377">A link is not a liveness signal</text>
    <text class="t-s" x="32" y="395">a retrying task shows its failed run until claimed</text>
  </g>
  <g id="flips-if">
    <rect class="foot" x="478" y="336" width="446" height="74" rx="5"/>
    <text class="t-lbl" x="494" y="357">FLIPS IF</text>
    <text class="t-b" x="494" y="377">No reader needs a finished task’s run</text>
    <text class="t-s" x="494" y="395">then clear it when the attempt ends, like claimedBy</text>
  </g>
</svg>
