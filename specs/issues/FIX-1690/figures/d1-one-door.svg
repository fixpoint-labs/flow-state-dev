<svg viewBox="0 0 940 424" role="img" aria-label="D1: how does a person&#x27;s line reach whichever worker it addresses? Chosen: each seat kind declares its door, the one public action with userMessage that takes a message, and the composers call it on the session they target. Instead of: one Workforce action on the channel flow that routes it. It comes down to the first row: what a turn does there is the target kind&#x27;s to say, and a router would dispatch into each kind anyway. Second row: no new mechanism is needed to find the door, while a channel router adds one in front and Inbox asks and task runs are not a channel&#x27;s. The price is the third row: kind authors learn one convention, and a kind with two such actions fails its hire. Locks in: the inventory names each seat&#x27;s door, and App Lab calls it without naming any kind. Flips if: a caller must send a turn without knowing the target session."
     xmlns="http://www.w3.org/2000/svg">
  <style>
    :root { --surface:#FCFCFA; --surface-2:#E8E8E1; --ink:#191C21; --ink-2:#4C535B; --ink-3:#7A828B;
            --rule:#D5D4CB; --accent:#3E4E8C; --accent-soft:#E0E3F0; --code:#2C7C69; --code-soft:#DCEDE7;
            --gone:#A9544F; }
    @media (prefers-color-scheme: dark) {
      :root { --surface:#181C1F; --surface-2:#202528; --ink:#E6E8E5; --ink-2:#A4ACB1; --ink-3:#737B81;
              --rule:#2B3135; --accent:#8B9BD8; --accent-soft:#1B2140; --code:#5DBBA1; --code-soft:#14302A;
              --gone:#DE8A84; } }
    .bg     { fill:var(--surface); }
    .ask    { fill:var(--surface-2); }
    .chosen { fill:var(--code-soft); stroke:var(--code); stroke-width:1.6; }
    .rec    { fill:var(--code-soft); stroke:var(--code); stroke-width:1.6; stroke-dasharray:5 4; }
    .lost   { fill:var(--surface); stroke:var(--rule); stroke-width:1.4; stroke-dasharray:5 4; }
    .decide { fill:var(--accent-soft); }
    .bar    { fill:var(--accent); }
    .row    { stroke:var(--rule); stroke-width:1; }
    .foot   { fill:var(--surface-2); }
    .t-lbl  { fill:var(--ink-3); font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:9.5px; letter-spacing:.1em; }
    .t-tag  { font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:9.5px; letter-spacing:.1em; font-weight:600; }
    .t-q    { fill:var(--ink); font-family:system-ui,-apple-system,sans-serif; font-weight:600; font-size:15px; }
    .t-h    { font-family:system-ui,-apple-system,sans-serif; font-weight:600; font-size:14px; }
    .t-b    { fill:var(--ink); font-family:system-ui,-apple-system,sans-serif; font-size:12.5px; }
    .t-s    { fill:var(--ink-2); font-family:system-ui,-apple-system,sans-serif; font-size:11px; }
    .mark   { font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:16px; font-weight:700; }
    .plus   { fill:var(--code); }
    .minus  { fill:var(--gone); }
    .tie    { fill:var(--ink-3); }
    .c-code { fill:var(--code); }
    .c-mute { fill:var(--ink-3); }
    .c-lost { fill:var(--ink-2); }
    .c-acc  { fill:var(--accent); }
  </style>
  <rect class="bg" x="0" y="0" width="940" height="424"/>
  <g id="the-call">
    <rect class="ask" x="16" y="14" width="908" height="48" rx="6"/>
    <text class="t-lbl" x="32" y="32">D1 · THE CALL</text>
    <text class="t-q" x="32" y="52">How does a person&#x27;s line reach whichever worker it addresses?</text>
  </g>
  <g id="options">
    <rect class="chosen" x="212" y="76" width="348" height="46" rx="5"/>
    <text class="t-tag c-code" x="228" y="93">CHOSEN</text>
    <text class="t-h c-code" x="228" y="112">Each kind declares its door</text>
    <rect class="lost" x="576" y="76" width="348" height="46" rx="5"/>
    <text class="t-tag c-mute" x="592" y="93">INSTEAD OF</text>
    <text class="t-h c-lost" x="592" y="112">One channel action routes it</text>
  </g>
  <g id="row-0">
    <rect class="decide" x="16" y="134" width="908" height="62" rx="4"/>
    <rect class="bar" x="16" y="134" width="4" height="62"/>
    <text class="t-lbl" x="32" y="156">WHAT A TURN</text>
    <text class="t-lbl" x="32" y="169">DOES THERE</text>
    <text class="t-tag c-acc" x="32" y="186">▸ DECIDES IT</text>
    <text class="mark plus" x="228" y="162">+</text>
    <text class="t-b" x="248" y="161">The target kind says</text>
    <text class="t-s" x="248" y="179">a chat takes a turn; a run stops and continues</text>
    <text class="mark minus" x="592" y="162">−</text>
    <text class="t-b" x="612" y="161">Still the kind&#x27;s</text>
    <text class="t-s" x="612" y="179">the router dispatches into each kind anyway</text>
  </g>
  <g id="row-1">
    <text class="t-lbl" x="32" y="228">NEW</text>
    <text class="t-lbl" x="32" y="241">MECHANISM</text>
    <text class="mark plus" x="228" y="230">+</text>
    <text class="t-b" x="248" y="229">None to find it</text>
    <text class="t-s" x="248" y="247">Core&#x27;s userMessage already marks the action</text>
    <text class="mark minus" x="592" y="230">−</text>
    <text class="t-b" x="612" y="229">A router in front</text>
    <text class="t-s" x="612" y="247">and Inbox asks and task runs aren&#x27;t a channel&#x27;s</text>
    <line class="row" x1="16" y1="260" x2="924" y2="260"/>
  </g>
  <g id="row-2">
    <text class="t-lbl" x="32" y="286">KIND</text>
    <text class="t-lbl" x="32" y="299">AUTHORS</text>
    <text class="mark minus" x="228" y="288">−</text>
    <text class="t-b" x="248" y="287">One convention to learn</text>
    <text class="t-s" x="248" y="305">two such actions on a kind fails its hire</text>
    <text class="mark plus" x="592" y="288">+</text>
    <text class="t-b" x="612" y="287">Nothing to declare</text>
    <text class="t-s" x="612" y="305">the router knows every kind</text>
    <line class="row" x1="16" y1="318" x2="924" y2="318"/>
  </g>
  <g id="locks-in">
    <rect class="foot" x="16" y="334" width="446" height="74" rx="5"/>
    <text class="t-lbl" x="32" y="355">LOCKS IN</text>
    <text class="t-b" x="32" y="375">The inventory names each seat&#x27;s door</text>
    <text class="t-s" x="32" y="393">App Lab calls it; names no kind</text>
  </g>

  <g id="flips-if">
    <rect class="foot" x="478" y="334" width="446" height="74" rx="5"/>
    <text class="t-lbl" x="494" y="355">FLIPS IF</text>
    <text class="t-b" x="494" y="375">A caller can&#x27;t know the target session</text>
    <text class="t-s" x="494" y="393">then a server-side resolver earns its place</text>
  </g>
</svg>
