<svg viewBox="0 0 940 424" role="img" aria-label="Open fork: how does a person&#x27;s line reach a coding run that is working right now? Recommended: stop the run, then continue the same coding session with the line as its prompt. Alternative: live delivery mid-step on the harnesses that support it. It comes down to the first row: stop-and-continue covers Claude Code, Codex and Cursor today, while live delivery covers only Claude Code and Cursor and still needs stop-and-continue as its fallback. The price is the second row: the step the run was on is cut and resumed. Third row: stop-and-continue needs one small generic hook, live delivery about two more PRs. Locks in: a turn is stop, then continue the session. Flips if: losing the current step is unacceptable, or the closure&#x27;s real-model run shows the restart confuses the model."
     xmlns="http://www.w3.org/2000/svg">
  <style>
    :root { --surface:#FCFCFA; --surface-2:#E8E8E1; --ink:#191C21; --ink-2:#4C535B; --ink-3:#7A828B;
            --rule:#D5D4CB; --accent:#3E4E8C; --accent-soft:#E0E3F0; --code:#2C7C69; --code-soft:#DCEDE7;
            --gone:#A9544F; }
    @media (prefers-color-scheme: dark) {
      :root { --surface:#181C1F; --surface-2:#202528; --ink:#E6E8E5; --ink-2:#A4ACB1; --ink-3:#737B81;
              --rule:#2B3135; --accent:#8B9BD8; --accent-soft:#1B2140; --code:#5DBBA1; --code-soft:#14302A;
              --gone:#DE8A84; } }
    .bg     { fill:var(--surface); }
    .ask    { fill:var(--surface-2); }
    .chosen { fill:var(--code-soft); stroke:var(--code); stroke-width:1.6; }
    .rec    { fill:var(--code-soft); stroke:var(--code); stroke-width:1.6; stroke-dasharray:5 4; }
    .lost   { fill:var(--surface); stroke:var(--rule); stroke-width:1.4; stroke-dasharray:5 4; }
    .decide { fill:var(--accent-soft); }
    .bar    { fill:var(--accent); }
    .row    { stroke:var(--rule); stroke-width:1; }
    .foot   { fill:var(--surface-2); }
    .t-lbl  { fill:var(--ink-3); font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:9.5px; letter-spacing:.1em; }
    .t-tag  { font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:9.5px; letter-spacing:.1em; font-weight:600; }
    .t-q    { fill:var(--ink); font-family:system-ui,-apple-system,sans-serif; font-weight:600; font-size:15px; }
    .t-h    { font-family:system-ui,-apple-system,sans-serif; font-weight:600; font-size:14px; }
    .t-b    { fill:var(--ink); font-family:system-ui,-apple-system,sans-serif; font-size:12.5px; }
    .t-s    { fill:var(--ink-2); font-family:system-ui,-apple-system,sans-serif; font-size:11px; }
    .mark   { font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:16px; font-weight:700; }
    .plus   { fill:var(--code); }
    .minus  { fill:var(--gone); }
    .tie    { fill:var(--ink-3); }
    .c-code { fill:var(--code); }
    .c-mute { fill:var(--ink-3); }
    .c-lost { fill:var(--ink-2); }
    .c-acc  { fill:var(--accent); }
  </style>
  <rect class="bg" x="0" y="0" width="940" height="424"/>
  <g id="the-call">
    <rect class="ask" x="16" y="14" width="908" height="48" rx="6"/>
    <text class="t-lbl" x="32" y="32">OPEN · THE FORK</text>
    <text class="t-q" x="32" y="52">How does a person&#x27;s line reach a coding run that is working right now?</text>
  </g>
  <g id="options">
    <rect class="rec" x="212" y="76" width="348" height="46" rx="5"/>
    <text class="t-tag c-code" x="228" y="93">RECOMMENDED</text>
    <text class="t-h c-code" x="228" y="112">Stop, then continue the session</text>
    <rect class="lost" x="576" y="76" width="348" height="46" rx="5"/>
    <text class="t-tag c-mute" x="592" y="93">ALTERNATIVE</text>
    <text class="t-h c-lost" x="592" y="112">Live mid-step, where supported</text>
  </g>
  <g id="row-0">
    <rect class="decide" x="16" y="134" width="908" height="62" rx="4"/>
    <rect class="bar" x="16" y="134" width="4" height="62"/>
    <text class="t-lbl" x="32" y="156">HARNESSES</text>
    <text class="t-lbl" x="32" y="169">COVERED</text>
    <text class="t-tag c-acc" x="32" y="186">▸ DECIDES IT</text>
    <text class="mark plus" x="228" y="162">+</text>
    <text class="t-b" x="248" y="161">Claude Code, Codex, Cursor</text>
    <text class="t-s" x="248" y="179">all three resume a session by id today</text>
    <text class="mark minus" x="592" y="162">−</text>
    <text class="t-b" x="612" y="161">Claude Code and Cursor only</text>
    <text class="t-s" x="612" y="179">Codex still needs stop-and-continue</text>
  </g>
  <g id="row-1">
    <text class="t-lbl" x="32" y="228">THE STEP IT</text>
    <text class="t-lbl" x="32" y="241">WAS ON</text>
    <text class="mark minus" x="228" y="230">−</text>
    <text class="t-b" x="248" y="229">Cut, then resumed</text>
    <text class="t-s" x="248" y="247">a restart of a few seconds per message</text>
    <text class="mark plus" x="592" y="230">+</text>
    <text class="t-b" x="612" y="229">Kept</text>
    <text class="t-s" x="612" y="247">the run hears you and carries on</text>
    <line class="row" x1="16" y1="260" x2="924" y2="260"/>
  </g>
  <g id="row-2">
    <text class="t-lbl" x="32" y="286">COST BEFORE</text>
    <text class="t-lbl" x="32" y="299">THE CLOSURE</text>
    <text class="mark plus" x="228" y="288">+</text>
    <text class="t-b" x="248" y="287">One small generic hook</text>
    <text class="t-s" x="248" y="305">stop a request in its own session</text>
    <text class="mark minus" x="592" y="288">−</text>
    <text class="t-b" x="612" y="287">About two more PRs</text>
    <text class="t-s" x="612" y="305">a second hook and Claude Code&#x27;s main loop</text>
    <line class="row" x1="16" y1="318" x2="924" y2="318"/>
  </g>
  <g id="locks-in">
    <rect class="foot" x="16" y="334" width="446" height="74" rx="5"/>
    <text class="t-lbl" x="32" y="355">LOCKS IN</text>
    <text class="t-b" x="32" y="375">A turn is stop, then continue the session</text>
    <text class="t-s" x="32" y="393">the ask path&#x27;s shape, started by the person</text>
  </g>

  <g id="flips-if">
    <rect class="foot" x="478" y="334" width="446" height="74" rx="5"/>
    <text class="t-lbl" x="494" y="355">FLIPS IF</text>
    <text class="t-b" x="494" y="375">Losing the current step is unacceptable</text>
    <text class="t-s" x="494" y="393">or a4 shows the restart confuses the model</text>
  </g>
</svg>
