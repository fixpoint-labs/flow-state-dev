<svg viewBox="0 0 940 420" role="img" aria-label="D3: who sets up CoS and a project template on the next Lab for the next-Lab journey? Chosen: an isolated writer that reads only the published docs and a scratch copy of the pentest Lab, listing every step it guessed. Instead of: the closure worker setting it up from the specs. It comes down to the first row, who the reader is: only a docs-only reader tests what a Lab author gets. Second row: a guessed step becomes a doc finding. Third row, the price: a cold writer may trip on what a real author would ask. Locks in a scratch copy, nothing committed, every guess filed. Flips if the docs name a generator that adds CoS to a Lab."
     xmlns="http://www.w3.org/2000/svg">
  <style>
    :root { --surface:#FCFCFA; --surface-2:#E8E8E1; --ink:#191C21; --ink-2:#4C535B; --ink-3:#7A828B;
            --rule:#D5D4CB; --accent:#3E4E8C; --accent-soft:#E0E3F0; --code:#2C7C69; --code-soft:#DCEDE7;
            --gone:#A9544F; }
    @media (prefers-color-scheme: dark) {
      :root { --surface:#181C1F; --surface-2:#202528; --ink:#E6E8E5; --ink-2:#A4ACB1; --ink-3:#737B81;
              --rule:#2B3135; --accent:#8B9BD8; --accent-soft:#1B2140; --code:#5DBBA1; --code-soft:#14302A;
              --gone:#DE8A84; } }
    .bg     { fill:var(--surface); }
    .ask    { fill:var(--surface-2); }
    .chosen { fill:var(--code-soft); stroke:var(--code); stroke-width:1.6; }
    .rec    { fill:var(--code-soft); stroke:var(--code); stroke-width:1.6; stroke-dasharray:6 3; }
    .lost   { fill:var(--surface); stroke:var(--rule); stroke-width:1.4; stroke-dasharray:5 4; }
    .decide { fill:var(--accent-soft); }
    .bar    { fill:var(--accent); }
    .row    { stroke:var(--rule); stroke-width:1; }
    .foot   { fill:var(--surface-2); }
    .t-lbl  { fill:var(--ink-3); font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:9.5px; letter-spacing:.1em; }
    .t-tag  { font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:9.5px; letter-spacing:.1em; font-weight:600; }
    .t-q    { fill:var(--ink); font-family:system-ui,-apple-system,sans-serif; font-weight:600; font-size:15px; }
    .t-h    { font-family:system-ui,-apple-system,sans-serif; font-weight:600; font-size:14px; }
    .t-b    { fill:var(--ink); font-family:system-ui,-apple-system,sans-serif; font-size:12.5px; }
    .t-s    { fill:var(--ink-2); font-family:system-ui,-apple-system,sans-serif; font-size:11px; }
    .mark   { font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:16px; font-weight:700; }
    .plus   { fill:var(--code); }
    .minus  { fill:var(--gone); }
    .tie    { fill:var(--ink-3); }
    .c-code { fill:var(--code); }
    .c-mute { fill:var(--ink-3); }
    .c-lost { fill:var(--ink-2); }
    .c-acc  { fill:var(--accent); }
  </style>
  <rect class="bg" x="0" y="0" width="940" height="420"/>
  <g id="the-call">
    <rect class="ask" x="16" y="14" width="908" height="48" rx="6"/>
    <text class="t-lbl" x="32" y="32">D3 &#183; THE CALL</text>
    <text class="t-q" x="32" y="52">The next-Lab journey needs CoS and a project template on the pentest Lab. Who writes them?</text>
  </g>
  <g id="options">
    <rect class="chosen" x="212" y="76" width="348" height="46" rx="5"/>
    <text class="t-tag c-code" x="228" y="93">CHOSEN</text>
    <text class="t-h c-code" x="228" y="112">A writer with the docs alone</text>
    <rect class="lost" x="576" y="76" width="348" height="46" rx="5"/>
    <text class="t-tag c-mute" x="592" y="93">INSTEAD OF</text>
    <text class="t-h c-lost" x="592" y="112">The closure worker, from the specs</text>
  </g>
  <g id="row-1">
    <rect class="decide" x="16" y="134" width="908" height="62" rx="4"/>
    <rect class="bar" x="16" y="134" width="4" height="62"/>
    <text class="t-lbl" x="32" y="156">WHO THE</text>
    <text class="t-lbl" x="32" y="169">READER IS</text>
    <text class="t-tag c-acc" x="32" y="186">&#9656; DECIDES IT</text>
    <text class="mark plus" x="228" y="162">+</text>
    <text class="t-b" x="248" y="161">What a Lab author has</text>
    <text class="t-s" x="248" y="179">the docs, and nothing else</text>
    <text class="mark minus" x="592" y="162">&#8722;</text>
    <text class="t-b" x="612" y="161">What the implementers knew</text>
    <text class="t-s" x="612" y="179">the specs fill every gap</text>
  </g>
  <g id="row-2">
    <text class="t-lbl" x="32" y="224">A MISSING</text>
    <text class="t-lbl" x="32" y="237">STEP</text>
    <text class="mark plus" x="228" y="227">+</text>
    <text class="t-b" x="248" y="226">Listed and filed</text>
    <text class="t-s" x="248" y="244">a doc gap a sentence fixes</text>
    <text class="mark minus" x="592" y="227">&#8722;</text>
    <text class="t-b" x="612" y="226">Crossed silently</text>
    <text class="t-s" x="612" y="244">the docs ship with it</text>
    <line class="row" x1="16" y1="252" x2="924" y2="252"/>
  </g>
  <g id="row-3">
    <text class="t-lbl" x="32" y="282">COST</text>
    <text class="t-lbl" x="32" y="295"></text>
    <text class="mark minus" x="228" y="285">&#8722;</text>
    <text class="t-b" x="248" y="284">A cold writer can trip</text>
    <text class="t-s" x="248" y="302">on what an author would ask</text>
    <text class="mark plus" x="592" y="285">+</text>
    <text class="t-b" x="612" y="284">Fast and sure</text>
    <text class="t-s" x="612" y="302">the worker knows the shape</text>
    <line class="row" x1="16" y1="310" x2="924" y2="310"/>
  </g>
  <g id="locks-in">
    <rect class="foot" x="16" y="330" width="446" height="74" rx="5"/>
    <text class="t-lbl" x="32" y="351">LOCKS IN</text>
    <text class="t-b" x="32" y="371">A scratch copy of the pentest Lab, never committed</text>
    <text class="t-s" x="32" y="389">every guessed step is a finding</text>
  </g>
  <g id="flips-if">
    <rect class="foot" x="478" y="330" width="446" height="74" rx="5"/>
    <text class="t-lbl" x="494" y="351">FLIPS IF</text>
    <text class="t-b" x="494" y="371">The docs name a generator that adds CoS</text>
    <text class="t-s" x="494" y="389">then the writer runs it</text>
  </g>
</svg>
