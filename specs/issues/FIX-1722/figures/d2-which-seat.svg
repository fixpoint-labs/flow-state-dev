<svg viewBox="0 0 940 422" role="img" aria-label="D2, which seat Shift Manager talks to as the Chief of Staff before FIX-1719 lands. Chosen: the seat FIX-1719 names, and until it merges, the one seat a Lab declares named chief-of-staff on the built-in agent kind, found by one rule in one place that also matches FIX-1719&#x27;s org seat. Instead of: waiting for FIX-1719 before building the view. It comes down to the first row, when it can be built and proved: now, on the shipped door and send path, against waiting on FIX-1719&#x27;s spec and build. Second row, the price: until org seats are hireable, the CoS is a team&#x27;s worker, against the org seat from day one; the rule finds both, so the shell doesn&#x27;t change when it moves. Third row is a tie: nothing goes into Core or Engine either way. Locks in: a Lab with no such seat, or two, sees the summary and a named state in place of the conversation. Flips if: FIX-1719 changes its contract to mark the CoS outside the inventory row; then that read joins the shell&#x27;s snapshot."
     xmlns="http://www.w3.org/2000/svg">
  <style>
    :root { --surface:#FCFCFA; --surface-2:#E8E8E1; --ink:#191C21; --ink-2:#4C535B; --ink-3:#7A828B;
            --rule:#D5D4CB; --accent:#3E4E8C; --accent-soft:#E0E3F0; --code:#2C7C69; --code-soft:#DCEDE7;
            --gone:#A9544F; }
    @media (prefers-color-scheme: dark) {
      :root { --surface:#181C1F; --surface-2:#202528; --ink:#E6E8E5; --ink-2:#A4ACB1; --ink-3:#737B81;
              --rule:#2B3135; --accent:#8B9BD8; --accent-soft:#1B2140; --code:#5DBBA1; --code-soft:#14302A;
              --gone:#DE8A84; } }
    .bg     { fill:var(--surface); }
    .ask    { fill:var(--surface-2); }
    .chosen { fill:var(--code-soft); stroke:var(--code); stroke-width:1.6; }
    .rec    { fill:var(--code-soft); stroke:var(--code); stroke-width:1.6; stroke-dasharray:5 4; }
    .lost   { fill:var(--surface); stroke:var(--rule); stroke-width:1.4; stroke-dasharray:5 4; }
    .decide { fill:var(--accent-soft); }
    .bar    { fill:var(--accent); }
    .row    { stroke:var(--rule); stroke-width:1; }
    .foot   { fill:var(--surface-2); }
    .t-lbl  { fill:var(--ink-3); font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:9.5px; letter-spacing:.1em; }
    .t-tag  { font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:9.5px; letter-spacing:.1em; font-weight:600; }
    .t-q    { fill:var(--ink); font-family:system-ui,-apple-system,sans-serif; font-weight:600; font-size:15px; }
    .t-h    { font-family:system-ui,-apple-system,sans-serif; font-weight:600; font-size:14px; }
    .t-b    { fill:var(--ink); font-family:system-ui,-apple-system,sans-serif; font-size:12.5px; }
    .t-s    { fill:var(--ink-2); font-family:system-ui,-apple-system,sans-serif; font-size:11px; }
    .mark   { font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:16px; font-weight:700; }
    .plus   { fill:var(--code); }
    .minus  { fill:var(--gone); }
    .tie    { fill:var(--ink-3); }
    .c-code { fill:var(--code); }
    .c-mute { fill:var(--ink-3); }
    .c-lost { fill:var(--ink-2); }
    .c-acc  { fill:var(--accent); }
  </style>
  <rect class="bg" x="0" y="0" width="940" height="422"/>

  <g id="the-call">
    <rect class="ask" x="16" y="14" width="908" height="48" rx="6"/>
    <text class="t-lbl" x="32" y="32">D2 · THE CALL</text>
    <text class="t-q" x="32" y="52">Which seat is the Chief of Staff before FIX-1719 lands?</text>
  </g>

  <g id="options">
    <rect class="chosen" x="212" y="76" width="348" height="46" rx="5"/>
    <text class="t-tag c-code" x="228" y="93">CHOSEN</text>
    <text class="t-h c-code" x="228" y="112">FIX-1719&#x27;s seat; until then, chief-of-staff</text>
    <rect class="lost" x="576" y="76" width="348" height="46" rx="5"/>
    <text class="t-tag c-mute" x="592" y="93">INSTEAD OF</text>
    <text class="t-h c-lost" x="592" y="112">Wait for FIX-1719</text>
  </g>

  <g id="row-0">
    <rect class="decide" x="16" y="134" width="908" height="62" rx="4"/>
    <rect class="bar" x="16" y="134" width="4" height="62"/>
    <text class="t-lbl" x="32" y="156">WHEN IT CAN BE</text>
    <text class="t-lbl" x="32" y="169">BUILT AND PROVED</text>
    <text class="t-tag c-acc" x="32" y="186">▸ DECIDES IT</text>
    <text class="mark plus" x="228" y="162">+</text>
    <text class="t-b" x="248" y="161">Now</text>
    <text class="t-s" x="248" y="179">the door and send path already ship</text>
    <text class="mark minus" x="592" y="162">−</text>
    <text class="t-b" x="612" y="161">After FIX-1719 merges</text>
    <text class="t-s" x="612" y="179">its spec has only just started</text>
  </g>
  <g id="row-1">
    <text class="t-lbl" x="32" y="226">WHERE THE SEAT</text>
    <text class="t-lbl" x="32" y="239">LIVES</text>
    <text class="mark minus" x="228" y="228">−</text>
    <text class="t-b" x="248" y="227">In a team, for now</text>
    <text class="t-s" x="248" y="245">moves to org/workers/ once org seats hire</text>
    <text class="mark plus" x="592" y="228">+</text>
    <text class="t-b" x="612" y="227">Under org/workers/</text>
    <text class="t-s" x="612" y="245">as FIX-1719 declares it</text>
    <line class="row" x1="16" y1="258" x2="924" y2="258"/>
  </g>
  <g id="row-2">
    <text class="t-lbl" x="32" y="284">THE LAYER RULE</text>
    <text class="mark tie" x="228" y="286">=</text>
    <text class="t-b" x="248" y="285">Lab only</text>
    <text class="t-s" x="248" y="303">no CoS type in Core or Engine</text>
    <text class="mark tie" x="592" y="286">=</text>
    <text class="t-b" x="612" y="285">Lab only</text>
    <text class="t-s" x="612" y="303">the same</text>
    <line class="row" x1="16" y1="316" x2="924" y2="316"/>
  </g>

  <g id="locks-in">
    <rect class="foot" x="16" y="332" width="446" height="74" rx="5"/>
    <text class="t-lbl" x="32" y="353">LOCKS IN</text>
    <text class="t-b" x="32" y="373">No CoS seat, or two: summary plus a named state</text>
    <text class="t-s" x="32" y="391">never a guess at which seat to talk to</text>
  </g>

  <g id="flips-if">
    <rect class="foot" x="478" y="332" width="446" height="74" rx="5"/>
    <text class="t-lbl" x="494" y="353">FLIPS IF</text>
    <text class="t-b" x="494" y="373">FIX-1719 marks the CoS outside the inventory row</text>
    <text class="t-s" x="494" y="391">then that read joins the shell&#x27;s snapshot</text>
  </g>
</svg>
