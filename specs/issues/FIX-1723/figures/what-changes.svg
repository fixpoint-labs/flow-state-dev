<svg viewBox="0 0 940 470" role="img" aria-label="What changes. Before: the sidebar's TEAMS lists each seat with working, waiting on you or idle, and there is no Roster. After: a Roster entry under Tasks with its on-shift and on-call counts, TEAMS rows of one status square per worker that open Roster filtered to the team, the Roster page grouping every seat on shift, on call or off shift with slots in use, the tasks it holds and what it waits on, and the footer counts. All of it is drawn from one status rule fed by the board rows and pending asks the Lab already records; Workforce, Core and Engine gain nothing."
     xmlns="http://www.w3.org/2000/svg">
  <style>
    :root { --surface:#FCFCFA; --surface-2:#E8E8E1; --ink:#191C21; --ink-2:#4C535B; --ink-3:#7A828B;
            --rule:#D5D4CB; --accent:#3E4E8C; --accent-soft:#E0E3F0; --code:#2C7C69; --code-soft:#DCEDE7;
            --prose:#A8761C; --prose-soft:#F3E8D2; --gone:#A9544F; }
    @media (prefers-color-scheme: dark) {
      :root { --surface:#181C1F; --surface-2:#202528; --ink:#E6E8E5; --ink-2:#A4ACB1; --ink-3:#737B81;
              --rule:#2B3135; --accent:#8B9BD8; --accent-soft:#1B2140; --code:#5DBBA1; --code-soft:#14302A;
              --prose:#D9A44B; --prose-soft:#332612; --gone:#DE8A84; } }
    .bg    { fill:var(--surface); }
    .n-box { fill:var(--surface); stroke:var(--rule); stroke-width:1.2; }
    .gone  { fill:var(--surface); stroke:var(--gone); stroke-width:1.2; stroke-dasharray:4 3; }
    .new   { fill:var(--code-soft); stroke:var(--code); stroke-width:1.4; }
    .src   { fill:var(--prose-soft); stroke:var(--prose); stroke-width:1.2; }
    .rule  { fill:var(--accent-soft); stroke:var(--accent); stroke-width:1.4; }
    .sq-on   { fill:var(--accent); }
    .sq-call { fill:var(--accent-soft); stroke:var(--accent); stroke-width:1.2; }
    .sq-off  { fill:none; stroke:var(--ink-3); stroke-width:1.2; }
    .arrow { stroke:var(--ink-3); stroke-width:1.2; fill:none; }
    .div   { stroke:var(--rule); stroke-width:1; stroke-dasharray:3 3; }
    .t-lbl { fill:var(--ink-3); font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:9.5px; letter-spacing:.1em; }
    .t-b   { fill:var(--ink); font-family:system-ui,-apple-system,sans-serif; font-weight:600; font-size:13px; }
    .t-s   { fill:var(--ink-2); font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:9.5px; }
    .t-g   { fill:var(--gone); font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:9.5px; }
  </style>
  <rect class="bg" x="0" y="0" width="940" height="470"/>

  <g id="before">
    <text class="t-lbl" x="16" y="24">TODAY</text>
    <rect class="n-box" x="16" y="34" width="250" height="96" rx="5"/>
    <text class="t-lbl" x="30" y="54">SIDEBAR · TEAMS</text>
    <text class="t-b" x="30" y="76">eng</text>
    <text class="t-s" x="42" y="94">coder · working</text>
    <text class="t-s" x="42" y="108">em · waiting on you</text>
    <text class="t-s" x="42" y="122">reviewer · idle</text>
    <rect class="gone" x="290" y="34" width="250" height="96" rx="5"/>
    <text class="t-g" x="304" y="54">NO ROSTER</text>
    <text class="t-s" x="304" y="76">who is on shift: add it up yourself</text>
    <text class="t-s" x="304" y="92">who waits on you: read Inbox</text>
    <text class="t-s" x="304" y="108">slots: count Tasks by worker</text>
  </g>

  <line class="div" x1="16" y1="150" x2="924" y2="150"/>

  <g id="after-sources">
    <text class="t-lbl" x="16" y="176">AFTER · READ FROM WHAT THE LAB RECORDS</text>
    <rect class="src" x="16" y="190" width="190" height="52" rx="5"/>
    <text class="t-b" x="30" y="212">board rows</text>
    <text class="t-s" x="30" y="230">held: running, waiting on you</text>
    <rect class="src" x="16" y="256" width="190" height="52" rx="5"/>
    <text class="t-b" x="30" y="278">pending asks</text>
    <text class="t-s" x="30" y="296">the seat's, from Inbox</text>
    <rect class="src" x="16" y="322" width="190" height="52" rx="5"/>
    <text class="t-b" x="30" y="344">seat inventory</text>
    <text class="t-s" x="30" y="362">who is on a team · FIX-1719</text>
  </g>

  <g id="after-rule">
    <rect class="rule" x="246" y="232" width="170" height="70" rx="5"/>
    <text class="t-lbl" x="260" y="252">THE ONE STATUS RULE</text>
    <text class="t-b" x="260" y="274">in Shift Manager</text>
    <text class="t-s" x="260" y="292">no field in Workforce</text>
    <path class="arrow" d="M206 216 L246 256"/>
    <path class="arrow" d="M206 282 L246 274"/>
    <path class="arrow" d="M206 348 L246 290"/>
  </g>

  <g id="after-screens">
    <path class="arrow" d="M416 250 L456 212"/>
    <path class="arrow" d="M416 268 L456 300"/>
    <path class="arrow" d="M416 286 L456 392"/>
    <rect class="new" x="456" y="168" width="468" height="96" rx="5"/>
    <text class="t-lbl" x="470" y="188">ROSTER · ALL OR ONE TEAM</text>
    <rect class="sq-on" x="470" y="200" width="9" height="9"/>
    <text class="t-s" x="486" y="208">ON SHIFT · coder · 2 in use · holds T-4, T-7</text>
    <rect class="sq-call" x="470" y="218" width="9" height="9"/>
    <text class="t-s" x="486" y="226">ON CALL · em · 0 in use · waits on you: the ask</text>
    <rect class="sq-off" x="470" y="236" width="9" height="9"/>
    <text class="t-s" x="486" y="244">OFF SHIFT · reviewer · nothing assigned</text>
    <rect class="new" x="456" y="276" width="468" height="96" rx="5"/>
    <text class="t-lbl" x="470" y="296">SIDEBAR</text>
    <text class="t-s" x="470" y="316">Inbox · Tasks · Roster  1·1</text>
    <text class="t-s" x="470" y="336">TEAMS  eng  1/3</text>
    <rect class="sq-on" x="590" y="328" width="9" height="9"/>
    <rect class="sq-call" x="604" y="328" width="9" height="9"/>
    <rect class="sq-off" x="618" y="328" width="9" height="9"/>
    <text class="t-s" x="640" y="336">a row opens Roster for the team</text>
    <text class="t-s" x="470" y="358">footer: 1 on shift · 1 on call</text>
    <rect class="new" x="456" y="384" width="468" height="44" rx="5"/>
    <text class="t-lbl" x="470" y="402">WORKSTREAM PANEL</text>
    <text class="t-s" x="470" y="418">the same three words, from the same rule</text>
  </g>

  <g id="legend">
    <text class="t-s" x="16" y="456">amber: read from the Lab · blue: the rule · green: drawn after this issue · red dashed: missing today</text>
  </g>
</svg>
