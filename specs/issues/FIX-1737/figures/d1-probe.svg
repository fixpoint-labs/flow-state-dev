<svg viewBox="0 0 940 418" role="img" aria-label="D1, how a check decides a screen matches v2. Chosen: a computed-style probe against a v2 look table. Instead of: a pixel diff against a render of v2. Decides it: whether there is a reference at all; v2 cannot be rendered without the runtime nobody handed back, while the table cites the v2 source line by line. Second row: v2&#x27;s mock data is no Lab&#x27;s, so a pixel diff would flag every line of content. The price: drift the table doesn&#x27;t list, such as spacing or an icon&#x27;s shape, passes. Locks in the look table as what matches v2 means. Flips if Claude Design hands back the runtime."
     xmlns="http://www.w3.org/2000/svg">
  <style>
    :root { --surface:#FCFCFA; --surface-2:#E8E8E1; --ink:#191C21; --ink-2:#4C535B; --ink-3:#7A828B;
            --rule:#D5D4CB; --accent:#3E4E8C; --accent-soft:#E0E3F0; --code:#2C7C69; --code-soft:#DCEDE7;
            --gone:#A9544F; }
    @media (prefers-color-scheme: dark) {
      :root { --surface:#181C1F; --surface-2:#202528; --ink:#E6E8E5; --ink-2:#A4ACB1; --ink-3:#737B81;
              --rule:#2B3135; --accent:#8B9BD8; --accent-soft:#1B2140; --code:#5DBBA1; --code-soft:#14302A;
              --gone:#DE8A84; } }
    .bg     { fill:var(--surface); }
    .ask    { fill:var(--surface-2); }
    .chosen { fill:var(--code-soft); stroke:var(--code); stroke-width:1.6; }
    .lost   { fill:var(--surface); stroke:var(--rule); stroke-width:1.4; stroke-dasharray:5 4; }
    .decide { fill:var(--accent-soft); }
    .bar    { fill:var(--accent); }
    .row    { stroke:var(--rule); stroke-width:1; }
    .foot   { fill:var(--surface-2); }
    .t-lbl  { fill:var(--ink-3); font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:9.5px; letter-spacing:.1em; }
    .t-tag  { font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:9.5px; letter-spacing:.1em; font-weight:600; }
    .t-q    { fill:var(--ink); font-family:system-ui,-apple-system,sans-serif; font-weight:600; font-size:15px; }
    .t-h    { font-family:system-ui,-apple-system,sans-serif; font-weight:600; font-size:14px; }
    .t-b    { fill:var(--ink); font-family:system-ui,-apple-system,sans-serif; font-size:12.5px; }
    .t-s    { fill:var(--ink-2); font-family:system-ui,-apple-system,sans-serif; font-size:11px; }
    .mark   { font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:16px; font-weight:700; }
    .plus   { fill:var(--code); }
    .minus  { fill:var(--gone); }
    .tie    { fill:var(--ink-3); }
    .c-code { fill:var(--code); }
    .c-mute { fill:var(--ink-3); }
    .c-lost { fill:var(--ink-2); }
    .c-acc  { fill:var(--accent); }
  </style>
  <rect class="bg" x="0" y="0" width="940" height="418"/>

  <g id="the-call">
    <rect class="ask" x="16" y="14" width="908" height="48" rx="6"/>
    <text class="t-lbl" x="32" y="32">D1 · THE CALL</text>
    <text class="t-q" x="32" y="52">How does a check decide that a screen matches v2?</text>
  </g>

  <g id="options">
    <rect class="chosen" x="212" y="76" width="348" height="46" rx="5"/>
    <text class="t-tag c-code" x="228" y="93">CHOSEN</text>
    <text class="t-h c-code" x="228" y="112">Probe against a v2 look table</text>
    <rect class="lost" x="576" y="76" width="348" height="46" rx="5"/>
    <text class="t-tag c-mute" x="592" y="93">INSTEAD OF</text>
    <text class="t-h c-lost" x="592" y="112">Pixel diff against a v2 render</text>
  </g>
  <g id="row-0">
    <rect class="decide" x="16" y="134" width="908" height="62" rx="4"/>
    <rect class="bar" x="16" y="134" width="4" height="62"/>
    <text class="t-lbl" x="32" y="156">IS THERE A</text>
    <text class="t-lbl" x="32" y="169">REFERENCE</text>
    <text class="t-tag c-acc" x="32" y="186">▸ DECIDES IT</text>
    <text class="mark plus" x="228" y="162">+</text>
    <text class="t-b" x="248" y="161">Yes, the v2 source</text>
    <text class="t-s" x="248" y="179">each table row cites its line</text>
    <text class="mark minus" x="592" y="162">−</text>
    <text class="t-b" x="612" y="161">No</text>
    <text class="t-s" x="612" y="179">v2 needs a runtime nobody handed back</text>
  </g>
  <g id="row-1">
    <text class="t-lbl" x="32" y="226">CONTENT THAT</text>
    <text class="t-lbl" x="32" y="239">DIFFERS</text>
    <text class="mark plus" x="228" y="232">+</text>
    <text class="t-b" x="248" y="231">Ignored</text>
    <text class="t-s" x="248" y="249">grades roles, not v2&#x27;s mock data</text>
    <text class="mark minus" x="592" y="232">−</text>
    <text class="t-b" x="612" y="231">Flags every line</text>
    <text class="t-s" x="612" y="249">Acme and PAY-14 are no Lab&#x27;s data</text>
    <line class="row" x1="16" y1="254" x2="924" y2="254"/>
  </g>
  <g id="row-2">
    <text class="t-lbl" x="32" y="284">DRIFT THE TABLE</text>
    <text class="t-lbl" x="32" y="297">DOESN&#x27;T LIST</text>
    <text class="mark minus" x="228" y="290">−</text>
    <text class="t-b" x="248" y="289">Passes</text>
    <text class="t-s" x="248" y="307">spacing, an icon&#x27;s shape</text>
    <text class="mark plus" x="592" y="290">+</text>
    <text class="t-b" x="612" y="289">Caught</text>
    <text class="t-s" x="612" y="307">any pixel that moved</text>
    <line class="row" x1="16" y1="312" x2="924" y2="312"/>
  </g>
  <g id="locks-in">
    <rect class="foot" x="16" y="328" width="446" height="74" rx="5"/>
    <text class="t-lbl" x="32" y="349">LOCKS IN</text>
    <text class="t-b" x="32" y="369">The look table is what &#x27;matches v2&#x27; means</text>
    <text class="t-s" x="32" y="387">screenshots go to a person&#x27;s eye</text>
  </g>
  <g id="flips-if">
    <rect class="foot" x="478" y="328" width="446" height="74" rx="5"/>
    <text class="t-lbl" x="494" y="349">FLIPS IF</text>
    <text class="t-b" x="494" y="369">Claude Design hands back the runtime</text>
    <text class="t-s" x="494" y="387">then a side-by-side render joins</text>
  </g>
</svg>
