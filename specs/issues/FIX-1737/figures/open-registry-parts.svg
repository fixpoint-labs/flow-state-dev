<svg viewBox="0 0 940 418" role="img" aria-label="Open fork: the registry parts. Recommended: record them as named exceptions. Alternative: a child changes them in the registry. Decides it: who else sees the change; a registry change is a new default for every app that copies those parts, while exceptions touch no one. Price: the filled red Reject stays on Inbox and Chief of Staff until FIX-1652 settles Approve and Deny. A child would mean one more child blocking the closure. Locks in two screens off v2 until FIX-1652, visible in the check. Flips if you want v2&#x27;s ask buttons at closure."
     xmlns="http://www.w3.org/2000/svg">
  <style>
    :root { --surface:#FCFCFA; --surface-2:#E8E8E1; --ink:#191C21; --ink-2:#4C535B; --ink-3:#7A828B;
            --rule:#D5D4CB; --accent:#3E4E8C; --accent-soft:#E0E3F0; --code:#2C7C69; --code-soft:#DCEDE7;
            --gone:#A9544F; }
    @media (prefers-color-scheme: dark) {
      :root { --surface:#181C1F; --surface-2:#202528; --ink:#E6E8E5; --ink-2:#A4ACB1; --ink-3:#737B81;
              --rule:#2B3135; --accent:#8B9BD8; --accent-soft:#1B2140; --code:#5DBBA1; --code-soft:#14302A;
              --gone:#DE8A84; } }
    .bg     { fill:var(--surface); }
    .ask    { fill:var(--surface-2); }
    .chosen { fill:var(--code-soft); stroke:var(--code); stroke-width:1.6; }
    .lost   { fill:var(--surface); stroke:var(--rule); stroke-width:1.4; stroke-dasharray:5 4; }
    .decide { fill:var(--accent-soft); }
    .bar    { fill:var(--accent); }
    .row    { stroke:var(--rule); stroke-width:1; }
    .foot   { fill:var(--surface-2); }
    .t-lbl  { fill:var(--ink-3); font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:9.5px; letter-spacing:.1em; }
    .t-tag  { font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:9.5px; letter-spacing:.1em; font-weight:600; }
    .t-q    { fill:var(--ink); font-family:system-ui,-apple-system,sans-serif; font-weight:600; font-size:15px; }
    .t-h    { font-family:system-ui,-apple-system,sans-serif; font-weight:600; font-size:14px; }
    .t-b    { fill:var(--ink); font-family:system-ui,-apple-system,sans-serif; font-size:12.5px; }
    .t-s    { fill:var(--ink-2); font-family:system-ui,-apple-system,sans-serif; font-size:11px; }
    .mark   { font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:16px; font-weight:700; }
    .plus   { fill:var(--code); }
    .minus  { fill:var(--gone); }
    .tie    { fill:var(--ink-3); }
    .c-code { fill:var(--code); }
    .c-mute { fill:var(--ink-3); }
    .c-lost { fill:var(--ink-2); }
    .c-acc  { fill:var(--accent); }
  </style>
  <rect class="bg" x="0" y="0" width="940" height="418"/>

  <g id="the-call">
    <rect class="ask" x="16" y="14" width="908" height="48" rx="6"/>
    <text class="t-lbl" x="32" y="32">OPEN · THE CALL</text>
    <text class="t-q" x="32" y="52">FIX-1655 is Done. Who changes the registry parts v2 draws differently?</text>
  </g>

  <g id="options">
    <rect class="chosen" x="212" y="76" width="348" height="46" rx="5" style="stroke-dasharray:5 4"/>
    <text class="t-tag c-code" x="228" y="93">RECOMMENDED</text>
    <text class="t-h c-code" x="228" y="112">Record them as named exceptions</text>
    <rect class="lost" x="576" y="76" width="348" height="46" rx="5"/>
    <text class="t-tag c-mute" x="592" y="93">ALTERNATIVE</text>
    <text class="t-h c-lost" x="592" y="112">A child changes them at the source</text>
  </g>
  <g id="row-0">
    <rect class="decide" x="16" y="134" width="908" height="62" rx="4"/>
    <rect class="bar" x="16" y="134" width="4" height="62"/>
    <text class="t-lbl" x="32" y="156">WHO ELSE</text>
    <text class="t-lbl" x="32" y="169">SEES IT</text>
    <text class="t-tag c-acc" x="32" y="186">▸ DECIDES IT</text>
    <text class="mark plus" x="228" y="162">+</text>
    <text class="t-b" x="248" y="161">No one</text>
    <text class="t-s" x="248" y="179">FSD&#x27;s registry stays as every app has it</text>
    <text class="mark minus" x="592" y="162">−</text>
    <text class="t-b" x="612" y="161">Every app that copies them</text>
    <text class="t-s" x="612" y="179">a new default for FSD&#x27;s ask card and cards</text>
  </g>
  <g id="row-1">
    <text class="t-lbl" x="32" y="226">ASK BUTTONS ON</text>
    <text class="t-lbl" x="32" y="239">INBOX AND COS</text>
    <text class="mark minus" x="228" y="232">−</text>
    <text class="t-b" x="248" y="231">Red Reject stays</text>
    <text class="t-s" x="248" y="249">until FIX-1652 renames Approve and Deny</text>
    <text class="mark plus" x="592" y="232">+</text>
    <text class="t-b" x="612" y="231">v2&#x27;s bordered Deny</text>
    <text class="t-s" x="612" y="249">before the epic closes</text>
    <line class="row" x1="16" y1="254" x2="924" y2="254"/>
  </g>
  <g id="row-2">
    <text class="t-lbl" x="32" y="284">EPIC SIZE</text>
    <text class="mark plus" x="228" y="290">+</text>
    <text class="t-b" x="248" y="289">No new child</text>
    <text class="t-s" x="248" y="307">the check lists each exception by name</text>
    <text class="mark minus" x="592" y="290">−</text>
    <text class="t-b" x="612" y="289">One more child</text>
    <text class="t-s" x="612" y="307">blocking the closure</text>
    <line class="row" x1="16" y1="312" x2="924" y2="312"/>
  </g>
  <g id="locks-in">
    <rect class="foot" x="16" y="328" width="446" height="74" rx="5"/>
    <text class="t-lbl" x="32" y="349">LOCKS IN</text>
    <text class="t-b" x="32" y="369">Two screens off v2 until FIX-1652</text>
    <text class="t-s" x="32" y="387">visible in the check, not hidden</text>
  </g>
  <g id="flips-if">
    <rect class="foot" x="478" y="328" width="446" height="74" rx="5"/>
    <text class="t-lbl" x="494" y="349">FLIPS IF</text>
    <text class="t-b" x="494" y="369">You want v2&#x27;s ask buttons at closure</text>
    <text class="t-s" x="494" y="387">then file the child now</text>
  </g>
</svg>
