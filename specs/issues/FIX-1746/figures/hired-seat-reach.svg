<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 600" role="img" aria-label="Two seats hired in the acme organization. The org-visible seat answers at acme.support.ada; its roster row can be listed by any acme member's browser, showing seatId, flow and instructions, and any acme member the resolver admits can use it. The user-owned seat answers at acme.~alice.research; its roster row has no browser read, and only alice signed in to acme can use it. Outside acme both seats answer 404 Unknown flow and are left out of the flow list. The row is not the seat, the address is not a permission, and firing deletes the roster row while the inventory row stays.">
  <style>
    :root { --bg:#ffffff; --ink:#0f172a; --ink-2:#334155; --muted:#64748b;
            --org-fill:#f0fdf4; --org:#15803d; --user-fill:#eff6ff; --user:#1d4ed8;
            --out-fill:#fef2f2; --out:#b91c1c; --card:#ffffff; --card-line:#334155; --box:#f8fafc; }
    @media (prefers-color-scheme: dark) {
      :root { --bg:#0e0e14; --ink:#e5e7eb; --ink-2:#cbd5e1; --muted:#94a3b8;
              --org-fill:#0b2016; --org:#4ade80; --user-fill:#0f1a33; --user:#60a5fa;
              --out-fill:#2a1012; --out:#f87171; --card:#14141c; --card-line:#64748b; --box:#181822; } }
    .bg { fill:var(--bg); }
    .wall-org { fill:var(--org-fill); stroke:var(--org); stroke-width:2; }
    .wall-user { fill:var(--user-fill); stroke:var(--user); stroke-width:2; }
    .wall-out { fill:var(--out-fill); stroke:var(--out); stroke-width:2; stroke-dasharray:7 5; }
    .card { fill:var(--card); stroke:var(--card-line); stroke-width:1.5; }
    .box { fill:var(--box); stroke:var(--card-line); stroke-width:1.2; }
    .title { font:700 20px ui-sans-serif, system-ui, sans-serif; fill:var(--ink); }
    .h { font:700 14px ui-sans-serif, system-ui, sans-serif; fill:var(--ink); }
    .p { font:13px ui-sans-serif, system-ui, sans-serif; fill:var(--ink-2); }
    .muted { font:12px ui-sans-serif, system-ui, sans-serif; fill:var(--muted); }
    .lbl { font:600 10px ui-monospace, SFMono-Regular, Menlo, monospace; letter-spacing:.08em; fill:var(--muted); }
    .code { font:11.5px ui-monospace, SFMono-Regular, Menlo, monospace; fill:var(--ink); }
    .deny { font:600 12px ui-monospace, SFMono-Regular, Menlo, monospace; fill:var(--out); }
  </style>

  <rect class="bg" x="0" y="0" width="940" height="600" rx="16"/>
  <text class="title" x="24" y="38">Who can see a hired seat, and who can use it</text>
  <text class="muted" x="24" y="60">Two seats hired in acme. The address names a seat. The pin it was registered with decides who reaches it.</text>

  <g id="acme">
    <rect class="wall-org" x="16" y="80" width="644" height="372" rx="14"/>
    <text class="h" x="32" y="104">Organization: acme</text>
    <text class="muted" x="32" y="122">Every caller here is a verified acme member</text>
  </g>

  <g id="org-visible">
    <text class="lbl" x="32" y="148">ORG-VISIBLE SEAT</text>
    <rect class="card" x="32" y="158" width="296" height="70" rx="10"/>
    <text class="lbl" x="46" y="178">THE SEAT · SERVED BY THIS PROCESS</text>
    <text class="code" x="46" y="198">acme.support.ada</text>
    <text class="muted" x="46" y="216">pinned to org acme</text>
    <rect class="card" x="32" y="240" width="296" height="112" rx="10"/>
    <text class="lbl" x="46" y="260">WHO CAN SEE IT</text>
    <text class="p" x="46" y="280">Any acme member's browser lists</text>
    <text class="p" x="46" y="298">its roster row</text>
    <text class="code" x="46" y="320">workforce/roster/support.ada</text>
    <text class="muted" x="46" y="340">seatId, flow, instructions. Settings stay put</text>
    <rect class="card" x="32" y="364" width="296" height="72" rx="10"/>
    <text class="lbl" x="46" y="384">WHO CAN USE IT</text>
    <text class="p" x="46" y="404">Any acme member your resolver</text>
    <text class="p" x="46" y="422">admits</text>
  </g>

  <g id="user-owned">
    <rect class="wall-user" x="344" y="132" width="300" height="308" rx="12"/>
    <text class="lbl" x="358" y="150">USER-OWNED SEAT · ALICE'S</text>
    <rect class="card" x="356" y="158" width="276" height="70" rx="10"/>
    <text class="lbl" x="370" y="178">THE SEAT · SERVED BY THIS PROCESS</text>
    <text class="code" x="370" y="198">acme.~alice.research</text>
    <text class="muted" x="370" y="216">pinned to org acme and user alice</text>
    <rect class="card" x="356" y="240" width="276" height="112" rx="10"/>
    <text class="lbl" x="370" y="260">WHO CAN SEE IT</text>
    <text class="p" x="370" y="280">No browser. Not even alice's</text>
    <text class="code" x="370" y="306">workforce/roster/~alice/research</text>
    <text class="muted" x="370" y="326">Read on the server, and only</text>
    <text class="muted" x="370" y="342">by alice's own calls</text>
    <rect class="card" x="356" y="364" width="276" height="64" rx="10"/>
    <text class="lbl" x="370" y="384">WHO CAN USE IT</text>
    <text class="p" x="370" y="404">alice, signed in to acme</text>
    <text class="muted" x="370" y="420">bob in acme: 404 Unknown flow</text>
  </g>

  <g id="outside">
    <rect class="wall-out" x="676" y="80" width="248" height="372" rx="14"/>
    <text class="h" x="692" y="104">Outside acme</text>
    <text class="muted" x="692" y="122">globex, or alice signed in there</text>
    <rect class="card" x="692" y="158" width="216" height="170" rx="10"/>
    <text class="p" x="706" y="182">Both seats answer</text>
    <text class="deny" x="706" y="206">404 Unknown flow</text>
    <text class="p" x="706" y="232">the same answer as an</text>
    <text class="p" x="706" y="250">address nobody serves.</text>
    <text class="p" x="706" y="280">The flow list leaves</text>
    <text class="p" x="706" y="298">them out.</text>
    <text class="muted" x="706" y="364">To have a research seat</text>
    <text class="muted" x="706" y="382">in globex, hire one there.</text>
    <text class="muted" x="706" y="400">It starts empty.</text>
  </g>

  <g id="not-the-same">
    <rect class="box" x="16" y="468" width="908" height="116" rx="12"/>
    <text class="h" x="32" y="494">Not the same thing</text>
    <text class="p" x="32" y="518">The row is not the seat. A process serves a hired seat once it registers it. Another process picks the row up at its next start.</text>
    <text class="p" x="32" y="542">The address is not a permission. Knowing acme.support.ada grants nothing: the caller's verified org and user are checked.</text>
    <text class="p" x="32" y="566">Firing deletes the roster row. An inventory row, where the hire wrote one, stays: it means registered, not still hired.</text>
  </g>
</svg>
