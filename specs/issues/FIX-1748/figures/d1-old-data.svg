<svg viewBox="0 0 940 420" role="img" aria-label="D1, what happens to data and files written under the old names. Chosen: refuse them by name and reset in-repo Lab stores. Instead of: reading the old names beside the new ones, or a migration that rewrites stored records. It comes down to the first row: only the chosen option keeps channel off the wire; reading old names keeps it as a live read path, and a migration keeps it until the migration is removed. The price is the second row: a Lab store from before the rename does not carry over, where both alternatives keep it. The third row is the build: one refusal per entry point, against two readers per renamed name, or a rewrite in each of four store adapters. Locks in: old Lab history is set aside or deleted, and the old words live in one refusal module until 1.0. Flips if: a store you use holds conversations or projects you want kept."
     xmlns="http://www.w3.org/2000/svg">
  <style>
    :root { --surface:#FCFCFA; --surface-2:#E8E8E1; --ink:#191C21; --ink-2:#4C535B; --ink-3:#7A828B;
            --rule:#D5D4CB; --accent:#3E4E8C; --accent-soft:#E0E3F0; --code:#2C7C69; --code-soft:#DCEDE7;
            --gone:#A9544F; }
    @media (prefers-color-scheme: dark) {
      :root { --surface:#181C1F; --surface-2:#202528; --ink:#E6E8E5; --ink-2:#A4ACB1; --ink-3:#737B81;
              --rule:#2B3135; --accent:#8B9BD8; --accent-soft:#1B2140; --code:#5DBBA1; --code-soft:#14302A;
              --gone:#DE8A84; } }
    .bg     { fill:var(--surface); }
    .ask    { fill:var(--surface-2); }
    .chosen { fill:var(--code-soft); stroke:var(--code); stroke-width:1.6; }
    .lost   { fill:var(--surface); stroke:var(--rule); stroke-width:1.4; stroke-dasharray:5 4; }
    .decide { fill:var(--accent-soft); }
    .bar    { fill:var(--accent); }
    .row    { stroke:var(--rule); stroke-width:1; }
    .foot   { fill:var(--surface-2); }
    .t-lbl  { fill:var(--ink-3); font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:9.5px; letter-spacing:.1em; }
    .t-tag  { font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:9.5px; letter-spacing:.1em; font-weight:600; }
    .t-q    { fill:var(--ink); font-family:system-ui,-apple-system,sans-serif; font-weight:600; font-size:15px; }
    .t-h    { font-family:system-ui,-apple-system,sans-serif; font-weight:600; font-size:13px; }
    .t-b    { fill:var(--ink); font-family:system-ui,-apple-system,sans-serif; font-size:12px; }
    .t-s    { fill:var(--ink-2); font-family:system-ui,-apple-system,sans-serif; font-size:10.5px; }
    .mark   { font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:16px; font-weight:700; }
    .plus   { fill:var(--code); }
    .minus  { fill:var(--gone); }
    .c-code { fill:var(--code); }
    .c-mute { fill:var(--ink-3); }
    .c-lost { fill:var(--ink-2); }
    .c-acc  { fill:var(--accent); }
  </style>
  <rect class="bg" x="0" y="0" width="940" height="420"/>

  <g id="the-call">
    <rect class="ask" x="16" y="14" width="908" height="48" rx="6"/>
    <text class="t-lbl" x="32" y="32">D1 · THE CALL</text>
    <text class="t-q" x="32" y="52">What happens to data and files written under the old names?</text>
  </g>

  <g id="options">
    <rect class="chosen" x="212" y="76" width="224" height="46" rx="5"/>
    <text class="t-tag c-code" x="226" y="93">CHOSEN</text>
    <text class="t-h c-code" x="226" y="112">Refuse by name, reset</text>
    <rect class="lost" x="452" y="76" width="224" height="46" rx="5"/>
    <text class="t-tag c-mute" x="466" y="93">INSTEAD OF</text>
    <text class="t-h c-lost" x="466" y="112">Read old names too</text>
    <rect class="lost" x="692" y="76" width="224" height="46" rx="5"/>
    <text class="t-tag c-mute" x="706" y="93">INSTEAD OF</text>
    <text class="t-h c-lost" x="706" y="112">Migrate stored records</text>
  </g>

  <g id="row-decides">
    <rect class="decide" x="16" y="134" width="908" height="62" rx="4"/>
    <rect class="bar" x="16" y="134" width="4" height="62"/>
    <text class="t-lbl" x="32" y="156">CHANNEL STAYS</text>
    <text class="t-lbl" x="32" y="169">ON THE WIRE?</text>
    <text class="t-tag c-acc" x="32" y="186">▸ DECIDES IT</text>
    <text class="mark plus" x="226" y="162">+</text>
    <text class="t-b" x="244" y="161">No</text>
    <text class="t-s" x="244" y="179">only a refusal message names it</text>
    <text class="mark minus" x="466" y="162">−</text>
    <text class="t-b" x="484" y="161">Yes, as a read path</text>
    <text class="t-s" x="484" y="179">what the lock rules out</text>
    <text class="mark minus" x="706" y="162">−</text>
    <text class="t-b" x="724" y="161">Until the script is gone</text>
    <text class="t-s" x="724" y="179">it must know every old name</text>
  </g>

  <g id="row-price">
    <text class="t-lbl" x="32" y="222">A LAB STORE</text>
    <text class="t-lbl" x="32" y="235">FROM BEFORE</text>
    <text class="mark minus" x="226" y="224">−</text>
    <text class="t-b" x="244" y="223">Doesn't carry over</text>
    <text class="t-s" x="244" y="241">set aside or deleted, loudly</text>
    <text class="mark plus" x="466" y="224">+</text>
    <text class="t-b" x="484" y="223">Opens as it was</text>
    <text class="t-s" x="484" y="241">history still shows</text>
    <text class="mark plus" x="706" y="224">+</text>
    <text class="t-b" x="724" y="223">Opens as it was</text>
    <text class="t-s" x="724" y="241">after one rewrite</text>
    <line class="row" x1="16" y1="256" x2="924" y2="256"/>
  </g>

  <g id="row-build">
    <text class="t-lbl" x="32" y="280">WHAT IT TAKES</text>
    <text class="mark plus" x="226" y="282">+</text>
    <text class="t-b" x="244" y="281">One refusal per entry</text>
    <text class="t-s" x="244" y="299">loader · codegen · boot</text>
    <text class="mark minus" x="466" y="282">−</text>
    <text class="t-b" x="484" y="281">Two readers per name</text>
    <text class="t-s" x="484" y="299">thirteen wire names</text>
    <text class="mark minus" x="706" y="282">−</text>
    <text class="t-b" x="724" y="281">A rewrite per adapter</text>
    <text class="t-s" x="724" y="299">four stores, every transcript</text>
    <line class="row" x1="16" y1="314" x2="924" y2="314"/>
  </g>

  <g id="locks-in">
    <rect class="foot" x="16" y="330" width="446" height="74" rx="5"/>
    <text class="t-lbl" x="32" y="351">LOCKS IN</text>
    <text class="t-b" x="32" y="371">Old Lab history is set aside, not carried</text>
    <text class="t-s" x="32" y="389">the old words live in one refusal module until 1.0</text>
  </g>

  <g id="flips-if">
    <rect class="foot" x="478" y="330" width="446" height="74" rx="5"/>
    <text class="t-lbl" x="494" y="351">FLIPS IF</text>
    <text class="t-b" x="494" y="371">A store you use holds history you want kept</text>
    <text class="t-s" x="494" y="389">then a one-off migration for that store, run once</text>
  </g>
</svg>
