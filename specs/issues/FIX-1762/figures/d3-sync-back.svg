<svg viewBox="0 0 940 420" role="img" aria-label="D3, decided by Jake on 2026-10-04: does a run&#x27;s work on project files get saved back in this slice. Chosen: yes, hydrate before and sync back after, through the existing workspace projection, scoped to one project&#x27;s keys and checked against membership. Instead of: boundary only, a directory with nothing saved. It comes down to the first row: without the save, a project with no repository loses every run&#x27;s work and an agent&#x27;s notes vanish at the end of a run. The price: a key-scoped projection and a hydrate and sync around every run. Both keep project files out of the checkout. Locks in: the files collection is the record for no-repository projects from slice 1. Flips if: nothing would ever be written outside a repository."
     xmlns="http://www.w3.org/2000/svg">
  <style>
    :root { --surface:#FCFCFA; --surface-2:#E8E8E1; --ink:#191C21; --ink-2:#4C535B; --ink-3:#7A828B;
            --rule:#D5D4CB; --accent:#3E4E8C; --accent-soft:#E0E3F0; --code:#2C7C69; --code-soft:#DCEDE7;
            --gone:#A9544F; }
    @media (prefers-color-scheme: dark) {
      :root { --surface:#181C1F; --surface-2:#202528; --ink:#E6E8E5; --ink-2:#A4ACB1; --ink-3:#737B81;
              --rule:#2B3135; --accent:#8B9BD8; --accent-soft:#1B2140; --code:#5DBBA1; --code-soft:#14302A;
              --gone:#DE8A84; } }
    .bg     { fill:var(--surface); }
    .ask    { fill:var(--surface-2); }
    .chosen { fill:var(--code-soft); stroke:var(--code); stroke-width:1.6; }
    .lost   { fill:var(--surface); stroke:var(--rule); stroke-width:1.4; stroke-dasharray:5 4; }
    .decide { fill:var(--accent-soft); }
    .bar    { fill:var(--accent); }
    .row    { stroke:var(--rule); stroke-width:1; }
    .foot   { fill:var(--surface-2); }
    .t-lbl  { fill:var(--ink-3); font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:9.5px; letter-spacing:.1em; }
    .t-tag  { font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:9.5px; letter-spacing:.1em; font-weight:600; }
    .t-q    { fill:var(--ink); font-family:system-ui,-apple-system,sans-serif; font-weight:600; font-size:15px; }
    .t-h    { font-family:system-ui,-apple-system,sans-serif; font-weight:600; font-size:14px; }
    .t-b    { fill:var(--ink); font-family:system-ui,-apple-system,sans-serif; font-size:12.5px; }
    .t-s    { fill:var(--ink-2); font-family:system-ui,-apple-system,sans-serif; font-size:11px; }
    .mark   { font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:16px; font-weight:700; }
    .plus   { fill:var(--code); }
    .minus  { fill:var(--gone); }
    .tie    { fill:var(--ink-3); }
    .c-code { fill:var(--code); }
    .c-mute { fill:var(--ink-3); }
    .c-lost { fill:var(--ink-2); }
    .c-acc  { fill:var(--accent); }
  </style>
  <rect class="bg" x="0" y="0" width="940" height="420"/>
  <g id="the-call">
    <rect class="ask" x="16" y="14" width="908" height="48" rx="6"/>
    <text class="t-lbl" x="32" y="32">D3 · THE CALL · DECIDED BY JAKE</text>
    <text class="t-q" x="32" y="52">Does a run&#x27;s work on project files get saved back in this slice?</text>
  </g>
  <g id="options">
    <rect class="chosen" x="212" y="76" width="348" height="46" rx="5"/>
    <text class="t-tag c-code" x="228" y="93">CHOSEN</text>
    <text class="t-h c-code" x="228" y="112">Yes: hydrate, then sync back</text>
    <rect class="lost" x="576" y="76" width="348" height="46" rx="5"/>
    <text class="t-tag c-mute" x="592" y="93">INSTEAD OF</text>
    <text class="t-h c-lost" x="592" y="112">Boundary only, nothing saved</text>
  </g>
  <g id="row-0">
    <rect class="decide" x="16" y="134" width="908" height="62" rx="4"/>
    <rect class="bar" x="16" y="134" width="4" height="62"/>
    <text class="t-lbl" x="32" y="156">A PROJECT WITH</text>
    <text class="t-lbl" x="32" y="169">NO REPOSITORY</text>
    <text class="t-tag c-acc" x="32" y="186">▸ DECIDES IT</text>
    <text class="mark plus" x="228" y="162">+</text>
    <text class="t-b" x="248" y="161">Its work is kept</text>
    <text class="t-s" x="248" y="179">the collection is the record</text>
    <text class="mark minus" x="592" y="162">−</text>
    <text class="t-b" x="612" y="161">Every run starts from nothing</text>
    <text class="t-s" x="612" y="179">work is lost at the end</text>
  </g>
  <g id="row-1">
    <text class="t-lbl" x="32" y="222">NEW CODE</text>
    <text class="mark minus" x="228" y="224">−</text>
    <text class="t-b" x="248" y="223">A key-scoped projection</text>
    <text class="t-s" x="248" y="241">plus hydrate and sync per run</text>
    <text class="mark plus" x="592" y="224">+</text>
    <text class="t-b" x="612" y="223">A directory and a rule</text>
    <text class="t-s" x="612" y="241">no sync</text>
    <line class="row" x1="16" y1="256" x2="924" y2="256"/>
  </g>
  <g id="row-2">
    <text class="t-lbl" x="32" y="282">OUT OF THE</text>
    <text class="t-lbl" x="32" y="295">CHECKOUT</text>
    <text class="mark tie" x="228" y="284">=</text>
    <text class="t-b" x="248" y="283">Never inside it</text>
    <text class="t-s" x="248" y="301">project/ beside checkout/</text>
    <text class="mark tie" x="592" y="284">=</text>
    <text class="t-b" x="612" y="283">Never inside it</text>
    <text class="t-s" x="612" y="301">the same</text>
    <line class="row" x1="16" y1="314" x2="924" y2="314"/>
  </g>
  <g id="locks-in">
    <rect class="foot" x="16" y="330" width="446" height="74" rx="5"/>
    <text class="t-lbl" x="32" y="351">LOCKS IN</text>
    <text class="t-b" x="32" y="371">The files collection is the record</text>
    <text class="t-s" x="32" y="389">for no-repository projects, from slice 1</text>
  </g>
  <g id="flips-if">
    <rect class="foot" x="478" y="330" width="446" height="74" rx="5"/>
    <text class="t-lbl" x="494" y="351">FLIPS IF</text>
    <text class="t-b" x="494" y="371">Nothing is ever written outside a repository</text>
    <text class="t-s" x="494" y="389">then the boundary alone would do</text>
  </g>
</svg>
