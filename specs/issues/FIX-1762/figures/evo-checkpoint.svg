<svg viewBox="0 0 940 270" role="img" aria-label="Checkpoint: the working tree is compared with the recorded head; changed and untracked files go to the overlay as entries, deletions as tombstones, and local commits not on the remote go as a git bundle; ignored files are skipped."
     xmlns="http://www.w3.org/2000/svg">
  <style>
    :root { --panel:#FFFFFF; --fg:#1B2125; --muted:#5A656D; --line:#C7CDD0; --fsd:#2C6AA8; --ext:#A85D17; --eph:#6A7680; --new:#0E7C6B; --bad:#B23A3A; }
    @media (prefers-color-scheme: dark) {
      :root { --panel:#1A1F23; --fg:#E3E7E9; --muted:#9BA6AE; --line:#343D43; --fsd:#6EA6DE; --ext:#DE9A56; --eph:#8F9BA4; --new:#3DBBA6; --bad:#E07070; } }
    .bg { fill:var(--panel); }
    text { font-family:system-ui,-apple-system,"Segoe UI",sans-serif; font-size:12.5px; fill:var(--fg); }
    .t-b { font-weight:600; }
    .t-m { font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:11.5px; }
    .t-s { font-size:11px; fill:var(--muted); }
    .ln { stroke:var(--fg); stroke-width:1.3; fill:none; }
    .ln-new { stroke:var(--new); stroke-width:1.6; fill:none; }
    .ln-d { stroke:var(--fg); stroke-width:1.2; fill:none; stroke-dasharray:4 3; }
    .box { fill:var(--panel); stroke:var(--line); stroke-width:1.2; }
    .box-new { fill:var(--panel); stroke:var(--new); stroke-width:1.6; }
    .z-fsd { fill:var(--fsd); fill-opacity:.07; stroke:var(--fsd); stroke-width:1.2; }
    .z-ext { fill:var(--ext); fill-opacity:.08; stroke:var(--ext); stroke-width:1.2; }
    .z-eph { fill:var(--eph); fill-opacity:.07; stroke:var(--eph); stroke-width:1.2; stroke-dasharray:5 4; }
    .c-fsd { fill:var(--fsd); } .c-ext { fill:var(--ext); } .c-eph { fill:var(--eph); }
    .c-new { fill:var(--new); } .c-bad { fill:var(--bad); }
    .st { fill:var(--panel); stroke:var(--fg); stroke-width:1.2; }
    .st-bad { fill:var(--panel); stroke:var(--bad); stroke-width:1.4; }
    .st-new { fill:var(--panel); stroke:var(--new); stroke-width:1.6; }
    .ah { fill:var(--fg); } .ah-new { fill:var(--new); }
  </style>
  <rect class="bg" x="0" y="0" width="940" height="270"/>
  <g transform="translate(20,20)">
  <defs><marker id="a5" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" class="ah-new"/></marker></defs>
  <rect x="20" y="20" width="250" height="190" rx="5" class="z-eph"/>
  <text x="34" y="42" class="t-b">checkout/ at checkpoint</text>
  <text x="34" y="70" class="t-m">src/api.ts</text><text x="200" y="70" class="t-s">modified</text>
  <text x="34" y="92" class="t-m">src/new-route.ts</text><text x="200" y="92" class="t-s">untracked</text>
  <text x="34" y="114" class="t-m">src/old.ts</text><text x="200" y="114" class="t-s">deleted</text>
  <text x="34" y="136" class="t-m">2 local commits</text><text x="200" y="136" class="t-s">not pushed</text>
  <text x="34" y="158" class="t-m">node_modules/</text><text x="200" y="158" class="t-s">ignored</text>
  <text x="34" y="180" class="t-m">.env</text><text x="200" y="180" class="t-s">ignored</text>

  <rect x="610" y="20" width="270" height="190" rx="5" class="z-fsd"/>
  <text x="624" y="42" class="t-b">worktree-overlay/&lt;runId&gt;/</text>
  <text x="624" y="70" class="t-m">files/src/api.ts</text>
  <text x="624" y="92" class="t-m">files/src/new-route.ts</text>
  <text x="624" y="114" class="t-m">files/src/old.ts  (tombstone)</text>
  <text x="624" y="136" class="t-m">commits.bundle</text>
  <text x="624" y="166" class="t-m">meta: baseSha, headSha,</text>
  <text x="624" y="182" class="t-m">branch, takenAt</text>

  <line x1="272" y1="66" x2="606" y2="66" class="ln-new" marker-end="url(#a5)"/>
  <line x1="272" y1="88" x2="606" y2="88" class="ln-new" marker-end="url(#a5)"/>
  <line x1="272" y1="110" x2="606" y2="110" class="ln-new" marker-end="url(#a5)"/>
  <line x1="272" y1="132" x2="606" y2="132" class="ln-new" marker-end="url(#a5)"/>
  <text x="440" y="60" text-anchor="middle" class="t-s c-new">only paths git reports dirty</text>
  <text x="440" y="152" text-anchor="middle" class="t-s c-new">base..head as one blob</text>
  <line x1="272" y1="166" x2="440" y2="166" class="ln-d"/><text x="448" y="170" class="t-s">skipped: rebuilt or secret</text>

  </g>
</svg>
