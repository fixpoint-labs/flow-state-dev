<svg viewBox="0 0 940 400" role="img" aria-label="Side by side: a harness worker runs a vendor process inside the place that edits checkout files directly and keeps its own transcript; a tool worker runs FSD's model loop on the server and edits the place through tool calls FSD sees, with the conversation in FSD's session."
     xmlns="http://www.w3.org/2000/svg">
  <style>
    :root { --panel:#FFFFFF; --fg:#1B2125; --muted:#5A656D; --line:#C7CDD0; --fsd:#2C6AA8; --ext:#A85D17; --eph:#6A7680; --new:#0E7C6B; --bad:#B23A3A; }
    @media (prefers-color-scheme: dark) {
      :root { --panel:#1A1F23; --fg:#E3E7E9; --muted:#9BA6AE; --line:#343D43; --fsd:#6EA6DE; --ext:#DE9A56; --eph:#8F9BA4; --new:#3DBBA6; --bad:#E07070; } }
    .bg { fill:var(--panel); }
    text { font-family:system-ui,-apple-system,"Segoe UI",sans-serif; font-size:12.5px; fill:var(--fg); }
    .t-b { font-weight:600; }
    .t-m { font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:11.5px; }
    .t-s { font-size:11px; fill:var(--muted); }
    .ln { stroke:var(--fg); stroke-width:1.3; fill:none; }
    .ln-new { stroke:var(--new); stroke-width:1.6; fill:none; }
    .ln-d { stroke:var(--fg); stroke-width:1.2; fill:none; stroke-dasharray:4 3; }
    .box { fill:var(--panel); stroke:var(--line); stroke-width:1.2; }
    .box-new { fill:var(--panel); stroke:var(--new); stroke-width:1.6; }
    .z-fsd { fill:var(--fsd); fill-opacity:.07; stroke:var(--fsd); stroke-width:1.2; }
    .z-ext { fill:var(--ext); fill-opacity:.08; stroke:var(--ext); stroke-width:1.2; }
    .z-eph { fill:var(--eph); fill-opacity:.07; stroke:var(--eph); stroke-width:1.2; stroke-dasharray:5 4; }
    .c-fsd { fill:var(--fsd); } .c-ext { fill:var(--ext); } .c-eph { fill:var(--eph); }
    .c-new { fill:var(--new); } .c-bad { fill:var(--bad); }
    .st { fill:var(--panel); stroke:var(--fg); stroke-width:1.2; }
    .st-bad { fill:var(--panel); stroke:var(--bad); stroke-width:1.4; }
    .st-new { fill:var(--panel); stroke:var(--new); stroke-width:1.6; }
    .ah { fill:var(--fg); } .ah-new { fill:var(--new); }
  </style>
  <rect class="bg" x="0" y="0" width="940" height="400"/>
  <g transform="translate(20,20)">
  <defs>
    <marker id="a8" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker>
    <marker id="a8n" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" class="ah-new"/></marker>
  </defs>
  <text x="20" y="22" class="t-b">Harness worker</text>
  <rect x="20" y="36" width="200" height="54" rx="4" class="z-fsd"/>
  <text x="34" y="58" class="t-b">harness-manager</text><text x="34" y="76" class="t-s">starts it, reads the result</text>
  <rect x="20" y="130" width="410" height="200" rx="5" class="z-eph"/>
  <text x="416" y="322" text-anchor="end" class="t-s">place: host dir or sandbox</text>
  <rect x="40" y="164" width="190" height="80" rx="4" class="box"/>
  <text x="54" y="186" class="t-b">Harness process</text><text x="54" y="204" class="t-s">Claude Code, Codex, Cursor</text><text x="54" y="222" class="t-s">its own model loop and tools</text>
  <rect x="270" y="164" width="140" height="80" rx="4" class="box"/>
  <text x="284" y="186" class="t-m t-b">checkout/</text><text x="284" y="206" class="t-s">edited directly,</text><text x="284" y="222" class="t-s">unseen by FSD</text>
  <line x1="232" y1="204" x2="268" y2="204" class="ln" marker-end="url(#a8)"/>
  <rect x="40" y="262" width="190" height="52" rx="4" class="z-ext"/>
  <text x="54" y="284" class="t-b">Vendor transcript</text><text x="54" y="302" class="t-s">on the machine it ran on</text>
  <line x1="120" y1="90" x2="120" y2="162" class="ln" marker-end="url(#a8)"/><text x="128" y="118" class="t-s">prompt, cwd, resume id</text>
  <line x1="200" y1="162" x2="200" y2="92" class="ln" marker-end="url(#a8)"/><text x="208" y="146" class="t-s">final message</text>
  <line x1="340" y1="246" x2="340" y2="294" class="ln-new"/><text x="348" y="276" class="t-s c-new">checkpoint after</text><text x="348" y="290" class="t-s c-new">the turn ends</text>

  <line x1="450" y1="10" x2="450" y2="350" class="ln-d"/>

  <text x="470" y="22" class="t-b">Tool worker (FSD edits)</text>
  <rect x="470" y="36" width="410" height="80" rx="4" class="z-fsd"/>
  <text x="484" y="58" class="t-b">FSD generator</text><text x="484" y="76" class="t-s">model loop runs on the FSD server</text>
  <rect x="690" y="48" width="176" height="56" rx="4" class="box"/>
  <text x="704" y="70" class="t-b">Conversation</text><text x="704" y="88" class="t-s">in FSD's session store</text>
  <rect x="470" y="150" width="410" height="180" rx="5" class="z-eph"/>
  <text x="866" y="322" text-anchor="end" class="t-s">place: virtual fs, host dir or sandbox</text>
  <rect x="490" y="184" width="200" height="80" rx="4" class="box"/>
  <text x="504" y="206" class="t-m t-b">checkout/</text><text x="504" y="226" class="t-s">edited by tool calls:</text><text x="504" y="242" class="t-s">bash, read, write</text>
  <rect x="720" y="184" width="146" height="80" rx="4" class="box"/>
  <text x="734" y="206" class="t-b">Shell</text><text x="734" y="226" class="t-s">tests, git, builds</text><text x="734" y="242" class="t-s">via the sandbox</text>
  <line x1="560" y1="116" x2="560" y2="182" class="ln" marker-end="url(#a8)"/><text x="552" y="140" text-anchor="end" class="t-s">every tool call</text>
  <line x1="620" y1="182" x2="620" y2="118" class="ln" marker-end="url(#a8)"/><text x="628" y="140" class="t-s">every result</text>
  <line x1="590" y1="266" x2="590" y2="298" class="ln-new"/><text x="598" y="282" class="t-s c-new">checkpoint after any write,</text><text x="598" y="296" class="t-s c-new">not only at turn end</text>

  </g>
</svg>
