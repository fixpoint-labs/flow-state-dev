<svg viewBox="0 0 940 390" role="img" aria-label="Layer diagram: Workforce fills the run-source hook; harness-manager and the bash tool both call the shared workspace host; the workspace host uses Place, Projection and sandbox adapters; core and engine are unchanged."
     xmlns="http://www.w3.org/2000/svg">
  <style>
    :root { --panel:#FFFFFF; --fg:#1B2125; --muted:#5A656D; --line:#C7CDD0; --fsd:#2C6AA8; --ext:#A85D17; --eph:#6A7680; --new:#0E7C6B; --bad:#B23A3A; }
    @media (prefers-color-scheme: dark) {
      :root { --panel:#1A1F23; --fg:#E3E7E9; --muted:#9BA6AE; --line:#343D43; --fsd:#6EA6DE; --ext:#DE9A56; --eph:#8F9BA4; --new:#3DBBA6; --bad:#E07070; } }
    .bg { fill:var(--panel); }
    text { font-family:system-ui,-apple-system,"Segoe UI",sans-serif; font-size:12.5px; fill:var(--fg); }
    .t-b { font-weight:600; }
    .t-m { font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:11.5px; }
    .t-s { font-size:11px; fill:var(--muted); }
    .ln { stroke:var(--fg); stroke-width:1.3; fill:none; }
    .ln-new { stroke:var(--new); stroke-width:1.6; fill:none; }
    .ln-d { stroke:var(--fg); stroke-width:1.2; fill:none; stroke-dasharray:4 3; }
    .box { fill:var(--panel); stroke:var(--line); stroke-width:1.2; }
    .box-new { fill:var(--panel); stroke:var(--new); stroke-width:1.6; }
    .z-fsd { fill:var(--fsd); fill-opacity:.07; stroke:var(--fsd); stroke-width:1.2; }
    .z-ext { fill:var(--ext); fill-opacity:.08; stroke:var(--ext); stroke-width:1.2; }
    .z-eph { fill:var(--eph); fill-opacity:.07; stroke:var(--eph); stroke-width:1.2; stroke-dasharray:5 4; }
    .c-fsd { fill:var(--fsd); } .c-ext { fill:var(--ext); } .c-eph { fill:var(--eph); }
    .c-new { fill:var(--new); } .c-bad { fill:var(--bad); }
    .st { fill:var(--panel); stroke:var(--fg); stroke-width:1.2; }
    .st-bad { fill:var(--panel); stroke:var(--bad); stroke-width:1.4; }
    .st-new { fill:var(--panel); stroke:var(--new); stroke-width:1.6; }
    .ah { fill:var(--fg); } .ah-new { fill:var(--new); }
  </style>
  <rect class="bg" x="0" y="0" width="940" height="390"/>
  <g transform="translate(20,20)">
  <defs><marker id="a2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" class="ah-new"/></marker></defs>
  <rect x="20" y="20" width="860" height="78" rx="5" class="z-fsd"/>
  <text x="36" y="44" class="t-b">Workforce</text><text x="36" y="62" class="t-s">projects, members,</text><text x="36" y="78" class="t-s">workstreams, policy</text>
  <rect x="200" y="34" width="200" height="50" rx="4" class="box"/><text x="214" y="55" class="t-b">Project row</text><text x="214" y="73" class="t-m">repository · files</text>
  <rect x="420" y="34" width="210" height="50" rx="4" class="box-new"/><text x="434" y="55" class="t-b">projectWorkspace()</text><text x="434" y="73" class="t-s">board → project → source</text>
  <rect x="650" y="34" width="214" height="50" rx="4" class="box-new"/><text x="664" y="55" class="t-b">Remote allowlist</text><text x="664" y="73" class="t-s">which hosts git may reach</text>

  <rect x="20" y="118" width="860" height="78" rx="5" class="z-fsd"/>
  <text x="36" y="142" class="t-b">Workers</text><text x="36" y="160" class="t-s">two ways to edit,</text><text x="36" y="176" class="t-s">same storage</text>
  <rect x="200" y="132" width="200" height="50" rx="4" class="box"/><text x="214" y="153" class="t-b">harness-manager</text><text x="214" y="171" class="t-s">harness workers</text>
  <rect x="420" y="132" width="210" height="50" rx="4" class="box"/><text x="434" y="153" class="t-b">Bash and file tools</text><text x="434" y="171" class="t-s">tool workers (FSD edits)</text>
  <rect x="650" y="132" width="214" height="50" rx="4" class="box"/><text x="664" y="153" class="t-b">Row → run → verdict</text><text x="664" y="171" class="t-s">exists today</text>

  <rect x="20" y="216" width="860" height="104" rx="5" class="z-eph"/>
  <text x="36" y="240" class="t-b">Shared workspace</text><text x="36" y="258" class="t-s">where files live</text><text x="36" y="274" class="t-s">and how they're kept</text>
  <rect x="200" y="230" width="200" height="38" rx="4" class="box-new"/><text x="214" y="254" class="t-b">Run source hook</text>
  <rect x="420" y="230" width="444" height="38" rx="4" class="box-new"/><text x="434" y="254" class="t-b">Workspace host: provision · checkpoint · restore · release</text>
  <rect x="200" y="276" width="200" height="34" rx="4" class="box"/><text x="214" y="298" class="t-s">Place (host dir, virtual, sandbox)</text>
  <rect x="420" y="276" width="210" height="34" rx="4" class="box"/><text x="434" y="298" class="t-s">Projection (hydrate · flush)</text>
  <rect x="650" y="276" width="214" height="34" rx="4" class="box"/><text x="664" y="298" class="t-s">Sandbox adapters</text>

  <text x="450" y="340" text-anchor="middle" class="t-s">core + engine: unchanged (resource store, HarnessResolver, harness contract)</text>

  <line x1="525" y1="84" x2="300" y2="228" class="ln-new" marker-end="url(#a2)"/><text x="410" y="112" class="t-s c-new">fills</text>
  <line x1="300" y1="182" x2="520" y2="228" class="ln-new" marker-end="url(#a2)"/>
  <line x1="525" y1="182" x2="600" y2="228" class="ln-new" marker-end="url(#a2)"/><text x="572" y="208" class="t-s c-new">both call</text>

  </g>
</svg>
