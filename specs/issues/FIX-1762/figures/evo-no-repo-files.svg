<svg viewBox="0 0 940 380" role="img" aria-label="Files-only project: the project-files collection is the record; each run hydrates a place from it and syncs changes back; two runs on the same project merge three-way into the one record."
     xmlns="http://www.w3.org/2000/svg">
  <style>
    :root { --panel:#FFFFFF; --fg:#1B2125; --muted:#5A656D; --line:#C7CDD0; --fsd:#2C6AA8; --ext:#A85D17; --eph:#6A7680; --new:#0E7C6B; --bad:#B23A3A; }
    @media (prefers-color-scheme: dark) {
      :root { --panel:#1A1F23; --fg:#E3E7E9; --muted:#9BA6AE; --line:#343D43; --fsd:#6EA6DE; --ext:#DE9A56; --eph:#8F9BA4; --new:#3DBBA6; --bad:#E07070; } }
    .bg { fill:var(--panel); }
    text { font-family:system-ui,-apple-system,"Segoe UI",sans-serif; font-size:12.5px; fill:var(--fg); }
    .t-b { font-weight:600; }
    .t-m { font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:11.5px; }
    .t-s { font-size:11px; fill:var(--muted); }
    .ln { stroke:var(--fg); stroke-width:1.3; fill:none; }
    .ln-new { stroke:var(--new); stroke-width:1.6; fill:none; }
    .ln-d { stroke:var(--fg); stroke-width:1.2; fill:none; stroke-dasharray:4 3; }
    .box { fill:var(--panel); stroke:var(--line); stroke-width:1.2; }
    .box-new { fill:var(--panel); stroke:var(--new); stroke-width:1.6; }
    .z-fsd { fill:var(--fsd); fill-opacity:.07; stroke:var(--fsd); stroke-width:1.2; }
    .z-ext { fill:var(--ext); fill-opacity:.08; stroke:var(--ext); stroke-width:1.2; }
    .z-eph { fill:var(--eph); fill-opacity:.07; stroke:var(--eph); stroke-width:1.2; stroke-dasharray:5 4; }
    .c-fsd { fill:var(--fsd); } .c-ext { fill:var(--ext); } .c-eph { fill:var(--eph); }
    .c-new { fill:var(--new); } .c-bad { fill:var(--bad); }
    .st { fill:var(--panel); stroke:var(--fg); stroke-width:1.2; }
    .st-bad { fill:var(--panel); stroke:var(--bad); stroke-width:1.4; }
    .st-new { fill:var(--panel); stroke:var(--new); stroke-width:1.6; }
    .ah { fill:var(--fg); } .ah-new { fill:var(--new); }
  </style>
  <rect class="bg" x="0" y="0" width="940" height="380"/>
  <g transform="translate(20,20)">
  <defs>
    <marker id="a7" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker>
    <marker id="a7n" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" class="ah-new"/></marker>
  </defs>
  <rect x="320" y="24" width="260" height="76" rx="5" class="z-fsd"/>
  <text x="450" y="50" text-anchor="middle" class="t-b t-m">project-files/&lt;projectId&gt;/**</text>
  <text x="450" y="70" text-anchor="middle" class="t-s">the record: starts empty, grows</text>
  <text x="450" y="86" text-anchor="middle" class="t-s">code, notes, memory, anything kept</text>

  <rect x="30" y="180" width="300" height="120" rx="5" class="z-eph"/>
  <text x="46" y="204" class="t-b">Run A's place</text>
  <text x="46" y="226" class="t-m">workspace/   agent's cwd</text>
  <text x="46" y="250" class="t-s">tool worker: syncs after each write</text>
  <text x="46" y="268" class="t-s">harness: syncs at turn end and when parked</text>
  <text x="46" y="286" class="t-s">local git allowed for diffs, never the record</text>

  <rect x="570" y="180" width="300" height="120" rx="5" class="z-eph"/>
  <text x="586" y="204" class="t-b">Run B's place (same project)</text>
  <text x="586" y="226" class="t-m">workspace/   agent's cwd</text>
  <text x="586" y="250" class="t-s">its own copy, its own baseline</text>
  <text x="586" y="268" class="t-s">deletes only files it hydrated</text>

  <line x1="350" y1="100" x2="170" y2="178" class="ln" marker-end="url(#a7)"/>
  <text x="236" y="128" text-anchor="end" class="t-s">hydrate: start, restore</text>
  <line x1="250" y1="178" x2="410" y2="102" class="ln-new" marker-end="url(#a7n)"/>
  <text x="338" y="156" class="t-s c-new">sync back</text>

  <line x1="550" y1="100" x2="730" y2="178" class="ln" marker-end="url(#a7)"/>
  <text x="664" y="128" class="t-s">hydrate</text>
  <line x1="650" y1="178" x2="490" y2="102" class="ln-new" marker-end="url(#a7n)"/>
  <text x="562" y="156" text-anchor="end" class="t-s c-new">sync back</text>

  <text x="450" y="214" text-anchor="middle" class="t-b">one record, two writers</text>
  <text x="450" y="232" text-anchor="middle" class="t-s">three-way merge per file</text>
  <text x="450" y="248" text-anchor="middle" class="t-s">conflict → reported, never overwritten</text>

  <text x="450" y="326" text-anchor="middle" class="t-s">place lost → hydrate again from the record; nothing else to restore</text>

  </g>
</svg>
