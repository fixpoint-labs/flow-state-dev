<svg viewBox="0 0 940 600" role="img" aria-label="Sequence of one coding run across Workforce, harness-manager, the place, the git remote and FSD's store."
     xmlns="http://www.w3.org/2000/svg">
  <style>
    :root { --panel:#FFFFFF; --fg:#1B2125; --muted:#5A656D; --line:#C7CDD0; --fsd:#2C6AA8; --ext:#A85D17; --eph:#6A7680; --new:#0E7C6B; --bad:#B23A3A; }
    @media (prefers-color-scheme: dark) {
      :root { --panel:#1A1F23; --fg:#E3E7E9; --muted:#9BA6AE; --line:#343D43; --fsd:#6EA6DE; --ext:#DE9A56; --eph:#8F9BA4; --new:#3DBBA6; --bad:#E07070; } }
    .bg { fill:var(--panel); }
    text { font-family:system-ui,-apple-system,"Segoe UI",sans-serif; font-size:12.5px; fill:var(--fg); }
    .t-b { font-weight:600; }
    .t-m { font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:11.5px; }
    .t-s { font-size:11px; fill:var(--muted); }
    .ln { stroke:var(--fg); stroke-width:1.3; fill:none; }
    .ln-new { stroke:var(--new); stroke-width:1.6; fill:none; }
    .ln-d { stroke:var(--fg); stroke-width:1.2; fill:none; stroke-dasharray:4 3; }
    .box { fill:var(--panel); stroke:var(--line); stroke-width:1.2; }
    .box-new { fill:var(--panel); stroke:var(--new); stroke-width:1.6; }
    .z-fsd { fill:var(--fsd); fill-opacity:.07; stroke:var(--fsd); stroke-width:1.2; }
    .z-ext { fill:var(--ext); fill-opacity:.08; stroke:var(--ext); stroke-width:1.2; }
    .z-eph { fill:var(--eph); fill-opacity:.07; stroke:var(--eph); stroke-width:1.2; stroke-dasharray:5 4; }
    .c-fsd { fill:var(--fsd); } .c-ext { fill:var(--ext); } .c-eph { fill:var(--eph); }
    .c-new { fill:var(--new); } .c-bad { fill:var(--bad); }
    .st { fill:var(--panel); stroke:var(--fg); stroke-width:1.2; }
    .st-bad { fill:var(--panel); stroke:var(--bad); stroke-width:1.4; }
    .st-new { fill:var(--panel); stroke:var(--new); stroke-width:1.6; }
    .ah { fill:var(--fg); } .ah-new { fill:var(--new); }
  </style>
  <rect class="bg" x="0" y="0" width="940" height="600"/>
  <g transform="translate(20,20)">
  <defs>
    <marker id="a3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker>
    <marker id="a3n" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" class="ah-new"/></marker>
  </defs>
  <rect x="50" y="16" width="120" height="30" rx="4" class="z-fsd"/><text x="110" y="36" text-anchor="middle" class="t-b">Workforce</text>
  <rect x="220" y="16" width="140" height="30" rx="4" class="z-fsd"/><text x="290" y="36" text-anchor="middle" class="t-b">harness-manager</text>
  <rect x="410" y="16" width="120" height="30" rx="4" class="z-eph"/><text x="470" y="36" text-anchor="middle" class="t-b">Place</text>
  <rect x="590" y="16" width="120" height="30" rx="4" class="z-ext"/><text x="650" y="36" text-anchor="middle" class="t-b">Git remote</text>
  <rect x="750" y="16" width="120" height="30" rx="4" class="z-fsd"/><text x="810" y="36" text-anchor="middle" class="t-b">FSD store</text>
  <line x1="110" y1="46" x2="110" y2="545" class="ln-d"/><line x1="290" y1="46" x2="290" y2="545" class="ln-d"/>
  <line x1="470" y1="46" x2="470" y2="545" class="ln-d"/><line x1="650" y1="46" x2="650" y2="545" class="ln-d"/>
  <line x1="810" y1="46" x2="810" y2="545" class="ln-d"/>

  <text x="20" y="86" class="t-m t-s">1</text>
  <line x1="290" y1="82" x2="113" y2="82" class="ln-new" marker-end="url(#a3n)"/><text x="200" y="76" text-anchor="middle" class="t-s c-new">resolve source (board, row)</text>
  <line x1="110" y1="108" x2="287" y2="108" class="ln-new" marker-end="url(#a3n)"/><text x="200" y="124" text-anchor="middle" class="t-s c-new">{ repo, baseRef } or refusal</text>

  <text x="20" y="154" class="t-m t-s">2</text>
  <line x1="290" y1="150" x2="647" y2="150" class="ln-new" marker-end="url(#a3n)"/><text x="560" y="144" text-anchor="middle" class="t-s c-new">fetch into host clone cache</text>

  <text x="20" y="190" class="t-m t-s">3</text>
  <line x1="290" y1="186" x2="467" y2="186" class="ln" marker-end="url(#a3)"/><text x="380" y="180" text-anchor="middle" class="t-s">worktree add -b branch</text>

  <text x="20" y="226" class="t-m t-s">4</text>
  <line x1="290" y1="222" x2="807" y2="222" class="ln-new" marker-end="url(#a3n)"/><text x="720" y="216" text-anchor="middle" class="t-s c-new">record branch · baseSha · place</text>

  <text x="20" y="262" class="t-m t-s">5</text>
  <line x1="810" y1="258" x2="473" y2="258" class="ln-new" marker-end="url(#a3n)"/><text x="720" y="252" text-anchor="middle" class="t-s c-new">hydrate project files</text>

  <text x="20" y="306" class="t-m t-s">6</text>
  <rect x="420" y="280" width="100" height="44" rx="4" class="box"/><text x="470" y="300" text-anchor="middle" class="t-b">agent turn</text><text x="470" y="316" text-anchor="middle" class="t-s">edits files</text>

  <text x="20" y="356" class="t-m t-s">7</text>
  <line x1="470" y1="352" x2="807" y2="352" class="ln-new" marker-end="url(#a3n)"/><text x="640" y="346" text-anchor="middle" class="t-s c-new">checkpoint: dirty paths → overlay</text>

  <text x="20" y="390" class="t-m t-s">8</text>
  <line x1="470" y1="386" x2="807" y2="386" class="ln-new" marker-end="url(#a3n)"/><text x="640" y="380" text-anchor="middle" class="t-s c-new">flush project files</text>

  <text x="20" y="426" class="t-m t-s">9</text>
  <line x1="290" y1="422" x2="467" y2="422" class="ln" marker-end="url(#a3)"/><text x="380" y="416" text-anchor="middle" class="t-s">decide: done? asked?</text>

  <text x="20" y="462" class="t-m t-s">10</text>
  <line x1="470" y1="458" x2="647" y2="458" class="ln-new" marker-end="url(#a3n)"/><text x="560" y="452" text-anchor="middle" class="t-s c-new">push branch, open PR</text>

  <text x="20" y="508" class="t-m t-s">11</text>
  <line x1="290" y1="504" x2="807" y2="504" class="ln-new" marker-end="url(#a3n)"/><text x="720" y="498" text-anchor="middle" class="t-s c-new">retire: drop overlay</text>
  <line x1="290" y1="528" x2="467" y2="528" class="ln-new" marker-end="url(#a3n)"/><text x="380" y="522" text-anchor="middle" class="t-s c-new">release place</text>

  </g>
</svg>
