<svg viewBox="0 0 940 340" role="img" aria-label="Restore decision: use the live place if alive; else resume the provider snapshot if valid; else re-provision from the remote and apply the overlay; verify head and overlay; if nothing was ever checkpointed, start from base and tell the person."
     xmlns="http://www.w3.org/2000/svg">
  <style>
    :root { --panel:#FFFFFF; --fg:#1B2125; --muted:#5A656D; --line:#C7CDD0; --fsd:#2C6AA8; --ext:#A85D17; --eph:#6A7680; --new:#0E7C6B; --bad:#B23A3A; }
    @media (prefers-color-scheme: dark) {
      :root { --panel:#1A1F23; --fg:#E3E7E9; --muted:#9BA6AE; --line:#343D43; --fsd:#6EA6DE; --ext:#DE9A56; --eph:#8F9BA4; --new:#3DBBA6; --bad:#E07070; } }
    .bg { fill:var(--panel); }
    text { font-family:system-ui,-apple-system,"Segoe UI",sans-serif; font-size:12.5px; fill:var(--fg); }
    .t-b { font-weight:600; }
    .t-m { font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:11.5px; }
    .t-s { font-size:11px; fill:var(--muted); }
    .ln { stroke:var(--fg); stroke-width:1.3; fill:none; }
    .ln-new { stroke:var(--new); stroke-width:1.6; fill:none; }
    .ln-d { stroke:var(--fg); stroke-width:1.2; fill:none; stroke-dasharray:4 3; }
    .box { fill:var(--panel); stroke:var(--line); stroke-width:1.2; }
    .box-new { fill:var(--panel); stroke:var(--new); stroke-width:1.6; }
    .z-fsd { fill:var(--fsd); fill-opacity:.07; stroke:var(--fsd); stroke-width:1.2; }
    .z-ext { fill:var(--ext); fill-opacity:.08; stroke:var(--ext); stroke-width:1.2; }
    .z-eph { fill:var(--eph); fill-opacity:.07; stroke:var(--eph); stroke-width:1.2; stroke-dasharray:5 4; }
    .c-fsd { fill:var(--fsd); } .c-ext { fill:var(--ext); } .c-eph { fill:var(--eph); }
    .c-new { fill:var(--new); } .c-bad { fill:var(--bad); }
    .st { fill:var(--panel); stroke:var(--fg); stroke-width:1.2; }
    .st-bad { fill:var(--panel); stroke:var(--bad); stroke-width:1.4; }
    .st-new { fill:var(--panel); stroke:var(--new); stroke-width:1.6; }
    .ah { fill:var(--fg); } .ah-new { fill:var(--new); }
  </style>
  <rect class="bg" x="0" y="0" width="940" height="340"/>
  <g transform="translate(20,20)">
  <defs><marker id="a6" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker></defs>
  <rect x="20" y="40" width="130" height="50" rx="4" class="box"/><text x="85" y="62" text-anchor="middle" class="t-b">Run needs</text><text x="85" y="78" text-anchor="middle" class="t-b">its place</text>
  <rect x="190" y="40" width="150" height="50" rx="4" class="box"/><text x="265" y="62" text-anchor="middle">Live place</text><text x="265" y="78" text-anchor="middle">still there?</text>
  <rect x="380" y="40" width="170" height="50" rx="4" class="box"/><text x="465" y="62" text-anchor="middle">Provider snapshot valid?</text><text x="465" y="78" text-anchor="middle" class="t-s">same provider, region, TTL</text>
  <rect x="590" y="40" width="150" height="50" rx="4" class="box"/><text x="665" y="62" text-anchor="middle">Overlay</text><text x="665" y="78" text-anchor="middle">checkpoint exists?</text>
  <line x1="150" y1="65" x2="188" y2="65" class="ln" marker-end="url(#a6)"/>
  <line x1="340" y1="65" x2="378" y2="65" class="ln" marker-end="url(#a6)"/><text x="359" y="58" text-anchor="middle" class="t-s">no</text>
  <line x1="550" y1="65" x2="588" y2="65" class="ln" marker-end="url(#a6)"/><text x="569" y="58" text-anchor="middle" class="t-s">no</text>

  <rect x="190" y="150" width="150" height="40" rx="4" class="box"/><text x="265" y="175" text-anchor="middle">use it</text>
  <rect x="380" y="150" width="170" height="40" rx="4" class="box"/><text x="465" y="175" text-anchor="middle">resume snapshot</text>
  <rect x="590" y="150" width="150" height="58" rx="4" class="box-new"/><text x="665" y="172" text-anchor="middle">clone at baseSha,</text><text x="665" y="190" text-anchor="middle">apply bundle, overlay</text>
  <rect x="760" y="40" width="125" height="50" rx="4" class="st-bad"/><text x="822" y="62" text-anchor="middle" class="c-bad">start at baseSha,</text><text x="822" y="78" text-anchor="middle" class="c-bad">tell the person</text>
  <line x1="265" y1="90" x2="265" y2="148" class="ln" marker-end="url(#a6)"/><text x="272" y="124" class="t-s">yes</text>
  <line x1="465" y1="90" x2="465" y2="148" class="ln" marker-end="url(#a6)"/><text x="472" y="124" class="t-s">yes</text>
  <line x1="665" y1="90" x2="665" y2="148" class="ln" marker-end="url(#a6)"/><text x="672" y="124" class="t-s">yes</text>
  <line x1="740" y1="65" x2="758" y2="65" class="ln" marker-end="url(#a6)"/><text x="749" y="108" text-anchor="middle" class="t-s">no</text>

  <rect x="190" y="240" width="550" height="44" rx="4" class="z-fsd"/>
  <text x="465" y="260" text-anchor="middle" class="t-b">Verify against the run record: HEAD, overlay, branch</text>
  <text x="465" y="276" text-anchor="middle" class="t-s">mismatch → park the row for a person, never overwrite</text>
  <line x1="265" y1="190" x2="265" y2="238" class="ln" marker-end="url(#a6)"/>
  <line x1="465" y1="190" x2="465" y2="238" class="ln" marker-end="url(#a6)"/>
  <line x1="665" y1="208" x2="665" y2="238" class="ln" marker-end="url(#a6)"/>

  </g>
</svg>
