<svg viewBox="0 0 940 432" role="img" aria-label="D2: who is asked when held work does not match the run record. Chosen: the run&#x27;s owner, through the run&#x27;s existing question to its inbox. Instead of: the operator who runs the hosts. It comes down to who can read the work: a private project&#x27;s work is its owner&#x27;s alone, so the operator cannot see what disagreed. The price: an owner whose remote is broken may have to fetch the operator, who gets a log line naming the run and the reason but no contents. Both leave the held work untouched. Locks in: a mismatch waits for its owner. Flips if: the operator can read every project&#x27;s work."
     xmlns="http://www.w3.org/2000/svg">
  <style>
    :root { --surface:#FCFCFA; --surface-2:#E8E8E1; --ink:#191C21; --ink-2:#4C535B; --ink-3:#7A828B;
            --rule:#D5D4CB; --accent:#3E4E8C; --accent-soft:#E0E3F0; --code:#2C7C69; --code-soft:#DCEDE7;
            --gone:#A9544F; }
    @media (prefers-color-scheme: dark) {
      :root { --surface:#181C1F; --surface-2:#202528; --ink:#E6E8E5; --ink-2:#A4ACB1; --ink-3:#737B81;
              --rule:#2B3135; --accent:#8B9BD8; --accent-soft:#1B2140; --code:#5DBBA1; --code-soft:#14302A;
              --gone:#DE8A84; } }
    .bg     { fill:var(--surface); }
    .ask    { fill:var(--surface-2); }
    .chosen { fill:var(--code-soft); stroke:var(--code); stroke-width:1.6; }
    .lost   { fill:var(--surface); stroke:var(--rule); stroke-width:1.4; stroke-dasharray:5 4; }
    .decide { fill:var(--accent-soft); }
    .bar    { fill:var(--accent); }
    .row    { stroke:var(--rule); stroke-width:1; }
    .foot   { fill:var(--surface-2); }
    .t-lbl  { fill:var(--ink-3); font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:9.5px; letter-spacing:.1em; }
    .t-tag  { font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:9.5px; letter-spacing:.1em; font-weight:600; }
    .t-q    { fill:var(--ink); font-family:system-ui,-apple-system,sans-serif; font-weight:600; font-size:15px; }
    .t-h    { font-family:system-ui,-apple-system,sans-serif; font-weight:600; font-size:14px; }
    .t-b    { fill:var(--ink); font-family:system-ui,-apple-system,sans-serif; font-size:12.5px; }
    .t-s    { fill:var(--ink-2); font-family:system-ui,-apple-system,sans-serif; font-size:11px; }
    .mark   { font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:16px; font-weight:700; }
    .plus   { fill:var(--code); }
    .minus  { fill:var(--gone); }
    .tie    { fill:var(--ink-3); }
    .c-code { fill:var(--code); }
    .c-mute { fill:var(--ink-3); }
    .c-lost { fill:var(--ink-2); }
    .c-acc  { fill:var(--accent); }
  </style>
  <rect class="bg" x="0" y="0" width="940" height="432"/>
  <g id="the-call">
    <rect class="ask" x="16" y="14" width="908" height="48" rx="6"/>
    <text class="t-lbl" x="32" y="32">D2 · THE CALL</text>
    <text class="t-q" x="32" y="52">Held work does not match the run&#x27;s record. Who is asked?</text>
  </g>
  <g id="options">
    <rect class="chosen" x="212" y="76" width="348" height="46" rx="5"/>
    <text class="t-tag c-code" x="228" y="93">CHOSEN</text>
    <text class="t-h c-code" x="228" y="112">The run&#x27;s owner</text>
    <rect class="lost" x="576" y="76" width="348" height="46" rx="5"/>
    <text class="t-tag c-mute" x="592" y="93">INSTEAD OF</text>
    <text class="t-h c-lost" x="592" y="112">The Lab&#x27;s operator</text>
  </g>
  <g id="row-0">
    <rect class="decide" x="16" y="134" width="908" height="62" rx="4"/>
    <rect class="bar" x="16" y="134" width="4" height="62"/>
    <text class="t-lbl" x="32" y="156">WHO CAN</text>
    <text class="t-lbl" x="32" y="169">READ THE WORK</text>
    <text class="t-tag c-acc" x="32" y="186">▸ DECIDES IT</text>
    <text class="mark plus" x="228" y="162">+</text>
    <text class="t-b" x="248" y="161">Always the owner</text>
    <text class="t-s" x="248" y="179">private or shared</text>
    <text class="mark minus" x="592" y="162">−</text>
    <text class="t-b" x="612" y="161">Not a private project&#x27;s</text>
    <text class="t-s" x="612" y="179">cannot see what disagreed</text>
  </g>
  <g id="row-1">
    <text class="t-lbl" x="32" y="236">A BROKEN</text>
    <text class="t-lbl" x="32" y="249">REMOTE</text>
    <text class="mark minus" x="228" y="238">−</text>
    <text class="t-b" x="248" y="237">Owner may fetch the operator</text>
    <text class="t-s" x="248" y="255">who has a log line, no contents</text>
    <text class="mark plus" x="592" y="238">+</text>
    <text class="t-b" x="612" y="237">Fixes it directly</text>
    <text class="t-s" x="612" y="255">runs the hosts</text>
    <line class="row" x1="16" y1="260" x2="924" y2="260"/>
  </g>
  <g id="row-2">
    <text class="t-lbl" x="32" y="294">WHAT IS</text>
    <text class="t-lbl" x="32" y="307">OVERWRITTEN</text>
    <text class="mark tie" x="228" y="296">=</text>
    <text class="t-b" x="248" y="295">Nothing</text>
    <text class="t-s" x="248" y="313">the row waits</text>
    <text class="mark tie" x="592" y="296">=</text>
    <text class="t-b" x="612" y="295">Nothing</text>
    <text class="t-s" x="612" y="313">the row waits</text>
    <line class="row" x1="16" y1="318" x2="924" y2="318"/>
  </g>
  <g id="locks-in">
    <rect class="foot" x="16" y="342" width="446" height="74" rx="5"/>
    <text class="t-lbl" x="32" y="363">LOCKS IN</text>
    <text class="t-b" x="32" y="383">A mismatch waits for its owner</text>
    <text class="t-s" x="32" y="401">through the run&#x27;s existing question</text>
  </g>
  <g id="flips-if">
    <rect class="foot" x="478" y="342" width="446" height="74" rx="5"/>
    <text class="t-lbl" x="494" y="363">FLIPS IF</text>
    <text class="t-b" x="494" y="383">The operator can read every project&#x27;s work</text>
    <text class="t-s" x="494" y="401">then the operator is the faster fix</text>
  </g>
</svg>
