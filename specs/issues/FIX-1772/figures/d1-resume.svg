<svg viewBox="0 0 940 426" role="img" aria-label="D1, what a resumed request does when a value it must hand on was recorded only as a placeholder. Chosen: fail the resumed request with an error that names the step and the limit. Instead of: run the step again. It comes down to the first row, side effects: failing never repeats one, while running again repeats any write the step does not guard. The price is the second row: the resumed request fails, where running again would finish it. Third row: failing is one check and one error; running again needs a new re-dispatch path for a generator's finished tool call. Locks in: resume never computes from a placeholder, and the cost lands on the step that broke the rule. Flips if: a real flow trips the limit often enough that recovering matters more than failing loudly."
     xmlns="http://www.w3.org/2000/svg">
    <style>
    :root { --surface:#FCFCFA; --surface-2:#E8E8E1; --ink:#191C21; --ink-2:#4C535B; --ink-3:#7A828B;
            --rule:#D5D4CB; --accent:#3E4E8C; --accent-soft:#E0E3F0; --code:#2C7C69; --code-soft:#DCEDE7;
            --gone:#A9544F; }
    @media (prefers-color-scheme: dark) {
      :root { --surface:#181C1F; --surface-2:#202528; --ink:#E6E8E5; --ink-2:#A4ACB1; --ink-3:#737B81;
              --rule:#2B3135; --accent:#8B9BD8; --accent-soft:#1B2140; --code:#5DBBA1; --code-soft:#14302A;
              --gone:#DE8A84; } }
    .bg     { fill:var(--surface); }
    .ask    { fill:var(--surface-2); }
    .chosen { fill:var(--code-soft); stroke:var(--code); stroke-width:1.6; }
    .lost   { fill:var(--surface); stroke:var(--rule); stroke-width:1.4; stroke-dasharray:5 4; }
    .decide { fill:var(--accent-soft); }
    .bar    { fill:var(--accent); }
    .row    { stroke:var(--rule); stroke-width:1; }
    .foot   { fill:var(--surface-2); }
    .t-lbl  { fill:var(--ink-3); font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:9.5px; letter-spacing:.1em; }
    .t-tag  { font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:9.5px; letter-spacing:.1em; font-weight:600; }
    .t-q    { fill:var(--ink); font-family:system-ui,-apple-system,sans-serif; font-weight:600; font-size:15px; }
    .t-h    { font-family:system-ui,-apple-system,sans-serif; font-weight:600; font-size:14px; }
    .t-b    { fill:var(--ink); font-family:system-ui,-apple-system,sans-serif; font-size:12.5px; }
    .t-s    { fill:var(--ink-2); font-family:system-ui,-apple-system,sans-serif; font-size:11px; }
    .mark   { font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:16px; font-weight:700; }
    .plus   { fill:var(--code); }
    .minus  { fill:var(--gone); }
    .tie    { fill:var(--ink-3); }
    .c-code { fill:var(--code); }
    .c-mute { fill:var(--ink-3); }
    .c-lost { fill:var(--ink-2); }
    .c-acc  { fill:var(--accent); }
  </style>
  <rect class="bg" x="0" y="0" width="940" height="426"/>

  <g id="the-call">
    <rect class="ask" x="16" y="14" width="908" height="48" rx="6"/>
    <text class="t-lbl" x="32" y="32">D1 · THE CALL</text>
    <text class="t-q" x="32" y="52">A resumed request needs a value recorded only as a placeholder. Fail, or run the step again?</text>
  </g>

  <g id="options">
    <rect class="chosen" x="212" y="76" width="348" height="46" rx="5"/>
    <text class="t-tag c-code" x="228" y="93">CHOSEN</text>
    <text class="t-h c-code" x="228" y="112">Fail the resumed request</text>
    <rect class="lost" x="576" y="76" width="348" height="46" rx="5"/>
    <text class="t-tag c-mute" x="592" y="93">INSTEAD OF</text>
    <text class="t-h c-lost" x="592" y="112">Run the step again</text>
  </g>

  <g id="row-1">
    <rect class="decide" x="16" y="134" width="908" height="62" rx="4"/>
    <rect class="bar" x="16" y="134" width="4" height="62"/>
    <text class="t-lbl" x="32" y="156">SIDE EFFECTS</text>
    <text class="t-tag c-acc" x="32" y="186">▸ DECIDES IT</text>
    <text class="mark plus" x="228" y="162">+</text>
    <text class="t-b" x="248" y="161">Never repeat</text>
    <text class="t-s" x="248" y="179">nothing runs a second time</text>
    <text class="mark minus" x="592" y="162">−</text>
    <text class="t-b" x="612" y="161">Can repeat</text>
    <text class="t-s" x="612" y="179">an unguarded write runs twice</text>
  </g>

  <g id="row-2">
    <text class="t-lbl" x="32" y="228">THE REQUEST</text>
    <text class="mark minus" x="228" y="234">−</text>
    <text class="t-b" x="248" y="233">Fails on resume</text>
    <text class="t-s" x="248" y="251">the error names the step and the limit</text>
    <text class="mark plus" x="592" y="234">+</text>
    <text class="t-b" x="612" y="233">Finishes</text>
    <text class="t-s" x="612" y="251">the later steps get the real value</text>
    <line class="row" x1="16" y1="262" x2="924" y2="262"/>
  </g>

  <g id="row-3">
    <text class="t-lbl" x="32" y="286">WORK</text>
    <text class="mark plus" x="228" y="292">+</text>
    <text class="t-b" x="248" y="291">One check, one error</text>
    <text class="t-s" x="248" y="309">where resume reads a saved value</text>
    <text class="mark minus" x="592" y="292">−</text>
    <text class="t-b" x="612" y="291">A new re-dispatch path</text>
    <text class="t-s" x="612" y="309">for a generator's finished tool call</text>
    <line class="row" x1="16" y1="320" x2="924" y2="320"/>
  </g>

  <g id="locks-in">
    <rect class="foot" x="16" y="336" width="446" height="74" rx="5"/>
    <text class="t-lbl" x="32" y="357">LOCKS IN</text>
    <text class="t-b" x="32" y="377">Resume never computes from a placeholder</text>
    <text class="t-s" x="32" y="395">the cost lands on the step that broke the rule</text>
  </g>

  <g id="flips-if">
    <rect class="foot" x="478" y="336" width="446" height="74" rx="5"/>
    <text class="t-lbl" x="494" y="357">FLIPS IF</text>
    <text class="t-b" x="494" y="377">A real flow trips the limit often</text>
    <text class="t-s" x="494" y="395">then recovering matters more than failing loudly</text>
  </g>
</svg>
