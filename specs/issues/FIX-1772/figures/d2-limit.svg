<svg viewBox="0 0 940 426" role="img" aria-label="D2, what happens when a step's output is over the 256 KiB limit. Chosen: save a placeholder and let the run go on. Instead of: save the output cut short, or stop the run. It comes down to the first row, a 1 MB output in production: the chosen option finishes the run and the record shows the size; cutting it short finishes but saves half a value that looks whole; stopping fails the run over a logging limit. On resume, the chosen option re-runs the step, cutting short hands back half a value, and stopping has nothing to resume. Locks in: 256 KiB is a public number, and lowering it later makes more steps re-run on resume. Flips if: an oversized output should be a bug that stops the run."
     xmlns="http://www.w3.org/2000/svg">
    <style>
    :root { --surface:#FCFCFA; --surface-2:#E8E8E1; --ink:#191C21; --ink-2:#4C535B; --ink-3:#7A828B;
            --rule:#D5D4CB; --accent:#3E4E8C; --accent-soft:#E0E3F0; --code:#2C7C69; --code-soft:#DCEDE7;
            --gone:#A9544F; }
    @media (prefers-color-scheme: dark) {
      :root { --surface:#181C1F; --surface-2:#202528; --ink:#E6E8E5; --ink-2:#A4ACB1; --ink-3:#737B81;
              --rule:#2B3135; --accent:#8B9BD8; --accent-soft:#1B2140; --code:#5DBBA1; --code-soft:#14302A;
              --gone:#DE8A84; } }
    .bg     { fill:var(--surface); }
    .ask    { fill:var(--surface-2); }
    .chosen { fill:var(--code-soft); stroke:var(--code); stroke-width:1.6; }
    .lost   { fill:var(--surface); stroke:var(--rule); stroke-width:1.4; stroke-dasharray:5 4; }
    .decide { fill:var(--accent-soft); }
    .bar    { fill:var(--accent); }
    .row    { stroke:var(--rule); stroke-width:1; }
    .foot   { fill:var(--surface-2); }
    .t-lbl  { fill:var(--ink-3); font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:9.5px; letter-spacing:.1em; }
    .t-tag  { font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:9.5px; letter-spacing:.1em; font-weight:600; }
    .t-q    { fill:var(--ink); font-family:system-ui,-apple-system,sans-serif; font-weight:600; font-size:15px; }
    .t-h    { font-family:system-ui,-apple-system,sans-serif; font-weight:600; font-size:14px; }
    .t-b    { fill:var(--ink); font-family:system-ui,-apple-system,sans-serif; font-size:12.5px; }
    .t-s    { fill:var(--ink-2); font-family:system-ui,-apple-system,sans-serif; font-size:11px; }
    .mark   { font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:16px; font-weight:700; }
    .plus   { fill:var(--code); }
    .minus  { fill:var(--gone); }
    .tie    { fill:var(--ink-3); }
    .c-code { fill:var(--code); }
    .c-mute { fill:var(--ink-3); }
    .c-lost { fill:var(--ink-2); }
    .c-acc  { fill:var(--accent); }
  </style>
  <rect class="bg" x="0" y="0" width="940" height="426"/>

  <g id="the-call">
    <rect class="ask" x="16" y="14" width="908" height="48" rx="6"/>
    <text class="t-lbl" x="32" y="32">D2 · THE CALL</text>
    <text class="t-q" x="32" y="52">A step's output is over the 256 KiB limit. What do we save, and does the run go on?</text>
  </g>

  <g id="options">
    <rect class="chosen" x="212" y="76" width="224" height="46" rx="5"/>
    <text class="t-tag c-code" x="228" y="93">CHOSEN</text>
    <text class="t-h c-code" x="228" y="112">Placeholder; run goes on</text>
    <rect class="lost" x="452" y="76" width="224" height="46" rx="5"/>
    <text class="t-tag c-mute" x="468" y="93">INSTEAD OF</text>
    <text class="t-h c-lost" x="468" y="112">Save it cut short</text>
    <rect class="lost" x="692" y="76" width="224" height="46" rx="5"/>
    <text class="t-tag c-mute" x="708" y="93">INSTEAD OF</text>
    <text class="t-h c-lost" x="708" y="112">Stop the run</text>
  </g>

  <g id="row-1">
    <rect class="decide" x="16" y="134" width="908" height="62" rx="4"/>
    <rect class="bar" x="16" y="134" width="4" height="62"/>
    <text class="t-lbl" x="32" y="156">A 1 MB OUTPUT</text>
    <text class="t-lbl" x="32" y="169">IN PRODUCTION</text>
    <text class="t-tag c-acc" x="32" y="186">▸ DECIDES IT</text>
    <text class="mark plus" x="228" y="162">+</text>
    <text class="t-b" x="248" y="161">Run finishes</text>
    <text class="t-s" x="248" y="179">record shows the size</text>
    <text class="mark minus" x="468" y="162">−</text>
    <text class="t-b" x="488" y="161">Record lies</text>
    <text class="t-s" x="488" y="179">half a value that looks whole</text>
    <text class="mark minus" x="708" y="162">−</text>
    <text class="t-b" x="728" y="161">Run fails</text>
    <text class="t-s" x="728" y="179">over a logging limit</text>
  </g>

  <g id="row-2">
    <text class="t-lbl" x="32" y="228">ON RESUME</text>
    <text class="mark minus" x="228" y="234">−</text>
    <text class="t-b" x="248" y="233">Re-runs that step</text>
    <text class="t-s" x="248" y="251">D1</text>
    <text class="mark minus" x="468" y="234">−</text>
    <text class="t-b" x="488" y="233">Hands back half</text>
    <text class="t-s" x="488" y="251">later steps read it as whole</text>
    <text class="mark plus" x="708" y="234">+</text>
    <text class="t-b" x="728" y="233">Nothing to resume</text>
    <text class="t-s" x="728" y="251">no D1 work</text>
    <line class="row" x1="16" y1="262" x2="924" y2="262"/>
  </g>

  <g id="row-3">
    <text class="t-lbl" x="32" y="286">DEBUGGING IT</text>
    <text class="mark tie" x="228" y="292">=</text>
    <text class="t-b" x="248" y="291">Size and a preview</text>
    <text class="t-s" x="248" y="309">plus a warning line</text>
    <text class="mark tie" x="468" y="292">=</text>
    <text class="t-b" x="488" y="291">More of the data</text>
    <text class="t-s" x="488" y="309">but not all of it</text>
    <text class="mark tie" x="708" y="292">=</text>
    <text class="t-b" x="728" y="291">An error naming</text>
    <text class="t-s" x="728" y="309">the step and the size</text>
    <line class="row" x1="16" y1="320" x2="924" y2="320"/>
  </g>

  <g id="locks-in">
    <rect class="foot" x="16" y="336" width="446" height="74" rx="5"/>
    <text class="t-lbl" x="32" y="357">LOCKS IN</text>
    <text class="t-b" x="32" y="377">256 KiB becomes a public number</text>
    <text class="t-s" x="32" y="395">lowering it later makes more steps re-run on resume</text>
  </g>

  <g id="flips-if">
    <rect class="foot" x="478" y="336" width="446" height="74" rx="5"/>
    <text class="t-lbl" x="494" y="357">FLIPS IF</text>
    <text class="t-b" x="494" y="377">A too-big output should be a bug that stops the run</text>
    <text class="t-s" x="494" y="395">then stop it, and D1's re-run work goes away</text>
  </g>
</svg>
