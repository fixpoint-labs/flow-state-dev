<svg viewBox="0 0 940 426" role="img" aria-label="D3, whether to build an option that saves a smaller value than the step returns. Chosen: not now; the rule and the limit close the issue. Instead of: build it now as its own option, or build it now as part of the tool option that sets what the model is told. It comes down to the first row: no step needs it today, since the project files step now returns paths and sizes. Built either way, every step that uses it re-runs on resume, and as part of the tool option it would only work for tools. The price of waiting: a step that must pass a big or secret value on keeps it in a resource and returns a reference. Locks in: no way to save a different value than the step returns. Flips if: a second step must pass a big or secret value on and cannot use a resource."
     xmlns="http://www.w3.org/2000/svg">
    <style>
    :root { --surface:#FCFCFA; --surface-2:#E8E8E1; --ink:#191C21; --ink-2:#4C535B; --ink-3:#7A828B;
            --rule:#D5D4CB; --accent:#3E4E8C; --accent-soft:#E0E3F0; --code:#2C7C69; --code-soft:#DCEDE7;
            --gone:#A9544F; }
    @media (prefers-color-scheme: dark) {
      :root { --surface:#181C1F; --surface-2:#202528; --ink:#E6E8E5; --ink-2:#A4ACB1; --ink-3:#737B81;
              --rule:#2B3135; --accent:#8B9BD8; --accent-soft:#1B2140; --code:#5DBBA1; --code-soft:#14302A;
              --gone:#DE8A84; } }
    .bg     { fill:var(--surface); }
    .ask    { fill:var(--surface-2); }
    .chosen { fill:var(--code-soft); stroke:var(--code); stroke-width:1.6; }
    .lost   { fill:var(--surface); stroke:var(--rule); stroke-width:1.4; stroke-dasharray:5 4; }
    .decide { fill:var(--accent-soft); }
    .bar    { fill:var(--accent); }
    .row    { stroke:var(--rule); stroke-width:1; }
    .foot   { fill:var(--surface-2); }
    .t-lbl  { fill:var(--ink-3); font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:9.5px; letter-spacing:.1em; }
    .t-tag  { font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:9.5px; letter-spacing:.1em; font-weight:600; }
    .t-q    { fill:var(--ink); font-family:system-ui,-apple-system,sans-serif; font-weight:600; font-size:15px; }
    .t-h    { font-family:system-ui,-apple-system,sans-serif; font-weight:600; font-size:14px; }
    .t-b    { fill:var(--ink); font-family:system-ui,-apple-system,sans-serif; font-size:12.5px; }
    .t-s    { fill:var(--ink-2); font-family:system-ui,-apple-system,sans-serif; font-size:11px; }
    .mark   { font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:16px; font-weight:700; }
    .plus   { fill:var(--code); }
    .minus  { fill:var(--gone); }
    .tie    { fill:var(--ink-3); }
    .c-code { fill:var(--code); }
    .c-mute { fill:var(--ink-3); }
    .c-lost { fill:var(--ink-2); }
    .c-acc  { fill:var(--accent); }
  </style>
  <rect class="bg" x="0" y="0" width="940" height="426"/>

  <g id="the-call">
    <rect class="ask" x="16" y="14" width="908" height="48" rx="6"/>
    <text class="t-lbl" x="32" y="32">D3 · THE CALL</text>
    <text class="t-q" x="32" y="52">Do we build an option that saves a smaller value than the step returns?</text>
  </g>

  <g id="options">
    <rect class="chosen" x="212" y="76" width="224" height="46" rx="5"/>
    <text class="t-tag c-code" x="228" y="93">CHOSEN</text>
    <text class="t-h c-code" x="228" y="112">Not now</text>
    <rect class="lost" x="452" y="76" width="224" height="46" rx="5"/>
    <text class="t-tag c-mute" x="468" y="93">INSTEAD OF</text>
    <text class="t-h c-lost" x="468" y="112">Build it, its own option</text>
    <rect class="lost" x="692" y="76" width="224" height="46" rx="5"/>
    <text class="t-tag c-mute" x="708" y="93">INSTEAD OF</text>
    <text class="t-h c-lost" x="708" y="112">Part of mapModelOutput</text>
  </g>

  <g id="row-1">
    <rect class="decide" x="16" y="134" width="908" height="62" rx="4"/>
    <rect class="bar" x="16" y="134" width="4" height="62"/>
    <text class="t-lbl" x="32" y="156">WHO NEEDS IT TODAY</text>
    <text class="t-tag c-acc" x="32" y="186">▸ DECIDES IT</text>
    <text class="mark plus" x="228" y="162">+</text>
    <text class="t-b" x="248" y="161">No one</text>
    <text class="t-s" x="248" y="179">project files return paths now</text>
    <text class="mark minus" x="468" y="162">−</text>
    <text class="t-b" x="488" y="161">No present user</text>
    <text class="t-s" x="488" y="179">public surface, no consumer</text>
    <text class="mark minus" x="708" y="162">−</text>
    <text class="t-b" x="728" y="161">No present user</text>
    <text class="t-s" x="728" y="179">and tools only</text>
  </g>

  <g id="row-2">
    <text class="t-lbl" x="32" y="228">ON RESUME</text>
    <text class="mark plus" x="228" y="234">+</text>
    <text class="t-b" x="248" y="233">Unchanged</text>
    <text class="t-s" x="248" y="251">only D1's too-big steps re-run</text>
    <text class="mark minus" x="468" y="234">−</text>
    <text class="t-b" x="488" y="233">Each user re-runs</text>
    <text class="t-s" x="488" y="251">a cost the option hides</text>
    <text class="mark minus" x="708" y="234">−</text>
    <text class="t-b" x="728" y="233">Each user re-runs</text>
    <text class="t-s" x="728" y="251">and the model's view moves too</text>
    <line class="row" x1="16" y1="262" x2="924" y2="262"/>
  </g>

  <g id="row-3">
    <text class="t-lbl" x="32" y="286">A STEP THAT MUST</text>
    <text class="t-lbl" x="32" y="299">PASS A BIG VALUE ON</text>
    <text class="mark minus" x="228" y="292">−</text>
    <text class="t-b" x="248" y="291">Keeps it in a resource</text>
    <text class="t-s" x="248" y="309">and returns a reference</text>
    <text class="mark plus" x="468" y="292">+</text>
    <text class="t-b" x="488" y="291">Declares a small record</text>
    <text class="t-s" x="488" y="309">returns the big value</text>
    <text class="mark minus" x="708" y="292">−</text>
    <text class="t-b" x="728" y="291">Can't</text>
    <text class="t-s" x="728" y="309">unless the step is a tool</text>
    <line class="row" x1="16" y1="320" x2="924" y2="320"/>
  </g>

  <g id="locks-in">
    <rect class="foot" x="16" y="336" width="446" height="74" rx="5"/>
    <text class="t-lbl" x="32" y="357">LOCKS IN</text>
    <text class="t-b" x="32" y="377">No option to save less than the step returns</text>
    <text class="t-s" x="32" y="395">big or secret data stays out of the return, by rule</text>
  </g>

  <g id="flips-if">
    <rect class="foot" x="478" y="336" width="446" height="74" rx="5"/>
    <text class="t-lbl" x="494" y="357">FLIPS IF</text>
    <text class="t-b" x="494" y="377">A second step must pass big or secret data on</text>
    <text class="t-s" x="494" y="395">and can't use a resource; then build it, separately</text>
  </g>
</svg>
