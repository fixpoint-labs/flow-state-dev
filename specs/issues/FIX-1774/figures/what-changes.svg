<svg viewBox="0 0 940 360" role="img" aria-label="What changes. Today, two dead ends: asked for a hello-world app, the chief of staff hires a worker that no workstream or board can reach, so nothing runs; and a correctly shaped post on the feature workstream files a task that stays pending because nothing runs the board. After: the chief of staff posts the ask on eng.feature as slug and what, with defaults named, the EM files the task and runs the board, and the existing coder starts a coding run."
     xmlns="http://www.w3.org/2000/svg">
  <style>
    :root { --surface:#FCFCFA; --surface-2:#E8E8E1; --ink:#191C21; --ink-2:#4C535B; --ink-3:#7A828B;
            --rule:#D5D4CB; --accent:#3E4E8C; --accent-soft:#E0E3F0; --code:#2C7C69; --code-soft:#DCEDE7;
            --gone:#A9544F; }
    @media (prefers-color-scheme: dark) {
      :root { --surface:#181C1F; --surface-2:#202528; --ink:#E6E8E5; --ink-2:#A4ACB1; --ink-3:#737B81;
              --rule:#2B3135; --accent:#8B9BD8; --accent-soft:#1B2140; --code:#5DBBA1; --code-soft:#14302A;
              --gone:#DE8A84; } }
    .bg { fill:var(--surface); }
    .lane { fill:var(--surface-2); }
    .n-box { fill:var(--surface); stroke:var(--rule); stroke-width:1.2; }
    .ok { fill:var(--code-soft); stroke:var(--code); stroke-width:1.6; }
    .dead { fill:var(--surface); stroke:var(--gone); stroke-width:1.4; stroke-dasharray:5 4; }
    .arr { stroke:var(--ink-3); stroke-width:1.4; }
    .arr-h { fill:var(--ink-3); }
    .t-lbl { fill:var(--ink-3); font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:9.5px; letter-spacing:.1em; }
    .t-lane { fill:var(--ink-2); font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:10px; letter-spacing:.12em; font-weight:600; }
    .t-b { fill:var(--ink); font-family:system-ui,-apple-system,sans-serif; font-weight:600; font-size:12.5px; }
    .t-s { fill:var(--ink-2); font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:9.5px; }
    .t-x { fill:var(--gone); font-family:system-ui,-apple-system,sans-serif; font-weight:700; font-size:12px; }
    .t-v { fill:var(--code); font-family:system-ui,-apple-system,sans-serif; font-weight:700; font-size:12px; }
  </style>
  <rect class="bg" x="0" y="0" width="940" height="360"/>
  <g id="today">
    <rect class="lane" x="12" y="12" width="916" height="178" rx="6"/>
    <text class="t-lane" x="28" y="32">TODAY</text>
    <rect class="n-box" x="28" y="44" width="150" height="58" rx="5"/>
    <text class="t-lbl" x="40" y="61">PERSON</text>
    <text class="t-b" x="40" y="79">build it, just do it</text>
    <text class="t-s" x="40" y="94">hire if you need to</text>
    <line class="arr" x1="178" y1="73" x2="200" y2="73"/><path class="arr-h" d="M199,69 L206,73 L199,77 Z"/>
    <rect class="n-box" x="206" y="44" width="160" height="58" rx="5"/>
    <text class="t-lbl" x="218" y="61">CHIEF OF STAFF</text>
    <text class="t-b" x="218" y="79">hires, twice</text>
    <text class="t-s" x="218" y="94">worker, then coder</text>
    <line class="arr" x1="366" y1="73" x2="388" y2="73"/><path class="arr-h" d="M387,69 L394,73 L387,77 Z"/>
    <rect class="dead" x="394" y="44" width="200" height="58" rx="5"/>
    <text class="t-lbl" x="406" y="61">HIRED WORKER</text>
    <text class="t-b" x="406" y="79">on no workstream</text>
    <text class="t-s" x="406" y="94">no board hands it a row</text>
    <text class="t-x" x="610" y="78">✕ nothing runs, then a stack question</text>
    <rect class="n-box" x="28" y="120" width="150" height="58" rx="5"/>
    <text class="t-lbl" x="40" y="137">IF IT POSTED</text>
    <text class="t-b" x="40" y="155">slug: what</text>
    <text class="t-s" x="40" y="170">on eng.feature</text>
    <line class="arr" x1="178" y1="149" x2="200" y2="149"/><path class="arr-h" d="M199,145 L206,149 L199,153 Z"/>
    <rect class="n-box" x="206" y="120" width="160" height="58" rx="5"/>
    <text class="t-lbl" x="218" y="137">EM · POST DOOR</text>
    <text class="t-b" x="218" y="155">files the task</text>
    <text class="t-s" x="218" y="170">does not run the board</text>
    <line class="arr" x1="366" y1="149" x2="388" y2="149"/><path class="arr-h" d="M387,145 L394,149 L387,153 Z"/>
    <rect class="dead" x="394" y="120" width="200" height="58" rx="5"/>
    <text class="t-lbl" x="406" y="137">TASK</text>
    <text class="t-b" x="406" y="155">pending, for good</text>
    <text class="t-s" x="406" y="170">nobody drains it</text>
    <text class="t-x" x="610" y="154">✕ the README says the coder picks it up</text>
  </g>
  <g id="after">
    <rect class="lane" x="12" y="202" width="916" height="146" rx="6"/>
    <text class="t-lane" x="28" y="222">AFTER</text>
    <rect class="n-box" x="28" y="240" width="140" height="58" rx="5"/>
    <text class="t-lbl" x="40" y="257">PERSON</text>
    <text class="t-b" x="40" y="275">build it, just do it</text>
    <text class="t-s" x="40" y="290">hire if you need to</text>
    <line class="arr" x1="168" y1="269" x2="180" y2="269"/><path class="arr-h" d="M179,265 L186,269 L179,273 Z"/>
    <rect class="ok" x="186" y="240" width="170" height="58" rx="5"/>
    <text class="t-lbl" x="198" y="257">CHIEF OF STAFF</text>
    <text class="t-b" x="198" y="275">no hire, one post</text>
    <text class="t-s" x="198" y="290">defaults named in it</text>
    <line class="arr" x1="356" y1="269" x2="368" y2="269"/><path class="arr-h" d="M367,265 L374,269 L367,273 Z"/>
    <rect class="ok" x="374" y="240" width="170" height="58" rx="5"/>
    <text class="t-lbl" x="386" y="257">EM · POST DOOR</text>
    <text class="t-b" x="386" y="275">files, then runs</text>
    <text class="t-s" x="386" y="290">the board, same delivery</text>
    <line class="arr" x1="544" y1="269" x2="556" y2="269"/><path class="arr-h" d="M555,265 L562,269 L555,273 Z"/>
    <rect class="ok" x="562" y="240" width="170" height="58" rx="5"/>
    <text class="t-lbl" x="574" y="257">ENG.CODER</text>
    <text class="t-b" x="574" y="275">coding run starts</text>
    <text class="t-s" x="574" y="290">the existing worker</text>
    <text class="t-v" x="750" y="266">✓ one task, one run</text>
    <text class="t-s" x="750" y="282">a project with no coding</text>
    <text class="t-s" x="750" y="295">workstream gets the reason</text>
    <text class="t-s" x="750" y="308">instead, and no hire</text>
  </g>
</svg>
