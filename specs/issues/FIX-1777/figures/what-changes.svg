<svg viewBox="0 0 940 330" role="img" aria-label="What changes. Today four routes can add a task to a mailbox task list: a post door, fileTask, a board tool, or a worker's own board. The task waits in pending until someone runs the list by hand, and only DevTeam's Approve does. After: any add to the list makes the mailbox run the list in a request of its own, as the person who filed it, and hand the task to the worker it names or the one worker the mailbox names for the list. The filer gets an answer at once."
     xmlns="http://www.w3.org/2000/svg">
  <style>
    :root { --surface:#FCFCFA; --surface-2:#E8E8E1; --ink:#191C21; --ink-2:#4C535B; --ink-3:#7A828B;
            --rule:#D5D4CB; --accent:#3E4E8C; --accent-soft:#E0E3F0; --code:#2C7C69; --code-soft:#DCEDE7;
            --gone:#A9544F; }
    @media (prefers-color-scheme: dark) {
      :root { --surface:#181C1F; --surface-2:#202528; --ink:#E6E8E5; --ink-2:#A4ACB1; --ink-3:#737B81;
              --rule:#2B3135; --accent:#8B9BD8; --accent-soft:#1B2140; --code:#5DBBA1; --code-soft:#14302A;
              --gone:#DE8A84; } }
    .bg { fill:var(--surface); }
    .lane { fill:var(--surface-2); }
    .n-box { fill:var(--surface); stroke:var(--rule); stroke-width:1.2; }
    .ok { fill:var(--code-soft); stroke:var(--code); stroke-width:1.6; }
    .dead { fill:var(--surface); stroke:var(--gone); stroke-width:1.4; stroke-dasharray:5 4; }
    .arr { stroke:var(--ink-3); stroke-width:1.4; }
    .arr-h { fill:var(--ink-3); }
    .t-lbl { fill:var(--ink-3); font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:9.5px; letter-spacing:.1em; }
    .t-lane { fill:var(--ink-2); font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:10px; letter-spacing:.12em; font-weight:600; }
    .t-b { fill:var(--ink); font-family:system-ui,-apple-system,sans-serif; font-weight:600; font-size:12.5px; }
    .t-s { fill:var(--ink-2); font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:9.5px; }
    .t-x { fill:var(--gone); font-family:system-ui,-apple-system,sans-serif; font-weight:700; font-size:12px; }
    .t-v { fill:var(--code); font-family:system-ui,-apple-system,sans-serif; font-weight:700; font-size:12px; }
  </style>
  <rect class="bg" x="0" y="0" width="940" height="330"/>
  <g id="today">
    <rect class="lane" x="12" y="12" width="916" height="140" rx="6"/>
    <text class="t-lane" x="28" y="32">TODAY</text>
    <rect class="n-box" x="28" y="44" width="220" height="58" rx="5"/>
    <text class="t-lbl" x="40" y="61">ANY OF FOUR ROUTES</text>
    <text class="t-b" x="40" y="79">post · fileTask</text>
    <text class="t-s" x="40" y="94">board tool · own board</text>
    <line class="arr" x1="248" y1="73" x2="270" y2="73"/><path class="arr-h" d="M269,69 L276,73 L269,77 Z"/>
    <rect class="dead" x="276" y="44" width="220" height="58" rx="5"/>
    <text class="t-lbl" x="288" y="61">MAILBOX TASK LIST</text>
    <text class="t-b" x="288" y="79">pending, for good</text>
    <text class="t-s" x="288" y="94">the mailbox runs nothing</text>
    <line class="arr" x1="496" y1="73" x2="518" y2="73"/><path class="arr-h" d="M517,69 L524,73 L517,77 Z"/>
    <rect class="n-box" x="524" y="44" width="200" height="58" rx="5"/>
    <text class="t-lbl" x="536" y="61">SOMEONE, BY HAND</text>
    <text class="t-b" x="536" y="79">drain</text>
    <text class="t-s" x="536" y="94">only Approve does</text>

    <text class="t-x" x="28" y="132">✕ the route decides whether anything starts</text>
  </g>
  <g id="after">
    <rect class="lane" x="12" y="164" width="916" height="154" rx="6"/>
    <text class="t-lane" x="28" y="184">AFTER</text>
    <rect class="n-box" x="28" y="196" width="220" height="58" rx="5"/>
    <text class="t-lbl" x="40" y="213">ANY OF FOUR ROUTES</text>
    <text class="t-b" x="40" y="231">post · fileTask</text>
    <text class="t-s" x="40" y="246">board tool · own board</text>
    <line class="arr" x1="248" y1="225" x2="270" y2="225"/><path class="arr-h" d="M269,221 L276,225 L269,229 Z"/>
    <rect class="ok" x="276" y="196" width="220" height="58" rx="5"/>
    <text class="t-lbl" x="288" y="213">MAILBOX TASK LIST</text>
    <text class="t-b" x="288" y="231">sees the add</text>
    <text class="t-s" x="288" y="246">hands off, as the filer</text>
    <line class="arr" x1="496" y1="225" x2="518" y2="225"/><path class="arr-h" d="M517,221 L524,225 L517,229 Z"/>
    <rect class="ok" x="524" y="196" width="200" height="58" rx="5"/>
    <text class="t-lbl" x="536" y="213">THE WORKER IT'S FOR</text>
    <text class="t-b" x="536" y="231">its run starts</text>
    <text class="t-s" x="536" y="246">named, or the list's first</text>

    <text class="t-v" x="742" y="230">✓ one rule</text>
    <text class="t-s" x="28" y="284">the filer's call returns at once · a repeat adds nothing, so starts nothing</text>
    <text class="t-s" x="28" y="302">one person's filing never starts another person's task</text>
  </g>
</svg>
