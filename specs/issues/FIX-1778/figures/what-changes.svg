<svg viewBox="0 0 940 330" role="img" aria-label="What changes. Today: a task for license-auditor, an agent worker hired a minute ago, reaches a task list whose routes are fixed in code, so it has no route and fails; and an agent worker has no task door, so it could not take the task anyway. After: the same task, on any list; the list uses its own names first, else asks Workforce which flow the name means when it hands the task over; the lookup returns the hire's flow, and the hire runs the task as one turn, its claim checked against the list the task came from."
     xmlns="http://www.w3.org/2000/svg">
  <style>
    :root { --surface:#FCFCFA; --surface-2:#E8E8E1; --ink:#191C21; --ink-2:#4C535B; --ink-3:#7A828B;
            --rule:#D5D4CB; --accent:#3E4E8C; --accent-soft:#E0E3F0; --code:#2C7C69; --code-soft:#DCEDE7;
            --gone:#A9544F; }
    @media (prefers-color-scheme: dark) {
      :root { --surface:#181C1F; --surface-2:#202528; --ink:#E6E8E5; --ink-2:#A4ACB1; --ink-3:#737B81;
              --rule:#2B3135; --accent:#8B9BD8; --accent-soft:#1B2140; --code:#5DBBA1; --code-soft:#14302A;
              --gone:#DE8A84; } }
    .bg { fill:var(--surface); }
    .lane { fill:var(--surface-2); }
    .n-box { fill:var(--surface); stroke:var(--rule); stroke-width:1.2; }
    .new { fill:var(--accent-soft); stroke:var(--accent); stroke-width:1.4; }
    .ok { fill:var(--code-soft); stroke:var(--code); stroke-width:1.6; }
    .dead { fill:var(--surface); stroke:var(--gone); stroke-width:1.4; stroke-dasharray:5 4; }
    .arr { stroke:var(--ink-3); stroke-width:1.4; }
    .arr-h { fill:var(--ink-3); }
    .t-lbl { fill:var(--ink-3); font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:9.5px; letter-spacing:.1em; }
    .t-lane { fill:var(--ink-2); font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:10px; letter-spacing:.12em; font-weight:600; }
    .t-b { fill:var(--ink); font-family:system-ui,-apple-system,sans-serif; font-weight:600; font-size:12.5px; }
    .t-s { fill:var(--ink-2); font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:9.5px; }
    .t-x { fill:var(--gone); font-family:system-ui,-apple-system,sans-serif; font-weight:700; font-size:12px; }
    .t-v { fill:var(--code); font-family:system-ui,-apple-system,sans-serif; font-weight:700; font-size:12px; }
  </style>
  <rect class="bg" x="0" y="0" width="940" height="330"/>
  <g id="today">
    <rect class="lane" x="12" y="12" width="916" height="140" rx="6"/>
    <text class="t-lane" x="28" y="32">TODAY</text>
    <rect class="n-box" x="28" y="44" width="170" height="58" rx="5"/>
    <text class="t-lbl" x="40" y="61">TASK</text>
    <text class="t-b" x="40" y="79">for: license-auditor</text>
    <text class="t-s" x="40" y="94">an agent hired a minute ago</text>
    <line class="arr" x1="198" y1="73" x2="222" y2="73"/><path class="arr-h" d="M221,69 L228,73 L221,77 Z"/>
    <rect class="n-box" x="228" y="44" width="230" height="58" rx="5"/>
    <text class="t-lbl" x="240" y="61">THE TASK LIST</text>
    <text class="t-b" x="240" y="79">routes fixed in code</text>
    <text class="t-s" x="240" y="94">only the workers wired to it</text>
    <line class="arr" x1="458" y1="73" x2="482" y2="73"/><path class="arr-h" d="M481,69 L488,73 L481,77 Z"/>
    <rect class="dead" x="488" y="44" width="200" height="58" rx="5"/>
    <text class="t-lbl" x="500" y="61">NO ROUTE</text>
    <text class="t-x" x="500" y="79">✕ the task fails</text>
    <text class="t-s" x="500" y="94">license-auditor has no route</text>
    <rect class="dead" x="712" y="44" width="200" height="58" rx="5"/>
    <text class="t-lbl" x="724" y="61">THE HIRE · AGENT KIND</text>
    <text class="t-x" x="724" y="79">✕ takes no tasks</text>
    <text class="t-s" x="724" y="94">no task door at all</text>
    <text class="t-s" x="28" y="132">Registered and addressable, and no list can send it work, and it could not take any.</text>
  </g>
  <g id="after">
    <rect class="lane" x="12" y="166" width="916" height="152" rx="6"/>
    <text class="t-lane" x="28" y="186">AFTER</text>
    <rect class="n-box" x="28" y="198" width="170" height="58" rx="5"/>
    <text class="t-lbl" x="40" y="215">TASK</text>
    <text class="t-b" x="40" y="233">for: license-auditor</text>
    <text class="t-s" x="40" y="248">the same task, any list</text>
    <line class="arr" x1="198" y1="227" x2="222" y2="227"/><path class="arr-h" d="M221,223 L228,227 L221,231 Z"/>
    <rect class="n-box" x="228" y="198" width="230" height="58" rx="5"/>
    <text class="t-lbl" x="240" y="215">THE TASK LIST</text>
    <text class="t-b" x="240" y="233">its own names, else ask</text>
    <text class="t-s" x="240" y="248">asks at hand-over</text>
    <line class="arr" x1="458" y1="227" x2="482" y2="227"/><path class="arr-h" d="M481,223 L488,227 L481,231 Z"/>
    <rect class="new" x="488" y="198" width="200" height="58" rx="5"/>
    <text class="t-lbl" x="500" y="215">WORKFORCE LOOKUP</text>
    <text class="t-b" x="500" y="233">license-auditor → its flow</text>
    <text class="t-s" x="500" y="248">this org, or this member's own</text>
    <line class="arr" x1="688" y1="227" x2="706" y2="227"/><path class="arr-h" d="M705,223 L712,227 L705,231 Z"/>
    <rect class="ok" x="712" y="198" width="200" height="58" rx="5"/>
    <text class="t-lbl" x="724" y="215">THE HIRE · AGENT KIND</text>
    <text class="t-v" x="724" y="233">✓ runs it as one turn</text>
    <text class="t-s" x="724" y="248">claim checked on this list</text>
    <text class="t-s" x="28" y="286">A list's own names still win (DevTeam's coder). A name nobody has is refused when the task is filed.</text>
    <text class="t-s" x="28" y="302">Core and the board ask "which flow?" and "which list?". Workforce answers both.</text>
  </g>
</svg>
