<svg viewBox="0 0 940 340" role="img" aria-label="What changes. Today a coordinator files a task on a mailbox list from a person's conversation; a worker runs it and the task ends completed, failed or parked on the list, and nobody tells the coordinator, so the person hears nothing. After: the list records who filed the task and from which conversation; when the task completes, fails for good or parks, the list's settle hook wakes the coordinator in that conversation with the task and how it ended, and the coordinator can tell the person, reassign the task or cancel it."
     xmlns="http://www.w3.org/2000/svg">
  <style>
    :root { --surface:#FCFCFA; --surface-2:#E8E8E1; --ink:#191C21; --ink-2:#4C535B; --ink-3:#7A828B;
            --rule:#D5D4CB; --accent:#3E4E8C; --accent-soft:#E0E3F0; --code:#2C7C69; --code-soft:#DCEDE7;
            --gone:#A9544F; }
    @media (prefers-color-scheme: dark) {
      :root { --surface:#181C1F; --surface-2:#202528; --ink:#E6E8E5; --ink-2:#A4ACB1; --ink-3:#737B81;
              --rule:#2B3135; --accent:#8B9BD8; --accent-soft:#1B2140; --code:#5DBBA1; --code-soft:#14302A;
              --gone:#DE8A84; } }
    .bg { fill:var(--surface); }
    .lane { fill:var(--surface-2); }
    .n-box { fill:var(--surface); stroke:var(--rule); stroke-width:1.2; }
    .ok { fill:var(--code-soft); stroke:var(--code); stroke-width:1.6; }
    .dead { fill:var(--surface); stroke:var(--gone); stroke-width:1.4; stroke-dasharray:5 4; }
    .arr { stroke:var(--ink-3); stroke-width:1.4; }
    .arr-h { fill:var(--ink-3); }
    .t-lbl { fill:var(--ink-3); font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:9.5px; letter-spacing:.1em; }
    .t-lane { fill:var(--ink-2); font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:10px; letter-spacing:.12em; font-weight:600; }
    .t-b { fill:var(--ink); font-family:system-ui,-apple-system,sans-serif; font-weight:600; font-size:12.5px; }
    .t-s { fill:var(--ink-2); font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:9.5px; }
    .t-x { fill:var(--gone); font-family:system-ui,-apple-system,sans-serif; font-weight:700; font-size:12px; }
    .t-v { fill:var(--code); font-family:system-ui,-apple-system,sans-serif; font-weight:700; font-size:12px; }
  </style>
  <rect class="bg" x="0" y="0" width="940" height="340"/>
  <g id="today">
    <rect class="lane" x="12" y="12" width="916" height="106" rx="6"/>
    <text class="t-lane" x="28" y="32">TODAY</text>
    <rect class="n-box" x="28" y="44" width="200" height="58" rx="5"/>
    <text class="t-lbl" x="40" y="61">COORDINATOR</text>
    <text class="t-b" x="40" y="79">files a task</text>
    <text class="t-s" x="40" y="94">in the person's conversation</text>
    <line class="arr" x1="228" y1="73" x2="250" y2="73"/><path class="arr-h" d="M249,69 L256,73 L249,77 Z"/>
    <rect class="n-box" x="256" y="44" width="200" height="58" rx="5"/>
    <text class="t-lbl" x="268" y="61">MAILBOX LIST</text>
    <text class="t-b" x="268" y="79">a worker runs it</text>
    <text class="t-s" x="268" y="94">FIX-1777, FIX-1778</text>
    <line class="arr" x1="456" y1="73" x2="478" y2="73"/><path class="arr-h" d="M477,69 L484,73 L477,77 Z"/>
    <rect class="dead" x="484" y="44" width="220" height="58" rx="5"/>
    <text class="t-lbl" x="496" y="61">TASK ENDS</text>
    <text class="t-b" x="496" y="79">completed, errored, parked</text>
    <text class="t-s" x="496" y="94">only on the list</text>
    <text class="t-x" x="722" y="78">✕ nobody tells the filer</text>
  </g>
  <g id="after">
    <rect class="lane" x="12" y="130" width="916" height="198" rx="6"/>
    <text class="t-lane" x="28" y="150">AFTER</text>
    <rect class="n-box" x="28" y="162" width="200" height="58" rx="5"/>
    <text class="t-lbl" x="40" y="179">COORDINATOR</text>
    <text class="t-b" x="40" y="197">files a task</text>
    <text class="t-s" x="40" y="212">in the person's conversation</text>
    <line class="arr" x1="228" y1="191" x2="250" y2="191"/><path class="arr-h" d="M249,187 L256,191 L249,195 Z"/>
    <rect class="ok" x="256" y="162" width="200" height="58" rx="5"/>
    <text class="t-lbl" x="268" y="179">MAILBOX LIST</text>
    <text class="t-b" x="268" y="197">records who filed it</text>
    <text class="t-s" x="268" y="212">and where from; a worker runs it</text>
    <line class="arr" x1="456" y1="191" x2="478" y2="191"/><path class="arr-h" d="M477,187 L484,191 L477,195 Z"/>
    <rect class="ok" x="484" y="162" width="220" height="58" rx="5"/>
    <text class="t-lbl" x="496" y="179">TASK ENDS</text>
    <text class="t-b" x="496" y="197">the list's settle hook runs</text>
    <text class="t-s" x="496" y="212">completed, errored, parked</text>
    <path class="arr" fill="none" d="M594,220 L594,262 L128,262 L128,226"/><path class="arr-h" d="M124,227 L128,220 L132,227 Z"/>
    <text class="t-s" x="300" y="256">onTaskSettled · into the conversation it filed from</text>
    <text class="t-v" x="722" y="196">✓ the filer is woken</text>
    <text class="t-s" x="722" y="212">tells the person,</text>
    <text class="t-s" x="722" y="226">reassignTask or cancelTask</text>
    <text class="t-s" x="28" y="300">A task a person files by hand records no filer, and wakes nobody.</text>
  </g>
</svg>
