<svg viewBox="0 0 940 420" role="img" aria-label="D1, where a mailbox's members go so a short listing can't miss them. Chosen: facts on the entry, returned at every detail level. Instead of: dropping the short listing so the contract always comes back, or writing members into the purpose line. Decides it: a reader can rely on the data without parsing; facts is an array on every call, the other two are sentences. Second row: a short listing of skills and resources stays cheap with facts and with the purpose line, and pays every advice line if the short listing is dropped. Price: the shared entry shape grows a field any source could stuff, where the other two leave it unchanged. Locks in: data a model must not miss goes in facts, for every domain. Flips if: a source needs large or nested data there."
     xmlns="http://www.w3.org/2000/svg">
  <style>
    :root { --surface:#FCFCFA; --surface-2:#E8E8E1; --ink:#191C21; --ink-2:#4C535B; --ink-3:#7A828B;
            --rule:#D5D4CB; --accent:#3E4E8C; --accent-soft:#E0E3F0; --code:#2C7C69; --code-soft:#DCEDE7;
            --gone:#A9544F; }
    @media (prefers-color-scheme: dark) {
      :root { --surface:#181C1F; --surface-2:#202528; --ink:#E6E8E5; --ink-2:#A4ACB1; --ink-3:#737B81;
              --rule:#2B3135; --accent:#8B9BD8; --accent-soft:#1B2140; --code:#5DBBA1; --code-soft:#14302A;
              --gone:#DE8A84; } }
    .bg     { fill:var(--surface); }
    .ask    { fill:var(--surface-2); }
    .chosen { fill:var(--code-soft); stroke:var(--code); stroke-width:1.6; }
    .lost   { fill:var(--surface); stroke:var(--rule); stroke-width:1.4; stroke-dasharray:5 4; }
    .decide { fill:var(--accent-soft); }
    .bar    { fill:var(--accent); }
    .row    { stroke:var(--rule); stroke-width:1; }
    .foot   { fill:var(--surface-2); }
    .t-lbl  { fill:var(--ink-3); font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:9.5px; letter-spacing:.1em; }
    .t-tag  { font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:9.5px; letter-spacing:.1em; font-weight:600; }
    .t-q    { fill:var(--ink); font-family:system-ui,-apple-system,sans-serif; font-weight:600; font-size:15px; }
    .t-h    { font-family:system-ui,-apple-system,sans-serif; font-weight:600; font-size:14px; }
    .t-b    { fill:var(--ink); font-family:system-ui,-apple-system,sans-serif; font-size:12.5px; }
    .t-s    { fill:var(--ink-2); font-family:system-ui,-apple-system,sans-serif; font-size:11px; }
    .mark   { font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:16px; font-weight:700; }
    .plus   { fill:var(--code); }
    .minus  { fill:var(--gone); }
    .tie    { fill:var(--ink-3); }
    .c-code { fill:var(--code); }
    .c-mute { fill:var(--ink-3); }
    .c-lost { fill:var(--ink-2); }
    .c-acc  { fill:var(--accent); }
  </style>
  <rect class="bg" x="0" y="0" width="940" height="420"/>
  <g id="the-call">
    <rect class="ask" x="16" y="14" width="908" height="48" rx="6"/>
    <text class="t-lbl" x="32" y="32">D1 · THE CALL</text>
    <text class="t-q" x="32" y="52">Where do a mailbox's members go, so a short listing can't miss them?</text>
  </g>
  <g id="options">
    <rect class="chosen" x="212" y="76" width="224" height="46" rx="5"/>
    <text class="t-tag c-code" x="228" y="93">CHOSEN</text>
    <text class="t-h c-code" x="228" y="112">facts, every call</text>
    <rect class="lost" x="452" y="76" width="224" height="46" rx="5"/>
    <text class="t-tag c-mute" x="468" y="93">INSTEAD OF</text>
    <text class="t-h c-lost" x="468" y="112">Drop the short listing</text>
    <rect class="lost" x="692" y="76" width="232" height="46" rx="5"/>
    <text class="t-tag c-mute" x="708" y="93">INSTEAD OF</text>
    <text class="t-h c-lost" x="708" y="112">Members in purpose</text>
  </g>
  <g id="row-1">
    <rect class="decide" x="16" y="134" width="908" height="62" rx="4"/>
    <rect class="bar" x="16" y="134" width="4" height="62"/>
    <text class="t-lbl" x="32" y="156">A READER CAN RELY</text>
    <text class="t-lbl" x="32" y="169">ON IT, NO PARSING</text>
    <text class="t-tag c-acc" x="32" y="186">▸ DECIDES IT</text>
    <text class="mark plus" x="228" y="162">+</text>
    <text class="t-b" x="246" y="161">An array, every call</text>
    <text class="t-s" x="246" y="179">members, workerKind</text>
    <text class="mark minus" x="468" y="162">−</text>
    <text class="t-b" x="486" y="161">A sentence, every call</text>
    <text class="t-s" x="486" y="179">“4 members: eng.em, …”</text>
    <text class="mark minus" x="708" y="162">−</text>
    <text class="t-b" x="726" y="161">A sentence in purpose</text>
    <text class="t-s" x="726" y="179">the line agents choose on</text>
  </g>
  <g id="row-2">
    <text class="t-lbl" x="32" y="224">SHORT LISTING OF</text>
    <text class="t-lbl" x="32" y="237">SKILLS, RESOURCES</text>
    <text class="mark plus" x="228" y="230">+</text>
    <text class="t-b" x="246" y="229">Unchanged</text>
    <text class="t-s" x="246" y="247">only data a source sets</text>
    <text class="mark minus" x="468" y="230">−</text>
    <text class="t-b" x="486" y="229">Pays every advice line</text>
    <text class="t-s" x="486" y="247">what thin exists to avoid</text>
    <text class="mark plus" x="708" y="230">+</text>
    <text class="t-b" x="726" y="229">Unchanged</text>
    <text class="t-s" x="726" y="247">no other domain touched</text>
    <line class="row" x1="16" y1="260" x2="924" y2="260"/>
  </g>
  <g id="row-3">
    <text class="t-lbl" x="32" y="282">THE SHARED</text>
    <text class="t-lbl" x="32" y="295">ENTRY SHAPE</text>
    <text class="mark minus" x="228" y="288">−</text>
    <text class="t-b" x="246" y="287">Grows one field</text>
    <text class="t-s" x="246" y="305">any source could stuff it</text>
    <text class="mark tie" x="468" y="288">=</text>
    <text class="t-b" x="486" y="287">Unchanged</text>
    <text class="t-s" x="486" y="305">detail goes dead</text>
    <text class="mark plus" x="708" y="288">+</text>
    <text class="t-b" x="726" y="287">Unchanged</text>
    <text class="t-s" x="726" y="305">a Workforce-only fix</text>
    <line class="row" x1="16" y1="318" x2="924" y2="318"/>
  </g>
  <g id="locks-in">
    <rect class="foot" x="16" y="334" width="446" height="74" rx="5"/>
    <text class="t-lbl" x="32" y="355">LOCKS IN</text>
    <text class="t-b" x="32" y="375">Data a model must not miss goes in facts</text>
    <text class="t-s" x="32" y="393">for every domain, and the door always returns it</text>
  </g>
  <g id="flips-if">
    <rect class="foot" x="478" y="334" width="446" height="74" rx="5"/>
    <text class="t-lbl" x="494" y="355">FLIPS IF</text>
    <text class="t-b" x="494" y="375">A source needs large or nested data there</text>
    <text class="t-s" x="494" y="393">then it is a resource to read by uri</text>
  </g>
</svg>
