<svg viewBox="0 0 940 418" role="img" xmlns="http://www.w3.org/2000/svg"
     aria-label="D3, formerly Q1: when a user forks a standard worker, does the fork copy its shared instructions or follow them? Chosen: a copy. Instead of: follow the standard worker. The row that decides it, what changes under the owner: a copy changes only when its owner edits it, the library&#x27;s rule, against every fork changing when the installation&#x27;s files do. Second row, after the standard improves: a copy is stale until re-forked, against picked up at once with edits kept on top. Third row, how a turn reads it: one configuration, against the file plus the user&#x27;s changes merged each turn. Locks in one rule for every copy a user holds; following can come later as an opt-in. Flips if users fork to change one setting while the core changes every week.">
  <style>
    :root { --surface:#FCFCFA; --surface-2:#E8E8E1; --ink:#191C21; --ink-2:#4C535B; --ink-3:#7A828B;
            --rule:#D5D4CB; --accent:#3E4E8C; --accent-soft:#E0E3F0; --code:#2C7C69; --code-soft:#DCEDE7;
            --prose:#A8761C; --prose-soft:#F3E8D2; --gone:#A9544F; }
    @media (prefers-color-scheme: dark) {
      :root { --surface:#181C1F; --surface-2:#202528; --ink:#E6E8E5; --ink-2:#A4ACB1; --ink-3:#737B81;
              --rule:#2B3135; --accent:#8B9BD8; --accent-soft:#1B2140; --code:#5DBBA1; --code-soft:#14302A;
              --prose:#D9A44B; --prose-soft:#332612; --gone:#DE8A84; } }
    .bg     { fill:var(--surface); }
    .ask    { fill:var(--surface-2); }
    .chosen { fill:var(--code-soft); stroke:var(--code); stroke-width:1.6; }
    .lost   { fill:var(--surface); stroke:var(--rule); stroke-width:1.4; stroke-dasharray:5 4; }
    .decide { fill:var(--accent-soft); }
    .bar    { fill:var(--accent); }
    .row    { stroke:var(--rule); stroke-width:1; }
    .foot   { fill:var(--surface-2); }
    .t-lbl  { fill:var(--ink-3); font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:9.5px; letter-spacing:.1em; }
    .t-tag  { font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:9.5px; letter-spacing:.1em; font-weight:600; }
    .t-q    { fill:var(--ink); font-family:system-ui,-apple-system,sans-serif; font-weight:600; font-size:15px; }
    .t-h    { font-family:system-ui,-apple-system,sans-serif; font-weight:600; font-size:14px; }
    .t-b    { fill:var(--ink); font-family:system-ui,-apple-system,sans-serif; font-size:12.5px; }
    .t-s    { fill:var(--ink-2); font-family:system-ui,-apple-system,sans-serif; font-size:11px; }
    .mark   { font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:16px; font-weight:700; }
    .plus   { fill:var(--code); }
    .minus  { fill:var(--gone); }
    .tie    { fill:var(--ink-3); }
    .c-code { fill:var(--code); }
    .c-mute { fill:var(--ink-3); }
    .c-lost { fill:var(--ink-2); }
    .c-acc  { fill:var(--accent); }
  </style>
  <rect class="bg" x="0" y="0" width="940" height="418"/>
  <g id="the-call">
    <rect class="ask" x="16" y="14" width="908" height="48" rx="6"/>
    <text class="t-lbl" x="32" y="32">D3 · THE CALL · FORMERLY Q1</text>
    <text class="t-q" x="32" y="52">When a user forks a standard worker, does the fork copy its instructions or follow them?</text>
  </g>
  <g id="options">
    <rect class="chosen" x="212" y="76" width="348" height="46" rx="5"/>
    <text class="t-tag c-code" x="228" y="93">CHOSEN</text>
    <text class="t-h c-code" x="228" y="112">A copy</text>
    <rect class="lost" x="576" y="76" width="348" height="46" rx="5"/>
    <text class="t-tag c-mute" x="592" y="93">INSTEAD OF</text>
    <text class="t-h c-lost" x="592" y="112">Follow the standard worker</text>
  </g>
  <g id="row-1">
    <rect class="decide" x="16" y="134" width="908" height="62" rx="4"/>
    <rect class="bar" x="16" y="134" width="4" height="62"/>
    <text class="t-lbl" x="32" y="156">WHAT CHANGES</text>
    <text class="t-lbl" x="32" y="169">UNDER THE OWNER</text>
    <text class="t-tag c-acc" x="32" y="186">▸ DECIDES IT</text>
    <text class="mark plus" x="228" y="162">+</text>
    <text class="t-b" x="248" y="161">Nothing they didn&#x27;t edit</text>
    <text class="t-s" x="248" y="179">the library&#x27;s rule</text>
    <text class="mark minus" x="592" y="162">−</text>
    <text class="t-b" x="612" y="161">Every fork, on a file edit</text>
    <text class="t-s" x="612" y="179">with the forker&#x27;s access</text>
  </g>
  <g id="row-2">
    <text class="t-lbl" x="32" y="218">AFTER THE STANDARD</text>
    <text class="t-lbl" x="32" y="231">IMPROVES</text>
    <text class="mark minus" x="228" y="224">−</text>
    <text class="t-b" x="248" y="223">Stale until re-forked</text>
    <text class="t-s" x="248" y="241">the owner forks again</text>
    <text class="mark plus" x="592" y="224">+</text>
    <text class="t-b" x="612" y="223">Picked up at once</text>
    <text class="t-s" x="612" y="241">edits kept on top</text>
    <line class="row" x1="16" y1="254" x2="924" y2="254"/>
  </g>
  <g id="row-3">
    <text class="t-lbl" x="32" y="276">HOW A TURN</text>
    <text class="t-lbl" x="32" y="289">READS IT</text>
    <text class="mark plus" x="228" y="282">+</text>
    <text class="t-b" x="248" y="281">One configuration</text>
    <text class="t-s" x="248" y="299">the row</text>
    <text class="mark minus" x="592" y="282">−</text>
    <text class="t-b" x="612" y="281">The file plus the user&#x27;s changes</text>
    <text class="t-s" x="612" y="299">merged each turn</text>
    <line class="row" x1="16" y1="312" x2="924" y2="312"/>
  </g>
  <g id="locks-in">
    <rect class="foot" x="16" y="328" width="446" height="74" rx="5"/>
    <text class="t-lbl" x="32" y="349">LOCKS IN</text>
    <text class="t-b" x="32" y="369">One rule for every copy a user holds</text>
    <text class="t-s" x="32" y="387">following can come later, as an opt-in</text>
  </g>
  <g id="flips-if">
    <rect class="foot" x="478" y="328" width="446" height="74" rx="5"/>
    <text class="t-lbl" x="494" y="349">FLIPS IF</text>
    <text class="t-b" x="494" y="369">Users fork to change one setting</text>
    <text class="t-s" x="494" y="387">while the core changes every week</text>
  </g>
</svg>
