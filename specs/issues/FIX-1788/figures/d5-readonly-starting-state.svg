<svg viewBox="0 0 940 418" role="img" xmlns="http://www.w3.org/2000/svg"
     aria-label="D5, the call: what binds a session to its worker, a readonly field of its starting state or a separate server-only link? Chosen: a readonly field of the starting state. Instead of: a server-only field on the session record. The row that decides it, names to learn: one, session state, the same field any flow can bind by, against two, state and a link, with a worker option on create and list. Second row, where it is checked, a tie: at create, by the flow's create check, either way. Third row, what the engine carries: a readonly guard, a store-level filter and a binding refusal, against one field written once. Locks in workerId readonly on every worker flow, named in the create's state and listed by it. Flips if a binding must stay hidden from the flow's own blocks.">
  <style>
    :root { --surface:#FCFCFA; --surface-2:#E8E8E1; --ink:#191C21; --ink-2:#4C535B; --ink-3:#7A828B;
            --rule:#D5D4CB; --accent:#3E4E8C; --accent-soft:#E0E3F0; --code:#2C7C69; --code-soft:#DCEDE7;
            --prose:#A8761C; --prose-soft:#F3E8D2; --gone:#A9544F; }
    @media (prefers-color-scheme: dark) {
      :root { --surface:#181C1F; --surface-2:#202528; --ink:#E6E8E5; --ink-2:#A4ACB1; --ink-3:#737B81;
              --rule:#2B3135; --accent:#8B9BD8; --accent-soft:#1B2140; --code:#5DBBA1; --code-soft:#14302A;
              --prose:#D9A44B; --prose-soft:#332612; --gone:#DE8A84; } }
    .bg     { fill:var(--surface); }
    .ask    { fill:var(--surface-2); }
    .chosen { fill:var(--code-soft); stroke:var(--code); stroke-width:1.6; }
    .lost   { fill:var(--surface); stroke:var(--rule); stroke-width:1.4; stroke-dasharray:5 4; }
    .decide { fill:var(--accent-soft); }
    .bar    { fill:var(--accent); }
    .row    { stroke:var(--rule); stroke-width:1; }
    .foot   { fill:var(--surface-2); }
    .t-lbl  { fill:var(--ink-3); font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:9.5px; letter-spacing:.1em; }
    .t-tag  { font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:9.5px; letter-spacing:.1em; font-weight:600; }
    .t-q    { fill:var(--ink); font-family:system-ui,-apple-system,sans-serif; font-weight:600; font-size:15px; }
    .t-h    { font-family:system-ui,-apple-system,sans-serif; font-weight:600; font-size:14px; }
    .t-b    { fill:var(--ink); font-family:system-ui,-apple-system,sans-serif; font-size:12.5px; }
    .t-s    { fill:var(--ink-2); font-family:system-ui,-apple-system,sans-serif; font-size:11px; }
    .mark   { font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:16px; font-weight:700; }
    .plus   { fill:var(--code); }
    .minus  { fill:var(--gone); }
    .tie    { fill:var(--ink-3); }
    .c-code { fill:var(--code); }
    .c-mute { fill:var(--ink-3); }
    .c-lost { fill:var(--ink-2); }
    .c-acc  { fill:var(--accent); }
  </style>
  <rect class="bg" x="0" y="0" width="940" height="418"/>
  <g id="the-call">
    <rect class="ask" x="16" y="14" width="908" height="48" rx="6"/>
    <text class="t-lbl" x="32" y="32">D5 · THE CALL</text>
    <text class="t-q" x="32" y="52">What binds a session to its worker: its starting state, or a separate link?</text>
  </g>
  <g id="options">
    <rect class="chosen" x="212" y="76" width="348" height="46" rx="5"/>
    <text class="t-tag c-code" x="228" y="93">CHOSEN</text>
    <text class="t-h c-code" x="228" y="112">A readonly field of its starting state</text>
    <rect class="lost" x="576" y="76" width="348" height="46" rx="5"/>
    <text class="t-tag c-mute" x="592" y="93">INSTEAD OF</text>
    <text class="t-h c-lost" x="592" y="112">A server-only field beside the state</text>
  </g>
  <g id="row-1">
    <rect class="decide" x="16" y="134" width="908" height="62" rx="4"/>
    <rect class="bar" x="16" y="134" width="4" height="62"/>
    <text class="t-lbl" x="32" y="156">NAMES TO</text>
    <text class="t-lbl" x="32" y="169">LEARN</text>
    <text class="t-tag c-acc" x="32" y="186">▸ DECIDES IT</text>
    <text class="mark plus" x="228" y="162">+</text>
    <text class="t-b" x="248" y="161">One: session state</text>
    <text class="t-s" x="248" y="179">the same field any flow can bind by</text>
    <text class="mark minus" x="592" y="162">−</text>
    <text class="t-b" x="612" y="161">Two: state and a link</text>
    <text class="t-s" x="612" y="179">a worker option on create and list</text>
  </g>
  <g id="row-2">
    <text class="t-lbl" x="32" y="218">WHERE IT IS</text>
    <text class="t-lbl" x="32" y="231">CHECKED</text>
    <text class="mark tie" x="228" y="224">=</text>
    <text class="t-b" x="248" y="223">At create</text>
    <text class="t-s" x="248" y="241">by the flow's create check</text>
    <text class="mark tie" x="592" y="224">=</text>
    <text class="t-b" x="612" y="223">At create</text>
    <text class="t-s" x="612" y="241">by the same check</text>
    <line class="row" x1="16" y1="254" x2="924" y2="254"/>
  </g>
  <g id="row-3">
    <text class="t-lbl" x="32" y="276">WHAT THE</text>
    <text class="t-lbl" x="32" y="289">ENGINE CARRIES</text>
    <text class="mark minus" x="228" y="282">−</text>
    <text class="t-b" x="248" y="281">A guard, a filter, a refusal</text>
    <text class="t-s" x="248" y="299">readonly writes, store listing, binding schema</text>
    <text class="mark plus" x="592" y="282">+</text>
    <text class="t-b" x="612" y="281">One field on the record</text>
    <text class="t-s" x="612" y="299">written once, never again</text>
    <line class="row" x1="16" y1="312" x2="924" y2="312"/>
  </g>
  <g id="locks-in">
    <rect class="foot" x="16" y="328" width="446" height="74" rx="5"/>
    <text class="t-lbl" x="32" y="349">LOCKS IN</text>
    <text class="t-b" x="32" y="369">workerId, readonly, on every worker flow</text>
    <text class="t-s" x="32" y="387">named in the create's state; listed by it</text>
  </g>
  <g id="flips-if">
    <rect class="foot" x="478" y="328" width="446" height="74" rx="5"/>
    <text class="t-lbl" x="494" y="349">FLIPS IF</text>
    <text class="t-b" x="494" y="369">A binding must stay hidden</text>
    <text class="t-s" x="494" y="387">from the flow's own blocks</text>
  </g>
</svg>
