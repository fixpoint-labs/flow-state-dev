<svg viewBox="0 0 940 418" role="img" xmlns="http://www.w3.org/2000/svg"
     aria-label="D6, the call: on a custom worker flow, who keeps one user's workers apart? Chosen: the flow's author. Instead of: refusing at hire a flow that keeps data per user, or the engine partitioning every flow-isolated resource by worker. The row that decides it, what it costs to build: a docs section, against a check that reads a flow's declarations and repeats FIX-1789's holes, against an engine change beyond the epic's six. Second row, two of Alice's workers: they share what the flow stores for her unless its author keys it, against kept apart where the check can see, against kept apart always. Third row, another user, a tie: never reached, all three. Locks in BR-23 on the built-in worker flows and a docs section for custom ones. Flips if one user's workers must never mix and authors won't key it themselves.">
  <style>
    :root { --surface:#FCFCFA; --surface-2:#E8E8E1; --ink:#191C21; --ink-2:#4C535B; --ink-3:#7A828B;
            --rule:#D5D4CB; --accent:#3E4E8C; --accent-soft:#E0E3F0; --code:#2C7C69; --code-soft:#DCEDE7;
            --prose:#A8761C; --prose-soft:#F3E8D2; --gone:#A9544F; }
    @media (prefers-color-scheme: dark) {
      :root { --surface:#181C1F; --surface-2:#202528; --ink:#E6E8E5; --ink-2:#A4ACB1; --ink-3:#737B81;
              --rule:#2B3135; --accent:#8B9BD8; --accent-soft:#1B2140; --code:#5DBBA1; --code-soft:#14302A;
              --prose:#D9A44B; --prose-soft:#332612; --gone:#DE8A84; } }
    .bg     { fill:var(--surface); }
    .ask    { fill:var(--surface-2); }
    .chosen { fill:var(--code-soft); stroke:var(--code); stroke-width:1.6; }
    .lost   { fill:var(--surface); stroke:var(--rule); stroke-width:1.4; stroke-dasharray:5 4; }
    .decide { fill:var(--accent-soft); }
    .bar    { fill:var(--accent); }
    .row    { stroke:var(--rule); stroke-width:1; }
    .foot   { fill:var(--surface-2); }
    .t-lbl  { fill:var(--ink-3); font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:9.5px; letter-spacing:.1em; }
    .t-tag  { font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:9.5px; letter-spacing:.1em; font-weight:600; }
    .t-q    { fill:var(--ink); font-family:system-ui,-apple-system,sans-serif; font-weight:600; font-size:15px; }
    .t-h    { font-family:system-ui,-apple-system,sans-serif; font-weight:600; font-size:14px; }
    .t-b    { fill:var(--ink); font-family:system-ui,-apple-system,sans-serif; font-size:12.5px; }
    .t-s    { fill:var(--ink-2); font-family:system-ui,-apple-system,sans-serif; font-size:11px; }
    .mark   { font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:16px; font-weight:700; }
    .plus   { fill:var(--code); }
    .minus  { fill:var(--gone); }
    .tie    { fill:var(--ink-3); }
    .c-code { fill:var(--code); }
    .c-mute { fill:var(--ink-3); }
    .c-lost { fill:var(--ink-2); }
    .c-acc  { fill:var(--accent); }
  </style>
  <rect class="bg" x="0" y="0" width="940" height="418"/>
  <g id="the-call">
    <rect class="ask" x="16" y="14" width="908" height="48" rx="6"/>
    <text class="t-lbl" x="32" y="32">D6 · THE CALL</text>
    <text class="t-q" x="32" y="52">On a custom worker flow, who keeps one user's workers apart?</text>
  </g>
  <g id="options">
    <rect class="chosen" x="212" y="76" width="224" height="46" rx="5"/>
    <text class="t-tag c-code" x="228" y="93">CHOSEN · A</text>
    <text class="t-h c-code" x="228" y="112">The flow's author</text>
    <rect class="lost" x="452" y="76" width="224" height="46" rx="5"/>
    <text class="t-tag c-mute" x="468" y="93">INSTEAD OF · B</text>
    <text class="t-h c-lost" x="468" y="112">Refuse at hire</text>
    <rect class="lost" x="692" y="76" width="224" height="46" rx="5"/>
    <text class="t-tag c-mute" x="708" y="93">INSTEAD OF · C</text>
    <text class="t-h c-lost" x="708" y="112">The engine partitions</text>
  </g>
  <g id="row-1">
    <rect class="decide" x="16" y="134" width="908" height="62" rx="4"/>
    <rect class="bar" x="16" y="134" width="4" height="62"/>
    <text class="t-lbl" x="32" y="156">WHAT IT COSTS</text>
    <text class="t-lbl" x="32" y="169">TO BUILD</text>
    <text class="t-tag c-acc" x="32" y="186">▸ DECIDES IT</text>
    <text class="mark plus" x="228" y="162">+</text>
    <text class="t-b" x="246" y="161">A docs section</text>
    <text class="t-s" x="246" y="179">no new check</text>
    <text class="mark minus" x="468" y="162">−</text>
    <text class="t-b" x="486" y="161">A declarations check</text>
    <text class="t-s" x="486" y="179">FIX-1789's holes again</text>
    <text class="mark minus" x="708" y="162">−</text>
    <text class="t-b" x="726" y="161">An engine change</text>
    <text class="t-s" x="726" y="179">beyond the epic's six</text>
  </g>
  <g id="row-2">
    <text class="t-lbl" x="32" y="218">TWO OF ALICE'S</text>
    <text class="t-lbl" x="32" y="231">WORKERS</text>
    <text class="mark minus" x="228" y="224">−</text>
    <text class="t-b" x="246" y="223">Share what it stores</text>
    <text class="t-s" x="246" y="241">unless the author keys it</text>
    <text class="mark plus" x="468" y="224">+</text>
    <text class="t-b" x="486" y="223">Kept apart</text>
    <text class="t-s" x="486" y="241">where the check can see</text>
    <text class="mark plus" x="708" y="224">+</text>
    <text class="t-b" x="726" y="223">Kept apart</text>
    <text class="t-s" x="726" y="241">always</text>
    <line class="row" x1="16" y1="254" x2="924" y2="254"/>
  </g>
  <g id="row-3">
    <text class="t-lbl" x="32" y="276">ANOTHER</text>
    <text class="t-lbl" x="32" y="289">USER</text>
    <text class="mark tie" x="228" y="282">=</text>
    <text class="t-b" x="246" y="281">Never reached</text>
    <text class="t-s" x="246" y="299">keyed apart per user</text>
    <text class="mark tie" x="468" y="282">=</text>
    <text class="t-b" x="486" y="281">Never reached</text>
    <text class="t-s" x="486" y="299">the same</text>
    <text class="mark tie" x="708" y="282">=</text>
    <text class="t-b" x="726" y="281">Never reached</text>
    <text class="t-s" x="726" y="299">the same</text>
    <line class="row" x1="16" y1="312" x2="924" y2="312"/>
  </g>
  <g id="locks-in">
    <rect class="foot" x="16" y="328" width="446" height="74" rx="5"/>
    <text class="t-lbl" x="32" y="349">LOCKS IN</text>
    <text class="t-b" x="32" y="369">BR-23 on the built-in worker flows</text>
    <text class="t-s" x="32" y="387">a docs section for custom ones</text>
  </g>
  <g id="flips-if">
    <rect class="foot" x="478" y="328" width="446" height="74" rx="5"/>
    <text class="t-lbl" x="494" y="349">FLIPS IF</text>
    <text class="t-b" x="494" y="369">One user's workers must never mix</text>
    <text class="t-s" x="494" y="387">and authors won't key it themselves</text>
  </g>
</svg>
