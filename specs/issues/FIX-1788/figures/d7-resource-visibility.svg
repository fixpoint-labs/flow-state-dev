<svg viewBox="0 0 940 418" role="img" xmlns="http://www.w3.org/2000/svg"
     aria-label="D7, the call: on one shared copy, how does a worker's document grant hold for every tool? Chosen: a per-turn resource visibility rule in core. Instead of: B, Workforce's own document tools that check grants, or C, a copy per worker for workers that hold grants. The row that decides it, a grant on one shared copy: the rule holds for every tool, an app's own included, against Workforce's tools only, where an app tool built on core's document tools sees every document, against no shared copy at all, which contradicts S10, one copy per flow. Second row, what Layer 1 gains: a seventh mechanism change, an optional rule naming no worker, against nothing, against nothing. Third row, app code that reads a resource by reference: not filtered, the author's code as in D6, the same under B, and filtered under C, whose copy holds nothing else. Locks in: every model-facing listing and lookup in core honours the rule, and a hidden resource answers as a missing one. Flips if core can't honour it without knowing what a worker is.">
  <style>
    :root { --surface:#FCFCFA; --surface-2:#E8E8E1; --ink:#191C21; --ink-2:#4C535B; --ink-3:#7A828B;
            --rule:#D5D4CB; --accent:#3E4E8C; --accent-soft:#E0E3F0; --code:#2C7C69; --code-soft:#DCEDE7;
            --prose:#A8761C; --prose-soft:#F3E8D2; --gone:#A9544F; }
    @media (prefers-color-scheme: dark) {
      :root { --surface:#181C1F; --surface-2:#202528; --ink:#E6E8E5; --ink-2:#A4ACB1; --ink-3:#737B81;
              --rule:#2B3135; --accent:#8B9BD8; --accent-soft:#1B2140; --code:#5DBBA1; --code-soft:#14302A;
              --prose:#D9A44B; --prose-soft:#332612; --gone:#DE8A84; } }
    .bg     { fill:var(--surface); }
    .ask    { fill:var(--surface-2); }
    .chosen { fill:var(--code-soft); stroke:var(--code); stroke-width:1.6; }
    .lost   { fill:var(--surface); stroke:var(--rule); stroke-width:1.4; stroke-dasharray:5 4; }
    .decide { fill:var(--accent-soft); }
    .bar    { fill:var(--accent); }
    .row    { stroke:var(--rule); stroke-width:1; }
    .foot   { fill:var(--surface-2); }
    .t-lbl  { fill:var(--ink-3); font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:9.5px; letter-spacing:.1em; }
    .t-tag  { font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:9.5px; letter-spacing:.1em; font-weight:600; }
    .t-q    { fill:var(--ink); font-family:system-ui,-apple-system,sans-serif; font-weight:600; font-size:15px; }
    .t-h    { font-family:system-ui,-apple-system,sans-serif; font-weight:600; font-size:14px; }
    .t-b    { fill:var(--ink); font-family:system-ui,-apple-system,sans-serif; font-size:12.5px; }
    .t-s    { fill:var(--ink-2); font-family:system-ui,-apple-system,sans-serif; font-size:11px; }
    .mark   { font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:16px; font-weight:700; }
    .plus   { fill:var(--code); }
    .minus  { fill:var(--gone); }
    .tie    { fill:var(--ink-3); }
    .c-code { fill:var(--code); }
    .c-mute { fill:var(--ink-3); }
    .c-lost { fill:var(--ink-2); }
    .c-acc  { fill:var(--accent); }
  </style>
    <rect class="bg" x="0" y="0" width="940" height="418"/>
  <g id="the-call">
    <rect class="ask" x="16" y="14" width="908" height="48" rx="6"/>
    <text class="t-lbl" x="32" y="32">D7 · THE CALL</text>
    <text class="t-q" x="32" y="52">On one shared copy, how does a worker's document grant hold for every tool?</text>
  </g>
  <g id="options">
    <rect class="chosen" x="212" y="76" width="224" height="46" rx="5"/>
    <text class="t-tag c-code" x="228" y="93">CHOSEN · A</text>
    <text class="t-h c-code" x="228" y="112">A visibility rule in core</text>
    <rect class="lost" x="452" y="76" width="224" height="46" rx="5"/>
    <text class="t-tag c-mute" x="468" y="93">INSTEAD OF · B</text>
    <text class="t-h c-lost" x="468" y="112">Workforce's own tools</text>
    <rect class="lost" x="692" y="76" width="224" height="46" rx="5"/>
    <text class="t-tag c-mute" x="708" y="93">INSTEAD OF · C</text>
    <text class="t-h c-lost" x="708" y="112">A copy per worker</text>
  </g>
  <g id="row-1">
    <rect class="decide" x="16" y="134" width="908" height="62" rx="4"/>
    <rect class="bar" x="16" y="134" width="4" height="62"/>
    <text class="t-lbl" x="32" y="156">A GRANT, ON ONE</text>
    <text class="t-lbl" x="32" y="169">SHARED COPY</text>
    <text class="t-tag c-acc" x="32" y="186">▸ DECIDES IT</text>
    <text class="mark plus" x="228" y="162">+</text>
    <text class="t-b" x="246" y="161">Holds for every tool</text>
    <text class="t-s" x="246" y="179">an app's own included</text>
    <text class="mark minus" x="468" y="162">−</text>
    <text class="t-b" x="486" y="161">Workforce's tools only</text>
    <text class="t-s" x="486" y="179">an app tool sees every document</text>
    <text class="mark minus" x="708" y="162">−</text>
    <text class="t-b" x="726" y="161">No shared copy</text>
    <text class="t-s" x="726" y="179">contradicts S10, one per flow</text>
  </g>
  <g id="row-2">
    <text class="t-lbl" x="32" y="218">WHAT LAYER 1</text>
    <text class="t-lbl" x="32" y="231">GAINS</text>
    <text class="mark minus" x="228" y="224">−</text>
    <text class="t-b" x="246" y="223">A seventh mechanism</text>
    <text class="t-s" x="246" y="241">an optional rule, no worker named</text>
    <text class="mark plus" x="468" y="224">+</text>
    <text class="t-b" x="486" y="223">Nothing</text>
    <text class="t-s" x="486" y="241">the check stays in Workforce</text>
    <text class="mark plus" x="708" y="224">+</text>
    <text class="t-b" x="726" y="223">Nothing</text>
    <text class="t-s" x="726" y="241">today's narrowed map, kept</text>
    <line class="row" x1="16" y1="254" x2="924" y2="254"/>
  </g>
  <g id="row-3">
    <text class="t-lbl" x="32" y="276">APP CODE THAT</text>
    <text class="t-lbl" x="32" y="289">READS BY REFERENCE</text>
    <text class="mark minus" x="228" y="282">−</text>
    <text class="t-b" x="246" y="281">Not filtered</text>
    <text class="t-s" x="246" y="299">the author's code, as in D6</text>
    <text class="mark minus" x="468" y="282">−</text>
    <text class="t-b" x="486" y="281">Not filtered</text>
    <text class="t-s" x="486" y="299">the same</text>
    <text class="mark plus" x="708" y="282">+</text>
    <text class="t-b" x="726" y="281">Filtered</text>
    <text class="t-s" x="726" y="299">its copy holds nothing else</text>
    <line class="row" x1="16" y1="312" x2="924" y2="312"/>
  </g>
  <g id="locks-in">
    <rect class="foot" x="16" y="328" width="446" height="74" rx="5"/>
    <text class="t-lbl" x="32" y="349">LOCKS IN</text>
    <text class="t-b" x="32" y="369">Every model-facing lookup in core honours it</text>
    <text class="t-s" x="32" y="387">a hidden resource answers as a missing one</text>
  </g>
  <g id="flips-if">
    <rect class="foot" x="478" y="328" width="446" height="74" rx="5"/>
    <text class="t-lbl" x="494" y="349">FLIPS IF</text>
    <text class="t-b" x="494" y="369">Core can't honour it</text>
    <text class="t-s" x="494" y="387">without knowing what a worker is</text>
  </g>
</svg>
