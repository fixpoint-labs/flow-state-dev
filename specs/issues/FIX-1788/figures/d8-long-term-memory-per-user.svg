<svg viewBox="0 0 940 418" role="img" xmlns="http://www.w3.org/2000/svg"
     aria-label="D8, the call: on a built-in worker flow shared by one user&#x27;s workers, whose is long-term memory? Chosen: B, the user&#x27;s, shared by their workers. Instead of: A, each worker&#x27;s own. The row that decides it, what it costs to build: nothing new, long-term memory is already kept per user, against an eighth Layer 1 change, the memory package picking its store on every turn from the worker, in memory the epic leaves to FIX-1775. Second row, two of Alice&#x27;s workers: they keep their own skills and working memory and share what they remember, against remembering apart as well. Third row, another user, a tie: never reached, either way. Locks in BR-23 as per-worker skills and working memory, with long-term memory per user; FIX-1810 follows. Flips if one user&#x27;s workers must not share what they remember and authors need it built in.">
  <style>
    :root { --surface:#FCFCFA; --surface-2:#E8E8E1; --ink:#191C21; --ink-2:#4C535B; --ink-3:#7A828B;
            --rule:#D5D4CB; --accent:#3E4E8C; --accent-soft:#E0E3F0; --code:#2C7C69; --code-soft:#DCEDE7;
            --prose:#A8761C; --prose-soft:#F3E8D2; --gone:#A9544F; }
    @media (prefers-color-scheme: dark) {
      :root { --surface:#181C1F; --surface-2:#202528; --ink:#E6E8E5; --ink-2:#A4ACB1; --ink-3:#737B81;
              --rule:#2B3135; --accent:#8B9BD8; --accent-soft:#1B2140; --code:#5DBBA1; --code-soft:#14302A;
              --prose:#D9A44B; --prose-soft:#332612; --gone:#DE8A84; } }
    .bg     { fill:var(--surface); }
    .ask    { fill:var(--surface-2); }
    .chosen { fill:var(--code-soft); stroke:var(--code); stroke-width:1.6; }
    .lost   { fill:var(--surface); stroke:var(--rule); stroke-width:1.4; stroke-dasharray:5 4; }
    .decide { fill:var(--accent-soft); }
    .bar    { fill:var(--accent); }
    .row    { stroke:var(--rule); stroke-width:1; }
    .foot   { fill:var(--surface-2); }
    .t-lbl  { fill:var(--ink-3); font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:9.5px; letter-spacing:.1em; }
    .t-tag  { font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:9.5px; letter-spacing:.1em; font-weight:600; }
    .t-q    { fill:var(--ink); font-family:system-ui,-apple-system,sans-serif; font-weight:600; font-size:15px; }
    .t-h    { font-family:system-ui,-apple-system,sans-serif; font-weight:600; font-size:14px; }
    .t-b    { fill:var(--ink); font-family:system-ui,-apple-system,sans-serif; font-size:12.5px; }
    .t-s    { fill:var(--ink-2); font-family:system-ui,-apple-system,sans-serif; font-size:11px; }
    .mark   { font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:16px; font-weight:700; }
    .plus   { fill:var(--code); }
    .minus  { fill:var(--gone); }
    .tie    { fill:var(--ink-3); }
    .c-code { fill:var(--code); }
    .c-mute { fill:var(--ink-3); }
    .c-lost { fill:var(--ink-2); }
    .c-acc  { fill:var(--accent); }
  </style>
    <rect class="bg" x="0" y="0" width="940" height="418"/>
  <g id="the-call">
    <rect class="ask" x="16" y="14" width="908" height="48" rx="6"/>
    <text class="t-lbl" x="32" y="32">D8 · THE CALL</text>
    <text class="t-q" x="32" y="52">On a built-in worker flow, is long-term memory each worker&#x27;s, or the user&#x27;s?</text>
  </g>
  <g id="options">
    <rect class="chosen" x="212" y="76" width="348" height="46" rx="5"/>
    <text class="t-tag c-code" x="228" y="93">CHOSEN · B</text>
    <text class="t-h c-code" x="228" y="112">The user&#x27;s, shared by their workers</text>
    <rect class="lost" x="576" y="76" width="348" height="46" rx="5"/>
    <text class="t-tag c-mute" x="592" y="93">INSTEAD OF · A</text>
    <text class="t-h c-lost" x="592" y="112">Each worker&#x27;s own</text>
  </g>
  <g id="row-1">
    <rect class="decide" x="16" y="134" width="908" height="62" rx="4"/>
    <rect class="bar" x="16" y="134" width="4" height="62"/>
    <text class="t-lbl" x="32" y="156">WHAT IT COSTS</text>
    <text class="t-lbl" x="32" y="169">TO BUILD</text>
    <text class="t-tag c-acc" x="32" y="186">▸ DECIDES IT</text>
    <text class="mark plus" x="228" y="162">+</text>
    <text class="t-b" x="248" y="161">Nothing new</text>
    <text class="t-s" x="248" y="179">already kept per user</text>
    <text class="mark minus" x="592" y="162">−</text>
    <text class="t-b" x="612" y="161">An eighth Layer 1 change</text>
    <text class="t-s" x="612" y="179">memory picks its store per turn · FIX-1775&#x27;s area</text>
  </g>
  <g id="row-2">
    <text class="t-lbl" x="32" y="218">TWO OF ALICE&#x27;S</text>
    <text class="t-lbl" x="32" y="231">WORKERS</text>
    <text class="mark minus" x="228" y="224">−</text>
    <text class="t-b" x="248" y="223">Share what they remember</text>
    <text class="t-s" x="248" y="241">own skills and working memory</text>
    <text class="mark plus" x="592" y="224">+</text>
    <text class="t-b" x="612" y="223">Remember apart too</text>
    <text class="t-s" x="612" y="241">own skills and working memory</text>
    <line class="row" x1="16" y1="254" x2="924" y2="254"/>
  </g>
  <g id="row-3">
    <text class="t-lbl" x="32" y="276">ANOTHER</text>
    <text class="t-lbl" x="32" y="289">USER</text>
    <text class="mark tie" x="228" y="282">=</text>
    <text class="t-b" x="248" y="281">Never reached</text>
    <text class="t-s" x="248" y="299">kept per user and org</text>
    <text class="mark tie" x="592" y="282">=</text>
    <text class="t-b" x="612" y="281">Never reached</text>
    <text class="t-s" x="612" y="299">the same</text>
    <line class="row" x1="16" y1="312" x2="924" y2="312"/>
  </g>
  <g id="locks-in">
    <rect class="foot" x="16" y="328" width="446" height="74" rx="5"/>
    <text class="t-lbl" x="32" y="349">LOCKS IN</text>
    <text class="t-b" x="32" y="369">BR-23: own skills and working memory</text>
    <text class="t-s" x="32" y="387">long-term memory per user · FIX-1810 follows</text>
  </g>
  <g id="flips-if">
    <rect class="foot" x="478" y="328" width="446" height="74" rx="5"/>
    <text class="t-lbl" x="494" y="349">FLIPS IF</text>
    <text class="t-b" x="494" y="369">One user&#x27;s workers must not share</text>
    <text class="t-s" x="494" y="387">what they remember, such as one per client</text>
  </g>
</svg>
