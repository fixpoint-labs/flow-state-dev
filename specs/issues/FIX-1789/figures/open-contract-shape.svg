<svg viewBox="0 0 940 476" role="img" xmlns="http://www.w3.org/2000/svg"
     aria-label="Q1, open: where does an author say this flow runs workers? Recommended, a list the installation keeps; the alternative, which Jake leans to, a defineWorkerFlow wrapper. The row that decides it, who sets standard-only: under the list the installation sets it per entry and keeps it when agent is replaced; under the wrapper the flow's author sets it, so an installation can't keep its own policy. Second row, when a broken flow is refused: the list at boot, before any worker runs, with an exported check a library calls itself; the wrapper where the flow is written. Third row, authorities: the list keeps one, the schema's own refusal; the wrapper adds a mark and refuses a flow that meets every requirement without it. Fourth row, existing flows: both move agent's skills drawer; the wrapper also moves agent and every app flow onto a new export. Locks in: standard-only is installation policy, and a wrapper can be added later as sugar with no mark. Flips if standard-only is a property of the flow, the same in every installation.">
  <style>
    :root { --surface:#FCFCFA; --surface-2:#E8E8E1; --ink:#191C21; --ink-2:#4C535B; --ink-3:#7A828B;
            --rule:#D5D4CB; --accent:#3E4E8C; --accent-soft:#E0E3F0; --code:#2C7C69; --code-soft:#DCEDE7;
            --prose:#A8761C; --prose-soft:#F3E8D2; --gone:#A9544F; }
    @media (prefers-color-scheme: dark) {
      :root { --surface:#181C1F; --surface-2:#202528; --ink:#E6E8E5; --ink-2:#A4ACB1; --ink-3:#737B81;
              --rule:#2B3135; --accent:#8B9BD8; --accent-soft:#1B2140; --code:#5DBBA1; --code-soft:#14302A;
              --prose:#D9A44B; --prose-soft:#332612; --gone:#DE8A84; } }
    .bg     { fill:var(--surface); }
    .ask    { fill:var(--surface-2); }
    .rec    { fill:var(--code-soft); stroke:var(--code); stroke-width:1.6; stroke-dasharray:6 4; }
    .lost   { fill:var(--surface); stroke:var(--rule); stroke-width:1.4; stroke-dasharray:5 4; }
    .decide { fill:var(--accent-soft); }
    .bar    { fill:var(--accent); }
    .row    { stroke:var(--rule); stroke-width:1; }
    .foot   { fill:var(--surface-2); }
    .t-lbl  { fill:var(--ink-3); font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:9.5px; letter-spacing:.1em; }
    .t-tag  { font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:9.5px; letter-spacing:.1em; font-weight:600; }
    .t-q    { fill:var(--ink); font-family:system-ui,-apple-system,sans-serif; font-weight:600; font-size:15px; }
    .t-h    { font-family:system-ui,-apple-system,sans-serif; font-weight:600; font-size:14px; }
    .t-b    { fill:var(--ink); font-family:system-ui,-apple-system,sans-serif; font-size:12.5px; }
    .t-s    { fill:var(--ink-2); font-family:system-ui,-apple-system,sans-serif; font-size:11px; }
    .mark   { font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:16px; font-weight:700; }
    .plus   { fill:var(--code); }
    .minus  { fill:var(--gone); }
    .tie    { fill:var(--ink-3); }
    .c-code { fill:var(--code); }
    .c-mute { fill:var(--ink-3); }
    .c-lost { fill:var(--ink-2); }
    .c-acc  { fill:var(--accent); }
  </style>
  <rect class="bg" x="0" y="0" width="940" height="476"/>
  <g id="the-call">
    <rect class="ask" x="16" y="14" width="908" height="48" rx="6"/>
    <text class="t-lbl" x="32" y="32">Q1 · OPEN, ON A POC OF BOTH · THE CALL</text>
    <text class="t-q" x="32" y="52">Where does an author say “this flow runs workers”?</text>
  </g>
  <g id="options">
    <rect class="rec" x="212" y="76" width="348" height="46" rx="5"/>
    <text class="t-tag c-code" x="228" y="93">RECOMMENDED</text>
    <text class="t-h c-code" x="228" y="112">A list the installation keeps</text>
    <rect class="lost" x="576" y="76" width="348" height="46" rx="5"/>
    <text class="t-tag c-mute" x="592" y="93">THE ALTERNATIVE · JAKE LEANS HERE</text>
    <text class="t-h c-lost" x="592" y="112">A defineWorkerFlow() wrapper</text>
  </g>
  <g id="row-1">
    <rect class="decide" x="16" y="134" width="908" height="62" rx="4"/>
    <rect class="bar" x="16" y="134" width="4" height="62"/>
    <text class="t-lbl" x="32" y="156">WHO SETS</text>
    <text class="t-lbl" x="32" y="169">STANDARD-ONLY</text>
    <text class="t-tag c-acc" x="32" y="186">▸ DECIDES IT</text>
    <text class="mark plus" x="228" y="162">+</text>
    <text class="t-b" x="248" y="161">The installation, per entry</text>
    <text class="t-s" x="248" y="179">kept when agent is replaced (F3)</text>
    <text class="mark minus" x="592" y="162">−</text>
    <text class="t-b" x="612" y="161">The flow's author</text>
    <text class="t-s" x="612" y="179">an installation can't keep its own (F3, F4)</text>
  </g>
  <g id="row-2">
    <text class="t-lbl" x="32" y="218">WHEN A BROKEN</text>
    <text class="t-lbl" x="32" y="231">FLOW IS REFUSED</text>
    <text class="mark minus" x="228" y="224">−</text>
    <text class="t-b" x="248" y="223">At boot, before any worker runs</text>
    <text class="t-s" x="248" y="241">a library calls the exported check itself</text>
    <text class="mark plus" x="592" y="224">+</text>
    <text class="t-b" x="612" y="223">Where the flow is written</text>
    <text class="t-s" x="612" y="241">same refusals, earlier (T1)</text>
    <line class="row" x1="16" y1="254" x2="924" y2="254"/>
  </g>
  <g id="row-3">
    <text class="t-lbl" x="32" y="276">AUTHORITIES</text>
    <text class="t-lbl" x="32" y="289">OVER THE RULE</text>
    <text class="mark plus" x="228" y="282">+</text>
    <text class="t-b" x="248" y="281">One: the schema's own refusal</text>
    <text class="t-s" x="248" y="299">a hand-built flow is admitted (H1)</text>
    <text class="mark minus" x="592" y="282">−</text>
    <text class="t-b" x="612" y="281">Two: the schema and a mark</text>
    <text class="t-s" x="612" y="299">refuses a flow that meets every rule (H1)</text>
    <line class="row" x1="16" y1="312" x2="924" y2="312"/>
  </g>
  <g id="row-4">
    <text class="t-lbl" x="32" y="334">EXISTING FLOWS</text>
    <text class="mark tie" x="228" y="340">=</text>
    <text class="t-b" x="248" y="339">agent moves its skills drawer</text>
    <text class="t-s" x="248" y="357">needed under both (G1)</text>
    <text class="mark minus" x="592" y="340">−</text>
    <text class="t-b" x="612" y="339">That, and every flow moves</text>
    <text class="t-s" x="612" y="357">onto a new public export (G2)</text>
    <line class="row" x1="16" y1="370" x2="924" y2="370"/>
  </g>
  <g id="locks-in">
    <rect class="foot" x="16" y="386" width="446" height="74" rx="5"/>
    <text class="t-lbl" x="32" y="407">LOCKS IN</text>
    <text class="t-b" x="32" y="427">Standard-only is the installation's policy</text>
    <text class="t-s" x="32" y="445">a wrapper can come later as sugar, with no mark</text>
  </g>
  <g id="flips-if">
    <rect class="foot" x="478" y="386" width="446" height="74" rx="5"/>
    <text class="t-lbl" x="494" y="407">FLIPS IF</text>
    <text class="t-b" x="494" y="427">Standard-only is a property of the flow</text>
    <text class="t-s" x="494" y="445">the same in every installation that runs it</text>
  </g>
</svg>
