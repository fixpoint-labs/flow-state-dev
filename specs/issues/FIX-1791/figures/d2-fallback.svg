<svg viewBox="0 0 940 418" role="img" aria-label="D2, what takes a post best fit can&#x27;t place. Chosen: the fallback delegate if one is set, otherwise the coordinator&#x27;s own judgment turn, and the post is unplaced only if that turn fails. Instead of: leaving the post unplaced when no fallback delegate is set, the answer as first merged. It comes down to the first row: someone answers the post, where the other way leaves it unanswered until someone sets a fallback. The price is the second row: one judgment turn per miss with no fallback delegate, where the other way costs none. The third row is a tie: removing the fallback delegate works either way. Locks in: evaluator first, the coordinator&#x27;s judgment as the fallback, a configured fallback delegate still winning. Flips if: those judgment turns cost more than they answer."
     xmlns="http://www.w3.org/2000/svg">
  <style>
    :root { --surface:#FCFCFA; --surface-2:#E8E8E1; --ink:#191C21; --ink-2:#4C535B; --ink-3:#7A828B;
            --rule:#D5D4CB; --accent:#3E4E8C; --accent-soft:#E0E3F0; --code:#2C7C69; --code-soft:#DCEDE7;
            --gone:#A9544F; }
    @media (prefers-color-scheme: dark) {
      :root { --surface:#181C1F; --surface-2:#202528; --ink:#E6E8E5; --ink-2:#A4ACB1; --ink-3:#737B81;
              --rule:#2B3135; --accent:#8B9BD8; --accent-soft:#1B2140; --code:#5DBBA1; --code-soft:#14302A;
              --gone:#DE8A84; } }
    .bg     { fill:var(--surface); }
    .ask    { fill:var(--surface-2); }
    .chosen { fill:var(--code-soft); stroke:var(--code); stroke-width:1.6; }
    .rec    { fill:var(--code-soft); stroke:var(--code); stroke-width:1.6; stroke-dasharray:5 4; }
    .lost   { fill:var(--surface); stroke:var(--rule); stroke-width:1.4; stroke-dasharray:5 4; }
    .decide { fill:var(--accent-soft); }
    .bar    { fill:var(--accent); }
    .row    { stroke:var(--rule); stroke-width:1; }
    .foot   { fill:var(--surface-2); }
    .t-lbl  { fill:var(--ink-3); font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:9.5px; letter-spacing:.1em; }
    .t-tag  { font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:9.5px; letter-spacing:.1em; font-weight:600; }
    .t-q    { fill:var(--ink); font-family:system-ui,-apple-system,sans-serif; font-weight:600; font-size:15px; }
    .t-h    { font-family:system-ui,-apple-system,sans-serif; font-weight:600; font-size:14px; }
    .t-b    { fill:var(--ink); font-family:system-ui,-apple-system,sans-serif; font-size:12.5px; }
    .t-s    { fill:var(--ink-2); font-family:system-ui,-apple-system,sans-serif; font-size:11px; }
    .mark   { font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:16px; font-weight:700; }
    .plus   { fill:var(--code); }
    .minus  { fill:var(--gone); }
    .tie    { fill:var(--ink-3); }
    .c-code { fill:var(--code); }
    .c-mute { fill:var(--ink-3); }
    .c-lost { fill:var(--ink-2); }
    .c-acc  { fill:var(--accent); }
  </style>
  <rect class="bg" x="0" y="0" width="940" height="418"/>

  <g id="the-call">
    <rect class="ask" x="16" y="14" width="908" height="48" rx="6"/>
    <text class="t-lbl" x="32" y="32">D2 · THE CALL · AMENDED AFTER MERGE</text>
    <text class="t-q" x="32" y="52">What takes a post best fit can&#x27;t place?</text>
  </g>

  <g id="options">
    <rect class="chosen" x="212" y="76" width="348" height="46" rx="5"/>
    <text class="t-tag c-code" x="228" y="93">CHOSEN</text>
    <text class="t-h c-code" x="228" y="112">Fallback delegate, else judgment</text>
    <rect class="lost" x="576" y="76" width="348" height="46" rx="5"/>
    <text class="t-tag c-mute" x="592" y="93">INSTEAD OF · AS FIRST MERGED</text>
    <text class="t-h c-lost" x="592" y="112">Leave it unplaced, and say so</text>
  </g>

  <g id="row-1">
    <rect class="decide" x="16" y="134" width="908" height="62" rx="4"/>
    <rect class="bar" x="16" y="134" width="4" height="62"/>
    <text class="t-lbl" x="32" y="156">A POST WITH NO</text>
    <text class="t-lbl" x="32" y="169">FALLBACK DELEGATE</text>
    <text class="t-tag c-acc" x="32" y="186">▸ DECIDES IT</text>
    <text class="mark plus" x="228" y="162">+</text>
    <text class="t-b" x="248" y="161">Someone answers it</text>
    <text class="t-s" x="248" y="179">the coordinator&#x27;s own turn; unplaced only if it fails</text>
    <text class="mark minus" x="592" y="162">−</text>
    <text class="t-b" x="612" y="161">Unanswered, recorded, told</text>
    <text class="t-s" x="612" y="179">until someone sets a new fallback</text>
  </g>

  <g id="row-2">
    <text class="t-lbl" x="32" y="222">A MODEL TURN</text>
    <text class="t-lbl" x="32" y="235">PER MISS</text>
    <text class="mark minus" x="228" y="224">−</text>
    <text class="t-b" x="248" y="223">One judgment turn</text>
    <text class="t-s" x="248" y="241">only when no fallback delegate is set</text>
    <text class="mark plus" x="592" y="224">+</text>
    <text class="t-b" x="612" y="223">None</text>
    <text class="t-s" x="612" y="241">the miss costs nothing, and gets nothing</text>
    <line class="row" x1="16" y1="254" x2="924" y2="254"/>
  </g>

  <g id="row-3">
    <text class="t-lbl" x="32" y="280">A USER REMOVES</text>
    <text class="t-lbl" x="32" y="293">THE FALLBACK</text>
    <text class="mark tie" x="228" y="282">=</text>
    <text class="t-b" x="248" y="281">It goes, every time</text>
    <text class="t-s" x="248" y="299">never refused over a setting</text>
    <text class="mark tie" x="592" y="282">=</text>
    <text class="t-b" x="612" y="281">It goes, every time</text>
    <text class="t-s" x="612" y="299">the same</text>
    <line class="row" x1="16" y1="312" x2="924" y2="312"/>
  </g>

  <g id="locks-in">
    <rect class="foot" x="16" y="328" width="446" height="74" rx="5"/>
    <text class="t-lbl" x="32" y="349">LOCKS IN</text>
    <text class="t-b" x="32" y="369">Evaluator first, judgment as the fallback</text>
    <text class="t-s" x="32" y="387">a configured fallback delegate still wins</text>
  </g>

  <g id="flips-if">
    <rect class="foot" x="478" y="328" width="446" height="74" rx="5"/>
    <text class="t-lbl" x="494" y="349">FLIPS IF</text>
    <text class="t-b" x="494" y="369">Judgment turns on misses cost more than they answer</text>
    <text class="t-s" x="494" y="387">then a miss goes unplaced again, as first merged</text>
  </g>
</svg>
