<svg viewBox="0 0 940 418" role="img" aria-label="Q1, decided by Jake on 2026-10-06: where filing tasks for delegates, and hearing how they ended, is built. Chosen: move them to FIX-1794. Instead of: build them in this issue. It comes down to the first row: FIX-1794 owns how a board whose rows go to a worker on another flow stays its own, and building here answers that before its owner does or builds on mailbox boards the epic removes. The price is the second row: a coordinator can&#x27;t file or follow a task until FIX-1794 lands, while building here ships it with the coordinator. The third row is a tie: the chief of staff files no tasks today, so nothing it does now is lost either way. Locks in: this issue ships posts, delegates and hiring only. Flips if: the DevTeam dogfood needs task filing before FIX-1794 can land."
     xmlns="http://www.w3.org/2000/svg">
  <style>
    :root { --surface:#FCFCFA; --surface-2:#E8E8E1; --ink:#191C21; --ink-2:#4C535B; --ink-3:#7A828B;
            --rule:#D5D4CB; --accent:#3E4E8C; --accent-soft:#E0E3F0; --code:#2C7C69; --code-soft:#DCEDE7;
            --gone:#A9544F; }
    @media (prefers-color-scheme: dark) {
      :root { --surface:#181C1F; --surface-2:#202528; --ink:#E6E8E5; --ink-2:#A4ACB1; --ink-3:#737B81;
              --rule:#2B3135; --accent:#8B9BD8; --accent-soft:#1B2140; --code:#5DBBA1; --code-soft:#14302A;
              --gone:#DE8A84; } }
    .bg     { fill:var(--surface); }
    .ask    { fill:var(--surface-2); }
    .chosen { fill:var(--code-soft); stroke:var(--code); stroke-width:1.6; }
    .rec    { fill:var(--code-soft); stroke:var(--code); stroke-width:1.6; stroke-dasharray:5 4; }
    .lost   { fill:var(--surface); stroke:var(--rule); stroke-width:1.4; stroke-dasharray:5 4; }
    .decide { fill:var(--accent-soft); }
    .bar    { fill:var(--accent); }
    .row    { stroke:var(--rule); stroke-width:1; }
    .foot   { fill:var(--surface-2); }
    .t-lbl  { fill:var(--ink-3); font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:9.5px; letter-spacing:.1em; }
    .t-tag  { font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:9.5px; letter-spacing:.1em; font-weight:600; }
    .t-q    { fill:var(--ink); font-family:system-ui,-apple-system,sans-serif; font-weight:600; font-size:15px; }
    .t-h    { font-family:system-ui,-apple-system,sans-serif; font-weight:600; font-size:14px; }
    .t-b    { fill:var(--ink); font-family:system-ui,-apple-system,sans-serif; font-size:12.5px; }
    .t-s    { fill:var(--ink-2); font-family:system-ui,-apple-system,sans-serif; font-size:11px; }
    .mark   { font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:16px; font-weight:700; }
    .plus   { fill:var(--code); }
    .minus  { fill:var(--gone); }
    .tie    { fill:var(--ink-3); }
    .c-code { fill:var(--code); }
    .c-mute { fill:var(--ink-3); }
    .c-lost { fill:var(--ink-2); }
    .c-acc  { fill:var(--accent); }
  </style>
  <rect class="bg" x="0" y="0" width="940" height="418"/>

  <g id="the-call">
    <rect class="ask" x="16" y="14" width="908" height="48" rx="6"/>
    <text class="t-lbl" x="32" y="32">Q1 · DECIDED · JAKE, 2026-10-06</text>
    <text class="t-q" x="32" y="52">Do filing tasks for delegates, and following them, move to FIX-1794?</text>
  </g>

  <g id="options">
    <rect class="chosen" x="212" y="76" width="348" height="46" rx="5"/>
    <text class="t-tag c-code" x="228" y="93">CHOSEN</text>
    <text class="t-h c-code" x="228" y="112">Move them to FIX-1794</text>
    <rect class="lost" x="576" y="76" width="348" height="46" rx="5"/>
    <text class="t-tag c-mute" x="592" y="93">INSTEAD OF</text>
    <text class="t-h c-lost" x="592" y="112">Build them here</text>
  </g>

  <g id="row-1">
    <rect class="decide" x="16" y="134" width="908" height="62" rx="4"/>
    <rect class="bar" x="16" y="134" width="4" height="62"/>
    <text class="t-lbl" x="32" y="156">WHO ANSWERS THE</text>
    <text class="t-lbl" x="32" y="169">BOARD QUESTION</text>
    <text class="t-tag c-acc" x="32" y="186">▸ DECIDES IT</text>
    <text class="mark plus" x="228" y="162">+</text>
    <text class="t-b" x="248" y="161">FIX-1794, its owner (ER-9)</text>
    <text class="t-s" x="248" y="179">tasks ride boards it designs once</text>
    <text class="mark minus" x="592" y="162">−</text>
    <text class="t-b" x="612" y="161">This issue, first</text>
    <text class="t-s" x="612" y="179">or it builds on boards the epic removes</text>
  </g>

  <g id="row-2">
    <text class="t-lbl" x="32" y="222">WHEN TASKS</text>
    <text class="t-lbl" x="32" y="235">WORK</text>
    <text class="mark minus" x="228" y="224">−</text>
    <text class="t-b" x="248" y="223">After FIX-1794 lands</text>
    <text class="t-s" x="248" y="241">this ships posts, delegates and hiring</text>
    <text class="mark plus" x="592" y="224">+</text>
    <text class="t-b" x="612" y="223">With the coordinator</text>
    <text class="t-s" x="612" y="241">one merge for the whole job</text>
    <line class="row" x1="16" y1="254" x2="924" y2="254"/>
  </g>

  <g id="row-3">
    <text class="t-lbl" x="32" y="280">WHAT THE CHIEF OF</text>
    <text class="t-lbl" x="32" y="293">STAFF LOSES TODAY</text>
    <text class="mark tie" x="228" y="282">=</text>
    <text class="t-b" x="248" y="281">Nothing</text>
    <text class="t-s" x="248" y="299">it files no tasks now</text>
    <text class="mark tie" x="592" y="282">=</text>
    <text class="t-b" x="612" y="281">Nothing</text>
    <text class="t-s" x="612" y="299">the same</text>
    <line class="row" x1="16" y1="312" x2="924" y2="312"/>
  </g>

  <g id="locks-in">
    <rect class="foot" x="16" y="328" width="446" height="74" rx="5"/>
    <text class="t-lbl" x="32" y="349">LOCKS IN</text>
    <text class="t-b" x="32" y="369">This issue ships posts, delegates and hiring</text>
    <text class="t-s" x="32" y="387">FIX-1774&#x27;s leg e and FIX-1780 go to FIX-1794</text>
  </g>

  <g id="flips-if">
    <rect class="foot" x="478" y="328" width="446" height="74" rx="5"/>
    <text class="t-lbl" x="494" y="349">FLIPS IF</text>
    <text class="t-b" x="494" y="369">The DevTeam dogfood needs tasks first</text>
    <text class="t-s" x="494" y="387">then tasks on the coordinator&#x27;s own flow, here</text>
  </g>
</svg>
