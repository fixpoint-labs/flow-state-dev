<svg viewBox="0 0 940 420" role="img" aria-label="D2, answered: what happens to old mailbox files and data. Chosen: dropped, since there are no consumers yet. Instead of: leaving them in the store unread, with refusals and an upgrade page, or moving each pending row onto a conversation. It comes down to the first row, what we build and keep for them: dropped keeps nothing; left unread keeps refusals, a page and a pinned old store, each to test and remove later; moved keeps a migration. The second row is whose a row is: dropped and left unread guess nothing; moved must pick one user for an org row, and a pick can hand one member another's task. The price is the third row: a waiting task is gone when dropped and out of view when left unread, where moving it keeps it waiting; but nobody has one yet. Locks in: no reader, refusal, upgrade page or dual-read for old files and data. Flips if: a consumer runs mailboxes before the removal lands."
     xmlns="http://www.w3.org/2000/svg">
  <style>
    :root { --surface:#FCFCFA; --surface-2:#E8E8E1; --ink:#191C21; --ink-2:#4C535B; --ink-3:#7A828B;
            --rule:#D5D4CB; --accent:#3E4E8C; --accent-soft:#E0E3F0; --code:#2C7C69; --code-soft:#DCEDE7;
            --gone:#A9544F; }
    @media (prefers-color-scheme: dark) {
      :root { --surface:#181C1F; --surface-2:#202528; --ink:#E6E8E5; --ink-2:#A4ACB1; --ink-3:#737B81;
              --rule:#2B3135; --accent:#8B9BD8; --accent-soft:#1B2140; --code:#5DBBA1; --code-soft:#14302A;
              --gone:#DE8A84; } }
    .bg     { fill:var(--surface); }
    .ask    { fill:var(--surface-2); }
    .chosen { fill:var(--code-soft); stroke:var(--code); stroke-width:1.6; }
    .lost   { fill:var(--surface); stroke:var(--rule); stroke-width:1.4; stroke-dasharray:5 4; }
    .decide { fill:var(--accent-soft); }
    .bar    { fill:var(--accent); }
    .row    { stroke:var(--rule); stroke-width:1; }
    .foot   { fill:var(--surface-2); }
    .t-lbl  { fill:var(--ink-3); font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:9.5px; letter-spacing:.1em; }
    .t-tag  { font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:9.5px; letter-spacing:.1em; font-weight:600; }
    .t-q    { fill:var(--ink); font-family:system-ui,-apple-system,sans-serif; font-weight:600; font-size:15px; }
    .t-h    { font-family:system-ui,-apple-system,sans-serif; font-weight:600; font-size:13.5px; }
    .t-b    { fill:var(--ink); font-family:system-ui,-apple-system,sans-serif; font-size:12px; }
    .t-s    { fill:var(--ink-2); font-family:system-ui,-apple-system,sans-serif; font-size:10.5px; }
    .mark   { font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:16px; font-weight:700; }
    .plus   { fill:var(--code); }
    .minus  { fill:var(--gone); }
    .tie    { fill:var(--ink-3); }
    .c-code { fill:var(--code); }
    .c-mute { fill:var(--ink-3); }
    .c-lost { fill:var(--ink-2); }
    .c-acc  { fill:var(--accent); }
  </style>
  <rect class="bg" x="0" y="0" width="940" height="420"/>

  <g id="the-call">
    <rect class="ask" x="16" y="14" width="908" height="48" rx="6"/>
    <text class="t-lbl" x="32" y="32">D2 · ANSWERED · PRODUCT OWNER, 2026-10-07</text>
    <text class="t-q" x="32" y="52">What happens to old mailbox files and the mailbox data already in a store?</text>
  </g>

  <g id="options">
    <rect class="chosen" x="212" y="76" width="224" height="46" rx="5"/>
    <text class="t-tag c-code" x="226" y="93">CHOSEN</text>
    <text class="t-h c-code" x="226" y="112">Dropped, no consumers</text>
    <rect class="lost" x="452" y="76" width="224" height="46" rx="5"/>
    <text class="t-tag c-mute" x="466" y="93">INSTEAD OF · THE DRAFT</text>
    <text class="t-h c-lost" x="466" y="112">Unread, refused, explained</text>
    <rect class="lost" x="692" y="76" width="224" height="46" rx="5"/>
    <text class="t-tag c-mute" x="706" y="93">INSTEAD OF</text>
    <text class="t-h c-lost" x="706" y="112">Moved onto a conversation</text>
  </g>

  <g id="row-decides">
    <rect class="decide" x="16" y="134" width="908" height="62" rx="4"/>
    <rect class="bar" x="16" y="134" width="4" height="62"/>
    <text class="t-lbl" x="32" y="156">WHAT WE KEEP</text>
    <text class="t-lbl" x="32" y="169">FOR THEM</text>
    <text class="t-tag c-acc" x="32" y="186">▸ DECIDES IT</text>
    <text class="mark plus" x="226" y="162">+</text>
    <text class="t-b" x="244" y="161">Nothing</text>
    <text class="t-s" x="244" y="179">no reader, refusal or page</text>
    <text class="mark minus" x="466" y="162">−</text>
    <text class="t-b" x="484" y="161">Refusals, a page, a store</text>
    <text class="t-s" x="484" y="179">each to test, then remove</text>
    <text class="mark minus" x="706" y="162">−</text>
    <text class="t-b" x="724" y="161">A migration</text>
    <text class="t-s" x="724" y="179">written, run once, removed</text>
  </g>

  <g id="row-whose">
    <text class="t-lbl" x="32" y="222">WHOSE A ROW IS</text>
    <text class="mark plus" x="226" y="224">+</text>
    <text class="t-b" x="244" y="223">Nobody guesses</text>
    <text class="t-s" x="244" y="241">nothing reads it</text>
    <text class="mark plus" x="466" y="224">+</text>
    <text class="t-b" x="484" y="223">Nobody guesses</text>
    <text class="t-s" x="484" y="241">nothing reads it</text>
    <text class="mark minus" x="706" y="224">−</text>
    <text class="t-b" x="724" y="223">The boot picks a user</text>
    <text class="t-s" x="724" y="241">and can share another's task</text>
    <line class="row" x1="16" y1="256" x2="924" y2="256"/>
  </g>

  <g id="row-price">
    <text class="t-lbl" x="32" y="280">A WAITING TASK</text>
    <text class="mark minus" x="226" y="282">−</text>
    <text class="t-b" x="244" y="281">Gone</text>
    <text class="t-s" x="244" y="299">but nobody has one yet</text>
    <text class="mark minus" x="466" y="282">−</text>
    <text class="t-b" x="484" y="281">Out of view</text>
    <text class="t-s" x="484" y="299">finish or re-file it first</text>
    <text class="mark plus" x="706" y="282">+</text>
    <text class="t-b" x="724" y="281">Still waiting</text>
    <text class="t-s" x="724" y="299">on whoever got it</text>
    <line class="row" x1="16" y1="314" x2="924" y2="314"/>
  </g>

  <g id="locks-in">
    <rect class="foot" x="16" y="330" width="446" height="74" rx="5"/>
    <text class="t-lbl" x="32" y="351">LOCKS IN</text>
    <text class="t-b" x="32" y="371">Old files and data are dropped</text>
    <text class="t-s" x="32" y="389">no reader, refusal, upgrade page or dual-read</text>
  </g>

  <g id="flips-if">
    <rect class="foot" x="478" y="330" width="446" height="74" rx="5"/>
    <text class="t-lbl" x="494" y="351">FLIPS IF</text>
    <text class="t-b" x="494" y="371">A consumer runs mailboxes before P4</text>
    <text class="t-s" x="494" y="389">then a refusal and an upgrade page land first</text>
  </g>
</svg>
