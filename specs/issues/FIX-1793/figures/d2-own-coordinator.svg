<svg viewBox="0 0 940 420" role="img" aria-label="D2, decided: what leads a workstream opened in Shift Manager. Chosen: a new coordinator of its own. Instead of: no default, where the owner names a lead on every open, or one coordinator for all of an owner&#x27;s workstreams. It comes down to the first row: with its own coordinator, each workstream has a lead of its own with no step first; no default needs a hire or a pick before every open; a shared coordinator carries one edit into every workstream it leads. The second row is the price: one worker per workstream on the owner&#x27;s roster, kept after done, against only what the owner hires, or one worker per owner. The third row is a tie: the framework is unchanged under all three, since Shift Manager forks the coordinator and then opens the workstream naming it. Locks in: one coordinator per workstream, kept when it is done, and no choice of an existing worker in the open. Flips if owners&#x27; rosters become hard to read for the workstream coordinators on them."
     xmlns="http://www.w3.org/2000/svg">
  <style>
    :root { --surface:#FCFCFA; --surface-2:#E8E8E1; --ink:#191C21; --ink-2:#4C535B; --ink-3:#7A828B;
            --rule:#D5D4CB; --accent:#3E4E8C; --accent-soft:#E0E3F0; --code:#2C7C69; --code-soft:#DCEDE7;
            --gone:#A9544F; }
    @media (prefers-color-scheme: dark) {
      :root { --surface:#181C1F; --surface-2:#202528; --ink:#E6E8E5; --ink-2:#A4ACB1; --ink-3:#737B81;
              --rule:#2B3135; --accent:#8B9BD8; --accent-soft:#1B2140; --code:#5DBBA1; --code-soft:#14302A;
              --gone:#DE8A84; } }
    .bg     { fill:var(--surface); }
    .ask    { fill:var(--surface-2); }
    .chosen { fill:var(--code-soft); stroke:var(--code); stroke-width:1.6; }
    .lost   { fill:var(--surface); stroke:var(--rule); stroke-width:1.4; stroke-dasharray:5 4; }
    .decide { fill:var(--accent-soft); }
    .bar    { fill:var(--accent); }
    .row    { stroke:var(--rule); stroke-width:1; }
    .foot   { fill:var(--surface-2); }
    .t-lbl  { fill:var(--ink-3); font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:9.5px; letter-spacing:.1em; }
    .t-tag  { font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:9.5px; letter-spacing:.1em; font-weight:600; }
    .t-q    { fill:var(--ink); font-family:system-ui,-apple-system,sans-serif; font-weight:600; font-size:15px; }
    .t-h    { font-family:system-ui,-apple-system,sans-serif; font-weight:600; font-size:14px; }
    .t-b    { fill:var(--ink); font-family:system-ui,-apple-system,sans-serif; font-size:12.5px; }
    .t-s    { fill:var(--ink-2); font-family:system-ui,-apple-system,sans-serif; font-size:11px; }
    .mark   { font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:16px; font-weight:700; }
    .plus   { fill:var(--code); }
    .minus  { fill:var(--gone); }
    .tie    { fill:var(--ink-3); }
    .c-code { fill:var(--code); }
    .c-mute { fill:var(--ink-3); }
    .c-lost { fill:var(--ink-2); }
    .c-acc  { fill:var(--accent); }
  </style>
  <rect class="bg" x="0" y="0" width="940" height="420"/>

  <g id="the-call">
    <rect class="ask" x="16" y="14" width="908" height="48" rx="6"/>
    <text class="t-lbl" x="32" y="32">D2 · THE CALL</text>
    <text class="t-q" x="32" y="52">What leads a workstream opened in Shift Manager?</text>
  </g>

  <g id="options">
    <rect class="chosen" x="212" y="76" width="224" height="46" rx="5"/>
    <text class="t-tag c-code" x="228" y="93">CHOSEN</text>
    <text class="t-h c-code" x="228" y="112">Its own new coordinator</text>
    <rect class="lost" x="452" y="76" width="224" height="46" rx="5"/>
    <text class="t-tag c-mute" x="468" y="93">INSTEAD OF</text>
    <text class="t-h c-lost" x="468" y="112">No default</text>
    <rect class="lost" x="692" y="76" width="224" height="46" rx="5"/>
    <text class="t-tag c-mute" x="708" y="93">INSTEAD OF</text>
    <text class="t-h c-lost" x="708" y="112">One for all of them</text>
  </g>

  <g id="row-decides">
    <rect class="decide" x="16" y="134" width="908" height="62" rx="4"/>
    <rect class="bar" x="16" y="134" width="4" height="62"/>
    <text class="t-lbl" x="32" y="156">A LEAD OF</text>
    <text class="t-lbl" x="32" y="169">ITS OWN</text>
    <text class="t-tag c-acc" x="32" y="186">▸ DECIDES IT</text>
    <text class="mark plus" x="228" y="162">+</text>
    <text class="t-b" x="248" y="161">Yes, with no step first</text>
    <text class="t-s" x="248" y="179">an edit to it reaches one</text>
    <text class="mark minus" x="468" y="162">−</text>
    <text class="t-b" x="488" y="161">Only after a pick</text>
    <text class="t-s" x="488" y="179">a hire or a pick every open</text>
    <text class="mark minus" x="708" y="162">−</text>
    <text class="t-b" x="728" y="161">No, one leads all</text>
    <text class="t-s" x="728" y="179">an edit reaches every one</text>
  </g>

  <g id="row-price">
    <text class="t-lbl" x="32" y="222">THE ROSTER</text>
    <text class="mark minus" x="228" y="224">−</text>
    <text class="t-b" x="248" y="223">A worker per workstream</text>
    <text class="t-s" x="248" y="241">kept after done, so it grows</text>
    <text class="mark plus" x="468" y="224">+</text>
    <text class="t-b" x="488" y="223">What the owner hires</text>
    <text class="t-s" x="488" y="241">nothing added by an open</text>
    <text class="mark plus" x="708" y="224">+</text>
    <text class="t-b" x="728" y="223">One worker per owner</text>
    <text class="t-s" x="728" y="241">made on the first open</text>
    <line class="row" x1="16" y1="256" x2="924" y2="256"/>
  </g>

  <g id="row-tie">
    <text class="t-lbl" x="32" y="280">THE FRAMEWORK</text>
    <text class="mark tie" x="228" y="282">=</text>
    <text class="t-b" x="248" y="281">Unchanged</text>
    <text class="t-s" x="248" y="299">fork, then open naming it</text>
    <text class="mark tie" x="468" y="282">=</text>
    <text class="t-b" x="488" y="281">Unchanged</text>
    <text class="t-s" x="488" y="299">open naming the pick</text>
    <text class="mark tie" x="708" y="282">=</text>
    <text class="t-b" x="728" y="281">Unchanged</text>
    <text class="t-s" x="728" y="299">one worker, many records</text>
    <line class="row" x1="16" y1="314" x2="924" y2="314"/>
  </g>

  <g id="locks-in">
    <rect class="foot" x="16" y="330" width="446" height="74" rx="5"/>
    <text class="t-lbl" x="32" y="351">LOCKS IN</text>
    <text class="t-b" x="32" y="371">One coordinator per workstream, kept when done</text>
    <text class="t-s" x="32" y="389">no choice of an existing worker in the open, yet</text>
  </g>

  <g id="flips-if">
    <rect class="foot" x="478" y="330" width="446" height="74" rx="5"/>
    <text class="t-lbl" x="494" y="351">FLIPS IF</text>
    <text class="t-b" x="494" y="371">Rosters get hard to read for these coordinators</text>
    <text class="t-s" x="494" y="389">then a picker or a grouped roster earns its cost</text>
  </g>
</svg>
