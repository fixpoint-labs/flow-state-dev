<svg viewBox="0 0 940 418" role="img" aria-label="D1, flipped by the epic's D7. Does the word seat leave the task board too, or only Workforce? Chosen: a task board's seat becomes assignee. Instead of: only Workforce's seat goes, and the board keeps seat. It comes down to the first row, what a reader meets on a board: chosen, one word, assignee, for the entry a task's assignee picks, defined once in the glossary; instead, seat, the word a reader learned for a Workforce worker, where both meet, such as Shift Manager's task screens. Second row, the epic's Layer 1: chosen renames the board's names, the epic's second public rename, and FIX-1794's board text follows; instead leaves it unchanged, with no epic decision. Third row, the guard: chosen needs no board exception, because seat is retired everywhere; instead needs a board-seat exception scoped to the board's own surface. Locks in: the board's types, its docs and the hand-off's field say assignee, and the glossary defines assignee once, with no seat row. Flips if: one word for a board's entry and a task's pick reads ambiguously in the board's API; then the entry gets a word of its own, never seat."
     xmlns="http://www.w3.org/2000/svg">
  <style>
    :root { --surface:#FCFCFA; --surface-2:#E8E8E1; --ink:#191C21; --ink-2:#4C535B; --ink-3:#7A828B;
            --rule:#D5D4CB; --accent:#3E4E8C; --accent-soft:#E0E3F0; --code:#2C7C69; --code-soft:#DCEDE7;
            --gone:#A9544F; }
    @media (prefers-color-scheme: dark) {
      :root { --surface:#181C1F; --surface-2:#202528; --ink:#E6E8E5; --ink-2:#A4ACB1; --ink-3:#737B81;
              --rule:#2B3135; --accent:#8B9BD8; --accent-soft:#1B2140; --code:#5DBBA1; --code-soft:#14302A;
              --gone:#DE8A84; } }
    .bg     { fill:var(--surface); }
    .ask    { fill:var(--surface-2); }
    .chosen { fill:var(--code-soft); stroke:var(--code); stroke-width:1.6; }
    .lost   { fill:var(--surface); stroke:var(--rule); stroke-width:1.4; stroke-dasharray:5 4; }
    .decide { fill:var(--accent-soft); }
    .bar    { fill:var(--accent); }
    .row    { stroke:var(--rule); stroke-width:1; }
    .foot   { fill:var(--surface-2); }
    .t-lbl  { fill:var(--ink-3); font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:9.5px; letter-spacing:.1em; }
    .t-tag  { font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:9.5px; letter-spacing:.1em; font-weight:600; }
    .t-q    { fill:var(--ink); font-family:system-ui,-apple-system,sans-serif; font-weight:600; font-size:15px; }
    .t-h    { font-family:system-ui,-apple-system,sans-serif; font-weight:600; font-size:14px; }
    .t-b    { fill:var(--ink); font-family:system-ui,-apple-system,sans-serif; font-size:12.5px; }
    .t-s    { fill:var(--ink-2); font-family:system-ui,-apple-system,sans-serif; font-size:11px; }
    .mark   { font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:16px; font-weight:700; }
    .plus   { fill:var(--code); }
    .minus  { fill:var(--gone); }
    .tie    { fill:var(--ink-3); }
    .c-code { fill:var(--code); }
    .c-mute { fill:var(--ink-3); }
    .c-lost { fill:var(--ink-2); }
    .c-acc  { fill:var(--accent); }
  </style>
  <rect class="bg" x="0" y="0" width="940" height="418"/>

  <g id="the-call">
    <rect class="ask" x="16" y="14" width="908" height="48" rx="6"/>
    <text class="t-lbl" x="32" y="32">D1 · THE CALL · FLIPPED BY THE EPIC'S D7</text>
    <text class="t-q" x="32" y="52">Does “seat” leave the task board too, or only Workforce?</text>
  </g>

  <g id="options">
    <rect class="chosen" x="212" y="76" width="348" height="46" rx="5"/>
    <text class="t-tag c-code" x="228" y="93">CHOSEN</text>
    <text class="t-h c-code" x="228" y="112">A board's seat becomes assignee</text>
    <rect class="lost" x="576" y="76" width="348" height="46" rx="5"/>
    <text class="t-tag c-mute" x="592" y="93">INSTEAD OF</text>
    <text class="t-h c-lost" x="592" y="112">Only Workforce's seat goes</text>
  </g>

  <g id="row-decides">
    <rect class="decide" x="16" y="134" width="908" height="62" rx="4"/>
    <rect class="bar" x="16" y="134" width="4" height="62"/>
    <text class="t-lbl" x="32" y="156">WHAT A READER</text>
    <text class="t-lbl" x="32" y="169">MEETS ON A BOARD</text>
    <text class="t-tag c-acc" x="32" y="186">▸ DECIDES IT</text>
    <text class="mark plus" x="228" y="162">+</text>
    <text class="t-b" x="248" y="161">One word, defined once</text>
    <text class="t-s" x="248" y="179">the entry a task's assignee picks</text>
    <text class="mark minus" x="592" y="162">−</text>
    <text class="t-b" x="612" y="161">Workforce's old word for a worker</text>
    <text class="t-s" x="612" y="179">where both meet, e.g. task screens</text>
  </g>

  <g id="row-2">
    <text class="t-lbl" x="32" y="222">THE EPIC'S LAYER 1</text>
    <text class="mark minus" x="228" y="224">−</text>
    <text class="t-b" x="248" y="223">Board names renamed</text>
    <text class="t-s" x="248" y="241">the epic's second rename · FIX-1794 follows</text>
    <text class="mark plus" x="592" y="224">+</text>
    <text class="t-b" x="612" y="223">Unchanged</text>
    <text class="t-s" x="612" y="241">no epic decision</text>
    <line class="row" x1="16" y1="254" x2="924" y2="254"/>
  </g>

  <g id="row-3">
    <text class="t-lbl" x="32" y="280">THE GUARD</text>
    <text class="mark plus" x="228" y="282">+</text>
    <text class="t-b" x="248" y="281">Needs no board exception</text>
    <text class="t-s" x="248" y="299">seat is retired everywhere</text>
    <text class="mark minus" x="592" y="282">−</text>
    <text class="t-b" x="612" y="281">Needs a board-seat exception</text>
    <text class="t-s" x="612" y="299">scoped to the board's own surface</text>
    <line class="row" x1="16" y1="312" x2="924" y2="312"/>
  </g>

  <g id="locks-in">
    <rect class="foot" x="16" y="328" width="446" height="74" rx="5"/>
    <text class="t-lbl" x="32" y="349">LOCKS IN</text>
    <text class="t-b" x="32" y="369">Board types, docs and hand-off field say assignee</text>
    <text class="t-s" x="32" y="387">the glossary defines assignee once, no seat row</text>
  </g>

  <g id="flips-if">
    <rect class="foot" x="478" y="328" width="446" height="74" rx="5"/>
    <text class="t-lbl" x="494" y="349">FLIPS IF</text>
    <text class="t-b" x="494" y="369">One word reads ambiguously in the board's API</text>
    <text class="t-s" x="494" y="387">then the entry gets its own word, never seat</text>
  </g>
</svg>
