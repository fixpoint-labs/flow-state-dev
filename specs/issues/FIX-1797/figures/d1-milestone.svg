<svg viewBox="0 0 940 420" role="img" aria-label="D1: how is the privacy fix proved when FIX-1788 merges? Chosen: its own run in Shift Manager with two users on FIX-1788's merge commit, dispatched by the epic coordinator. Instead of: counting FIX-1788's own goal check, or running leg c only at the end. It comes down to the first row, whether the app a person signs into is checked before others build on it: only the chosen run does that. Second row: when a hole is found, the chosen run finds it before the coordinator and projects build on it; the end-only run finds it under three children. Third row, the price: the chosen run needs a manual dispatch no workflow fires, while the other two need none. Locks in a bounded milestone dispatch whose findings hold FIX-1791 and FIX-1795. Flips if the epic wake gains a milestone hook, or FIX-1791 merges first." xmlns="http://www.w3.org/2000/svg">
  <style>
    :root { --surface:#FCFCFA; --surface-2:#E8E8E1; --ink:#191C21; --ink-2:#4C535B; --ink-3:#7A828B;
            --rule:#D5D4CB; --accent:#3E4E8C; --accent-soft:#E0E3F0; --code:#2C7C69; --code-soft:#DCEDE7;
            --gone:#A9544F; }
    @media (prefers-color-scheme: dark) {
      :root { --surface:#181C1F; --surface-2:#202528; --ink:#E6E8E5; --ink-2:#A4ACB1; --ink-3:#737B81;
              --rule:#2B3135; --accent:#8B9BD8; --accent-soft:#1B2140; --code:#5DBBA1; --code-soft:#14302A;
              --gone:#DE8A84; } }
    .bg     { fill:var(--surface); }
    .ask    { fill:var(--surface-2); }
    .chosen { fill:var(--code-soft); stroke:var(--code); stroke-width:1.6; }
    .lost   { fill:var(--surface); stroke:var(--rule); stroke-width:1.4; stroke-dasharray:5 4; }
    .decide { fill:var(--accent-soft); }
    .bar    { fill:var(--accent); }
    .row    { stroke:var(--rule); stroke-width:1; }
    .foot   { fill:var(--surface-2); }
    .t-lbl  { fill:var(--ink-3); font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:9.5px; letter-spacing:.1em; }
    .t-tag  { font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:9.5px; letter-spacing:.1em; font-weight:600; }
    .t-q    { fill:var(--ink); font-family:system-ui,-apple-system,sans-serif; font-weight:600; font-size:15px; }
    .t-h    { font-family:system-ui,-apple-system,sans-serif; font-weight:600; font-size:13px; }
    .t-b    { fill:var(--ink); font-family:system-ui,-apple-system,sans-serif; font-size:12px; }
    .t-s    { fill:var(--ink-2); font-family:system-ui,-apple-system,sans-serif; font-size:10.5px; }
    .mark   { font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:16px; font-weight:700; }
    .plus   { fill:var(--code); }
    .minus  { fill:var(--gone); }
    .tie    { fill:var(--ink-3); }
    .c-code { fill:var(--code); }
    .c-mute { fill:var(--ink-3); }
    .c-lost { fill:var(--ink-2); }
    .c-acc  { fill:var(--accent); }
  </style>
  <rect class="bg" x="0" y="0" width="940" height="420"/>
  <g id="the-call">
    <rect class="ask" x="16" y="14" width="908" height="48" rx="6"/>
    <text class="t-lbl" x="32" y="32">D1 &#183; THE CALL</text>
    <text class="t-q" x="32" y="52">How is the privacy fix proved when FIX-1788 merges?</text>
  </g>
  <g id="options">
    <rect class="chosen" x="212" y="76" width="224" height="46" rx="5"/>
    <text class="t-tag c-code" x="226" y="93">CHOSEN</text>
    <text class="t-h c-code" x="226" y="112">Its own run, dispatched</text>
    <rect class="lost" x="452" y="76" width="224" height="46" rx="5"/>
    <text class="t-tag c-mute" x="466" y="93">INSTEAD OF</text>
    <text class="t-h c-lost" x="466" y="112">FIX-1788's own check</text>
    <rect class="lost" x="692" y="76" width="232" height="46" rx="5"/>
    <text class="t-tag c-mute" x="706" y="93">INSTEAD OF</text>
    <text class="t-h c-lost" x="706" y="112">Leg c only at the end</text>
  </g>
  <g id="row-1">
    <rect class="decide" x="16" y="134" width="908" height="62" rx="4"/>
    <rect class="bar" x="16" y="134" width="4" height="62"/>
    <text class="t-lbl" x="32" y="156">THE APP</text>
    <text class="t-lbl" x="32" y="169">IS CHECKED</text>
    <text class="t-tag c-acc" x="32" y="186">&#9656; DECIDES IT</text>
    <text class="mark plus" x="226" y="162">+</text>
    <text class="t-b" x="244" y="161">Shift Manager, two users</text>
    <text class="t-s" x="244" y="179">what people sign into</text>
    <text class="mark minus" x="466" y="162">&#8722;</text>
    <text class="t-b" x="484" y="161">A goal-local tree</text>
    <text class="t-s" x="484" y="179">the store refuses, not the app</text>
    <text class="mark minus" x="706" y="162">&#8722;</text>
    <text class="t-b" x="724" y="161">Not until every child</text>
    <text class="t-s" x="724" y="179">nothing at FIX-1788's merge</text>
  </g>
  <g id="row-2">
    <text class="t-lbl" x="32" y="224">A HOLE IS</text>
    <text class="t-lbl" x="32" y="237">FOUND</text>
    <text class="mark plus" x="226" y="227">+</text>
    <text class="t-b" x="244" y="226">Before others build on it</text>
    <text class="t-s" x="244" y="244">holds FIX-1791 and FIX-1795</text>
    <text class="mark tie" x="466" y="227">=</text>
    <text class="t-b" x="484" y="226">Early, at its own seam</text>
    <text class="t-s" x="484" y="244">if the seam is the app's</text>
    <text class="mark minus" x="706" y="227">&#8722;</text>
    <text class="t-b" x="724" y="226">Under three children</text>
    <text class="t-s" x="724" y="244">what ER-30 was written to stop</text>
    <line class="row" x1="16" y1="252" x2="924" y2="252"/>
  </g>
  <g id="row-3">
    <text class="t-lbl" x="32" y="282">WHAT IT</text>
    <text class="t-lbl" x="32" y="295">COSTS</text>
    <text class="mark minus" x="226" y="285">&#8722;</text>
    <text class="t-b" x="244" y="284">A dispatch by hand</text>
    <text class="t-s" x="244" y="302">no workflow fires it</text>
    <text class="mark plus" x="466" y="285">+</text>
    <text class="t-b" x="484" y="284">Nothing extra</text>
    <text class="t-s" x="484" y="302">already in FIX-1788's PR</text>
    <text class="mark plus" x="706" y="285">+</text>
    <text class="t-b" x="724" y="284">Nothing extra</text>
    <text class="t-s" x="724" y="302">one final run</text>
    <line class="row" x1="16" y1="310" x2="924" y2="310"/>
  </g>
  <g id="locks-in">
    <rect class="foot" x="16" y="330" width="446" height="74" rx="5"/>
    <text class="t-lbl" x="32" y="351">LOCKS IN</text>
    <text class="t-b" x="32" y="371">A bounded milestone dispatch on that commit</text>
    <text class="t-s" x="32" y="389">FIX-1791 and FIX-1795 merge only once it runs green</text>
  </g>
  <g id="flips-if">
    <rect class="foot" x="478" y="330" width="446" height="74" rx="5"/>
    <text class="t-lbl" x="494" y="351">FLIPS IF</text>
    <text class="t-b" x="494" y="371">The epic wake gains a milestone hook</text>
    <text class="t-s" x="494" y="389">or FIX-1791 merges before FIX-1788</text>
  </g>
</svg>
