<svg viewBox="0 0 940 420" role="img" aria-label="D3: what happens to an older goal check the epic broke? Chosen: the child that broke it rewrites or retires it with a line naming what replaced it, and the closure fails on any left red. Instead of: re-running only the children's own checks, or the closure rewriting them. It comes down to the first row, who makes main green again: the child that broke it, in its own reviewed PR; under children-only, nobody, so red proofs stay; under the closure rewriting them, the closure, which is product work the closure rule forbids. Second row: what the run sees, every older check, or only eight, or every older check after its own fixes. Third row, the price: about thirty more goal runs each time the plan reruns. Locks in part 3's computed list of every goal that reaches Workforce, the task board or Shift Manager. Flips if the owner lets an earlier epic's checks lapse with a line in the wrap." xmlns="http://www.w3.org/2000/svg">
  <style>
    :root { --surface:#FCFCFA; --surface-2:#E8E8E1; --ink:#191C21; --ink-2:#4C535B; --ink-3:#7A828B;
            --rule:#D5D4CB; --accent:#3E4E8C; --accent-soft:#E0E3F0; --code:#2C7C69; --code-soft:#DCEDE7;
            --gone:#A9544F; }
    @media (prefers-color-scheme: dark) {
      :root { --surface:#181C1F; --surface-2:#202528; --ink:#E6E8E5; --ink-2:#A4ACB1; --ink-3:#737B81;
              --rule:#2B3135; --accent:#8B9BD8; --accent-soft:#1B2140; --code:#5DBBA1; --code-soft:#14302A;
              --gone:#DE8A84; } }
    .bg     { fill:var(--surface); }
    .ask    { fill:var(--surface-2); }
    .chosen { fill:var(--code-soft); stroke:var(--code); stroke-width:1.6; }
    .lost   { fill:var(--surface); stroke:var(--rule); stroke-width:1.4; stroke-dasharray:5 4; }
    .decide { fill:var(--accent-soft); }
    .bar    { fill:var(--accent); }
    .row    { stroke:var(--rule); stroke-width:1; }
    .foot   { fill:var(--surface-2); }
    .t-lbl  { fill:var(--ink-3); font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:9.5px; letter-spacing:.1em; }
    .t-tag  { font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:9.5px; letter-spacing:.1em; font-weight:600; }
    .t-q    { fill:var(--ink); font-family:system-ui,-apple-system,sans-serif; font-weight:600; font-size:15px; }
    .t-h    { font-family:system-ui,-apple-system,sans-serif; font-weight:600; font-size:13px; }
    .t-b    { fill:var(--ink); font-family:system-ui,-apple-system,sans-serif; font-size:12px; }
    .t-s    { fill:var(--ink-2); font-family:system-ui,-apple-system,sans-serif; font-size:10.5px; }
    .mark   { font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:16px; font-weight:700; }
    .plus   { fill:var(--code); }
    .minus  { fill:var(--gone); }
    .tie    { fill:var(--ink-3); }
    .c-code { fill:var(--code); }
    .c-mute { fill:var(--ink-3); }
    .c-lost { fill:var(--ink-2); }
    .c-acc  { fill:var(--accent); }
  </style>
  <rect class="bg" x="0" y="0" width="940" height="420"/>
  <g id="the-call">
    <rect class="ask" x="16" y="14" width="908" height="48" rx="6"/>
    <text class="t-lbl" x="32" y="32">D3 &#183; THE CALL</text>
    <text class="t-q" x="32" y="52">An older goal check asserts a mailbox, a room or a hire. What happens to it?</text>
  </g>
  <g id="options">
    <rect class="chosen" x="212" y="76" width="224" height="46" rx="5"/>
    <text class="t-tag c-code" x="226" y="93">CHOSEN</text>
    <text class="t-h c-code" x="226" y="112">Rewritten or retired</text>
    <rect class="lost" x="452" y="76" width="224" height="46" rx="5"/>
    <text class="t-tag c-mute" x="466" y="93">INSTEAD OF</text>
    <text class="t-h c-lost" x="466" y="112">Children's checks only</text>
    <rect class="lost" x="692" y="76" width="232" height="46" rx="5"/>
    <text class="t-tag c-mute" x="706" y="93">INSTEAD OF</text>
    <text class="t-h c-lost" x="706" y="112">The closure rewrites them</text>
  </g>
  <g id="row-1">
    <rect class="decide" x="16" y="134" width="908" height="62" rx="4"/>
    <rect class="bar" x="16" y="134" width="4" height="62"/>
    <text class="t-lbl" x="32" y="156">WHO MAKES</text>
    <text class="t-lbl" x="32" y="169">MAIN GREEN</text>
    <text class="t-tag c-acc" x="32" y="186">&#9656; DECIDES IT</text>
    <text class="mark plus" x="226" y="162">+</text>
    <text class="t-b" x="244" y="161">The child that broke it</text>
    <text class="t-s" x="244" y="179">in its own reviewed PR</text>
    <text class="mark minus" x="466" y="162">&#8722;</text>
    <text class="t-b" x="484" y="161">Nobody</text>
    <text class="t-s" x="484" y="179">red proofs stay on main</text>
    <text class="mark minus" x="706" y="162">&#8722;</text>
    <text class="t-b" x="724" y="161">The closure</text>
    <text class="t-s" x="724" y="179">product work the rule forbids</text>
  </g>
  <g id="row-2">
    <text class="t-lbl" x="32" y="224">WHAT THE</text>
    <text class="t-lbl" x="32" y="237">RUN SEES</text>
    <text class="mark plus" x="226" y="227">+</text>
    <text class="t-b" x="244" y="226">Every older check</text>
    <text class="t-s" x="244" y="244">pass, or retired with a line</text>
    <text class="mark minus" x="466" y="227">&#8722;</text>
    <text class="t-b" x="484" y="226">Eight checks</text>
    <text class="t-s" x="484" y="244">FIX-1650's closure unseen</text>
    <text class="mark tie" x="706" y="227">=</text>
    <text class="t-b" x="724" y="226">Every older check</text>
    <text class="t-s" x="724" y="244">after its own fixes</text>
    <line class="row" x1="16" y1="252" x2="924" y2="252"/>
  </g>
  <g id="row-3">
    <text class="t-lbl" x="32" y="282">WHAT IT</text>
    <text class="t-lbl" x="32" y="295">COSTS</text>
    <text class="mark minus" x="226" y="285">&#8722;</text>
    <text class="t-b" x="244" y="284">About thirty more runs</text>
    <text class="t-s" x="244" y="302">each time the plan reruns</text>
    <text class="mark plus" x="466" y="285">+</text>
    <text class="t-b" x="484" y="284">Eight runs</text>
    <text class="t-s" x="484" y="302">the closure rule's item 3</text>
    <text class="mark minus" x="706" y="285">&#8722;</text>
    <text class="t-b" x="724" y="284">The runs, and the fixes</text>
    <text class="t-s" x="724" y="302">all landing in one PR</text>
    <line class="row" x1="16" y1="310" x2="924" y2="310"/>
  </g>
  <g id="locks-in">
    <rect class="foot" x="16" y="330" width="446" height="74" rx="5"/>
    <text class="t-lbl" x="32" y="351">LOCKS IN</text>
    <text class="t-b" x="32" y="371">P3.9 · every goal reaching the changed packages</text>
    <text class="t-s" x="32" y="389">computed on the commit, not a hand list</text>
  </g>
  <g id="flips-if">
    <rect class="foot" x="478" y="330" width="446" height="74" rx="5"/>
    <text class="t-lbl" x="494" y="351">FLIPS IF</text>
    <text class="t-b" x="494" y="371">The owner lets earlier epics' checks lapse</text>
    <text class="t-s" x="494" y="389">with one line in the wrap; P3.9 only lists them</text>
  </g>
</svg>
