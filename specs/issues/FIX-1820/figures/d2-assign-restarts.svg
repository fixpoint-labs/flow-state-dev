<svg viewBox="0 0 940 420" role="img" aria-label="D2: is assign restarted in the closure? Chosen: yes, killed while parked, with a fresh-store control. Instead of: the epic&#x27;s leg b as its signal reads, with no restart, or a second kill just after the answer. It comes down to the first row, the goal sentence, both kinds survive a restart: only a restart proves it for assign; the chosen kill does, and so would a second. Second row, the work runs once: the chosen check proves it after its restart with one draw, one completed notice and the same session; leg b never restarts; a second kill adds a timing race. Third row, the price: one more model run per closure run, none, or two. Locks in a restart journey for assign at every closure retest. Flips if the owner reads the goal sentence as ask-only for restarts." xmlns="http://www.w3.org/2000/svg">
  <style>
    :root { --surface:#FCFCFA; --surface-2:#E8E8E1; --ink:#191C21; --ink-2:#4C535B; --ink-3:#7A828B;
            --rule:#D5D4CB; --accent:#3E4E8C; --accent-soft:#E0E3F0; --code:#2C7C69; --code-soft:#DCEDE7;
            --gone:#A9544F; }
    @media (prefers-color-scheme: dark) {
      :root { --surface:#181C1F; --surface-2:#202528; --ink:#E6E8E5; --ink-2:#A4ACB1; --ink-3:#737B81;
              --rule:#2B3135; --accent:#8B9BD8; --accent-soft:#1B2140; --code:#5DBBA1; --code-soft:#14302A;
              --gone:#DE8A84; } }
    .bg     { fill:var(--surface); }
    .ask    { fill:var(--surface-2); }
    .chosen { fill:var(--code-soft); stroke:var(--code); stroke-width:1.6; }
    .lost   { fill:var(--surface); stroke:var(--rule); stroke-width:1.4; stroke-dasharray:5 4; }
    .decide { fill:var(--accent-soft); }
    .bar    { fill:var(--accent); }
    .row    { stroke:var(--rule); stroke-width:1; }
    .foot   { fill:var(--surface-2); }
    .t-lbl  { fill:var(--ink-3); font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:9.5px; letter-spacing:.1em; }
    .t-tag  { font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:9.5px; letter-spacing:.1em; font-weight:600; }
    .t-q    { fill:var(--ink); font-family:system-ui,-apple-system,sans-serif; font-weight:600; font-size:15px; }
    .t-h    { font-family:system-ui,-apple-system,sans-serif; font-weight:600; font-size:13px; }
    .t-b    { fill:var(--ink); font-family:system-ui,-apple-system,sans-serif; font-size:12px; }
    .t-s    { fill:var(--ink-2); font-family:system-ui,-apple-system,sans-serif; font-size:10.5px; }
    .mark   { font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:16px; font-weight:700; }
    .plus   { fill:var(--code); }
    .minus  { fill:var(--gone); }
    .tie    { fill:var(--ink-3); }
    .c-code { fill:var(--code); }
    .c-mute { fill:var(--ink-3); }
    .c-lost { fill:var(--ink-2); }
    .c-acc  { fill:var(--accent); }
  </style>
  <rect class="bg" x="0" y="0" width="940" height="420"/>
  <g id="the-call">
    <rect class="ask" x="16" y="14" width="908" height="48" rx="6"/>
    <text class="t-lbl" x="32" y="32">D2 &#183; THE CALL</text>
    <text class="t-q" x="32" y="52">Is assign restarted, as the goal sentence says?</text>
  </g>
  <g id="options">
    <rect class="chosen" x="212" y="76" width="224" height="46" rx="5"/>
    <text class="t-tag c-code" x="226" y="93">CHOSEN</text>
    <text class="t-h c-code" x="226" y="112">Yes, killed while parked</text>
    <rect class="lost" x="452" y="76" width="224" height="46" rx="5"/>
    <text class="t-tag c-mute" x="466" y="93">INSTEAD OF</text>
    <text class="t-h c-lost" x="466" y="112">Leg b as written</text>
    <rect class="lost" x="692" y="76" width="232" height="46" rx="5"/>
    <text class="t-tag c-mute" x="706" y="93">INSTEAD OF</text>
    <text class="t-h c-lost" x="706" y="112">And again after the answer</text>
  </g>
  <g id="row-1">
    <rect class="decide" x="16" y="134" width="908" height="62" rx="4"/>
    <rect class="bar" x="16" y="134" width="4" height="62"/>
    <text class="t-lbl" x="32" y="156">THE GOAL</text>
    <text class="t-lbl" x="32" y="169">SENTENCE</text>
    <text class="t-tag c-acc" x="32" y="186">&#9656; DECIDES IT</text>
    <text class="mark plus" x="226" y="162">+</text>
    <text class="t-b" x="244" y="161">Both kinds survive</text>
    <text class="t-s" x="244" y="179">proved for assign too</text>
    <text class="mark minus" x="466" y="162">&#8722;</text>
    <text class="t-b" x="484" y="161">Ask only</text>
    <text class="t-s" x="484" y="179">assign never restarted</text>
    <text class="mark plus" x="706" y="162">+</text>
    <text class="t-b" x="724" y="161">Both kinds survive</text>
    <text class="t-s" x="724" y="179">proved twice over</text>
  </g>
  <g id="row-2">
    <text class="t-lbl" x="32" y="220">THE WORK</text>
    <text class="t-lbl" x="32" y="233">RUNS ONCE</text>
    <text class="mark plus" x="226" y="226">+</text>
    <text class="t-b" x="244" y="225">After the restart</text>
    <text class="t-s" x="244" y="243">one draw, one notice, same session</text>
    <text class="mark minus" x="466" y="226">&#8722;</text>
    <text class="t-b" x="484" y="225">Never across a restart</text>
    <text class="t-s" x="484" y="243">no kill at all</text>
    <text class="mark tie" x="706" y="226">=</text>
    <text class="t-b" x="724" y="225">Also mid-start</text>
    <text class="t-s" x="724" y="243">a timing race to hit</text>
    <line class="row" x1="16" y1="252" x2="924" y2="252"/>
  </g>
  <g id="row-3">
    <text class="t-lbl" x="32" y="278">WHAT IT</text>
    <text class="t-lbl" x="32" y="291">COSTS</text>
    <text class="mark minus" x="226" y="284">&#8722;</text>
    <text class="t-b" x="244" y="283">One more model run</text>
    <text class="t-s" x="244" y="301">per closure run, minutes</text>
    <text class="mark plus" x="466" y="284">+</text>
    <text class="t-b" x="484" y="283">Nothing extra</text>
    <text class="t-s" x="484" y="301">already in part 1</text>
    <text class="mark minus" x="706" y="284">&#8722;</text>
    <text class="t-b" x="724" y="283">Two more model runs</text>
    <text class="t-s" x="724" y="301">and a flaky kill window</text>
    <line class="row" x1="16" y1="310" x2="924" y2="310"/>
  </g>
  <g id="locks-in">
    <rect class="foot" x="16" y="330" width="446" height="74" rx="5"/>
    <text class="t-lbl" x="32" y="351">LOCKS IN</text>
    <text class="t-b" x="32" y="371">A restart journey for assign at every retest</text>
    <text class="t-s" x="32" y="389">with a fresh-store control that must fail</text>
  </g>
  <g id="flips-if">
    <rect class="foot" x="478" y="330" width="446" height="74" rx="5"/>
    <text class="t-lbl" x="494" y="351">FLIPS IF</text>
    <text class="t-b" x="494" y="371">The goal sentence means ask alone</text>
    <text class="t-s" x="494" y="389">for the restart; then J4 is dropped</text>
  </g>
</svg>
