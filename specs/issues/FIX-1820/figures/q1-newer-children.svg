<svg viewBox="0 0 940 420" role="img" aria-label="Q1, open: which of the epic&#x27;s nine open newer children must be fixed before the closure runs? Recommended: only FIX-1844, which breaks ER-4, a rule this epic owns. Instead of: all nine, or none. It comes down to the first row, whether a promise the epic makes is broken: FIX-1844 breaks one, the other eight are corners outside the goal. Second row, when the epic wraps: soon with one; weeks later with nine, and after another epic&#x27;s FIX-1802 P2 for FIX-1851; soonest with none. Third row, the price: eight known corners tracked outside the epic; nothing left open; or a broken ER-4 shipped. Locks in eight issues relinked with relates-to. Flips if a customer runs hand-offs on a server that restarts often." xmlns="http://www.w3.org/2000/svg">
  <style>
    :root { --surface:#FCFCFA; --surface-2:#E8E8E1; --ink:#191C21; --ink-2:#4C535B; --ink-3:#7A828B;
            --rule:#D5D4CB; --accent:#3E4E8C; --accent-soft:#E0E3F0; --code:#2C7C69; --code-soft:#DCEDE7;
            --gone:#A9544F; }
    @media (prefers-color-scheme: dark) {
      :root { --surface:#181C1F; --surface-2:#202528; --ink:#E6E8E5; --ink-2:#A4ACB1; --ink-3:#737B81;
              --rule:#2B3135; --accent:#8B9BD8; --accent-soft:#1B2140; --code:#5DBBA1; --code-soft:#14302A;
              --gone:#DE8A84; } }
    .bg     { fill:var(--surface); }
    .ask    { fill:var(--surface-2); }
    .chosen { fill:var(--code-soft); stroke:var(--code); stroke-width:1.6; }
    .lost   { fill:var(--surface); stroke:var(--rule); stroke-width:1.4; stroke-dasharray:5 4; }
    .decide { fill:var(--accent-soft); }
    .bar    { fill:var(--accent); }
    .row    { stroke:var(--rule); stroke-width:1; }
    .foot   { fill:var(--surface-2); }
    .t-lbl  { fill:var(--ink-3); font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:9.5px; letter-spacing:.1em; }
    .t-tag  { font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:9.5px; letter-spacing:.1em; font-weight:600; }
    .t-q    { fill:var(--ink); font-family:system-ui,-apple-system,sans-serif; font-weight:600; font-size:15px; }
    .t-h    { font-family:system-ui,-apple-system,sans-serif; font-weight:600; font-size:13px; }
    .t-b    { fill:var(--ink); font-family:system-ui,-apple-system,sans-serif; font-size:12px; }
    .t-s    { fill:var(--ink-2); font-family:system-ui,-apple-system,sans-serif; font-size:10.5px; }
    .mark   { font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:16px; font-weight:700; }
    .plus   { fill:var(--code); }
    .minus  { fill:var(--gone); }
    .tie    { fill:var(--ink-3); }
    .c-code { fill:var(--code); }
    .c-mute { fill:var(--ink-3); }
    .c-lost { fill:var(--ink-2); }
    .c-acc  { fill:var(--accent); }
  </style>
  <rect class="bg" x="0" y="0" width="940" height="420"/>
  <g id="the-call">
    <rect class="ask" x="16" y="14" width="908" height="48" rx="6"/>
    <text class="t-lbl" x="32" y="32">Q1 · OPEN &#183; THE CALL</text>
    <text class="t-q" x="32" y="52">Which newer children must be fixed before the run?</text>
  </g>
  <g id="options">
    <rect class="chosen" x="212" y="76" width="224" height="46" rx="5"/>
    <text class="t-tag c-code" x="226" y="93">RECOMMENDED</text>
    <text class="t-h c-code" x="226" y="112">Only FIX-1844</text>
    <rect class="lost" x="452" y="76" width="224" height="46" rx="5"/>
    <text class="t-tag c-mute" x="466" y="93">INSTEAD OF</text>
    <text class="t-h c-lost" x="466" y="112">All nine</text>
    <rect class="lost" x="692" y="76" width="232" height="46" rx="5"/>
    <text class="t-tag c-mute" x="706" y="93">INSTEAD OF</text>
    <text class="t-h c-lost" x="706" y="112">None</text>
  </g>
  <g id="row-1">
    <rect class="decide" x="16" y="134" width="908" height="62" rx="4"/>
    <rect class="bar" x="16" y="134" width="4" height="62"/>
    <text class="t-lbl" x="32" y="156">THE EPIC&#x27;S</text>
    <text class="t-lbl" x="32" y="169">PROMISES</text>
    <text class="t-tag c-acc" x="32" y="186">&#9656; DECIDES IT</text>
    <text class="mark plus" x="226" y="162">+</text>
    <text class="t-b" x="244" y="161">All held</text>
    <text class="t-s" x="244" y="179">ER-4 fixed; the rest are corners</text>
    <text class="mark plus" x="466" y="162">+</text>
    <text class="t-b" x="484" y="161">All held</text>
    <text class="t-s" x="484" y="179">and every corner too</text>
    <text class="mark minus" x="706" y="162">&#8722;</text>
    <text class="t-b" x="724" y="161">ER-4 broken</text>
    <text class="t-s" x="724" y="179">a stopped ask can leave work open</text>
  </g>
  <g id="row-2">
    <text class="t-lbl" x="32" y="220">WHEN IT</text>
    <text class="t-lbl" x="32" y="233">WRAPS</text>
    <text class="mark plus" x="226" y="226">+</text>
    <text class="t-b" x="244" y="225">After one fix</text>
    <text class="t-s" x="244" y="243">small, inside this epic</text>
    <text class="mark minus" x="466" y="226">&#8722;</text>
    <text class="t-b" x="484" y="225">Weeks later</text>
    <text class="t-s" x="484" y="243">FIX-1851 waits on FIX-1802 P2</text>
    <text class="mark plus" x="706" y="226">+</text>
    <text class="t-b" x="724" y="225">Now</text>
    <text class="t-s" x="724" y="243">nothing to wait for</text>
    <line class="row" x1="16" y1="252" x2="924" y2="252"/>
  </g>
  <g id="row-3">
    <text class="t-lbl" x="32" y="278">WHAT IT</text>
    <text class="t-lbl" x="32" y="291">COSTS</text>
    <text class="mark tie" x="226" y="284">=</text>
    <text class="t-b" x="244" y="283">Eight tracked elsewhere</text>
    <text class="t-s" x="244" y="301">relates-to, priorities kept</text>
    <text class="mark plus" x="466" y="284">+</text>
    <text class="t-b" x="484" y="283">Nothing left open</text>
    <text class="t-s" x="484" y="301">at the cost of time</text>
    <text class="mark minus" x="706" y="284">&#8722;</text>
    <text class="t-b" x="724" y="283">A broken rule ships</text>
    <text class="t-s" x="724" y="301">with the epic marked done</text>
    <line class="row" x1="16" y1="310" x2="924" y2="310"/>
  </g>
  <g id="locks-in">
    <rect class="foot" x="16" y="330" width="446" height="74" rx="5"/>
    <text class="t-lbl" x="32" y="351">LOCKS IN</text>
    <text class="t-b" x="32" y="371">Eight issues leave the epic, relinked</text>
    <text class="t-s" x="32" y="389">FIX-1844 blocks the closure run</text>
  </g>
  <g id="flips-if">
    <rect class="foot" x="478" y="330" width="446" height="74" rx="5"/>
    <text class="t-lbl" x="494" y="351">FLIPS IF</text>
    <text class="t-b" x="494" y="371">A customer runs hand-offs on a restarting box</text>
    <text class="t-s" x="494" y="389">then FIX-1861 and FIX-1862 stay in</text>
  </g>
</svg>
