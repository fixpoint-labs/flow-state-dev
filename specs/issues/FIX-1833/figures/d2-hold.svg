<svg viewBox="0 0 940 420" role="img" aria-label="D2, whether a post sent while a delegate still works the last one still goes to that delegate with no Jev call. Chosen: yes, the hold stays. Instead of: asking Jev on every post. It comes down to the first row: a follow-up to work the EM is still doing stays with the EM, in the same thread, with no call, where asking Jev again reads it fresh and can send it elsewhere. The price is the second row: an ask meant for the chief of staff, sent in that window, goes to the EM, which answers that nothing was filed, and the person asks again. The third row: the hold costs no model call, where asking costs one Jev call per post. Locks in: a short window per post, while the delegate's turn runs, where the chief of staff can't be reached by a plain post; the same rule for every best-fit coordinator. Flips if: people send the chief of staff's own asks inside that window often enough to notice."
     xmlns="http://www.w3.org/2000/svg">
  <style>
    :root { --surface:#FCFCFA; --surface-2:#E8E8E1; --ink:#191C21; --ink-2:#4C535B; --ink-3:#7A828B;
            --rule:#D5D4CB; --accent:#3E4E8C; --accent-soft:#E0E3F0; --code:#2C7C69; --code-soft:#DCEDE7;
            --gone:#A9544F; }
    @media (prefers-color-scheme: dark) {
      :root { --surface:#181C1F; --surface-2:#202528; --ink:#E6E8E5; --ink-2:#A4ACB1; --ink-3:#737B81;
              --rule:#2B3135; --accent:#8B9BD8; --accent-soft:#1B2140; --code:#5DBBA1; --code-soft:#14302A;
              --gone:#DE8A84; } }
    .bg     { fill:var(--surface); }
    .ask    { fill:var(--surface-2); }
    .chosen { fill:var(--code-soft); stroke:var(--code); stroke-width:1.6; }
    .lost   { fill:var(--surface); stroke:var(--rule); stroke-width:1.4; stroke-dasharray:5 4; }
    .decide { fill:var(--accent-soft); }
    .bar    { fill:var(--accent); }
    .row    { stroke:var(--rule); stroke-width:1; }
    .foot   { fill:var(--surface-2); }
    .t-lbl  { fill:var(--ink-3); font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:9.5px; letter-spacing:.1em; }
    .t-tag  { font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:9.5px; letter-spacing:.1em; font-weight:600; }
    .t-q    { fill:var(--ink); font-family:system-ui,-apple-system,sans-serif; font-weight:600; font-size:15px; }
    .t-h    { font-family:system-ui,-apple-system,sans-serif; font-weight:600; font-size:14px; }
    .t-b    { fill:var(--ink); font-family:system-ui,-apple-system,sans-serif; font-size:12.5px; }
    .t-s    { fill:var(--ink-2); font-family:system-ui,-apple-system,sans-serif; font-size:11px; }
    .mark   { font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:16px; font-weight:700; }
    .plus   { fill:var(--code); }
    .minus  { fill:var(--gone); }
    .tie    { fill:var(--ink-3); }
    .c-code { fill:var(--code); }
    .c-mute { fill:var(--ink-3); }
    .c-lost { fill:var(--ink-2); }
    .c-acc  { fill:var(--accent); }
  </style>
  <rect class="bg" x="0" y="0" width="940" height="420"/>

  <g id="the-call">
    <rect class="ask" x="16" y="14" width="908" height="48" rx="6"/>
    <text class="t-lbl" x="32" y="32">D2 · THE CALL</text>
    <text class="t-q" x="32" y="52">While a delegate works the last post, does the next one still go to it, with no Jev call?</text>
  </g>

  <g id="options">
    <rect class="chosen" x="212" y="76" width="348" height="46" rx="5"/>
    <text class="t-tag c-code" x="228" y="93">CHOSEN</text>
    <text class="t-h c-code" x="228" y="112">Yes: the hold stays</text>
    <rect class="lost" x="576" y="76" width="348" height="46" rx="5"/>
    <text class="t-tag c-mute" x="592" y="93">INSTEAD OF</text>
    <text class="t-h c-lost" x="592" y="112">Ask Jev on every post</text>
  </g>

  <g id="row-decides">
    <rect class="decide" x="16" y="134" width="908" height="62" rx="4"/>
    <rect class="bar" x="16" y="134" width="4" height="62"/>
    <text class="t-lbl" x="32" y="156">A FOLLOW-UP TO</text>
    <text class="t-lbl" x="32" y="169">THE EM'S WORK</text>
    <text class="t-tag c-acc" x="32" y="186">▸ DECIDES IT</text>
    <text class="mark plus" x="228" y="162">+</text>
    <text class="t-b" x="248" y="161">Stays with the EM</text>
    <text class="t-s" x="248" y="179">same thread, the way the person meant it</text>
    <text class="mark minus" x="592" y="162">−</text>
    <text class="t-b" x="612" y="161">Read fresh</text>
    <text class="t-s" x="612" y="179">can land on the chief of staff or another delegate</text>
  </g>

  <g id="row-price">
    <text class="t-lbl" x="32" y="222">A HIRE IN THAT WINDOW</text>
    <text class="mark minus" x="228" y="224">−</text>
    <text class="t-b" x="248" y="223">Goes to the EM</text>
    <text class="t-s" x="248" y="241">it answers &quot;Nothing filed&quot;; the person asks again</text>
    <text class="mark plus" x="592" y="224">+</text>
    <text class="t-b" x="612" y="223">Reaches its own turn</text>
    <text class="t-s" x="612" y="241">Jev picks the chief of staff</text>
    <line class="row" x1="16" y1="256" x2="924" y2="256"/>
  </g>

  <g id="row-tie">
    <text class="t-lbl" x="32" y="280">COST PER POST</text>
    <text class="mark plus" x="228" y="282">+</text>
    <text class="t-b" x="248" y="281">No model call</text>
    <text class="t-s" x="248" y="299">as today (FIX-1610)</text>
    <text class="mark minus" x="592" y="282">−</text>
    <text class="t-b" x="612" y="281">One Jev call</text>
    <text class="t-s" x="612" y="299">on every post, held or not</text>
    <line class="row" x1="16" y1="314" x2="924" y2="314"/>
  </g>

  <g id="locks-in">
    <rect class="foot" x="16" y="330" width="446" height="74" rx="5"/>
    <text class="t-lbl" x="32" y="351">LOCKS IN</text>
    <text class="t-b" x="32" y="371">A short window per post</text>
    <text class="t-s" x="32" y="389">while the delegate works; the same for every best-fit desk</text>
  </g>

  <g id="flips-if">
    <rect class="foot" x="478" y="330" width="446" height="74" rx="5"/>
    <text class="t-lbl" x="494" y="351">FLIPS IF</text>
    <text class="t-b" x="494" y="371">Its own asks land in that window</text>
    <text class="t-s" x="494" y="389">often enough that people notice</text>
  </g>
</svg>
