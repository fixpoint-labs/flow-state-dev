<svg viewBox="0 0 940 330" role="img" aria-label="Two lanes, one post to one delegate. Today: the coordinator opens a ledger record with a token in its own state, dispatches the post into the delegate's session, and the answer comes back on a separate answer entry carrying the token, which the ledger claims once before the line lands. After: the coordinator dispatches a task row, the conversation's board claims it with a ticket and hands it to the same session's post entry, the row settles with the reply, and the board's one-time ending lands the same line. The ledger and the answer entry are struck out; the delegate session and the line are the same in both lanes."
     xmlns="http://www.w3.org/2000/svg">
  <style>
    :root { --surface:#FCFCFA; --surface-2:#E8E8E1; --ink:#191C21; --ink-2:#4C535B; --ink-3:#7A828B;
            --rule:#D5D4CB; --accent:#3E4E8C; --accent-soft:#E0E3F0; --code:#2C7C69; --code-soft:#DCEDE7;
            --gone:#A9544F; }
    @media (prefers-color-scheme: dark) {
      :root { --surface:#181C1F; --surface-2:#202528; --ink:#E6E8E5; --ink-2:#A4ACB1; --ink-3:#737B81;
              --rule:#2B3135; --accent:#8B9BD8; --accent-soft:#1B2140; --code:#5DBBA1; --code-soft:#14302A;
              --gone:#DE8A84; } }
    .bg    { fill:var(--surface); }
    .lane  { fill:var(--surface-2); }
    .n-box { fill:var(--surface); stroke:var(--rule); stroke-width:1.2; }
    .same  { fill:var(--surface); stroke:var(--ink-3); stroke-width:1.2; }
    .gone  { fill:var(--surface); stroke:var(--gone); stroke-width:1.4; stroke-dasharray:5 4; }
    .new   { fill:var(--code-soft); stroke:var(--code); stroke-width:1.6; }
    .strike{ stroke:var(--gone); stroke-width:1.6; }
    .arrow { stroke:var(--ink-3); stroke-width:1.3; fill:none; }
    .head  { fill:var(--ink-3); }
    .t-lbl { fill:var(--ink-3); font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:9.5px; letter-spacing:.1em; }
    .t-b   { fill:var(--ink); font-family:system-ui,-apple-system,sans-serif; font-weight:600; font-size:12.5px; }
    .t-s   { fill:var(--ink-2); font-family:system-ui,-apple-system,sans-serif; font-size:10.5px; }
    .t-g   { fill:var(--gone); font-family:system-ui,-apple-system,sans-serif; font-weight:600; font-size:12.5px; }
    .t-c   { fill:var(--code); font-family:system-ui,-apple-system,sans-serif; font-weight:600; font-size:12.5px; }
  </style>
  <rect class="bg" x="0" y="0" width="940" height="330"/>

  <g id="today">
    <rect class="lane" x="16" y="14" width="908" height="140" rx="6"/>
    <text class="t-lbl" x="32" y="34">TODAY · TWO FENCES</text>
    <rect class="n-box" x="32" y="50" width="120" height="56" rx="5"/>
    <text class="t-b" x="44" y="74">A post</text>
    <text class="t-s" x="44" y="92">any policy</text>
    <rect class="gone" x="180" y="50" width="160" height="56" rx="5"/>
    <text class="t-g" x="192" y="74">Ledger record</text>
    <text class="t-s" x="192" y="92">token in the coordinator</text>
    <line class="strike" x1="186" y1="100" x2="334" y2="56"/>
    <rect class="same" x="368" y="50" width="176" height="56" rx="5"/>
    <text class="t-b" x="380" y="74">Delegate's session</text>
    <text class="t-s" x="380" y="92">its post entry, one turn</text>
    <rect class="gone" x="572" y="50" width="160" height="56" rx="5"/>
    <text class="t-g" x="584" y="74">Answer entry</text>
    <text class="t-s" x="584" y="92">token claimed once</text>
    <line class="strike" x1="578" y1="100" x2="726" y2="56"/>
    <rect class="same" x="760" y="50" width="148" height="56" rx="5"/>
    <text class="t-b" x="772" y="74">A line</text>
    <text class="t-s" x="772" y="92">under its name</text>
    <path class="arrow" d="M152,78 H170"/><path class="head" d="M169,74 L176,78 L169,82 z"/>
    <path class="arrow" d="M340,78 H358"/><path class="head" d="M357,74 L364,78 L357,82 z"/>
    <path class="arrow" d="M544,78 H562"/><path class="head" d="M561,74 L568,78 L561,82 z"/>
    <path class="arrow" d="M732,78 H750"/><path class="head" d="M749,74 L756,78 L749,82 z"/>
    <text class="t-s" x="32" y="136">"Answered once" is decided in the coordinator's own state, beside the board's claim.</text>
  </g>

  <g id="after">
    <rect class="lane" x="16" y="170" width="908" height="146" rx="6"/>
    <text class="t-lbl" x="32" y="190">AFTER · ONE FENCE</text>
    <rect class="n-box" x="32" y="206" width="120" height="56" rx="5"/>
    <text class="t-b" x="44" y="230">A post</text>
    <text class="t-s" x="44" y="248">any policy</text>
    <rect class="new" x="180" y="206" width="160" height="56" rx="5"/>
    <text class="t-c" x="192" y="230">A task row</text>
    <text class="t-s" x="192" y="248">one per delegate, claimed</text>
    <rect class="same" x="368" y="206" width="176" height="56" rx="5"/>
    <text class="t-b" x="380" y="230">Delegate's session</text>
    <text class="t-s" x="380" y="248">same session, same entry</text>
    <rect class="new" x="572" y="206" width="160" height="56" rx="5"/>
    <text class="t-c" x="584" y="230">The row's ending</text>
    <text class="t-s" x="584" y="248">heard once, by the board</text>
    <rect class="same" x="760" y="206" width="148" height="56" rx="5"/>
    <text class="t-b" x="772" y="230">The same line</text>
    <text class="t-s" x="772" y="248">rounds and records too</text>
    <path class="arrow" d="M152,234 H170"/><path class="head" d="M169,230 L176,234 L169,238 z"/>
    <path class="arrow" d="M340,234 H358"/><path class="head" d="M357,230 L364,234 L357,238 z"/>
    <path class="arrow" d="M544,234 H562"/><path class="head" d="M561,230 L568,234 L561,238 z"/>
    <path class="arrow" d="M732,234 H750"/><path class="head" d="M749,230 L756,234 L749,238 z"/>
    <text class="t-s" x="32" y="296">"Answered once" is decided on the row, by its claim ticket. The coordinator only reads endings.</text>
  </g>
</svg>
