<svg viewBox="0 0 940 420" role="img" aria-label="D1: how far the rename reaches. Chosen: every use, public names, comments and tests included, held by a sweep. Instead of: the issue&#x27;s listed internals and the glossary. It comes down to the first row, what a reader meets: the listed set leaves AskEndedError, resumeAsk, the handed-off ending and about 970 hand-off phrases in place. Second row, the price: about 2,150 lines in 289 files and a breaking rename of exported names, against about 130 lines. Third row: only the full rule can be checked by a machine; a partial one drifts back. Locks in the sweep as the definition of done and hand-off reserved for mid-work. Flips if comments and tests are judged not worth the churn."
     xmlns="http://www.w3.org/2000/svg">
  <style>
    :root { --surface:#FCFCFA; --surface-2:#E8E8E1; --ink:#191C21; --ink-2:#4C535B; --ink-3:#7A828B;
            --rule:#D5D4CB; --accent:#3E4E8C; --accent-soft:#E0E3F0; --code:#2C7C69; --code-soft:#DCEDE7;
            --gone:#A9544F; }
    @media (prefers-color-scheme: dark) {
      :root { --surface:#181C1F; --surface-2:#202528; --ink:#E6E8E5; --ink-2:#A4ACB1; --ink-3:#737B81;
              --rule:#2B3135; --accent:#8B9BD8; --accent-soft:#1B2140; --code:#5DBBA1; --code-soft:#14302A;
              --gone:#DE8A84; } }
    .bg     { fill:var(--surface); }
    .ask    { fill:var(--surface-2); }
    .chosen { fill:var(--code-soft); stroke:var(--code); stroke-width:1.6; }
    .lost   { fill:var(--surface); stroke:var(--rule); stroke-width:1.4; stroke-dasharray:5 4; }
    .decide { fill:var(--accent-soft); }
    .bar    { fill:var(--accent); }
    .row    { stroke:var(--rule); stroke-width:1; }
    .foot   { fill:var(--surface-2); }
    .t-lbl  { fill:var(--ink-3); font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:9.5px; letter-spacing:.1em; }
    .t-tag  { font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:9.5px; letter-spacing:.1em; font-weight:600; }
    .t-q    { fill:var(--ink); font-family:system-ui,-apple-system,sans-serif; font-weight:600; font-size:15px; }
    .t-h    { font-family:system-ui,-apple-system,sans-serif; font-weight:600; font-size:14px; }
    .t-b    { fill:var(--ink); font-family:system-ui,-apple-system,sans-serif; font-size:12.5px; }
    .t-s    { fill:var(--ink-2); font-family:system-ui,-apple-system,sans-serif; font-size:11px; }
    .mark   { font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:16px; font-weight:700; }
    .plus   { fill:var(--code); }
    .minus  { fill:var(--gone); }
    .tie    { fill:var(--ink-3); }
    .c-code { fill:var(--code); }
    .c-mute { fill:var(--ink-3); }
    .c-lost { fill:var(--ink-2); }
    .c-acc  { fill:var(--accent); }
  </style>
  <rect class="bg" x="0" y="0" width="940" height="420"/>

  <g id="the-call">
    <rect class="ask" x="16" y="14" width="908" height="48" rx="6"/>
    <text class="t-lbl" x="32" y="32">D1 · THE CALL</text>
    <text class="t-q" x="32" y="52">How far does the rename reach?</text>
  </g>

  <g id="options">
    <rect class="chosen" x="212" y="76" width="348" height="46" rx="5"/>
    <text class="t-tag c-code" x="228" y="93">CHOSEN</text>
    <text class="t-h c-code" x="228" y="112">Every use, held by a sweep</text>
    <rect class="lost" x="576" y="76" width="348" height="46" rx="5"/>
    <text class="t-tag c-mute" x="592" y="93">INSTEAD OF</text>
    <text class="t-h c-lost" x="592" y="112">The issue&#x27;s listed names and the glossary</text>
  </g>

  <g id="row-1">
    <rect class="decide" x="16" y="134" width="908" height="62" rx="4"/>
    <rect class="bar" x="16" y="134" width="4" height="62"/>
    <text class="t-lbl" x="32" y="156">WHAT A READER</text>
    <text class="t-lbl" x="32" y="169">MEETS</text>
    <text class="t-tag c-acc" x="32" y="186">▸ DECIDES IT</text>
    <text class="mark plus" x="228" y="162">+</text>
    <text class="t-b" x="248" y="161">One word per thing, everywhere</text>
    <text class="t-s" x="248" y="179">API, stack traces, tests, pages</text>
    <text class="mark minus" x="592" y="162">−</text>
    <text class="t-b" x="612" y="161">The old word in the API and board</text>
    <text class="t-s" x="612" y="179">AskEndedError · &quot;handed-off&quot; · 970 phrases</text>
  </g>

  <g id="row-2">
    <text class="t-lbl" x="32" y="218">THE PRICE</text>
    <text class="mark minus" x="228" y="224">−</text>
    <text class="t-b" x="248" y="223">About 2,150 lines, 289 files</text>
    <text class="t-s" x="248" y="241">and a breaking rename of exports</text>
    <text class="mark plus" x="592" y="224">+</text>
    <text class="t-b" x="612" y="223">About 130 lines</text>
    <text class="t-s" x="612" y="241">internals and a few pages</text>
    <line class="row" x1="16" y1="254" x2="924" y2="254"/>
  </g>

  <g id="row-3">
    <text class="t-lbl" x="32" y="276">STAYS TRUE</text>
    <text class="mark plus" x="228" y="282">+</text>
    <text class="t-b" x="248" y="281">A machine checks every file</text>
    <text class="t-s" x="248" y="299">zero open lines, or the check fails</text>
    <text class="mark minus" x="592" y="282">−</text>
    <text class="t-b" x="612" y="281">No rule a machine can run</text>
    <text class="t-s" x="612" y="299">&quot;names, but not comments&quot; drifts back</text>
    <line class="row" x1="16" y1="312" x2="924" y2="312"/>
  </g>

  <g id="locks-in">
    <rect class="foot" x="16" y="330" width="446" height="74" rx="5"/>
    <text class="t-lbl" x="32" y="351">LOCKS IN</text>
    <text class="t-b" x="32" y="371">The sweep is the definition of done</text>
    <text class="t-s" x="32" y="389">hand-off reserved for mid-work · no aliases</text>
  </g>

  <g id="flips-if">
    <rect class="foot" x="478" y="330" width="446" height="74" rx="5"/>
    <text class="t-lbl" x="494" y="351">FLIPS IF</text>
    <text class="t-b" x="494" y="371">Comments and tests judged not worth it</text>
    <text class="t-s" x="494" y="389">then the rules narrow to names and pages</text>
  </g>
</svg>
