<svg viewBox="0 0 940 418" role="img" aria-label="D2: how a fresh worktree gets its dependencies. Chosen: the machine's shared pnpm store, installed by the coding agent. Instead of: node_modules linked from the checkout, or the host installing after it provisions. It comes down to the first row, what the agent's tests import: the worktree's own sources for the chosen option and for a host install, the checkout's sources, silently, when linked. Second row, the price: the agent spends about six seconds on an install, against none when linked, and a new host option for the host install. Third row: a missed install fails loudly for the chosen option. Locks in: about six seconds on a warm store per worktree. Flips if: agents skip the install in practice."
     xmlns="http://www.w3.org/2000/svg">
  <style>
    :root { --surface:#FCFCFA; --surface-2:#E8E8E1; --ink:#191C21; --ink-2:#4C535B; --ink-3:#7A828B;
            --rule:#D5D4CB; --accent:#3E4E8C; --accent-soft:#E0E3F0; --code:#2C7C69; --code-soft:#DCEDE7;
            --gone:#A9544F; }
    @media (prefers-color-scheme: dark) {
      :root { --surface:#181C1F; --surface-2:#202528; --ink:#E6E8E5; --ink-2:#A4ACB1; --ink-3:#737B81;
              --rule:#2B3135; --accent:#8B9BD8; --accent-soft:#1B2140; --code:#5DBBA1; --code-soft:#14302A;
              --gone:#DE8A84; } }
    .bg     { fill:var(--surface); }
    .ask    { fill:var(--surface-2); }
    .chosen { fill:var(--code-soft); stroke:var(--code); stroke-width:1.6; }
    .lost   { fill:var(--surface); stroke:var(--rule); stroke-width:1.4; stroke-dasharray:5 4; }
    .decide { fill:var(--accent-soft); }
    .bar    { fill:var(--accent); }
    .row    { stroke:var(--rule); stroke-width:1; }
    .foot   { fill:var(--surface-2); }
    .t-lbl  { fill:var(--ink-3); font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:9.5px; letter-spacing:.1em; }
    .t-tag  { font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:9.5px; letter-spacing:.1em; font-weight:600; }
    .t-q    { fill:var(--ink); font-family:system-ui,-apple-system,sans-serif; font-weight:600; font-size:15px; }
    .t-h    { font-family:system-ui,-apple-system,sans-serif; font-weight:600; font-size:14px; }
    .t-b    { fill:var(--ink); font-family:system-ui,-apple-system,sans-serif; font-size:12.5px; }
    .t-s    { fill:var(--ink-2); font-family:system-ui,-apple-system,sans-serif; font-size:11px; }
    .mark   { font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:16px; font-weight:700; }
    .plus   { fill:var(--code); }
    .minus  { fill:var(--gone); }
    .tie    { fill:var(--ink-3); }
    .c-code { fill:var(--code); }
    .c-mute { fill:var(--ink-3); }
    .c-lost { fill:var(--ink-2); }
    .c-acc  { fill:var(--accent); }
  </style>
  <rect class="bg" x="0" y="0" width="940" height="418"/>

  <g id="the-call">
    <rect class="ask" x="16" y="14" width="908" height="48" rx="6"/>
    <text class="t-lbl" x="32" y="32">D2 · THE CALL</text>
    <text class="t-q" x="32" y="52">How does a fresh worktree get its dependencies?</text>
  </g>

  <g id="options">
    <rect class="chosen" x="212" y="76" width="224" height="46" rx="5"/>
    <text class="t-tag c-code" x="228" y="93">CHOSEN</text>
    <text class="t-h c-code" x="228" y="112">Shared store, agent installs</text>
    <rect class="lost" x="452" y="76" width="224" height="46" rx="5"/>
    <text class="t-tag c-mute" x="468" y="93">INSTEAD OF</text>
    <text class="t-h c-lost" x="468" y="112">Linked from checkout</text>
    <rect class="lost" x="692" y="76" width="224" height="46" rx="5"/>
    <text class="t-tag c-mute" x="708" y="93">INSTEAD OF</text>
    <text class="t-h c-lost" x="708" y="112">Host installs</text>
  </g>

  <g id="row-decides">
    <rect class="decide" x="16" y="134" width="908" height="62" rx="4"/>
    <rect class="bar" x="16" y="134" width="4" height="62"/>
    <text class="t-lbl" x="32" y="156">WHAT THE AGENT'S</text>
    <text class="t-lbl" x="32" y="169">TESTS IMPORT</text>
    <text class="t-tag c-acc" x="32" y="186">▸ DECIDES IT</text>
    <text class="mark plus" x="228" y="162">+</text>
    <text class="t-b" x="248" y="161">The worktree's sources</text>
    <text class="t-s" x="248" y="179">its own edits</text>
    <text class="mark minus" x="468" y="162">−</text>
    <text class="t-b" x="488" y="161">The checkout's sources</text>
    <text class="t-s" x="488" y="179">silently wrong</text>
    <text class="mark plus" x="708" y="162">+</text>
    <text class="t-b" x="728" y="161">The worktree's sources</text>
    <text class="t-s" x="728" y="179">its own edits</text>
  </g>

  <g id="row-2">
    <text class="t-lbl" x="32" y="218">WHAT IT COSTS</text>
    <text class="mark minus" x="228" y="220">−</text>
    <text class="t-b" x="248" y="219">About 6 s, by the agent</text>
    <text class="t-s" x="248" y="237">its docs say pnpm install</text>
    <text class="mark plus" x="468" y="220">+</text>
    <text class="t-b" x="488" y="219">Nothing</text>
    <text class="t-s" x="488" y="237">no install at all</text>
    <text class="mark minus" x="708" y="220">−</text>
    <text class="t-b" x="728" y="219">A new host option</text>
    <text class="t-s" x="728" y="237">for the same 6 s</text>
    <line class="row" x1="16" y1="252" x2="924" y2="252"/>
  </g>

  <g id="row-3">
    <text class="t-lbl" x="32" y="276">AN INSTALL</text>
    <text class="t-lbl" x="32" y="289">THAT DIDN'T RUN</text>
    <text class="mark plus" x="228" y="278">+</text>
    <text class="t-b" x="248" y="277">Fails loudly</text>
    <text class="t-s" x="248" y="295">no node_modules</text>
    <text class="mark tie" x="468" y="278">=</text>
    <text class="t-b" x="488" y="277">Can't happen</text>
    <text class="t-s" x="488" y="295">nothing to run</text>
    <text class="mark plus" x="708" y="278">+</text>
    <text class="t-b" x="728" y="277">Fails loudly</text>
    <text class="t-s" x="728" y="295">before the agent</text>
    <line class="row" x1="16" y1="310" x2="924" y2="310"/>
  </g>

  <g id="locks-in">
    <rect class="foot" x="16" y="328" width="446" height="74" rx="5"/>
    <text class="t-lbl" x="32" y="349">LOCKS IN</text>
    <text class="t-b" x="32" y="369">About 6 s per fresh worktree, warm store</text>
    <text class="t-s" x="32" y="387">a cold store pays a network install once</text>
  </g>

  <g id="flips-if">
    <rect class="foot" x="478" y="328" width="446" height="74" rx="5"/>
    <text class="t-lbl" x="494" y="349">FLIPS IF</text>
    <text class="t-b" x="494" y="369">Coding agents skip the install in practice</text>
    <text class="t-s" x="494" y="387">then the host runs it, one generic option</text>
  </g>
</svg>
