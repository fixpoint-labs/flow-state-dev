<svg viewBox="0 0 940 418" role="img" aria-label="D3: what happens to a run's branch when the run settles. Chosen: it stays checked out in its worktree. Instead of: detach it on settle. It comes down to the first row, a continuation after the run settles: it resumes in place under the chosen option, and is refused as not on its branch under the other. Second row, the price: the branch can't be checked out in your own tree until the worktree is removed, against checking it out at once. Third row, a tie: git diff from the checkout works either way. Locks in: review in the worktree or by diff. Flips if: continuation stops re-using the live place."
     xmlns="http://www.w3.org/2000/svg">
  <style>
    :root { --surface:#FCFCFA; --surface-2:#E8E8E1; --ink:#191C21; --ink-2:#4C535B; --ink-3:#7A828B;
            --rule:#D5D4CB; --accent:#3E4E8C; --accent-soft:#E0E3F0; --code:#2C7C69; --code-soft:#DCEDE7;
            --gone:#A9544F; }
    @media (prefers-color-scheme: dark) {
      :root { --surface:#181C1F; --surface-2:#202528; --ink:#E6E8E5; --ink-2:#A4ACB1; --ink-3:#737B81;
              --rule:#2B3135; --accent:#8B9BD8; --accent-soft:#1B2140; --code:#5DBBA1; --code-soft:#14302A;
              --gone:#DE8A84; } }
    .bg     { fill:var(--surface); }
    .ask    { fill:var(--surface-2); }
    .chosen { fill:var(--code-soft); stroke:var(--code); stroke-width:1.6; }
    .lost   { fill:var(--surface); stroke:var(--rule); stroke-width:1.4; stroke-dasharray:5 4; }
    .decide { fill:var(--accent-soft); }
    .bar    { fill:var(--accent); }
    .row    { stroke:var(--rule); stroke-width:1; }
    .foot   { fill:var(--surface-2); }
    .t-lbl  { fill:var(--ink-3); font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:9.5px; letter-spacing:.1em; }
    .t-tag  { font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:9.5px; letter-spacing:.1em; font-weight:600; }
    .t-q    { fill:var(--ink); font-family:system-ui,-apple-system,sans-serif; font-weight:600; font-size:15px; }
    .t-h    { font-family:system-ui,-apple-system,sans-serif; font-weight:600; font-size:14px; }
    .t-b    { fill:var(--ink); font-family:system-ui,-apple-system,sans-serif; font-size:12.5px; }
    .t-s    { fill:var(--ink-2); font-family:system-ui,-apple-system,sans-serif; font-size:11px; }
    .mark   { font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:16px; font-weight:700; }
    .plus   { fill:var(--code); }
    .minus  { fill:var(--gone); }
    .tie    { fill:var(--ink-3); }
    .c-code { fill:var(--code); }
    .c-mute { fill:var(--ink-3); }
    .c-lost { fill:var(--ink-2); }
    .c-acc  { fill:var(--accent); }
  </style>
  <rect class="bg" x="0" y="0" width="940" height="418"/>

  <g id="the-call">
    <rect class="ask" x="16" y="14" width="908" height="48" rx="6"/>
    <text class="t-lbl" x="32" y="32">D3 · THE CALL</text>
    <text class="t-q" x="32" y="52">What happens to a run's branch when the run settles?</text>
  </g>

  <g id="options">
    <rect class="chosen" x="212" y="76" width="348" height="46" rx="5"/>
    <text class="t-tag c-code" x="228" y="93">CHOSEN</text>
    <text class="t-h c-code" x="228" y="112">Stays checked out</text>
    <rect class="lost" x="576" y="76" width="348" height="46" rx="5"/>
    <text class="t-tag c-mute" x="592" y="93">INSTEAD OF</text>
    <text class="t-h c-lost" x="592" y="112">Detached on settle</text>
  </g>

  <g id="row-decides">
    <rect class="decide" x="16" y="134" width="908" height="62" rx="4"/>
    <rect class="bar" x="16" y="134" width="4" height="62"/>
    <text class="t-lbl" x="32" y="156">A CONTINUATION</text>
    <text class="t-lbl" x="32" y="169">AFTER IT SETTLES</text>
    <text class="t-tag c-acc" x="32" y="186">▸ DECIDES IT</text>
    <text class="mark plus" x="228" y="162">+</text>
    <text class="t-b" x="248" y="161">Resumes in place</text>
    <text class="t-s" x="248" y="179">same worktree, same branch</text>
    <text class="mark minus" x="592" y="162">−</text>
    <text class="t-b" x="612" y="161">Refused</text>
    <text class="t-s" x="612" y="179">the checkout is off its branch</text>
  </g>

  <g id="row-2">
    <text class="t-lbl" x="32" y="218">CHECK IT OUT IN</text>
    <text class="t-lbl" x="32" y="231">YOUR OWN TREE</text>
    <text class="mark minus" x="228" y="220">−</text>
    <text class="t-b" x="248" y="219">Not until it's removed</text>
    <text class="t-s" x="248" y="237">git worktree remove frees it</text>
    <text class="mark plus" x="592" y="220">+</text>
    <text class="t-b" x="612" y="219">At once</text>
    <text class="t-s" x="612" y="237">nothing holds the branch</text>
    <line class="row" x1="16" y1="252" x2="924" y2="252"/>
  </g>

  <g id="row-3">
    <text class="t-lbl" x="32" y="276">DIFF FROM</text>
    <text class="t-lbl" x="32" y="289">YOUR CHECKOUT</text>
    <text class="mark tie" x="228" y="278">=</text>
    <text class="t-b" x="248" y="277">git diff main...branch</text>
    <text class="t-s" x="248" y="295">works</text>
    <text class="mark tie" x="592" y="278">=</text>
    <text class="t-b" x="612" y="277">git diff main...branch</text>
    <text class="t-s" x="612" y="295">works</text>
    <line class="row" x1="16" y1="310" x2="924" y2="310"/>
  </g>

  <g id="locks-in">
    <rect class="foot" x="16" y="328" width="446" height="74" rx="5"/>
    <text class="t-lbl" x="32" y="349">LOCKS IN</text>
    <text class="t-b" x="32" y="369">Review in the worktree, or by diff</text>
    <text class="t-s" x="32" y="387">the epic's shared docs already say so</text>
  </g>

  <g id="flips-if">
    <rect class="foot" x="478" y="328" width="446" height="74" rx="5"/>
    <text class="t-lbl" x="494" y="349">FLIPS IF</text>
    <text class="t-b" x="494" y="369">Continuation stops re-using the live place</text>
    <text class="t-s" x="494" y="387">then detaching costs nothing</text>
  </g>
</svg>
