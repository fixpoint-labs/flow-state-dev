<svg viewBox="0 0 940 470" role="img" aria-label="Two panels. Today: a project row names a remote, projectWorkspace answers the remote, the host clones it into .clones and cuts a worktree there, with project/ beside it; the operator's own checkout is never used, and a local repository refuses the project's files. After: projectWorkspace holds the operator's mapping from a remote and a list of shared projects, by organization and id, to a checkout. A shared fsd project, named and on the same remote, crosses the fence and gets a worktree of the checkout in place/checkout with place/project beside it, its branch in the checkout. A private fsd project with the same remote is not named, stops at the fence, and goes the remote's way: a clone if the host allows it, otherwise refused."
     xmlns="http://www.w3.org/2000/svg">
  <style>
    :root { --surface:#FCFCFA; --surface-2:#E8E8E1; --ink:#191C21; --ink-2:#4C535B; --ink-3:#7A828B;
            --rule:#D5D4CB; --accent:#3E4E8C; --accent-soft:#E0E3F0; --code:#2C7C69; --code-soft:#DCEDE7;
            --prose:#A8761C; --prose-soft:#F3E8D2; --gone:#A9544F; }
    @media (prefers-color-scheme: dark) {
      :root { --surface:#181C1F; --surface-2:#202528; --ink:#E6E8E5; --ink-2:#A4ACB1; --ink-3:#737B81;
              --rule:#2B3135; --accent:#8B9BD8; --accent-soft:#1B2140; --code:#5DBBA1; --code-soft:#14302A;
              --prose:#D9A44B; --prose-soft:#332612; --gone:#DE8A84; } }
    .bg    { fill:var(--surface); }
    .band  { fill:var(--surface-2); }
    .n-box { fill:var(--surface); stroke:var(--rule); stroke-width:1.2; }
    .n-in  { fill:var(--prose-soft); stroke:var(--prose); stroke-width:1.2; }
    .n-new { fill:var(--code-soft); stroke:var(--code); stroke-width:1.4; }
    .n-acc { fill:var(--accent-soft); stroke:var(--accent); stroke-width:1.4; }
    .n-off { fill:var(--surface); stroke:var(--gone); stroke-width:1.2; stroke-dasharray:5 4; }
    .fence { fill:none; stroke:var(--code); stroke-width:2; stroke-dasharray:8 5; }
    .arr   { stroke:var(--ink-2); stroke-width:1.3; fill:none; }
    .stop  { stroke:var(--gone); stroke-width:1.3; fill:none; stroke-dasharray:4 3; }
    .t-lbl { fill:var(--ink-3); font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:9.5px; letter-spacing:.1em; }
    .t-b   { fill:var(--ink); font-family:system-ui,-apple-system,sans-serif; font-weight:600; font-size:12.5px; }
    .t-s   { fill:var(--ink-2); font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:9.5px; }
    .t-g   { fill:var(--gone); font-family:system-ui,-apple-system,sans-serif; font-size:11px; }
    .t-c   { fill:var(--code); font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:9.5px; letter-spacing:.1em; font-weight:600; }
    .mk    { fill:var(--ink-2); }
    .mk-s  { fill:var(--gone); }
  </style>
  <rect class="bg" x="0" y="0" width="940" height="470"/>

  <g id="today">
    <rect class="band" x="16" y="14" width="908" height="176" rx="6"/>
    <text class="t-lbl" x="32" y="34">TODAY</text>
    <rect class="n-in" x="32" y="48" width="190" height="56" rx="5"/>
    <text class="t-b" x="46" y="70">project row</text>
    <text class="t-s" x="46" y="88">repository: a remote</text>
    <rect class="n-box" x="262" y="48" width="190" height="56" rx="5"/>
    <text class="t-b" x="276" y="70">projectWorkspace()</text>
    <text class="t-s" x="276" y="88">answers the remote</text>
    <rect class="n-box" x="492" y="48" width="190" height="56" rx="5"/>
    <text class="t-b" x="506" y="70">workspace host</text>
    <text class="t-s" x="506" y="88">clones into .clones/</text>
    <rect class="n-box" x="722" y="48" width="186" height="56" rx="5"/>
    <text class="t-b" x="736" y="70">place/checkout</text>
    <text class="t-s" x="736" y="88">+ project/ · a hidden clone</text>
    <path class="arr" d="M222,76 L260,76"/>
    <polygon class="mk" points="260.0,76.0 253.0,79.5 253.0,72.5"/>
    <path class="arr" d="M452,76 L490,76"/>
    <polygon class="mk" points="490.0,76.0 483.0,79.5 483.0,72.5"/>
    <path class="arr" d="M682,76 L720,76"/>
    <polygon class="mk" points="720.0,76.0 713.0,79.5 713.0,72.5"/>
    <rect class="n-off" x="32" y="122" width="420" height="52" rx="5"/>
    <text class="t-b" x="46" y="143">your checkout · /home/me/fsd</text>
    <text class="t-g" x="46" y="162">never used for a project; as a local repository it refuses the project's files</text>
  </g>

  <g id="after">
    <text class="t-lbl" x="32" y="218">AFTER</text>
    <rect class="n-in" x="32" y="236" width="190" height="56" rx="5"/>
    <text class="t-b" x="46" y="258">shared fsd</text>
    <text class="t-s" x="46" y="276">named · same remote</text>
    <rect class="n-in" x="32" y="356" width="190" height="56" rx="5"/>
    <text class="t-b" x="46" y="378">private fsd</text>
    <text class="t-s" x="46" y="396">same id · same remote</text>
    <rect class="n-acc" x="250" y="280" width="226" height="88" rx="5"/>
    <text class="t-b" x="264" y="302">projectWorkspace({ checkouts })</text>
    <text class="t-s" x="264" y="320">remote → checkout</text>
    <text class="t-s" x="264" y="336">shared { orgId, id } listed</text>
    <text class="t-s" x="264" y="352">operator config, never a row</text>
    <path class="arr" d="M222,264 L248,290"/>
    <polygon class="mk" points="248.0,290.0 240.6,287.5 245.5,282.6"/>
    <path class="arr" d="M222,384 L248,358"/>
    <polygon class="mk" points="248.0,358.0 245.5,365.4 240.6,360.5"/>
  </g>

  <g id="the-checkout">
    <rect class="fence" x="512" y="218" width="396" height="138" rx="8"/>
    <text class="t-c" x="528" y="238">YOUR CHECKOUT · THE FENCE</text>
    <rect class="n-new" x="528" y="250" width="176" height="90" rx="5"/>
    <text class="t-b" x="542" y="272">place/checkout</text>
    <text class="t-s" x="542" y="290">a worktree of it</text>
    <text class="t-s" x="542" y="306">its own branch</text>
    <text class="t-s" x="542" y="322">base: baseRef or HEAD</text>
    <rect class="n-box" x="716" y="250" width="176" height="90" rx="5"/>
    <text class="t-b" x="730" y="272">place/project</text>
    <text class="t-s" x="730" y="290">the project's files</text>
    <text class="t-s" x="730" y="306">beside, never inside</text>
    <text class="t-s" x="730" y="322">saved back</text>
    <path class="arr" d="M476,300 L526,296"/>
    <polygon class="mk" points="526.0,296.0 519.3,300.0 518.7,293.1"/>
  </g>

  <g id="outside">
    <rect class="n-off" x="562" y="384" width="346" height="56" rx="5"/>
    <text class="t-b" x="576" y="406">the remote's way, as today</text>
    <text class="t-g" x="576" y="424">a clone if the host allows it, else refused</text>
    <path class="stop" d="M476,352 C512,370 520,404 560,410"/>
    <polygon class="mk-s" points="560.0,410.0 552.6,412.4 553.6,405.5"/>
  </g>
</svg>
