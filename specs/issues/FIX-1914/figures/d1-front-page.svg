<svg viewBox="0 0 940 416" role="img" aria-label="D1: where does the picker live? Chosen: its own front page, with a mode per address. Instead of: a switcher inside one shell with Flow State at /. It comes down to keeping today&#x27;s app unchanged: it moves as one page instead of threading a mode through it. The price: 6 files of browser checks change address. A link to one mode is a gain. Locks in / as the picker. Flips if the product wants Kitchen Sink to open straight into the last mode used."
     xmlns="http://www.w3.org/2000/svg">
  <style>
    :root { --surface:#FCFCFA; --surface-2:#E8E8E1; --ink:#191C21; --ink-2:#4C535B; --ink-3:#7A828B;
            --rule:#D5D4CB; --accent:#3E4E8C; --accent-soft:#E0E3F0; --code:#2C7C69; --code-soft:#DCEDE7;
            --gone:#A9544F; }
    @media (prefers-color-scheme: dark) {
      :root { --surface:#181C1F; --surface-2:#202528; --ink:#E6E8E5; --ink-2:#A4ACB1; --ink-3:#737B81;
              --rule:#2B3135; --accent:#8B9BD8; --accent-soft:#1B2140; --code:#5DBBA1; --code-soft:#14302A;
              --gone:#DE8A84; } }
    .bg     { fill:var(--surface); }
    .ask    { fill:var(--surface-2); }
    .chosen { fill:var(--code-soft); stroke:var(--code); stroke-width:1.6; }
    .recom  { fill:var(--code-soft); stroke:var(--code); stroke-width:1.6; stroke-dasharray:6 4; }
    .lost   { fill:var(--surface); stroke:var(--rule); stroke-width:1.4; stroke-dasharray:5 4; }
    .decide { fill:var(--accent-soft); }
    .bar    { fill:var(--accent); }
    .row    { stroke:var(--rule); stroke-width:1; }
    .foot   { fill:var(--surface-2); }
    .t-lbl  { fill:var(--ink-3); font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:9.5px; letter-spacing:.1em; }
    .t-tag  { font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:9.5px; letter-spacing:.1em; font-weight:600; }
    .t-q    { fill:var(--ink); font-family:system-ui,-apple-system,sans-serif; font-weight:600; font-size:15px; }
    .t-h    { font-family:system-ui,-apple-system,sans-serif; font-weight:600; font-size:14px; }
    .t-b    { fill:var(--ink); font-family:system-ui,-apple-system,sans-serif; font-size:12.5px; }
    .t-s    { fill:var(--ink-2); font-family:system-ui,-apple-system,sans-serif; font-size:11px; }
    .mark   { font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:16px; font-weight:700; }
    .plus   { fill:var(--code); }
    .minus  { fill:var(--gone); }
    .tie    { fill:var(--ink-3); }
    .c-code { fill:var(--code); }
    .c-mute { fill:var(--ink-3); }
    .c-lost { fill:var(--ink-2); }
    .c-acc  { fill:var(--accent); }
  </style>
  <rect class="bg" x="0" y="0" width="940" height="416"/>

  <g id="the-call">
    <rect class="ask" x="16" y="14" width="908" height="48" rx="6"/>
    <text class="t-lbl" x="32" y="32">D1 · THE CALL</text>
    <text class="t-q" x="32" y="52">Where does the picker live, and where does today&#x27;s app go?</text>
  </g>

  <g id="options">
    <rect class="chosen" x="212" y="76" width="348" height="46" rx="5"/>
    <text class="t-tag c-code" x="228" y="93">CHOSEN</text>
    <text class="t-h c-code" x="228" y="112">Its own front page; a mode per address</text>
    <rect class="lost" x="576" y="76" width="348" height="46" rx="5"/>
    <text class="t-tag c-mute" x="592" y="93">INSTEAD OF</text>
    <text class="t-h c-lost" x="592" y="112">A switcher in one shell, Flow State at /</text>
  </g>

  <g id="row-1">
    <rect class="decide" x="16" y="134" width="908" height="62" rx="4"/>
    <rect class="bar" x="16" y="134" width="4" height="62"/>
    <text class="t-lbl" x="32" y="156">TODAY&#x27;S APP,</text>
    <text class="t-lbl" x="32" y="169">UNCHANGED?</text>
    <text class="t-tag c-acc" x="32" y="186">&#9656; DECIDES IT</text>
    <text class="mark plus" x="228" y="162">+</text>
    <text class="t-b" x="248" y="161">Moves whole to /flow-state</text>
    <text class="t-s" x="248" y="179">one header row added; nothing learns modes</text>
    <text class="mark minus" x="592" y="162">&#8722;</text>
    <text class="t-b" x="612" y="161">Carries the mode</text>
    <text class="t-s" x="612" y="179">threaded through a 948-line page</text>
  </g>

  <g id="row-2">
    <text class="t-lbl" x="32" y="218">EXISTING</text>
    <text class="t-lbl" x="32" y="231">BROWSER CHECKS</text>
    <text class="mark minus" x="228" y="218">&#8722;</text>
    <text class="t-b" x="248" y="217">6 files change address</text>
    <text class="t-s" x="248" y="235">8 e2e specs and 6 goals reach them</text>
    <text class="mark plus" x="592" y="218">+</text>
    <text class="t-b" x="612" y="217">None change</text>
    <text class="t-s" x="612" y="235">they still open /</text>
    <line class="row" x1="16" y1="254" x2="924" y2="254"/>
  </g>

  <g id="row-3">
    <text class="t-lbl" x="32" y="276">A LINK TO</text>
    <text class="t-lbl" x="32" y="289">ONE MODE</text>
    <text class="mark plus" x="228" y="276">+</text>
    <text class="t-b" x="248" y="275">/codex opens Codex</text>
    <text class="t-s" x="248" y="293">for the README, closure and bug reports</text>
    <text class="mark minus" x="592" y="276">&#8722;</text>
    <text class="t-b" x="612" y="275">One address</text>
    <text class="t-s" x="612" y="293">the mode rides in a query or in memory</text>
    <line class="row" x1="16" y1="312" x2="924" y2="312"/>
  </g>

  <g id="locks-in">
    <rect class="foot" x="16" y="326" width="446" height="74" rx="5"/>
    <text class="t-lbl" x="32" y="347">LOCKS IN</text>
    <text class="t-b" x="32" y="367">/ is the picker</text>
    <text class="t-s" x="32" y="385">an old bookmark of / lands one click away</text>
  </g>

  <g id="flips-if">
    <rect class="foot" x="478" y="326" width="446" height="74" rx="5"/>
    <text class="t-lbl" x="494" y="347">FLIPS IF</text>
    <text class="t-b" x="494" y="367">Kitchen Sink should reopen in the last mode</text>
    <text class="t-s" x="494" y="385">with the picker one click away, not in front</text>
  </g>
</svg>
