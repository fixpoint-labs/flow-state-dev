<svg viewBox="0 0 940 416" role="img" aria-label="D2: when may a coding harness mode run on this host? Chosen: on a git checkout, the one the host names or, in local development, the one the server runs from. Instead of: off until the host names one, as first reviewed. It comes down to the first run on a laptop: the chosen option runs with no setting, on the server's own checkout. A tie: both keep a production copy off unless the host names a repository. The price: a dev server someone else can reach runs an agent for them. Locks in harness modes on under pnpm dev, off in production without the setting, and off on Vercel always. Flips if dev servers turn out to be reachable by others."
     xmlns="http://www.w3.org/2000/svg">
  <style>
    :root { --surface:#FCFCFA; --surface-2:#E8E8E1; --ink:#191C21; --ink-2:#4C535B; --ink-3:#7A828B;
            --rule:#D5D4CB; --accent:#3E4E8C; --accent-soft:#E0E3F0; --code:#2C7C69; --code-soft:#DCEDE7;
            --gone:#A9544F; }
    @media (prefers-color-scheme: dark) {
      :root { --surface:#181C1F; --surface-2:#202528; --ink:#E6E8E5; --ink-2:#A4ACB1; --ink-3:#737B81;
              --rule:#2B3135; --accent:#8B9BD8; --accent-soft:#1B2140; --code:#5DBBA1; --code-soft:#14302A;
              --gone:#DE8A84; } }
    .bg     { fill:var(--surface); }
    .ask    { fill:var(--surface-2); }
    .chosen { fill:var(--code-soft); stroke:var(--code); stroke-width:1.6; }
    .recom  { fill:var(--code-soft); stroke:var(--code); stroke-width:1.6; stroke-dasharray:6 4; }
    .lost   { fill:var(--surface); stroke:var(--rule); stroke-width:1.4; stroke-dasharray:5 4; }
    .decide { fill:var(--accent-soft); }
    .bar    { fill:var(--accent); }
    .row    { stroke:var(--rule); stroke-width:1; }
    .foot   { fill:var(--surface-2); }
    .t-lbl  { fill:var(--ink-3); font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:9.5px; letter-spacing:.1em; }
    .t-tag  { font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:9.5px; letter-spacing:.1em; font-weight:600; }
    .t-q    { fill:var(--ink); font-family:system-ui,-apple-system,sans-serif; font-weight:600; font-size:15px; }
    .t-h    { font-family:system-ui,-apple-system,sans-serif; font-weight:600; font-size:14px; }
    .t-b    { fill:var(--ink); font-family:system-ui,-apple-system,sans-serif; font-size:12.5px; }
    .t-s    { fill:var(--ink-2); font-family:system-ui,-apple-system,sans-serif; font-size:11px; }
    .mark   { font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:16px; font-weight:700; }
    .plus   { fill:var(--code); }
    .minus  { fill:var(--gone); }
    .tie    { fill:var(--ink-3); }
    .c-code { fill:var(--code); }
    .c-mute { fill:var(--ink-3); }
    .c-lost { fill:var(--ink-2); }
    .c-acc  { fill:var(--accent); }
  </style>
  <rect class="bg" x="0" y="0" width="940" height="416"/>

  <g id="the-call">
    <rect class="ask" x="16" y="14" width="908" height="48" rx="6"/>
    <text class="t-lbl" x="32" y="32">D2 · THE CALL</text>
    <text class="t-q" x="32" y="52">When may a coding harness mode run on this host?</text>
  </g>

  <g id="options">
    <rect class="chosen" x="212" y="76" width="348" height="46" rx="5"/>
    <text class="t-tag c-code" x="228" y="93">CHOSEN</text>
    <text class="t-h c-code" x="228" y="112">On a checkout: named, or the dev server&#8217;s</text>
    <rect class="lost" x="576" y="76" width="348" height="46" rx="5"/>
    <text class="t-tag c-mute" x="592" y="93">INSTEAD OF</text>
    <text class="t-h c-lost" x="592" y="112">Off until the host names one</text>
  </g>

  <g id="row-1">
    <rect class="decide" x="16" y="134" width="908" height="62" rx="4"/>
    <rect class="bar" x="16" y="134" width="4" height="62"/>
    <text class="t-lbl" x="32" y="156">FIRST RUN</text>
    <text class="t-lbl" x="32" y="169">ON A LAPTOP</text>
    <text class="t-tag c-acc" x="32" y="186">&#9656; DECIDES IT</text>
    <text class="mark plus" x="228" y="162">+</text>
    <text class="t-b" x="248" y="161">Works at once with pnpm dev</text>
    <text class="t-s" x="248" y="179">on the checkout the server runs from</text>
    <text class="mark minus" x="592" y="162">&#8722;</text>
    <text class="t-b" x="612" y="161">One setting to add first</text>
    <text class="t-s" x="612" y="179">the reason names it</text>
  </g>

  <g id="row-2">
    <text class="t-lbl" x="32" y="218">A PRODUCTION</text>
    <text class="t-lbl" x="32" y="231">COPY</text>
    <text class="mark tie" x="228" y="218">=</text>
    <text class="t-b" x="248" y="217">Off unless the host names a repository</text>
    <text class="t-s" x="248" y="235">and Vercel off even then</text>
    <text class="mark tie" x="592" y="218">=</text>
    <text class="t-b" x="612" y="217">Off unless the host names a repository</text>
    <text class="t-s" x="612" y="235">and Vercel off even then</text>
    <line class="row" x1="16" y1="254" x2="924" y2="254"/>
  </g>

  <g id="row-3">
    <text class="t-lbl" x="32" y="276">A DEV SERVER</text>
    <text class="t-lbl" x="32" y="289">OTHERS REACH</text>
    <text class="mark minus" x="228" y="276">&#8722;</text>
    <text class="t-b" x="248" y="275">Runs an agent for them</text>
    <text class="t-s" x="248" y="293">over a tunnel or a shared machine</text>
    <text class="mark plus" x="592" y="276">+</text>
    <text class="t-b" x="612" y="275">Offers no harness</text>
    <text class="t-s" x="612" y="293">until the host names a repository</text>
    <line class="row" x1="16" y1="312" x2="924" y2="312"/>
  </g>

  <g id="locks-in">
    <rect class="foot" x="16" y="326" width="446" height="74" rx="5"/>
    <text class="t-lbl" x="32" y="347">LOCKS IN</text>
    <text class="t-b" x="32" y="367">pnpm dev shows the harness modes on</text>
    <text class="t-s" x="32" y="385">production off without the setting, Vercel always</text>
  </g>

  <g id="flips-if">
    <rect class="foot" x="478" y="326" width="446" height="74" rx="5"/>
    <text class="t-lbl" x="494" y="347">FLIPS IF</text>
    <text class="t-b" x="494" y="367">Dev servers turn out reachable by others</text>
    <text class="t-s" x="494" y="385">then off until named, in development too</text>
  </g>
</svg>
