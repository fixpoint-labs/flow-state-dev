<svg viewBox="0 0 940 474" role="img" aria-label="D1: where does a harness session work? Chosen: its own git worktree of the flow-state repository, on its own branch. Instead of: the main checkout every session shares, or an empty directory per session. It comes down to two sessions at once: in one checkout they overwrite each other with nothing to stop them. Both work on the real repository; an empty directory does not. The main checkout stays untouched only with a worktree. A tie: each is stable across turns. Locks in Kitchen Sink as a place to work on the repository itself, one branch per session, kept until the host clears it. Flips if sessions need to share one tree"
     xmlns="http://www.w3.org/2000/svg">
  <style>
    :root { --surface:#FCFCFA; --surface-2:#E8E8E1; --ink:#191C21; --ink-2:#4C535B; --ink-3:#7A828B;
            --rule:#D5D4CB; --accent:#3E4E8C; --accent-soft:#E0E3F0; --code:#2C7C69; --code-soft:#DCEDE7;
            --gone:#A9544F; }
    @media (prefers-color-scheme: dark) {
      :root { --surface:#181C1F; --surface-2:#202528; --ink:#E6E8E5; --ink-2:#A4ACB1; --ink-3:#737B81;
              --rule:#2B3135; --accent:#8B9BD8; --accent-soft:#1B2140; --code:#5DBBA1; --code-soft:#14302A;
              --gone:#DE8A84; } }
    .bg     { fill:var(--surface); }
    .ask    { fill:var(--surface-2); }
    .chosen { fill:var(--code-soft); stroke:var(--code); stroke-width:1.6; }
    .lost   { fill:var(--surface); stroke:var(--rule); stroke-width:1.4; stroke-dasharray:5 4; }
    .decide { fill:var(--accent-soft); }
    .bar    { fill:var(--accent); }
    .row    { stroke:var(--rule); stroke-width:1; }
    .foot   { fill:var(--surface-2); }
    .t-lbl  { fill:var(--ink-3); font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:9.5px; letter-spacing:.1em; }
    .t-tag  { font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:9.5px; letter-spacing:.1em; font-weight:600; }
    .t-q    { fill:var(--ink); font-family:system-ui,-apple-system,sans-serif; font-weight:600; font-size:15px; }
    .t-h    { font-family:system-ui,-apple-system,sans-serif; font-weight:600; font-size:14px; }
    .t-b    { fill:var(--ink); font-family:system-ui,-apple-system,sans-serif; font-size:12.5px; }
    .t-s    { fill:var(--ink-2); font-family:system-ui,-apple-system,sans-serif; font-size:11px; }
    .mark   { font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:16px; font-weight:700; }
    .plus   { fill:var(--code); }
    .minus  { fill:var(--gone); }
    .tie    { fill:var(--ink-3); }
    .c-code { fill:var(--code); }
    .c-mute { fill:var(--ink-3); }
    .c-lost { fill:var(--ink-2); }
    .c-acc  { fill:var(--accent); }
  </style>
  <rect class="bg" x="0" y="0" width="940" height="474"/>

  <g id="the-call">
    <rect class="ask" x="16" y="14" width="908" height="48" rx="6"/>
    <text class="t-lbl" x="32" y="32">D1 · THE CALL</text>
    <text class="t-q" x="32" y="52">Where does a harness session do its work?</text>
  </g>

  <g id="options">
    <rect class="chosen" x="212" y="76" width="348" height="46" rx="5"/>
    <text class="t-tag c-code" x="228" y="93">CHOSEN</text>
    <text class="t-h c-code" x="228" y="112">Its own worktree of the repository</text>
    <rect class="lost" x="576" y="76" width="348" height="46" rx="5"/>
    <text class="t-tag c-mute" x="592" y="93">INSTEAD OF</text>
    <text class="t-h c-lost" x="592" y="112">The main checkout, shared</text>
  </g>

  <g id="row-1">
    <rect class="decide" x="16" y="134" width="908" height="62" rx="4"/>
    <rect class="bar" x="16" y="134" width="4" height="62"/>
    <text class="t-lbl" x="32" y="156">TWO SESSIONS</text>
    <text class="t-lbl" x="32" y="169">AT ONCE</text>
    <text class="t-tag c-acc" x="32" y="186">&#9656; DECIDES IT</text>
    <text class="mark plus" x="228" y="162">+</text>
    <text class="t-b" x="248" y="161">Each on its own branch and tree</text>
    <text class="t-s" x="248" y="179">no two live runs share a tree</text>
    <text class="mark minus" x="592" y="162">&#8722;</text>
    <text class="t-b" x="612" y="161">They overwrite each other</text>
    <text class="t-s" x="612" y="179">nothing stops it: the queue is per session</text>
  </g>

  <g id="row-2">
    <text class="t-lbl" x="32" y="218">YOUR MAIN</text>
    <text class="t-lbl" x="32" y="231">CHECKOUT</text>
    <text class="mark plus" x="228" y="224">+</text>
    <text class="t-b" x="248" y="223">Untouched</text>
    <text class="t-s" x="248" y="241">a session&#x27;s edits stay on its branch</text>
    <text class="mark minus" x="592" y="224">&#8722;</text>
    <text class="t-b" x="612" y="223">Edited directly</text>
    <text class="t-s" x="612" y="241">mixed with whatever you have open</text>
    <line class="row" x1="16" y1="252" x2="924" y2="252"/>
  </g>

  <g id="row-3">
    <text class="t-lbl" x="32" y="276">WHAT IT</text>
    <text class="t-lbl" x="32" y="289">WORKS ON</text>
    <text class="mark tie" x="228" y="282">=</text>
    <text class="t-b" x="248" y="281">The real repository</text>
    <text class="t-s" x="248" y="299">cut from your checkout, nothing fetched</text>
    <text class="mark tie" x="592" y="282">=</text>
    <text class="t-b" x="612" y="281">The real repository</text>
    <text class="t-s" x="612" y="299">the round-1 empty directory lost here</text>
    <line class="row" x1="16" y1="310" x2="924" y2="310"/>
  </g>

  <g id="row-4">
    <text class="t-lbl" x="32" y="334">ACROSS</text>
    <text class="t-lbl" x="32" y="347">TURNS</text>
    <text class="mark tie" x="228" y="340">=</text>
    <text class="t-b" x="248" y="339">Stable</text>
    <text class="t-s" x="248" y="357">keyed on the session, never moves</text>
    <text class="mark tie" x="592" y="340">=</text>
    <text class="t-b" x="612" y="339">Stable</text>
    <text class="t-s" x="612" y="357">the same directory every turn</text>
    <line class="row" x1="16" y1="368" x2="924" y2="368"/>
  </g>

  <g id="locks-in">
    <rect class="foot" x="16" y="384" width="446" height="74" rx="5"/>
    <text class="t-lbl" x="32" y="405">LOCKS IN</text>
    <text class="t-b" x="32" y="425">Work on the repository itself, a branch per session</text>
    <text class="t-s" x="32" y="443">kept, never merged or pushed, until the host clears it</text>
  </g>

  <g id="flips-if">
    <rect class="foot" x="478" y="384" width="446" height="74" rx="5"/>
    <text class="t-lbl" x="494" y="405">FLIPS IF</text>
    <text class="t-b" x="494" y="425">Sessions need to work in one shared tree</text>
    <text class="t-s" x="494" y="443">then a shared checkout with a cross-session lock</text>
  </g>
</svg>
