<svg viewBox="0 0 940 416" role="img" aria-label="D2: what happens when Claude Code won&#x27;t continue a session&#x27;s conversation? Chosen: show it refused on every turn and keep the id. Instead of: drop the id and start fresh with a notice. It comes down to whether a resume bug can hide: dropping the id makes the next turn pass. The price: a conversation that is really gone keeps the session stuck until the person starts a new one. A passing failure recovers on its own only if the id is kept. Locks in one session, one conversation. Flips if conversations that are gone for good turn out to be common."
     xmlns="http://www.w3.org/2000/svg">
  <style>
    :root { --surface:#FCFCFA; --surface-2:#E8E8E1; --ink:#191C21; --ink-2:#4C535B; --ink-3:#7A828B;
            --rule:#D5D4CB; --accent:#3E4E8C; --accent-soft:#E0E3F0; --code:#2C7C69; --code-soft:#DCEDE7;
            --gone:#A9544F; }
    @media (prefers-color-scheme: dark) {
      :root { --surface:#181C1F; --surface-2:#202528; --ink:#E6E8E5; --ink-2:#A4ACB1; --ink-3:#737B81;
              --rule:#2B3135; --accent:#8B9BD8; --accent-soft:#1B2140; --code:#5DBBA1; --code-soft:#14302A;
              --gone:#DE8A84; } }
    .bg     { fill:var(--surface); }
    .ask    { fill:var(--surface-2); }
    .chosen { fill:var(--code-soft); stroke:var(--code); stroke-width:1.6; }
    .lost   { fill:var(--surface); stroke:var(--rule); stroke-width:1.4; stroke-dasharray:5 4; }
    .decide { fill:var(--accent-soft); }
    .bar    { fill:var(--accent); }
    .row    { stroke:var(--rule); stroke-width:1; }
    .foot   { fill:var(--surface-2); }
    .t-lbl  { fill:var(--ink-3); font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:9.5px; letter-spacing:.1em; }
    .t-tag  { font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:9.5px; letter-spacing:.1em; font-weight:600; }
    .t-q    { fill:var(--ink); font-family:system-ui,-apple-system,sans-serif; font-weight:600; font-size:15px; }
    .t-h    { font-family:system-ui,-apple-system,sans-serif; font-weight:600; font-size:14px; }
    .t-b    { fill:var(--ink); font-family:system-ui,-apple-system,sans-serif; font-size:12.5px; }
    .t-s    { fill:var(--ink-2); font-family:system-ui,-apple-system,sans-serif; font-size:11px; }
    .mark   { font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:16px; font-weight:700; }
    .plus   { fill:var(--code); }
    .minus  { fill:var(--gone); }
    .tie    { fill:var(--ink-3); }
    .c-code { fill:var(--code); }
    .c-mute { fill:var(--ink-3); }
    .c-lost { fill:var(--ink-2); }
    .c-acc  { fill:var(--accent); }
  </style>
  <rect class="bg" x="0" y="0" width="940" height="416"/>

  <g id="the-call">
    <rect class="ask" x="16" y="14" width="908" height="48" rx="6"/>
    <text class="t-lbl" x="32" y="32">D2 · THE CALL</text>
    <text class="t-q" x="32" y="52">Claude Code won&#x27;t continue a session&#x27;s conversation. Then what?</text>
  </g>

  <g id="options">
    <rect class="chosen" x="212" y="76" width="348" height="46" rx="5"/>
    <text class="t-tag c-code" x="228" y="93">CHOSEN</text>
    <text class="t-h c-code" x="228" y="112">Show it refused, every turn</text>
    <rect class="lost" x="576" y="76" width="348" height="46" rx="5"/>
    <text class="t-tag c-mute" x="592" y="93">INSTEAD OF</text>
    <text class="t-h c-lost" x="592" y="112">Drop the id, start fresh, show a notice</text>
  </g>

  <g id="row-1">
    <rect class="decide" x="16" y="134" width="908" height="62" rx="4"/>
    <rect class="bar" x="16" y="134" width="4" height="62"/>
    <text class="t-lbl" x="32" y="156">CAN A RESUME</text>
    <text class="t-lbl" x="32" y="169">BUG HIDE</text>
    <text class="t-tag c-acc" x="32" y="186">&#9656; DECIDES IT</text>
    <text class="mark plus" x="228" y="162">+</text>
    <text class="t-b" x="248" y="161">No: every turn says so</text>
    <text class="t-s" x="248" y="179">the gap stays in front of the person</text>
    <text class="mark minus" x="592" y="162">&#8722;</text>
    <text class="t-b" x="612" y="161">Yes: the next turn passes</text>
    <text class="t-s" x="612" y="179">a notice once, then a working session</text>
  </g>

  <g id="row-2">
    <text class="t-lbl" x="32" y="218">A CONVERSATION</text>
    <text class="t-lbl" x="32" y="231">GONE FOR GOOD</text>
    <text class="mark minus" x="228" y="224">&#8722;</text>
    <text class="t-b" x="248" y="223">The session stays stuck</text>
    <text class="t-s" x="248" y="241">the person starts a new session</text>
    <text class="mark plus" x="592" y="224">+</text>
    <text class="t-b" x="612" y="223">The session carries on</text>
    <text class="t-s" x="612" y="241">in a new conversation</text>
    <line class="row" x1="16" y1="252" x2="924" y2="252"/>
  </g>

  <g id="row-3">
    <text class="t-lbl" x="32" y="276">A PASSING</text>
    <text class="t-lbl" x="32" y="289">FAILURE</text>
    <text class="mark plus" x="228" y="282">+</text>
    <text class="t-b" x="248" y="281">Recovers on the next turn</text>
    <text class="t-s" x="248" y="299">the id was kept</text>
    <text class="mark minus" x="592" y="282">&#8722;</text>
    <text class="t-b" x="612" y="281">The conversation is lost</text>
    <text class="t-s" x="612" y="299">the id was dropped on the first failure</text>
    <line class="row" x1="16" y1="310" x2="924" y2="310"/>
  </g>

  <g id="locks-in">
    <rect class="foot" x="16" y="326" width="446" height="74" rx="5"/>
    <text class="t-lbl" x="32" y="347">LOCKS IN</text>
    <text class="t-b" x="32" y="367">One session, one harness conversation</text>
    <text class="t-s" x="32" y="385">the id moves only when the harness confirms it</text>
  </g>

  <g id="flips-if">
    <rect class="foot" x="478" y="326" width="446" height="74" rx="5"/>
    <text class="t-lbl" x="494" y="347">FLIPS IF</text>
    <text class="t-b" x="494" y="367">Gone-for-good conversations turn out to be common</text>
    <text class="t-s" x="494" y="385">then a start-over action the person presses</text>
  </g>
</svg>
