<svg viewBox="0 0 940 476" role="img" aria-label="D2: Cursor&#x27;s to-do items reach us with no id, so which row is which item? Chosen: its place in Cursor&#x27;s list. Instead of: its wording. When Cursor moves one item&#x27;s status, both keep the row and its previous status. It comes down to rewording: by place the row takes the new wording; by wording a new row starts and the old one is stranded. Two items with the same wording stay two rows by place and collapse into one by wording. The price of place: when Cursor inserts or reorders, rows after that point change item, and a reader cannot follow one item through it. Locks in a place key for Cursor rows in the shared record, and a list that shrinks drops the rows past its end. Flips if Cursor&#x27;s SDK starts passing the id it already has."
     xmlns="http://www.w3.org/2000/svg">
  <style>
    :root { --surface:#FCFCFA; --surface-2:#E8E8E1; --ink:#191C21; --ink-2:#4C535B; --ink-3:#7A828B;
            --rule:#D5D4CB; --accent:#3E4E8C; --accent-soft:#E0E3F0; --code:#2C7C69; --code-soft:#DCEDE7;
            --gone:#A9544F; }
    @media (prefers-color-scheme: dark) {
      :root { --surface:#181C1F; --surface-2:#202528; --ink:#E6E8E5; --ink-2:#A4ACB1; --ink-3:#737B81;
              --rule:#2B3135; --accent:#8B9BD8; --accent-soft:#1B2140; --code:#5DBBA1; --code-soft:#14302A;
              --gone:#DE8A84; } }
    .bg     { fill:var(--surface); }
    .ask    { fill:var(--surface-2); }
    .chosen { fill:var(--code-soft); stroke:var(--code); stroke-width:1.6; }
    .lost   { fill:var(--surface); stroke:var(--rule); stroke-width:1.4; stroke-dasharray:5 4; }
    .decide { fill:var(--accent-soft); }
    .bar    { fill:var(--accent); }
    .row    { stroke:var(--rule); stroke-width:1; }
    .foot   { fill:var(--surface-2); }
    .t-lbl  { fill:var(--ink-3); font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:9.5px; letter-spacing:.1em; }
    .t-tag  { font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:9.5px; letter-spacing:.1em; font-weight:600; }
    .t-q    { fill:var(--ink); font-family:system-ui,-apple-system,sans-serif; font-weight:600; font-size:15px; }
    .t-h    { font-family:system-ui,-apple-system,sans-serif; font-weight:600; font-size:14px; }
    .t-b    { fill:var(--ink); font-family:system-ui,-apple-system,sans-serif; font-size:12.5px; }
    .t-s    { fill:var(--ink-2); font-family:system-ui,-apple-system,sans-serif; font-size:11px; }
    .mark   { font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:16px; font-weight:700; }
    .plus   { fill:var(--code); }
    .minus  { fill:var(--gone); }
    .tie    { fill:var(--ink-3); }
    .c-code { fill:var(--code); }
    .c-mute { fill:var(--ink-3); }
    .c-lost { fill:var(--ink-2); }
    .c-acc  { fill:var(--accent); }
  </style>

  <rect class="bg" x="0" y="0" width="940" height="476"/>

  <g id="the-call">
    <rect class="ask" x="16" y="14" width="908" height="48" rx="6"/>
    <text class="t-lbl" x="32" y="32">D2 · THE CALL</text>
    <text class="t-q" x="32" y="52">Cursor&#x27;s to-do items reach us with no id. Which row is which item?</text>
  </g>

  <g id="options">
    <rect class="chosen" x="212" y="76" width="348" height="46" rx="5"/>
    <text class="t-tag c-code" x="228" y="93">CHOSEN</text>
    <text class="t-h c-code" x="228" y="112">Its place in Cursor&#x27;s list</text>
    <rect class="lost" x="576" y="76" width="348" height="46" rx="5"/>
    <text class="t-tag c-mute" x="592" y="93">INSTEAD OF</text>
    <text class="t-h c-lost" x="592" y="112">Its wording</text>
  </g>

  <g id="row-1">
    <text class="t-lbl" x="32" y="156">A STATUS</text>
    <text class="t-lbl" x="32" y="169">MOVES</text>
    <text class="mark tie" x="228" y="162">=</text>
    <text class="t-b" x="248" y="161">Same row, previous status kept</text>
    <text class="t-s" x="248" y="179">the common update</text>
    <text class="mark tie" x="592" y="162">=</text>
    <text class="t-b" x="612" y="161">Same row, previous status kept</text>
    <text class="t-s" x="612" y="179">while the wording holds</text>
    <line class="row" x1="16" y1="190" x2="924" y2="190"/>
  </g>
  <g id="row-2">
    <rect class="decide" x="16" y="192" width="908" height="62" rx="4"/>
    <rect class="bar" x="16" y="192" width="4" height="62"/>
    <text class="t-lbl" x="32" y="214">AN ITEM IS</text>
    <text class="t-lbl" x="32" y="227">REWORDED</text>
    <text class="t-tag c-acc" x="32" y="244">&#9656; DECIDES IT</text>
    <text class="mark plus" x="228" y="220">+</text>
    <text class="t-b" x="248" y="219">Same row, new wording</text>
    <text class="t-s" x="248" y="237">its previous status cleared</text>
    <text class="mark minus" x="592" y="220">&#8722;</text>
    <text class="t-b" x="612" y="219">A new row, the old one stranded</text>
    <text class="t-s" x="612" y="237">the list grows by one each time</text>
  </g>
  <g id="row-3">
    <text class="t-lbl" x="32" y="276">TWO ITEMS</text>
    <text class="t-lbl" x="32" y="289">SAY THE SAME</text>
    <text class="mark plus" x="228" y="282">+</text>
    <text class="t-b" x="248" y="281">Two rows</text>
    <text class="t-s" x="248" y="299">each in its place</text>
    <text class="mark minus" x="592" y="282">&#8722;</text>
    <text class="t-b" x="612" y="281">One row</text>
    <text class="t-s" x="612" y="299">the second overwrites the first</text>
    <line class="row" x1="16" y1="310" x2="924" y2="310"/>
  </g>
  <g id="row-4">
    <text class="t-lbl" x="32" y="334">CURSOR</text>
    <text class="t-lbl" x="32" y="347">REORDERS</text>
    <text class="mark minus" x="228" y="340">&#8722;</text>
    <text class="t-b" x="248" y="339">Rows after that point change item</text>
    <text class="t-s" x="248" y="357">a reader cannot follow one through</text>
    <text class="mark plus" x="592" y="340">+</text>
    <text class="t-b" x="612" y="339">Each item keeps its row</text>
    <text class="t-s" x="612" y="357">if its wording held</text>
    <line class="row" x1="16" y1="368" x2="924" y2="368"/>
  </g>

  <g id="locks-in">
    <rect class="foot" x="16" y="386" width="446" height="74" rx="5"/>
    <text class="t-lbl" x="32" y="407">LOCKS IN</text>
    <text class="t-b" x="32" y="427">Cursor rows keyed by place in the shared record</text>
    <text class="t-s" x="32" y="445">a list that shrinks drops the rows past its end</text>
  </g>

  <g id="flips-if">
    <rect class="foot" x="478" y="386" width="446" height="74" rx="5"/>
    <text class="t-lbl" x="494" y="407">FLIPS IF</text>
    <text class="t-b" x="494" y="427">Cursor&#x27;s SDK passes the id it already has</text>
    <text class="t-s" x="494" y="445">then key by that id, in the release that pins it</text>
  </g>
</svg>
