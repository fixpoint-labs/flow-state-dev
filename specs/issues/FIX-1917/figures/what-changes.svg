<svg viewBox="0 0 940 420" role="img" aria-label="Before and after, in three layers: app, harness package, core. Before: no app runs Cursor; the Cursor block shows each to-do update only as a tool step, its summaries as status notes, and records nothing; it declares no session state. After: Kitchen Sink's Cursor mode is the shared harness session flow from FIX-1915 with Cursor's block options, sessions of kind cursor-session, the session view and the plan panel. The Cursor block, with plan recording turned on, still shows each to-do update as a step, and also writes the whole list Cursor confirms into the plan record in core, one row per place in the list. Recording is off by default, so a task board hands the block off unchanged. The plan record shape in core is FIX-1915's, unchanged."
     xmlns="http://www.w3.org/2000/svg">
  <style>
    :root { --surface:#FCFCFA; --surface-2:#E8E8E1; --ink:#191C21; --ink-2:#4C535B; --ink-3:#7A828B;
            --rule:#D5D4CB; --accent:#3E4E8C; --accent-soft:#E0E3F0; --code:#2C7C69; --code-soft:#DCEDE7;
            --gone:#A9544F; }
    @media (prefers-color-scheme: dark) {
      :root { --surface:#181C1F; --surface-2:#202528; --ink:#E6E8E5; --ink-2:#A4ACB1; --ink-3:#737B81;
              --rule:#2B3135; --accent:#8B9BD8; --accent-soft:#1B2140; --code:#5DBBA1; --code-soft:#14302A;
              --gone:#DE8A84; } }
    .bg    { fill:var(--surface); }
    .band  { fill:var(--surface-2); }
    .box   { fill:var(--surface); stroke:var(--rule); stroke-width:1.2; }
    .new   { fill:var(--code-soft); stroke:var(--code); stroke-width:1.6; }
    .moved { fill:var(--accent-soft); stroke:var(--accent); stroke-width:1.4; stroke-dasharray:5 3; }
    .old   { fill:var(--surface); stroke:var(--gone); stroke-width:1.4; stroke-dasharray:5 4; }
    .arr   { stroke:var(--ink-3); stroke-width:1.3; fill:none; }
    .arrn  { stroke:var(--code); stroke-width:1.5; fill:none; }
    .t-lbl { fill:var(--ink-3); font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:9.5px; letter-spacing:.1em; }
    .t-h   { fill:var(--ink); font-family:system-ui,-apple-system,sans-serif; font-weight:600; font-size:14px; }
    .t-b   { fill:var(--ink); font-family:system-ui,-apple-system,sans-serif; font-size:12px; }
    .t-s   { fill:var(--ink-2); font-family:system-ui,-apple-system,sans-serif; font-size:10.5px; }
    .c-gone { fill:var(--gone); }
    .c-code { fill:var(--code); }
  </style>
  <rect class="bg" x="0" y="0" width="940" height="420"/>

  <g id="headers">
    <text class="t-h" x="96" y="28">Today</text>
    <text class="t-h" x="560" y="28">After</text>
  </g>

  <g id="bands">
    <rect class="band" x="16" y="42" width="908" height="128" rx="4"/>
    <text class="t-lbl" x="24" y="58">APP</text>
    <rect class="band" x="16" y="180" width="908" height="110" rx="4"/>
    <text class="t-lbl" x="24" y="196">HARNESS</text>
    <rect class="band" x="16" y="300" width="908" height="104" rx="4"/>
    <text class="t-lbl" x="24" y="316">CORE</text>
    <line x1="470" y1="36" x2="470" y2="410" stroke="var(--rule)" stroke-width="1.4"/>
  </g>

  <g id="before">
    <rect class="old" x="96" y="70" width="340" height="40" rx="5"/>
    <text class="t-b c-gone" x="108" y="88">no app runs Cursor</text>
    <text class="t-s" x="108" y="102">unit tests and a scripted client only</text>
    <rect class="box" x="96" y="204" width="340" height="74" rx="5"/>
    <text class="t-b" x="108" y="222">Cursor block</text>
    <text class="t-s" x="108" y="238">a to-do update shows only as a tool step</text>
    <text class="t-s" x="108" y="252">its summaries show as status notes</text>
    <text class="t-s" x="108" y="266">records nothing · declares no session state</text>
    <rect class="box" x="96" y="326" width="340" height="52" rx="5"/>
    <text class="t-b" x="108" y="346">plan record shape</text>
    <text class="t-s" x="108" y="362">in core after FIX-1915 · Cursor never writes it</text>
  </g>

  <g id="after">
    <rect class="new" x="560" y="66" width="364" height="42" rx="5"/>
    <text class="t-b c-code" x="572" y="84">Kitchen Sink · Cursor mode</text>
    <text class="t-s" x="572" y="98">FIX-1915's session view and plan panel, unchanged</text>
    <rect class="box" x="560" y="118" width="364" height="44" rx="5"/>
    <text class="t-b" x="572" y="136">FIX-1915's harness session flow · cursor-session</text>
    <text class="t-s" x="572" y="151">Cursor differs only by its block's options</text>
    <rect class="new" x="560" y="204" width="364" height="74" rx="5"/>
    <text class="t-b c-code" x="572" y="222">Cursor block · plan recording on</text>
    <text class="t-s" x="572" y="238">each to-do update still shows as a step</text>
    <text class="t-s" x="572" y="252">and the whole list Cursor confirms is written, a row per place</text>
    <text class="t-s" x="572" y="266">off by default: a task board hands it off unchanged</text>
    <rect class="box" x="560" y="326" width="364" height="52" rx="5"/>
    <text class="t-b" x="572" y="346">plan record shape · unchanged</text>
    <text class="t-s" x="572" y="362">Cursor's rows, in Cursor's own status words</text>
    <path class="arr" d="M660 162 V204"/>
    <path class="arrn" d="M660 278 V326"/>
    <path class="arrn" d="M912 326 V108"/>
    <text class="t-s" x="806" y="314">the panel reads it</text>
  </g>
</svg>
