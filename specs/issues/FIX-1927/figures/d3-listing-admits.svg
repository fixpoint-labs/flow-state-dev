<svg viewBox="0 0 940 420" role="img" aria-label="D3, what lets the host fetch a listed checkout&#x27;s upstream. Chosen: listing the checkout admits fetching its own upstream branch, with the URL still judged for shape. Instead of: only when the host&#x27;s remotes allowlist admits the upstream. It comes down to the first row, the Lab, which allows no remote: the chosen option fetches the checkout&#x27;s upstream, the other never fetches, so the headline case stays stale. The price is the second row: the host contacts a host its allowlist does not name, the checkout&#x27;s own upstream, where under the allowlist rule the list says everything. Third row, a tie: a project you add with a GitHub remote is refused either way. Locks in: the Lab contacts its checkout&#x27;s upstream on each new run. Flips if: an operator needs a host that makes no network call."
     xmlns="http://www.w3.org/2000/svg">
  <style>
    :root { --surface:#FCFCFA; --surface-2:#E8E8E1; --ink:#191C21; --ink-2:#4C535B; --ink-3:#7A828B;
            --rule:#D5D4CB; --accent:#3E4E8C; --accent-soft:#E0E3F0; --code:#2C7C69; --code-soft:#DCEDE7;
            --gone:#A9544F; }
    @media (prefers-color-scheme: dark) {
      :root { --surface:#181C1F; --surface-2:#202528; --ink:#E6E8E5; --ink-2:#A4ACB1; --ink-3:#737B81;
              --rule:#2B3135; --accent:#8B9BD8; --accent-soft:#1B2140; --code:#5DBBA1; --code-soft:#14302A;
              --gone:#DE8A84; } }
    .bg     { fill:var(--surface); }
    .ask    { fill:var(--surface-2); }
    .chosen { fill:var(--code-soft); stroke:var(--code); stroke-width:1.6; }
    .lost   { fill:var(--surface); stroke:var(--rule); stroke-width:1.4; stroke-dasharray:5 4; }
    .decide { fill:var(--accent-soft); }
    .bar    { fill:var(--accent); }
    .row    { stroke:var(--rule); stroke-width:1; }
    .foot   { fill:var(--surface-2); }
    .t-lbl  { fill:var(--ink-3); font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:9.5px; letter-spacing:.1em; }
    .t-tag  { font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:9.5px; letter-spacing:.1em; font-weight:600; }
    .t-q    { fill:var(--ink); font-family:system-ui,-apple-system,sans-serif; font-weight:600; font-size:15px; }
    .t-h    { font-family:system-ui,-apple-system,sans-serif; font-weight:600; font-size:14px; }
    .t-b    { fill:var(--ink); font-family:system-ui,-apple-system,sans-serif; font-size:12.5px; }
    .t-s    { fill:var(--ink-2); font-family:system-ui,-apple-system,sans-serif; font-size:11px; }
    .mark   { font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:16px; font-weight:700; }
    .plus   { fill:var(--code); }
    .minus  { fill:var(--gone); }
    .tie    { fill:var(--ink-3); }
    .c-code { fill:var(--code); }
    .c-mute { fill:var(--ink-3); }
    .c-lost { fill:var(--ink-2); }
    .c-acc  { fill:var(--accent); }
  </style>
  <rect class="bg" x="0" y="0" width="940" height="420"/>

  <g id="the-call">
    <rect class="ask" x="16" y="14" width="908" height="48" rx="6"/>
    <text class="t-lbl" x="32" y="32">D3 · THE CALL</text>
    <text class="t-q" x="32" y="52">What lets the host fetch the upstream of a checkout you listed?</text>
  </g>

  <g id="options">
    <rect class="chosen" x="212" y="76" width="348" height="46" rx="5"/>
    <text class="t-tag c-code" x="228" y="93">CHOSEN</text>
    <text class="t-h c-code" x="228" y="112">Listing the checkout admits it</text>
    <rect class="lost" x="576" y="76" width="348" height="46" rx="5"/>
    <text class="t-tag c-mute" x="592" y="93">INSTEAD OF</text>
    <text class="t-h c-lost" x="592" y="112">Only remotes.allow admits it</text>
  </g>

  <g id="row-decides">
    <rect class="decide" x="16" y="134" width="908" height="62" rx="4"/>
    <rect class="bar" x="16" y="134" width="4" height="62"/>
    <text class="t-lbl" x="32" y="156">THE LAB, WHICH</text>
    <text class="t-lbl" x="32" y="169">ALLOWS NO REMOTE</text>
    <text class="t-tag c-acc" x="32" y="186">▸ DECIDES IT</text>
    <text class="mark plus" x="228" y="162">+</text>
    <text class="t-b" x="248" y="161">Fetches the checkout&#x27;s upstream</text>
    <text class="t-s" x="248" y="179">the run starts current</text>
    <text class="mark minus" x="592" y="162">−</text>
    <text class="t-b" x="612" y="161">Never fetches</text>
    <text class="t-s" x="612" y="179">stale as today; adding github.com starts cloning</text>
  </g>

  <g id="row-1">
    <text class="t-lbl" x="32" y="222">WHAT THE HOST</text>
    <text class="t-lbl" x="32" y="235">CONTACTS</text>
    <text class="mark minus" x="228" y="224">−</text>
    <text class="t-b" x="248" y="223">One host its allowlist doesn&#x27;t name</text>
    <text class="t-s" x="248" y="241">the checkout&#x27;s own upstream, nothing else</text>
    <text class="mark plus" x="592" y="224">+</text>
    <text class="t-b" x="612" y="223">The allowlist says everything</text>
    <text class="t-s" x="612" y="241">no exceptions to read</text>
    <line class="row" x1="16" y1="252" x2="924" y2="252"/>
  </g>

  <g id="row-2">
    <text class="t-lbl" x="32" y="280">A PROJECT YOU ADD</text>
    <text class="t-lbl" x="32" y="293">ON GITHUB</text>
    <text class="mark tie" x="228" y="282">=</text>
    <text class="t-b" x="248" y="281">Refused by name</text>
    <text class="t-s" x="248" y="299">the allowlist still decides clones</text>
    <text class="mark tie" x="592" y="282">=</text>
    <text class="t-b" x="612" y="281">Refused by name</text>
    <text class="t-s" x="612" y="299">the same</text>
    <line class="row" x1="16" y1="310" x2="924" y2="310"/>
  </g>

  <g id="locks-in">
    <rect class="foot" x="16" y="330" width="446" height="74" rx="5"/>
    <text class="t-lbl" x="32" y="351">LOCKS IN</text>
    <text class="t-b" x="32" y="371">The Lab contacts its checkout&#x27;s upstream on new runs</text>
    <text class="t-s" x="32" y="389">&quot;reaches no git remote&quot; is no longer true</text>
  </g>

  <g id="flips-if">
    <rect class="foot" x="478" y="330" width="446" height="74" rx="5"/>
    <text class="t-lbl" x="494" y="351">FLIPS IF</text>
    <text class="t-b" x="494" y="371">An operator needs a host with no network calls</text>
    <text class="t-s" x="494" y="389">then an off switch, or the allowlist rule</text>
  </g>
</svg>
