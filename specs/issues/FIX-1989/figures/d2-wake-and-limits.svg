<svg viewBox="0 0 940 422" role="img" aria-label="D2, whether a message wakes its recipient and when worker talk stops. Chosen: every message wakes, with a hop limit of 6 between person turns and 3 sends per turn. Instead of: the sender marking an FYI that does not wake. It comes down to the first row: whether the recipient sees the message; under the chosen option it sees it in a turn it runs, under the other it is read only by luck. The price is the second row: each message costs the recipient a turn, while FYIs would be free. The third row is about loops: the chosen option stops after 6 and a person restarts it; the other option needs the same limit anyway. Locks in: 6 worker messages between person turns, both limits Lab settings. Flips if: FYI turns become a real cost."
     xmlns="http://www.w3.org/2000/svg">
  <style>
    :root { --surface:#FCFCFA; --surface-2:#E8E8E1; --ink:#191C21; --ink-2:#4C535B; --ink-3:#7A828B;
            --rule:#D5D4CB; --accent:#3E4E8C; --accent-soft:#E0E3F0; --code:#2C7C69; --code-soft:#DCEDE7;
            --gone:#A9544F; }
    @media (prefers-color-scheme: dark) {
      :root { --surface:#181C1F; --surface-2:#202528; --ink:#E6E8E5; --ink-2:#A4ACB1; --ink-3:#737B81;
              --rule:#2B3135; --accent:#8B9BD8; --accent-soft:#1B2140; --code:#5DBBA1; --code-soft:#14302A;
              --gone:#DE8A84; } }
    .bg     { fill:var(--surface); }
    .ask    { fill:var(--surface-2); }
    .chosen { fill:var(--code-soft); stroke:var(--code); stroke-width:1.6; }
    .lost   { fill:var(--surface); stroke:var(--rule); stroke-width:1.4; stroke-dasharray:5 4; }
    .decide { fill:var(--accent-soft); }
    .bar    { fill:var(--accent); }
    .row    { stroke:var(--rule); stroke-width:1; }
    .foot   { fill:var(--surface-2); }
    .t-lbl  { fill:var(--ink-3); font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:9.5px; letter-spacing:.1em; }
    .t-tag  { font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:9.5px; letter-spacing:.1em; font-weight:600; }
    .t-q    { fill:var(--ink); font-family:system-ui,-apple-system,sans-serif; font-weight:600; font-size:15px; }
    .t-h    { font-family:system-ui,-apple-system,sans-serif; font-weight:600; font-size:14px; }
    .t-b    { fill:var(--ink); font-family:system-ui,-apple-system,sans-serif; font-size:12.5px; }
    .t-s    { fill:var(--ink-2); font-family:system-ui,-apple-system,sans-serif; font-size:11px; }
    .mark   { font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:16px; font-weight:700; }
    .plus   { fill:var(--code); }
    .minus  { fill:var(--gone); }
    .tie    { fill:var(--ink-3); }
    .c-code { fill:var(--code); }
    .c-mute { fill:var(--ink-3); }
    .c-lost { fill:var(--ink-2); }
    .c-acc  { fill:var(--accent); }
  </style>

  <rect class="bg" x="0" y="0" width="940" height="422"/>

  <g id="the-call">
    <rect class="ask" x="16" y="14" width="908" height="48" rx="6"/>
    <text class="t-lbl" x="32" y="32">D2 · THE CALL</text>
    <text class="t-q" x="32" y="52">Does a message wake its recipient, and when does talk stop?</text>
  </g>

  <g id="options">
    <rect class="chosen" x="212" y="76" width="348" height="46" rx="5"/>
    <text class="t-tag c-code" x="228" y="93">CHOSEN</text>
    <text class="t-h c-code" x="228" y="112">Always wakes · 6 hops, then stop</text>
    <rect class="lost" x="576" y="76" width="348" height="46" rx="5"/>
    <text class="t-tag c-mute" x="592" y="93">INSTEAD OF</text>
    <text class="t-h c-lost" x="592" y="112">Sender marks FYI, no wake</text>
  </g>

  <g id="row-1">
    <rect class="decide" x="16" y="134" width="908" height="62" rx="4"/>
    <rect class="bar" x="16" y="134" width="4" height="62"/>
    <text class="t-lbl" x="32" y="156">WHETHER THE RECIPIENT</text>
    <text class="t-lbl" x="32" y="169">SEES IT</text>
    <text class="t-tag c-acc" x="32" y="186">▸ DECIDES IT</text>
    <text class="mark plus" x="228" y="162">+</text>
    <text class="t-b" x="248" y="161">Sees it in a turn it runs</text>
    <text class="t-s" x="248" y="179">it can answer or let it be</text>
    <text class="mark minus" x="592" y="162">−</text>
    <text class="t-b" x="612" y="161">Read only by luck</text>
    <text class="t-s" x="612" y="179">if something else wakes it first</text>
  </g>
  <g id="row-2">
    <text class="t-lbl" x="32" y="220">COST PER MESSAGE</text>
    <text class="mark minus" x="228" y="226">−</text>
    <text class="t-b" x="248" y="225">One turn each</text>
    <text class="t-s" x="248" y="243">an FYI still costs a short turn</text>
    <text class="mark plus" x="592" y="226">+</text>
    <text class="t-b" x="612" y="225">FYIs are free</text>
    <text class="t-s" x="612" y="243">no turn until something else</text>
    <line class="row" x1="16" y1="254" x2="924" y2="254"/>
  </g>
  <g id="row-3">
    <text class="t-lbl" x="32" y="280">TWO WORKERS</text>
    <text class="t-lbl" x="32" y="293">THAT ALWAYS ANSWER</text>
    <text class="mark plus" x="228" y="286">+</text>
    <text class="t-b" x="248" y="285">Stop after 6</text>
    <text class="t-s" x="248" y="303">a person&#x27;s next line restarts it</text>
    <text class="mark tie" x="592" y="286">=</text>
    <text class="t-b" x="612" y="285">Need the same limit</text>
    <text class="t-s" x="612" y="303">the wake choice doesn&#x27;t end loops</text>
    <line class="row" x1="16" y1="314" x2="924" y2="314"/>
  </g>

  <g id="locks-in">
    <rect class="foot" x="16" y="332" width="446" height="74" rx="5"/>
    <text class="t-lbl" x="32" y="353">LOCKS IN</text>
    <text class="t-b" x="32" y="373">6 worker messages between person turns</text>
    <text class="t-s" x="32" y="391">both limits are Lab settings</text>
  </g>

  <g id="flips-if">
    <rect class="foot" x="478" y="332" width="446" height="74" rx="5"/>
    <text class="t-lbl" x="494" y="353">FLIPS IF</text>
    <text class="t-b" x="494" y="373">FYI turns become a real cost</text>
    <text class="t-s" x="494" y="391">then a message gains wake: false</text>
  </g>
</svg>
