<svg viewBox="0 0 940 420" role="img" aria-label="Open fork 2, a resource config that sets two options that cannot go together. Recommended: fix the type so the editor flags it on every TypeScript version. Instead of: delete the three type checks and track the type guard as its own issue. It comes down to the first row: when a developer writes render together with a template, the fixed type shows an error as they type, while without it the code compiles and throws only when the app first loads that resource. The price is the second row: one public type in core changes, and could reject a valid config nobody foresaw, where dropping the checks costs three deleted lines. Third row: published typings for defineResource get stricter, where dropping leaves them as they are. Locks in: contradictory configs are a compile error for users, by design. Flips if the explicit type rejects a valid call site."
     xmlns="http://www.w3.org/2000/svg">
  <style>
    :root { --surface:#FCFCFA; --surface-2:#E8E8E1; --ink:#191C21; --ink-2:#4C535B; --ink-3:#7A828B;
            --rule:#D5D4CB; --accent:#3E4E8C; --accent-soft:#E0E3F0; --code:#2C7C69; --code-soft:#DCEDE7;
            --gone:#A9544F; }
    @media (prefers-color-scheme: dark) {
      :root { --surface:#181C1F; --surface-2:#202528; --ink:#E6E8E5; --ink-2:#A4ACB1; --ink-3:#737B81;
              --rule:#2B3135; --accent:#8B9BD8; --accent-soft:#1B2140; --code:#5DBBA1; --code-soft:#14302A;
              --gone:#DE8A84; } }
    .bg     { fill:var(--surface); }
    .ask    { fill:var(--surface-2); }
    .chosen { fill:var(--code-soft); stroke:var(--code); stroke-width:1.6; stroke-dasharray:6 3; }
    .lost   { fill:var(--surface); stroke:var(--rule); stroke-width:1.4; stroke-dasharray:5 4; }
    .decide { fill:var(--accent-soft); }
    .bar    { fill:var(--accent); }
    .row    { stroke:var(--rule); stroke-width:1; }
    .foot   { fill:var(--surface-2); }
    .t-lbl  { fill:var(--ink-3); font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:9.5px; letter-spacing:.1em; }
    .t-tag  { font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:9.5px; letter-spacing:.1em; font-weight:600; }
    .t-q    { fill:var(--ink); font-family:system-ui,-apple-system,sans-serif; font-weight:600; font-size:15px; }
    .t-h    { font-family:system-ui,-apple-system,sans-serif; font-weight:600; font-size:14px; }
    .t-b    { fill:var(--ink); font-family:system-ui,-apple-system,sans-serif; font-size:12.5px; }
    .t-s    { fill:var(--ink-2); font-family:system-ui,-apple-system,sans-serif; font-size:11px; }
    .mark   { font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:16px; font-weight:700; }
    .plus   { fill:var(--code); }
    .minus  { fill:var(--gone); }
    .tie    { fill:var(--ink-3); }
    .c-code { fill:var(--code); }
    .c-mute { fill:var(--ink-3); }
    .c-lost { fill:var(--ink-2); }
    .c-acc  { fill:var(--accent); }
  </style>
  <rect class="bg" x="0" y="0" width="940" height="420"/>

  <g id="the-call">
    <rect class="ask" x="16" y="14" width="908" height="48" rx="6"/>
    <text class="t-lbl" x="32" y="32">OPEN · FORK 2</text>
    <text class="t-q" x="32" y="52">A contradictory resource config: flag it as you type, or only when it runs?</text>
  </g>

  <g id="options">
    <rect class="chosen" x="212" y="76" width="348" height="46" rx="5"/>
    <text class="t-tag c-code" x="228" y="93">RECOMMENDED</text>
    <text class="t-h c-code" x="228" y="112">Fix the type: rejected on every version</text>
    <rect class="lost" x="576" y="76" width="348" height="46" rx="5"/>
    <text class="t-tag c-mute" x="592" y="93">INSTEAD OF</text>
    <text class="t-h c-lost" x="592" y="112">Drop the 3 checks, track the guard</text>
  </g>

  <g id="row-decides">
    <rect class="decide" x="16" y="134" width="908" height="62" rx="4"/>
    <rect class="bar" x="16" y="134" width="4" height="62"/>
    <text class="t-lbl" x="32" y="156">A DEVELOPER WRITES</text>
    <text class="t-lbl" x="32" y="169">RENDER + A TEMPLATE</text>
    <text class="t-tag c-acc" x="32" y="186">▸ DECIDES IT</text>
    <text class="mark plus" x="228" y="162">+</text>
    <text class="t-b" x="248" y="161">Error in the editor, as they type</text>
    <text class="t-s" x="248" y="179">on TS 5.7, 6 and 7 alike</text>
    <text class="mark minus" x="592" y="162">−</text>
    <text class="t-b" x="612" y="161">Compiles, then throws at run time</text>
    <text class="t-s" x="612" y="179">when the app first loads that resource</text>
  </g>

  <g id="row-price">
    <text class="t-lbl" x="32" y="222">COST IN THIS</text>
    <text class="t-lbl" x="32" y="235">UPGRADE</text>
    <text class="mark minus" x="228" y="224">−</text>
    <text class="t-b" x="248" y="223">One core type changes</text>
    <text class="t-s" x="248" y="241">could reject a valid config nobody foresaw</text>
    <text class="mark plus" x="592" y="224">+</text>
    <text class="t-b" x="612" y="223">Three lines deleted</text>
    <text class="t-s" x="612" y="241">no type work in the upgrade</text>
    <line class="row" x1="16" y1="256" x2="924" y2="256"/>
  </g>

  <g id="row-typings">
    <text class="t-lbl" x="32" y="282">PUBLISHED</text>
    <text class="t-lbl" x="32" y="295">TYPINGS</text>
    <text class="mark minus" x="228" y="284">−</text>
    <text class="t-b" x="248" y="283">defineResource gets stricter</text>
    <text class="t-s" x="248" y="301">pre-1.0, and the runtime already refuses it</text>
    <text class="mark tie" x="592" y="284">=</text>
    <text class="t-b" x="612" y="283">Unchanged for now</text>
    <text class="t-s" x="612" y="301">until the tracked issue lands</text>
    <line class="row" x1="16" y1="314" x2="924" y2="314"/>
  </g>

  <g id="locks-in">
    <rect class="foot" x="16" y="330" width="446" height="74" rx="5"/>
    <text class="t-lbl" x="32" y="351">LOCKS IN</text>
    <text class="t-b" x="32" y="371">Contradictions are a compile error</text>
    <text class="t-s" x="32" y="389">a valid config wrongly refused blocks a user until a patch</text>
  </g>

  <g id="flips-if">
    <rect class="foot" x="478" y="330" width="446" height="74" rx="5"/>
    <text class="t-lbl" x="494" y="351">FLIPS IF</text>
    <text class="t-b" x="494" y="371">The explicit type refuses a valid call</text>
    <text class="t-s" x="494" y="389">then drop the checks and fix the guard on its own</text>
  </g>
</svg>
