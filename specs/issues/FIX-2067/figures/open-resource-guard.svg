<svg viewBox="0 0 940 420" role="img" aria-label="Open fork 2, a resource config that sets two options that cannot go together. Three options. Recommended: fix the type so every user's editor flags it on every TypeScript version. Second: keep the three checks on tsc 7 only, with no public type change. Third: drop the checks. It comes down to the first row, what a developer on any TypeScript version sees when they write render with a template: the fixed type flags it everywhere; keeping the checks on tsc 7 guards our repo but a user on TS 6 sees no error; dropping them means it compiles and throws at run time. Second row, cost in this upgrade: fixing changes one public core type and could refuse a valid config; the tsc 7 option changes no type but the guard means nothing between PR 1 and PR 2; dropping deletes three lines. Third row, published typings: stricter with a changeset; unchanged; unchanged. Locks in: contradictions are a compile error for users. Flips if the explicit type refuses a valid call, then keep the checks on tsc 7 only."
     xmlns="http://www.w3.org/2000/svg">
  <style>
    :root { --surface:#FCFCFA; --surface-2:#E8E8E1; --ink:#191C21; --ink-2:#4C535B; --ink-3:#7A828B;
            --rule:#D5D4CB; --accent:#3E4E8C; --accent-soft:#E0E3F0; --code:#2C7C69; --code-soft:#DCEDE7;
            --gone:#A9544F; }
    @media (prefers-color-scheme: dark) {
      :root { --surface:#181C1F; --surface-2:#202528; --ink:#E6E8E5; --ink-2:#A4ACB1; --ink-3:#737B81;
              --rule:#2B3135; --accent:#8B9BD8; --accent-soft:#1B2140; --code:#5DBBA1; --code-soft:#14302A;
              --gone:#DE8A84; } }
    .bg     { fill:var(--surface); }
    .ask    { fill:var(--surface-2); }
    .chosen { fill:var(--code-soft); stroke:var(--code); stroke-width:1.6; stroke-dasharray:6 3; }
    .lost   { fill:var(--surface); stroke:var(--rule); stroke-width:1.4; stroke-dasharray:5 4; }
    .decide { fill:var(--accent-soft); }
    .bar    { fill:var(--accent); }
    .row    { stroke:var(--rule); stroke-width:1; }
    .foot   { fill:var(--surface-2); }
    .t-lbl  { fill:var(--ink-3); font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:9.5px; letter-spacing:.1em; }
    .t-tag  { font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:9.5px; letter-spacing:.1em; font-weight:600; }
    .t-q    { fill:var(--ink); font-family:system-ui,-apple-system,sans-serif; font-weight:600; font-size:15px; }
    .t-h    { font-family:system-ui,-apple-system,sans-serif; font-weight:600; font-size:13px; }
    .t-b    { fill:var(--ink); font-family:system-ui,-apple-system,sans-serif; font-size:12.5px; }
    .t-s    { fill:var(--ink-2); font-family:system-ui,-apple-system,sans-serif; font-size:11px; }
    .mark   { font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:16px; font-weight:700; }
    .plus   { fill:var(--code); }
    .minus  { fill:var(--gone); }
    .tie    { fill:var(--ink-3); }
    .c-code { fill:var(--code); }
    .c-mute { fill:var(--ink-3); }
    .c-lost { fill:var(--ink-2); }
    .c-acc  { fill:var(--accent); }
  </style>
  <rect class="bg" x="0" y="0" width="940" height="420"/>

  <g id="the-call">
    <rect class="ask" x="16" y="14" width="908" height="48" rx="6"/>
    <text class="t-lbl" x="32" y="32">OPEN · FORK 2</text>
    <text class="t-q" x="32" y="52">A contradictory resource config: whose editor flags it?</text>
  </g>

  <g id="options">
    <rect class="chosen" x="212" y="76" width="224" height="46" rx="5"/>
    <text class="t-tag c-code" x="226" y="93">RECOMMENDED</text>
    <text class="t-h c-code" x="226" y="112">Fix the type</text>
    <rect class="lost" x="452" y="76" width="224" height="46" rx="5"/>
    <text class="t-tag c-mute" x="466" y="93">FALLBACK</text>
    <text class="t-h c-lost" x="466" y="112">Checks on tsc 7 only</text>
    <rect class="lost" x="692" y="76" width="224" height="46" rx="5"/>
    <text class="t-tag c-mute" x="706" y="93">INSTEAD OF</text>
    <text class="t-h c-lost" x="706" y="112">Drop the 3 checks</text>
  </g>

  <g id="row-decides">
    <rect class="decide" x="16" y="134" width="908" height="62" rx="4"/>
    <rect class="bar" x="16" y="134" width="4" height="62"/>
    <text class="t-lbl" x="32" y="156">ANY USER WRITES</text>
    <text class="t-lbl" x="32" y="169">RENDER + A TEMPLATE</text>
    <text class="t-tag c-acc" x="32" y="186">▸ DECIDES IT</text>
    <text class="mark plus" x="224" y="162">+</text>
    <text class="t-b" x="240" y="161">Flagged on every version</text>
    <text class="t-s" x="240" y="179">every user's editor, on purpose</text>
    <text class="mark minus" x="464" y="162">−</text>
    <text class="t-b" x="480" y="161">Flagged on 5.7 and 7 only</text>
    <text class="t-s" x="480" y="179">a user on TS 6 sees nothing</text>
    <text class="mark minus" x="704" y="162">−</text>
    <text class="t-b" x="720" y="161">Compiles, throws at run time</text>
    <text class="t-s" x="720" y="179">when the app loads that resource</text>
  </g>

  <g id="row-price">
    <text class="t-lbl" x="32" y="222">COST IN THIS</text>
    <text class="t-lbl" x="32" y="235">UPGRADE</text>
    <text class="mark minus" x="224" y="224">−</text>
    <text class="t-b" x="240" y="223">One public core type changes</text>
    <text class="t-s" x="240" y="241">could refuse a valid config</text>
    <text class="mark minus" x="464" y="224">−</text>
    <text class="t-b" x="480" y="223">Guard off from PR 1 to PR 2</text>
    <text class="t-s" x="480" y="241">checks out, then back in</text>
    <text class="mark plus" x="704" y="224">+</text>
    <text class="t-b" x="720" y="223">Three lines deleted</text>
    <text class="t-s" x="720" y="241">no type work</text>
    <line class="row" x1="16" y1="256" x2="924" y2="256"/>
  </g>

  <g id="row-typings">
    <text class="t-lbl" x="32" y="282">PUBLISHED</text>
    <text class="t-lbl" x="32" y="295">TYPINGS</text>
    <text class="mark minus" x="224" y="284">−</text>
    <text class="t-b" x="240" y="283">Stricter, with a changeset</text>
    <text class="t-s" x="240" y="301">pre-1.0; runtime already refuses</text>
    <text class="mark plus" x="464" y="284">+</text>
    <text class="t-b" x="480" y="283">Unchanged</text>
    <text class="t-s" x="480" y="301">no changeset</text>
    <text class="mark plus" x="704" y="284">+</text>
    <text class="t-b" x="720" y="283">Unchanged</text>
    <text class="t-s" x="720" y="301">no changeset</text>
    <line class="row" x1="16" y1="314" x2="924" y2="314"/>
  </g>

  <g id="locks-in">
    <rect class="foot" x="16" y="330" width="446" height="74" rx="5"/>
    <text class="t-lbl" x="32" y="351">LOCKS IN</text>
    <text class="t-b" x="32" y="371">Contradictions are a compile error</text>
    <text class="t-s" x="32" y="389">a valid config wrongly refused blocks a user until a patch</text>
  </g>

  <g id="flips-if">
    <rect class="foot" x="478" y="330" width="446" height="74" rx="5"/>
    <text class="t-lbl" x="494" y="351">FLIPS IF</text>
    <text class="t-b" x="494" y="371">The explicit type refuses a valid call</text>
    <text class="t-s" x="494" y="389">then keep the checks on tsc 7 only, and file the type</text>
  </g>
</svg>
