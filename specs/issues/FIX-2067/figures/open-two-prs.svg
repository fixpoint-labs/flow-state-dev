<svg viewBox="0 0 940 420" role="img" aria-label="Open fork 1, how the TypeScript upgrade ships. Recommended: two pull requests close together, TypeScript 6 first and then 7. Instead of: one pull request straight to 7. It comes down to the first row: where 6 and 7 disagree on a type, two pull requests give a green 6 to compare against, while one pull request mixes both compilers' changes in one diff. The price is the second row: two reviews and two CI runs instead of one. Third row: if the switch to 7 must be undone, two pull requests fall back to a green 6 with the fixes kept, while one pull request falls back to 5.7. Locks in nothing lasting: both routes end at the same place. Flips if review is the bottleneck and each pull request waits days."
     xmlns="http://www.w3.org/2000/svg">
  <style>
    :root { --surface:#FCFCFA; --surface-2:#E8E8E1; --ink:#191C21; --ink-2:#4C535B; --ink-3:#7A828B;
            --rule:#D5D4CB; --accent:#3E4E8C; --accent-soft:#E0E3F0; --code:#2C7C69; --code-soft:#DCEDE7;
            --gone:#A9544F; }
    @media (prefers-color-scheme: dark) {
      :root { --surface:#181C1F; --surface-2:#202528; --ink:#E6E8E5; --ink-2:#A4ACB1; --ink-3:#737B81;
              --rule:#2B3135; --accent:#8B9BD8; --accent-soft:#1B2140; --code:#5DBBA1; --code-soft:#14302A;
              --gone:#DE8A84; } }
    .bg     { fill:var(--surface); }
    .ask    { fill:var(--surface-2); }
    .chosen { fill:var(--code-soft); stroke:var(--code); stroke-width:1.6; stroke-dasharray:6 3; }
    .lost   { fill:var(--surface); stroke:var(--rule); stroke-width:1.4; stroke-dasharray:5 4; }
    .decide { fill:var(--accent-soft); }
    .bar    { fill:var(--accent); }
    .row    { stroke:var(--rule); stroke-width:1; }
    .foot   { fill:var(--surface-2); }
    .t-lbl  { fill:var(--ink-3); font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:9.5px; letter-spacing:.1em; }
    .t-tag  { font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:9.5px; letter-spacing:.1em; font-weight:600; }
    .t-q    { fill:var(--ink); font-family:system-ui,-apple-system,sans-serif; font-weight:600; font-size:15px; }
    .t-h    { font-family:system-ui,-apple-system,sans-serif; font-weight:600; font-size:14px; }
    .t-b    { fill:var(--ink); font-family:system-ui,-apple-system,sans-serif; font-size:12.5px; }
    .t-s    { fill:var(--ink-2); font-family:system-ui,-apple-system,sans-serif; font-size:11px; }
    .mark   { font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:16px; font-weight:700; }
    .plus   { fill:var(--code); }
    .minus  { fill:var(--gone); }
    .tie    { fill:var(--ink-3); }
    .c-code { fill:var(--code); }
    .c-mute { fill:var(--ink-3); }
    .c-lost { fill:var(--ink-2); }
    .c-acc  { fill:var(--accent); }
  </style>
  <rect class="bg" x="0" y="0" width="940" height="420"/>

  <g id="the-call">
    <rect class="ask" x="16" y="14" width="908" height="48" rx="6"/>
    <text class="t-lbl" x="32" y="32">OPEN · FORK 1</text>
    <text class="t-q" x="32" y="52">Ship the upgrade as two pull requests, or one?</text>
  </g>

  <g id="options">
    <rect class="chosen" x="212" y="76" width="348" height="46" rx="5"/>
    <text class="t-tag c-code" x="228" y="93">RECOMMENDED</text>
    <text class="t-h c-code" x="228" y="112">Two PRs: 6, then 7, close together</text>
    <rect class="lost" x="576" y="76" width="348" height="46" rx="5"/>
    <text class="t-tag c-mute" x="592" y="93">INSTEAD OF</text>
    <text class="t-h c-lost" x="592" y="112">One PR, straight to 7</text>
  </g>

  <g id="row-decides">
    <rect class="decide" x="16" y="134" width="908" height="62" rx="4"/>
    <rect class="bar" x="16" y="134" width="4" height="62"/>
    <text class="t-lbl" x="32" y="156">6 AND 7</text>
    <text class="t-lbl" x="32" y="169">DISAGREE ON A TYPE</text>
    <text class="t-tag c-acc" x="32" y="186">▸ DECIDES IT</text>
    <text class="mark plus" x="228" y="162">+</text>
    <text class="t-b" x="248" y="161">Judged against a green 6</text>
    <text class="t-s" x="248" y="179">only the 7 switch is new in PR 2</text>
    <text class="mark minus" x="592" y="162">−</text>
    <text class="t-b" x="612" y="161">Both compilers in one diff</text>
    <text class="t-s" x="612" y="179">harder to tell which one broke what</text>
  </g>

  <g id="row-price">
    <text class="t-lbl" x="32" y="222">REVIEW</text>
    <text class="mark minus" x="228" y="224">−</text>
    <text class="t-b" x="248" y="223">Two reviews, two CI runs</text>
    <text class="t-s" x="248" y="241">the 3.6× lands one PR later</text>
    <text class="mark plus" x="592" y="224">+</text>
    <text class="t-b" x="612" y="223">One review, one CI run</text>
    <text class="t-s" x="612" y="241">the speedup lands at once</text>
    <line class="row" x1="16" y1="256" x2="924" y2="256"/>
  </g>

  <g id="row-undo">
    <text class="t-lbl" x="32" y="282">IF 7 MUST</text>
    <text class="t-lbl" x="32" y="295">BE UNDONE</text>
    <text class="mark plus" x="228" y="284">+</text>
    <text class="t-b" x="248" y="283">Revert one PR, stay on 6</text>
    <text class="t-s" x="248" y="301">the config fixes stay in</text>
    <text class="mark minus" x="592" y="284">−</text>
    <text class="t-b" x="612" y="283">Revert everything</text>
    <text class="t-s" x="612" y="301">back to 5.7 and its deprecations</text>
    <line class="row" x1="16" y1="314" x2="924" y2="314"/>
  </g>

  <g id="locks-in">
    <rect class="foot" x="16" y="330" width="446" height="74" rx="5"/>
    <text class="t-lbl" x="32" y="351">LOCKS IN</text>
    <text class="t-b" x="32" y="371">Nothing lasting</text>
    <text class="t-s" x="32" y="389">both end at TS 6 for tools and TS 7 for tsc</text>
  </g>

  <g id="flips-if">
    <rect class="foot" x="478" y="330" width="446" height="74" rx="5"/>
    <text class="t-lbl" x="494" y="351">FLIPS IF</text>
    <text class="t-b" x="494" y="371">Review is the bottleneck</text>
    <text class="t-s" x="494" y="389">each PR waits days, so one review costs less</text>
  </g>
</svg>
