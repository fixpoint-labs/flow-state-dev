<svg viewBox="0 0 940 420" role="img" aria-label="D3, how a task that split into pieces ends. Chosen: as its worker&#x27;s last request for it ends, with its latest reportProgress checkpoint, else that answer, as output. Instead of: an output of answer and pieces, and a rule that a failed piece fails the task unless re-filed. It comes down to the first row: the chosen option is the one rule for done that every task follows, while the other keeps a second rule for split tasks, the second answer the epic&#x27;s POC refuted. The price is the second row: filers that read pieces from the output rewrite at upgrade. Third row: a failed piece fails the task only if the worker&#x27;s turn throws, where the other fails it by rule. Locks in: a split task&#x27;s output is its latest reportProgress checkpoint, else its worker&#x27;s last answer. Flips if: a filer needs every piece&#x27;s output in the parent&#x27;s."
     xmlns="http://www.w3.org/2000/svg">
  <style>
    :root { --surface:#FCFCFA; --surface-2:#E8E8E1; --ink:#191C21; --ink-2:#4C535B; --ink-3:#7A828B;
            --rule:#D5D4CB; --accent:#3E4E8C; --accent-soft:#E0E3F0; --code:#2C7C69; --code-soft:#DCEDE7;
            --gone:#A9544F; }
    @media (prefers-color-scheme: dark) {
      :root { --surface:#181C1F; --surface-2:#202528; --ink:#E6E8E5; --ink-2:#A4ACB1; --ink-3:#737B81;
              --rule:#2B3135; --accent:#8B9BD8; --accent-soft:#1B2140; --code:#5DBBA1; --code-soft:#14302A;
              --gone:#DE8A84; } }
    .bg     { fill:var(--surface); }
    .ask    { fill:var(--surface-2); }
    .chosen { fill:var(--code-soft); stroke:var(--code); stroke-width:1.6; }
    .lost   { fill:var(--surface); stroke:var(--rule); stroke-width:1.4; stroke-dasharray:5 4; }
    .decide { fill:var(--accent-soft); }
    .bar    { fill:var(--accent); }
    .row    { stroke:var(--rule); stroke-width:1; }
    .foot   { fill:var(--surface-2); }
    .t-lbl  { fill:var(--ink-3); font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:9.5px; letter-spacing:.1em; }
    .t-tag  { font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:9.5px; letter-spacing:.1em; font-weight:600; }
    .t-q    { fill:var(--ink); font-family:system-ui,-apple-system,sans-serif; font-weight:600; font-size:15px; }
    .t-h    { font-family:system-ui,-apple-system,sans-serif; font-weight:600; font-size:14px; }
    .t-b    { fill:var(--ink); font-family:system-ui,-apple-system,sans-serif; font-size:12.5px; }
    .t-s    { fill:var(--ink-2); font-family:system-ui,-apple-system,sans-serif; font-size:11px; }
    .mark   { font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:16px; font-weight:700; }
    .plus   { fill:var(--code); }
    .minus  { fill:var(--gone); }
    .tie    { fill:var(--ink-3); }
    .c-code { fill:var(--code); }
    .c-mute { fill:var(--ink-3); }
    .c-lost { fill:var(--ink-2); }
    .c-acc  { fill:var(--accent); }
  </style>
  <rect class="bg" x="0" y="0" width="940" height="420"/>

  <g id="the-call">
    <rect class="ask" x="16" y="14" width="908" height="48" rx="6"/>
    <text class="t-lbl" x="32" y="32">D3 · THE CALL</text>
    <text class="t-q" x="32" y="52">How does a task that split into pieces end?</text>
  </g>

  <g id="options">
    <rect class="chosen" x="212" y="76" width="348" height="46" rx="5"/>
    <text class="t-tag c-code" x="228" y="93">CHOSEN</text>
    <text class="t-h c-code" x="228" y="112">As its worker&#x27;s last request ends</text>
    <rect class="lost" x="576" y="76" width="348" height="46" rx="5"/>
    <text class="t-tag c-mute" x="592" y="93">INSTEAD OF</text>
    <text class="t-h c-lost" x="592" y="112">Answer and pieces, failure by rule</text>
  </g>

  <g id="row-decides">
    <rect class="decide" x="16" y="134" width="908" height="62" rx="4"/>
    <rect class="bar" x="16" y="134" width="4" height="62"/>
    <text class="t-lbl" x="32" y="156">RULES FOR</text>
    <text class="t-lbl" x="32" y="169">DONE</text>
    <text class="t-tag c-acc" x="32" y="186">▸ DECIDES IT</text>
    <text class="mark plus" x="228" y="162">+</text>
    <text class="t-b" x="248" y="161">One, for every task</text>
    <text class="t-s" x="248" y="179">rule 6, checked at the gate</text>
    <text class="mark minus" x="592" y="162">−</text>
    <text class="t-b" x="612" y="161">Two</text>
    <text class="t-s" x="612" y="179">a second rule for tasks that split</text>
  </g>

  <g id="row-2">
    <text class="t-lbl" x="32" y="222">A FILER THAT</text>
    <text class="t-lbl" x="32" y="235">READS .pieces</text>
    <text class="mark minus" x="228" y="224">−</text>
    <text class="t-b" x="248" y="223">Rewrites at upgrade</text>
    <text class="t-s" x="248" y="241">it reads the pieces&#x27; own rows</text>
    <text class="mark plus" x="592" y="224">+</text>
    <text class="t-b" x="612" y="223">Keeps working</text>
    <text class="t-s" x="612" y="241">the shape stays</text>
    <line class="row" x1="16" y1="256" x2="924" y2="256"/>
  </g>

  <g id="row-3">
    <text class="t-lbl" x="32" y="280">A FAILED PIECE</text>
    <text class="mark tie" x="228" y="282">=</text>
    <text class="t-b" x="248" y="281">The worker decides</text>
    <text class="t-s" x="248" y="299">its turn reads the ending; throwing fails it</text>
    <text class="mark tie" x="592" y="282">=</text>
    <text class="t-b" x="612" y="281">The rule decides</text>
    <text class="t-s" x="612" y="299">fails unless the next turn re-files it</text>
    <line class="row" x1="16" y1="314" x2="924" y2="314"/>
  </g>

  <g id="locks-in">
    <rect class="foot" x="16" y="330" width="446" height="74" rx="5"/>
    <text class="t-lbl" x="32" y="351">LOCKS IN</text>
    <text class="t-b" x="32" y="371">Output: latest checkpoint, else last answer</text>
    <text class="t-s" x="32" y="389">teams outside the repo rewrite; the changeset says so</text>
  </g>
  <g id="flips-if">
    <rect class="foot" x="478" y="330" width="446" height="74" rx="5"/>
    <text class="t-lbl" x="494" y="351">FLIPS IF</text>
    <text class="t-b" x="494" y="371">A filer needs every piece&#x27;s output in the parent&#x27;s</text>
    <text class="t-s" x="494" y="389">then the gate appends them, as data, not a rule</text>
  </g>
</svg>
