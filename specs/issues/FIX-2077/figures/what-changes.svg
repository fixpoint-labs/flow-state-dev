<svg viewBox="0 0 940 400" role="img" aria-label="Two timelines of one task. Today: the work request returns and the gate settles the task at once, while its background work is still to run; a request that waits loses its lease after two minutes and the task runs again. After: the gate checks rule 6 at the end of each request for the task. While a filed piece is open, the task stays running; a wait keeps the claim with no lease. The task settles once, after its background work; a message queued to its session runs after that, outside the task."
     xmlns="http://www.w3.org/2000/svg">
  <style>
    :root { --surface:#FCFCFA; --surface-2:#E8E8E1; --ink:#191C21; --ink-2:#4C535B; --ink-3:#7A828B;
            --rule:#D5D4CB; --accent:#3E4E8C; --accent-soft:#E0E3F0; --code:#2C7C69; --code-soft:#DCEDE7;
            --prose:#A8761C; --prose-soft:#F3E8D2; --gone:#A9544F; }
    @media (prefers-color-scheme: dark) {
      :root { --surface:#181C1F; --surface-2:#202528; --ink:#E6E8E5; --ink-2:#A4ACB1; --ink-3:#737B81;
              --rule:#2B3135; --accent:#8B9BD8; --accent-soft:#1B2140; --code:#5DBBA1; --code-soft:#14302A;
              --prose:#D9A44B; --prose-soft:#332612; --gone:#DE8A84; } }
    .bg    { fill:var(--surface); }
    .lane  { fill:var(--surface-2); }
    .req   { fill:var(--accent-soft); stroke:var(--accent); stroke-width:1.2; }
    .bgw   { fill:var(--prose-soft); stroke:var(--prose); stroke-width:1.2; }
    .wait  { fill:none; stroke:var(--ink-3); stroke-width:1.4; stroke-dasharray:5 4; }
    .bad   { stroke:var(--gone); stroke-width:2.4; }
    .good  { stroke:var(--code); stroke-width:2.4; }
    .t-lbl { fill:var(--ink-3); font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:9.5px; letter-spacing:.1em; }
    .t-b   { fill:var(--ink); font-family:system-ui,-apple-system,sans-serif; font-weight:600; font-size:13px; }
    .t-s   { fill:var(--ink-2); font-family:system-ui,-apple-system,sans-serif; font-size:11px; }
    .t-bad { fill:var(--gone); font-family:system-ui,-apple-system,sans-serif; font-weight:600; font-size:11.5px; }
    .t-ok  { fill:var(--code); font-family:system-ui,-apple-system,sans-serif; font-weight:600; font-size:11.5px; }
  </style>
  <rect class="bg" x="0" y="0" width="940" height="400"/>

  <g id="today">
    <rect class="lane" x="16" y="16" width="908" height="170" rx="6"/>
    <text class="t-lbl" x="32" y="38">TODAY · THE GATE SETTLES AT THE ENTRY'S RETURN</text>
    <rect class="req" x="140" y="56" width="200" height="26" rx="4"/>
    <text class="t-s" x="150" y="73">work request</text>
    <rect class="bgw" x="300" y="90" width="170" height="22" rx="4"/>
    <text class="t-s" x="310" y="105">background work</text>
    <line class="bad" x1="340" y1="50" x2="340" y2="150"/>
    <text class="t-bad" x="348" y="160">settled here, too early</text>
    <rect class="req" x="660" y="56" width="70" height="26" rx="4"/>
    <text class="t-s" x="668" y="73">waits</text>
    <rect class="wait" x="730" y="56" width="90" height="26" rx="4"/>
    <text class="t-bad" x="732" y="100">lease lapses at 2 min</text>
    <text class="t-bad" x="732" y="116">and the task runs again</text>
  </g>

  <g id="after">
    <rect class="lane" x="16" y="200" width="908" height="184" rx="6"/>
    <text class="t-lbl" x="32" y="222">AFTER · RULE 6 CHECKED AT THE END OF EACH REQUEST FOR THE TASK</text>
    <rect class="req" x="140" y="240" width="200" height="26" rx="4"/>
    <text class="t-s" x="150" y="257">work request</text>
    <rect class="bgw" x="300" y="274" width="170" height="22" rx="4"/>
    <text class="t-s" x="310" y="289">background work</text>
    <line class="good" x1="470" y1="234" x2="470" y2="340"/>
    <text class="t-ok" x="478" y="352">settled once, here</text>
    <rect class="req" x="480" y="304" width="190" height="22" rx="4"/>
    <text class="t-s" x="490" y="319">a message, after, outside it</text>
    <rect class="req" x="700" y="240" width="70" height="26" rx="4"/>
    <text class="t-s" x="708" y="257">waits</text>
    <rect class="wait" x="770" y="240" width="140" height="26" rx="4"/>
    <text class="t-s" x="776" y="257">waitingOn · no lease</text>
    <text class="t-ok" x="702" y="290">keeps its claim, even</text>
    <text class="t-ok" x="702" y="306">across a restart</text>
  </g>
</svg>
