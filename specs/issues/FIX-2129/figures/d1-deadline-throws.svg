<svg viewBox="0 0 940 420" role="img" aria-label="D1, what a flow gets when a person does not answer by the deadline. Chosen: a review or input throws a deadline error the flow may catch, and an approval reads as a no. Instead of: always returning a no-answer outcome the flow must check. It comes down to the first row: a flow that never checks fails the try under the chosen option, as rule 12 says, while a returned outcome lets it carry on with no answer. The price is the second row: a flow that handles the deadline writes a catch around the call instead of one branch on the result. The third row is a tie: an approval reads as a no either way. Locks in: a deadline error every flow that asks for a review or input catches, the contract three later issues test against. Flips if: most flows carry on without the answer."
     xmlns="http://www.w3.org/2000/svg">
  <style>
    :root { --surface:#FCFCFA; --surface-2:#E8E8E1; --ink:#191C21; --ink-2:#4C535B; --ink-3:#7A828B;
            --rule:#D5D4CB; --accent:#3E4E8C; --accent-soft:#E0E3F0; --code:#2C7C69; --code-soft:#DCEDE7;
            --gone:#A9544F; }
    @media (prefers-color-scheme: dark) {
      :root { --surface:#181C1F; --surface-2:#202528; --ink:#E6E8E5; --ink-2:#A4ACB1; --ink-3:#737B81;
              --rule:#2B3135; --accent:#8B9BD8; --accent-soft:#1B2140; --code:#5DBBA1; --code-soft:#14302A;
              --gone:#DE8A84; } }
    .bg     { fill:var(--surface); }
    .ask    { fill:var(--surface-2); }
    .chosen { fill:var(--code-soft); stroke:var(--code); stroke-width:1.6; }
    .lost   { fill:var(--surface); stroke:var(--rule); stroke-width:1.4; stroke-dasharray:5 4; }
    .decide { fill:var(--accent-soft); }
    .bar    { fill:var(--accent); }
    .row    { stroke:var(--rule); stroke-width:1; }
    .foot   { fill:var(--surface-2); }
    .t-lbl  { fill:var(--ink-3); font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:9.5px; letter-spacing:.1em; }
    .t-tag  { font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:9.5px; letter-spacing:.1em; font-weight:600; }
    .t-q    { fill:var(--ink); font-family:system-ui,-apple-system,sans-serif; font-weight:600; font-size:15px; }
    .t-h    { font-family:system-ui,-apple-system,sans-serif; font-weight:600; font-size:14px; }
    .t-b    { fill:var(--ink); font-family:system-ui,-apple-system,sans-serif; font-size:12.5px; }
    .t-s    { fill:var(--ink-2); font-family:system-ui,-apple-system,sans-serif; font-size:11px; }
    .mark   { font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:16px; font-weight:700; }
    .plus   { fill:var(--code); }
    .minus  { fill:var(--gone); }
    .tie    { fill:var(--ink-3); }
    .c-code { fill:var(--code); }
    .c-mute { fill:var(--ink-3); }
    .c-lost { fill:var(--ink-2); }
    .c-acc  { fill:var(--accent); }
  </style>
  <rect class="bg" x="0" y="0" width="940" height="420"/>

  <g id="the-call">
    <rect class="ask" x="16" y="14" width="908" height="48" rx="6"/>
    <text class="t-lbl" x="32" y="32">D1 · THE CALL</text>
    <text class="t-q" x="32" y="52">What does a flow get when nobody answers by the deadline?</text>
  </g>

  <g id="options">
    <rect class="chosen" x="212" y="76" width="348" height="46" rx="5"/>
    <text class="t-tag c-code" x="228" y="93">CHOSEN</text>
    <text class="t-h c-code" x="228" y="112">Review or input throws; approval is a no</text>
    <rect class="lost" x="576" y="76" width="348" height="46" rx="5"/>
    <text class="t-tag c-mute" x="592" y="93">INSTEAD OF</text>
    <text class="t-h c-lost" x="592" y="112">Always a returned "no answer"</text>
  </g>

  <g id="row-decides">
    <rect class="decide" x="16" y="134" width="908" height="62" rx="4"/>
    <rect class="bar" x="16" y="134" width="4" height="62"/>
    <text class="t-lbl" x="32" y="156">A FLOW THAT</text>
    <text class="t-lbl" x="32" y="169">NEVER CHECKS</text>
    <text class="t-tag c-acc" x="32" y="186">▸ DECIDES IT</text>
    <text class="mark plus" x="228" y="162">+</text>
    <text class="t-b" x="248" y="161">Fails the try, as rule 12 says</text>
    <text class="t-s" x="248" y="179">the item closes; a retry asks again</text>
    <text class="mark minus" x="592" y="162">−</text>
    <text class="t-b" x="612" y="161">Carries on with no answer</text>
    <text class="t-s" x="612" y="179">an empty answer reaches the work, quietly</text>
  </g>

  <g id="row-price">
    <text class="t-lbl" x="32" y="216">A FLOW THAT</text>
    <text class="t-lbl" x="32" y="229">HANDLES IT</text>
    <text class="mark minus" x="228" y="224">−</text>
    <text class="t-b" x="248" y="223">A catch around the call</text>
    <text class="t-s" x="248" y="241">two shapes: a result and an error</text>
    <text class="mark plus" x="592" y="224">+</text>
    <text class="t-b" x="612" y="223">One branch on the result</text>
    <text class="t-s" x="612" y="241">the shape a wait on a task has</text>
    <line class="row" x1="16" y1="256" x2="924" y2="256"/>
  </g>

  <g id="row-tie">
    <text class="t-lbl" x="32" y="280">AN APPROVAL</text>
    <text class="mark tie" x="228" y="282">=</text>
    <text class="t-b" x="248" y="281">Reads as a no</text>
    <text class="t-s" x="248" y="299">answer false, with a deadline flag</text>
    <text class="mark tie" x="592" y="282">=</text>
    <text class="t-b" x="612" y="281">Reads as a no</text>
    <text class="t-s" x="612" y="299">the same</text>
    <line class="row" x1="16" y1="314" x2="924" y2="314"/>
  </g>

  <g id="locks-in">
    <rect class="foot" x="16" y="330" width="446" height="74" rx="5"/>
    <text class="t-lbl" x="32" y="351">LOCKS IN</text>
    <text class="t-b" x="32" y="371">A deadline error every asking flow catches</text>
    <text class="t-s" x="32" y="389">the contract FIX-2131 to FIX-2133 and apps test against</text>
  </g>

  <g id="flips-if">
    <rect class="foot" x="478" y="330" width="446" height="74" rx="5"/>
    <text class="t-lbl" x="494" y="351">FLIPS IF</text>
    <text class="t-b" x="494" y="371">Most flows carry on without the answer</text>
    <text class="t-s" x="494" y="389">then returning it is the common path, and wins</text>
  </g>
</svg>
