<svg viewBox="0 0 784 300" role="img" aria-label="A grid of four moments, today and after. A worker asks: today parkOnQuestion parks the task and the answer is a new turn; after, askQuestion holds the task on its row and the answer takes one more turn on the same attempt. A flow asks for review: today awaitReview parks the task, the app mounts unparkAndDrain, and the Inbox never shows it; after, ctx.waitForUser with kind review is listed in the Inbox as a review. The filer answers: today with answerTask, a fifth tool; after, with a steer that names the question, and the first answer wins. The user answers: today the Inbox lists approvals and input and parked questions sit in a separate list; after, the Inbox lists held questions and reviews too, and a line typed in the task's session answers the open question."
     xmlns="http://www.w3.org/2000/svg">
  <style>
    :root { --surface:#FCFCFA; --surface-2:#E8E8E1; --ink:#191C21; --ink-2:#4C535B; --ink-3:#7A828B;
            --rule:#D5D4CB; --accent:#3E4E8C; --accent-soft:#E0E3F0; --code:#2C7C69; --code-soft:#DCEDE7;
            --gone:#A9544F; }
    @media (prefers-color-scheme: dark) {
      :root { --surface:#181C1F; --surface-2:#202528; --ink:#E6E8E5; --ink-2:#A4ACB1; --ink-3:#737B81;
              --rule:#2B3135; --accent:#8B9BD8; --accent-soft:#1B2140; --code:#5DBBA1; --code-soft:#14302A;
              --gone:#DE8A84; } }
    .bg    { fill:var(--surface); }
    .lane  { fill:var(--surface-2); }
    .cell  { fill:var(--surface); stroke:var(--rule); stroke-width:1; }
    .good  { fill:var(--code-soft); stroke:var(--code); stroke-width:1.2; }
    .t-lbl { fill:var(--ink-3); font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:9.5px; letter-spacing:.08em; }
    .t-row { fill:var(--ink); font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:10px; letter-spacing:.1em; font-weight:600; }
    .t-bad { fill:var(--gone); font-family:system-ui,-apple-system,sans-serif; font-weight:600; font-size:12px; }
    .t-ok  { fill:var(--code); font-family:system-ui,-apple-system,sans-serif; font-weight:600; font-size:12px; }
    .t-na  { fill:var(--ink-3); font-family:system-ui,-apple-system,sans-serif; font-weight:600; font-size:12px; }
    .t-s   { fill:var(--ink-2); font-family:system-ui,-apple-system,sans-serif; font-size:10.5px; }
  </style>
  <rect class="bg" x="0" y="0" width="784" height="300"/>

  <g id="headers">
    <text class="t-lbl" x="144" y="30">A WORKER ASKS</text>
    <text class="t-lbl" x="300" y="30">A FLOW ASKS FOR REVIEW</text>
    <text class="t-lbl" x="456" y="30">THE FILER ANSWERS</text>
    <text class="t-lbl" x="612" y="30">THE USER ANSWERS</text>
  </g>

  <g id="today">
    <rect class="lane" x="16" y="42" width="752" height="116" rx="6"/>
    <text class="t-row" x="28" y="104">TODAY</text>
    <rect class="cell" x="140" y="50" width="150" height="100" rx="4"/>
    <text class="t-bad" x="150" y="72">The task parks</text>
    <text class="t-s" x="150" y="92">parkOnQuestion ends</text>
    <text class="t-s" x="150" y="108">the turn; the answer</text>
    <text class="t-s" x="150" y="124">is a new turn, queued</text>
    <rect class="cell" x="296" y="50" width="150" height="100" rx="4"/>
    <text class="t-bad" x="306" y="72">Not in the Inbox</text>
    <text class="t-s" x="306" y="92">awaitReview parks;</text>
    <text class="t-s" x="306" y="108">the app mounts</text>
    <text class="t-s" x="306" y="124">unparkAndDrain</text>
    <rect class="cell" x="452" y="50" width="150" height="100" rx="4"/>
    <text class="t-bad" x="462" y="72">A fifth tool</text>
    <text class="t-s" x="462" y="92">answerTask, beside</text>
    <text class="t-s" x="462" y="108">a steer that never</text>
    <text class="t-s" x="462" y="124">answers</text>
    <rect class="cell" x="608" y="50" width="150" height="100" rx="4"/>
    <text class="t-bad" x="618" y="72">Two places to look</text>
    <text class="t-s" x="618" y="92">Inbox: approvals and</text>
    <text class="t-s" x="618" y="108">input; parked questions</text>
    <text class="t-s" x="618" y="124">in a separate list</text>
  </g>

  <g id="after">
    <rect class="lane" x="16" y="170" width="752" height="116" rx="6"/>
    <text class="t-row" x="28" y="232">AFTER</text>
    <rect class="good" x="140" y="178" width="150" height="100" rx="4"/>
    <text class="t-ok" x="150" y="200">The task holds</text>
    <text class="t-s" x="150" y="220">askQuestion ends the</text>
    <text class="t-s" x="150" y="236">turn; the answer takes</text>
    <text class="t-s" x="150" y="252">a turn, same attempt</text>
    <rect class="good" x="296" y="178" width="150" height="100" rx="4"/>
    <text class="t-ok" x="306" y="200">A review item</text>
    <text class="t-s" x="306" y="220">ctx.waitForUser with</text>
    <text class="t-s" x="306" y="236">kind review; nothing</text>
    <text class="t-s" x="306" y="252">for the app to mount</text>
    <rect class="good" x="452" y="178" width="150" height="100" rx="4"/>
    <text class="t-ok" x="462" y="200">A steer answers</text>
    <text class="t-s" x="462" y="220">a steer naming the</text>
    <text class="t-s" x="462" y="236">question it answers;</text>
    <text class="t-s" x="462" y="252">first answer wins</text>
    <rect class="good" x="608" y="178" width="150" height="100" rx="4"/>
    <text class="t-ok" x="618" y="200">One Inbox</text>
    <text class="t-s" x="618" y="220">held questions, reviews</text>
    <text class="t-s" x="618" y="236">too; a line typed in the</text>
    <text class="t-s" x="618" y="252">session answers it</text>
  </g>
</svg>
