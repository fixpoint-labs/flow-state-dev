<svg viewBox="0 0 940 420" role="img" aria-label="D1, whether FIX-2132 still waits on FIX-2137, the fix for a durable resume that runs completed steps again, now that its own question holds the task. Chosen: yes, keep the edge. Instead of: drop it and refuse a harness block that suspends. It comes down to the first row, the public harness slot: a host's own harness block may still suspend, and its resume runs through FIX-2137's path; refusing that would be a new limit on a public slot. The price is the second row: FIX-2132 waits on a fix that has since merged, where dropping ships on FIX-2133 alone. The third row: keeping it adds nothing to the manager, where refusing adds a check on every harness block. Locks in: FIX-2137 blocks FIX-2132. Flips if: no host-supplied block or callback that receives a BlockContext inside the manager chain can suspend, such as the harness block, the judge block, the phase hooks or the ledgers."
     xmlns="http://www.w3.org/2000/svg">
  <style>
    :root { --surface:#FCFCFA; --surface-2:#E8E8E1; --ink:#191C21; --ink-2:#4C535B; --ink-3:#7A828B;
            --rule:#D5D4CB; --accent:#3E4E8C; --accent-soft:#E0E3F0; --code:#2C7C69; --code-soft:#DCEDE7;
            --gone:#A9544F; }
    @media (prefers-color-scheme: dark) {
      :root { --surface:#181C1F; --surface-2:#202528; --ink:#E6E8E5; --ink-2:#A4ACB1; --ink-3:#737B81;
              --rule:#2B3135; --accent:#8B9BD8; --accent-soft:#1B2140; --code:#5DBBA1; --code-soft:#14302A;
              --gone:#DE8A84; } }
    .bg     { fill:var(--surface); }
    .ask    { fill:var(--surface-2); }
    .chosen { fill:var(--code-soft); stroke:var(--code); stroke-width:1.6; }
    .lost   { fill:var(--surface); stroke:var(--rule); stroke-width:1.4; stroke-dasharray:5 4; }
    .decide { fill:var(--accent-soft); }
    .bar    { fill:var(--accent); }
    .row    { stroke:var(--rule); stroke-width:1; }
    .foot   { fill:var(--surface-2); }
    .t-lbl  { fill:var(--ink-3); font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:9.5px; letter-spacing:.1em; }
    .t-tag  { font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:9.5px; letter-spacing:.1em; font-weight:600; }
    .t-q    { fill:var(--ink); font-family:system-ui,-apple-system,sans-serif; font-weight:600; font-size:15px; }
    .t-h    { font-family:system-ui,-apple-system,sans-serif; font-weight:600; font-size:14px; }
    .t-b    { fill:var(--ink); font-family:system-ui,-apple-system,sans-serif; font-size:12.5px; }
    .t-s    { fill:var(--ink-2); font-family:system-ui,-apple-system,sans-serif; font-size:11px; }
    .mark   { font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:16px; font-weight:700; }
    .plus   { fill:var(--code); }
    .minus  { fill:var(--gone); }
    .c-code { fill:var(--code); }
    .c-mute { fill:var(--ink-3); }
    .c-lost { fill:var(--ink-2); }
    .c-acc  { fill:var(--accent); }
  </style>
  <rect class="bg" x="0" y="0" width="940" height="420"/>

  <g id="the-call">
    <rect class="ask" x="16" y="14" width="908" height="48" rx="6"/>
    <text class="t-lbl" x="32" y="32">D1 · THE CALL</text>
    <text class="t-q" x="32" y="52">Does FIX-2132 still wait on FIX-2137, now that its own question holds the task?</text>
  </g>

  <g id="options">
    <rect class="chosen" x="212" y="76" width="348" height="46" rx="5"/>
    <text class="t-tag c-code" x="228" y="93">CHOSEN</text>
    <text class="t-h c-code" x="228" y="112">Yes: keep the FIX-2137 edge</text>
    <rect class="lost" x="576" y="76" width="348" height="46" rx="5"/>
    <text class="t-tag c-mute" x="592" y="93">INSTEAD OF</text>
    <text class="t-h c-lost" x="592" y="112">Drop it, refuse a suspending harness</text>
  </g>

  <g id="row-decides">
    <rect class="decide" x="16" y="134" width="908" height="62" rx="4"/>
    <rect class="bar" x="16" y="134" width="4" height="62"/>
    <text class="t-lbl" x="32" y="156">THE PUBLIC</text>
    <text class="t-lbl" x="32" y="169">HARNESS SLOT</text>
    <text class="t-tag c-acc" x="32" y="186">▸ DECIDES IT</text>
    <text class="mark plus" x="228" y="162">+</text>
    <text class="t-b" x="248" y="161">Any harness block still works</text>
    <text class="t-s" x="248" y="179">one that suspends resumes through FIX-2137's path</text>
    <text class="mark minus" x="592" y="162">−</text>
    <text class="t-b" x="612" y="161">A new limit on a public slot</text>
    <text class="t-s" x="612" y="179">a host's suspending harness is refused</text>
  </g>

  <g id="row-2">
    <text class="t-lbl" x="32" y="216">WHEN FIX-2132</text>
    <text class="t-lbl" x="32" y="229">CAN SHIP</text>
    <text class="mark minus" x="228" y="224">−</text>
    <text class="t-b" x="248" y="223">After FIX-2137 merges</text>
    <text class="t-s" x="248" y="241">#3749, merged</text>
    <text class="mark plus" x="592" y="224">+</text>
    <text class="t-b" x="612" y="223">On FIX-2133 alone</text>
    <text class="t-s" x="612" y="241">the edge drops</text>
    <line class="row" x1="16" y1="256" x2="924" y2="256"/>
  </g>

  <g id="row-3">
    <text class="t-lbl" x="32" y="274">WHAT THE</text>
    <text class="t-lbl" x="32" y="287">MANAGER ADDS</text>
    <text class="mark plus" x="228" y="282">+</text>
    <text class="t-b" x="248" y="281">Nothing</text>
    <text class="t-s" x="248" y="299">the slot stays as it is</text>
    <text class="mark minus" x="592" y="282">−</text>
    <text class="t-b" x="612" y="281">A check on every harness</text>
    <text class="t-s" x="612" y="299">and a refusal to name</text>
    <line class="row" x1="16" y1="314" x2="924" y2="314"/>
  </g>

  <g id="locks-in">
    <rect class="foot" x="16" y="330" width="446" height="74" rx="5"/>
    <text class="t-lbl" x="32" y="351">LOCKS IN</text>
    <text class="t-b" x="32" y="371">FIX-2137 blocks FIX-2132</text>
    <text class="t-s" x="32" y="389">the manager's own asks still never suspend</text>
  </g>

  <g id="flips-if">
    <rect class="foot" x="478" y="330" width="446" height="74" rx="5"/>
    <text class="t-lbl" x="494" y="351">FLIPS IF</text>
    <text class="t-b" x="494" y="371">No host block or callback can suspend</text>
    <text class="t-s" x="494" y="389">none in the chain that gets a BlockContext</text>
  </g>
</svg>
