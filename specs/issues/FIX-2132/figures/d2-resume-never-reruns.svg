<svg viewBox="0 0 940 420" role="img" aria-label="D2, what keeps a coding run from running again when its request resumes after an answer. Chosen: the engine's resume, fixed so a completed step never runs again in production. Instead of: the harness manager's own guard around its run step. It comes down to the first row, every other flow that asks a person: the engine fix makes every stop safe at once, where the manager's guard leaves every other flow running its earlier work again on resume. The price is the second row: FIX-2132 waits on one more engine fix, where the guard ships on FIX-2129 alone. The third row: the engine fix leaves the manager no replay logic of its own; the guard needs a run-once key per step and state written to survive a replay. Locks in: a resume never runs a completed step again, in production as in dev, and FIX-2132 is blocked on it. Flips if: the engine fix can't land before the epic closes."
     xmlns="http://www.w3.org/2000/svg">
  <style>
    :root { --surface:#FCFCFA; --surface-2:#E8E8E1; --ink:#191C21; --ink-2:#4C535B; --ink-3:#7A828B;
            --rule:#D5D4CB; --accent:#3E4E8C; --accent-soft:#E0E3F0; --code:#2C7C69; --code-soft:#DCEDE7;
            --gone:#A9544F; }
    @media (prefers-color-scheme: dark) {
      :root { --surface:#181C1F; --surface-2:#202528; --ink:#E6E8E5; --ink-2:#A4ACB1; --ink-3:#737B81;
              --rule:#2B3135; --accent:#8B9BD8; --accent-soft:#1B2140; --code:#5DBBA1; --code-soft:#14302A;
              --gone:#DE8A84; } }
    .bg     { fill:var(--surface); }
    .ask    { fill:var(--surface-2); }
    .chosen { fill:var(--code-soft); stroke:var(--code); stroke-width:1.6; }
    .lost   { fill:var(--surface); stroke:var(--rule); stroke-width:1.4; stroke-dasharray:5 4; }
    .decide { fill:var(--accent-soft); }
    .bar    { fill:var(--accent); }
    .row    { stroke:var(--rule); stroke-width:1; }
    .foot   { fill:var(--surface-2); }
    .t-lbl  { fill:var(--ink-3); font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:9.5px; letter-spacing:.1em; }
    .t-tag  { font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:9.5px; letter-spacing:.1em; font-weight:600; }
    .t-q    { fill:var(--ink); font-family:system-ui,-apple-system,sans-serif; font-weight:600; font-size:15px; }
    .t-h    { font-family:system-ui,-apple-system,sans-serif; font-weight:600; font-size:14px; }
    .t-b    { fill:var(--ink); font-family:system-ui,-apple-system,sans-serif; font-size:12.5px; }
    .t-s    { fill:var(--ink-2); font-family:system-ui,-apple-system,sans-serif; font-size:11px; }
    .mark   { font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:16px; font-weight:700; }
    .plus   { fill:var(--code); }
    .minus  { fill:var(--gone); }
    .c-code { fill:var(--code); }
    .c-mute { fill:var(--ink-3); }
    .c-lost { fill:var(--ink-2); }
    .c-acc  { fill:var(--accent); }
  </style>
  <rect class="bg" x="0" y="0" width="940" height="420"/>

  <g id="the-call">
    <rect class="ask" x="16" y="14" width="908" height="48" rx="6"/>
    <text class="t-lbl" x="32" y="32">D2 · THE CALL</text>
    <text class="t-q" x="32" y="52">What keeps a coding run from running again when its request resumes?</text>
  </g>

  <g id="options">
    <rect class="chosen" x="212" y="76" width="348" height="46" rx="5"/>
    <text class="t-tag c-code" x="228" y="93">CHOSEN</text>
    <text class="t-h c-code" x="228" y="112">The engine's resume, fixed</text>
    <rect class="lost" x="576" y="76" width="348" height="46" rx="5"/>
    <text class="t-tag c-mute" x="592" y="93">INSTEAD OF</text>
    <text class="t-h c-lost" x="592" y="112">The manager's own guard</text>
  </g>

  <g id="row-decides">
    <rect class="decide" x="16" y="134" width="908" height="62" rx="4"/>
    <rect class="bar" x="16" y="134" width="4" height="62"/>
    <text class="t-lbl" x="32" y="156">EVERY OTHER FLOW</text>
    <text class="t-lbl" x="32" y="169">THAT ASKS A PERSON</text>
    <text class="t-tag c-acc" x="32" y="186">▸ DECIDES IT</text>
    <text class="mark plus" x="228" y="162">+</text>
    <text class="t-b" x="248" y="161">Safe at once, every stop</text>
    <text class="t-s" x="248" y="179">a completed step never runs again on resume</text>
    <text class="mark minus" x="592" y="162">−</text>
    <text class="t-b" x="612" y="161">Only coding runs are safe</text>
    <text class="t-s" x="612" y="179">other flows still redo their earlier work</text>
  </g>

  <g id="row-2">
    <text class="t-lbl" x="32" y="216">WHEN FIX-2132</text>
    <text class="t-lbl" x="32" y="229">CAN SHIP</text>
    <text class="mark minus" x="228" y="224">−</text>
    <text class="t-b" x="248" y="223">After one more engine fix</text>
    <text class="t-s" x="248" y="241">a new blocker, filed with this spec</text>
    <text class="mark plus" x="592" y="224">+</text>
    <text class="t-b" x="612" y="223">On FIX-2129 alone</text>
    <text class="t-s" x="612" y="241">no new dependency</text>
    <line class="row" x1="16" y1="256" x2="924" y2="256"/>
  </g>

  <g id="row-3">
    <text class="t-lbl" x="32" y="274">WHAT THE</text>
    <text class="t-lbl" x="32" y="287">MANAGER CARRIES</text>
    <text class="mark plus" x="228" y="282">+</text>
    <text class="t-b" x="248" y="281">No replay logic of its own</text>
    <text class="t-s" x="248" y="299">its steps stay as they are</text>
    <text class="mark minus" x="592" y="282">−</text>
    <text class="t-b" x="612" y="281">A run-once key on every step</text>
    <text class="t-s" x="612" y="299">and state written to survive a replay</text>
    <line class="row" x1="16" y1="314" x2="924" y2="314"/>
  </g>

  <g id="locks-in">
    <rect class="foot" x="16" y="330" width="446" height="74" rx="5"/>
    <text class="t-lbl" x="32" y="351">LOCKS IN</text>
    <text class="t-b" x="32" y="371">A resume never runs a finished step again</text>
    <text class="t-s" x="32" y="389">in production as in dev; FIX-2132 is blocked on it</text>
  </g>

  <g id="flips-if">
    <rect class="foot" x="478" y="330" width="446" height="74" rx="5"/>
    <text class="t-lbl" x="494" y="351">FLIPS IF</text>
    <text class="t-b" x="494" y="371">The engine fix can't land before the closure</text>
    <text class="t-s" x="494" y="389">then the manager guards its run step, as the POC did</text>
  </g>
</svg>
