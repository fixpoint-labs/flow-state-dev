<svg viewBox="0 0 940 426" role="img" xmlns="http://www.w3.org/2000/svg"
     aria-label="D1: worker-to-worker talk is shown as one-line cards in both workers&#x27; conversations plus a Talk panel over the message log, chosen, beside a separate session for each pair of workers. Decided by keeping the talk next to the conversation it changes.">
  <style>
    :root { --surface:#FCFCFA; --surface-2:#E8E8E1; --ink:#191C21; --ink-2:#4C535B; --ink-3:#7A828B;
            --rule:#D5D4CB; --accent:#3E4E8C; --accent-soft:#E0E3F0; --code:#2C7C69; --code-soft:#DCEDE7;
            --gone:#A9544F; }
    @media (prefers-color-scheme: dark) {
      :root { --surface:#181C1F; --surface-2:#202528; --ink:#E6E8E5; --ink-2:#A4ACB1; --ink-3:#737B81;
              --rule:#2B3135; --accent:#8B9BD8; --accent-soft:#1B2140; --code:#5DBBA1; --code-soft:#14302A;
              --gone:#DE8A84; } }
    .bg     { fill:var(--surface); }
    .ask    { fill:var(--surface-2); }
    .chosen { fill:var(--code-soft); stroke:var(--code); stroke-width:1.6; }
    .lost   { fill:var(--surface); stroke:var(--rule); stroke-width:1.4; stroke-dasharray:5 4; }
    .decide { fill:var(--accent-soft); }
    .bar    { fill:var(--accent); }
    .row    { stroke:var(--rule); stroke-width:1; }
    .foot   { fill:var(--surface-2); }
    .t-lbl  { fill:var(--ink-3); font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:9.5px; letter-spacing:.1em; }
    .t-tag  { font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:9.5px; letter-spacing:.1em; font-weight:600; }
    .t-q    { fill:var(--ink); font-family:system-ui,-apple-system,sans-serif; font-weight:600; font-size:15px; }
    .t-h    { font-family:system-ui,-apple-system,sans-serif; font-weight:600; font-size:13px; }
    .t-b    { fill:var(--ink); font-family:system-ui,-apple-system,sans-serif; font-size:12px; }
    .t-s    { fill:var(--ink-2); font-family:system-ui,-apple-system,sans-serif; font-size:10.5px; }
    .mark   { font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:16px; font-weight:700; }
    .plus   { fill:var(--code); }
    .minus  { fill:var(--gone); }
    .tie    { fill:var(--ink-3); }
    .c-code { fill:var(--code); }
    .c-mute { fill:var(--ink-3); }
    .c-lost { fill:var(--ink-2); }
    .c-acc  { fill:var(--accent); }
  </style>
  <rect class="bg" x="0" y="0" width="940" height="426"/>
  <g id="the-call">
    <rect class="ask" x="16" y="14" width="908" height="48" rx="6"/>
    <text class="t-lbl" x="32" y="32">D1 · A PRODUCT CALL THE BRIEF LEAVES OPEN · FOR SIGN-OFF</text>
    <text class="t-q" x="32" y="52">Where does a person see what two workers said to each other?</text>
  </g>
  <g id="options">
    <rect class="chosen" x="212" y="76" width="344" height="46" rx="5"/>
    <text class="t-tag c-code" x="226" y="93">CHOSEN</text>
    <text class="t-h c-code" x="226" y="112">In both conversations, and a Talk panel</text>
    <rect class="lost" x="572" y="76" width="344" height="46" rx="5"/>
    <text class="t-tag c-mute" x="586" y="93">INSTEAD OF</text>
    <text class="t-h c-lost" x="586" y="112">A separate session for each pair</text>
  </g>
  <g id="row-1">
    <rect class="decide" x="16" y="134" width="908" height="62" rx="4"/>
    <rect class="bar" x="16" y="134" width="4" height="62"/>
    <text class="t-lbl" x="32" y="156">NEXT TO WHAT</text>
    <text class="t-lbl" x="32" y="169">IT CHANGES</text>
    <text class="t-tag c-acc" x="32" y="186">▸ DECIDES IT</text>
    <text class="mark plus" x="226" y="162">+</text>
    <text class="t-b" x="244" y="161">One line where it happened</text>
    <text class="t-s" x="244" y="179">the reply sits beside the answer it shaped</text>
    <text class="mark minus" x="586" y="162">−</text>
    <text class="t-b" x="604" y="161">Somewhere else</text>
    <text class="t-s" x="604" y="179">you leave the worker to see why it changed its mind</text>
  </g>
  <g id="row-2">
    <text class="t-lbl" x="32" y="218">TRUST WITHOUT</text>
    <text class="t-lbl" x="32" y="231">NOISE</text>
    <text class="mark tie" x="226" y="224">=</text>
    <text class="t-b" x="244" y="223">Collapsed to one line</text>
    <text class="t-s" x="244" y="241">open it for the full text, or the Talk panel</text>
    <text class="mark tie" x="586" y="224">=</text>
    <text class="t-b" x="604" y="223">Hidden until opened</text>
    <text class="t-s" x="604" y="241">a second list to watch</text>
    <line class="row" x1="16" y1="256" x2="924" y2="256"/>
  </g>
  <g id="row-3">
    <text class="t-lbl" x="32" y="280">NEW PACKAGE</text>
    <text class="t-lbl" x="32" y="293">CONCEPT</text>
    <text class="mark plus" x="226" y="286">+</text>
    <text class="t-b" x="244" y="285">None</text>
    <text class="t-s" x="244" y="303">a view over the message log that exists</text>
    <text class="mark minus" x="586" y="286">−</text>
    <text class="t-b" x="604" y="285">A pair session</text>
    <text class="t-s" x="604" y="303">FIX-1989 already rejected it</text>
    <line class="row" x1="16" y1="318" x2="924" y2="318"/>
  </g>
  <g id="locks-in">
    <rect class="foot" x="16" y="336" width="446" height="74" rx="5"/>
    <text class="t-lbl" x="32" y="357">LOCKS IN</text>
    <text class="t-b" x="32" y="377">Talk is read from the message log, keyed to FIX-2070&#x27;s row</text>
    <text class="t-s" x="32" y="395">the lab adds no session; a pair filter is UI code</text>
  </g>
  <g id="flips-if">
    <rect class="foot" x="478" y="336" width="446" height="74" rx="5"/>
    <text class="t-lbl" x="494" y="357">FLIPS IF</text>
    <text class="t-b" x="494" y="377">Grok Bot&#x27;s own app shows talk as its own thread</text>
    <text class="t-s" x="494" y="395">then the Talk panel becomes the main view; still no new session</text>
  </g>
</svg>
