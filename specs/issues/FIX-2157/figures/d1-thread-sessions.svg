<svg viewBox="0 0 940 420" role="img" aria-label="D1, where each thread runs. Chosen: a coordinator files each thread in a new session of its delegate. Instead of: the delegate&#x27;s one ongoing session, as the coordinator files routed tasks today. It comes down to the first row: three threads on one delegate run side by side, each with its own history, as Claude Code runs them; in one session they wait in line and share a history. The price is the second row: one more gap in the epic. The third row is a tie: either way the coordinator is Shift Manager&#x27;s. Locks in: gap A, a coordinator setting, and a thread&#x27;s view is its task&#x27;s run session. Flips if: Jake prefers a smaller epic; then the lab uses three different delegates on today&#x27;s coordinator. A manager told by a skill to delegate everything was also dropped, because it proves nothing about the coordinator."
     xmlns="http://www.w3.org/2000/svg">
  <style>
    :root { --surface:#FCFCFA; --surface-2:#E8E8E1; --ink:#191C21; --ink-2:#4C535B; --ink-3:#7A828B;
            --rule:#D5D4CB; --accent:#3E4E8C; --accent-soft:#E0E3F0; --code:#2C7C69; --code-soft:#DCEDE7;
            --gone:#A9544F; }
    @media (prefers-color-scheme: dark) {
      :root { --surface:#181C1F; --surface-2:#202528; --ink:#E6E8E5; --ink-2:#A4ACB1; --ink-3:#737B81;
              --rule:#2B3135; --accent:#8B9BD8; --accent-soft:#1B2140; --code:#5DBBA1; --code-soft:#14302A;
              --gone:#DE8A84; } }
    .bg     { fill:var(--surface); }
    .ask    { fill:var(--surface-2); }
    .chosen { fill:var(--code-soft); stroke:var(--code); stroke-width:1.6; }
    .lost   { fill:var(--surface); stroke:var(--rule); stroke-width:1.4; stroke-dasharray:5 4; }
    .decide { fill:var(--accent-soft); }
    .bar    { fill:var(--accent); }
    .row    { stroke:var(--rule); stroke-width:1; }
    .foot   { fill:var(--surface-2); }
    .t-lbl  { fill:var(--ink-3); font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:9.5px; letter-spacing:.1em; }
    .t-tag  { font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:9.5px; letter-spacing:.1em; font-weight:600; }
    .t-q    { fill:var(--ink); font-family:system-ui,-apple-system,sans-serif; font-weight:600; font-size:15px; }
    .t-h    { font-family:system-ui,-apple-system,sans-serif; font-weight:600; font-size:14px; }
    .t-b    { fill:var(--ink); font-family:system-ui,-apple-system,sans-serif; font-size:12.5px; }
    .t-s    { fill:var(--ink-2); font-family:system-ui,-apple-system,sans-serif; font-size:11px; }
    .mark   { font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:16px; font-weight:700; }
    .plus   { fill:var(--code); }
    .minus  { fill:var(--gone); }
    .tie    { fill:var(--ink-3); }
    .c-code { fill:var(--code); }
    .c-mute { fill:var(--ink-3); }
    .c-lost { fill:var(--ink-2); }
    .c-acc  { fill:var(--accent); }
  </style>
  <rect class="bg" x="0" y="0" width="940" height="420"/>
  <rect class="ask" x="16" y="14" width="908" height="48" rx="6"/>
  <text class="t-lbl" x="32" y="32">D1 · THE CALL</text>
  <text class="t-q" x="32" y="52">Where does each thread run?</text>
  <rect class="chosen" x="212" y="76" width="348" height="46" rx="5"/>
  <text class="t-tag c-code" x="228" y="93">CHOSEN</text>
  <text class="t-h c-code" x="228" y="112">In a new session of its delegate</text>
  <rect class="lost" x="576" y="76" width="348" height="46" rx="5"/>
  <text class="t-tag c-mute" x="592" y="93">INSTEAD OF</text>
  <text class="t-h c-lost" x="592" y="112">In the delegate&#x27;s one ongoing session</text>
  <rect class="decide" x="16" y="134" width="908" height="62" rx="4"/>
  <rect class="bar" x="16" y="134" width="4" height="62"/>
  <text class="t-lbl" x="32" y="156">THREADS ON</text>
  <text class="t-lbl" x="32" y="169">ONE DELEGATE</text>
  <text class="t-tag c-acc" x="32" y="186">▸ DECIDES IT</text>
  <text class="mark plus" x="228" y="162">+</text>
  <text class="t-b" x="248" y="161">Run side by side</text>
  <text class="t-s" x="248" y="179">each thread its own history</text>
  <text class="mark minus" x="592" y="162">−</text>
  <text class="t-b" x="612" y="161">Wait in line</text>
  <text class="t-s" x="612" y="179">one session works one task at a time</text>
  <text class="t-lbl" x="32" y="218">THE EPIC</text>
  <text class="mark minus" x="228" y="224">−</text>
  <text class="t-b" x="248" y="223">One more gap, a child</text>
  <text class="t-s" x="248" y="241">a coordinator setting</text>
  <text class="mark plus" x="592" y="224">+</text>
  <text class="t-b" x="612" y="223">No gap</text>
  <text class="t-s" x="612" y="241">today&#x27;s coordinator</text>
  <line class="row" x1="16" y1="254" x2="924" y2="254"/>
  <text class="t-lbl" x="32" y="276">THE MAIN WORKER</text>
  <text class="mark tie" x="228" y="282">=</text>
  <text class="t-b" x="248" y="281">Shift Manager&#x27;s coordinator</text>
  <text class="t-s" x="248" y="299">what the issue exists to run</text>
  <text class="mark tie" x="592" y="282">=</text>
  <text class="t-b" x="612" y="281">Shift Manager&#x27;s coordinator</text>
  <text class="t-s" x="612" y="299">the same</text>
  <line class="row" x1="16" y1="312" x2="924" y2="312"/>
  <rect class="foot" x="16" y="330" width="446" height="74" rx="5"/>
  <text class="t-lbl" x="32" y="351">LOCKS IN</text>
  <text class="t-b" x="32" y="371">Gap A: a routed task in a new session</text>
  <text class="t-s" x="32" y="389">a thread&#x27;s view is its task&#x27;s run session</text>
  <rect class="foot" x="478" y="330" width="446" height="74" rx="5"/>
  <text class="t-lbl" x="494" y="351">FLIPS IF</text>
  <text class="t-b" x="494" y="371">Jake prefers a smaller epic</text>
  <text class="t-s" x="494" y="389">then three different delegates, on today&#x27;s coordinator</text>
</svg>
