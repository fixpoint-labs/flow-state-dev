<svg viewBox="0 0 940 428" role="img" xmlns="http://www.w3.org/2000/svg"
     aria-label="D3: the app&#x27;s block feeds the plan&#x27;s answer step and the package takes, chosen, beside all in the lab and the package reading before every model call. Decided by hearing each result once. Locks in one shared answer-again step and a public take; flips if a lab may call the notice handling directly.">
  <style>
    :root { --surface:#FCFCFA; --surface-2:#E8E8E1; --ink:#191C21; --ink-2:#4C535B; --ink-3:#7A828B;
            --rule:#D5D4CB; --accent:#3E4E8C; --accent-soft:#E0E3F0; --code:#2C7C69; --code-soft:#DCEDE7;
            --gone:#A9544F; }
    @media (prefers-color-scheme: dark) {
      :root { --surface:#181C1F; --surface-2:#202528; --ink:#E6E8E5; --ink-2:#A4ACB1; --ink-3:#737B81;
              --rule:#2B3135; --accent:#8B9BD8; --accent-soft:#1B2140; --code:#5DBBA1; --code-soft:#14302A;
              --gone:#DE8A84; } }
    .bg     { fill:var(--surface); }
    .ask    { fill:var(--surface-2); }
    .chosen { fill:var(--code-soft); stroke:var(--code); stroke-width:1.6; }
    .lost   { fill:var(--surface); stroke:var(--rule); stroke-width:1.4; stroke-dasharray:5 4; }
    .decide { fill:var(--accent-soft); }
    .bar    { fill:var(--accent); }
    .row    { stroke:var(--rule); stroke-width:1; }
    .foot   { fill:var(--surface-2); }
    .t-lbl  { fill:var(--ink-3); font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:9.5px; letter-spacing:.1em; }
    .t-tag  { font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:9.5px; letter-spacing:.1em; font-weight:600; }
    .t-q    { fill:var(--ink); font-family:system-ui,-apple-system,sans-serif; font-weight:600; font-size:15px; }
    .t-h    { font-family:system-ui,-apple-system,sans-serif; font-weight:600; font-size:13px; }
    .t-b    { fill:var(--ink); font-family:system-ui,-apple-system,sans-serif; font-size:12px; }
    .t-s    { fill:var(--ink-2); font-family:system-ui,-apple-system,sans-serif; font-size:10.5px; }
    .mark   { font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:16px; font-weight:700; }
    .plus   { fill:var(--code); }
    .minus  { fill:var(--gone); }
    .tie    { fill:var(--ink-3); }
    .c-code { fill:var(--code); }
    .c-mute { fill:var(--ink-3); }
    .c-lost { fill:var(--ink-2); }
    .c-acc  { fill:var(--accent); }
  </style>
  <rect class="bg" x="0" y="0" width="940" height="428"/>
  <g id="the-call">
    <rect class="ask" x="16" y="14" width="908" height="48" rx="6"/>
    <text class="t-lbl" x="32" y="32">D3 · THE CALL</text>
    <text class="t-q" x="32" y="52">Who notices a finished task at the end of an answer, and who takes it?</text>
  </g>
  <g id="options">
    <rect class="chosen" x="212" y="76" width="224" height="46" rx="5"/>
    <text class="t-tag c-code" x="226" y="93">CHOSEN</text>
    <text class="t-h c-code" x="226" y="112">App&#x27;s block · shared answer step</text>
    <rect class="lost" x="452" y="76" width="224" height="46" rx="5"/>
    <text class="t-tag c-mute" x="466" y="93">INSTEAD OF</text>
    <text class="t-h c-lost" x="466" y="112">All in the lab</text>
    <rect class="lost" x="692" y="76" width="224" height="46" rx="5"/>
    <text class="t-tag c-mute" x="706" y="93">INSTEAD OF</text>
    <text class="t-h c-lost" x="706" y="112">Package, every model call</text>
  </g>
  <g id="row-1">
    <rect class="decide" x="16" y="134" width="908" height="62" rx="4"/>
    <rect class="bar" x="16" y="134" width="4" height="62"/>
    <text class="t-lbl" x="32" y="156">EACH RESULT</text>
    <text class="t-lbl" x="32" y="169">HEARD ONCE</text>
    <text class="t-tag c-acc" x="32" y="186">▸ DECIDES IT</text>
    <text class="mark plus" x="226" y="162">+</text>
    <text class="t-b" x="244" y="161">Once</text>
    <text class="t-s" x="244" y="179">the take clears the notice</text>
    <text class="mark minus" x="466" y="162">−</text>
    <text class="t-b" x="484" y="161">Twice</text>
    <text class="t-s" x="484" y="179">read here, said again after</text>
    <text class="mark plus" x="706" y="162">+</text>
    <text class="t-b" x="724" y="161">Once</text>
    <text class="t-s" x="724" y="179">the take clears the notice</text>
  </g>
  <g id="row-2">
    <text class="t-lbl" x="32" y="218">WHERE THE</text>
    <text class="t-lbl" x="32" y="231">LOOP LIVES</text>
    <text class="mark plus" x="226" y="224">+</text>
    <text class="t-b" x="244" y="223">The plan&#x27;s answer step</text>
    <text class="t-s" x="244" y="241">the app&#x27;s block says what about</text>
    <text class="mark plus" x="466" y="224">+</text>
    <text class="t-b" x="484" y="223">The app&#x27;s flow file</text>
    <text class="t-s" x="484" y="241">but glue for package work</text>
    <text class="mark minus" x="706" y="224">−</text>
    <text class="t-b" x="724" y="223">Package code</text>
    <text class="t-s" x="724" y="241">no app can see or change it</text>
    <line class="row" x1="16" y1="256" x2="924" y2="256"/>
  </g>
  <g id="row-3">
    <text class="t-lbl" x="32" y="280">NEW PACKAGE</text>
    <text class="t-lbl" x="32" y="293">ENTRIES</text>
    <text class="mark minus" x="226" y="286">−</text>
    <text class="t-b" x="244" y="285">A take and a source slot</text>
    <text class="t-s" x="244" y="303">on the step the plan already runs</text>
    <text class="mark plus" x="466" y="286">+</text>
    <text class="t-b" x="484" y="285">None</text>
    <text class="t-s" x="484" y="303">the lab carries it all</text>
    <text class="mark minus" x="706" y="286">−</text>
    <text class="t-b" x="724" y="285">A context entry</text>
    <text class="t-s" x="724" y="303">and an answer step</text>
    <line class="row" x1="16" y1="318" x2="924" y2="318"/>
  </g>
  <g id="locks-in">
    <rect class="foot" x="16" y="338" width="446" height="74" rx="5"/>
    <text class="t-lbl" x="32" y="359">LOCKS IN</text>
    <text class="t-b" x="32" y="379">One answer-again step, shared with the plan</text>
    <text class="t-s" x="32" y="397">fed by the app&#x27;s block and a public take; one exported cap</text>
  </g>
  <g id="flips-if">
    <rect class="foot" x="478" y="338" width="446" height="74" rx="5"/>
    <text class="t-lbl" x="494" y="359">FLIPS IF</text>
    <text class="t-b" x="494" y="379">A lab may call the notice handling directly</text>
    <text class="t-s" x="494" y="397">then the take is lab code and only the source slot is new</text>
  </g>
</svg>
