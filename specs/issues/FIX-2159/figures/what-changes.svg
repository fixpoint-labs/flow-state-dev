<svg viewBox="0 0 940 372" role="img" xmlns="http://www.w3.org/2000/svg"
     aria-label="Three timelines of one person's turn. Today the first task's ending waits for the reply to end and a second request answers again. After, the turn takes it when its answer ends, says the result line in the same request and answers again. A second ending during that answer is taken the same way and loops once more, at most three times.">
  <style>
    :root { --surface:#FCFCFA; --surface-2:#E8E8E1; --ink:#191C21; --ink-2:#4C535B; --ink-3:#7A828B;
            --rule:#D5D4CB; --accent:#3E4E8C; --accent-soft:#E0E3F0; --code:#2C7C69; --code-soft:#DCEDE7;
            --gone:#A9544F; }
    @media (prefers-color-scheme: dark) {
      :root { --surface:#181C1F; --surface-2:#202528; --ink:#E6E8E5; --ink-2:#A4ACB1; --ink-3:#737B81;
              --rule:#2B3135; --accent:#8B9BD8; --accent-soft:#1B2140; --code:#5DBBA1; --code-soft:#14302A;
              --gone:#DE8A84; } }
    .bg     { fill:var(--surface); }
    .ask    { fill:var(--surface-2); }
    .chosen { fill:var(--code-soft); stroke:var(--code); stroke-width:1.6; }
    .lost   { fill:var(--surface); stroke:var(--rule); stroke-width:1.4; stroke-dasharray:5 4; }
    .decide { fill:var(--accent-soft); }
    .bar    { fill:var(--accent); }
    .row    { stroke:var(--rule); stroke-width:1; }
    .foot   { fill:var(--surface-2); }
    .t-lbl  { fill:var(--ink-3); font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:9.5px; letter-spacing:.1em; }
    .t-tag  { font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:9.5px; letter-spacing:.1em; font-weight:600; }
    .t-q    { fill:var(--ink); font-family:system-ui,-apple-system,sans-serif; font-weight:600; font-size:15px; }
    .t-h    { font-family:system-ui,-apple-system,sans-serif; font-weight:600; font-size:13px; }
    .t-b    { fill:var(--ink); font-family:system-ui,-apple-system,sans-serif; font-size:12px; }
    .t-s    { fill:var(--ink-2); font-family:system-ui,-apple-system,sans-serif; font-size:10.5px; }
    .mark   { font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:16px; font-weight:700; }
    .plus   { fill:var(--code); }
    .minus  { fill:var(--gone); }
    .tie    { fill:var(--ink-3); }
    .c-code { fill:var(--code); }
    .c-mute { fill:var(--ink-3); }
    .c-lost { fill:var(--ink-2); }
    .c-acc  { fill:var(--accent); }
  
    .req    { fill:var(--surface-2); stroke:var(--rule); stroke-width:1; }
    .seg    { fill:var(--accent-soft); stroke:var(--accent); stroke-width:1.2; }
    .seg2   { fill:var(--code-soft); stroke:var(--code); stroke-width:1.2; }
    .wait   { stroke:var(--ink-3); stroke-width:1.2; stroke-dasharray:4 4; fill:none; }
    .end    { fill:var(--gone); }
    .take   { stroke:var(--code); stroke-width:2; }
    .lineit { fill:var(--code); }
    .ghost  { fill:var(--ink-3); font-family:system-ui,-apple-system,sans-serif; font-size:10.5px; font-style:italic; }
  </style>
  <rect class="bg" x="0" y="0" width="940" height="372"/>
  <g id="title">
    <rect class="ask" x="16" y="14" width="908" height="40" rx="6"/>
    <text class="t-lbl" x="32" y="30">ONE PERSON'S TURN · REQUEST R · TIME RUNS RIGHT</text>
    <text class="t-s" x="32" y="46">◆ a task ends · ┃ the take · ● the result line in the session · grey bar = a request</text>
  </g>
  <g id="today">
    <text class="t-lbl" x="24" y="96">TODAY</text>
    <text class="t-s" x="24" y="112">line waits for the reply</text>
    <rect class="req" x="170" y="82" width="400" height="38" rx="5"/><text class="t-lbl" x="176" y="78">R</text>
    <rect class="seg" x="180" y="88" width="380" height="26" rx="4"/>
    <text class="t-s" x="188" y="105">answer · tool calls · last text</text>
    <path class="end" d="M330 74 l6 6 l-6 6 l-6 -6 z"/>
    <text class="t-s" x="300" y="68">task 1 ends</text>
    <path class="wait" d="M336 122 C 420 144, 560 144, 600 118"/>
    <rect class="req" x="590" y="82" width="320" height="38" rx="5"/><text class="t-lbl" x="596" y="78">A SECOND REQUEST</text>
    <rect class="seg" x="616" y="88" width="284" height="26" rx="4"/>
    <text class="t-s" x="624" y="105">notice turn answers again</text>
    <circle class="lineit" cx="606" cy="101" r="4"/>
    <line class="row" x1="16" y1="150" x2="924" y2="150"/>
  </g>
  <g id="after">
    <text class="t-lbl" x="24" y="198">AFTER</text>
    <text class="t-s" x="24" y="214">taken at the answer end</text>
    <rect class="req" x="170" y="184" width="560" height="38" rx="5"/><text class="t-lbl" x="176" y="180">R</text>
    <rect class="seg" x="180" y="190" width="300" height="26" rx="4"/>
    <text class="t-s" x="188" y="207">answer</text>
    <path class="end" d="M330 176 l6 6 l-6 6 l-6 -6 z"/>
    <text class="t-s" x="300" y="170">task 1 ends</text>
    <line class="take" x1="490" y1="186" x2="490" y2="220"/>
    <circle class="lineit" cx="490" cy="230" r="4"/>
    <rect class="seg2" x="500" y="190" width="220" height="26" rx="4"/>
    <text class="t-s" x="508" y="207">answer again · shared step</text>
    <text class="t-s" x="498" y="234">line in R</text>
    <text class="ghost" x="744" y="202">queued copy, after R:</text><text class="ghost" x="744" y="216">finds nothing owed</text>
    <line class="row" x1="16" y1="252" x2="924" y2="252"/>
  </g>
  <g id="second">
    <text class="t-lbl" x="24" y="300">A SECOND ENDING</text>
    <text class="t-s" x="24" y="316">loops again, at most 3</text>
    <rect class="req" x="170" y="286" width="740" height="38" rx="5"/><text class="t-lbl" x="176" y="282">R</text>
    <rect class="seg" x="180" y="292" width="240" height="26" rx="4"/>
    <text class="t-s" x="188" y="309">answer</text>
    <path class="end" d="M300 278 l6 6 l-6 6 l-6 -6 z"/>
    <text class="t-s" x="270" y="272">task 1 ends</text>
    <line class="take" x1="430" y1="288" x2="430" y2="322"/>
    <circle class="lineit" cx="430" cy="332" r="4"/>
    <rect class="seg2" x="440" y="292" width="230" height="26" rx="4"/>
    <text class="t-s" x="448" y="309">answer again</text>
    <path class="end" d="M560 278 l6 6 l-6 6 l-6 -6 z"/>
    <text class="t-s" x="530" y="272">task 2 ends</text>
    <line class="take" x1="680" y1="288" x2="680" y2="322"/>
    <circle class="lineit" cx="680" cy="332" r="4"/>
    <rect class="seg2" x="690" y="292" width="210" height="26" rx="4"/>
    <text class="t-s" x="698" y="309">answer again</text>
  </g>
</svg>
