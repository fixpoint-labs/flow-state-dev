<svg viewBox="0 0 940 470" role="img" aria-label="D1, which managers make a run with changes wait for a person&#x27;s review. Chosen: a host turns it on with reviewChanges, off by default. Instead of: on for every manager, or a block the host adds after the manager. It comes down to the first row, who waits: only hosts with a person to answer; on for every manager makes headless hosts hold work until someone answers; a block after the manager is the same glue in every app. Second row: a revision can continue the same session on the same try from the settle step, but not from a block after the run already succeeded. Third row, the price: Shift Manager&#x27;s coder stays unreviewed until it turns the option on. Locks in: harnessManager reviewChanges true, set by the lab&#x27;s harness flow. Flips if: every host we ship turns it on."
     xmlns="http://www.w3.org/2000/svg">
  <style>
    :root { --surface:#FCFCFA; --surface-2:#E8E8E1; --ink:#191C21; --ink-2:#4C535B; --ink-3:#7A828B;
            --rule:#D5D4CB; --accent:#3E4E8C; --accent-soft:#E0E3F0; --code:#2C7C69; --code-soft:#DCEDE7;
            --gone:#A9544F; --gone-soft:#F4E2E0; }
    @media (prefers-color-scheme: dark) {
      :root { --surface:#181C1F; --surface-2:#202528; --ink:#E6E8E5; --ink-2:#A4ACB1; --ink-3:#737B81;
              --rule:#2B3135; --accent:#8B9BD8; --accent-soft:#1B2140; --code:#5DBBA1; --code-soft:#14302A;
              --gone:#DE8A84; --gone-soft:#3A2220; } }
    .bg     { fill:var(--surface); }
    .ask    { fill:var(--surface-2); }
    .chosen { fill:var(--code-soft); stroke:var(--code); stroke-width:1.6; }
    .lost   { fill:var(--surface); stroke:var(--rule); stroke-width:1.4; stroke-dasharray:5 4; }
    .bad    { fill:var(--gone-soft); stroke:var(--gone); stroke-width:1.2; }
    .good   { fill:var(--code-soft); stroke:var(--code); stroke-width:1.2; }
    .decide { fill:var(--accent-soft); }
    .bar    { fill:var(--accent); }
    .row    { stroke:var(--rule); stroke-width:1; }
    .foot   { fill:var(--surface-2); }
    .t-lbl  { fill:var(--ink-3); font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:9.5px; letter-spacing:.1em; }
    .t-tag  { font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:9.5px; letter-spacing:.1em; font-weight:600; }
    .t-q    { fill:var(--ink); font-family:system-ui,-apple-system,sans-serif; font-weight:600; font-size:15px; }
    .t-h    { font-family:system-ui,-apple-system,sans-serif; font-weight:600; font-size:14px; }
    .t-b    { fill:var(--ink); font-family:system-ui,-apple-system,sans-serif; font-size:12.5px; }
    .t-s    { fill:var(--ink-2); font-family:system-ui,-apple-system,sans-serif; font-size:11px; }
    .mark   { font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:16px; font-weight:700; }
    .plus   { fill:var(--code); }
    .minus  { fill:var(--gone); }
    .c-code { fill:var(--code); }
    .c-mute { fill:var(--ink-3); }
    .c-lost { fill:var(--ink-2); }
    .c-acc  { fill:var(--accent); }
    .c-gone { fill:var(--gone); }
  </style>
  <rect class="bg" x="0" y="0" width="940" height="470"/>
  <rect class="ask" x="16" y="14" width="908" height="48" rx="6"/>
  <text class="t-lbl" x="32" y="32">D1 · THE CALL</text>
  <text class="t-q" x="32" y="52">Which managers make a run with changes wait for a person&#x27;s review?</text>
  <rect class="chosen" x="196" y="76" width="232" height="46" rx="5"/>
  <text class="t-tag c-code" x="210" y="93">CHOSEN</text>
  <text class="t-h c-code" x="210" y="112">A host turns it on</text>
  <rect class="lost" x="440" y="76" width="232" height="46" rx="5"/>
  <text class="t-tag c-mute" x="454" y="93">INSTEAD OF</text>
  <text class="t-h c-lost" x="454" y="112">On for every manager</text>
  <rect class="lost" x="684" y="76" width="232" height="46" rx="5"/>
  <text class="t-tag c-mute" x="698" y="93">INSTEAD OF</text>
  <text class="t-h c-lost" x="698" y="112">A block after the manager</text>
  <rect class="decide" x="16" y="134" width="908" height="62" rx="4"/>
  <rect class="bar" x="16" y="134" width="4" height="62"/>
  <text class="t-lbl" x="32" y="154">WHO WAITS</text>
  <text class="t-tag c-acc" x="32" y="186">▸ DECIDES IT</text>
  <text class="mark plus" x="200" y="162">+</text>
  <text class="t-b" x="218" y="161">Hosts with a person</text>
  <text class="t-s" x="218" y="179">reviewChanges: true in their flow</text>
  <text class="mark minus" x="444" y="162">−</text>
  <text class="t-b" x="462" y="161">Every host</text>
  <text class="t-s" x="462" y="179">headless ones hold work, unanswered</text>
  <text class="mark plus" x="688" y="162">+</text>
  <text class="t-b" x="706" y="161">Hosts that write it</text>
  <text class="t-s" x="706" y="179">the same glue in each</text>
  <line class="row" x1="16" y1="196" x2="924" y2="196"/>
  <text class="t-lbl" x="32" y="216">WHAT A REVISION</text>
  <text class="t-lbl" x="32" y="229">CAN DO</text>
  <text class="mark plus" x="200" y="224">+</text>
  <text class="t-b" x="218" y="223">Same session, same try</text>
  <text class="t-s" x="218" y="241">the settle step has the steer step</text>
  <text class="mark plus" x="444" y="224">+</text>
  <text class="t-b" x="462" y="223">Same session, same try</text>
  <text class="t-s" x="462" y="241">same place in the chain</text>
  <text class="mark minus" x="688" y="224">−</text>
  <text class="t-b" x="706" y="223">Little</text>
  <text class="t-s" x="706" y="241">the run already succeeded</text>
  <line class="row" x1="16" y1="258" x2="924" y2="258"/>
  <text class="t-lbl" x="32" y="278">WHAT IT COSTS</text>
  <text class="mark minus" x="200" y="286">−</text>
  <text class="t-b" x="218" y="285">Unreviewed until turned on</text>
  <text class="t-s" x="218" y="303">Shift Manager&#x27;s coder, for now</text>
  <text class="mark minus" x="444" y="286">−</text>
  <text class="t-b" x="462" y="285">Every host changes</text>
  <text class="t-s" x="462" y="303">DevTeam, conductor, goal checks</text>
  <text class="mark minus" x="688" y="286">−</text>
  <text class="t-b" x="706" y="285">Glue in every app</text>
  <text class="t-s" x="706" y="303">what ER-4 forbids in a lab</text>
  <line class="row" x1="16" y1="320" x2="924" y2="320"/>
  <rect class="foot" x="16" y="336" width="446" height="74" rx="5"/>
  <text class="t-lbl" x="32" y="357">LOCKS IN</text>
  <text class="t-b" x="32" y="377">harnessManager({ reviewChanges: true })</text>
  <text class="t-s" x="32" y="395">off by default; the lab&#x27;s harness flow sets it</text>
  <rect class="foot" x="478" y="336" width="446" height="74" rx="5"/>
  <text class="t-lbl" x="494" y="357">FLIPS IF</text>
  <text class="t-b" x="494" y="377">Every host we ship turns it on</text>
  <text class="t-s" x="494" y="395">then the default flips, and a headless host turns it off</text>
</svg>
