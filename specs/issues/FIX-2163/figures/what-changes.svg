<svg viewBox="0 0 940 316" role="img" aria-label="What changes for a coding run that made changes, when the host turns review on. Four moments, today and after. The run ends with commits: today it completes on the judge&#x27;s verdict; after, the task waits on you for a review, with the verdict and the commits shown as information. The person accepts: today there is nothing to accept; after, the task completes with no coding run again. The person asks for changes: today they file a follow-up task that starts cold; after, the next run takes their words in the same coding session on the same try. Nobody answers: today nothing waits; after, the task completes at the person-stop deadline and its output says no review came."
     xmlns="http://www.w3.org/2000/svg">
  <style>
    :root { --surface:#FCFCFA; --surface-2:#E8E8E1; --ink:#191C21; --ink-2:#4C535B; --ink-3:#7A828B;
            --rule:#D5D4CB; --accent:#3E4E8C; --accent-soft:#E0E3F0; --code:#2C7C69; --code-soft:#DCEDE7;
            --gone:#A9544F; --gone-soft:#F4E2E0; }
    @media (prefers-color-scheme: dark) {
      :root { --surface:#181C1F; --surface-2:#202528; --ink:#E6E8E5; --ink-2:#A4ACB1; --ink-3:#737B81;
              --rule:#2B3135; --accent:#8B9BD8; --accent-soft:#1B2140; --code:#5DBBA1; --code-soft:#14302A;
              --gone:#DE8A84; --gone-soft:#3A2220; } }
    .bg     { fill:var(--surface); }
    .ask    { fill:var(--surface-2); }
    .chosen { fill:var(--code-soft); stroke:var(--code); stroke-width:1.6; }
    .lost   { fill:var(--surface); stroke:var(--rule); stroke-width:1.4; stroke-dasharray:5 4; }
    .bad    { fill:var(--gone-soft); stroke:var(--gone); stroke-width:1.2; }
    .good   { fill:var(--code-soft); stroke:var(--code); stroke-width:1.2; }
    .decide { fill:var(--accent-soft); }
    .bar    { fill:var(--accent); }
    .row    { stroke:var(--rule); stroke-width:1; }
    .foot   { fill:var(--surface-2); }
    .t-lbl  { fill:var(--ink-3); font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:9.5px; letter-spacing:.1em; }
    .t-tag  { font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:9.5px; letter-spacing:.1em; font-weight:600; }
    .t-q    { fill:var(--ink); font-family:system-ui,-apple-system,sans-serif; font-weight:600; font-size:15px; }
    .t-h    { font-family:system-ui,-apple-system,sans-serif; font-weight:600; font-size:14px; }
    .t-b    { fill:var(--ink); font-family:system-ui,-apple-system,sans-serif; font-size:12.5px; }
    .t-s    { fill:var(--ink-2); font-family:system-ui,-apple-system,sans-serif; font-size:11px; }
    .mark   { font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:16px; font-weight:700; }
    .plus   { fill:var(--code); }
    .minus  { fill:var(--gone); }
    .c-code { fill:var(--code); }
    .c-mute { fill:var(--ink-3); }
    .c-lost { fill:var(--ink-2); }
    .c-acc  { fill:var(--accent); }
    .c-gone { fill:var(--gone); }
  </style>
  <rect class="bg" x="0" y="0" width="940" height="316"/>
  <rect class="ask" x="96" y="16" width="198" height="34" rx="5"/>
  <text class="t-lbl" x="106" y="37">THE RUN ENDS WITH COMMITS</text>
  <rect class="ask" x="302" y="16" width="198" height="34" rx="5"/>
  <text class="t-lbl" x="312" y="37">THE PERSON ACCEPTS</text>
  <rect class="ask" x="508" y="16" width="198" height="34" rx="5"/>
  <text class="t-lbl" x="518" y="37">THE PERSON ASKS FOR CHANGES</text>
  <rect class="ask" x="714" y="16" width="198" height="34" rx="5"/>
  <text class="t-lbl" x="724" y="37">NOBODY ANSWERS</text>
  <text class="t-tag c-gone" x="20" y="114">TODAY</text>
  <rect class="bad" x="96" y="64" width="198" height="96" rx="5"/>
  <text class="t-h c-gone" x="108" y="104">Completes on the verdict</text>
  <text class="t-s" x="108" y="126">the judge&#x27;s done is the approval</text>
  <rect class="bad" x="302" y="64" width="198" height="96" rx="5"/>
  <text class="t-h c-gone" x="314" y="104">Nothing to accept</text>
  <text class="t-s" x="314" y="126">the task already completed</text>
  <rect class="bad" x="508" y="64" width="198" height="96" rx="5"/>
  <text class="t-h c-gone" x="520" y="104">A follow-up task</text>
  <text class="t-s" x="520" y="126">starts a cold coding session</text>
  <rect class="bad" x="714" y="64" width="198" height="96" rx="5"/>
  <text class="t-h c-gone" x="726" y="104">Nothing waits</text>
  <text class="t-s" x="726" y="126">the change was done unseen</text>
  <text class="t-tag c-code" x="20" y="226">AFTER</text>
  <rect class="good" x="96" y="176" width="198" height="96" rx="5"/>
  <text class="t-h c-code" x="108" y="216">Waits on you: review</text>
  <text class="t-s" x="108" y="238">the verdict shown as information</text>
  <rect class="good" x="302" y="176" width="198" height="96" rx="5"/>
  <text class="t-h c-code" x="314" y="216">Completes</text>
  <text class="t-s" x="314" y="238">no coding run again</text>
  <rect class="good" x="508" y="176" width="198" height="96" rx="5"/>
  <text class="t-h c-code" x="520" y="216">Reruns with your words</text>
  <text class="t-s" x="520" y="238">same session, same try</text>
  <rect class="good" x="714" y="176" width="198" height="96" rx="5"/>
  <text class="t-h c-code" x="726" y="216">Completes at the deadline</text>
  <text class="t-s" x="726" y="238">its output says review: deadline</text>
  <text class="t-s" x="96" y="302">With the option off, every column stays as today. A run with no commits, or a failed one, never waits.</text>
</svg>
