<svg viewBox="0 0 940 420" role="img" aria-label="D2, how much of a long history a consult reads. Chosen: the most recent turns under a hard token budget, with the result saying what was left out. Instead of: the other session&#x27;s window plus its FIX-1613 summary. It comes down to the first row: the summary lives in a session resource, and no read of another session&#x27;s resource exists. The price is the second row: decisions older than the budget are out of reach until the follow-up. The third row: the budget caps cost hard, while window plus summary costs what that session&#x27;s window holds. Locks in: a default budget and a result that says what was left out. Flips if: asked questions reach past the budget."
     xmlns="http://www.w3.org/2000/svg">
  <style>
    :root { --surface:#FCFCFA; --surface-2:#E8E8E1; --ink:#191C21; --ink-2:#4C535B; --ink-3:#7A828B;
            --rule:#D5D4CB; --accent:#3E4E8C; --accent-soft:#E0E3F0; --code:#2C7C69; --code-soft:#DCEDE7;
            --gone:#A9544F; }
    @media (prefers-color-scheme: dark) {
      :root { --surface:#181C1F; --surface-2:#202528; --ink:#E6E8E5; --ink-2:#A4ACB1; --ink-3:#737B81;
              --rule:#2B3135; --accent:#8B9BD8; --accent-soft:#1B2140; --code:#5DBBA1; --code-soft:#14302A;
              --gone:#DE8A84; } }
    .bg     { fill:var(--surface); }
    .ask    { fill:var(--surface-2); }
    .chosen { fill:var(--code-soft); stroke:var(--code); stroke-width:1.6; }
    .lost   { fill:var(--surface); stroke:var(--rule); stroke-width:1.4; stroke-dasharray:5 4; }
    .decide { fill:var(--accent-soft); }
    .bar    { fill:var(--accent); }
    .row    { stroke:var(--rule); stroke-width:1; }
    .foot   { fill:var(--surface-2); }
    .t-lbl  { fill:var(--ink-3); font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:9.5px; letter-spacing:.1em; }
    .t-tag  { font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:9.5px; letter-spacing:.1em; font-weight:600; }
    .t-q    { fill:var(--ink); font-family:system-ui,-apple-system,sans-serif; font-weight:600; font-size:15px; }
    .t-h    { font-family:system-ui,-apple-system,sans-serif; font-weight:600; font-size:14px; }
    .t-b    { fill:var(--ink); font-family:system-ui,-apple-system,sans-serif; font-size:12.5px; }
    .t-s    { fill:var(--ink-2); font-family:system-ui,-apple-system,sans-serif; font-size:11px; }
    .mark   { font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:16px; font-weight:700; }
    .plus   { fill:var(--code); }
    .minus  { fill:var(--gone); }
    .tie    { fill:var(--ink-3); }
    .c-code { fill:var(--code); }
    .c-mute { fill:var(--ink-3); }
    .c-lost { fill:var(--ink-2); }
    .c-acc  { fill:var(--accent); }
  </style>  <rect class="bg" x="0" y="0" width="940" height="420"/>
  <g id="the-call">
    <rect class="ask" x="16" y="14" width="908" height="48" rx="6"/>
    <text class="t-lbl" x="32" y="32">D2 · THE CALL</text>
    <text class="t-q" x="32" y="52">How much of a long history does a consult read?</text>
  </g>

  <g id="options">
    <rect class="chosen" x="212" y="76" width="348" height="46" rx="5"/>
    <text class="t-tag c-code" x="228" y="93">CHOSEN</text>
    <text class="t-h c-code" x="228" y="112">Recent turns, hard token budget</text>
    <rect class="lost" x="576" y="76" width="348" height="46" rx="5"/>
    <text class="t-tag c-mute" x="592" y="93">INSTEAD OF</text>
    <text class="t-h c-lost" x="592" y="112">Window plus the FIX-1613 summary</text>
  </g>
  <g id="row-decides">
    <rect class="decide" x="16" y="134" width="908" height="62" rx="4"/>
    <rect class="bar" x="16" y="134" width="4" height="62"/>
    <text class="t-lbl" x="32" y="156">NEEDS A READ</text>
    <text class="t-lbl" x="32" y="169">NOBODY BUILT</text>
    <text class="t-tag c-acc" x="32" y="186">▸ DECIDES IT</text>
    <text class="mark plus" x="228" y="162">+</text>
    <text class="t-b" x="248" y="161">Nothing new</text>
    <text class="t-s" x="248" y="179">the window&#x27;s own turn packing</text>
    <text class="mark minus" x="592" y="162">−</text>
    <text class="t-b" x="612" y="161">A cross-session resource read</text>
    <text class="t-s" x="612" y="179">the summary is a capability&#x27;s resource</text>
  </g>

  <g id="row-1">
    <text class="t-lbl" x="32" y="222">A DECISION FROM</text>
    <text class="t-lbl" x="32" y="235">WEEKS AGO</text>
    <text class="mark minus" x="228" y="224">−</text>
    <text class="t-b" x="248" y="223">Out of reach</text>
    <text class="t-s" x="248" y="241">the answer says earlier turns were left out</text>
    <text class="mark plus" x="592" y="224">+</text>
    <text class="t-b" x="612" y="223">In the summary</text>
    <text class="t-s" x="612" y="241">if the summary kept it</text>
    <line class="row" x1="16" y1="256" x2="924" y2="256"/>
  </g>

  <g id="row-2">
    <text class="t-lbl" x="32" y="282">WHAT A</text>
    <text class="t-lbl" x="32" y="295">CONSULT COSTS</text>
    <text class="mark plus" x="228" y="284">+</text>
    <text class="t-b" x="248" y="283">At most the budget</text>
    <text class="t-s" x="248" y="301">the newest turn is cut, not sent whole</text>
    <text class="mark minus" x="592" y="284">−</text>
    <text class="t-b" x="612" y="283">Whatever that window holds</text>
    <text class="t-s" x="612" y="301">set by the other flow, not the asker</text>
    <line class="row" x1="16" y1="316" x2="924" y2="316"/>
  </g>

  <g id="locks-in">
    <rect class="foot" x="16" y="330" width="446" height="74" rx="5"/>
    <text class="t-lbl" x="32" y="351">LOCKS IN</text>
    <text class="t-b" x="32" y="371">A 24,000-token default, changeable</text>
    <text class="t-s" x="32" y="389">the result names turns read, left out, and a cut</text>
  </g>

  <g id="flips-if">
    <rect class="foot" x="478" y="330" width="446" height="74" rx="5"/>
    <text class="t-lbl" x="494" y="351">FLIPS IF</text>
    <text class="t-b" x="494" y="371">Questions reach past the budget</text>
    <text class="t-s" x="494" y="389">then the summary follow-up comes first</text>
  </g>
</svg>
