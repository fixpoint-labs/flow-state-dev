<svg viewBox="0 0 940 470" role="img" aria-label="Two panels. Today: a line for a running coding turn is kept on the task or queued; the harness manager stops the step or waits for it to end, then a new step resumes the coding session with the line, and Kitchen Sink runs it as the next turn. After: a run that can steer hands the host a steer function through onSteerable; the manager's poll or Kitchen Sink's steer action hands it the line, and the turn takes it in flight. A refused line, or a run that offered nothing, takes today's path once."
     xmlns="http://www.w3.org/2000/svg">
  <style>
    :root { --surface:#FCFCFA; --surface-2:#E8E8E1; --ink:#191C21; --ink-2:#4C535B; --ink-3:#7A828B;
            --rule:#D5D4CB; --accent:#3E4E8C; --accent-soft:#E0E3F0; --code:#2C7C69; --code-soft:#DCEDE7;
            --prose:#A8761C; --prose-soft:#F3E8D2; --gone:#A9544F; }
    @media (prefers-color-scheme: dark) {
      :root { --surface:#181C1F; --surface-2:#202528; --ink:#E6E8E5; --ink-2:#A4ACB1; --ink-3:#737B81;
              --rule:#2B3135; --accent:#8B9BD8; --accent-soft:#1B2140; --code:#5DBBA1; --code-soft:#14302A;
              --prose:#D9A44B; --prose-soft:#332612; --gone:#DE8A84; } }
    .bg    { fill:var(--surface); }
    .panel { fill:var(--surface-2); }
    .n-box { fill:var(--surface); stroke:var(--rule); stroke-width:1.2; }
    .in    { fill:var(--prose-soft); stroke:var(--prose); stroke-width:1.2; }
    .new   { fill:var(--accent-soft); stroke:var(--accent); stroke-width:1.4; }
    .done  { fill:var(--code-soft); stroke:var(--code); stroke-width:1.4; }
    .cut   { fill:var(--surface); stroke:var(--gone); stroke-width:1.4; stroke-dasharray:5 4; }
    .arrow { stroke:var(--ink-3); stroke-width:1.3; fill:none; }
    .fall  { stroke:var(--ink-3); stroke-width:1.3; fill:none; stroke-dasharray:4 3; }
    .t-lbl { fill:var(--ink-3); font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:9.5px; letter-spacing:.1em; }
    .t-b   { fill:var(--ink); font-family:system-ui,-apple-system,sans-serif; font-weight:600; font-size:12.5px; }
    .t-s   { fill:var(--ink-2); font-family:system-ui,-apple-system,sans-serif; font-size:11px; }
  </style>
  <rect class="bg" x="0" y="0" width="940" height="470"/>

  <g id="today">
    <rect class="panel" x="16" y="14" width="908" height="160" rx="6"/>
    <text class="t-lbl" x="32" y="36">TODAY</text>
    <rect class="in" x="32" y="56" width="190" height="96" rx="5"/>
    <text class="t-b" x="46" y="80">A line, mid-turn</text>
    <text class="t-s" x="46" y="100">updateTask message</text>
    <text class="t-s" x="46" y="116">or typed on the page</text>
    <path class="arrow" d="M222 104 H262"/>
    <rect class="cut" x="262" y="56" width="300" height="96" rx="5"/>
    <text class="t-b" x="278" y="80">The step is stopped, or waits</text>
    <text class="t-s" x="278" y="100">manager: stop with stopsOnAbort, else the end</text>
    <text class="t-s" x="278" y="116">Kitchen Sink: queued behind the turn</text>
    <text class="t-s" x="278" y="136">the work in flight is cut or delayed</text>
    <path class="arrow" d="M562 104 H602"/>
    <rect class="done" x="602" y="56" width="306" height="96" rx="5"/>
    <text class="t-b" x="618" y="80">A new step or turn, same session</text>
    <text class="t-s" x="618" y="100">resumes the coding session with the line</text>
    <text class="t-s" x="618" y="116">no attempt used</text>
  </g>

  <g id="after">
    <rect class="panel" x="16" y="190" width="908" height="266" rx="6"/>
    <text class="t-lbl" x="32" y="212">AFTER</text>
    <rect class="in" x="32" y="232" width="190" height="96" rx="5"/>
    <text class="t-b" x="46" y="256">A line, mid-turn</text>
    <text class="t-s" x="46" y="276">the same writes</text>
    <path class="arrow" d="M222 280 H262"/>
    <rect class="new" x="262" y="232" width="300" height="96" rx="5"/>
    <text class="t-b" x="278" y="256">Did the run offer a steer?</text>
    <text class="t-s" x="278" y="276">onSteerable, called by the harness</text>
    <text class="t-s" x="278" y="292">manager: its poll takes the line, hands it</text>
    <text class="t-s" x="278" y="308">Kitchen Sink: the steer action hands it</text>
    <path class="arrow" d="M562 280 H602"/>
    <rect class="done" x="602" y="232" width="306" height="96" rx="5"/>
    <text class="t-b" x="618" y="256">Delivered: the turn in flight has it</text>
    <text class="t-s" x="618" y="276">nothing stops, no step is added</text>
    <text class="t-s" x="618" y="292">Cursor, local runs</text>
    <path class="fall" d="M412 328 V366"/>
    <text class="t-lbl" x="420" y="352">REFUSED, OR NO OFFER</text>
    <rect class="n-box" x="262" y="366" width="646" height="72" rx="5"/>
    <text class="t-b" x="278" y="390">Today's path, once, with the same words</text>
    <text class="t-s" x="278" y="426">Claude Code and Codex always; a cloud Cursor run too</text>
    <text class="t-s" x="278" y="410">manager: a refused line is kept as owed, then a stop or the next step · Kitchen Sink: the next turn</text>
  </g>
</svg>
