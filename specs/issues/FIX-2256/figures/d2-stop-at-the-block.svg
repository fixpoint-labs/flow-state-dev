<svg viewBox="0 0 940 434" role="img" aria-label="D2, where v1 stops. Chosen: at the block, its handle and Kitchen Sink. Instead of: the harness manager fetches a cloud run&#x27;s branch now. Decides it: the worker route that would call the manager isn&#x27;t built, so the change has no caller. The price: Workforce workers wait for FIX-2257. Second row: the manager change has open meanings for retries, its output branch and talk. Locks in the scope. Flips if FIX-2154&#x27;s routing ships before this does."
     xmlns="http://www.w3.org/2000/svg">
  <style>
    :root { --surface:#FCFCFA; --surface-2:#E8E8E1; --ink:#191C21; --ink-2:#4C535B; --ink-3:#7A828B;
            --rule:#D5D4CB; --accent:#3E4E8C; --accent-soft:#E0E3F0; --code:#2C7C69; --code-soft:#DCEDE7;
            --gone:#A9544F; --gone-soft:#F4E2E0; }
    @media (prefers-color-scheme: dark) {
      :root { --surface:#181C1F; --surface-2:#202528; --ink:#E6E8E5; --ink-2:#A4ACB1; --ink-3:#737B81;
              --rule:#2B3135; --accent:#8B9BD8; --accent-soft:#1B2140; --code:#5DBBA1; --code-soft:#14302A;
              --gone:#DE8A84; --gone-soft:#3A2220; } }
    .bg     { fill:var(--surface); }
    .ask    { fill:var(--surface-2); }
    .chosen { fill:var(--code-soft); stroke:var(--code); stroke-width:1.6; }
    .lost   { fill:var(--surface); stroke:var(--rule); stroke-width:1.4; stroke-dasharray:5 4; }
    .bad    { fill:var(--gone-soft); stroke:var(--gone); stroke-width:1.2; }
    .good   { fill:var(--code-soft); stroke:var(--code); stroke-width:1.2; }
    .decide { fill:var(--accent-soft); }
    .bar    { fill:var(--accent); }
    .row    { stroke:var(--rule); stroke-width:1; }
    .foot   { fill:var(--surface-2); }
    .t-lbl  { fill:var(--ink-3); font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:9.5px; letter-spacing:.1em; }
    .t-tag  { font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:9.5px; letter-spacing:.1em; font-weight:600; }
    .t-q    { fill:var(--ink); font-family:system-ui,-apple-system,sans-serif; font-weight:600; font-size:15px; }
    .t-h    { font-family:system-ui,-apple-system,sans-serif; font-weight:600; font-size:14px; }
    .t-b    { fill:var(--ink); font-family:system-ui,-apple-system,sans-serif; font-size:12.5px; }
    .t-s    { fill:var(--ink-2); font-family:system-ui,-apple-system,sans-serif; font-size:11px; }
    .mark   { font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:16px; font-weight:700; }
    .plus   { fill:var(--code); }
    .minus  { fill:var(--gone); }
    .c-code { fill:var(--code); }
    .c-mute { fill:var(--ink-3); }
    .c-lost { fill:var(--ink-2); }
    .c-acc  { fill:var(--accent); }
    .c-gone { fill:var(--gone); }
  </style>

  <rect class="bg" x="0" y="0" width="940" height="434"/>
  <g id="call">
    <rect class="ask" x="16" y="14" width="908" height="48" rx="6"/>
    <text class="t-lbl" x="32" y="32">D2 · THE CALL</text>
    <text class="t-q" x="32" y="52">Where does this issue stop: at the block, or with the harness manager too?</text>
  </g>
  <g id="options">
    <rect class="chosen" x="212" y="76" width="340" height="46" rx="5"/>
    <text class="t-tag c-code" x="226" y="93">CHOSEN</text>
    <text class="t-h c-code" x="226" y="112">Stop at the block</text>
    <rect class="lost" x="568" y="76" width="340" height="46" rx="5"/>
    <text class="t-tag c-mute" x="582" y="93">INSTEAD OF</text>
    <text class="t-h c-lost" x="582" y="112">The manager fetches now</text>
  </g>
  <g id="row-1">
    <rect class="decide" x="16" y="134" width="908" height="62" rx="4"/>
    <rect class="bar" x="16" y="134" width="4" height="62"/>
    <text class="t-lbl" x="32" y="154">WHO CALLS IT</text>
    <text class="t-tag c-acc" x="32" y="186">▸ DECIDES IT</text>
    <text class="mark plus" x="216" y="162">+</text>
    <text class="t-b" x="234" y="161">Kitchen Sink and any host</text>
    <text class="t-s" x="234" y="179">today, through cursorAgent</text>
    <text class="mark minus" x="572" y="162">−</text>
    <text class="t-b" x="590" y="161">No one yet</text>
    <text class="t-s" x="590" y="179">the worker route isn&#x27;t built</text>
    <line class="row" x1="16" y1="196" x2="924" y2="196"/>
  </g>
  <g id="row-2">
    <text class="t-lbl" x="32" y="216">WHAT IS SETTLED</text>
    <text class="mark plus" x="216" y="224">+</text>
    <text class="t-b" x="234" y="223">Everything it ships</text>
    <text class="t-s" x="234" y="241">one run, one branch, one result</text>
    <text class="mark minus" x="572" y="224">−</text>
    <text class="t-b" x="590" y="223">Six open meanings</text>
    <text class="t-s" x="590" y="241">retries, output branch, talk, base…</text>
    <line class="row" x1="16" y1="258" x2="924" y2="258"/>
  </g>
  <g id="row-3">
    <text class="t-lbl" x="32" y="278">WHAT IT COSTS</text>
    <text class="mark minus" x="216" y="286">−</text>
    <text class="t-b" x="234" y="285">Workers wait for the cloud</text>
    <text class="t-s" x="234" y="303">until FIX-2257</text>
    <text class="mark minus" x="572" y="286">−</text>
    <text class="t-b" x="590" y="285">A feed and a fetch step</text>
    <text class="t-s" x="590" y="303">in harness-manager, untested by use</text>
    <line class="row" x1="16" y1="320" x2="924" y2="320"/>
  </g>
  <g id="foot">
    <rect class="foot" x="16" y="336" width="446" height="74" rx="5"/>
    <text class="t-lbl" x="32" y="357">LOCKS IN</text>
    <text class="t-b" x="32" y="377">The block, the core field and Kitchen Sink ship here</text>
    <text class="t-s" x="32" y="395">a cloud worker waits for FIX-2257</text>
    <rect class="foot" x="478" y="336" width="446" height="74" rx="5"/>
    <text class="t-lbl" x="494" y="357">FLIPS IF</text>
    <text class="t-b" x="494" y="377">FIX-2154&#x27;s routing ships before this does</text>
    <text class="t-s" x="494" y="395">then FIX-2257 folds in, its inputs answered</text>
  </g>
</svg>
