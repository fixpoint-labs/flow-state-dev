<svg viewBox="0 0 940 420" role="img" aria-label="D1, how a screen reads the project a conversation works in. Chosen: the session read, which shows workProjectId read only. Instead of: a workforce client call. It comes down to the first row, one rule for visible session state: the session read follows the rule FIX-2278 already applies, while a client call is a second answer for one field. The price is the second row: a person who left the project still sees the id they set, though every run there is refused. The third row is a tie: neither gives a way to write it. Locks in: worker session reads carry workProjectId. Flips if: project ids become sensitive to people who left."
     xmlns="http://www.w3.org/2000/svg">
  <style>
    :root { --surface:#FCFCFA; --surface-2:#E8E8E1; --ink:#191C21; --ink-2:#4C535B; --ink-3:#7A828B;
            --rule:#D5D4CB; --accent:#3E4E8C; --accent-soft:#E0E3F0; --code:#2C7C69; --code-soft:#DCEDE7;
            --gone:#A9544F; }
    @media (prefers-color-scheme: dark) {
      :root { --surface:#181C1F; --surface-2:#202528; --ink:#E6E8E5; --ink-2:#A4ACB1; --ink-3:#737B81;
              --rule:#2B3135; --accent:#8B9BD8; --accent-soft:#1B2140; --code:#5DBBA1; --code-soft:#14302A;
              --gone:#DE8A84; } }
    .bg     { fill:var(--surface); }
    .ask    { fill:var(--surface-2); }
    .chosen { fill:var(--code-soft); stroke:var(--code); stroke-width:1.6; }
    .lost   { fill:var(--surface); stroke:var(--rule); stroke-width:1.4; stroke-dasharray:5 4; }
    .decide { fill:var(--accent-soft); }
    .bar    { fill:var(--accent); }
    .row    { stroke:var(--rule); stroke-width:1; }
    .foot   { fill:var(--surface-2); }
    .t-lbl  { fill:var(--ink-3); font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:9.5px; letter-spacing:.1em; }
    .t-tag  { font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:9.5px; letter-spacing:.1em; font-weight:600; }
    .t-q    { fill:var(--ink); font-family:system-ui,-apple-system,sans-serif; font-weight:600; font-size:15px; }
    .t-h    { font-family:system-ui,-apple-system,sans-serif; font-weight:600; font-size:14px; }
    .t-b    { fill:var(--ink); font-family:system-ui,-apple-system,sans-serif; font-size:12.5px; }
    .t-s    { fill:var(--ink-2); font-family:system-ui,-apple-system,sans-serif; font-size:11px; }
    .mark   { font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:16px; font-weight:700; }
    .plus   { fill:var(--code); }
    .minus  { fill:var(--gone); }
    .tie    { fill:var(--ink-3); }
    .c-code { fill:var(--code); }
    .c-mute { fill:var(--ink-3); }
    .c-lost { fill:var(--ink-2); }
    .c-acc  { fill:var(--accent); }
  </style>
  <rect class="bg" x="0" y="0" width="940" height="420"/>
  <g id="the-call">
    <rect class="ask" x="16" y="14" width="908" height="48" rx="6"/>
    <text class="t-lbl" x="32" y="32">D1 · THE CALL</text>
    <text class="t-q" x="32" y="52">How does a screen read the project a conversation works in?</text>
  </g>
  <g id="options">
    <rect class="chosen" x="212" y="76" width="348" height="46" rx="5"/>
    <text class="t-tag c-code" x="228" y="93">CHOSEN</text>
    <text class="t-h c-code" x="228" y="112">The session read</text>
    <rect class="lost" x="576" y="76" width="348" height="46" rx="5"/>
    <text class="t-tag c-mute" x="592" y="93">INSTEAD OF</text>
    <text class="t-h c-lost" x="592" y="112">A workforce client call</text>
  </g>
  <g id="row-0">
    <rect class="decide" x="16" y="134" width="908" height="62" rx="4"/>
    <rect class="bar" x="16" y="134" width="4" height="62"/>
    <text class="t-lbl" x="32" y="156">ONE RULE FOR</text>
    <text class="t-lbl" x="32" y="169">VISIBLE STATE</text>
    <text class="t-tag c-acc" x="32" y="186">▸ DECIDES IT</text>
    <text class="mark plus" x="228" y="162">+</text>
    <text class="t-b" x="248" y="161">The engine’s expose, already set</text>
    <text class="t-s" x="248" y="179">FIX-2278, in the read and listing</text>
    <text class="mark minus" x="592" y="162">−</text>
    <text class="t-b" x="612" y="161">A second answer for one field</text>
    <text class="t-s" x="612" y="179">two reads that can drift</text>
  </g>
  <g id="row-1">
    <text class="t-lbl" x="32" y="218">SOMEONE WHO</text>
    <text class="t-lbl" x="32" y="231">LEFT THE PROJECT</text>
    <text class="mark minus" x="228" y="224">−</text>
    <text class="t-b" x="248" y="223">Still sees the id they set</text>
    <text class="t-s" x="248" y="241">every run there is refused</text>
    <text class="mark plus" x="592" y="224">+</text>
    <text class="t-b" x="612" y="223">Can be refused at read time</text>
    <text class="t-s" x="612" y="241">a membership check per poll</text>
    <line class="row" x1="16" y1="252" x2="924" y2="252"/>
  </g>
  <g id="row-2">
    <text class="t-lbl" x="32" y="276">WRITING</text>
    <text class="t-lbl" x="32" y="289">IT</text>
    <text class="mark tie" x="228" y="282">=</text>
    <text class="t-b" x="248" y="281">No way in</text>
    <text class="t-s" x="248" y="299">still serverOwned</text>
    <text class="mark tie" x="592" y="282">=</text>
    <text class="t-b" x="612" y="281">No way in</text>
    <text class="t-s" x="612" y="299">read only too</text>
    <line class="row" x1="16" y1="310" x2="924" y2="310"/>
  </g>
  <g id="locks-in">
    <rect class="foot" x="16" y="330" width="446" height="74" rx="5"/>
    <text class="t-lbl" x="32" y="351">LOCKS IN</text>
    <text class="t-b" x="32" y="371">Worker session reads carry workProjectId</text>
    <text class="t-s" x="32" y="389">removing it breaks a screen</text>
  </g>
  <g id="flips-if">
    <rect class="foot" x="478" y="330" width="446" height="74" rx="5"/>
    <text class="t-lbl" x="494" y="351">FLIPS IF</text>
    <text class="t-b" x="494" y="371">Project ids become sensitive</text>
    <text class="t-s" x="494" y="389">to people who left: check at read</text>
  </g>
</svg>
