<svg viewBox="0 0 940 426" role="img" aria-label="D2, when a task&#x27;s count moves. Chosen: every few seconds while the run works, with harnesses reporting as they go. Instead of: once, at each request&#x27;s ending. Decides it: the ask is a count that ticks up during the run. The price: a row write every few seconds per running task. Locks in: repeated harness reports keyed by run. Flips if: a store finds a write every few seconds too dear; then the interval widens."
     xmlns="http://www.w3.org/2000/svg">
  <style>
    :root { --surface:#FCFCFA; --surface-2:#E8E8E1; --ink:#191C21; --ink-2:#4C535B; --ink-3:#7A828B;
            --rule:#D5D4CB; --accent:#3E4E8C; --accent-soft:#E0E3F0; --code:#2C7C69; --code-soft:#DCEDE7;
            --gone:#A9544F; }
    @media (prefers-color-scheme: dark) {
      :root { --surface:#181C1F; --surface-2:#202528; --ink:#E6E8E5; --ink-2:#A4ACB1; --ink-3:#737B81;
              --rule:#2B3135; --accent:#8B9BD8; --accent-soft:#1B2140; --code:#5DBBA1; --code-soft:#14302A;
              --gone:#DE8A84; } }
    .bg     { fill:var(--surface); }
    .ask    { fill:var(--surface-2); }
    .chosen { fill:var(--code-soft); stroke:var(--code); stroke-width:1.6; }
    .lost   { fill:var(--surface); stroke:var(--rule); stroke-width:1.4; stroke-dasharray:5 4; }
    .decide { fill:var(--accent-soft); }
    .bar    { fill:var(--accent); }
    .row    { stroke:var(--rule); stroke-width:1; }
    .foot   { fill:var(--surface-2); }
    .t-lbl  { fill:var(--ink-3); font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:9.5px; letter-spacing:.1em; }
    .t-tag  { font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:9.5px; letter-spacing:.1em; font-weight:600; }
    .t-q    { fill:var(--ink); font-family:system-ui,-apple-system,sans-serif; font-weight:600; font-size:15px; }
    .t-h    { font-family:system-ui,-apple-system,sans-serif; font-weight:600; font-size:14px; }
    .t-b    { fill:var(--ink); font-family:system-ui,-apple-system,sans-serif; font-size:12.5px; }
    .t-s    { fill:var(--ink-2); font-family:system-ui,-apple-system,sans-serif; font-size:11px; }
    .mark   { font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:16px; font-weight:700; }
    .plus   { fill:var(--code); }
    .minus  { fill:var(--gone); }
    .tie    { fill:var(--ink-3); }
    .c-code { fill:var(--code); }
    .c-mute { fill:var(--ink-3); }
    .c-lost { fill:var(--ink-2); }
    .c-acc  { fill:var(--accent); }
  </style>
  <rect class="bg" x="0" y="0" width="940" height="426"/>
  <g id="the-call">
    <rect class="ask" x="16" y="14" width="908" height="48" rx="6"/>
    <text class="t-lbl" x="32" y="32">D2 · THE CALL</text>
    <text class="t-q" x="32" y="52">When does a task&#x27;s count move?</text>
  </g>
  <g id="options">
    <rect class="chosen" x="212" y="76" width="348" height="46" rx="5"/>
    <text class="t-tag c-code" x="228" y="93">CHOSEN</text>
    <text class="t-h c-code" x="228" y="112">Every few seconds, as it runs</text>
    <rect class="lost" x="576" y="76" width="348" height="46" rx="5"/>
    <text class="t-tag c-mute" x="592" y="93">INSTEAD OF</text>
    <text class="t-h c-lost" x="592" y="112">Once, at each ending</text>
  </g>
  <g id="row-1">
    <rect class="decide" x="16" y="134" width="908" height="62" rx="4"/>
    <rect class="bar" x="16" y="134" width="4" height="62"/>
    <text class="t-lbl" x="32" y="156">THE ASK</text>
    <text class="t-tag c-acc" x="32" y="186">▸ DECIDES IT</text>
    <text class="mark plus" x="228" y="162">+</text>
    <text class="t-b" x="248" y="161">Ticks up during the run</text>
    <text class="t-s" x="248" y="179">as far as the vendor reports</text>
    <text class="mark minus" x="592" y="162">−</text>
    <text class="t-b" x="612" y="161">Moves only at the end</text>
    <text class="t-s" x="612" y="179">a ten-minute run reads flat</text>
  </g>
  <g id="row-2">
    <text class="t-lbl" x="32" y="218">STORE WRITES</text>
    <text class="mark minus" x="228" y="224">−</text>
    <text class="t-b" x="248" y="223">One per task every few seconds</text>
    <text class="t-s" x="248" y="241">only while the count changed</text>
    <text class="mark plus" x="592" y="224">+</text>
    <text class="t-b" x="612" y="223">One per request ending</text>
    <text class="t-s" x="612" y="241">as the check writes today</text>
    <line class="row" x1="16" y1="256" x2="924" y2="256"/>
  </g>
  <g id="row-3">
    <text class="t-lbl" x="32" y="280">CODEX AND CURSOR</text>
    <text class="mark tie" x="228" y="286">=</text>
    <text class="t-b" x="248" y="285">Per finished turn</text>
    <text class="t-s" x="248" y="303">not reported until then</text>
    <text class="mark tie" x="592" y="286">=</text>
    <text class="t-b" x="612" y="285">Per finished turn</text>
    <text class="t-s" x="612" y="303">not reported until then</text>
    <line class="row" x1="16" y1="318" x2="924" y2="318"/>
  </g>
  <g id="locks-in">
    <rect class="foot" x="16" y="336" width="446" height="74" rx="5"/>
    <text class="t-lbl" x="32" y="357">LOCKS IN</text>
    <text class="t-b" x="32" y="377">reportHarnessSpend keyed by run</text>
    <text class="t-s" x="32" y="395">called at start, per usage event, at end</text>
  </g>
  <g id="flips-if">
    <rect class="foot" x="478" y="336" width="446" height="74" rx="5"/>
    <text class="t-lbl" x="494" y="357">FLIPS IF</text>
    <text class="t-b" x="494" y="377">A store where the writes are too dear</text>
    <text class="t-s" x="494" y="395">then the interval widens, the shape stays</text>
  </g>
</svg>
