<svg viewBox="0 0 940 418" role="img" aria-label="D1, what a check refuses in contributor docs and skills. Chosen: retired names everywhere, and retired meanings of English words only in code and published pages. Instead of: every rule in every tree. It comes down to the first row: with every rule the sweep finds 152 hits in 36 contributor files, most of them the English ask, meaning the owner&#x27;s question; with names only it finds 66 in 14 files, most of them a Claude tool name, a workflow field, or a real leftover. The cost: a skill that says hand off for new work is not caught. Locks in that each glossary entry says whether it retires a name or a meaning. Flips if a contributor-prose misuse is found to mislead an agent."
     xmlns="http://www.w3.org/2000/svg">
  <style>
    :root { --surface:#FCFCFA; --surface-2:#E8E8E1; --ink:#191C21; --ink-2:#4C535B; --ink-3:#7A828B;
            --rule:#D5D4CB; --accent:#3E4E8C; --accent-soft:#E0E3F0; --code:#2C7C69; --code-soft:#DCEDE7;
            --prose:#A8761C; --prose-soft:#F3E8D2; --gone:#A9544F; --gone-soft:#F2E1DF; }
    @media (prefers-color-scheme: dark) {
      :root { --surface:#181C1F; --surface-2:#202528; --ink:#E6E8E5; --ink-2:#A4ACB1; --ink-3:#737B81;
              --rule:#2B3135; --accent:#8B9BD8; --accent-soft:#1B2140; --code:#5DBBA1; --code-soft:#14302A;
              --prose:#D9A44B; --prose-soft:#332612; --gone:#DE8A84; --gone-soft:#3A1F1D; } }
    .bg     { fill:var(--surface); }
    .ask    { fill:var(--surface-2); }
    .chosen { fill:var(--code-soft); stroke:var(--code); stroke-width:1.6; }
    .lost   { fill:var(--surface); stroke:var(--rule); stroke-width:1.4; stroke-dasharray:5 4; }
    .decide { fill:var(--accent-soft); }
    .bar    { fill:var(--accent); }
    .row    { stroke:var(--rule); stroke-width:1; }
    .foot   { fill:var(--surface-2); }
    .box    { fill:var(--surface); stroke:var(--rule); stroke-width:1.2; }
    .keep   { fill:var(--surface-2); stroke:var(--rule); stroke-width:1.2; }
    .new    { fill:var(--code-soft); stroke:var(--code); stroke-width:1.6; }
    .gonebox{ fill:var(--gone-soft); stroke:var(--gone); stroke-width:1.2; stroke-dasharray:5 4; }
    .arrow  { stroke:var(--ink-3); stroke-width:1.3; fill:none; }
    .t-lbl  { fill:var(--ink-3); font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:9.5px; letter-spacing:.1em; }
    .t-tag  { font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:9.5px; letter-spacing:.1em; font-weight:600; }
    .t-q    { fill:var(--ink); font-family:system-ui,-apple-system,sans-serif; font-weight:600; font-size:15px; }
    .t-h    { font-family:system-ui,-apple-system,sans-serif; font-weight:600; font-size:14px; }
    .t-b    { fill:var(--ink); font-family:system-ui,-apple-system,sans-serif; font-size:12.5px; }
    .t-s    { fill:var(--ink-2); font-family:system-ui,-apple-system,sans-serif; font-size:11px; }
    .t-m    { fill:var(--ink); font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:11px; }
    .mark   { font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:16px; font-weight:700; }
    .plus   { fill:var(--code); }
    .minus  { fill:var(--gone); }
    .tie    { fill:var(--ink-3); }
    .c-code { fill:var(--code); }
    .c-mute { fill:var(--ink-3); }
    .c-lost { fill:var(--ink-2); }
    .c-acc  { fill:var(--accent); }
    .c-gone { fill:var(--gone); }
  </style>
  <rect class="bg" x="0" y="0" width="940" height="418"/>
  <g id="the-call">
    <rect class="ask" x="16" y="14" width="908" height="48" rx="6"/>
    <text class="t-lbl" x="32" y="32">D1 · THE CALL</text>
    <text class="t-q" x="32" y="52">In skills and contributor docs, does a check refuse retired names, or every use?</text>
  </g>
  <g id="options">
    <rect class="chosen" x="212" y="76" width="348" height="46" rx="5"/>
    <text class="t-tag c-code" x="228" y="93">CHOSEN</text>
    <text class="t-h c-code" x="228" y="112">Names everywhere, meanings in code</text>
    <rect class="lost" x="576" y="76" width="348" height="46" rx="5"/>
    <text class="t-tag c-mute" x="592" y="93">INSTEAD OF</text>
    <text class="t-h c-lost" x="592" y="112">Every rule, every tree</text>
  </g>
  <g id="row-1">
    <rect class="decide" x="16" y="134" width="908" height="62" rx="4"/>
    <rect class="bar" x="16" y="134" width="4" height="62"/>
    <text class="t-lbl" x="32" y="156">WHAT A SKILL</text>
    <text class="t-lbl" x="32" y="169">AUTHOR HITS</text>
    <text class="t-tag c-acc" x="32" y="186">▸ DECIDES IT</text>
    <text class="mark plus" x="228" y="163">+</text>
    <text class="t-b" x="248" y="162">66 sweep hits in 14 files</text>
    <text class="t-s" x="248" y="180">AskUserQuestion, openQuestions, leftovers</text>
    <text class="mark minus" x="592" y="163">−</text>
    <text class="t-b" x="612" y="162">152 sweep hits in 36 files</text>
    <text class="t-s" x="612" y="180">most of them the owner&#x27;s ask, in English</text>
  </g>
  <g id="row-2">
    <text class="t-lbl" x="32" y="218">A RETIRED</text>
    <text class="t-lbl" x="32" y="231">NAME</text>
    <text class="mark tie" x="228" y="225">=</text>
    <text class="t-b" x="248" y="224">Refused</text>
    <text class="t-s" x="248" y="242">isInProcessDispatcher fails CI</text>
    <text class="mark tie" x="592" y="225">=</text>
    <text class="t-b" x="612" y="224">Refused</text>
    <text class="t-s" x="612" y="242">the same</text>
    <line class="row" x1="16" y1="254" x2="924" y2="254"/>
  </g>
  <g id="row-3">
    <text class="t-lbl" x="32" y="276">AN ENGLISH</text>
    <text class="t-lbl" x="32" y="289">MISUSE</text>
    <text class="mark minus" x="228" y="283">−</text>
    <text class="t-b" x="248" y="282">Not caught in a skill</text>
    <text class="t-s" x="248" y="300">hand it off, for new work</text>
    <text class="mark plus" x="592" y="283">+</text>
    <text class="t-b" x="612" y="282">Caught</text>
    <text class="t-s" x="612" y="300">and classified by hand</text>
    <line class="row" x1="16" y1="312" x2="924" y2="312"/>
  </g>
  <g id="locks-in">
    <rect class="foot" x="16" y="328" width="446" height="74" rx="5"/>
    <text class="t-lbl" x="32" y="349">LOCKS IN</text>
    <text class="t-b" x="32" y="369">Each glossary entry is a name or a meaning</text>
    <text class="t-s" x="32" y="387">a new retirement is a name unless it says otherwise</text>
  </g>
  <g id="flips-if">
    <rect class="foot" x="478" y="328" width="446" height="74" rx="5"/>
    <text class="t-lbl" x="494" y="349">FLIPS IF</text>
    <text class="t-b" x="494" y="369">A skill&#x27;s prose misleads an agent</text>
    <text class="t-s" x="494" y="387">then that meaning reaches contributor trees too</text>
  </g>
</svg>
