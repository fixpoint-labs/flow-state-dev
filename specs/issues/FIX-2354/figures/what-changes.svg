<svg viewBox="0 0 940 464" role="img" aria-label="Which trees each check reads, before and after. Columns: the sweep and the Workforce guard. Before: both read packages, apps and docs/architecture. Pending changesets are read by the sweep only. labs and examples are read by the guard only. goals is read by one sweep rule. docs/contributing, .agents and the root CLAUDE.md, AGENTS.md and CONTRIBUTING.md are read by neither. After: every tree is read by both, for retired names; English meanings are read in code and published pages only. History stays out by a named rule."
     xmlns="http://www.w3.org/2000/svg">
  <style>
    :root { --surface:#FCFCFA; --surface-2:#E8E8E1; --ink:#191C21; --ink-2:#4C535B; --ink-3:#7A828B;
            --rule:#D5D4CB; --accent:#3E4E8C; --accent-soft:#E0E3F0; --code:#2C7C69; --code-soft:#DCEDE7;
            --prose:#A8761C; --prose-soft:#F3E8D2; --gone:#A9544F; --gone-soft:#F2E1DF; }
    @media (prefers-color-scheme: dark) {
      :root { --surface:#181C1F; --surface-2:#202528; --ink:#E6E8E5; --ink-2:#A4ACB1; --ink-3:#737B81;
              --rule:#2B3135; --accent:#8B9BD8; --accent-soft:#1B2140; --code:#5DBBA1; --code-soft:#14302A;
              --prose:#D9A44B; --prose-soft:#332612; --gone:#DE8A84; --gone-soft:#3A1F1D; } }
    .bg     { fill:var(--surface); }
    .ask    { fill:var(--surface-2); }
    .chosen { fill:var(--code-soft); stroke:var(--code); stroke-width:1.6; }
    .lost   { fill:var(--surface); stroke:var(--rule); stroke-width:1.4; stroke-dasharray:5 4; }
    .decide { fill:var(--accent-soft); }
    .bar    { fill:var(--accent); }
    .row    { stroke:var(--rule); stroke-width:1; }
    .foot   { fill:var(--surface-2); }
    .box    { fill:var(--surface); stroke:var(--rule); stroke-width:1.2; }
    .keep   { fill:var(--surface-2); stroke:var(--rule); stroke-width:1.2; }
    .new    { fill:var(--code-soft); stroke:var(--code); stroke-width:1.6; }
    .gonebox{ fill:var(--gone-soft); stroke:var(--gone); stroke-width:1.2; stroke-dasharray:5 4; }
    .arrow  { stroke:var(--ink-3); stroke-width:1.3; fill:none; }
    .t-lbl  { fill:var(--ink-3); font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:9.5px; letter-spacing:.1em; }
    .t-tag  { font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:9.5px; letter-spacing:.1em; font-weight:600; }
    .t-q    { fill:var(--ink); font-family:system-ui,-apple-system,sans-serif; font-weight:600; font-size:15px; }
    .t-h    { font-family:system-ui,-apple-system,sans-serif; font-weight:600; font-size:14px; }
    .t-b    { fill:var(--ink); font-family:system-ui,-apple-system,sans-serif; font-size:12.5px; }
    .t-s    { fill:var(--ink-2); font-family:system-ui,-apple-system,sans-serif; font-size:11px; }
    .t-m    { fill:var(--ink); font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:11px; }
    .mark   { font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:16px; font-weight:700; }
    .plus   { fill:var(--code); }
    .minus  { fill:var(--gone); }
    .tie    { fill:var(--ink-3); }
    .c-code { fill:var(--code); }
    .c-mute { fill:var(--ink-3); }
    .c-lost { fill:var(--ink-2); }
    .c-acc  { fill:var(--accent); }
    .c-gone { fill:var(--gone); }
  </style>
  <rect class="bg" x="0" y="0" width="940" height="464"/>
  <text class="t-lbl" x="316" y="28">BEFORE</text>
  <text class="t-lbl" x="630" y="28">AFTER</text>
  <text class="t-lbl" x="389" y="56" text-anchor="middle">THE</text>
  <text class="t-lbl" x="389" y="68" text-anchor="middle">SWEEP</text>
  <text class="t-lbl" x="703" y="56" text-anchor="middle">THE</text>
  <text class="t-lbl" x="703" y="68" text-anchor="middle">SWEEP</text>
  <text class="t-lbl" x="536" y="56" text-anchor="middle">THE</text>
  <text class="t-lbl" x="536" y="68" text-anchor="middle">GUARD</text>
  <text class="t-lbl" x="850" y="56" text-anchor="middle">THE</text>
  <text class="t-lbl" x="850" y="68" text-anchor="middle">GUARD</text>
  <line class="row" x1="620" y1="20" x2="620" y2="398"/>
  <text class="t-m" x="24" y="107">packages/ · apps/</text>
  <text class="mark plus" x="389" y="114" text-anchor="middle">●</text>
  <text class="mark plus" x="536" y="114" text-anchor="middle">●</text>
  <text class="mark plus" x="703" y="114" text-anchor="middle">●</text>
  <text class="mark plus" x="850" y="114" text-anchor="middle">●</text>
  <line class="row" x1="16" y1="126" x2="924" y2="126"/>
  <text class="t-m" x="24" y="141">docs/architecture/</text>
  <text class="mark plus" x="389" y="148" text-anchor="middle">●</text>
  <text class="mark plus" x="536" y="148" text-anchor="middle">●</text>
  <text class="mark plus" x="703" y="148" text-anchor="middle">●</text>
  <text class="mark plus" x="850" y="148" text-anchor="middle">●</text>
  <line class="row" x1="16" y1="160" x2="924" y2="160"/>
  <text class="t-m" x="24" y="175">.changeset/ (pending)</text>
  <text class="mark plus" x="389" y="182" text-anchor="middle">●</text>
  <text class="mark tie" x="536" y="182" text-anchor="middle">—</text>
  <text class="mark plus" x="703" y="182" text-anchor="middle">●</text>
  <text class="mark plus" x="850" y="182" text-anchor="middle">●</text>
  <line class="row" x1="16" y1="194" x2="924" y2="194"/>
  <text class="t-m" x="24" y="209">labs/ · examples/</text>
  <text class="t-s" x="24" y="222">about 66 retired names today</text>
  <text class="mark tie" x="389" y="216" text-anchor="middle">—</text>
  <text class="mark plus" x="536" y="216" text-anchor="middle">●</text>
  <text class="mark plus" x="703" y="216" text-anchor="middle">●</text>
  <text class="mark plus" x="850" y="216" text-anchor="middle">●</text>
  <line class="row" x1="16" y1="228" x2="924" y2="228"/>
  <text class="t-m" x="24" y="243">goals/</text>
  <text class="mark tie" x="389" y="250" text-anchor="middle">◐</text>
  <text class="mark tie" x="536" y="250" text-anchor="middle">—</text>
  <text class="mark plus" x="703" y="250" text-anchor="middle">●</text>
  <text class="mark plus" x="850" y="250" text-anchor="middle">●</text>
  <line class="row" x1="16" y1="262" x2="924" y2="262"/>
  <rect class="decide" x="16" y="262" width="908" height="34" rx="3"/>
  <text class="t-m" x="24" y="277">docs/contributing/</text>
  <text class="mark tie" x="389" y="284" text-anchor="middle">—</text>
  <text class="mark tie" x="536" y="284" text-anchor="middle">—</text>
  <text class="mark plus" x="703" y="284" text-anchor="middle">●</text>
  <text class="mark plus" x="850" y="284" text-anchor="middle">●</text>
  <line class="row" x1="16" y1="296" x2="924" y2="296"/>
  <rect class="decide" x="16" y="296" width="908" height="34" rx="3"/>
  <text class="t-m" x="24" y="311">.agents/</text>
  <text class="mark tie" x="389" y="318" text-anchor="middle">—</text>
  <text class="mark tie" x="536" y="318" text-anchor="middle">—</text>
  <text class="mark plus" x="703" y="318" text-anchor="middle">●</text>
  <text class="mark plus" x="850" y="318" text-anchor="middle">●</text>
  <line class="row" x1="16" y1="330" x2="924" y2="330"/>
  <text class="t-m" x="24" y="345">CLAUDE.md · AGENTS.md · CONTRIBUTING.md</text>
  <text class="mark tie" x="389" y="352" text-anchor="middle">—</text>
  <text class="mark tie" x="536" y="352" text-anchor="middle">—</text>
  <text class="mark plus" x="703" y="352" text-anchor="middle">●</text>
  <text class="mark plus" x="850" y="352" text-anchor="middle">●</text>
  <line class="row" x1="16" y1="364" x2="924" y2="364"/>
  <text class="t-m" x="24" y="379">specs/ · docs/internal/ · CHANGELOG.md</text>
  <text class="t-s" x="24" y="392">history, out by a named rule</text>
  <text class="mark tie" x="389" y="386" text-anchor="middle">—</text>
  <text class="mark tie" x="536" y="386" text-anchor="middle">—</text>
  <text class="mark tie" x="703" y="386" text-anchor="middle">—</text>
  <text class="mark tie" x="850" y="386" text-anchor="middle">—</text>
  <line class="row" x1="16" y1="398" x2="924" y2="398"/>
  <text class="t-s" x="16" y="424">Filled dot: read for retired names. Half dot: one rule only. Dash: not read. The side-chain check already reads every tracked TypeScript file, wherever it sits.</text>
</svg>
