<svg viewBox="0 0 940 418" role="img" aria-label="D1: after a send, how does the sent line reach the top of the view? Chosen: keep room below a short reply, so the line rises once at the send. Instead of: follow the reply down until the line reaches the top. It comes down to whether the view moves during the reply: once at the send, versus on every line of a short reply. The price is blank space under a short reply. Both put the reply in view. Locks in that space until the next send, open or switch. Flips if people read the blank space as broken."
     xmlns="http://www.w3.org/2000/svg">
  <style>
    :root { --surface:#FCFCFA; --surface-2:#E8E8E1; --ink:#191C21; --ink-2:#4C535B; --ink-3:#7A828B;
            --rule:#D5D4CB; --accent:#3E4E8C; --accent-soft:#E0E3F0; --code:#2C7C69; --code-soft:#DCEDE7;
            --prose:#A8761C; --prose-soft:#F3E8D2; --gone:#A9544F; }
    @media (prefers-color-scheme: dark) {
      :root { --surface:#181C1F; --surface-2:#202528; --ink:#E6E8E5; --ink-2:#A4ACB1; --ink-3:#737B81;
              --rule:#2B3135; --accent:#8B9BD8; --accent-soft:#1B2140; --code:#5DBBA1; --code-soft:#14302A;
              --prose:#D9A44B; --prose-soft:#332612; --gone:#DE8A84; } }
    .bg     { fill:var(--surface); }
    .ask    { fill:var(--surface-2); }
    .chosen { fill:var(--code-soft); stroke:var(--code); stroke-width:1.6; }
    .lost   { fill:var(--surface); stroke:var(--rule); stroke-width:1.4; stroke-dasharray:5 4; }
    .decide { fill:var(--accent-soft); }
    .bar    { fill:var(--accent); }
    .row    { stroke:var(--rule); stroke-width:1; }
    .foot   { fill:var(--surface-2); }
    .t-lbl  { fill:var(--ink-3); font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:9.5px; letter-spacing:.1em; }
    .t-tag  { font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:9.5px; letter-spacing:.1em; font-weight:600; }
    .t-q    { fill:var(--ink); font-family:system-ui,-apple-system,sans-serif; font-weight:600; font-size:15px; }
    .t-h    { font-family:system-ui,-apple-system,sans-serif; font-weight:600; font-size:14px; }
    .t-b    { fill:var(--ink); font-family:system-ui,-apple-system,sans-serif; font-size:12.5px; }
    .t-s    { fill:var(--ink-2); font-family:system-ui,-apple-system,sans-serif; font-size:11px; }
    .mark   { font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:16px; font-weight:700; }
    .plus   { fill:var(--code); }
    .minus  { fill:var(--gone); }
    .tie    { fill:var(--ink-3); }
    .c-code { fill:var(--code); }
    .c-mute { fill:var(--ink-3); }
    .c-lost { fill:var(--ink-2); }
    .c-acc  { fill:var(--accent); }
    .view   { fill:none; stroke:var(--accent); stroke-width:2; }
    .line   { fill:var(--prose-soft); stroke:var(--prose); stroke-width:1.2; }
    .reply  { fill:var(--code-soft); stroke:var(--code); stroke-width:1.2; }
    .old    { fill:var(--surface-2); }
    .room   { fill:none; stroke:var(--ink-3); stroke-width:1; stroke-dasharray:3 3; }
    .hidden { fill:var(--code-soft); stroke:var(--code); stroke-width:1.2; stroke-dasharray:4 3; opacity:.6; }
  </style>

  <rect class="bg" x="0" y="0" width="940" height="418"/>
  <g id="the-call">
    <rect class="ask" x="16" y="14" width="908" height="48" rx="6"/>
    <text class="t-lbl" x="32" y="32">D1 · THE CALL</text>
    <text class="t-q" x="32" y="52">After a send, how does your line reach the top of the view?</text>
  </g>
  <g id="options">
    <rect class="chosen" x="212" y="76" width="348" height="46" rx="5"/>
    <text class="t-tag c-code" x="228" y="93">CHOSEN</text>
    <text class="t-h c-code" x="228" y="112">Keep room below; the line rises at once</text>
    <rect class="lost" x="576" y="76" width="348" height="46" rx="5"/>
    <text class="t-tag c-mute" x="592" y="93">INSTEAD OF</text>
    <text class="t-h c-lost" x="592" y="112">Follow the reply until the line is at the top</text>
  </g>
  <g id="row-1">
    <rect class="decide" x="16" y="134" width="908" height="62" rx="4"/>
    <rect class="bar" x="16" y="134" width="4" height="62"/>
    <text class="t-lbl" x="32" y="156">VIEW MOVES</text>
    <text class="t-lbl" x="32" y="169">DURING REPLY</text>
    <text class="t-tag c-acc" x="32" y="186">▸ DECIDES IT</text>
    <text class="mark plus" x="228" y="162">+</text>
    <text class="t-b" x="248" y="161">Once, at the send</text>
    <text class="t-s" x="248" y="179">never while the reply streams</text>
    <text class="mark minus" x="592" y="162">−</text>
    <text class="t-b" x="612" y="161">On every line of a short reply</text>
    <text class="t-s" x="612" y="179">while the reader reads its start</text>
  </g>
  <g id="row-2">
    <text class="t-lbl" x="32" y="216">SHORT REPLY</text>
    <text class="mark minus" x="228" y="218">−</text>
    <text class="t-b" x="248" y="217">Blank space under it</text>
    <text class="t-s" x="248" y="235">until the next send, open or switch</text>
    <text class="mark plus" x="592" y="218">+</text>
    <text class="t-b" x="612" y="217">No blank space</text>
    <text class="t-s" x="612" y="235">the reply ends at the bottom edge</text>
    <line class="row" x1="16" y1="252" x2="924" y2="252"/>
  </g>
  <g id="row-3">
    <text class="t-lbl" x="32" y="274">REPLY IN VIEW</text>
    <text class="mark tie" x="228" y="276">=</text>
    <text class="t-b" x="248" y="275">Yes, under your line</text>
    <text class="t-s" x="248" y="293">from its first word</text>
    <text class="mark tie" x="592" y="276">=</text>
    <text class="t-b" x="612" y="275">Yes, under your line</text>
    <text class="t-s" x="612" y="293">the view keeps it on screen</text>
    <line class="row" x1="16" y1="310" x2="924" y2="310"/>
  </g>
  <g id="locks-in">
    <rect class="foot" x="16" y="328" width="446" height="74" rx="5"/>
    <text class="t-lbl" x="32" y="349">LOCKS IN</text>
    <text class="t-b" x="32" y="369">Blank space under a short reply</text>
    <text class="t-s" x="32" y="387">it can only go at a send, an open or a switch</text>
  </g>
  <g id="flips-if">
    <rect class="foot" x="478" y="328" width="446" height="74" rx="5"/>
    <text class="t-lbl" x="494" y="349">FLIPS IF</text>
    <text class="t-b" x="494" y="369">The blank space reads as broken</text>
    <text class="t-s" x="494" y="387">in the side-by-side check with ChatGPT</text>
  </g>
</svg>
