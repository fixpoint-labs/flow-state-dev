<svg viewBox="0 0 940 418" role="img" aria-label="D2: which conversations does this issue move? Chosen: the four named apps, which already use the hook. Instead of: also the ui registry Conversation and Kitchen Sink, folding in FIX-2456. It comes down to the change surface: one hook and four one-line marks, versus also a component adopters copy, its docs page and two Kitchen Sink pages. The price is Kitchen Sink and registry users on the old rule until FIX-2456. Locks in FIX-2456 inheriting this rule. Flips if Kitchen Sink counts as one of the apps now."
     xmlns="http://www.w3.org/2000/svg">
  <style>
    :root { --surface:#FCFCFA; --surface-2:#E8E8E1; --ink:#191C21; --ink-2:#4C535B; --ink-3:#7A828B;
            --rule:#D5D4CB; --accent:#3E4E8C; --accent-soft:#E0E3F0; --code:#2C7C69; --code-soft:#DCEDE7;
            --prose:#A8761C; --prose-soft:#F3E8D2; --gone:#A9544F; }
    @media (prefers-color-scheme: dark) {
      :root { --surface:#181C1F; --surface-2:#202528; --ink:#E6E8E5; --ink-2:#A4ACB1; --ink-3:#737B81;
              --rule:#2B3135; --accent:#8B9BD8; --accent-soft:#1B2140; --code:#5DBBA1; --code-soft:#14302A;
              --prose:#D9A44B; --prose-soft:#332612; --gone:#DE8A84; } }
    .bg     { fill:var(--surface); }
    .ask    { fill:var(--surface-2); }
    .chosen { fill:var(--code-soft); stroke:var(--code); stroke-width:1.6; }
    .lost   { fill:var(--surface); stroke:var(--rule); stroke-width:1.4; stroke-dasharray:5 4; }
    .decide { fill:var(--accent-soft); }
    .bar    { fill:var(--accent); }
    .row    { stroke:var(--rule); stroke-width:1; }
    .foot   { fill:var(--surface-2); }
    .t-lbl  { fill:var(--ink-3); font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:9.5px; letter-spacing:.1em; }
    .t-tag  { font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:9.5px; letter-spacing:.1em; font-weight:600; }
    .t-q    { fill:var(--ink); font-family:system-ui,-apple-system,sans-serif; font-weight:600; font-size:15px; }
    .t-h    { font-family:system-ui,-apple-system,sans-serif; font-weight:600; font-size:14px; }
    .t-b    { fill:var(--ink); font-family:system-ui,-apple-system,sans-serif; font-size:12.5px; }
    .t-s    { fill:var(--ink-2); font-family:system-ui,-apple-system,sans-serif; font-size:11px; }
    .mark   { font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:16px; font-weight:700; }
    .plus   { fill:var(--code); }
    .minus  { fill:var(--gone); }
    .tie    { fill:var(--ink-3); }
    .c-code { fill:var(--code); }
    .c-mute { fill:var(--ink-3); }
    .c-lost { fill:var(--ink-2); }
    .c-acc  { fill:var(--accent); }
    .view   { fill:none; stroke:var(--accent); stroke-width:2; }
    .line   { fill:var(--prose-soft); stroke:var(--prose); stroke-width:1.2; }
    .reply  { fill:var(--code-soft); stroke:var(--code); stroke-width:1.2; }
    .old    { fill:var(--surface-2); }
    .room   { fill:none; stroke:var(--ink-3); stroke-width:1; stroke-dasharray:3 3; }
    .hidden { fill:var(--code-soft); stroke:var(--code); stroke-width:1.2; stroke-dasharray:4 3; opacity:.6; }
  </style>

  <rect class="bg" x="0" y="0" width="940" height="418"/>
  <g id="the-call">
    <rect class="ask" x="16" y="14" width="908" height="48" rx="6"/>
    <text class="t-lbl" x="32" y="32">D2 · THE CALL</text>
    <text class="t-q" x="32" y="52">Which conversations does this issue move to the new rule?</text>
  </g>
  <g id="options">
    <rect class="chosen" x="212" y="76" width="348" height="46" rx="5"/>
    <text class="t-tag c-code" x="228" y="93">CHOSEN</text>
    <text class="t-h c-code" x="228" y="112">The four named apps</text>
    <rect class="lost" x="576" y="76" width="348" height="46" rx="5"/>
    <text class="t-tag c-mute" x="592" y="93">INSTEAD OF</text>
    <text class="t-h c-lost" x="592" y="112">Also the registry Conversation and Kitchen Sink</text>
  </g>
  <g id="row-1">
    <rect class="decide" x="16" y="134" width="908" height="62" rx="4"/>
    <rect class="bar" x="16" y="134" width="4" height="62"/>
    <text class="t-lbl" x="32" y="156">CHANGE</text>
    <text class="t-lbl" x="32" y="169">SURFACE</text>
    <text class="t-tag c-acc" x="32" y="186">▸ DECIDES IT</text>
    <text class="mark plus" x="228" y="162">+</text>
    <text class="t-b" x="248" y="161">One hook and four marks</text>
    <text class="t-s" x="248" y="179">all four already use the hook</text>
    <text class="mark minus" x="592" y="162">−</text>
    <text class="t-b" x="612" y="161">Plus a copied component</text>
    <text class="t-s" x="612" y="179">its docs page and two Kitchen Sink pages</text>
  </g>
  <g id="row-2">
    <text class="t-lbl" x="32" y="216">KITCHEN SINK</text>
    <text class="mark minus" x="228" y="218">−</text>
    <text class="t-b" x="248" y="217">Old rule until FIX-2456</text>
    <text class="t-s" x="248" y="235">goes to the bottom on each request</text>
    <text class="mark plus" x="592" y="218">+</text>
    <text class="t-b" x="612" y="217">New rule now</text>
    <text class="t-s" x="612" y="235">every app in the repo agrees</text>
    <line class="row" x1="16" y1="252" x2="924" y2="252"/>
  </g>
  <g id="row-3">
    <text class="t-lbl" x="32" y="274">REVIEW</text>
    <text class="mark plus" x="228" y="276">+</text>
    <text class="t-b" x="248" y="275">One issue, one PR</text>
    <text class="t-s" x="248" y="293">FIX-2456 keeps its own</text>
    <text class="mark minus" x="592" y="276">−</text>
    <text class="t-b" x="612" y="275">FIX-2456 split in two</text>
    <text class="t-s" x="612" y="293">its other bullets stay behind</text>
    <line class="row" x1="16" y1="310" x2="924" y2="310"/>
  </g>
  <g id="locks-in">
    <rect class="foot" x="16" y="328" width="446" height="74" rx="5"/>
    <text class="t-lbl" x="32" y="349">LOCKS IN</text>
    <text class="t-b" x="32" y="369">FIX-2456 inherits this rule</text>
    <text class="t-s" x="32" y="387">the registry moves onto the hook as changed here</text>
  </g>
  <g id="flips-if">
    <rect class="foot" x="478" y="328" width="446" height="74" rx="5"/>
    <text class="t-lbl" x="494" y="349">FLIPS IF</text>
    <text class="t-b" x="494" y="369">Kitchen Sink counts as one of the apps now</text>
    <text class="t-s" x="494" y="387">then FIX-2456's first two bullets fold in</text>
  </g>
</svg>
