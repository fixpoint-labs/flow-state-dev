<svg viewBox="0 0 940 420" role="img" aria-label="D1, what the labs show for a line sent mid-turn. Chosen: the line as its own answer, started at once. Instead of: deriving queued in the adapters, or making lab lines wait like Claude Code. It comes down to the first row: whether the screen is true. Chosen is true today; a derived queued mark never fires because the door starts every line at once; making lines wait is true only after a workforce door change. The price is the second row: two answers can stream at once in one conversation, where waiting runs them one at a time. Third row: chosen and derive stay in the labs; waiting needs a workforce opt-in. Locks in: the labs stop promising Claude Code queue, amending FIX-2153 D2. Flips if: Jake wants Claude Code queue in the labs."
     xmlns="http://www.w3.org/2000/svg">
  <style>
    :root { --surface:#FCFCFA; --surface-2:#E8E8E1; --ink:#191C21; --ink-2:#4C535B; --ink-3:#7A828B;
            --rule:#D5D4CB; --accent:#3E4E8C; --accent-soft:#E0E3F0; --code:#2C7C69; --code-soft:#DCEDE7;
            --gone:#A9544F; }
    @media (prefers-color-scheme: dark) {
      :root { --surface:#181C1F; --surface-2:#202528; --ink:#E6E8E5; --ink-2:#A4ACB1; --ink-3:#737B81;
              --rule:#2B3135; --accent:#8B9BD8; --accent-soft:#1B2140; --code:#5DBBA1; --code-soft:#14302A;
              --gone:#DE8A84; } }
    .bg     { fill:var(--surface); }
    .ask    { fill:var(--surface-2); }
    .chosen { fill:var(--code-soft); stroke:var(--code); stroke-width:1.6; }
    .lost   { fill:var(--surface); stroke:var(--rule); stroke-width:1.4; stroke-dasharray:5 4; }
    .decide { fill:var(--accent-soft); }
    .bar    { fill:var(--accent); }
    .row    { stroke:var(--rule); stroke-width:1; }
    .foot   { fill:var(--surface-2); }
    .t-lbl  { fill:var(--ink-3); font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:9.5px; letter-spacing:.1em; }
    .t-tag  { font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:9.5px; letter-spacing:.1em; font-weight:600; }
    .t-q    { fill:var(--ink); font-family:system-ui,-apple-system,sans-serif; font-weight:600; font-size:15px; }
    .t-h    { font-family:system-ui,-apple-system,sans-serif; font-weight:600; font-size:14px; }
    .t-b    { fill:var(--ink); font-family:system-ui,-apple-system,sans-serif; font-size:12.5px; }
    .t-s    { fill:var(--ink-2); font-family:system-ui,-apple-system,sans-serif; font-size:11px; }
    .mark   { font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:16px; font-weight:700; }
    .plus   { fill:var(--code); }
    .minus  { fill:var(--gone); }
    .tie    { fill:var(--ink-3); }
    .c-code { fill:var(--code); }
    .c-mute { fill:var(--ink-3); }
    .c-lost { fill:var(--ink-2); }
    .c-acc  { fill:var(--accent); }
  </style>
  <rect class="bg" x="0" y="0" width="940" height="420"/>
  <g id="the-call">
    <rect class="ask" x="16" y="14" width="908" height="48" rx="6"/>
    <text class="t-lbl" x="32" y="32">D1 · THE CALL</text>
    <text class="t-q" x="32" y="52">What do the labs show for a line sent while a turn runs?</text>
  </g>
  <g id="options">
    <rect class="chosen" x="212" y="76" width="224" height="46" rx="5"/>
    <text class="t-tag c-code" x="224" y="93">CHOSEN</text>
    <text class="t-h c-code" x="224" y="112">Its own answer, now</text>
    <rect class="lost" x="452" y="76" width="224" height="46" rx="5"/>
    <text class="t-tag c-mute" x="464" y="93">INSTEAD OF</text>
    <text class="t-h c-lost" x="464" y="112">Derive queued</text>
    <rect class="lost" x="692" y="76" width="224" height="46" rx="5"/>
    <text class="t-tag c-mute" x="704" y="93">INSTEAD OF</text>
    <text class="t-h c-lost" x="704" y="112">Make lines wait</text>
  </g>
  <g id="row-0">
    <rect class="decide" x="16" y="134" width="908" height="62" rx="4"/>
    <rect class="bar" x="16" y="134" width="4" height="62"/>
    <text class="t-lbl" x="32" y="156">THE SCREEN</text>
    <text class="t-lbl" x="32" y="169">IS TRUE</text>
    <text class="t-tag c-acc" x="32" y="186">▸ DECIDES IT</text>
    <text class="mark plus" x="224" y="162">+</text>
    <text class="t-b" x="242" y="161">True today</text>
    <text class="t-s" x="242" y="179">no claim the server breaks</text>
    <text class="mark minus" x="464" y="162">−</text>
    <text class="t-b" x="482" y="161">A mark that never fires</text>
    <text class="t-s" x="482" y="179">hold starts every line at once</text>
    <text class="mark plus" x="704" y="162">+</text>
    <text class="t-b" x="722" y="161">True, once built</text>
    <text class="t-s" x="722" y="179">after a door change</text>
  </g>
  <g id="row-1">
    <text class="t-lbl" x="32" y="218">ANSWERS</text>
    <text class="t-lbl" x="32" y="231">IN ONE THREAD</text>
    <text class="mark minus" x="224" y="224">−</text>
    <text class="t-b" x="242" y="223">Two can stream at once</text>
    <text class="t-s" x="242" y="241">as they already do</text>
    <text class="mark minus" x="464" y="224">−</text>
    <text class="t-b" x="482" y="223">Two stream, unmarked</text>
    <text class="t-s" x="482" y="241">same as today</text>
    <text class="mark plus" x="704" y="224">+</text>
    <text class="t-b" x="722" y="223">One at a time</text>
    <text class="t-s" x="722" y="241">as Claude Code runs them</text>
    <line class="row" x1="16" y1="256" x2="924" y2="256"/>
  </g>
  <g id="row-2">
    <text class="t-lbl" x="32" y="278">WHERE THE</text>
    <text class="t-lbl" x="32" y="291">WORK LANDS</text>
    <text class="mark plus" x="224" y="284">+</text>
    <text class="t-b" x="242" y="283">The labs only</text>
    <text class="t-s" x="242" y="301">a removal, size S</text>
    <text class="mark tie" x="464" y="284">=</text>
    <text class="t-b" x="482" y="283">The labs only</text>
    <text class="t-s" x="482" y="301">plus a test on a fake row</text>
    <text class="mark minus" x="704" y="284">−</text>
    <text class="t-b" x="722" y="283">The workforce door</text>
    <text class="t-s" x="722" y="301">an opt-in every app shares</text>
    <line class="row" x1="16" y1="314" x2="924" y2="314"/>
  </g>
  <g id="locks-in">
    <rect class="foot" x="16" y="330" width="446" height="74" rx="5"/>
    <text class="t-lbl" x="32" y="351">LOCKS IN</text>
    <text class="t-b" x="32" y="371">The labs stop promising Claude Code's queue</text>
    <text class="t-s" x="32" y="389">FIX-2153 D2 "your line waits" is amended</text>
  </g>
  <g id="flips-if">
    <rect class="foot" x="478" y="330" width="446" height="74" rx="5"/>
    <text class="t-lbl" x="494" y="351">FLIPS IF</text>
    <text class="t-b" x="494" y="371">Jake wants Claude Code's queue in the labs</text>
    <text class="t-s" x="494" y="389">then a workforce issue adds an opt-in door</text>
  </g>
</svg>
