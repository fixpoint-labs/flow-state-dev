<svg viewBox="0 0 940 360" role="img" aria-label="What changes, as two lanes against time. Labs, today and after: turn 1 runs; line 2 is sent mid-turn and its own answer starts at once beside turn 1. Today the screen says line 2 waits; after, it says nothing false. Kitchen Sink, today: the composer is locked while turn 1 runs, so line 2 cannot be typed. After: line 2 is sent mid-turn, waits marked runs when this turn ends until turn 1 ends, then runs."
     xmlns="http://www.w3.org/2000/svg">
  <style>
    :root { --surface:#FCFCFA; --surface-2:#E8E8E1; --ink:#191C21; --ink-2:#4C535B; --ink-3:#7A828B;
            --rule:#D5D4CB; --accent:#3E4E8C; --accent-soft:#E0E3F0; --code:#2C7C69; --code-soft:#DCEDE7;
            --prose:#A8761C; --prose-soft:#F3E8D2; --gone:#A9544F; }
    @media (prefers-color-scheme: dark) {
      :root { --surface:#181C1F; --surface-2:#202528; --ink:#E6E8E5; --ink-2:#A4ACB1; --ink-3:#737B81;
              --rule:#2B3135; --accent:#8B9BD8; --accent-soft:#1B2140; --code:#5DBBA1; --code-soft:#14302A;
              --prose:#D9A44B; --prose-soft:#332612; --gone:#DE8A84; } }
    .bg   { fill:var(--surface); }
    .band { fill:var(--surface-2); }
    .t1   { fill:var(--accent-soft); stroke:var(--accent); stroke-width:1.2; }
    .t2   { fill:var(--code-soft); stroke:var(--code); stroke-width:1.2; }
    .wait { fill:none; stroke:var(--ink-3); stroke-width:1.2; stroke-dasharray:5 4; }
    .lock { fill:none; stroke:var(--gone); stroke-width:1.2; stroke-dasharray:3 3; }
    .tick { stroke:var(--ink-3); stroke-width:1.2; }
    .rule { stroke:var(--rule); stroke-width:1; }
    .t-lbl { fill:var(--ink-3); font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:9.5px; letter-spacing:.1em; }
    .t-b   { fill:var(--ink); font-family:system-ui,-apple-system,sans-serif; font-weight:600; font-size:13px; }
    .t-s   { fill:var(--ink-2); font-family:system-ui,-apple-system,sans-serif; font-size:11px; }
    .t-bar { fill:var(--ink); font-family:system-ui,-apple-system,sans-serif; font-size:11px; }
    .t-bad { fill:var(--gone); font-family:system-ui,-apple-system,sans-serif; font-size:11px; font-weight:600; }
    .t-ok  { fill:var(--code); font-family:system-ui,-apple-system,sans-serif; font-size:11px; font-weight:600; }
  </style>
  <rect class="bg" x="0" y="0" width="940" height="360"/>

  <g id="labs">
    <rect class="band" x="16" y="14" width="908" height="22" rx="4"/>
    <text class="t-lbl" x="28" y="29">BOTH LABS · respond IS hold · THE BARS DON'T MOVE</text>
    <text class="t-b" x="28" y="64">Today</text>
    <rect class="t1" x="200" y="50" width="420" height="20" rx="3"/><text class="t-bar" x="208" y="64">turn 1</text>
    <line class="tick" x1="340" y1="46" x2="340" y2="104"/><text class="t-lbl" x="344" y="114">LINE 2 SENT</text>
    <rect class="t2" x="340" y="76" width="360" height="20" rx="3"/><text class="t-bar" x="348" y="90">line 2's answer, at once</text>
    <text class="t-bad" x="712" y="90">screen: "waits for it"</text>
    <line class="rule" x1="16" y1="124" x2="924" y2="124"/>
    <text class="t-b" x="28" y="150">After</text>
    <rect class="t1" x="200" y="136" width="420" height="20" rx="3"/><text class="t-bar" x="208" y="150">turn 1</text>
    <line class="tick" x1="340" y1="132" x2="340" y2="166"/>
    <rect class="t2" x="340" y="162" width="360" height="20" rx="3"/><text class="t-bar" x="348" y="176">line 2's answer, at once</text>
    <text class="t-ok" x="712" y="176">screen: no waits claim</text>
  </g>

  <g id="kitchen-sink">
    <rect class="band" x="16" y="196" width="908" height="22" rx="4"/>
    <text class="t-lbl" x="28" y="211">KITCHEN SINK · FLOW STATE · run MOVES queue → defer</text>
    <text class="t-b" x="28" y="246">Today</text>
    <rect class="t1" x="200" y="232" width="420" height="20" rx="3"/><text class="t-bar" x="208" y="246">turn 1</text>
    <rect class="lock" x="340" y="258" width="280" height="20" rx="3"/><text class="t-bad" x="348" y="272">composer locked · line 2 can't be typed</text>
    <line class="rule" x1="16" y1="290" x2="924" y2="290"/>
    <text class="t-b" x="28" y="316">After</text>
    <rect class="t1" x="200" y="302" width="420" height="20" rx="3"/><text class="t-bar" x="208" y="316">turn 1 · keeps streaming</text>
    <line class="tick" x1="340" y1="298" x2="340" y2="352"/>
    <rect class="wait" x="340" y="328" width="280" height="20" rx="3"/><text class="t-s" x="348" y="342">line 2 · "runs when this turn ends"</text>
    <rect class="t2" x="620" y="328" width="200" height="20" rx="3"/><text class="t-bar" x="628" y="342">line 2's answer</text>
  </g>
</svg>
