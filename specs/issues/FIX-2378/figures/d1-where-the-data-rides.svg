<svg viewBox="0 0 940 428" role="img" xmlns="http://www.w3.org/2000/svg"
     aria-label="D1: task data rides a generic metadata field on the message item, chosen, beside a companion component item, the item's taskId field, and parsing the words. Decided by one item that survives a reword and marks both kinds of line. Price: one optional field in core.">
  <style>
    :root { --surface:#FCFCFA; --surface-2:#E8E8E1; --ink:#191C21; --ink-2:#4C535B; --ink-3:#7A828B;
            --rule:#D5D4CB; --accent:#3E4E8C; --accent-soft:#E0E3F0; --code:#2C7C69; --code-soft:#DCEDE7;
            --gone:#A9544F; }
    @media (prefers-color-scheme: dark) {
      :root { --surface:#181C1F; --surface-2:#202528; --ink:#E6E8E5; --ink-2:#A4ACB1; --ink-3:#737B81;
              --rule:#2B3135; --accent:#8B9BD8; --accent-soft:#1B2140; --code:#5DBBA1; --code-soft:#14302A;
              --gone:#DE8A84; } }
    .bg     { fill:var(--surface); }
    .ask    { fill:var(--surface-2); }
    .chosen { fill:var(--code-soft); stroke:var(--code); stroke-width:1.6; }
    .rec    { fill:var(--code-soft); stroke:var(--code); stroke-width:1.6; stroke-dasharray:5 4; }
    .lost   { fill:var(--surface); stroke:var(--rule); stroke-width:1.4; stroke-dasharray:5 4; }
    .decide { fill:var(--accent-soft); }
    .bar    { fill:var(--accent); }
    .row    { stroke:var(--rule); stroke-width:1; }
    .foot   { fill:var(--surface-2); }
    .t-lbl  { fill:var(--ink-3); font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:9.5px; letter-spacing:.1em; }
    .t-tag  { font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:9.5px; letter-spacing:.1em; font-weight:600; }
    .t-q    { fill:var(--ink); font-family:system-ui,-apple-system,sans-serif; font-weight:600; font-size:15px; }
    .t-h    { font-family:system-ui,-apple-system,sans-serif; font-weight:600; font-size:13px; }
    .t-b    { fill:var(--ink); font-family:system-ui,-apple-system,sans-serif; font-size:12px; }
    .t-s    { fill:var(--ink-2); font-family:system-ui,-apple-system,sans-serif; font-size:10.5px; }
    .mark   { font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:16px; font-weight:700; }
    .plus   { fill:var(--code); }
    .minus  { fill:var(--gone); }
    .tie    { fill:var(--ink-3); }
    .c-code { fill:var(--code); }
    .c-mute { fill:var(--ink-3); }
    .c-lost { fill:var(--ink-2); }
    .c-acc  { fill:var(--accent); }
  </style>
  <rect class="bg" x="0" y="0" width="940" height="428"/>

  <g id="the-call">
    <rect class="ask" x="16" y="14" width="908" height="48" rx="6"/>
    <text class="t-lbl" x="32" y="32">D1 · THE ONE CALL</text>
    <text class="t-q" x="32" y="52">Where on a conversation's line does the task's data ride?</text>
  </g>

  <g id="options">
    <rect class="chosen" x="212" y="76" width="340" height="46" rx="5"/>
    <text class="t-tag c-code" x="226" y="93">CHOSEN</text>
    <text class="t-h c-code" x="226" y="112">metadata on the message item</text>
    <rect class="lost" x="568" y="76" width="340" height="46" rx="5"/>
    <text class="t-tag c-mute" x="582" y="93">INSTEAD OF</text>
    <text class="t-h c-lost" x="582" y="112">A companion item · taskId · parse the words</text>
  </g>

  <g id="row-1">
    <rect class="decide" x="16" y="134" width="908" height="62" rx="4"/>
    <rect class="bar" x="16" y="134" width="4" height="62"/>
    <text class="t-lbl" x="32" y="156">ONE ITEM SAYS</text>
    <text class="t-lbl" x="32" y="169">WHAT IT IS</text>
    <text class="t-tag c-acc" x="32" y="186">▸ DECIDES IT</text>
    <text class="mark plus" x="226" y="162">+</text>
    <text class="t-b" x="244" y="161">Task, ending, and who answered</text>
    <text class="t-s" x="244" y="179">on the line itself; a reword breaks nothing</text>
    <text class="mark minus" x="582" y="162">−</text>
    <text class="t-b" x="600" y="161">Two items to pair, a field bent, or words</text>
    <text class="t-s" x="600" y="179">taskId means "emitted while working the task"</text>
  </g>

  <g id="row-2">
    <text class="t-lbl" x="32" y="218">L1 SURFACE</text>
    <text class="mark minus" x="226" y="224">−</text>
    <text class="t-b" x="244" y="223">One optional field and option</text>
    <text class="t-s" x="244" y="241">generic; no task noun enters core</text>
    <text class="mark plus" x="582" y="224">+</text>
    <text class="t-b" x="600" y="223">Nothing new in core</text>
    <text class="t-s" x="600" y="241">for all three</text>
    <line class="row" x1="16" y1="256" x2="924" y2="256"/>
  </g>

  <g id="row-3">
    <text class="t-lbl" x="32" y="280">STORED LINES</text>
    <text class="mark tie" x="226" y="286">=</text>
    <text class="t-b" x="244" y="285">Older lines read off their words</text>
    <text class="t-s" x="244" y="303">the fallback sits beside noticeText</text>
    <text class="mark tie" x="582" y="286">=</text>
    <text class="t-b" x="600" y="285">Same, for each</text>
    <text class="t-s" x="600" y="303">no option recovers an older answer's worker</text>
    <line class="row" x1="16" y1="318" x2="924" y2="318"/>
  </g>

  <g id="locks-in">
    <rect class="foot" x="16" y="338" width="446" height="74" rx="5"/>
    <text class="t-lbl" x="32" y="359">LOCKS IN</text>
    <text class="t-b" x="32" y="379">An open field any package may write</text>
    <text class="t-s" x="32" y="397">each owns its key and exports its reader</text>
  </g>

  <g id="flips-if">
    <rect class="foot" x="478" y="338" width="446" height="74" rx="5"/>
    <text class="t-lbl" x="494" y="359">FLIPS IF</text>
    <text class="t-b" x="494" y="379">Core refuses open fields on items</text>
    <text class="t-s" x="494" y="397">then a companion item, paired by the reader</text>
  </g>
</svg>
