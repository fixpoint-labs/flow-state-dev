<svg viewBox="0 0 940 420" role="img" aria-label="D1, where the roster watch lives. Chosen: one method on the workforce client. Instead of: each app subscribing and matching paths itself, or the apps adopting React's Roster panel. It comes down to the first row, who knows the roster's storage paths: workforce knows them once; per app they are copied into three apps; the panel reads another collection and no standard workers. The price is the second row: a public method and a third coalescer copy, paid by FIX-2551, where per app adds nothing to a package and the panel exists. The third row: each app keeps its own UI under the chosen option and per app, while the panel draws its own rows. Locks in: watchRoster on the workforce browser entry, used by every app that shows the roster. Flips if: the roster becomes one collection a generic hook can watch."
     xmlns="http://www.w3.org/2000/svg">
  <style>
    :root { --surface:#FCFCFA; --surface-2:#E8E8E1; --ink:#191C21; --ink-2:#4C535B; --ink-3:#7A828B;
            --rule:#D5D4CB; --accent:#3E4E8C; --accent-soft:#E0E3F0; --code:#2C7C69; --code-soft:#DCEDE7;
            --gone:#A9544F; }
    @media (prefers-color-scheme: dark) {
      :root { --surface:#181C1F; --surface-2:#202528; --ink:#E6E8E5; --ink-2:#A4ACB1; --ink-3:#737B81;
              --rule:#2B3135; --accent:#8B9BD8; --accent-soft:#1B2140; --code:#5DBBA1; --code-soft:#14302A;
              --gone:#DE8A84; } }
    .bg     { fill:var(--surface); }
    .ask    { fill:var(--surface-2); }
    .chosen { fill:var(--code-soft); stroke:var(--code); stroke-width:1.6; }
    .lost   { fill:var(--surface); stroke:var(--rule); stroke-width:1.4; stroke-dasharray:5 4; }
    .decide { fill:var(--accent-soft); }
    .bar    { fill:var(--accent); }
    .row    { stroke:var(--rule); stroke-width:1; }
    .foot   { fill:var(--surface-2); }
    .t-lbl  { fill:var(--ink-3); font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:9.5px; letter-spacing:.1em; }
    .t-tag  { font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:9.5px; letter-spacing:.1em; font-weight:600; }
    .t-q    { fill:var(--ink); font-family:system-ui,-apple-system,sans-serif; font-weight:600; font-size:15px; }
    .t-h    { font-family:system-ui,-apple-system,sans-serif; font-weight:600; font-size:13px; }
    .t-b    { fill:var(--ink); font-family:system-ui,-apple-system,sans-serif; font-size:12px; }
    .t-s    { fill:var(--ink-2); font-family:system-ui,-apple-system,sans-serif; font-size:10.5px; }
    .mark   { font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:16px; font-weight:700; }
    .plus   { fill:var(--code); }
    .minus  { fill:var(--gone); }
    .tie    { fill:var(--ink-3); }
    .c-code { fill:var(--code); }
    .c-mute { fill:var(--ink-3); }
    .c-lost { fill:var(--ink-2); }
    .c-acc  { fill:var(--accent); }
  </style>
  <rect class="bg" x="0" y="0" width="940" height="420"/>

  <g id="the-call">
    <rect class="ask" x="16" y="14" width="908" height="48" rx="6"/>
    <text class="t-lbl" x="32" y="32">D1 · THE CALL</text>
    <text class="t-q" x="32" y="52">Where does the roster watch live?</text>
  </g>

  <g id="options">
    <rect class="chosen" x="212" y="76" width="224" height="46" rx="5"/>
    <text class="t-tag c-code" x="226" y="93">CHOSEN</text>
    <text class="t-h c-code" x="226" y="112">On the workforce client</text>
    <rect class="lost" x="452" y="76" width="224" height="46" rx="5"/>
    <text class="t-tag c-mute" x="466" y="93">INSTEAD OF</text>
    <text class="t-h c-lost" x="466" y="112">In each app</text>
    <rect class="lost" x="692" y="76" width="224" height="46" rx="5"/>
    <text class="t-tag c-mute" x="706" y="93">INSTEAD OF</text>
    <text class="t-h c-lost" x="706" y="112">React's Roster panel</text>
  </g>

  <g id="row-decides">
    <rect class="decide" x="16" y="134" width="908" height="62" rx="4"/>
    <rect class="bar" x="16" y="134" width="4" height="62"/>
    <text class="t-lbl" x="32" y="156">WHO KNOWS THE</text>
    <text class="t-lbl" x="32" y="169">ROSTER'S PATHS</text>
    <text class="t-tag c-acc" x="32" y="186">▸ DECIDES IT</text>
    <text class="mark plus" x="226" y="162">+</text>
    <text class="t-b" x="244" y="161">Workforce, once</text>
    <text class="t-s" x="244" y="179">its own two collections</text>
    <text class="mark minus" x="466" y="162">−</text>
    <text class="t-b" x="484" y="161">Copied into three apps</text>
    <text class="t-s" x="484" y="179">the copies drift (epic ER-3)</text>
    <text class="mark minus" x="706" y="162">−</text>
    <text class="t-b" x="724" y="161">Another collection</text>
    <text class="t-s" x="724" y="179">no standard workers</text>
  </g>

  <g id="row-price">
    <text class="t-lbl" x="32" y="222">PACKAGE SURFACE</text>
    <text class="mark minus" x="226" y="224">−</text>
    <text class="t-b" x="244" y="223">A public method</text>
    <text class="t-s" x="244" y="241">and a coalescer copy (FIX-2551)</text>
    <text class="mark plus" x="466" y="224">+</text>
    <text class="t-b" x="484" y="223">None in a package</text>
    <text class="t-s" x="484" y="241">FIX-2466's shape</text>
    <text class="mark plus" x="706" y="224">+</text>
    <text class="t-b" x="724" y="223">Already shipped</text>
    <text class="t-s" x="724" y="241">FIX-1506's live prop</text>
    <line class="row" x1="16" y1="256" x2="924" y2="256"/>
  </g>

  <g id="row-ui">
    <text class="t-lbl" x="32" y="280">EACH APP'S UI</text>
    <text class="mark tie" x="226" y="282">=</text>
    <text class="t-b" x="244" y="281">Kept</text>
    <text class="t-s" x="244" y="299">one line in an effect</text>
    <text class="mark tie" x="466" y="282">=</text>
    <text class="t-b" x="484" y="281">Kept</text>
    <text class="t-s" x="484" y="299">the same</text>
    <text class="mark minus" x="706" y="282">−</text>
    <text class="t-b" x="724" y="281">Replaced</text>
    <text class="t-s" x="724" y="299">the panel draws its rows</text>
    <line class="row" x1="16" y1="314" x2="924" y2="314"/>
  </g>

  <g id="locks-in">
    <rect class="foot" x="16" y="330" width="446" height="74" rx="5"/>
    <text class="t-lbl" x="32" y="351">LOCKS IN</text>
    <text class="t-b" x="32" y="371">watchRoster on the browser entry</text>
    <text class="t-s" x="32" y="389">every app that shows the roster uses it</text>
  </g>

  <g id="flips-if">
    <rect class="foot" x="478" y="330" width="446" height="74" rx="5"/>
    <text class="t-lbl" x="494" y="351">FLIPS IF</text>
    <text class="t-b" x="494" y="371">The roster becomes one plain collection</text>
    <text class="t-s" x="494" y="389">then a generic live hook watches it</text>
  </g>
</svg>
