<svg viewBox="0 0 940 420" role="img" aria-label="D2, whether a roster row says if the user already has a conversation with that worker. Chosen: no flag; coordinators come from each row's flow. Instead of: a coordinator marker and a has-conversation flag on each row. It comes down to the first row, whether the row stays true while watched: every chosen field is kept live by the watch, while the flag goes stale because a new session publishes nothing the roster hears. The price is the second row: the issue's flag is cut, and an app asks listWorkerSessions per worker. The third row: each re-read is two collection reads, against a session listing per worker flow as well. Locks in: a roster row says who a worker is, never what the user did with it. Flips if: a session create publishes on the user's topic and an app needs the flag."
     xmlns="http://www.w3.org/2000/svg">
  <style>
    :root { --surface:#FCFCFA; --surface-2:#E8E8E1; --ink:#191C21; --ink-2:#4C535B; --ink-3:#7A828B;
            --rule:#D5D4CB; --accent:#3E4E8C; --accent-soft:#E0E3F0; --code:#2C7C69; --code-soft:#DCEDE7;
            --gone:#A9544F; }
    @media (prefers-color-scheme: dark) {
      :root { --surface:#181C1F; --surface-2:#202528; --ink:#E6E8E5; --ink-2:#A4ACB1; --ink-3:#737B81;
              --rule:#2B3135; --accent:#8B9BD8; --accent-soft:#1B2140; --code:#5DBBA1; --code-soft:#14302A;
              --gone:#DE8A84; } }
    .bg     { fill:var(--surface); }
    .ask    { fill:var(--surface-2); }
    .chosen { fill:var(--code-soft); stroke:var(--code); stroke-width:1.6; }
    .lost   { fill:var(--surface); stroke:var(--rule); stroke-width:1.4; stroke-dasharray:5 4; }
    .decide { fill:var(--accent-soft); }
    .bar    { fill:var(--accent); }
    .row    { stroke:var(--rule); stroke-width:1; }
    .foot   { fill:var(--surface-2); }
    .t-lbl  { fill:var(--ink-3); font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:9.5px; letter-spacing:.1em; }
    .t-tag  { font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:9.5px; letter-spacing:.1em; font-weight:600; }
    .t-q    { fill:var(--ink); font-family:system-ui,-apple-system,sans-serif; font-weight:600; font-size:15px; }
    .t-h    { font-family:system-ui,-apple-system,sans-serif; font-weight:600; font-size:14px; }
    .t-b    { fill:var(--ink); font-family:system-ui,-apple-system,sans-serif; font-size:12.5px; }
    .t-s    { fill:var(--ink-2); font-family:system-ui,-apple-system,sans-serif; font-size:11px; }
    .mark   { font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:16px; font-weight:700; }
    .plus   { fill:var(--code); }
    .minus  { fill:var(--gone); }
    .c-code { fill:var(--code); }
    .c-mute { fill:var(--ink-3); }
    .c-lost { fill:var(--ink-2); }
    .c-acc  { fill:var(--accent); }
  </style>
  <rect class="bg" x="0" y="0" width="940" height="420"/>

  <g id="the-call">
    <rect class="ask" x="16" y="14" width="908" height="48" rx="6"/>
    <text class="t-lbl" x="32" y="32">D2 · THE CALL</text>
    <text class="t-q" x="32" y="52">Does a roster row say whether you already talk to that worker?</text>
  </g>

  <g id="options">
    <rect class="chosen" x="212" y="76" width="348" height="46" rx="5"/>
    <text class="t-tag c-code" x="228" y="93">CHOSEN</text>
    <text class="t-h c-code" x="228" y="112">No flag; coordinators from the flow</text>
    <rect class="lost" x="576" y="76" width="348" height="46" rx="5"/>
    <text class="t-tag c-mute" x="592" y="93">INSTEAD OF</text>
    <text class="t-h c-lost" x="592" y="112">A coordinator marker and a flag</text>
  </g>

  <g id="row-decides">
    <rect class="decide" x="16" y="134" width="908" height="62" rx="4"/>
    <rect class="bar" x="16" y="134" width="4" height="62"/>
    <text class="t-lbl" x="32" y="156">STAYS TRUE</text>
    <text class="t-lbl" x="32" y="169">WHILE WATCHED</text>
    <text class="t-tag c-acc" x="32" y="186">▸ DECIDES IT</text>
    <text class="mark plus" x="228" y="162">+</text>
    <text class="t-b" x="248" y="161">Every field stays live</text>
    <text class="t-s" x="248" y="179">a hire, edit or fire publishes</text>
    <text class="mark minus" x="592" y="162">−</text>
    <text class="t-b" x="612" y="161">The flag goes stale</text>
    <text class="t-s" x="612" y="179">a new session publishes nothing the roster hears</text>
  </g>

  <g id="row-price">
    <text class="t-lbl" x="32" y="222">THE ISSUE'S ASK</text>
    <text class="mark minus" x="228" y="224">−</text>
    <text class="t-b" x="248" y="223">The flag is cut</text>
    <text class="t-s" x="248" y="241">an app asks listWorkerSessions per worker</text>
    <text class="mark plus" x="592" y="224">+</text>
    <text class="t-b" x="612" y="223">Everything the issue named</text>
    <text class="t-s" x="612" y="241">though no app shows the flag yet</text>
    <line class="row" x1="16" y1="256" x2="924" y2="256"/>
  </g>

  <g id="row-cost">
    <text class="t-lbl" x="32" y="280">EACH RE-READ</text>
    <text class="mark plus" x="228" y="282">+</text>
    <text class="t-b" x="248" y="281">Two collection reads</text>
    <text class="t-s" x="248" y="299">as roster() makes today</text>
    <text class="mark minus" x="592" y="282">−</text>
    <text class="t-b" x="612" y="281">Plus a session listing per worker flow</text>
    <text class="t-s" x="612" y="299">on every notice</text>
    <line class="row" x1="16" y1="314" x2="924" y2="314"/>
  </g>

  <g id="locks-in">
    <rect class="foot" x="16" y="330" width="446" height="74" rx="5"/>
    <text class="t-lbl" x="32" y="351">LOCKS IN</text>
    <text class="t-b" x="32" y="371">A row says who a worker is</text>
    <text class="t-s" x="32" y="389">never what the user has done with it</text>
  </g>

  <g id="flips-if">
    <rect class="foot" x="478" y="330" width="446" height="74" rx="5"/>
    <text class="t-lbl" x="494" y="351">FLIPS IF</text>
    <text class="t-b" x="494" y="371">A new session publishes on the user's topic</text>
    <text class="t-s" x="494" y="389">and an app wants to show the flag</text>
  </g>
</svg>
