<svg viewBox="0 0 940 470" role="img" aria-label="What changes. Top band: the wave-1 package slice ships a settings layer in claude-code that keeps hooks off and a CURSOR_PASS export in cursor, with no codex change; the app PR after it adds Kitchen Sink's two settings, its three modes and the header line, and moves Shift Manager's fsd coder and the two labs to hooks off. Below, five rows by two columns, setting off and trusted. Claude Code: loads nothing, then CLAUDE.md, skills and project MCP with hooks off. Codex: every MCP server off, then the operator's MCP servers on; it reads AGENTS.md either way. Cursor: loads nothing in both columns, because its SDK can't leave hooks out. Named keys: the harness's own list, then that list plus the names the operator lists. Header: not loaded, then loaded with hooks off, per harness."
     xmlns="http://www.w3.org/2000/svg">
  <style>
    :root { --surface:#FCFCFA; --surface-2:#E8E8E1; --ink:#191C21; --ink-2:#4C535B; --ink-3:#7A828B;
            --rule:#D5D4CB; --accent:#3E4E8C; --accent-soft:#E0E3F0; --code:#2C7C69; --code-soft:#DCEDE7;
            --prose:#A8761C; --prose-soft:#F3E8D2; --gone:#A9544F; }
    @media (prefers-color-scheme: dark) {
      :root { --surface:#181C1F; --surface-2:#202528; --ink:#E6E8E5; --ink-2:#A4ACB1; --ink-3:#737B81;
              --rule:#2B3135; --accent:#8B9BD8; --accent-soft:#1B2140; --code:#5DBBA1; --code-soft:#14302A;
              --prose:#D9A44B; --prose-soft:#332612; --gone:#DE8A84; } }
    .bg    { fill:var(--surface); }
    .pkg   { fill:var(--code-soft); stroke:var(--code); stroke-width:1.4; }
    .app   { fill:var(--accent-soft); stroke:var(--accent); stroke-width:1.4; }
    .row   { stroke:var(--rule); stroke-width:1; }
    .on    { fill:var(--code-soft); }
    .t-lbl { fill:var(--ink-3); font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:9.5px; letter-spacing:.1em; }
    .t-h   { fill:var(--ink); font-family:system-ui,-apple-system,sans-serif; font-weight:600; font-size:13px; }
    .t-b   { fill:var(--ink); font-family:system-ui,-apple-system,sans-serif; font-size:12.5px; }
    .t-on  { fill:var(--code); font-family:system-ui,-apple-system,sans-serif; font-weight:600; font-size:12.5px; }
    .t-s   { fill:var(--ink-2); font-family:system-ui,-apple-system,sans-serif; font-size:11px; }
    .c-acc { fill:var(--accent); }
    .c-code{ fill:var(--code); }
  </style>
  <rect class="bg" x="0" y="0" width="940" height="470"/>

  <g id="band">
    <rect class="pkg" x="16" y="14" width="446" height="78" rx="6"/>
    <text class="t-lbl c-code" x="32" y="34">WAVE 1 · PACKAGE SLICE · FROM MAIN</text>
    <text class="t-b" x="32" y="55">claude-code: a settings layer that keeps hooks off</text>
    <text class="t-b" x="32" y="73">cursor: CURSOR_PASS, beside its two siblings</text>
    <text class="t-s" x="32" y="86">codex: no change · no app file</text>
    <rect class="app" x="478" y="14" width="446" height="78" rx="6"/>
    <text class="t-lbl c-acc" x="494" y="34">AFTER IT MERGES · APP PR</text>
    <text class="t-b" x="494" y="55">Kitchen Sink: two settings, three modes, the header</text>
    <text class="t-b" x="494" y="73">Shift Manager fsd coder, two labs: hooks off (D2)</text>
    <text class="t-s" x="494" y="86">deletes the two CURSOR_PASS copies</text>
  </g>

  <g id="columns">
    <text class="t-lbl" x="212" y="122">SETTING OFF · TODAY, UNCHANGED</text>
    <rect class="on" x="566" y="106" width="358" height="350" rx="5"/>
    <text class="t-lbl c-code" x="582" y="122">TRUSTED · SET BY THE OPERATOR</text>
    <line class="row" x1="16" y1="132" x2="924" y2="132"/>
  </g>

  <g id="claude-code">
    <text class="t-h" x="32" y="160">Claude Code</text>
    <text class="t-b" x="212" y="158">Loads nothing</text>
    <text class="t-s" x="212" y="176">no CLAUDE.md, no skills</text>
    <text class="t-on" x="582" y="158">CLAUDE.md, skills, project MCP</text>
    <text class="t-s" x="582" y="176">hooks off (D1)</text>
    <line class="row" x1="16" y1="192" x2="924" y2="192"/>
  </g>

  <g id="codex">
    <text class="t-h" x="32" y="220">Codex</text>
    <text class="t-b" x="212" y="218">Every MCP server turned off</text>
    <text class="t-s" x="212" y="236">reads AGENTS.md either way</text>
    <text class="t-on" x="582" y="218">The operator's MCP servers on</text>
    <text class="t-s" x="582" y="236">reads AGENTS.md either way</text>
    <line class="row" x1="16" y1="252" x2="924" y2="252"/>
  </g>

  <g id="cursor">
    <text class="t-h" x="32" y="280">Cursor</text>
    <text class="t-b" x="212" y="278">Loads nothing</text>
    <text class="t-s" x="212" y="296">no project setting source</text>
    <text class="t-b" x="582" y="278">Still loads nothing</text>
    <text class="t-s" x="582" y="296">its SDK can't leave the project's hooks out</text>
    <line class="row" x1="16" y1="312" x2="924" y2="312"/>
  </g>

  <g id="keys">
    <text class="t-h" x="32" y="340">Named keys</text>
    <text class="t-s" x="32" y="358">every harness</text>
    <text class="t-b" x="212" y="338">The harness's own list</text>
    <text class="t-s" x="212" y="356">PATH, HOME, its sign-in, proxy</text>
    <text class="t-on" x="582" y="338">Plus the names the operator lists</text>
    <text class="t-s" x="582" y="356">LINEAR_API_KEY, GH_TOKEN</text>
    <line class="row" x1="16" y1="372" x2="924" y2="372"/>
  </g>

  <g id="header">
    <text class="t-h" x="32" y="400">Session header</text>
    <text class="t-s" x="32" y="418">what the run loaded</text>
    <text class="t-b" x="212" y="398">Repo conventions: not loaded</text>
    <text class="t-s" x="212" y="416">new line, in every mode</text>
    <text class="t-on" x="582" y="398">Repo conventions: loaded, hooks off</text>
    <text class="t-s" x="582" y="416">per harness: Cursor still says not loaded</text>
  </g>
</svg>
