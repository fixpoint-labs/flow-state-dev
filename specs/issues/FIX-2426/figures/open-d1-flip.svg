<svg viewBox="0 0 940 420" role="img" aria-label="Open fork: the D1 flip, measured. An idle session-stream view costs four statements a second, which at our own apps' one to five tabs is under one percent of a ten-connection pool, so the flip D1 names fires as written. Recommended: keep the bus as the epic decided. Instead of: widen the session stream to user and org scopes and cut the bus, the Postgres bus and the socket. It comes down to what a hundred open tabs cost: with the bus nothing while idle; widened, about twelve hundred statements a second, ten to fifteen percent of the pool. At our own apps' counts it is a tie. Building: the bus is three channel issues; widening is about two. Locks in the epic as signed. Flips if the target stays our own apps' tab counts for the next release."
     xmlns="http://www.w3.org/2000/svg">
  <style>
    :root { --surface:#FCFCFA; --surface-2:#E8E8E1; --ink:#191C21; --ink-2:#4C535B; --ink-3:#7A828B;
            --rule:#D5D4CB; --accent:#3E4E8C; --accent-soft:#E0E3F0; --code:#2C7C69; --code-soft:#DCEDE7;
            --gone:#A9544F; }
    @media (prefers-color-scheme: dark) {
      :root { --surface:#181C1F; --surface-2:#202528; --ink:#E6E8E5; --ink-2:#A4ACB1; --ink-3:#737B81;
              --rule:#2B3135; --accent:#8B9BD8; --accent-soft:#1B2140; --code:#5DBBA1; --code-soft:#14302A;
              --gone:#DE8A84; } }
    .bg     { fill:var(--surface); }
    .ask    { fill:var(--surface-2); }
    .chosen { fill:var(--code-soft); stroke:var(--code); stroke-width:1.6; }
    .rec    { fill:var(--code-soft); stroke:var(--code); stroke-width:1.6; stroke-dasharray:5 4; }
    .lost   { fill:var(--surface); stroke:var(--rule); stroke-width:1.4; stroke-dasharray:5 4; }
    .decide { fill:var(--accent-soft); }
    .bar    { fill:var(--accent); }
    .row    { stroke:var(--rule); stroke-width:1; }
    .foot   { fill:var(--surface-2); }
    .t-lbl  { fill:var(--ink-3); font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:9.5px; letter-spacing:.1em; }
    .t-tag  { font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:9.5px; letter-spacing:.1em; font-weight:600; }
    .t-q    { fill:var(--ink); font-family:system-ui,-apple-system,sans-serif; font-weight:600; font-size:15px; }
    .t-h    { font-family:system-ui,-apple-system,sans-serif; font-weight:600; font-size:14px; }
    .t-b    { fill:var(--ink); font-family:system-ui,-apple-system,sans-serif; font-size:12.5px; }
    .t-s    { fill:var(--ink-2); font-family:system-ui,-apple-system,sans-serif; font-size:11px; }
    .mark   { font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:16px; font-weight:700; }
    .plus   { fill:var(--code); }
    .minus  { fill:var(--gone); }
    .tie    { fill:var(--ink-3); }
    .c-code { fill:var(--code); }
    .c-mute { fill:var(--ink-3); }
    .c-lost { fill:var(--ink-2); }
    .c-acc  { fill:var(--accent); }
  </style>
  <rect class="bg" x="0" y="0" width="940" height="420"/>

  <g id="the-call">
    <rect class="ask" x="16" y="14" width="908" height="48" rx="6"/>
    <text class="t-lbl" x="32" y="32">OPEN · THE CALL</text>
    <text class="t-q" x="32" y="52">D1’s flip fired at our own apps’ tab counts. Keep the bus, or widen?</text>
  </g>

  <g id="options">
    <rect class="rec" x="212" y="76" width="348" height="46" rx="5"/>
    <text class="t-tag c-code" x="228" y="93">RECOMMENDED</text>
    <text class="t-h c-code" x="228" y="112">Keep the bus, as the epic decided</text>
    <rect class="lost" x="576" y="76" width="348" height="46" rx="5"/>
    <text class="t-tag c-mute" x="592" y="93">INSTEAD OF</text>
    <text class="t-h c-lost" x="592" y="112">Widen the session stream to user, org</text>
  </g>

  <g id="row-decides">
    <rect class="decide" x="16" y="134" width="908" height="62" rx="4"/>
    <rect class="bar" x="16" y="134" width="4" height="62"/>
    <text class="t-lbl" x="32" y="156">100 OPEN TABS,</text>
    <text class="t-lbl" x="32" y="169">IDLE</text>
    <text class="t-tag c-acc" x="32" y="186">▸ DECIDES IT</text>
    <text class="mark plus" x="228" y="162">+</text>
    <text class="t-b" x="248" y="161">Nothing while idle</text>
    <text class="t-s" x="248" y="179">a read only after a change</text>
    <text class="mark minus" x="592" y="162">−</text>
    <text class="t-b" x="612" y="161">~1,200 statements a second</text>
    <text class="t-s" x="612" y="179">~10–15% of a 10-connection pool</text>
  </g>
  <g id="row-2">
    <text class="t-lbl" x="32" y="222">OUR OWN APPS,</text>
    <text class="t-lbl" x="32" y="235">1–5 TABS</text>
    <text class="mark tie" x="228" y="224">=</text>
    <text class="t-b" x="248" y="223">Under 1% of the pool</text>
    <text class="t-s" x="248" y="241">either way</text>
    <text class="mark tie" x="592" y="224">=</text>
    <text class="t-b" x="612" y="223">Under 1% of the pool</text>
    <text class="t-s" x="612" y="241">either way</text>
    <line class="row" x1="16" y1="256" x2="924" y2="256"/>
  </g>
  <g id="row-3">
    <text class="t-lbl" x="32" y="286">WHAT IT COSTS</text>
    <text class="t-lbl" x="32" y="299">TO BUILD</text>
    <text class="mark minus" x="228" y="288">−</text>
    <text class="t-b" x="248" y="287">Three channel issues</text>
    <text class="t-s" x="248" y="305">this one, the Postgres bus, the socket</text>
    <text class="mark plus" x="592" y="288">+</text>
    <text class="t-b" x="612" y="287">About two issues</text>
    <text class="t-s" x="612" y="305">the session stream widened instead</text>
    <line class="row" x1="16" y1="320" x2="924" y2="320"/>
  </g>

  <g id="locks-in">
    <rect class="foot" x="16" y="334" width="446" height="74" rx="5"/>
    <text class="t-lbl" x="32" y="355">LOCKS IN</text>
    <text class="t-b" x="32" y="375">The epic as signed</text>
    <text class="t-s" x="32" y="393">the bus, the Postgres bus, the socket</text>
  </g>

  <g id="flips-if">
    <rect class="foot" x="478" y="334" width="446" height="74" rx="5"/>
    <text class="t-lbl" x="494" y="355">FLIPS IF</text>
    <text class="t-b" x="494" y="375">The target stays our own apps’ tab counts</text>
    <text class="t-s" x="494" y="393">for the next release: then widen</text>
  </g>

</svg>
