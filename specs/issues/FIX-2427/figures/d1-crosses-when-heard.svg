<svg viewBox="0 0 940 420" role="img" aria-label="D1: when does the Postgres bus say it crosses processes, which turns the session stream's once-a-second read off? Chosen: only while it hears its own ping come back through Postgres. Instead of: as soon as its LISTEN succeeds. It comes down to a pooler or a dropped connection the app does not know about: with the ping, views go back to the once-a-second read within about five seconds and miss nothing; trusting the LISTEN, views on other processes stop updating with no error. The price: one small statement per process every 2 seconds, and a bus whose answer can change while the process runs. Startup is a tie: neither fails it. Locks in: the bus's crosses-processes answer changes while running, and each change is an event that wakes the views already waiting. Flips if every deployment we support holds a direct, unpooled connection that never drops silently."
     xmlns="http://www.w3.org/2000/svg">
  <style>
    :root { --surface:#FCFCFA; --surface-2:#E8E8E1; --ink:#191C21; --ink-2:#4C535B; --ink-3:#7A828B;
            --rule:#D5D4CB; --accent:#3E4E8C; --accent-soft:#E0E3F0; --code:#2C7C69; --code-soft:#DCEDE7;
            --gone:#A9544F; }
    @media (prefers-color-scheme: dark) {
      :root { --surface:#181C1F; --surface-2:#202528; --ink:#E6E8E5; --ink-2:#A4ACB1; --ink-3:#737B81;
              --rule:#2B3135; --accent:#8B9BD8; --accent-soft:#1B2140; --code:#5DBBA1; --code-soft:#14302A;
              --gone:#DE8A84; } }
    .bg     { fill:var(--surface); }
    .ask    { fill:var(--surface-2); }
    .chosen { fill:var(--code-soft); stroke:var(--code); stroke-width:1.6; }
    .lost   { fill:var(--surface); stroke:var(--rule); stroke-width:1.4; stroke-dasharray:5 4; }
    .decide { fill:var(--accent-soft); }
    .bar    { fill:var(--accent); }
    .row    { stroke:var(--rule); stroke-width:1; }
    .foot   { fill:var(--surface-2); }
    .t-lbl  { fill:var(--ink-3); font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:9.5px; letter-spacing:.1em; }
    .t-tag  { font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:9.5px; letter-spacing:.1em; font-weight:600; }
    .t-q    { fill:var(--ink); font-family:system-ui,-apple-system,sans-serif; font-weight:600; font-size:15px; }
    .t-h    { font-family:system-ui,-apple-system,sans-serif; font-weight:600; font-size:14px; }
    .t-b    { fill:var(--ink); font-family:system-ui,-apple-system,sans-serif; font-size:12.5px; }
    .t-s    { fill:var(--ink-2); font-family:system-ui,-apple-system,sans-serif; font-size:11px; }
    .mark   { font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:16px; font-weight:700; }
    .plus   { fill:var(--code); }
    .minus  { fill:var(--gone); }
    .tie    { fill:var(--ink-3); }
    .c-code { fill:var(--code); }
    .c-mute { fill:var(--ink-3); }
    .c-lost { fill:var(--ink-2); }
    .c-acc  { fill:var(--accent); }
  </style>
  <rect class="bg" x="0" y="0" width="940" height="420"/>

  <g id="the-call">
    <rect class="ask" x="16" y="14" width="908" height="48" rx="6"/>
    <text class="t-lbl" x="32" y="32">D1 · THE CALL</text>
    <text class="t-q" x="32" y="52">When does the Postgres bus say it crosses processes, and so turn the timed read off?</text>
  </g>

  <g id="options">
    <rect class="chosen" x="212" y="76" width="348" height="46" rx="5"/>
    <text class="t-tag c-code" x="228" y="93">CHOSEN</text>
    <text class="t-h c-code" x="228" y="112">Only while it hears its own ping</text>
    <rect class="lost" x="576" y="76" width="348" height="46" rx="5"/>
    <text class="t-tag c-mute" x="592" y="93">INSTEAD OF</text>
    <text class="t-h c-lost" x="592" y="112">As soon as its LISTEN succeeds</text>
  </g>

  <g id="row-decides">
    <rect class="decide" x="16" y="134" width="908" height="62" rx="4"/>
    <rect class="bar" x="16" y="134" width="4" height="62"/>
    <text class="t-lbl" x="32" y="156">A POOLER, OR A</text>
    <text class="t-lbl" x="32" y="169">SILENT DROP</text>
    <text class="t-tag c-acc" x="32" y="186">▸ DECIDES IT</text>
    <text class="mark plus" x="228" y="162">+</text>
    <text class="t-b" x="248" y="161">Back to the 1 s read in about 5 s</text>
    <text class="t-s" x="248" y="179">late for a moment, nothing missed</text>
    <text class="mark minus" x="592" y="162">−</text>
    <text class="t-b" x="612" y="161">Other processes stop updating</text>
    <text class="t-s" x="612" y="179">no error, until someone reloads</text>
  </g>
  <g id="row-2">
    <text class="t-lbl" x="32" y="222">STANDING COST</text>
    <text class="mark minus" x="228" y="224">−</text>
    <text class="t-b" x="248" y="223">One ping per process, every 2 s</text>
    <text class="t-s" x="248" y="241">not per view; idle views still free</text>
    <text class="mark plus" x="592" y="224">+</text>
    <text class="t-b" x="612" y="223">Nothing</text>
    <text class="t-s" x="612" y="241">while nothing changes</text>
    <line class="row" x1="16" y1="256" x2="924" y2="256"/>
  </g>
  <g id="row-3">
    <text class="t-lbl" x="32" y="286">STARTUP</text>
    <text class="mark tie" x="228" y="288">=</text>
    <text class="t-b" x="248" y="287">Starts, and warns once</text>
    <text class="t-s" x="248" y="305">if no ping comes back</text>
    <text class="mark tie" x="592" y="288">=</text>
    <text class="t-b" x="612" y="287">Starts</text>
    <text class="t-s" x="612" y="305">neither breaks an app that never asked</text>
    <line class="row" x1="16" y1="320" x2="924" y2="320"/>
  </g>

  <g id="locks-in">
    <rect class="foot" x="16" y="334" width="446" height="74" rx="5"/>
    <text class="t-lbl" x="32" y="355">LOCKS IN</text>
    <text class="t-b" x="32" y="375">"Crosses processes" changes while running</text>
    <text class="t-s" x="32" y="393">each change an event that wakes waiting views</text>
  </g>

  <g id="flips-if">
    <rect class="foot" x="478" y="334" width="446" height="74" rx="5"/>
    <text class="t-lbl" x="494" y="355">FLIPS IF</text>
    <text class="t-b" x="494" y="375">Every host holds a direct connection</text>
    <text class="t-s" x="494" y="393">unpooled, and it never drops silently</text>
  </g>
</svg>
