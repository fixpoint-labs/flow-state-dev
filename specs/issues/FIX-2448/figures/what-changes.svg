<svg viewBox="0 0 940 470" role="img" aria-label="Core's root before and after. Left, today: one root of 563 names, with 337 names an app author uses or the docs teach, 107 the check flags, 6 benchmark types, 55 harness and pull-request names, 54 runtime seams, and 4 unused names, plus the items/internal entry. Right, after: the root keeps the 337 and whichever flagged names earn a README line, and the benchmark types until they move to testing. core/harness, a documented public subpath, takes the 55 harness names and 30 more from core/types. A fence follows: behind it, core/internal, published for our own packages only and outside semver, takes the 54 seams, 27 more from core/types, and the folded items/internal. Four unused names are deleted. BlockContext's public type loses requestHost and five symbol slots."
     xmlns="http://www.w3.org/2000/svg">
  <style>
    :root { --surface:#FCFCFA; --surface-2:#E8E8E1; --ink:#191C21; --ink-2:#4C535B; --ink-3:#7A828B;
            --rule:#D5D4CB; --accent:#3E4E8C; --accent-soft:#E0E3F0; --code:#2C7C69; --code-soft:#DCEDE7;
            --prose:#A8761C; --prose-soft:#F3E8D2; --gone:#A9544F; }
    @media (prefers-color-scheme: dark) {
      :root { --surface:#181C1F; --surface-2:#202528; --ink:#E6E8E5; --ink-2:#A4ACB1; --ink-3:#737B81;
              --rule:#2B3135; --accent:#8B9BD8; --accent-soft:#1B2140; --code:#5DBBA1; --code-soft:#14302A;
              --prose:#D9A44B; --prose-soft:#332612; --gone:#DE8A84; } }
    .bg    { fill:var(--surface); }
    .n-box { fill:var(--surface); stroke:var(--rule); stroke-width:1.2; }
    .z-pub { fill:var(--code-soft); stroke:var(--code); stroke-width:1.4; }
    .z-sub { fill:var(--accent-soft); stroke:var(--accent); stroke-width:1.4; }
    .z-int { fill:var(--surface-2); stroke:var(--ink-3); stroke-width:1.2; stroke-dasharray:5 4; }
    .z-gone{ fill:var(--surface); stroke:var(--gone); stroke-width:1.2; stroke-dasharray:3 3; }
    .fence { stroke:var(--gone); stroke-width:2; stroke-dasharray:8 5; }
    .flow  { stroke:var(--ink-3); stroke-width:1.2; fill:none; }
    .t-lbl { fill:var(--ink-3); font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:9.5px; letter-spacing:.1em; }
    .t-b   { fill:var(--ink); font-family:system-ui,-apple-system,sans-serif; font-weight:600; font-size:13px; }
    .t-r   { fill:var(--ink); font-family:system-ui,-apple-system,sans-serif; font-size:12px; }
    .t-s   { fill:var(--ink-2); font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:9.5px; }
    .c-gone{ fill:var(--gone); }
    .c-code{ fill:var(--code); }
    .c-acc { fill:var(--accent); }
  </style>
  <rect class="bg" x="0" y="0" width="940" height="470"/>

  <g id="today">
    <text class="t-lbl" x="16" y="26">TODAY</text>
    <rect class="n-box" x="16" y="36" width="318" height="400" rx="6"/>
    <text class="t-b" x="32" y="60">@flow-state-dev/core · 563 names</text>
    <text class="t-r" x="32" y="92">337 an app author uses or the docs teach</text>
    <text class="t-r" x="32" y="116">107 the check flags</text>
    <text class="t-r" x="32" y="140">6 benchmark types</text>
    <text class="t-r" x="32" y="204">55 harness and pull-request names</text>
    <text class="t-s" x="32" y="220">recordPullRequests · harnessEnv · OBSERVED_PLAN</text>
    <text class="t-r" x="32" y="316">54 runtime seams</text>
    <text class="t-s" x="32" y="332">RequestHost · parkOnWait · waitGateDataOf</text>
    <text class="t-r" x="32" y="356">./items/internal, a second hidden entry</text>
    <text class="t-r" x="32" y="414">4 names nothing uses</text>
    <text class="t-s" x="32" y="428">core/types carries 57 harness and 66 seam names too</text>
  </g>

  <g id="flows">
    <path class="flow" d="M300 88 C 360 88, 360 92, 420 92"/>
    <path class="flow" d="M300 112 C 360 112, 360 116, 420 116"/>
    <path class="flow" d="M300 136 C 360 136, 360 140, 420 140"/>
    <path class="flow" d="M300 200 C 360 200, 360 204, 420 204"/>
    <path class="flow" d="M300 312 C 360 312, 360 318, 420 318"/>
    <path class="flow" d="M300 352 C 360 352, 360 342, 420 342"/>
    <path class="flow" d="M300 410 C 360 410, 360 414, 420 414"/>
  </g>

  <g id="after">
    <text class="t-lbl" x="420" y="26">AFTER</text>
    <rect class="z-pub" x="420" y="36" width="504" height="122" rx="6"/>
    <text class="t-lbl c-code" x="436" y="56">THE ROOT · FOR APP AUTHORS</text>
    <text class="t-r" x="436" y="96">the 337, unchanged</text>
    <text class="t-r" x="436" y="120">each flagged name: a README line, internal, or deleted</text>
    <text class="t-r" x="436" y="144">until they move to testing/benchmark</text>

    <rect class="z-sub" x="420" y="172" width="504" height="76" rx="6"/>
    <text class="t-lbl c-acc" x="436" y="190">CORE/HARNESS · PUBLIC · DOCUMENTED · SEMVER</text>
    <text class="t-r" x="436" y="208">the 55, and 30 harness types from core/types</text>
    <text class="t-s" x="436" y="228">one home for the harness contract, the plan record, the pull-request record</text>

    <line class="fence" x1="400" y1="268" x2="924" y2="268"/>
    <text class="t-lbl c-gone" x="436" y="286">FENCE · /INTERNAL · OUR PACKAGES ONLY · OUTSIDE SEMVER</text>

    <rect class="z-int" x="420" y="296" width="504" height="76" rx="6"/>
    <text class="t-lbl" x="436" y="314">CORE/INTERNAL · PUBLISHED · UNDOCUMENTED</text>
    <text class="t-r" x="436" y="332">the 54, 27 seams from core/types, items/internal folded in</text>
    <text class="t-s" x="436" y="352">requestHost and five symbol slots leave the public BlockContext</text>

    <rect class="z-gone" x="420" y="392" width="504" height="44" rx="6"/>
    <text class="t-lbl c-gone" x="436" y="410">DELETED</text>
    <text class="t-r" x="436" y="428">dispatchWaitResultSchema · findOpenedPullRequests · two more</text>
  </g>
</svg>
