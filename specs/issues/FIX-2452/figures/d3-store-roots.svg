<svg viewBox="0 0 940 418" role="img" aria-label="D3, what a store package&#x27;s root shows an app author. Chosen: the adapter factory and schedule index on the root, everything else in ./host, nothing deleted. Instead of: both families on the root as today, or deleting the 21 per-store constructors. It comes down to the first row: autocomplete shows 3 or 4 names, the factory the docs teach, where today shows 20 or 22 in two families; deleting also shows 3 or 4. The price is the second row: a caller of a moved name changes one import, per Q1&#x27;s answer, where today changes nothing and deleting loses a documented constructor. Third row: ./host is one more semver-covered entry each; today has the same names in one entry; deleting has 21 fewer names. Locks in: ./host is public on both store packages. Flips if: its constructors stay unused for a minor."
     xmlns="http://www.w3.org/2000/svg">
  <style>
    :root { --surface:#FCFCFA; --surface-2:#E8E8E1; --ink:#191C21; --ink-2:#4C535B; --ink-3:#7A828B;
            --rule:#D5D4CB; --accent:#3E4E8C; --accent-soft:#E0E3F0; --code:#2C7C69; --code-soft:#DCEDE7;
            --gone:#A9544F; }
    @media (prefers-color-scheme: dark) {
      :root { --surface:#181C1F; --surface-2:#202528; --ink:#E6E8E5; --ink-2:#A4ACB1; --ink-3:#737B81;
              --rule:#2B3135; --accent:#8B9BD8; --accent-soft:#1B2140; --code:#5DBBA1; --code-soft:#14302A;
              --gone:#DE8A84; } }
    .bg     { fill:var(--surface); }
    .ask    { fill:var(--surface-2); }
    .chosen { fill:var(--code-soft); stroke:var(--code); stroke-width:1.6; }
    .lost   { fill:var(--surface); stroke:var(--rule); stroke-width:1.4; stroke-dasharray:5 4; }
    .decide { fill:var(--accent-soft); }
    .bar    { fill:var(--accent); }
    .row    { stroke:var(--rule); stroke-width:1; }
    .foot   { fill:var(--surface-2); }
    .t-lbl  { fill:var(--ink-3); font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:9.5px; letter-spacing:.1em; }
    .t-tag  { font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:9.5px; letter-spacing:.1em; font-weight:600; }
    .t-q    { fill:var(--ink); font-family:system-ui,-apple-system,sans-serif; font-weight:600; font-size:15px; }
    .t-h    { font-family:system-ui,-apple-system,sans-serif; font-weight:600; font-size:14px; }
    .t-b    { fill:var(--ink); font-family:system-ui,-apple-system,sans-serif; font-size:12.5px; }
    .t-s    { fill:var(--ink-2); font-family:system-ui,-apple-system,sans-serif; font-size:11px; }
    .mark   { font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:16px; font-weight:700; }
    .plus   { fill:var(--code); }
    .minus  { fill:var(--gone); }
    .tie    { fill:var(--ink-3); }
    .c-code { fill:var(--code); }
    .c-mute { fill:var(--ink-3); }
    .c-lost { fill:var(--ink-2); }
    .c-acc  { fill:var(--accent); }
  </style>
  <rect class="bg" x="0" y="0" width="940" height="418"/>
  <g id="the-call">
    <rect class="ask" x="16" y="14" width="908" height="48" rx="6"/>
    <text class="t-lbl" x="32" y="32">D3 · THE CALL</text>
    <text class="t-q" x="32" y="52">What does a store package&#x27;s root show an app author?</text>
  </g>
  <g id="options">
    <rect class="chosen" x="212" y="76" width="224" height="46" rx="5"/>
    <text class="t-tag c-code" x="228" y="93">CHOSEN</text>
    <text class="t-h c-code" x="228" y="112">Adapter; rest in ./host</text>
    <rect class="lost" x="452" y="76" width="224" height="46" rx="5"/>
    <text class="t-tag c-mute" x="468" y="93">INSTEAD OF</text>
    <text class="t-h c-lost" x="468" y="112">Both families on the root</text>
    <rect class="lost" x="692" y="76" width="224" height="46" rx="5"/>
    <text class="t-tag c-mute" x="708" y="93">INSTEAD OF</text>
    <text class="t-h c-lost" x="708" y="112">Delete the constructors</text>
  </g>
  <g id="row-0">
    <rect class="decide" x="16" y="134" width="908" height="62" rx="4"/>
    <rect class="bar" x="16" y="134" width="4" height="62"/>
    <text class="t-lbl" x="32" y="156">AUTOCOMPLETE</text>
    <text class="t-lbl" x="32" y="169">ON THE ROOT</text>
    <text class="t-tag c-acc" x="32" y="186">▸ DECIDES IT</text>
    <text class="mark plus" x="228" y="162">+</text>
    <text class="t-b" x="248" y="161">3 or 4 names</text>
    <text class="t-s" x="248" y="179">the factory the docs teach</text>
    <text class="mark minus" x="468" y="162">−</text>
    <text class="t-b" x="488" y="161">20 or 22 names</text>
    <text class="t-s" x="488" y="179">two families, 21 constructors</text>
    <text class="mark plus" x="708" y="162">+</text>
    <text class="t-b" x="728" y="161">3 or 4 names</text>
    <text class="t-s" x="728" y="179">the same root</text>
  </g>
  <g id="row-1">
    <text class="t-lbl" x="32" y="218">A CALLER OF A</text>
    <text class="t-lbl" x="32" y="231">MOVED NAME</text>
    <text class="mark minus" x="228" y="224">−</text>
    <text class="t-b" x="248" y="223">Changes one import</text>
    <text class="t-s" x="248" y="241">per Q1&#x27;s answer</text>
    <text class="mark plus" x="468" y="224">+</text>
    <text class="t-b" x="488" y="223">Changes nothing</text>
    <text class="t-s" x="488" y="241">the root keeps it</text>
    <text class="mark minus" x="708" y="224">−</text>
    <text class="t-b" x="728" y="223">Loses a constructor</text>
    <text class="t-s" x="728" y="241">documented in each README</text>
    <line class="row" x1="16" y1="254" x2="924" y2="254"/>
  </g>
  <g id="row-2">
    <text class="t-lbl" x="32" y="276">PUBLIC</text>
    <text class="t-lbl" x="32" y="289">SURFACE</text>
    <text class="mark minus" x="228" y="282">−</text>
    <text class="t-b" x="248" y="281">One more entry each</text>
    <text class="t-s" x="248" y="299">./host is semver-covered</text>
    <text class="mark tie" x="468" y="282">=</text>
    <text class="t-b" x="488" y="281">Same names</text>
    <text class="t-s" x="488" y="299">in one entry</text>
    <text class="mark plus" x="708" y="282">+</text>
    <text class="t-b" x="728" y="281">21 fewer names</text>
    <text class="t-s" x="728" y="299">to keep working</text>
    <line class="row" x1="16" y1="312" x2="924" y2="312"/>
  </g>
  <g id="locks-in">
    <rect class="foot" x="16" y="328" width="446" height="74" rx="5"/>
    <text class="t-lbl" x="32" y="349">LOCKS IN</text>
    <text class="t-b" x="32" y="369">./host is public on both store packages</text>
    <text class="t-s" x="32" y="387">documented and semver-covered, one more entry each</text>
  </g>
  <g id="flips-if">
    <rect class="foot" x="478" y="328" width="446" height="74" rx="5"/>
    <text class="t-lbl" x="494" y="349">FLIPS IF</text>
    <text class="t-b" x="494" y="369">Its constructors stay unused for a minor</text>
    <text class="t-s" x="494" y="387">then delete them in the next minor</text>
  </g>
</svg>
