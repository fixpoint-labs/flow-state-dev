<svg viewBox="0 0 940 420" role="img" aria-label="D2, how long a refusal stays before its removal version. Chosen: at least two minors past the first version that refuses it. Instead of: every refusal until 1.0, or one minor. It comes down to the first row: an adopter who skips one minor still meets the refusal under the chosen window and under until 1.0, but meets the bare failure, silent for an open-string value, under one minor. The price is the second row: an adopter who skips two minors meets the bare failure under the chosen window; until 1.0 never does; one minor already did. The third row: tables stay short under the chosen window and one minor, and grow until 1.0 under that option, which then needs one big removal minor. Locks in: a version in every refusal message that adopters plan by. Flips if: minors come a month apart or slower, then one minor is enough."
     xmlns="http://www.w3.org/2000/svg">
  <style>
    :root { --surface:#FCFCFA; --surface-2:#E8E8E1; --ink:#191C21; --ink-2:#4C535B; --ink-3:#7A828B;
            --rule:#D5D4CB; --accent:#3E4E8C; --accent-soft:#E0E3F0; --code:#2C7C69; --code-soft:#DCEDE7;
            --gone:#A9544F; }
    @media (prefers-color-scheme: dark) {
      :root { --surface:#181C1F; --surface-2:#202528; --ink:#E6E8E5; --ink-2:#A4ACB1; --ink-3:#737B81;
              --rule:#2B3135; --accent:#8B9BD8; --accent-soft:#1B2140; --code:#5DBBA1; --code-soft:#14302A;
              --gone:#DE8A84; } }
    .bg     { fill:var(--surface); }
    .ask    { fill:var(--surface-2); }
    .chosen { fill:var(--code-soft); stroke:var(--code); stroke-width:1.6; }
    .lost   { fill:var(--surface); stroke:var(--rule); stroke-width:1.4; stroke-dasharray:5 4; }
    .decide { fill:var(--accent-soft); }
    .bar    { fill:var(--accent); }
    .row    { stroke:var(--rule); stroke-width:1; }
    .foot   { fill:var(--surface-2); }
    .t-lbl  { fill:var(--ink-3); font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:9.5px; letter-spacing:.1em; }
    .t-tag  { font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:9.5px; letter-spacing:.1em; font-weight:600; }
    .t-q    { fill:var(--ink); font-family:system-ui,-apple-system,sans-serif; font-weight:600; font-size:15px; }
    .t-h    { font-family:system-ui,-apple-system,sans-serif; font-weight:600; font-size:14px; }
    .t-b    { fill:var(--ink); font-family:system-ui,-apple-system,sans-serif; font-size:12.5px; }
    .t-s    { fill:var(--ink-2); font-family:system-ui,-apple-system,sans-serif; font-size:11px; }
    .mark   { font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:16px; font-weight:700; }
    .plus   { fill:var(--code); }
    .minus  { fill:var(--gone); }
    .tie    { fill:var(--ink-3); }
    .c-code { fill:var(--code); }
    .c-mute { fill:var(--ink-3); }
    .c-lost { fill:var(--ink-2); }
    .c-acc  { fill:var(--accent); }
  </style>
  <rect class="bg" x="0" y="0" width="940" height="420"/>

  <g id="the-call">
    <rect class="ask" x="16" y="14" width="908" height="48" rx="6"/>
    <text class="t-lbl" x="32" y="32">D2 · THE CALL</text>
    <text class="t-q" x="32" y="52">How long does a refusal stay before the version that removes it?</text>
  </g>

  <g id="options">
    <rect class="chosen" x="212" y="76" width="224" height="46" rx="5"/>
    <text class="t-tag c-code" x="226" y="93">CHOSEN</text>
    <text class="t-h c-code" x="226" y="112">Two minors past its first</text>
    <rect class="lost" x="452" y="76" width="224" height="46" rx="5"/>
    <text class="t-tag c-mute" x="466" y="93">INSTEAD OF</text>
    <text class="t-h c-lost" x="466" y="112">Until 1.0</text>
    <rect class="lost" x="692" y="76" width="224" height="46" rx="5"/>
    <text class="t-tag c-mute" x="706" y="93">INSTEAD OF</text>
    <text class="t-h c-lost" x="706" y="112">One minor</text>
  </g>

  <g id="row-decides">
    <rect class="decide" x="16" y="134" width="908" height="62" rx="4"/>
    <rect class="bar" x="16" y="134" width="4" height="62"/>
    <text class="t-lbl" x="32" y="156">AN ADOPTER WHO</text>
    <text class="t-lbl" x="32" y="169">SKIPS A MINOR</text>
    <text class="t-tag c-acc" x="32" y="186">▸ DECIDES IT</text>
    <text class="mark plus" x="226" y="162">+</text>
    <text class="t-b" x="244" y="161">Still refused, by name</text>
    <text class="t-s" x="244" y="179">the next minor still carries it</text>
    <text class="mark plus" x="466" y="162">+</text>
    <text class="t-b" x="484" y="161">Still refused, by name</text>
    <text class="t-s" x="484" y="179">every minor carries it</text>
    <text class="mark minus" x="706" y="162">−</text>
    <text class="t-b" x="724" y="161">The bare failure</text>
    <text class="t-s" x="724" y="179">silent again for human_*</text>
  </g>

  <g id="row-price">
    <text class="t-lbl" x="32" y="222">SKIPS TWO MINORS</text>
    <text class="mark minus" x="226" y="224">−</text>
    <text class="t-b" x="244" y="223">The bare failure</text>
    <text class="t-s" x="244" y="241">unless the author named later</text>
    <text class="mark plus" x="466" y="224">+</text>
    <text class="t-b" x="484" y="223">Still refused</text>
    <text class="t-s" x="484" y="241">until 1.0</text>
    <text class="mark minus" x="706" y="224">−</text>
    <text class="t-b" x="724" y="223">The bare failure</text>
    <text class="t-s" x="724" y="241">already, one skip earlier</text>
    <line class="row" x1="16" y1="256" x2="924" y2="256"/>
  </g>

  <g id="row-tables">
    <text class="t-lbl" x="32" y="280">THE TABLES</text>
    <text class="mark plus" x="226" y="282">+</text>
    <text class="t-b" x="244" y="281">Short, removed as they go</text>
    <text class="t-s" x="244" y="299">each minor drops what expired</text>
    <text class="mark minus" x="466" y="282">−</text>
    <text class="t-b" x="484" y="281">Grow until 1.0</text>
    <text class="t-s" x="484" y="299">then one big removal minor</text>
    <text class="mark plus" x="706" y="282">+</text>
    <text class="t-b" x="724" y="281">Shortest</text>
    <text class="t-s" x="724" y="299">one minor each</text>
    <line class="row" x1="16" y1="314" x2="924" y2="314"/>
  </g>

  <g id="locks-in">
    <rect class="foot" x="16" y="330" width="446" height="74" rx="5"/>
    <text class="t-lbl" x="32" y="351">LOCKS IN</text>
    <text class="t-b" x="32" y="371">A removal version in every refusal message</text>
    <text class="t-s" x="32" y="389">adopters plan upgrades by it; dropping one is breaking</text>
  </g>

  <g id="flips-if">
    <rect class="foot" x="478" y="330" width="446" height="74" rx="5"/>
    <text class="t-lbl" x="494" y="351">FLIPS IF</text>
    <text class="t-b" x="494" y="371">Minors come a month apart or slower</text>
    <text class="t-s" x="494" y="389">then one minor is a month of warning</text>
  </g>
</svg>
