<svg viewBox="0 0 940 356" role="img" aria-label="What changes. Today: send, wait for a status with no output, list the session&#39;s requests a page of 20 or 100 at a time, search for the request&#39;s own id, and a request past the page reads as missing. Six copies of that path: orchestration&#39;s inbox, the client&#39;s harness line, Shift Manager&#39;s action helper, Workforce&#39;s runIn, and two labs. After: send, then result, which is the same one wait, then one read of the request by id from the status route with its stored result. There is no search step, and the app gets status, output and error."
     xmlns="http://www.w3.org/2000/svg">
  <style>
    :root { --surface:#FCFCFA; --surface-2:#E8E8E1; --ink:#191C21; --ink-2:#4C535B; --ink-3:#7A828B;
            --rule:#D5D4CB; --accent:#3E4E8C; --accent-soft:#E0E3F0; --code:#2C7C69; --code-soft:#DCEDE7;
            --gone:#A9544F; --gone-soft:#F3E1DF; }
    @media (prefers-color-scheme: dark) {
      :root { --surface:#181C1F; --surface-2:#202528; --ink:#E6E8E5; --ink-2:#A4ACB1; --ink-3:#737B81;
              --rule:#2B3135; --accent:#8B9BD8; --accent-soft:#1B2140; --code:#5DBBA1; --code-soft:#14302A;
              --gone:#DE8A84; --gone-soft:#3A1F1D; } }
    .bg     { fill:var(--surface); }
    .ask    { fill:var(--surface-2); }
    .chosen { fill:var(--code-soft); stroke:var(--code); stroke-width:1.6; }
    .lost   { fill:var(--surface); stroke:var(--rule); stroke-width:1.4; stroke-dasharray:5 4; }
    .decide { fill:var(--accent-soft); }
    .bar    { fill:var(--accent); }
    .row    { stroke:var(--rule); stroke-width:1; }
    .foot   { fill:var(--surface-2); }
    .t-lbl  { fill:var(--ink-3); font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:9.5px; letter-spacing:.1em; }
    .t-tag  { font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:9.5px; letter-spacing:.1em; font-weight:600; }
    .t-q    { fill:var(--ink); font-family:system-ui,-apple-system,sans-serif; font-weight:600; font-size:15px; }
    .t-h    { font-family:system-ui,-apple-system,sans-serif; font-weight:600; font-size:14px; }
    .t-b    { fill:var(--ink); font-family:system-ui,-apple-system,sans-serif; font-size:12.5px; }
    .t-s    { fill:var(--ink-2); font-family:system-ui,-apple-system,sans-serif; font-size:11px; }
    .mark   { font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:16px; font-weight:700; }
    .plus   { fill:var(--code); }
    .minus  { fill:var(--gone); }
    .tie    { fill:var(--ink-3); }
    .c-code { fill:var(--code); }
    .c-mute { fill:var(--ink-3); }
    .c-lost { fill:var(--ink-2); }
    .c-acc  { fill:var(--accent); }
    .step   { fill:var(--surface); stroke:var(--rule); stroke-width:1.2; }
    .new    { fill:var(--code-soft); stroke:var(--code); stroke-width:1.4; }
    .old    { fill:var(--gone-soft); stroke:var(--gone); stroke-width:1.2; stroke-dasharray:5 4; }
    .arrow  { stroke:var(--ink-3); stroke-width:1.3; fill:none; }
    .head   { fill:var(--ink-3); }
    .c-gone { fill:var(--gone); }
  </style>
  <rect class="bg" x="0" y="0" width="940" height="356"/>

  <g id="columns">
    <text class="t-lbl" x="152" y="30">SEND</text>
    <text class="t-lbl" x="312" y="30">WAIT</text>
    <text class="t-lbl" x="472" y="30">READ</text>
    <text class="t-lbl" x="632" y="30">FIND</text>
    <text class="t-lbl" x="792" y="30">WHAT THE APP GETS</text>
  </g>

  <g id="today">
    <text class="t-tag c-gone" x="16" y="62">TODAY</text>
    <text class="t-s" x="16" y="80">six copies</text>
    <text class="t-s" x="16" y="95">inbox · harness</text>
    <text class="t-s" x="16" y="110">line · Shift Mgr</text>
    <text class="t-s" x="16" y="125">runIn · 2 labs</text>
    <rect class="step" x="140" y="48" width="148" height="72" rx="5"/>
    <text class="t-b" x="152" y="72">flow.send</text>
    <text class="t-s" x="152" y="92">accepted, an id</text>
    <rect class="step" x="300" y="48" width="148" height="72" rx="5"/>
    <text class="t-b" x="312" y="72">wait()</text>
    <text class="t-s" x="312" y="92">a status,</text>
    <text class="t-s" x="312" y="108">no output</text>
    <rect class="old" x="460" y="48" width="148" height="72" rx="5"/>
    <text class="t-b c-gone" x="472" y="72">List the session</text>
    <text class="t-s" x="472" y="92">a page of 20 or 100</text>
    <text class="t-s" x="472" y="108">newest first</text>
    <rect class="old" x="620" y="48" width="148" height="72" rx="5"/>
    <text class="t-b c-gone" x="632" y="72">Search for own id</text>
    <text class="t-s" x="632" y="92">r.id === sent.id</text>
    <rect class="old" x="780" y="48" width="148" height="72" rx="5"/>
    <text class="t-b c-gone" x="792" y="72">Missing past a page</text>
    <text class="t-s" x="792" y="92">&#8220;not taken&#8221;,</text>
    <text class="t-s" x="792" y="108">&#8220;could not be read&#8221;</text>
    <path class="arrow" d="M288 84 H296"/>
    <path class="head" d="M296 80 l6 4 l-6 4 z"/>
    <path class="arrow" d="M448 84 H456"/>
    <path class="head" d="M456 80 l6 4 l-6 4 z"/>
    <path class="arrow" d="M608 84 H616"/>
    <path class="head" d="M616 80 l6 4 l-6 4 z"/>
    <path class="arrow" d="M768 84 H776"/>
    <path class="head" d="M776 80 l6 4 l-6 4 z"/>
  </g>

  <line class="row" x1="16" y1="146" x2="924" y2="146"/>

  <g id="after">
    <text class="t-tag c-code" x="16" y="182">AFTER</text>
    <text class="t-s" x="16" y="200">one call; each</text>
    <text class="t-s" x="16" y="215">copy keeps only</text>
    <text class="t-s" x="16" y="230">its own words</text>
    <rect class="step" x="140" y="168" width="148" height="72" rx="5"/>
    <text class="t-b" x="152" y="192">flow.send</text>
    <text class="t-s" x="152" y="212">accepted, an id</text>
    <rect class="new" x="300" y="168" width="148" height="72" rx="5"/>
    <text class="t-b c-code" x="312" y="192">result()</text>
    <text class="t-s" x="312" y="212">the same one wait,</text>
    <text class="t-s" x="312" y="228">then one read</text>
    <rect class="new" x="460" y="168" width="148" height="72" rx="5"/>
    <text class="t-b c-code" x="472" y="192">Status route, by id</text>
    <text class="t-s" x="472" y="212">include_result_output</text>
    <text class="t-s" x="472" y="228">the stored result</text>
    <rect class="lost" x="620" y="168" width="148" height="72" rx="5"/>
    <text class="t-b" x="632" y="192" style="fill:var(--ink-3)">No search</text>
    <text class="t-s" x="632" y="212">one record, not</text>
    <text class="t-s" x="632" y="228">a session</text>
    <rect class="new" x="780" y="168" width="148" height="72" rx="5"/>
    <text class="t-b c-code" x="792" y="192">status, output, error</text>
    <text class="t-s" x="792" y="212">every ending, said</text>
    <path class="arrow" d="M288 204 H296"/>
    <path class="head" d="M296 200 l6 4 l-6 4 z"/>
    <path class="arrow" d="M448 204 H456"/>
    <path class="head" d="M456 200 l6 4 l-6 4 z"/>
    <path class="arrow" d="M608 204 H616"/>
    <path class="head" d="M616 200 l6 4 l-6 4 z"/>
    <path class="arrow" d="M768 204 H776"/>
    <path class="head" d="M776 200 l6 4 l-6 4 z"/>
  </g>

  <g id="foot">
    <rect class="foot" x="16" y="260" width="908" height="80" rx="5"/>
    <text class="t-lbl" x="32" y="282">WHAT STAYS</text>
    <text class="t-b" x="32" y="302">wait() and status() send the same snapshot without the flag; the session list keeps its flag for list views</text>
    <text class="t-s" x="32" y="322">React: useAction({ action, result: true }) resolves execute to the same result; flow reads stay on useSubscription</text>
  </g>
</svg>
