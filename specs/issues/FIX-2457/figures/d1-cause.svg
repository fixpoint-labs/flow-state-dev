<svg viewBox="0 0 940 418" role="img" aria-label="D1, what this issue fixes. Chosen: the capability path, folding FIX-2091 in. Instead of: variance for request, session and user state schemas. It comes down to the first row: on today&#x27;s main the state-schema cases already compile, while a handler with uses fails on targets; fixing state schemas changes nothing. The price is the second row: an outside issue joins the epic. Third row: the cast sweep is the same either way. Locks in: FIX-2091 closes with this issue. Flips if: a state-schema case fails on another TypeScript version."
     xmlns="http://www.w3.org/2000/svg">
  <style>
    :root { --surface:#FCFCFA; --surface-2:#E8E8E1; --ink:#191C21; --ink-2:#4C535B; --ink-3:#7A828B;
            --rule:#D5D4CB; --accent:#3E4E8C; --accent-soft:#E0E3F0; --code:#2C7C69; --code-soft:#DCEDE7;
            --gone:#A9544F; }
    @media (prefers-color-scheme: dark) {
      :root { --surface:#181C1F; --surface-2:#202528; --ink:#E6E8E5; --ink-2:#A4ACB1; --ink-3:#737B81;
              --rule:#2B3135; --accent:#8B9BD8; --accent-soft:#1B2140; --code:#5DBBA1; --code-soft:#14302A;
              --gone:#DE8A84; } }
    .bg     { fill:var(--surface); }
    .ask    { fill:var(--surface-2); }
    .chosen { fill:var(--code-soft); stroke:var(--code); stroke-width:1.6; }
    .lost   { fill:var(--surface); stroke:var(--rule); stroke-width:1.4; stroke-dasharray:5 4; }
    .decide { fill:var(--accent-soft); }
    .bar    { fill:var(--accent); }
    .row    { stroke:var(--rule); stroke-width:1; }
    .foot   { fill:var(--surface-2); }
    .t-lbl  { fill:var(--ink-3); font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:9.5px; letter-spacing:.1em; }
    .t-tag  { font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:9.5px; letter-spacing:.1em; font-weight:600; }
    .t-q    { fill:var(--ink); font-family:system-ui,-apple-system,sans-serif; font-weight:600; font-size:15px; }
    .t-h    { font-family:system-ui,-apple-system,sans-serif; font-weight:600; font-size:14px; }
    .t-b    { fill:var(--ink); font-family:system-ui,-apple-system,sans-serif; font-size:12.5px; }
    .t-s    { fill:var(--ink-2); font-family:system-ui,-apple-system,sans-serif; font-size:11px; }
    .mark   { font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:16px; font-weight:700; }
    .plus   { fill:var(--code); }
    .minus  { fill:var(--gone); }
    .tie    { fill:var(--ink-3); }
    .c-code { fill:var(--code); }
    .c-mute { fill:var(--ink-3); }
    .c-lost { fill:var(--ink-2); }
    .c-acc  { fill:var(--accent); }
  </style>
  <rect class="bg" x="0" y="0" width="940" height="418"/>

  <g id="the-call">
    <rect class="ask" x="16" y="14" width="908" height="48" rx="6"/>
    <text class="t-lbl" x="32" y="32">D1 · THE CALL</text>
    <text class="t-q" x="32" y="52">What actually stops a typed handler passing its ctx to a helper?</text>
  </g>

  <g id="options">
    <rect class="chosen" x="212" y="76" width="348" height="46" rx="5"/>
    <text class="t-tag c-code" x="228" y="93">CHOSEN</text>
    <text class="t-h c-code" x="228" y="112">The capability path · fold FIX-2091</text>
    <rect class="lost" x="576" y="76" width="348" height="46" rx="5"/>
    <text class="t-tag c-mute" x="592" y="93">INSTEAD OF</text>
    <text class="t-h c-lost" x="592" y="112">Variance for state schemas</text>
  </g>

  <g id="row-0">
    <rect class="decide" x="16" y="134" width="908" height="62" rx="4"/>
    <rect class="bar" x="16" y="134" width="4" height="62"/>
    <text class="t-lbl" x="32" y="156">WHAT THE PROBE</text>
    <text class="t-lbl" x="32" y="169">SHOWS BREAKS</text>
    <text class="t-tag c-acc" x="32" y="186">▸ DECIDES IT</text>
    <text class="mark plus" x="228" y="163">+</text>
    <text class="t-b" x="248" y="162">Fixes the failing cases</text>
    <text class="t-s" x="248" y="180">uses: [cap], the preset ctx, declared targets</text>
    <text class="mark minus" x="592" y="163">−</text>
    <text class="t-b" x="612" y="162">Fixes cases that already pass</text>
    <text class="t-s" x="612" y="180">an adopter with uses still casts</text>
  </g>

  <g id="row-1">
    <text class="t-lbl" x="32" y="216">ISSUES TOUCHED</text>
    <text class="mark minus" x="228" y="219">−</text>
    <text class="t-b" x="248" y="218">One more joins the epic</text>
    <text class="t-s" x="248" y="236">FIX-2091 moves from the backlog</text>
    <text class="mark plus" x="592" y="219">+</text>
    <text class="t-b" x="612" y="218">Scope as filed</text>
    <text class="t-s" x="612" y="236">FIX-2091 waits on its own</text>
    <line class="row" x1="16" y1="248" x2="924" y2="248"/>
  </g>

  <g id="row-2">
    <text class="t-lbl" x="32" y="274">THE CAST SWEEP</text>
    <text class="mark tie" x="228" y="277">=</text>
    <text class="t-b" x="248" y="276">196 casts go</text>
    <text class="t-s" x="248" y="294">the lint lands with it</text>
    <text class="mark tie" x="592" y="277">=</text>
    <text class="t-b" x="612" y="276">196 casts go</text>
    <text class="t-s" x="612" y="294">the same</text>
    <line class="row" x1="16" y1="306" x2="924" y2="306"/>
  </g>

  <g id="locks-in">
    <rect class="foot" x="16" y="328" width="446" height="74" rx="5"/>
    <text class="t-lbl" x="32" y="349">LOCKS IN</text>
    <text class="t-b" x="32" y="369">FIX-2091 closes with this issue</text>
    <text class="t-s" x="32" y="387">its five ts-expect-error lines go too</text>
  </g>

  <g id="flips-if">
    <rect class="foot" x="478" y="328" width="446" height="74" rx="5"/>
    <text class="t-lbl" x="494" y="349">FLIPS IF</text>
    <text class="t-b" x="494" y="369">A state-schema case fails elsewhere</text>
    <text class="t-s" x="494" y="387">say, on another TypeScript version</text>
  </g>
</svg>
