<svg viewBox="0 0 940 418" role="img" aria-label="D2, how a capability preset&#x27;s callback context is typed. Chosen: the BlockContext it receives at runtime, with the capability&#x27;s session state. Instead of: the loose shape intersected with BlockContext. It comes down to the first row: a typo in a preset callback is a compile error under the alias, and reads as any under the loose shape. The price is the second row: a test that builds a partial preset context by hand stops compiling. Third row: helpers accept it either way. Locks in: a stricter type for a published name, with a changeset. Flips if: adopters&#x27; presets read keys BlockContext does not declare."
     xmlns="http://www.w3.org/2000/svg">
  <style>
    :root { --surface:#FCFCFA; --surface-2:#E8E8E1; --ink:#191C21; --ink-2:#4C535B; --ink-3:#7A828B;
            --rule:#D5D4CB; --accent:#3E4E8C; --accent-soft:#E0E3F0; --code:#2C7C69; --code-soft:#DCEDE7;
            --gone:#A9544F; }
    @media (prefers-color-scheme: dark) {
      :root { --surface:#181C1F; --surface-2:#202528; --ink:#E6E8E5; --ink-2:#A4ACB1; --ink-3:#737B81;
              --rule:#2B3135; --accent:#8B9BD8; --accent-soft:#1B2140; --code:#5DBBA1; --code-soft:#14302A;
              --gone:#DE8A84; } }
    .bg     { fill:var(--surface); }
    .ask    { fill:var(--surface-2); }
    .chosen { fill:var(--code-soft); stroke:var(--code); stroke-width:1.6; }
    .lost   { fill:var(--surface); stroke:var(--rule); stroke-width:1.4; stroke-dasharray:5 4; }
    .decide { fill:var(--accent-soft); }
    .bar    { fill:var(--accent); }
    .row    { stroke:var(--rule); stroke-width:1; }
    .foot   { fill:var(--surface-2); }
    .t-lbl  { fill:var(--ink-3); font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:9.5px; letter-spacing:.1em; }
    .t-tag  { font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:9.5px; letter-spacing:.1em; font-weight:600; }
    .t-q    { fill:var(--ink); font-family:system-ui,-apple-system,sans-serif; font-weight:600; font-size:15px; }
    .t-h    { font-family:system-ui,-apple-system,sans-serif; font-weight:600; font-size:14px; }
    .t-b    { fill:var(--ink); font-family:system-ui,-apple-system,sans-serif; font-size:12.5px; }
    .t-s    { fill:var(--ink-2); font-family:system-ui,-apple-system,sans-serif; font-size:11px; }
    .mark   { font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:16px; font-weight:700; }
    .plus   { fill:var(--code); }
    .minus  { fill:var(--gone); }
    .tie    { fill:var(--ink-3); }
    .c-code { fill:var(--code); }
    .c-mute { fill:var(--ink-3); }
    .c-lost { fill:var(--ink-2); }
    .c-acc  { fill:var(--accent); }
  </style>
  <rect class="bg" x="0" y="0" width="940" height="418"/>

  <g id="the-call">
    <rect class="ask" x="16" y="14" width="908" height="48" rx="6"/>
    <text class="t-lbl" x="32" y="32">D2 · THE CALL</text>
    <text class="t-q" x="32" y="52">What type does a preset&#x27;s tools or context callback see for ctx?</text>
  </g>

  <g id="options">
    <rect class="chosen" x="212" y="76" width="348" height="46" rx="5"/>
    <text class="t-tag c-code" x="228" y="93">CHOSEN</text>
    <text class="t-h c-code" x="228" y="112">The BlockContext it receives</text>
    <rect class="lost" x="576" y="76" width="348" height="46" rx="5"/>
    <text class="t-tag c-mute" x="592" y="93">INSTEAD OF</text>
    <text class="t-h c-lost" x="592" y="112">Loose shape and BlockContext</text>
  </g>

  <g id="row-0">
    <rect class="decide" x="16" y="134" width="908" height="62" rx="4"/>
    <rect class="bar" x="16" y="134" width="4" height="62"/>
    <text class="t-lbl" x="32" y="156">A TYPO IN A</text>
    <text class="t-lbl" x="32" y="169">PRESET CALLBACK</text>
    <text class="t-tag c-acc" x="32" y="186">▸ DECIDES IT</text>
    <text class="mark plus" x="228" y="163">+</text>
    <text class="t-b" x="248" y="162">A compile error</text>
    <text class="t-s" x="248" y="180">ctx.sesion is not on BlockContext</text>
    <text class="mark minus" x="592" y="163">−</text>
    <text class="t-b" x="612" y="162">Reads as any</text>
    <text class="t-s" x="612" y="180">the index signature swallows it</text>
  </g>

  <g id="row-1">
    <text class="t-lbl" x="32" y="216">A HAND-BUILT</text>
    <text class="t-lbl" x="32" y="229">TEST CONTEXT</text>
    <text class="mark minus" x="228" y="219">−</text>
    <text class="t-b" x="248" y="218">Stops compiling</text>
    <text class="t-s" x="248" y="236">build it with the testing package</text>
    <text class="mark plus" x="592" y="219">+</text>
    <text class="t-b" x="612" y="218">Still compiles</text>
    <text class="t-s" x="612" y="236">a partial object passes</text>
    <line class="row" x1="16" y1="248" x2="924" y2="248"/>
  </g>

  <g id="row-2">
    <text class="t-lbl" x="32" y="274">A BLOCKCONTEXT</text>
    <text class="t-lbl" x="32" y="287">HELPER</text>
    <text class="mark tie" x="228" y="277">=</text>
    <text class="t-b" x="248" y="276">Accepts it</text>
    <text class="t-s" x="248" y="294">no cast</text>
    <text class="mark tie" x="592" y="277">=</text>
    <text class="t-b" x="612" y="276">Accepts it</text>
    <text class="t-s" x="612" y="294">no cast</text>
    <line class="row" x1="16" y1="306" x2="924" y2="306"/>
  </g>

  <g id="locks-in">
    <rect class="foot" x="16" y="328" width="446" height="74" rx="5"/>
    <text class="t-lbl" x="32" y="349">LOCKS IN</text>
    <text class="t-b" x="32" y="369">A stricter type on a published name</text>
    <text class="t-s" x="32" y="387">CapabilityPresetCtx, named in the changeset</text>
  </g>

  <g id="flips-if">
    <rect class="foot" x="478" y="328" width="446" height="74" rx="5"/>
    <text class="t-lbl" x="494" y="349">FLIPS IF</text>
    <text class="t-b" x="494" y="369">Adopter presets read undeclared keys</text>
    <text class="t-s" x="494" y="387">then keep the index for one minor</text>
  </g>
</svg>
