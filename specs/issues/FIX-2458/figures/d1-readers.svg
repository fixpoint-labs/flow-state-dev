<svg viewBox="0 0 940 422" role="img" aria-label="D1, how a host tells a stop, an unusable SDK and a bad config apart. Chosen: the readers core already has. Instead of: four new failure kinds. It comes down to one answer per question: isAbortLike, the readiness check and a build-time throw, where new kinds would be second answers that can differ. The price: from the thrown error alone an unusable SDK reads null, though its message names the remedy. A bad config is a tie, thrown when the block is built. Locks in: one failure kind, every stop abort-like, every readiness check reads the SDK version. Flips if a host meets an unusable SDK only as a thrown error."
     xmlns="http://www.w3.org/2000/svg">
  <style>
    :root { --surface:#FCFCFA; --surface-2:#E8E8E1; --ink:#191C21; --ink-2:#4C535B; --ink-3:#7A828B;
            --rule:#D5D4CB; --accent:#3E4E8C; --accent-soft:#E0E3F0; --code:#2C7C69; --code-soft:#DCEDE7;
            --gone:#A9544F; }
    @media (prefers-color-scheme: dark) {
      :root { --surface:#181C1F; --surface-2:#202528; --ink:#E6E8E5; --ink-2:#A4ACB1; --ink-3:#737B81;
              --rule:#2B3135; --accent:#8B9BD8; --accent-soft:#1B2140; --code:#5DBBA1; --code-soft:#14302A;
              --gone:#DE8A84; } }
    .bg     { fill:var(--surface); }
    .ask    { fill:var(--surface-2); }
    .chosen { fill:var(--code-soft); stroke:var(--code); stroke-width:1.6; }
    .lost   { fill:var(--surface); stroke:var(--rule); stroke-width:1.4; stroke-dasharray:5 4; }
    .decide { fill:var(--accent-soft); }
    .bar    { fill:var(--accent); }
    .row    { stroke:var(--rule); stroke-width:1; }
    .foot   { fill:var(--surface-2); }
    .t-lbl  { fill:var(--ink-3); font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:9.5px; letter-spacing:.1em; }
    .t-tag  { font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:9.5px; letter-spacing:.1em; font-weight:600; }
    .t-q    { fill:var(--ink); font-family:system-ui,-apple-system,sans-serif; font-weight:600; font-size:15px; }
    .t-h    { font-family:system-ui,-apple-system,sans-serif; font-weight:600; font-size:14px; }
    .t-b    { fill:var(--ink); font-family:system-ui,-apple-system,sans-serif; font-size:12.5px; }
    .t-s    { fill:var(--ink-2); font-family:system-ui,-apple-system,sans-serif; font-size:11px; }
    .mark   { font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:16px; font-weight:700; }
    .plus   { fill:var(--code); }
    .minus  { fill:var(--gone); }
    .tie    { fill:var(--ink-3); }
    .c-code { fill:var(--code); }
    .c-mute { fill:var(--ink-3); }
    .c-lost { fill:var(--ink-2); }
    .c-acc  { fill:var(--accent); }
    .rec    { fill:var(--code-soft); stroke:var(--code); stroke-width:1.6; }
  </style>
  <rect class="bg" x="0" y="0" width="940" height="422"/>
  <g id="the-call">
    <rect class="ask" x="16" y="14" width="908" height="48" rx="6"/>
    <text class="t-lbl" x="32" y="32">D1 · THE CALL</text>
    <text class="t-q" x="32" y="52">How does a host tell a stop, an unusable SDK and a bad config apart?</text>
  </g>
  <g id="options">
    <rect class="chosen" x="212" y="76" width="348" height="46" rx="5"/>
    <text class="t-tag c-code" x="228" y="93">CHOSEN</text>
    <text class="t-h c-code" x="228" y="112">The readers core already has</text>
    <rect class="lost" x="576" y="76" width="348" height="46" rx="5"/>
    <text class="t-tag c-mute" x="592" y="93">INSTEAD OF</text>
    <text class="t-h c-lost" x="592" y="112">Four new failure kinds</text>
  </g>
  <g id="row-0">
    <rect class="decide" x="16" y="134" width="908" height="62" rx="4"/>
    <rect class="bar" x="16" y="134" width="4" height="62"/>
    <text class="t-lbl" x="32" y="156">ONE ANSWER</text>
    <text class="t-lbl" x="32" y="169">PER QUESTION</text>
    <text class="t-tag c-acc" x="32" y="186">▸ DECIDES IT</text>
    <text class="mark plus" x="228" y="162">+</text>
    <text class="t-b" x="248" y="161">One reader each</text>
    <text class="t-s" x="248" y="179">isAbortLike · the readiness check · a build-time throw</text>
    <text class="mark minus" x="592" y="162">−</text>
    <text class="t-b" x="612" y="161">Two answers that can differ</text>
    <text class="t-s" x="612" y="179">a kind beside isAbortLike and beside readiness</text>
  </g>
  <g id="row-1">
    <text class="t-lbl" x="32" y="222">ONLY THE</text>
    <text class="t-lbl" x="32" y="235">THROWN ERROR</text>
    <text class="mark minus" x="228" y="228">−</text>
    <text class="t-b" x="248" y="227">An unusable SDK reads null</text>
    <text class="t-s" x="248" y="245">its message names the remedy</text>
    <text class="mark plus" x="592" y="228">+</text>
    <text class="t-b" x="612" y="227">Classified on the error</text>
    <text class="t-s" x="612" y="245">sdk-not-installed, sdk-version-mismatch</text>
    <line class="row" x1="16" y1="258" x2="924" y2="258"/>
  </g>
  <g id="row-2">
    <text class="t-lbl" x="32" y="280">A BAD CONFIG</text>
    <text class="mark tie" x="228" y="286">=</text>
    <text class="t-b" x="248" y="285">Thrown when the block is built</text>
    <text class="t-s" x="248" y="303">before any host can branch</text>
    <text class="mark tie" x="592" y="286">=</text>
    <text class="t-b" x="612" y="285">The same throw</text>
    <text class="t-s" x="612" y="303">with a kind nobody reads</text>
    <line class="row" x1="16" y1="316" x2="924" y2="316"/>
  </g>
  <g id="locks-in">
    <rect class="foot" x="16" y="332" width="446" height="74" rx="5"/>
    <text class="t-lbl" x="32" y="353">LOCKS IN</text>
    <text class="t-b" x="32" y="373">One failure kind; every stop is abort-like</text>
    <text class="t-s" x="32" y="391">every readiness check reads the SDK version</text>
  </g>
  <g id="flips-if">
    <rect class="foot" x="478" y="332" width="446" height="74" rx="5"/>
    <text class="t-lbl" x="494" y="353">FLIPS IF</text>
    <text class="t-b" x="494" y="373">A host meets an unusable SDK only as a throw</text>
    <text class="t-s" x="494" y="391">then sdk-not-installed earns its kind</text>
  </g>
</svg>
