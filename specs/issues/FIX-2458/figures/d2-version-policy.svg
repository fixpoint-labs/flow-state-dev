<svg viewBox="0 0 940 422" role="img" aria-label="D2, which versions of its vendor SDK a harness runs against. Chosen: the tested range. Instead of: an exact pin for all three, or any version for all three. It comes down to keeping a gate and a release cadence: the range refuses an untested SDK and lets tested patches run; an exact pin keeps the gate but needs a claude-code release for every SDK patch; any version keeps the cadence but an untested wire gives malformed items. The price: each new span is a release once it is tested; an exact pin needs one per version, and claude-code was measured on 0.3.234 while Kitchen Sink runs 0.3.316 and up. Codex and Cursor are unchanged under the range or the pin and lose their gate under any version. Locks in: the peer range is what was tested, and one gate in core, called by all three, refuses an untested SDK when the block is built. Flips if a vendor changes its wire inside a patch: then that range is one version wide."
     xmlns="http://www.w3.org/2000/svg">
  <style>
    :root { --surface:#FCFCFA; --surface-2:#E8E8E1; --ink:#191C21; --ink-2:#4C535B; --ink-3:#7A828B;
            --rule:#D5D4CB; --accent:#3E4E8C; --accent-soft:#E0E3F0; --code:#2C7C69; --code-soft:#DCEDE7;
            --gone:#A9544F; }
    @media (prefers-color-scheme: dark) {
      :root { --surface:#181C1F; --surface-2:#202528; --ink:#E6E8E5; --ink-2:#A4ACB1; --ink-3:#737B81;
              --rule:#2B3135; --accent:#8B9BD8; --accent-soft:#1B2140; --code:#5DBBA1; --code-soft:#14302A;
              --gone:#DE8A84; } }
    .bg     { fill:var(--surface); }
    .ask    { fill:var(--surface-2); }
    .chosen { fill:var(--code-soft); stroke:var(--code); stroke-width:1.6; }
    .lost   { fill:var(--surface); stroke:var(--rule); stroke-width:1.4; stroke-dasharray:5 4; }
    .decide { fill:var(--accent-soft); }
    .bar    { fill:var(--accent); }
    .row    { stroke:var(--rule); stroke-width:1; }
    .foot   { fill:var(--surface-2); }
    .t-lbl  { fill:var(--ink-3); font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:9.5px; letter-spacing:.1em; }
    .t-tag  { font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:9.5px; letter-spacing:.1em; font-weight:600; }
    .t-q    { fill:var(--ink); font-family:system-ui,-apple-system,sans-serif; font-weight:600; font-size:15px; }
    .t-h    { font-family:system-ui,-apple-system,sans-serif; font-weight:600; font-size:14px; }
    .t-b    { fill:var(--ink); font-family:system-ui,-apple-system,sans-serif; font-size:12.5px; }
    .t-s    { fill:var(--ink-2); font-family:system-ui,-apple-system,sans-serif; font-size:11px; }
    .mark   { font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:16px; font-weight:700; }
    .plus   { fill:var(--code); }
    .minus  { fill:var(--gone); }
    .tie    { fill:var(--ink-3); }
    .c-code { fill:var(--code); }
    .c-mute { fill:var(--ink-3); }
    .c-lost { fill:var(--ink-2); }
    .c-acc  { fill:var(--accent); }
    .rec    { fill:var(--code-soft); stroke:var(--code); stroke-width:1.6; }
  </style>
  <rect class="bg" x="0" y="0" width="940" height="422"/>
  <g id="the-call">
    <rect class="ask" x="16" y="14" width="908" height="48" rx="6"/>
    <text class="t-lbl" x="32" y="32">D2 · THE CALL</text>
    <text class="t-q" x="32" y="52">Which versions of its vendor SDK does a harness run against?</text>
  </g>
  <g id="options">
    <rect class="chosen" x="212" y="76" width="224" height="46" rx="5"/>
    <text class="t-tag c-code" x="228" y="93">CHOSEN</text>
    <text class="t-h c-code" x="228" y="112">The tested range</text>
    <rect class="lost" x="452" y="76" width="224" height="46" rx="5"/>
    <text class="t-tag c-mute" x="468" y="93">INSTEAD OF</text>
    <text class="t-h c-lost" x="468" y="112">An exact pin, all three</text>
    <rect class="lost" x="692" y="76" width="224" height="46" rx="5"/>
    <text class="t-tag c-mute" x="708" y="93">INSTEAD OF</text>
    <text class="t-h c-lost" x="708" y="112">Any version, all three</text>
  </g>
  <g id="row-0">
    <rect class="decide" x="16" y="134" width="908" height="62" rx="4"/>
    <rect class="bar" x="16" y="134" width="4" height="62"/>
    <text class="t-lbl" x="32" y="156">A GATE AND</text>
    <text class="t-lbl" x="32" y="169">A CADENCE</text>
    <text class="t-tag c-acc" x="32" y="186">▸ DECIDES IT</text>
    <text class="mark plus" x="228" y="162">+</text>
    <text class="t-b" x="248" y="161">Both</text>
    <text class="t-s" x="248" y="179">untested refused · tested patches run</text>
    <text class="mark minus" x="468" y="162">−</text>
    <text class="t-b" x="488" y="161">A gate only</text>
    <text class="t-s" x="488" y="179">a claude-code release per SDK patch</text>
    <text class="mark minus" x="708" y="162">−</text>
    <text class="t-b" x="728" y="161">A cadence only</text>
    <text class="t-s" x="728" y="179">untested wires give bad items</text>
  </g>
  <g id="row-1">
    <text class="t-lbl" x="32" y="222">WIDENING</text>
    <text class="mark minus" x="228" y="228">−</text>
    <text class="t-b" x="248" y="227">A release per new span</text>
    <text class="t-s" x="248" y="245">after it is tested</text>
    <text class="mark minus" x="468" y="228">−</text>
    <text class="t-b" x="488" y="227">A release per version</text>
    <text class="t-s" x="488" y="245">Claude: 0.3.234 vs ^0.3.316</text>
    <text class="mark plus" x="708" y="228">+</text>
    <text class="t-b" x="728" y="227">Nothing to release</text>
    <text class="t-s" x="728" y="245">nothing checked either</text>
    <line class="row" x1="16" y1="258" x2="924" y2="258"/>
  </g>
  <g id="row-2">
    <text class="t-lbl" x="32" y="280">CODEX AND</text>
    <text class="t-lbl" x="32" y="293">CURSOR</text>
    <text class="mark tie" x="228" y="286">=</text>
    <text class="t-b" x="248" y="285">Unchanged</text>
    <text class="t-s" x="248" y="303">a range one version wide</text>
    <text class="mark tie" x="468" y="286">=</text>
    <text class="t-b" x="488" y="285">Unchanged</text>
    <text class="t-s" x="488" y="303">as today</text>
    <text class="mark minus" x="708" y="286">−</text>
    <text class="t-b" x="728" y="285">Lose their gate</text>
    <text class="t-s" x="728" y="303">today they refuse</text>
    <line class="row" x1="16" y1="316" x2="924" y2="316"/>
  </g>
  <g id="locks-in">
    <rect class="foot" x="16" y="332" width="446" height="74" rx="5"/>
    <text class="t-lbl" x="32" y="353">LOCKS IN</text>
    <text class="t-b" x="32" y="373">The peer range is what was tested</text>
    <text class="t-s" x="32" y="391">one gate in core refuses an untested SDK when built, for all three</text>
  </g>
  <g id="flips-if">
    <rect class="foot" x="478" y="332" width="446" height="74" rx="5"/>
    <text class="t-lbl" x="494" y="353">FLIPS IF</text>
    <text class="t-b" x="494" y="373">A vendor changes its wire inside a patch</text>
    <text class="t-s" x="494" y="391">then that harness range is one version wide</text>
  </g>
</svg>
