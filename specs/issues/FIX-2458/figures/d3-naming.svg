<svg viewBox="0 0 940 422" role="img" aria-label="D3, what a harness function or type is called. Chosen: its package name, with shared shapes once in core. Instead of: the same name in every harness. It comes down to two harnesses in one app: package names never collide and the 8 collisions of today go too, while the same name in every harness collides and needs an alias at each import. The price: claude-code renames about 30 names, with old names reaching adopters per ER-3 and Q1, which the other option would also do. Switching harness means changing the function name, where shared names change only the import. Locks in: ClaudeCode names and one root entry for claude-code; HarnessModelInfo, HarnessModelList and HARNESS_BASE_PASS in core. Flips if no app installs two harnesses."
     xmlns="http://www.w3.org/2000/svg">
  <style>
    :root { --surface:#FCFCFA; --surface-2:#E8E8E1; --ink:#191C21; --ink-2:#4C535B; --ink-3:#7A828B;
            --rule:#D5D4CB; --accent:#3E4E8C; --accent-soft:#E0E3F0; --code:#2C7C69; --code-soft:#DCEDE7;
            --gone:#A9544F; }
    @media (prefers-color-scheme: dark) {
      :root { --surface:#181C1F; --surface-2:#202528; --ink:#E6E8E5; --ink-2:#A4ACB1; --ink-3:#737B81;
              --rule:#2B3135; --accent:#8B9BD8; --accent-soft:#1B2140; --code:#5DBBA1; --code-soft:#14302A;
              --gone:#DE8A84; } }
    .bg     { fill:var(--surface); }
    .ask    { fill:var(--surface-2); }
    .chosen { fill:var(--code-soft); stroke:var(--code); stroke-width:1.6; }
    .lost   { fill:var(--surface); stroke:var(--rule); stroke-width:1.4; stroke-dasharray:5 4; }
    .decide { fill:var(--accent-soft); }
    .bar    { fill:var(--accent); }
    .row    { stroke:var(--rule); stroke-width:1; }
    .foot   { fill:var(--surface-2); }
    .t-lbl  { fill:var(--ink-3); font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:9.5px; letter-spacing:.1em; }
    .t-tag  { font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:9.5px; letter-spacing:.1em; font-weight:600; }
    .t-q    { fill:var(--ink); font-family:system-ui,-apple-system,sans-serif; font-weight:600; font-size:15px; }
    .t-h    { font-family:system-ui,-apple-system,sans-serif; font-weight:600; font-size:14px; }
    .t-b    { fill:var(--ink); font-family:system-ui,-apple-system,sans-serif; font-size:12.5px; }
    .t-s    { fill:var(--ink-2); font-family:system-ui,-apple-system,sans-serif; font-size:11px; }
    .mark   { font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:16px; font-weight:700; }
    .plus   { fill:var(--code); }
    .minus  { fill:var(--gone); }
    .tie    { fill:var(--ink-3); }
    .c-code { fill:var(--code); }
    .c-mute { fill:var(--ink-3); }
    .c-lost { fill:var(--ink-2); }
    .c-acc  { fill:var(--accent); }
    .rec    { fill:var(--code-soft); stroke:var(--code); stroke-width:1.6; }
  </style>
  <rect class="bg" x="0" y="0" width="940" height="422"/>
  <g id="the-call">
    <rect class="ask" x="16" y="14" width="908" height="48" rx="6"/>
    <text class="t-lbl" x="32" y="32">D3 · THE CALL</text>
    <text class="t-q" x="32" y="52">What is a harness function or type called?</text>
  </g>
  <g id="options">
    <rect class="chosen" x="212" y="76" width="348" height="46" rx="5"/>
    <text class="t-tag c-code" x="228" y="93">CHOSEN</text>
    <text class="t-h c-code" x="228" y="112">Its package name; shared shapes in core</text>
    <rect class="lost" x="576" y="76" width="348" height="46" rx="5"/>
    <text class="t-tag c-mute" x="592" y="93">INSTEAD OF</text>
    <text class="t-h c-lost" x="592" y="112">The same name in every harness</text>
  </g>
  <g id="row-0">
    <rect class="decide" x="16" y="134" width="908" height="62" rx="4"/>
    <rect class="bar" x="16" y="134" width="4" height="62"/>
    <text class="t-lbl" x="32" y="156">TWO HARNESSES</text>
    <text class="t-lbl" x="32" y="169">IN ONE APP</text>
    <text class="t-tag c-acc" x="32" y="186">▸ DECIDES IT</text>
    <text class="mark plus" x="228" y="162">+</text>
    <text class="t-b" x="248" y="161">Nothing collides</text>
    <text class="t-s" x="248" y="179">the 8 collisions of today go too</text>
    <text class="mark minus" x="592" y="162">−</text>
    <text class="t-b" x="612" y="161">Every shared name collides</text>
    <text class="t-s" x="612" y="179">an alias at each import</text>
  </g>
  <g id="row-1">
    <text class="t-lbl" x="32" y="222">CLAUDE-CODE</text>
    <text class="mark minus" x="228" y="228">−</text>
    <text class="t-b" x="248" y="227">About 30 names renamed</text>
    <text class="t-s" x="248" y="245">old names per ER-3 and Q1</text>
    <text class="mark minus" x="592" y="228">−</text>
    <text class="t-b" x="612" y="227">Renamed too</text>
    <text class="t-s" x="612" y="245">to the shared names instead</text>
    <line class="row" x1="16" y1="258" x2="924" y2="258"/>
  </g>
  <g id="row-2">
    <text class="t-lbl" x="32" y="280">SWITCHING</text>
    <text class="t-lbl" x="32" y="293">HARNESS</text>
    <text class="mark minus" x="228" y="286">−</text>
    <text class="t-b" x="248" y="285">Change the function name</text>
    <text class="t-s" x="248" y="303">listCodexModels to listCursorModels</text>
    <text class="mark plus" x="592" y="286">+</text>
    <text class="t-b" x="612" y="285">Change only the import</text>
    <text class="t-s" x="612" y="303">listModels from another package</text>
    <line class="row" x1="16" y1="316" x2="924" y2="316"/>
  </g>
  <g id="locks-in">
    <rect class="foot" x="16" y="332" width="446" height="74" rx="5"/>
    <text class="t-lbl" x="32" y="353">LOCKS IN</text>
    <text class="t-b" x="32" y="373">ClaudeCode names, one root entry</text>
    <text class="t-s" x="32" y="391">HarnessModelInfo, HarnessModelList, HARNESS_BASE_PASS</text>
  </g>
  <g id="flips-if">
    <rect class="foot" x="478" y="332" width="446" height="74" rx="5"/>
    <text class="t-lbl" x="494" y="353">FLIPS IF</text>
    <text class="t-b" x="494" y="373">No app installs two harnesses</text>
    <text class="t-s" x="494" y="391">then one shared name per job is simpler</text>
  </g>
</svg>
