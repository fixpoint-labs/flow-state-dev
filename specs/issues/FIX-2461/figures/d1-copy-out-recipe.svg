<svg viewBox="0 0 940 418" role="img" aria-label="D1, how an example copied out of the repo gets real package versions. Chosen: keep workspace:* in the repo and give the copy-out recipe one step that rewrites it to the published versions. Instead of: published version ranges that pnpm links to the workspace. It comes down to the first row: with workspace:* an example in the repo always runs against today&#x27;s source, while a range silently switches to npm once it stops matching after a release. The price is the second row: one extra step when copying out. Third row: nothing to bump at release, where ranges need every example bumped. Locks in: the copy-out recipe in examples/README.md is the one way out, and the goal check runs it verbatim. Flips if the examples move to their own repository."
     xmlns="http://www.w3.org/2000/svg">
  <style>
    :root { --surface:#FCFCFA; --surface-2:#E8E8E1; --ink:#191C21; --ink-2:#4C535B; --ink-3:#7A828B;
            --rule:#D5D4CB; --accent:#3E4E8C; --accent-soft:#E0E3F0; --code:#2C7C69; --code-soft:#DCEDE7;
            --gone:#A9544F; }
    @media (prefers-color-scheme: dark) {
      :root { --surface:#181C1F; --surface-2:#202528; --ink:#E6E8E5; --ink-2:#A4ACB1; --ink-3:#737B81;
              --rule:#2B3135; --accent:#8B9BD8; --accent-soft:#1B2140; --code:#5DBBA1; --code-soft:#14302A;
              --gone:#DE8A84; } }
    .bg     { fill:var(--surface); }
    .ask    { fill:var(--surface-2); }
    .chosen { fill:var(--code-soft); stroke:var(--code); stroke-width:1.6; }
    .rec    { fill:var(--code-soft); stroke:var(--code); stroke-width:1.6; stroke-dasharray:5 4; }
    .lost   { fill:var(--surface); stroke:var(--rule); stroke-width:1.4; stroke-dasharray:5 4; }
    .decide { fill:var(--accent-soft); }
    .bar    { fill:var(--accent); }
    .row    { stroke:var(--rule); stroke-width:1; }
    .foot   { fill:var(--surface-2); }
    .t-lbl  { fill:var(--ink-3); font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:9.5px; letter-spacing:.1em; }
    .t-tag  { font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:9.5px; letter-spacing:.1em; font-weight:600; }
    .t-q    { fill:var(--ink); font-family:system-ui,-apple-system,sans-serif; font-weight:600; font-size:15px; }
    .t-h    { font-family:system-ui,-apple-system,sans-serif; font-weight:600; font-size:14px; }
    .t-b    { fill:var(--ink); font-family:system-ui,-apple-system,sans-serif; font-size:12.5px; }
    .t-s    { fill:var(--ink-2); font-family:system-ui,-apple-system,sans-serif; font-size:11px; }
    .mark   { font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:16px; font-weight:700; }
    .plus   { fill:var(--code); }
    .minus  { fill:var(--gone); }
    .tie    { fill:var(--ink-3); }
    .c-code { fill:var(--code); }
    .c-mute { fill:var(--ink-3); }
    .c-lost { fill:var(--ink-2); }
    .c-acc  { fill:var(--accent); }
  </style>

  <rect class="bg" x="0" y="0" width="940" height="418"/>

  <g id="the-call">
    <rect class="ask" x="16" y="14" width="908" height="48" rx="6"/>
    <text class="t-lbl" x="32" y="32">D1 · THE CALL</text>
    <text class="t-q" x="32" y="52">How does an example copied out of the repo get real package versions?</text>
  </g>

  <g id="options">
    <rect class="chosen" x="212" y="76" width="348" height="46" rx="5"/>
    <text class="t-tag c-code" x="228" y="93">CHOSEN</text>
    <text class="t-h c-code" x="228" y="112">workspace:* here, one rewrite step out</text>
    <rect class="lost" x="576" y="76" width="348" height="46" rx="5"/>
    <text class="t-tag c-mute" x="592" y="93">INSTEAD OF</text>
    <text class="t-h c-lost" x="592" y="112">Published ranges, linked to the workspace</text>
  </g>

  <g id="row-0">
    <rect class="decide" x="16" y="134" width="908" height="62" rx="4"/>
    <rect class="bar" x="16" y="134" width="4" height="62"/>
    <text class="t-lbl" x="32" y="156">IN THE REPO, AN</text>
    <text class="t-lbl" x="32" y="169">EXAMPLE RUNS ON</text>
    <text class="t-tag c-acc" x="32" y="186">▸ DECIDES IT</text>
    <text class="mark plus" x="228" y="163">+</text>
    <text class="t-b" x="248" y="162">Today&#x27;s source, always</text>
    <text class="t-s" x="248" y="180">workspace:* resolves nowhere else</text>
    <text class="mark minus" x="592" y="163">−</text>
    <text class="t-b" x="612" y="162">npm, once a range stops matching</text>
    <text class="t-s" x="612" y="180">silently, after the next minor</text>
  </g>

  <g id="row-1">
    <text class="t-lbl" x="32" y="218">COPYING IT OUT</text>
    <text class="mark minus" x="228" y="221">−</text>
    <text class="t-b" x="248" y="220">One extra step</text>
    <text class="t-s" x="248" y="238">the recipe rewrites workspace:* to latest</text>
    <text class="mark plus" x="592" y="221">+</text>
    <text class="t-b" x="612" y="220">npm install, as it is</text>
    <text class="t-s" x="612" y="238">no step to follow</text>
    <line class="row" x1="16" y1="252" x2="924" y2="252"/>
  </g>

  <g id="row-2">
    <text class="t-lbl" x="32" y="276">A RELEASE</text>
    <text class="mark plus" x="228" y="279">+</text>
    <text class="t-b" x="248" y="278">Nothing to bump</text>
    <text class="t-s" x="248" y="296">examples are private</text>
    <text class="mark minus" x="592" y="279">−</text>
    <text class="t-b" x="612" y="278">Every example range bumped</text>
    <text class="t-s" x="612" y="296">core is 0.4.0, orchestration 0.5.0</text>
    <line class="row" x1="16" y1="310" x2="924" y2="310"/>
  </g>

  <g id="locks-in">
    <rect class="foot" x="16" y="328" width="446" height="74" rx="5"/>
    <text class="t-lbl" x="32" y="349">LOCKS IN</text>
    <text class="t-b" x="32" y="369">The copy-out recipe is the one way out</text>
    <text class="t-s" x="32" y="387">examples/README.md carries it; the goal check runs it verbatim</text>
  </g>
  <g id="flips-if">
    <rect class="foot" x="478" y="328" width="446" height="74" rx="5"/>
    <text class="t-lbl" x="494" y="349">FLIPS IF</text>
    <text class="t-b" x="494" y="369">The examples move to their own repository</text>
    <text class="t-s" x="494" y="387">then published ranges are the only shape that works</text>
  </g>
</svg>
