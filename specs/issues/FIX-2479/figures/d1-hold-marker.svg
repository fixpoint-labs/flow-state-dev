<svg viewBox="0 0 940 418" role="img" aria-label="D1, what a question held on a task is stored as. Chosen: new holds are written with source kind task, and a stored row still reads. Instead of: keeping row as the stored value and renaming only the types, or ask. It comes down to the first row: every Inbox client branches on this value to choose how to answer, so it is a word every consumer reads; row is the store word the epic retires, and ask fits both kinds of hold, since a suspended run&#x27;s approval is a question to a person too; task names where the hold lives, beside suspension. The cost: a dual read at the parse boundary, kept while stores hold old holds, and a client built on the old value must update. Locks in task as a public wire value. Flips if no client outside the repository reads the hold source."
     xmlns="http://www.w3.org/2000/svg">
  <style>
    :root { --surface:#FCFCFA; --surface-2:#E8E8E1; --ink:#191C21; --ink-2:#4C535B; --ink-3:#7A828B;
            --rule:#D5D4CB; --accent:#3E4E8C; --accent-soft:#E0E3F0; --code:#2C7C69; --code-soft:#DCEDE7;
            --prose:#A8761C; --prose-soft:#F3E8D2; --gone:#A9544F; --gone-soft:#F2E1DF; }
    @media (prefers-color-scheme: dark) {
      :root { --surface:#181C1F; --surface-2:#202528; --ink:#E6E8E5; --ink-2:#A4ACB1; --ink-3:#737B81;
              --rule:#2B3135; --accent:#8B9BD8; --accent-soft:#1B2140; --code:#5DBBA1; --code-soft:#14302A;
              --prose:#D9A44B; --prose-soft:#332612; --gone:#DE8A84; --gone-soft:#3A1F1D; } }
    .bg     { fill:var(--surface); }
    .ask    { fill:var(--surface-2); }
    .chosen { fill:var(--code-soft); stroke:var(--code); stroke-width:1.6; }
    .lost   { fill:var(--surface); stroke:var(--rule); stroke-width:1.4; stroke-dasharray:5 4; }
    .decide { fill:var(--accent-soft); }
    .bar    { fill:var(--accent); }
    .row    { stroke:var(--rule); stroke-width:1; }
    .foot   { fill:var(--surface-2); }
    .box    { fill:var(--surface); stroke:var(--rule); stroke-width:1.2; }
    .keep   { fill:var(--surface-2); stroke:var(--rule); stroke-width:1.2; }
    .new    { fill:var(--code-soft); stroke:var(--code); stroke-width:1.6; }
    .gonebox{ fill:var(--gone-soft); stroke:var(--gone); stroke-width:1.2; stroke-dasharray:5 4; }
    .arrow  { stroke:var(--ink-3); stroke-width:1.3; fill:none; }
    .t-lbl  { fill:var(--ink-3); font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:9.5px; letter-spacing:.1em; }
    .t-tag  { font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:9.5px; letter-spacing:.1em; font-weight:600; }
    .t-q    { fill:var(--ink); font-family:system-ui,-apple-system,sans-serif; font-weight:600; font-size:15px; }
    .t-h    { font-family:system-ui,-apple-system,sans-serif; font-weight:600; font-size:14px; }
    .t-b    { fill:var(--ink); font-family:system-ui,-apple-system,sans-serif; font-size:12.5px; }
    .t-s    { fill:var(--ink-2); font-family:system-ui,-apple-system,sans-serif; font-size:11px; }
    .t-m    { fill:var(--ink); font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:11px; }
    .mark   { font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:16px; font-weight:700; }
    .plus   { fill:var(--code); }
    .minus  { fill:var(--gone); }
    .tie    { fill:var(--ink-3); }
    .c-code { fill:var(--code); }
    .c-mute { fill:var(--ink-3); }
    .c-lost { fill:var(--ink-2); }
    .c-acc  { fill:var(--accent); }
    .c-gone { fill:var(--gone); }
  </style>
  <rect class="bg" x="0" y="0" width="940" height="418"/>
  <g id="the-call">
    <rect class="ask" x="16" y="14" width="908" height="48" rx="6"/>
    <text class="t-lbl" x="32" y="32">D1 · THE CALL</text>
    <text class="t-q" x="32" y="52">What is a question held on a task stored as?</text>
  </g>
  <g id="options">
    <rect class="chosen" x="212" y="76" width="224" height="46" rx="5"/>
    <text class="t-tag c-code" x="228" y="93">CHOSEN</text>
    <text class="t-h c-code" x="228" y="112">&quot;task&quot;, and &quot;row&quot; still reads</text>
    <rect class="lost" x="452" y="76" width="224" height="46" rx="5"/>
    <text class="t-tag c-mute" x="468" y="93">INSTEAD OF</text>
    <text class="t-h c-lost" x="468" y="112">Keep &quot;row&quot; stored</text>
    <rect class="lost" x="692" y="76" width="224" height="46" rx="5"/>
    <text class="t-tag c-mute" x="708" y="93">INSTEAD OF</text>
    <text class="t-h c-lost" x="708" y="112">&quot;ask&quot;</text>
  </g>
  <g id="row-1">
    <rect class="decide" x="16" y="134" width="908" height="62" rx="4"/>
    <rect class="bar" x="16" y="134" width="4" height="62"/>
    <text class="t-lbl" x="32" y="156">SAYS WHICH</text>
    <text class="t-lbl" x="32" y="169">HOLD IT IS</text>
    <text class="t-tag c-acc" x="32" y="186">▸ DECIDES IT</text>
    <text class="mark plus" x="228" y="163">+</text>
    <text class="t-b" x="248" y="162">Where it lives</text>
    <text class="t-s" x="248" y="180">beside &quot;suspension&quot;</text>
    <text class="mark minus" x="468" y="163">−</text>
    <text class="t-b" x="488" y="162">A store word</text>
    <text class="t-s" x="488" y="180">the one the epic retires</text>
    <text class="mark minus" x="708" y="163">−</text>
    <text class="t-b" x="728" y="162">Both holds are asks</text>
    <text class="t-s" x="728" y="180">an approval is one too</text>
  </g>
  <g id="row-2">
    <text class="t-lbl" x="32" y="218">STORED</text>
    <text class="t-lbl" x="32" y="231">DATA</text>
    <text class="mark minus" x="228" y="225">−</text>
    <text class="t-b" x="248" y="224">A dual read</text>
    <text class="t-s" x="248" y="242">kept while old holds exist</text>
    <text class="mark plus" x="468" y="225">+</text>
    <text class="t-b" x="488" y="224">No migration</text>
    <text class="t-s" x="488" y="242">types renamed only</text>
    <text class="mark minus" x="708" y="225">−</text>
    <text class="t-b" x="728" y="224">A dual read</text>
    <text class="t-s" x="728" y="242">the same</text>
    <line class="row" x1="16" y1="254" x2="924" y2="254"/>
  </g>
  <g id="row-3">
    <text class="t-lbl" x="32" y="276">CLIENTS</text>
    <text class="mark minus" x="228" y="283">−</text>
    <text class="t-b" x="248" y="282">Update on upgrade</text>
    <text class="t-s" x="248" y="300">the changeset says so</text>
    <text class="mark plus" x="468" y="283">+</text>
    <text class="t-b" x="488" y="282">Unchanged</text>
    <text class="t-s" x="488" y="300">but read a retired word</text>
    <text class="mark minus" x="708" y="283">−</text>
    <text class="t-b" x="728" y="282">Update on upgrade</text>
    <text class="t-s" x="728" y="300">the same</text>
    <line class="row" x1="16" y1="312" x2="924" y2="312"/>
  </g>
  <g id="locks-in">
    <rect class="foot" x="16" y="328" width="446" height="74" rx="5"/>
    <text class="t-lbl" x="32" y="349">LOCKS IN</text>
    <text class="t-b" x="32" y="369">&quot;task&quot; is a public value every Inbox client reads</text>
    <text class="t-s" x="32" y="387">&quot;row&quot; is read on input, never written</text>
  </g>
  <g id="flips-if">
    <rect class="foot" x="478" y="328" width="446" height="74" rx="5"/>
    <text class="t-lbl" x="494" y="349">FLIPS IF</text>
    <text class="t-b" x="494" y="369">No client outside the repository reads it</text>
    <text class="t-s" x="494" y="387">then the value is internal, and either works</text>
  </g>
</svg>
