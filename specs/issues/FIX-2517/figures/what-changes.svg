<svg viewBox="0 0 940 428" role="img" aria-label="FIX-2517, before and after, five rows. The action request: today input as JSON, a file riding inside it as base64; after, input plus attachments beside it, as references checked once against the limits. The client and React: today send and sendAction take input and a userMessage; after, both take attachments in the send options. The user line: today text only; after, text and one file part per file, whose data is an fsd-blob reference. The model call: today text only; after, text, image and file parts, the bytes from the one resolver. An action with no userMessage refuses files by name, before any block runs."
     xmlns="http://www.w3.org/2000/svg">
  <style>
    :root { --surface:#FCFCFA; --surface-2:#E8E8E1; --ink:#191C21; --ink-2:#4C535B; --ink-3:#7A828B;
            --rule:#D5D4CB; --accent:#3E4E8C; --accent-soft:#E0E3F0; --code:#2C7C69; --code-soft:#DCEDE7;
            --prose:#A8761C; --prose-soft:#F3E8D2; --gone:#A9544F; }
    @media (prefers-color-scheme: dark) {
      :root { --surface:#181C1F; --surface-2:#202528; --ink:#E6E8E5; --ink-2:#A4ACB1; --ink-3:#737B81;
              --rule:#2B3135; --accent:#8B9BD8; --accent-soft:#1B2140; --code:#5DBBA1; --code-soft:#14302A;
              --prose:#D9A44B; --prose-soft:#332612; --gone:#DE8A84; } }
    .bg     { fill:var(--surface); }
    .ask    { fill:var(--surface-2); }
    .head   { fill:var(--surface-2); }
    .chosen { fill:var(--code-soft); stroke:var(--code); stroke-width:1.6; }
    .lost   { fill:var(--surface); stroke:var(--rule); stroke-width:1.4; stroke-dasharray:5 4; }
    .old    { fill:var(--surface); stroke:var(--rule); stroke-width:1.2; }
    .new    { fill:var(--code-soft); stroke:var(--code); stroke-width:1.4; }
    .same   { fill:var(--surface); stroke:var(--rule); stroke-width:1.2; stroke-dasharray:4 3; }
    .decide { fill:var(--accent-soft); }
    .bar    { fill:var(--accent); }
    .row    { stroke:var(--rule); stroke-width:1; }
    .foot   { fill:var(--surface-2); }
    .t-lbl  { fill:var(--ink-3); font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:9.5px; letter-spacing:.1em; }
    .t-tag  { font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:9.5px; letter-spacing:.1em; font-weight:600; }
    .t-q    { fill:var(--ink); font-family:system-ui,-apple-system,sans-serif; font-weight:600; font-size:15px; }
    .t-h    { font-family:system-ui,-apple-system,sans-serif; font-weight:600; font-size:14px; }
    .t-b    { fill:var(--ink); font-family:system-ui,-apple-system,sans-serif; font-size:12.5px; }
    .t-bn   { fill:var(--code); font-family:system-ui,-apple-system,sans-serif; font-size:12.5px; font-weight:600; }
    .t-bg   { fill:var(--gone); font-family:system-ui,-apple-system,sans-serif; font-size:12.5px; }
    .t-s    { fill:var(--ink-2); font-family:system-ui,-apple-system,sans-serif; font-size:11px; }
    .mark   { font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:16px; font-weight:700; }
    .plus   { fill:var(--code); }
    .minus  { fill:var(--gone); }
    .tie    { fill:var(--ink-3); }
    .c-code { fill:var(--code); }
    .c-mute { fill:var(--ink-3); }
    .c-lost { fill:var(--ink-2); }
    .c-acc  { fill:var(--accent); }
  </style>
  <rect class="bg" x="0" y="0" width="940" height="428"/>
  <g id="columns">
    <rect class="head" x="16" y="14" width="908" height="28" rx="5"/>
    <text class="t-lbl" x="194" y="32">TODAY</text>
    <text class="t-lbl" x="572" y="32">AFTER</text>
  </g>
  <g id="row-0">
    <text class="t-lbl" x="24" y="76">THE ACTION</text>
    <text class="t-lbl" x="24" y="89">REQUEST</text>
    <rect class="old" x="180" y="56" width="366" height="60" rx="5"/>
    <text class="t-b" x="194" y="78">input, as JSON</text>
    <text class="t-s" x="194" y="96">a file has to ride inside it as base64</text>
    <rect class="new" x="558" y="56" width="366" height="60" rx="5"/>
    <text class="t-bn" x="572" y="78">input + attachments, beside it</text>
    <text class="t-s" x="572" y="96">references, checked once against the limits</text>
  </g>
  <g id="row-1">
    <text class="t-lbl" x="24" y="150">THE CLIENT</text>
    <text class="t-lbl" x="24" y="163">AND REACT</text>
    <rect class="old" x="180" y="130" width="366" height="60" rx="5"/>
    <text class="t-b" x="194" y="152">send(action, input)</text>
    <text class="t-s" x="194" y="170">sendAction(action, input, { userMessage })</text>
    <rect class="new" x="558" y="130" width="366" height="60" rx="5"/>
    <text class="t-bn" x="572" y="152">{ attachments } in the send options</text>
    <text class="t-s" x="572" y="170">flow.send and sendAction alike</text>
  </g>
  <g id="row-2">
    <text class="t-lbl" x="24" y="224">THE USER LINE</text>
    <rect class="old" x="180" y="204" width="366" height="60" rx="5"/>
    <text class="t-b" x="194" y="226">Text only</text>
    <text class="t-s" x="194" y="244">one output_text part</text>
    <rect class="new" x="558" y="204" width="366" height="60" rx="5"/>
    <text class="t-bn" x="572" y="226">Text and one file part per file</text>
    <text class="t-s" x="572" y="244">FileContent, data = fsd-blob:&lt;id&gt;</text>
  </g>
  <g id="row-3">
    <text class="t-lbl" x="24" y="298">THE MODEL CALL</text>
    <rect class="old" x="180" y="278" width="366" height="60" rx="5"/>
    <text class="t-b" x="194" y="300">Text only</text>
    <text class="t-s" x="194" y="318">itemToLLMMessages keeps output_text</text>
    <rect class="new" x="558" y="278" width="366" height="60" rx="5"/>
    <text class="t-bn" x="572" y="300">Text, image and file parts</text>
    <text class="t-s" x="572" y="318">bytes from the one resolver; D1 for history</text>
  </g>
  <g id="row-4">
    <text class="t-lbl" x="24" y="372">AN ACTION WITH</text>
    <text class="t-lbl" x="24" y="385">NO USERMESSAGE</text>
    <rect class="same" x="180" y="352" width="366" height="60" rx="5"/>
    <text class="t-s" x="194" y="374">nothing</text>
    <rect class="new" x="558" y="352" width="366" height="60" rx="5"/>
    <text class="t-bn" x="572" y="374">Refuses files by name</text>
    <text class="t-s" x="572" y="392">before any block runs</text>
  </g>
</svg>
