<svg viewBox="0 0 940 502" role="img" aria-label="FIX-2519, before and after, six rows. A harness run&#x27;s input: today a prompt; after, a prompt and optional attachments, as references. Claude Code: today a string prompt; after, image blocks on the user message over streaming input. Codex: today runStreamed with text only; after, text and local_image entries, the files in a per-turn folder removed after the turn. Cursor: today agent.send with text; after, send with base64 images. A type a harness can&#x27;t take: the turn is refused, naming the file and the harness. A task&#x27;s brief files: today never handed on; after, on every run of the task."
     xmlns="http://www.w3.org/2000/svg">
  <style>
    :root { --surface:#FCFCFA; --surface-2:#E8E8E1; --ink:#191C21; --ink-2:#4C535B; --ink-3:#7A828B;
            --rule:#D5D4CB; --accent:#3E4E8C; --accent-soft:#E0E3F0; --code:#2C7C69; --code-soft:#DCEDE7;
            --prose:#A8761C; --prose-soft:#F3E8D2; --gone:#A9544F; }
    @media (prefers-color-scheme: dark) {
      :root { --surface:#181C1F; --surface-2:#202528; --ink:#E6E8E5; --ink-2:#A4ACB1; --ink-3:#737B81;
              --rule:#2B3135; --accent:#8B9BD8; --accent-soft:#1B2140; --code:#5DBBA1; --code-soft:#14302A;
              --prose:#D9A44B; --prose-soft:#332612; --gone:#DE8A84; } }
    .bg     { fill:var(--surface); }
    .ask    { fill:var(--surface-2); }
    .head   { fill:var(--surface-2); }
    .chosen { fill:var(--code-soft); stroke:var(--code); stroke-width:1.6; }
    .lost   { fill:var(--surface); stroke:var(--rule); stroke-width:1.4; stroke-dasharray:5 4; }
    .old    { fill:var(--surface); stroke:var(--rule); stroke-width:1.2; }
    .new    { fill:var(--code-soft); stroke:var(--code); stroke-width:1.4; }
    .same   { fill:var(--surface); stroke:var(--rule); stroke-width:1.2; stroke-dasharray:4 3; }
    .decide { fill:var(--accent-soft); }
    .bar    { fill:var(--accent); }
    .row    { stroke:var(--rule); stroke-width:1; }
    .foot   { fill:var(--surface-2); }
    .t-lbl  { fill:var(--ink-3); font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:9.5px; letter-spacing:.1em; }
    .t-tag  { font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:9.5px; letter-spacing:.1em; font-weight:600; }
    .t-q    { fill:var(--ink); font-family:system-ui,-apple-system,sans-serif; font-weight:600; font-size:15px; }
    .t-h    { font-family:system-ui,-apple-system,sans-serif; font-weight:600; font-size:14px; }
    .t-b    { fill:var(--ink); font-family:system-ui,-apple-system,sans-serif; font-size:12.5px; }
    .t-bn   { fill:var(--code); font-family:system-ui,-apple-system,sans-serif; font-size:12.5px; font-weight:600; }
    .t-bg   { fill:var(--gone); font-family:system-ui,-apple-system,sans-serif; font-size:12.5px; }
    .t-s    { fill:var(--ink-2); font-family:system-ui,-apple-system,sans-serif; font-size:11px; }
    .mark   { font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:16px; font-weight:700; }
    .plus   { fill:var(--code); }
    .minus  { fill:var(--gone); }
    .tie    { fill:var(--ink-3); }
    .c-code { fill:var(--code); }
    .c-mute { fill:var(--ink-3); }
    .c-lost { fill:var(--ink-2); }
    .c-acc  { fill:var(--accent); }
  </style>
  <rect class="bg" x="0" y="0" width="940" height="502"/>
  <g id="columns">
    <rect class="head" x="16" y="14" width="908" height="28" rx="5"/>
    <text class="t-lbl" x="194" y="32">TODAY</text>
    <text class="t-lbl" x="572" y="32">AFTER</text>
  </g>
  <g id="row-0">
    <text class="t-lbl" x="24" y="76">A HARNESS RUN&#x27;S</text>
    <text class="t-lbl" x="24" y="89">INPUT</text>
    <rect class="old" x="180" y="56" width="366" height="60" rx="5"/>
    <text class="t-b" x="194" y="78">{ prompt }</text>
    <text class="t-s" x="194" y="96">HarnessRunInput, core/harness</text>
    <rect class="new" x="558" y="56" width="366" height="60" rx="5"/>
    <text class="t-bn" x="572" y="78">{ prompt, attachments? }</text>
    <text class="t-s" x="572" y="96">references, the request&#x27;s own</text>
  </g>
  <g id="row-1">
    <text class="t-lbl" x="24" y="150">CLAUDE CODE</text>
    <rect class="old" x="180" y="130" width="366" height="60" rx="5"/>
    <text class="t-b" x="194" y="152">A string prompt</text>
    <text class="t-s" x="194" y="170">query() over one user message</text>
    <rect class="new" x="558" y="130" width="366" height="60" rx="5"/>
    <text class="t-bn" x="572" y="152">Image blocks on the user message</text>
    <text class="t-s" x="572" y="170">streaming input; bytes from the resolver</text>
  </g>
  <g id="row-2">
    <text class="t-lbl" x="24" y="224">CODEX</text>
    <rect class="old" x="180" y="204" width="366" height="60" rx="5"/>
    <text class="t-b" x="194" y="226">runStreamed(thread, prompt)</text>
    <text class="t-s" x="194" y="244">text only</text>
    <rect class="new" x="558" y="204" width="366" height="60" rx="5"/>
    <text class="t-bn" x="572" y="226">Text and local_image entries</text>
    <text class="t-s" x="572" y="244">files in a per-turn folder, then removed, D1</text>
  </g>
  <g id="row-3">
    <text class="t-lbl" x="24" y="298">CURSOR</text>
    <rect class="old" x="180" y="278" width="366" height="60" rx="5"/>
    <text class="t-b" x="194" y="300">agent.send(prompt)</text>
    <text class="t-s" x="194" y="318">text only</text>
    <rect class="new" x="558" y="278" width="366" height="60" rx="5"/>
    <text class="t-bn" x="572" y="300">send with images</text>
    <text class="t-s" x="572" y="318">base64 with its mimeType</text>
  </g>
  <g id="row-4">
    <text class="t-lbl" x="24" y="372">A TYPE A</text>
    <text class="t-lbl" x="24" y="385">HARNESS CAN&#x27;T TAKE</text>
    <rect class="same" x="180" y="352" width="366" height="60" rx="5"/>
    <text class="t-s" x="194" y="374">nothing</text>
    <rect class="new" x="558" y="352" width="366" height="60" rx="5"/>
    <text class="t-bn" x="572" y="374">The turn is refused, named</text>
    <text class="t-s" x="572" y="392">the file and the harness, in the conversation</text>
  </g>
  <g id="row-5">
    <text class="t-lbl" x="24" y="446">A TASK&#x27;S</text>
    <text class="t-lbl" x="24" y="459">BRIEF FILES</text>
    <rect class="old" x="180" y="426" width="366" height="60" rx="5"/>
    <text class="t-b" x="194" y="448">Never handed on</text>
    <text class="t-s" x="194" y="466">the run gets the brief&#x27;s text</text>
    <rect class="new" x="558" y="426" width="366" height="60" rx="5"/>
    <text class="t-bn" x="572" y="448">On every run of the task</text>
    <text class="t-s" x="572" y="466">the board run passes them in</text>
  </g>
</svg>
