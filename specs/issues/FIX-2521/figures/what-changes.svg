<svg viewBox="0 0 940 354" role="img" aria-label="FIX-2521, before and after, four rows. Flow State chat: today a pasted image is lost on send because handleSubmit sends the text only; after, the plus button, paste, drop and previews, with attachments on sendAction. The Claude Code, Codex and Cursor pages: today the same silent loss; after, the same composer, with attachments on lines.send. My line in the conversation: today text; after, text, thumbnails and chips, live and after a reload. A draft on a session switch: today its text is kept; after, its text and files are kept."
     xmlns="http://www.w3.org/2000/svg">
  <style>
    :root { --surface:#FCFCFA; --surface-2:#E8E8E1; --ink:#191C21; --ink-2:#4C535B; --ink-3:#7A828B;
            --rule:#D5D4CB; --accent:#3E4E8C; --accent-soft:#E0E3F0; --code:#2C7C69; --code-soft:#DCEDE7;
            --prose:#A8761C; --prose-soft:#F3E8D2; --gone:#A9544F; }
    @media (prefers-color-scheme: dark) {
      :root { --surface:#181C1F; --surface-2:#202528; --ink:#E6E8E5; --ink-2:#A4ACB1; --ink-3:#737B81;
              --rule:#2B3135; --accent:#8B9BD8; --accent-soft:#1B2140; --code:#5DBBA1; --code-soft:#14302A;
              --prose:#D9A44B; --prose-soft:#332612; --gone:#DE8A84; } }
    .bg     { fill:var(--surface); }
    .ask    { fill:var(--surface-2); }
    .head   { fill:var(--surface-2); }
    .chosen { fill:var(--code-soft); stroke:var(--code); stroke-width:1.6; }
    .lost   { fill:var(--surface); stroke:var(--rule); stroke-width:1.4; stroke-dasharray:5 4; }
    .old    { fill:var(--surface); stroke:var(--rule); stroke-width:1.2; }
    .new    { fill:var(--code-soft); stroke:var(--code); stroke-width:1.4; }
    .same   { fill:var(--surface); stroke:var(--rule); stroke-width:1.2; stroke-dasharray:4 3; }
    .decide { fill:var(--accent-soft); }
    .bar    { fill:var(--accent); }
    .row    { stroke:var(--rule); stroke-width:1; }
    .foot   { fill:var(--surface-2); }
    .t-lbl  { fill:var(--ink-3); font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:9.5px; letter-spacing:.1em; }
    .t-tag  { font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:9.5px; letter-spacing:.1em; font-weight:600; }
    .t-q    { fill:var(--ink); font-family:system-ui,-apple-system,sans-serif; font-weight:600; font-size:15px; }
    .t-h    { font-family:system-ui,-apple-system,sans-serif; font-weight:600; font-size:14px; }
    .t-b    { fill:var(--ink); font-family:system-ui,-apple-system,sans-serif; font-size:12.5px; }
    .t-bn   { fill:var(--code); font-family:system-ui,-apple-system,sans-serif; font-size:12.5px; font-weight:600; }
    .t-bg   { fill:var(--gone); font-family:system-ui,-apple-system,sans-serif; font-size:12.5px; }
    .t-s    { fill:var(--ink-2); font-family:system-ui,-apple-system,sans-serif; font-size:11px; }
    .mark   { font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:16px; font-weight:700; }
    .plus   { fill:var(--code); }
    .minus  { fill:var(--gone); }
    .tie    { fill:var(--ink-3); }
    .c-code { fill:var(--code); }
    .c-mute { fill:var(--ink-3); }
    .c-lost { fill:var(--ink-2); }
    .c-acc  { fill:var(--accent); }
  </style>
  <rect class="bg" x="0" y="0" width="940" height="354"/>
  <g id="columns">
    <rect class="head" x="16" y="14" width="908" height="28" rx="5"/>
    <text class="t-lbl" x="194" y="32">TODAY</text>
    <text class="t-lbl" x="572" y="32">AFTER</text>
  </g>
  <g id="row-0">
    <text class="t-lbl" x="24" y="76">FLOW STATE</text>
    <text class="t-lbl" x="24" y="89">CHAT</text>
    <rect class="old" x="180" y="56" width="366" height="60" rx="5"/>
    <text class="t-bg" x="194" y="78">A pasted image is lost on send</text>
    <text class="t-s" x="194" y="96">handleSubmit sends msg.text only</text>
    <rect class="new" x="558" y="56" width="366" height="60" rx="5"/>
    <text class="t-bn" x="572" y="78">+, paste, drop, previews</text>
    <text class="t-s" x="572" y="96">sendAction(…, { attachments })</text>
  </g>
  <g id="row-1">
    <text class="t-lbl" x="24" y="150">THE CLAUDE CODE,</text>
    <text class="t-lbl" x="24" y="163">CODEX AND</text>
    <text class="t-lbl" x="24" y="176">CURSOR PAGES</text>
    <rect class="old" x="180" y="130" width="366" height="60" rx="5"/>
    <text class="t-bg" x="194" y="152">The same silent loss</text>
    <text class="t-s" x="194" y="170">lines.send(prompt)</text>
    <rect class="new" x="558" y="130" width="366" height="60" rx="5"/>
    <text class="t-bn" x="572" y="152">The same composer</text>
    <text class="t-s" x="572" y="170">lines.send(prompt, { attachments })</text>
  </g>
  <g id="row-2">
    <text class="t-lbl" x="24" y="224">MY LINE IN THE</text>
    <text class="t-lbl" x="24" y="237">CONVERSATION</text>
    <rect class="old" x="180" y="204" width="366" height="60" rx="5"/>
    <text class="t-b" x="194" y="226">Text</text>
    <text class="t-s" x="194" y="244">components/flow-state/message.tsx</text>
    <rect class="new" x="558" y="204" width="366" height="60" rx="5"/>
    <text class="t-bn" x="572" y="226">Text, thumbnails and chips</text>
    <text class="t-s" x="572" y="244">live and after a reload</text>
  </g>
  <g id="row-3">
    <text class="t-lbl" x="24" y="298">A DRAFT ON A</text>
    <text class="t-lbl" x="24" y="311">SESSION SWITCH</text>
    <rect class="old" x="180" y="278" width="366" height="60" rx="5"/>
    <text class="t-b" x="194" y="300">Its text is kept</text>
    <text class="t-s" x="194" y="318">the stored draft</text>
    <rect class="new" x="558" y="278" width="366" height="60" rx="5"/>
    <text class="t-bn" x="572" y="300">Its text and files are kept</text>
    <text class="t-s" x="572" y="318">FIX-2518&#x27;s draft rule</text>
  </g>
</svg>
