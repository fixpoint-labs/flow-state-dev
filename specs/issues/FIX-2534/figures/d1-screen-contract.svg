<svg viewBox="0 0 940 430" role="img" aria-label="D1: what can an app say about which events a session hears, without writing code? Chosen: five fixed screen kinds. Instead of: a predicate language over event fields. It comes down to the first row, what the kill line&#x27;s share measures: with five kinds it measures what the screens decide, because a sentence fills labels, words and allow lists; with a language it measures how clever the model was. The price is the second row: an interest the five kinds can&#x27;t say needs a custom screen, in code. The third row: custom screens and Jev answer in one verdict shape, where a language is an evaluator to keep safe. Locks in five public kind names and one verdict shape. Flips if the share is under half with five kinds and over half with a language on the same subscriptions."
     xmlns="http://www.w3.org/2000/svg">
  <style>
    :root { --surface:#FCFCFA; --surface-2:#E8E8E1; --ink:#191C21; --ink-2:#4C535B; --ink-3:#7A828B;
            --rule:#D5D4CB; --accent:#3E4E8C; --accent-soft:#E0E3F0; --code:#2C7C69; --code-soft:#DCEDE7;
            --gone:#A9544F; }
    @media (prefers-color-scheme: dark) {
      :root { --surface:#181C1F; --surface-2:#202528; --ink:#E6E8E5; --ink-2:#A4ACB1; --ink-3:#737B81;
              --rule:#2B3135; --accent:#8B9BD8; --accent-soft:#1B2140; --code:#5DBBA1; --code-soft:#14302A;
              --gone:#DE8A84; } }
    .bg     { fill:var(--surface); }
    .ask    { fill:var(--surface-2); }
    .chosen { fill:var(--code-soft); stroke:var(--code); stroke-width:1.6; }
    .lost   { fill:var(--surface); stroke:var(--rule); stroke-width:1.4; stroke-dasharray:5 4; }
    .decide { fill:var(--accent-soft); }
    .bar    { fill:var(--accent); }
    .row    { stroke:var(--rule); stroke-width:1; }
    .foot   { fill:var(--surface-2); }
    .t-lbl  { fill:var(--ink-3); font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:9.5px; letter-spacing:.1em; }
    .t-tag  { font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:9.5px; letter-spacing:.1em; font-weight:600; }
    .t-q    { fill:var(--ink); font-family:system-ui,-apple-system,sans-serif; font-weight:600; font-size:15px; }
    .t-h    { font-family:system-ui,-apple-system,sans-serif; font-weight:600; font-size:14px; }
    .t-b    { fill:var(--ink); font-family:system-ui,-apple-system,sans-serif; font-size:12.5px; }
    .t-s    { fill:var(--ink-2); font-family:system-ui,-apple-system,sans-serif; font-size:11px; }
    .mark   { font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:16px; font-weight:700; }
    .plus   { fill:var(--code); }
    .minus  { fill:var(--gone); }
    .tie    { fill:var(--ink-3); }
    .c-code { fill:var(--code); }
    .c-mute { fill:var(--ink-3); }
    .c-lost { fill:var(--ink-2); }
    .c-acc  { fill:var(--accent); }
      .rec    { fill:var(--code-soft); stroke:var(--code); stroke-width:1.6; stroke-dasharray:5 4; }
  </style>
  <rect class="bg" x="0" y="0" width="940" height="430"/>

  <g id="the-call">
    <rect class="ask" x="16" y="14" width="908" height="48" rx="6"/>
    <text class="t-lbl" x="32" y="32">D1 · THE CALL</text>
    <text class="t-q" x="32" y="52">What can an app say about which events a session hears, without writing code?</text>
  </g>

  <g id="options">
    <rect class="chosen" x="212" y="76" width="348" height="46" rx="5"/>
    <text class="t-tag c-code" x="228" y="93">CHOSEN</text>
    <text class="t-h c-code" x="228" y="112">Five fixed screen kinds</text>
    <rect class="lost" x="576" y="76" width="348" height="46" rx="5"/>
    <text class="t-tag c-mute" x="592" y="93">INSTEAD OF</text>
    <text class="t-h c-lost" x="592" y="112">A predicate language over fields</text>
  </g>

  <g id="row-decides">
    <rect class="decide" x="16" y="134" width="908" height="62" rx="4"/>
    <rect class="bar" x="16" y="134" width="4" height="62"/>
    <text class="t-lbl" x="32" y="156">WHAT THE SHARE</text>
    <text class="t-lbl" x="32" y="169">MEASURES</text>
    <text class="t-tag c-acc" x="32" y="186">▸ DECIDES IT</text>
    <text class="mark plus" x="228" y="162">+</text>
    <text class="t-b" x="248" y="161">What the screens decide</text>
    <text class="t-s" x="248" y="179">a sentence fills labels, words, allow</text>
    <text class="mark minus" x="592" y="162">−</text>
    <text class="t-b" x="612" y="161">How clever the model was</text>
    <text class="t-s" x="612" y="179">a sentence compiles to anything</text>
  </g>
  <g id="row-1">
    <text class="t-lbl" x="32" y="222">AN INTEREST THE</text>
    <text class="t-lbl" x="32" y="235">KINDS CAN&#x27;T SAY</text>
    <text class="mark minus" x="228" y="224">−</text>
    <text class="t-b" x="248" y="223">Needs a custom screen</text>
    <text class="t-s" x="248" y="241">code, in the slot FIX-2537 builds</text>
    <text class="mark plus" x="592" y="224">+</text>
    <text class="t-b" x="612" y="223">Said in config</text>
    <text class="t-s" x="612" y="241">paths, operators, patterns</text>
    <line class="row" x1="16" y1="256" x2="924" y2="256"/>
  </g>
  <g id="row-2">
    <text class="t-lbl" x="32" y="280">THE NEXT SCREEN</text>
    <text class="t-lbl" x="32" y="293">TO BUILD</text>
    <text class="mark plus" x="228" y="282">+</text>
    <text class="t-b" x="248" y="281">One verdict shape</text>
    <text class="t-s" x="248" y="299">custom screens and Jev answer alike</text>
    <text class="mark minus" x="592" y="282">−</text>
    <text class="t-b" x="612" y="281">An evaluator to keep safe</text>
    <text class="t-s" x="612" y="299">regular expressions, paths, versions</text>
    <line class="row" x1="16" y1="314" x2="924" y2="314"/>
  </g>

  <g id="locks-in">
    <rect class="foot" x="16" y="340" width="446" height="74" rx="5"/>
    <text class="t-lbl" x="32" y="361">LOCKS IN</text>
    <text class="t-b" x="32" y="381">Five public kind names, one verdict shape</text>
    <text class="t-s" x="32" y="399">saved subscriptions carry them; renaming breaks them</text>
  </g>

  <g id="flips-if">
    <rect class="foot" x="478" y="340" width="446" height="74" rx="5"/>
    <text class="t-lbl" x="494" y="361">FLIPS IF</text>
    <text class="t-b" x="494" y="381">The share is under half with five kinds</text>
    <text class="t-s" x="494" y="399">and over half with a language, same subscriptions</text>
  </g>
</svg>
