<svg viewBox="0 0 940 488" role="img" aria-label="D2: how does an event the service received reach a user&#x27;s session? Chosen: a run as the subscriber. Instead of: the service writing each user&#x27;s message log as itself. It comes down to the first row, a private repo and a second user: in a run as the subscriber, user B&#x27;s run can&#x27;t read user A&#x27;s rows because the principal comes from the row&#x27;s storage cell; a service identity is one recipient-check bug from a leak. The host row is a cost on both sides: a second host-side fire beside fireWakeThrough that starts a request as a row&#x27;s owner, with no new RequestHost verb, against the framework&#x27;s first write across users. Cost per event: one request per delivered session, against one request in all. Push and poll: one delivery path, since a poll already runs as the owner, against two. Locks in a host fire that starts a request as a row&#x27;s owner, with no RequestHost verb. Flips if the store itself refuses a cross-user write outside one named row."
     xmlns="http://www.w3.org/2000/svg">
  <style>
    :root { --surface:#FCFCFA; --surface-2:#E8E8E1; --ink:#191C21; --ink-2:#4C535B; --ink-3:#7A828B;
            --rule:#D5D4CB; --accent:#3E4E8C; --accent-soft:#E0E3F0; --code:#2C7C69; --code-soft:#DCEDE7;
            --gone:#A9544F; }
    @media (prefers-color-scheme: dark) {
      :root { --surface:#181C1F; --surface-2:#202528; --ink:#E6E8E5; --ink-2:#A4ACB1; --ink-3:#737B81;
              --rule:#2B3135; --accent:#8B9BD8; --accent-soft:#1B2140; --code:#5DBBA1; --code-soft:#14302A;
              --gone:#DE8A84; } }
    .bg     { fill:var(--surface); }
    .ask    { fill:var(--surface-2); }
    .chosen { fill:var(--code-soft); stroke:var(--code); stroke-width:1.6; }
    .lost   { fill:var(--surface); stroke:var(--rule); stroke-width:1.4; stroke-dasharray:5 4; }
    .decide { fill:var(--accent-soft); }
    .bar    { fill:var(--accent); }
    .row    { stroke:var(--rule); stroke-width:1; }
    .foot   { fill:var(--surface-2); }
    .t-lbl  { fill:var(--ink-3); font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:9.5px; letter-spacing:.1em; }
    .t-tag  { font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:9.5px; letter-spacing:.1em; font-weight:600; }
    .t-q    { fill:var(--ink); font-family:system-ui,-apple-system,sans-serif; font-weight:600; font-size:15px; }
    .t-h    { font-family:system-ui,-apple-system,sans-serif; font-weight:600; font-size:14px; }
    .t-b    { fill:var(--ink); font-family:system-ui,-apple-system,sans-serif; font-size:12.5px; }
    .t-s    { fill:var(--ink-2); font-family:system-ui,-apple-system,sans-serif; font-size:11px; }
    .mark   { font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:16px; font-weight:700; }
    .plus   { fill:var(--code); }
    .minus  { fill:var(--gone); }
    .tie    { fill:var(--ink-3); }
    .c-code { fill:var(--code); }
    .c-mute { fill:var(--ink-3); }
    .c-lost { fill:var(--ink-2); }
    .c-acc  { fill:var(--accent); }
      .rec    { fill:var(--code-soft); stroke:var(--code); stroke-width:1.6; stroke-dasharray:5 4; }
  </style>
  <rect class="bg" x="0" y="0" width="940" height="488"/>

  <g id="the-call">
    <rect class="ask" x="16" y="14" width="908" height="48" rx="6"/>
    <text class="t-lbl" x="32" y="32">D2 · THE CALL</text>
    <text class="t-q" x="32" y="52">How does an event the service received reach a user&#x27;s session?</text>
  </g>

  <g id="options">
    <rect class="chosen" x="212" y="76" width="348" height="46" rx="5"/>
    <text class="t-tag c-code" x="228" y="93">CHOSEN</text>
    <text class="t-h c-code" x="228" y="112">A run as the subscriber</text>
    <rect class="lost" x="576" y="76" width="348" height="46" rx="5"/>
    <text class="t-tag c-mute" x="592" y="93">INSTEAD OF</text>
    <text class="t-h c-lost" x="592" y="112">The service writes each user&#x27;s log</text>
  </g>

  <g id="row-decides">
    <rect class="decide" x="16" y="134" width="908" height="62" rx="4"/>
    <rect class="bar" x="16" y="134" width="4" height="62"/>
    <text class="t-lbl" x="32" y="156">A PRIVATE REPO</text>
    <text class="t-lbl" x="32" y="169">AND USER B</text>
    <text class="t-tag c-acc" x="32" y="186">▸ DECIDES IT</text>
    <text class="mark plus" x="228" y="162">+</text>
    <text class="t-b" x="248" y="161">B&#x27;s run can&#x27;t read A&#x27;s rows</text>
    <text class="t-s" x="248" y="179">the principal comes from the row&#x27;s cell</text>
    <text class="mark minus" x="592" y="162">−</text>
    <text class="t-b" x="612" y="161">One check bug from a leak</text>
    <text class="t-s" x="612" y="179">a service identity writes every user</text>
  </g>
  <g id="row-1">
    <text class="t-lbl" x="32" y="222">THE HOST</text>
    <text class="mark minus" x="228" y="224">−</text>
    <text class="t-b" x="248" y="223">A second fire</text>
    <text class="t-s" x="248" y="241">beside fireWakeThrough · no new verb</text>
    <text class="mark minus" x="592" y="224">−</text>
    <text class="t-b" x="612" y="223">A write across users</text>
    <text class="t-s" x="612" y="241">the first one in the framework</text>
    <line class="row" x1="16" y1="256" x2="924" y2="256"/>
  </g>
  <g id="row-2">
    <text class="t-lbl" x="32" y="280">COST PER EVENT</text>
    <text class="mark minus" x="228" y="282">−</text>
    <text class="t-b" x="248" y="281">One request per session</text>
    <text class="t-s" x="248" y="299">only for subscriptions that passed</text>
    <text class="mark plus" x="592" y="282">+</text>
    <text class="t-b" x="612" y="281">One request in all</text>
    <text class="t-s" x="612" y="299">the service writes them in turn</text>
    <line class="row" x1="16" y1="314" x2="924" y2="314"/>
  </g>
  <g id="row-3">
    <text class="t-lbl" x="32" y="338">PUSH AND POLL</text>
    <text class="mark plus" x="228" y="340">+</text>
    <text class="t-b" x="248" y="339">One delivery path</text>
    <text class="t-s" x="248" y="357">a poll already runs as the owner</text>
    <text class="mark minus" x="592" y="340">−</text>
    <text class="t-b" x="612" y="339">Two</text>
    <text class="t-s" x="612" y="357">the poll runs as the user, push does not</text>
    <line class="row" x1="16" y1="372" x2="924" y2="372"/>
  </g>

  <g id="locks-in">
    <rect class="foot" x="16" y="398" width="446" height="74" rx="5"/>
    <text class="t-lbl" x="32" y="419">LOCKS IN</text>
    <text class="t-b" x="32" y="439">A host fire that starts a request as a row&#x27;s owner</text>
    <text class="t-s" x="32" y="457">no RequestHost verb; later features will want it</text>
  </g>

  <g id="flips-if">
    <rect class="foot" x="478" y="398" width="446" height="74" rx="5"/>
    <text class="t-lbl" x="494" y="419">FLIPS IF</text>
    <text class="t-b" x="494" y="439">The store refuses a cross-user write</text>
    <text class="t-s" x="494" y="457">outside one named row: then the service writes</text>
  </g>
</svg>
