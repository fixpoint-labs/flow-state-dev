<svg viewBox="0 0 940 428" role="img" aria-label="D1: where does a verified GitHub delivery go, now that no binding names a session? Chosen: a service route on the webhook transport. Instead of: a GitHub adapter with its own URL. It comes down to the first row, one place that verifies and acks: the service route reuses the transport&#x27;s verify, parse and ack pipeline for every provider; an own adapter keeps a second copy of it in step. The public surface is a cost of the chosen one: a second form on a core type, service beside on. The next provider declares service and a normalize instead of writing another adapter. Locks in webhooks.&lt;provider&gt;.service as a public name, and a provider entry is bindings or a service route, not both. Flips if routing had to run before the signature check."
     xmlns="http://www.w3.org/2000/svg">
  <style>
    :root { --surface:#FCFCFA; --surface-2:#E8E8E1; --ink:#191C21; --ink-2:#4C535B; --ink-3:#7A828B;
            --rule:#D5D4CB; --accent:#3E4E8C; --accent-soft:#E0E3F0; --code:#2C7C69; --code-soft:#DCEDE7;
            --gone:#A9544F; }
    @media (prefers-color-scheme: dark) {
      :root { --surface:#181C1F; --surface-2:#202528; --ink:#E6E8E5; --ink-2:#A4ACB1; --ink-3:#737B81;
              --rule:#2B3135; --accent:#8B9BD8; --accent-soft:#1B2140; --code:#5DBBA1; --code-soft:#14302A;
              --gone:#DE8A84; } }
    .bg     { fill:var(--surface); }
    .ask    { fill:var(--surface-2); }
    .chosen { fill:var(--code-soft); stroke:var(--code); stroke-width:1.6; }
    .lost   { fill:var(--surface); stroke:var(--rule); stroke-width:1.4; stroke-dasharray:5 4; }
    .decide { fill:var(--accent-soft); }
    .bar    { fill:var(--accent); }
    .row    { stroke:var(--rule); stroke-width:1; }
    .foot   { fill:var(--surface-2); }
    .t-lbl  { fill:var(--ink-3); font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:9.5px; letter-spacing:.1em; }
    .t-tag  { font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:9.5px; letter-spacing:.1em; font-weight:600; }
    .t-q    { fill:var(--ink); font-family:system-ui,-apple-system,sans-serif; font-weight:600; font-size:15px; }
    .t-h    { font-family:system-ui,-apple-system,sans-serif; font-weight:600; font-size:14px; }
    .t-b    { fill:var(--ink); font-family:system-ui,-apple-system,sans-serif; font-size:12.5px; }
    .t-s    { fill:var(--ink-2); font-family:system-ui,-apple-system,sans-serif; font-size:11px; }
    .mark   { font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:16px; font-weight:700; }
    .plus   { fill:var(--code); }
    .minus  { fill:var(--gone); }
    .tie    { fill:var(--ink-3); }
    .c-code { fill:var(--code); }
    .c-mute { fill:var(--ink-3); }
    .c-lost { fill:var(--ink-2); }
    .c-acc  { fill:var(--accent); }
      .rec    { fill:var(--code-soft); stroke:var(--code); stroke-width:1.6; stroke-dasharray:5 4; }
  </style>
  <rect class="bg" x="0" y="0" width="940" height="428"/>

  <g id="the-call">
    <rect class="ask" x="16" y="14" width="908" height="48" rx="6"/>
    <text class="t-lbl" x="32" y="32">D1 · THE CALL</text>
    <text class="t-q" x="32" y="52">Where does a verified GitHub delivery go, now that no binding names a session?</text>
  </g>

  <g id="options">
    <rect class="chosen" x="212" y="76" width="348" height="46" rx="5"/>
    <text class="t-tag c-code" x="228" y="93">CHOSEN</text>
    <text class="t-h c-code" x="228" y="112">A service route on the webhook transport</text>
    <rect class="lost" x="576" y="76" width="348" height="46" rx="5"/>
    <text class="t-tag c-mute" x="592" y="93">INSTEAD OF</text>
    <text class="t-h c-lost" x="592" y="112">Its own GitHub adapter and URL</text>
  </g>

  <g id="row-decides">
    <rect class="decide" x="16" y="134" width="908" height="62" rx="4"/>
    <rect class="bar" x="16" y="134" width="4" height="62"/>
    <text class="t-lbl" x="32" y="156">ONE PLACE</text>
    <text class="t-lbl" x="32" y="169">VERIFIES AND ACKS</text>
    <text class="t-tag c-acc" x="32" y="186">▸ DECIDES IT</text>
    <text class="mark plus" x="228" y="162">+</text>
    <text class="t-b" x="248" y="161">One pipeline for every provider</text>
    <text class="t-s" x="248" y="179">verify, parse, ack: today&#x27;s code</text>
    <text class="mark minus" x="592" y="162">−</text>
    <text class="t-b" x="612" y="161">A second copy of that pipeline</text>
    <text class="t-s" x="612" y="179">kept in step with the first</text>
  </g>
  <g id="row-1">
    <text class="t-lbl" x="32" y="222">THE PUBLIC</text>
    <text class="t-lbl" x="32" y="235">SURFACE</text>
    <text class="mark minus" x="228" y="224">−</text>
    <text class="t-b" x="248" y="223">A second form on a core type</text>
    <text class="t-s" x="248" y="241">service beside on, one per provider</text>
    <text class="mark plus" x="592" y="224">+</text>
    <text class="t-b" x="612" y="223">Nothing new in core</text>
    <text class="t-s" x="612" y="241">the adapter lives in workforce</text>
    <line class="row" x1="16" y1="254" x2="924" y2="254"/>
  </g>
  <g id="row-2">
    <text class="t-lbl" x="32" y="280">THE NEXT</text>
    <text class="t-lbl" x="32" y="293">PROVIDER</text>
    <text class="mark plus" x="228" y="282">+</text>
    <text class="t-b" x="248" y="281">Declares service and a normalize</text>
    <text class="t-s" x="248" y="299">Slack later needs no new route</text>
    <text class="mark minus" x="592" y="282">−</text>
    <text class="t-b" x="612" y="281">Writes another adapter</text>
    <text class="t-s" x="612" y="299">or copies GitHub&#x27;s</text>
    <line class="row" x1="16" y1="312" x2="924" y2="312"/>
  </g>

  <g id="locks-in">
    <rect class="foot" x="16" y="338" width="446" height="74" rx="5"/>
    <text class="t-lbl" x="32" y="359">LOCKS IN</text>
    <text class="t-b" x="32" y="379">webhooks.&lt;provider&gt;.service, a public name</text>
    <text class="t-s" x="32" y="397">a provider entry is bindings or a service route</text>
  </g>

  <g id="flips-if">
    <rect class="foot" x="478" y="338" width="446" height="74" rx="5"/>
    <text class="t-lbl" x="494" y="359">FLIPS IF</text>
    <text class="t-b" x="494" y="379">Routing must run before the signature check</text>
    <text class="t-s" x="494" y="397">then the transport can&#x27;t own the order</text>
  </g>
</svg>
