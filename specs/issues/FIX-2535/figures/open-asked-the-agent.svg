<svg viewBox="0 0 940 428" role="img" aria-label="Open: what counts as asking the app&#x27;s agent, so the work runs as an ordinary message in every mode? Recommended: a handle the app names for its agent. The other option: a mention of the subscriber&#x27;s own login, its self. It comes down to the first row, a mention meant for the person: with the app&#x27;s handle it runs nothing; with self, the person&#x27;s teammates asking them a question start the agent&#x27;s work, even with inferred work off. Two coordinators on one repository are a cost of the handle: both act on one mention, where self reaches only the named user&#x27;s. Setup: the app names its handle, against nothing new since rows already carry self. Locks in a handle list on the GitHub service flow and what addressed is compared against. Flips if teams run several coordinators on one repository."
     xmlns="http://www.w3.org/2000/svg">
  <style>
    :root { --surface:#FCFCFA; --surface-2:#E8E8E1; --ink:#191C21; --ink-2:#4C535B; --ink-3:#7A828B;
            --rule:#D5D4CB; --accent:#3E4E8C; --accent-soft:#E0E3F0; --code:#2C7C69; --code-soft:#DCEDE7;
            --gone:#A9544F; }
    @media (prefers-color-scheme: dark) {
      :root { --surface:#181C1F; --surface-2:#202528; --ink:#E6E8E5; --ink-2:#A4ACB1; --ink-3:#737B81;
              --rule:#2B3135; --accent:#8B9BD8; --accent-soft:#1B2140; --code:#5DBBA1; --code-soft:#14302A;
              --gone:#DE8A84; } }
    .bg     { fill:var(--surface); }
    .ask    { fill:var(--surface-2); }
    .chosen { fill:var(--code-soft); stroke:var(--code); stroke-width:1.6; }
    .lost   { fill:var(--surface); stroke:var(--rule); stroke-width:1.4; stroke-dasharray:5 4; }
    .decide { fill:var(--accent-soft); }
    .bar    { fill:var(--accent); }
    .row    { stroke:var(--rule); stroke-width:1; }
    .foot   { fill:var(--surface-2); }
    .t-lbl  { fill:var(--ink-3); font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:9.5px; letter-spacing:.1em; }
    .t-tag  { font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:9.5px; letter-spacing:.1em; font-weight:600; }
    .t-q    { fill:var(--ink); font-family:system-ui,-apple-system,sans-serif; font-weight:600; font-size:15px; }
    .t-h    { font-family:system-ui,-apple-system,sans-serif; font-weight:600; font-size:14px; }
    .t-b    { fill:var(--ink); font-family:system-ui,-apple-system,sans-serif; font-size:12.5px; }
    .t-s    { fill:var(--ink-2); font-family:system-ui,-apple-system,sans-serif; font-size:11px; }
    .mark   { font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:16px; font-weight:700; }
    .plus   { fill:var(--code); }
    .minus  { fill:var(--gone); }
    .tie    { fill:var(--ink-3); }
    .c-code { fill:var(--code); }
    .c-mute { fill:var(--ink-3); }
    .c-lost { fill:var(--ink-2); }
    .c-acc  { fill:var(--accent); }
      .rec    { fill:var(--code-soft); stroke:var(--code); stroke-width:1.6; stroke-dasharray:5 4; }
  </style>
  <rect class="bg" x="0" y="0" width="940" height="428"/>

  <g id="the-call">
    <rect class="ask" x="16" y="14" width="908" height="48" rx="6"/>
    <text class="t-lbl" x="32" y="32">OPEN · THE FORK</text>
    <text class="t-q" x="32" y="52">What counts as asking the app&#x27;s agent?</text>
  </g>

  <g id="options">
    <rect class="rec" x="212" y="76" width="348" height="46" rx="5"/>
    <text class="t-tag c-code" x="228" y="93">RECOMMENDED</text>
    <text class="t-h c-code" x="228" y="112">A handle the app names</text>
    <rect class="lost" x="576" y="76" width="348" height="46" rx="5"/>
    <text class="t-tag c-mute" x="592" y="93">THE OTHER OPTION</text>
    <text class="t-h c-lost" x="592" y="112">A mention of the user, self</text>
  </g>

  <g id="row-decides">
    <rect class="decide" x="16" y="134" width="908" height="62" rx="4"/>
    <rect class="bar" x="16" y="134" width="4" height="62"/>
    <text class="t-lbl" x="32" y="156">A MENTION MEANT</text>
    <text class="t-lbl" x="32" y="169">FOR THE PERSON</text>
    <text class="t-tag c-acc" x="32" y="186">▸ DECIDES IT</text>
    <text class="mark plus" x="228" y="162">+</text>
    <text class="t-b" x="248" y="161">Runs nothing</text>
    <text class="t-s" x="248" y="179">a person&#x27;s mention never starts work</text>
    <text class="mark minus" x="592" y="162">−</text>
    <text class="t-b" x="612" y="161">Starts the agent&#x27;s work</text>
    <text class="t-s" x="612" y="179">even with inferred work off</text>
  </g>
  <g id="row-1">
    <text class="t-lbl" x="32" y="222">TWO COORDINATORS</text>
    <text class="t-lbl" x="32" y="235">ON ONE REPO</text>
    <text class="mark minus" x="228" y="224">−</text>
    <text class="t-b" x="248" y="223">Both act on one mention</text>
    <text class="t-s" x="248" y="241">the team gets the work twice</text>
    <text class="mark plus" x="592" y="224">+</text>
    <text class="t-b" x="612" y="223">Only the named user&#x27;s acts</text>
    <text class="t-s" x="612" y="241">one coordinator per mention</text>
    <line class="row" x1="16" y1="254" x2="924" y2="254"/>
  </g>
  <g id="row-2">
    <text class="t-lbl" x="32" y="280">SETUP</text>
    <text class="t-lbl" x="32" y="293"></text>
    <text class="mark minus" x="228" y="282">−</text>
    <text class="t-b" x="248" y="281">The app names a handle</text>
    <text class="t-s" x="248" y="299">one list on the GitHub flow</text>
    <text class="mark plus" x="592" y="282">+</text>
    <text class="t-b" x="612" y="281">Nothing new</text>
    <text class="t-s" x="612" y="299">rows already carry self</text>
    <line class="row" x1="16" y1="312" x2="924" y2="312"/>
  </g>

  <g id="locks-in">
    <rect class="foot" x="16" y="338" width="446" height="74" rx="5"/>
    <text class="t-lbl" x="32" y="359">LOCKS IN</text>
    <text class="t-b" x="32" y="379">What addressed is compared against</text>
    <text class="t-s" x="32" y="397">a handle list on the GitHub service flow</text>
  </g>

  <g id="flips-if">
    <rect class="foot" x="478" y="338" width="446" height="74" rx="5"/>
    <text class="t-lbl" x="494" y="359">FLIPS IF</text>
    <text class="t-b" x="494" y="379">Teams run several coordinators on one repo</text>
    <text class="t-s" x="494" y="397">then self, one per user, is safer</text>
  </g>
</svg>
