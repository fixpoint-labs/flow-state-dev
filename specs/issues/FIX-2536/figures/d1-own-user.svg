<svg viewBox="0 0 940 488" role="img" aria-label="D1: Whose subscriptions does one user&#x27;s poll reach? Chosen: Only that user&#x27;s own. Instead of: The shared routing, every user. It comes down to a private repo and user b: B hears nothing A&#x27;s token read, B&#x27;s own poll checks B&#x27;s access; against A&#x27;s access becomes B&#x27;s, B hears what A&#x27;s token fetched. Cost per thread: One poll per user two users on a PR, two polls; against One poll per thread shared by every subscriber. How it runs: Inside the fire, as the user the screens and deliverToRow, reused; against Needs the host from a block a request starts no other user&#x27;s run. Rate limit: Each user&#x27;s own token mostly free 304s; against The poller&#x27;s token one budget for everyone. Locks in: Each follower polls on their own credentials, and a second door into delivery beside the index. Flips if every subscriber reads with one credential, of the same access: then one poll serves all."
     xmlns="http://www.w3.org/2000/svg">
  <style>
    :root { --surface:#FCFCFA; --surface-2:#E8E8E1; --ink:#191C21; --ink-2:#4C535B; --ink-3:#7A828B;
            --rule:#D5D4CB; --accent:#3E4E8C; --accent-soft:#E0E3F0; --code:#2C7C69; --code-soft:#DCEDE7;
            --gone:#A9544F; }
    @media (prefers-color-scheme: dark) {
      :root { --surface:#181C1F; --surface-2:#202528; --ink:#E6E8E5; --ink-2:#A4ACB1; --ink-3:#737B81;
              --rule:#2B3135; --accent:#8B9BD8; --accent-soft:#1B2140; --code:#5DBBA1; --code-soft:#14302A;
              --gone:#DE8A84; } }
    .bg     { fill:var(--surface); }
    .ask    { fill:var(--surface-2); }
    .chosen { fill:var(--code-soft); stroke:var(--code); stroke-width:1.6; }
    .lost   { fill:var(--surface); stroke:var(--rule); stroke-width:1.4; stroke-dasharray:5 4; }
    .decide { fill:var(--accent-soft); }
    .bar    { fill:var(--accent); }
    .row    { stroke:var(--rule); stroke-width:1; }
    .foot   { fill:var(--surface-2); }
    .t-lbl  { fill:var(--ink-3); font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:9.5px; letter-spacing:.1em; }
    .t-tag  { font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:9.5px; letter-spacing:.1em; font-weight:600; }
    .t-q    { fill:var(--ink); font-family:system-ui,-apple-system,sans-serif; font-weight:600; font-size:15px; }
    .t-h    { font-family:system-ui,-apple-system,sans-serif; font-weight:600; font-size:14px; }
    .t-b    { fill:var(--ink); font-family:system-ui,-apple-system,sans-serif; font-size:12.5px; }
    .t-s    { fill:var(--ink-2); font-family:system-ui,-apple-system,sans-serif; font-size:11px; }
    .mark   { font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:16px; font-weight:700; }
    .plus   { fill:var(--code); }
    .minus  { fill:var(--gone); }
    .tie    { fill:var(--ink-3); }
    .c-code { fill:var(--code); }
    .c-mute { fill:var(--ink-3); }
    .c-lost { fill:var(--ink-2); }
    .c-acc  { fill:var(--accent); }
      .rec    { fill:var(--code-soft); stroke:var(--code); stroke-width:1.6; stroke-dasharray:5 4; }
  </style>
  <rect class="bg" x="0" y="0" width="940" height="488"/>
  <g id="the-call"><rect class="ask" x="16" y="14" width="908" height="48" rx="6"/><text class="t-lbl" x="32" y="32">D1 · THE CALL</text><text class="t-q" x="32" y="52">Whose subscriptions does one user&#x27;s poll reach?</text></g>
  <g id="options"><rect class="chosen" x="212" y="76" width="348" height="46" rx="5"/><text class="t-tag c-code" x="228" y="93">CHOSEN</text><text class="t-h c-code" x="228" y="112">Only that user&#x27;s own</text><rect class="lost" x="576" y="76" width="348" height="46" rx="5"/><text class="t-tag c-mute" x="592" y="93">INSTEAD OF</text><text class="t-h c-lost" x="592" y="112">The shared routing, every user</text></g>
  <g id="row-decides"><rect class="decide" x="16" y="134" width="908" height="62" rx="4"/><rect class="bar" x="16" y="134" width="4" height="62"/><text class="t-lbl" x="32" y="156">A PRIVATE REPO</text><text class="t-lbl" x="32" y="169">AND USER B</text><text class="t-tag c-acc" x="32" y="186">▸ DECIDES IT</text><text class="mark plus" x="228" y="162">+</text><text class="t-b" x="248" y="161">B hears nothing A&#x27;s token read</text><text class="t-s" x="248" y="179">B&#x27;s own poll checks B&#x27;s access</text><text class="mark minus" x="592" y="162">−</text><text class="t-b" x="612" y="161">A&#x27;s access becomes B&#x27;s</text><text class="t-s" x="612" y="179">B hears what A&#x27;s token fetched</text></g>
  <g id="row-1"><text class="t-lbl" x="32" y="222">COST PER THREAD</text><text class="mark minus" x="228" y="224">−</text><text class="t-b" x="248" y="223">One poll per user</text><text class="t-s" x="248" y="241">two users on a PR, two polls</text><text class="mark plus" x="592" y="224">+</text><text class="t-b" x="612" y="223">One poll per thread</text><text class="t-s" x="612" y="241">shared by every subscriber</text><line class="row" x1="16" y1="256" x2="924" y2="256"/></g>
  <g id="row-2"><text class="t-lbl" x="32" y="280">HOW IT RUNS</text><text class="mark plus" x="228" y="282">+</text><text class="t-b" x="248" y="281">Inside the fire, as the user</text><text class="t-s" x="248" y="299">the screens and deliverToRow, reused</text><text class="mark minus" x="592" y="282">−</text><text class="t-b" x="612" y="281">Needs the host from a block</text><text class="t-s" x="612" y="299">a request starts no other user&#x27;s run</text><line class="row" x1="16" y1="314" x2="924" y2="314"/></g>
  <g id="row-3"><text class="t-lbl" x="32" y="338">RATE LIMIT</text><text class="mark tie" x="228" y="340">=</text><text class="t-b" x="248" y="339">Each user&#x27;s own token</text><text class="t-s" x="248" y="357">mostly free 304s</text><text class="mark tie" x="592" y="340">=</text><text class="t-b" x="612" y="339">The poller&#x27;s token</text><text class="t-s" x="612" y="357">one budget for everyone</text></g>
  <g id="locks-in"><rect class="foot" x="16" y="398" width="446" height="74" rx="5"/><text class="t-lbl" x="32" y="419">LOCKS IN</text><text class="t-b" x="32" y="439">Each follower polls on their own credentials</text><text class="t-s" x="32" y="457">and a second door into delivery beside the index</text></g>
  <g id="flips-if"><rect class="foot" x="478" y="398" width="446" height="74" rx="5"/><text class="t-lbl" x="494" y="419">FLIPS IF</text><text class="t-b" x="494" y="439">Every subscriber reads with one credential</text><text class="t-s" x="494" y="457">of the same access: then one poll serves all</text></g>
</svg>
