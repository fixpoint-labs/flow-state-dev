<svg viewBox="0 0 940 488" role="img" aria-label="D2: When does a poll&#x27;s place (its ETag and since mark) move forward? Chosen: Only past what was taken. Instead of: On every answer. It comes down to a delivery the host lost: The next poll fetches it again, it lands once; the cursor drops the rest; against Gone, the next poll answers 304. Quiet thread: A 304 per read the place is unchanged; against A 304 per read the same. After a loss: One unconditional re-read the cursor dedupes it; against No extra request and no event. What the place means: Everything before it arrived a promise a test can check; against The provider answered nothing about the session. Locks in: The place is a promise of arrival, a loss costs a re-read, never an event. Flips if delivery resends what it gave back, on its own: then the place can move freely."
     xmlns="http://www.w3.org/2000/svg">
  <style>
    :root { --surface:#FCFCFA; --surface-2:#E8E8E1; --ink:#191C21; --ink-2:#4C535B; --ink-3:#7A828B;
            --rule:#D5D4CB; --accent:#3E4E8C; --accent-soft:#E0E3F0; --code:#2C7C69; --code-soft:#DCEDE7;
            --gone:#A9544F; }
    @media (prefers-color-scheme: dark) {
      :root { --surface:#181C1F; --surface-2:#202528; --ink:#E6E8E5; --ink-2:#A4ACB1; --ink-3:#737B81;
              --rule:#2B3135; --accent:#8B9BD8; --accent-soft:#1B2140; --code:#5DBBA1; --code-soft:#14302A;
              --gone:#DE8A84; } }
    .bg     { fill:var(--surface); }
    .ask    { fill:var(--surface-2); }
    .chosen { fill:var(--code-soft); stroke:var(--code); stroke-width:1.6; }
    .lost   { fill:var(--surface); stroke:var(--rule); stroke-width:1.4; stroke-dasharray:5 4; }
    .decide { fill:var(--accent-soft); }
    .bar    { fill:var(--accent); }
    .row    { stroke:var(--rule); stroke-width:1; }
    .foot   { fill:var(--surface-2); }
    .t-lbl  { fill:var(--ink-3); font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:9.5px; letter-spacing:.1em; }
    .t-tag  { font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:9.5px; letter-spacing:.1em; font-weight:600; }
    .t-q    { fill:var(--ink); font-family:system-ui,-apple-system,sans-serif; font-weight:600; font-size:15px; }
    .t-h    { font-family:system-ui,-apple-system,sans-serif; font-weight:600; font-size:14px; }
    .t-b    { fill:var(--ink); font-family:system-ui,-apple-system,sans-serif; font-size:12.5px; }
    .t-s    { fill:var(--ink-2); font-family:system-ui,-apple-system,sans-serif; font-size:11px; }
    .mark   { font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:16px; font-weight:700; }
    .plus   { fill:var(--code); }
    .minus  { fill:var(--gone); }
    .tie    { fill:var(--ink-3); }
    .c-code { fill:var(--code); }
    .c-mute { fill:var(--ink-3); }
    .c-lost { fill:var(--ink-2); }
    .c-acc  { fill:var(--accent); }
      .rec    { fill:var(--code-soft); stroke:var(--code); stroke-width:1.6; stroke-dasharray:5 4; }
  </style>
  <rect class="bg" x="0" y="0" width="940" height="488"/>
  <g id="the-call"><rect class="ask" x="16" y="14" width="908" height="48" rx="6"/><text class="t-lbl" x="32" y="32">D2 · THE CALL</text><text class="t-q" x="32" y="52">When does a poll&#x27;s place (its ETag and since mark) move forward?</text></g>
  <g id="options"><rect class="chosen" x="212" y="76" width="348" height="46" rx="5"/><text class="t-tag c-code" x="228" y="93">CHOSEN</text><text class="t-h c-code" x="228" y="112">Only past what was taken</text><rect class="lost" x="576" y="76" width="348" height="46" rx="5"/><text class="t-tag c-mute" x="592" y="93">INSTEAD OF</text><text class="t-h c-lost" x="592" y="112">On every answer</text></g>
  <g id="row-decides"><rect class="decide" x="16" y="134" width="908" height="62" rx="4"/><rect class="bar" x="16" y="134" width="4" height="62"/><text class="t-lbl" x="32" y="156">A DELIVERY</text><text class="t-lbl" x="32" y="169">THE HOST LOST</text><text class="t-tag c-acc" x="32" y="186">▸ DECIDES IT</text><text class="mark plus" x="228" y="162">+</text><text class="t-b" x="248" y="161">The next poll fetches it again</text><text class="t-s" x="248" y="179">it lands once; the cursor drops the rest</text><text class="mark minus" x="592" y="162">−</text><text class="t-b" x="612" y="161">Gone</text><text class="t-s" x="612" y="179">the next poll answers 304</text></g>
  <g id="row-1"><text class="t-lbl" x="32" y="222">QUIET THREAD</text><text class="mark tie" x="228" y="224">=</text><text class="t-b" x="248" y="223">A 304 per read</text><text class="t-s" x="248" y="241">the place is unchanged</text><text class="mark tie" x="592" y="224">=</text><text class="t-b" x="612" y="223">A 304 per read</text><text class="t-s" x="612" y="241">the same</text><line class="row" x1="16" y1="256" x2="924" y2="256"/></g>
  <g id="row-2"><text class="t-lbl" x="32" y="280">AFTER A LOSS</text><text class="mark minus" x="228" y="282">−</text><text class="t-b" x="248" y="281">One unconditional re-read</text><text class="t-s" x="248" y="299">the cursor dedupes it</text><text class="mark plus" x="592" y="282">+</text><text class="t-b" x="612" y="281">No extra request</text><text class="t-s" x="612" y="299">and no event</text><line class="row" x1="16" y1="314" x2="924" y2="314"/></g>
  <g id="row-3"><text class="t-lbl" x="32" y="338">WHAT THE PLACE MEANS</text><text class="mark plus" x="228" y="340">+</text><text class="t-b" x="248" y="339">Everything before it arrived</text><text class="t-s" x="248" y="357">a promise a test can check</text><text class="mark minus" x="592" y="340">−</text><text class="t-b" x="612" y="339">The provider answered</text><text class="t-s" x="612" y="357">nothing about the session</text></g>
  <g id="locks-in"><rect class="foot" x="16" y="398" width="446" height="74" rx="5"/><text class="t-lbl" x="32" y="419">LOCKS IN</text><text class="t-b" x="32" y="439">The place is a promise of arrival</text><text class="t-s" x="32" y="457">a loss costs a re-read, never an event</text></g>
  <g id="flips-if"><rect class="foot" x="478" y="398" width="446" height="74" rx="5"/><text class="t-lbl" x="494" y="419">FLIPS IF</text><text class="t-b" x="494" y="439">Delivery resends what it gave back</text><text class="t-s" x="494" y="457">on its own: then the place can move freely</text></g>
</svg>
