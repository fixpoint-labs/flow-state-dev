<svg viewBox="0 0 940 488" role="img" aria-label="D3: How does a subscription come to be polled, and how often? Chosen: Config seeds rows, each with its cadence. Instead of: Only a model&#x27;s subscribe call, one cadence. It comes down to a config entry across redeploys: one row, polled from startup, keyed cfg_ so a restart adds no row; against polled only if a model calls subscribe, config can&#x27;t declare one. A removed entry: ends at its next fire, through unsubscribe&#x27;s write, no startup sweep; against nothing to remove, every row is a model&#x27;s. Cadence: per row, 5 to 60 minutes, else throws, default poll.everyMinutes; against one cadence for every row. A user&#x27;s pause or end: stays as the user left it, the seed merges only config-owned fields; against stays as the user left it, no seed to undo it. Locks in: an ended cfg_ row stays ended while its entry is unchanged, and the seed never re-enables a paused routine. Flips if a tenant owns config: tenants aren&#x27;t polled in v1."
     xmlns="http://www.w3.org/2000/svg">
  <style>
    :root { --surface:#FCFCFA; --surface-2:#E8E8E1; --ink:#191C21; --ink-2:#4C535B; --ink-3:#7A828B;
            --rule:#D5D4CB; --accent:#3E4E8C; --accent-soft:#E0E3F0; --code:#2C7C69; --code-soft:#DCEDE7;
            --gone:#A9544F; }
    @media (prefers-color-scheme: dark) {
      :root { --surface:#181C1F; --surface-2:#202528; --ink:#E6E8E5; --ink-2:#A4ACB1; --ink-3:#737B81;
              --rule:#2B3135; --accent:#8B9BD8; --accent-soft:#1B2140; --code:#5DBBA1; --code-soft:#14302A;
              --gone:#DE8A84; } }
    .bg     { fill:var(--surface); }
    .ask    { fill:var(--surface-2); }
    .chosen { fill:var(--code-soft); stroke:var(--code); stroke-width:1.6; }
    .lost   { fill:var(--surface); stroke:var(--rule); stroke-width:1.4; stroke-dasharray:5 4; }
    .decide { fill:var(--accent-soft); }
    .bar    { fill:var(--accent); }
    .row    { stroke:var(--rule); stroke-width:1; }
    .foot   { fill:var(--surface-2); }
    .t-lbl  { fill:var(--ink-3); font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:9.5px; letter-spacing:.1em; }
    .t-tag  { font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:9.5px; letter-spacing:.1em; font-weight:600; }
    .t-q    { fill:var(--ink); font-family:system-ui,-apple-system,sans-serif; font-weight:600; font-size:15px; }
    .t-h    { font-family:system-ui,-apple-system,sans-serif; font-weight:600; font-size:14px; }
    .t-b    { fill:var(--ink); font-family:system-ui,-apple-system,sans-serif; font-size:12.5px; }
    .t-s    { fill:var(--ink-2); font-family:system-ui,-apple-system,sans-serif; font-size:11px; }
    .mark   { font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:16px; font-weight:700; }
    .plus   { fill:var(--code); }
    .minus  { fill:var(--gone); }
    .tie    { fill:var(--ink-3); }
    .c-code { fill:var(--code); }
    .c-mute { fill:var(--ink-3); }
    .c-lost { fill:var(--ink-2); }
    .c-acc  { fill:var(--accent); }
      .rec    { fill:var(--code-soft); stroke:var(--code); stroke-width:1.6; stroke-dasharray:5 4; }
  </style>
  <rect class="bg" x="0" y="0" width="940" height="488"/>
  <g id="the-call"><rect class="ask" x="16" y="14" width="908" height="48" rx="6"/><text class="t-lbl" x="32" y="32">D3 · THE CALL</text><text class="t-q" x="32" y="52">How does a subscription come to be polled, and how often?</text></g>
  <g id="options"><rect class="chosen" x="212" y="76" width="348" height="46" rx="5"/><text class="t-tag c-code" x="228" y="93">CHOSEN</text><text class="t-h c-code" x="228" y="112">Config seeds rows, each with its cadence</text><rect class="lost" x="576" y="76" width="348" height="46" rx="5"/><text class="t-tag c-mute" x="592" y="93">INSTEAD OF</text><text class="t-h c-lost" x="592" y="112">Only a model&#x27;s subscribe call, one cadence</text></g>
  <g id="row-decides"><rect class="decide" x="16" y="134" width="908" height="62" rx="4"/><rect class="bar" x="16" y="134" width="4" height="62"/><text class="t-lbl" x="32" y="156">A CONFIG ENTRY</text><text class="t-lbl" x="32" y="169">ACROSS REDEPLOYS</text><text class="t-tag c-acc" x="32" y="186">▸ DECIDES IT</text><text class="mark plus" x="228" y="162">+</text><text class="t-b" x="248" y="161">One row, polled from startup</text><text class="t-s" x="248" y="179">keyed cfg_, so a restart adds no row</text><text class="mark minus" x="592" y="162">−</text><text class="t-b" x="612" y="161">Polled only if a model calls it</text><text class="t-s" x="612" y="179">config can&#x27;t declare a subscription</text></g>
  <g id="row-1"><text class="t-lbl" x="32" y="222">A REMOVED ENTRY</text><text class="mark minus" x="228" y="224">−</text><text class="t-b" x="248" y="223">Ends at its next fire, not at once</text><text class="t-s" x="248" y="241">unsubscribe&#x27;s write · no startup sweep</text><text class="mark plus" x="592" y="224">+</text><text class="t-b" x="612" y="223">Nothing to remove</text><text class="t-s" x="612" y="241">every row is a model&#x27;s</text><line class="row" x1="16" y1="256" x2="924" y2="256"/></g>
  <g id="row-2"><text class="t-lbl" x="32" y="280">CADENCE</text><text class="mark plus" x="228" y="282">+</text><text class="t-b" x="248" y="281">Per row, 5 to 60 minutes</text><text class="t-s" x="248" y="299">else throws; default poll.everyMinutes</text><text class="mark minus" x="592" y="282">−</text><text class="t-b" x="612" y="281">One cadence for every row</text><text class="t-s" x="612" y="299">poll.everyMinutes</text><line class="row" x1="16" y1="314" x2="924" y2="314"/></g>
  <g id="row-3"><text class="t-lbl" x="32" y="338">A USER&#x27;S PAUSE</text><text class="mark tie" x="228" y="340">=</text><text class="t-b" x="248" y="339">Stays as the user left it</text><text class="t-s" x="248" y="357">the seed merges only config-owned fields</text><text class="mark tie" x="592" y="340">=</text><text class="t-b" x="612" y="339">Stays as the user left it</text><text class="t-s" x="612" y="357">no seed to undo it</text></g>
  <g id="locks-in"><rect class="foot" x="16" y="398" width="446" height="74" rx="5"/><text class="t-lbl" x="32" y="419">LOCKS IN</text><text class="t-b" x="32" y="439">An ended cfg_ row stays ended while its entry is unchanged</text><text class="t-s" x="32" y="457">and the seed never re-enables a paused routine</text></g>
  <g id="flips-if"><rect class="foot" x="478" y="398" width="446" height="74" rx="5"/><text class="t-lbl" x="494" y="419">FLIPS IF</text><text class="t-b" x="494" y="439">A tenant owns config</text><text class="t-s" x="494" y="457">tenants aren&#x27;t polled in v1</text></g>
</svg>
