<svg viewBox="0 0 940 430" role="img" aria-label="Q-A, open: when an event arrives twice, from push and then a poll, may the model judge it twice? Recommended: judge once per routing run, and take FIX-2536&#x27;s screened field on the subscription cursor, written when a screen refuses or holds, so polledThrough holds at the oldest event neither taken nor screened. The other option: a memo of verdicts per thread. It comes down to the first row, a third dedupe store: the recommendation adds only a field on the existing cursor, the memo adds a store kept in step with the cursor, which epic D4 rules out. The price is the second row: up to two calls per event when push and poll overlap, on fuzzy subscriptions only. The third row: the closure&#x27;s assertion is amended to per routing run, an epic amendment. Locks in one call per routing run, with the closure reporting calls per event. Would change my mind: push and poll overlapping by default, or calls per event well over one."
     xmlns="http://www.w3.org/2000/svg">
  <style>
    :root { --surface:#FCFCFA; --surface-2:#E8E8E1; --ink:#191C21; --ink-2:#4C535B; --ink-3:#7A828B;
            --rule:#D5D4CB; --accent:#3E4E8C; --accent-soft:#E0E3F0; --code:#2C7C69; --code-soft:#DCEDE7;
            --gone:#A9544F; }
    @media (prefers-color-scheme: dark) {
      :root { --surface:#181C1F; --surface-2:#202528; --ink:#E6E8E5; --ink-2:#A4ACB1; --ink-3:#737B81;
              --rule:#2B3135; --accent:#8B9BD8; --accent-soft:#1B2140; --code:#5DBBA1; --code-soft:#14302A;
              --gone:#DE8A84; } }
    .bg     { fill:var(--surface); }
    .ask    { fill:var(--surface-2); }
    .chosen { fill:var(--code-soft); stroke:var(--code); stroke-width:1.6; }
    .lost   { fill:var(--surface); stroke:var(--rule); stroke-width:1.4; stroke-dasharray:5 4; }
    .decide { fill:var(--accent-soft); }
    .bar    { fill:var(--accent); }
    .row    { stroke:var(--rule); stroke-width:1; }
    .foot   { fill:var(--surface-2); }
    .t-lbl  { fill:var(--ink-3); font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:9.5px; letter-spacing:.1em; }
    .t-tag  { font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:9.5px; letter-spacing:.1em; font-weight:600; }
    .t-q    { fill:var(--ink); font-family:system-ui,-apple-system,sans-serif; font-weight:600; font-size:15px; }
    .t-h    { font-family:system-ui,-apple-system,sans-serif; font-weight:600; font-size:14px; }
    .t-b    { fill:var(--ink); font-family:system-ui,-apple-system,sans-serif; font-size:12.5px; }
    .t-s    { fill:var(--ink-2); font-family:system-ui,-apple-system,sans-serif; font-size:11px; }
    .mark   { font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:16px; font-weight:700; }
    .plus   { fill:var(--code); }
    .minus  { fill:var(--gone); }
    .tie    { fill:var(--ink-3); }
    .c-code { fill:var(--code); }
    .c-mute { fill:var(--ink-3); }
    .c-lost { fill:var(--ink-2); }
    .c-acc  { fill:var(--accent); }
      .rec    { fill:var(--code-soft); stroke:var(--code); stroke-width:1.6; stroke-dasharray:5 4; }
  </style>
  <rect class="bg" x="0" y="0" width="940" height="430"/>

  <g id="the-call">
    <rect class="ask" x="16" y="14" width="908" height="48" rx="6"/>
    <text class="t-lbl" x="32" y="32">Q-A · OPEN</text>
    <text class="t-q" x="32" y="52">When an event arrives twice, may the model judge it twice?</text>
  </g>

  <g id="options">
    <rect class="rec" x="212" y="76" width="348" height="46" rx="5"/>
    <text class="t-tag c-code" x="228" y="93">RECOMMENDED</text>
    <text class="t-h c-code" x="228" y="112">Judge per run; the cursor screens</text>
    <rect class="lost" x="576" y="76" width="348" height="46" rx="5"/>
    <text class="t-tag c-mute" x="592" y="93">THE OTHER OPTION</text>
    <text class="t-h c-lost" x="592" y="112">A verdict memo per thread</text>
  </g>

  <g id="row-decides">
    <rect class="decide" x="16" y="134" width="908" height="62" rx="4"/>
    <rect class="bar" x="16" y="134" width="4" height="62"/>
    <text class="t-lbl" x="32" y="156">A THIRD</text>
    <text class="t-lbl" x="32" y="169">DEDUPE STORE</text>
    <text class="t-tag c-acc" x="32" y="186">▸ DECIDES IT</text>
    <text class="mark plus" x="228" y="162">+</text>
    <text class="t-b" x="248" y="161">None</text>
    <text class="t-s" x="248" y="179">a field on the cursor; still two stores</text>
    <text class="mark minus" x="592" y="162">−</text>
    <text class="t-b" x="612" y="161">One, kept in step</text>
    <text class="t-s" x="612" y="179">epic D4 rules it out</text>
  </g>
  <g id="row-1">
    <text class="t-lbl" x="32" y="222">CALLS WHEN PUSH</text>
    <text class="t-lbl" x="32" y="235">AND POLL OVERLAP</text>
    <text class="mark minus" x="228" y="224">−</text>
    <text class="t-b" x="248" y="223">Up to two per event</text>
    <text class="t-s" x="248" y="241">fuzzy subscriptions only</text>
    <text class="mark plus" x="592" y="224">+</text>
    <text class="t-b" x="612" y="223">One per event</text>
    <text class="t-s" x="612" y="241">whatever arrives twice</text>
    <line class="row" x1="16" y1="256" x2="924" y2="256"/>
  </g>
  <g id="row-2">
    <text class="t-lbl" x="32" y="280">THE CLOSURE&#x27;S</text>
    <text class="t-lbl" x="32" y="293">ASSERTION</text>
    <text class="mark minus" x="228" y="282">−</text>
    <text class="t-b" x="248" y="281">Amended to per run</text>
    <text class="t-s" x="248" y="299">an epic amendment</text>
    <text class="mark plus" x="592" y="282">+</text>
    <text class="t-b" x="612" y="281">Holds as signed</text>
    <text class="t-s" x="612" y="299">at most one per normalized event</text>
    <line class="row" x1="16" y1="314" x2="924" y2="314"/>
  </g>

  <g id="locks-in">
    <rect class="foot" x="16" y="340" width="446" height="74" rx="5"/>
    <text class="t-lbl" x="32" y="361">LOCKS IN</text>
    <text class="t-b" x="32" y="381">One call per routing run</text>
    <text class="t-s" x="32" y="399">the closure reports calls per event</text>
  </g>

  <g id="flips-if">
    <rect class="foot" x="478" y="340" width="446" height="74" rx="5"/>
    <text class="t-lbl" x="494" y="361">WOULD CHANGE MY MIND</text>
    <text class="t-b" x="494" y="381">Push and poll overlap by default</text>
    <text class="t-s" x="494" y="399">or calls per event well over one</text>
  </g>
</svg>
