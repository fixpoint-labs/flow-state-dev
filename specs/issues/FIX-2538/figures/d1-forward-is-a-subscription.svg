<svg viewBox="0 0 940 488" role="img" aria-label="D1: how does an event nobody subscribed to reach a coordinator? Chosen: the coordinator subscribes with an unmatched flag. Instead of: the app names one coordinator to forward to. It comes down to a private repo and a second user: the subscription runs the read check and sender screen as its own user already, while a forward address is a second recipient path with its own copy of them. Who hears it: each coordinator that asked, against one user named in app config. New surface: one saved flag, against a forward option and an address. Duplicates are a tie. Locks in a saved unmatched flag for coordinators only. Flips if the service routes as one operator for all users."
     xmlns="http://www.w3.org/2000/svg">
     xmlns="http://www.w3.org/2000/svg">
  <style>
    :root { --surface:#FCFCFA; --surface-2:#E8E8E1; --ink:#191C21; --ink-2:#4C535B; --ink-3:#7A828B;
            --rule:#D5D4CB; --accent:#3E4E8C; --accent-soft:#E0E3F0; --code:#2C7C69; --code-soft:#DCEDE7;
            --gone:#A9544F; }
    @media (prefers-color-scheme: dark) {
      :root { --surface:#181C1F; --surface-2:#202528; --ink:#E6E8E5; --ink-2:#A4ACB1; --ink-3:#737B81;
              --rule:#2B3135; --accent:#8B9BD8; --accent-soft:#1B2140; --code:#5DBBA1; --code-soft:#14302A;
              --gone:#DE8A84; } }
    .bg     { fill:var(--surface); }
    .ask    { fill:var(--surface-2); }
    .chosen { fill:var(--code-soft); stroke:var(--code); stroke-width:1.6; }
    .lost   { fill:var(--surface); stroke:var(--rule); stroke-width:1.4; stroke-dasharray:5 4; }
    .decide { fill:var(--accent-soft); }
    .bar    { fill:var(--accent); }
    .row    { stroke:var(--rule); stroke-width:1; }
    .foot   { fill:var(--surface-2); }
    .t-lbl  { fill:var(--ink-3); font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:9.5px; letter-spacing:.1em; }
    .t-tag  { font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:9.5px; letter-spacing:.1em; font-weight:600; }
    .t-q    { fill:var(--ink); font-family:system-ui,-apple-system,sans-serif; font-weight:600; font-size:15px; }
    .t-h    { font-family:system-ui,-apple-system,sans-serif; font-weight:600; font-size:14px; }
    .t-b    { fill:var(--ink); font-family:system-ui,-apple-system,sans-serif; font-size:12.5px; }
    .t-s    { fill:var(--ink-2); font-family:system-ui,-apple-system,sans-serif; font-size:11px; }
    .mark   { font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:16px; font-weight:700; }
    .plus   { fill:var(--code); }
    .minus  { fill:var(--gone); }
    .tie    { fill:var(--ink-3); }
    .c-code { fill:var(--code); }
    .c-mute { fill:var(--ink-3); }
    .c-lost { fill:var(--ink-2); }
    .c-acc  { fill:var(--accent); }
      .rec    { fill:var(--code-soft); stroke:var(--code); stroke-width:1.6; stroke-dasharray:5 4; }
  </style>
  <rect class="bg" x="0" y="0" width="940" height="488"/>

  <g id="the-call">
    <rect class="ask" x="16" y="14" width="908" height="48" rx="6"/>
    <text class="t-lbl" x="32" y="32">D1 · THE CALL</text>
    <text class="t-q" x="32" y="52">How does an event nobody subscribed to reach a coordinator?</text>
  </g>

  <g id="options">
    <rect class="chosen" x="212" y="76" width="348" height="46" rx="5"/>
    <text class="t-tag c-code" x="228" y="93">CHOSEN</text>
    <text class="t-h c-code" x="228" y="112">A coordinator subscribes, unmatched</text>
    <rect class="lost" x="576" y="76" width="348" height="46" rx="5"/>
    <text class="t-tag c-mute" x="592" y="93">INSTEAD OF</text>
    <text class="t-h c-lost" x="592" y="112">The app names a coordinator to forward to</text>
  </g>

  <g id="row-decides">
    <rect class="decide" x="16" y="134" width="908" height="62" rx="4"/>
    <rect class="bar" x="16" y="134" width="4" height="62"/>
    <text class="t-lbl" x="32" y="156">A PRIVATE REPO</text>
    <text class="t-lbl" x="32" y="169">AND A SECOND USER</text>
    <text class="t-tag c-acc" x="32" y="186">▸ DECIDES IT</text>
    <text class="mark plus" x="228" y="162">+</text>
    <text class="t-b" x="248" y="161">The same read check, as its user</text>
    <text class="t-s" x="248" y="179">subscribe and delivery already run it</text>
    <text class="mark minus" x="592" y="162">−</text>
    <text class="t-b" x="612" y="161">A second recipient path</text>
    <text class="t-s" x="612" y="179">its own read check and sender screen</text>
  </g>
  <g id="row-1">
    <text class="t-lbl" x="32" y="222">WHO HEARS IT</text>
    <text class="mark plus" x="228" y="224">+</text>
    <text class="t-b" x="248" y="223">Each coordinator that asked</text>
    <text class="t-s" x="248" y="241">on a thread its user can read</text>
    <text class="mark minus" x="592" y="224">−</text>
    <text class="t-b" x="612" y="223">One user, named in app config</text>
    <text class="t-s" x="612" y="241">every forwarded event goes to them</text>
    <line class="row" x1="16" y1="256" x2="924" y2="256"/>
  </g>
  <g id="row-2">
    <text class="t-lbl" x="32" y="280">NEW SURFACE</text>
    <text class="mark minus" x="228" y="282">−</text>
    <text class="t-b" x="248" y="281">One flag on the row and index</text>
    <text class="t-s" x="248" y="299">a saved field: renaming it breaks rows</text>
    <text class="mark minus" x="592" y="282">−</text>
    <text class="t-b" x="612" y="281">A forward option and an address</text>
    <text class="t-s" x="612" y="299">plus the checks it has to copy</text>
    <line class="row" x1="16" y1="314" x2="924" y2="314"/>
  </g>
  <g id="row-3">
    <text class="t-lbl" x="32" y="338">ITS DUPLICATES</text>
    <text class="mark tie" x="228" y="340">=</text>
    <text class="t-b" x="248" y="339">Each coordinator once</text>
    <text class="t-s" x="248" y="357">the log id, per session</text>
    <text class="mark tie" x="592" y="340">=</text>
    <text class="t-b" x="612" y="339">The one coordinator once</text>
    <text class="t-s" x="612" y="357">the log id, per session</text>
    <line class="row" x1="16" y1="372" x2="924" y2="372"/>
  </g>

  <g id="locks-in">
    <rect class="foot" x="16" y="398" width="446" height="74" rx="5"/>
    <text class="t-lbl" x="32" y="419">LOCKS IN</text>
    <text class="t-b" x="32" y="439">A saved unmatched flag; coordinators only</text>
    <text class="t-s" x="32" y="457">only subscribe writes it (ER-5)</text>
  </g>

  <g id="flips-if">
    <rect class="foot" x="478" y="398" width="446" height="74" rx="5"/>
    <text class="t-lbl" x="494" y="419">FLIPS IF</text>
    <text class="t-b" x="494" y="439">The service routes as one operator</text>
    <text class="t-s" x="494" y="457">for all users: then a forward address is simpler</text>
  </g>
</svg>
