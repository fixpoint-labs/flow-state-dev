<svg viewBox="0 0 940 488" role="img" aria-label="D2: in observe, what stops a coordinator&#x27;s turn from starting inferred work? Chosen: the board's write holds each filing. Instead of: an instruction in the coordinator&#x27;s prompt. It comes down to a model that ignores the instruction: every task filed on that turn is held behind a confirm on the write, whichever tool filed it, so it cannot start work; a prompt only asks. What it can do: file, read, answer, against everything it can do today. Where it lives: the board&#x27;s write, reading the turn&#x27;s mark, against the prompt. What a person sees is a tie: a held task in the Inbox. Locks in that inferred filings in observe are held on the write. Flips if a coordinator needs to message a delegate to judge work."
     xmlns="http://www.w3.org/2000/svg">
  <style>
    :root { --surface:#FCFCFA; --surface-2:#E8E8E1; --ink:#191C21; --ink-2:#4C535B; --ink-3:#7A828B;
            --rule:#D5D4CB; --accent:#3E4E8C; --accent-soft:#E0E3F0; --code:#2C7C69; --code-soft:#DCEDE7;
            --gone:#A9544F; }
    @media (prefers-color-scheme: dark) {
      :root { --surface:#181C1F; --surface-2:#202528; --ink:#E6E8E5; --ink-2:#A4ACB1; --ink-3:#737B81;
              --rule:#2B3135; --accent:#8B9BD8; --accent-soft:#1B2140; --code:#5DBBA1; --code-soft:#14302A;
              --gone:#DE8A84; } }
    .bg     { fill:var(--surface); }
    .ask    { fill:var(--surface-2); }
    .chosen { fill:var(--code-soft); stroke:var(--code); stroke-width:1.6; }
    .lost   { fill:var(--surface); stroke:var(--rule); stroke-width:1.4; stroke-dasharray:5 4; }
    .decide { fill:var(--accent-soft); }
    .bar    { fill:var(--accent); }
    .row    { stroke:var(--rule); stroke-width:1; }
    .foot   { fill:var(--surface-2); }
    .t-lbl  { fill:var(--ink-3); font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:9.5px; letter-spacing:.1em; }
    .t-tag  { font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:9.5px; letter-spacing:.1em; font-weight:600; }
    .t-q    { fill:var(--ink); font-family:system-ui,-apple-system,sans-serif; font-weight:600; font-size:15px; }
    .t-h    { font-family:system-ui,-apple-system,sans-serif; font-weight:600; font-size:14px; }
    .t-b    { fill:var(--ink); font-family:system-ui,-apple-system,sans-serif; font-size:12.5px; }
    .t-s    { fill:var(--ink-2); font-family:system-ui,-apple-system,sans-serif; font-size:11px; }
    .mark   { font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:16px; font-weight:700; }
    .plus   { fill:var(--code); }
    .minus  { fill:var(--gone); }
    .tie    { fill:var(--ink-3); }
    .c-code { fill:var(--code); }
    .c-mute { fill:var(--ink-3); }
    .c-lost { fill:var(--ink-2); }
    .c-acc  { fill:var(--accent); }
      .rec    { fill:var(--code-soft); stroke:var(--code); stroke-width:1.6; stroke-dasharray:5 4; }
  </style>
  <rect class="bg" x="0" y="0" width="940" height="488"/>

  <g id="the-call">
    <rect class="ask" x="16" y="14" width="908" height="48" rx="6"/>
    <text class="t-lbl" x="32" y="32">D2 · THE CALL</text>
    <text class="t-q" x="32" y="52">In observe, what stops a coordinator&#x27;s turn from starting inferred work?</text>
  </g>

  <g id="options">
    <rect class="chosen" x="212" y="76" width="348" height="46" rx="5"/>
    <text class="t-tag c-code" x="228" y="93">CHOSEN</text>
    <text class="t-h c-code" x="228" y="112">The board&#x27;s write holds each filing</text>
    <rect class="lost" x="576" y="76" width="348" height="46" rx="5"/>
    <text class="t-tag c-mute" x="592" y="93">INSTEAD OF</text>
    <text class="t-h c-lost" x="592" y="112">An instruction in the coordinator&#x27;s prompt</text>
  </g>

  <g id="row-decides">
    <rect class="decide" x="16" y="134" width="908" height="62" rx="4"/>
    <rect class="bar" x="16" y="134" width="4" height="62"/>
    <text class="t-lbl" x="32" y="156">A MODEL THAT</text>
    <text class="t-lbl" x="32" y="169">IGNORES IT</text>
    <text class="t-tag c-acc" x="32" y="186">▸ DECIDES IT</text>
    <text class="mark plus" x="228" y="162">+</text>
    <text class="t-b" x="248" y="161">It cannot start work</text>
    <text class="t-s" x="248" y="179">every filing on that turn waits on a confirm</text>
    <text class="mark minus" x="592" y="162">−</text>
    <text class="t-b" x="612" y="161">It starts work</text>
    <text class="t-s" x="612" y="179">a message to a delegate, a task, its own tools</text>
  </g>
  <g id="row-1">
    <text class="t-lbl" x="32" y="222">WHAT IT CAN DO</text>
    <text class="mark minus" x="228" y="224">−</text>
    <text class="t-b" x="248" y="223">File, read, answer</text>
    <text class="t-s" x="248" y="241">no message to a delegate in that turn</text>
    <text class="mark plus" x="592" y="224">+</text>
    <text class="t-b" x="612" y="223">Everything it can do today</text>
    <text class="t-s" x="612" y="241">it decides what to hold</text>
    <line class="row" x1="16" y1="256" x2="924" y2="256"/>
  </g>
  <g id="row-2">
    <text class="t-lbl" x="32" y="280">WHERE IT LIVES</text>
    <text class="mark minus" x="228" y="282">−</text>
    <text class="t-b" x="248" y="281">On the board&#x27;s write</text>
    <text class="t-s" x="248" y="299">createTask reads the turn&#x27;s mark; the confirm reused</text>
    <text class="mark plus" x="592" y="282">+</text>
    <text class="t-b" x="612" y="281">In the prompt</text>
    <text class="t-s" x="612" y="299">no code path</text>
    <line class="row" x1="16" y1="314" x2="924" y2="314"/>
  </g>
  <g id="row-3">
    <text class="t-lbl" x="32" y="338">WHAT A PERSON SEES</text>
    <text class="mark tie" x="228" y="340">=</text>
    <text class="t-b" x="248" y="339">A held task in the Inbox</text>
    <text class="t-s" x="248" y="357">a confirm: yes runs it, no cancels it</text>
    <text class="mark tie" x="592" y="340">=</text>
    <text class="t-b" x="612" y="339">The same, when it obeys</text>
    <text class="t-s" x="612" y="357">a confirm: yes runs it, no cancels it</text>
    <line class="row" x1="16" y1="372" x2="924" y2="372"/>
  </g>

  <g id="locks-in">
    <rect class="foot" x="16" y="398" width="446" height="74" rx="5"/>
    <text class="t-lbl" x="32" y="419">LOCKS IN</text>
    <text class="t-b" x="32" y="439">Inferred filings in observe held, on the write</text>
    <text class="t-s" x="32" y="457">a mark on the message row, never model input</text>
  </g>

  <g id="flips-if">
    <rect class="foot" x="478" y="398" width="446" height="74" rx="5"/>
    <text class="t-lbl" x="494" y="419">FLIPS IF</text>
    <text class="t-b" x="494" y="439">A coordinator needs to message to judge work</text>
    <text class="t-s" x="494" y="457">then messages must be held as well</text>
  </g>
</svg>
