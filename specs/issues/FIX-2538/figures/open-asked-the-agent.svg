<svg viewBox="0 0 940 430" role="img" aria-label="Open: what counts as asking the agent, so the work runs in every mode? Recommended: a handle the app names for its agent. The other option: a mention of the coordinator&#x27;s own user. It comes down to a coordinator set to off and a mention meant for the person: with the app&#x27;s handle it runs nothing; with the user&#x27;s own mention it runs work even with inferred work off. Two users on one repo: with the handle both coordinators act; with the user only the named one does. Setup: the app names a handle, against nothing new. If wrong, a team that mentions its agent gets the work twice. Would change my mind: teams that run several coordinators on one repo."
     xmlns="http://www.w3.org/2000/svg">
     xmlns="http://www.w3.org/2000/svg">
  <style>
    :root { --surface:#FCFCFA; --surface-2:#E8E8E1; --ink:#191C21; --ink-2:#4C535B; --ink-3:#7A828B;
            --rule:#D5D4CB; --accent:#3E4E8C; --accent-soft:#E0E3F0; --code:#2C7C69; --code-soft:#DCEDE7;
            --gone:#A9544F; }
    @media (prefers-color-scheme: dark) {
      :root { --surface:#181C1F; --surface-2:#202528; --ink:#E6E8E5; --ink-2:#A4ACB1; --ink-3:#737B81;
              --rule:#2B3135; --accent:#8B9BD8; --accent-soft:#1B2140; --code:#5DBBA1; --code-soft:#14302A;
              --gone:#DE8A84; } }
    .bg     { fill:var(--surface); }
    .ask    { fill:var(--surface-2); }
    .chosen { fill:var(--code-soft); stroke:var(--code); stroke-width:1.6; }
    .lost   { fill:var(--surface); stroke:var(--rule); stroke-width:1.4; stroke-dasharray:5 4; }
    .decide { fill:var(--accent-soft); }
    .bar    { fill:var(--accent); }
    .row    { stroke:var(--rule); stroke-width:1; }
    .foot   { fill:var(--surface-2); }
    .t-lbl  { fill:var(--ink-3); font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:9.5px; letter-spacing:.1em; }
    .t-tag  { font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:9.5px; letter-spacing:.1em; font-weight:600; }
    .t-q    { fill:var(--ink); font-family:system-ui,-apple-system,sans-serif; font-weight:600; font-size:15px; }
    .t-h    { font-family:system-ui,-apple-system,sans-serif; font-weight:600; font-size:14px; }
    .t-b    { fill:var(--ink); font-family:system-ui,-apple-system,sans-serif; font-size:12.5px; }
    .t-s    { fill:var(--ink-2); font-family:system-ui,-apple-system,sans-serif; font-size:11px; }
    .mark   { font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:16px; font-weight:700; }
    .plus   { fill:var(--code); }
    .minus  { fill:var(--gone); }
    .tie    { fill:var(--ink-3); }
    .c-code { fill:var(--code); }
    .c-mute { fill:var(--ink-3); }
    .c-lost { fill:var(--ink-2); }
    .c-acc  { fill:var(--accent); }
      .rec    { fill:var(--code-soft); stroke:var(--code); stroke-width:1.6; stroke-dasharray:5 4; }
  </style>
  <rect class="bg" x="0" y="0" width="940" height="430"/>

  <g id="the-call">
    <rect class="ask" x="16" y="14" width="908" height="48" rx="6"/>
    <text class="t-lbl" x="32" y="32">OPEN · THE CALL</text>
    <text class="t-q" x="32" y="52">What counts as asking the agent, so the work runs in every mode?</text>
  </g>

  <g id="options">
    <rect class="rec" x="212" y="76" width="348" height="46" rx="5"/>
    <text class="t-tag c-code" x="228" y="93">RECOMMENDED</text>
    <text class="t-h c-code" x="228" y="112">A handle the app names for its agent</text>
    <rect class="lost" x="576" y="76" width="348" height="46" rx="5"/>
    <text class="t-tag c-mute" x="592" y="93">THE OTHER OPTION</text>
    <text class="t-h c-lost" x="592" y="112">The coordinator&#x27;s own user, mentioned</text>
  </g>

  <g id="row-decides">
    <rect class="decide" x="16" y="134" width="908" height="62" rx="4"/>
    <rect class="bar" x="16" y="134" width="4" height="62"/>
    <text class="t-lbl" x="32" y="156">OFF, AND A</text>
    <text class="t-lbl" x="32" y="169">MENTION OF A PERSON</text>
    <text class="t-tag c-acc" x="32" y="186">▸ DECIDES IT</text>
    <text class="mark plus" x="228" y="162">+</text>
    <text class="t-b" x="248" y="161">Runs nothing</text>
    <text class="t-s" x="248" y="179">a person&#x27;s mention is not an ask</text>
    <text class="mark minus" x="592" y="162">−</text>
    <text class="t-b" x="612" y="161">Runs work</text>
    <text class="t-s" x="612" y="179">even with inferred work off</text>
  </g>
  <g id="row-1">
    <text class="t-lbl" x="32" y="222">TWO USERS, ONE REPO</text>
    <text class="mark minus" x="228" y="224">−</text>
    <text class="t-b" x="248" y="223">Both coordinators act</text>
    <text class="t-s" x="248" y="241">nothing crosses users to pick one</text>
    <text class="mark plus" x="592" y="224">+</text>
    <text class="t-b" x="612" y="223">Only the user named acts</text>
    <text class="t-s" x="612" y="241">one handle, one coordinator</text>
    <line class="row" x1="16" y1="256" x2="924" y2="256"/>
  </g>
  <g id="row-2">
    <text class="t-lbl" x="32" y="280">SETUP</text>
    <text class="mark minus" x="228" y="282">−</text>
    <text class="t-b" x="248" y="281">The app names a handle</text>
    <text class="t-s" x="248" y="299">per provider, as it names trusted bots</text>
    <text class="mark plus" x="592" y="282">+</text>
    <text class="t-b" x="612" y="281">Nothing new</text>
    <text class="t-s" x="612" y="299">the provider already says who the user is</text>
    <line class="row" x1="16" y1="314" x2="924" y2="314"/>
  </g>

  <g id="locks-in">
    <rect class="foot" x="16" y="340" width="446" height="74" rx="5"/>
    <text class="t-lbl" x="32" y="361">IF IT IS WRONG</text>
    <text class="t-b" x="32" y="381">A team that mentions its agent gets it twice</text>
    <text class="t-s" x="32" y="399">when two people&#x27;s coordinators follow the repo</text>
  </g>

  <g id="flips-if">
    <rect class="foot" x="478" y="340" width="446" height="74" rx="5"/>
    <text class="t-lbl" x="494" y="361">WHAT WOULD CHANGE MY MIND</text>
    <text class="t-b" x="494" y="381">Teams run several coordinators on one repo</text>
    <text class="t-s" x="494" y="399">then the user&#x27;s own mention, or a handle each</text>
  </g>
</svg>
