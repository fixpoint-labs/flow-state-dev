<svg viewBox="0 0 940 418" role="img" aria-label="D2, what counts as a short answer. Chosen: the right answer in 50 words or fewer, by count. Instead of: a model judge rating it well sized. It comes down to gaming: a count plus a held-out fact cannot be passed by an empty short reply, while a judge drifts and needs its own control. Price: padding under 50 words passes. No model call. Locks in 50 words and the fixture&#x27;s fact. Flips if short replies read as curt to users."
     xmlns="http://www.w3.org/2000/svg">
  <style>
    :root { --surface:#FCFCFA; --surface-2:#E8E8E1; --ink:#191C21; --ink-2:#4C535B; --ink-3:#7A828B;
            --rule:#D5D4CB; --accent:#3E4E8C; --accent-soft:#E0E3F0; --code:#2C7C69; --code-soft:#DCEDE7;
            --gone:#A9544F; }
    @media (prefers-color-scheme: dark) {
      :root { --surface:#181C1F; --surface-2:#202528; --ink:#E6E8E5; --ink-2:#A4ACB1; --ink-3:#737B81;
              --rule:#2B3135; --accent:#8B9BD8; --accent-soft:#1B2140; --code:#5DBBA1; --code-soft:#14302A;
              --gone:#DE8A84; } }
    .bg     { fill:var(--surface); }
    .ask    { fill:var(--surface-2); }
    .chosen { fill:var(--code-soft); stroke:var(--code); stroke-width:1.6; }
    .rec    { fill:var(--code-soft); stroke:var(--code); stroke-width:1.6; stroke-dasharray:5 4; }
    .lost   { fill:var(--surface); stroke:var(--rule); stroke-width:1.4; stroke-dasharray:5 4; }
    .decide { fill:var(--accent-soft); }
    .bar    { fill:var(--accent); }
    .row    { stroke:var(--rule); stroke-width:1; }
    .foot   { fill:var(--surface-2); }
    .t-lbl  { fill:var(--ink-3); font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:9.5px; letter-spacing:.1em; }
    .t-tag  { font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:9.5px; letter-spacing:.1em; font-weight:600; }
    .t-q    { fill:var(--ink); font-family:system-ui,-apple-system,sans-serif; font-weight:600; font-size:15px; }
    .t-h    { font-family:system-ui,-apple-system,sans-serif; font-weight:600; font-size:14px; }
    .t-b    { fill:var(--ink); font-family:system-ui,-apple-system,sans-serif; font-size:12.5px; }
    .t-s    { fill:var(--ink-2); font-family:system-ui,-apple-system,sans-serif; font-size:11px; }
    .mark   { font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:16px; font-weight:700; }
    .plus   { fill:var(--code); }
    .minus  { fill:var(--gone); }
    .tie    { fill:var(--ink-3); }
    .c-code { fill:var(--code); }
    .c-mute { fill:var(--ink-3); }
    .c-lost { fill:var(--ink-2); }
    .c-acc  { fill:var(--accent); }
  </style>
  <rect class="bg" x="0" y="0" width="940" height="418"/>
  <g id="the-call"><rect class="ask" x="16" y="14" width="908" height="48" rx="6"/><text class="t-lbl" x="32" y="32">D2 · THE CALL</text><text class="t-q" x="32" y="52">What counts as a short answer to a one-line question?</text></g>
  <g id="options">
    <rect class="chosen" x="212" y="76" width="348" height="46" rx="5"/><text class="t-tag c-code" x="228" y="93">CHOSEN</text><text class="t-h c-code" x="228" y="112">The right answer, in 50 words or fewer</text>
    <rect class="lost" x="576" y="76" width="348" height="46" rx="5"/><text class="t-tag c-mute" x="592" y="93">INSTEAD OF</text><text class="t-h c-lost" x="592" y="112">A model judge rates it well sized</text>
  </g>
  <g id="row-1"><rect class="decide" x="16" y="134" width="908" height="62" rx="4"/><rect class="bar" x="16" y="134" width="4" height="62"/><text class="t-lbl" x="32" y="156">CAN IT</text><text class="t-lbl" x="32" y="169">BE GAMED</text><text class="t-tag c-acc" x="32" y="186">▸ DECIDES IT</text><text class="mark plus" x="228" y="161">+</text><text class="t-b" x="248" y="160">No: a count and a fact</text><text class="t-s" x="248" y="178">an empty short reply fails</text><text class="mark minus" x="592" y="161">−</text><text class="t-b" x="612" y="160">A judge drifts</text><text class="t-s" x="612" y="178">and needs its own control</text></g>
  <g id="row-2"><text class="t-lbl" x="32" y="217">WHAT IT</text><text class="t-lbl" x="32" y="230">MISSES</text><text class="mark minus" x="228" y="222">−</text><text class="t-b" x="248" y="221">Padding under 50 words</text><text class="t-s" x="248" y="239">a terse wrong tone passes</text><text class="mark plus" x="592" y="222">+</text><text class="t-b" x="612" y="221">Tone and fit</text><text class="t-s" x="612" y="239">reads the answer as a person</text><line class="row" x1="16" y1="254" x2="924" y2="254"/></g>
  <g id="row-3"><text class="t-lbl" x="32" y="275">COST</text><text class="t-lbl" x="32" y="288">PER RUN</text><text class="mark plus" x="228" y="280">+</text><text class="t-b" x="248" y="279">None</text><text class="t-s" x="248" y="297">no model call</text><text class="mark minus" x="592" y="280">−</text><text class="t-b" x="612" y="279">One more call</text><text class="t-s" x="612" y="297">times 3 runs times 4 apps</text><line class="row" x1="16" y1="312" x2="924" y2="312"/></g>
  <g id="locks-in"><rect class="foot" x="16" y="328" width="446" height="74" rx="5"/><text class="t-lbl" x="32" y="349">LOCKS IN</text><text class="t-b" x="32" y="369">50 words, and the fixture&#x27;s fact</text><text class="t-s" x="32" y="387">the threshold is in goal.md</text></g>
  <g id="flips-if"><rect class="foot" x="478" y="328" width="446" height="74" rx="5"/><text class="t-lbl" x="494" y="349">FLIPS IF</text><text class="t-b" x="494" y="369">Short replies read as curt to users</text><text class="t-s" x="494" y="387">then the bar is a judge, not a count</text></g>
</svg>
