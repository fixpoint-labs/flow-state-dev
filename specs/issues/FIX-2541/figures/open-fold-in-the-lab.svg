<svg viewBox="0 0 940 418" role="img" aria-label="Open question: the Claude Code-style lab has no summary fold to switch on, so the cut run cannot test the summary there. Recommended: decide the summary&#x27;s cut on Teammates alone, and run the lab at the wrap. Or: add today&#x27;s fold to the lab for the run. It comes down to whether the cut run can cut it at all: both can, the second by patching a fold into an app that never shipped one. The wrap is the same either way. Flips if the two labs fold differently by design."
     xmlns="http://www.w3.org/2000/svg">
  <style>
    :root { --surface:#FCFCFA; --surface-2:#E8E8E1; --ink:#191C21; --ink-2:#4C535B; --ink-3:#7A828B;
            --rule:#D5D4CB; --accent:#3E4E8C; --accent-soft:#E0E3F0; --code:#2C7C69; --code-soft:#DCEDE7;
            --gone:#A9544F; }
    @media (prefers-color-scheme: dark) {
      :root { --surface:#181C1F; --surface-2:#202528; --ink:#E6E8E5; --ink-2:#A4ACB1; --ink-3:#737B81;
              --rule:#2B3135; --accent:#8B9BD8; --accent-soft:#1B2140; --code:#5DBBA1; --code-soft:#14302A;
              --gone:#DE8A84; } }
    .bg     { fill:var(--surface); }
    .ask    { fill:var(--surface-2); }
    .chosen { fill:var(--code-soft); stroke:var(--code); stroke-width:1.6; }
    .rec    { fill:var(--code-soft); stroke:var(--code); stroke-width:1.6; stroke-dasharray:5 4; }
    .lost   { fill:var(--surface); stroke:var(--rule); stroke-width:1.4; stroke-dasharray:5 4; }
    .decide { fill:var(--accent-soft); }
    .bar    { fill:var(--accent); }
    .row    { stroke:var(--rule); stroke-width:1; }
    .foot   { fill:var(--surface-2); }
    .t-lbl  { fill:var(--ink-3); font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:9.5px; letter-spacing:.1em; }
    .t-tag  { font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:9.5px; letter-spacing:.1em; font-weight:600; }
    .t-q    { fill:var(--ink); font-family:system-ui,-apple-system,sans-serif; font-weight:600; font-size:15px; }
    .t-h    { font-family:system-ui,-apple-system,sans-serif; font-weight:600; font-size:14px; }
    .t-b    { fill:var(--ink); font-family:system-ui,-apple-system,sans-serif; font-size:12.5px; }
    .t-s    { fill:var(--ink-2); font-family:system-ui,-apple-system,sans-serif; font-size:11px; }
    .mark   { font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:16px; font-weight:700; }
    .plus   { fill:var(--code); }
    .minus  { fill:var(--gone); }
    .tie    { fill:var(--ink-3); }
    .c-code { fill:var(--code); }
    .c-mute { fill:var(--ink-3); }
    .c-lost { fill:var(--ink-2); }
    .c-acc  { fill:var(--accent); }
  </style>
  <rect class="bg" x="0" y="0" width="940" height="418"/>
  <g id="the-call"><rect class="ask" x="16" y="14" width="908" height="48" rx="6"/><text class="t-lbl" x="32" y="32">OPEN · THE CALL</text><text class="t-q" x="32" y="52">The Claude Code-style lab has no fold to switch on. What does the cut run do?</text></g>
  <g id="options">
    <rect class="rec" x="212" y="76" width="348" height="46" rx="5"/><text class="t-tag c-code" x="228" y="93">RECOMMENDED</text><text class="t-h c-code" x="228" y="112">Cut the summary on Teammates alone</text>
    <rect class="lost" x="576" y="76" width="348" height="46" rx="5"/><text class="t-tag c-mute" x="592" y="93">OR</text><text class="t-h c-lost" x="592" y="112">Add today&#x27;s fold to the lab for the run</text>
  </g>
  <g id="row-1"><rect class="decide" x="16" y="134" width="908" height="62" rx="4"/><rect class="bar" x="16" y="134" width="4" height="62"/><text class="t-lbl" x="32" y="156">WHAT THE</text><text class="t-lbl" x="32" y="169">SCRIPT DOES</text><text class="t-tag c-acc" x="32" y="186">▸ DECIDES IT</text><text class="mark plus" x="228" y="161">+</text><text class="t-b" x="248" y="160">Nothing new</text><text class="t-s" x="248" y="178">reads the fold Teammates has</text><text class="mark minus" x="592" y="161">−</text><text class="t-b" x="612" y="160">Patches an app</text><text class="t-s" x="612" y="178">a fold the lab never shipped</text></g>
  <g id="row-2"><text class="t-lbl" x="32" y="217">WHERE THE</text><text class="t-lbl" x="32" y="230">CUT IS READ</text><text class="mark minus" x="228" y="222">−</text><text class="t-b" x="248" y="221">One lab</text><text class="t-s" x="248" y="239">the other lab runs it at the wrap only</text><text class="mark plus" x="592" y="222">+</text><text class="t-b" x="612" y="221">Both labs</text><text class="t-s" x="612" y="239">after a change to the lab</text><line class="row" x1="16" y1="254" x2="924" y2="254"/></g>
  <g id="row-3"><text class="t-lbl" x="32" y="275">THE WRAP</text><text class="t-lbl" x="32" y="288"></text><text class="mark tie" x="228" y="280">=</text><text class="t-b" x="248" y="279">Both labs, 3 of 3</text><text class="t-s" x="248" y="297">FIX-2500&#x27;s default must carry it</text><text class="mark tie" x="592" y="280">=</text><text class="t-b" x="612" y="279">Both labs, 3 of 3</text><text class="t-s" x="612" y="297">the same</text><line class="row" x1="16" y1="312" x2="924" y2="312"/></g>
  <g id="locks-in"><rect class="foot" x="16" y="328" width="446" height="74" rx="5"/><text class="t-lbl" x="32" y="349">LOCKS IN</text><text class="t-b" x="32" y="369">D1 reads the fold ask in Teammates</text><text class="t-s" x="32" y="387">for the cut run only</text></g>
  <g id="flips-if"><rect class="foot" x="478" y="328" width="446" height="74" rx="5"/><text class="t-lbl" x="494" y="349">FLIPS IF</text><text class="t-b" x="494" y="369">The labs fold differently by design</text><text class="t-s" x="494" y="387">then each lab needs its own cut</text></g>
</svg>
