<svg viewBox="0 0 940 454" role="img" aria-label="The closure&#x27;s goal check: seven asks down the side, four apps across. Every ask runs 3 times in every app, except the fold ask, which runs in the two labs only: 26 ask and app cells, 78 runs a pass. The same scripts run three times: the control on pre-bug main 0df5c85, where each ask must fail at least once; the cut run on main after the six bug fixes, where an ask that passes in every app cuts its layer; and the wrap on main after every child, where every ask passes with no switch set."
     xmlns="http://www.w3.org/2000/svg">
  <style>
    :root { --surface:#FCFCFA; --surface-2:#E8E8E1; --ink:#191C21; --ink-2:#4C535B; --ink-3:#7A828B;
            --rule:#D5D4CB; --accent:#3E4E8C; --accent-soft:#E0E3F0; --code:#2C7C69; --code-soft:#DCEDE7;
            --gone:#A9544F; }
    @media (prefers-color-scheme: dark) {
      :root { --surface:#181C1F; --surface-2:#202528; --ink:#E6E8E5; --ink-2:#A4ACB1; --ink-3:#737B81;
              --rule:#2B3135; --accent:#8B9BD8; --accent-soft:#1B2140; --code:#5DBBA1; --code-soft:#14302A;
              --gone:#DE8A84; } }
    .bg     { fill:var(--surface); }
    .ask    { fill:var(--surface-2); }
    .chosen { fill:var(--code-soft); stroke:var(--code); stroke-width:1.6; }
    .rec    { fill:var(--code-soft); stroke:var(--code); stroke-width:1.6; stroke-dasharray:5 4; }
    .lost   { fill:var(--surface); stroke:var(--rule); stroke-width:1.4; stroke-dasharray:5 4; }
    .decide { fill:var(--accent-soft); }
    .bar    { fill:var(--accent); }
    .row    { stroke:var(--rule); stroke-width:1; }
    .foot   { fill:var(--surface-2); }
    .t-lbl  { fill:var(--ink-3); font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:9.5px; letter-spacing:.1em; }
    .t-tag  { font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:9.5px; letter-spacing:.1em; font-weight:600; }
    .t-q    { fill:var(--ink); font-family:system-ui,-apple-system,sans-serif; font-weight:600; font-size:15px; }
    .t-h    { font-family:system-ui,-apple-system,sans-serif; font-weight:600; font-size:14px; }
    .t-b    { fill:var(--ink); font-family:system-ui,-apple-system,sans-serif; font-size:12.5px; }
    .t-s    { fill:var(--ink-2); font-family:system-ui,-apple-system,sans-serif; font-size:11px; }
    .mark   { font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:16px; font-weight:700; }
    .plus   { fill:var(--code); }
    .minus  { fill:var(--gone); }
    .tie    { fill:var(--ink-3); }
    .c-code { fill:var(--code); }
    .c-mute { fill:var(--ink-3); }
    .c-lost { fill:var(--ink-2); }
    .c-acc  { fill:var(--accent); }
  </style>
  <rect class="bg" x="0" y="0" width="940" height="454"/>
  <g id="title"><text class="t-lbl" x="32" y="32">FIX-2541 · THE CLOSURE&#x27;S GOAL CHECK</text><text class="t-q" x="32" y="54">Seven asks, four apps, 3 runs each, run three times</text></g>
  <g id="grid"><text class="t-lbl" x="375" y="88" text-anchor="middle">CLAUDE CODE-STYLE LAB</text><text class="t-lbl" x="525" y="88" text-anchor="middle">TEAMMATES LAB</text><text class="t-lbl" x="675" y="88" text-anchor="middle">KITCHEN SINK</text><text class="t-lbl" x="825" y="88" text-anchor="middle">SHIFT MANAGER</text><line class="row" x1="16" y1="100" x2="924" y2="100"/><text class="t-h" x="32" y="116" style="fill:var(--ink)">Date</text><text class="t-s" x="32" y="130">states today, from the run&#x27;s clock</text><rect class="chosen" x="335" y="108" width="80" height="20" rx="4"/><text class="t-tag c-code" x="375" y="122" text-anchor="middle">3 RUNS</text><rect class="chosen" x="485" y="108" width="80" height="20" rx="4"/><text class="t-tag c-code" x="525" y="122" text-anchor="middle">3 RUNS</text><rect class="chosen" x="635" y="108" width="80" height="20" rx="4"/><text class="t-tag c-code" x="675" y="122" text-anchor="middle">3 RUNS</text><rect class="chosen" x="785" y="108" width="80" height="20" rx="4"/><text class="t-tag c-code" x="825" y="122" text-anchor="middle">3 RUNS</text><line class="row" x1="16" y1="136" x2="924" y2="136"/><text class="t-h" x="32" y="152" style="fill:var(--ink)">Multi-file</text><text class="t-s" x="32" y="166">values from several files, one turn</text><rect class="chosen" x="335" y="144" width="80" height="20" rx="4"/><text class="t-tag c-code" x="375" y="158" text-anchor="middle">3 RUNS</text><rect class="chosen" x="485" y="144" width="80" height="20" rx="4"/><text class="t-tag c-code" x="525" y="158" text-anchor="middle">3 RUNS</text><rect class="chosen" x="635" y="144" width="80" height="20" rx="4"/><text class="t-tag c-code" x="675" y="158" text-anchor="middle">3 RUNS</text><rect class="chosen" x="785" y="144" width="80" height="20" rx="4"/><text class="t-tag c-code" x="825" y="158" text-anchor="middle">3 RUNS</text><line class="row" x1="16" y1="172" x2="924" y2="172"/><text class="t-h" x="32" y="188" style="fill:var(--ink)">Coder</text><text class="t-s" x="32" y="202">names its checks; each one ran</text><rect class="chosen" x="335" y="180" width="80" height="20" rx="4"/><text class="t-tag c-code" x="375" y="194" text-anchor="middle">3 RUNS</text><rect class="chosen" x="485" y="180" width="80" height="20" rx="4"/><text class="t-tag c-code" x="525" y="194" text-anchor="middle">3 RUNS</text><rect class="chosen" x="635" y="180" width="80" height="20" rx="4"/><text class="t-tag c-code" x="675" y="194" text-anchor="middle">3 RUNS</text><rect class="chosen" x="785" y="180" width="80" height="20" rx="4"/><text class="t-tag c-code" x="825" y="194" text-anchor="middle">3 RUNS</text><line class="row" x1="16" y1="208" x2="924" y2="208"/><text class="t-h" x="32" y="224" style="fill:var(--ink)">Knowledge</text><text class="t-s" x="32" y="238">cites a source it looked up</text><rect class="chosen" x="335" y="216" width="80" height="20" rx="4"/><text class="t-tag c-code" x="375" y="230" text-anchor="middle">3 RUNS</text><rect class="chosen" x="485" y="216" width="80" height="20" rx="4"/><text class="t-tag c-code" x="525" y="230" text-anchor="middle">3 RUNS</text><rect class="chosen" x="635" y="216" width="80" height="20" rx="4"/><text class="t-tag c-code" x="675" y="230" text-anchor="middle">3 RUNS</text><rect class="chosen" x="785" y="216" width="80" height="20" rx="4"/><text class="t-tag c-code" x="825" y="230" text-anchor="middle">3 RUNS</text><line class="row" x1="16" y1="244" x2="924" y2="244"/><text class="t-h" x="32" y="260" style="fill:var(--ink)">Sizing</text><text class="t-s" x="32" y="274">the right answer in 50 words</text><rect class="chosen" x="335" y="252" width="80" height="20" rx="4"/><text class="t-tag c-code" x="375" y="266" text-anchor="middle">3 RUNS</text><rect class="chosen" x="485" y="252" width="80" height="20" rx="4"/><text class="t-tag c-code" x="525" y="266" text-anchor="middle">3 RUNS</text><rect class="chosen" x="635" y="252" width="80" height="20" rx="4"/><text class="t-tag c-code" x="675" y="266" text-anchor="middle">3 RUNS</text><rect class="chosen" x="785" y="252" width="80" height="20" rx="4"/><text class="t-tag c-code" x="825" y="266" text-anchor="middle">3 RUNS</text><line class="row" x1="16" y1="280" x2="924" y2="280"/><text class="t-h" x="32" y="296" style="fill:var(--ink)">Skill</text><text class="t-s" x="32" y="310">loads a held skill without a slash</text><rect class="chosen" x="335" y="288" width="80" height="20" rx="4"/><text class="t-tag c-code" x="375" y="302" text-anchor="middle">3 RUNS</text><rect class="chosen" x="485" y="288" width="80" height="20" rx="4"/><text class="t-tag c-code" x="525" y="302" text-anchor="middle">3 RUNS</text><rect class="chosen" x="635" y="288" width="80" height="20" rx="4"/><text class="t-tag c-code" x="675" y="302" text-anchor="middle">3 RUNS</text><rect class="chosen" x="785" y="288" width="80" height="20" rx="4"/><text class="t-tag c-code" x="825" y="302" text-anchor="middle">3 RUNS</text><line class="row" x1="16" y1="316" x2="924" y2="316"/><text class="t-h" x="32" y="332" style="fill:var(--ink)">Fold</text><text class="t-s" x="32" y="346">keeps a decision across a fold</text><rect class="chosen" x="335" y="324" width="80" height="20" rx="4"/><text class="t-tag c-code" x="375" y="338" text-anchor="middle">3 RUNS</text><rect class="chosen" x="485" y="324" width="80" height="20" rx="4"/><text class="t-tag c-code" x="525" y="338" text-anchor="middle">3 RUNS</text><rect class="lost" x="635" y="324" width="80" height="20" rx="4"/><text class="t-tag c-mute" x="675" y="338" text-anchor="middle">NOT RUN</text><rect class="lost" x="785" y="324" width="80" height="20" rx="4"/><text class="t-tag c-mute" x="825" y="338" text-anchor="middle">NOT RUN</text><line class="row" x1="16" y1="352" x2="924" y2="352"/></g>
  <g id="passes"><rect class="foot" x="16" y="368" width="296" height="70" rx="5"/><text class="t-lbl" x="32" y="388">CONTROL</text><text class="t-b" x="32" y="408">Pre-bug main, 0df5c85</text><text class="t-s" x="32" y="426">each ask must fail at least once</text><rect class="foot" x="322" y="368" width="296" height="70" rx="5"/><text class="t-lbl" x="338" y="388">CUT RUN</text><text class="t-b" x="338" y="408">Main after the six bugs</text><text class="t-s" x="338" y="426">an ask that passes everywhere cuts its layer</text><rect class="decide" x="628" y="368" width="296" height="70" rx="5"/><text class="t-lbl" x="644" y="388">WRAP</text><text class="t-b" x="644" y="408">Main after every child</text><text class="t-s" x="644" y="426">every ask passes; no switch set</text></g>
</svg>
