<svg viewBox="0 0 940 584" role="img" aria-label="The closure manifest as a grid. Six Not done if rows down the side; across the top, where each is checked: a workspace ratchet run strictly on the tree, leg a the quick start, leg b tarball-only gaps, and leg c an app on the install. Surface: surface.root per failing package root in the ratchet column, eight owners, and surface.collisions in leg b, FIX-2449. One path: onepath.answer-task-stop, FIX-2450, and onepath.action-output, FIX-2455, both in leg c. First hour: firsthour.quickstart in leg a, FIX-2451. Leakage: leakage.tracker-ids in the ratchet column, FIX-2453. Shims: shims.unpublished-shapes in leg b, FIX-2454. Types: types.typed-handler, FIX-2457, and types.fresh-session-default, FIX-2554, both in leg c. Every cell starts at expect fail, and only its named owner flips it. A row passes when all its cells pass."
     xmlns="http://www.w3.org/2000/svg">
  <style>
    :root { --surface:#FCFCFA; --surface-2:#E8E8E1; --ink:#191C21; --ink-2:#4C535B; --ink-3:#7A828B;
            --rule:#D5D4CB; --accent:#3E4E8C; --accent-soft:#E0E3F0; --code:#2C7C69; --code-soft:#DCEDE7;
            --prose:#A8761C; --prose-soft:#F3E8D2; --gone:#A9544F; }
    @media (prefers-color-scheme: dark) {
      :root { --surface:#181C1F; --surface-2:#202528; --ink:#E6E8E5; --ink-2:#A4ACB1; --ink-3:#737B81;
              --rule:#2B3135; --accent:#8B9BD8; --accent-soft:#1B2140; --code:#5DBBA1; --code-soft:#14302A;
              --prose:#D9A44B; --prose-soft:#332612; --gone:#DE8A84; } }
    .bg    { fill:var(--surface); }
    .head  { fill:var(--surface-2); }
    .rule  { stroke:var(--rule); stroke-width:1; }
    .cell  { fill:var(--accent-soft); stroke:var(--accent); stroke-width:1.2; }
    .t-lbl { fill:var(--ink-3); font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:9.5px; letter-spacing:.1em; }
    .t-row { fill:var(--ink); font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:10.5px; font-weight:600; letter-spacing:.08em; }
    .t-q   { fill:var(--ink); font-family:system-ui,-apple-system,sans-serif; font-weight:600; font-size:15px; }
    .t-id  { fill:var(--ink); font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:10px; font-weight:600; }
    .t-s   { fill:var(--ink-2); font-family:system-ui,-apple-system,sans-serif; font-size:10.5px; }
    .t-fail { fill:var(--gone); font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:9.5px; font-weight:700; }
  </style>
  <rect class="bg" x="0" y="0" width="940" height="584"/>

  <g id="title">
    <rect class="head" x="16" y="14" width="908" height="36" rx="6"/>
    <text class="t-q" x="32" y="37">The manifest · six rows, where each is checked, who flips each cell</text>
  </g>

  <g id="columns">
    <text class="t-lbl" x="148" y="70">WORKSPACE RATCHET</text>
    <text class="t-s" x="148" y="84">strict run, on the tree</text>
    <text class="t-lbl" x="346" y="70">LEG A</text>
    <text class="t-s" x="346" y="84">the quick start</text>
    <text class="t-lbl" x="544" y="70">LEG B</text>
    <text class="t-s" x="544" y="84">tarball-only gaps</text>
    <text class="t-lbl" x="742" y="70">LEG C</text>
    <text class="t-s" x="742" y="84">an app on the install</text>
  </g>

  <g id="row-surface">
    <line class="rule" x1="16" y1="96" x2="924" y2="96"/>
    <text class="t-row" x="24" y="128">SURFACE</text>
    <rect class="cell" x="148" y="104" width="182" height="40" rx="4"/>
    <text class="t-id" x="156" y="120">surface.root.‹package›</text>
    <text class="t-s" x="156" y="135">per root · 8 owners below</text>
    <text class="t-fail" x="322" y="135" text-anchor="end">fail</text>
    <rect class="cell" x="544" y="104" width="182" height="40" rx="4"/>
    <text class="t-id" x="552" y="120">surface.collisions</text>
    <text class="t-s" x="552" y="135">engine root · FIX-2449</text>
    <text class="t-fail" x="718" y="135" text-anchor="end">fail</text>
  </g>
  <g id="row-one-path">
    <line class="rule" x1="16" y1="152" x2="924" y2="152"/>
    <text class="t-row" x="24" y="207">ONE PATH</text>
    <rect class="cell" x="742" y="160" width="182" height="40" rx="4"/>
    <text class="t-id" x="750" y="176">onepath.answer-task-stop</text>
    <text class="t-s" x="750" y="191">React · FIX-2450</text>
    <text class="t-fail" x="916" y="191" text-anchor="end">fail</text>
    <rect class="cell" x="742" y="206" width="182" height="40" rx="4"/>
    <text class="t-id" x="750" y="222">onepath.action-output</text>
    <text class="t-s" x="750" y="237">client · FIX-2455</text>
    <text class="t-fail" x="916" y="237" text-anchor="end">fail</text>
  </g>
  <g id="row-first-hour">
    <line class="rule" x1="16" y1="254" x2="924" y2="254"/>
    <text class="t-row" x="24" y="286">FIRST HOUR</text>
    <rect class="cell" x="346" y="262" width="182" height="40" rx="4"/>
    <text class="t-id" x="354" y="278">firsthour.quickstart</text>
    <text class="t-s" x="354" y="293">the docs · FIX-2451</text>
    <text class="t-fail" x="520" y="293" text-anchor="end">fail</text>
  </g>
  <g id="row-leakage">
    <line class="rule" x1="16" y1="310" x2="924" y2="310"/>
    <text class="t-row" x="24" y="342">LEAKAGE</text>
    <rect class="cell" x="148" y="318" width="182" height="40" rx="4"/>
    <text class="t-id" x="156" y="334">leakage.tracker-ids</text>
    <text class="t-s" x="156" y="349">the lint · FIX-2453</text>
    <text class="t-fail" x="322" y="349" text-anchor="end">fail</text>
  </g>
  <g id="row-shims">
    <line class="rule" x1="16" y1="366" x2="924" y2="366"/>
    <text class="t-row" x="24" y="398">SHIMS</text>
    <rect class="cell" x="544" y="374" width="182" height="40" rx="4"/>
    <text class="t-id" x="552" y="390">shims.unpublished-shapes</text>
    <text class="t-s" x="552" y="405">task store · FIX-2454</text>
    <text class="t-fail" x="718" y="405" text-anchor="end">fail</text>
  </g>
  <g id="row-types">
    <line class="rule" x1="16" y1="422" x2="924" y2="422"/>
    <text class="t-row" x="24" y="477">TYPES</text>
    <rect class="cell" x="742" y="430" width="182" height="40" rx="4"/>
    <text class="t-id" x="750" y="446">types.typed-handler</text>
    <text class="t-s" x="750" y="461">core types · FIX-2457</text>
    <text class="t-fail" x="916" y="461" text-anchor="end">fail</text>
    <rect class="cell" x="742" y="476" width="182" height="40" rx="4"/>
    <text class="t-id" x="750" y="492">types.fresh-session-default</text>
    <text class="t-s" x="750" y="507">scope state · FIX-2554</text>
    <text class="t-fail" x="916" y="507" text-anchor="end">fail</text>
  </g>

  <g id="foot">
    <line class="rule" x1="16" y1="524" x2="924" y2="524"/>
    <text class="t-s" x="24" y="548">Every cell starts at expect: fail, shown in red. Only the named child flips its cell; a row passes when all its cells do.</text>
    <text class="t-s" x="24" y="566">Surface owners: core 2448 · engine, client 2449 · react 2456 · orchestration, patterns 2459 · testing 2460 · harnesses 2458 · workforce 2463 · stores 2452 · other roots 2448</text>
  </g>
</svg>
