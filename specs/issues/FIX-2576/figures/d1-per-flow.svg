<svg viewBox="0 0 940 478" role="img" aria-label="D1, where block and capability scope schemas are reconciled. Chosen: each flow reconciles its own reachable blocks when it is defined. Instead of: one process-wide schema registry. It comes down to the first row: under a registry a session reads defaults another flow declared; per flow it reads only its own. Second row: a registry refuses two unrelated flows that share blocks; per flow they both define. Third row: a registry adds a name and an error to core&#x27;s root export; per flow adds nothing there. Locks in: the merged schema is internal to the flow. Flips if: something must read scope schemas with no flow loaded, such as a store migration or a devtool list."
     xmlns="http://www.w3.org/2000/svg">
  <style>
    :root { --surface:#FCFCFA; --surface-2:#E8E8E1; --ink:#191C21; --ink-2:#4C535B; --ink-3:#7A828B;
            --rule:#D5D4CB; --accent:#3E4E8C; --accent-soft:#E0E3F0; --code:#2C7C69; --code-soft:#DCEDE7;
            --gone:#A9544F; }
    @media (prefers-color-scheme: dark) {
      :root { --surface:#181C1F; --surface-2:#202528; --ink:#E6E8E5; --ink-2:#A4ACB1; --ink-3:#737B81;
              --rule:#2B3135; --accent:#8B9BD8; --accent-soft:#1B2140; --code:#5DBBA1; --code-soft:#14302A;
              --gone:#DE8A84; } }
    .bg     { fill:var(--surface); }
    .ask    { fill:var(--surface-2); }
    .chosen { fill:var(--code-soft); stroke:var(--code); stroke-width:1.6; }
    .lost   { fill:var(--surface); stroke:var(--rule); stroke-width:1.4; stroke-dasharray:5 4; }
    .decide { fill:var(--accent-soft); }
    .bar    { fill:var(--accent); }
    .row    { stroke:var(--rule); stroke-width:1; }
    .foot   { fill:var(--surface-2); }
    .t-lbl  { fill:var(--ink-3); font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:9.5px; letter-spacing:.1em; }
    .t-tag  { font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:9.5px; letter-spacing:.1em; font-weight:600; }
    .t-q    { fill:var(--ink); font-family:system-ui,-apple-system,sans-serif; font-weight:600; font-size:15px; }
    .t-h    { font-family:system-ui,-apple-system,sans-serif; font-weight:600; font-size:14px; }
    .t-b    { fill:var(--ink); font-family:system-ui,-apple-system,sans-serif; font-size:12.5px; }
    .t-s    { fill:var(--ink-2); font-family:system-ui,-apple-system,sans-serif; font-size:11px; }
    .mark   { font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:16px; font-weight:700; }
    .plus   { fill:var(--code); }
    .minus  { fill:var(--gone); }
    .tie    { fill:var(--ink-3); }
    .c-code { fill:var(--code); }
    .c-mute { fill:var(--ink-3); }
    .c-lost { fill:var(--ink-2); }
    .c-acc  { fill:var(--accent); }
  </style>
  <rect class="bg" x="0" y="0" width="940" height="478"/>

  <g id="the-call">
    <rect class="ask" x="16" y="14" width="908" height="48" rx="6"/>
    <text class="t-lbl" x="32" y="32">D1 · THE CALL</text>
    <text class="t-q" x="32" y="52">Where do a flow&#x27;s block and capability scope schemas get reconciled?</text>
  </g>

  <g id="options">
    <rect class="chosen" x="212" y="76" width="348" height="46" rx="5"/>
    <text class="t-tag c-code" x="228" y="93">CHOSEN</text>
    <text class="t-h c-code" x="228" y="112">Each flow, at defineFlow</text>
    <rect class="lost" x="576" y="76" width="348" height="46" rx="5"/>
    <text class="t-tag c-mute" x="592" y="93">INSTEAD OF</text>
    <text class="t-h c-lost" x="592" y="112">One process-wide registry</text>
  </g>

  <g id="row-0">
    <rect class="decide" x="16" y="134" width="908" height="62" rx="4"/>
    <rect class="bar" x="16" y="134" width="4" height="62"/>
    <text class="t-lbl" x="32" y="156">ANOTHER FLOW&#x27;S</text>
    <text class="t-lbl" x="32" y="169">DEFAULTS</text>
    <text class="t-tag c-acc" x="32" y="186">▸ DECIDES IT</text>
    <text class="mark plus" x="228" y="163">+</text>
    <text class="t-b" x="248" y="162">Never on this session</text>
    <text class="t-s" x="248" y="180">it reads only its own blocks</text>
    <text class="mark minus" x="592" y="163">−</text>
    <text class="t-b" x="612" y="162">Leak in</text>
    <text class="t-s" x="612" y="180">a chat-agent session fills 34 fields</text>
  </g>

  <g id="row-1">
    <text class="t-lbl" x="32" y="220">TWO FLOWS SHARE</text>
    <text class="t-lbl" x="32" y="233">A BLOCK</text>
    <text class="mark plus" x="228" y="227">+</text>
    <text class="t-b" x="248" y="226">Both define</text>
    <text class="t-s" x="248" y="244">a session belongs to one flow</text>
    <text class="mark minus" x="592" y="227">−</text>
    <text class="t-b" x="612" y="226">Refused</text>
    <text class="t-s" x="612" y="244">a false conflict, or stale under HMR</text>
    <line class="row" x1="16" y1="252" x2="924" y2="252"/>
  </g>

  <g id="row-2">
    <text class="t-lbl" x="32" y="278">CORE&#x27;S ROOT</text>
    <text class="t-lbl" x="32" y="291">EXPORT</text>
    <text class="mark plus" x="228" y="285">+</text>
    <text class="t-b" x="248" y="284">Nothing added</text>
    <text class="t-s" x="248" y="302">an internal field on the flow</text>
    <text class="mark minus" x="592" y="285">−</text>
    <text class="t-b" x="612" y="284">Registry and error</text>
    <text class="t-s" x="612" y="302">while the epic shrinks the root</text>
    <line class="row" x1="16" y1="310" x2="924" y2="310"/>
  </g>

  <g id="row-3">
    <text class="t-lbl" x="32" y="336">COST</text>
    <text class="mark tie" x="228" y="343">=</text>
    <text class="t-b" x="248" y="342">About 0.3 ms per defineFlow</text>
    <text class="t-s" x="248" y="360">fill: about 1 µs on a stored record</text>
    <text class="mark tie" x="592" y="343">=</text>
    <text class="t-b" x="612" y="342">About 0.3 ms per process</text>
    <text class="t-s" x="612" y="360">fill: about 50 µs on a fresh session</text>
    <line class="row" x1="16" y1="368" x2="924" y2="368"/>
  </g>

  <g id="locks-in">
    <rect class="foot" x="16" y="392" width="446" height="74" rx="5"/>
    <text class="t-lbl" x="32" y="413">LOCKS IN</text>
    <text class="t-b" x="32" y="433">The merged schema is the flow&#x27;s, not public</text>
    <text class="t-s" x="32" y="451">no registry name to export later</text>
  </g>

  <g id="flips-if">
    <rect class="foot" x="478" y="392" width="446" height="74" rx="5"/>
    <text class="t-lbl" x="494" y="413">FLIPS IF</text>
    <text class="t-b" x="494" y="433">A schema read with no flow loaded</text>
    <text class="t-s" x="494" y="451">then a server-owned registry, fed by this walk</text>
  </g>

</svg>
