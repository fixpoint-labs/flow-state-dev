<svg viewBox="0 0 940 420" role="img" aria-label="D3, how two flows on one server that type a shared user or org field differently are caught. Chosen: the server refuses to start, naming the field and both flows, when it admits its flows. Instead of: no cross-flow check, each flow checked alone. It comes down to the first row: two flows typing user theme as a string and a number refuse at startup instead of one flow failing its parse on a record the other wrote. Second row: session fields are per flow, so they are not compared. Third row: the cost is one comparison at startup. Locks in: a server that starts today can refuse to start after the upgrade. Flips if: hosts add flows after the server has started."
     xmlns="http://www.w3.org/2000/svg">
  <style>
    :root { --surface:#FCFCFA; --surface-2:#E8E8E1; --ink:#191C21; --ink-2:#4C535B; --ink-3:#7A828B;
            --rule:#D5D4CB; --accent:#3E4E8C; --accent-soft:#E0E3F0; --code:#2C7C69; --code-soft:#DCEDE7;
            --gone:#A9544F; }
    @media (prefers-color-scheme: dark) {
      :root { --surface:#181C1F; --surface-2:#202528; --ink:#E6E8E5; --ink-2:#A4ACB1; --ink-3:#737B81;
              --rule:#2B3135; --accent:#8B9BD8; --accent-soft:#1B2140; --code:#5DBBA1; --code-soft:#14302A;
              --gone:#DE8A84; } }
    .bg     { fill:var(--surface); }
    .ask    { fill:var(--surface-2); }
    .chosen { fill:var(--code-soft); stroke:var(--code); stroke-width:1.6; }
    .lost   { fill:var(--surface); stroke:var(--rule); stroke-width:1.4; stroke-dasharray:5 4; }
    .decide { fill:var(--accent-soft); }
    .bar    { fill:var(--accent); }
    .row    { stroke:var(--rule); stroke-width:1; }
    .foot   { fill:var(--surface-2); }
    .t-lbl  { fill:var(--ink-3); font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:9.5px; letter-spacing:.1em; }
    .t-tag  { font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:9.5px; letter-spacing:.1em; font-weight:600; }
    .t-q    { fill:var(--ink); font-family:system-ui,-apple-system,sans-serif; font-weight:600; font-size:15px; }
    .t-h    { font-family:system-ui,-apple-system,sans-serif; font-weight:600; font-size:14px; }
    .t-b    { fill:var(--ink); font-family:system-ui,-apple-system,sans-serif; font-size:12.5px; }
    .t-s    { fill:var(--ink-2); font-family:system-ui,-apple-system,sans-serif; font-size:11px; }
    .mark   { font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:16px; font-weight:700; }
    .plus   { fill:var(--code); }
    .minus  { fill:var(--gone); }
    .tie    { fill:var(--ink-3); }
    .c-code { fill:var(--code); }
    .c-mute { fill:var(--ink-3); }
    .c-lost { fill:var(--ink-2); }
    .c-acc  { fill:var(--accent); }
  </style>
  <rect class="bg" x="0" y="0" width="940" height="420"/>

  <g id="the-call">
    <rect class="ask" x="16" y="14" width="908" height="48" rx="6"/>
    <text class="t-lbl" x="32" y="32">D3 · THE CALL</text>
    <text class="t-q" x="32" y="52">Two flows on one server type a shared user field differently. When do we find out?</text>
  </g>

  <g id="options">
    <rect class="chosen" x="212" y="76" width="348" height="46" rx="5"/>
    <text class="t-tag c-code" x="228" y="93">CHOSEN</text>
    <text class="t-h c-code" x="228" y="112">At server start, both flows named</text>
    <rect class="lost" x="576" y="76" width="348" height="46" rx="5"/>
    <text class="t-tag c-mute" x="592" y="93">INSTEAD OF</text>
    <text class="t-h c-lost" x="592" y="112">Never: each flow checked alone</text>
  </g>

  <g id="row-0">
    <rect class="decide" x="16" y="134" width="908" height="62" rx="4"/>
    <rect class="bar" x="16" y="134" width="4" height="62"/>
    <text class="t-lbl" x="32" y="156">USER.THEME STRING</text>
    <text class="t-lbl" x="32" y="169">AND NUMBER</text>
    <text class="t-tag c-acc" x="32" y="186">▸ DECIDES IT</text>
    <text class="mark plus" x="228" y="163">+</text>
    <text class="t-b" x="248" y="162">The server does not start</text>
    <text class="t-s" x="248" y="180">the error names the field and both flows</text>
    <text class="mark minus" x="592" y="163">−</text>
    <text class="t-b" x="612" y="162">Found in production</text>
    <text class="t-s" x="612" y="180">one flow reads a value the other wrote</text>
  </g>

  <g id="row-1">
    <text class="t-lbl" x="32" y="220">SESSION</text>
    <text class="t-lbl" x="32" y="233">FIELDS</text>
    <text class="mark tie" x="228" y="227">=</text>
    <text class="t-b" x="248" y="226">Not compared</text>
    <text class="t-s" x="248" y="244">a session belongs to one flow</text>
    <text class="mark tie" x="592" y="227">=</text>
    <text class="t-b" x="612" y="226">Not compared</text>
    <text class="t-s" x="612" y="244">a session belongs to one flow</text>
    <line class="row" x1="16" y1="252" x2="924" y2="252"/>
  </g>

  <g id="row-2">
    <text class="t-lbl" x="32" y="278">COST</text>
    <text class="mark tie" x="228" y="285">=</text>
    <text class="t-b" x="248" y="284">One comparison at start</text>
    <text class="t-s" x="248" y="302">user and org schemas only</text>
    <text class="mark plus" x="592" y="285">+</text>
    <text class="t-b" x="612" y="284">None</text>
    <text class="t-s" x="612" y="302">no check</text>
    <line class="row" x1="16" y1="310" x2="924" y2="310"/>
  </g>

  <g id="locks-in">
    <rect class="foot" x="16" y="334" width="446" height="74" rx="5"/>
    <text class="t-lbl" x="32" y="355">LOCKS IN</text>
    <text class="t-b" x="32" y="375">A server can refuse to start after the upgrade</text>
    <text class="t-s" x="32" y="393">only when two flows really disagree</text>
  </g>

  <g id="flips-if">
    <rect class="foot" x="478" y="334" width="446" height="74" rx="5"/>
    <text class="t-lbl" x="494" y="355">FLIPS IF</text>
    <text class="t-b" x="494" y="375">Flows are added after the server starts</text>
    <text class="t-s" x="494" y="393">then the check runs at that registration</text>
  </g>

</svg>
