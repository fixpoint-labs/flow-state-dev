<svg viewBox="0 0 940 420" role="img" aria-label="D3, when the wait ships and what wakes it. Chosen: ship now, and read the PR on every wake. Instead of: wait for the webhook and poll issues. It comes down to the first row: shipping now stops PR tasks reading done today, while waiting leaves them wrong until those land. The price: until then a merged PR shows PR open until someone types. A second poll is not added either way. Locks in: a person&#x27;s line is the only wake until FIX-2535 or FIX-2536. Flips if those issues stall."
     xmlns="http://www.w3.org/2000/svg">
  <style>
    :root { --surface:#FCFCFA; --surface-2:#E8E8E1; --ink:#191C21; --ink-2:#4C535B; --ink-3:#7A828B;
            --rule:#D5D4CB; --accent:#3E4E8C; --accent-soft:#E0E3F0; --code:#2C7C69; --code-soft:#DCEDE7;
            --gone:#A9544F; }
    @media (prefers-color-scheme: dark) {
      :root { --surface:#181C1F; --surface-2:#202528; --ink:#E6E8E5; --ink-2:#A4ACB1; --ink-3:#737B81;
              --rule:#2B3135; --accent:#8B9BD8; --accent-soft:#1B2140; --code:#5DBBA1; --code-soft:#14302A;
              --gone:#DE8A84; } }
    .bg     { fill:var(--surface); }
    .ask    { fill:var(--surface-2); }
    .chosen { fill:var(--code-soft); stroke:var(--code); stroke-width:1.6; }
    .lost   { fill:var(--surface); stroke:var(--rule); stroke-width:1.4; stroke-dasharray:5 4; }
    .decide { fill:var(--accent-soft); }
    .bar    { fill:var(--accent); }
    .row    { stroke:var(--rule); stroke-width:1; }
    .foot   { fill:var(--surface-2); }
    .t-lbl  { fill:var(--ink-3); font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:9.5px; letter-spacing:.1em; }
    .t-tag  { font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:9.5px; letter-spacing:.1em; font-weight:600; }
    .t-q    { fill:var(--ink); font-family:system-ui,-apple-system,sans-serif; font-weight:600; font-size:15px; }
    .t-h    { font-family:system-ui,-apple-system,sans-serif; font-weight:600; font-size:14px; }
    .t-b    { fill:var(--ink); font-family:system-ui,-apple-system,sans-serif; font-size:12.5px; }
    .t-s    { fill:var(--ink-2); font-family:system-ui,-apple-system,sans-serif; font-size:11px; }
    .mark   { font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:16px; font-weight:700; }
    .plus   { fill:var(--code); }
    .minus  { fill:var(--gone); }
    .tie    { fill:var(--ink-3); }
    .c-code { fill:var(--code); }
    .c-mute { fill:var(--ink-3); }
    .c-lost { fill:var(--ink-2); }
    .c-acc  { fill:var(--accent); }
  </style>
  <rect class="bg" x="0" y="0" width="940" height="420"/>
  <g id="the-call"><rect class="ask" x="16" y="14" width="908" height="48" rx="6"/><text class="t-lbl" x="32" y="32">D3 · THE CALL</text><text class="t-q" x="32" y="52">Ship the wait now, or wait for GitHub&#x27;s events to arrive?</text></g>
  <g id="options"><rect class="chosen" x="212" y="76" width="348" height="46" rx="5"/><text class="t-tag c-code" x="228" y="93">CHOSEN</text><text class="t-h c-code" x="228" y="112">Ship now · read the PR on wake</text>
    <rect class="lost" x="576" y="76" width="348" height="46" rx="5"/><text class="t-tag c-mute" x="592" y="93">INSTEAD OF</text><text class="t-h c-lost" x="592" y="112">Wait for FIX-2535 and 2536</text></g>
  <g id="row-decides"><rect class="decide" x="16" y="134" width="908" height="62" rx="4"/><rect class="bar" x="16" y="134" width="4" height="62"/>
    <text class="t-lbl" x="32" y="156">A PR TASK</text><text class="t-lbl" x="32" y="169">TODAY</text>
    <text class="t-tag c-acc" x="32" y="186">▸ DECIDES IT</text>
    <text class="mark plus" x="228" y="162">+</text><text class="t-b" x="248" y="161">Stays open, shows the PR</text><text class="t-s" x="248" y="179">from the next run on main</text>
    <text class="mark minus" x="592" y="162">−</text><text class="t-b" x="612" y="161">Still reads done</text><text class="t-s" x="612" y="179">until both issues land</text>
  </g>
  <g id="row-1">
    <text class="t-lbl" x="32" y="222">A MERGED PR</text>
    <text class="mark minus" x="228" y="224">−</text><text class="t-b" x="248" y="223">Shows PR open until you type</text><text class="t-s" x="248" y="241">or until FIX-2535 lands</text>
    <text class="mark plus" x="592" y="224">+</text><text class="t-b" x="612" y="223">Settles itself</text><text class="t-s" x="612" y="241">the closing event wakes it</text>
    <line class="row" x1="16" y1="256" x2="924" y2="256"/>
  </g>
  <g id="row-2">
    <text class="t-lbl" x="32" y="280">A SECOND POLL</text>
    <text class="mark tie" x="228" y="282">=</text><text class="t-b" x="248" y="281">None</text><text class="t-s" x="248" y="299">wakes come from the feeds</text>
    <text class="mark tie" x="592" y="282">=</text><text class="t-b" x="612" y="281">None</text><text class="t-s" x="612" y="299">the same</text>
    <line class="row" x1="16" y1="314" x2="924" y2="314"/>
  </g>
  <g id="locks-in"><rect class="foot" x="16" y="330" width="446" height="74" rx="5"/><text class="t-lbl" x="32" y="351">LOCKS IN</text><text class="t-b" x="32" y="371">A typed line is the only wake, for now</text><text class="t-s" x="32" y="389">the thread says: merged? say so and I&#x27;ll check</text></g>
  <g id="flips-if"><rect class="foot" x="478" y="330" width="446" height="74" rx="5"/><text class="t-lbl" x="494" y="351">FLIPS IF</text><text class="t-b" x="494" y="371">FIX-2535 and FIX-2536 stall</text><text class="t-s" x="494" y="389">then a 30-minute hold due is the stopgap</text></g>
</svg>
