<svg viewBox="0 0 940 400" role="img" aria-label="Epic setup before and after. Before, three steps: discover the epic, then count active epics and at two ask hold this outcome or wrap another, then resume or create. After, two steps: discover, then resume or create. The middle step is removed. Below both columns, one box spans them: the per-wake worker cap, sized to the machine, unchanged."
     xmlns="http://www.w3.org/2000/svg">
  <style>
    :root { --surface:#FCFCFA; --surface-2:#E8E8E1; --ink:#191C21; --ink-2:#4C535B; --ink-3:#7A828B;
            --rule:#D5D4CB; --accent:#3E4E8C; --accent-soft:#E0E3F0; --code:#2C7C69; --code-soft:#DCEDE7;
            --gone:#A9544F; }
    @media (prefers-color-scheme: dark) {
      :root { --surface:#181C1F; --surface-2:#202528; --ink:#E6E8E5; --ink-2:#A4ACB1; --ink-3:#737B81;
              --rule:#2B3135; --accent:#8B9BD8; --accent-soft:#1B2140; --code:#5DBBA1; --code-soft:#14302A;
              --gone:#DE8A84; } }
    .bg    { fill:var(--surface); }
    .n-box { fill:var(--surface); stroke:var(--rule); stroke-width:1.2; }
    .keep  { fill:var(--code-soft); stroke:var(--code); stroke-width:1.4; }
    .gone  { fill:var(--surface); stroke:var(--gone); stroke-width:1.4; stroke-dasharray:5 4; }
    .work  { fill:var(--accent-soft); stroke:var(--accent); stroke-width:1.4; }
    .arrow { stroke:var(--ink-3); stroke-width:1.4; fill:none; }
    .head  { fill:var(--ink-3); }
    .t-lbl { fill:var(--ink-3); font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:9.5px; letter-spacing:.1em; }
    .t-col { fill:var(--ink); font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:11px; letter-spacing:.12em; font-weight:600; }
    .t-b   { fill:var(--ink); font-family:system-ui,-apple-system,sans-serif; font-weight:600; font-size:13px; }
    .t-s   { fill:var(--ink-2); font-family:system-ui,-apple-system,sans-serif; font-size:11px; }
    .t-x   { fill:var(--gone); font-family:system-ui,-apple-system,sans-serif; font-weight:600; font-size:13px; text-decoration:line-through; }
    .t-g   { fill:var(--gone); font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:9.5px; letter-spacing:.1em; font-weight:600; }
    .t-a   { fill:var(--accent); font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:9.5px; letter-spacing:.1em; font-weight:600; }
  </style>
  <rect class="bg" x="0" y="0" width="940" height="400"/>

  <g id="before">
    <text class="t-col" x="32" y="34">BEFORE · EPIC SETUP</text>
    <rect class="keep" x="32" y="50" width="400" height="52" rx="5"/>
    <text class="t-lbl" x="48" y="68">1 · DISCOVER</text>
    <text class="t-b" x="48" y="89">Find an existing epic for this outcome</text>
    <path class="arrow" d="M232 102 V118"/><path class="head" d="M227 116 L232 124 L237 116 Z"/>
    <rect class="gone" x="32" y="126" width="400" height="66" rx="5"/>
    <text class="t-g" x="48" y="144">2 · CAP — REMOVED</text>
    <text class="t-x" x="48" y="164">Count active epics; at two, stop</text>
    <text class="t-s" x="48" y="182">ask: hold this outcome, or wrap another?</text>
    <path class="arrow" d="M232 192 V208"/><path class="head" d="M227 206 L232 214 L237 206 Z"/>
    <rect class="keep" x="32" y="216" width="400" height="52" rx="5"/>
    <text class="t-lbl" x="48" y="234">3 · RESUME OR CREATE</text>
    <text class="t-b" x="48" y="255">Only after the question is answered</text>
  </g>

  <g id="after">
    <text class="t-col" x="508" y="34">AFTER · EPIC SETUP</text>
    <rect class="keep" x="508" y="50" width="400" height="52" rx="5"/>
    <text class="t-lbl" x="524" y="68">1 · DISCOVER</text>
    <text class="t-b" x="524" y="89">Find an existing epic for this outcome</text>
    <path class="arrow" d="M708 102 V208"/><path class="head" d="M703 206 L708 214 L713 206 Z"/>
    <text class="t-s" x="720" y="162">no count, no question</text>
    <rect class="keep" x="508" y="216" width="400" height="52" rx="5"/>
    <text class="t-lbl" x="524" y="234">2 · RESUME OR CREATE</text>
    <text class="t-b" x="524" y="255">The epic starts</text>
  </g>

  <g id="worker-cap">
    <rect class="work" x="32" y="300" width="876" height="78" rx="5"/>
    <text class="t-a" x="48" y="322">EVERY WAKE · UNCHANGED IN BOTH</text>
    <text class="t-b" x="48" y="344">The per-wake worker cap: how many worktrees run at once on one machine</text>
    <text class="t-s" x="48" y="364">the cap argument of epic-wake, and "Sizing to the VM" in epic-lifecycle</text>
  </g>
</svg>
