<svg viewBox="0 0 940 414" role="img" aria-label="Before: six places a vocabulary rule is written, each read by a different check or by nobody: goal.md prose, rules.mjs, the guard&#x27;s term and exception lists, GLOSSARY_TERMS, the side-chain check&#x27;s name sets, and Linear issues. After: one glossary module under docs/contributing holds every term, the words it retires, how far each reaches, its exemptions and its decision. The sweep, the Workforce guard and the side-chain check import it and keep only how they walk and match files. goal.md and the skills point to it."
     xmlns="http://www.w3.org/2000/svg">
  <style>
    :root { --surface:#FCFCFA; --surface-2:#E8E8E1; --ink:#191C21; --ink-2:#4C535B; --ink-3:#7A828B;
            --rule:#D5D4CB; --accent:#3E4E8C; --accent-soft:#E0E3F0; --code:#2C7C69; --code-soft:#DCEDE7;
            --prose:#A8761C; --prose-soft:#F3E8D2; --gone:#A9544F; --gone-soft:#F2E1DF; }
    @media (prefers-color-scheme: dark) {
      :root { --surface:#181C1F; --surface-2:#202528; --ink:#E6E8E5; --ink-2:#A4ACB1; --ink-3:#737B81;
              --rule:#2B3135; --accent:#8B9BD8; --accent-soft:#1B2140; --code:#5DBBA1; --code-soft:#14302A;
              --prose:#D9A44B; --prose-soft:#332612; --gone:#DE8A84; --gone-soft:#3A1F1D; } }
    .bg     { fill:var(--surface); }
    .ask    { fill:var(--surface-2); }
    .chosen { fill:var(--code-soft); stroke:var(--code); stroke-width:1.6; }
    .lost   { fill:var(--surface); stroke:var(--rule); stroke-width:1.4; stroke-dasharray:5 4; }
    .decide { fill:var(--accent-soft); }
    .bar    { fill:var(--accent); }
    .row    { stroke:var(--rule); stroke-width:1; }
    .foot   { fill:var(--surface-2); }
    .box    { fill:var(--surface); stroke:var(--rule); stroke-width:1.2; }
    .keep   { fill:var(--surface-2); stroke:var(--rule); stroke-width:1.2; }
    .new    { fill:var(--code-soft); stroke:var(--code); stroke-width:1.6; }
    .gonebox{ fill:var(--gone-soft); stroke:var(--gone); stroke-width:1.2; stroke-dasharray:5 4; }
    .arrow  { stroke:var(--ink-3); stroke-width:1.3; fill:none; }
    .t-lbl  { fill:var(--ink-3); font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:9.5px; letter-spacing:.1em; }
    .t-tag  { font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:9.5px; letter-spacing:.1em; font-weight:600; }
    .t-q    { fill:var(--ink); font-family:system-ui,-apple-system,sans-serif; font-weight:600; font-size:15px; }
    .t-h    { font-family:system-ui,-apple-system,sans-serif; font-weight:600; font-size:14px; }
    .t-b    { fill:var(--ink); font-family:system-ui,-apple-system,sans-serif; font-size:12.5px; }
    .t-s    { fill:var(--ink-2); font-family:system-ui,-apple-system,sans-serif; font-size:11px; }
    .t-m    { fill:var(--ink); font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:11px; }
    .mark   { font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:16px; font-weight:700; }
    .plus   { fill:var(--code); }
    .minus  { fill:var(--gone); }
    .tie    { fill:var(--ink-3); }
    .c-code { fill:var(--code); }
    .c-mute { fill:var(--ink-3); }
    .c-lost { fill:var(--ink-2); }
    .c-acc  { fill:var(--accent); }
    .c-gone { fill:var(--gone); }
  </style>
  <rect class="bg" x="0" y="0" width="940" height="414"/>
  <g id="before">
    <text class="t-lbl" x="16" y="30">TODAY</text>
    <text class="t-h" style="fill:var(--ink)" x="16" y="52">Six places a rule is written</text>
    <rect class="gonebox" x="16" y="70" width="438" height="44" rx="5"/>
    <text class="t-b" x="30" y="89">goal.md · Collection item</text>
    <text class="t-s c-gone" x="30" y="105">prose rules nobody&#x27;s check reads</text>
    <text class="t-tag c-gone" x="440" y="89" text-anchor="end">PROSE</text>
    <rect class="gonebox" x="16" y="124" width="438" height="44" rx="5"/>
    <text class="t-b" x="30" y="143">rules.mjs · RETIRED · KEEP · COLLECTION_ITEM</text>
    <text class="t-s c-gone" x="30" y="159">read by the sweep, and one constant by the guard</text>
    <text class="t-tag c-gone" x="440" y="143" text-anchor="end">SWEEP</text>
    <rect class="gonebox" x="16" y="178" width="438" height="44" rx="5"/>
    <text class="t-b" x="30" y="197">check-retired-terms.mjs · TERMS · EXCEPTIONS</text>
    <text class="t-s c-gone" x="30" y="213">Workforce&#x27;s words, read by the guard only</text>
    <text class="t-tag c-gone" x="440" y="197" text-anchor="end">GUARD</text>
    <rect class="gonebox" x="16" y="232" width="438" height="44" rx="5"/>
    <text class="t-b" x="30" y="251">GLOSSARY_TERMS</text>
    <text class="t-s c-gone" x="30" y="267">the published page&#x27;s term list, in the guard</text>
    <text class="t-tag c-gone" x="440" y="251" text-anchor="end">GUARD</text>
    <rect class="gonebox" x="16" y="286" width="438" height="44" rx="5"/>
    <text class="t-b" x="30" y="305">validate-side-chain-vocabulary.mjs · name sets</text>
    <text class="t-s c-gone" x="30" y="321">the work and background names</text>
    <text class="t-tag c-gone" x="440" y="305" text-anchor="end">SIDE-CHAIN</text>
    <rect class="gonebox" x="16" y="340" width="438" height="44" rx="5"/>
    <text class="t-b" x="30" y="359">Linear issues and epics</text>
    <text class="t-s c-gone" x="30" y="375">FIX-1876, FIX-2071, FIX-2245, FIX-2600</text>
    <text class="t-tag c-gone" x="440" y="359" text-anchor="end">SEARCH</text>
  </g>
  <g id="after">
    <text class="t-lbl" x="486" y="30">AFTER FIX-2601</text>
    <text class="t-h" style="fill:var(--ink)" x="486" y="52">One glossary, three readers</text>
    <rect class="new" x="486" y="70" width="438" height="44" rx="5"/>
    <text class="t-b" x="500" y="89">docs/contributing/glossary.mjs</text>
    <text class="t-s" x="500" y="105">term · means · retires · reach · exemptions · decision</text>
    <text class="t-tag c-code" x="910" y="89" text-anchor="end">THE SOURCE</text>
    <rect class="keep" x="486" y="124" width="438" height="44" rx="5"/>
    <text class="t-b" x="500" y="143">The sweep reads it</text>
    <text class="t-s" x="500" y="159">keeps its walk, its totality check, its marker</text>
    <text class="t-tag c-mute" x="910" y="143" text-anchor="end">READS</text>
    <rect class="keep" x="486" y="178" width="438" height="44" rx="5"/>
    <text class="t-b" x="500" y="197">The Workforce guard reads it</text>
    <text class="t-s" x="500" y="213">keeps its areas, ground and added-lines mode</text>
    <text class="t-tag c-mute" x="910" y="197" text-anchor="end">READS</text>
    <rect class="keep" x="486" y="232" width="438" height="44" rx="5"/>
    <text class="t-b" x="500" y="251">The side-chain check reads it</text>
    <text class="t-s" x="500" y="267">keeps its four encodings, matched on the syntax tree</text>
    <text class="t-tag c-mute" x="910" y="251" text-anchor="end">READS</text>
    <rect class="box" x="486" y="286" width="438" height="44" rx="5"/>
    <text class="t-b" x="500" y="305">goal.md, skills, CLAUDE.md, AGENTS.md</text>
    <text class="t-s" x="500" y="321">point to the glossary, restate nothing</text>
    <text class="t-tag c-mute" x="910" y="305" text-anchor="end">POINT</text>
  </g>
</svg>
