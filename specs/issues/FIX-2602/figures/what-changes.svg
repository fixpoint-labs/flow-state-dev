<svg viewBox="0 0 940 306" role="img" aria-label="Before the closure: each child proves its own piece on its own commit, and nothing runs the assembled set. After: one pinned main commit, after every other child merges, runs four parts in order: the epic&#x27;s goal check with legs a and b and their controls, one journey per team the goal check does not walk, every child&#x27;s goal check again, and a gap sweep over the seams and the not done if states. Legs a and b stay in CI after the wrap."
     xmlns="http://www.w3.org/2000/svg">
  <style>
    :root { --surface:#FCFCFA; --surface-2:#E8E8E1; --ink:#191C21; --ink-2:#4C535B; --ink-3:#7A828B;
            --rule:#D5D4CB; --accent:#3E4E8C; --accent-soft:#E0E3F0; --code:#2C7C69; --code-soft:#DCEDE7;
            --prose:#A8761C; --prose-soft:#F3E8D2; --gone:#A9544F; --gone-soft:#F2E1DF; }
    @media (prefers-color-scheme: dark) {
      :root { --surface:#181C1F; --surface-2:#202528; --ink:#E6E8E5; --ink-2:#A4ACB1; --ink-3:#737B81;
              --rule:#2B3135; --accent:#8B9BD8; --accent-soft:#1B2140; --code:#5DBBA1; --code-soft:#14302A;
              --prose:#D9A44B; --prose-soft:#332612; --gone:#DE8A84; --gone-soft:#3A1F1D; } }
    .bg     { fill:var(--surface); }
    .ask    { fill:var(--surface-2); }
    .chosen { fill:var(--code-soft); stroke:var(--code); stroke-width:1.6; }
    .lost   { fill:var(--surface); stroke:var(--rule); stroke-width:1.4; stroke-dasharray:5 4; }
    .decide { fill:var(--accent-soft); }
    .bar    { fill:var(--accent); }
    .row    { stroke:var(--rule); stroke-width:1; }
    .foot   { fill:var(--surface-2); }
    .box    { fill:var(--surface); stroke:var(--rule); stroke-width:1.2; }
    .keep   { fill:var(--surface-2); stroke:var(--rule); stroke-width:1.2; }
    .new    { fill:var(--code-soft); stroke:var(--code); stroke-width:1.6; }
    .gonebox{ fill:var(--gone-soft); stroke:var(--gone); stroke-width:1.2; stroke-dasharray:5 4; }
    .arrow  { stroke:var(--ink-3); stroke-width:1.3; fill:none; }
    .t-lbl  { fill:var(--ink-3); font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:9.5px; letter-spacing:.1em; }
    .t-tag  { font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:9.5px; letter-spacing:.1em; font-weight:600; }
    .t-q    { fill:var(--ink); font-family:system-ui,-apple-system,sans-serif; font-weight:600; font-size:15px; }
    .t-h    { font-family:system-ui,-apple-system,sans-serif; font-weight:600; font-size:14px; }
    .t-b    { fill:var(--ink); font-family:system-ui,-apple-system,sans-serif; font-size:12.5px; }
    .t-s    { fill:var(--ink-2); font-family:system-ui,-apple-system,sans-serif; font-size:11px; }
    .t-m    { fill:var(--ink); font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:11px; }
    .mark   { font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:16px; font-weight:700; }
    .plus   { fill:var(--code); }
    .minus  { fill:var(--gone); }
    .tie    { fill:var(--ink-3); }
    .c-code { fill:var(--code); }
    .c-mute { fill:var(--ink-3); }
    .c-lost { fill:var(--ink-2); }
    .c-acc  { fill:var(--accent); }
    .c-gone { fill:var(--gone); }
  </style>
  <rect class="bg" x="0" y="0" width="940" height="306"/>
  <g id="before">
    <text class="t-lbl" x="16" y="30">TODAY</text>
    <text class="t-h" style="fill:var(--ink)" x="16" y="52">Each child proves its own piece</text>
    <rect class="box" x="16" y="70" width="438" height="44" rx="5"/>
    <text class="t-b" x="30" y="89">FIX-2601 · its parity and lever check</text>
    <text class="t-s" x="30" y="105">on its own merge commit</text>
    <text class="t-tag c-mute" x="440" y="89" text-anchor="end">CHILD</text>
    <rect class="box" x="16" y="124" width="438" height="44" rx="5"/>
    <text class="t-b" x="30" y="143">FIX-2354 · its contributor-tree plants</text>
    <text class="t-s" x="30" y="159">on its own merge commit</text>
    <text class="t-tag c-mute" x="440" y="143" text-anchor="end">CHILD</text>
    <rect class="box" x="16" y="178" width="438" height="44" rx="5"/>
    <text class="t-b" x="30" y="197">FIX-2479 · its whole-tree resource rule</text>
    <text class="t-s" x="30" y="213">on its own merge commit</text>
    <text class="t-tag c-mute" x="440" y="197" text-anchor="end">CHILD</text>
    <rect class="gonebox" x="16" y="232" width="438" height="44" rx="5"/>
    <text class="t-b" x="30" y="251">Nothing runs the assembled set</text>
    <text class="t-s c-gone" x="30" y="267">a gap between two children reaches the wrap</text>
    <text class="t-tag c-gone" x="440" y="251" text-anchor="end">GAP</text>
  </g>
  <g id="after">
    <text class="t-lbl" x="486" y="30">AFTER FIX-2602</text>
    <text class="t-h" style="fill:var(--ink)" x="486" y="52">One main commit, four parts</text>
    <rect class="new" x="486" y="70" width="438" height="44" rx="5"/>
    <text class="t-b" x="500" y="89">1 · The epic&#x27;s goal check · legs a and b</text>
    <text class="t-s" x="500" y="105">with both controls; kept in CI after the wrap</text>
    <text class="t-tag c-code" x="910" y="89" text-anchor="end">GOAL</text>
    <rect class="keep" x="486" y="124" width="438" height="44" rx="5"/>
    <text class="t-b" x="500" y="143">2 · Two team journeys</text>
    <text class="t-s" x="500" y="159">naming a new thing · upgrading a consumer</text>
    <text class="t-tag c-mute" x="910" y="143" text-anchor="end">JOURNEYS</text>
    <rect class="keep" x="486" y="178" width="438" height="44" rx="5"/>
    <text class="t-b" x="500" y="197">3 · Every child&#x27;s goal check, again</text>
    <text class="t-s" x="500" y="213">the ones item 1 does not already walk</text>
    <text class="t-tag c-mute" x="910" y="197" text-anchor="end">CHILDREN</text>
    <rect class="keep" x="486" y="232" width="438" height="44" rx="5"/>
    <text class="t-b" x="500" y="251">4 · The gap sweep</text>
    <text class="t-s" x="500" y="267">five seams across both sides · every not done if state</text>
    <text class="t-tag c-mute" x="910" y="251" text-anchor="end">SEAMS</text>
  </g>
</svg>
