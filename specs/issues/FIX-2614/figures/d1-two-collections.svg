<svg viewBox="0 0 940 488" role="img" aria-label="D1: where does a routine live, and what writes it? Chosen: one list and four verbs over the two collections that exist today. Instead of: a routine collection both triggers move into. It comes down to the event trigger&#x27;s writers: the chosen shape keeps subscribe and unsubscribe as the only writers, with pause and resume going through them; a new store adds a third writer that the poll row and thread index would also have to follow. Live fires: no migration, against every schedule moving, since a dispatch id is its key. The list read: a cost for the chosen shape, it merges two collections and two row shapes on every read, against one read. A third trigger: a third collection under the same verbs, against one more row kind. Locks in four public verbs and a trigger that is clock or event, with an id that names its trigger. Flips if a third trigger fits neither collection and a fourth is on the way."
     xmlns="http://www.w3.org/2000/svg">
  <style>
    :root { --surface:#FCFCFA; --surface-2:#E8E8E1; --ink:#191C21; --ink-2:#4C535B; --ink-3:#7A828B;
            --rule:#D5D4CB; --accent:#3E4E8C; --accent-soft:#E0E3F0; --code:#2C7C69; --code-soft:#DCEDE7;
            --gone:#A9544F; }
    @media (prefers-color-scheme: dark) {
      :root { --surface:#181C1F; --surface-2:#202528; --ink:#E6E8E5; --ink-2:#A4ACB1; --ink-3:#737B81;
              --rule:#2B3135; --accent:#8B9BD8; --accent-soft:#1B2140; --code:#5DBBA1; --code-soft:#14302A;
              --gone:#DE8A84; } }
    .bg     { fill:var(--surface); }
    .ask    { fill:var(--surface-2); }
    .chosen { fill:var(--code-soft); stroke:var(--code); stroke-width:1.6; }
    .lost   { fill:var(--surface); stroke:var(--rule); stroke-width:1.4; stroke-dasharray:5 4; }
    .decide { fill:var(--accent-soft); }
    .bar    { fill:var(--accent); }
    .row    { stroke:var(--rule); stroke-width:1; }
    .foot   { fill:var(--surface-2); }
    .t-lbl  { fill:var(--ink-3); font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:9.5px; letter-spacing:.1em; }
    .t-tag  { font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:9.5px; letter-spacing:.1em; font-weight:600; }
    .t-q    { fill:var(--ink); font-family:system-ui,-apple-system,sans-serif; font-weight:600; font-size:15px; }
    .t-h    { font-family:system-ui,-apple-system,sans-serif; font-weight:600; font-size:14px; }
    .t-b    { fill:var(--ink); font-family:system-ui,-apple-system,sans-serif; font-size:12.5px; }
    .t-s    { fill:var(--ink-2); font-family:system-ui,-apple-system,sans-serif; font-size:11px; }
    .mark   { font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:16px; font-weight:700; }
    .plus   { fill:var(--code); }
    .minus  { fill:var(--gone); }
    .tie    { fill:var(--ink-3); }
    .c-code { fill:var(--code); }
    .c-mute { fill:var(--ink-3); }
    .c-lost { fill:var(--ink-2); }
    .c-acc  { fill:var(--accent); }
      .rec    { fill:var(--code-soft); stroke:var(--code); stroke-width:1.6; stroke-dasharray:5 4; }
  </style>
  <rect class="bg" x="0" y="0" width="940" height="488"/>

  <g id="the-call">
    <rect class="ask" x="16" y="14" width="908" height="48" rx="6"/>
    <text class="t-lbl" x="32" y="32">D1 · THE CALL</text>
    <text class="t-q" x="32" y="52">Where does a routine live, and what writes it?</text>
  </g>

  <g id="options">
    <rect class="chosen" x="212" y="76" width="348" height="46" rx="5"/>
    <text class="t-tag c-code" x="228" y="93">CHOSEN</text>
    <text class="t-h c-code" x="228" y="112">One list, four verbs, two collections</text>
    <rect class="lost" x="576" y="76" width="348" height="46" rx="5"/>
    <text class="t-tag c-mute" x="592" y="93">INSTEAD OF</text>
    <text class="t-h c-lost" x="592" y="112">A routine collection</text>
  </g>

  <g id="row-decides">
    <rect class="decide" x="16" y="134" width="908" height="62" rx="4"/>
    <rect class="bar" x="16" y="134" width="4" height="62"/>
    <text class="t-lbl" x="32" y="156">THE EVENT</text>
    <text class="t-lbl" x="32" y="169">TRIGGER&#x27;S WRITERS</text>
    <text class="t-tag c-acc" x="32" y="186">▸ DECIDES IT</text>
    <text class="mark plus" x="228" y="162">+</text>
    <text class="t-b" x="248" y="161">Still subscribe and unsubscribe</text>
    <text class="t-s" x="248" y="179">pause and resume go through them (ER-5)</text>
    <text class="mark minus" x="592" y="162">−</text>
    <text class="t-b" x="612" y="161">A third writer</text>
    <text class="t-s" x="612" y="179">the poll row and index follow it too</text>
  </g>
  <g id="row-1">
    <text class="t-lbl" x="32" y="221">LIVE FIRES</text>
    <text class="mark plus" x="228" y="224">+</text>
    <text class="t-b" x="248" y="223">No migration</text>
    <text class="t-s" x="248" y="241">keys and dispatch ids stay</text>
    <text class="mark minus" x="592" y="224">−</text>
    <text class="t-b" x="612" y="223">Every schedule moves</text>
    <text class="t-s" x="612" y="241">a dispatch id is its key</text>
    <line class="row" x1="16" y1="256" x2="924" y2="256"/>
  </g>
  <g id="row-2">
    <text class="t-lbl" x="32" y="279">THE LIST READ</text>
    <text class="mark minus" x="228" y="282">−</text>
    <text class="t-b" x="248" y="281">Merges two collections</text>
    <text class="t-s" x="248" y="299">and two row shapes, on every read</text>
    <text class="mark plus" x="592" y="282">+</text>
    <text class="t-b" x="612" y="281">One read</text>
    <text class="t-s" x="612" y="299">one row shape</text>
    <line class="row" x1="16" y1="314" x2="924" y2="314"/>
  </g>
  <g id="row-3">
    <text class="t-lbl" x="32" y="337">A THIRD TRIGGER</text>
    <text class="mark minus" x="228" y="340">−</text>
    <text class="t-b" x="248" y="339">A third collection</text>
    <text class="t-s" x="248" y="357">under the same four verbs</text>
    <text class="mark plus" x="592" y="340">+</text>
    <text class="t-b" x="612" y="339">One more row kind</text>
    <text class="t-s" x="612" y="357">in the same store</text>
    <line class="row" x1="16" y1="372" x2="924" y2="372"/>
  </g>

  <g id="locks-in">
    <rect class="foot" x="16" y="398" width="446" height="74" rx="5"/>
    <text class="t-lbl" x="32" y="419">LOCKS IN</text>
    <text class="t-b" x="32" y="439">Four public verbs and trigger: clock or event</text>
    <text class="t-s" x="32" y="457">an id names its trigger: clock:&lt;key&gt;, event:&lt;id&gt;</text>
  </g>

  <g id="flips-if">
    <rect class="foot" x="478" y="398" width="446" height="74" rx="5"/>
    <text class="t-lbl" x="494" y="419">FLIPS IF</text>
    <text class="t-b" x="494" y="439">A third trigger fits neither collection</text>
    <text class="t-s" x="494" y="457">and a fourth is on the way</text>
  </g>
</svg>
