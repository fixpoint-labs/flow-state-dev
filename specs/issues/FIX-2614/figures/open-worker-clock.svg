<svg viewBox="0 0 940 430" role="img" aria-label="Q1, open for the owner: can a worker save a clock routine when you ask it to in a conversation? Recommended: yes, with the same saveRoutine. Instead of: a person only, from the roster. It comes down to the first row, every Monday said in a chat: with the recommendation the worker saves it and the list names that worker as its maker; with a person only, the user goes to another screen. A model&#x27;s mistake is a cost for the recommendation: the routine runs as you until stopped, and the cron check is the only guard; with a person only, no model starts recurring work. One set of tools holds with the recommendation and is split by trigger otherwise. Locks in that a worker&#x27;s tools can start recurring work, for routines that act through that worker. Flips if an app&#x27;s users can&#x27;t see the list."
     xmlns="http://www.w3.org/2000/svg">
  <style>
    :root { --surface:#FCFCFA; --surface-2:#E8E8E1; --ink:#191C21; --ink-2:#4C535B; --ink-3:#7A828B;
            --rule:#D5D4CB; --accent:#3E4E8C; --accent-soft:#E0E3F0; --code:#2C7C69; --code-soft:#DCEDE7;
            --gone:#A9544F; }
    @media (prefers-color-scheme: dark) {
      :root { --surface:#181C1F; --surface-2:#202528; --ink:#E6E8E5; --ink-2:#A4ACB1; --ink-3:#737B81;
              --rule:#2B3135; --accent:#8B9BD8; --accent-soft:#1B2140; --code:#5DBBA1; --code-soft:#14302A;
              --gone:#DE8A84; } }
    .bg     { fill:var(--surface); }
    .ask    { fill:var(--surface-2); }
    .chosen { fill:var(--code-soft); stroke:var(--code); stroke-width:1.6; }
    .lost   { fill:var(--surface); stroke:var(--rule); stroke-width:1.4; stroke-dasharray:5 4; }
    .decide { fill:var(--accent-soft); }
    .bar    { fill:var(--accent); }
    .row    { stroke:var(--rule); stroke-width:1; }
    .foot   { fill:var(--surface-2); }
    .t-lbl  { fill:var(--ink-3); font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:9.5px; letter-spacing:.1em; }
    .t-tag  { font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:9.5px; letter-spacing:.1em; font-weight:600; }
    .t-q    { fill:var(--ink); font-family:system-ui,-apple-system,sans-serif; font-weight:600; font-size:15px; }
    .t-h    { font-family:system-ui,-apple-system,sans-serif; font-weight:600; font-size:14px; }
    .t-b    { fill:var(--ink); font-family:system-ui,-apple-system,sans-serif; font-size:12.5px; }
    .t-s    { fill:var(--ink-2); font-family:system-ui,-apple-system,sans-serif; font-size:11px; }
    .mark   { font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:16px; font-weight:700; }
    .plus   { fill:var(--code); }
    .minus  { fill:var(--gone); }
    .tie    { fill:var(--ink-3); }
    .c-code { fill:var(--code); }
    .c-mute { fill:var(--ink-3); }
    .c-lost { fill:var(--ink-2); }
    .c-acc  { fill:var(--accent); }
      .rec    { fill:var(--code-soft); stroke:var(--code); stroke-width:1.6; stroke-dasharray:5 4; }
  </style>
  <rect class="bg" x="0" y="0" width="940" height="430"/>

  <g id="the-call">
    <rect class="ask" x="16" y="14" width="908" height="48" rx="6"/>
    <text class="t-lbl" x="32" y="32">Q1 · OPEN · OWNER</text>
    <text class="t-q" x="32" y="52">Can a worker save a clock routine when you ask it to in a conversation?</text>
  </g>

  <g id="options">
    <rect class="rec" x="212" y="76" width="348" height="46" rx="5"/>
    <text class="t-tag c-code" x="228" y="93">RECOMMENDED</text>
    <text class="t-h c-code" x="228" y="112">Yes, with the same saveRoutine</text>
    <rect class="lost" x="576" y="76" width="348" height="46" rx="5"/>
    <text class="t-tag c-mute" x="592" y="93">INSTEAD OF</text>
    <text class="t-h c-lost" x="592" y="112">A person only, from the roster</text>
  </g>

  <g id="row-decides">
    <rect class="decide" x="16" y="134" width="908" height="62" rx="4"/>
    <rect class="bar" x="16" y="134" width="4" height="62"/>
    <text class="t-lbl" x="32" y="156">&quot;EVERY MONDAY&quot;</text>
    <text class="t-lbl" x="32" y="169">SAID IN A CHAT</text>
    <text class="t-tag c-acc" x="32" y="186">▸ DECIDES IT</text>
    <text class="mark plus" x="228" y="162">+</text>
    <text class="t-b" x="248" y="161">The worker saves it</text>
    <text class="t-s" x="248" y="179">the list names that worker as its maker</text>
    <text class="mark minus" x="592" y="162">−</text>
    <text class="t-b" x="612" y="161">Go to another screen</text>
    <text class="t-s" x="612" y="179">the worker can only tell you how</text>
  </g>
  <g id="row-1">
    <text class="t-lbl" x="32" y="221">A MODEL&#x27;S</text>
    <text class="t-lbl" x="32" y="234">MISTAKE</text>
    <text class="mark minus" x="228" y="224">−</text>
    <text class="t-b" x="248" y="223">Runs as you until stopped</text>
    <text class="t-s" x="248" y="241">the cron check is the only guard</text>
    <text class="mark plus" x="592" y="224">+</text>
    <text class="t-b" x="612" y="223">A person typed every one</text>
    <text class="t-s" x="612" y="241">no model starts recurring work</text>
    <line class="row" x1="16" y1="256" x2="924" y2="256"/>
  </g>
  <g id="row-2">
    <text class="t-lbl" x="32" y="279">ONE SET OF TOOLS</text>
    <text class="mark plus" x="228" y="282">+</text>
    <text class="t-b" x="248" y="281">Holds</text>
    <text class="t-s" x="248" y="299">same verbs for people and workers</text>
    <text class="mark minus" x="592" y="282">−</text>
    <text class="t-b" x="612" y="281">Split by trigger</text>
    <text class="t-s" x="612" y="299">a worker&#x27;s saveRoutine refuses a clock</text>
    <line class="row" x1="16" y1="314" x2="924" y2="314"/>
  </g>

  <g id="locks-in">
    <rect class="foot" x="16" y="340" width="446" height="74" rx="5"/>
    <text class="t-lbl" x="32" y="361">LOCKS IN</text>
    <text class="t-b" x="32" y="381">A worker&#x27;s tools can start recurring work</text>
    <text class="t-s" x="32" y="399">only routines that act through that worker</text>
  </g>

  <g id="flips-if">
    <rect class="foot" x="478" y="340" width="446" height="74" rx="5"/>
    <text class="t-lbl" x="494" y="361">FLIPS IF</text>
    <text class="t-b" x="494" y="381">An app&#x27;s users can&#x27;t see the list</text>
    <text class="t-s" x="494" y="399">then a model&#x27;s routine runs unseen</text>
  </g>
</svg>
