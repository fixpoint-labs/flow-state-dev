<svg viewBox="0 0 940 476" role="img" aria-label="D1, how a view knows what it depends on. Chosen: recorded from what each run read. Instead of: dependsOn declared by the author and checked in tests. It comes down to whether the list can be wrong: recorded, it is what the run read, on every branch in production; declared, the board's obvious list missed three of four. Price: the recorder runs on every view run, under 1 percent, and a flow with a view publishes every resource change. Another session's data: recorded names the topics the run reached; a declared list can't name sessions in advance. Locks in no dependsOn on defineView, addable later. Flips if the extra notices load the bus, or the engine's recorder misses a path a probe reaches"
     xmlns="http://www.w3.org/2000/svg">
  <style>
    :root { --surface:#FCFCFA; --surface-2:#E8E8E1; --ink:#191C21; --ink-2:#4C535B; --ink-3:#7A828B;
            --rule:#D5D4CB; --accent:#3E4E8C; --accent-soft:#E0E3F0; --code:#2C7C69; --code-soft:#DCEDE7;
            --gone:#A9544F; }
    @media (prefers-color-scheme: dark) {
      :root { --surface:#181C1F; --surface-2:#202528; --ink:#E6E8E5; --ink-2:#A4ACB1; --ink-3:#737B81;
              --rule:#2B3135; --accent:#8B9BD8; --accent-soft:#1B2140; --code:#5DBBA1; --code-soft:#14302A;
              --gone:#DE8A84; } }
    .bg     { fill:var(--surface); }
    .ask    { fill:var(--surface-2); }
    .chosen { fill:var(--code-soft); stroke:var(--code); stroke-width:1.6; }
    .rec    { fill:var(--code-soft); stroke:var(--code); stroke-width:1.6; stroke-dasharray:5 4; }
    .lost   { fill:var(--surface); stroke:var(--rule); stroke-width:1.4; stroke-dasharray:5 4; }
    .decide { fill:var(--accent-soft); }
    .bar    { fill:var(--accent); }
    .row    { stroke:var(--rule); stroke-width:1; }
    .foot   { fill:var(--surface-2); }
    .t-lbl  { fill:var(--ink-3); font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:9.5px; letter-spacing:.1em; }
    .t-tag  { font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:9.5px; letter-spacing:.1em; font-weight:600; }
    .t-q    { fill:var(--ink); font-family:system-ui,-apple-system,sans-serif; font-weight:600; font-size:15px; }
    .t-h    { font-family:system-ui,-apple-system,sans-serif; font-weight:600; font-size:14px; }
    .t-b    { fill:var(--ink); font-family:system-ui,-apple-system,sans-serif; font-size:12.5px; }
    .t-s    { fill:var(--ink-2); font-family:system-ui,-apple-system,sans-serif; font-size:11px; }
    .mark   { font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:16px; font-weight:700; }
    .plus   { fill:var(--code); }
    .minus  { fill:var(--gone); }
    .tie    { fill:var(--ink-3); }
    .c-code { fill:var(--code); }
    .c-mute { fill:var(--ink-3); }
    .c-lost { fill:var(--ink-2); }
    .c-acc  { fill:var(--accent); }
  </style>
  <rect class="bg" x="0" y="0" width="940" height="476"/>

  <g id="the-call">
    <rect class="ask" x="16" y="14" width="908" height="48" rx="6"/>
    <text class="t-lbl" x="32" y="32">D1 · THE CALL</text>
    <text class="t-q" x="32" y="52">Does a view’s author list what it reads, or does the engine record it?</text>
  </g>

  <g id="options">
    <rect class="chosen" x="212" y="76" width="348" height="46" rx="5"/>
    <text class="t-tag c-code" x="228" y="93">CHOSEN</text>
    <text class="t-h c-code" x="228" y="112">Recorded from each run</text>
    <rect class="lost" x="576" y="76" width="348" height="46" rx="5"/>
    <text class="t-tag c-mute" x="592" y="93">INSTEAD OF</text>
    <text class="t-h c-lost" x="592" y="112">Declared, checked in tests</text>
  </g>

  <g id="row-decides">
    <rect class="decide" x="16" y="134" width="908" height="62" rx="4"/>
    <rect class="bar" x="16" y="134" width="4" height="62"/>
    <text class="t-lbl" x="32" y="152">CAN THE LIST</text>
    <text class="t-lbl" x="32" y="165">BE WRONG</text>
    <text class="t-tag c-acc" x="32" y="186">▸ DECIDES IT</text>
    <text class="mark plus" x="228" y="162">+</text>
    <text class="t-b" x="248" y="161">No: it is what the run read</text>
    <text class="t-s" x="248" y="179">on every branch, in production</text>
    <text class="mark minus" x="592" y="162">−</text>
    <text class="t-b" x="612" y="161">Yes, from the first view</text>
    <text class="t-s" x="612" y="179">the board’s list missed 3 of 4</text>
  </g>

  <g id="row-2">
    <text class="t-lbl" x="32" y="222">COST PER</text>
    <text class="t-lbl" x="32" y="235">VIEW RUN</text>
    <text class="mark minus" x="228" y="224">−</text>
    <text class="t-b" x="248" y="223">Under 1%, always on</text>
    <text class="t-s" x="248" y="241">the recorder never turns off</text>
    <text class="mark plus" x="592" y="224">+</text>
    <text class="t-b" x="612" y="223">Nothing in production</text>
    <text class="t-s" x="612" y="241">the recorder runs in tests</text>
    <line class="row" x1="16" y1="254" x2="924" y2="254"/>
  </g>

  <g id="row-3">
    <text class="t-lbl" x="32" y="280">NOTICES</text>
    <text class="t-lbl" x="32" y="293">SENT</text>
    <text class="mark minus" x="228" y="282">−</text>
    <text class="t-b" x="248" y="281">Every resource change</text>
    <text class="t-s" x="248" y="299">in a flow with a view, as derived</text>
    <text class="mark plus" x="592" y="282">+</text>
    <text class="t-b" x="612" y="281">Only what views list</text>
    <text class="t-s" x="612" y="299">a narrower publish set</text>
    <line class="row" x1="16" y1="312" x2="924" y2="312"/>
  </g>

  <g id="row-4">
    <text class="t-lbl" x="32" y="338">ANOTHER</text>
    <text class="t-lbl" x="32" y="351">SESSION’S DATA</text>
    <text class="mark plus" x="228" y="340">+</text>
    <text class="t-b" x="248" y="339">The topics the run reached</text>
    <text class="t-s" x="248" y="357">named per call</text>
    <text class="mark minus" x="592" y="340">−</text>
    <text class="t-b" x="612" y="339">Not nameable in advance</text>
    <text class="t-s" x="612" y="357">sessions are known at run time</text>
    <line class="row" x1="16" y1="370" x2="924" y2="370"/>
  </g>

  <g id="locks-in">
    <rect class="foot" x="16" y="386" width="446" height="74" rx="5"/>
    <text class="t-lbl" x="32" y="407">LOCKS IN</text>
    <text class="t-b" x="32" y="427">No dependsOn on defineView</text>
    <text class="t-s" x="32" y="445">adding an optional one later is additive</text>
  </g>

  <g id="flips-if">
    <rect class="foot" x="478" y="386" width="446" height="74" rx="5"/>
    <text class="t-lbl" x="494" y="407">FLIPS IF</text>
    <text class="t-b" x="494" y="427">The extra notices load the bus</text>
    <text class="t-s" x="494" y="445">or the recorder misses a path a probe reaches</text>
  </g>
</svg>
