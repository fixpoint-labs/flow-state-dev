<svg viewBox="0 0 940 420" role="img" aria-label="Open fork, for the owner: who may write an org resource on the default write flow when it sets no write rule. Recommended: nobody until the resource says so, because a definition at org scope on the default write flow must set canWrite, even canWrite: () => true. The other option: every member of the org, as the concept doc describes, with canWrite only to narrow it. It comes down to the first row: what an app author gets by default when they forget, a definition error against org-wide write access. The price is the second row: one more line on every org resource. The third row is a tie: a user resource is its owner's alone either way. Locks in: relaxing later is not breaking, tightening later is. Flips if: org resources are meant to be shared notepads, where every member writing is the point."
     xmlns="http://www.w3.org/2000/svg">
  <style>
    :root { --surface:#FCFCFA; --surface-2:#E8E8E1; --ink:#191C21; --ink-2:#4C535B; --ink-3:#7A828B;
            --rule:#D5D4CB; --accent:#3E4E8C; --accent-soft:#E0E3F0; --code:#2C7C69; --code-soft:#DCEDE7;
            --gone:#A9544F; }
    @media (prefers-color-scheme: dark) {
      :root { --surface:#181C1F; --surface-2:#202528; --ink:#E6E8E5; --ink-2:#A4ACB1; --ink-3:#737B81;
              --rule:#2B3135; --accent:#8B9BD8; --accent-soft:#1B2140; --code:#5DBBA1; --code-soft:#14302A;
              --gone:#DE8A84; } }
    .bg     { fill:var(--surface); }
    .ask    { fill:var(--surface-2); }
    .chosen { fill:var(--code-soft); stroke:var(--code); stroke-width:1.6; }
    .rec    { fill:var(--code-soft); stroke:var(--code); stroke-width:1.6; stroke-dasharray:5 4; }
    .lost   { fill:var(--surface); stroke:var(--rule); stroke-width:1.4; stroke-dasharray:5 4; }
    .decide { fill:var(--accent-soft); }
    .bar    { fill:var(--accent); }
    .row    { stroke:var(--rule); stroke-width:1; }
    .foot   { fill:var(--surface-2); }
    .t-lbl  { fill:var(--ink-3); font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:9.5px; letter-spacing:.1em; }
    .t-tag  { font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:9.5px; letter-spacing:.1em; font-weight:600; }
    .t-q    { fill:var(--ink); font-family:system-ui,-apple-system,sans-serif; font-weight:600; font-size:15px; }
    .t-h    { font-family:system-ui,-apple-system,sans-serif; font-weight:600; font-size:14px; }
    .t-b    { fill:var(--ink); font-family:system-ui,-apple-system,sans-serif; font-size:12.5px; }
    .t-s    { fill:var(--ink-2); font-family:system-ui,-apple-system,sans-serif; font-size:11px; }
    .mark   { font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:16px; font-weight:700; }
    .plus   { fill:var(--code); }
    .minus  { fill:var(--gone); }
    .tie    { fill:var(--ink-3); }
    .c-code { fill:var(--code); }
    .c-mute { fill:var(--ink-3); }
    .c-lost { fill:var(--ink-2); }
    .c-acc  { fill:var(--accent); }
  </style>
  <rect class="bg" x="0" y="0" width="940" height="420"/>
  <g id="the-call">
    <rect class="ask" x="16" y="14" width="908" height="48" rx="6"/>
    <text class="t-lbl" x="32" y="32">OPEN · FOR THE OWNER</text>
    <text class="t-q" x="32" y="52">An org resource with no write rule: who may write it?</text>
  </g>
  <g id="options">
    <rect class="rec" x="212" y="76" width="348" height="46" rx="5"/>
    <text class="t-tag c-code" x="228" y="93">RECOMMENDED</text>
    <text class="t-h c-code" x="228" y="112">Nobody, until it sets canWrite</text>
    <rect class="lost" x="576" y="76" width="348" height="46" rx="5"/>
    <text class="t-tag c-mute" x="592" y="93">THE OTHER OPTION</text>
    <text class="t-h c-lost" x="592" y="112">Every member of the org</text>
  </g>
  <g id="row-decides">
    <rect class="decide" x="16" y="134" width="908" height="62" rx="4"/>
    <rect class="bar" x="16" y="134" width="4" height="62"/>
    <text class="t-lbl" x="32" y="156">WHEN THE AUTHOR</text>
    <text class="t-lbl" x="32" y="169">FORGETS</text>
    <text class="t-tag c-acc" x="32" y="186">▸ DECIDES IT</text>
    <text class="mark plus" x="228" y="162">+</text>
    <text class="t-b" x="248" y="161">A definition error</text>
    <text class="t-s" x="248" y="179">names the missing canWrite at startup</text>
    <text class="mark minus" x="592" y="162">−</text>
    <text class="t-b" x="612" y="161">Org-wide write access</text>
    <text class="t-s" x="612" y="179">found later, by a member who should not</text>
  </g>
  <g id="row-2">
    <text class="t-lbl" x="32" y="222">WHAT AN AUTHOR</text>
    <text class="t-lbl" x="32" y="235">WRITES</text>
    <text class="mark minus" x="228" y="224">−</text>
    <text class="t-b" x="248" y="223">One more line</text>
    <text class="t-s" x="248" y="241">canWrite: () => true to open it</text>
    <text class="mark plus" x="592" y="224">+</text>
    <text class="t-b" x="612" y="223">Nothing</text>
    <text class="t-s" x="612" y="241">runBy: "default" is enough</text>
    <line class="row" x1="16" y1="256" x2="924" y2="256"/>
  </g>
  <g id="row-3">
    <text class="t-lbl" x="32" y="280">A USER RESOURCE</text>
    <text class="mark tie" x="228" y="282">=</text>
    <text class="t-b" x="248" y="281">Its owner's alone</text>
    <text class="t-s" x="248" y="299">the cell is the caller's own</text>
    <text class="mark tie" x="592" y="282">=</text>
    <text class="t-b" x="612" y="281">Its owner's alone</text>
    <text class="t-s" x="612" y="299">the same</text>
    <line class="row" x1="16" y1="314" x2="924" y2="314"/>
  </g>
  <g id="locks-in">
    <rect class="foot" x="16" y="330" width="446" height="74" rx="5"/>
    <text class="t-lbl" x="32" y="351">LOCKS IN</text>
    <text class="t-b" x="32" y="371">Relaxing later is free; tightening is not</text>
    <text class="t-s" x="32" y="389">a rule added later breaks apps that relied on it</text>
  </g>
  <g id="flips-if">
    <rect class="foot" x="478" y="330" width="446" height="74" rx="5"/>
    <text class="t-lbl" x="494" y="351">FLIPS IF</text>
    <text class="t-b" x="494" y="371">Org resources are meant as shared notepads</text>
    <text class="t-s" x="494" y="389">then every member writing is the point</text>
  </g>
</svg>
