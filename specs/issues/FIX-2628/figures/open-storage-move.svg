<svg viewBox="0 0 940 420" role="img" aria-label="Open question, which issue moves the Claude Code-style lab's storage off workforce projects. Recommended: FIX-2628, when it deletes the adapter. Instead of: FIX-2594, now, by amending its epic FIX-2592. It comes down to the first row: FIX-2594 is approved and waits only on FIX-2593, and its screens look the same either way, so moving storage there reopens a sibling epic for no visible gain. The price is the second row: until FIX-2628 lands, each repository added in Settings also leaves a workforce project row, read once and then left. The third row is a tie: the person sees the word repository and Settings at the same time either way. Locks in: FIX-2594 ships as approved, and FIX-2628 reads old project rows once. Flips if: FIX-2594 has not started when FIX-2627 merges."
     xmlns="http://www.w3.org/2000/svg">
  <style>
    :root { --surface:#FCFCFA; --surface-2:#E8E8E1; --ink:#191C21; --ink-2:#4C535B; --ink-3:#7A828B;
            --rule:#D5D4CB; --accent:#3E4E8C; --accent-soft:#E0E3F0; --code:#2C7C69; --code-soft:#DCEDE7;
            --gone:#A9544F; }
    @media (prefers-color-scheme: dark) {
      :root { --surface:#181C1F; --surface-2:#202528; --ink:#E6E8E5; --ink-2:#A4ACB1; --ink-3:#737B81;
              --rule:#2B3135; --accent:#8B9BD8; --accent-soft:#1B2140; --code:#5DBBA1; --code-soft:#14302A;
              --gone:#DE8A84; } }
    .bg     { fill:var(--surface); }
    .ask    { fill:var(--surface-2); }
    .chosen { fill:var(--code-soft); stroke:var(--code); stroke-width:1.6; stroke-dasharray:5 4; }
    .lost   { fill:var(--surface); stroke:var(--rule); stroke-width:1.4; stroke-dasharray:5 4; }
    .decide { fill:var(--accent-soft); }
    .bar    { fill:var(--accent); }
    .row    { stroke:var(--rule); stroke-width:1; }
    .foot   { fill:var(--surface-2); }
    .t-lbl  { fill:var(--ink-3); font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:9.5px; letter-spacing:.1em; }
    .t-tag  { font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:9.5px; letter-spacing:.1em; font-weight:600; }
    .t-q    { fill:var(--ink); font-family:system-ui,-apple-system,sans-serif; font-weight:600; font-size:15px; }
    .t-h    { font-family:system-ui,-apple-system,sans-serif; font-weight:600; font-size:14px; }
    .t-b    { fill:var(--ink); font-family:system-ui,-apple-system,sans-serif; font-size:12.5px; }
    .t-s    { fill:var(--ink-2); font-family:system-ui,-apple-system,sans-serif; font-size:11px; }
    .mark   { font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:16px; font-weight:700; }
    .plus   { fill:var(--code); }
    .minus  { fill:var(--gone); }
    .tie    { fill:var(--ink-3); }
    .c-code { fill:var(--code); }
    .c-mute { fill:var(--ink-3); }
    .c-lost { fill:var(--ink-2); }
    .c-acc  { fill:var(--accent); }
  </style>
  <rect class="bg" x="0" y="0" width="940" height="420"/>
  <g id="the-call">
    <rect class="ask" x="16" y="14" width="908" height="48" rx="6"/>
    <text class="t-lbl" x="32" y="32">OPEN &#183; Q1</text>
    <text class="t-q" x="32" y="52">Which issue moves the lab’s storage off workforce projects?</text>
  </g>
  <g id="options">
    <rect class="chosen" x="212" y="76" width="348" height="46" rx="5"/>
    <text class="t-tag c-code" x="228" y="93">RECOMMENDED</text>
    <text class="t-h c-code" x="228" y="112">FIX-2628, at the adapter’s delete</text>
    <rect class="lost" x="576" y="76" width="348" height="46" rx="5"/>
    <text class="t-tag c-mute" x="592" y="93">INSTEAD OF</text>
    <text class="t-h c-lost" x="592" y="112">FIX-2594, now (FIX-2592 amended)</text>
  </g>
  <g id="row-decides">
    <rect class="decide" x="16" y="134" width="908" height="62" rx="4"/>
    <rect class="bar" x="16" y="134" width="4" height="62"/>
    <text class="t-lbl" x="32" y="156">A SIBLING EPIC’S</text>
    <text class="t-lbl" x="32" y="169">APPROVAL</text>
    <text class="t-tag c-acc" x="32" y="186">&#9656; DECIDES IT</text>
    <text class="mark plus" x="228" y="162">+</text>
    <text class="t-b" x="248" y="161">FIX-2592 ships as approved</text>
    <text class="t-s" x="248" y="179">its screens look the same either way</text>
    <text class="mark minus" x="592" y="162">−</text>
    <text class="t-b" x="612" y="161">FIX-2592 reopens for approval</text>
    <text class="t-s" x="612" y="179">and FIX-2594 grows a run-source change</text>
  </g>
  <g id="row-1">
    <text class="t-lbl" x="32" y="222">DATA LEFT</text>
    <text class="mark minus" x="228" y="224">−</text>
    <text class="t-b" x="248" y="223">A project row per repository</text>
    <text class="t-s" x="248" y="241">added before FIX-2628; read once, then left</text>
    <text class="mark plus" x="592" y="224">+</text>
    <text class="t-b" x="612" y="223">None: no project row is made</text>
    <text class="t-s" x="612" y="241">no one-time read later</text>
    <line class="row" x1="16" y1="256" x2="924" y2="256"/>
  </g>
  <g id="row-2">
    <text class="t-lbl" x="32" y="280">WHAT A PERSON</text>
    <text class="t-lbl" x="32" y="293">SEES</text>
    <text class="mark tie" x="228" y="282">=</text>
    <text class="t-b" x="248" y="281">Repository and Settings</text>
    <text class="t-s" x="248" y="299">when FIX-2594 ships</text>
    <text class="mark tie" x="592" y="282">=</text>
    <text class="t-b" x="612" y="281">Repository and Settings</text>
    <text class="t-s" x="612" y="299">when FIX-2594 ships</text>
    <line class="row" x1="16" y1="314" x2="924" y2="314"/>
  </g>
  <g id="locks-in">
    <rect class="foot" x="16" y="330" width="446" height="74" rx="5"/>
    <text class="t-lbl" x="32" y="351">LOCKS IN</text>
    <text class="t-b" x="32" y="371">FIX-2594 as approved; FIX-2628 reads old rows</text>
    <text class="t-s" x="32" y="389">once, and the read goes with the adapter</text>
  </g>
  <g id="flips-if">
    <rect class="foot" x="478" y="330" width="446" height="74" rx="5"/>
    <text class="t-lbl" x="494" y="351">FLIPS IF</text>
    <text class="t-b" x="494" y="371">FIX-2594 has not started when FIX-2627 merges</text>
    <text class="t-s" x="494" y="389">then the move is FIX-2628’s, with no rows left</text>
  </g>
</svg>
