<svg viewBox="0 0 940 428" role="img" aria-label="Q1, open for the owner: who hears an internal event? Recommended: anyone in the org who follows it. Instead of: only the publisher&#x27;s own user. It comes down to a team&#x27;s deploy: org-wide reaches the team&#x27;s routines, own-user reaches only the deployer. The cost of org-wide: one new server door where a request starts runs as teammates, and a teammate&#x27;s text can wake your session up to 30 times an hour, marked as information. Own-user needs no door and delivers as polling does. Locks in every routine on a topic hearing it, checked per delivery. Flips if no multi-person org needs it this quarter."
     xmlns="http://www.w3.org/2000/svg">
  <style>
    :root { --surface:#FCFCFA; --surface-2:#E8E8E1; --ink:#191C21; --ink-2:#4C535B; --ink-3:#7A828B;
            --rule:#D5D4CB; --accent:#3E4E8C; --accent-soft:#E0E3F0; --code:#2C7C69; --code-soft:#DCEDE7;
            --gone:#A9544F; }
    @media (prefers-color-scheme: dark) {
      :root { --surface:#181C1F; --surface-2:#202528; --ink:#E6E8E5; --ink-2:#A4ACB1; --ink-3:#737B81;
              --rule:#2B3135; --accent:#8B9BD8; --accent-soft:#1B2140; --code:#5DBBA1; --code-soft:#14302A;
              --gone:#DE8A84; } }
    .bg     { fill:var(--surface); }
    .ask    { fill:var(--surface-2); }
    .chosen { fill:var(--code-soft); stroke:var(--code); stroke-width:1.6; }
    .rec    { fill:var(--code-soft); stroke:var(--code); stroke-width:1.6; stroke-dasharray:5 4; }
    .lost   { fill:var(--surface); stroke:var(--rule); stroke-width:1.4; stroke-dasharray:5 4; }
    .decide { fill:var(--accent-soft); }
    .bar    { fill:var(--accent); }
    .row    { stroke:var(--rule); stroke-width:1; }
    .foot   { fill:var(--surface-2); }
    .t-lbl  { fill:var(--ink-3); font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:9.5px; letter-spacing:.1em; }
    .t-tag  { font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:9.5px; letter-spacing:.1em; font-weight:600; }
    .t-q    { fill:var(--ink); font-family:system-ui,-apple-system,sans-serif; font-weight:600; font-size:15px; }
    .t-h    { font-family:system-ui,-apple-system,sans-serif; font-weight:600; font-size:14px; }
    .t-b    { fill:var(--ink); font-family:system-ui,-apple-system,sans-serif; font-size:12.5px; }
    .t-s    { fill:var(--ink-2); font-family:system-ui,-apple-system,sans-serif; font-size:11px; }
    .mark   { font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:16px; font-weight:700; }
    .plus   { fill:var(--code); }
    .minus  { fill:var(--gone); }
    .tie    { fill:var(--ink-3); }
    .c-code { fill:var(--code); }
    .c-mute { fill:var(--ink-3); }
    .c-lost { fill:var(--ink-2); }
    .c-acc  { fill:var(--accent); }
  </style>
  <rect class="bg" x="0" y="0" width="940" height="428"/>

  <g id="the-call">
    <rect class="ask" x="16" y="14" width="908" height="48" rx="6"/>
    <text class="t-lbl" x="32" y="32">Q1 · OPEN, OWNER</text>
    <text class="t-q" x="32" y="52">Who hears an internal event?</text>
  </g>

  <g id="options">
    <rect class="rec" x="212" y="76" width="348" height="46" rx="5"/>
    <text class="t-tag c-code" x="228" y="93">RECOMMENDED</text>
    <text class="t-h c-code" x="228" y="112">Anyone in the org who follows it</text>
    <rect class="lost" x="576" y="76" width="348" height="46" rx="5"/>
    <text class="t-tag c-mute" x="592" y="93">INSTEAD OF</text>
    <text class="t-h c-lost" x="592" y="112">Only the publisher&#x27;s own user</text>
  </g>

  <g id="row-decides">
    <rect class="decide" x="16" y="134" width="908" height="62" rx="4"/>
    <rect class="bar" x="16" y="134" width="4" height="62"/>
    <text class="t-lbl" x="32" y="156">A TEAM&#x27;S</text>
    <text class="t-lbl" x="32" y="169">DEPLOY</text>
    <text class="t-tag c-acc" x="32" y="186">▸ DECIDES IT</text>
    <text class="mark plus" x="228" y="162">+</text>
    <text class="t-b" x="248" y="161">Reaches the team&#x27;s routines</text>
    <text class="t-s" x="248" y="179">the sender needn&#x27;t know who cares</text>
    <text class="mark minus" x="592" y="162">−</text>
    <text class="t-b" x="612" y="161">Reaches the deployer only</text>
    <text class="t-s" x="612" y="179">half the issue&#x27;s need</text>
  </g>
  <g id="row-1">
    <text class="t-lbl" x="32" y="221">THE SERVER</text>
    <text class="mark minus" x="228" y="224">−</text>
    <text class="t-b" x="248" y="223">One new door</text>
    <text class="t-s" x="248" y="241">a request starts runs as teammates</text>
    <text class="mark plus" x="592" y="224">+</text>
    <text class="t-b" x="612" y="223">No door</text>
    <text class="t-s" x="612" y="241">delivers as you, as polling does</text>
    <line class="row" x1="16" y1="256" x2="924" y2="256"/>
  </g>
  <g id="row-2">
    <text class="t-lbl" x="32" y="279">A TEAMMATE&#x27;S</text>
    <text class="t-lbl" x="32" y="292">TEXT</text>
    <text class="mark minus" x="228" y="282">−</text>
    <text class="t-b" x="248" y="281">Can wake your session</text>
    <text class="t-s" x="248" y="299">up to 30 an hour, marked information</text>
    <text class="mark plus" x="592" y="282">+</text>
    <text class="t-b" x="612" y="281">Never reaches you</text>
    <text class="t-s" x="612" y="299">only your own sessions&#x27; events do</text>
    <line class="row" x1="16" y1="314" x2="924" y2="314"/>
  </g>
  <g id="locks-in">
    <rect class="foot" x="16" y="340" width="446" height="74" rx="5"/>
    <text class="t-lbl" x="32" y="361">LOCKS IN</text>
    <text class="t-b" x="32" y="381">Every routine on a topic hears it</text>
    <text class="t-s" x="32" y="399">checked per delivery: row, topic, cap, budget</text>
  </g>
  <g id="flips-if">
    <rect class="foot" x="478" y="340" width="446" height="74" rx="5"/>
    <text class="t-lbl" x="494" y="361">FLIPS IF</text>
    <text class="t-b" x="494" y="381">No multi-person org needs it this quarter</text>
    <text class="t-s" x="494" y="399">then own-user first, the door when a team asks</text>
  </g>
</svg>
