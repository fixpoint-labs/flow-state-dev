<svg viewBox="0 0 940 418" role="img" aria-label="D1, whether BullMQ needs a scheduler adapter. Chosen: no adapter, the local cron with the store lease. Instead of: Redis cron fires the tick. It comes down to how many ways choose the ticker: with the store lease there is one for every host; a Redis adapter adds a second for BullMQ alone. Price: a BullMQ app on a store with no shared lease would double-tick, and hand-over takes up to three minutes. Tie: either way each scheduled time fires once at the endpoint. Locks in that the BullMQ schedule helpers are deleted. Flips if a BullMQ deployment runs on stores its processes do not share."
     xmlns="http://www.w3.org/2000/svg">
  <style>
    :root { --surface:#FCFCFA; --surface-2:#E8E8E1; --ink:#191C21; --ink-2:#4C535B; --ink-3:#7A828B;
            --rule:#D5D4CB; --accent:#3E4E8C; --accent-soft:#E0E3F0; --code:#2C7C69; --code-soft:#DCEDE7;
            --gone:#A9544F; }
    @media (prefers-color-scheme: dark) {
      :root { --surface:#181C1F; --surface-2:#202528; --ink:#E6E8E5; --ink-2:#A4ACB1; --ink-3:#737B81;
              --rule:#2B3135; --accent:#8B9BD8; --accent-soft:#1B2140; --code:#5DBBA1; --code-soft:#14302A;
              --gone:#DE8A84; } }
    .bg     { fill:var(--surface); }
    .ask    { fill:var(--surface-2); }
    .chosen { fill:var(--code-soft); stroke:var(--code); stroke-width:1.6; }
    .lost   { fill:var(--surface); stroke:var(--rule); stroke-width:1.4; stroke-dasharray:5 4; }
    .decide { fill:var(--accent-soft); }
    .bar    { fill:var(--accent); }
    .row    { stroke:var(--rule); stroke-width:1; }
    .foot   { fill:var(--surface-2); }
    .t-lbl  { fill:var(--ink-3); font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:9.5px; letter-spacing:.1em; }
    .t-tag  { font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:9.5px; letter-spacing:.1em; font-weight:600; }
    .t-q    { fill:var(--ink); font-family:system-ui,-apple-system,sans-serif; font-weight:600; font-size:15px; }
    .t-h    { font-family:system-ui,-apple-system,sans-serif; font-weight:600; font-size:14px; }
    .t-b    { fill:var(--ink); font-family:system-ui,-apple-system,sans-serif; font-size:12.5px; }
    .t-s    { fill:var(--ink-2); font-family:system-ui,-apple-system,sans-serif; font-size:11px; }
    .mark   { font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:16px; font-weight:700; }
    .plus   { fill:var(--code); }
    .minus  { fill:var(--gone); }
    .tie    { fill:var(--ink-3); }
    .c-code { fill:var(--code); }
    .c-mute { fill:var(--ink-3); }
    .c-lost { fill:var(--ink-2); }
    .c-acc  { fill:var(--accent); }
  </style>
  <rect class="bg" x="0" y="0" width="940" height="418"/>
  <g id="the-call">
    <rect class="ask" x="16" y="14" width="908" height="48" rx="6"/>
    <text class="t-lbl" x="32" y="32">D1 · THE CALL</text>
    <text class="t-q" x="32" y="52">Does the BullMQ job queue need its own scheduler adapter?</text>
  </g>
  <g id="options">
    <rect class="chosen" x="212" y="76" width="348" height="46" rx="5"/>
    <text class="t-tag c-code" x="228" y="93">CHOSEN</text>
    <text class="t-h c-code" x="228" y="112">No: the local cron and store lease</text>
    <rect class="lost" x="576" y="76" width="348" height="46" rx="5"/>
    <text class="t-tag c-mute" x="592" y="93">INSTEAD OF</text>
    <text class="t-h c-lost" x="592" y="112">Redis cron fires the tick</text>
  </g>
  <g id="row-decides">
    <rect class="decide" x="16" y="134" width="908" height="62" rx="4"/>
    <rect class="bar" x="16" y="134" width="4" height="62"/>
    <text class="t-lbl" x="32" y="156">WAYS TO CHOOSE</text>
    <text class="t-lbl" x="32" y="169">THE TICKER</text>
    <text class="t-tag c-acc" x="32" y="186">▸ DECIDES IT</text>
    <text class="mark plus" x="228" y="163">+</text>
    <text class="t-b" x="248" y="162">One, for every host</text>
    <text class="t-s" x="248" y="180">the store lease, as the sweeper uses</text>
    <text class="mark minus" x="592" y="163">−</text>
    <text class="t-b" x="612" y="162">Two</text>
    <text class="t-s" x="612" y="180">Redis for BullMQ, the lease for the rest</text>
  </g>
  <g id="row-1">
    <text class="t-lbl" x="32" y="224">HAND-OVER</text>
    <text class="mark minus" x="228" y="227">−</text>
    <text class="t-b" x="248" y="226">Up to three minutes</text>
    <text class="t-s" x="248" y="244">a crashed holder&#x27;s lease runs out</text>
    <text class="mark plus" x="592" y="227">+</text>
    <text class="t-b" x="612" y="226">At once</text>
    <text class="t-s" x="612" y="244">any worker takes the next job</text>
    <line class="row" x1="16" y1="254" x2="924" y2="254"/>
  </g>
  <g id="row-2">
    <text class="t-lbl" x="32" y="282">A SCHEDULED TIME</text>
    <text class="mark tie" x="228" y="285">=</text>
    <text class="t-b" x="248" y="284">Fires once</text>
    <text class="t-s" x="248" y="302">the endpoint&#x27;s record</text>
    <text class="mark tie" x="592" y="285">=</text>
    <text class="t-b" x="612" y="284">Fires once</text>
    <text class="t-s" x="612" y="302">the endpoint&#x27;s record</text>
    <line class="row" x1="16" y1="312" x2="924" y2="312"/>
  </g>
  <g id="locks-in">
    <rect class="foot" x="16" y="328" width="446" height="74" rx="5"/>
    <text class="t-lbl" x="32" y="349">LOCKS IN</text>
    <text class="t-b" x="32" y="369">The BullMQ schedule helpers are deleted</text>
    <text class="t-s" x="32" y="387">registerStaticSchedules, the dispatch worker, the index</text>
  </g>
  <g id="flips-if">
    <rect class="foot" x="478" y="328" width="446" height="74" rx="5"/>
    <text class="t-lbl" x="494" y="349">FLIPS IF</text>
    <text class="t-b" x="494" y="369">A BullMQ deployment&#x27;s stores are not shared</text>
    <text class="t-s" x="494" y="387">then nothing but Redis can elect</text>
  </g>
</svg>
