<svg viewBox="0 0 940 418" role="img" aria-label="D2, what more than one server on in-memory or filesystem stores gets. Chosen: a warning at start. Instead of: refusing. It comes down to what the process can see: an in-memory lease cannot see a second server and a filesystem lease can race, so a refusal would hit every such app, fsdev dev and tests included. Price: two in-memory production servers can double-fire a static schedule. Tie: one in-memory server works either way. Locks in a production warning. Flips if in-memory stores become a production target."
     xmlns="http://www.w3.org/2000/svg">
  <style>
    :root { --surface:#FCFCFA; --surface-2:#E8E8E1; --ink:#191C21; --ink-2:#4C535B; --ink-3:#7A828B;
            --rule:#D5D4CB; --accent:#3E4E8C; --accent-soft:#E0E3F0; --code:#2C7C69; --code-soft:#DCEDE7;
            --gone:#A9544F; }
    @media (prefers-color-scheme: dark) {
      :root { --surface:#181C1F; --surface-2:#202528; --ink:#E6E8E5; --ink-2:#A4ACB1; --ink-3:#737B81;
              --rule:#2B3135; --accent:#8B9BD8; --accent-soft:#1B2140; --code:#5DBBA1; --code-soft:#14302A;
              --gone:#DE8A84; } }
    .bg     { fill:var(--surface); }
    .ask    { fill:var(--surface-2); }
    .chosen { fill:var(--code-soft); stroke:var(--code); stroke-width:1.6; }
    .lost   { fill:var(--surface); stroke:var(--rule); stroke-width:1.4; stroke-dasharray:5 4; }
    .decide { fill:var(--accent-soft); }
    .bar    { fill:var(--accent); }
    .row    { stroke:var(--rule); stroke-width:1; }
    .foot   { fill:var(--surface-2); }
    .t-lbl  { fill:var(--ink-3); font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:9.5px; letter-spacing:.1em; }
    .t-tag  { font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:9.5px; letter-spacing:.1em; font-weight:600; }
    .t-q    { fill:var(--ink); font-family:system-ui,-apple-system,sans-serif; font-weight:600; font-size:15px; }
    .t-h    { font-family:system-ui,-apple-system,sans-serif; font-weight:600; font-size:14px; }
    .t-b    { fill:var(--ink); font-family:system-ui,-apple-system,sans-serif; font-size:12.5px; }
    .t-s    { fill:var(--ink-2); font-family:system-ui,-apple-system,sans-serif; font-size:11px; }
    .mark   { font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:16px; font-weight:700; }
    .plus   { fill:var(--code); }
    .minus  { fill:var(--gone); }
    .tie    { fill:var(--ink-3); }
    .c-code { fill:var(--code); }
    .c-mute { fill:var(--ink-3); }
    .c-lost { fill:var(--ink-2); }
    .c-acc  { fill:var(--accent); }
  </style>
  <rect class="bg" x="0" y="0" width="940" height="418"/>
  <g id="the-call">
    <rect class="ask" x="16" y="14" width="908" height="48" rx="6"/>
    <text class="t-lbl" x="32" y="32">D2 · THE CALL</text>
    <text class="t-q" x="32" y="52">What does more than one server on in-memory or filesystem stores get?</text>
  </g>
  <g id="options">
    <rect class="chosen" x="212" y="76" width="348" height="46" rx="5"/>
    <text class="t-tag c-code" x="228" y="93">CHOSEN</text>
    <text class="t-h c-code" x="228" y="112">A warning at start</text>
    <rect class="lost" x="576" y="76" width="348" height="46" rx="5"/>
    <text class="t-tag c-mute" x="592" y="93">INSTEAD OF</text>
    <text class="t-h c-lost" x="592" y="112">Refuse to start the local cron</text>
  </g>
  <g id="row-decides">
    <rect class="decide" x="16" y="134" width="908" height="62" rx="4"/>
    <rect class="bar" x="16" y="134" width="4" height="62"/>
    <text class="t-lbl" x="32" y="156">WHAT THE PROCESS</text>
    <text class="t-lbl" x="32" y="169">CAN SEE</text>
    <text class="t-tag c-acc" x="32" y="186">▸ DECIDES IT</text>
    <text class="mark plus" x="228" y="163">+</text>
    <text class="t-b" x="248" y="162">Warns only in production</text>
    <text class="t-s" x="248" y="180">one line, the app still runs</text>
    <text class="mark minus" x="592" y="163">−</text>
    <text class="t-b" x="612" y="162">Refuses every such app</text>
    <text class="t-s" x="612" y="180">fsdev dev and tests included</text>
  </g>
  <g id="row-1">
    <text class="t-lbl" x="32" y="224">TWO SUCH</text>
    <text class="t-lbl" x="32" y="237">SERVERS</text>
    <text class="mark minus" x="228" y="227">−</text>
    <text class="t-b" x="248" y="226">Can double-fire</text>
    <text class="t-s" x="248" y="244">a static schedule, after the warning</text>
    <text class="mark plus" x="592" y="227">+</text>
    <text class="t-b" x="612" y="226">Cannot start</text>
    <text class="t-s" x="612" y="244">the schedules don&#x27;t run at all</text>
    <line class="row" x1="16" y1="254" x2="924" y2="254"/>
  </g>
  <g id="row-2">
    <text class="t-lbl" x="32" y="282">ONE SERVER, OR</text>
    <text class="t-lbl" x="32" y="295">FSDEV DEV</text>
    <text class="mark tie" x="228" y="285">=</text>
    <text class="t-b" x="248" y="284">Works</text>
    <text class="t-s" x="248" y="302">the lease is its own</text>
    <text class="mark minus" x="592" y="285">−</text>
    <text class="t-b" x="612" y="284">Breaks</text>
    <text class="t-s" x="612" y="302">unless refusal skips dev</text>
    <line class="row" x1="16" y1="312" x2="924" y2="312"/>
  </g>
  <g id="locks-in">
    <rect class="foot" x="16" y="328" width="446" height="74" rx="5"/>
    <text class="t-lbl" x="32" y="349">LOCKS IN</text>
    <text class="t-b" x="32" y="369">A production warning on in-memory and filesystem</text>
    <text class="t-s" x="32" y="387">SQLite and Postgres need nothing</text>
  </g>
  <g id="flips-if">
    <rect class="foot" x="478" y="328" width="446" height="74" rx="5"/>
    <text class="t-lbl" x="494" y="349">FLIPS IF</text>
    <text class="t-b" x="494" y="369">In-memory stores become a production target</text>
    <text class="t-s" x="494" y="387">today startup already warns there</text>
  </g>
</svg>
