<svg viewBox="0 0 940 360" role="img" aria-label="Before and after. Before, the engine&#x27;s tick sends each fire to a route that only exists if the app passes createScheduledTransportAdapter from the scheduled package, and startup refuses a flow with schedules when it is missing. After, the router mounts the scheduled endpoint itself, beside the HTTP routes, and the scheduled package keeps only what a flow definition needs: schedule collections, the resolver, the index contract."
     xmlns="http://www.w3.org/2000/svg">
  <style>
    :root { --surface:#FCFCFA; --surface-2:#E8E8E1; --ink:#191C21; --ink-2:#4C535B; --ink-3:#7A828B;
            --rule:#D5D4CB; --accent:#3E4E8C; --accent-soft:#E0E3F0; --code:#2C7C69; --code-soft:#DCEDE7;
            --gone:#A9544F; }
    @media (prefers-color-scheme: dark) {
      :root { --surface:#181C1F; --surface-2:#202528; --ink:#E6E8E5; --ink-2:#A4ACB1; --ink-3:#737B81;
              --rule:#2B3135; --accent:#8B9BD8; --accent-soft:#1B2140; --code:#5DBBA1; --code-soft:#14302A;
              --gone:#DE8A84; } }
    .bg     { fill:var(--surface); }
    .ask    { fill:var(--surface-2); }
    .chosen { fill:var(--code-soft); stroke:var(--code); stroke-width:1.6; }
    .lost   { fill:var(--surface); stroke:var(--rule); stroke-width:1.4; stroke-dasharray:5 4; }
    .decide { fill:var(--accent-soft); }
    .bar    { fill:var(--accent); }
    .row    { stroke:var(--rule); stroke-width:1; }
    .foot   { fill:var(--surface-2); }
    .t-lbl  { fill:var(--ink-3); font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:9.5px; letter-spacing:.1em; }
    .t-tag  { font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:9.5px; letter-spacing:.1em; font-weight:600; }
    .t-q    { fill:var(--ink); font-family:system-ui,-apple-system,sans-serif; font-weight:600; font-size:15px; }
    .t-h    { font-family:system-ui,-apple-system,sans-serif; font-weight:600; font-size:14px; }
    .t-b    { fill:var(--ink); font-family:system-ui,-apple-system,sans-serif; font-size:12.5px; }
    .t-s    { fill:var(--ink-2); font-family:system-ui,-apple-system,sans-serif; font-size:11px; }
    .mark   { font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:16px; font-weight:700; }
    .plus   { fill:var(--code); }
    .minus  { fill:var(--gone); }
    .tie    { fill:var(--ink-3); }
    .c-code { fill:var(--code); }
    .c-mute { fill:var(--ink-3); }
    .c-lost { fill:var(--ink-2); }
    .c-acc  { fill:var(--accent); }
    .box    { fill:var(--surface); stroke:var(--rule); stroke-width:1.2; }
    .gonebox{ fill:var(--surface); stroke:var(--gone); stroke-width:1.4; stroke-dasharray:5 4; }
    .newbox { fill:var(--code-soft); stroke:var(--code); stroke-width:1.6; }
    .arrow  { stroke:var(--ink-3); stroke-width:1.4; fill:none; }
    .c-gone { fill:var(--gone); }
  </style>
  <rect class="bg" x="0" y="0" width="940" height="360"/>
  <text class="t-lbl" x="24" y="30">BEFORE · TWO PACKAGES, ONE LINE</text>
  <text class="t-lbl" x="488" y="30">AFTER · THE ENGINE MOUNTS IT</text>
  <line class="row" x1="470" y1="16" x2="470" y2="344"/>
  <rect class="box" x="24" y="46" width="200" height="92" rx="6"/>
  <text class="t-h c-acc" x="38" y="68">engine</text>
  <text class="t-b" x="38" y="90">the tick</text>
  <text class="t-b" x="38" y="108">the router · HTTP routes</text>
  <text class="t-s c-gone" x="38" y="127">refuses at startup if no line</text>
  <rect class="box" x="246" y="46" width="200" height="92" rx="6"/>
  <text class="t-h c-acc" x="260" y="68">scheduled</text>
  <text class="t-b" x="260" y="90">the dispatch endpoint</text>
  <text class="t-b" x="260" y="108">collections · resolver</text>
  <text class="t-b" x="260" y="126">index contract</text>
  <rect class="gonebox" x="24" y="162" width="422" height="56" rx="6"/>
  <text class="t-tag c-gone" x="38" y="182">THE APP WRITES</text>
  <text class="t-b" x="38" y="204">adapters: [createScheduledTransportAdapter()]</text>
  <path class="arrow" d="M124 138 V 154"/>
  <path class="arrow" d="M346 138 V 154"/>
  <text class="t-s" x="24" y="250">The tick sends each fire to a route that only</text>
  <text class="t-s" x="24" y="266">exists when the app wires the second package in.</text>
  <rect class="box" x="488" y="46" width="230" height="130" rx="6"/>
  <text class="t-h c-acc" x="502" y="68">engine</text>
  <text class="t-b" x="502" y="90">the tick</text>
  <text class="t-b" x="502" y="108">the router · HTTP routes</text>
  <rect class="newbox" x="498" y="120" width="210" height="44" rx="5"/>
  <text class="t-tag c-code" x="510" y="137">BUILT IN · EVERY APP</text>
  <text class="t-b" x="510" y="155">the dispatch endpoint</text>
  <rect class="box" x="736" y="46" width="180" height="92" rx="6"/>
  <text class="t-h c-acc" x="750" y="68">scheduled</text>
  <text class="t-b" x="750" y="90">collections · resolver</text>
  <text class="t-b" x="750" y="108">index contract</text>
  <text class="t-s" x="750" y="127">what a flow definition needs</text>
  <rect class="box" x="488" y="198" width="428" height="56" rx="6"/>
  <text class="t-tag c-mute" x="502" y="218">THE APP WRITES</text>
  <text class="t-b" x="502" y="240">schedules on the flow · nothing else</text>
  <text class="t-s" x="488" y="286">The endpoint sits beside the tick that sends to it,</text>
  <text class="t-s" x="488" y="302">and the scheduled package no longer serves a route.</text>
</svg>
