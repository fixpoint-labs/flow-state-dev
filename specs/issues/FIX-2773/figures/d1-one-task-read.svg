<svg viewBox="0 0 940 420" role="img" aria-label="D1, where an open popup gets its task's answer, and a re-run its brief. Chosen: the answer on the open popup's own board read, through an optional taskId input that fills detail on the named row only; a re-run reads the brief whole through the Inbox client's get. Instead of: the answer and brief on every row of the board. It comes down to the first row, the size of a board read: unchanged with the chosen option, about 26 KB for 50 tasks and 265 KB at the 500-task cap, measured at 530 bytes a row; with the other, about 180 KB for 50 tasks with 3 KB answers and about 10 MB at the cap, for every app on every load. The price is the second row: the popup's read carries one answer more, at most about 20 KB, and a re-run reads its brief whole first, where the other option needs no extra read. The third row is a tie: either way it is one change to harness-manager's published view, with a changeset. Locks in: an optional taskId input and a nullable detail on the row. Flips if: a screen needs many tasks' answers at once."
     xmlns="http://www.w3.org/2000/svg">
  <style>
    :root { --surface:#FCFCFA; --surface-2:#E8E8E1; --ink:#191C21; --ink-2:#4C535B; --ink-3:#7A828B;
            --rule:#D5D4CB; --accent:#3E4E8C; --accent-soft:#E0E3F0; --code:#2C7C69; --code-soft:#DCEDE7;
            --gone:#A9544F; }
    @media (prefers-color-scheme: dark) {
      :root { --surface:#181C1F; --surface-2:#202528; --ink:#E6E8E5; --ink-2:#A4ACB1; --ink-3:#737B81;
              --rule:#2B3135; --accent:#8B9BD8; --accent-soft:#1B2140; --code:#5DBBA1; --code-soft:#14302A;
              --gone:#DE8A84; } }
    .bg     { fill:var(--surface); }
    .ask    { fill:var(--surface-2); }
    .chosen { fill:var(--code-soft); stroke:var(--code); stroke-width:1.6; }
    .lost   { fill:var(--surface); stroke:var(--rule); stroke-width:1.4; stroke-dasharray:5 4; }
    .decide { fill:var(--accent-soft); }
    .bar    { fill:var(--accent); }
    .row    { stroke:var(--rule); stroke-width:1; }
    .foot   { fill:var(--surface-2); }
    .t-lbl  { fill:var(--ink-3); font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:9.5px; letter-spacing:.1em; }
    .t-tag  { font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:9.5px; letter-spacing:.1em; font-weight:600; }
    .t-q    { fill:var(--ink); font-family:system-ui,-apple-system,sans-serif; font-weight:600; font-size:15px; }
    .t-h    { font-family:system-ui,-apple-system,sans-serif; font-weight:600; font-size:14px; }
    .t-b    { fill:var(--ink); font-family:system-ui,-apple-system,sans-serif; font-size:12.5px; }
    .t-s    { fill:var(--ink-2); font-family:system-ui,-apple-system,sans-serif; font-size:11px; }
    .mark   { font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:16px; font-weight:700; }
    .plus   { fill:var(--code); }
    .minus  { fill:var(--gone); }
    .tie    { fill:var(--ink-3); }
    .c-code { fill:var(--code); }
    .c-mute { fill:var(--ink-3); }
    .c-lost { fill:var(--ink-2); }
    .c-acc  { fill:var(--accent); }
  </style>
  <rect class="bg" x="0" y="0" width="940" height="420"/>

  <g id="the-call">
    <rect class="ask" x="16" y="14" width="908" height="48" rx="6"/>
    <text class="t-lbl" x="32" y="32">D1 · THE CALL</text>
    <text class="t-q" x="32" y="52">Where does an open popup get its task's answer?</text>
  </g>

  <g id="options">
    <rect class="chosen" x="212" y="76" width="348" height="46" rx="5"/>
    <text class="t-tag c-code" x="228" y="93">CHOSEN</text>
    <text class="t-h c-code" x="228" y="112">By taskId, on the popup's own read</text>
    <rect class="lost" x="576" y="76" width="348" height="46" rx="5"/>
    <text class="t-tag c-mute" x="592" y="93">INSTEAD OF</text>
    <text class="t-h c-lost" x="592" y="112">On every row of the board</text>
  </g>

  <g id="row-decides">
    <rect class="decide" x="16" y="134" width="908" height="62" rx="4"/>
    <rect class="bar" x="16" y="134" width="4" height="62"/>
    <text class="t-lbl" x="32" y="156">A BOARD</text>
    <text class="t-lbl" x="32" y="169">READ'S SIZE</text>
    <text class="t-tag c-acc" x="32" y="186">▸ DECIDES IT</text>
    <text class="mark plus" x="228" y="162">+</text>
    <text class="t-b" x="248" y="161">Unchanged: 26 KB for 50 tasks</text>
    <text class="t-s" x="248" y="179">265 KB at the 500-task cap · 530 B a row, measured</text>
    <text class="mark minus" x="592" y="162">−</text>
    <text class="t-b" x="612" y="161">About 180 KB for 50 tasks</text>
    <text class="t-s" x="612" y="179">about 10 MB at the cap · every app, every load</text>
  </g>

  <g id="row-price">
    <text class="t-lbl" x="32" y="222">AN OPEN POPUP</text>
    <text class="mark minus" x="228" y="224">−</text>
    <text class="t-b" x="248" y="223">Its read carries one answer more</text>
    <text class="t-s" x="248" y="241">at most about 20 KB; the brief: one whole read on re-run</text>
    <text class="mark plus" x="592" y="224">+</text>
    <text class="t-b" x="612" y="223">Needs no extra read</text>
    <text class="t-s" x="612" y="241">the answer is already on its row</text>
    <line class="row" x1="16" y1="256" x2="924" y2="256"/>
  </g>

  <g id="row-tie">
    <text class="t-lbl" x="32" y="280">PUBLISHED SURFACE</text>
    <text class="mark tie" x="228" y="282">=</text>
    <text class="t-b" x="248" y="281">A view input, a nullable detail, a get</text>
    <text class="t-s" x="248" y="299">harness-manager and orchestration, two changesets</text>
    <text class="mark tie" x="592" y="282">=</text>
    <text class="t-b" x="612" y="281">Five fields on every row</text>
    <text class="t-s" x="612" y="299">harness-manager, with a changeset</text>
    <line class="row" x1="16" y1="314" x2="924" y2="314"/>
  </g>

  <g id="locks-in">
    <rect class="foot" x="16" y="330" width="446" height="74" rx="5"/>
    <text class="t-lbl" x="32" y="351">LOCKS IN</text>
    <text class="t-b" x="32" y="371">taskId: every row, detail on the named one</text>
    <text class="t-s" x="32" y="389">answer cut at 20,000 · BoardActions.get for the brief</text>
  </g>

  <g id="flips-if">
    <rect class="foot" x="478" y="330" width="446" height="74" rx="5"/>
    <text class="t-lbl" x="494" y="351">FLIPS IF</text>
    <text class="t-b" x="494" y="371">A screen needs many tasks' answers at once</text>
    <text class="t-s" x="494" y="389">then a capped preview on the row, beside this read</text>
  </g>
</svg>
