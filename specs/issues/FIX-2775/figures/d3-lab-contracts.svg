<svg viewBox="0 0 940 420" role="img" aria-label="D3, who owns the two Lab contracts Shift Manager reads: the project setup view and the connector keys route. Chosen: workforce&#x27;s defineProjectBlocks serves both, moved from Shift Manager&#x27;s DevTeam fixture host, beside checkRepository and with the same offered servers. Instead of: leave them in the fixture, and list Shift Manager&#x27;s copies of their types as screen types. It comes down to who owns the contract: workforce owns the project coordinator and the keys collection, its prefix and its verified-caller rule. Price: a view and a route in a package. Tie: the screens and their words stay; a Lab without them still answers 404. Locks in both inside defineProjectBlocks, in connector names, which FIX-2645&#x27;s Teammates lab imports. Flips if the owner wants both kept as DevTeam-only features"
     xmlns="http://www.w3.org/2000/svg">
  <style>
    :root { --surface:#FCFCFA; --surface-2:#E8E8E1; --ink:#191C21; --ink-2:#4C535B; --ink-3:#7A828B;
            --rule:#D5D4CB; --accent:#3E4E8C; --accent-soft:#E0E3F0; --code:#2C7C69; --code-soft:#DCEDE7;
            --gone:#A9544F; }
    @media (prefers-color-scheme: dark) {
      :root { --surface:#181C1F; --surface-2:#202528; --ink:#E6E8E5; --ink-2:#A4ACB1; --ink-3:#737B81;
              --rule:#2B3135; --accent:#8B9BD8; --accent-soft:#1B2140; --code:#5DBBA1; --code-soft:#14302A;
              --gone:#DE8A84; } }
    .bg     { fill:var(--surface); }
    .ask    { fill:var(--surface-2); }
    .chosen { fill:var(--code-soft); stroke:var(--code); stroke-width:1.6; }
    .lost   { fill:var(--surface); stroke:var(--rule); stroke-width:1.4; stroke-dasharray:5 4; }
    .decide { fill:var(--accent-soft); }
    .bar    { fill:var(--accent); }
    .row    { stroke:var(--rule); stroke-width:1; }
    .foot   { fill:var(--surface-2); }
    .t-lbl  { fill:var(--ink-3); font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:9.5px; letter-spacing:.1em; }
    .t-tag  { font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:9.5px; letter-spacing:.1em; font-weight:600; }
    .t-q    { fill:var(--ink); font-family:system-ui,-apple-system,sans-serif; font-weight:600; font-size:15px; }
    .t-h    { font-family:system-ui,-apple-system,sans-serif; font-weight:600; font-size:14px; }
    .t-b    { fill:var(--ink); font-family:system-ui,-apple-system,sans-serif; font-size:12.5px; }
    .t-s    { fill:var(--ink-2); font-family:system-ui,-apple-system,sans-serif; font-size:11px; }
    .mark   { font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:16px; font-weight:700; }
    .plus   { fill:var(--code); }
    .minus  { fill:var(--gone); }
    .tie    { fill:var(--ink-3); }
    .c-code { fill:var(--code); }
    .c-mute { fill:var(--ink-3); }
    .c-lost { fill:var(--ink-2); }
    .c-acc  { fill:var(--accent); }
  </style>
  <rect class="bg" x="0" y="0" width="940" height="420"/>
  <g id="the-call">
    <rect class="ask" x="16" y="14" width="908" height="48" rx="6"/>
    <text class="t-lbl" x="32" y="32">D3 · THE CALL</text>
    <text class="t-q" x="32" y="52">Who owns the project setup view and the connector keys route Shift Manager reads?</text>
  </g>
  <g id="options">
    <rect class="chosen" x="212" y="76" width="348" height="46" rx="5"/>
    <text class="t-tag c-code" x="228" y="93">CHOSEN</text>
    <text class="t-h c-code" x="228" y="112">defineProjectBlocks, in workforce</text>
    <rect class="lost" x="576" y="76" width="348" height="46" rx="5"/>
    <text class="t-tag c-mute" x="592" y="93">INSTEAD OF</text>
    <text class="t-h c-lost" x="592" y="112">The DevTeam fixture host, as today</text>
  </g>
  <g id="row-decides">
    <rect class="decide" x="16" y="134" width="908" height="62" rx="4"/>
    <rect class="bar" x="16" y="134" width="4" height="62"/>
    <text class="t-lbl" x="32" y="156">WHO OWNS</text>
    <text class="t-lbl" x="32" y="169">THE CONTRACT</text>
    <text class="t-tag c-acc" x="32" y="186">▸ DECIDES IT</text>
    <text class="mark plus" x="228" y="162">+</text>
    <text class="t-b" x="248" y="161">Workforce, beside its data</text>
    <text class="t-s" x="248" y="179">the coordinator, the keys collection, BP-031</text>
    <text class="mark minus" x="592" y="162">−</text>
    <text class="t-b" x="612" y="161">A test host</text>
    <text class="t-s" x="612" y="179">Shift Manager hand-writes its types</text>
  </g>
  <g id="row-0">
    <text class="t-lbl" x="32" y="222">WHO SERVES IT</text>
    <text class="mark plus" x="228" y="224">+</text>
    <text class="t-b" x="248" y="223">Every projects flow</text>
    <text class="t-s" x="248" y="241">claude-code-style, Teammates, DevTeam</text>
    <text class="mark minus" x="592" y="224">−</text>
    <text class="t-b" x="612" y="223">Only the DevTeam Lab</text>
    <text class="t-s" x="612" y="241">Teammates would copy the route</text>
    <line class="row" x1="16" y1="256" x2="924" y2="256"/>
  </g>
  <g id="row-1">
    <text class="t-lbl" x="32" y="280">THE ALLOWLIST</text>
    <text class="mark plus" x="228" y="282">+</text>
    <text class="t-b" x="248" y="281">Empty, honestly</text>
    <text class="t-s" x="248" y="299">the types come from the package</text>
    <text class="mark minus" x="592" y="282">−</text>
    <text class="t-b" x="612" y="281">Empty by relabeling</text>
    <text class="t-s" x="612" y="299">copies listed as screen types</text>
    <line class="row" x1="16" y1="314" x2="924" y2="314"/>
  </g>
  <g id="locks-in">
    <rect class="foot" x="16" y="330" width="446" height="74" rx="5"/>
    <text class="t-lbl" x="32" y="351">LOCKS IN</text>
    <text class="t-b" x="32" y="371">Both inside defineProjectBlocks</text>
    <text class="t-s" x="32" y="389">connector names; FIX-2645&#x27;s lab imports the route</text>
  </g>
  <g id="flips-if">
    <rect class="foot" x="478" y="330" width="446" height="74" rx="5"/>
    <text class="t-lbl" x="494" y="351">FLIPS IF</text>
    <text class="t-b" x="494" y="371">The owner keeps both DevTeam-only</text>
    <text class="t-s" x="494" y="389">then the three types are screen types, with that reason</text>
  </g>
</svg>
