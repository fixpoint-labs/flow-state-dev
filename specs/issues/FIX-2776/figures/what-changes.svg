<svg viewBox="0 0 940 400" role="img" aria-label="Before and after for the conversation, coordinator, session and task screens. Before: they read through four app modules, run.ts, send.ts, action.ts with delegates.ts, and task.tsx, which call client.flow, sessionFeed and topic, and through the snapshot. After: they read through react's useSessionFeed, useRequestStream and useView over package views, and write through workforce's client and orchestration's board actions; the four modules and the snapshot reads are gone"
     xmlns="http://www.w3.org/2000/svg">
  <style>
    :root { --surface:#FCFCFA; --surface-2:#E8E8E1; --ink:#191C21; --ink-2:#4C535B; --ink-3:#7A828B;
            --rule:#D5D4CB; --accent:#3E4E8C; --accent-soft:#E0E3F0; --code:#2C7C69; --code-soft:#DCEDE7;
            --prose:#A8761C; --prose-soft:#F3E8D2; --gone:#A9544F; }
    @media (prefers-color-scheme: dark) {
      :root { --surface:#181C1F; --surface-2:#202528; --ink:#E6E8E5; --ink-2:#A4ACB1; --ink-3:#737B81;
              --rule:#2B3135; --accent:#8B9BD8; --accent-soft:#1B2140; --code:#5DBBA1; --code-soft:#14302A;
              --prose:#D9A44B; --prose-soft:#332612; --gone:#DE8A84; } }
    .bg     { fill:var(--surface); }
    .panel  { fill:var(--surface-2); }
    .screen { fill:var(--surface); stroke:var(--rule); stroke-width:1.2; }
    .gone   { fill:var(--surface); stroke:var(--gone); stroke-width:1.4; stroke-dasharray:5 4; }
    .pkg    { fill:var(--code-soft); stroke:var(--code); stroke-width:1.4; }
    .view   { fill:var(--accent-soft); stroke:var(--accent); stroke-width:1.2; }
    .strike { stroke:var(--gone); stroke-width:1.6; }
    .arrow  { stroke:var(--ink-3); stroke-width:1.2; fill:none; }
    .t-lbl  { fill:var(--ink-3); font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:9.5px; letter-spacing:.1em; }
    .t-b    { fill:var(--ink); font-family:system-ui,-apple-system,sans-serif; font-weight:600; font-size:13px; }
    .t-s    { fill:var(--ink-2); font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:10px; }
    .t-g    { fill:var(--gone); font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:10px; }
  </style>
  <rect class="bg" x="0" y="0" width="940" height="400"/>
  <g id="before">
    <rect class="panel" x="16" y="16" width="446" height="368" rx="6"/>
    <text class="t-lbl" x="32" y="38">BEFORE</text>
    <rect class="screen" x="32" y="50" width="414" height="44" rx="5"/>
    <text class="t-b" x="48" y="70">Conversation · Coordinator · Session · Task</text>
    <text class="t-s" x="48" y="86">twelve screens, and the snapshot's inventory, sessions, boards</text>
    <path class="arrow" d="M239 94 V110"/>
    <rect class="gone" x="32" y="112" width="200" height="54" rx="5"/>
    <text class="t-b" x="48" y="134">run.ts</text>
    <text class="t-g" x="48" y="152">poll · follow · abort</text>
    <rect class="gone" x="246" y="112" width="200" height="54" rx="5"/>
    <text class="t-b" x="262" y="134">send.ts</text>
    <text class="t-g" x="262" y="152">send · poll · read back</text>
    <rect class="gone" x="32" y="176" width="200" height="54" rx="5"/>
    <text class="t-b" x="48" y="198">action.ts · delegates.ts</text>
    <text class="t-g" x="48" y="216">an action per look</text>
    <rect class="gone" x="246" y="176" width="200" height="54" rx="5"/>
    <text class="t-b" x="262" y="198">task.tsx</text>
    <text class="t-g" x="262" y="216">board re-read on a topic</text>
    <path class="arrow" d="M239 230 V256"/>
    <rect class="screen" x="32" y="258" width="414" height="54" rx="5"/>
    <text class="t-lbl" x="48" y="278">THE CLIENT, CALLED FROM THE APP</text>
    <text class="t-s" x="48" y="298">client.flow( ) · sessionFeed · topic · ClientHttpError</text>
    <text class="t-g" x="32" y="342">32 allowlist entries · four modules · three session reads</text>
    <text class="t-s" x="32" y="362">every arrow ends in app code that reaches the server</text>
  </g>
  <g id="after">
    <rect class="panel" x="478" y="16" width="446" height="368" rx="6"/>
    <text class="t-lbl" x="494" y="38">AFTER</text>
    <rect class="screen" x="494" y="50" width="414" height="44" rx="5"/>
    <text class="t-b" x="510" y="70">Conversation · Coordinator · Session · Task</text>
    <text class="t-s" x="510" y="86">the same twelve screens, off the snapshot</text>
    <path class="arrow" d="M701 94 V110"/>
    <rect class="pkg" x="494" y="112" width="200" height="54" rx="5"/>
    <text class="t-b" x="510" y="134">react hooks</text>
    <text class="t-s" x="510" y="152">useSessionFeed · useView</text>
    <rect class="pkg" x="708" y="112" width="200" height="54" rx="5"/>
    <text class="t-b" x="724" y="134">react request stream</text>
    <text class="t-s" x="724" y="152">useRequestStream</text>
    <rect class="pkg" x="494" y="176" width="200" height="54" rx="5"/>
    <text class="t-b" x="510" y="198">workforce client · 5 calls</text>
    <text class="t-s" x="510" y="216">send · stopRun · upload</text>
    <rect class="pkg" x="708" y="176" width="200" height="54" rx="5"/>
    <text class="t-b" x="724" y="198">orchestration</text>
    <text class="t-s" x="724" y="216">board actions · item types</text>
    <path class="arrow" d="M701 230 V256"/>
    <rect class="view" x="494" y="258" width="414" height="54" rx="5"/>
    <text class="t-lbl" x="510" y="278">VIEWS THE SERVER KEEPS CURRENT</text>
    <text class="t-s" x="510" y="298">delegates (new) · task list · session turns · roster</text>
    <text class="t-g" x="494" y="342">0 entries for this area · modules deleted</text>
    <text class="t-s" x="494" y="362">every arrow ends in a package</text>
  </g>
</svg>
