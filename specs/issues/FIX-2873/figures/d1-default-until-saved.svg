<svg viewBox="0 0 940 418" role="img" aria-label="D1: when GITHUB_REVIEWERS applies. Chosen: the default until the first save. Instead of: seed the store once at first start, or fall back whenever the list is empty. Decides it: the operator empties the list to stop all steering; chosen and seed-once trust nobody, fallback trusts the setting&#x27;s logins again. Price: after a save, a changed setting is ignored with no warning, for chosen and seed-once alike. A setting changed before any save: chosen and fallback apply it on restart, seed-once ignores it. Locks in: the setting is a default, never an override. Flips if: operators need the setting to win over a saved list."
     xmlns="http://www.w3.org/2000/svg">
  <style>
    :root { --surface:#FCFCFA; --surface-2:#E8E8E1; --ink:#191C21; --ink-2:#4C535B; --ink-3:#7A828B;
            --rule:#D5D4CB; --accent:#3E4E8C; --accent-soft:#E0E3F0; --code:#2C7C69; --code-soft:#DCEDE7;
            --gone:#A9544F; }
    @media (prefers-color-scheme: dark) {
      :root { --surface:#181C1F; --surface-2:#202528; --ink:#E6E8E5; --ink-2:#A4ACB1; --ink-3:#737B81;
              --rule:#2B3135; --accent:#8B9BD8; --accent-soft:#1B2140; --code:#5DBBA1; --code-soft:#14302A;
              --gone:#DE8A84; } }
    .bg     { fill:var(--surface); }
    .ask    { fill:var(--surface-2); }
    .chosen { fill:var(--code-soft); stroke:var(--code); stroke-width:1.6; }
    .lost   { fill:var(--surface); stroke:var(--rule); stroke-width:1.4; stroke-dasharray:5 4; }
    .decide { fill:var(--accent-soft); }
    .bar    { fill:var(--accent); }
    .row    { stroke:var(--rule); stroke-width:1; }
    .foot   { fill:var(--surface-2); }
    .t-lbl  { fill:var(--ink-3); font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:9.5px; letter-spacing:.1em; }
    .t-tag  { font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:9.5px; letter-spacing:.1em; font-weight:600; }
    .t-q    { fill:var(--ink); font-family:system-ui,-apple-system,sans-serif; font-weight:600; font-size:15px; }
    .t-h    { font-family:system-ui,-apple-system,sans-serif; font-weight:600; font-size:14px; }
    .t-b    { fill:var(--ink); font-family:system-ui,-apple-system,sans-serif; font-size:12.5px; }
    .t-s    { fill:var(--ink-2); font-family:system-ui,-apple-system,sans-serif; font-size:11px; }
    .mark   { font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:16px; font-weight:700; }
    .plus   { fill:var(--code); }
    .minus  { fill:var(--gone); }
    .tie    { fill:var(--ink-3); }
    .c-code { fill:var(--code); }
    .c-mute { fill:var(--ink-3); }
    .c-lost { fill:var(--ink-2); }
    .c-acc  { fill:var(--accent); }
  </style>
  <rect class="bg" x="0" y="0" width="940" height="418"/>

  <g id="the-call">
    <rect class="ask" x="16" y="14" width="908" height="48" rx="6"/>
    <text class="t-lbl" x="32" y="32">D1 · THE CALL</text>
    <text class="t-q" x="32" y="52">When does GITHUB_REVIEWERS decide who is trusted?</text>
  </g>

  <g id="options">
    <rect class="chosen" x="212" y="76" width="224" height="46" rx="5"/>
    <text class="t-tag c-code" x="228" y="93">CHOSEN</text>
    <text class="t-h c-code" x="228" y="112">Default until first save</text>
    <rect class="lost" x="452" y="76" width="224" height="46" rx="5"/>
    <text class="t-tag c-mute" x="468" y="93">INSTEAD OF</text>
    <text class="t-h c-lost" x="468" y="112">Seed once at first start</text>
    <rect class="lost" x="692" y="76" width="224" height="46" rx="5"/>
    <text class="t-tag c-mute" x="708" y="93">INSTEAD OF</text>
    <text class="t-h c-lost" x="708" y="112">Fall back when empty</text>
  </g>

  <g id="row-decides">
    <rect class="decide" x="16" y="134" width="908" height="62" rx="4"/>
    <rect class="bar" x="16" y="134" width="4" height="62"/>
    <text class="t-lbl" x="32" y="156">OPERATOR EMPTIES</text>
    <text class="t-lbl" x="32" y="169">THE LIST</text>
    <text class="t-tag c-acc" x="32" y="186">▸ DECIDES IT</text>
    <text class="mark plus" x="228" y="162">+</text>
    <text class="t-b" x="248" y="161">Nobody is trusted</text>
    <text class="t-s" x="248" y="179">a saved empty list wins</text>
    <text class="mark plus" x="468" y="162">+</text>
    <text class="t-b" x="488" y="161">Nobody is trusted</text>
    <text class="t-s" x="488" y="179">the seeded row was replaced</text>
    <text class="mark minus" x="708" y="162">−</text>
    <text class="t-b" x="728" y="161">Setting&#x27;s logins return</text>
    <text class="t-s" x="728" y="179">the list can&#x27;t stop steering</text>
  </g>

  <g id="row-2">
    <text class="t-lbl" x="32" y="216">SETTING CHANGED</text>
    <text class="t-lbl" x="32" y="229">AFTER A SAVE</text>
    <text class="mark minus" x="228" y="219">−</text>
    <text class="t-b" x="248" y="218">Ignored, no warning</text>
    <text class="t-s" x="248" y="236">edit the list instead</text>
    <text class="mark minus" x="468" y="219">−</text>
    <text class="t-b" x="488" y="218">Ignored, no warning</text>
    <text class="t-s" x="488" y="236">the same</text>
    <text class="mark plus" x="708" y="219">+</text>
    <text class="t-b" x="728" y="218">Applies when list is empty</text>
    <text class="t-s" x="728" y="236">but only then</text>
    <line class="row" x1="16" y1="250" x2="924" y2="250"/>
  </g>

  <g id="row-3">
    <text class="t-lbl" x="32" y="274">SETTING CHANGED</text>
    <text class="t-lbl" x="32" y="287">BEFORE ANY SAVE</text>
    <text class="mark plus" x="228" y="277">+</text>
    <text class="t-b" x="248" y="276">Applies on next start</text>
    <text class="t-s" x="248" y="294">nothing was written yet</text>
    <text class="mark minus" x="468" y="277">−</text>
    <text class="t-b" x="488" y="276">Ignored</text>
    <text class="t-s" x="488" y="294">the first start wrote it</text>
    <text class="mark plus" x="708" y="277">+</text>
    <text class="t-b" x="728" y="276">Applies on next start</text>
    <text class="t-s" x="728" y="294">the same</text>
    <line class="row" x1="16" y1="308" x2="924" y2="308"/>
  </g>

  <g id="locks-in">
    <rect class="foot" x="16" y="324" width="446" height="74" rx="5"/>
    <text class="t-lbl" x="32" y="345">LOCKS IN</text>
    <text class="t-b" x="32" y="365">The setting is a default, never an override</text>
    <text class="t-s" x="32" y="383">after the first save, only the saved list counts</text>
  </g>
  <g id="flips-if">
    <rect class="foot" x="478" y="324" width="446" height="74" rx="5"/>
    <text class="t-lbl" x="494" y="345">FLIPS IF</text>
    <text class="t-b" x="494" y="365">Operators manage trust only by environment</text>
    <text class="t-s" x="494" y="383">then the setting should win, and the save goes</text>
  </g>
</svg>
