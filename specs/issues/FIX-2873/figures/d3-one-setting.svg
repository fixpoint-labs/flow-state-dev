<svg viewBox="0 0 940 360" role="img" aria-label="D3: the setting&#x27;s name. Chosen: GITHUB_REVIEWERS, beside GITHUB_TOKEN. Instead of: a new prefixed name. Decides it: one GitHub setup an operator learns; chosen pairs with GITHUB_TOKEN, a new name is a prefix nothing else uses. Price: a retired name returns with a narrower meaning. Locks in: a public setting every app reads. Flips if: anyone still runs the pre-FIX-2789 meaning and would be surprised."
     xmlns="http://www.w3.org/2000/svg">
  <style>
    :root { --surface:#FCFCFA; --surface-2:#E8E8E1; --ink:#191C21; --ink-2:#4C535B; --ink-3:#7A828B;
            --rule:#D5D4CB; --accent:#3E4E8C; --accent-soft:#E0E3F0; --code:#2C7C69; --code-soft:#DCEDE7;
            --gone:#A9544F; }
    @media (prefers-color-scheme: dark) {
      :root { --surface:#181C1F; --surface-2:#202528; --ink:#E6E8E5; --ink-2:#A4ACB1; --ink-3:#737B81;
              --rule:#2B3135; --accent:#8B9BD8; --accent-soft:#1B2140; --code:#5DBBA1; --code-soft:#14302A;
              --gone:#DE8A84; } }
    .bg     { fill:var(--surface); }
    .ask    { fill:var(--surface-2); }
    .chosen { fill:var(--code-soft); stroke:var(--code); stroke-width:1.6; }
    .lost   { fill:var(--surface); stroke:var(--rule); stroke-width:1.4; stroke-dasharray:5 4; }
    .decide { fill:var(--accent-soft); }
    .bar    { fill:var(--accent); }
    .row    { stroke:var(--rule); stroke-width:1; }
    .foot   { fill:var(--surface-2); }
    .t-lbl  { fill:var(--ink-3); font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:9.5px; letter-spacing:.1em; }
    .t-tag  { font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:9.5px; letter-spacing:.1em; font-weight:600; }
    .t-q    { fill:var(--ink); font-family:system-ui,-apple-system,sans-serif; font-weight:600; font-size:15px; }
    .t-h    { font-family:system-ui,-apple-system,sans-serif; font-weight:600; font-size:14px; }
    .t-b    { fill:var(--ink); font-family:system-ui,-apple-system,sans-serif; font-size:12.5px; }
    .t-s    { fill:var(--ink-2); font-family:system-ui,-apple-system,sans-serif; font-size:11px; }
    .mark   { font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:16px; font-weight:700; }
    .plus   { fill:var(--code); }
    .minus  { fill:var(--gone); }
    .tie    { fill:var(--ink-3); }
    .c-code { fill:var(--code); }
    .c-mute { fill:var(--ink-3); }
    .c-lost { fill:var(--ink-2); }
    .c-acc  { fill:var(--accent); }
  </style>
  <rect class="bg" x="0" y="0" width="940" height="360"/>

  <g id="the-call">
    <rect class="ask" x="16" y="14" width="908" height="48" rx="6"/>
    <text class="t-lbl" x="32" y="32">D3 · THE CALL</text>
    <text class="t-q" x="32" y="52">What is the one setting called?</text>
  </g>

  <g id="options">
    <rect class="chosen" x="212" y="76" width="348" height="46" rx="5"/>
    <text class="t-tag c-code" x="228" y="93">CHOSEN</text>
    <text class="t-h c-code" x="228" y="112">GITHUB_REVIEWERS</text>
    <rect class="lost" x="576" y="76" width="348" height="46" rx="5"/>
    <text class="t-tag c-mute" x="592" y="93">INSTEAD OF</text>
    <text class="t-h c-lost" x="592" y="112">A new prefixed name</text>
  </g>

  <g id="row-decides">
    <rect class="decide" x="16" y="134" width="908" height="62" rx="4"/>
    <rect class="bar" x="16" y="134" width="4" height="62"/>
    <text class="t-lbl" x="32" y="156">ONE GITHUB SETUP</text>
    <text class="t-lbl" x="32" y="169">TO LEARN</text>
    <text class="t-tag c-acc" x="32" y="186">▸ DECIDES IT</text>
    <text class="mark plus" x="228" y="162">+</text>
    <text class="t-b" x="248" y="161">Pairs with GITHUB_TOKEN</text>
    <text class="t-s" x="248" y="179">both read by workforce&#x27;s operator helpers</text>
    <text class="mark minus" x="592" y="162">−</text>
    <text class="t-b" x="612" y="161">A prefix nothing else uses</text>
    <text class="t-s" x="612" y="179">the token stays GITHUB_TOKEN</text>
  </g>

  <g id="row-2">
    <text class="t-lbl" x="32" y="216">A NAME FIX-2789</text>
    <text class="t-lbl" x="32" y="229">RETIRED</text>
    <text class="mark minus" x="228" y="219">−</text>
    <text class="t-b" x="248" y="218">Returns with a narrower meaning</text>
    <text class="t-s" x="248" y="236">a default now, not the source</text>
    <text class="mark plus" x="592" y="219">+</text>
    <text class="t-b" x="612" y="218">No old meaning to confuse</text>
    <text class="t-s" x="612" y="236">a clean name</text>
    <line class="row" x1="16" y1="250" x2="924" y2="250"/>
  </g>

  <g id="locks-in">
    <rect class="foot" x="16" y="266" width="446" height="74" rx="5"/>
    <text class="t-lbl" x="32" y="287">LOCKS IN</text>
    <text class="t-b" x="32" y="307">A public setting name every app reads</text>
    <text class="t-s" x="32" y="325">renaming it later breaks every operator&#x27;s env</text>
  </g>
  <g id="flips-if">
    <rect class="foot" x="478" y="266" width="446" height="74" rx="5"/>
    <text class="t-lbl" x="494" y="287">FLIPS IF</text>
    <text class="t-b" x="494" y="307">Someone runs the pre-FIX-2789 meaning</text>
    <text class="t-s" x="494" y="325">and would be surprised their logins come back</text>
  </g>
</svg>
