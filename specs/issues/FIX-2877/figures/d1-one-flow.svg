<svg viewBox="0 0 940 420" role="img" aria-label="D1, how Shift Manager&#x27;s coder gets what the shared coder flow lacks. Chosen: three options on the shared flow. Instead of: keeping Shift Manager&#x27;s own coding flow. It comes down to the first row: run settings and PR policy land in the shared flow, so on it Shift Manager gets them once, while a fork needs them built a second time or never gets them. The price is the second row: the harness kit gains three public options, where the fork adds nothing to the kit. The third row is a tie: Shift Manager&#x27;s tasks, checks and judge behave the same. Locks in: three permanent harness-kit options, and Shift Manager&#x27;s runs are coder flow runs. Flips if: a Shift Manager need cannot be an option without the flow reading app knowledge."
     xmlns="http://www.w3.org/2000/svg">
  <style>
    :root { --surface:#FCFCFA; --surface-2:#E8E8E1; --ink:#191C21; --ink-2:#4C535B; --ink-3:#7A828B;
            --rule:#D5D4CB; --accent:#3E4E8C; --accent-soft:#E0E3F0; --code:#2C7C69; --code-soft:#DCEDE7;
            --gone:#A9544F; }
    @media (prefers-color-scheme: dark) {
      :root { --surface:#181C1F; --surface-2:#202528; --ink:#E6E8E5; --ink-2:#A4ACB1; --ink-3:#737B81;
              --rule:#2B3135; --accent:#8B9BD8; --accent-soft:#1B2140; --code:#5DBBA1; --code-soft:#14302A;
              --gone:#DE8A84; } }
    .bg     { fill:var(--surface); }
    .ask    { fill:var(--surface-2); }
    .chosen { fill:var(--code-soft); stroke:var(--code); stroke-width:1.6; }
    .lost   { fill:var(--surface); stroke:var(--rule); stroke-width:1.4; stroke-dasharray:5 4; }
    .decide { fill:var(--accent-soft); }
    .bar    { fill:var(--accent); }
    .row    { stroke:var(--rule); stroke-width:1; }
    .foot   { fill:var(--surface-2); }
    .t-lbl  { fill:var(--ink-3); font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:9.5px; letter-spacing:.1em; }
    .t-tag  { font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:9.5px; letter-spacing:.1em; font-weight:600; }
    .t-q    { fill:var(--ink); font-family:system-ui,-apple-system,sans-serif; font-weight:600; font-size:15px; }
    .t-h    { font-family:system-ui,-apple-system,sans-serif; font-weight:600; font-size:14px; }
    .t-b    { fill:var(--ink); font-family:system-ui,-apple-system,sans-serif; font-size:12.5px; }
    .t-s    { fill:var(--ink-2); font-family:system-ui,-apple-system,sans-serif; font-size:11px; }
    .mark   { font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:16px; font-weight:700; }
    .plus   { fill:var(--code); }
    .minus  { fill:var(--gone); }
    .tie    { fill:var(--ink-3); }
    .c-code { fill:var(--code); }
    .c-mute { fill:var(--ink-3); }
    .c-lost { fill:var(--ink-2); }
    .c-acc  { fill:var(--accent); }
  </style>
  <rect class="bg" x="0" y="0" width="940" height="420"/>
  <g id="the-call">
  <rect class="ask" x="16" y="14" width="908" height="48" rx="6"/>
  <text class="t-lbl" x="32" y="32">D1 · THE CALL</text>
  <text class="t-q" x="32" y="52">How does Shift Manager&#x27;s coder get what the shared flow lacks?</text>
  </g>
  <g id="options">
  <rect class="chosen" x="212" y="76" width="348" height="46" rx="5"/>
  <text class="t-tag c-code" x="228" y="93">CHOSEN</text>
  <text class="t-h c-code" x="228" y="112">Three options on the shared flow</text>
  <rect class="lost" x="576" y="76" width="348" height="46" rx="5"/>
  <text class="t-tag c-mute" x="592" y="93">INSTEAD OF</text>
  <text class="t-h c-lost" x="592" y="112">Keep its own coding flow</text>
  </g>
  <g id="row-0">
  <rect class="decide" x="16" y="134" width="908" height="62" rx="4"/>
  <rect class="bar" x="16" y="134" width="4" height="62"/>
  <text class="t-lbl" x="32" y="156">RUN SETTINGS</text>
  <text class="t-lbl" x="32" y="169">AND PR POLICY</text>
  <text class="t-tag c-acc" x="32" y="186">▸ DECIDES IT</text>
  <text class="mark plus" x="228" y="162">+</text>
  <text class="t-b" x="248" y="161">Arrive once</text>
  <text class="t-s" x="248" y="179">FIX-2878 and FIX-2583 build on this flow</text>
  <text class="mark minus" x="592" y="162">−</text>
  <text class="t-b" x="612" y="161">Built twice, or never</text>
  <text class="t-s" x="612" y="179">the fork gets no option the kit adds</text>
  </g>
  <g id="row-1">
  <text class="t-lbl" x="32" y="222">THE HARNESS KIT</text>
  <text class="mark minus" x="228" y="224">−</text>
  <text class="t-b" x="248" y="223">Three public options</text>
  <text class="t-s" x="248" y="241">phases · approveTools · the app&#x27;s settings</text>
  <text class="mark plus" x="592" y="224">+</text>
  <text class="t-b" x="612" y="223">Nothing added</text>
  <text class="t-s" x="612" y="241">the kit stays as it is</text>
  <line class="row" x1="16" y1="256" x2="924" y2="256"/>
  </g>
  <g id="row-2">
  <text class="t-lbl" x="32" y="280">SHIFT MANAGER&#x27;S</text>
  <text class="t-lbl" x="32" y="293">TASKS</text>
  <text class="mark tie" x="228" y="282">=</text>
  <text class="t-b" x="248" y="281">Behave the same</text>
  <text class="t-s" x="248" y="299">same phases, checks and judge</text>
  <text class="mark tie" x="592" y="282">=</text>
  <text class="t-b" x="612" y="281">Behave the same</text>
  <text class="t-s" x="612" y="299">today&#x27;s flow</text>
  <line class="row" x1="16" y1="314" x2="924" y2="314"/>
  </g>
  <g id="locks-in">
  <rect class="foot" x="16" y="330" width="446" height="74" rx="5"/>
  <text class="t-lbl" x="32" y="351">LOCKS IN</text>
  <text class="t-b" x="32" y="371">Three permanent kit options</text>
  <text class="t-s" x="32" y="389">Shift Manager&#x27;s runs are coder flow runs</text>
  </g>
  <g id="flips-if">
  <rect class="foot" x="478" y="330" width="446" height="74" rx="5"/>
  <text class="t-lbl" x="494" y="351">FLIPS IF</text>
  <text class="t-b" x="494" y="371">A need can&#x27;t be an option</text>
  <text class="t-s" x="494" y="389">then the escape hatch, and a note on the epic</text>
  </g>
  </svg>
