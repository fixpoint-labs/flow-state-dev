<svg viewBox="0 0 940 418" role="img" aria-label="D1, how a schedule says where its fires run. Chosen: a two-value preset, per-fire or per-schedule, with the id derived by the framework and its prefix reserved. Instead of: a sessionId value or function, like a webhook binding. It comes down to who can hold the session first: with a reserved derived id nobody else can create it; with a written id another user can create it first and stop the poll. Price: a schedule can't fire into a session of the author's choosing. Tie: the poll's case works either way. Locks in the option and a reserved prefix. Flips if a schedule must fire into a session the author names"
     xmlns="http://www.w3.org/2000/svg">
  <style>
    :root { --surface:#FCFCFA; --surface-2:#E8E8E1; --ink:#191C21; --ink-2:#4C535B; --ink-3:#7A828B;
            --rule:#D5D4CB; --accent:#3E4E8C; --accent-soft:#E0E3F0; --code:#2C7C69; --code-soft:#DCEDE7;
            --gone:#A9544F; }
    @media (prefers-color-scheme: dark) {
      :root { --surface:#181C1F; --surface-2:#202528; --ink:#E6E8E5; --ink-2:#A4ACB1; --ink-3:#737B81;
              --rule:#2B3135; --accent:#8B9BD8; --accent-soft:#1B2140; --code:#5DBBA1; --code-soft:#14302A;
              --gone:#DE8A84; } }
    .bg     { fill:var(--surface); }
    .ask    { fill:var(--surface-2); }
    .chosen { fill:var(--code-soft); stroke:var(--code); stroke-width:1.6; }
    .lost   { fill:var(--surface); stroke:var(--rule); stroke-width:1.4; stroke-dasharray:5 4; }
    .decide { fill:var(--accent-soft); }
    .bar    { fill:var(--accent); }
    .row    { stroke:var(--rule); stroke-width:1; }
    .foot   { fill:var(--surface-2); }
    .t-lbl  { fill:var(--ink-3); font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:9.5px; letter-spacing:.1em; }
    .t-tag  { font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:9.5px; letter-spacing:.1em; font-weight:600; }
    .t-q    { fill:var(--ink); font-family:system-ui,-apple-system,sans-serif; font-weight:600; font-size:15px; }
    .t-h    { font-family:system-ui,-apple-system,sans-serif; font-weight:600; font-size:14px; }
    .t-b    { fill:var(--ink); font-family:system-ui,-apple-system,sans-serif; font-size:12.5px; }
    .t-s    { fill:var(--ink-2); font-family:system-ui,-apple-system,sans-serif; font-size:11px; }
    .mark   { font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:16px; font-weight:700; }
    .plus   { fill:var(--code); }
    .minus  { fill:var(--gone); }
    .tie    { fill:var(--ink-3); }
    .c-code { fill:var(--code); }
    .c-mute { fill:var(--ink-3); }
    .c-lost { fill:var(--ink-2); }
    .c-acc  { fill:var(--accent); }
  </style>
  <rect class="bg" x="0" y="0" width="940" height="418"/>
  <g id="the-call">
    <rect class="ask" x="16" y="14" width="908" height="48" rx="6"/>
    <text class="t-lbl" x="32" y="32">D1 · THE CALL</text>
    <text class="t-q" x="32" y="52">How does a schedule say where its fires run?</text>
  </g>
  <g id="options">
    <rect class="chosen" x="212" y="76" width="348" height="46" rx="5"/>
    <text class="t-tag c-code" x="228" y="93">CHOSEN</text>
    <text class="t-h c-code" x="228" y="112">per-fire | per-schedule, id reserved</text>
    <rect class="lost" x="576" y="76" width="348" height="46" rx="5"/>
    <text class="t-tag c-mute" x="592" y="93">INSTEAD OF</text>
    <text class="t-h c-lost" x="592" y="112">A sessionId value or function</text>
  </g>
  <g id="row-decides">
    <rect class="decide" x="16" y="134" width="908" height="62" rx="4"/>
    <rect class="bar" x="16" y="134" width="4" height="62"/>
    <text class="t-lbl" x="32" y="156">WHO CAN HOLD</text>
    <text class="t-lbl" x="32" y="169">THE SESSION FIRST</text>
    <text class="t-tag c-acc" x="32" y="186">▸ DECIDES IT</text>
    <text class="mark plus" x="228" y="163">+</text>
    <text class="t-b" x="248" y="162">Only the scheduled dispatch</text>
    <text class="t-s" x="248" y="180">the prefix is refused on every other path</text>
    <text class="mark minus" x="592" y="163">−</text>
    <text class="t-b" x="612" y="162">Any signed-in user</text>
    <text class="t-s" x="612" y="180">who creates it first stops the poll</text>
  </g>
  <g id="row-1">
    <text class="t-lbl" x="32" y="224">A SESSION THE</text>
    <text class="t-lbl" x="32" y="237">AUTHOR NAMES</text>
    <text class="mark minus" x="228" y="227">−</text>
    <text class="t-b" x="248" y="226">Not possible</text>
    <text class="t-s" x="248" y="244">a schedule fires into its own session only</text>
    <text class="mark plus" x="592" y="227">+</text>
    <text class="t-b" x="612" y="226">Possible</text>
    <text class="t-s" x="612" y="244">a second way into a conversation</text>
    <line class="row" x1="16" y1="258" x2="924" y2="258"/>
  </g>
  <g id="row-2">
    <text class="t-lbl" x="32" y="282">THE POLL'S CASE</text>
    <text class="t-lbl" x="32" y="295"></text>
    <text class="mark tie" x="228" y="285">=</text>
    <text class="t-b" x="248" y="284">Works</text>
    <text class="t-s" x="248" y="302">one session per poll</text>
    <text class="mark tie" x="592" y="285">=</text>
    <text class="t-b" x="612" y="284">Works</text>
    <text class="t-s" x="612" y="302">the poll passes its id</text>
    <line class="row" x1="16" y1="316" x2="924" y2="316"/>
  </g>
  <g id="locks-in">
    <rect class="foot" x="16" y="328" width="446" height="74" rx="5"/>
    <text class="t-lbl" x="32" y="349">LOCKS IN</text>
    <text class="t-b" x="32" y="369">A two-value option and a reserved prefix</text>
    <text class="t-s" x="32" y="387">"per-fire" stays the default</text>
  </g>
  <g id="flips-if">
    <rect class="foot" x="478" y="328" width="446" height="74" rx="5"/>
    <text class="t-lbl" x="494" y="349">FLIPS IF</text>
    <text class="t-b" x="494" y="369">A schedule must fire into a session it names</text>
    <text class="t-s" x="494" y="387">the task schedules do that in their handler</text>
  </g>
</svg>
