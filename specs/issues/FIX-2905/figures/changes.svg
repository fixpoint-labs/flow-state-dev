<svg viewBox="0 0 940 560" role="img" aria-label="Left: the worktrees, unchanged: one whose pull request has merged and is already in main, and five in flight. Right: the person's primary checkout on a local-only preview branch, cut from the latest main. Two in-flight branches are merged, each with its checks green at the tip it was read at. Three are left out and named: one conflicts after an earlier branch, one changes the lockfile so an install is owed, and one passes its checks and boots alone but breaks the app when merged with another. A bar says the merged tree must boot on a free port and load, or the preview goes back to its previous tip. A last box says the push guard is a hook, which can be bypassed."
     xmlns="http://www.w3.org/2000/svg">
  <style>
    :root { --surface:#FCFCFA; --surface-2:#E8E8E1; --ink:#191C21; --ink-2:#4C535B; --ink-3:#7A828B;
            --rule:#D5D4CB; --accent:#3E4E8C; --accent-soft:#E0E3F0; --code:#2C7C69; --code-soft:#DCEDE7;
            --gone:#A9544F; --gone-soft:#F3DEDC; }
    @media (prefers-color-scheme: dark) {
      :root { --surface:#181C1F; --surface-2:#202528; --ink:#E6E8E5; --ink-2:#A4ACB1; --ink-3:#737B81;
              --rule:#2B3135; --accent:#8B9BD8; --accent-soft:#1B2140; --code:#5DBBA1; --code-soft:#14302A;
              --gone:#DE8A84; --gone-soft:#3A1F1D; } }
    .bg    { fill:var(--surface); }
    .zone  { fill:var(--surface-2); }
    .box   { fill:var(--surface); stroke:var(--rule); stroke-width:1.3; }
    .live  { fill:var(--surface); stroke:var(--accent); stroke-width:1.5; }
    .dim   { fill:var(--surface); stroke:var(--rule); stroke-width:1.2; stroke-dasharray:5 4; }
    .merge { fill:var(--code-soft); stroke:var(--code); stroke-width:1.4; }
    .out   { fill:var(--gone-soft); stroke:var(--gone); stroke-width:1.4; stroke-dasharray:5 4; }
    .fence { fill:var(--gone-soft); stroke:var(--gone); stroke-width:1.6; }
    .arrow { stroke:var(--code); stroke-width:1.6; fill:none; }
    .arrow-x { stroke:var(--gone); stroke-width:1.6; fill:none; stroke-dasharray:5 4; }
    .t-lbl { fill:var(--ink-3); font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:9.5px; letter-spacing:.1em; }
    .t-h   { fill:var(--ink); font-family:system-ui,-apple-system,sans-serif; font-weight:600; font-size:14px; }
    .t-b   { fill:var(--ink); font-family:system-ui,-apple-system,sans-serif; font-size:12.5px; }
    .t-s   { fill:var(--ink-2); font-family:system-ui,-apple-system,sans-serif; font-size:11px; }
    .t-ok  { fill:var(--code); font-family:system-ui,-apple-system,sans-serif; font-weight:600; font-size:12.5px; }
    .t-bad { fill:var(--gone); font-family:system-ui,-apple-system,sans-serif; font-weight:600; font-size:12.5px; }
  </style>
  <rect class="bg" x="0" y="0" width="940" height="560"/>

  <g id="left-zone">
    <rect class="zone" x="16" y="12" width="330" height="536" rx="8"/>
    <text class="t-lbl" x="32" y="32">THE WORKTREES</text>
    <text class="t-s" x="32" y="48">read as committed tips; none is changed</text>

    <g id="merged-search">
      <rect class="dim" x="32" y="62" width="298" height="52" rx="5"/>
      <text class="t-h" x="46" y="84">feat-search</text>
      <text class="t-s" x="46" y="102">pull request merged · already in main</text>
    </g>
    <g id="live-export">
      <rect class="live" x="32" y="124" width="298" height="52" rx="5"/>
      <text class="t-h" x="46" y="146">feat-export</text>
      <text class="t-s" x="46" y="164">in flight · checks green at its tip</text>
    </g>
    <g id="live-login">
      <rect class="live" x="32" y="186" width="298" height="52" rx="5"/>
      <text class="t-h" x="46" y="208">fix-login</text>
      <text class="t-s" x="46" y="226">in flight · checks green at its tip</text>
    </g>
    <g id="live-docs">
      <rect class="live" x="32" y="248" width="298" height="52" rx="5"/>
      <text class="t-h" x="46" y="270">chore-docs</text>
      <text class="t-s" x="46" y="288">in flight · edits the same file as feat-export</text>
    </g>
    <g id="live-billing">
      <rect class="live" x="32" y="310" width="298" height="52" rx="5"/>
      <text class="t-h" x="46" y="332">feat-billing</text>
      <text class="t-s" x="46" y="350">in flight · changes the lockfile</text>
    </g>
    <g id="live-report">
      <rect class="live" x="32" y="372" width="298" height="52" rx="5"/>
      <text class="t-h" x="46" y="394">feat-report</text>
      <text class="t-s" x="46" y="412">in flight · green, boots alone, breaks with fix-login</text>
    </g>
    <text class="t-s" x="32" y="446">in flight = on a branch, with no merged pull request</text>
    <text class="t-s" x="32" y="464">a branch gets in only past gate 1 (its checks) and</text>
    <text class="t-s" x="32" y="480">gate 2 (the merged app boots)</text>
  </g>

  <g id="arrows">
    <path class="arrow" d="M 332 150 L 452 150"/>
    <path class="arrow" d="M 332 212 L 452 212"/>
    <path class="arrow-x" d="M 332 274 L 452 274"/>
    <path class="arrow-x" d="M 332 336 L 452 336"/>
    <path class="arrow-x" d="M 332 398 L 452 398"/>
  </g>

  <g id="preview-zone">
    <rect class="zone" x="456" y="12" width="468" height="536" rx="8"/>
    <text class="t-lbl" x="472" y="32">YOUR PRIMARY CHECKOUT · ON preview/&lt;user&gt;, NEVER PUSHED</text>
    <text class="t-s" x="472" y="48">rebuilt on request by one tool; your uncommitted edits stay</text>

    <rect class="box" x="472" y="62" width="436" height="52" rx="5"/>
    <text class="t-h" x="486" y="84">Latest main</text>
    <text class="t-s" x="486" y="102">the base every build starts from, which includes feat-search</text>
    <rect class="merge" x="472" y="124" width="436" height="52" rx="5"/>
    <text class="t-ok" x="486" y="146">+ merge feat-export</text>
    <text class="t-s" x="486" y="164">checks green at 3fa9c2, the tip it was read at</text>
    <rect class="merge" x="472" y="186" width="436" height="52" rx="5"/>
    <text class="t-ok" x="486" y="208">+ merge fix-login</text>
    <text class="t-s" x="486" y="226">a merge commit, so each one can be seen apart</text>
    <rect class="out" x="472" y="248" width="436" height="52" rx="5"/>
    <text class="t-bad" x="486" y="270">left out: chore-docs</text>
    <text class="t-s" x="486" y="288">conflicts after feat-export in shared.txt</text>
    <rect class="out" x="472" y="310" width="436" height="52" rx="5"/>
    <text class="t-bad" x="486" y="332">left out: feat-billing</text>
    <text class="t-s" x="486" y="350">changes the lockfile: install owed, not merged</text>
    <rect class="out" x="472" y="372" width="436" height="52" rx="5"/>
    <text class="t-bad" x="486" y="394">left out: feat-report</text>
    <text class="t-s" x="486" y="412">the app stops booting once it joins fix-login</text>
    <rect class="merge" x="472" y="436" width="436" height="48" rx="5"/>
    <text class="t-ok" x="486" y="458">Gate 2 on the merged tree</text>
    <text class="t-s" x="486" y="475">boots on a free port, loads, is stopped; if not, the previous tip</text>

    <rect class="fence" x="472" y="494" width="436" height="42" rx="5"/>
    <text class="t-bad" x="486" y="512">The push guard is a hook</text>
    <text class="t-s" x="486" y="528">refuses the preview by name or tip; --no-verify gets past it</text>
  </g>
</svg>
