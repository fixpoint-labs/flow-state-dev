<svg viewBox="0 0 940 420" role="img" aria-label="Before and after, one row per entry point. Before, an HTTP send with no session id, a webhook with no binding sessionId, a per-fire schedule fire, an MCP call with no session directive and a direct runAction with no sessionId all reach the engine with no session; the request record is written with a null session, and createExecutionContext mints an ephemeral session afterwards. After, the HTTP send and the direct runAction are refused by name, and the webhook route, the scheduled endpoint and the MCP adapter each make a one-off session id with the one helper before dispatch, so every request record names its session from its first write. The late mint is deleted"
     xmlns="http://www.w3.org/2000/svg">
  <style>
    :root { --surface:#FCFCFA; --surface-2:#E8E8E1; --ink:#191C21; --ink-2:#4C535B; --ink-3:#7A828B;
            --rule:#D5D4CB; --accent:#3E4E8C; --accent-soft:#E0E3F0; --code:#2C7C69; --code-soft:#DCEDE7;
            --gone:#A9544F; }
    @media (prefers-color-scheme: dark) {
      :root { --surface:#181C1F; --surface-2:#202528; --ink:#E6E8E5; --ink-2:#A4ACB1; --ink-3:#737B81;
              --rule:#2B3135; --accent:#8B9BD8; --accent-soft:#1B2140; --code:#5DBBA1; --code-soft:#14302A;
              --gone:#DE8A84; } }
    .bg     { fill:var(--surface); }
    .ask    { fill:var(--surface-2); }
    .chosen { fill:var(--code-soft); stroke:var(--code); stroke-width:1.6; }
    .lost   { fill:var(--surface); stroke:var(--rule); stroke-width:1.4; stroke-dasharray:5 4; }
    .decide { fill:var(--accent-soft); }
    .bar    { fill:var(--accent); }
    .row    { stroke:var(--rule); stroke-width:1; }
    .foot   { fill:var(--surface-2); }
    .t-lbl  { fill:var(--ink-3); font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:9.5px; letter-spacing:.1em; }
    .t-tag  { font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:9.5px; letter-spacing:.1em; font-weight:600; }
    .t-q    { fill:var(--ink); font-family:system-ui,-apple-system,sans-serif; font-weight:600; font-size:15px; }
    .t-h    { font-family:system-ui,-apple-system,sans-serif; font-weight:600; font-size:14px; }
    .t-b    { fill:var(--ink); font-family:system-ui,-apple-system,sans-serif; font-size:12.5px; }
    .t-s    { fill:var(--ink-2); font-family:system-ui,-apple-system,sans-serif; font-size:11px; }
    .mark   { font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:16px; font-weight:700; }
    .plus   { fill:var(--code); }
    .minus  { fill:var(--gone); }
    .tie    { fill:var(--ink-3); }
    .c-code { fill:var(--code); }
    .c-mute { fill:var(--ink-3); }
    .c-lost { fill:var(--ink-2); }
    .c-acc  { fill:var(--accent); }
  </style>

  <rect class="bg" x="0" y="0" width="940" height="420"/>
  <rect class="ask" x="16" y="14" width="908" height="48" rx="6"/>
  <text class="t-lbl" x="32" y="32">WHAT CHANGES</text>
  <text class="t-q" x="32" y="52">Every entry point names the session before the request record is written</text>
  <text class="t-tag c-mute" x="300" y="90">TODAY · RECORD WRITTEN WITH NO SESSION</text>
  <text class="t-tag c-code" x="620" y="90">AFTER · RECORD NAMES ITS SESSION</text>
  <text class="t-b" x="32" y="124">HTTP send, no session id</text>
  <rect class="lost" x="292" y="104" width="308" height="32" rx="4"/>
  <text class="t-s" x="304" y="124">runs; the engine mints a one-off</text>
  <rect class="decide" x="612" y="104" width="312" height="32" rx="4"/>
  <text class="t-s" x="624" y="124">refused · session-required · 400</text>
  <text class="t-b" x="32" y="168">Webhook, no binding sessionId</text>
  <rect class="lost" x="292" y="148" width="308" height="32" rx="4"/>
  <text class="t-s" x="304" y="168">runs; the engine mints a one-off</text>
  <rect class="chosen" x="612" y="148" width="312" height="32" rx="4"/>
  <text class="t-s" x="624" y="168">the route makes a one-off, ensures it</text>
  <text class="t-b" x="32" y="212">Schedule fire, per-fire</text>
  <rect class="lost" x="292" y="192" width="308" height="32" rx="4"/>
  <text class="t-s" x="304" y="212">runs; the engine mints a one-off</text>
  <rect class="chosen" x="612" y="192" width="312" height="32" rx="4"/>
  <text class="t-s" x="624" y="212">the endpoint makes a one-off</text>
  <text class="t-b" x="32" y="256">MCP tools/call, no directive</text>
  <rect class="lost" x="292" y="236" width="308" height="32" rx="4"/>
  <text class="t-s" x="304" y="256">runs; the engine mints a one-off</text>
  <rect class="chosen" x="612" y="236" width="312" height="32" rx="4"/>
  <text class="t-s" x="624" y="256">the adapter makes a one-off</text>
  <text class="t-b" x="32" y="300">runAction with no sessionId</text>
  <rect class="lost" x="292" y="280" width="308" height="32" rx="4"/>
  <text class="t-s" x="304" y="300">runs; the engine mints a one-off</text>
  <rect class="decide" x="612" y="280" width="312" height="32" rx="4"/>
  <text class="t-s" x="624" y="300">refused · SessionRequiredError</text>
  <rect class="foot" x="16" y="334" width="446" height="70" rx="5"/>
  <text class="t-lbl" x="32" y="354">REMOVED</text>
  <text class="t-b" x="32" y="374">The late ephemeral_ mint in createExecutionContext</text>
  <text class="t-s" x="32" y="392">no path reaches it without a session id</text>
  <rect class="foot" x="478" y="334" width="446" height="70" rx="5"/>
  <text class="t-lbl" x="494" y="354">KEPT</text>
  <text class="t-b" x="494" y="374">Old rows with no session stay as history</text>
  <text class="t-s" x="494" y="392">readable and stoppable; never resumed or retried</text>
</svg>
