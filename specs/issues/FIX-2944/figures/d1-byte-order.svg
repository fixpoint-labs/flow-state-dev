<svg viewBox="0 0 940 418" role="img" aria-label="D1, how Postgres answers a key range from an index. Chosen: the resource_key column compares in byte order, so the primary key serves the range. Instead of: a second byte-order index. It comes down to every resource write: chosen, one index is updated; instead, two. The price: the migration rebuilds the primary key and locks the table once, where a second index is built concurrently. Sort order: byte order everywhere, matching SQLite, against unchanged in Postgres. Locks in: byte order for every Postgres key sort. Flips if: a deployment can't take the rebuild lock."
     xmlns="http://www.w3.org/2000/svg">
  <style>
    :root { --surface:#FCFCFA; --surface-2:#E8E8E1; --ink:#191C21; --ink-2:#4C535B; --ink-3:#7A828B;
            --rule:#D5D4CB; --accent:#3E4E8C; --accent-soft:#E0E3F0; --code:#2C7C69; --code-soft:#DCEDE7;
            --gone:#A9544F; }
    @media (prefers-color-scheme: dark) {
      :root { --surface:#181C1F; --surface-2:#202528; --ink:#E6E8E5; --ink-2:#A4ACB1; --ink-3:#737B81;
              --rule:#2B3135; --accent:#8B9BD8; --accent-soft:#1B2140; --code:#5DBBA1; --code-soft:#14302A;
              --gone:#DE8A84; } }
    .bg     { fill:var(--surface); }
    .ask    { fill:var(--surface-2); }
    .chosen { fill:var(--code-soft); stroke:var(--code); stroke-width:1.6; }
    .lost   { fill:var(--surface); stroke:var(--rule); stroke-width:1.4; stroke-dasharray:5 4; }
    .decide { fill:var(--accent-soft); }
    .bar    { fill:var(--accent); }
    .row    { stroke:var(--rule); stroke-width:1; }
    .foot   { fill:var(--surface-2); }
    .t-lbl  { fill:var(--ink-3); font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:9.5px; letter-spacing:.1em; }
    .t-tag  { font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:9.5px; letter-spacing:.1em; font-weight:600; }
    .t-q    { fill:var(--ink); font-family:system-ui,-apple-system,sans-serif; font-weight:600; font-size:15px; }
    .t-h    { font-family:system-ui,-apple-system,sans-serif; font-weight:600; font-size:14px; }
    .t-b    { fill:var(--ink); font-family:system-ui,-apple-system,sans-serif; font-size:12.5px; }
    .t-s    { fill:var(--ink-2); font-family:system-ui,-apple-system,sans-serif; font-size:11px; }
    .mark   { font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:16px; font-weight:700; }
    .plus   { fill:var(--code); }
    .minus  { fill:var(--gone); }
    .tie    { fill:var(--ink-3); }
    .c-code { fill:var(--code); }
    .c-mute { fill:var(--ink-3); }
    .c-lost { fill:var(--ink-2); }
    .c-acc  { fill:var(--accent); }
    .rec    { fill:var(--surface); stroke:var(--code); stroke-width:1.6; stroke-dasharray:5 4; }
  </style>
  <rect class="bg" x="0" y="0" width="940" height="418"/>

  <g id="the-call">
    <rect class="ask" x="16" y="14" width="908" height="48" rx="6"/>
    <text class="t-lbl" x="32" y="32">D1 · THE CALL</text>
    <text class="t-q" x="32" y="52">How does Postgres answer a key range from an index?</text>
  </g>

  <g id="options">
    <rect class="chosen" x="212" y="76" width="348" height="46" rx="5"/>
    <text class="t-tag c-code" x="228" y="93">CHOSEN</text>
    <text class="t-h c-code" x="228" y="112">The key column in byte order</text>
    <rect class="lost" x="576" y="76" width="348" height="46" rx="5"/>
    <text class="t-tag c-mute" x="592" y="93">INSTEAD OF</text>
    <text class="t-h c-lost" x="592" y="112">A second byte-order index</text>
  </g>

  <g id="row-decides">
    <rect class="decide" x="16" y="134" width="908" height="62" rx="4"/>
    <rect class="bar" x="16" y="134" width="4" height="62"/>
    <text class="t-lbl" x="32" y="156">EVERY RESOURCE</text>
    <text class="t-lbl" x="32" y="169">WRITE</text>
    <text class="t-tag c-acc" x="32" y="186">▸ DECIDES IT</text>
    <text class="mark plus" x="228" y="162">+</text>
    <text class="t-b" x="248" y="161">Updates one index</text>
    <text class="t-s" x="248" y="179">the primary key serves the range</text>
    <text class="mark minus" x="592" y="162">−</text>
    <text class="t-b" x="612" y="161">Updates two indexes</text>
    <text class="t-s" x="612" y="179">the key and its byte-order copy</text>
  </g>

  <g id="row-2">
    <text class="t-lbl" x="32" y="226">ONE-TIME</text>
    <text class="t-lbl" x="32" y="239">MIGRATION</text>
    <text class="mark minus" x="228" y="228">−</text>
    <text class="t-b" x="248" y="227">Rebuilds the primary key</text>
    <text class="t-s" x="248" y="245">locks the table while it runs</text>
    <text class="mark plus" x="592" y="228">+</text>
    <text class="t-b" x="612" y="227">Builds an index concurrently</text>
    <text class="t-s" x="612" y="245">no lock on writes</text>
    <line class="row" x1="16" y1="254" x2="924" y2="254"/>
  </g>

  <g id="row-3">
    <text class="t-lbl" x="32" y="284">SORT ORDER</text>
    <text class="t-lbl" x="32" y="297">OF KEYS</text>
    <text class="mark plus" x="228" y="286">+</text>
    <text class="t-b" x="248" y="285">Byte order everywhere</text>
    <text class="t-s" x="248" y="303">as SQLite and the file store</text>
    <text class="mark tie" x="592" y="286">=</text>
    <text class="t-b" x="612" y="285">Unchanged in Postgres</text>
    <text class="t-s" x="612" y="303">differs from SQLite</text>
    <line class="row" x1="16" y1="312" x2="924" y2="312"/>
  </g>

  <g id="locks-in">
    <rect class="foot" x="16" y="328" width="446" height="74" rx="5"/>
    <text class="t-lbl" x="32" y="349">LOCKS IN</text>
    <text class="t-b" x="32" y="369">Byte order for every Postgres key sort</text>
    <text class="t-s" x="32" y="387">the primary key is rebuilt once</text>
  </g>

  <g id="flips-if">
    <rect class="foot" x="478" y="328" width="446" height="74" rx="5"/>
    <text class="t-lbl" x="494" y="349">FLIPS IF</text>
    <text class="t-b" x="494" y="369">A deployment can't take the rebuild lock</text>
    <text class="t-s" x="494" y="387">then the second index is built concurrently</text>
  </g>

</svg>
