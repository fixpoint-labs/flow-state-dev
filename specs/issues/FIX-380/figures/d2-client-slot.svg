<svg viewBox="0 0 940 420" role="img" aria-label="D2: where the browser half of Ably lives. Chosen: in the Ably package, handed to createClient by the app, instead of the client loading the Ably SDK itself when the server reports Ably. It comes down to every app&#x27;s bundle: apps without Ably carry no Ably code and no optional import. Price: one line in client setup, and an app that forgets it polls with a warning. Flips if a second managed push service needs the same slot anyway and bundlers resolve optional imports cleanly."
     xmlns="http://www.w3.org/2000/svg">
  <style>
    :root { --surface:#FCFCFA; --surface-2:#E8E8E1; --ink:#191C21; --ink-2:#4C535B; --ink-3:#7A828B;
            --rule:#D5D4CB; --accent:#3E4E8C; --accent-soft:#E0E3F0; --code:#2C7C69; --code-soft:#DCEDE7;
            --gone:#A9544F; }
    @media (prefers-color-scheme: dark) {
      :root { --surface:#181C1F; --surface-2:#202528; --ink:#E6E8E5; --ink-2:#A4ACB1; --ink-3:#737B81;
              --rule:#2B3135; --accent:#8B9BD8; --accent-soft:#1B2140; --code:#5DBBA1; --code-soft:#14302A;
              --gone:#DE8A84; } }
    .bg     { fill:var(--surface); }
    .ask    { fill:var(--surface-2); }
    .chosen { fill:var(--code-soft); stroke:var(--code); stroke-width:1.6; }
    .lost   { fill:var(--surface); stroke:var(--rule); stroke-width:1.4; stroke-dasharray:5 4; }
    .decide { fill:var(--accent-soft); }
    .bar    { fill:var(--accent); }
    .row    { stroke:var(--rule); stroke-width:1; }
    .foot   { fill:var(--surface-2); }
    .t-lbl  { fill:var(--ink-3); font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:9.5px; letter-spacing:.1em; }
    .t-tag  { font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:9.5px; letter-spacing:.1em; font-weight:600; }
    .t-q    { fill:var(--ink); font-family:system-ui,-apple-system,sans-serif; font-weight:600; font-size:15px; }
    .t-h    { font-family:system-ui,-apple-system,sans-serif; font-weight:600; font-size:14px; }
    .t-b    { fill:var(--ink); font-family:system-ui,-apple-system,sans-serif; font-size:12.5px; }
    .t-s    { fill:var(--ink-2); font-family:system-ui,-apple-system,sans-serif; font-size:11px; }
    .mark   { font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:16px; font-weight:700; }
    .plus   { fill:var(--code); }
    .minus  { fill:var(--gone); }
    .tie    { fill:var(--ink-3); }
    .c-code { fill:var(--code); }
    .c-mute { fill:var(--ink-3); }
    .c-lost { fill:var(--ink-2); }
    .c-acc  { fill:var(--accent); }
  </style>
  <rect class="bg" x="0" y="0" width="940" height="420"/>
  <g id="the-call">
    <rect class="ask" x="16" y="14" width="908" height="48" rx="6"/>
    <text class="t-lbl" x="32" y="32">D2 · THE CALL</text>
    <text class="t-q" x="32" y="52">Where does the browser half of Ably live?</text>
  </g>
  <g id="options">
    <rect class="chosen" x="212" y="76" width="348" height="46" rx="5"/>
    <text class="t-tag c-code" x="228" y="93">CHOSEN</text>
    <text class="t-h c-code" x="228" y="112">The app hands ablyPush() to its client</text>
    <rect class="lost" x="576" y="76" width="348" height="46" rx="5"/>
    <text class="t-tag c-mute" x="592" y="93">INSTEAD OF</text>
    <text class="t-h c-lost" x="592" y="112">The client loads Ably when told to</text>
  </g>
  <g id="row-1">
    <rect class="decide" x="16" y="134" width="908" height="62" rx="4"/>
    <rect class="bar" x="16" y="134" width="4" height="62"/>
    <text class="t-lbl" x="32" y="156">AN APP</text>
    <text class="t-lbl" x="32" y="169">WITHOUT ABLY</text>
    <text class="t-tag c-acc" x="32" y="186">▸ DECIDES IT</text>
    <text class="mark plus" x="228" y="163">+</text>
    <text class="t-b" x="248" y="162">Ships no Ably code</text>
    <text class="t-s" x="248" y="180">the client keeps zero vendor deps</text>
    <text class="mark minus" x="592" y="163">−</text>
    <text class="t-b" x="612" y="162">Carries an optional import</text>
    <text class="t-s" x="612" y="180">every bundler resolves it, or fails</text>
  </g>
  <g id="row-2">
    <text class="t-lbl" x="32" y="216">AN APP</text>
    <text class="t-lbl" x="32" y="229">WITH ABLY</text>
    <text class="mark minus" x="228" y="219">−</text>
    <text class="t-b" x="248" y="218">One more line in client setup</text>
    <text class="t-s" x="248" y="236">forgot it: polls, warns once</text>
    <text class="mark plus" x="592" y="219">+</text>
    <text class="t-b" x="612" y="218">Nothing to add</text>
    <text class="t-s" x="612" y="236">the server&#x27;s answer is enough</text>
    <line class="row" x1="16" y1="254" x2="924" y2="254"/>
  </g>
  <g id="row-3">
    <text class="t-lbl" x="32" y="274">A SECOND</text>
    <text class="t-lbl" x="32" y="287">SERVICE</text>
    <text class="mark plus" x="228" y="277">+</text>
    <text class="t-b" x="248" y="276">Another package, same slot</text>
    <text class="t-s" x="248" y="294">the client never changes</text>
    <text class="mark minus" x="592" y="277">−</text>
    <text class="t-b" x="612" y="276">The client learns each vendor</text>
    <text class="t-s" x="612" y="294">vendor churn in a core package</text>
    <line class="row" x1="16" y1="312" x2="924" y2="312"/>
  </g>
  <g id="locks-in">
    <rect class="foot" x="16" y="330" width="446" height="74" rx="5"/>
    <text class="t-lbl" x="32" y="351">LOCKS IN</text>
    <text class="t-b" x="32" y="371">A push option on createClient</text>
    <text class="t-s" x="32" y="389">and the @flow-state-dev/ably/client entry</text>
  </g>
  <g id="flips-if">
    <rect class="foot" x="478" y="330" width="446" height="74" rx="5"/>
    <text class="t-lbl" x="494" y="351">FLIPS IF</text>
    <text class="t-b" x="494" y="371">Bundlers handle optional imports cleanly</text>
    <text class="t-s" x="494" y="389">and the client ships more than one vendor anyway</text>
  </g>
</svg>
