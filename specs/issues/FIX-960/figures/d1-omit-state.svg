<svg viewBox="0 0 940 400" role="img" aria-label="D1, how a request-backed collection is written after the fold. Chosen: leave state out. Instead of: pass ctx.request as the state. It comes down to the first row: omitting state keeps both default slots exactly with no check on what was passed, while passing a handle means telling the request apart from any other value and picking the slot from that. Second row: the chosen option also admits nothing new, while a handle type accepts session, user and org state too. Third row, the price: one implicit default a reader must learn, against a call site that names the request. Locks in: the omitted form, which a later removal would break. Flips if: readers misread the omitted form as no state."
     xmlns="http://www.w3.org/2000/svg">
  <style>
    :root { --surface:#FCFCFA; --surface-2:#E8E8E1; --ink:#191C21; --ink-2:#4C535B; --ink-3:#7A828B;
            --rule:#D5D4CB; --accent:#3E4E8C; --accent-soft:#E0E3F0; --code:#2C7C69; --code-soft:#DCEDE7;
            --gone:#A9544F; }
    @media (prefers-color-scheme: dark) {
      :root { --surface:#181C1F; --surface-2:#202528; --ink:#E6E8E5; --ink-2:#A4ACB1; --ink-3:#737B81;
              --rule:#2B3135; --accent:#8B9BD8; --accent-soft:#1B2140; --code:#5DBBA1; --code-soft:#14302A;
              --gone:#DE8A84; } }
    .bg     { fill:var(--surface); }
    .ask    { fill:var(--surface-2); }
    .chosen { fill:var(--code-soft); stroke:var(--code); stroke-width:1.6; }
    .lost   { fill:var(--surface); stroke:var(--rule); stroke-width:1.4; stroke-dasharray:5 4; }
    .decide { fill:var(--accent-soft); }
    .bar    { fill:var(--accent); }
    .row    { stroke:var(--rule); stroke-width:1; }
    .foot   { fill:var(--surface-2); }
    .t-lbl  { fill:var(--ink-3); font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:9.5px; letter-spacing:.1em; }
    .t-tag  { font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:9.5px; letter-spacing:.1em; font-weight:600; }
    .t-q    { fill:var(--ink); font-family:system-ui,-apple-system,sans-serif; font-weight:600; font-size:15px; }
    .t-h    { font-family:system-ui,-apple-system,sans-serif; font-weight:600; font-size:13px; }
    .t-b    { fill:var(--ink); font-family:system-ui,-apple-system,sans-serif; font-size:12px; }
    .t-s    { fill:var(--ink-2); font-family:system-ui,-apple-system,sans-serif; font-size:10.5px; }
    .mark   { font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:16px; font-weight:700; }
    .plus   { fill:var(--code); }
    .minus  { fill:var(--gone); }
    .c-code { fill:var(--code); }
    .c-mute { fill:var(--ink-3); }
    .c-lost { fill:var(--ink-2); }
    .c-acc  { fill:var(--accent); }
  </style>
  <rect class="bg" x="0" y="0" width="940" height="400"/>

  <g id="the-call">
    <rect class="ask" x="16" y="14" width="908" height="48" rx="6"/>
    <text class="t-lbl" x="32" y="32">D1 · THE CALL</text>
    <text class="t-q" x="32" y="52">After the fold, how does a caller say "keep the tasks on the request"?</text>
  </g>

  <g id="options">
    <rect class="chosen" x="212" y="76" width="340" height="46" rx="5"/>
    <text class="t-tag c-code" x="226" y="93">CHOSEN</text>
    <text class="t-h c-code" x="226" y="112">Leave state out</text>
    <rect class="lost" x="568" y="76" width="356" height="46" rx="5"/>
    <text class="t-tag c-mute" x="582" y="93">INSTEAD OF</text>
    <text class="t-h c-lost" x="582" y="112">Pass state: ctx.request</text>
  </g>

  <g id="row-decides">
    <rect class="decide" x="16" y="134" width="908" height="62" rx="4"/>
    <rect class="bar" x="16" y="134" width="4" height="62"/>
    <text class="t-lbl" x="32" y="156">STORED TASKS</text>
    <text class="t-lbl" x="32" y="169">STAY PUT</text>
    <text class="t-tag c-acc" x="32" y="186">▸ DECIDES IT</text>
    <text class="mark plus" x="226" y="162">+</text>
    <text class="t-b" x="244" y="161">Both default slots kept exactly</text>
    <text class="t-s" x="244" y="179">keyed on whether state is present</text>
    <text class="mark minus" x="582" y="162">−</text>
    <text class="t-b" x="600" y="161">Slot depends on what was passed</text>
    <text class="t-s" x="600" y="179">the factory must tell the request apart</text>
  </g>

  <g id="row-scope">
    <text class="t-lbl" x="32" y="222">WHAT IT ADMITS</text>
    <text class="mark plus" x="226" y="224">+</text>
    <text class="t-b" x="244" y="223">Nothing new</text>
    <text class="t-s" x="244" y="241">the same two places as today</text>
    <text class="mark minus" x="582" y="224">−</text>
    <text class="t-b" x="600" y="223">Session, user and org state too</text>
    <text class="t-s" x="600" y="241">every scope handle has the same shape</text>
    <line class="row" x1="16" y1="256" x2="924" y2="256"/>
  </g>

  <g id="row-read">
    <text class="t-lbl" x="32" y="280">AT THE CALL SITE</text>
    <text class="mark minus" x="226" y="282">−</text>
    <text class="t-b" x="244" y="281">One default to learn</text>
    <text class="t-s" x="244" y="299">no state means the request</text>
    <text class="mark plus" x="582" y="282">+</text>
    <text class="t-b" x="600" y="281">Names the request</text>
    <text class="t-s" x="600" y="299">reads without the docs</text>
    <line class="row" x1="16" y1="314" x2="924" y2="314"/>
  </g>

  <g id="locks-in">
    <rect class="foot" x="16" y="326" width="446" height="62" rx="5"/>
    <text class="t-lbl" x="32" y="346">LOCKS IN</text>
    <text class="t-b" x="32" y="364">The omitted form, in every request-backed call</text>
    <text class="t-s" x="32" y="380">adding ctx.request later is additive; removing this is not</text>
  </g>

  <g id="flips-if">
    <rect class="foot" x="478" y="326" width="446" height="62" rx="5"/>
    <text class="t-lbl" x="494" y="346">FLIPS IF</text>
    <text class="t-b" x="494" y="364">Readers misread "no state" as no storage</text>
    <text class="t-s" x="494" y="380">then accept ctx.request, restricted to the request handle</text>
  </g>
</svg>
